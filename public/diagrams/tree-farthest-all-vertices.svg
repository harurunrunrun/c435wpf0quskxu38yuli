<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-farthest-all-vertices flow-desc-tree-farthest-all-vertices" width="1112" height="1654" viewBox="0 0 1112 1654" data-flow-svg="tree-farthest-all-vertices"><title id="flow-title-tree-farthest-all-vertices">直径の両端への距離から、各頂点の最遠距離を求めるの解法フローチャート</title><desc id="flow-desc-tree-farthest-all-vertices">非負辺の木で、全頂点を対象にした最遠距離を求めます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-farthest-all-vertices" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge farthest-all" data-edge="model:farthest-all:goal"><title>全頂点を候補にした、最遠の距離</title><path d="M644.125 159 V171 C644.125 203 402.5 203 402.5 235 V247"/><path d="M402.5 285 V297 C402.5 329 702.556 329 702.556 361 V373" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="model:farthest-all:goal" tabindex="0" role="group" aria-label="選択肢：全頂点を候補にした、最遠の距離"><rect x="293" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="402.5" y="270">全頂点を候補にした、最遠の距離</text></g></g><g class="flow-edge nearest-marked" data-edge="model:nearest-marked:fallback"><title>印の付いた頂点への最短距離</title><path d="M708.125 159 V171 C708.125 203 652.5 203 652.5 235 V247"/><path d="M652.5 285 V297 C652.5 329 962 329 962 361 V373 V535 C962 567 962 567 962 599 V611 V661 C962 693 962 693 962 725 V737 V917 C962 949 962 949 962 981 V993 V1043 C962 1075 588 1075 588 1107 V1119" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="model:nearest-marked:fallback" tabindex="0" role="group" aria-label="選択肢：印の付いた頂点への最短距離"><rect x="556" y="247" width="193" height="38" rx="5"/><text text-anchor="middle" x="652.5" y="270">印の付いた頂点への最短距離</text></g></g><g class="flow-edge distance-sum" data-edge="model:distance-sum:fallback"><title>全頂点への距離