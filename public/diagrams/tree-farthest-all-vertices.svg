24 1107 V1119" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="goal:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="699" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="739" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M782.556 523 V535 C782.556 567 867.5 567 867.5 599 V611"/><path d="M867.5 649 V661 C867.5 693 906 693 906 725 V737 V917 C906 949 906 949 906 981 V993 V1043 C906 1075 920 1075 920 1107 V1119" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="823" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="867.5" y="634">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M421.167 905 V917 C421.167 949 192 949 192 981 V993"/><path d="M192 1031 V1043 C192 1075 192 1075 192 1107 V1119" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1016">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M501.167 905 V917 C501.167 949 556 949 556 981 V993"/><path d="M556 1031 V1043 C556 1075 460 1075 460 1107 V1119" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1016">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M581.167 905 V917 C581.167 949 755.5 949 755.5 981 V993"/><path d="M755.5 1031 V1043 C755.5 1075 840 1075 840 1107 V1119" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="993" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1016">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1269 V1299 C840 1331 783 1331 783 1363 V1375"/><path d="M783 1413 V1425 C783 1457 828.5 1457 828.5 1489 V1501" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1375" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1398">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1269 V1299 C920 1331 907 1331 907 1363 V1375"/><path d="M907 1413 V1425 C907 1457 908.5 1457 908.5 1489 V1501" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1375" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1398">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1269 V1299 C1000 1331 1035.5 1331 1035.5 1363 V1375"/><path d="M1035.5 1413 V1425 C1035.5 1457 988.5 1457 988.5 1489 V1501" marker-end="url(#arrow-tree-farthest-all-vertices)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1375" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1398">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="580.125" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="596.125" y="52">質問</text><text class="node-title" x="596.125" y="80">各頂点から何を求めますか？</text><text class="node-explanation" x="596.125" y="107">非負辺の木で、全頂点を対象にした最遠距離を求めま</text><text class="node-explanation" x="596.125" y="125">す。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="558.5555555555557" y="393">質問</text><text class="node-title" x="558.5555555555557" y="421">固定された無向木で、辺の長さは全て</text><text class="node-title" x="558.5555555555557" y="444">非負ですか？</text><text class="node-explanation" x="558.5555555555557" y="471">負の辺を許す場合、最遠頂点を二回探す方法や直径端</text><text class="node-explanation" x="558.5555555555557" y="489">の性質をそのまま使いません。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="737" width="320" height="168" rx="7"/><text class="node-kind" x="357.1666666666667" y="757">質問</text><text class="node-title" x="357.1666666666667" y="785">行先ごとの追加得点や、禁止する行先</text><text class="node-title" x="357.1666666666667" y="808">の条件はありませんか？</text><text class="node-explanation" x="357.1666666666667" y="835">直径の両端を a,b とすると、v の最遠距離は</text><text class="node-explanation" x="357.1666666666667" y="853"> max(dist(v,a),dist(v,</text><text class="node-explanation" x="357.1666666666667" y="871">b)) です。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1119" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1139">候補</text><text class="node-title" x="48" y="1167">直径の両端への距離から、各頂点の最</text><text class="node-title" x="48" y="1190">遠距離を求める</text><a href="/flowchartcp/techniques/tree-eccentricity-diameter-endpoints/"><title>木の各頂点からの最遠距離は、直径の両端への距離だけで求めるの記事へ</title><text x="48" y="1229">木の各頂点からの最遠距離は、直径の両端への距離</text><text x="48" y="1247">だけで求める</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1119" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1139">候補</text><text class="node-title" x="412" y="1167">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1206">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1230">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1119" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1139">質問</text><text class="node-title" x="776" y="1167">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1190">書き出せますか？</text><text class="node-explanation" x="776" y="1217">非負辺の木で、全頂点を対象にした最遠距離を求めま</text><text class="node-explanation" x="776" y="1235">す。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1501" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1521">分野</text><text class="node-title" x="764.5" y="1549">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1586">詳細の質問・図へ →</text></a></g></svg>