148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="operation:yes:goal"><title>はい</title><path d="M539.722 205 V217 C539.722 249 420.667 249 420.667 281 V293"/><path d="M420.667 331 V343 C420.667 375 420.667 375 420.667 407 V419" marker-end="url(#arrow-circular-ramp-to-zero)"/><g class="flow-edge-label" data-edge-label="operation:yes:goal" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="316">はい</text></g></g><g class="flow-edge no" data-edge="operation:no:fallback"><title>いいえ</title><path d="M619.722 205 V217 C619.722 249 655 249 655 281 V293"/><path d="M655 331 V343 C655 375 762.5 375 762.5 407 V419 V581 C762.5 613 762.5 613 762.5 645 V657 V707 C762.5 739 458 739 458 771 V783 V963 C458 995 360 995 360 1027 V1039 V1089 C360 1121 304 1121 304 1153 V1165" marker-end="url(#arrow-circular-ramp-to-zero)"/><g class="flow-edge-label" data-edge-label="operation:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="operation:unknown:check"><title>わからない</title><path d="M699.722 205 V217 C699.722 249 783.5 249 783.5 281 V293"/><path d="M783.5 331 V343 C783.5 375 818.5 375 818.5 407 V419 V