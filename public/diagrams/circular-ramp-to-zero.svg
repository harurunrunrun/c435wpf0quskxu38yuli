077 V1089 C450 1121 384 1121 384 1153 V1165" marker-end="url(#arrow-circular-ramp-to-zero)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 915 V963 C668 995 655 995 655 1027 V1039"/><path d="M655 1077 V1089 C655 1121 614.667 1121 614.667 1153 V1165" marker-end="url(#arrow-circular-ramp-to-zero)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 915 V963 C748 995 783.5 995 783.5 1027 V1039"/><path d="M783.5 1077 V1089 C783.5 1121 721.333 1121 721.333 1153 V1165" marker-end="url(#arrow-circular-ramp-to-zero)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="operation"><rect x="459.7222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">環の全 N 位置から、回転した </text><text class="node-title" x="475.7222222222223" y="103">1,2,…,N を引く操作を自由に</text><text class="node-title" x="475.7222222222223" y="126">選べますか？</text><text class="node-explanation" x="475.7222222222223" y="153">選択箱 i 自身から N、次の箱から 1 を引く</text><text class="node-explanation" x="475.7222222222223" y="171">添字で考えます。各位置の値は非負です。</text></g><g class="flow-node question" data-node="goal"><rect x="260.6666666666667" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="439">質問</text><text class="node-title" x="276.6666666666667" y="467">途中で負にせず、全て 0 にできる</text><text class="node-title" x="276.6666666666667" y="490">かを判定しますか？</text><text class="node-explanation" x="276.6666666666667" y="517">任意の部分区間だけ減らす操作や、別の減少ベクトル</text><text class="node-explanation" x="276.6666666666667" y="535">とは分けます。</text></g><g class="flow-node result" data-node="ramp-result"><rect x="32" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">総回数と循環差分から、各開始点の非</text><text class="node-title" x="48" y="854">負整数回数を調べる</text><a href="/flowchartcp/techniques/circular-ramp-removal-counts/"><title>環に1からNを引く操作は、総和と隣接差分から各開始点の回数を復元するの記事へ</title><text x="48" y="893">環に1からNを引く操作は、総和と隣接差分から各</text><text x="48" y="911">開始点の回数を復元する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="783" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="803">質問</text><text class="node-title" x="524" y="831">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="854">確認できますか？</text><text class="node-explanation" x="524" y="881">操作の条件と、求める個数・値・順序を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1165" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1185">候補</text><text class="node-title" x="160" y="1213">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1252">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1276">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1185">分野</text><text class="node-title" x="524" y="1213">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1250">詳細の質問・図へ →</text></a></g></svg>