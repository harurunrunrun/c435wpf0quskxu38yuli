sult rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="distinct:yes:eertree"><title>異なる回文を一つずつ管理する</title><path d="M349.667 182 V194 C349.667 226 135 226 135 258 V270"/><path d="M135 308 V320 C135 352 38 352 38 384 V396 V558 C38 590 38 590 38 622 V634 V684 C38 716 38 716 38 748 V760 V922 C38 954 221 954 221 986 V998 V1048 C221 1080 141 1080 141 1112 V1124" marker-end="url(#arrow-string-palindrome-type-growth)"/><g class="flow-edge-label" data-edge-label="distinct:yes:eertree" tabindex="0" role="group" aria-label="選択肢：異なる回文を一つずつ管理する"><rect x="32" y="270" width="206" height="38" rx="5"/><text text-anchor="middle" x="135" y="293">異なる回文を一つずつ管理する</text></g></g><g class="flow-edge no" data-edge="distinct:no:append"><title>末尾追加・区間判定を詳しく選ぶ</title><path d="M429.667 182 V194 C429.667 226 391.5 226 391.5 258 V270"/><path d="M391.5 308 V320 C391.5 352 366.667 352 366.667 384 V396" marker-end="url(#arrow-string-palindrome-type-growth)"/><g class="flow-edge-label" data-edge-label="distinct:no:append" tabindex="0" role="group" aria-label="選択肢：末尾追加・区間判定を詳しく選ぶ"><rect x="282" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="391.5" y="293">末尾追加・区間判定を詳しく選ぶ</text></g></g><g class="flow-edge unknown" data-edge="distinct:unknown:check"><title>わからない</title><path d="M509.667 182 V194 C509.667 226 762.5 2