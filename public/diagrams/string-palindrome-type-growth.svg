check:yes:eertree"><title>はい</title><path d="M588 910 V922 C588 954 367 954 367 986 V998"/><path d="M367 1036 V1048 C367 1080 301 1080 301 1112 V1124" marker-end="url(#arrow-string-palindrome-type-growth)"/><g class="flow-edge-label" data-edge-label="check:yes:eertree" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="327" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="367" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 910 V922 C668 954 655 954 655 986 V998"/><path d="M655 1036 V1048 C655 1080 614.667 1080 614.667 1112 V1124" marker-end="url(#arrow-string-palindrome-type-growth)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 910 V922 C748 954 783.5 954 783.5 986 V998"/><path d="M783.5 1036 V1048 C783.5 1080 721.333 1080 721.333 1112 V1124" marker-end="url(#arrow-string-palindrome-type-growth)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1021">わからない</text></g></g><g class="flow-node question" data-node="distinct"><rect x="269.6666666666667" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="285.6666666666667" y="52">質問</text><text class="node-title" x="285.6666666666667" y="80">回文の種類と、末尾への追加のどちら</text><text class="node-title" x="285.6666666666667" y="103">を扱いますか？</text><text class="node-explanation" x="285.6666666666667" y="130">同じ回文の文字列を一種類とする管理と、末尾追加や</text><text class="node-explanation" x="285.6666666666667" y="148">区間判定を区別します。</text></g><g class="flow-node question" data-node="append"><rect x="206.66666666666669" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="222.66666666666669" y="416">質問</text><text class="node-title" x="222.66666666666669" y="444">文字を末尾に追加し、回文である接尾</text><text class="node-title" x="222.66666666666669" y="467">辞を更新しますか？</text><text class="node-explanation" x="222.66666666666669" y="494">最長の回文接尾辞から、さらに短い回文接尾辞へたど</text><text class="node-explanation" x="222.66666666666669" y="512">ります。</text></g><g class="flow-node route" data-node="queries"><rect x="144" y="760" width="320" height="121" rx="7"/><text class="node-kind" x="160" y="780">分野</text><text class="node-title" x="160" y="808">回文区間の判定と文字変更の条件</text><a href="/flowchartcp/flowcharts/#diagram-string-palindrome-query-details" data-route="string-palindrome-query-details"><text x="160" y="845">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="780">質問</text><text class="node-title" x="524" y="808">区別したい対象は、回文の文字列の種</text><text class="node-title" x="524" y="831">類ですか？</text><text class="node-explanation" x="524" y="858">種類と出現回数を混同せず、回文木で何を集計するか</text><text class="node-explanation" x="524" y="876">を決めます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1124" width="320" height="139" rx="7"/><text class="node-kind" x="524" y="1144">分野</text><text class="node-title" x="524" y="1172">条件を確かめる</text><text class="node-explanation" x="524" y="1199">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1227">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="eertree"><rect x="61" y="1124" width="320" height="127" rx="7"/><text class="node-kind" x="77" y="1144">候補</text><text class="node-title" x="77" y="1172">回文木</text><a href="/flowchartcp/techniques/palindromic-tree/"><title>回文木の記事へ</title><text x="77" y="1211">回文木</text></a></g></svg>