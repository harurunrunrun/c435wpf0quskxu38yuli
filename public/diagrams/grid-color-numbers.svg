<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-grid-color-numbers flow-desc-grid-color-numbers" width="3352" height="938" viewBox="0 0 3352 938" data-flow-svg="grid-color-numbers"><title id="flow-title-grid-color-numbers">格子の色・数・外接長方形の解法フローチャート</title><desc id="flow-desc-grid-color-numbers">格子に置く色・数の制約と、選んだマスの外接長方形を扱います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-grid-color-numbers" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge other" data-edge="goal:other:fallback"><title>その他の格子の配置・被覆</title><path d="M1433.491 159 V171 C1433.491 203 122 203 122 235 V247"/><path d="M122 285 V315 C122 347 38 347 38 379 V391 V553 C38 585 1530.5 585 1530.5 617 V629 V679 C1530.5 711 1477.167 711 1477.167 743 V755" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:other:fallback" tabindex="0" role="group" aria-label="選択肢：その他の格子の配置・被覆"><rect x="32" y="247" width="180" height="38" rx="5"/><text text-anchor="middle" x="122" y="270">その他の格子の配置・被覆</text></g></g><g class="flow-edge color-separation" data-edge="goal:color-separation:grid-colors-route"><title>二色のマスが同じ行・列を使わない配置の個数</title><path d="M1462.582 159 V171 C1462.582 203 378.5 203 378.5 235 V247"/><path d="M378.5 303 V315 C378.5 347 248 347 248 379 V391" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:color-separation:grid-colors-route" tabindex="0" role="group" aria-label="選択肢：二色のマスが同じ行・列を使わない配置の個数"><rect x="256" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="378.5" y="270">二色のマスが同じ行・列を使わない配</text><text text-anchor="middle" x="378.5" y="288">置の個数</text></g></g><g class="flow-edge bounding-area" data-edge="goal:bounding-area:bounding-box-route"><title>一様に選んだ K マスの、外接長方形の期待面積</title><path d="M1491.673 159 V171 C1491.673 203 667.5 203 667.5 235 V247"/><path d="M667.5 303 V315 C667.5 347 612 347 612 379 V391" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:bounding-area:bounding-box-route" tabindex="0" role="group" aria-label="選択肢：一様に選んだ K マスの、外接長方形の期待面積"><rect x="545" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="667.5" y="270">一様に選んだ K マスの、外接長方</text><text text-anchor="middle" x="667.5" y="288">形の期待面積</text></g></g><g class="flow-edge neighbor-modulo" data-edge="goal:neighbor-modulo:neighbor-modulo-route"><title>異なる正整数を置き、隣接する大きい値÷小さい値の余りをそろえる</title><path d="M1520.764 159 V171 C1520.764 203 976 203 976 235 V247"/><path d="M976 303 V315 C976 347 976 347 976 379 V391" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:neighbor-modulo:neighbor-modulo-route" tabindex="0" role="group" aria-label="選択肢：異なる正整数を置き、隣接する大きい値÷小さい値の余りをそろえる"><rect x="853.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="976" y="270">異なる正整数を置き、隣接する大きい</text><text text-anchor="middle" x="976" y="288">値÷小さい値の余りをそろえる</text></g></g><g class="flow-edge height-silhouette" data-edge="goal:height-silhouette:height-silhouette-route"><title>各行・各列の最大高さと、各マスが空かを保って残す総量を最小にする</title><path d="M1549.855 159 V171 C1549.855 203 1340 203 1340 235 V247"/><path d="M1340 303 V315 C1340 347 1340 347 1340 379 V391" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:height-silhouette:height-silhouette-route" tabindex="0" role="group" aria-label="選択肢：各行・各列の最大高さと、各マスが空かを保って残す総量を最小にする"><rect x="1217.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1340" y="270">各行・各列の最大高さと、各マスが空</text><text text-anchor="middle" x="1340" y="288">かを保って残す総量を最小にする</text></g></g><g class="flow-edge rectangle-components" data-edge="goal:rectangle-components:rectangle-components-route"><title>固定された色の格子で、各部分長方形の中だけの同色成分数を求める</title><path d="M1578.945 159 V171 C1578.945 203 1704 203 1704 235 V247"/><path d="M1704 303 V315 C1704 347 1704 347 1704 379 V391" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:rectangle-components:rectangle-components-route" tabindex="0" role="group" aria-label="選択肢：固定された色の格子で、各部分長方形の中だけの同色成分数を求める"><rect x="1581.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1704" y="270">固定された色の格子で、各部分長方形</text><text text-anchor="middle" x="1704" y="288">の中だけの同色成分数を求める</text></g></g><g class="flow-edge xor-predecessor" data-edge="goal:xor-predecessor:xor-predecessor-route"><title>3×3のXOR更新と一セルの誤りから、最小の初期図形を逆算する</title><path d="M1608.036 159 V171 C1608.036 203 2068 203 2068 235 V247"/><path d="M2068 303 V315 C2068 347 2068 347 2068 379 V391" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:xor-predecessor:xor-predecessor-route" tabindex="0" role="group" aria-label="選択肢：3×3のXOR更新と一セルの誤りから、最小の初期図形を逆算する"><rect x="1945.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="2068" y="270">3×3のXOR更新と一セルの誤りか</text><text text-anchor="middle" x="2068" y="288">ら、最小の初期図形を逆算する</text></g></g><g class="flow-edge prefix-rectangles" data-edge="goal:prefix-rectangles:prefix-rectangles-route"><title>二番号を交換するたび、番号順に選んだマスが長方形になる段階を数える</title><path d="M1637.127 159 V171 C1637.127 203 2432 203 2432 235 V247"/><path d="M2432 303 V315 C2432 347 2432 347 2432 379 V391" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:prefix-rectangles:prefix-rectangles-route" tabindex="0" role="group" aria-label="選択肢：二番号を交換するたび、番号順に選んだマスが長方形になる段階を数える"><rect x="2309.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="2432" y="270">二番号を交換するたび、番号順に選ん</text><text text-anchor="middle" x="2432" y="288">だマスが長方形になる段階を数える</text></g></g><g class="flow-edge convex-subsets" data-edge="goal:convex-subsets:convex-subsets-route"><title>行と列が途切れない、連結なマスの選び方を数える</title><path d="M1666.218 159 V171 C1666.218 203 2796 203 2796 235 V247"/><path d="M2796 303 V315 C2796 347 2796 347 2796 379 V391" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:convex-subsets:convex-subsets-route" tabindex="0" role="group" aria-label="選択肢：行と列が途切れない、連結なマスの選び方を数える"><rect x="2673.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="2796" y="270">行と列が途切れない、連結なマスの選</text><text text-anchor="middle" x="2796" y="288">び方を数える</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M1695.309 159 V171 C1695.309 203 3160 203 3160 235 V247"/><path d="M3160 285 V315 C3160 347 3160 347 3160 379 V391" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="3115.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="3160" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M3080 541 V553 C3080 585 1620.5 585 1620.5 617 V629"/><path d="M1620.5 667 V679 C1620.5 711 1583.833 711 1583.833 743 V755" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1580.5" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1620.5" y="652">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M3160 541 V553 C3160 585 3147 585 3147 617 V629"/><path d="M3147 667 V679 C3147 711 3106.667 711 3106.667 743 V755" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="3107" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="3147" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M3240 541 V553 C3240 585 3275.5 585 3275.5 617 V629"/><path d="M3275.5 667 V679 C3275.5 711 3213.333 711 3213.333 743 V755" marker-end="url(#arrow-grid-color-numbers)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="3231" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="3275.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="1404.4" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1420.4" y="52">質問</text><text class="node-title" x="1420.4" y="80">格子で何を求めますか？</text><text class="node-explanation" x="1420.4" y="107">置く対象の大きさ、全てのマスを覆う必要、移動方向</text><text class="node-explanation" x="1420.4" y="125">と経路の条件を選びます。</text></g><g class="flow-node question" data-node="check"><rect x="3000" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="3016" y="411">質問</text><text class="node-title" x="3016" y="439">合法な選択と、選ぶ回数・費用の条件</text><text class="node-title" x="3016" y="462">を一つずつ確かめられますか？</text><text class="node-explanation" x="3016" y="489">一対象を何回使えるか、必ず選ぶ対象があるか、経路</text><text class="node-explanation" x="3016" y="507">はどこまで共用できるかを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="1370.5" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="1386.5" y="775">候補</text><text class="node-title" x="1386.5" y="803">選択の条件と目的値を整理する</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="1386.5" y="842">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="1386.5" y="866">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="3000" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="3016" y="775">分野</text><text class="node-title" x="3016" y="803">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="3016" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="grid-colors-route"><rect x="88" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="104" y="411">分野</text><text class="node-title" x="104" y="439">二色が行・列を共有しない配置</text><a href="/flowchartcp/flowcharts/#diagram-grid-color-rows-cols" data-route="grid-color-rows-cols"><text x="104" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="bounding-box-route"><rect x="452" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="468" y="411">分野</text><text class="node-title" x="468" y="439">選んだマスの外接長方形の期待面積</text><a href="/flowchartcp/flowcharts/#diagram-grid-bounding-expectation" data-route="grid-bounding-expectation"><text x="468" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="neighbor-modulo-route"><rect x="816" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="411">分野</text><text class="node-title" x="832" y="439">隣接値の余りをそろえる配置</text><a href="/flowchartcp/flowcharts/#diagram-grid-common-neighbor-remainder" data-route="grid-common-neighbor-remainder"><text x="832" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="height-silhouette-route"><rect x="1180" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1196" y="411">分野</text><text class="node-title" x="1196" y="439">各行・各列の最大高さと、各マスが空</text><text class="node-title" x="1196" y="462">かを保って残す総量を最小にする</text><a href="/flowchartcp/flowcharts/#diagram-silhouette-maxima-support-conditions" data-route="silhouette-maxima-support-conditions"><text x="1196" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="rectangle-components-route"><rect x="1544" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1560" y="411">分野</text><text class="node-title" x="1560" y="439">固定された色の格子で、各部分長方形</text><text class="node-title" x="1560" y="462">の中だけの同色成分数を求める</text><a href="/flowchartcp/flowcharts/#diagram-grid-rectangle-components-conditions" data-route="grid-rectangle-components-conditions"><text x="1560" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="xor-predecessor-route"><rect x="1908" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1924" y="411">分野</text><text class="node-title" x="1924" y="439">3×3のXOR更新と一セルの誤りか</text><text class="node-title" x="1924" y="462">ら、最小の初期図形を逆算する</text><a href="/flowchartcp/flowcharts/#diagram-xor-grid-predecessor-conditions" data-route="xor-grid-predecessor-conditions"><text x="1924" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="prefix-rectangles-route"><rect x="2272" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="2288" y="411">分野</text><text class="node-title" x="2288" y="439">二番号を交換するたび、番号順に選ん</text><text class="node-title" x="2288" y="462">だマスが長方形になる段階を数える</text><a href="/flowchartcp/flowcharts/#diagram-grid-prefix-rectangle-conditions" data-route="grid-prefix-rectangle-conditions"><text x="2288" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="convex-subsets-route"><rect x="2636" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="2652" y="411">分野</text><text class="node-title" x="2652" y="439">行と列が途切れない、連結なマスの選</text><text class="node-title" x="2652" y="462">び方を数える</text><a href="/flowchartcp/flowcharts/#diagram-row-column-convex-subset-conditions" data-route="row-column-convex-subset-conditions"><text x="2652" y="499">詳細の質問・図へ →</text></a></g></svg>