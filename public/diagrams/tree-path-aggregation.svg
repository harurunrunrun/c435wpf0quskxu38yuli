<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-path-aggregation flow-desc-tree-path-aggregation" width="1112" height="920" viewBox="0 0 1112 920" data-flow-svg="tree-path-aggregation"><title id="flow-title-tree-path-aggregation">二頂点間の経路の集計・更新の解法フローチャート</title><desc id="flow-desc-tree-path-aggregation">経路への集計や更新が必要かを確認し、少数の指定頂点についての問い合わせへ進みます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-path-aggregation" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="path:yes:hld"><title>はい</title><path d="M476 164 V176 C476 208 192 208 192 240 V252"/><path d="M192 290 V302 C192 334 192 334 192 366 V378" marker-end="url(#arrow-tree-path-aggregation)"/><g class="flow-edge-label" data-edge-label="path:yes:hld" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="275">はい</text></g></g><g class="flow-edge no" data-edge="path:no:marked"><title>いいえ</title><path d="M556 164 V176 C556 208 556 208 556 240 V252"/><path d="M556 290 V302 C556 334 556 334 556 366 V378" marker-end="url(#arrow-tree-path-aggregation)"/><g class="flow-edge-label" data-edge-label="path:no:marked" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="275">いいえ</text></g></g><g class="flow-edge unknown" data-edge="path:unknown:check"><title>わからない</title><path d="M636 164 V176 C636 208 920 208 920 240 V252"/><path d="M920 290 V302 C920 334 920 334 920 366 V378" marker-end="url(#arrow-tree-path-aggregation)"/><g class="flow-edge-label" data-edge-label="path:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M840 528 V547 C840 579 556 579 556 611 V623"/><path d="M556 661 V673 C556 705 556 705 556 737 V749" marker-end="url(#arrow-tree-path-aggregation)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="623" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="646">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 528 V547 C920 579 907 579 907 611 V623"/><path d="M907 661 V673 C907 705 866.667 705 866.667 737 V749" marker-end="url(#arrow-tree-path-aggregation)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="623" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="646">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 528 V547 C1000 579 1035.5 579 1035.5 611 V623"/><path d="M1035.5 661 V673 C1035.5 705 973.333 705 973.333 737 V749" marker-end="url(#arrow-tree-path-aggregation)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="623" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="646">わからない</text></g></g><g class="flow-node question" data-node="path"><rect x="396" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="412" y="52">質問</text><text class="node-title" x="412" y="80">二頂点間の経路に集計・更新を行いま</text><text class="node-title" x="412" y="103">すか？</text><text class="node-explanation" x="412" y="130">経路を少数の連続区間へ分ける方法を考えます。</text></g><g class="flow-node route" data-node="marked"><rect x="396" y="378" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="398">分野</text><text class="node-title" x="412" y="426">少数の指定頂点と距離の集計</text><text class="node-explanation" x="412" y="453">一度に指定する頂点数と、距離や部分木について求め</text><text class="node-explanation" x="412" y="471">る情報を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-tree-specified-vertices" data-route="tree-specified-vertices"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="378" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="398">質問</text><text class="node-title" x="776" y="426">問い合わせ対象は、祖先・部分木・一</text><text class="node-title" x="776" y="449">本の経路のどれか書けますか？</text><text class="node-explanation" x="776" y="476">根を決め、対象となる頂点や辺を小さな木に描いてみ</text><text class="node-explanation" x="776" y="494">ます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="749" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="769">分野</text><text class="node-title" x="776" y="797">条件を確かめる</text><text class="node-explanation" x="776" y="824">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="852">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="hld"><rect x="32" y="378" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="398">候補</text><text class="node-title" x="48" y="426">Heavy-Light 分解</text><a href="/flowchartcp/techniques/heavy-light-decomposition/"><title>HL分解の記事へ</title><text x="48" y="465">HL分解</text></a><a href="/flowchartcp/techniques/segment-tree/"><title>セグメント木の記事へ</title><text x="48" y="489">セグメント木</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="749" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="769">候補</text><text class="node-title" x="412" y="797">問い合わせの対象を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="836">状態の設計</text></a></g></svg>