 1427 665.333 1459 V1471" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="history:unknown:state" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="1345" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="1368">わからない</text></g></g><g class="flow-edge yes" data-edge="counterexample:yes:falsify"><title>はい</title><path d="M168 1621 V1633 C168 1665 248 1665 248 1697 V1709"/><path d="M248 1747 V1759 C248 1791 248 1791 248 1823 V1835" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="counterexample:yes:falsify" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="1709" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="1732">はい</text></g></g><g class="flow-edge no" data-edge="counterexample:no:proof"><title>いいえ</title><path d="M248 1621 V1633 C248 1665 599 1665 599 1697 V1709"/><path d="M599 1747 V1759 C599 1791 558.667 1791 558.667 1823 V1835" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="counterexample:no:proof" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="559" y="1709" width="80" height="38" rx="5"/><text text-anchor="middle" x="599" y="1732">いいえ</text></g></g><g class="flow-edge unknown" data-edge="counterexample:unknown:proof"><title>わからない</title><path d="M328 1621 V1633 C328 1665 727.5 1665 727.5 1697 V1709"/><path d="M727.5 1747 V1759 C727.5 1791 665.333 1791 665.333 1823 V1835" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="counterexample:unknown:proof" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="1709" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="1732">わからない</text></g></g><g class="flow-edge yes" data-edge="proof:yes:proved"><title>はい</title><path d="M532 1967 V1979 C532 2011 248 2011 248 2043 V2055"/><path d="M248 2093 V2105 C248 2137 248 2137 248 2169 V2181" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="proof:yes:proved" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="2055" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="2078">はい</text></g></g><g class="flow-edge no" data-edge="proof:no:unproved"><title>いいえ</title><path d="M612 1967 V1979 C612 2011 599 2011 599 2043 V2055"/><path d="M599 2093 V2105 C599 2137 558.667 2137 558.667 2169 V2181" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="proof:no:unproved" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="559" y="2055" width="80" height="38" rx="5"/><text text-anchor="middle" x="599" y="2078">いいえ</text></g></g><g class="flow-edge unknown" data-edge="proof:unknown:unproved"><title>わからない</title><path d="M692 1967 V1979 C692 2011 727.5 2011 727.5 2043 V2055"/><path d="M727.5 2093 V2105 C727.5 2137 665.333 2137 665.333 2169 V2181" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="proof:unknown:unproved" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="2055" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="2078">わからない</text></g></g><g class="flow-node question" data-node="known"><rect x="331.8333333333333" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="347.8333333333333" y="52">質問</text><text class="node-title" x="347.8333333333333" y="80">必要な性質が、問題文の制約に明記さ</text><text class="node-title" x="347.8333333333333" y="103">れていますか？</text><text class="node-explanation" x="347.8333333333333" y="130">負数の有無、閉路、更新の時刻、整数か実数かなどを</text><text class="node-explanation" x="347.8333333333333" y="148">読み直します。</text></g><g class="flow-node question" data-node="formula"><rect x="396" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="416">質問</text><text class="node-title" x="412" y="444">求める量や操作を、式として書けます</text><text class="node-title" x="412" y="467">か？</text><text class="node-explanation" x="412" y="494">加算、最小値、順序、集合包含など、使う演算を明確</text><text class="node-explanation" x="412" y="512">にします。</text></g><g class="flow-node question" data-node="examples"><rect x="452" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="468" y="780">質問</text><text class="node-title" x="468" y="808">小さい入力の全探索や、操作の列挙が</text><text class="node-title" x="468" y="831">できますか？</text><text class="node-explanation" x="468" y="858">観察から条件の候補を作り、正しい参照値を持ちま</text><text class="node-explanation" x="468" y="876">す。</text></g><g class="flow-node question" data-node="history"><rect x="452" y="1125" width="320" height="132" rx="7"/><text class="node-kind" x="468" y="1145">質問</text><text class="node-title" x="468" y="1173">過去の履歴によって、次の合法手が変</text><text class="node-title" x="468" y="1196">わりますか？</text><text class="node-explanation" x="468" y="1223">状態に含めるべき情報を調べます。</text></g><g class="flow-node question" data-node="counterexample"><rect x="88" y="1471" width="320" height="150" rx="7"/><text class="node-kind" x="104" y="1491">質問</text><text class="node-title" x="104" y="1519">候補となる単調性や不等式を、一つの</text><text class="node-title" x="104" y="1542">例で壊せますか？</text><text class="node-explanation" x="104" y="1569">負数、同値、空区間、重複、閉路などの境界を試しま</text><text class="node-explanation" x="104" y="1587">す。</text></g><g class="flow-node question" data-node="proof"><rect x="452" y="1835" width="320" height="132" rx="7"/><text class="node-kind" x="468" y="1855">質問</text><text class="node-title" x="468" y="1883">すべての必要な入力で条件が成り立つ</text><text class="node-title" x="468" y="1906">理由を示せますか？</text><text class="node-explanation" x="468" y="1933">実験に通ることと、適用条件の証明を区別します。</text></g><g class="flow-node result" data-node="read"><rect x="32" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="416">候補</text><text class="node-title" x="48" y="444">制約から確認する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="48" y="483">状態の設計</text></a></g><g class="flow-node result" data-node="derive"><rect x="88" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="104" y="780">候補</text><text class="node-title" x="104" y="808">式から条件を確認する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="104" y="847">状態の設計</text></a><a href="/flowchartcp/techniques/invariant/"><title>不変量の記事へ</title><text x="104" y="871">不変量</text></a></g><g class="flow-node result" data-node="enumerate"><rect x="88" y="1125" width="320" height="127" rx="7"/><text class="node-kind" x="104" y="1145">候補</text><text class="node-title" x="104" y="1173">小規模な全探索で調べる</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="104" y="1212">小さい入力で全探索する</text></a></g><g class="flow-node result" data-node="state"><rect x="452" y="1471" width="320" height="127" rx="7"/><text class="node-kind" x="468" y="1491">候補</text><text class="node-title" x="468" y="1519">不足している履歴を見つける</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="468" y="1558">状態の設計</text></a></g><g class="flow-node result" data-node="falsify"><rect x="88" y="1835" width="320" height="127" rx="7"/><text class="node-kind" x="104" y="1855">候補</text><text class="node-title" x="104" y="1883">見つかった反例から修正する</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="104" y="1922">反例探し</text></a></g><g class="flow-node result" data-node="proved"><rect x="88" y="2181" width="320" height="151" rx="7"/><text class="node-kind" x="104" y="2201">候補</text><text class="node-title" x="104" y="2229">確認した条件で候補を選び直す</text><a href="/flowchartcp/techniques/invariant/"><title>不変量の記事へ</title><text x="104" y="2268">不変量</text></a><a href="/flowchartcp/techniques/exchange-argument/"><title>交換法の記事へ</title><text x="104" y="2292">交換法</text></a></g><g class="flow-node result" data-node="unproved"><rect x="452" y="2181" width="320" height="151" rx="7"/><text class="node-kind" x="468" y="2201">候補</text><text class="node-title" x="468" y="2229">まだ確認できていない条件を残す</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="468" y="2268">反例探し</text></a><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="468" y="2292">小さい入力で全探索する</text></a></g></svg>