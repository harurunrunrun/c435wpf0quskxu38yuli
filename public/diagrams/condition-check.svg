<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-condition-check flow-desc-condition-check" width="804" height="2364" viewBox="0 0 804 2364" data-flow-svg="condition-check"><title id="flow-title-condition-check">条件を確かめるの解法フローチャート</title><desc id="flow-desc-condition-check">まだ分からない性質を、入力の制約・式・小さい例から確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-condition-check" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="known:yes:read"><title>はい</title><path d="M411.833 182 V194 C411.833 226 192 226 192 258 V270"/><path d="M192 308 V320 C192 352 192 352 192 384 V396" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="known:yes:read" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">はい</text></g></g><g class="flow-edge no" data-edge="known:no:formula"><title>いいえ</title><path d="M491.833 182 V194 C491.833 226 556 226 556 258 V270"/><path d="M556 308 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="known:no:formula" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="known:unknown:examples"><title>わからない</title><path d="M571.833 182 V194 C571.833 226 727.5 226 727.5 258 V270"/><path d="M727.5 308 V320 C727.5 352 766 352 766 384 V396 V558 C766 590 766 590 766 622 V634 V684 C766 716 692 716 692 748 V760" marker-end="url(#arrow-condition-check)"/><g class="flow-edge-label" data-edge-label="known:unknown:examples" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="270" width="89" height="38" rx="5"/><text te