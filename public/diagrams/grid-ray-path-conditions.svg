<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-grid-ray-path-conditions flow-desc-grid-ray-path-conditions" width="748" height="1365" viewBox="0 0 748 1365" data-flow-svg="grid-ray-path-conditions"><title id="flow-title-grid-ray-path-conditions">壁のある格子での長距離移動の経路数の解法フローチャート</title><desc id="flow-desc-grid-ray-path-conditions">方向、通過する壁、移動列の数え方を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-grid-ray-path-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="directions:yes:walls"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-grid-ray-path-conditions)"/><g class="flow-edge-label" data-edge-label="directions:yes:walls" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="directions:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V576 C654 608 654 608 654 640 V652 V702 C654 734 654 734 654 766 V778 V963 C654 995 654 995 654 1027 V1039 V1089 C654 1121 624.571 1121 624.571 1153 V1165" marker-end="url(#arrow-grid-ray-path-conditions)"/><g class="flow-edge-label" data-edge-label="directions:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="directions:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V576 C710 608 710 608 710 640 V652 V702 C710 734 710 734 710 766 V778 V963 C710 995 710 995 710 1027 V1039 V1089 C710 1121 670.286 1121 670.286 1153 V1165" marker-end="url(#arrow-grid-ray-path-conditions)"/><g class="flow-edge-label" data-edge-label="directions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="walls:yes:count-moves"><title>はい</title><path d="M352.5 564 V576 C352.5 608 307 608 307 640 V652"/><path d="M307 690 V702 C307 734 319.5 734 319.5 766 V778" marker-end="url(#arrow-grid-ray-path-conditions)"/><g class="flow-edge-label" data-edge-label="walls:yes:count-moves" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="675">はい</text></g></g><g class="flow-edge no" data-edge="walls:no:check"><title>いいえ</title><path d="M432.5 564 V576 C432.5 608 431 608 431 640 V652"/><path d="M431 690 V702 C431 734 542 734 542 766 V778 V963 C542 995 542 995 542 1027 V1039 V1089 C542 1121 533.143 1121 533.143 1153 V1165" marker-end="url(#arrow-grid-ray-path-conditions)"/><g class="flow-edge-label" data-edge-label="walls:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="walls:unknown:check"><title>わからない</title><path d="M512.5 564 V576 C512.5 608 559.5 608 559.5 640 V652"/><path d="M559.5 690 V702 C559.5 734 598 734 598 766 V778 V963 C598 995 598 995 598 1027 V1039 V1089 C598 1121 578.857 1121 578.857 1153 V1165" marker-end="url(#arrow-grid-ray-path-conditions)"/><g class="flow-edge-label" data-edge-label="walls:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="count-moves:yes:answer"><title>はい</title><path d="M239.5 951 V963 C239.5 995 192 995 192 1027 V1039"/><path d="M192 1077 V1089 C192 1121 192 1121 192 1153 V1165" marker-end="url(#arrow-grid-ray-path-conditions)"/><g class="flow-edge-label" data-edge-label="count-moves:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="count-moves:no:check"><title>いいえ</title><path d="M319.5 951 V963 C319.5 995 319 995 319 1027 V1039"/><path d="M319 1077 V1089 C319 1121 441.714 1121 441.714 1153 V1165" marker-end="url(#arrow-grid-ray-path-conditions)"/><g class="flow-edge-label" data-edge-label="count-moves:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="count-moves:unknown:check"><title>わからない</title><path d="M399.5 951 V963 C399.5 995 447.5 995 447.5 1027 V1039"/><path d="M447.5 1077 V1089 C447.5 1121 487.429 1121 487.429 1153 V1165" marker-end="url(#arrow-grid-ray-path-conditions)"/><g class="flow-edge-label" data-edge-label="count-moves:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="directions"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">右・下・右下の三方向へ、任意の正の</text><text class="node-title" x="400.5" y="103">マス数だけ進めますか？</text><text class="node-explanation" x="400.5" y="130">左や上へ戻る場合は、行と列の順に処理するDPには</text><text class="node-explanation" x="400.5" y="148">なりません。</text></g><g class="flow-node question" data-node="walls"><rect x="272.5" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">壁は固定で通過できず、移動距離の上</text><text class="node-title" x="288.5" y="467">限や距離ごとの重みはありませんか？</text><text class="node-explanation" x="288.5" y="494">方向ごとの累積を壁で0に戻します。壁を飛び越せる</text><text class="node-explanation" x="288.5" y="512">場合や、長さを制限する場合は同じ累積を使えませ</text><text class="node-explanation" x="288.5" y="530">ん。</text></g><g class="flow-node question" data-node="count-moves"><rect x="159.5" y="778" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="798">質問</text><text class="node-title" x="175.5" y="826">左上から右下までの、各手で止まる位</text><text class="node-title" x="175.5" y="849">置の列で区別した移動方法を数えます</text><text class="node-title" x="175.5" y="872">か？</text><text class="node-explanation" x="175.5" y="899">途中で止まる経路と、同じ直線を一手で進む経路は別</text><text class="node-explanation" x="175.5" y="917">です。通過マス集合の種類や最小手数とは分けます。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1185">候補</text><text class="node-title" x="48" y="1213">三方向の累積を壁で切り、到着数を求</text><text class="node-title" x="48" y="1236">めてから次のマスへ加える</text><a href="/flowchartcp/techniques/grid-ray-direction-prefix/"><title>壁まで何マスでも進める格子の経路数は、方向別の累積和を壁で切るの記事へ</title><text x="48" y="1275">壁まで何マスでも進める格子の経路数は、方向別の</text><text x="48" y="1293">累積和を壁で切る</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1185">分野</text><text class="node-title" x="412" y="1213">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1250">詳細の質問・図へ →</text></a></g></svg>