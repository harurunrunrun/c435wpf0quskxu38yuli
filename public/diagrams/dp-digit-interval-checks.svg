<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dp-digit-interval-checks flow-desc-dp-digit-interval-checks" width="1112" height="1308" viewBox="0 0 1112 1308" data-flow-svg="dp-digit-interval-checks"><title id="flow-title-dp-digit-interval-checks">整数の桁と連続区間の条件の解法フローチャート</title><desc id="flow-desc-dp-digit-interval-checks">整数の各桁を選ぶ条件か、連続区間から答えを作る条件かを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dp-digit-interval-checks" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="digits:yes:digit"><title>はい</title><path d="M719.833 182 V194 C719.833 226 500 226 500 258 V270"/><path d="M500 308 V320 C500 352 500 352 500 384 V396" marker-end="url(#arrow-dp-digit-interval-checks)"/><g class="flow-edge-label" data-edge-label="digits:yes:digit" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="460" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="500" y="293">はい</text></g></g><g class="flow-edge no" data-edge="digits:no:interval"><title>いいえ</title><path d="M799.833 182 V194 C799.833 226 864 226 864 258 V270"/><path d="M864 308 V320 C864 352 864 352 864 384 V396" marker-end="url(#arrow-dp-digit-interval-checks)"/><g class="flow-edge-label" data-edge-label="digits:no:interval" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="824" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="864" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="digits:unknown:check"><title>わからない</title><path d="M879.833 182 V194 C879.833 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V320 C1035.5 352 1074 352 1074 384 V396 V559 C1074 591 1014.5 591 1014.5 623 V635 V685 C1014.5 717 973.333 717 973.333 749 V761" marker-end="url(#arrow-dp-digit-interval-checks)"/><g class="flow-edge-label" data-edge-label="digits:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="interval:yes:interval-result"><title>はい</title><path d="M784 528 V559 C784 591 192 591 192 623 V635"/><path d="M192 673 V685 C192 717 192 717 192 749 V761" marker-end="url(#arrow-dp-digit-interval-checks)"/><g class="flow-edge-label" data-edge-label="interval:yes:interval-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="635" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="658">はい</text></g></g><g class="flow-edge no" data-edge="interval:no:history"><title>いいえ</title><path d="M864 528 V559 C864 591 556 591 556 623 V635"/><path d="M556 673 V685 C556 717 556 717 556 749 V761" marker-end="url(#arrow-dp-digit-interval-checks)"/><g class="flow-edge-label" data-edge-label="interval:no:history" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="635" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="658">いいえ</text></g></g><g class="flow-edge unknown" data-edge="interval:unknown:check"><title>わからない</title><path d="M944 528 V559 C944 591 920 591 920 623 V635"/><path d="M920 673 V685 C920 717 866.667 717 866.667 749 V761" marker-end="url(#arrow-dp-digit-interval-checks)"/><g class="flow-edge-label" data-edge-label="interval:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="635" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="658">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:state"><title>はい</title><path d="M840 911 V923 C840 955 556 955 556 987 V999"/><path d="M556 1037 V1049 C556 1081 556 1081 556 1113 V1125" marker-end="url(#arrow-dp-digit-interval-checks)"/><g class="flow-edge-label" data-edge-label="check:yes:state" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="999" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1022">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 911 V923 C920 955 907 955 907 987 V999"/><path d="M907 1037 V1049 C907 1081 866.667 1081 866.667 1113 V1125" marker-end="url(#arrow-dp-digit-interval-checks)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="999" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1022">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 911 V923 C1000 955 1035.5 955 1035.5 987 V999"/><path d="M1035.5 1037 V1049 C1035.5 1081 973.333 1081 973.333 1113 V1125" marker-end="url(#arrow-dp-digit-interval-checks)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="999" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1022">わからない</text></g></g><g class="flow-node question" data-node="digits"><rect x="639.8333333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="655.8333333333334" y="52">質問</text><text class="node-title" x="655.8333333333334" y="80">整数の各桁について条件を満たす数を</text><text class="node-title" x="655.8333333333334" y="103">数えますか？</text><text class="node-explanation" x="655.8333333333334" y="130">上限の接頭辞と一致しているか、必要な余りや出現状</text><text class="node-explanation" x="655.8333333333334" y="148">態を持ちます。</text></g><g class="flow-node question" data-node="interval"><rect x="704" y="396" width="320" height="132" rx="7"/><text class="node-kind" x="720" y="416">質問</text><text class="node-title" x="720" y="444">区間の両端や分割から漸化式を作れま</text><text class="node-title" x="720" y="467">すか？</text><text class="node-explanation" x="720" y="494">短い区間から長い区間へ計算できるか確認します。</text></g><g class="flow-node route" data-node="history"><rect x="396" y="761" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="781">分野</text><text class="node-title" x="412" y="809">残す履歴と今後の選択</text><a href="/flowchartcp/flowcharts/#diagram-dp-remaining-history" data-route="dp-remaining-history"><text x="412" y="846">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="761" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="781">質問</text><text class="node-title" x="776" y="809">二つの履歴について、以後の合法な操</text><text class="node-title" x="776" y="832">作と追加コストを比較できますか？</text><text class="node-explanation" x="776" y="859">同じ状態にまとめた履歴が、すべての未来で同じ振る</text><text class="node-explanation" x="776" y="877">舞いをするかを確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="1125" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="1145">分野</text><text class="node-title" x="776" y="1173">条件を確かめる</text><text class="node-explanation" x="776" y="1200">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="1228">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="digit"><rect x="340" y="396" width="320" height="151" rx="7"/><text class="node-kind" x="356" y="416">候補</text><text class="node-title" x="356" y="444">桁 DP</text><a href="/flowchartcp/techniques/digit-dp-leading-zero/"><title>桁DPでは先頭の0と数字としての0を分けるの記事へ</title><text x="356" y="483">桁DPでは先頭の0と数字としての0を分ける</text></a><a href="/flowchartcp/techniques/digit-dp/"><title>桁DPの記事へ</title><text x="356" y="507">桁DP</text></a></g><g class="flow-node result" data-node="interval-result"><rect x="32" y="761" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="781">候補</text><text class="node-title" x="48" y="809">区間 DP</text><a href="/flowchartcp/techniques/interval-dp/"><title>区間DPの記事へ</title><text x="48" y="848">区間DP</text></a></g><g class="flow-node result" data-node="state"><rect x="396" y="1125" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1145">候補</text><text class="node-title" x="412" y="1173">必要な履歴だけを残す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1212">状態の設計</text></a><a href="/flowchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="412" y="1236">対称性</text></a></g></svg>