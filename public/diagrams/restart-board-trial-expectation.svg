<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-restart-board-trial-expectation flow-desc-restart-board-trial-expectation" width="1112" height="1855" viewBox="0 0 1112 1855" data-flow-svg="restart-board-trial-expectation"><title id="flow-title-restart-board-trial-expectation">同じ地点へ戻される期待値は、一試行の費用を成功確率で割るの解法フローチャート</title><desc id="flow-desc-restart-board-trial-expectation">リセット先、リセット後の独立性、ゴールの条件、一試行の成功可能性を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-restart-board-trial-expectation" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge common-start" data-edge="model:common-start:assumptions"><title>盤上を確率的に進み、失敗マスに止まると同じ開始地点へ戻る</title><path d="M718.5 182 V194 C718.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 326 V338 C535.5 370 746.111 370 746.111 402 V414" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="model:common-start:assumptions" tabindex="0" role="group" aria-label="選択肢：盤上を確率的に進み、失敗マスに止まると同じ開始地点へ戻る"><rect x="413" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="535.5" y="293">盤上を確率的に進み、失敗マスに止ま</text><text text-anchor="middle" x="535.5" y="311">ると同じ開始地点へ戻る</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>失敗ごとに戻る先が違う、または試行をまたぐ資源が残る</title><path d="M798.5 182 V194 C798.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V617 C1018 649 1018 649 1018 681 V693 V743 C1018 775 1018 775 1018 807 V819 V1045 C1018 1077 1018 1077 1018 1109 V1121 V1171 C1018 1203 636 1203 636 1235 V1247" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：失敗ごとに戻る先が違う、または試行をまたぐ資源が残る"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">失敗ごとに戻る先が違う、または試行</text><text text-anchor="middle" x="824.5" y="311">をまたぐ資源が残る</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M878.5 182 V194 C878.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V617 C1074 649 1074 649 1074 681 V693 V743 C1074 775 1074 775 1074 807 V819 V1045 C1074 1077 1074 1077 1074 1109 V1121 V1171 C1074 1203 1000 1203 1000 1235 V1247" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 605 V617 C666.111 649 519.833 649 519.833 681 V693"/><path d="M519.833 731 V743 C519.833 775 519.833 775 519.833 807 V819" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="716">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 605 V617 C746.111 649 795 649 795 681 V693"/><path d="M795 731 V743 C795 775 906 775 906 807 V819 V1045 C906 1077 906 1077 906 1109 V1121 V1171 C906 1203 556 1203 556 1235 V1247" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"><title>わからない</title><path d="M826.111 605 V617 C826.111 649 923.5 649 923.5 681 V693"/><path d="M923.5 731 V743 C923.5 775 962 775 962 807 V819 V1045 C962 1077 962 1077 962 1109 V1121 V1171 C962 1203 920 1203 920 1235 V1247" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="assumptions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M439.833 1033 V1045 C439.833 1077 192 1077 192 1109 V1121"/><path d="M192 1159 V1171 C192 1203 192 1203 192 1235 V1247" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1121" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1144">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M519.833 1033 V1045 C519.833 1077 556 1077 556 1109 V1121"/><path d="M556 1159 V1171 C556 1203 476 1203 476 1235 V1247" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1121" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1144">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M599.833 1033 V1045 C599.833 1077 811.5 1077 811.5 1109 V1121"/><path d="M811.5 1159 V1171 C811.5 1203 840 1203 840 1235 V1247" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="767" y="1121" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1144">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1397 V1464 C840 1496 783 1496 783 1528 V1540"/><path d="M783 1578 V1590 C783 1622 828.5 1622 828.5 1654 V1666" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1540" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1563">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1397 V1464 C920 1496 907 1496 907 1528 V1540"/><path d="M907 1578 V1590 C907 1622 908.5 1622 908.5 1654 V1666" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1540" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1563">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1397 V1464 C1000 1496 1035.5 1496 1035.5 1528 V1540"/><path d="M1035.5 1578 V1590 C1035.5 1622 988.5 1622 988.5 1654 V1666" marker-end="url(#arrow-restart-board-trial-expectation)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1540" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1563">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="638.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="654.5" y="52">質問</text><text class="node-title" x="654.5" y="80">ランダムな操作と終了の規則はどれで</text><text class="node-title" x="654.5" y="103">すか？</text><text class="node-explanation" x="654.5" y="130">リセット先、リセット後の独立性、ゴールの条件、一</text><text class="node-explanation" x="654.5" y="148">試行の成功可能性を確認します。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="602.1111111111112" y="434">質問</text><text class="node-title" x="602.1111111111112" y="462">リセット後は毎回まったく同じ状態に</text><text class="node-title" x="602.1111111111112" y="485">戻り、それまでの履歴が次の遷移に影</text><text class="node-title" x="602.1111111111112" y="508">響しませんか？</text><text class="node-explanation" x="602.1111111111112" y="535">一試行を、開始してから初めてリセットされるかゴー</text><text class="node-explanation" x="602.1111111111112" y="553">ルするまでとします。戻った後に分布や費用が変わる</text><text class="node-explanation" x="602.1111111111112" y="571">と同じ式を使えません。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="819" width="320" height="214" rx="7"/><text class="node-kind" x="375.83333333333337" y="839">質問</text><text class="node-title" x="375.83333333333337" y="867">毎回1..Mだけ一様に前進し、N以</text><text class="node-title" x="375.83333333333337" y="890">上で終了しますか？ N,Mは10万</text><text class="node-title" x="375.83333333333337" y="913">以下、リセットマスは10個以下です</text><text class="node-title" x="375.83333333333337" y="936">か？</text><text class="node-explanation" x="375.83333333333337" y="963">E=c+(1−p)E から E=c/p です。p</text><text class="node-explanation" x="375.83333333333337" y="981">=0 は到達不可能です。盤上で前向きに進む範囲は</text><text class="node-explanation" x="375.83333333333337" y="999">窓和などでまとめられます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1247" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1267">候補</text><text class="node-title" x="48" y="1295">同じ地点へ戻される期待値は、一試行</text><text class="node-title" x="48" y="1318">の費用を成功確率で割る</text><a href="/flowchartcp/techniques/restart-board-trial-expectation/"><title>同じ地点へ戻される期待値は、一試行の費用を成功確率で割るの記事へ</title><text x="48" y="1357">同じ地点へ戻される期待値は、一試行の費用を成功</text><text x="48" y="1375">確率で割る</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1247" width="320" height="205" rx="7"/><text class="node-kind" x="412" y="1267">候補</text><text class="node-title" x="412" y="1295">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1322">戻り先や分布が複数ある場合は、一つの E に戻る</text><text class="node-explanation" x="412" y="1340">式では足りません。戻る状態ごとの期待値を残しま</text><text class="node-explanation" x="412" y="1358">す。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1388">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1412">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1247" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1267">質問</text><text class="node-title" x="776" y="1295">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1318">確認できますか？</text><text class="node-explanation" x="776" y="1345">リセット先、リセット後の独立性、ゴールの条件、一</text><text class="node-explanation" x="776" y="1363">試行の成功可能性を確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1666" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1686">分野</text><text class="node-title" x="764.5" y="1714">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1741">リセット先、リセット後の独立性、ゴールの条件、一</text><text class="node-explanation" x="764.5" y="1759">試行の成功可能性を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1787">詳細の質問・図へ →</text></a></g></svg>