<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-permutation-fixed-positions flow-desc-permutation-fixed-positions" width="989" height="1348" viewBox="0 0 989 1348" data-flow-svg="permutation-fixed-positions"><title id="flow-title-permutation-fixed-positions">元の位置への配置と固定点数の解法フローチャート</title><desc id="flow-desc-permutation-fixed-positions">固定する位置を選び、残った位置に一つも固定点を作らないようにします。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-permutation-fixed-positions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:fixed-count"><title>はい</title><path d="M646.292 205 V217 C646.292 249 482.375 249 482.375 281 V293"/><path d="M482.375 331 V343 C482.375 375 482.375 375 482.375 407 V419" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="model:yes:fixed-count" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="442.375" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="482.375" y="316">はい</text></g></g><g class="flow-edge no" data-edge="model:no:fallback"><title>いいえ</title><path d="M726.292 205 V217 C726.292 249 784 249 784 281 V293"/><path d="M784 331 V343 C784 375 895 375 895 407 V419 V581 C895 613 895 613 895 645 V657 V707 C895 739 516.25 739 516.25 771 V783 V963 C516.25 995 489 995 489 1027 V1039 V1089 C489 1121 433 1121 433 1153 V1165" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="744" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="784" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M806.292 205 V217 C806.292 249 912.5 249 912.5 281 V293"/><path d="M912.5 331 V343 C912.5 375 951 375 951 407 V419 V581 C951 613 951 613 951 645 V657 V707 C951 739 811.833 739 811.833 771 V783" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="868" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="912.5" y="316">わからない</text></g></g><g class="flow-edge none" data-edge="fixed-count:none:derangement-result"><title>一つも元の位置に置かない</title><path d="M386.375 569 V581 C386.375 613 122 613 122 645 V657"/><path d="M122 695 V707 C122 739 196.917 739 196.917 771 V783" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="fixed-count:none:derangement-result" tabindex="0" role="group" aria-label="選択肢：一つも元の位置に置かない"><rect x="32" y="657" width="180" height="38" rx="5"/><text text-anchor="middle" x="122" y="680">一つも元の位置に置かない</text></g></g><g class="flow-edge exact" data-edge="fixed-count:exact:derangement-result"><title>ちょうど k 個だけ元の位置に置く</title><path d="M450.375 569 V581 C450.375 613 378.5 613 378.5 645 V657"/><path d="M378.5 695 V707 C378.5 739 303.583 739 303.583 771 V783" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="fixed-count:exact:derangement-result" tabindex="0" role="group" aria-label="選択肢：ちょうど k 個だけ元の位置に置く"><rect x="256" y="657" width="245" height="38" rx="5"/><text text-anchor="middle" x="378.5" y="680">ちょうど k 個だけ元の位置に置く</text></g></g><g class="flow-edge other" data-edge="fixed-count:other:fallback"><title>その他の位置制約もある</title><path d="M514.375 569 V581 C514.375 613 628.5 613 628.5 645 V657"/><path d="M628.5 695 V707 C628.5 739 460.25 739 460.25 771 V783 V963 C460.25 995 433 995 433 1027 V1039 V1089 C433 1121 353 1121 353 1153 V1165" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="fixed-count:other:fallback" tabindex="0" role="group" aria-label="選択肢：その他の位置制約もある"><rect x="545" y="657" width="167" height="38" rx="5"/><text text-anchor="middle" x="628.5" y="680">その他の位置制約もある</text></g></g><g class="flow-edge unknown" data-edge="fixed-count:unknown:check"><title>わからない</title><path d="M578.375 569 V581 C578.375 613 800.5 613 800.5 645 V657"/><path d="M800.5 695 V707 C800.5 739 705.167 739 705.167 771 V783" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="fixed-count:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="756" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="800.5" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M678.5 933 V963 C678.5 995 579 995 579 1027 V1039"/><path d="M579 1077 V1089 C579 1121 513 1121 513 1153 V1165" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="539" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="579" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M758.5 933 V963 C758.5 995 784 995 784 1027 V1039"/><path d="M784 1077 V1089 C784 1121 743.667 1121 743.667 1153 V1165" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="744" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="784" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M838.5 933 V963 C838.5 995 912.5 995 912.5 1027 V1039"/><path d="M912.5 1077 V1089 C912.5 1121 850.333 1121 850.333 1153 V1165" marker-end="url(#arrow-permutation-fixed-positions)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="868" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="912.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="566.2916666666666" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="582.2916666666666" y="52">質問</text><text class="node-title" x="582.2916666666666" y="80">全て異なる n 個の対象を、全て異</text><text class="node-title" x="582.2916666666666" y="103">なる n 個の位置へ一つずつ置きま</text><text class="node-title" x="582.2916666666666" y="126">すか？</text><text class="node-explanation" x="582.2916666666666" y="153">各対象には元の位置が一つあります。同じ物を複数使</text><text class="node-explanation" x="582.2916666666666" y="171">う場合は、この順列モデルと異なります。</text></g><g class="flow-node question" data-node="fixed-count"><rect x="322.375" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="338.375" y="439">質問</text><text class="node-title" x="338.375" y="467">元の位置へ置く対象の個数は、どの条</text><text class="node-title" x="338.375" y="490">件ですか？</text><text class="node-explanation" x="338.375" y="517">ちょうど k 個なら、その k 位置を選び、残り</text><text class="node-explanation" x="338.375" y="535"> n−k 位置に固定点を作りません。</text></g><g class="flow-node result" data-node="derangement-result"><rect x="90.25" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="106.25" y="803">候補</text><text class="node-title" x="106.25" y="831">固定する位置を選び、残りの完全順列</text><text class="node-title" x="106.25" y="854">を二つの小さいサイズから計算する</text><a href="/flowchartcp/techniques/derangement-fixed-count/"><title>元の位置へ戻る個数を指定した順列は、固定点を選んで残りを完全順列にするの記事へ</title><text x="106.25" y="893">元の位置へ戻る個数を指定した順列は、固定点を選</text><text x="106.25" y="911">んで残りを完全順列にする</text></a></g><g class="flow-node question" data-node="check"><rect x="598.5" y="783" width="320" height="150" rx="7"/><text class="node-kind" x="614.5" y="803">質問</text><text class="node-title" x="614.5" y="831">必要な条件を、問題文と小さい例から</text><text class="node-title" x="614.5" y="854">確認できますか？</text><text class="node-explanation" x="614.5" y="881">区別する対象、求める個数、操作の条件を確認しま</text><text class="node-explanation" x="614.5" y="899">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="273" y="1165" width="320" height="151" rx="7"/><text class="node-kind" x="289" y="1185">候補</text><text class="node-title" x="289" y="1213">条件と数え方をもう一度確かめる</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="289" y="1252">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="289" y="1276">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="637" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="653" y="1185">分野</text><text class="node-title" x="653" y="1213">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="653" y="1250">詳細の質問・図へ →</text></a></g></svg>