"group" aria-label="選択肢：行・列の合計と、各項の範囲を満たす整数表"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">行・列の合計と、各項の範囲を満たす</text><text text-anchor="middle" x="192" y="311">整数表</text></g></g><g class="flow-edge limits" data-edge="purpose:limits:lower"><title>割り当てる量に上限・下限がある</title><path d="M1171.486 182 V194 C1171.486 226 556 226 556 258 V270"/><path d="M556 308 V356 C556 388 556 388 556 420 V432" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label="purpose:limits:lower" tabindex="0" role="group" aria-label="選択肢：割り当てる量に上限・下限がある"><rect x="446.5" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">割り当てる量に上限・下限がある</text></g></g><g class="flow-edge costs" data-edge="purpose:costs:cost"><title>数量を満たし、割当の費用合計を最小にする</title><path d="M1207.042 182 V194 C1207.042 226 832 226 832 258 V270"/><path d="M832 326 V356 C832 388 766 388 766 420 V432 V611 C766 643 1837 643 1837 675 V687 V737 C1837 769 1337.333 769 1337.333 801 V813" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label="purpose:costs:cost" tabindex="0" role="group" aria-label="選択肢：数量を満たし、割当の費用合計を最小にする"><rect x="709.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="832" y="293">数量を満たし、割当の費用合計を最小</text><text text-anchor="middle" x="832" y="311">にする</text></g></g><g class="flow-edge receive-balance" data-edge="purpose:receive-balance:gift-balance-route"><title>各品物を候補の人へ渡し、受取個数の最大と最小の差を小さくする</title><path d="M1242.597 182 V194 C1242.597 226 1121 226 1121 258 V270"/><path d="M1121 326 V356 C1121 388 976 388 976 420 V432" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label="purpose:receive-balance:gift-balance-route" tabindex="0" role="group" aria-label="選択肢：各品物を候補の人へ渡し、受取個数の最大と最小の差を小さくする"><rect x="998.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1121" y="293">各品物を候補の人へ渡し、受取個数の</text><text text-anchor="middle" x="1121" y="311">最大と最小の差を小さくする</text></g></g><g class="flow-edge median-rounds" data-edge="purpose:median-rounds:median-rounds-route"><title>各色から毎回一枚ずつ選び、中央値への絶対差和の合計を最大にする</title><path d="M1278.153 182 V194 C1278.153 226 1410 226 1410 258 V270"/><path d="M1410 326 V356 C1410 388 1340 388 1340 420 V432" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label="purpose:median-rounds:median-rounds-route" tabindex="0" role="group" aria-label="選択肢：各色から毎回一枚ずつ選び、中央値への絶対差和の合計を最大にする"><rect x="1287.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1410" y="293">各色から毎回一枚ずつ選び、中央値へ</text><text text-anchor="middle" x="1410" y="311">の絶対差和の合計を最大にする</text></g></g><g class="flow-edge two-source-mixture" data-edge="purpose:two-source-mixture:two-source-mixture-route"><title>二つの始点から二種類を送り、容量を共有して到着量の幾何平均を最大にする</title><path d="M1313.708 182 V194 C1313.708 226 1704 226 1704 258 V270"/><path d="M1704 344 V356 C1704 388 1704 388 1704 420 V432" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label="purpose:two-source-mixture:two-source-mixture-route" tabindex="0" role="group" aria-label="選択肢：二つの始点から二種類を送り、容量を共有して到着量の幾何平均を最大にする"><rect x="1581.5" y="270" width="245" height="74" rx="5"/><text text-anchor="middle" x="1704" y="293">二つの始点から二種類を送り、容量を</text><text text-anchor="middle" x="1704" y="311">共有して到着量の幾何平均を最大にす</text><text text-anchor="middle" x="1704" y="329">る</text></g></g><g class="flow-edge line-point-cover" data-edge="purpose:line-point-cover:line-point-cover-route"><title>直線上の二色の全点へ線を接続し、総長を最小にする</title><path d="M1349.264 182 V194 C1349.264 226 2028.5 226 2028.5 258 V270"/><path d="M2028.5 326 V356 C2028.5 388 2068 388 2068 420 V432" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label="purpose:line-point-cover:line-point-cover-route" tabindex="0" role="group" aria-label="選択肢：直線上の二色の全点へ線を接続し、総長を最小にする"><rect x="1906" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="2028.5" y="293">直線上の二色の全点へ線を接続し、総</text><text text-anchor="middle" x="2028.5" y="311">長を最小にする</text></g></g><g class="flow-edge unknown" data-edge="purpose:unknown:check"><title>わからない</title><path d="M1384.819 182 V194 C1384.819 226 2239.5 226 2239.5 258 V270"/><path d="M2239.5 308 V356 C2239.5 388 2278 388 2278 420 V432 V611 C2278 643 1893 643 1893 675 V687 V737 C1893 769 1798.5 769 1798.5 801 V813 V975 C1798.5 1007 1798.5 1007 1798.5 1039 V1051 V1101 C1798.5 1133 1728 1133 1728 1165 V1177" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label="purpose:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2195" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="2239.5" y="293">わからない</text></g></g><g class="flow-node question" data-node="lower"><rect x="396" y="432" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="452">質問</text><text class="node-title" x="412" y="480">各辺に流量の下限がありますか？</text><text class="node-explanation" x="412" y="507">容量の上限だけではなく、最低何単位流すかが指定さ</text><text class="node-explanation" x="412" y="525">れます。</text></g><g class="flow-node question" data-node="cost"><rect x="1124" y="813" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="833">質問</text><text class="node-title" x="1140" y="861">流す量を満たした上で、辺の費用の合</text><text class="node-title" x="1140" y="884">計を最小にしますか？</text><text class="node-explanation" x="1140" y="911">何単位流すかと、一単位あたりのコストを分けて表し</text><text class="node-explanation" x="1140" y="929">ます。</text></g><g class="flow-node route" data-node="bipartite"><rect x="1124" y="1177" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="1197">分野</text><text class="node-title" x="1140" y="1225">対象の使用回数と二つへの分割</text><a href="/flowchartcp/flowcharts/#diagram-assignment-resource-usage" data-route="assignment-resource-usage"><text x="1140" y="1262">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1488" y="1177" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="1197">分野</text><text class="node-title" x="1504" y="1225">合法な割当と数量の対応</text><a href="/flowchartcp/flowcharts/#diagram-assignment-integer-representation" data-route="assignment-integer-representation"><text x="1504" y="1262">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="lower-result"><rect x="396" y="813" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="833">候補</text><text class="node-title" x="412" y="861">下限付きフロー</text><a href="/flowchartcp/techniques/lower-bound-flow/"><title>流量下限付きフローの記事へ</title><text x="412" y="900">流量下限付きフロー</text></a></g><g class="flow-node result" data-node="mincost"><rect x="760" y="1177" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="1197">候補</text><text class="node-title" x="776" y="1225">最小費用流</text><a href="/flowchartcp/techniques/min-cost-flow/"><title>最小費用流の記事へ</title><text x="776" y="1264">最小費用流</text></a></g><g class="flow-node question" data-node="purpose"><rect x="1100.375" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1116.375" y="52">質問</text><text class="node-title" x="1116.375" y="80">対応や割当について、どの条件の答え</text><text class="node-title" x="1116.375" y="103">を求めますか？</text><text class="node-explanation" x="1116.375" y="130">一つの組を選ぶと何を消費するか、必ず使う対象があ</text><text class="node-explanation" x="1116.375" y="148">るか、個数と費用のどちらが目的かを確認します。</text></g><g class="flow-node route" data-node="matrix-route"><rect x="32" y="432" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="452">分野</text><text class="node-title" x="48" y="480">下限のある整数表の復元</text><a href="/flowchartcp/flowcharts/#diagram-matrix-margins" data-route="matrix-margins"><text x="48" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="gift-balance-route"><rect x="816" y="432" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="452">分野</text><text class="node-title" x="832" y="480">受取個数の差を小さくする割当</text><a href="/flowchartcp/flowcharts/#diagram-gift-receive-balance" data-route="gift-receive-balance"><text x="832" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="median-rounds-route"><rect x="1180" y="432" width="320" height="144" rx="7"/><text class="node-kind" x="1196" y="452">分野</text><text class="node-title" x="1196" y="480">各色から毎回一枚ずつ選び、中央値へ</text><text class="node-title" x="1196" y="503">の絶対差和の合計を最大にする</text><a href="/flowchartcp/flowcharts/#diagram-median-ticket-round-conditions" data-route="median-ticket-round-conditions"><text x="1196" y="540">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="two-source-mixture-route"><rect x="1544" y="432" width="320" height="167" rx="7"/><text class="node-kind" x="1560" y="452">分野</text><text class="node-title" x="1560" y="480">二つの始点から二種類を送り、容量を</text><text class="node-title" x="1560" y="503">共有して到着量の幾何平均を最大にす</text><text class="node-title" x="1560" y="526">る</text><a href="/flowchartcp/flowcharts/#diagram-two-source-mixture-conditions" data-route="two-source-mixture-conditions"><text x="1560" y="563">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="line-point-cover-route"><rect x="1908" y="432" width="320" height="144" rx="7"/><text class="node-kind" x="1924" y="452">分野</text><text class="node-title" x="1924" y="480">直線上の二色の全点へ線を接続し、総</text><text class="node-title" x="1924" y="503">長を最小にする</text><a href="/flowchartcp/flowcharts/#diagram-line-bichromatic-cover-conditions" data-route="line-bichromatic-cover-conditions"><text x="1924" y="540">詳細の質問・図へ →</text></a></g></svg>