<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-assignment-quantity-goals flow-desc-assignment-quantity-goals" width="2316" height="1336" viewBox="0 0 2316 1336" data-flow-svg="assignment-quantity-goals"><title id="flow-title-assignment-quantity-goals">割当数量・費用と受取個数の条件の解法フローチャート</title><desc id="flow-desc-assignment-quantity-goals">行列の合計と各項の範囲、数量の上下限、費用、受取個数の差を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-assignment-quantity-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="lower:yes:lower-result"><title>はい</title><path d="M476 559 V611 C476 643 556 643 556 675 V687"/><path d="M556 725 V737 C556 769 556 769 556 801 V813" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label="lower:yes:lower-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="687" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="710">はい</text></g></g><g class="flow-edge no" data-edge="lower:no:cost"><title>いいえ</title><path d="M556 559 V611 C556 643 1284 643 1284 675 V687"/><path d="M1284 725 V737 C1284 769 1230.667 769 1230.667 801 V813" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label="lower:no:cost" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1244" y="687" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="710">いいえ</text></g></g><g class="flow-edge unknown" data-edge="lower:unknown:check"><title>わからない</title><path d="M636 559 V611 C636 643 1742.5 643 1742.5 675 V687"/><path d="M1742.5 725 V737 C1742.5 769 1742.5 769 1742.5 801 V813 V975 C1742.5 1007 1742.5 1007 1742.5 1039 V1051 V1101 C1742.5 1133 1648 1133 1648 1165 V1177" marker-end="url(#arrow-assignment-quantity-goals)"/><g class="flow-edge-label" data-edge-label