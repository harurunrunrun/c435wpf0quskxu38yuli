<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dp-choice-limits flow-desc-dp-choice-limits" width="2008" height="1290" viewBox="0 0 2008 1290" data-flow-svg="dp-choice-limits"><title id="flow-title-dp-choice-limits">要素や位置を選ぶときの個数・合計・報酬の解法フローチャート</title><desc id="flow-desc-dp-choice-limits">選ぶ対象の個数・合計の制約と、選択した位置から得る報酬を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dp-choice-limits" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge small-set" data-edge="defined:small-set:state-route"><title>少数の要素を、それぞれ一回だけ選ぶ</title><path d="M930.286 141 V153 C930.286 185 154.5 185 154.5 217 V229"/><path d="M154.5 267 V297 C154.5 329 38 329 38 361 V373 V535 C38 567 38 567 38 599 V611 V679 C38 711 38 711 38 743 V755 V917 C38 949 581.25 949 581.25 981 V993 V1043 C581.25 1075 485.25 1075 485.25 1107 V1119" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="defined:small-set:state-route" tabindex="0" role="group" aria-label="選択肢：少数の要素を、それぞれ一回だけ選ぶ"><rect x="32" y="229" width="245" height="38" rx="5"/><text text-anchor="middle" x="154.5" y="252">少数の要素を、それぞれ一回だけ選ぶ</text></g></g><g class="flow-edge capacity" data-edge="defined:capacity:capacity-purpose"><title>重さ・価値・個数に上限がある</title><path d="M970.286 141 V153 C970.286 185 424 185 424 217 V229"/><path d="M424 267 V297 C424 329 304 329 304 361 V373" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="defined:capacity:capacity-purpose" tabindex="0" role="group" aria-label="選択肢：重さ・価値・個数に上限がある"><rect x="321" y="229" width="206" height="38" rx="5"/><text text-anchor="middle" x="424" y="252">重さ・価値・個数に上限がある</text></g></g><g class="flow-edge fixed-count-selection" data-edge="defined:fixed-count-selection:fixed-selection-route"><title>ちょうど K 個を選び、価値と種類数・積などの値を最大にする</title><path d="M1010.286 141 V153 C1010.286 185 693.5 185 693.5 217 V229"/><path d="M693.5 285 V297 C693.5 329 668 329 668 361 V373" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="defined:fixed-count-selection:fixed-selection-route" tabindex="0" role="group" aria-label="選択肢：ちょうど K 個を選び、価値と種類数・積などの値を最大にする"><rect x="571" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="693.5" y="252">ちょうど K 個を選び、価値と種類</text><text text-anchor="middle" x="693.5" y="270">数・積などの値を最大にする</text></g></g><g class="flow-edge sum-selected-maximum" data-edge="defined:sum-selected-maximum:subset-limit-route"><title>非空集合で、一方の値の合計が選んだもう一方の最大値以下になる個数</title><path d="M1050.286 141 V153 C1050.286 185 1032 185 1032 217 V229"/><path d="M1032 285 V297 C1032 329 1032 329 1032 361 V373" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="defined:sum-selected-maximum:subset-limit-route" tabindex="0" role="group" aria-label="選択肢：非空集合で、一方の値の合計が選んだもう一方の最大値以下になる個数"><rect x="909.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1032" y="252">非空集合で、一方の値の合計が選んだ</text><text text-anchor="middle" x="1032" y="270">もう一方の最大値以下になる個数</text></g></g><g class="flow-edge all-segment-sums" data-edge="defined:all-segment-sums:all-segment-sums-route"><title>全ての位置区間で、内側から選ぶ部分集合の和が S になる個数の総和</title><path d="M1090.286 141 V153 C1090.286 185 1396 185 1396 217 V229"/><path d="M1396 285 V297 C1396 329 1396 329 1396 361 V373" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="defined:all-segment-sums:all-segment-sums-route" tabindex="0" role="group" aria-label="選択肢：全ての位置区間で、内側から選ぶ部分集合の和が S になる個数の総和"><rect x="1273.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1396" y="252">全ての位置区間で、内側から選ぶ部分</text><text text-anchor="middle" x="1396" y="270">集合の和が S になる個数の総和</text></g></g><g class="flow-edge interval-hit-score" data-edge="defined:interval-hit-score:interval-hit-route"><title>位置を選び、選択を一つ以上含む区間ごとの報酬を最大にする</title><path d="M1130.286 141 V153 C1130.286 185 1720.5 185 1720.5 217 V229"/><path d="M1720.5 285 V297 C1720.5 329 1760 329 1760 361 V373" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="defined:interval-hit-score:interval-hit-route" tabindex="0" role="group" aria-label="選択肢：位置を選び、選択を一つ以上含む区間ごとの報酬を最大にする"><rect x="1598" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1720.5" y="252">位置を選び、選択を一つ以上含む区間</text><text text-anchor="middle" x="1720.5" y="270">ごとの報酬を最大にする</text></g></g><g class="flow-edge unknown" data-edge="defined:unknown:check"><title>わからない</title><path d="M1170.286 141 V153 C1170.286 185 1931.5 185 1931.5 217 V229"/><path d="M1931.5 267 V297 C1931.5 329 1970 329 1970 361 V373 V535 C1970 567 1935 567 1935 599 V611 V679 C1935 711 1869.333 711 1869.333 743 V755" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="defined:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1887" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1931.5" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:state-route"><title>はい</title><path d="M1736 905 V917 C1736 949 783.25 949 783.25 981 V993"/><path d="M783.25 1031 V1043 C783.25 1075 677.25 1075 677.25 1107 V1119" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="check:yes:state-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743.25" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="783.25" y="1016">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1816 905 V917 C1816 949 1803 949 1803 981 V993"/><path d="M1803 1031 V1043 C1803 1075 1762.667 1075 1762.667 1107 V1119" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1763" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="1803" y="1016">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1896 905 V917 C1896 949 1931.5 949 1931.5 981 V993"/><path d="M1931.5 1031 V1043 C1931.5 1075 1869.333 1075 1869.333 1107 V1119" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1887" y="993" width="89" height="38" rx="5"/><text text-anchor="middle" x="1931.5" y="1016">わからない</text></g></g><g class="flow-edge total" data-edge="capacity-purpose:total:state-route"><title>重さ・価値・個数の合計ごとの可否や最適値</title><path d="M184 523 V535 C184 567 210.5 567 210.5 599 V611"/><path d="M210.5 667 V679 C210.5 711 94 711 94 743 V755 V917 C94 949 637.25 949 637.25 981 V993 V1043 C637.25 1075 549.25 1075 549.25 1107 V1119" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="capacity-purpose:total:state-route" tabindex="0" role="group" aria-label="選択肢：重さ・価値・個数の合計ごとの可否や最適値"><rect x="88" y="611" width="245" height="56" rx="5"/><text text-anchor="middle" x="210.5" y="634">重さ・価値・個数の合計ごとの可否や</text><text text-anchor="middle" x="210.5" y="652">最適値</text></g></g><g class="flow-edge bins" data-edge="capacity-purpose:bins:bins-route"><title>全品物を同じ容量の箱へ詰め、箱数を最小にする</title><path d="M224 523 V535 C224 567 499.5 567 499.5 599 V611"/><path d="M499.5 667 V679 C499.5 711 304 711 304 743 V755" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="capacity-purpose:bins:bins-route" tabindex="0" role="group" aria-label="選択肢：全品物を同じ容量の箱へ詰め、箱数を最小にする"><rect x="377" y="611" width="245" height="56" rx="5"/><text text-anchor="middle" x="499.5" y="634">全品物を同じ容量の箱へ詰め、箱数を</text><text text-anchor="middle" x="499.5" y="652">最小にする</text></g></g><g class="flow-edge other" data-edge="capacity-purpose:other:state-route"><title>その他の上限や、残す履歴の条件</title><path d="M264 523 V535 C264 567 775.5 567 775.5 599 V611"/><path d="M775.5 649 V679 C775.5 711 514 711 514 743 V755 V917 C514 949 693.25 949 693.25 981 V993 V1043 C693.25 1075 613.25 1075 613.25 1107 V1119" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="capacity-purpose:other:state-route" tabindex="0" role="group" aria-label="選択肢：その他の上限や、残す履歴の条件"><rect x="666" y="611" width="219" height="38" rx="5"/><text text-anchor="middle" x="775.5" y="634">その他の上限や、残す履歴の条件</text></g></g><g class="flow-edge ratio" data-edge="capacity-purpose:ratio:ratio-route"><title>重量の合計を下限以上にして、才能・価値の合計との比率を最大にする</title><path d="M304 523 V535 C304 567 1051.5 567 1051.5 599 V611"/><path d="M1051.5 667 V679 C1051.5 711 724 711 724 743 V755" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="capacity-purpose:ratio:ratio-route" tabindex="0" role="group" aria-label="選択肢：重量の合計を下限以上にして、才能・価値の合計との比率を最大にする"><rect x="929" y="611" width="245" height="56" rx="5"/><text text-anchor="middle" x="1051.5" y="634">重量の合計を下限以上にして、才能・</text><text text-anchor="middle" x="1051.5" y="652">価値の合計との比率を最大にする</text></g></g><g class="flow-edge dynamic-count" data-edge="capacity-purpose:dynamic-count:dynamic-count-route"><title>品物を一つ追加・削除するたび、合計 K の選び方の個数を答える</title><path d="M344 523 V535 C344 567 1340.5 567 1340.5 599 V611"/><path d="M1340.5 667 V679 C1340.5 711 1088 711 1088 743 V755" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="capacity-purpose:dynamic-count:dynamic-count-route" tabindex="0" role="group" aria-label="選択肢：品物を一つ追加・削除するたび、合計 K の選び方の個数を答える"><rect x="1218" y="611" width="245" height="56" rx="5"/><text text-anchor="middle" x="1340.5" y="634">品物を一つ追加・削除するたび、合計</text><text text-anchor="middle" x="1340.5" y="652"> K の選び方の個数を答える</text></g></g><g class="flow-edge color-bonus" data-edge="capacity-purpose:color-bonus:color-bonus-route"><title>予算内で、価値和と使った種類ごとの加点を最大にする</title><path d="M384 523 V535 C384 567 1629.5 567 1629.5 599 V611"/><path d="M1629.5 667 V679 C1629.5 711 1452 711 1452 743 V755" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="capacity-purpose:color-bonus:color-bonus-route" tabindex="0" role="group" aria-label="選択肢：予算内で、価値和と使った種類ごとの加点を最大にする"><rect x="1507" y="611" width="245" height="56" rx="5"/><text text-anchor="middle" x="1629.5" y="634">予算内で、価値和と使った種類ごとの</text><text text-anchor="middle" x="1629.5" y="652">加点を最大にする</text></g></g><g class="flow-edge unknown" data-edge="capacity-purpose:unknown:check"><title>わからない</title><path d="M424 523 V535 C424 567 1840.5 567 1840.5 599 V611"/><path d="M1840.5 649 V679 C1840.5 711 1762.667 711 1762.667 743 V755" marker-end="url(#arrow-dp-choice-limits)"/><g class="flow-edge-label" data-edge-label="capacity-purpose:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1796" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="1840.5" y="634">わからない</text></g></g><g class="flow-node question" data-node="defined"><rect x="890.2857142857142" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="906.2857142857142" y="52">質問</text><text class="node-title" x="906.2857142857142" y="80">選び方や分け方の特徴はどれですか？</text><text class="node-explanation" x="906.2857142857142" y="107">入力の上限と、求める制約から探します。</text></g><g class="flow-node question" data-node="check"><rect x="1656" y="755" width="320" height="150" rx="7"/><text class="node-kind" x="1672" y="775">質問</text><text class="node-title" x="1672" y="803">小さい入力で、全状態と遷移を列挙で</text><text class="node-title" x="1672" y="826">きますか？</text><text class="node-explanation" x="1672" y="853">列挙した表で状態の重複と、どこに時間がかかるかを</text><text class="node-explanation" x="1672" y="871">確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1656" y="1119" width="320" height="139" rx="7"/><text class="node-kind" x="1672" y="1139">分野</text><text class="node-title" x="1672" y="1167">条件を確かめる</text><text class="node-explanation" x="1672" y="1194">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1672" y="1222">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="state-route"><rect x="421.25" y="1119" width="320" height="121" rx="7"/><text class="node-kind" x="437.25" y="1139">分野</text><text class="node-title" x="437.25" y="1167">選ぶ数・重さ・残す履歴</text><a href="/flowchartcp/flowcharts/#diagram-dp-state" data-route="dp-state"><text x="437.25" y="1204">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="capacity-purpose"><rect x="144" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="160" y="393">質問</text><text class="node-title" x="160" y="421">上限のある品物の処理で、何を求めま</text><text class="node-title" x="160" y="444">すか？</text><text class="node-explanation" x="160" y="471">一つの合計値での可否・価値と、全品物を複数の同容</text><text class="node-explanation" x="160" y="489">量の箱へ詰める問題を分けます。</text></g><g class="flow-node route" data-node="bins-route"><rect x="144" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="160" y="775">分野</text><text class="node-title" x="160" y="803">全品物を同じ容量の箱へ詰める</text><a href="/flowchartcp/flowcharts/#diagram-subset-bin-count" data-route="subset-bin-count"><text x="160" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="fixed-selection-route"><rect x="508" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="393">分野</text><text class="node-title" x="524" y="421">選ぶ個数が固定された目的値</text><a href="/flowchartcp/flowcharts/#diagram-fixed-count-objective" data-route="fixed-count-objective"><text x="524" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="subset-limit-route"><rect x="872" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="888" y="393">分野</text><text class="node-title" x="888" y="421">合計が選択中の最大値以下になる集合</text><text class="node-title" x="888" y="444">数</text><a href="/flowchartcp/flowcharts/#diagram-subset-sum-selected-maximum" data-route="subset-sum-selected-maximum"><text x="888" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="ratio-route"><rect x="564" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="775">分野</text><text class="node-title" x="580" y="803">重量の下限がある選択の比率</text><a href="/flowchartcp/flowcharts/#diagram-minimum-weight-ratio" data-route="minimum-weight-ratio"><text x="580" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="dynamic-count-route"><rect x="928" y="755" width="320" height="144" rx="7"/><text class="node-kind" x="944" y="775">分野</text><text class="node-title" x="944" y="803">一品物の追加と削除で、合計ごとの個</text><text class="node-title" x="944" y="826">数を更新する</text><a href="/flowchartcp/flowcharts/#diagram-subset-sum-dynamic-count" data-route="subset-sum-dynamic-count"><text x="944" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="color-bonus-route"><rect x="1292" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="1308" y="775">分野</text><text class="node-title" x="1308" y="803">一種類を初めて選んだときだけの加点</text><a href="/flowchartcp/flowcharts/#diagram-knapsack-color-first-bonus" data-route="knapsack-color-first-bonus"><text x="1308" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="all-segment-sums-route"><rect x="1236" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1252" y="393">分野</text><text class="node-title" x="1252" y="421">全ての区間の開始と終端をまとめて数</text><text class="node-title" x="1252" y="444">える</text><a href="/flowchartcp/flowcharts/#diagram-all-segment-subset-count" data-route="all-segment-subset-count"><text x="1252" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="interval-hit-route"><rect x="1600" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1616" y="393">分野</text><text class="node-title" x="1616" y="421">最後に選んだ位置と、右端ごとの報酬</text><a href="/flowchartcp/flowcharts/#diagram-interval-hit-selection-score" data-route="interval-hit-selection-score"><text x="1616" y="458">詳細の質問・図へ →</text></a></g></svg>