わからない</title><path d="M581.167 905 V917 C581.167 949 755.5 949 755.5 981 V993"/><path d="M755.5 1031 V1043 C755.5 1075 840 1075 840 1107 V1119" marker-end="url(#arrow-weighted-distance-all-roots)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="993" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1016">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1251 V1299 C840 1331 783 1331 783 1363 V1375"/><path d="M783 1413 V1425 C783 1457 828.5 1457 828.5 1489 V1501" marker-end="url(#arrow-weighted-distance-all-roots)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1375" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1398">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1251 V1299 C920 1331 907 1331 907 1363 V1375"/><path d="M907 1413 V1425 C907 1457 908.5 1457 908.5 1489 V1501" marker-end="url(#arrow-weighted-distance-all-roots)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1375" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1398">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1251 V1299 C1000 1331 1035.5 1331 1035.5 1363 V1375"/><path d="M1035.5 1413 V1425 C1035.5 1457 988.5 1457 988.5 1489 V1501" marker-end="url(#arrow-weighted-distance-all-roots)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1375" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1398">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="524.875" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="540.875" y="52">質問</text><text class="node-title" x="540.875" y="80">距離から求める量は、どの形ですか？</text><text class="node-explanation" x="540.875" y="107">需要を掛けた総和か、距離の最大かを区別します。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="558.5555555555557" y="393">質問</text><text class="node-title" x="558.5555555555557" y="421">固定された無向木で、辺の長さは非負</text><text class="node-title" x="558.5555555555557" y="444">ですか？</text><text class="node-explanation" x="558.5555555555557" y="471">木では一辺を切ると二つの側に分かれ、隣へ移動した</text><text class="node-explanation" x="558.5555555555557" y="489">距離の増減がその側だけで決まります。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="737" width="320" height="168" rx="7"/><text class="node-kind" x="357.1666666666667" y="757">質問</text><text class="node-title" x="357.1666666666667" y="785">一辺の子側の需要和と、全体の需要和</text><text class="node-title" x="357.1666666666667" y="808">を求められますか？</text><text class="node-explanation" x="357.1666666666667" y="835">辺長を w とすると、親から子へ基準を移した差は</text><text class="node-explanation" x="357.1666666666667" y="853"> w×(全需要−2×子側需要) です。値域に応じ</text><text class="node-explanation" x="357.1666666666667" y="871">て広い整数型を使います。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1119" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1139">候補</text><text class="node-title" x="48" y="1167">隣の頂点へ基準を移し、片側の需要だ</text><text class="node-title" x="48" y="1190">けから距離和を更新する</text><a href="/flowchartcp/techniques/weighted-tree-distance-reroot/"><title>木で需要重みを掛けた距離の和は、隣へ動いた差だけで全始点を求めるの記事へ</title><text x="48" y="1229">木で需要重みを掛けた距離の和は、隣へ動いた差だ</text><text x="48" y="1247">けで全始点を求める</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1119" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1139">候補</text><text class="node-title" x="412" y="1167">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1206">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1230">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1119" width="320" height="132" rx="7"/><text class="node-kind" x="776" y="1139">質問</text><text class="node-title" x="776" y="1167">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1190">書き出せますか？</text><text class="node-explanation" x="776" y="1217">需要を掛けた総和か、距離の最大かを区別します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1501" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1521">分野</text><text class="node-title" x="764.5" y="1549">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1586">詳細の質問・図へ →</text></a></g></svg>