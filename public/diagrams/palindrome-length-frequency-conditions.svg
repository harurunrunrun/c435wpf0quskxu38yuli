<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-palindrome-length-frequency-conditions flow-desc-palindrome-length-frequency-conditions" width="748" height="1388" viewBox="0 0 748 1388" data-flow-svg="palindrome-length-frequency-conditions"><title id="flow-title-palindrome-length-frequency-conditions">回文の長さと出現回数の積の解法フローチャート</title><desc id="flow-desc-palindrome-length-frequency-conditions">固定された本文、出現の重なり、文字集合の条件を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-palindrome-length-frequency-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="static:yes:overlap"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-palindrome-length-frequency-conditions)"/><g class="flow-edge-label" data-edge-label="static:yes:overlap" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="static:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V599 C654 631 654 631 654 663 V675 V725 C654 757 654 757 654 789 V801 V986 C654 1018 654 1018 654 1050 V1062 V1112 C654 1144 624.571 1144 624.571 1176 V1188" marker-end="url(#arrow-palindrome-length-frequency-conditions)"/><g class="flow-edge-label" data-edge-label="static:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="static:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V599 C710 631 710 631 710 663 V675 V725 C710 757 710 757 710 789 V801 V986 C710 1018 710 1018 710 1050 V1062 V1112 C710 1144 670.286 1144 670.286 1176 V1188" marker-end="url(#arrow-palindrome-length-frequency-conditions)"/><g class="flow-edge-label" data-edge-label="static:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="overlap:yes:alphabet"><title>はい</title><path d="M352.5 587 V599 C352.5 631 307 631 307 663 V675"/><path d="M307 713 V725 C307 757 319.5 757 319.5 789 V801" marker-end="url(#arrow-palindrome-length-frequency-conditions)"/><g class="flow-edge-label" data-edge-label="overlap:yes:alphabet" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="698">はい</text></g></g><g class="flow-edge no" data-edge="overlap:no:check"><title>いいえ</title><path d="M432.5 587 V599 C432.5 631 431 631 431 663 V675"/><path d="M431 713 V725 C431 757 542 757 542 789 V801 V986 C542 1018 542 1018 542 1050 V1062 V1112 C542 1144 533.143 1144 533.143 1176 V1188" marker-end="url(#arrow-palindrome-length-frequency-conditions)"/><g class="flow-edge-label" data-edge-label="overlap:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="overlap:unknown:check"><title>わからない</title><path d="M512.5 587 V599 C512.5 631 559.5 631 559.5 663 V675"/><path d="M559.5 713 V725 C559.5 757 598 757 598 789 V801 V986 C598 1018 598 1018 598 1050 V1062 V1112 C598 1144 578.857 1144 578.857 1176 V1188" marker-end="url(#arrow-palindrome-length-frequency-conditions)"/><g class="flow-edge-label" data-edge-label="overlap:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="alphabet:yes:answer"><title>はい</title><path d="M239.5 974 V986 C239.5 1018 192 1018 192 1050 V1062"/><path d="M192 1100 V1112 C192 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-palindrome-length-frequency-conditions)"/><g class="flow-edge-label" data-edge-label="alphabet:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="alphabet:no:check"><title>いいえ</title><path d="M319.5 974 V986 C319.5 1018 319 1018 319 1050 V1062"/><path d="M319 1100 V1112 C319 1144 441.714 1144 441.714 1176 V1188" marker-end="url(#arrow-palindrome-length-frequency-conditions)"/><g class="flow-edge-label" data-edge-label="alphabet:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="alphabet:unknown:check"><title>わからない</title><path d="M399.5 974 V986 C399.5 1018 447.5 1018 447.5 1050 V1062"/><path d="M447.5 1100 V1112 C447.5 1144 487.429 1144 487.429 1176 V1188" marker-end="url(#arrow-palindrome-length-frequency-conditions)"/><g class="flow-edge-label" data-edge-label="alphabet:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1085">わからない</text></g></g><g class="flow-node question" data-node="static"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">文字を変更せず、本文全体から一種類</text><text class="node-title" x="400.5" y="103">の非空回文を選びますか？</text><text class="node-explanation" x="400.5" y="130">一つの本文の全出現を集めます。区間を指定した出現</text><text class="node-explanation" x="400.5" y="148">回数や更新後の再計算は別に扱います。</text></g><g class="flow-node question" data-node="overlap"><rect x="272.5" y="396" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">出現位置が重なっていても全て数え、</text><text class="node-title" x="288.5" y="467">長さと出現回数の積を最大にします</text><text class="node-title" x="288.5" y="490">か？</text><text class="node-explanation" x="288.5" y="517">長い回文だけでは最適とは限りません。最長の回文接</text><text class="node-explanation" x="288.5" y="535">尾辞に印を付けてから、短い回文にも出現を伝えま</text><text class="node-explanation" x="288.5" y="553">す。</text></g><g class="flow-node question" data-node="alphabet"><rect x="159.5" y="801" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="821">質問</text><text class="node-title" x="175.5" y="849">文字集合は英小文字など固定した少数</text><text class="node-title" x="175.5" y="872">で、文字数に比例する表を保存できま</text><text class="node-title" x="175.5" y="895">すか？</text><text class="node-explanation" x="175.5" y="922">掲載実装は英小文字26種類です。異なる回文は文字</text><text class="node-explanation" x="175.5" y="940">数以下の頂点にまとめられます。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">各末尾の最長回文に印を付け、接尾辞</text><text class="node-title" x="48" y="1259">リンクへ出現回数を集める</text><a href="/flowchartcp/techniques/eertree-palindrome-length-frequency/"><title>回文の長さと出現回数の積は、各末尾の最長回文に印を付けて求めるの記事へ</title><text x="48" y="1298">回文の長さと出現回数の積は、各末尾の最長回文に</text><text x="48" y="1316">印を付けて求める</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1188" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1208">分野</text><text class="node-title" x="412" y="1236">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1273">詳細の質問・図へ →</text></a></g></svg>