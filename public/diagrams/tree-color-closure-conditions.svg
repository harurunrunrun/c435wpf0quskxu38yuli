98 1355 V1367 V1417 C598 1449 609.333 1449 609.333 1481 V1493" marker-end="url(#arrow-tree-color-closure-conditions)"/><g class="flow-edge-label" data-edge-label="whole-color:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="616" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="639">わからない</text></g></g><g class="flow-edge yes" data-edge="one-connected:yes:size"><title>はい</title><path d="M240.5 892 V904 C240.5 936 195 936 195 968 V980"/><path d="M195 1018 V1030 C195 1062 208.5 1062 208.5 1094 V1106" marker-end="url(#arrow-tree-color-closure-conditions)"/><g class="flow-edge-label" data-edge-label="one-connected:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="155" y="980" width="80" height="38" rx="5"/><text text-anchor="middle" x="195" y="1003">はい</text></g></g><g class="flow-edge no" data-edge="one-connected:no:check"><title>いいえ</title><path d="M320.5 892 V904 C320.5 936 319 936 319 968 V980"/><path d="M319 1018 V1030 C319 1062 430 1062 430 1094 V1106 V1291 C430 1323 430 1323 430 1355 V1367 V1417 C430 1449 502.667 1449 502.667 1481 V1493" marker-end="url(#arrow-tree-color-closure-conditions)"/><g class="flow-edge-label" data-edge-label="one-connected:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="980" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1003">いいえ</text></g></g><g class="flow-edge unknown" data-edge="one-connected:unknown:check"><title>わからない</title><path d="M400.5 892 V904 C400.5 936 447.5 936 447.5 968 V980"/><path d="M447.5 1018 V1030 C447.5 1062 486 1062 486 1094 V1106 V1291 C486 1323 486 1323 486 1355 V1367 V1417 C486 1449 538.222 1449 538.222 1481 V1493" marker-end="url(#arrow-tree-color-closure-conditions)"/><g class="flow-edge-label" data-edge-label="one-connected:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="980" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1003">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M128.5 1279 V1291 C128.5 1323 83 1323 83 1355 V1367"/><path d="M83 1405 V1417 C83 1449 192 1449 192 1481 V1493" marker-end="url(#arrow-tree-color-closure-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="43" y="1367" width="80" height="38" rx="5"/><text text-anchor="middle" x="83" y="1390">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M208.5 1279 V1291 C208.5 1323 207 1323 207 1355 V1367"/><path d="M207 1405 V1417 C207 1449 431.556 1449 431.556 1481 V1493" marker-end="url(#arrow-tree-color-closure-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="167" y="1367" width="80" height="38" rx="5"/><text text-anchor="middle" x="207" y="1390">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M288.5 1279 V1291 C288.5 1323 335.5 1323 335.5 1355 V1367"/><path d="M335.5 1405 V1417 C335.5 1449 467.111 1449 467.111 1481 V1493" marker-end="url(#arrow-tree-color-closure-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="291" y="1367" width="89" height="38" rx="5"/><text text-anchor="middle" x="335.5" y="1390">わからない</text></g></g><g class="flow-node question" data-node="tree"><rect x="384.5" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">元のグラフは、連結で閉路のない無向</text><text class="node-title" x="400.5" y="103">の木ですか？</text><text class="node-explanation" x="400.5" y="130">二頂点の間の経路が一意であることを使います。</text></g><g class="flow-node question" data-node="whole-color"><rect x="272.5" y="378" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="398">質問</text><text class="node-title" x="288.5" y="426">任意の二色を選び、一方の全頂点をも</text><text class="node-title" x="288.5" y="449">う一方へ同じ費用で併合できますか？</text><text class="node-explanation" x="288.5" y="476">元の色に含まれる頂点を全てまとめて取り込む必要が</text><text class="node-explanation" x="288.5" y="494">あります。</text></g><g class="flow-node question" data-node="one-connected"><rect x="160.5" y="742" width="320" height="150" rx="7"/><text class="node-kind" x="176.5" y="762">質問</text><text class="node-title" x="176.5" y="790">どれか一色の全頂点を連結にする最少</text><text class="node-title" x="176.5" y="813">併合回数を求めますか？</text><text class="node-explanation" x="176.5" y="840">全色をそれぞれ連結にする条件や、接続したい特定の</text><text class="node-explanation" x="176.5" y="858">色が決まっている場合は目的が変わります。</text></g><g class="flow-node question" data-node="size"><rect x="48.5" y="1106" width="320" height="173" rx="7"/><text class="node-kind" x="64.5" y="1126">質問</text><text class="node-title" x="64.5" y="1154">頂点数は1以上20万以下で、番号を</text><text class="node-title" x="64.5" y="1177">付けた全ての色が少なくとも一度現れ</text><text class="node-title" x="64.5" y="1200">ますか？</text><text class="node-explanation" x="64.5" y="1227">掲載実装の条件です。補助頂点を色数に含めず、区間</text><text class="node-explanation" x="64.5" y="1245">辺を含むグラフ全体の終端を調べます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1493" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1513">候補</text><text class="node-title" x="48" y="1541">同色を結ぶパス上の色へ依存を張り、</text><text class="node-title" x="48" y="1564">外へ依存しない最小の成分を選ぶ</text><a href="/flowchartcp/techniques/tree-color-closure-sink-scc/"><title>木の同色頂点をつなぐとき、途中で必要になる色もまとめて選ぶの記事へ</title><text x="48" y="1603">木の同色頂点をつなぐとき、途中で必要になる色も</text><text x="48" y="1621">まとめて選ぶ</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1493" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1513">分野</text><text class="node-title" x="412" y="1541">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1578">詳細の質問・図へ →</text></a></g></svg>