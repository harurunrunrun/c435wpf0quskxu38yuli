<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dag-edge-removal-expectation flow-desc-dag-edge-removal-expectation" width="1112" height="1809" viewBox="0 0 1112 1809" data-flow-svg="dag-edge-removal-expectation"><title id="flow-title-dag-edge-removal-expectation">確率的な前進から一辺だけ除くなら、到達確率と局所的な改善を掛けるの解法フローチャート</title><desc id="flow-desc-dag-edge-removal-expectation">閉路、行き先の確率、終点以外の行き止まり、削除できる辺数を確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dag-edge-removal-expectation" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge uniform-dag" data-edge="model:uniform-dag:assumptions"><title>有向非巡回グラフで行き先を一様に選び、一辺まで削除して終点への期待手数を最小にする</title><path d="M725 182 V194 C725 226 548.5 226 548.5 258 V270"/><path d="M548.5 344 V356 C548.5 388 746.111 388 746.111 420 V432" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="model:uniform-dag:assumptions" tabindex="0" role="group" aria-label="選択肢：有向非巡回グラフで行き先を一様に選び、一辺まで削除して終点への期待手数を最小にする"><rect x="426" y="270" width="245" height="74" rx="5"/><text text-anchor="middle" x="548.5" y="293">有向非巡回グラフで行き先を一様に選</text><text text-anchor="middle" x="548.5" y="311">び、一辺まで削除して終点への期待手</text><text text-anchor="middle" x="548.5" y="329">数を最小にする</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>閉路がある、遷移確率が辺ごとに違う、または複数の辺を同時に消す</title><path d="M805 182 V194 C805 226 831 226 831 258 V270"/><path d="M831 326 V356 C831 388 1018 388 1018 420 V432 V635 C1018 667 1018 667 1018 699 V711 V761 C1018 793 1018 793 1018 825 V837 V999 C1018 1031 1018 1031 1018 1063 V1075 V1125 C1018 1157 636 1157 636 1189 V1201" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：閉路がある、遷移確率が辺ごとに違う、または複数の辺を同時に消す"><rect x="715" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="831" y="293">閉路がある、遷移確率が辺ごとに違</text><text text-anchor="middle" x="831" y="311">う、または複数の辺を同時に消す</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M885 182 V194 C885 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V356 C1035.5 388 1074 388 1074 420 V432 V635 C1074 667 1074 667 1074 699 V711 V761 C1074 793 1074 793 1074 825 V837 V999 C1074 1031 1074 1031 1074 1063 V1075 V1125 C1074 1157 1000 1157 1000 1189 V1201" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 623 V635 C666.111 667 519.833 667 519.833 699 V711"/><path d="M519.833 749 V761 C519.833 793 519.833 793 519.833 825 V837" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="711" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="734">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 623 V635 C746.111 667 795 667 795 699 V711"/><path d="M795 749 V761 C795 793 906 793 906 825 V837 V999 C906 1031 906 1031 906 1063 V1075 V1125 C906 1157 556 1157 556 1189 V1201" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="711" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="734">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"><title>わからない</title><path d="M826.111 623 V635 C826.111 667 923.5 667 923.5 699 V711"/><path d="M923.5 749 V761 C923.5 793 962 793 962 825 V837 V999 C962 1031 962 1031 962 1063 V1075 V1125 C962 1157 920 1157 920 1189 V1201" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="assumptions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="711" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="734">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M439.833 987 V999 C439.833 1031 192 1031 192 1063 V1075"/><path d="M192 1113 V1125 C192 1157 192 1157 192 1189 V1201" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M519.833 987 V999 C519.833 1031 556 1031 556 1063 V1075"/><path d="M556 1113 V1125 C556 1157 476 1157 476 1189 V1201" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M599.833 987 V999 C599.833 1031 811.5 1031 811.5 1063 V1075"/><path d="M811.5 1113 V1125 C811.5 1157 840 1157 840 1189 V1201" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="767" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1098">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1351 V1418 C840 1450 783 1450 783 1482 V1494"/><path d="M783 1532 V1544 C783 1576 828.5 1576 828.5 1608 V1620" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1494" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1517">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1351 V1418 C920 1450 907 1450 907 1482 V1494"/><path d="M907 1532 V1544 C907 1576 908.5 1576 908.5 1608 V1620" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1494" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1517">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1351 V1418 C1000 1450 1035.5 1450 1035.5 1482 V1494"/><path d="M1035.5 1532 V1544 C1035.5 1576 988.5 1576 988.5 1608 V1620" marker-end="url(#arrow-dag-edge-removal-expectation)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1494" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1517">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="645" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="661" y="52">質問</text><text class="node-title" x="661" y="80">ランダムな操作と終了の規則はどれで</text><text class="node-title" x="661" y="103">すか？</text><text class="node-explanation" x="661" y="130">閉路、行き先の確率、終点以外の行き止まり、削除で</text><text class="node-explanation" x="661" y="148">きる辺数を確かめます。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="432" width="320" height="191" rx="7"/><text class="node-kind" x="602.1111111111112" y="452">質問</text><text class="node-title" x="602.1111111111112" y="480">変更前後とも終点まで進め、削除後も</text><text class="node-title" x="602.1111111111112" y="503">各非終点に出辺が一本以上残ります</text><text class="node-title" x="602.1111111111112" y="526">か？</text><text class="node-explanation" x="602.1111111111112" y="553">出次数 1 の頂点から唯一の辺を消すと停止規則が</text><text class="node-explanation" x="602.1111111111112" y="571">変わります。閉路や別の停止先をこの計算に混ぜませ</text><text class="node-explanation" x="602.1111111111112" y="589">ん。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="837" width="320" height="150" rx="7"/><text class="node-kind" x="375.83333333333337" y="857">質問</text><text class="node-title" x="375.83333333333337" y="885">一回の移動を一手と数え、削除は歩き</text><text class="node-title" x="375.83333333333337" y="908">始める前に高々一辺だけですか？</text><text class="node-explanation" x="375.83333333333337" y="935">非巡回なら頂点に着くまで、その頂点の出辺は使いま</text><text class="node-explanation" x="375.83333333333337" y="953">せん。変更は下流の到達後の期待値だけに現れます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1201" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1221">候補</text><text class="node-title" x="48" y="1249">確率的な前進から一辺だけ除くなら、</text><text class="node-title" x="48" y="1272">到達確率と局所的な改善を掛ける</text><a href="/flowchartcp/techniques/dag-edge-removal-expectation/"><title>確率的な前進から一辺だけ除くなら、到達確率と局所的な改善を掛けるの記事へ</title><text x="48" y="1311">確率的な前進から一辺だけ除くなら、到達確率と局</text><text x="48" y="1329">所的な改善を掛ける</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1201" width="320" height="205" rx="7"/><text class="node-kind" x="412" y="1221">候補</text><text class="node-title" x="412" y="1249">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1276">循環があると変更頂点を再訪し、到達確率も変更と結</text><text class="node-explanation" x="412" y="1294">び付きます。複数箇所の変更も局所改善の単純な和に</text><text class="node-explanation" x="412" y="1312">しません。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1342">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1366">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1201" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1221">質問</text><text class="node-title" x="776" y="1249">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1272">確認できますか？</text><text class="node-explanation" x="776" y="1299">閉路、行き先の確率、終点以外の行き止まり、削除で</text><text class="node-explanation" x="776" y="1317">きる辺数を確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1620" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1640">分野</text><text class="node-title" x="764.5" y="1668">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1695">閉路、行き先の確率、終点以外の行き止まり、削除で</text><text class="node-explanation" x="764.5" y="1713">きる辺数を確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1741">詳細の質問・図へ →</text></a></g></svg>