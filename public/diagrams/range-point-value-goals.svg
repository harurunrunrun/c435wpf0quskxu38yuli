<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-point-value-goals flow-desc-range-point-value-goals" width="1756" height="1737" viewBox="0 0 1756 1737" data-flow-svg="range-point-value-goals"><title id="flow-title-range-point-value-goals">一点の値変更と区間の答えの解法フローチャート</title><desc id="flow-desc-range-point-value-goals">和などの集計か、順位や頻度か、位置に応じて係数が変わる和かを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-point-value-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="add:yes:bit"><title>はい</title><path d="M295.5 523 V576 C295.5 608 192 608 192 640 V652"/><path d="M192 690 V720 C192 752 192 752 192 784 V796" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="add:yes:bit" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="675">はい</text></g></g><g class="flow-edge no" data-edge="add:no:assoc"><title>いいえ</title><path d="M375.5 523 V576 C375.5 608 403 608 403 640 V652"/><path d="M403 690 V720 C403 752 502.667 752 502.667 784 V796" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="add:no:assoc" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="363" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="403" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="add:unknown:check"><title>わからない</title><path d="M455.5 523 V576 C455.5 608 531.5 608 531.5 640 V652"/><path d="M531.5 690 V720 C531.5 752 766 752 766 784 V796 V1000 C766 1032 1494 1032 1494 1064 V1076 V1126 C1494 1158 1453.667 1158 1453.667 1190 V1202" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="add:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="487" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="531.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="assoc:yes:segment"><title>はい</title><path d="M476 946 V1000 C476 1032 556 1032 556 1064 V1076"/><path d="M556 1114 V1126 C556 1158 556 1158 556 1190 V1202" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="assoc:yes:segment" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="1076" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1099">はい</text></g></g><g class="flow-edge no" data-edge="assoc:no:fallback"><title>いいえ</title><path d="M556 946 V1000 C556 1032 1143 1032 1143 1064 V1076"/><path d="M1143 1114 V1126 C1143 1158 1089.667 1158 1089.667 1190 V1202" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="assoc:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1103" y="1076" width="80" height="38" rx="5"/><text text-anchor="middle" x="1143" y="1099">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assoc:unknown:check"><title>わからない</title><path d="M636 946 V1000 C636 1032 1399.5 1032 1399.5 1064 V1076"/><path d="M1399.5 1114 V1126 C1399.5 1158 1400.333 1158 1400.333 1190 V1202" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="assoc:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="1076" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="1099">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:lazy"><title>はい</title><path d="M1427 1352 V1364 C1427 1396 1200 1396 1200 1428 V1440"/><path d="M1200 1478 V1490 C1200 1522 1200 1522 1200 1554 V1566" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:lazy" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1160" y="1440" width="80" height="38" rx="5"/><text text-anchor="middle" x="1200" y="1463">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1507 1352 V1364 C1507 1396 1551 1396 1551 1428 V1440"/><path d="M1551 1478 V1490 C1551 1522 1510.667 1522 1510.667 1554 V1566" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1511" y="1440" width="80" height="38" rx="5"/><text text-anchor="middle" x="1551" y="1463">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1587 1352 V1364 C1587 1396 1679.5 1396 1679.5 1428 V1440"/><path d="M1679.5 1478 V1490 C1679.5 1522 1617.333 1522 1617.333 1554 V1566" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1635" y="1440" width="89" height="38" rx="5"/><text text-anchor="middle" x="1679.5" y="1463">わからない</text></g></g><g class="flow-edge point-add" data-edge="change-kind:point-add:add"><title>一点に加算し、区間和を求める</title><path d="M982.833 164 V176 C982.833 208 375.5 208 375.5 240 V252"/><path d="M375.5 290 V320 C375.5 352 375.5 352 375.5 384 V396" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="change-kind:point-add:add" tabindex="0" role="group" aria-label="選択肢：一点に加算し、区間和を求める"><rect x="272.5" y="252" width="206" height="38" rx="5"/><text text-anchor="middle" x="375.5" y="275">一点に加算し、区間和を求める</text></g></g><g class="flow-edge point-set" data-edge="change-kind:point-set:point-set-goal"><title>一点に代入し、区間を集計する</title><path d="M1036.167 164 V176 C1036.167 208 780 208 780 240 V252"/><path d="M780 290 V320 C780 352 780 352 780 384 V396" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="change-kind:point-set:point-set-goal" tabindex="0" role="group" aria-label="選択肢：一点に代入し、区間を集計する"><rect x="677" y="252" width="206" height="38" rx="5"/><text text-anchor="middle" x="780" y="275">一点に代入し、区間を集計する</text></g></g><g class="flow-edge order-statistics" data-edge="change-kind:order-statistics:changing-statistics-route"><title>一点代入と、区間の順位・出現回数の条件</title><path d="M1089.5 164 V176 C1089.5 208 1144 208 1144 240 V252"/><path d="M1144 308 V320 C1144 352 1144 352 1144 384 V396" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="change-kind:order-statistics:changing-statistics-route" tabindex="0" role="group" aria-label="選択肢：一点代入と、区間の順位・出現回数の条件"><rect x="1021.5" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="1144" y="275">一点代入と、区間の順位・出現回数の</text><text text-anchor="middle" x="1144" y="293">条件</text></g></g><g class="flow-edge weighted-relative" data-edge="change-kind:weighted-relative:weighted-relative-check"><title>一点代入と、左端から係数が変わる交互符号の和</title><path d="M1142.833 164 V176 C1142.833 208 1468.5 208 1468.5 240 V252"/><path d="M1468.5 308 V320 C1468.5 352 1508 352 1508 384 V396" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="change-kind:weighted-relative:weighted-relative-check" tabindex="0" role="group" aria-label="選択肢：一点代入と、左端から係数が変わる交互符号の和"><rect x="1346" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="1468.5" y="275">一点代入と、左端から係数が変わる交</text><text text-anchor="middle" x="1468.5" y="293">互符号の和</text></g></g><g class="flow-edge unknown" data-edge="change-kind:unknown:check"><title>わからない</title><path d="M1196.167 164 V176 C1196.167 208 1679.5 208 1679.5 240 V252"/><path d="M1679.5 290 V320 C1679.5 352 1718 352 1718 384 V396 V576 C1718 608 1718 608 1718 640 V652 V720 C1718 752 1718 752 1718 784 V796 V1000 C1718 1032 1718 1032 1718 1064 V1076 V1126 C1718 1158 1613.667 1158 1613.667 1190 V1202" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="change-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1635" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="1679.5" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="weighted-relative-check:yes:weighted-relative-result"><title>はい</title><path d="M1428 564 V576 C1428 608 1371 608 1371 640 V652"/><path d="M1371 690 V720 C1371 752 1396 752 1396 784 V796" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="weighted-relative-check:yes:weighted-relative-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1331" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1371" y="675">はい</text></g></g><g class="flow-edge no" data-edge="weighted-relative-check:no:fallback"><title>いいえ</title><path d="M1508 564 V576 C1508 608 1495 608 1495 640 V652"/><path d="M1495 690 V720 C1495 752 1606 752 1606 784 V796 V1000 C1606 1032 1606 1032 1606 1064 V1076 V1126 C1606 1158 1196.333 1158 1196.333 1190 V1202" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="weighted-relative-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1455" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1495" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="weighted-relative-check:unknown:check"><title>わからない</title><path d="M1588 564 V576 C1588 608 1623.5 608 1623.5 640 V652"/><path d="M1623.5 690 V720 C1623.5 752 1662 752 1662 784 V796 V1000 C1662 1032 1662 1032 1662 1064 V1076 V1126 C1662 1158 1560.333 1158 1560.333 1190 V1202" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="weighted-relative-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1579" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1623.5" y="675">わからない</text></g></g><g class="flow-edge aggregate" data-edge="point-set-goal:aggregate:assoc"><title>和・最小値・最大値など、区間の値を結合した集計</title><path d="M700 546 V576 C700 608 742.5 608 742.5 640 V652"/><path d="M742.5 708 V720 C742.5 752 609.333 752 609.333 784 V796" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="point-set-goal:aggregate:assoc" tabindex="0" role="group" aria-label="選択肢：和・最小値・最大値など、区間の値を結合した集計"><rect x="620" y="652" width="245" height="56" rx="5"/><text text-anchor="middle" x="742.5" y="675">和・最小値・最大値など、区間の値を</text><text text-anchor="middle" x="742.5" y="693">結合した集計</text></g></g><g class="flow-edge nonadjacent" data-edge="point-set-goal:nonadjacent:nonadjacent-route"><title>隣接する二要素を同時に選ばない、部分列の最大和</title><path d="M780 546 V576 C780 608 1031.5 608 1031.5 640 V652"/><path d="M1031.5 708 V720 C1031.5 752 976 752 976 784 V796" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="point-set-goal:nonadjacent:nonadjacent-route" tabindex="0" role="group" aria-label="選択肢：隣接する二要素を同時に選ばない、部分列の最大和"><rect x="909" y="652" width="245" height="56" rx="5"/><text text-anchor="middle" x="1031.5" y="675">隣接する二要素を同時に選ばない、部</text><text text-anchor="middle" x="1031.5" y="693">分列の最大和</text></g></g><g class="flow-edge unknown" data-edge="point-set-goal:unknown:check"><title>わからない</title><path d="M860 546 V576 C860 608 1242.5 608 1242.5 640 V652"/><path d="M1242.5 690 V720 C1242.5 752 1186 752 1186 784 V796 V1000 C1186 1032 1550 1032 1550 1064 V1076 V1126 C1550 1158 1507 1158 1507 1190 V1202" marker-end="url(#arrow-range-point-value-goals)"/><g class="flow-edge-label" data-edge-label="point-set-goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1198" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1242.5" y="675">わからない</text></g></g><g class="flow-node question" data-node="add"><rect x="215.5" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="231.5" y="416">質問</text><text class="node-title" x="231.5" y="444">一点加算と区間和を扱いますか？</text><text class="node-explanation" x="231.5" y="471">可換な群として集計できる場合に BIT を使えま</text><text class="node-explanation" x="231.5" y="489">す。単なる結合性だけでは十分ではありません。</text></g><g class="flow-node question" data-node="assoc"><rect x="396" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="816">質問</text><text class="node-title" x="412" y="844">隣り合う区間の答えをまとめて、全体</text><text class="node-title" x="412" y="867">の答えを求められますか？</text><text class="node-explanation" x="412" y="894">一点代入、区間 min、行列積などを、単位元と結</text><text class="node-explanation" x="412" y="912">合演算で表します。</text></g><g class="flow-node question" data-node="check"><rect x="1347" y="1202" width="320" height="150" rx="7"/><text class="node-kind" x="1363" y="1222">質問</text><text class="node-title" x="1363" y="1250">区間への代入・加算を、区間和と長さ</text><text class="node-title" x="1363" y="1273">から一括で反映できますか？</text><text class="node-explanation" x="1363" y="1300">sum と length を持ち、写像が結合を保</text><text class="node-explanation" x="1363" y="1318">つこと、タグの合成を定義できることを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1404" y="1566" width="320" height="139" rx="7"/><text class="node-kind" x="1420" y="1586">分野</text><text class="node-title" x="1420" y="1614">条件を確かめる</text><text class="node-explanation" x="1420" y="1641">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1420" y="1669">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="bit"><rect x="32" y="796" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="816">候補</text><text class="node-title" x="48" y="844">Fenwick 木</text><a href="/flowchartcp/techniques/fenwick-tree/"><title>Fenwick Treeの記事へ</title><text x="48" y="883">Fenwick Tree</text></a></g><g class="flow-node result" data-node="segment"><rect x="396" y="1202" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1222">候補</text><text class="node-title" x="412" y="1250">セグメント木</text><a href="/flowchartcp/techniques/segment-tree/"><title>セグメント木の記事へ</title><text x="412" y="1289">セグメント木</text></a></g><g class="flow-node result" data-node="lazy"><rect x="1040" y="1566" width="320" height="127" rx="7"/><text class="node-kind" x="1056" y="1586">候補</text><text class="node-title" x="1056" y="1614">遅延セグメント木</text><a href="/flowchartcp/techniques/lazy-segment-tree/"><title>遅延セグメント木の記事へ</title><text x="1056" y="1653">遅延セグメント木</text></a></g><g class="flow-node result" data-node="fallback"><rect x="983" y="1202" width="320" height="127" rx="7"/><text class="node-kind" x="999" y="1222">候補</text><text class="node-title" x="999" y="1250">保持する区間情報を増やす</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="999" y="1289">状態の設計</text></a></g><g class="flow-node question" data-node="change-kind"><rect x="929.5" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="945.5" y="52">質問</text><text class="node-title" x="945.5" y="80">一回の操作で、どの値がどう変わりま</text><text class="node-title" x="945.5" y="103">すか？</text><text class="node-explanation" x="945.5" y="130">更新する範囲と、問い合わせる量を選びます。</text></g><g class="flow-node route" data-node="changing-statistics-route"><rect x="984" y="396" width="320" height="121" rx="7"/><text class="node-kind" x="1000" y="416">分野</text><text class="node-title" x="1000" y="444">更新を含む順位・頻度の問い合わせ</text><a href="/flowchartcp/flowcharts/#diagram-range-changing-statistics" data-route="range-changing-statistics"><text x="1000" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="weighted-relative-check"><rect x="1348" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="1364" y="416">質問</text><text class="node-title" x="1364" y="444">左端に依存する符号と係数を、固定位</text><text class="node-title" x="1364" y="467">置の二つの和へ分けられますか？</text><text class="node-explanation" x="1364" y="494">例えば (-1)^(i−l)(i−l+1)a</text><text class="node-explanation" x="1364" y="512">[i] は、固定された符号付き a[i] と </text><text class="node-explanation" x="1364" y="530">(i+1)a[i] の和へ分解できます。</text></g><g class="flow-node result" data-node="weighted-relative-result"><rect x="1236" y="796" width="320" height="192" rx="7"/><text class="node-kind" x="1252" y="816">候補</text><text class="node-title" x="1252" y="844">交互符号の和と、位置を掛けた和を二</text><text class="node-title" x="1252" y="867">つ保持する</text><a href="/flowchartcp/techniques/alternating-linear-weight-prefix/"><title>符号が交互で重みが一次式の区間和は、二つの和へ分けるの記事へ</title><text x="1252" y="906">符号が交互で重みが一次式の区間和は、二つの和へ</text><text x="1252" y="924">分ける</text></a><a href="/flowchartcp/techniques/fenwick-tree/"><title>Fenwick Treeの記事へ</title><text x="1252" y="948">Fenwick Tree</text></a></g><g class="flow-node question" data-node="point-set-goal"><rect x="620" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="636" y="416">質問</text><text class="node-title" x="636" y="444">一点を書き換えた後、どの量を求めま</text><text class="node-title" x="636" y="467">すか？</text><text class="node-explanation" x="636" y="494">全ての要素を集計する場合と、条件を満たす部分列を</text><text class="node-explanation" x="636" y="512">選ぶ場合を分けます。</text></g><g class="flow-node route" data-node="nonadjacent-route"><rect x="816" y="796" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="816">分野</text><text class="node-title" x="832" y="844">点変更と隣接を選べない最大和</text><a href="/flowchartcp/flowcharts/#diagram-changing-nonadjacent-selection" data-route="changing-nonadjacent-selection"><text x="832" y="881">詳細の質問・図へ →</text></a></g></svg>