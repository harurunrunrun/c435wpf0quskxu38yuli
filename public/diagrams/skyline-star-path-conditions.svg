<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-skyline-star-path-conditions flow-desc-skyline-star-path-conditions" width="748" height="1370" viewBox="0 0 748 1370" data-flow-svg="skyline-star-path-conditions"><title id="flow-title-skyline-star-path-conditions">ビルの上に残す星の最適な選択の解法フローチャート</title><desc id="flow-desc-skyline-star-path-conditions">対象の形、求める値、扱える大きさを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-skyline-star-path-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="skyline-rectangles:yes:weighted-deletion"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-skyline-star-path-conditions)"/><g class="flow-edge-label" data-edge-label="skyline-rectangles:yes:weighted-deletion" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="skyline-rectangles:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V581 C654 613 654 613 654 645 V657 V707 C654 739 654 739 654 771 V783 V968 C654 1000 654 1000 654 1032 V1044 V1094 C654 1126 624.571 1126 624.571 1158 V1170" marker-end="url(#arrow-skyline-star-path-conditions)"/><g class="flow-edge-label" data-edge-label="skyline-rectangles:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="skyline-rectangles:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V581 C710 613 710 613 710 645 V657 V707 C710 739 710 739 710 771 V783 V968 C710 1000 710 1000 710 1032 V1044 V1094 C710 1126 670.286 1126 670.286 1158 V1170" marker-end="url(#arrow-skyline-star-path-conditions)"/><g class="flow-edge-label" data-edge-label="skyline-rectangles:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="weighted-deletion:yes:size"><title>はい</title><path d="M352.5 569 V581 C352.5 613 307 613 307 645 V657"/><path d="M307 695 V707 C307 739 319.5 739 319.5 771 V783" marker-end="url(#arrow-skyline-star-path-conditions)"/><g class="flow-edge-label" data-edge-label="weighted-deletion:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="680">はい</text></g></g><g class="flow-edge no" data-edge="weighted-deletion:no:check"><title>いいえ</title><path d="M432.5 569 V581 C432.5 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 542 739 542 771 V783 V968 C542 1000 542 1000 542 1032 V1044 V1094 C542 1126 533.143 1126 533.143 1158 V1170" marker-end="url(#arrow-skyline-star-path-conditions)"/><g class="flow-edge-label" data-edge-label="weighted-deletion:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="weighted-deletion:unknown:check"><title>わからない</title><path d="M512.5 569 V581 C512.5 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 598 739 598 771 V783 V968 C598 1000 598 1000 598 1032 V1044 V1094 C598 1126 578.857 1126 578.857 1158 V1170" marker-end="url(#arrow-skyline-star-path-conditions)"/><g class="flow-edge-label" data-edge-label="weighted-deletion:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M239.5 956 V968 C239.5 1000 192 1000 192 1032 V1044"/><path d="M192 1082 V1094 C192 1126 192 1126 192 1158 V1170" marker-end="url(#arrow-skyline-star-path-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1044" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1067">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 956 V968 C319.5 1000 319 1000 319 1032 V1044"/><path d="M319 1082 V1094 C319 1126 441.714 1126 441.714 1158 V1170" marker-end="url(#arrow-skyline-star-path-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1044" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1067">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 956 V968 C399.5 1000 447.5 1000 447.5 1032 V1044"/><path d="M447.5 1082 V1094 C447.5 1126 487.429 1126 487.429 1158 V1170" marker-end="url(#arrow-skyline-star-path-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1044" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1067">わからない</text></g></g><g class="flow-node question" data-node="skyline-rectangles"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">障害物は各列の下側を隙間なく覆うビ</text><text class="node-title" x="400.5" y="103">ルで、星はその上にありますか？</text><text class="node-explanation" x="400.5" y="130">考える長方形は軸平行です。ビルの高さと星の高さが</text><text class="node-explanation" x="400.5" y="148">等しい境界も、障害物に含めます。</text></g><g class="flow-node question" data-node="weighted-deletion"><rect x="272.5" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">ビルを含まないどの長方形にも星を</text><text class="node-title" x="288.5" y="467">高々一つ残し、星を消す独立した費用</text><text class="node-title" x="288.5" y="490">の合計を最小にしますか？</text><text class="node-explanation" x="288.5" y="517">二つの星を同じ空の長方形に含められるかが、同時に</text><text class="node-explanation" x="288.5" y="535">残せるかの条件になります。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="783" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="803">質問</text><text class="node-title" x="175.5" y="831">一辺Nは1〜20万、星は20万個以</text><text class="node-title" x="175.5" y="854">下、星とビルの高さは1..N、削除</text><text class="node-title" x="175.5" y="877">費用は1..10^9ですか？</text><text class="node-explanation" x="175.5" y="904">星はビルより上にあり、同じ座標を重複して指定しま</text><text class="node-explanation" x="175.5" y="922">せん。同列の異なる高さの星や、星0個は扱えます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1170" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1190">候補</text><text class="node-title" x="48" y="1218">星を祖先方向の経路へ移し、頂点を共</text><text class="node-title" x="48" y="1241">有しない経路の重みを最大にする</text><a href="/flowchartcp/techniques/skyline-cartesian-star-paths/"><title>ビルで遮られない二つの星の競合を祖先パスの交差へ移し、残す重みを最大にするの記事へ</title><text x="48" y="1280">ビルで遮られない二つの星の競合を祖先パスの交差</text><text x="48" y="1298">へ移し、残す重みを最大にする</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1170" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1190">分野</text><text class="node-title" x="412" y="1218">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1255">詳細の質問・図へ →</text></a></g></svg>