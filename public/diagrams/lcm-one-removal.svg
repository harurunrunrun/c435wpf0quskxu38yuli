21.333 771 V783" marker-end="url(#arrow-lcm-one-removal)"/><g class="flow-edge-label" data-edge-label="input:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="goal:yes:lcm-result"><title>はい</title><path d="M340.667 569 V581 C340.667 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-lcm-one-removal)"/><g class="flow-edge-label" data-edge-label="goal:yes:lcm-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="goal:no:fallback"><title>いいえ</title><path d="M420.667 569 V581 C420.667 613 402 613 402 645 V657"/><path d="M402 695 V707 C402 739 402 739 402 771 V783 V963 C402 995 304 995 304 1027 V1039 V1089 C304 1121 224 1121 224 1153 V1165" marker-end="url(#arrow-lcm-one-removal)"/><g class="flow-edge-label" data-edge-label="goal:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M500.667 569 V581 C500.667 613 668 613 668 645 V657"/><path d="M668 695 V707 C668 739 614.667 739 614.667 771 V783" marker-end="url(#arrow-lcm-one-removal)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 915 V963 C588 995 450 995 450 1027 V1039"/><path d="M450 1077 V1089 C450 1121 384 1121 384 1153 V1165" marker-end="url(#arrow-lcm-one-removal)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 915 V963 C668 995 655 995 655 1027 V1039"/><path d="M655 1077 V1089 C655 1121 614.667 1121 614.667 1153 V1165" marker-end="url(#arrow-lcm-one-removal)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 915 V963 C748 995 783.5 995 783.5 1027 V1039"/><path d="M783.5 1077 V1089 C783.5 1121 721.333 1121 721.333 1153 V1165" marker-end="url(#arrow-lcm-one-removal)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="input"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">各正整数の、正しい素因数と指数が入</text><text class="node-title" x="475.7222222222223" y="103">力から分かりますか？</text><text class="node-explanation" x="475.7222222222223" y="130">数そのものが巨大でも構いません。各要素内では相異</text><text class="node-explanation" x="475.7222222222223" y="148">なる真の素数と正の指数を使います。</text></g><g class="flow-node question" data-node="goal"><rect x="260.6666666666667" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">一つだけを 1 に書き換えた後の、</text><text class="node-title" x="276.6666666666667" y="467">異なる最小公倍数の値の個数を求めま</text><text class="node-title" x="276.6666666666667" y="490">すか？</text><text class="node-explanation" x="276.6666666666667" y="517">結果の数そのものや、二個以上を同時に除く場合とは</text><text class="node-explanation" x="276.6666666666667" y="535">分けます。</text></g><g class="flow-node result" data-node="lcm-result"><rect x="32" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">最大指数の唯一の保持者となる要素を</text><text class="node-title" x="48" y="854">数える</text><a href="/flowchartcp/techniques/lcm-removal-unique-maximum/"><title>一つ消した後の最小公倍数は、最大指数を一人だけが持つ素因数で区別するの記事へ</title><text x="48" y="893">一つ消した後の最小公倍数は、最大指数を一人だけ</text><text x="48" y="911">が持つ素因数で区別する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="783" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="803">質問</text><text class="node-title" x="524" y="831">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="854">確認できますか？</text><text class="node-explanation" x="524" y="881">操作の条件と、求める個数・値・順序を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1165" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1185">候補</text><text class="node-title" x="160" y="1213">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1252">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1276">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1185">分野</text><text class="node-title" x="524" y="1213">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1250">詳細の質問・図へ →</text></a></g></svg>