<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-stochastic-timetable-conditions flow-desc-stochastic-timetable-conditions" width="748" height="1401" viewBox="0 0 748 1401" data-flow-svg="stochastic-timetable-conditions"><title id="flow-title-stochastic-timetable-conditions">確率付き時刻表の便と待機の選択の解法フローチャート</title><desc id="flow-desc-stochastic-timetable-conditions">更新や行動の規則と、扱う範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-stochastic-timetable-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="independent-scheduled-trips:yes:strict-transfer-one-at-time"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-stochastic-timetable-conditions)"/><g class="flow-edge-label" data-edge-label="independent-scheduled-trips:yes:strict-transfer-one-at-time" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="independent-scheduled-trips:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V594 C654 626 654 626 654 658 V670 V720 C654 752 654 752 654 784 V796 V999 C654 1031 654 1031 654 1063 V1075 V1125 C654 1157 624.571 1157 624.571 1189 V1201" marker-end="url(#arrow-stochastic-timetable-conditions)"/><g class="flow-edge-label" data-edge-label="independent-scheduled-trips:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="independent-scheduled-trips:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V594 C710 626 710 626 710 658 V670 V720 C710 752 710 752 710 784 V796 V999 C710 1031 710 1031 710 1063 V1075 V1125 C710 1157 670.286 1157 670.286 1189 V1201" marker-end="url(#arrow-stochastic-timetable-conditions)"/><g class="flow-edge-label" data-edge-label="independent-scheduled-trips:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="strict-transfer-one-at-time:yes:bounds"><title>はい</title><path d="M352.5 582 V594 C352.5 626 307 626 307 658 V670"/><path d="M307 708 V720 C307 752 319.5 752 319.5 784 V796" marker-end="url(#arrow-stochastic-timetable-conditions)"/><g class="flow-edge-label" data-edge-label="strict-transfer-one-at-time:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="693">はい</text></g></g><g class="flow-edge no" data-edge="strict-transfer-one-at-time:no:check"><title>いいえ</title><path d="M432.5 582 V594 C432.5 626 431 626 431 658 V670"/><path d="M431 708 V720 C431 752 542 752 542 784 V796 V999 C542 1031 542 1031 542 1063 V1075 V1125 C542 1157 533.143 1157 533.143 1189 V1201" marker-end="url(#arrow-stochastic-timetable-conditions)"/><g class="flow-edge-label" data-edge-label="strict-transfer-one-at-time:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="strict-transfer-one-at-time:unknown:check"><title>わからない</title><path d="M512.5 582 V594 C512.5 626 559.5 626 559.5 658 V670"/><path d="M559.5 708 V720 C559.5 752 598 752 598 784 V796 V999 C598 1031 598 1031 598 1063 V1075 V1125 C598 1157 578.857 1157 578.857 1189 V1201" marker-end="url(#arrow-stochastic-timetable-conditions)"/><g class="flow-edge-label" data-edge-label="strict-transfer-one-at-time:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 987 V999 C239.5 1031 192 1031 192 1063 V1075"/><path d="M192 1113 V1125 C192 1157 192 1157 192 1189 V1201" marker-end="url(#arrow-stochastic-timetable-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 987 V999 C319.5 1031 319 1031 319 1063 V1075"/><path d="M319 1113 V1125 C319 1157 441.714 1157 441.714 1189 V1201" marker-end="url(#arrow-stochastic-timetable-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 987 V999 C399.5 1031 447.5 1031 447.5 1063 V1075"/><path d="M447.5 1113 V1125 C447.5 1157 487.429 1157 487.429 1189 V1201" marker-end="url(#arrow-stochastic-timetable-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1098">わからない</text></g></g><g class="flow-node question" data-node="independent-scheduled-trips"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">便の出発・到着時刻は固定で、運行成</text><text class="node-title" x="400.5" y="103">否は独立に決まりますか？</text><text class="node-explanation" x="400.5" y="130">成否はその便を試す時にだけ分かり、失敗後は同じ地</text><text class="node-explanation" x="400.5" y="148">点で後の便を待てます。運行状況を全て知ってから経</text><text class="node-explanation" x="400.5" y="166">路を選ぶ問題ではありません。</text></g><g class="flow-node question" data-node="strict-transfer-one-at-time"><rect x="272.5" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">同時刻には一便だけ試し、到着と同時</text><text class="node-title" x="288.5" y="485">刻の便へは乗り継げませんか？</text><text class="node-explanation" x="288.5" y="512">待機と便の選択で、期限内の到着確率を最大にしま</text><text class="node-explanation" x="288.5" y="530">す。乗換は到着が次の出発より厳密に早い場合だけで</text><text class="node-explanation" x="288.5" y="548">す。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="796" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="816">質問</text><text class="node-title" x="175.5" y="844">地点と便は各100万以下で、正の移</text><text class="node-title" x="175.5" y="867">動時間と時刻10の18乗以下を扱い</text><text class="node-title" x="175.5" y="890">ますか？</text><text class="node-explanation" x="175.5" y="917">地点数は正、便数は0でも構いません。各便の端点は</text><text class="node-explanation" x="175.5" y="935">異なり、出発・到着は期限内の非負整数、運行確率は</text><text class="node-explanation" x="175.5" y="953">有限の0〜1です。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1201" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1221">候補</text><text class="node-title" x="48" y="1249">到着後の値を先に保存し、同時刻の便</text><text class="node-title" x="48" y="1272">を共通の待機値で比べる</text><a href="/flowchartcp/techniques/stochastic-timetable-reverse-event-dp/"><title>運休する便の時刻表から、期限内の最大到着確率を求めるの記事へ</title><text x="48" y="1311">運休する便の時刻表から、期限内の最大到着確率を</text><text x="48" y="1329">求める</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1201" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1221">分野</text><text class="node-title" x="412" y="1249">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1286">詳細の質問・図へ →</text></a></g></svg>