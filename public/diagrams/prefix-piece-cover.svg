cover)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1080">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1333 V1363 C840 1395 783 1395 783 1427 V1439"/><path d="M783 1477 V1489 C783 1521 828.5 1521 828.5 1553 V1565" marker-end="url(#arrow-prefix-piece-cover)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1462">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1333 V1363 C920 1395 907 1395 907 1427 V1439"/><path d="M907 1477 V1489 C907 1521 908.5 1521 908.5 1553 V1565" marker-end="url(#arrow-prefix-piece-cover)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1462">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1333 V1363 C1000 1395 1035.5 1395 1035.5 1427 V1439"/><path d="M1035.5 1477 V1489 C1035.5 1521 988.5 1521 988.5 1553 V1565" marker-end="url(#arrow-prefix-piece-cover)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1439" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1462">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="568.75" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="584.75" y="52">質問</text><text class="node-title" x="584.75" y="80">一片として使える文字列は、どの集合</text><text class="node-title" x="584.75" y="103">ですか？</text><text class="node-explanation" x="584.75" y="130">使える片の集合、再使用の可否、一片の費用を確かめ</text><text class="node-explanation" x="584.75" y="148">ます。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="558.5555555555557" y="434">質問</text><text class="node-title" x="558.5555555555557" y="462">同じ片を何度でも使え、片一つの費用</text><text class="node-title" x="558.5555555555557" y="485">は全て 1 ですか？</text><text class="node-explanation" x="558.5555555555557" y="512">種類によって費用や使用回数が違うと、最遠の到達範</text><text class="node-explanation" x="558.5555555555557" y="530">囲だけでは最少費用を表せません。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="778" width="320" height="191" rx="7"/><text class="node-kind" x="357.1666666666667" y="798">質問</text><text class="node-title" x="357.1666666666667" y="826">各位置で長さ L まで一致すると</text><text class="node-title" x="357.1666666666667" y="849">き、長さ 1..L の全ての片を使</text><text class="node-title" x="357.1666666666667" y="872">えますか？</text><text class="node-explanation" x="357.1666666666667" y="899">接頭辞を全て許すため、次に到達できる位置は連続し</text><text class="node-explanation" x="357.1666666666667" y="917">た範囲になります。段ごとにその最遠端を更新しま</text><text class="node-explanation" x="357.1666666666667" y="935">す。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">使える接頭辞の到達範囲をまとめ、最</text><text class="node-title" x="48" y="1254">少の片数で覆う</text><a href="/flowchartcp/techniques/prefix-piece-farthest-reach/"><title>同じ文字列の接頭辞をつなぐ最少分割は、到達できる右端を段階ごとに伸ばすの記事へ</title><text x="48" y="1293">同じ文字列の接頭辞をつなぐ最少分割は、到達でき</text><text x="48" y="1311">る右端を段階ごとに伸ばす</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1203">候補</text><text class="node-title" x="412" y="1231">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1270">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1294">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1183" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1203">質問</text><text class="node-title" x="776" y="1231">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1254">書き出せますか？</text><text class="node-explanation" x="776" y="1281">使える片の集合、再使用の可否、一片の費用を確かめ</text><text class="node-explanation" x="776" y="1299">ます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1565" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1585">分野</text><text class="node-title" x="764.5" y="1613">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1650">詳細の質問・図へ →</text></a></g></svg>