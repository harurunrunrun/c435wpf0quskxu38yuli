);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="visit-model:yes:stage"><title>はい</title><path d="M596.389 182 V194 C596.389 226 478.667 226 478.667 258 V270"/><path d="M478.667 308 V320 C478.667 352 478.667 352 478.667 384 V396" marker-end="url(#arrow-line-travel-visit-budget)"/><g class="flow-edge-label" data-edge-label="visit-model:yes:stage" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="438.6666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="478.6666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="visit-model:no:fallback"><title>いいえ</title><path d="M676.389 182 V194 C676.389 226 711 226 711 258 V270"/><path d="M711 308 V320 C711 352 822 352 822 384 V396 V535 C822 567 822 567 822 599 V611 V679 C822 711 822 711 822 743 V755 V958 C822 990 822 990 822 1022 V1034 V1084 C822 1116 878 1116 878 1148 V1160 V1340 C878 1372 878 1372 878 1404 V1416 V1466 C878 1498 440 1498 440 1530 V1542" marker-end="url(#arrow-line-travel-visit-budget)"/><g class="flow-edge-label" data-edge-label="visit-model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="671" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="711" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="visit-model:unknown:check"><title>わからない</title><path d="M756.389 182 V194 C756.3