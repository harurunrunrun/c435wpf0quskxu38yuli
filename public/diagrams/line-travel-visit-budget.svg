C450 1498 360 1498 360 1530 V1542" marker-end="url(#arrow-line-travel-visit-budget)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1439">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M629.5 1292 V1340 C629.5 1372 655 1372 655 1404 V1416"/><path d="M655 1454 V1466 C655 1498 670.667 1498 670.667 1530 V1542" marker-end="url(#arrow-line-travel-visit-budget)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1439">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M709.5 1292 V1340 C709.5 1372 783.5 1372 783.5 1404 V1416"/><path d="M783.5 1454 V1466 C783.5 1498 777.333 1498 777.333 1530 V1542" marker-end="url(#arrow-line-travel-visit-budget)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1416" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1439">わからない</text></g></g><g class="flow-node question" data-node="visit-model"><rect x="516.3888888888889" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="532.3888888888889" y="52">質問</text><text class="node-title" x="532.3888888888889" y="80">隣の位置への移動も一件の訪問も一日</text><text class="node-title" x="532.3888888888889" y="103">で、訪問の値は非負ですか？</text><text class="node-explanation" x="532.3888888888889" y="130">訪問範囲の両端と戻り方により移動日数が決まりま</text><text class="node-explanation" x="532.3888888888889" y="148">す。一つの場所は一度だけ訪問します。</text></g><g class="flow-node question" data-node="stage"><rect x="318.6666666666667" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="334.6666666666667" y="416">質問</text><text class="node-title" x="334.6666666666667" y="444">今必要なのは、どの計算ですか？</text><text class="node-explanation" x="334.6666666666667" y="471">範囲を選ぶ最適化と、一つの範囲内で残りの日数に合</text><text class="node-explanation" x="334.6666666666667" y="489">う値を選ぶ評価を分けます。</text></g><g class="flow-node question" data-node="active"><rect x="32" y="755" width="320" height="191" rx="7"/><text class="node-kind" x="48" y="775">質問</text><text class="node-title" x="48" y="803">範囲の候補を増減しながら、値の大き</text><text class="node-title" x="48" y="826">い順に k 個までの合計を求めます</text><text class="node-title" x="48" y="849">か？</text><text class="node-explanation" x="48" y="876">残りの日数を k とします。等しい値も各場所で別</text><text class="node-explanation" x="48" y="894">に数え、候補の追加・削除で個数と合計を更新しま</text><text class="node-explanation" x="48" y="912">す。</text></g><g class="flow-node result" data-node="top-k-result"><rect x="32" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1180">候補</text><text class="node-title" x="48" y="1208">値ごとの個数と合計を持ち、大きい順</text><text class="node-title" x="48" y="1231">に残りの日数分を集計する</text><a href="/flowchartcp/techniques/active-top-k-count-sum/"><title>候補を出し入れしながら上位k個の和を求めるなら、個数と値の和を同時に持つの記事へ</title><text x="48" y="1270">候補を出し入れしながら上位k個の和を求めるな</text><text x="48" y="1288">ら、個数と値の和を同時に持つ</text></a></g><g class="flow-node result" data-node="search-result"><rect x="396" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="775">候補</text><text class="node-title" x="412" y="803">訪問範囲と移動日数の候補を設計する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="842">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="866">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="469.5" y="1160" width="320" height="132" rx="7"/><text class="node-kind" x="485.5" y="1180">質問</text><text class="node-title" x="485.5" y="1208">必要な条件を、問題文と小さい例から</text><text class="node-title" x="485.5" y="1231">確認できますか？</text><text class="node-explanation" x="485.5" y="1258">操作の順序、更新する値、求める量を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1542" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1562">候補</text><text class="node-title" x="216" y="1590">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="216" y="1629">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1653">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1542" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1562">分野</text><text class="node-title" x="580" y="1590">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1627">詳細の質問・図へ →</text></a></g></svg>