<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-grid-movement-cycles flow-desc-grid-movement-cycles" width="2260" height="1350" viewBox="0 0 2260 1350" data-flow-svg="grid-movement-cycles"><title id="flow-title-grid-movement-cycles">格子の経路と一つの閉路の解法フローチャート</title><desc id="flow-desc-grid-movement-cycles">移動できる向き、収集点、全ての使用マスを通る閉路を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-grid-movement-cycles" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge right-down" data-edge="goal:right-down:path-goal"><title>右・下へ進む経路の個数や、経路上の値</title><path d="M1130.857 159 V171 C1130.857 203 192 203 192 235 V247"/><path d="M192 303 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="goal:right-down:path-goal" tabindex="0" role="group" aria-label="選択肢：右・下へ進む経路の個数や、経路上の値"><rect x="69.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="270">右・下へ進む経路の個数や、経路上の</text><text text-anchor="middle" x="192" y="288">値</text></g></g><g class="flow-edge collect-and-finish" data-edge="goal:collect-and-finish:collect-route"><title>迷路の少数の得点マスを訪れ、時間内に指定終点へ着く</title><path d="M1170.857 159 V171 C1170.857 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="goal:collect-and-finish:collect-route" tabindex="0" role="group" aria-label="選択肢：迷路の少数の得点マスを訪れ、時間内に指定終点へ着く"><rect x="433.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">迷路の少数の得点マスを訪れ、時間内</text><text text-anchor="middle" x="556" y="288">に指定終点へ着く</text></g></g><g class="flow-edge single-cycle" data-edge="goal:single-cycle:single-cycle-route"><title>全ての使用マスを一度ずつ通る、一つの閉路の個数</title><path d="M1210.857 159 V171 C1210.857 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="goal:single-cycle:single-cycle-route" tabindex="0" role="group" aria-label="選択肢：全ての使用マスを一度ずつ通る、一つの閉路の個数"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">全ての使用マスを一度ずつ通る、一つ</text><text text-anchor="middle" x="920" y="288">の閉路の個数</text></g></g><g class="flow-edge ray-moves" data-edge="goal:ray-moves:ray-moves-route"><title>壁を越えず、右・下・右下へ任意の正距離を進む経路数</title><path d="M1250.857 159 V171 C1250.857 203 1284 203 1284 235 V247"/><path d="M1284 303 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="goal:ray-moves:ray-moves-route" tabindex="0" role="group" aria-label="選択肢：壁を越えず、右・下・右下へ任意の正距離を進む経路数"><rect x="1161.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="270">壁を越えず、右・下・右下へ任意の正</text><text text-anchor="middle" x="1284" y="288">距離を進む経路数</text></g></g><g class="flow-edge row-quota" data-edge="goal:row-quota:row-quota-route"><title>右・下へ進み、各行の個数上限内で品物を拾う価値を最大にする</title><path d="M1290.857 159 V171 C1290.857 203 1648 203 1648 235 V247"/><path d="M1648 303 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="goal:row-quota:row-quota-route" tabindex="0" role="group" aria-label="選択肢：右・下へ進み、各行の個数上限内で品物を拾う価値を最大にする"><rect x="1525.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="270">右・下へ進み、各行の個数上限内で品</text><text text-anchor="middle" x="1648" y="288">物を拾う価値を最大にする</text></g></g><g class="flow-edge quadratic-grid" data-edge="goal:quadratic-grid:quadratic-grid-route"><title>行数が巨大で、列へ進む費用は行番号の二乗、下へ進む費用は列ごとの定数</title><path d="M1330.857 159 V171 C1330.857 203 1972.5 203 1972.5 235 V247"/><path d="M1972.5 303 V315 C1972.5 347 2012 347 2012 379 V391" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="goal:quadratic-grid:quadratic-grid-route" tabindex="0" role="group" aria-label="選択肢：行数が巨大で、列へ進む費用は行番号の二乗、下へ進む費用は列ごとの定数"><rect x="1850" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1972.5" y="270">行数が巨大で、列へ進む費用は行番号</text><text text-anchor="middle" x="1972.5" y="288">の二乗、下へ進む費用は列ごとの定数</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M1370.857 159 V171 C1370.857 203 2183.5 203 2183.5 235 V247"/><path d="M2183.5 285 V315 C2183.5 347 2222 347 2222 379 V391 V583 C2222 615 2094 615 2094 647 V659 V727 C2094 759 2052.833 759 2052.833 791 V803" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2139" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="2183.5" y="270">わからない</text></g></g><g class="flow-edge blocked" data-edge="path-goal:blocked:geometry-route"><title>盤面は大きいが、通れないマスが少ない経路数</title><path d="M85.333 541 V583 C85.333 615 192 615 192 647 V659"/><path d="M192 715 V727 C192 759 192 759 192 791 V803" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="path-goal:blocked:geometry-route" tabindex="0" role="group" aria-label="選択肢：盤面は大きいが、通れないマスが少ない経路数"><rect x="69.5" y="659" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="682">盤面は大きいが、通れないマスが少な</text><text text-anchor="middle" x="192" y="700">い経路数</text></g></g><g class="flow-edge other" data-edge="path-goal:other:fallback"><title>その他の経路の条件</title><path d="M138.667 541 V583 C138.667 615 1061.5 615 1061.5 647 V659"/><path d="M1061.5 697 V727 C1061.5 759 1061.5 759 1061.5 791 V803 V965 C1061.5 997 1061.5 997 1061.5 1029 V1041 V1091 C1061.5 1123 1008.167 1123 1008.167 1155 V1167" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="path-goal:other:fallback" tabindex="0" role="group" aria-label="選択肢：その他の経路の条件"><rect x="991" y="659" width="141" height="38" rx="5"/><text text-anchor="middle" x="1061.5" y="682">その他の経路の条件</text></g></g><g class="flow-edge xor" data-edge="path-goal:xor:xor-route"><title>通ったマスの値の XOR が指定値になる経路数</title><path d="M192 541 V583 C192 615 1298.5 615 1298.5 647 V659"/><path d="M1298.5 715 V727 C1298.5 759 1271.5 759 1271.5 791 V803" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="path-goal:xor:xor-route" tabindex="0" role="group" aria-label="選択肢：通ったマスの値の XOR が指定値になる経路数"><rect x="1176" y="659" width="245" height="56" rx="5"/><text text-anchor="middle" x="1298.5" y="682">通ったマスの値の XOR が指定値</text><text text-anchor="middle" x="1298.5" y="700">になる経路数</text></g></g><g class="flow-edge earn-before-move" data-edge="path-goal:earn-before-move:earning-route"><title>各場所で稼ぎ、移動費用を払って右・下へ進む最少行動回数</title><path d="M245.333 541 V583 C245.333 615 1635.5 615 1635.5 647 V659"/><path d="M1635.5 715 V727 C1635.5 759 1635.5 759 1635.5 791 V803" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="path-goal:earn-before-move:earning-route" tabindex="0" role="group" aria-label="選択肢：各場所で稼ぎ、移動費用を払って右・下へ進む最少行動回数"><rect x="1513" y="659" width="245" height="56" rx="5"/><text text-anchor="middle" x="1635.5" y="682">各場所で稼ぎ、移動費用を払って右・</text><text text-anchor="middle" x="1635.5" y="700">下へ進む最少行動回数</text></g></g><g class="flow-edge unknown" data-edge="path-goal:unknown:check"><title>わからない</title><path d="M298.667 541 V583 C298.667 615 1999.5 615 1999.5 647 V659"/><path d="M1999.5 697 V727 C1999.5 759 1946.167 759 1946.167 791 V803" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="path-goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1955" y="659" width="89" height="38" rx="5"/><text text-anchor="middle" x="1999.5" y="682">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1919.5 953 V965 C1919.5 997 1151.5 997 1151.5 1029 V1041"/><path d="M1151.5 1079 V1091 C1151.5 1123 1114.833 1123 1114.833 1155 V1167" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1111.5" y="1041" width="80" height="38" rx="5"/><text text-anchor="middle" x="1151.5" y="1064">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1999.5 953 V965 C1999.5 997 1882.25 997 1882.25 1029 V1041"/><path d="M1882.25 1079 V1091 C1882.25 1123 1828.917 1123 1828.917 1155 V1167" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1842.25" y="1041" width="80" height="38" rx="5"/><text text-anchor="middle" x="1882.25" y="1064">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2079.5 953 V965 C2079.5 997 2010.75 997 2010.75 1029 V1041"/><path d="M2010.75 1079 V1091 C2010.75 1123 1935.583 1123 1935.583 1155 V1167" marker-end="url(#arrow-grid-movement-cycles)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1966.25" y="1041" width="89" height="38" rx="5"/><text text-anchor="middle" x="2010.75" y="1064">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="1090.857142857143" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1106.857142857143" y="52">質問</text><text class="node-title" x="1106.857142857143" y="80">格子で何を求めますか？</text><text class="node-explanation" x="1106.857142857143" y="107">置く対象の大きさ、全てのマスを覆う必要、移動方向</text><text class="node-explanation" x="1106.857142857143" y="125">と経路の条件を選びます。</text></g><g class="flow-node question" data-node="path-goal"><rect x="32" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="411">質問</text><text class="node-title" x="48" y="439">右・下へ進む経路について、どの条件</text><text class="node-title" x="48" y="462">を扱いますか？</text><text class="node-explanation" x="48" y="489">障害点の少なさと、経路上の値の条件では、列挙する</text><text class="node-explanation" x="48" y="507">対象が異なります。</text></g><g class="flow-node route" data-node="geometry-route"><rect x="32" y="803" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="823">分野</text><text class="node-title" x="48" y="851">少ない障害点のある経路</text><a href="/flowchartcp/flowcharts/#diagram-sparse-grid-paths" data-route="sparse-grid-paths"><text x="48" y="888">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1839.5" y="803" width="320" height="150" rx="7"/><text class="node-kind" x="1855.5" y="823">質問</text><text class="node-title" x="1855.5" y="851">合法な選択と、選ぶ回数・費用の条件</text><text class="node-title" x="1855.5" y="874">を一つずつ確かめられますか？</text><text class="node-explanation" x="1855.5" y="901">一対象を何回使えるか、必ず選ぶ対象があるか、経路</text><text class="node-explanation" x="1855.5" y="919">はどこまで共用できるかを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="901.5" y="1167" width="320" height="151" rx="7"/><text class="node-kind" x="917.5" y="1187">候補</text><text class="node-title" x="917.5" y="1215">選択の条件と目的値を整理する</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="917.5" y="1254">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="917.5" y="1278">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1722.25" y="1167" width="320" height="121" rx="7"/><text class="node-kind" x="1738.25" y="1187">分野</text><text class="node-title" x="1738.25" y="1215">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1738.25" y="1252">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="xor-route"><rect x="1111.5" y="803" width="320" height="121" rx="7"/><text class="node-kind" x="1127.5" y="823">分野</text><text class="node-title" x="1127.5" y="851">経路上の XOR と途中の対角線</text><a href="/flowchartcp/flowcharts/#diagram-grid-xor-paths" data-route="grid-xor-paths"><text x="1127.5" y="888">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="collect-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">再訪できる迷路の少数収集点</text><a href="/flowchartcp/flowcharts/#diagram-maze-small-waypoints" data-route="maze-small-waypoints"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="earning-route"><rect x="1475.5" y="803" width="320" height="121" rx="7"/><text class="node-kind" x="1491.5" y="823">分野</text><text class="node-title" x="1491.5" y="851">収入と支払いのある右下への移動</text><a href="/flowchartcp/flowcharts/#diagram-grid-earning-actions" data-route="grid-earning-actions"><text x="1491.5" y="888">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="single-cycle-route"><rect x="760" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">細い盤面を一つの閉路で覆う</text><a href="/flowchartcp/flowcharts/#diagram-grid-single-cycle" data-route="grid-single-cycle"><text x="776" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="ray-moves-route"><rect x="1124" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">壁を越えず、右・下・右下へ任意の正</text><text class="node-title" x="1140" y="462">距離を進む経路数</text><a href="/flowchartcp/flowcharts/#diagram-grid-ray-path-conditions" data-route="grid-ray-path-conditions"><text x="1140" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="row-quota-route"><rect x="1488" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">右・下へ進み、各行の個数上限内で品</text><text class="node-title" x="1504" y="462">物を拾う価値を最大にする</text><a href="/flowchartcp/flowcharts/#diagram-row-pick-quota-conditions" data-route="row-pick-quota-conditions"><text x="1504" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="quadratic-grid-route"><rect x="1852" y="391" width="320" height="180" rx="7"/><text class="node-kind" x="1868" y="411">分野</text><text class="node-title" x="1868" y="439">行数が巨大で、列へ進む費用は行番号</text><text class="node-title" x="1868" y="462">の二乗、下へ進む費用は列ごとの定数</text><text class="node-explanation" x="1868" y="489">左右を反転できる格子は、列番号が増える向きにそろ</text><text class="node-explanation" x="1868" y="507">えます。</text><a href="/flowchartcp/flowcharts/#diagram-quadratic-grid-profile-conditions" data-route="quadratic-grid-profile-conditions"><text x="1868" y="535">詳細の質問・図へ →</text></a></g></svg>