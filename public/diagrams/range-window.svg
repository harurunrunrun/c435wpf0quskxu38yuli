<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-window flow-desc-range-window" width="1840" height="961" viewBox="0 0 1840 961" data-flow-svg="range-window"><title id="flow-title-range-window">連続する区間の条件の解法フローチャート</title><desc id="flow-desc-range-window">固定長か可変長か、条件が単調かを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-window" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1568 564 V576 C1568 608 1284 608 1284 640 V652"/><path d="M1284 690 V702 C1284 734 1284 734 1284 766 V778" marker-end="url(#arrow-range-window)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1244" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="675">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1648 564 V576 C1648 608 1635 608 1635 640 V652"/><path d="M1635 690 V702 C1635 734 1594.667 734 1594.667 766 V778" marker-end="url(#arrow-range-window)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1595" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1635" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1728 564 V576 C1728 608 1763.5 608 1763.5 640 V652"/><path d="M1763.5 690 V702 C1763.5 734 1701.333 734 1701.333 766 V778" marker-end="url(#arrow-range-window)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1719" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1763.5" y="675">わからない</text></g></g><g class="flow-edge aggregate-values" data-edge="wanted:aggregate-values:aggregate-values-route"><title>固定長の集計、全区間の最大最小・GCD・OR</title><path d="M813.333 182 V194 C813.333 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-range-window)"/><g class="flow-edge-label" data-edge-label="wanted:aggregate-values:aggregate-values-route" tabindex="0" role="group" aria-label="選択肢：固定長の集計、全区間の最大最小・GCD・OR"><rect x="76" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">固定長の集計、全区間の最大最小・</text><text text-anchor="middle" x="192" y="311">GCD・OR</text></g></g><g class="flow-edge sum-conditions" data-edge="wanted:sum-conditions:sum-conditions-route"><title>区間和・平均・長さ制限・和と XOR の一致</title><path d="M866.667 182 V194 C866.667 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-range-window)"/><g class="flow-edge-label" data-edge-label="wanted:sum-conditions:sum-conditions-route" tabindex="0" role="group" aria-label="選択肢：区間和・平均・長さ制限・和と XOR の一致"><rect x="446.5" y="270" width="219" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">区間和・平均・長さ制限・和と </text><text text-anchor="middle" x="556" y="311">XOR の一致</text></g></g><g class="flow-edge feasible-selection" data-edge="wanted:feasible-selection:feasible-selection-route"><title>種類数・重複・移動費用・訪問予算の範囲で区間を選ぶ</title><path d="M920 182 V194 C920 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-range-window)"/><g class="flow-edge-label" data-edge-label="wanted:feasible-selection:feasible-selection-route" tabindex="0" role="group" aria-label="選択肢：種類数・重複・移動費用・訪問予算の範囲で区間を選ぶ"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">種類数・重複・移動費用・訪問予算の</text><text text-anchor="middle" x="920" y="311">範囲で区間を選ぶ</text></g></g><g class="flow-edge unique-leader-triples" data-edge="wanted:unique-leader-triples:unique-leader-triples-route"><title>両端と内部の一点が、区間内で一度だけ現れる三点組を数える</title><path d="M973.333 182 V194 C973.333 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-range-window)"/><g class="flow-edge-label" data-edge-label="wanted:unique-leader-triples:unique-leader-triples-route" tabindex="0" role="group" aria-label="選択肢：両端と内部の一点が、区間内で一度だけ現れる三点組を数える"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">両端と内部の一点が、区間内で一度だ</text><text text-anchor="middle" x="1284" y="311">け現れる三点組を数える</text></g></g><g class="flow-edge unknown" data-edge="wanted:unknown:check"><title>わからない</title><path d="M1026.667 182 V194 C1026.667 226 1648 226 1648 258 V270"/><path d="M1648 308 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-range-window)"/><g class="flow-edge-label" data-edge-label="wanted:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1603.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1648" y="293">わからない</text></g></g><g class="flow-node question" data-node="check"><rect x="1488" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1504" y="434">質問</text><text class="node-title" x="1504" y="462">区間を広げると、判定に使う量が増え</text><text class="node-title" x="1504" y="485">続けると証明できますか？</text><text class="node-explanation" x="1504" y="512">区間和なら全要素が非負であることを確認します。実</text><text class="node-explanation" x="1504" y="530">験だけで単調性を断定しません。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1488" y="778" width="320" height="139" rx="7"/><text class="node-kind" x="1504" y="798">分野</text><text class="node-title" x="1504" y="826">条件を確かめる</text><text class="node-explanation" x="1504" y="853">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1504" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1124" y="778" width="320" height="151" rx="7"/><text class="node-kind" x="1140" y="798">候補</text><text class="node-title" x="1140" y="826">連続区間の状態を作り直す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1140" y="865">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="1140" y="889">反例探し</text></a></g><g class="flow-node question" data-node="wanted"><rect x="760" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="52">質問</text><text class="node-title" x="776" y="80">連続する区間について何を求めます</text><text class="node-title" x="776" y="103">か？</text><text class="node-explanation" x="776" y="130">固定長の窓、種類数、和、最大・最小の寄与を区別し</text><text class="node-explanation" x="776" y="148">ます。</text></g><g class="flow-node route" data-node="aggregate-values-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">固定長や全区間の集計値</text><a href="/flowchartcp/flowcharts/#diagram-window-aggregate-values" data-route="window-aggregate-values"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="sum-conditions-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">区間和・平均と長さの条件</text><a href="/flowchartcp/flowcharts/#diagram-window-sum-conditions" data-route="window-sum-conditions"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="feasible-selection-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">区間の長さ・種類数・移動予算</text><a href="/flowchartcp/flowcharts/#diagram-window-feasible-selection" data-route="window-feasible-selection"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="unique-leader-triples-route"><rect x="1124" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">両端と内部の一点が、区間内で一度だ</text><text class="node-title" x="1140" y="485">け現れる三点組を数える</text><a href="/flowchartcp/flowcharts/#diagram-interval-unique-leader-conditions" data-route="interval-unique-leader-conditions"><text x="1140" y="522">詳細の質問・図へ →</text></a></g></svg>