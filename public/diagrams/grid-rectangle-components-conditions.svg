<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-grid-rectangle-components-conditions flow-desc-grid-rectangle-components-conditions" width="748" height="1406" viewBox="0 0 748 1406" data-flow-svg="grid-rectangle-components-conditions"><title id="flow-title-grid-rectangle-components-conditions">部分長方形の中だけの同色成分数の解法フローチャート</title><desc id="flow-desc-grid-rectangle-components-conditions">対象の表し方と、数える量の条件を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-grid-rectangle-components-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="static-grid:yes:rectangle-only"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-grid-rectangle-components-conditions)"/><g class="flow-edge-label" data-edge-label="static-grid:yes:rectangle-only" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="static-grid:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V599 C654 631 654 631 654 663 V675 V725 C654 757 654 757 654 789 V801 V1004 C654 1036 654 1036 654 1068 V1080 V1130 C654 1162 624.571 1162 624.571 1194 V1206" marker-end="url(#arrow-grid-rectangle-components-conditions)"/><g class="flow-edge-label" data-edge-label="static-grid:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="static-grid:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V599 C710 631 710 631 710 663 V675 V725 C710 757 710 757 710 789 V801 V1004 C710 1036 710 1036 710 1068 V1080 V1130 C710 1162 670.286 1162 670.286 1194 V1206" marker-end="url(#arrow-grid-rectangle-components-conditions)"/><g class="flow-edge-label" data-edge-label="static-grid:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="rectangle-only:yes:size"><title>はい</title><path d="M352.5 587 V599 C352.5 631 307 631 307 663 V675"/><path d="M307 713 V725 C307 757 319.5 757 319.5 789 V801" marker-end="url(#arrow-grid-rectangle-components-conditions)"/><g class="flow-edge-label" data-edge-label="rectangle-only:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="698">はい</text></g></g><g class="flow-edge no" data-edge="rectangle-only:no:check"><title>いいえ</title><path d="M432.5 587 V599 C432.5 631 431 631 431 663 V675"/><path d="M431 713 V725 C431 757 542 757 542 789 V801 V1004 C542 1036 542 1036 542 1068 V1080 V1130 C542 1162 533.143 1162 533.143 1194 V1206" marker-end="url(#arrow-grid-rectangle-components-conditions)"/><g class="flow-edge-label" data-edge-label="rectangle-only:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="rectangle-only:unknown:check"><title>わからない</title><path d="M512.5 587 V599 C512.5 631 559.5 631 559.5 663 V675"/><path d="M559.5 713 V725 C559.5 757 598 757 598 789 V801 V1004 C598 1036 598 1036 598 1068 V1080 V1130 C598 1162 578.857 1162 578.857 1194 V1206" marker-end="url(#arrow-grid-rectangle-components-conditions)"/><g class="flow-edge-label" data-edge-label="rectangle-only:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M239.5 992 V1004 C239.5 1036 192 1036 192 1068 V1080"/><path d="M192 1118 V1130 C192 1162 192 1162 192 1194 V1206" marker-end="url(#arrow-grid-rectangle-components-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1080" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1103">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 992 V1004 C319.5 1036 319 1036 319 1068 V1080"/><path d="M319 1118 V1130 C319 1162 441.714 1162 441.714 1194 V1206" marker-end="url(#arrow-grid-rectangle-components-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1080" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1103">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 992 V1004 C399.5 1036 447.5 1036 447.5 1068 V1080"/><path d="M447.5 1118 V1130 C447.5 1162 487.429 1162 487.429 1194 V1206" marker-end="url(#arrow-grid-rectangle-components-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1080" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1103">わからない</text></g></g><g class="flow-node question" data-node="static-grid"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">格子の色は変化せず、同色マスの接続</text><text class="node-title" x="400.5" y="103">は上下左右の四方向ですか？</text><text class="node-explanation" x="400.5" y="130">二色に限らず、穴や斜めの接触がある盤面も扱えま</text><text class="node-explanation" x="400.5" y="148">す。</text></g><g class="flow-node question" data-node="rectangle-only"><rect x="272.5" y="396" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">各問い合わせは非空の長方形で、その</text><text class="node-title" x="288.5" y="467">外側を通る接続を取り除いて成分を数</text><text class="node-title" x="288.5" y="490">えますか？</text><text class="node-explanation" x="288.5" y="517">上書き禁止で長方形内だけを塗る最少回数も同じ数で</text><text class="node-explanation" x="288.5" y="535">す。問い合わせは独立で、前の塗装は引き継ぎませ</text><text class="node-explanation" x="288.5" y="553">ん。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="801" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="821">質問</text><text class="node-title" x="175.5" y="849">縦横はそれぞれ1000以下で、全問</text><text class="node-title" x="175.5" y="872">い合わせの外周長の合計を走査できま</text><text class="node-title" x="175.5" y="895">すか？</text><text class="node-explanation" x="175.5" y="922">掲載APIの色はA〜Zです。前処理O(NM)、高</text><text class="node-explanation" x="175.5" y="940">さh・幅wの照会はO(h+w)。原典は問い合わせ</text><text class="node-explanation" x="175.5" y="958">1000件以下ですが、APIは回数上限を設けま…</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1206" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1226">候補</text><text class="node-title" x="48" y="1254">異色境界の辺数と内部の角を数え、境</text><text class="node-title" x="48" y="1277">界成分の代表点を外周で補正する</text><a href="/flowchartcp/techniques/grid-rectangle-components-euler-boundary/"><title>部分長方形の同色成分数を、異色の境界線と外周の補正で数えるの記事へ</title><text x="48" y="1316">部分長方形の同色成分数を、異色の境界線と外周の</text><text x="48" y="1334">補正で数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1206" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1226">分野</text><text class="node-title" x="412" y="1254">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1291">詳細の質問・図へ →</text></a></g></svg>