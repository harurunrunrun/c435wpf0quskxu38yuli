t="38" rx="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M239.5 979 V991 C239.5 1023 192 1023 192 1055 V1067"/><path d="M192 1105 V1117 C192 1149 192 1149 192 1181 V1193" marker-end="url(#arrow-reciprocal-closure-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1067" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1090">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 979 V991 C319.5 1023 319 1023 319 1055 V1067"/><path d="M319 1105 V1117 C319 1149 441.714 1149 441.714 1181 V1193" marker-end="url(#arrow-reciprocal-closure-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1067" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1090">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 979 V991 C399.5 1023 447.5 1023 447.5 1055 V1067"/><path d="M447.5 1105 V1117 C447.5 1149 487.429 1149 487.429 1181 V1193" marker-end="url(#arrow-reciprocal-closure-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1067" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1090">わからない</text></g></g><g class="flow-node question" data-node="closure-rule"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">異なる3頂点で、x→yとy↔zがそ</text><text class="node-title" x="400.5" y="103">ろうとx→zを追加し、変化がなくな</text><text class="node-title" x="400.5" y="126">るまで繰り返しますか？</text><text class="node-explanation" x="400.5" y="153">yとzの間には直接の相互辺が必要です。相互辺のな</text><text class="node-explanation" x="400.5" y="171">い長い有向閉路だけでは成分を併合しません。</text></g><g class="flow-node question" data-node="insert-only"><rect x="272.5" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">入力では辺の追加だけが起こり、各段</text><text class="node-title" x="288.5" y="490">階で閉包内の有向辺の本数を求めます</text><text class="node-title" x="288.5" y="513">か？</text><text class="node-explanation" x="288.5" y="540">閉包の全辺を列挙せず、個体から終点成分への辺数を</text><text class="node-explanation" x="288.5" y="558">まとめて数えます。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="806" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="826">質問</text><text class="node-title" x="175.5" y="854">頂点数は1以上10万以下、追加は</text><text class="node-title" x="175.5" y="877">30万回以下で、自己辺を入力しませ</text><text class="node-title" x="175.5" y="900">んか？</text><text class="node-explanation" x="175.5" y="927">辺数は64ビットで持ちます。同じ辺や既に閉包にあ</text><text class="node-explanation" x="175.5" y="945">る辺の再追加は許容しますが、操作回数に数えます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1193" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1213">候補</text><text class="node-title" x="48" y="1241">相互関係の成分を連鎖併合し、流入元</text><text class="node-title" x="48" y="1264">の個体ごとに増える辺数を集計する</text><a href="/flowchartcp/techniques/directed-reciprocal-closure-dsu-small-to-large/"><title>相互辺で結ばれた成分を併合し、有向閉包の辺数を保つの記事へ</title><text x="48" y="1303">相互辺で結ばれた成分を併合し、有向閉包の辺数を</text><text x="48" y="1321">保つ</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1193" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1213">分野</text><text class="node-title" x="412" y="1241">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1278">詳細の質問・図へ →</text></a></g></svg>