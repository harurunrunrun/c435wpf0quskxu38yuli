<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-subtree-value-goals flow-desc-tree-subtree-value-goals" width="1112" height="567" viewBox="0 0 1112 567" data-flow-svg="tree-subtree-value-goals"><title id="flow-title-tree-subtree-value-goals">部分木の値と色の解法フローチャート</title><desc id="flow-desc-tree-subtree-value-goals">部分木への集計や更新と、色の種類や出現回数についての問い合わせを分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-subtree-value-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge subtree" data-edge="target:subtree:subtree-kind"><title>一つの部分木</title><path d="M476 141 V153 C476 185 192 185 192 217 V229"/><path d="M192 267 V279 C192 311 192 311 192 343 V355" marker-end="url(#arrow-tree-subtree-value-goals)"/><g class="flow-edge-label" data-edge-label="target:subtree:subtree-kind" tabindex="0" role="group" aria-label="選択肢：一つの部分木"><rect x="141" y="229" width="102" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">一つの部分木</text></g></g><g class="flow-edge colors" data-edge="target:colors:colors-kind"><title>各部分木の色の種類・出現回数</title><path d="M556 141 V153 C556 185 556 185 556 217 V229"/><path d="M556 267 V279 C556 311 556 311 556 343 V355" marker-end="url(#arrow-tree-subtree-value-goals)"/><g class="flow-edge-label" data-edge-label="target:colors:colors-kind" tabindex="0" role="group" aria-label="選択肢：各部分木の色の種類・出現回数"><rect x="453" y="229" width="206" height="38" rx="5"/><text text-anchor="middle" x="556" y="252">各部分木の色の種類・出現回数</text></g></g><g class="flow-edge unknown" data-edge="target:unknown:check"><title>わからない</title><path d="M636 141 V153 C636 185 920 185 920 217 V229"/><path d="M920 267 V279 C920 311 920 311 920 343 V355" marker-end="url(#arrow-tree-subtree-value-goals)"/><g class="flow-edge-label" data-edge-label="target:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="252">わからない</text></g></g><g class="flow-node question" data-node="target"><rect x="396" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="412" y="52">質問</text><text class="node-title" x="412" y="80">木のどの部分について答えますか？</text><text class="node-explanation" x="412" y="107">根、値が付く場所、対象の頂点の範囲を選びます。</text></g><g class="flow-node route" data-node="subtree-kind"><rect x="32" y="355" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="375">分野</text><text class="node-title" x="48" y="403">部分木の根と操作</text><text class="node-explanation" x="48" y="430">根が変わるか、値を更新するか、深さで対象を絞るか</text><text class="node-explanation" x="48" y="448">を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-subtree-operation-details" data-route="tree-subtree-operation-details"><text x="48" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="colors-kind"><rect x="396" y="355" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="375">分野</text><text class="node-title" x="412" y="403">部分木に現れる色の数と頻度</text><text class="node-explanation" x="412" y="430">色の種類数を求める場合と、最も多い色を求める場合</text><text class="node-explanation" x="412" y="448">を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-subtree-color-details" data-route="tree-subtree-color-details"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="355" width="320" height="180" rx="7"/><text class="node-kind" x="776" y="375">分野</text><text class="node-title" x="776" y="403">問い合わせで対象となる頂点を確かめ</text><text class="node-title" x="776" y="426">る</text><text class="node-explanation" x="776" y="453">根を決めて対象を図に描き、祖先・部分木・経路のど</text><text class="node-explanation" x="776" y="471">れを扱うかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-query-target-check" data-route="tree-query-target-check"><text x="776" y="499">詳細の質問・図へ →</text></a></g></svg>