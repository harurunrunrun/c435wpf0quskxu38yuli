<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-count-selected-values flow-desc-count-selected-values" width="2260" height="1425" viewBox="0 0 2260 1425" data-flow-svg="count-selected-values"><title id="flow-title-count-selected-values">選ぶ個数・値・桁の条件の解法フローチャート</title><desc id="flow-desc-count-selected-values">選ぶ個数、選ぶ値の大小、整数の桁に条件がある場合を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-count-selected-values" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge binomial" data-edge="count-kind:binomial:factorial-check"><title>N 個から K 個を選ぶ個数を、何度も求める</title><path d="M1170.857 182 V194 C1170.857 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="count-kind:binomial:factorial-check" tabindex="0" role="group" aria-label="選択肢：N 個から K 個を選ぶ個数を、何度も求める"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">N 個から K 個を選ぶ個数を、何</text><text text-anchor="middle" x="556" y="311">度も求める</text></g></g><g class="flow-edge digits" data-edge="count-kind:digits:digits"><title>各桁を選ぶ整数の個数</title><path d="M1130.857 182 V194 C1130.857 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="count-kind:digits:digits" tabindex="0" role="group" aria-label="選択肢：各桁を選ぶ整数の個数"><rect x="115" y="270" width="154" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">各桁を選ぶ整数の個数</text></g></g><g class="flow-edge monotone-values" data-edge="count-kind:monotone-values:monotone-values"><title>非減少に並ぶ K 個の整数の選び方</title><path d="M1290.857 182 V194 C1290.857 226 1648 226 1648 258 V270"/><path d="M1648 308 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="count-kind:monotone-values:monotone-values" tabindex="0" role="group" aria-label="選択肢：非減少に並ぶ K 個の整数の選び方"><rect x="1525.5" y="270" width="245" height="38" rx="5"/><text text-anchor="middle" x="1648" y="293">非減少に並ぶ K 個の整数の選び方</text></g></g><g class="flow-edge composite-binomial" data-edge="count-kind:composite-binomial:composite-mod-small"><title>法が合成数でもよい、多数の二項係数</title><path d="M1330.857 182 V194 C1330.857 226 1972.5 226 1972.5 258 V270"/><path d="M1972.5 308 V338 C1972.5 370 2012 370 2012 402 V414" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="count-kind:composite-binomial:composite-mod-small" tabindex="0" role="group" aria-label="選択肢：法が合成数でもよい、多数の二項係数"><rect x="1850" y="270" width="245" height="38" rx="5"/><text text-anchor="middle" x="1972.5" y="293">法が合成数でもよい、多数の二項係数</text></g></g><g class="flow-edge square-product" data-edge="count-kind:square-product:square-product-route"><title>積が平方数になる非空の添字集合を数える</title><path d="M1210.857 182 V194 C1210.857 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="count-kind:square-product:square-product-route" tabindex="0" role="group" aria-label="選択肢：積が平方数になる非空の添字集合を数える"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">積が平方数になる非空の添字集合を数</text><text text-anchor="middle" x="920" y="311">える</text></g></g><g class="flow-edge equal-bag-values" data-edge="count-kind:equal-bag-values:equal-bag-values-route"><title>重さが2の累乗の品物を、全袋で同じ合計にできる値の個数</title><path d="M1250.857 182 V194 C1250.857 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="count-kind:equal-bag-values:equal-bag-values-route" tabindex="0" role="group" aria-label="選択肢：重さが2の累乗の品物を、全袋で同じ合計にできる値の個数"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">重さが2の累乗の品物を、全袋で同じ</text><text text-anchor="middle" x="1284" y="311">合計にできる値の個数</text></g></g><g class="flow-edge unknown" data-edge="count-kind:unknown:check"><title>わからない</title><path d="M1370.857 182 V194 C1370.857 226 2183.5 226 2183.5 258 V270"/><path d="M2183.5 308 V338 C2183.5 370 2222 370 2222 402 V414 V576 C2222 608 2222 608 2222 640 V652 V702 C2222 734 2222 734 2222 766 V778 V981 C2222 1013 2222 1013 2222 1045 V1057 V1107 C2222 1139 1810.667 1139 1810.667 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="count-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2139" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="2183.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="factorial-check:yes:factorial-result"><title>はい</title><path d="M476 564 V576 C476 608 556 608 556 640 V652"/><path d="M556 690 V702 C556 734 556 734 556 766 V778" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="factorial-check:yes:factorial-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="675">はい</text></g></g><g class="flow-edge no" data-edge="factorial-check:no:fallback"><title>いいえ</title><path d="M556 564 V576 C556 608 1158 608 1158 640 V652"/><path d="M1158 690 V702 C1158 734 1158 734 1158 766 V778 V981 C1158 1013 1340 1013 1340 1045 V1057 V1107 C1340 1139 1244 1139 1244 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="factorial-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1118" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1158" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="factorial-check:unknown:check"><title>わからない</title><path d="M636 564 V576 C636 608 1286.5 608 1286.5 640 V652"/><path d="M1286.5 690 V702 C1286.5 734 1214 734 1214 766 V778 V981 C1214 1013 1561 1013 1561 1045 V1057 V1107 C1561 1139 1597.333 1139 1597.333 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="factorial-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1242" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1286.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="monotone-values:yes:boxes-result"><title>はい</title><path d="M1648 564 V576 C1648 608 1539 608 1539 640 V652"/><path d="M1539 690 V702 C1539 734 1480 734 1480 766 V778" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="monotone-values:yes:boxes-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1499" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1539" y="675">はい</text></g></g><g class="flow-edge no" data-edge="monotone-values:no:fallback"><title>いいえ</title><path d="M1568 564 V576 C1568 608 1415 608 1415 640 V652"/><path d="M1415 690 V702 C1415 734 1270 734 1270 766 V778 V981 C1270 1013 1617 1013 1617 1045 V1057 V1107 C1617 1139 1308 1139 1308 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="monotone-values:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1375" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1415" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="monotone-values:unknown:check"><title>わからない</title><path d="M1728 564 V576 C1728 608 1690 608 1690 640 V652"/><path d="M1690 690 V702 C1690 734 1690 734 1690 766 V778 V981 C1690 1013 1673 1013 1673 1045 V1057 V1107 C1673 1139 1650.667 1139 1650.667 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="monotone-values:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1645.5" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1690" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="composite-mod-small:yes:composite-valuation"><title>はい</title><path d="M2012 564 V576 C2012 608 1956 608 1956 640 V652"/><path d="M1956 690 V702 C1956 734 1956 734 1956 766 V778" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="composite-mod-small:yes:composite-valuation" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1916" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1956" y="675">はい</text></g></g><g class="flow-edge no" data-edge="composite-mod-small:no:fallback"><title>いいえ</title><path d="M1932 564 V576 C1932 608 1818.5 608 1818.5 640 V652"/><path d="M1818.5 690 V702 C1818.5 734 1746 734 1746 766 V778 V981 C1746 1013 1729 1013 1729 1045 V1057 V1107 C1729 1139 1372 1139 1372 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="composite-mod-small:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1778.5" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1818.5" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="composite-mod-small:unknown:check"><title>わからない</title><path d="M2092 564 V576 C2092 608 2127.5 608 2127.5 640 V652"/><path d="M2127.5 690 V702 C2127.5 734 2166 734 2166 766 V778 V981 C2166 1013 2166 1013 2166 1045 V1057 V1107 C2166 1139 1757.333 1139 1757.333 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="composite-mod-small:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2083" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="2127.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="composite-valuation:yes:composite-binomial-result"><title>はい</title><path d="M2036 969 V981 C2036 1013 2076 1013 2076 1045 V1057"/><path d="M2076 1095 V1107 C2076 1139 2068 1139 2068 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="composite-valuation:yes:composite-binomial-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="2036" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="2076" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="composite-valuation:no:fallback"><title>いいえ</title><path d="M1876 969 V981 C1876 1013 1819 1013 1819 1045 V1057"/><path d="M1819 1095 V1107 C1819 1139 1436 1139 1436 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="composite-valuation:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1779" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="1819" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="composite-valuation:unknown:check"><title>わからない</title><path d="M1956 969 V981 C1956 1013 1947.5 1013 1947.5 1045 V1057"/><path d="M1947.5 1095 V1107 C1947.5 1139 1704 1139 1704 1171 V1183" marker-end="url(#arrow-count-selected-values)"/><g class="flow-edge-label" data-edge-label="composite-valuation:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1903" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="1947.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="count-kind"><rect x="1090.857142857143" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1106.857142857143" y="52">質問</text><text class="node-title" x="1106.857142857143" y="80">数える対象には、どの特徴があります</text><text class="node-title" x="1106.857142857143" y="103">か？</text><text class="node-explanation" x="1106.857142857143" y="130">禁止条件、同じ物の配置、二つの選び方への寄与を分</text><text class="node-explanation" x="1106.857142857143" y="148">けます。</text></g><g class="flow-node question" data-node="factorial-check"><rect x="396" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="434">質問</text><text class="node-title" x="412" y="462">必要な階乗が、答えの法の下で逆元を</text><text class="node-title" x="412" y="485">持ちますか？</text><text class="node-explanation" x="412" y="512">素数法でも N が法以上なら、階乗を単純に割る公</text><text class="node-explanation" x="412" y="530">式をそのまま使えません。</text></g><g class="flow-node route" data-node="digits"><rect x="32" y="414" width="320" height="139" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">桁を順に選ぶ整数</text><text class="node-explanation" x="48" y="489">接頭辞から次の状態を更新できるかを確認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-integer-digits" data-route="count-integer-digits"><text x="48" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="monotone-values"><rect x="1488" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1504" y="434">質問</text><text class="node-title" x="1504" y="462">隣の値の差と両端の余りを、非負の整</text><text class="node-title" x="1504" y="485">数へ変えられますか？</text><text class="node-explanation" x="1504" y="512">1≤a1≤...≤aK≤N を、端を含む差の合計</text><text class="node-explanation" x="1504" y="530"> N-1 に対応させます。</text></g><g class="flow-node question" data-node="composite-mod-small"><rect x="1852" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1868" y="434">質問</text><text class="node-title" x="1868" y="462">固定された法を素数の冪に分解し、各</text><text class="node-title" x="1868" y="485">法の表を保存できますか？</text><text class="node-explanation" x="1868" y="512">n が大きくても、法が小さいなら各素数冪につい</text><text class="node-explanation" x="1868" y="530">て、その倍数でない積の表を作れます。</text></g><g class="flow-node route" data-node="check"><rect x="1544" y="1183" width="320" height="157" rx="7"/><text class="node-kind" x="1560" y="1203">分野</text><text class="node-title" x="1560" y="1231">数え方を小さい例で確かめる</text><text class="node-explanation" x="1560" y="1258">一つの対象を何回数えるか、重複や空集合を含めて確</text><text class="node-explanation" x="1560" y="1276">認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-small-enumeration" data-route="count-small-enumeration"><text x="1560" y="1304">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="factorial-result"><rect x="396" y="778" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="798">候補</text><text class="node-title" x="412" y="826">階乗と逆階乗を前計算する</text><a href="/flowchartcp/techniques/factorial-inverses/"><title>組合せを何度も求めるときは逆階乗を前計算するの記事へ</title><text x="412" y="865">組合せを何度も求めるときは逆階乗を前計算する</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1180" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="1196" y="1203">候補</text><text class="node-title" x="1196" y="1231">小規模全探索で数え方を確認する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="1196" y="1270">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="1196" y="1294">反例探し</text></a></g><g class="flow-node result" data-node="boxes-result"><rect x="1320" y="778" width="320" height="127" rx="7"/><text class="node-kind" x="1336" y="798">候補</text><text class="node-title" x="1336" y="826">下限を引いて仕切りの置き方を数える</text><a href="/flowchartcp/techniques/stars-and-bars/"><title>単調な列を差分にして非負整数の和を数えるの記事へ</title><text x="1336" y="865">単調な列を差分にして非負整数の和を数える</text></a></g><g class="flow-node question" data-node="composite-valuation"><rect x="1796" y="778" width="320" height="191" rx="7"/><text class="node-kind" x="1812" y="798">質問</text><text class="node-title" x="1812" y="826">階乗中の素因数の指数と、その素因数</text><text class="node-title" x="1812" y="849">を除いた可逆な部分を分けられます</text><text class="node-title" x="1812" y="872">か？</text><text class="node-explanation" x="1812" y="899">階乗そのものは法の下で 0 になる場合がありま</text><text class="node-explanation" x="1812" y="917">す。割れる部分を逆元で割り、素因数の冪を最後に戻</text><text class="node-explanation" x="1812" y="935">します。</text></g><g class="flow-node result" data-node="composite-binomial-result"><rect x="1908" y="1183" width="320" height="210" rx="7"/><text class="node-kind" x="1924" y="1203">候補</text><text class="node-title" x="1924" y="1231">素数冪ごとに素因数を除いた階乗を計</text><text class="node-title" x="1924" y="1254">算し、余りを併合する</text><a href="/flowchartcp/techniques/binomial-composite-prime-power/"><title>合成数の法で二項係数を計算するとき、素因数だけ外して割るの記事へ</title><text x="1924" y="1293">合成数の法で二項係数を計算するとき、素因数だけ</text><text x="1924" y="1311">外して割る</text></a><a href="/flowchartcp/techniques/crt-noncoprime/"><title>法が互いに素でない合同式も共通因子を確認して併合するの記事へ</title><text x="1924" y="1335">法が互いに素でない合同式も共通因子を確認して併</text><text x="1924" y="1353">合する</text></a></g><g class="flow-node route" data-node="square-product-route"><rect x="760" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">積が平方数になる非空の添字集合を数</text><text class="node-title" x="776" y="485">える</text><a href="/flowchartcp/flowcharts/#diagram-square-product-subset-conditions" data-route="square-product-subset-conditions"><text x="776" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="equal-bag-values-route"><rect x="1124" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">重さが2の累乗の品物を、全袋で同じ</text><text class="node-title" x="1140" y="485">合計にできる値の個数</text><a href="/flowchartcp/flowcharts/#diagram-power-two-equal-bag-conditions" data-route="power-two-equal-bag-conditions"><text x="1140" y="522">詳細の質問・図へ →</text></a></g></svg>