<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-graph-functional flow-desc-graph-functional" width="860" height="1331" viewBox="0 0 860 1331" data-flow-svg="graph-functional"><title id="flow-title-graph-functional">行き先が一つの移動の解法フローチャート</title><desc id="flow-desc-graph-functional">長い移動列を、最初の部分と一周する部分へ分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-graph-functional" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="unique-next:yes:fixed-start"><title>はい</title><path d="M539.722 182 V194 C539.722 226 420.667 226 420.667 258 V270"/><path d="M420.667 308 V320 C420.667 352 420.667 352 420.667 384 V396" marker-end="url(#arrow-graph-functional)"/><g class="flow-edge-label" data-edge-label="unique-next:yes:fixed-start" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="unique-next:no:fallback"><title>いいえ</title><path d="M619.722 182 V194 C619.722 226 655 226 655 258 V270"/><path d="M655 308 V320 C655 352 762.5 352 762.5 384 V396 V558 C762.5 590 762.5 590 762.5 622 V634 V684 C762.5 716 458 716 458 748 V760 V946 C458 978 360 978 360 1010 V1022 V1072 C360 1104 304 1104 304 1136 V1148" marker-end="url(#arrow-graph-functional)"/><g class="flow-edge-label" data-edge-label="unique-next:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="unique-next:unknown:check"><title>わからない</title><path d="M699.722 182 V194 C699.722 226 783.5 226 783.5 258 V270"/><path d="M783.5 308 V320 C783.5 352 818.5 352 818.5 384 V396 V558 C818.5 590 818.5 590 818.5 622 V634 V684 C818.5 716 721.333 716 721.333 748 V760" marker-end="url(#arrow-graph-functional)"/><g class="flow-edge-label" data-edge-label="unique-next:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="fixed-start:yes:cycle-result"><title>はい</title><path d="M340.667 546 V558 C340.667 590 192 590 192 622 V634"/><path d="M192 672 V684 C192 716 192 716 192 748 V760" marker-end="url(#arrow-graph-functional)"/><g class="flow-edge-label" data-edge-label="fixed-start:yes:cycle-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="657">はい</text></g></g><g class="flow-edge no" data-edge="fixed-start:no:fallback"><title>いいえ</title><path d="M420.667 546 V558 C420.667 590 402 590 402 622 V634"/><path d="M402 672 V684 C402 716 402 716 402 748 V760 V946 C402 978 304 978 304 1010 V1022 V1072 C304 1104 224 1104 224 1136 V1148" marker-end="url(#arrow-graph-functional)"/><g class="flow-edge-label" data-edge-label="fixed-start:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed-start:unknown:check"><title>わからない</title><path d="M500.667 546 V558 C500.667 590 668 590 668 622 V634"/><path d="M668 672 V684 C668 716 614.667 716 614.667 748 V760" marker-end="url(#arrow-graph-functional)"/><g class="flow-edge-label" data-edge-label="fixed-start:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 910 V946 C588 978 450 978 450 1010 V1022"/><path d="M450 1060 V1072 C450 1104 384 1104 384 1136 V1148" marker-end="url(#arrow-graph-functional)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1022" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1045">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 910 V946 C668 978 655 978 655 1010 V1022"/><path d="M655 1060 V1072 C655 1104 614.667 1104 614.667 1136 V1148" marker-end="url(#arrow-graph-functional)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1022" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1045">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 910 V946 C748 978 783.5 978 783.5 1010 V1022"/><path d="M783.5 1060 V1072 C783.5 1104 721.333 1104 721.333 1136 V1148" marker-end="url(#arrow-graph-functional)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1022" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1045">わからない</text></g></g><g class="flow-node question" data-node="unique-next"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">各頂点からの次の行き先が、必ず一つ</text><text class="node-title" x="475.7222222222223" y="103">に定まりますか？</text><text class="node-explanation" x="475.7222222222223" y="130">次の行き先が時刻や履歴で変わるなら、その情報を含</text><text class="node-explanation" x="475.7222222222223" y="148">めた状態が必要です。</text></g><g class="flow-node question" data-node="fixed-start"><rect x="260.6666666666667" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">始点は固定で、同じ次の行き先を K</text><text class="node-title" x="276.6666666666667" y="467"> 回たどりますか？</text><text class="node-explanation" x="276.6666666666667" y="494">初めて訪れた時刻を記録し、同じ頂点に戻った後は周</text><text class="node-explanation" x="276.6666666666667" y="512">期で回数を減らします。</text></g><g class="flow-node result" data-node="cycle-result"><rect x="32" y="760" width="320" height="174" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">最初に同じ頂点へ戻るまでを列挙し、</text><text class="node-title" x="48" y="831">残り回数を周期で減らす</text><a href="/flowchartcp/techniques/functional-graph-cycle-tail/"><title>一つに決まる移動を、巡回前と巡回後に分けるの記事へ</title><text x="48" y="870">一つに決まる移動を、巡回前と巡回後に分ける</text></a><a href="/flowchartcp/techniques/doubling/"><title>ダブリングの記事へ</title><text x="48" y="894">ダブリング</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="780">質問</text><text class="node-title" x="524" y="808">入力例から、判定に使う条件を一つず</text><text class="node-title" x="524" y="831">つ確かめられますか？</text><text class="node-explanation" x="524" y="858">どの条件が問題文で保証され、どの条件を証明する必</text><text class="node-explanation" x="524" y="876">要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1148" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1168">候補</text><text class="node-title" x="160" y="1196">必要な条件を小さい例で確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1235">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1259">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1148" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1168">分野</text><text class="node-title" x="524" y="1196">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1233">詳細の質問・図へ →</text></a></g></svg>