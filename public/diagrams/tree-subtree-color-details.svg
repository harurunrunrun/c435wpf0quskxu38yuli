<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-subtree-color-details flow-desc-tree-subtree-color-details" width="1112" height="626" viewBox="0 0 1112 626" data-flow-svg="tree-subtree-color-details"><title id="flow-title-tree-subtree-color-details">部分木に現れる色の数と頻度の解法フローチャート</title><desc id="flow-desc-tree-subtree-color-details">色の種類数を求める場合と、最も多い色を求める場合を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-subtree-color-details" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge distinct" data-edge="colors-kind:distinct:merge"><title>現れる色の種類数</title><path d="M576.625 182 V194 C576.625 226 556 226 556 258 V270"/><path d="M556 308 V338 C556 370 502.667 370 502.667 402 V414" marker-end="url(#arrow-tree-subtree-color-details)"/><g class="flow-edge-label" data-edge-label="colors-kind:distinct:merge" tabindex="0" role="group" aria-label="選択肢：現れる色の種類数"><rect x="492" y="270" width="128" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">現れる色の種類数</text></g></g><g class="flow-edge mode" data-edge="colors-kind:mode:mode-route"><title>最も多い色を全て求め、その色番号を合計する</title><path d="M512.625 182 V194 C512.625 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-tree-subtree-color-details)"/><g class="flow-edge-label" data-edge-label="colors-kind:mode:mode-route" tabindex="0" role="group" aria-label="選択肢：最も多い色を全て求め、その色番号を合計する"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">最も多い色を全て求め、その色番号を</text><text text-anchor="middle" x="192" y="311">合計する</text></g></g><g class="flow-edge other" data-edge="colors-kind:other:merge"><title>その他の集合・頻度の集計</title><path d="M640.625 182 V194 C640.625 226 754 226 754 258 V270"/><path d="M754 308 V338 C754 370 609.333 370 609.333 402 V414" marker-end="url(#arrow-tree-subtree-color-details)"/><g class="flow-edge-label" data-edge-label="colors-kind:other:merge" tabindex="0" role="group" aria-label="選択肢：その他の集合・頻度の集計"><rect x="664" y="270" width="180" height="38" rx="5"/><text text-anchor="middle" x="754" y="293">その他の集合・頻度の集計</text></g></g><g class="flow-edge unknown" data-edge="colors-kind:unknown:check"><title>わからない</title><path d="M704.625 182 V194 C704.625 226 932.5 226 932.5 258 V270"/><path d="M932.5 308 V338 C932.5 370 920 370 920 402 V414" marker-end="url(#arrow-tree-subtree-color-details)"/><g class="flow-edge-label" data-edge-label="colors-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="888" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="932.5" y="293">わからない</text></g></g><g class="flow-node question" data-node="colors-kind"><rect x="448.625" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="464.625" y="52">質問</text><text class="node-title" x="464.625" y="80">各部分木の色について、何を求めます</text><text class="node-title" x="464.625" y="103">か？</text><text class="node-explanation" x="464.625" y="130">色の番号、色ごとの頻度、同率の場合の答えを確認し</text><text class="node-explanation" x="464.625" y="148">ます。</text></g><g class="flow-node route" data-node="merge"><rect x="396" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">部分木の集合と過去の版</text><text class="node-explanation" x="412" y="489">部分木の集合を併合するか、木上の値の過去の状態を</text><text class="node-explanation" x="412" y="507">残すかを確認します。</text><a href="/flowchartcp/flowcharts/#diagram-tree-subtree-collections" data-route="tree-subtree-collections"><text x="412" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="mode-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">固定部分木の最頻色</text><a href="/flowchartcp/flowcharts/#diagram-tree-subtree-modes" data-route="tree-subtree-modes"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="414" width="320" height="180" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">問い合わせで対象となる頂点を確かめ</text><text class="node-title" x="776" y="485">る</text><text class="node-explanation" x="776" y="512">根を決めて対象を図に描き、祖先・部分木・経路のど</text><text class="node-explanation" x="776" y="530">れを扱うかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-query-target-check" data-route="tree-query-target-check"><text x="776" y="558">詳細の質問・図へ →</text></a></g></svg>