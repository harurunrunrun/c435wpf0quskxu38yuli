<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-math-xor-values flow-desc-math-xor-values" width="1168" height="1736" viewBox="0 0 1168 1736" data-flow-svg="math-xor-values"><title id="flow-title-math-xor-values">XOR で作れる値と順位の解法フローチャート</title><desc id="flow-desc-math-xor-values">到達可能な XOR 値を調べる場合と、異なる値を小さい順に取り出す場合を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-math-xor-values" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="xor:yes:xor-result"><title>はい</title><path d="M584 164 V176 C584 208 192 208 192 240 V252"/><path d="M192 290 V320 C192 352 192 352 192 384 V396" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor:yes:xor-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="275">はい</text></g></g><g class="flow-edge no" data-edge="xor:no:polynomial"><title>いいえ</title><path d="M648 164 V176 C648 208 556 208 556 240 V252"/><path d="M556 290 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor:no:polynomial" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="275">いいえ</text></g></g><g class="flow-edge ranked-values" data-edge="xor:ranked-values:xor-rank-distinct"><title>部分集合 XOR の異なる値を、小さい順に取り出す</title><path d="M712 164 V176 C712 208 880.5 208 880.5 240 V252"/><path d="M880.5 308 V320 C880.5 352 920 352 920 384 V396" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor:ranked-values:xor-rank-distinct" tabindex="0" role="group" aria-label="選択肢：部分集合 XOR の異なる値を、小さい順に取り出す"><rect x="758" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="880.5" y="275">部分集合 XOR の異なる値を、小</text><text text-anchor="middle" x="880.5" y="293">さい順に取り出す</text></g></g><g class="flow-edge unknown" data-edge="xor:unknown:check"><title>わからない</title><path d="M776 164 V176 C776 208 1091.5 208 1091.5 240 V252"/><path d="M1091.5 290 V320 C1091.5 352 1130 352 1130 384 V396 V558 C1130 590 1130 590 1130 622 V634 V684 C1130 716 1130 716 1130 748 V760 V945 C1130 977 1130 977 1130 1009 V1021 V1071 C1130 1103 1056 1103 1056 1135 V1147" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M896 1297 V1351 C896 1383 758 1383 758 1415 V1427"/><path d="M758 1465 V1477 C758 1509 692 1509 692 1541 V1553" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="718" y="1427" width="80" height="38" rx="5"/><text text-anchor="middle" x="758" y="1450">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 1297 V1351 C976 1383 963 1383 963 1415 V1427"/><path d="M963 1465 V1477 C963 1509 922.667 1509 922.667 1541 V1553" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="1427" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1450">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 1297 V1351 C1056 1383 1091.5 1383 1091.5 1415 V1427"/><path d="M1091.5 1465 V1477 C1091.5 1509 1029.333 1509 1029.333 1541 V1553" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1427" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1450">わからない</text></g></g><g class="flow-edge yes" data-edge="xor-rank-distinct:yes:xor-rank-order"><title>はい</title><path d="M840 546 V558 C840 590 711.167 590 711.167 622 V634"/><path d="M711.167 672 V684 C711.167 716 711.167 716 711.167 748 V760" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor-rank-distinct:yes:xor-rank-order" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="671.1666666666666" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="711.1666666666666" y="657">はい</text></g></g><g class="flow-edge no" data-edge="xor-rank-distinct:no:fallback"><title>いいえ</title><path d="M920 546 V558 C920 590 907 590 907 622 V634"/><path d="M907 672 V684 C907 716 1018 716 1018 748 V760 V945 C1018 977 1018 977 1018 1009 V1021 V1071 C1018 1103 766 1103 766 1135 V1147 V1351 C766 1383 668 1383 668 1415 V1427 V1477 C668 1509 612 1509 612 1541 V1553" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor-rank-distinct:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="xor-rank-distinct:unknown:check"><title>わからない</title><path d="M1000 546 V558 C1000 590 1035.5 590 1035.5 622 V634"/><path d="M1035.5 672 V684 C1035.5 716 1074 716 1074 748 V760 V945 C1074 977 1074 977 1074 1009 V1021 V1071 C1074 1103 976 1103 976 1135 V1147" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor-rank-distinct:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="xor-rank-order:yes:xor-rank-result"><title>はい</title><path d="M631.167 933 V945 C631.167 977 500 977 500 1009 V1021"/><path d="M500 1059 V1071 C500 1103 500 1103 500 1135 V1147" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor-rank-order:yes:xor-rank-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="460" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="500" y="1044">はい</text></g></g><g class="flow-edge no" data-edge="xor-rank-order:no:fallback"><title>いいえ</title><path d="M711.167 933 V945 C711.167 977 710 977 710 1009 V1021"/><path d="M710 1059 V1071 C710 1103 710 1103 710 1135 V1147 V1351 C710 1383 612 1383 612 1415 V1427 V1477 C612 1509 532 1509 532 1541 V1553" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor-rank-order:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="670" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="710" y="1044">いいえ</text></g></g><g class="flow-edge unknown" data-edge="xor-rank-order:unknown:check"><title>わからない</title><path d="M791.167 933 V945 C791.167 977 923.5 977 923.5 1009 V1021"/><path d="M923.5 1059 V1071 C923.5 1103 896 1103 896 1135 V1147" marker-end="url(#arrow-math-xor-values)"/><g class="flow-edge-label" data-edge-label="xor-rank-order:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="1021" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="1044">わからない</text></g></g><g class="flow-node question" data-node="xor"><rect x="520" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="536" y="52">質問</text><text class="node-title" x="536" y="80">XOR による組合せや到達可能な値</text><text class="node-title" x="536" y="103">を扱いますか？</text><text class="node-explanation" x="536" y="130">XOR は二元体上の線形演算として表せます。</text></g><g class="flow-node route" data-node="polynomial"><rect x="396" y="396" width="320" height="139" rx="7"/><text class="node-kind" x="412" y="416">分野</text><text class="node-title" x="412" y="444">式の積・変換の条件</text><text class="node-explanation" x="412" y="471">多項式の積や繰り返す変換で表せるかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-math-expression-conditions" data-route="math-expression-conditions"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="816" y="1147" width="320" height="150" rx="7"/><text class="node-kind" x="832" y="1167">質問</text><text class="node-title" x="832" y="1195">答えは「個数」「最適値」「存在判</text><text class="node-title" x="832" y="1218">定」のどれか区別できますか？</text><text class="node-explanation" x="832" y="1245">同じ入力でも、求める量によって使う演算が異なりま</text><text class="node-explanation" x="832" y="1263">す。</text></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1553" width="320" height="139" rx="7"/><text class="node-kind" x="832" y="1573">分野</text><text class="node-title" x="832" y="1601">条件を確かめる</text><text class="node-explanation" x="832" y="1628">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1656">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="xor-result"><rect x="32" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="416">候補</text><text class="node-title" x="48" y="444">XOR 基底</text><a href="/flowchartcp/techniques/xor-basis/"><title>XOR基底の記事へ</title><text x="48" y="483">XOR基底</text></a></g><g class="flow-node result" data-node="fallback"><rect x="452" y="1553" width="320" height="151" rx="7"/><text class="node-kind" x="468" y="1573">候補</text><text class="node-title" x="468" y="1601">求める量を式にする</text><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="468" y="1640">寄与の数え上げ</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="468" y="1664">状態の設計</text></a></g><g class="flow-node question" data-node="xor-rank-distinct"><rect x="760" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="416">質問</text><text class="node-title" x="776" y="444">同じ XOR 値になる部分集合は、</text><text class="node-title" x="776" y="467">重複を除いて一つの値としますか？</text><text class="node-explanation" x="776" y="494">部分集合の数の順位とは異なります。独立な XOR</text><text class="node-explanation" x="776" y="512"> の方向の係数で、異なる値だけを表します。</text></g><g class="flow-node question" data-node="xor-rank-order"><rect x="551.1666666666666" y="760" width="320" height="173" rx="7"/><text class="node-kind" x="567.1666666666666" y="780">質問</text><text class="node-title" x="567.1666666666666" y="808">最高ビットを揃え、他の基準ビットを</text><text class="node-title" x="567.1666666666666" y="831">消して、係数の二進順と値の昇順を一</text><text class="node-title" x="567.1666666666666" y="854">致させられますか？</text><text class="node-explanation" x="567.1666666666666" y="881">単に挿入した順の基底を使うと、係数の二進順は値の</text><text class="node-explanation" x="567.1666666666666" y="899">大小順になりません。</text></g><g class="flow-node result" data-node="xor-rank-result"><rect x="340" y="1147" width="320" height="192" rx="7"/><text class="node-kind" x="356" y="1167">候補</text><text class="node-title" x="356" y="1195">基準ビットを消し合わせ、二進の順位</text><text class="node-title" x="356" y="1218">から XOR 値を復元する</text><a href="/flowchartcp/techniques/xor-basis-kth/"><title>部分集合XORの異なる値を、基底の係数順に並べるの記事へ</title><text x="356" y="1257">部分集合XORの異なる値を、基底の係数順に並べ</text><text x="356" y="1275">る</text></a><a href="/flowchartcp/techniques/xor-basis/"><title>XOR基底の記事へ</title><text x="356" y="1299">XOR基底</text></a></g></svg>