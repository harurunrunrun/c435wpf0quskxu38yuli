<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-game-general flow-desc-game-general" width="1168" height="1661" viewBox="0 0 1168 1661" data-flow-svg="game-general"><title id="flow-title-game-general">その他の合法手から勝敗を設計するの解法フローチャート</title><desc id="flow-desc-game-general">状態の順序と独立性を確かめる一般の完全情報ゲームです。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-game-general" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="game:yes:acyclic"><title>はい</title><path d="M852.778 182 V194 C852.778 226 743.833 226 743.833 258 V270"/><path d="M743.833 308 V320 C743.833 352 743.833 352 743.833 384 V396" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="game:yes:acyclic" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="703.8333333333334" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="743.8333333333334" y="293">はい</text></g></g><g class="flow-edge no" data-edge="game:no:fallback"><title>いいえ</title><path d="M932.778 182 V194 C932.778 226 963 226 963 258 V270"/><path d="M963 308 V320 C963 352 1074 352 1074 384 V396 V558 C1074 590 1074 590 1074 622 V634 V684 C1074 716 1074 716 1074 748 V760 V923 C1074 955 1074 955 1074 987 V999 V1049 C1074 1081 1130 1081 1130 1113 V1125 V1288 C1130 1320 1130 1320 1130 1352 V1364 V1414 C1130 1446 665.333 1446 665.333 1478 V1490" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="game:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="game:unknown:check"><title>わからない</title><path d="M1012.778 182 V194 C1012.778 226 1091.5 226 1091.5 258 V270"/><path d="M1091.5 308 V320 C1091.5 352 1130 352 1130 384 V396 V558 C1130 590 1130 590 1130 622 V634 V684 C1130 716 1130 716 1130 748 V760 V923 C1130 955 1130 955 1130 987 V999 V1049 C1130 1081 1000 1081 1000 1113 V1125" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="game:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="acyclic:yes:independent"><title>はい</title><path d="M663.833 546 V558 C663.833 590 444 590 444 622 V634"/><path d="M444 672 V684 C444 716 444 716 444 748 V760" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="acyclic:yes:independent" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="404" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="444" y="657">はい</text></g></g><g class="flow-edge no" data-edge="acyclic:no:cycle"><title>いいえ</title><path d="M743.833 546 V558 C743.833 590 808 590 808 622 V634"/><path d="M808 672 V684 C808 716 808 716 808 748 V760" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="acyclic:no:cycle" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="768" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="808" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="acyclic:unknown:check"><title>わからない</title><path d="M823.833 546 V558 C823.833 590 979.5 590 979.5 622 V634"/><path d="M979.5 672 V684 C979.5 716 1018 716 1018 748 V760 V923 C1018 955 1014.5 955 1014.5 987 V999 V1049 C1014.5 1081 920 1081 920 1113 V1125" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="acyclic:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="935" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="979.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="independent:yes:grundy"><title>はい</title><path d="M364 910 V923 C364 955 192 955 192 987 V999"/><path d="M192 1037 V1049 C192 1081 192 1081 192 1113 V1125" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="independent:yes:grundy" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="999" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1022">はい</text></g></g><g class="flow-edge no" data-edge="independent:no:game-dp"><title>いいえ</title><path d="M444 910 V923 C444 955 556 955 556 987 V999"/><path d="M556 1037 V1049 C556 1081 556 1081 556 1113 V1125" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="independent:no:game-dp" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="999" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1022">いいえ</text></g></g><g class="flow-edge unknown" data-edge="independent:unknown:check"><title>わからない</title><path d="M524 910 V923 C524 955 920 955 920 987 V999"/><path d="M920 1037 V1049 C920 1081 840 1081 840 1113 V1125" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="independent:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="999" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="1022">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M840 1275 V1288 C840 1320 612 1320 612 1352 V1364"/><path d="M612 1402 V1414 C612 1446 558.667 1446 558.667 1478 V1490" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="572" y="1364" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="1387">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1275 V1288 C920 1320 907 1320 907 1352 V1364"/><path d="M907 1402 V1414 C907 1446 922.667 1446 922.667 1478 V1490" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1364" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1387">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1275 V1288 C1000 1320 1035.5 1320 1035.5 1352 V1364"/><path d="M1035.5 1402 V1414 C1035.5 1446 1029.333 1446 1029.333 1478 V1490" marker-end="url(#arrow-game-general)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1364" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1387">わからない</text></g></g><g class="flow-node question" data-node="game"><rect x="772.7777777777778" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="788.7777777777778" y="52">質問</text><text class="node-title" x="788.7777777777778" y="80">二人が交互に操作し、勝敗を決めます</text><text class="node-title" x="788.7777777777778" y="103">か？</text><text class="node-explanation" x="788.7777777777778" y="130">手番と合法手を状態に含める必要があるか確認しま</text><text class="node-explanation" x="788.7777777777778" y="148">す。</text></g><g class="flow-node question" data-node="acyclic"><rect x="583.8333333333334" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="599.8333333333334" y="416">質問</text><text class="node-title" x="599.8333333333334" y="444">操作のたびに、残りの量が減るなど状</text><text class="node-title" x="599.8333333333334" y="467">態の順序が進みますか？</text><text class="node-explanation" x="599.8333333333334" y="494">循環があるゲームでは、単純な後ろ向き DP だけ</text><text class="node-explanation" x="599.8333333333334" y="512">では引き分けなどを扱えない場合があります。</text></g><g class="flow-node question" data-node="independent"><rect x="284" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="300" y="780">質問</text><text class="node-title" x="300" y="808">ゲームは独立な部分ゲームの和に分け</text><text class="node-title" x="300" y="831">られますか？</text><text class="node-explanation" x="300" y="858">双方の合法手が同じで、動けない側が負ける通常ルー</text><text class="node-explanation" x="300" y="876">ルか確認します。</text></g><g class="flow-node result" data-node="grundy"><rect x="32" y="1125" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="1145">候補</text><text class="node-title" x="48" y="1173">Grundy 数と XOR</text><a href="/flowchartcp/techniques/game-theory/"><title>Grundy数の記事へ</title><text x="48" y="1212">Grundy数</text></a></g><g class="flow-node result" data-node="game-dp"><rect x="396" y="1125" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1145">候補</text><text class="node-title" x="412" y="1173">勝ち・負けのゲーム DP</text><a href="/flowchartcp/techniques/game-theory/"><title>Grundy数の記事へ</title><text x="412" y="1212">Grundy数</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1236">反例探し</text></a></g><g class="flow-node result" data-node="cycle"><rect x="648" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="664" y="780">候補</text><text class="node-title" x="664" y="808">循環するゲームの状態を調べる</text><a href="/flowchartcp/techniques/game-theory/"><title>Grundy数の記事へ</title><text x="664" y="847">Grundy数</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="664" y="871">状態の設計</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1125" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1145">質問</text><text class="node-title" x="776" y="1173">一手の合法性と、同じ状態へ戻るかを</text><text class="node-title" x="776" y="1196">小さい例で確認できますか？</text><text class="node-explanation" x="776" y="1223">勝敗の情報と確率の履歴を、それぞれ必要なだけ持ち</text><text class="node-explanation" x="776" y="1241">ます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1490" width="320" height="139" rx="7"/><text class="node-kind" x="832" y="1510">分野</text><text class="node-title" x="832" y="1538">条件を確かめる</text><text class="node-explanation" x="832" y="1565">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1593">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="452" y="1490" width="320" height="127" rx="7"/><text class="node-kind" x="468" y="1510">候補</text><text class="node-title" x="468" y="1538">確率と手番の状態を定義する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="468" y="1577">状態の設計</text></a></g></svg>