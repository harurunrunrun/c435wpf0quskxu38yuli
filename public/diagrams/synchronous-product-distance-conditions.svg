node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="undirected:yes:simultaneous"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-synchronous-product-distance-conditions)"/><g class="flow-edge-label" data-edge-label="undirected:yes:simultaneous" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="undirected:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V581 C654 613 654 613 654 645 V657 V707 C654 739 654 739 654 771 V783 V963 C654 995 654 995 654 1027 V1039 V1089 C654 1121 624.571 1121 624.571 1153 V1165" marker-end="url(#arrow-synchronous-product-distance-conditions)"/><g class="flow-edge-label" data-edge-label="undirected:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="undirected:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V581 C710 613 710 613 710 645 V657 V707 C710 739 710 739 710 771 V783 V963 C710 995 710 995 710 1027 V1039 V1089 C710 1121 670.286 1121 670.286 1153 V1165" marker-end="url(#arrow-synchronous-product-distance-conditions)"/><g class="flow-edge-label" data-edge-label="undirected:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="simultaneous:yes:size"><title>はい</title><path d="M352.5 569 V581 C352.5 613 307 613 307 645 V657"/><path d="M307 695 V707 C307 739 319.5 739 319.5 771 V783" marker-end="url(#arrow-synchronous-product-distance-conditions)"/><g class="flow-edge-label" data-edge-label="simultaneous:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="680">はい</text></g></g><g class="flow-edge no" data-edge="simultaneous:no:check"><title>いいえ</title><path d="M432.5 569 V581 C432.5 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 542 739 542 771 V783 V963 C542 995 542 995 542 1027 V1039 V1089 C542 1121 533.143 1121 533.143 1153 V1165" marker-end="url(#arrow-synchronous-product-distance-conditions)"/><g class="flow-edge-label" data-edge-label="simultaneous:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="simultaneous:unknown:check"><title>わからない</title><path d="M512.5 569 V581 C512.5 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 598 739 598 771 V783 V963 C598 995 598 995 598 1027 V1039 V1089 C598 1121 578.857 1121 578.857 1153 V1165" marker-end="url(#arrow-synchronous-product-distance-conditions)"/><g class="flow-edge-label" data-edge-label="simultaneous:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:answer"><title>はい</title><path d="M239.5 951 V963 C239.5 995 192 995 192 1027 V1039"/><path d="M192 1077 V1089 C192 1121 192 1121 192 1153 V1165" marker-end="url(#arrow-synchronous-product-distance-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 951 V963 C319.5 995 319 995 319 1027 V1039"/><path d="M319 1077 V1089 C319 1121 441.714 1121 441.714 1153 V1165" marker-end="url(#arrow-synchronous-product-distance-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 951 V963 C399.5 995 447.5 995 447.5 1027 V1039"/><path d="M447.5 1077 V1089 C447.5 1121 487.429 1121 487.429 1153 V1165" marker-end="url(#arrow-synchronous-product-distance-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="undirected"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">各成分は無向の単位費用グラフで、始</text><text class="node-title" x="400.5" y="103">点が固定されていますか？</text><text class="node-explanation" x="400.5" y="130">辺を往復して歩数を2増やせることを使います。有向</text><text class="node-explanation" x="400.5" y="148">グラフでは同じ延長を保証できません。</text></g><g class="flow-node question" data-node="simultaneous"><rect x="272.5" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">各歩で全ての成分が辺を一本進み、到</text><text class="node-title" x="288.5" y="467">達できる全ての組状態への最短距離を</text><text class="node-title" x="288.5" y="490">合計しますか？</text><text class="node-explanation" x="288.5" y="517">一成分だけを動かす場合は距離の和になります。この</text><text class="node-explanation" x="288.5" y="535">問題では全成分の歩数と偶奇をそろえます。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="803">質問</text><text class="node-title" x="175.5" y="831">組状態を列挙できなくても、各成分の</text><text class="node-title" x="175.5" y="854">頂点と辺の合計は処理できますか？</text><text class="node-explanation" x="175.5" y="881">掲載実装は合計頂点100000、合計辺</text><text class="node-explanation" x="175.5" y="899">200000以下。孤立した始点では組状態を動かせ</text><text class="node-explanation" x="175.5" y="917">ない場合を先に分けます。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1185">候補</text><text class="node-title" x="48" y="1213">偶奇別の到達距離の最大値を集計し、</text><text class="node-title" x="48" y="1236">両方で到達できる組の重複を引く</text><a href="/flowchartcp/techniques/synchronous-product-parity-distance-sum/"><title>全成分を同時に一歩ずつ進む距離の総和は、偶奇別の最短距離と最大値の集計に分けるの記事へ</title><text x="48" y="1275">全成分を同時に一歩ずつ進む距離の総和は、偶奇別</text><text x="48" y="1293">の最短距離と最大値の集計に分ける</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1185">分野</text><text class="node-title" x="412" y="1213">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1250">詳細の質問・図へ →</text></a></g></svg>