.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="owned-total-directed:yes:recurrent-target"><title>はい</title><path d="M464.5 223 V235 C464.5 267 419 267 419 299 V311"/><path d="M419 349 V361 C419 393 432.5 393 432.5 425 V437" marker-end="url(#arrow-owned-repeated-target-conditions)"/><g class="flow-edge-label" data-edge-label="owned-total-directed:yes:recurrent-target" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="334">はい</text></g></g><g class="flow-edge no" data-edge="owned-total-directed:no:check"><title>いいえ</title><path d="M544.5 223 V235 C544.5 267 543 267 543 299 V311"/><path d="M543 349 V361 C543 393 654 393 654 425 V437 V617 C654 649 654 649 654 681 V693 V743 C654 775 654 775 654 807 V819 V1022 C654 1054 654 1054 654 1086 V1098 V1148 C654 1180 624.571 1180 624.571 1212 V1224" marker-end="url(#arrow-owned-repeated-target-conditions)"/><g class="flow-edge-label" data-edge-label="owned-total-directed:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="owned-total-directed:unknown:check"><title>わからない</title><path d="M624.5 223 V235 C624.5 267 671.5 267 671.5 299 V311"/><path d="M671.5 349 V361 C671.5 393 710 393 710 425 V437 V617 C710 649 710 649 710 681 V693 V743 C710 775 710 775 710 807 V819 V1022 C710 1054 710 1054 710 1086 V1098 V1148 C710 1180 670.286 1180 670.286 1212 V1224" marker-end="url(#arrow-owned-repeated-target-conditions)"/><g class="flow-edge-label" data-edge-label="owned-total-directed:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="recurrent-target:yes:bounds"><title>はい</title><path d="M352.5 605 V617 C352.5 649 307 649 307 681 V693"/><path d="M307 731 V743 C307 775 319.5 775 319.5 807 V819" marker-end="url(#arrow-owned-repeated-target-conditions)"/><g class="flow-edge-label" data-edge-label="recurrent-target:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="716">はい</text></g></g><g class="flow-edge no" data-edge="recurrent-target:no:check"><title>いいえ</title><path d="M432.5 605 V617 C432.5 649 431 649 431 681 V693"/><path d="M431 731 V743 C431 775 542 775 542 807 V819 V1022 C542 1054 542 1054 542 1086 V1098 V1148 C542 1180 533.143 1180 533.143 1212 V1224" marker-end="url(#arrow-owned-repeated-target-conditions)"/><g class="flow-edge-label" data-edge-label="recurrent-target:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="recurrent-target:unknown:check"><title>わからない</title><path d="M512.5 605 V617 C512.5 649 559.5 649 559.5 681 V693"/><path d="M559.5 731 V743 C559.5 775 598 775 598 807 V819 V1022 C598 1054 598 1054 598 1086 V1098 V1148 C598 1180 578.857 1180 578.857 1212 V1224" marker-end="url(#arrow-owned-repeated-target-conditions)"/><g class="flow-edge-label" data-edge-label="recurrent-target:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 1010 V1022 C239.5 1054 192 1054 192 1086 V1098"/><path d="M192 1136 V1148 C192 1180 192 1180 192 1212 V1224" marker-end="url(#arrow-owned-repeated-target-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1121">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 1010 V1022 C319.5 1054 319 1054 319 1086 V1098"/><path d="M319 1136 V1148 C319 1180 441.714 1180 441.714 1212 V1224" marker-end="url(#arrow-owned-repeated-target-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1121">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 1010 V1022 C399.5 1054 447.5 1054 447.5 1086 V1098"/><path d="M447.5 1136 V1148 C447.5 1180 487.429 1180 487.429 1212 V1224" marker-end="url(#arrow-owned-repeated-target-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1098" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1121">わからない</text></g></g><g class="flow-node question" data-node="owned-total-directed"><rect x="384.5" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">各頂点を二人のどちらかが所有し、一</text><text class="node-title" x="400.5" y="103">本以上ある出辺から所有者が移動先を</text><text class="node-title" x="400.5" y="126">選びますか？</text><text class="node-explanation" x="400.5" y="153">有向グラフの全ての頂点に出辺があります。確率的な</text><text class="node-explanation" x="400.5" y="171">移動はなく、二人はグラフ全体を知っています。所有</text><text class="node-explanation" x="400.5" y="189">者が頂点ごとに決まるため、手番が交互になるとは…</text></g><g class="flow-node question" data-node="recurrent-target"><rect x="272.5" y="437" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="457">質問</text><text class="node-title" x="288.5" y="485">目標を無限回訪れる側と、やがて目標</text><text class="node-title" x="288.5" y="508">を訪れなくする側の勝敗ですか？</text><text class="node-explanation" x="288.5" y="535">一度の到達では足りません。辺を毎回選ぶ規則と、初</text><text class="node-explanation" x="288.5" y="553">訪問時に永久固定する規則の両方で、頂点ごとの固定</text><text class="node-explanation" x="288.5" y="571">戦略を作れます。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="819" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="839">質問</text><text class="node-title" x="175.5" y="867">頂点1〜5000・辺数は頂点数以上</text><text class="node-title" x="175.5" y="890">20000以下で、同じ向きの重複辺</text><text class="node-title" x="175.5" y="913">がありませんか？</text><text class="node-explanation" x="175.5" y="940">自己ループと逆向きの二辺は許します。原典アダプ</text><text class="node-explanation" x="175.5" y="958">ターでは目標が一つ以上必要で、一般APIは目標が</text><text class="node-explanation" x="175.5" y="976">空の場合にも対応します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1224" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1244">候補</text><text class="node-title" x="48" y="1272">目標を避けられる領域を繰り返し除</text><text class="node-title" x="48" y="1295">き、両側の固定戦略を作る</text><a href="/flowchartcp/techniques/buchi-owned-graph-repeated-target-attractor-elimination/"><title>頂点の所有者が移動先を決めるゲームで、目標を繰り返し訪れられるか調べるの記事へ</title><text x="48" y="1334">頂点の所有者が移動先を決めるゲームで、目標を繰</text><text x="48" y="1352">り返し訪れられるか調べる</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1224" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1244">分野</text><text class="node-title" x="412" y="1272">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1309">詳細の質問・図へ →</text></a></g></svg>