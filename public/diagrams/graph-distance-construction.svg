1350 C896 1382 758 1382 758 1414 V1426"/><path d="M758 1464 V1476 C758 1508 668 1508 668 1540 V1552" marker-end="url(#arrow-graph-distance-construction)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="718" y="1426" width="80" height="38" rx="5"/><text text-anchor="middle" x="758" y="1449">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 1320 V1350 C976 1382 963 1382 963 1414 V1426"/><path d="M963 1464 V1476 C963 1508 978.667 1508 978.667 1540 V1552" marker-end="url(#arrow-graph-distance-construction)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="1426" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1449">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 1320 V1350 C1056 1382 1091.5 1382 1091.5 1414 V1426"/><path d="M1091.5 1464 V1476 C1091.5 1508 1085.333 1508 1085.333 1540 V1552" marker-end="url(#arrow-graph-distance-construction)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1426" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1449">わからない</text></g></g><g class="flow-node question" data-node="distance-two"><rect x="753.2222222222222" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="769.2222222222222" y="52">質問</text><text class="node-title" x="769.2222222222222" y="80">単純連結な無向グラフで、辺の長さは</text><text class="node-title" x="769.2222222222222" y="103"> 1、距離 2 の頂点対を指定しま</text><text class="node-title" x="769.2222222222222" y="126">すか？</text><text class="node-explanation" x="769.2222222222222" y="153">重み付きや有向の距離では、同じ個数の変化は保証さ</text><text class="node-explanation" x="769.2222222222222" y="171">れません。</text></g><g class="flow-node question" data-node="star-allowed"><rect x="413.16666666666663" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="429.16666666666663" y="439">質問</text><text class="node-title" x="429.16666666666663" y="467">一つの中心から全頂点へ辺を張り、他</text><text class="node-title" x="429.16666666666663" y="490">の頂点間の辺も自由に追加できます</text><text class="node-title" x="429.16666666666663" y="513">か？</text><text class="node-explanation" x="429.16666666666663" y="540">使える辺に制限がある場合は、この構築をそのまま使</text><text class="node-explanation" x="429.16666666666663" y="558">えません。</text></g><g class="flow-node question" data-node="distance-count-bound"><rect x="452" y="806" width="320" height="150" rx="7"/><text class="node-kind" x="468" y="826">質問</text><text class="node-title" x="468" y="854">目標の個数は 0 から (N−1)</text><text class="node-title" x="468" y="877">(N−2)/2 の範囲ですか？</text><text class="node-explanation" x="468" y="904">連結には少なくとも N−1 辺が必要なので、それ</text><text class="node-explanation" x="468" y="922">以外の頂点対の数が距離 2 の上限になります。</text></g><g class="flow-node result" data-node="star-result"><rect x="88" y="1170" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="1190">候補</text><text class="node-title" x="104" y="1218">中心につなぐ形から始め、他の頂点間</text><text class="node-title" x="104" y="1241">の辺で距離 2 の対を減らす</text><a href="/flowchartcp/techniques/construct-star-distance-two/"><title>距離 2 の頂点対を指定するなら、星から葉どうしの辺を足すの記事へ</title><text x="104" y="1280">距離 2 の頂点対を指定するなら、星から葉どう</text><text x="104" y="1298">しの辺を足す</text></a></g><g class="flow-node result" data-node="star-impossible"><rect x="452" y="1170" width="320" height="168" rx="7"/><text class="node-kind" x="468" y="1190">候補</text><text class="node-title" x="468" y="1218">連結な単純グラフの上限を超える目標</text><text class="node-title" x="468" y="1241">は不可能と判定する</text><a href="/flowchartcp/techniques/construct-star-distance-two/"><title>距離 2 の頂点対を指定するなら、星から葉どうしの辺を足すの記事へ</title><text x="468" y="1280">距離 2 の頂点対を指定するなら、星から葉どう</text><text x="468" y="1298">しの辺を足す</text></a></g><g class="flow-node question" data-node="check"><rect x="816" y="1170" width="320" height="150" rx="7"/><text class="node-kind" x="832" y="1190">質問</text><text class="node-title" x="832" y="1218">必要な条件を、問題文と小さい例から</text><text class="node-title" x="832" y="1241">確認できますか？</text><text class="node-explanation" x="832" y="1268">どの性質が入力で保証され、どの性質を式や操作から</text><text class="node-explanation" x="832" y="1286">示す必要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="508" y="1552" width="320" height="151" rx="7"/><text class="node-kind" x="524" y="1572">候補</text><text class="node-title" x="524" y="1600">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="524" y="1639">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="524" y="1663">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="872" y="1552" width="320" height="121" rx="7"/><text class="node-kind" x="888" y="1572">分野</text><text class="node-title" x="888" y="1600">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="888" y="1637">詳細の質問・図へ →</text></a></g></svg>