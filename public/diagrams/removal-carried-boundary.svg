39 652 771 V783" marker-end="url(#arrow-removal-carried-boundary)"/><g class="flow-edge-label" data-edge-label="same-color:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="outside-count:yes:answer"><title>はい</title><path d="M314.167 569 V581 C314.167 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-removal-carried-boundary)"/><g class="flow-edge-label" data-edge-label="outside-count:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="outside-count:no:check"><title>いいえ</title><path d="M394.167 569 V581 C394.167 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 460 739 460 771 V783" marker-end="url(#arrow-removal-carried-boundary)"/><g class="flow-edge-label" data-edge-label="outside-count:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="outside-count:unknown:check"><title>わからない</title><path d="M474.167 569 V581 C474.167 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 524 739 524 771 V783" marker-end="url(#arrow-removal-carried-boundary)"/><g class="flow-edge-label" data-edge-label="outside-count:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-node question" data-node="same-color"><rect x="376.2222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="392.2222222222223" y="52">質問</text><text class="node-title" x="392.2222222222223" y="80">現在隣り合う同色だけを削除でき、得</text><text class="node-title" x="392.2222222222223" y="103">点は削除個数の二乗ですか？</text><text class="node-explanation" x="392.2222222222223" y="130">間を先に消すと同色が合流します。任意の得点関数で</text><text class="node-explanation" x="392.2222222222223" y="148">は、一塊として持つ正当性を確認し直します。</text></g><g class="flow-node question" data-node="outside-count"><rect x="234.16666666666669" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="250.16666666666669" y="416">質問</text><text class="node-title" x="250.16666666666669" y="444">区間の両端に加え、右端へつながる同</text><text class="node-title" x="250.16666666666669" y="467">色の個数を持つ三次元の状態が収まり</text><text class="node-title" x="250.16666666666669" y="490">ますか？</text><text class="node-explanation" x="250.16666666666669" y="517">状態O(N^3)、合流先を試してO(N^4)時</text><text class="node-explanation" x="250.16666666666669" y="535">間。掲載実装は長さ100以下です。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">今消す場合と、中を消して同色へ合流</text><text class="node-title" x="48" y="854">する場合を比べる</text><a href="/flowchartcp/techniques/interval-removal-carried-group/"><title>同色を後でまとめて消す区間DPは、端へつながる同色の個数を持つの記事へ</title><text x="48" y="893">同色を後でまとめて消す区間DPは、端へつながる</text><text x="48" y="911">同色の個数を持つ</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="783" width="320" height="144" rx="7"/><text class="node-kind" x="412" y="803">分野</text><text class="node-title" x="412" y="831">適用条件と、残す必要のある情報を確</text><text class="node-title" x="412" y="854">かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="891">詳細の質問・図へ →</text></a></g></svg>