<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-injective-pair-positions flow-desc-injective-pair-positions" width="860" height="1366" viewBox="0 0 860 1366" data-flow-svg="injective-pair-positions"><title id="flow-title-injective-pair-positions">重複のない二列の同位置不一致の解法フローチャート</title><desc id="flow-desc-injective-pair-positions">同時に一致する位置を選び、残る各列の順列数を包除します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-injective-pair-positions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="injective:yes:coordinate"><title>はい</title><path d="M539.722 205 V217 C539.722 249 420.667 249 420.667 281 V293"/><path d="M420.667 331 V343 C420.667 375 420.667 375 420.667 407 V419" marker-end="url(#arrow-injective-pair-positions)"/><g class="flow-edge-label" data-edge-label="injective:yes:coordinate" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="316">はい</text></g></g><g class="flow-edge no" data-edge="injective:no:fallback"><title>いいえ</title><path d="M619.722 205 V217 C619.722 249 655 249 655 281 V293"/><path d="M655 331 V343 C655 375 762.5 375 762.5 407 V419 V599 C762.5 631 762.5 631 762.5 663 V675 V725 C762.5 757 458 757 458 789 V801 V981 C458 1013 360 1013 360 1045 V1057 V1107 C360 1139 304 1139 304 1171 V1183" marker-end="url(#arrow-injective-pair-positions)"/><g class="flow-edge-label" data-edge-label="injective:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="injective:unknown:check"><title>わからない</title><path d="M699.722 205 V217 C699.722 249 783.5 249 783.5 281 V293"/><path d="M783.5 331 V343 C783.5 375 818.5 375 818.5 407 V419 V599 C818.5 631 818.5 631 818.5 663 V675 V725 C818.5 757 721.333 757 721.333 789 V801" marker-end="url(#arrow-injective-pair-positions)"/><g class="flow-edge-label" data-edge-label="injective:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="coordinate:yes:injective-result"><title>はい</title><path d="M340.667 587 V599 C340.667 631 192 631 192 663 V675"/><path d="M192 713 V725 C192 757 192 757 192 789 V801" marker-end="url(#arrow-injective-pair-positions)"/><g class="flow-edge-label" data-edge-label="coordinate:yes:injective-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="698">はい</text></g></g><g class="flow-edge no" data-edge="coordinate:no:fallback"><title>いいえ</title><path d="M420.667 587 V599 C420.667 631 402 631 402 663 V675"/><path d="M402 713 V725 C402 757 402 757 402 789 V801 V981 C402 1013 304 1013 304 1045 V1057 V1107 C304 1139 224 1139 224 1171 V1183" marker-end="url(#arrow-injective-pair-positions)"/><g class="flow-edge-label" data-edge-label="coordinate:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="coordinate:unknown:check"><title>わからない</title><path d="M500.667 587 V599 C500.667 631 668 631 668 663 V675"/><path d="M668 713 V725 C668 757 614.667 757 614.667 789 V801" marker-end="url(#arrow-injective-pair-positions)"/><g class="flow-edge-label" data-edge-label="coordinate:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 951 V981 C588 1013 450 1013 450 1045 V1057"/><path d="M450 1095 V1107 C450 1139 384 1139 384 1171 V1183" marker-end="url(#arrow-injective-pair-positions)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 951 V981 C668 1013 655 1013 655 1045 V1057"/><path d="M655 1095 V1107 C655 1139 614.667 1139 614.667 1171 V1183" marker-end="url(#arrow-injective-pair-positions)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 951 V981 C748 1013 783.5 1013 783.5 1045 V1057"/><path d="M783.5 1095 V1107 C783.5 1139 721.333 1139 721.333 1171 V1183" marker-end="url(#arrow-injective-pair-positions)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="injective"><rect x="459.7222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">長さ n の各列の中では値が重複せ</text><text class="node-title" x="475.7222222222223" y="103">ず、共通の m 種類から選びます</text><text class="node-title" x="475.7222222222223" y="126">か？</text><text class="node-explanation" x="475.7222222222223" y="153">n≤m が必要です。二列の組を区別し、同じ位置で</text><text class="node-explanation" x="475.7222222222223" y="171">の値の一致だけを禁じます。</text></g><g class="flow-node question" data-node="coordinate"><rect x="260.6666666666667" y="419" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="439">質問</text><text class="node-title" x="276.6666666666667" y="467">列の異なる位置同士での値の共有は、</text><text class="node-title" x="276.6666666666667" y="490">許されますか？</text><text class="node-explanation" x="276.6666666666667" y="517">固定した一致位置以外は、二列が独立に残りの種類か</text><text class="node-explanation" x="276.6666666666667" y="535">ら選べます。位置をまたぐ共有禁止があると別の数え</text><text class="node-explanation" x="276.6666666666667" y="553">方になります。</text></g><g class="flow-node result" data-node="injective-result"><rect x="32" y="801" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="821">候補</text><text class="node-title" x="48" y="849">一致する位置の集合を包除し、残りの</text><text class="node-title" x="48" y="872">二列の順列数を掛ける</text><a href="/flowchartcp/techniques/injective-coordinate-avoidance/"><title>重複しない二本の列の同位置一致を、強制する一致数で包除するの記事へ</title><text x="48" y="911">重複しない二本の列の同位置一致を、強制する一致</text><text x="48" y="929">数で包除する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="801" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="821">質問</text><text class="node-title" x="524" y="849">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="872">確認できますか？</text><text class="node-explanation" x="524" y="899">区別する対象、求める個数、操作の条件を確認しま</text><text class="node-explanation" x="524" y="917">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1203">候補</text><text class="node-title" x="160" y="1231">条件と数え方をもう一度確かめる</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="160" y="1270">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1294">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1203">分野</text><text class="node-title" x="524" y="1231">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1268">詳細の質問・図へ →</text></a></g></svg>