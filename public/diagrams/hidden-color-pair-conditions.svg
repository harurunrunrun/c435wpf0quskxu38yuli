407 V419 V604 C710 636 710 636 710 668 V680 V730 C710 762 710 762 710 794 V806 V986 C710 1018 710 1018 710 1050 V1062 V1112 C710 1144 670.286 1144 670.286 1176 V1188" marker-end="url(#arrow-hidden-color-pair-conditions)"/><g class="flow-edge-label" data-edge-label="paired-colors:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="color-query:yes:budget"><title>はい</title><path d="M352.5 592 V604 C352.5 636 307 636 307 668 V680"/><path d="M307 718 V730 C307 762 319.5 762 319.5 794 V806" marker-end="url(#arrow-hidden-color-pair-conditions)"/><g class="flow-edge-label" data-edge-label="color-query:yes:budget" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="703">はい</text></g></g><g class="flow-edge no" data-edge="color-query:no:check"><title>いいえ</title><path d="M432.5 592 V604 C432.5 636 431 636 431 668 V680"/><path d="M431 718 V730 C431 762 542 762 542 794 V806 V986 C542 1018 542 1018 542 1050 V1062 V1112 C542 1144 533.143 1144 533.143 1176 V1188" marker-end="url(#arrow-hidden-color-pair-conditions)"/><g class="flow-edge-label" data-edge-label="color-query:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="703">いいえ</text></g></g><g class="flow-edge unknown" data-edge="color-query:unknown:check"><title>わからない</title><path d="M512.5 592 V604 C512.5 636 559.5 636 559.5 668 V680"/><path d="M559.5 718 V730 C559.5 762 598 762 598 794 V806 V986 C598 1018 598 1018 598 1050 V1062 V1112 C598 1144 578.857 1144 578.857 1176 V1188" marker-end="url(#arrow-hidden-color-pair-conditions)"/><g class="flow-edge-label" data-edge-label="color-query:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="680" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-edge yes" data-edge="budget:yes:result"><title>はい</title><path d="M239.5 974 V986 C239.5 1018 192 1018 192 1050 V1062"/><path d="M192 1100 V1112 C192 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-hidden-color-pair-conditions)"/><g class="flow-edge-label" data-edge-label="budget:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="budget:no:check"><title>いいえ</title><path d="M319.5 974 V986 C319.5 1018 319 1018 319 1050 V1062"/><path d="M319 1100 V1112 C319 1144 441.714 1144 441.714 1176 V1188" marker-end="url(#arrow-hidden-color-pair-conditions)"/><g class="flow-edge-label" data-edge-label="budget:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="budget:unknown:check"><title>わからない</title><path d="M399.5 974 V986 C399.5 1018 447.5 1018 447.5 1050 V1062"/><path d="M447.5 1100 V1112 C447.5 1144 487.429 1144 487.429 1176 V1188" marker-end="url(#arrow-hidden-color-pair-conditions)"/><g class="flow-edge-label" data-edge-label="budget:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1085">わからない</text></g></g><g class="flow-node question" data-node="paired-colors"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">二群にN個体ずついて、各原色は両群</text><text class="node-title" x="400.5" y="103">に一匹ずつ、好みは異色の反対側への</text><text class="node-title" x="400.5" y="126">全単射ですか？</text><text class="node-explanation" x="400.5" y="153">好みの入次数と出次数がそれぞれ1であることを使い</text><text class="node-explanation" x="400.5" y="171">ます。</text></g><g class="flow-node question" data-node="color-query"><rect x="272.5" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">好む相手が会合にいればその原色に変</text><text class="node-title" x="288.5" y="490">わり、いなければ自身の原色で、任意</text><text class="node-title" x="288.5" y="513">集合の色数を正確に聞けますか？</text><text class="node-explanation" x="288.5" y="540">相互好みでは色を交換します。この規則から、独立集</text><text class="node-explanation" x="288.5" y="558">合への質問を辺の存在判定にできます。</text></g><g class="flow-node question" data-node="budget"><rect x="159.5" y="806" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="826">質問</text><text class="node-title" x="175.5" y="854">2≤N≤500で、下の保証回数以上</text><text class="node-title" x="175.5" y="877">の質問予算がありますか？</text><text class="node-explanation" x="175.5" y="904">保証回数はN×(3×(1+ceil(log₂</text><text class="node-explanation" x="175.5" y="922">N))+8)です。N≤500なら高々19000回</text><text class="node-explanation" x="175.5" y="940">で、20000回の上限に収まります。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">独立な二群への質問で辺を復元し、三</text><text class="node-title" x="48" y="1259">頂点で好み辺を除く</text><a href="/flowchartcp/techniques/interactive-hidden-bipartite-edge-color-pair-recovery/"><title>集合の色数から辺を探し、三頂点の質問で同色の組を残すの記事へ</title><text x="48" y="1298">集合の色数から辺を探し、三頂点の質問で同色の組</text><text x="48" y="1316">を残す</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1188" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1208">分野</text><text class="node-title" x="412" y="1236">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1273">詳細の質問・図へ →</text></a></g></svg>