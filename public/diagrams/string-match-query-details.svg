ry-details)"/><g class="flow-edge-label" data-edge-label="lex:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1119" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="1159" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="lex:unknown:check"><title>わからない</title><path d="M1240.5 910 V922 C1240.5 954 1287.5 954 1287.5 986 V998"/><path d="M1287.5 1036 V1048 C1287.5 1080 1252 1080 1252 1112 V1124" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="lex:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1243" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="1287.5" y="1021">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:z"><title>はい</title><path d="M1204 1274 V1310 C1204 1342 920 1342 920 1374 V1386"/><path d="M920 1424 V1436 C920 1468 920 1468 920 1500 V1512" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="check:yes:z" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="1386" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1409">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 1274 V1310 C1284 1342 1271 1342 1271 1374 V1386"/><path d="M1271 1424 V1436 C1271 1468 1230.667 1468 1230.667 1500 V1512" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="1386" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="1409">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 1274 V1310 C1364 1342 1399.5 1342 1399.5 1374 V1386"/><path d="M1399.5 1424 V1436 C1399.5 1468 1337.333 1468 1337.333 1500 V1512" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="1386" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="1409">わからない</text></g></g><g class="flow-node question" data-node="pattern"><rect x="1003.8333333333333" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1019.8333333333333" y="52">質問</text><text class="node-title" x="1019.8333333333333" y="80">一つのパターンを固定し、すべての一</text><text class="node-title" x="1019.8333333333333" y="103">致位置を求めますか？</text><text class="node-explanation" x="1019.8333333333333" y="130">pattern + 区切り + text の Z</text><text class="node-explanation" x="1019.8333333333333" y="148"> 配列で、一致長をまとめて求められます。</text></g><g class="flow-node question" data-node="queries"><rect x="1068" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="1084" y="416">質問</text><text class="node-title" x="1084" y="444">任意の二つの区間を何度も比較します</text><text class="node-title" x="1084" y="467">か？</text><text class="node-explanation" x="1084" y="494">長さをそろえて、区間のハッシュを前計算する方法を</text><text class="node-explanation" x="1084" y="512">考えます。</text></g><g class="flow-node question" data-node="collision"><rect x="391.5" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="407.5" y="780">質問</text><text class="node-title" x="407.5" y="808">ハッシュ衝突の確率を許容できます</text><text class="node-title" x="407.5" y="831">か？</text><text class="node-explanation" x="407.5" y="858">厳密な一致判定が必要なら、接尾辞配列と LCP </text><text class="node-explanation" x="407.5" y="876">などを使います。</text></g><g class="flow-node question" data-node="lex"><rect x="1000.5" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="1016.5" y="780">質問</text><text class="node-title" x="1016.5" y="808">辞書順や、二つの接尾辞の共通接頭辞</text><text class="node-title" x="1016.5" y="831">長が必要ですか？</text><text class="node-explanation" x="1016.5" y="858">接尾辞をソートし、その間の LCP の最小値を使</text><text class="node-explanation" x="1016.5" y="876">います。</text></g><g class="flow-node question" data-node="check"><rect x="1124" y="1124" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="1144">質問</text><text class="node-title" x="1140" y="1172">比較対象の片方を、同じ接頭辞として</text><text class="node-title" x="1140" y="1195">固定できますか？</text><text class="node-explanation" x="1140" y="1222">接頭辞を固定できるなら Z 配列で線形時間の比較</text><text class="node-explanation" x="1140" y="1240">を考えます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="1512" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="1532">分野</text><text class="node-title" x="1140" y="1560">条件を確かめる</text><text class="node-explanation" x="1140" y="1587">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="1615">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="z"><rect x="760" y="1512" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="1532">候補</text><text class="node-title" x="776" y="1560">Z アルゴリズム</text><a href="/flowchartcp/techniques/z-algorithm/"><title>Zアルゴリズムの記事へ</title><text x="776" y="1599">Zアルゴリズム</text></a></g><g class="flow-node result" data-node="z-pattern"><rect x="704" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="720" y="416">候補</text><text class="node-title" x="720" y="444">Z 配列でパターンを照合する</text><a href="/flowchartcp/techniques/z-algorithm/"><title>Zアルゴリズムの記事へ</title><text x="720" y="483">Zアルゴリズム</text></a></g><g class="flow-node result" data-node="hash"><rect x="32" y="1124" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="1144">候補</text><text class="node-title" x="48" y="1172">ローリングハッシュ</text><a href="/flowchartcp/techniques/rolling-hash/"><title>ローリングハッシュの記事へ</title><text x="48" y="1211">ローリングハッシュ</text></a></g><g class="flow-node result" data-node="suffix"><rect x="396" y="1124" width="320" height="174" rx="7"/><text class="node-kind" x="412" y="1144">候補</text><text class="node-title" x="412" y="1172">接尾辞配列と LCP で厳密に比較</text><text class="node-title" x="412" y="1195">する</text><a href="/flowchartcp/techniques/suffix-array/"><title>接尾辞配列・LCP配列の記事へ</title><text x="412" y="1234">接尾辞配列・LCP配列</text></a><a href="/flowchartcp/techniques/segment-tree/"><title>セグメント木の記事へ</title><text x="412" y="1258">セグメント木</text></a></g><g class="flow-node result" data-node="fallback"><rect x="760" y="1124" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="1144">候補</text><text class="node-title" x="776" y="1172">何を固定して比較するか整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="776" y="1211">状態の設計</text></a></g></svg>