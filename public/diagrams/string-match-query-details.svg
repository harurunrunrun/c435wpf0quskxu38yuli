<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-string-match-query-details flow-desc-string-match-query-details" width="1476" height="1683" viewBox="0 0 1476 1683" data-flow-svg="string-match-query-details"><title id="flow-title-string-match-query-details">固定パターンと区間の比較条件の解法フローチャート</title><desc id="flow-desc-string-match-query-details">固定した語の一致位置と区間比較を分け、必要な正確さや辞書順の情報を確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-string-match-query-details" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="pattern:yes:z-pattern"><title>はい</title><path d="M1083.833 182 V194 C1083.833 226 864 226 864 258 V270"/><path d="M864 308 V320 C864 352 864 352 864 384 V396" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="pattern:yes:z-pattern" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="824" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="864" y="293">はい</text></g></g><g class="flow-edge no" data-edge="pattern:no:queries"><title>いいえ</title><path d="M1163.833 182 V194 C1163.833 226 1228 226 1228 258 V270"/><path d="M1228 308 V320 C1228 352 1228 352 1228 384 V396" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="pattern:no:queries" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1188" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="1228" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="pattern:unknown:check"><title>わからない</title><path d="M1243.833 182 V194 C1243.833 226 1399.5 226 1399.5 258 V270"/><path d="M1399.5 308 V320 C1399.5 352 1438 352 1438 384 V396 V558 C1438 590 1438 590 1438 622 V634 V684 C1438 716 1438 716 1438 748 V760 V922 C1438 954 1438 954 1438 986 V998 V1048 C1438 1080 1380 1080 1380 1112 V1124" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="pattern:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="queries:yes:collision"><title>はい</title><path d="M1148 546 V558 C1148 590 551.5 590 551.5 622 V634"/><path d="M551.5 672 V684 C551.5 716 551.5 716 551.5 748 V760" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="queries:yes:collision" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="511.5" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="551.5" y="657">はい</text></g></g><g class="flow-edge no" data-edge="queries:no:lex"><title>いいえ</title><path d="M1228 546 V558 C1228 590 1160.5 590 1160.5 622 V634"/><path d="M1160.5 672 V684 C1160.5 716 1160.5 716 1160.5 748 V760" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="queries:no:lex" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1120.5" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="1160.5" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="queries:unknown:check"><title>わからない</title><path d="M1308 546 V558 C1308 590 1343.5 590 1343.5 622 V634"/><path d="M1343.5 672 V684 C1343.5 716 1382 716 1382 748 V760 V922 C1382 954 1382 954 1382 986 V998 V1048 C1382 1080 1316 1080 1316 1112 V1124" marker-end="url(#arrow-string-match-query-details)"/><g class="flow-edge-label" data-edge-label="queries:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1299" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1343.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="collision:yes:hash"><title>はい</title><path d="M471.5 910 V922 C471.5 954 192 954 192 986 V998"/><path d="M192 1036 V1048 C192 10