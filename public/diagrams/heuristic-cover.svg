tic-cover)"/><g class="flow-edge-label" data-edge-label="coverage-active-fixed:yes:coverage-zero-crossing" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="911" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="951" y="670">はい</text></g></g><g class="flow-edge no" data-edge="coverage-active-fixed:no:fallback"><title>いいえ</title><path d="M1076.5 559 V571 C1076.5 603 1075 603 1075 635 V647"/><path d="M1075 685 V697 C1075 729 1186 729 1186 761 V773 V958 C1186 990 1186 990 1186 1022 V1034 V1084 C1186 1116 1298 1116 1298 1148 V1160 V1340 C1298 1372 1298 1372 1298 1404 V1416 V1466 C1298 1498 758.467 1498 758.467 1530 V1542" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="coverage-active-fixed:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="670">いいえ</text></g></g><g class="flow-edge unknown" data-edge="coverage-active-fixed:unknown:check"><title>わからない</title><path d="M1156.5 559 V571 C1156.5 603 1203.5 603 1203.5 635 V647"/><path d="M1203.5 685 V697 C1203.5 729 1242 729 1242 761 V773 V958 C1242 990 1242 990 1242 1022 V1034 V1084 C1242 1116 1141.333 1116 1141.333 1148 V1160" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="coverage-active-fixed:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="647" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="670">わからない</text></g></g><g class="flow-edge yes" data-edge="coverage-zero-crossing:yes:coverage-result"><title>はい</title><path d="M964.5 946 V958 C964.5 990 963 990 963 1022 V1034"/><path d="M963 1072 V1084 C963 1116 724 1116 724 1148 V1160" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="coverage-zero-crossing:yes:coverage-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="923" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="coverage-zero-crossing:no:fallback"><title>いいえ</title><path d="M884.5 946 V958 C884.5 990 839 990 839 1022 V1034"/><path d="M839 1072 V1084 C839 1116 514 1116 514 1148 V1160 V1340 C514 1372 763.8 1372 763.8 1404 V1416 V1466 C763.8 1498 651.8 1498 651.8 1530 V1542" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="coverage-zero-crossing:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="799" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="839" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="coverage-zero-crossing:unknown:check"><title>わからない</title><path d="M1044.5 946 V958 C1044.5 990 1091.5 990 1091.5 1022 V1034"/><path d="M1091.5 1072 V1084 C1091.5 1116 1088 1116 1088 1148 V1160" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="coverage-zero-crossing:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1057">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1008 1310 V1340 C1008 1372 853.8 1372 853.8 1404 V1416"/><path d="M853.8 1454 V1466 C853.8 1498 705.133 1498 705.133 1530 V1542" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="813.8" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="853.8" y="1439">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1088 1310 V1340 C1088 1372 1075 1372 1075 1404 V1416"/><path d="M1075 1454 V1466 C1075 1498 1085.917 1498 1085.917 1530 V1542" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="1439">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1168 1310 V1340 C1168 1372 1203.5 1372 1203.5 1404 V1416"/><path d="M1203.5 1454 V1466 C1203.5 1498 1192.583 1498 1192.583 1530 V1542" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="1416" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="1439">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="755.2777777777777" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="771.2777777777777" y="52">質問</text><text class="node-title" x="771.2777777777777" y="80">一局の半径について何を求めますか？</text><text class="node-explanation" x="771.2777777777777" y="107">整数半径の変更だけを行い、有効局やケーブルの条件</text><text class="node-explanation" x="771.2777777777777" y="125">は固定した部分問題です。</text></g><g class="flow-node question" data-node="radius-active-fixed"><rect x="264.8333333333333" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="280.8333333333333" y="411">質問</text><text class="node-title" x="280.8333333333333" y="439">有効局と通信ケーブルを固定し、費用</text><text class="node-title" x="280.8333333333333" y="462">は半径二乗で増えますか？</text><text class="node-explanation" x="280.8333333333333" y="489">全体の接続や有効性も変更すると、住民を覆うだけの</text><text class="node-explanation" x="280.8333333333333" y="507">同じ部分問題ではありません。</text></g><g class="flow-node question" data-node="radius-ceil"><rect x="293.5" y="773" width="320" height="168" rx="7"/><text class="node-kind" x="309.5" y="793">質問</text><text class="node-title" x="309.5" y="821">各住民までの距離を覆う最小整数半径</text><text class="node-title" x="309.5" y="844">で、被覆集合が変わりますか？</text><text class="node-explanation" x="309.5" y="871">同じ集合を覆う範囲なら最小半径が最安です。距離の</text><text class="node-explanation" x="309.5" y="889">切上げを整数の二乗比較で正確に求め、同じ候補をま</text><text class="node-explanation" x="309.5" y="907">とめます。</text></g><g class="flow-node result" data-node="radius-result"><rect x="88" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="1180">候補</text><text class="node-title" x="104" y="1208">住民の距離を切り上げた整数半径と </text><text class="node-title" x="104" y="1231">0 だけを候補にする</text><a href="/flowchartcp/techniques/heuristic-radius-threshold-candidates/"><title>整数半径の候補は、覆う点までの距離の切り上げに絞るの記事へ</title><text x="104" y="1270">整数半径の候補は、覆う点までの距離の切り上げに</text><text x="104" y="1288">絞る</text></a></g><g class="flow-node question" data-node="coverage-active-fixed"><rect x="916.5" y="391" width="320" height="168" rx="7"/><text class="node-kind" x="932.5" y="411">質問</text><text class="node-title" x="932.5" y="439">有効局と通信ケーブルは固定で、一局</text><text class="node-title" x="932.5" y="462">の半径だけを変更しますか？</text><text class="node-explanation" x="932.5" y="489">局の無効化や接続の変更は行いません。固定 ON </text><text class="node-explanation" x="932.5" y="507">ケーブル費など部品外の定数費用は、原典の全得点を</text><text class="node-explanation" x="932.5" y="525">求めるときに別に足します。</text></g><g class="flow-node question" data-node="coverage-zero-crossing"><rect x="804.5" y="773" width="320" height="173" rx="7"/><text class="node-kind" x="820.5" y="793">質問</text><text class="node-title" x="820.5" y="821">各住民を覆う局数を保ち、0 と正の</text><text class="node-title" x="820.5" y="844">数の間を移ったときだけ人数を変えま</text><text class="node-title" x="820.5" y="867">すか？</text><text class="node-explanation" x="820.5" y="894">重複して覆う住民は、一局を小さくしても他局が残れ</text><text class="node-explanation" x="820.5" y="912">ば被覆人数は変わりません。</text></g><g class="flow-node result" data-node="coverage-result"><rect x="564" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="580" y="1180">候補</text><text class="node-title" x="580" y="1208">被覆数の 0 をまたぐ住民だけで、</text><text class="node-title" x="580" y="1231">半径変更の人数差を求める</text><a href="/flowchartcp/techniques/heuristic-cover-count-delta/"><title>一局の半径変更は、境界を越えた点の被覆数だけ更新するの記事へ</title><text x="580" y="1270">一局の半径変更は、境界を越えた点の被覆数だけ更</text><text x="580" y="1288">新する</text></a></g><g class="flow-node question" data-node="check"><rect x="928" y="1160" width="320" height="150" rx="7"/><text class="node-kind" x="944" y="1180">質問</text><text class="node-title" x="944" y="1208">得点の式、合法性、固定する部分と変</text><text class="node-title" x="944" y="1231">更する部分を確認できますか？</text><text class="node-explanation" x="944" y="1258">差分評価が正しくても、その候補が合法であるとは限</text><text class="node-explanation" x="944" y="1276">りません。必要な制約を別に検査します。</text></g><g class="flow-node result" data-node="fallback"><rect x="491.79999999999995" y="1542" width="320" height="151" rx="7"/><text class="node-kind" x="507.79999999999995" y="1562">候補</text><text class="node-title" x="507.79999999999995" y="1590">評価と合法性を小さい変更で確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="507.79999999999995" y="1629">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="507.79999999999995" y="1653">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="979.25" y="1542" width="320" height="121" rx="7"/><text class="node-kind" x="995.25" y="1562">分野</text><text class="node-title" x="995.25" y="1590">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="995.25" y="1627">詳細の質問・図へ →</text></a></g></svg>