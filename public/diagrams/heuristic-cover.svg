<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-heuristic-cover flow-desc-heuristic-cover" width="1336" height="1725" viewBox="0 0 1336 1725" data-flow-svg="heuristic-cover"><title id="flow-title-heuristic-cover">円の被覆と半径候補の解法フローチャート</title><desc id="flow-desc-heuristic-cover">有効局と接続を固定し、住民の被覆が変わる半径だけを扱います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-heuristic-cover" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge candidates" data-edge="goal:candidates:radius-active-fixed"><title>覆う住民が変わる、少数の整数半径候補</title><path d="M835.278 159 V171 C835.278 203 424.833 203 424.833 235 V247"/><path d="M424.833 303 V315 C424.833 347 424.833 347 424.833 379 V391" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="goal:candidates:radius-active-fixed" tabindex="0" role="group" aria-label="選択肢：覆う住民が変わる、少数の整数半径候補"><rect x="302.3333333333333" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="424.8333333333333" y="270">覆う住民が変わる、少数の整数半径候</text><text text-anchor="middle" x="424.8333333333333" y="288">補</text></g></g><g class="flow-edge delta" data-edge="goal:delta:coverage-active-fixed"><title>一局の半径を変えた被覆人数の差</title><path d="M915.278 159 V171 C915.278 203 1061.5 203 1061.5 235 V247"/><path d="M1061.5 285 V315 C1061.5 347 1076.5 347 1076.5 379 V391" marker-end="url(#arrow-heuristic-cover)"/><g class="flow-edge-label" data-edge-label="goal:delta:coverage-active-fixed" tabindex="0" role="group" aria-label="選択肢：一局の半径を変えた被覆人数の差"><rect x="952" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="1061.5" y="270">一局の半径を変えた被覆人数の差</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M995.278 159 V171 C995.278 203 1259.5 203 1259.5 235 V247"/><path d="M1259.5 285 V315 C1259.5 347 12