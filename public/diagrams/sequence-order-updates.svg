<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-sequence-order-updates flow-desc-sequence-order-updates" width="1476" height="978" viewBox="0 0 1476 978" data-flow-svg="sequence-order-updates"><title id="flow-title-sequence-order-updates">列の順序変更と全出現の置換の解法フローチャート</title><desc id="flow-desc-sequence-order-updates">位置を変える操作と、値による一括置換を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-sequence-order-updates" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge order-only" data-edge="goal:order-only:current-position"><title>区間の移動・反転、要素の挿入・削除で並びを変える</title><path d="M887.75 159 V171 C887.75 203 491.5 203 491.5 235 V247"/><path d="M491.5 303 V315 C491.5 347 491.5 347 491.5 379 V391" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="goal:order-only:current-position" tabindex="0" role="group" aria-label="選択肢：区間の移動・反転、要素の挿入・削除で並びを変える"><rect x="369" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="491.5" y="270">区間の移動・反転、要素の挿入・削除</text><text text-anchor="middle" x="491.5" y="288">で並びを変える</text></g></g><g class="flow-edge affine-sum" data-edge="goal:affine-sum:uniform"><title>挿入・削除・反転に加え、区間を ax+b に変えて和を求める</title><path d="M951.75 159 V171 C951.75 203 855.5 203 855.5 235 V247"/><path d="M855.5 303 V315 C855.5 347 855.5 347 855.5 379 V391" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="goal:affine-sum:uniform" tabindex="0" role="group" aria-label="選択肢：挿入・削除・反転に加え、区間を ax+b に変えて和を求める"><rect x="739.5" y="247" width="232" height="56" rx="5"/><text text-anchor="middle" x="855.5" y="270">挿入・削除・反転に加え、区間を </text><text text-anchor="middle" x="855.5" y="288">ax+b に変えて和を求める</text></g></g><g class="flow-edge global-replace" data-edge="goal:global-replace:final-only"><title>末尾追加と、同じ値の全出現を別の値へ置き換える</title><path d="M1015.75 159 V171 C1015.75 203 1188.5 203 1188.5 235 V247"/><path d="M1188.5 303 V315 C1188.5 347 1228 347 1228 379 V391" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="goal:global-replace:final-only" tabindex="0" role="group" aria-label="選択肢：末尾追加と、同じ値の全出現を別の値へ置き換える"><rect x="1066" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1188.5" y="270">末尾追加と、同じ値の全出現を別の値</text><text text-anchor="middle" x="1188.5" y="288">へ置き換える</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M1079.75 159 V171 C1079.75 203 1399.5 203 1399.5 235 V247"/><path d="M1399.5 285 V315 C1399.5 347 1438 347 1438 379 V391 V576 C1438 608 1314 608 1314 640 V652 V702 C1314 734 1040 734 1040 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="current-position:yes:order-answer"><title>はい</title><path d="M411.5 541 V576 C411.5 608 192 608 192 640 V652"/><path d="M192 690 V702 C192 734 192 734 192 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="current-position:yes:order-answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="675">はい</text></g></g><g class="flow-edge no" data-edge="current-position:no:check"><title>いいえ</title><path d="M491.5 541 V576 C491.5 608 577 608 577 640 V652"/><path d="M577 690 V702 C577 734 800 734 800 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="current-position:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="537" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="577" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="current-position:unknown:check"><title>わからない</title><path d="M571.5 541 V576 C571.5 608 705.5 608 705.5 640 V652"/><path d="M705.5 690 V702 C705.5 734 840 734 840 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="current-position:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="661" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="705.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="uniform:yes:affine-answer"><title>はい</title><path d="M775.5 564 V576 C775.5 608 453 608 453 640 V652"/><path d="M453 690 V702 C453 734 556 734 556 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="uniform:yes:affine-answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="413" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="453" y="675">はい</text></g></g><g class="flow-edge no" data-edge="uniform:no:check"><title>いいえ</title><path d="M855.5 564 V576 C855.5 608 834 608 834 640 V652"/><path d="M834 690 V702 C834 734 880 734 880 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="uniform:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="794" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="834" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="uniform:unknown:check"><title>わからない</title><path d="M935.5 564 V576 C935.5 608 962.5 608 962.5 640 V652"/><path d="M962.5 690 V702 C962.5 734 920 734 920 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="uniform:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="918" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="962.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="final-only:yes:replace-answer"><title>はい</title><path d="M1308 541 V576 C1308 608 1404 608 1404 640 V652"/><path d="M1404 690 V702 C1404 734 1284 734 1284 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="final-only:yes:replace-answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1364" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1404" y="675">はい</text></g></g><g class="flow-edge no" data-edge="final-only:no:check"><title>いいえ</title><path d="M1148 541 V576 C1148 608 1091 608 1091 640 V652"/><path d="M1091 690 V702 C1091 734 960 734 960 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="final-only:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1051" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1091" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="final-only:unknown:check"><title>わからない</title><path d="M1228 541 V576 C1228 608 1219.5 608 1219.5 640 V652"/><path d="M1219.5 690 V702 C1219.5 734 1000 734 1000 766 V778" marker-end="url(#arrow-sequence-order-updates)"/><g class="flow-edge-label" data-edge-label="final-only:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1175" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1219.5" y="675">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="823.75" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="839.75" y="52">質問</text><text class="node-title" x="839.75" y="80">列をどのように変更しますか？</text><text class="node-explanation" x="839.75" y="107">指定位置が現在の列での位置か、対象が同じ値の全出</text><text class="node-explanation" x="839.75" y="125">現かを区別します。</text></g><g class="flow-node question" data-node="current-position"><rect x="331.5" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="347.5" y="411">質問</text><text class="node-title" x="347.5" y="439">指定位置はその時点の列での位置で、</text><text class="node-title" x="347.5" y="462">区間を分けてつなぎ直せますか？</text><text class="node-explanation" x="347.5" y="489">区間を除いた後の挿入位置と、除く前の位置を混同し</text><text class="node-explanation" x="347.5" y="507">ないようにします。</text></g><g class="flow-node question" data-node="uniform"><rect x="695.5" y="391" width="320" height="173" rx="7"/><text class="node-kind" x="711.5" y="411">質問</text><text class="node-title" x="711.5" y="439">区間内の全要素へ同じ一次変換を行</text><text class="node-title" x="711.5" y="462">い、係数は区間内の位置に依存しませ</text><text class="node-title" x="711.5" y="485">んか？</text><text class="node-explanation" x="711.5" y="512">和は a×sum+b×length で更新しま</text><text class="node-explanation" x="711.5" y="530">す。変換順は新しい変換を後から合成します。</text></g><g class="flow-node question" data-node="final-only"><rect x="1068" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="1084" y="411">質問</text><text class="node-title" x="1084" y="439">操作を全て先に読め、必要なのは最後</text><text class="node-title" x="1084" y="462">の列だけですか？</text><text class="node-explanation" x="1084" y="489">途中の状態を答える問題や、区間だけを置換する問題</text><text class="node-explanation" x="1084" y="507">にはこの逆順法をそのまま使えません。</text></g><g class="flow-node result" data-node="order-answer"><rect x="32" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="798">候補</text><text class="node-title" x="48" y="826">現在位置で区間を分割し、反転・連結</text><text class="node-title" x="48" y="849">する</text><a href="/flowchartcp/techniques/sequence-cut-reverse-split-merge/"><title>列の区間を切り出して、反転・移動するの記事へ</title><text x="48" y="888">列の区間を切り出して、反転・移動する</text></a></g><g class="flow-node result" data-node="affine-answer"><rect x="396" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="412" y="798">候補</text><text class="node-title" x="412" y="826">動的な列へ要素数・和・一次変換・反</text><text class="node-title" x="412" y="849">転を持つ</text><a href="/flowchartcp/techniques/dynamic-sequence-affine-sum/"><title>挿入・削除・反転がある列で、一次変換と区間和を処理するの記事へ</title><text x="412" y="888">挿入・削除・反転がある列で、一次変換と区間和を</text><text x="412" y="906">処理する</text></a></g><g class="flow-node result" data-node="replace-answer"><rect x="1124" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="1140" y="798">候補</text><text class="node-title" x="1140" y="826">逆順に各値の最終的な行き先を更新す</text><text class="node-title" x="1140" y="849">る</text><a href="/flowchartcp/techniques/global-replace-reverse-map/"><title>同じ値の一括置換は、操作を逆順に読み、最後の行き先だけを持つの記事へ</title><text x="1140" y="888">同じ値の一括置換は、操作を逆順に読み、最後の行</text><text x="1140" y="906">き先だけを持つ</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="778" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="798">分野</text><text class="node-title" x="776" y="826">まだ確認できていない条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="863">詳細の質問・図へ →</text></a></g></svg>