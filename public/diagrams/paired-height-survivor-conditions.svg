<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-paired-height-survivor-conditions flow-desc-paired-height-survivor-conditions" width="748" height="1388" viewBox="0 0 748 1388" data-flow-svg="paired-height-survivor-conditions"><title id="flow-title-paired-height-survivor-conditions">同時減衰の後に残る位置から列を数えるの解法フローチャート</title><desc id="flow-desc-paired-height-survivor-conditions">操作の単位と、必要な制約を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-paired-height-survivor-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="paired-heights:yes:simultaneous-decay"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-paired-height-survivor-conditions)"/><g class="flow-edge-label" data-edge-label="paired-heights:yes:simultaneous-decay" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="paired-heights:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V599 C654 631 654 631 654 663 V675 V725 C654 757 654 757 654 789 V801 V986 C654 1018 654 1018 654 1050 V1062 V1112 C654 1144 624.571 1144 624.571 1176 V1188" marker-end="url(#arrow-paired-height-survivor-conditions)"/><g class="flow-edge-label" data-edge-label="paired-heights:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="paired-heights:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V599 C710 631 710 631 710 663 V675 V725 C710 757 710 757 710 789 V801 V986 C710 1018 710 1018 710 1050 V1062 V1112 C710 1144 670.286 1144 670.286 1176 V1188" marker-end="url(#arrow-paired-height-survivor-conditions)"/><g class="flow-edge-label" data-edge-label="paired-heights:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="simultaneous-decay:yes:bounded-survivors"><title>はい</title><path d="M352.5 587 V599 C352.5 631 307 631 307 663 V675"/><path d="M307 713 V725 C307 757 319.5 757 319.5 789 V801" marker-end="url(#arrow-paired-height-survivor-conditions)"/><g class="flow-edge-label" data-edge-label="simultaneous-decay:yes:bounded-survivors" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="698">はい</text></g></g><g class="flow-edge no" data-edge="simultaneous-decay:no:check"><title>いいえ</title><path d="M432.5 587 V599 C432.5 631 431 631 431 663 V675"/><path d="M431 713 V725 C431 757 542 757 542 789 V801 V986 C542 1018 542 1018 542 1050 V1062 V1112 C542 1144 533.143 1144 533.143 1176 V1188" marker-end="url(#arrow-paired-height-survivor-conditions)"/><g class="flow-edge-label" data-edge-label="simultaneous-decay:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="simultaneous-decay:unknown:check"><title>わからない</title><path d="M512.5 587 V599 C512.5 631 559.5 631 559.5 663 V675"/><path d="M559.5 713 V725 C559.5 757 598 757 598 789 V801 V986 C598 1018 598 1018 598 1050 V1062 V1112 C598 1144 578.857 1144 578.857 1176 V1188" marker-end="url(#arrow-paired-height-survivor-conditions)"/><g class="flow-edge-label" data-edge-label="simultaneous-decay:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="bounded-survivors:yes:result"><title>はい</title><path d="M239.5 974 V986 C239.5 1018 192 1018 192 1050 V1062"/><path d="M192 1100 V1112 C192 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-paired-height-survivor-conditions)"/><g class="flow-edge-label" data-edge-label="bounded-survivors:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="bounded-survivors:no:check"><title>いいえ</title><path d="M319.5 974 V986 C319.5 1018 319 1018 319 1050 V1062"/><path d="M319 1100 V1112 C319 1144 441.714 1144 441.714 1176 V1188" marker-end="url(#arrow-paired-height-survivor-conditions)"/><g class="flow-edge-label" data-edge-label="bounded-survivors:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounded-survivors:unknown:check"><title>わからない</title><path d="M399.5 974 V986 C399.5 1018 447.5 1018 447.5 1050 V1062"/><path d="M447.5 1100 V1112 C447.5 1144 487.429 1144 487.429 1176 V1188" marker-end="url(#arrow-paired-height-survivor-conditions)"/><g class="flow-edge-label" data-edge-label="bounded-survivors:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1085">わからない</text></g></g><g class="flow-node question" data-node="paired-heights"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">元の列には高さ1..Nがそれぞれ二</text><text class="node-title" x="400.5" y="103">回あり、その並び順を数えますか？</text><text class="node-explanation" x="400.5" y="130">同じ高さの二本は区別せず、位置の違いだけを数えま</text><text class="node-explanation" x="400.5" y="148">す。</text></g><g class="flow-node question" data-node="simultaneous-decay"><rect x="272.5" y="396" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">同じ正の高さでは最後の位置だけを守</text><text class="node-title" x="288.5" y="467">り、ほかを一斉に1減らす操作をN回</text><text class="node-title" x="288.5" y="490">行いますか？</text><text class="node-explanation" x="288.5" y="517">0はそのまま残し、各回の保護位置は更新前の高さで</text><text class="node-explanation" x="288.5" y="535">決めます。順番に一要素ずつ減らす操作とは結果が変</text><text class="node-explanation" x="288.5" y="553">わります。</text></g><g class="flow-node question" data-node="bounded-survivors"><rect x="159.5" y="801" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="821">質問</text><text class="node-title" x="175.5" y="849">1≤N≤600で、正の高さが残るN</text><text class="node-title" x="175.5" y="872">個の位置を指定し、法10^9+7で</text><text class="node-title" x="175.5" y="895">元の列を数えますか？</text><text class="node-explanation" x="175.5" y="922">位置は1..2Nの相異なる昇順の番号です。実現で</text><text class="node-explanation" x="175.5" y="940">きない集合には0を返します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">未決定位置を高さ帯にまとめ、重み付</text><text class="node-title" x="48" y="1259">きの三値の経路を前計算する</text><a href="/flowchartcp/techniques/paired-height-survivors-weighted-dyck-dp/"><title>各高さ二本の減衰で残る位置を数えるなら、未確定の高さを重み付きDyck列にまとめるの記事へ</title><text x="48" y="1298">各高さ二本の減衰で残る位置を数えるなら、未確定</text><text x="48" y="1316">の高さを重み付きDyck列にまとめる</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1188" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1208">分野</text><text class="node-title" x="412" y="1236">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1273">詳細の質問・図へ →</text></a></g></svg>