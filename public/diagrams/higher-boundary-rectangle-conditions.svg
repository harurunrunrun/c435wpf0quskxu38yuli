<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-higher-boundary-rectangle-conditions flow-desc-higher-boundary-rectangle-conditions" width="748" height="1329" viewBox="0 0 748 1329" data-flow-svg="higher-boundary-rectangle-conditions"><title id="flow-title-higher-boundary-rectangle-conditions">各行・各列の外側が高い長方形の解法フローチャート</title><desc id="flow-desc-higher-boundary-rectangle-conditions">操作と比較の条件、求めるもの、入力の範囲を確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-higher-boundary-rectangle-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="strict-four-borders:yes:static-internal-rectangles"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-higher-boundary-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="strict-four-borders:yes:static-internal-rectangles" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="strict-four-borders:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V558 C654 590 654 590 654 622 V634 V684 C654 716 654 716 654 748 V760 V945 C654 977 654 977 654 1009 V1021 V1071 C654 1103 624.571 1103 624.571 1135 V1147" marker-end="url(#arrow-higher-boundary-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="strict-four-borders:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="strict-four-borders:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V558 C710 590 710 590 710 622 V634 V684 C710 716 710 716 710 748 V760 V945 C710 977 710 977 710 1009 V1021 V1071 C710 1103 670.286 1103 670.286 1135 V1147" marker-end="url(#arrow-higher-boundary-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="strict-four-borders:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="static-internal-rectangles:yes:bounds"><title>はい</title><path d="M352.5 546 V558 C352.5 590 307 590 307 622 V634"/><path d="M307 672 V684 C307 716 319.5 716 319.5 748 V760" marker-end="url(#arrow-higher-boundary-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="static-internal-rectangles:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="657">はい</text></g></g><g class="flow-edge no" data-edge="static-internal-rectangles:no:check"><title>いいえ</title><path d="M432.5 546 V558 C432.5 590 431 590 431 622 V634"/><path d="M431 672 V684 C431 716 542 716 542 748 V760 V945 C542 977 542 977 542 1009 V1021 V1071 C542 1103 533.143 1103 533.143 1135 V1147" marker-end="url(#arrow-higher-boundary-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="static-internal-rectangles:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="static-internal-rectangles:unknown:check"><title>わからない</title><path d="M512.5 546 V558 C512.5 590 559.5 590 559.5 622 V634"/><path d="M559.5 672 V684 C559.5 716 598 716 598 748 V760 V945 C598 977 598 977 598 1009 V1021 V1071 C598 1103 578.857 1103 578.857 1135 V1147" marker-end="url(#arrow-higher-boundary-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="static-internal-rectangles:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 933 V945 C239.5 977 192 977 192 1009 V1021"/><path d="M192 1059 V1071 C192 1103 192 1103 192 1135 V1147" marker-end="url(#arrow-higher-boundary-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1044">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 933 V945 C319.5 977 319 977 319 1009 V1021"/><path d="M319 1059 V1071 C319 1103 441.714 1103 441.714 1135 V1147" marker-end="url(#arrow-higher-boundary-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1044">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 933 V945 C399.5 977 447.5 977 447.5 1009 V1021"/><path d="M447.5 1059 V1071 C447.5 1103 487.429 1103 487.429 1135 V1147" marker-end="url(#arrow-higher-boundary-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1021" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1044">わからない</text></g></g><g class="flow-node question" data-node="strict-four-borders"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">各内部セルは、同じ行・列の外側四セ</text><text class="node-title" x="400.5" y="103">ルより真に低い必要がありますか？</text><text class="node-explanation" x="400.5" y="130">同じ高さでは条件を満たしません。外側の四隅は比較</text><text class="node-explanation" x="400.5" y="148">に含めません。</text></g><g class="flow-node question" data-node="static-internal-rectangles"><rect x="272.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">固定された高さの格子で、外周に触れ</text><text class="node-title" x="288.5" y="467">ない長方形を重複なく数えますか？</text><text class="node-explanation" x="288.5" y="494">一マスだけの長方形も含め、条件を満たす異なる長方</text><text class="node-explanation" x="288.5" y="512">形の個数を求めます。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="760" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">縦横2500以内・高さ0〜700万</text><text class="node-title" x="175.5" y="831">で、全盤面をまとめて処理できます</text><text class="node-title" x="175.5" y="854">か？</text><text class="node-explanation" x="175.5" y="881">行数・列数はそれぞれ1以上です。各行の長さはそ</text><text class="node-explanation" x="175.5" y="899">ろっています。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1147" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="1167">候補</text><text class="node-title" x="48" y="1195">内部最大セルから候補を絞り、行と列</text><text class="node-title" x="48" y="1218">の条件を確かめる</text><a href="/flowchartcp/techniques/grid-enclosing-higher-boundary-rectangle-candidates/"><title>各行・各列で両端が内部より高い長方形を数えるの記事へ</title><text x="48" y="1257">各行・各列で両端が内部より高い長方形を数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1147" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1167">分野</text><text class="node-title" x="412" y="1195">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1232">詳細の質問・図へ →</text></a></g></svg>