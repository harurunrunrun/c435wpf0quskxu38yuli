ect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="word-side-rules:yes:sentence-boundaries"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-word-boundary-comma-conditions)"/><g class="flow-edge-label" data-edge-label="word-side-rules:yes:sentence-boundaries" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="word-side-rules:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V558 C654 590 654 590 654 622 V634 V684 C654 716 654 716 654 748 V760 V922 C654 954 654 954 654 986 V998 V1048 C654 1080 624.571 1080 624.571 1112 V1124" marker-end="url(#arrow-word-boundary-comma-conditions)"/><g class="flow-edge-label" data-edge-label="word-side-rules:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="word-side-rules:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V558 C710 590 710 590 710 622 V634 V684 C710 716 710 716 710 748 V760 V922 C710 954 710 954 710 986 V998 V1048 C710 1080 670.286 1080 670.286 1112 V1124" marker-end="url(#arrow-word-boundary-comma-conditions)"/><g class="flow-edge-label" data-edge-label="word-side-rules:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="sentence-boundaries:yes:bounds"><title>はい</title><path d="M352.5 546 V558 C352.5 590 307 590 307 622 V634"/><path d="M307 672 V684 C307 716 319.5 716 319.5 748 V760" marker-end="url(#arrow-word-boundary-comma-conditions)"/><g class="flow-edge-label" data-edge-label="sentence-boundaries:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="657">はい</text></g></g><g class="flow-edge no" data-edge="sentence-boundaries:no:check"><title>いいえ</title><path d="M432.5 546 V558 C432.5 590 431 590 431 622 V634"/><path d="M431 672 V684 C431 716 542 716 542 748 V760 V922 C542 954 542 954 542 986 V998 V1048 C542 1080 533.143 1080 533.143 1112 V1124" marker-end="url(#arrow-word-boundary-comma-conditions)"/><g class="flow-edge-label" data-edge-label="sentence-boundaries:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="sentence-boundaries:unknown:check"><title>わからない</title><path d="M512.5 546 V558 C512.5 590 559.5 590 559.5 622 V634"/><path d="M559.5 672 V684 C559.5 716 598 716 598 748 V760 V922 C598 954 598 954 598 986 V998 V1048 C598 1080 578.857 1080 578.857 1112 V1124" marker-end="url(#arrow-word-boundary-comma-conditions)"/><g class="flow-edge-label" data-edge-label="sentence-boundaries:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 910 V922 C239.5 954 192 954 192 986 V998"/><path d="M192 1036 V1048 C192 1080 192 1080 192 1112 V1124" marker-end="url(#arrow-word-boundary-comma-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 910 V922 C319.5 954 319 954 319 986 V998"/><path d="M319 1036 V1048 C319 1080 441.714 1080 441.714 1112 V1124" marker-end="url(#arrow-word-boundary-comma-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 910 V922 C399.5 954 447.5 954 447.5 986 V998"/><path d="M447.5 1036 V1048 C447.5 1080 487.429 1080 487.429 1112 V1124" marker-end="url(#arrow-word-boundary-comma-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1021">わからない</text></g></g><g class="flow-node question" data-node="word-side-rules"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">同じ語の前と後へそれぞれ読点を広</text><text class="node-title" x="400.5" y="103">げ、追加を繰り返しますか？</text><text class="node-explanation" x="400.5" y="130">語の前と後は別の条件です。語や語順を変えず、読点</text><text class="node-explanation" x="400.5" y="148">の追加だけを行います。</text></g><g class="flow-node question" data-node="sentence-boundaries"><rect x="272.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">文頭の前と文末の後には追加せず、元</text><text class="node-title" x="288.5" y="467">の句読点と空白を保ちますか？</text><text class="node-explanation" x="288.5" y="494">同じ語を通じて別の文の内部へ広がることはありま</text><text class="node-explanation" x="288.5" y="512">す。句点をまたぐ語間には読点を置きません。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">英小文字の語と句読点からなる、2〜</text><text class="node-title" x="175.5" y="831">100万文字の一行ですか？</text><text class="node-explanation" x="175.5" y="858">語間は空白一つ、読点と空白、句点と空白のいずれ</text><text class="node-explanation" x="175.5" y="876">か。最後は句点で、余分な空白はありません。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1124" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1144">候補</text><text class="node-title" x="48" y="1172">語の前後の二状態をつなぎ、元の読点</text><text class="node-title" x="48" y="1195">から到達する場所へ追加する</text><a href="/flowchartcp/techniques/word-boundary-comma-closure/"><title>同じ語の前後へ読点を追加する規則を、一度の探索で処理するの記事へ</title><text x="48" y="1234">同じ語の前後へ読点を追加する規則を、一度の探索</text><text x="48" y="1252">で処理する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1124" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1144">分野</text><text class="node-title" x="412" y="1172">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1209">詳細の質問・図へ →</text></a></g></svg>