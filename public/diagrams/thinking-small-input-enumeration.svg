width="320" height="150" rx="7"/><text class="node-kind" x="166.66666666666669" y="416">質問</text><text class="node-title" x="166.66666666666669" y="444">最適解の位置・順序・差分などに規則</text><text class="node-title" x="166.66666666666669" y="467">が見えますか？</text><text class="node-explanation" x="166.66666666666669" y="494">表や図から候補となる性質を見つけます。観察した規</text><text class="node-explanation" x="166.66666666666669" y="512">則は後で証明します。</text></g><g class="flow-node result" data-node="observation"><rect x="88" y="1131" width="320" height="127" rx="7"/><text class="node-kind" x="104" y="1151">候補</text><text class="node-title" x="104" y="1179">小規模全探索から観察する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="104" y="1218">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="model"><rect x="88" y="760" width="320" height="157" rx="7"/><text class="node-kind" x="104" y="780">分野</text><text class="node-title" x="104" y="808">状態に残す情報と、各要素の寄与</text><text class="node-explanation" x="104" y="835">先の操作に影響する情報と、答えへの加わり方を調べ</text><text class="node-explanation" x="104" y="853">ます。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-state-contributions" data-route="thinking-state-contributions"><text x="104" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="452" y="760" width="320" height="132" rx="7"/><text class="node-kind" x="468" y="780">質問</text><text class="node-title" x="468" y="808">手で追える入力の、操作と答えを列挙</text><text class="node-title" x="468" y="831">できますか？</text><text class="node-explanation" x="468" y="858">抽象的な式を、最小の例に戻して確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="452" y="1131" width="320" height="139" rx="7"/><text class="node-kind" x="468" y="1151">分野</text><text class="node-title" x="468" y="1179">条件を確かめる</text><text class="node-explanation" x="468" y="1206">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="conditio