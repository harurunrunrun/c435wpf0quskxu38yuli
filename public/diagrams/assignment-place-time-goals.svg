<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-assignment-place-time-goals flow-desc-assignment-place-time-goals" width="1476" height="949" viewBox="0 0 1476 949" data-flow-svg="assignment-place-time-goals"><title id="flow-title-assignment-place-time-goals">場所・時刻・商品の条件に従う割当の解法フローチャート</title><desc id="flow-desc-assignment-place-time-goals">配置場所や移動先、時刻順の担当、商品と割引券の対応を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-assignment-place-time-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge positions" data-edge="purpose:positions:position-purpose"><title>移動先や配置場所を一つずつ割り当てる</title><path d="M892 182 V194 C892 226 500 226 500 258 V270"/><path d="M500 326 V338 C500 370 500 370 500 402 V414" marker-end="url(#arrow-assignment-place-time-goals)"/><g class="flow-edge-label" data-edge-label="purpose:positions:position-purpose" tabindex="0" role="group" aria-label="選択肢：移動先や配置場所を一つずつ割り当てる"><rect x="377.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="500" y="293">移動先や配置場所を一つずつ割り当て</text><text text-anchor="middle" x="500" y="311">る</text></g></g><g class="flow-edge schedule" data-edge="purpose:schedule:schedule-route"><title>決まった場所・時刻の作業を、最少人数で順に担当する</title><path d="M956 182 V194 C956 226 864 226 864 258 V270"/><path d="M864 326 V338 C864 370 864 370 864 402 V414" marker-end="url(#arrow-assignment-place-time-goals)"/><g class="flow-edge-label" data-edge-label="purpose:schedule:schedule-route" tabindex="0" role="group" aria-label="選択肢：決まった場所・時刻の作業を、最少人数で順に担当する"><rect x="741.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="864" y="293">決まった場所・時刻の作業を、最少人</text><text text-anchor="middle" x="864" y="311">数で順に担当する</text></g></g><g class="flow-edge price-coupons" data-edge="purpose:price-coupons:coupon-route"><title>全商品を買い、価格下限のある割引券を商品へ一枚ずつ割り当てる</title><path d="M1020 182 V194 C1020 226 1188.5 226 1188.5 258 V270"/><path d="M1188.5 326 V338 C1188.5 370 1228 370 1228 402 V414" marker-end="url(#arrow-assignment-place-time-goals)"/><g class="flow-edge-label" data-edge-label="purpose:price-coupons:coupon-route" tabindex="0" role="group" aria-label="選択肢：全商品を買い、価格下限のある割引券を商品へ一枚ずつ割り当てる"><rect x="1066" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1188.5" y="293">全商品を買い、価格下限のある割引券</text><text text-anchor="middle" x="1188.5" y="311">を商品へ一枚ずつ割り当てる</text></g></g><g class="flow-edge unknown" data-edge="purpose:unknown:check"><title>わからない</title><path d="M1084 182 V194 C1084 226 1399.5 226 1399.5 258 V270"/><path d="M1399.5 308 V338 C1399.5 370 1438 370 1438 402 V414 V576 C1438 608 1378.5 608 1378.5 640 V652 V720 C1378.5 752 1337.333 752 1337.333 784 V796" marker-end="url(#arrow-assignment-place-time-goals)"/><g class="flow-edge-label" data-edge-label="purpose:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="293">わからない</text></g></g><g class="flow-edge rectangle" data-edge="position-purpose:rectangle:rectangle-route"><title>駒ごとに行区間と列区間があり、行・列を一度ずつ使う</title><path d="M404 564 V576 C404 608 192 608 192 640 V652"/><path d="M192 708 V720 C192 752 192 752 192 784 V796" marker-end="url(#arrow-assignment-place-time-goals)"/><g class="flow-edge-label" data-edge-label="position-purpose:rectangle:rectangle-route" tabindex="0" role="group" aria-label="選択肢：駒ごとに行区間と列区間があり、行・列を一度ずつ使う"><rect x="69.5" y="652" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="675">駒ごとに行区間と列区間があり、行・</text><text text-anchor="middle" x="192" y="693">列を一度ずつ使う</text></g></g><g class="flow-edge translated" data-edge="position-purpose:translated:translate-route"><title>各点が固定時間だけ決まった方向へ動き、全ての到着点に対応する</title><path d="M468 564 V576 C468 608 556 608 556 640 V652"/><path d="M556 708 V720 C556 752 556 752 556 784 V796" marker-end="url(#arrow-assignment-place-time-goals)"/><g class="flow-edge-label" data-edge-label="position-purpose:translated:translate-route" tabindex="0" role="group" aria-label="選択肢：各点が固定時間だけ決まった方向へ動き、全ての到着点に対応する"><rect x="433.5" y="652" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="675">各点が固定時間だけ決まった方向へ動</text><text text-anchor="middle" x="556" y="693">き、全ての到着点に対応する</text></g></g><g class="flow-edge other" data-edge="position-purpose:other:bipartite"><title>その他の場所への一対一対応</title><path d="M532 564 V576 C532 608 920 608 920 640 V652"/><path d="M920 690 V720 C920 752 920 752 920 784 V796" marker-end="url(#arrow-assignment-place-time-goals)"/><g class="flow-edge-label" data-edge-label="position-purpose:other:bipartite" tabindex="0" role="group" aria-label="選択肢：その他の場所への一対一対応"><rect x="823.5" y="652" width="193" height="38" rx="5"/><text text-anchor="middle" x="920" y="675">その他の場所への一対一対応</text></g></g><g class="flow-edge unknown" data-edge="position-purpose:unknown:check"><title>わからない</title><path d="M596 564 V576 C596 608 1284 608 1284 640 V652"/><path d="M1284 690 V720 C1284 752 1230.667 752 1230.667 784 V796" marker-end="url(#arrow-assignment-place-time-goals)"/><g class="flow-edge-label" data-edge-label="position-purpose:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="675">わからない</text></g></g><g class="flow-node route" data-node="bipartite"><rect x="760" y="796" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="816">分野</text><text class="node-title" x="776" y="844">対象の使用回数と二つへの分割</text><a href="/flowchartcp/flowcharts/#diagram-assignment-resource-usage" data-route="assignment-resource-usage"><text x="776" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1124" y="796" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="816">分野</text><text class="node-title" x="1140" y="844">合法な割当と数量の対応</text><a href="/flowchartcp/flowcharts/#diagram-assignment-integer-representation" data-route="assignment-integer-representation"><text x="1140" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="purpose"><rect x="828" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="844" y="52">質問</text><text class="node-title" x="844" y="80">対応や割当について、どの条件の答え</text><text class="node-title" x="844" y="103">を求めますか？</text><text class="node-explanation" x="844" y="130">一つの組を選ぶと何を消費するか、必ず使う対象があ</text><text class="node-explanation" x="844" y="148">るか、個数と費用のどちらが目的かを確認します。</text></g><g class="flow-node question" data-node="position-purpose"><rect x="340" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="356" y="434">質問</text><text class="node-title" x="356" y="462">配置先の候補には、どの構造がありま</text><text class="node-title" x="356" y="485">すか？</text><text class="node-explanation" x="356" y="512">行と列を別々に使う配置と、固定時間の移動先を一対</text><text class="node-explanation" x="356" y="530">一に照合する配置を分けます。</text></g><g class="flow-node route" data-node="rectangle-route"><rect x="32" y="796" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="816">分野</text><text class="node-title" x="48" y="844">長方形候補からの配置</text><a href="/flowchartcp/flowcharts/#diagram-rectangle-rook-assignments" data-route="rectangle-rook-assignments"><text x="48" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="translate-route"><rect x="396" y="796" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="816">分野</text><text class="node-title" x="412" y="844">固定移動による点の対応</text><a href="/flowchartcp/flowcharts/#diagram-translated-point-assignments" data-route="translated-point-assignments"><text x="412" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="schedule-route"><rect x="704" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="720" y="434">分野</text><text class="no