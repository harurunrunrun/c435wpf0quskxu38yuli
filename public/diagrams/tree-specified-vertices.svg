<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-specified-vertices flow-desc-tree-specified-vertices" width="1112" height="1321" viewBox="0 0 1112 1321" data-flow-svg="tree-specified-vertices"><title id="flow-title-tree-specified-vertices">少数の指定頂点と距離の集計の解法フローチャート</title><desc id="flow-desc-tree-specified-vertices">一度に指定する頂点数と、距離や部分木について求める情報を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-specified-vertices" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="marked:yes:virtual"><title>はい</title><path d="M719.833 182 V194 C719.833 226 500 226 500 258 V270"/><path d="M500 308 V320 C500 352 500 352 500 384 V396" marker-end="url(#arrow-tree-specified-vertices)"/><g class="flow-edge-label" data-edge-label="marked:yes:virtual" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="460" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="500" y="293">はい</text></g></g><g class="flow-edge no" data-edge="marked:no:distance"><title>いいえ</title><path d="M799.833 182 V194 C799.833 226 864 226 864 258 V270"/><path d="M864 308 V320 C864 352 864 352 864 384 V396" marker-end="url(#arrow-tree-specified-vertices)"/><g class="flow-edge-label" data-edge-label="marked:no:distance" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="824" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="864" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="marked:unknown:check"><title>わからない</title><path d="M879.833 182 V194 C879.833 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V320 C1035.5 352 1074 352 1074 384 V396 V577 C1074 609 1014.5 609 1014.5 641 V653 V703 C1014.5 735 973.333 735 973.333 767 V779" marker-end="url(#arrow-tree-specified-vertices)"/><g class="flow-edge-label" data-edge-label="marked:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="distance:yes:centroid"><title>はい</title><path d="M784 546 V577 C784 609 192 609 192 641 V653"/><path d="M192 691 V703 C192 735 192 735 192 767 V779" marker-end="url(#arrow-tree-specified-vertices)"/><g class="flow-edge-label" data-edge-label="distance:yes:centroid" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="653" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="676">はい</text></g></g><g class="flow-edge no" data-edge="distance:no:merge"><title>いいえ</title><path d="M864 546 V577 C864 609 556 609 556 641 V653"/><path d="M556 691 V703 C556 735 556 735 556 767 V779" marker-end="url(#arrow-tree-specified-vertices)"/><g class="flow-edge-label" data-edge-label="distance:no:merge" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="653" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="676">いいえ</text></g></g><g class="flow-edge unknown" data-edge="distance:unknown:check"><title>わからない</title><path d="M944 546 V577 C944 609 920 609 920 641 V653"/><path d="M920 691 V703 C920 735 866.667 735 866.667 767 V779" marker-end="url(#arrow-tree-specified-vertices)"/><g class="flow-edge-label" data-edge-label="distance:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="653" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="676">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M840 929 V948 C840 980 556 980 556 1012 V1024"/><path d="M556 1062 V1074 C556 1106 556 1106 556 1138 V1150" marker-end="url(#arrow-tree-specified-vertices)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="1024" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1047">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 929 V948 C920 980 907 980 907 1012 V1024"/><path d="M907 1062 V1074 C907 1106 866.667 1106 866.667 1138 V1150" marker-end="url(#arrow-tree-specified-vertices)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1024" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1047">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 929 V948 C1000 980 1035.5 980 1035.5 1012 V1024"/><path d="M1035.5 1062 V1074 C1035.5 1106 973.333 1106 973.333 1138 V1150" marker-end="url(#arrow-tree-specified-vertices)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1024" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1047">わからない</text></g></g><g class="flow-node question" data-node="marked"><rect x="639.8333333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="655.8333333333334" y="52">質問</text><text class="node-title" x="655.8333333333334" y="80">一回の問い合わせで指定される頂点が</text><text class="node-title" x="655.8333333333334" y="103">少数ですか？</text><text class="node-explanation" x="655.8333333333334" y="130">指定頂点と必要な LCA だけを残して、その関係</text><text class="node-explanation" x="655.8333333333334" y="148">を小さな木にします。</text></g><g class="flow-node question" data-node="distance"><rect x="704" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="720" y="416">質問</text><text class="node-title" x="720" y="444">頂点からの距離に応じて全体の頂点を</text><text class="node-title" x="720" y="467">集計しますか？</text><text class="node-explanation" x="720" y="494">中心を一つずつ除き、距離に関する情報を併合する方</text><text class="node-explanation" x="720" y="512">法を考えます。</text></g><g class="flow-node route" data-node="merge"><rect x="396" y="779" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="799">分野</text><text class="node-title" x="412" y="827">部分木の集合と過去の版</text><text class="node-explanation" x="412" y="854">部分木の集合を併合するか、木上の値の過去の状態を</text><text class="node-explanation" x="412" y="872">残すかを確認します。</text><a href="/flowchartcp/flowcharts/#diagram-tree-subtree-collections" data-route="tree-subtree-collections"><text x="412" y="900">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="779" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="799">質問</text><text class="node-title" x="776" y="827">問い合わせ対象は、祖先・部分木・一</text><text class="node-title" x="776" y="850">本の経路のどれか書けますか？</text><text class="node-explanation" x="776" y="877">根を決め、対象となる頂点や辺を小さな木に描いてみ</text><text class="node-explanation" x="776" y="895">ます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="1150" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="1170">分野</text><text class="node-title" x="776" y="1198">条件を確かめる</text><text class="node-explanation" x="776" y="1225">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="1253">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="virtual"><rect x="340" y="396" width="320" height="169" rx="7"/><text class="node-kind" x="356" y="416">候補</text><text class="node-title" x="356" y="444">虚木</text><a href="/flowchartcp/techniques/virtual-tree-adjacent-lca/"><title>DFS順で隣り合う指定頂点のLCAを加えて補助木を作るの記事へ</title><text x="356" y="483">DFS順で隣り合う指定頂点のLCAを加えて補助</text><text x="356" y="501">木を作る</text></a><a href="/flowchartcp/techniques/virtual-tree/"><title>補助木の記事へ</title><text x="356" y="525">補助木</text></a></g><g class="flow-node route" data-node="centroid"><rect x="32" y="779" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="799">分野</text><text class="node-title" x="48" y="827">二頂点の経路の長さと求める量</text><a href="/flowchartcp/flowcharts/#diagram-tree-pair-distance" data-route="tree-pair-distance"><text x="48" y="864">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1150" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1170">候補</text><text class="node-title" x="412" y="1198">問い合わせの対象を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1237">状態の設計</text></a></g></svg>