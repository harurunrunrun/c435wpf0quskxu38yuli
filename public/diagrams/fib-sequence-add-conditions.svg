<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-fib-sequence-add-conditions flow-desc-fib-sequence-add-conditions" width="748" height="1383" viewBox="0 0 748 1383" data-flow-svg="fib-sequence-add-conditions"><title id="flow-title-fib-sequence-add-conditions">区間へのフィボナッチ列加算と区間和の解法フローチャート</title><desc id="flow-desc-fib-sequence-add-conditions">加える列、集計する量、更新と質問の順序を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-fib-sequence-add-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:fixed-sum"><title>はい</title><path d="M464.5 205 V217 C464.5 249 419 249 419 281 V293"/><path d="M419 331 V343 C419 375 432.5 375 432.5 407 V419" marker-end="url(#arrow-fib-sequence-add-conditions)"/><g class="flow-edge-label" data-edge-label="model:yes:fixed-sum" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="316">はい</text></g></g><g class="flow-edge no" data-edge="model:no:check"><title>いいえ</title><path d="M544.5 205 V217 C544.5 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V599 C654 631 654 631 654 663 V675 V725 C654 757 654 757 654 789 V801 V981 C654 1013 654 1013 654 1045 V1057 V1107 C654 1139 624.571 1139 624.571 1171 V1183" marker-end="url(#arrow-fib-sequence-add-conditions)"/><g class="flow-edge-label" data-edge-label="model:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M624.5 205 V217 C624.5 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 407 V419 V599 C710 631 710 631 710 663 V675 V725 C710 757 710 757 710 789 V801 V981 C710 1013 710 1013 710 1045 V1057 V1107 C710 1139 670.286 1139 670.286 1171 V1183" marker-end="url(#arrow-fib-sequence-add-conditions)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="fixed-sum:yes:interleaved"><title>はい</title><path d="M352.5 587 V599 C352.5 631 307 631 307 663 V675"/><path d="M307 713 V725 C307 757 319.5 757 319.5 789 V801" marker-end="url(#arrow-fib-sequence-add-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-sum:yes:interleaved" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="698">はい</text></g></g><g class="flow-edge no" data-edge="fixed-sum:no:check"><title>いいえ</title><path d="M432.5 587 V599 C432.5 631 431 631 431 663 V675"/><path d="M431 713 V725 C431 757 542 757 542 789 V801 V981 C542 1013 542 1013 542 1045 V1057 V1107 C542 1139 533.143 1139 533.143 1171 V1183" marker-end="url(#arrow-fib-sequence-add-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-sum:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed-sum:unknown:check"><title>わからない</title><path d="M512.5 587 V599 C512.5 631 559.5 631 559.5 663 V675"/><path d="M559.5 713 V725 C559.5 757 598 757 598 789 V801 V981 C598 1013 598 1013 598 1045 V1057 V1107 C598 1139 578.857 1139 578.857 1171 V1183" marker-end="url(#arrow-fib-sequence-add-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-sum:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="interleaved:yes:answer"><title>はい</title><path d="M239.5 969 V981 C239.5 1013 192 1013 192 1045 V1057"/><path d="M192 1095 V1107 C192 1139 192 1139 192 1171 V1183" marker-end="url(#arrow-fib-sequence-add-conditions)"/><g class="flow-edge-label" data-edge-label="interleaved:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="interleaved:no:check"><title>いいえ</title><path d="M319.5 969 V981 C319.5 1013 319 1013 319 1045 V1057"/><path d="M319 1095 V1107 C319 1139 441.714 1139 441.714 1171 V1183" marker-end="url(#arrow-fib-sequence-add-conditions)"/><g class="flow-edge-label" data-edge-label="interleaved:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="interleaved:unknown:check"><title>わからない</title><path d="M399.5 969 V981 C399.5 1013 447.5 1013 447.5 1045 V1057"/><path d="M447.5 1095 V1107 C447.5 1139 487.429 1139 487.429 1171 V1183" marker-end="url(#arrow-fib-sequence-add-conditions)"/><g class="flow-edge-label" data-edge-label="interleaved:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">更新は区間の左端からF1=1,F2</text><text class="node-title" x="400.5" y="103">=1のフィボナッチ列を順に足す操作</text><text class="node-title" x="400.5" y="126">ですか？</text><text class="node-explanation" x="400.5" y="153">加算量は更新区間の左端からの距離で変わります。一</text><text class="node-explanation" x="400.5" y="171">様な区間加算とは情報を分けます。</text></g><g class="flow-node question" data-node="fixed-sum"><rect x="272.5" y="419" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">求める量は区間和で、更新も集計も同</text><text class="node-title" x="288.5" y="490">じ法で計算できますか？</text><text class="node-explanation" x="288.5" y="517">列の先頭二項から、その区間への加算量の合計を計算</text><text class="node-explanation" x="288.5" y="535">します。最小値や最大値では同じ情報だけでは足りま</text><text class="node-explanation" x="288.5" y="553">せん。</text></g><g class="flow-node question" data-node="interleaved"><rect x="159.5" y="801" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="821">質問</text><text class="node-title" x="175.5" y="849">更新と質問が混在し、その都度の区間</text><text class="node-title" x="175.5" y="872">和を高速に求める必要がありますか？</text><text class="node-explanation" x="175.5" y="899">各区間に先頭二項を保存し、子へ伝えるときに列の開</text><text class="node-explanation" x="175.5" y="917">始位置をずらします。掲載実装の法は10^9+9で</text><text class="node-explanation" x="175.5" y="935">す。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">加算列の先頭二項を遅延値として持</text><text class="node-title" x="48" y="1254">ち、右の子の開始位置へずらす</text><a href="/flowchartcp/techniques/fibonacci-range-sequence-lazy/"><title>区間へフィボナッチ列を足す更新は、先頭二項を持って子区間へずらすの記事へ</title><text x="48" y="1293">区間へフィボナッチ列を足す更新は、先頭二項を</text><text x="48" y="1311">持って子区間へずらす</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1203">分野</text><text class="node-title" x="412" y="1231">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1268">詳細の質問・図へ →</text></a></g></svg>