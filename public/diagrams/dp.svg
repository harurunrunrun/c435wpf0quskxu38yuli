<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dp flow-desc-dp" width="2568" height="938" viewBox="0 0 2568 938" data-flow-svg="dp"><title id="flow-title-dp">順番に選ぶ・分割するの解法フローチャート</title><desc id="flow-desc-dp">状態の数と、一状態からの遷移の数を分けて考えます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dp" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge choice-limits" data-edge="defined:choice-limits:category-choice-limits"><title>要素や位置を選ぶときの個数・合計・報酬</title><path d="M1164 141 V153 C1164 185 192 185 192 217 V229"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="defined:choice-limits:category-choice-limits" tabindex="0" role="group" aria-label="選択肢：要素や位置を選ぶときの個数・合計・報酬"><rect x="69.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="252">要素や位置を選ぶときの個数・合計・</text><text text-anchor="middle" x="192" y="270">報酬</text></g></g><g class="flow-edge sequence-removals" data-edge="defined:sequence-removals:category-sequence-removals"><title>列の分割・隣接要素の併合や削除</title><path d="M1204 141 V153 C1204 185 556 185 556 217 V229"/><path d="M556 267 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="defined:sequence-removals:category-sequence-removals" tabindex="0" role="group" aria-label="選択肢：列の分割・隣接要素の併合や削除"><rect x="446.5" y="229" width="219" height="38" rx="5"/><text text-anchor="middle" x="556" y="252">列の分割・隣接要素の併合や削除</text></g></g><g class="flow-edge placement-time" data-edge="defined:placement-time:category-placement-time"><title>位置・移動時間・仕事の実行条件</title><path d="M1244 141 V153 C1244 185 920 185 920 217 V229"/><path d="M920 267 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="defined:placement-time:category-placement-time" tabindex="0" role="group" aria-label="選択肢：位置・移動時間・仕事の実行条件"><rect x="810.5" y="229" width="219" height="38" rx="5"/><text text-anchor="middle" x="920" y="252">位置・移動時間・仕事の実行条件</text></g></g><g class="flow-edge linked-groups" data-edge="defined:linked-groups:category-linked-groups"><title>二者の条件・組分け・選択の依存関係</title><path d="M1284 141 V153 C1284 185 1284 185 1284 217 V229"/><path d="M1284 267 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="defined:linked-groups:category-linked-groups" tabindex="0" role="group" aria-label="選択肢：二者の条件・組分け・選択の依存関係"><rect x="1161.5" y="229" width="245" height="38" rx="5"/><text text-anchor="middle" x="1284" y="252">二者の条件・組分け・選択の依存関係</text></g></g><g class="flow-edge generation-history" data-edge="defined:generation-history:category-generation-history"><title>整数や列の生成・前の値や履歴の条件</title><path d="M1324 141 V153 C1324 185 1648 185 1648 217 V229"/><path d="M1648 267 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="defined:generation-history:category-generation-history" tabindex="0" role="group" aria-label="選択肢：整数や列の生成・前の値や履歴の条件"><rect x="1525.5" y="229" width="245" height="38" rx="5"/><text text-anchor="middle" x="1648" y="252">整数や列の生成・前の値や履歴の条件</text></g></g><g class="flow-edge hidden-partition" data-edge="defined:hidden-partition:hidden-partition-route"><title>既知の集合と応答から、重ならない三つの集合と残る秘密の候補を求める</title><path d="M1364 141 V153 C1364 185 2012 185 2012 217 V229"/><path d="M2012 285 V297 C2012 329 2012 329 2012 361 V373" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="defined:hidden-partition:hidden-partition-route" tabindex="0" role="group" aria-label="選択肢：既知の集合と応答から、重ならない三つの集合と残る秘密の候補を求める"><rect x="1889.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="252">既知の集合と応答から、重ならない三</text><text text-anchor="middle" x="2012" y="270">つの集合と残る秘密の候補を求める</text></g></g><g class="flow-edge unknown" data-edge="defined:unknown:check"><title>わからない</title><path d="M1404 141 V153 C1404 185 2376 185 2376 217 V229"/><path d="M2376 267 V297 C2376 329 2376 329 2376 361 V373" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="defined:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2331.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="2376" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:state-route"><title>はい</title><path d="M2296 523 V565 C2296 597 2012 597 2012 629 V641"/><path d="M2012 679 V691 C2012 723 2012 723 2012 755 V767" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="check:yes:state-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1972" y="641" width="80" height="38" rx="5"/><text text-anchor="middle" x="2012" y="664">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2376 523 V565 C2376 597 2363 597 2363 629 V641"/><path d="M2363 679 V691 C2363 723 2322.667 723 2322.667 755 V767" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2323" y="641" width="80" height="38" rx="5"/><text text-anchor="middle" x="2363" y="664">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2456 523 V565 C2456 597 2491.5 597 2491.5 629 V641"/><path d="M2491.5 679 V691 C2491.5 723 2429.333 723 2429.333 755 V767" marker-end="url(#arrow-dp)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2447" y="641" width="89" height="38" rx="5"/><text text-anchor="middle" x="2491.5" y="664">わからない</text></g></g><g class="flow-node question" data-node="defined"><rect x="1124" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1140" y="52">質問</text><text class="node-title" x="1140" y="80">選び方や分け方の特徴はどれですか？</text><text class="node-explanation" x="1140" y="107">入力の上限と、求める制約から探します。</text></g><g class="flow-node question" data-node="check"><rect x="2216" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="2232" y="393">質問</text><text class="node-title" x="2232" y="421">小さい入力で、全状態と遷移を列挙で</text><text class="node-title" x="2232" y="444">きますか？</text><text class="node-explanation" x="2232" y="471">列挙した表で状態の重複と、どこに時間がかかるかを</text><text class="node-explanation" x="2232" y="489">確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="2216" y="767" width="320" height="139" rx="7"/><text class="node-kind" x="2232" y="787">分野</text><text class="node-title" x="2232" y="815">条件を確かめる</text><text class="node-explanation" x="2232" y="842">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="2232" y="870">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="state-route"><rect x="1852" y="767" width="320" height="121" rx="7"/><text class="node-kind" x="1868" y="787">分野</text><text class="node-title" x="1868" y="815">選ぶ数・重さ・残す履歴</text><a href="/flowchartcp/flowcharts/#diagram-dp-state" data-route="dp-state"><text x="1868" y="852">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-choice-limits"><rect x="32" y="373" width="320" height="180" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">要素や位置を選ぶときの個数・合計・</text><text class="node-title" x="48" y="444">報酬</text><text class="node-explanation" x="48" y="471">選ぶ対象の個数・合計の制約と、選択した位置から得</text><text class="node-explanation" x="48" y="489">る報酬を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-dp-choice-limits" data-route="dp-choice-limits"><text x="48" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-sequence-removals"><rect x="396" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">列の分割・隣接要素の併合や削除</text><text class="node-explanation" x="412" y="448">連続した区間への分割と、隣接した対象を併合・削除</text><text class="node-explanation" x="412" y="466">する操作を区別します。</text><a href="/flowchartcp/flowcharts/#diagram-dp-sequence-removals" data-route="dp-sequence-removals"><text x="412" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-placement-time"><rect x="760" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">位置・移動時間・仕事の実行条件</text><text class="node-explanation" x="776" y="448">選ぶ位置、移動の速度、仕事の時刻や距離の費用を分</text><text class="node-explanation" x="776" y="466">けます。</text><a href="/flowchartcp/flowcharts/#diagram-dp-placement-time" data-route="dp-placement-time"><text x="776" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-linked-groups"><rect x="1124" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">二者の条件・組分け・選択の依存関係</text><text class="node-explanation" x="1140" y="448">二者を同時に選べるか、組の合計や広がり、別の対象</text><text class="node-explanation" x="1140" y="466">も選ぶ条件を確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-dp-linked-groups" data-route="dp-linked-groups"><text x="1140" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-generation-history"><rect x="1488" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">整数や列の生成・前の値や履歴の条件</text><text class="node-explanation" x="1504" y="448">整数の桁や列の生成条件と、次の選択に必要な過去の</text><text class="node-explanation" x="1504" y="466">情報を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-dp-generation-history" data-route="dp-generation-history"><text x="1504" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="hidden-partition-route"><rect x="1852" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="393">分野</text><text class="node-title" x="1868" y="421">既知の集合と応答から、重ならない三</text><text class="node-title" x="1868" y="444">つの集合と残る秘密の候補を求める</text><a href="/flowchartcp/flowcharts/#diagram-disjoint-hidden-partition-conditions" data-route="disjoint-hidden-partition-conditions"><text x="1868" y="481">詳細の質問・図へ →</text></a></g></svg>