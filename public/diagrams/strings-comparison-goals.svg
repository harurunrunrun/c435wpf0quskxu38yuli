<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strings-comparison-goals flow-desc-strings-comparison-goals" width="1840" height="944" viewBox="0 0 1840 944" data-flow-svg="strings-comparison-goals"><title id="flow-title-strings-comparison-goals">一致の比較・編集距離の解法フローチャート</title><desc id="flow-desc-strings-comparison-goals">接頭辞や語の一致、少ない編集回数、削除した列と逆順の比較を調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strings-comparison-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge prefix" data-edge="text-task:prefix:match-route"><title>接頭辞・接尾辞の一致長や、繰り返しの周期</title><path d="M794.464 159 V171 C794.464 203 192 203 192 235 V247"/><path d="M192 303 V333 C192 365 138.667 365 138.667 397 V409" marker-end="url(#arrow-strings-comparison-goals)"/><g class="flow-edge-label" data-edge-label="text-task:prefix:match-route" tabindex="0" role="group" aria-label="選択肢：接頭辞・接尾辞の一致長や、繰り返しの周期"><rect x="69.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="270">接頭辞・接尾辞の一致長や、繰り返し</text><text text-anchor="middle" x="192" y="288">の周期</text></g></g><g class="flow-edge pattern" data-edge="text-task:pattern:match-route"><title>一つまたは多数の語の出現・禁止語</title><path d="M840.179 159 V171 C840.179 203 474.5 203 474.5 235 V247"/><path d="M474.5 285 V333 C474.5 365 245.333 365 245.333 397 V409" marker-end="url(#arrow-strings-comparison-goals)"/><g class="flow-edge-label" data-edge-label="text-task:pattern:match-route" tabindex="0" role="group" aria-label="選択肢：一つまたは多数の語の出現・禁止語"><rect x="358.5" y="247" width="232" height="38" rx="5"/><text text-anchor="middle" x="474.5" y="270">一つまたは多数の語の出現・禁止語</text></g></g><g class="flow-edge edit-threshold" data-edge="text-task:edit-threshold:edit-threshold-route"><title>挿入・削除・置換の最少回数が、小さい K 以下か</title><path d="M885.893 159 V171 C885.893 203 757 203 757 235 V247"/><path d="M757 303 V333 C757 365 556 365 556 397 V409" marker-end="url(#arrow-strings-comparison-goals)"/><g class="flow-edge-label" data-edge-label="text-task:edit-threshold:edit-threshold-route" tabindex="0" role="group" aria-label="選択肢：挿入・削除・置換の最少回数が、小さい K 以下か"><rect x="634.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="757" y="270">挿入・削除・置換の最少回数が、小さ</text><text text-anchor="middle" x="757" y="288">い K 以下か</text></g></g><g class="flow-edge reverse-delete-half" data-edge="text-task:reverse-delete-half:reverse-half-route"><title>長さ 2N の列から N 文字を連続削除し、残りを削除部分の逆順と一致させる</title><path d="M931.607 159 V171 C931.607 203 1046 203 1046 235 V247"/><path d="M1046 321 V333 C1046 365 920 365 920 397 V409" marker-end="url(#arrow-strings-comparison-goals)"/><g class="flow-edge-label" data-edge-label="text-task:reverse-delete-half:reverse-half-route" tabindex="0" role="group" aria-label="選択肢：長さ 2N の列から N 文字を連続削除し、残りを削除部分の逆順と一致させる"><rect x="923.5" y="247" width="245" height="74" rx="5"/><text text-anchor="middle" x="1046" y="270">長さ 2N の列から N 文字を連</text><text text-anchor="middle" x="1046" y="288">続削除し、残りを削除部分の逆順と一</text><text text-anchor="middle" x="1046" y="306">致させる</text></g></g><g class="flow-edge common-subsequence-length" data-edge="text-task:common-subsequence-length:common-subsequence-length-route"><title>二つの列の共通部分列の長さだけを、できるだけ高速に求める</title><path d="M977.321 159 V171 C977.321 203 1335 203 1335 235 V247"/><path d="M1335 303 V333 C1335 365 1284 365 1284 397 V409" marker-end="url(#arrow-strings-comparison-goals)"/><g class="flow-edge-label" data-edge-label="text-task:common-subsequence-length:common-subsequence-length-route" tabindex="0" role="group" aria-label="選択肢：二つの列の共通部分列の長さだけを、できるだけ高速に求める"><rect x="1212.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1335" y="270">二つの列の共通部分列の長さだけを、</text><text text-anchor="middle" x="1335" y="288">できるだけ高速に求める</text></g></g><g class="flow-edge unknown" data-edge="text-task:unknown:check"><title>わからない</title><path d="M1023.036 159 V171 C1023.036 203 1648 203 1648 235 V247"/><path d="M1648 285 V333 C1648 365 1648 365 1648 397 V409" marker-end="url(#arrow-strings-comparison-goals)"/><g class="flow-edge-label" data-edge-label="text-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1603.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1648" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:substring-route"><title>はい</title><path d="M1568 559 V571 C1568 603 1284 603 1284 635 V647"/><path d="M1284 685 V697 C1284 729 1284 729 1284 761 V773" marker-end="url(#arrow-strings-comparison-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:substring-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1244" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="670">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1648 559 V571 C1648 603 1635 603 1635 635 V647"/><path d="M1635 685 V697 C1635 729 1594.667 729 1594.667 761 V773" marker-end="url(#arrow-strings-comparison-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1595" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="1635" y="670">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1728 559 V571 C1728 603 1763.5 603 1763.5 635 V647"/><path d="M1763.5 685 V697 C1763.5 729 1701.333 729 1701.333 761 V773" marker-end="url(#arrow-strings-comparison-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1719" y="647" width="89" height="38" rx="5"/><text text-anchor="middle" x="1763.5" y="670">わからない</text></g></g><g class="flow-node question" data-node="text-task"><rect x="748.75" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="764.75" y="52">質問</text><text class="node-title" x="764.75" y="80">どの列を比較し、何を求めますか？</text><text class="node-explanation" x="764.75" y="107">比較する列を固定するか、編集や削除を含めて比べる</text><text class="node-explanation" x="764.75" y="125">かを区別します。</text></g><g class="flow-node question" data-node="check"><rect x="1488" y="409" width="320" height="150" rx="7"/><text class="node-kind" x="1504" y="429">質問</text><text class="node-title" x="1504" y="457">求めているのは、連続した部分文字列</text><text class="node-title" x="1504" y="480">ですか？</text><text class="node-explanation" x="1504" y="507">連続しない部分列なら、添字や最後の文字などを状態</text><text class="node-explanation" x="1504" y="525">にする DP を検討します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1488" y="773" width="320" height="139" rx="7"/><text class="node-kind" x="1504" y="793">分野</text><text class="node-title" x="1504" y="821">条件を確かめる</text><text class="node-explanation" x="1504" y="848">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1504" y="876">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="match-route"><rect x="32" y="409" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="429">分野</text><text class="node-title" x="48" y="457">文字列の一致</text><a href="/flowchartcp/flowcharts/#diagram-string-match" data-route="string-match"><text x="48" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="substring-route"><rect x="1124" y="773" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="793">分野</text><text class="node-title" x="1140" y="821">部分文字列</text><a href="/flowchartcp/flowcharts/#diagram-string-substring" data-route="string-substring"><text x="1140" y="858">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="edit-threshold-route"><rect x="396" y="409" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="429">分野</text><text class="node-title" x="412" y="457">編集回数の上限が小さい二列の照合</text><a href="/flowchartcp/flowcharts/#diagram-small-edit-distance-band" data-route="small-edit-distance-band"><text x="412" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="reverse-half-route"><rect x="760" y="409" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="429">分野</text><text class="node-title" x="776" y="457">削除した半分と、残った列の逆順照合</text><a href="/flowchartcp/flowcharts/#diagram-reverse-deletion-half-match" data-route="reverse-deletion-half-match"><text x="776" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="common-subsequence-length-route"><rect x="1124" y="409" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="429">分野</text><text class="node-title" x="1140" y="457">二つの列の共通部分列の長さだけを、</text><text class="node-title" x="1140" y="480">できるだけ高速に求める</text><a href="/flowchartcp/flowcharts/#diagram-lcs-bit-length-conditions" data-route="lcs-bit-length-conditions"><text x="1140" y="517">詳細の質問・図へ →</text></a></g></svg>