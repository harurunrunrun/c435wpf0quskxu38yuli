<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-grid-prefix-rectangle-conditions flow-desc-grid-prefix-rectangle-conditions" width="748" height="1365" viewBox="0 0 748 1365" data-flow-svg="grid-prefix-rectangle-conditions"><title id="flow-title-grid-prefix-rectangle-conditions">番号交換後に長方形となる段階の個数の解法フローチャート</title><desc id="flow-desc-grid-prefix-rectangle-conditions">求める集合や移動の条件と、操作・質問の範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-grid-prefix-rectangle-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="permutation-prefix:yes:swaps-only"><title>はい</title><path d="M464.5 205 V217 C464.5 249 419 249 419 281 V293"/><path d="M419 331 V343 C419 375 432.5 375 432.5 407 V419" marker-end="url(#arrow-grid-prefix-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="permutation-prefix:yes:swaps-only" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="316">はい</text></g></g><g class="flow-edge no" data-edge="permutation-prefix:no:check"><title>いいえ</title><path d="M544.5 205 V217 C544.5 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V581 C654 613 654 613 654 645 V657 V707 C654 739 654 739 654 771 V783 V963 C654 995 654 995 654 1027 V1039 V1089 C654 1121 624.571 1121 624.571 1153 V1165" marker-end="url(#arrow-grid-prefix-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="permutation-prefix:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="permutation-prefix:unknown:check"><title>わからない</title><path d="M624.5 205 V217 C624.5 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 407 V419 V581 C710 613 710 613 710 645 V657 V707 C710 739 710 739 710 771 V783 V963 C710 995 710 995 710 1027 V1039 V1089 C710 1121 670.286 1121 670.286 1153 V1165" marker-end="url(#arrow-grid-prefix-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="permutation-prefix:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="swaps-only:yes:bounds"><title>はい</title><path d="M352.5 569 V581 C352.5 613 307 613 307 645 V657"/><path d="M307 695 V707 C307 739 319.5 739 319.5 771 V783" marker-end="url(#arrow-grid-prefix-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="swaps-only:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="680">はい</text></g></g><g class="flow-edge no" data-edge="swaps-only:no:check"><title>いいえ</title><path d="M432.5 569 V581 C432.5 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 542 739 542 771 V783 V963 C542 995 542 995 542 1027 V1039 V1089 C542 1121 533.143 1121 533.143 1153 V1165" marker-end="url(#arrow-grid-prefix-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="swaps-only:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="swaps-only:unknown:check"><title>わからない</title><path d="M512.5 569 V581 C512.5 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 598 739 598 771 V783 V963 C598 995 598 995 598 1027 V1039 V1089 C598 1121 578.857 1121 578.857 1153 V1165" marker-end="url(#arrow-grid-prefix-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="swaps-only:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 951 V963 C239.5 995 192 995 192 1027 V1039"/><path d="M192 1077 V1089 C192 1121 192 1121 192 1153 V1165" marker-end="url(#arrow-grid-prefix-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 951 V963 C319.5 995 319 995 319 1027 V1039"/><path d="M319 1077 V1089 C319 1121 441.714 1121 441.714 1153 V1165" marker-end="url(#arrow-grid-prefix-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 951 V963 C399.5 995 447.5 995 447.5 1027 V1039"/><path d="M447.5 1077 V1089 C447.5 1121 487.429 1121 487.429 1153 V1165" marker-end="url(#arrow-grid-prefix-rectangle-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="permutation-prefix"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">全マスに0〜HW−1を一つずつ置</text><text class="node-title" x="400.5" y="103">き、番号0からtまでが一つの長方形</text><text class="node-title" x="400.5" y="126">を埋めるtを数えますか？</text><text class="node-explanation" x="400.5" y="153">長方形格子の全マスを使います。選ぶ集合は非空で、</text><text class="node-explanation" x="400.5" y="171">穴のない軸平行な長方形と一致する必要があります。</text></g><g class="flow-node question" data-node="swaps-only"><rect x="272.5" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">操作は二つの番号の位置の交換で、毎</text><text class="node-title" x="288.5" y="490">回その後の個数を返しますか？</text><text class="node-explanation" x="288.5" y="517">格子の大きさは固定し、番号の追加・削除は行いませ</text><text class="node-explanation" x="288.5" y="535">ん。一行・一列・一マスの長方形も数えます。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="803">質問</text><text class="node-title" x="175.5" y="831">マス数は100万以下、交換は5万回</text><text class="node-title" x="175.5" y="854">以下ですか？</text><text class="node-explanation" x="175.5" y="881">HとWはそれぞれ1以上です。初期化にマス数に比例</text><text class="node-explanation" x="175.5" y="899">する時間と空間、交換一回にマス数の対数時間を使い</text><text class="node-explanation" x="175.5" y="917">ます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1185">候補</text><text class="node-title" x="48" y="1213">格子の各頂点の寄与を番号の区間へま</text><text class="node-title" x="48" y="1236">とめ、最小値4になる段階を数える</text><a href="/flowchartcp/techniques/dynamic-grid-prefix-rectangle-corner-minimum-count/"><title>番号を小さい順に集めたマスが長方形になる段階を、交換後も数えるの記事へ</title><text x="48" y="1275">番号を小さい順に集めたマスが長方形になる段階</text><text x="48" y="1293">を、交換後も数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1185">分野</text><text class="node-title" x="412" y="1213">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1250">詳細の質問・図へ →</text></a></g></svg>