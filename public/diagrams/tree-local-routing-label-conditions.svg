<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-local-routing-label-conditions flow-desc-tree-local-routing-label-conditions" width="748" height="1411" viewBox="0 0 748 1411" data-flow-svg="tree-local-routing-label-conditions"><title id="flow-title-tree-local-routing-label-conditions">木を保存できない実行段階の、隣接ラベルによる経路選択の解法フローチャート</title><desc id="flow-desc-tree-local-routing-label-conditions">対象の形、求める値、扱える大きさを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-local-routing-label-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="tree-two-phases:yes:local-next-hop"><title>はい</title><path d="M464.5 205 V217 C464.5 249 419 249 419 281 V293"/><path d="M419 331 V343 C419 375 432.5 375 432.5 407 V419" marker-end="url(#arrow-tree-local-routing-label-conditions)"/><g class="flow-edge-label" data-edge-label="tree-two-phases:yes:local-next-hop" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="316">はい</text></g></g><g class="flow-edge no" data-edge="tree-two-phases:no:check"><title>いいえ</title><path d="M544.5 205 V217 C544.5 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V604 C654 636 654 636 654 668 V680 V730 C654 762 654 762 654 794 V806 V986 C654 1018 654 1018 654 1050 V1062 V1112 C654 1144 624.571 1144 624.571 1176 V1188" marker-end="url(#arrow-tree-local-routing-label-conditions)"/><g class="flow-edge-label" data-edge-label="tree-two-phases:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="tree-two-phases:unknown:check"><title>わからない</title><path d="M624.5 205 V217 C624.5 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 407 V419 V604 C710 636 710 636 710 668 V680 V730 C710 762 710 762 710 794 V806 V986 C710 1018 710 1018 710 1050 V1062 V1112 C710 1144 670.286 1144 670.286 1176 V1188" marker-end="url(#arrow-tree-local-routing-label-conditions)"/><g class="flow-edge-label" data-edge-label="tree-two-phases:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="local-next-hop:yes:bounds"><title>はい</title><path d="M352.5 592 V604 C352.5 636 307 636 307 668 V680"/><path d="M307 718 V730 C307 762 319.5 762 319.5 794 V806" marker-end="url(#arrow-tree-local-routing-label-conditions)"/><g class="flow-edge-label" data-edge-label="local-next-hop:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="703">はい</text></g></g><g class="flow-edge no" data-edge="local-next-hop:no:check"><title>いいえ</title><path d="M432.5 592 V604 C432.5 636 431 636 431 668 V680"/><path d="M431 718 V730 C431 762 542 762 542 794 V806 V986 C542 1018 542 1018 542 1050 V1062 V1112 C542 1144 533.143 1144 533.143 1176 V1188" marker-end="url(#arrow-tree-local-routing-label-conditions)"/><g class="flow-edge-label" data-edge-label="local-next-hop:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="703">いいえ</text></g></g><g class="flow-edge unknown" data-edge="local-next-hop:unknown:check"><title>わからない</title><path d="M512.5 592 V604 C512.5 636 559.5 636 559.5 668 V680"/><path d="M559.5 718 V730 C559.5 762 598 762 598 794 V806 V986 C598 1018 598 1018 598 1050 V1062 V1112 C598 1144 578.857 1144 578.857 1176 V1188" marker-end="url(#arrow-tree-local-routing-label-conditions)"/><g class="flow-edge-label" data-edge-label="local-next-hop:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="680" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 974 V986 C239.5 1018 192 1018 192 1050 V1062"/><path d="M192 1100 V1112 C192 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-tree-local-routing-label-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 974 V986 C319.5 1018 319 1018 319 1050 V1062"/><path d="M319 1100 V1112 C319 1144 441.714 1144 441.714 1176 V1188" marker-end="url(#arrow-tree-local-routing-label-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 974 V986 C399.5 1018 447.5 1018 447.5 1050 V1062"/><path d="M447.5 1100 V1112 C447.5 1144 487.429 1144 487.429 1176 V1188" marker-end="url(#arrow-tree-local-routing-label-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1085">わからない</text></g></g><g class="flow-node question" data-node="tree-two-phases"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">準備時に木全体へ相異なるラベルを付</text><text class="node-title" x="400.5" y="103">け、実行時には木や親の状態を引き継</text><text class="node-title" x="400.5" y="126">げませんか？</text><text class="node-explanation" x="400.5" y="153">準備と実行が別プロセスでも使えるラベル付けを考え</text><text class="node-explanation" x="400.5" y="171">ます。</text></g><g class="flow-node question" data-node="local-next-hop"><rect x="272.5" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">現在地と異なる目的地が同じ木にあ</text><text class="node-title" x="288.5" y="490">り、両者と全隣接先のラベルから、経</text><text class="node-title" x="288.5" y="513">路の最初の一歩を返しますか？</text><text class="node-explanation" x="288.5" y="540">隣接先は全て必要です。頂点をたどりながら木全体を</text><text class="node-explanation" x="288.5" y="558">復元することはできません。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="806" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="826">質問</text><text class="node-title" x="175.5" y="854">頂点数は1〜20万で、0..N−1</text><text class="node-title" x="175.5" y="877">のラベルを使えますか？</text><text class="node-explanation" x="175.5" y="904">全ラベルに同じ狭義単調増加変換をかけても使えま</text><text class="node-explanation" x="175.5" y="922">す。隣接ラベルを整列でき、変換後の値が非負の</text><text class="node-explanation" x="175.5" y="940">intに収まることが条件です。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1188" width="320" height="191" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">深さの偶奇でDFSの入る時と出る時</text><text class="node-title" x="48" y="1259">にラベルを発行し、隣接ラベルを区間</text><text class="node-title" x="48" y="1282">の端として使う</text><a href="/flowchartcp/techniques/tree-local-routing-alternating-dfs-labels/"><title>DFSの行き帰りでラベルを付け、隣接ラベルだけで木をたどるの記事へ</title><text x="48" y="1321">DFSの行き帰りでラベルを付け、隣接ラベルだけ</text><text x="48" y="1339">で木をたどる</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1188" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1208">分野</text><text class="node-title" x="412" y="1236">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1273">詳細の質問・図へ →</text></a></g></svg>