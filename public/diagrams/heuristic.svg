<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-heuristic flow-desc-heuristic" width="1168" height="931" viewBox="0 0 1168 931" data-flow-svg="heuristic"><title id="flow-title-heuristic">合法解と得点の改善の解法フローチャート</title><desc id="flow-desc-heuristic">評価関数、合法解、差分評価、探索の順番を決めます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-heuristic" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="offline:yes:output"><title>固定入力の出力を事前に改善する</title><path d="M502.25 182 V194 C502.25 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-heuristic)"/><g class="flow-edge-label" data-edge-label="offline:yes:output" tabindex="0" role="group" aria-label="選択肢：固定入力の出力を事前に改善する"><rect x="82.5" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">固定入力の出力を事前に改善する</text></g></g><g class="flow-edge no" data-edge="offline:no:model-route"><title>実行中に一般の候補を構築・変更する</title><path d="M566.25 182 V194 C566.25 226 468 226 468 258 V270"/><path d="M468 308 V338 C468 370 402 370 402 402 V414 V576 C402 608 612 608 612 640 V652 V702 C612 734 558.667 734 558.667 766 V778" marker-end="url(#arrow-heuristic)"/><g class="flow-edge-label" data-edge-label="offline:no:model-route" tabindex="0" role="group" aria-label="選択肢：実行中に一般の候補を構築・変更する"><rect x="345.5" y="270" width="245" height="38" rx="5"/><text text-anchor="middle" x="468" y="293">実行中に一般の候補を構築・変更する</text></g></g><g class="flow-edge triplet-packing" data-edge="offline:triplet-packing:triplet-packing-route"><title>固定入力の格子で、直線の三マスを重ねず多く選ぶ</title><path d="M630.25 182 V194 C630.25 226 757 226 757 258 V270"/><path d="M757 326 V338 C757 370 612 370 612 402 V414" marker-end="url(#arrow-heuristic)"/><g class="flow-edge-label" data-edge-label="offline:triplet-packing:triplet-packing-route" tabindex="0" role="group" aria-label="選択肢：固定入力の格子で、直線の三マスを重ねず多く選ぶ"><rect x="634.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="757" y="293">固定入力の格子で、直線の三マスを重</text><text text-anchor="middle" x="757" y="311">ねず多く選ぶ</text></g></g><g class="flow-edge unknown" data-edge="offline:unknown:check"><title>わからない</title><path d="M694.25 182 V194 C694.25 226 976 226 976 258 V270"/><path d="M976 308 V338 C976 370 976 370 976 402 V414" marker-end="url(#arrow-heuristic)"/><g class="flow-edge-label" data-edge-label="offline:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:model-route"><title>はい</title><path d="M896 564 V576 C896 608 702 608 702 640 V652"/><path d="M702 690 V702 C702 734 665.333 734 665.333 766 V778" marker-end="url(#arrow-heuristic)"/><g class="flow-edge-label" data-edge-label="check:yes:model-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="662" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="702" y="675">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 564 V576 C976 608 963 608 963 640 V652"/><path d="M963 690 V702 C963 734 922.667 734 922.667 766 V778" marker-end="url(#arrow-heuristic)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 564 V576 C1056 608 1091.5 608 1091.5 640 V652"/><path d="M1091.5 690 V702 C1091.5 734 1029.333 734 1029.333 766 V778" marker-end="url(#arrow-heuristic)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="675">わからない</text></g></g><g class="flow-node question" data-node="offline"><rect x="438.25" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="454.25" y="52">質問</text><text class="node-title" x="454.25" y="80">提出する形式と、必要な候補の計算は</text><text class="node-title" x="454.25" y="103">どれですか？</text><text class="node-explanation" x="454.25" y="130">固定入力への出力を作る形式と、実行中に部分変更を</text><text class="node-explanation" x="454.25" y="148">評価する形式を区別します。</text></g><g class="flow-node result" data-node="output"><rect x="32" y="414" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="434">候補</text><text class="node-title" x="48" y="462">出力を直接改善する</text><a href="/flowchartcp/techniques/output-only/"><title>出力のみの問題の記事へ</title><text x="48" y="501">出力のみの問題</text></a></g><g class="flow-node route" data-node="model-route"><rect x="452" y="778" width="320" height="121" rx="7"/><text class="node-kind" x="468" y="798">分野</text><text class="node-title" x="468" y="826">変更する対象と得点の構造</text><a href="/flowchartcp/flowcharts/#diagram-heuristic-models" data-route="heuristic-models"><text x="468" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="816" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="832" y="434">質問</text><text class="node-title" x="832" y="462">提出形式と、入力から変えられる部分</text><text class="node-title" x="832" y="485">を問題文で確認できますか？</text><text class="node-explanation" x="832" y="512">固定入力の出力ファイルか、入力ごとに実行するプロ</text><text class="node-explanation" x="832" y="530">グラムかを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="778" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="798">分野</text><text class="node-title" x="832" y="826">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="triplet-packing-route"><rect x="452" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="468" y="434">分野</text><text class="node-title" x="468" y="462">固定入力の格子で、直線の三マスを重</text><text class="node-title" x="468" y="485">ねず多く選ぶ</text><a href="/flowchartcp/flowcharts/#diagram-grid-triplet-packing-conditions" data-route="grid-triplet-packing-conditions"><text x="468" y="522">詳細の質問・図へ →</text></a></g></svg>