<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-rank-count-prize-conditions flow-desc-rank-count-prize-conditions" width="748" height="1365" viewBox="0 0 748 1365" data-flow-svg="rank-count-prize-conditions"><title id="flow-title-rank-count-prize-conditions">左右の上位個数への質問で唯一の最上位を探すの解法フローチャート</title><desc id="flow-desc-rank-count-prize-conditions">返答の意味、種類ごとの個数条件と、返答が整合する範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-rank-count-prize-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="strict-rank-pair:yes:squared-kind-growth"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-rank-count-prize-conditions)"/><g class="flow-edge-label" data-edge-label="strict-rank-pair:yes:squared-kind-growth" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="strict-rank-pair:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V581 C654 613 654 613 654 645 V657 V707 C654 739 654 739 654 771 V783 V963 C654 995 654 995 654 1027 V1039 V1089 C654 1121 624.571 1121 624.571 1153 V1165" marker-end="url(#arrow-rank-count-prize-conditions)"/><g class="flow-edge-label" data-edge-label="strict-rank-pair:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="strict-rank-pair:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V581 C710 613 710 613 710 645 V657 V707 C710 739 710 739 710 771 V783 V963 C710 995 710 995 710 1027 V1039 V1089 C710 1121 670.286 1121 670.286 1153 V1165" marker-end="url(#arrow-rank-count-prize-conditions)"/><g class="flow-edge-label" data-edge-label="strict-rank-pair:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="squared-kind-growth:yes:adaptive-full-bounds"><title>はい</title><path d="M352.5 569 V581 C352.5 613 307 613 307 645 V657"/><path d="M307 695 V707 C307 739 319.5 739 319.5 771 V783" marker-end="url(#arrow-rank-count-prize-conditions)"/><g class="flow-edge-label" data-edge-label="squared-kind-growth:yes:adaptive-full-bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="680">はい</text></g></g><g class="flow-edge no" data-edge="squared-kind-growth:no:check"><title>いいえ</title><path d="M432.5 569 V581 C432.5 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 542 739 542 771 V783 V963 C542 995 542 995 542 1027 V1039 V1089 C542 1121 533.143 1121 533.143 1153 V1165" marker-end="url(#arrow-rank-count-prize-conditions)"/><g class="flow-edge-label" data-edge-label="squared-kind-growth:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="squared-kind-growth:unknown:check"><title>わからない</title><path d="M512.5 569 V581 C512.5 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 598 739 598 771 V783 V963 C598 995 598 995 598 1027 V1039 V1089 C598 1121 578.857 1121 578.857 1153 V1165" marker-end="url(#arrow-rank-count-prize-conditions)"/><g class="flow-edge-label" data-edge-label="squared-kind-growth:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="adaptive-full-bounds:yes:result"><title>はい</title><path d="M239.5 951 V963 C239.5 995 192 995 192 1027 V1039"/><path d="M192 1077 V1089 C192 1121 192 1121 192 1153 V1165" marker-end="url(#arrow-rank-count-prize-conditions)"/><g class="flow-edge-label" data-edge-label="adaptive-full-bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="adaptive-full-bounds:no:check"><title>いいえ</title><path d="M319.5 951 V963 C319.5 995 319 995 319 1027 V1039"/><path d="M319 1077 V1089 C319 1121 441.714 1121 441.714 1153 V1165" marker-end="url(#arrow-rank-count-prize-conditions)"/><g class="flow-edge-label" data-edge-label="adaptive-full-bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="adaptive-full-bounds:unknown:check"><title>わからない</title><path d="M399.5 951 V963 C399.5 995 447.5 995 447.5 1027 V1039"/><path d="M447.5 1077 V1089 C447.5 1121 487.429 1121 487.429 1153 V1165" marker-end="url(#arrow-rank-count-prize-conditions)"/><g class="flow-edge-label" data-edge-label="adaptive-full-bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="strict-rank-pair"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">位置を選ぶと、厳密に上位の個数が左</text><text class="node-title" x="400.5" y="103">右別に返りますか？</text><text class="node-explanation" x="400.5" y="130">返答は二つの整数です。位置の並び自体には単調性を</text><text class="node-explanation" x="400.5" y="148">仮定しません。</text></g><g class="flow-node question" data-node="squared-kind-growth"><rect x="272.5" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">最上位が一個で、下位の種類の個数は</text><text class="node-title" x="288.5" y="467">直上の種類の個数の二乗より多いです</text><text class="node-title" x="288.5" y="490">か？</text><text class="node-explanation" x="288.5" y="517">上位から種類を並べ、隣り合う全ての種類で厳密な個</text><text class="node-explanation" x="288.5" y="535">数条件が成り立ちます。</text></g><g class="flow-node question" data-node="adaptive-full-bounds"><rect x="159.5" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="803">質問</text><text class="node-title" x="175.5" y="831">長さ3〜20万で、整合する返答の下</text><text class="node-title" x="175.5" y="854">で5000質問以内に探しますか？</text><text class="node-explanation" x="175.5" y="881">各返答後に、過去の全返答と整合する合法な列が少な</text><text class="node-explanation" x="175.5" y="899">くとも一つ残ります。列が最初に固定される場合も含</text><text class="node-explanation" x="175.5" y="917">みます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1185">候補</text><text class="node-title" x="48" y="1213">区間内の上位個数を保ち、中央からの</text><text class="node-title" x="48" y="1236">走査と二分を組み合わせる</text><a href="/flowchartcp/techniques/rank-count-oracle-equal-level-interval-pruning/"><title>左右の上位個数から、唯一の最上位の位置を少ない質問で探すの記事へ</title><text x="48" y="1275">左右の上位個数から、唯一の最上位の位置を少ない</text><text x="48" y="1293">質問で探す</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1185">分野</text><text class="node-title" x="412" y="1213">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1250">詳細の質問・図へ →</text></a></g></svg>