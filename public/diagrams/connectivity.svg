<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-connectivity flow-desc-connectivity" width="2568" height="562" viewBox="0 0 2568 562" data-flow-svg="connectivity"><title id="flow-title-connectivity">つながりが変わる操作の解法フローチャート</title><desc id="flow-desc-connectivity">有向性、追加、削除、巻き戻しを区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-connectivity" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge direction-goals" data-edge="operations:direction-goals:direction-goals-route"><title>辺の向きや、一方通行の道での到達性を扱う</title><path d="M1164 141 V153 C1164 185 192 185 192 217 V229"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-connectivity)"/><g class="flow-edge-label" data-edge-label="operations:direction-goals:direction-goals-route" tabindex="0" role="group" aria-label="選択肢：辺の向きや、一方通行の道での到達性を扱う"><rect x="69.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="252">辺の向きや、一方通行の道での到達性</text><text text-anchor="middle" x="192" y="270">を扱う</text></g></g><g class="flow-edge static-or-add" data-edge="operations:static-or-add:static-or-add-route"><title>無向の辺は変わらない、または追加するだけ</title><path d="M1204 141 V153 C1204 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-connectivity)"/><g class="flow-edge-label" data-edge-label="operations:static-or-add:static-or-add-route" tabindex="0" role="group" aria-label="選択肢：無向の辺は変わらない、または追加するだけ"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">無向の辺は変わらない、または追加す</text><text text-anchor="middle" x="556" y="270">るだけ</text></g></g><g class="flow-edge remove-or-restore" data-edge="operations:remove-or-restore:remove-or-restore-route"><title>辺を削除する、または過去の版から操作する</title><path d="M1244 141 V153 C1244 185 920 185 920 217 V229"/><path d="M920 285 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-connectivity)"/><g class="flow-edge-label" data-edge-label="operations:remove-or-restore:remove-or-restore-route" tabindex="0" role="group" aria-label="選択肢：辺を削除する、または過去の版から操作する"><rect x="797.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="252">辺を削除する、または過去の版から操</text><text text-anchor="middle" x="920" y="270">作する</text></g></g><g class="flow-edge threshold" data-edge="operations:threshold:threshold-direction"><title>重さの条件を満たす辺だけで、連結性・成分の人数を求める</title><path d="M1284 141 V153 C1284 185 1284 185 1284 217 V229"/><path d="M1284 285 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-connectivity)"/><g class="flow-edge-label" data-edge-label="operations:threshold:threshold-direction" tabindex="0" role="group" aria-label="選択肢：重さの条件を満たす辺だけで、連結性・成分の人数を求める"><rect x="1168" y="229" width="232" height="56" rx="5"/><text text-anchor="middle" x="1284" y="252">重さの条件を満たす辺だけで、連結</text><text text-anchor="middle" x="1284" y="270">性・成分の人数を求める</text></g></g><g class="flow-edge one-mark-cuts" data-edge="operations:one-mark-cuts:marked-components-route"><title>木の辺を切り、各成分の印を一つにする</title><path d="M1324 141 V153 C1324 185 1648 185 1648 217 V229"/><path d="M1648 285 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-connectivity)"/><g class="flow-edge-label" data-edge-label="operations:one-mark-cuts:marked-components-route" tabindex="0" role="group" aria-label="選択肢：木の辺を切り、各成分の印を一つにする"><rect x="1525.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="252">木の辺を切り、各成分の印を一つにす</text><text text-anchor="middle" x="1648" y="270">る</text></g></g><g class="flow-edge forest-path-values" data-edge="operations:forest-path-values:forest-path-values-route"><title>各成分が木のまま辺をつなぎ替え、経路の値を求める</title><path d="M1364 141 V153 C1364 185 2012 185 2012 217 V229"/><path d="M2012 285 V297 C2012 329 2012 329 2012 361 V373" marker-end="url(#arrow-connectivity)"/><g class="flow-edge-label" data-edge-label="operations:forest-path-values:forest-path-values-route" tabindex="0" role="group" aria-label="選択肢：各成分が木のまま辺をつなぎ替え、経路の値を求める"><rect x="1889.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="252">各成分が木のまま辺をつなぎ替え、経</text><text text-anchor="middle" x="2012" y="270">路の値を求める</text></g></g><g class="flow-edge unknown" data-edge="operations:unknown:check"><title>わからない</title><path d="M1404 141 V153 C1404 185 2376 185 2376 217 V229"/><path d="M2376 267 V297 C2376 329 2376 329 2376 361 V373" marker-end="url(#arrow-connectivity)"/><g class="flow-edge-label" data-edge-label="operations:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2331.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="2376" y="252">わからない</text></g></g><g class="flow-node question" data-node="operations"><rect x="1124" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1140" y="52">質問</text><text class="node-title" x="1140" y="80">つながりはどのように変わりますか？</text><text class="node-explanation" x="1140" y="107">追加、削除、過去の版を区別します。</text></g><g class="flow-node route" data-node="direction-goals-route"><rect x="32" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">辺の向きと到達性</text><text class="node-explanation" x="48" y="448">一方向にたどれる辺を調べる場合と、無向辺の向きを</text><text class="node-explanation" x="48" y="466">決める場合を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-direction-goals" data-route="connectivity-direction-goals"><text x="48" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="static-or-add-route"><rect x="396" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">無向辺が変わらない・追加するだけ</text><text class="node-explanation" x="412" y="448">固定したグラフの成分を調べる場合と、辺を追加しな</text><text class="node-explanation" x="412" y="466">がら成分を併合する場合を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-static-or-add" data-route="connectivity-static-or-add"><text x="412" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="remove-or-restore-route"><rect x="760" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">辺の削除と過去の版</text><text class="node-explanation" x="776" y="448">削除だけの操作、追加と削除の混在、過去の版からの</text><text class="node-explanation" x="776" y="466">併合について、処理できる順序を確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-remove-or-restore" data-route="connectivity-remove-or-restore"><text x="776" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="threshold-direction"><rect x="1124" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">重さの条件を満たす辺のつながり</text><text class="node-explanation" x="1140" y="448">使える辺が増える順に問い合わせを処理できるかを確</text><text class="node-explanation" x="1140" y="466">かめます。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-weight-thresholds" data-route="connectivity-weight-thresholds"><text x="1140" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="marked-components-route"><rect x="1488" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">各成分に一つの印を残す木の切断</text><a href="/flowchartcp/flowcharts/#diagram-tree-marked-components" data-route="tree-marked-components"><text x="1504" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="2216" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="2232" y="393">分野</text><text class="node-title" x="2232" y="421">操作と問い合わせの順序を確かめる</text><text class="node-explanation" x="2232" y="448">追加や削除を先に読めるかを確かめ、操作を整理する</text><text class="node-explanation" x="2232" y="466">か、足りない条件を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-operation-order" data-route="connectivity-operation-order"><text x="2232" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="forest-path-values-route"><rect x="1852" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1868" y="393">分野</text><text class="node-title" x="1868" y="421">つなぎ替わる森の経路集計</text><a href="/flowchartcp/flowcharts/#diagram-dynamic-forest-path-values" data-route="dynamic-forest-path-values"><text x="1868" y="458">詳細の質問・図へ →</text></a></g></svg>