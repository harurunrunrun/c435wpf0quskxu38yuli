<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-weighted-integer-quantization-conditions flow-desc-weighted-integer-quantization-conditions" width="748" height="1347" viewBox="0 0 748 1347" data-flow-svg="weighted-integer-quantization-conditions"><title id="flow-title-weighted-integer-quantization-conditions">整数代表値で二乗誤差を小さくするの解法フローチャート</title><desc id="flow-desc-weighted-integer-quantization-conditions">代表値の範囲、誤差の定義、値域を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-weighted-integer-quantization-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="integer-domain:yes:nearest-square"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-weighted-integer-quantization-conditions)"/><g class="flow-edge-label" data-edge-label="integer-domain:yes:nearest-square" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="integer-domain:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V581 C654 613 654 613 654 645 V657 V707 C654 739 654 739 654 771 V783 V945 C654 977 654 977 654 1009 V1021 V1071 C654 1103 624.571 1103 624.571 1135 V1147" marker-end="url(#arrow-weighted-integer-quantization-conditions)"/><g class="flow-edge-label" data-edge-label="integer-domain:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="integer-domain:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V581 C710 613 710 613 710 645 V657 V707 C710 739 710 739 710 771 V783 V945 C710 977 710 977 710 1009 V1021 V1071 C710 1103 670.286 1103 670.286 1135 V1147" marker-end="url(#arrow-weighted-integer-quantization-conditions)"/><g class="flow-edge-label" data-edge-label="integer-domain:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="nearest-square:yes:small-domain"><title>はい</title><path d="M352.5 569 V581 C352.5 613 307 613 307 645 V657"/><path d="M307 695 V707 C307 739 319.5 739 319.5 771 V783" marker-end="url(#arrow-weighted-integer-quantization-conditions)"/><g class="flow-edge-label" data-edge-label="nearest-square:yes:small-domain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="680">はい</text></g></g><g class="flow-edge no" data-edge="nearest-square:no:check"><title>いいえ</title><path d="M432.5 569 V581 C432.5 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 542 739 542 771 V783 V945 C542 977 542 977 542 1009 V1021 V1071 C542 1103 533.143 1103 533.143 1135 V1147" marker-end="url(#arrow-weighted-integer-quantization-conditions)"/><g class="flow-edge-label" data-edge-label="nearest-square:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="nearest-square:unknown:check"><title>わからない</title><path d="M512.5 569 V581 C512.5 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 598 739 598 771 V783 V945 C598 977 598 977 598 1009 V1021 V1071 C598 1103 578.857 1103 578.857 1135 V1147" marker-end="url(#arrow-weighted-integer-quantization-conditions)"/><g class="flow-edge-label" data-edge-label="nearest-square:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="small-domain:yes:answer"><title>はい</title><path d="M239.5 933 V945 C239.5 977 192 977 192 1009 V1021"/><path d="M192 1059 V1071 C192 1103 192 1103 192 1135 V1147" marker-end="url(#arrow-weighted-integer-quantization-conditions)"/><g class="flow-edge-label" data-edge-label="small-domain:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1044">はい</text></g></g><g class="flow-edge no" data-edge="small-domain:no:check"><title>いいえ</title><path d="M319.5 933 V945 C319.5 977 319 977 319 1009 V1021"/><path d="M319 1059 V1071 C319 1103 441.714 1103 441.714 1135 V1147" marker-end="url(#arrow-weighted-integer-quantization-conditions)"/><g class="flow-edge-label" data-edge-label="small-domain:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1044">いいえ</text></g></g><g class="flow-edge unknown" data-edge="small-domain:unknown:check"><title>わからない</title><path d="M399.5 933 V945 C399.5 977 447.5 977 447.5 1009 V1021"/><path d="M447.5 1059 V1071 C447.5 1103 487.429 1103 487.429 1135 V1147" marker-end="url(#arrow-weighted-integer-quantization-conditions)"/><g class="flow-edge-label" data-edge-label="small-domain:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1021" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1044">わからない</text></g></g><g class="flow-node question" data-node="integer-domain"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">値も選ぶ代表値も、小さな一次元整数</text><text class="node-title" x="400.5" y="103">の範囲にありますか？</text><text class="node-explanation" x="400.5" y="130">掲載実装は値0..255と非負頻度を扱います。代</text><text class="node-explanation" x="400.5" y="148">表値は入力で現れた値だけに限定しません。</text></g><g class="flow-node question" data-node="nearest-square"><rect x="272.5" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">各値を最寄りの代表値へ置き換え、頻</text><text class="node-title" x="288.5" y="467">度を掛けた二乗誤差を最小化します</text><text class="node-title" x="288.5" y="490">か？</text><text class="node-explanation" x="288.5" y="517">絶対値誤差なら中央値ですが、二乗誤差では重み付き</text><text class="node-explanation" x="288.5" y="535">平均の前後の整数を使います。</text></g><g class="flow-node question" data-node="small-domain"><rect x="159.5" y="783" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="803">質問</text><text class="node-title" x="175.5" y="831">高々K個の代表で分ける全ての連続区</text><text class="node-title" x="175.5" y="854">間と、切れ目を処理できますか？</text><text class="node-explanation" x="175.5" y="881">掲載実装は最大256値。頻度0は除き、正頻度があ</text><text class="node-explanation" x="175.5" y="899">る場合には代表数1以上が必要です。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1147" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1167">候補</text><text class="node-title" x="48" y="1195">代表値ごとに連続区間へ分け、重み付</text><text class="node-title" x="48" y="1218">き平均の床と天井で区間費用を求める</text><a href="/flowchartcp/techniques/weighted-squared-quantization-interval-dp/"><title>重み付きの二乗誤差をK個の整数代表値へまとめるなら、平均の前後を区間DPで選ぶの記事へ</title><text x="48" y="1257">重み付きの二乗誤差をK個の整数代表値へまとめる</text><text x="48" y="1275">なら、平均の前後を区間DPで選ぶ</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1147" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1167">分野</text><text class="node-title" x="412" y="1195">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1232">詳細の質問・図へ →</text></a></g></svg>