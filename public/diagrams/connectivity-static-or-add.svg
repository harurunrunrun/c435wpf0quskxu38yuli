<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-connectivity-static-or-add flow-desc-connectivity-static-or-add" width="1840" height="562" viewBox="0 0 1840 562" data-flow-svg="connectivity-static-or-add"><title id="flow-title-connectivity-static-or-add">無向辺が変わらない・追加するだけの解法フローチャート</title><desc id="flow-desc-connectivity-static-or-add">固定したグラフの成分を調べる場合と、辺を追加しながら成分を併合する場合を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-connectivity-static-or-add" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge static" data-edge="operations:static:components"><title>無向の辺は変わらない</title><path d="M813.333 141 V153 C813.333 185 192 185 192 217 V229"/><path d="M192 267 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-connectivity-static-or-add)"/><g class="flow-edge-label" data-edge-label="operations:static:components" tabindex="0" role="group" aria-label="選択肢：無向の辺は変わらない"><rect x="115" y="229" width="154" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">無向の辺は変わらない</text></g></g><g class="flow-edge add" data-edge="operations:add:dsu"><title>無向の辺を追加するだけ</title><path d="M866.667 141 V153 C866.667 185 556 185 556 217 V229"/><path d="M556 267 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-connectivity-static-or-add)"/><g class="flow-edge-label" data-edge-label="operations:add:dsu" tabindex="0" role="group" aria-label="選択肢：無向の辺を追加するだけ"><rect x="472.5" y="229" width="167" height="38" rx="5"/><text text-anchor="middle" x="556" y="252">無向の辺を追加するだけ</text></g></g><g class="flow-edge complement" data-edge="operations:complement:complement-route"><title>存在しない辺だけが与えられ、それ以外の頂点対には全て辺がある</title><path d="M920 141 V153 C920 185 920 185 920 217 V229"/><path d="M920 285 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-connectivity-static-or-add)"/><g class="flow-edge-label" data-edge-label="operations:complement:complement-route" tabindex="0" role="group" aria-label="選択肢：存在しない辺だけが与えられ、それ以外の頂点対には全て辺がある"><rect x="797.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="252">存在しない辺だけが与えられ、それ以</text><text text-anchor="middle" x="920" y="270">外の頂点対には全て辺がある</text></g></g><g class="flow-edge bipartite-additions" data-edge="operations:bipartite-additions:bipartite-additions-route"><title>一本の辺を加えた後も二色に塗り分けられる頂点対の個数</title><path d="M973.333 141 V153 C973.333 185 1284 185 1284 217 V229"/><path d="M1284 285 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-connectivity-static-or-add)"/><g class="flow-edge-label" data-edge-label="operations:bipartite-additions:bipartite-additions-route" tabindex="0" role="group" aria-label="選択肢：一本の辺を加えた後も二色に塗り分けられる頂点対の個数"><rect x="1161.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="252">一本の辺を加えた後も二色に塗り分け</text><text text-anchor="middle" x="1284" y="270">られる頂点対の個数</text></g></g><g class="flow-edge unknown" data-edge="operations:unknown:check"><title>わからない</title><path d="M1026.667 141 V153 C1026.667 185 1648 185 1648 217 V229"/><path d="M1648 267 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-connectivity-static-or-add)"/><g class="flow-edge-label" data-edge-label="operations:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1603.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1648" y="252">わからない</text></g></g><g class="flow-node question" data-node="operations"><rect x="760" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="776" y="52">質問</text><text class="node-title" x="776" y="80">つながりはどのように変わりますか？</text><text class="node-explanation" x="776" y="107">追加、削除、過去の版を区別します。</text></g><g class="flow-node result" data-node="components"><rect x="32" y="373" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="393">候補</text><text class="node-title" x="48" y="421">連結成分を分類する</text><a href="/flowchartcp/techniques/bfs/"><title>幅優先探索の記事へ</title><text x="48" y="460">幅優先探索</text></a><a href="/flowchartcp/techniques/union-find/"><title>Union-Findの記事へ</title><text x="48" y="484">Union-Find</text></a></g><g class="flow-node result" data-node="dsu"><rect x="396" y="373" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="393">候補</text><text class="node-title" x="412" y="421">Union-Find</text><a href="/flowchartcp/techniques/union-find/"><title>Union-Findの記事へ</title><text x="412" y="460">Union-Find</text></a></g><g class="flow-node route" data-node="check"><rect x="1488" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">操作と問い合わせの順序を確かめる</text><text class="node-explanation" x="1504" y="448">追加や削除を先に読めるかを確かめ、操作を整理する</text><text class="node-explanation" x="1504" y="466">か、足りない条件を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-operation-order" data-route="connectivity-operation-order"><text x="1504" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="complement-route"><rect x="760" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">存在しない辺だけが与えられ、それ以</text><text class="node-title" x="776" y="444">外の頂点対には全て辺がある</text><a href="/flowchartcp/flowcharts/#diagram-graph-complement-components" data-route="graph-complement-components"><text x="776" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="bipartite-additions-route"><rect x="1124" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">一本の辺を加えた後も二色に塗り分け</text><text class="node-title" x="1140" y="444">られる頂点対の個数</text><a href="/flowchartcp/flowcharts/#diagram-bipartite-addition-conditions" data-route="bipartite-addition-conditions"><text x="1140" y="481">詳細の質問・図へ 