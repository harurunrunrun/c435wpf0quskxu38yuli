<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-adjacent-merge-cost flow-desc-adjacent-merge-cost" width="860" height="1391" viewBox="0 0 860 1391" data-flow-svg="adjacent-merge-cost"><title id="flow-title-adjacent-merge-cost">隣接した塊の併合費用の解法フローチャート</title><desc id="flow-desc-adjacent-merge-cost">区間内の重さの合計を費用に持つ、最後の併合位置を探します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-adjacent-merge-cost" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="adjacent:yes:nonnegative"><title>はい</title><path d="M539.722 182 V194 C539.722 226 420.667 226 420.667 258 V270"/><path d="M420.667 308 V320 C420.667 352 420.667 352 420.667 384 V396" marker-end="url(#arrow-adjacent-merge-cost)"/><g class="flow-edge-label" data-edge-label="adjacent:yes:nonnegative" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="adjacent:no:fallback"><title>いいえ</title><path d="M619.722 182 V194 C619.722 226 655 226 655 258 V270"/><path d="M655 308 V320 C655 352 762.5 352 762.5 384 V396 V576 C762.5 608 762.5 608 762.5 640 V652 V702 C762.5 734 458 734 458 766 V778 V1006 C458 1038 360 1038 360 1070 V1082 V1132 C360 1164 304 1164 304 1196 V1208" marker-end="url(#arrow-adjacent-merge-cost)"/><g class="flow-edge-label" data-edge-label="adjacent:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="adjacent:unknown:check"><title>わからない</title><path d="M699.722 182 V194 C699.722 226 783.5 226 783.5 258 V270"/><path d="M783.5 308 V320 C783.5 352 818.5 352 818.5 384 V396 V576 C818.5 608 818.5 608 818.5 640 V652 V702 C818.5 734 721.333 734 721.333 766 V778" marker-end="url(#arrow-adjacent-merge-cost)"/><g class="flow-edge-label" data-edge-label="adjacent:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="nonnegative:yes:merge-result"><title>はい</title><path d="M340.667 564 V576 C340.667 608 192 608 192 640 V652"/><path d="M192 690 V702 C192 734 192 734 192 766 V778" marker-end="url(#arrow-adjacent-merge-cost)"/><g class="flow-edge-label" data-edge-label="nonnegative:yes:merge-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="675">はい</text></g></g><g class="flow-edge no" data-edge="nonnegative:no:fallback"><title>いいえ</title><path d="M420.667 564 V576 C420.667 608 402 608 402 640 V652"/><path d="M402 690 V702 C402 734 402 734 402 766 V778 V1006 C402 1038 304 1038 304 1070 V1082 V1132 C304 1164 224 1164 224 1196 V1208" marker-end="url(#arrow-adjacent-merge-cost)"/><g class="flow-edge-label" data-edge-label="nonnegative:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="nonnegative:unknown:check"><title>わからない</title><path d="M500.667 564 V576 C500.667 608 668 608 668 640 V652"/><path d="M668 690 V702 C668 734 614.667 734 614.667 766 V778" marker-end="url(#arrow-adjacent-merge-cost)"/><g class="flow-edge-label" data-edge-label="nonnegative:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 928 V1006 C588 1038 450 1038 450 1070 V1082"/><path d="M450 1120 V1132 C450 1164 384 1164 384 1196 V1208" marker-end="url(#arrow-adjacent-merge-cost)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1082" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1105">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 928 V1006 C668 1038 655 1038 655 1070 V1082"/><path d="M655 1120 V1132 C655 1164 614.667 1164 614.667 1196 V1208" marker-end="url(#arrow-adjacent-merge-cost)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1082" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1105">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 928 V1006 C748 1038 783.5 1038 783.5 1070 V1082"/><path d="M783.5 1120 V1132 C783.5 1164 721.333 1164 721.333 1196 V1208" marker-end="url(#arrow-adjacent-merge-cost)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1082" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1105">わからない</text></g></g><g class="flow-node question" data-node="adjacent"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">併合は隣接する二塊だけで、費用は併</text><text class="node-title" x="475.7222222222223" y="103">合後の重さの合計ですか？</text><text class="node-explanation" x="475.7222222222223" y="130">最後の併合で区間を左右に分けます。区間の重さの合</text><text class="node-explanation" x="475.7222222222223" y="148">計は、どの位置で分けても同じ追加費用になります。</text></g><g class="flow-node question" data-node="nonnegative"><rect x="260.6666666666667" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">各重さは非負で、区間が広がると重さ</text><text class="node-title" x="276.6666666666667" y="467">の合計が減らないことを示せますか？</text><text class="node-explanation" x="276.6666666666667" y="494">区間和は四点の費用の不等式を満たし、非負なら包含</text><text class="node-explanation" x="276.6666666666667" y="512">に対しても単調です。この二条件から、最適位置を隣</text><text class="node-explanation" x="276.6666666666667" y="530">の短い区間の最適位置で挟めます。</text></g><g class="flow-node result" data-node="merge-result"><rect x="32" y="778" width="320" height="216" rx="7"/><text class="node-kind" x="48" y="798">候補</text><text class="node-title" x="48" y="826">隣の区間の最適位置の間だけを探し、</text><text class="node-title" x="48" y="849">併合費用を求める</text><a href="/flowchartcp/techniques/knuth-adjacent-merges/"><title>隣接区間の併合費用が非負の和なら、最適な切れ目を両隣から挟むの記事へ</title><text x="48" y="888">隣接区間の併合費用が非負の和なら、最適な切れ目</text><text x="48" y="906">を両隣から挟む</text></a><a href="/flowchartcp/techniques/knuth-optimization/"><title>Knuth最適化の記事へ</title><text x="48" y="930">Knuth最適化</text></a><a href="/flowchartcp/techniques/interval-dp/"><title>区間DPの記事へ</title><text x="48" y="954">区間DP</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="798">質問</text><text class="node-title" x="524" y="826">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="849">確認できますか？</text><text class="node-explanation" x="524" y="876">何を一つの状態にし、何を別の答えとして数えるか、</text><text class="node-explanation" x="524" y="894">制約で列挙が間に合うかを確かめます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1208" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1228">候補</text><text class="node-title" x="160" y="1256">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1295">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1319">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1208" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1228">分野</text><text class="node-title" x="524" y="1256">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1293">詳細の質問・図へ →</text></a></g></svg>