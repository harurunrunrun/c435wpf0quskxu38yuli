<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-heuristic-schedule flow-desc-heuristic-schedule" width="1224" height="1385" viewBox="0 0 1224 1385" data-flow-svg="heuristic-schedule"><title id="flow-title-heuristic-schedule">開催日程の間隔費用と変更の解法フローチャート</title><desc id="flow-desc-heuristic-schedule">一日の変更を、開催日の前後関係の変更へ分解します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-heuristic-schedule" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge one-day" data-edge="operation:one-day:schedule-gap"><title>一日の開催種類を変え、合計得点を出す</title><path d="M759.611 159 V171 C759.611 203 434.833 203 434.833 235 V247"/><path d="M434.833 303 V315 C434.833 347 434.833 347 434.833 379 V391" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="operation:one-day:schedule-gap" tabindex="0" role="group" aria-label="選択肢：一日の開催種類を変え、合計得点を出す"><rect x="312.3333333333333" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="434.8333333333333" y="270">一日の開催種類を変え、合計得点を出</text><text text-anchor="middle" x="434.8333333333333" y="288">す</text></g></g><g class="flow-edge swap-days" data-edge="operation:swap-days:schedule-swap-sequential"><title>二日の開催種類を交換し、受理か取消か決める</title><path d="M839.611 159 V171 C839.611 203 936.5 203 936.5 235 V247"/><path d="M936.5 303 V315 C936.5 347 964.5 347 964.5 379 V391" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="operation:swap-days:schedule-swap-sequential" tabindex="0" role="group" aria-label="選択肢：二日の開催種類を交換し、受理か取消か決める"><rect x="814" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="936.5" y="270">二日の開催種類を交換し、受理か取消</text><text text-anchor="middle" x="936.5" y="288">か決める</text></g></g><g class="flow-edge unknown" data-edge="operation:unknown:check"><title>わからない</title><path d="M919.611 159 V171 C919.611 203 1147.5 203 1147.5 235 V247"/><path d="M1147.5 285 V315 C1147.5 347 1186 347 1186 379 V391 V594 C1186 626 1186 626 1186 658 V670 V720 C1186 752 1112 752 1112 784 V796" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="operation:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1103" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1147.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="schedule-gap:yes:schedule-delta-result"><title>はい</title><path d="M354.833 582 V594 C354.833 626 192 626 192 658 V670"/><path d="M192 708 V720 C192 752 192 752 192 784 V796" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="schedule-gap:yes:schedule-delta-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="693">はい</text></g></g><g class="flow-edge no" data-edge="schedule-gap:no:fallback"><title>いいえ</title><path d="M434.833 582 V594 C434.833 626 402 626 402 658 V670"/><path d="M402 708 V720 C402 752 402 752 402 784 V796 V1000 C402 1032 668 1032 668 1064 V1076 V1126 C668 1158 588 1158 588 1190 V1202" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="schedule-gap:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="schedule-gap:unknown:check"><title>わからない</title><path d="M514.833 582 V594 C514.833 626 710.5 626 710.5 658 V670"/><path d="M710.5 708 V720 C710.5 752 952 752 952 784 V796" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="schedule-gap:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="666" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="710.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="schedule-swap-sequential:yes:schedule-swap-result"><title>はい</title><path d="M884.5 559 V594 C884.5 626 839 626 839 658 V670"/><path d="M839 708 V720 C839 752 612 752 612 784 V796" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="schedule-swap-sequential:yes:schedule-swap-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="799" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="839" y="693">はい</text></g></g><g class="flow-edge no" data-edge="schedule-swap-sequential:no:fallback"><title>いいえ</title><path d="M964.5 559 V594 C964.5 626 963 626 963 658 V670"/><path d="M963 708 V720 C963 752 822 752 822 784 V796 V1000 C822 1032 724 1032 724 1064 V1076 V1126 C724 1158 668 1158 668 1190 V1202" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="schedule-swap-sequential:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="schedule-swap-sequential:unknown:check"><title>わからない</title><path d="M1044.5 559 V594 C1044.5 626 1091.5 626 1091.5 658 V670"/><path d="M1091.5 708 V720 C1091.5 752 1032 752 1032 784 V796" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="schedule-swap-sequential:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M952 946 V1000 C952 1032 814 1032 814 1064 V1076"/><path d="M814 1114 V1126 C814 1158 748 1158 748 1190 V1202" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="774" y="1076" width="80" height="38" rx="5"/><text text-anchor="middle" x="814" y="1099">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1032 946 V1000 C1032 1032 1019 1032 1019 1064 V1076"/><path d="M1019 1114 V1126 C1019 1158 978.667 1158 978.667 1190 V1202" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="979" y="1076" width="80" height="38" rx="5"/><text text-anchor="middle" x="1019" y="1099">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1112 946 V1000 C1112 1032 1147.5 1032 1147.5 1064 V1076"/><path d="M1147.5 1114 V1126 C1147.5 1158 1085.333 1158 1085.333 1190 V1202" marker-end="url(#arrow-heuristic-schedule)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1103" y="1076" width="89" height="38" rx="5"/><text text-anchor="middle" x="1147.5" y="1099">わからない</text></g></g><g class="flow-node question" data-node="operation"><rect x="679.611111111111" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="695.611111111111" y="52">質問</text><text class="node-title" x="695.611111111111" y="80">開催日程へどの変更を行いますか？</text><text class="node-explanation" x="695.611111111111" y="107">一日変更は正確な質問処理にも使え、二日交換は局所</text><text class="node-explanation" x="695.611111111111" y="125">探索の試行にも使えます。</text></g><g class="flow-node question" data-node="schedule-gap"><rect x="274.8333333333333" y="391" width="320" height="191" rx="7"/><text class="node-kind" x="290.8333333333333" y="411">質問</text><text class="node-title" x="290.8333333333333" y="439">減点は種類別の固定係数×前回からの</text><text class="node-title" x="290.8333333333333" y="462">日数で、開催間隔ごとにまとめられま</text><text class="node-title" x="290.8333333333333" y="485">すか？</text><text class="node-explanation" x="290.8333333333333" y="512">種類ごとの係数は変わりません。開催日を並べ、変更</text><text class="node-explanation" x="290.8333333333333" y="530">日を外す・入れるときの前後の間隔だけを更新しま</text><text class="node-explanation" x="290.8333333333333" y="548">す。</text></g><g class="flow-node result" data-node="schedule-delta-result"><rect x="32" y="796" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="816">候補</text><text class="node-title" x="48" y="844">前後の開催日の間隔を分割・併合し、</text><text class="node-title" x="48" y="867">一日変更の得点差を取る</text><a href="/flowchartcp/techniques/heuristic-schedule-gap-delta/"><title>開催日の変更は、前後の間隔を分ける積だけで減点差を求めるの記事へ</title><text x="48" y="906">開催日の変更は、前後の間隔を分ける積だけで減点</text><text x="48" y="924">差を求める</text></a></g><g class="flow-node question" data-node="schedule-swap-sequential"><rect x="804.5" y="391" width="320" height="168" rx="7"/><text class="node-kind" x="820.5" y="411">質問</text><text class="node-title" x="820.5" y="439">一つ目の変更を反映してから二つ目を</text><text class="node-title" x="820.5" y="462">評価し、取消は逆順に戻せますか？</text><text class="node-explanation" x="820.5" y="489">二つの変更は互いの前後間隔を変えます。初期状態で</text><text class="node-explanation" x="820.5" y="507">二つの差を別に求めて足すだけでは正しい差になりま</text><text class="node-explanation" x="820.5" y="525">せん。</text></g><g class="flow-node result" data-node="schedule-swap-result"><rect x="452" y="796" width="320" height="192" rx="7"/><text class="node-kind" x="468" y="816">候補</text><text class="node-title" x="468" y="844">二つの変更を順に適用し、拒否時は逆</text><text class="node-title" x="468" y="867">順に取り消す</text><a href="/flowchartcp/techniques/heuristic-schedule-swap-transaction/"><title>二日間の交換は、一つ目を反映してから二つ目の差を計算するの記事へ</title><text x="468" y="906">二日間の交換は、一つ目を反映してから二つ目の差</text><text x="468" y="924">を計算する</text></a><a href="/flowchartcp/techniques/local-search/"><title>局所探索の記事へ</title><text x="468" y="948">局所探索</text></a></g><g class="flow-node question" data-node="check"><rect x="872" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="888" y="816">質問</text><text class="node-title" x="888" y="844">得点の式、合法性、固定する部分と変</text><text class="node-title" x="888" y="867">更する部分を確認できますか？</text><text class="node-explanation" x="888" y="894">差分評価が正しくても、その候補が合法であるとは限</text><text class="node-explanation" x="888" y="912">りません。必要な制約を別に検査します。</text></g><g class="flow-node result" data-node="fallback"><rect x="508" y="1202" width="320" height="151" rx="7"/><text class="node-kind" x="524" y="1222">候補</text><text class="node-title" x="524" y="1250">評価と合法性を小さい変更で確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="524" y="1289">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="524" y="1313">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="872" y="1202" width="320" height="121" rx="7"/><text class="node-kind" x="888" y="1222">分野</text><text class="node-title" x="888" y="1250">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="888" y="1287">詳細の質問・図へ →</text></a></g></svg>