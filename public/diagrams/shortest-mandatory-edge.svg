<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-shortest-mandatory-edge flow-desc-shortest-mandatory-edge" width="748" height="1301" viewBox="0 0 748 1301" data-flow-svg="shortest-mandatory-edge"><title id="flow-title-shortest-mandatory-edge">全最短路の必須辺と、一辺の減少量の解法フローチャート</title><desc id="flow-desc-shortest-mandatory-edge">正の重み、固定した両端、変更を独立に試すことを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-shortest-mandatory-edge" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="positive:yes:fixed-endpoints"><title>はい</title><path d="M464.5 159 V171 C464.5 203 419 203 419 235 V247"/><path d="M419 285 V297 C419 329 432.5 329 432.5 361 V373" marker-end="url(#arrow-shortest-mandatory-edge)"/><g class="flow-edge-label" data-edge-label="positive:yes:fixed-endpoints" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="247" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="270">はい</text></g></g><g class="flow-edge no" data-edge="positive:no:check"><title>いいえ</title><path d="M544.5 159 V171 C544.5 203 543 203 543 235 V247"/><path d="M543 285 V297 C543 329 654 329 654 361 V373 V535 C654 567 654 567 654 599 V611 V661 C654 693 654 693 654 725 V737 V899 C654 931 654 931 654 963 V975 V1025 C654 1057 624.571 1057 624.571 1089 V1101" marker-end="url(#arrow-shortest-mandatory-edge)"/><g class="flow-edge-label" data-edge-label="positive:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="247" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="270">いいえ</text></g></g><g class="flow-edge unknown" data-edge="positive:unknown:check"><title>わからない</title><path d="M624.5 159 V171 C624.5 203 671.5 203 671.5 235 V247"/><path d="M671.5 285 V297 C671.5 329 710 329 710 361 V373 V535 C710 567 710 567 710 599 V611 V661 C710 693 710 693 710 725 V737 V899 C710 931 710 931 710 963 V975 V1025 C710 1057 670.286 1057 670.286 1089 V1101" marker-end="url(#arrow-shortest-mandatory-edge)"/><g class="flow-edge-label" data-edge-label="positive:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="fixed-endpoints:yes:independent"><title>はい</title><path d="M352.5 523 V535 C352.5 567 307 567 307 599 V611"/><path d="M307 649 V661 C307 693 319.5 693 319.5 725 V737" marker-end="url(#arrow-shortest-mandatory-edge)"/><g class="flow-edge-label" data-edge-label="fixed-endpoints:yes:independent" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="634">はい</text></g></g><g class="flow-edge no" data-edge="fixed-endpoints:no:check"><title>いいえ</title><path d="M432.5 523 V535 C432.5 567 431 567 431 599 V611"/><path d="M431 649 V661 C431 693 542 693 542 725 V737 V899 C542 931 542 931 542 963 V975 V1025 C542 1057 533.143 1057 533.143 1089 V1101" marker-end="url(#arrow-shortest-mandatory-edge)"/><g class="flow-edge-label" data-edge-label="fixed-endpoints:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed-endpoints:unknown:check"><title>わからない</title><path d="M512.5 523 V535 C512.5 567 559.5 567 559.5 599 V611"/><path d="M559.5 649 V661 C559.5 693 598 693 598 725 V737 V899 C598 931 598 931 598 963 V975 V1025 C598 1057 578.857 1057 578.857 1089 V1101" marker-end="url(#arrow-shortest-mandatory-edge)"/><g class="flow-edge-label" data-edge-label="fixed-endpoints:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="634">わからない</text></g></g><g class="flow-edge yes" data-edge="independent:yes:answer"><title>はい</title><path d="M239.5 887 V899 C239.5 931 192 931 192 963 V975"/><path d="M192 1013 V1025 C192 1057 192 1057 192 1089 V1101" marker-end="url(#arrow-shortest-mandatory-edge)"/><g class="flow-edge-label" data-edge-label="independent:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="975" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="998">はい</text></g></g><g class="flow-edge no" data-edge="independent:no:check"><title>いいえ</title><path d="M319.5 887 V899 C319.5 931 319 931 319 963 V975"/><path d="M319 1013 V1025 C319 1057 441.714 1057 441.714 1089 V1101" marker-end="url(#arrow-shortest-mandatory-edge)"/><g class="flow-edge-label" data-edge-label="independent:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="975" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="998">いいえ</text></g></g><g class="flow-edge unknown" data-edge="independent:unknown:check"><title>わからない</title><path d="M399.5 887 V899 C399.5 931 447.5 931 447.5 963 V975"/><path d="M447.5 1013 V1025 C447.5 1057 487.429 1057 487.429 1089 V1101" marker-end="url(#arrow-shortest-mandatory-edge)"/><g class="flow-edge-label" data-edge-label="independent:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="975" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="998">わからない</text></g></g><g class="flow-node question" data-node="positive"><rect x="384.5" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">全ての辺の費用は正の整数ですか？</text><text class="node-explanation" x="400.5" y="107">0重みの閉路がある場合、有向の必須辺を無向の橋に</text><text class="node-explanation" x="400.5" y="125">置き換える証明を使えません。</text></g><g class="flow-node question" data-node="fixed-endpoints"><rect x="272.5" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="393">質問</text><text class="node-title" x="288.5" y="421">始点と終点を固定し、最短路に使える</text><text class="node-title" x="288.5" y="444">辺だけを残せますか？</text><text class="node-explanation" x="288.5" y="471">始点からの距離と終点への距離を求め、両側が到達可</text><text class="node-explanation" x="288.5" y="489">能で距離の等式を満たす辺だけ残します。</text></g><g class="flow-node question" data-node="independent"><rect x="159.5" y="737" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="757">質問</text><text class="node-title" x="175.5" y="785">必須性や重みの変更を、元のグラフの</text><text class="node-title" x="175.5" y="808">各辺について独立に調べますか？</text><text class="node-explanation" x="175.5" y="835">複数辺を同時に軽くする場合、元の距離から一辺分を</text><text class="node-explanation" x="175.5" y="853">引くだけでは判定できません。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1101" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1121">候補</text><text class="node-title" x="48" y="1149">最短路に使える辺だけの無向の橋を求</text><text class="node-title" x="48" y="1172">める</text><a href="/flowchartcp/techniques/shortest-edge-mandatory-tight-bridges/"><title>全最短路に共通する辺は、最短路に使える辺だけ残して橋を調べるの記事へ</title><text x="48" y="1211">全最短路に共通する辺は、最短路に使える辺だけ残</text><text x="48" y="1229">して橋を調べる</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1101" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1121">分野</text><text class="node-title" x="412" y="1149">前提と、求める対象を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1186">詳細の質問・図へ →</text></a></g></svg>