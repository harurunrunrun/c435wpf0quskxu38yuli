nd="url(#arrow-geometry-enclosing-regions)"/><g class="flow-edge-label" data-edge-label="lattice-boundary:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1392.2592592592591" y="975" width="89" height="38" rx="5"/><text text-anchor="middle" x="1436.7592592592591" y="998">わからない</text></g></g><g class="flow-node question" data-node="geometry-task"><rect x="1090.857142857143" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1106.857142857143" y="52">質問</text><text class="node-title" x="1106.857142857143" y="80">点や座標から何を求めますか？</text><text class="node-explanation" x="1106.857142857143" y="107">長方形の集計と、外周や距離の問題を分けます。</text></g><g class="flow-node question" data-node="check"><rect x="1276.7592592592591" y="1101" width="320" height="150" rx="7"/><text class="node-kind" x="1292.7592592592591" y="1121">質問</text><text class="node-title" x="1292.7592592592591" y="1149">小さい座標で、共線・同一点・境界上</text><text class="node-title" x="1292.7592592592591" y="1172">の場合を列挙できますか？</text><text class="node-explanation" x="1292.7592592592591" y="1199">一般位置を仮定する前に、入力の制約で保証されてい</text><text class="node-explanation" x="1292.7592592592591" y="1217">るかを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1358.0833333333333" y="1483" width="320" height="139" rx="7"/><text class="node-kind" x="1374.0833333333333" y="1503">分野</text><text class="node-title" x="1374.0833333333333" y="1531">条件を確かめる</text><text class="node-explanation" x="1374.0833333333333" y="1558">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1374.0833333333333" y="1586">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="hull-result"><rect x="32" y="373" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="393">候補</text><text class="node-title" x="48" y="421">凸包に対象を絞る</text><a href="/flowchartcp/techniques/convex-hull/"><title>凸包の記事へ</title><text x="48" y="460">凸包</text></a></g><g class="flow-node result" data-node="fallback"><rect x="839.611111111111" y="1483" width="320" height="151" rx="7"/><text class="node-kind" x="855.611111111111" y="1503">候補</text><text class="node-title" x="855.611111111111" y="1531">境界ケースから条件を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="855.611111111111" y="1570">反例探し</text></a><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="855.611111111111" y="1594">小さい入力で全探索する</text></a></g><g class="flow-node question" data-node="lattice-simple"><rect x="396" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="393">質問</text><text class="node-title" x="412" y="421">頂点は整数座標で、辺が自己交差しな</text><text class="node-title" x="412" y="444">い一つの多角形ですか？</text><text class="node-explanation" x="412" y="471">穴や自己交差を含む図形へ、同じ内部格子点の式をそ</text><text class="node-explanation" x="412" y="489">のまま使わないようにします。</text></g><g class="flow-node question" data-node="lattice-boundary"><rect x="837.4567901234567" y="737" width="320" height="150" rx="7"/><text class="node-kind" x="853.4567901234567" y="757">質問</text><text class="node-title" x="853.4567901234567" y="785">辺上の格子点数を、座標差の gcd</text><text class="node-title" x="853.4567901234567" y="808"> から重複なく数えられますか？</text><text class="node-explanation" x="853.4567901234567" y="835">辺ごとに gcd(|dx|,|dy|) を足し、</text><text class="node-explanation" x="853.4567901234567" y="853">頂点を二度数えない規約にします。</text></g><g class="flow-node result" data-node="lattice-result"><rect x="396" y="1101" width="320" height="168" rx="7"/><text class="node-kind" x="412" y="1121">候補</text><text class="node-title" x="412" y="1149">外積の面積と、辺の座標差の公約数か</text><text class="node-title" x="412" y="1172">ら内部点数を求める</text><a href="/flowchartcp/techniques/lattice-pick-area/"><title>格子多角形の内点数を面積と辺上の GCD から求めるの記事へ</title><text x="412" y="1211">格子多角形の内点数を面積と辺上の GCD から</text><text x="412" y="1229">求める</text></a></g><g class="flow-node route" data-node="width-route"><rect x="760" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">平行壁の最小幅</text><a href="/flowchartcp/flowcharts/#diagram-geometry-width" data-route="geometry-width"><text x="776" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="region-sum-route"><rect x="1124" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">凸領域の各一点の和</text><a href="/flowchartcp/flowcharts/#diagram-geometry-region-sum" data-route="geometry-region-sum"><text x="1140" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="area-cut-route"><rect x="1488" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">弦で切る面積</text><a href="/flowchartcp/flowcharts/#diagram-geometry-area-cut" data-route="geometry-area-cut"><text x="1504" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="point-set-shapes-route"><rect x="1852" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="393">分野</text><text class="node-title" x="1868" y="421">点集合で作る図形・形の一致・円・壁</text><text class="node-title" x="1868" y="444">の領域・繰り返し移動</text><a href="/flowchartcp/flowcharts/#diagram-point-set-shape-features" data-route="point-set-shape-features"><text x="1868" y="481">詳細の質問・図へ →</text></a></g></svg>