<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-geometry-enclosing-regions flow-desc-geometry-enclosing-regions" width="2260" height="1666" viewBox="0 0 2260 1666" data-flow-svg="geometry-enclosing-regions"><title id="flow-title-geometry-enclosing-regions">図形・点集合の形・面積・比較の解法フローチャート</title><desc id="flow-desc-geometry-enclosing-regions">外周、最小幅、格子点、面積、点集合や領域の形を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-geometry-enclosing-regions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge hull" data-edge="geometry-task:hull:hull-result"><title>すべての点を囲む外周の頂点</title><path d="M1130.857 141 V153 C1130.857 185 192 185 192 217 V229"/><path d="M192 267 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-geometry-enclosing-regions)"/><g class="flow-edge-label" data-edge-label="geometry-task:hull:hull-result" tabindex="0" role="group" aria-label="選択肢：すべての点を囲む外周の頂点"><rect x="95.5" y="229" width="193" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">すべての点を囲む外周の頂点</text></g></g><g class="flow-edge lattice-area" data-edge="geometry-task:lattice-area:lattice-simple"><title>格子点を頂点とする多角形の、内部・境界の格子点数</title><path d="M1170.857 141 V153 C1170.857 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-geometry-enclosing-regions)"/><g class="flow-edge-label" data-edge-label="geometry-task:lattice-area:lattice-simple" tabindex="0" role="group" aria-label="選択肢：格子点を頂点とする多角形の、内部・境界の格子点数"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">格子点を頂点とする多角形の、内部・</text><text text-anchor="middle" x="556" y="270">境界の格子点数</text></g></g><g class="flow-edge width" data-edge="geometry-task:width:width-route"><title>全点を平行な壁へ収める最小幅</title><path d="M1210.857 141 V153 C1210.857 185 920 185 920 217