<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-translated-convex-halfplane-max flow-desc-translated-convex-halfplane-max" width="1112" height="1786" viewBox="0 0 1112 1786" data-flow-svg="translated-convex-halfplane-max"><title id="flow-title-translated-convex-halfplane-max">同じ凸多角形を何度も平行移動した共通部分は、辺ごとの最も厳しい条件だけ残すの解法フローチャート</title><desc id="flow-desc-translated-convex-halfplane-max">凸性、移動が平行移動だけか、共通部分か和集合か、境界を含むかを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-translated-convex-halfplane-max" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge same-convex" data-edge="model:same-convex:assumptions"><title>同じ凸多角形を平行移動した全てに、各質問点が入るかを調べる</title><path d="M725 182 V194 C725 226 548.5 226 548.5 258 V270"/><path d="M548.5 326 V338 C548.5 370 746.111 370 746.111 402 V414" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="model:same-convex:assumptions" tabindex="0" role="group" aria-label="選択肢：同じ凸多角形を平行移動した全てに、各質問点が入るかを調べる"><rect x="426" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="548.5" y="293">同じ凸多角形を平行移動した全てに、</text><text text-anchor="middle" x="548.5" y="311">各質問点が入るかを調べる</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>多角形が非凸、または移動ごとに回転・拡大縮小も行う</title><path d="M805 182 V194 C805 226 831 226 831 258 V270"/><path d="M831 326 V338 C831 370 1018 370 1018 402 V414 V594 C1018 626 1018 626 1018 658 V670 V720 C1018 752 1018 752 1018 784 V796 V976 C1018 1008 1018 1008 1018 1040 V1052 V1102 C1018 1134 636 1134 636 1166 V1178" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：多角形が非凸、または移動ごとに回転・拡大縮小も行う"><rect x="715" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="831" y="293">多角形が非凸、または移動ごとに回</text><text text-anchor="middle" x="831" y="311">転・拡大縮小も行う</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M885 182 V194 C885 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V594 C1074 626 1074 626 1074 658 V670 V720 C1074 752 1074 752 1074 784 V796 V976 C1074 1008 1074 1008 1074 1040 V1052 V1102 C1074 1134 1000 1134 1000 1166 V1178" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 582 V594 C666.111 626 519.833 626 519.833 658 V670"/><path d="M519.833 708 V720 C519.833 752 519.833 752 519.833 784 V796" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="693">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 582 V594 C746.111 626 795 626 795 658 V670"/><path d="M795 708 V720 C795 752 906 752 906 784 V796 V976 C906 1008 906 1008 906 1040 V1052 V1102 C906 1134 556 1134 556 1166 V1178" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"><title>わからない</title><path d="M826.111 582 V594 C826.111 626 923.5 626 923.5 658 V670"/><path d="M923.5 708 V720 C923.5 752 962 752 962 784 V796 V976 C962 1008 962 1008 962 1040 V1052 V1102 C962 1134 920 1134 920 1166 V1178" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="assumptions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M439.833 964 V976 C439.833 1008 192 1008 192 1040 V1052"/><path d="M192 1090 V1102 C192 1134 192 1134 192 1166 V1178" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1075">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M519.833 964 V976 C519.833 1008 556 1008 556 1040 V1052"/><path d="M556 1090 V1102 C556 1134 476 1134 476 1166 V1178" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1075">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M599.833 964 V976 C599.833 1008 811.5 1008 811.5 1040 V1052"/><path d="M811.5 1090 V1102 C811.5 1134 840 1134 840 1166 V1178" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="767" y="1052" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1075">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1328 V1395 C840 1427 783 1427 783 1459 V1471"/><path d="M783 1509 V1521 C783 1553 828.5 1553 828.5 1585 V1597" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1471" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1494">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1328 V1395 C920 1427 907 1427 907 1459 V1471"/><path d="M907 1509 V1521 C907 1553 908.5 1553 908.5 1585 V1597" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1471" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1494">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1328 V1395 C1000 1427 1035.5 1427 1035.5 1459 V1471"/><path d="M1035.5 1509 V1521 C1035.5 1553 988.5 1553 988.5 1585 V1597" marker-end="url(#arrow-translated-convex-halfplane-max)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1471" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1494">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="645" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="661" y="52">質問</text><text class="node-title" x="661" y="80">点や領域について求める量と、許され</text><text class="node-title" x="661" y="103">る操作はどれですか？</text><text class="node-explanation" x="661" y="130">凸性、移動が平行移動だけか、共通部分か和集合か、</text><text class="node-explanation" x="661" y="148">境界を含むかを確かめます。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="602.1111111111112" y="434">質問</text><text class="node-title" x="602.1111111111112" y="462">元の多角形は凸で、各コピーは平行移</text><text class="node-title" x="602.1111111111112" y="485">動だけですか？</text><text class="node-explanation" x="602.1111111111112" y="512">辺の向きが共通なので、各辺の半平面条件の左辺が同</text><text class="node-explanation" x="602.1111111111112" y="530">じになります。非凸の多角形を全辺の同じ側だけで判</text><text class="node-explanation" x="602.1111111111112" y="548">定しません。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="796" width="320" height="168" rx="7"/><text class="node-kind" x="375.83333333333337" y="816">質問</text><text class="node-title" x="375.83333333333337" y="844">質問点は全ての多角形に入る必要があ</text><text class="node-title" x="375.83333333333337" y="867">り、境界も内側として扱いますか？</text><text class="node-explanation" x="375.83333333333337" y="894">共通部分は全制約を同時に満たす領域です。和集合で</text><text class="node-explanation" x="375.83333333333337" y="912">は最大閾値一つにまとめられません。境界を含む不等</text><text class="node-explanation" x="375.83333333333337" y="930">号もそろえます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1178" width="320" height="191" rx="7"/><text class="node-kind" x="48" y="1198">候補</text><text class="node-title" x="48" y="1226">同じ凸多角形を何度も平行移動した共</text><text class="node-title" x="48" y="1249">通部分は、辺ごとの最も厳しい条件だ</text><text class="node-title" x="48" y="1272">け残す</text><a href="/flowchartcp/techniques/translated-convex-halfplane-max/"><title>同じ凸多角形を何度も平行移動した共通部分は、辺ごとの最も厳しい条件だけ残すの記事へ</title><text x="48" y="1311">同じ凸多角形を何度も平行移動した共通部分は、辺</text><text x="48" y="1329">ごとの最も厳しい条件だけ残す</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1178" width="320" height="205" rx="7"/><text class="node-kind" x="412" y="1198">候補</text><text class="node-title" x="412" y="1226">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1253">和集合や回転を含むコピーには、方向別の最大閾値だ</text><text class="node-explanation" x="412" y="1271">けでは情報が足りません。各領域の表現を改めて決め</text><text class="node-explanation" x="412" y="1289">ます。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1319">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1343">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1178" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1198">質問</text><text class="node-title" x="776" y="1226">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1249">確認できますか？</text><text class="node-explanation" x="776" y="1276">凸性、移動が平行移動だけか、共通部分か和集合か、</text><text class="node-explanation" x="776" y="1294">境界を含むかを確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1597" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1617">分野</text><text class="node-title" x="764.5" y="1645">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1672">凸性、移動が平行移動だけか、共通部分か和集合か、</text><text class="node-explanation" x="764.5" y="1690">境界を含むかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1718">詳細の質問・図へ →</text></a></g></svg>