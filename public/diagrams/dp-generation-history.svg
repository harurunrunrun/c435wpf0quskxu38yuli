<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dp-generation-history flow-desc-dp-generation-history" width="2988" height="943" viewBox="0 0 2988 943" data-flow-svg="dp-generation-history"><title id="flow-title-dp-generation-history">整数や列の生成・前の値や履歴の条件の解法フローチャート</title><desc id="flow-desc-dp-generation-history">整数の桁や列の生成条件と、次の選択に必要な過去の情報を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dp-generation-history" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge digits" data-edge="defined:digits:digit-features-route"><title>各桁を選んで整数の条件を満たす</title><path d="M1325.889 141 V153 C1325.889 185 192 185 192 217 V229"/><path d="M192 267 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="defined:digits:digit-features-route" tabindex="0" role="group" aria-label="選択肢：各桁を選んで整数の条件を満たす"><rect x="82.5" y="229" width="219" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">各桁を選んで整数の条件を満たす</text></g></g><g class="flow-edge transition" data-edge="defined:transition:transition-route"><title>一つ前までの候補から、次の値を決める</title><path d="M1357.889 141 V153 C1357.889 185 556 185 556 217 V229"/><path d="M556 285 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="defined:transition:transition-route" tabindex="0" role="group" aria-label="選択肢：一つ前までの候補から、次の値を決める"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">一つ前までの候補から、次の値を決め</text><text text-anchor="middle" x="556" y="270">る</text></g></g><g class="flow-edge history" data-edge="defined:history:state-route"><title>どの履歴を残すか決まっていない</title><path d="M1389.889 141 V153 C1389.889 185 832 185 832 217 V229"/><path d="M832 267 V315 C832 347 766 347 766 379 V391 V570 C766 602 1712.5 602 1712.5 634 V646 V696 C1712.5 728 1659.167 728 1659.167 760 V772" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="defined:history:state-route" tabindex="0" role="group" aria-label="選択肢：どの履歴を残すか決まっていない"><rect x="722.5" y="229" width="219" height="38" rx="5"/><text text-anchor="middle" x="832" y="252">どの履歴を残すか決まっていない</text></g></g><g class="flow-edge generated-lis" data-edge="defined:generated-lis:lis-count-route"><title>小さい値域から列を生成し、増加部分列の最大長を指定して数える</title><path d="M1421.889 141 V153 C1421.889 185 1108 185 1108 217 V229"/><path d="M1108 285 V315 C1108 347 976 347 976 379 V391" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="defined:generated-lis:lis-count-route" tabindex="0" role="group" aria-label="選択肢：小さい値域から列を生成し、増加部分列の最大長を指定して数える"><rect x="985.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1108" y="252">小さい値域から列を生成し、増加部分</text><text text-anchor="middle" x="1108" y="270">列の最大長を指定して数える</text></g></g><g class="flow-edge permutation-signs" data-edge="defined:permutation-signs:permutation-signs-route"><title>異なる値を一度ずつ使う順列を、隣接する不等号の条件で数える</title><path d="M1453.889 141 V153 C1453.889 185 1397 185 1397 217 V229"/><path d="M1397 285 V315 C1397 347 1340 347 1340 379 V391" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="defined:permutation-signs:permutation-signs-route" tabindex="0" role="group" aria-label="選択肢：異なる値を一度ずつ使う順列を、隣接する不等号の条件で数える"><rect x="1274.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1397" y="252">異なる値を一度ずつ使う順列を、隣接</text><text text-anchor="middle" x="1397" y="270">する不等号の条件で数える</text></g></g><g class="flow-edge adjacent-colors" data-edge="defined:adjacent-colors:adjacent-colors-route"><title>残す列や対応する括弧で、隣り合う色の条件を満たす</title><path d="M1485.889 141 V153 C1485.889 185 1704 185 1704 217 V229"/><path d="M1704 285 V315 C1704 347 1704 347 1704 379 V391" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="defined:adjacent-colors:adjacent-colors-route" tabindex="0" role="group" aria-label="選択肢：残す列や対応する括弧で、隣り合う色の条件を満たす"><rect x="1581.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1704" y="252">残す列や対応する括弧で、隣り合う色</text><text text-anchor="middle" x="1704" y="270">の条件を満たす</text></g></g><g class="flow-edge two-choice-count" data-edge="defined:two-choice-count:two-choice-count-route"><title>各位置の二候補から非減少な列を作り、片方をちょうどK回使う</title><path d="M1517.889 141 V153 C1517.889 185 2068 185 2068 217 V229"/><path d="M2068 285 V315 C2068 347 2068 347 2068 379 V391" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="defined:two-choice-count:two-choice-count-route" tabindex="0" role="group" aria-label="選択肢：各位置の二候補から非減少な列を作り、片方をちょうどK回使う"><rect x="1952" y="229" width="232" height="56" rx="5"/><text text-anchor="middle" x="2068" y="252">各位置の二候補から非減少な列を作</text><text text-anchor="middle" x="2068" y="270">り、片方をちょうどK回使う</text></g></g><g class="flow-edge paired-survivors" data-edge="defined:paired-survivors:paired-survivors-route"><title>各高さが二本の列を同時に減らし、最後に残る位置から元の列の個数を数える</title><path d="M1549.889 141 V153 C1549.889 185 2432 185 2432 217 V229"/><path d="M2432 303 V315 C2432 347 2432 347 2432 379 V391" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="defined:paired-survivors:paired-survivors-route" tabindex="0" role="group" aria-label="選択肢：各高さが二本の列を同時に減らし、最後に残る位置から元の列の個数を数える"><rect x="2309.5" y="229" width="245" height="74" rx="5"/><text text-anchor="middle" x="2432" y="252">各高さが二本の列を同時に減らし、最</text><text text-anchor="middle" x="2432" y="270">後に残る位置から元の列の個数を数え</text><text text-anchor="middle" x="2432" y="288">る</text></g></g><g class="flow-edge unknown" data-edge="defined:unknown:check"><title>わからない</title><path d="M1581.889 141 V153 C1581.889 185 2796 185 2796 217 V229"/><path d="M2796 267 V315 C2796 347 2796 347 2796 379 V391" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="defined:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2751.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="2796" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:state-route"><title>はい</title><path d="M2716 541 V570 C2716 602 1802.5 602 1802.5 634 V646"/><path d="M1802.5 684 V696 C1802.5 728 1765.833 728 1765.833 760 V772" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="check:yes:state-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1762.5" y="646" width="80" height="38" rx="5"/><text text-anchor="middle" x="1802.5" y="669">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2796 541 V570 C2796 602 2783 602 2783 634 V646"/><path d="M2783 684 V696 C2783 728 2742.667 728 2742.667 760 V772" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2743" y="646" width="80" height="38" rx="5"/><text text-anchor="middle" x="2783" y="669">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2876 541 V570 C2876 602 2911.5 602 2911.5 634 V646"/><path d="M2911.5 684 V696 C2911.5 728 2849.333 728 2849.333 760 V772" marker-end="url(#arrow-dp-generation-history)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2867" y="646" width="89" height="38" rx="5"/><text text-anchor="middle" x="2911.5" y="669">わからない</text></g></g><g class="flow-node question" data-node="defined"><rect x="1293.888888888889" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1309.888888888889" y="52">質問</text><text class="node-title" x="1309.888888888889" y="80">選び方や分け方の特徴はどれですか？</text><text class="node-explanation" x="1309.888888888889" y="107">入力の上限と、求める制約から探します。</text></g><g class="flow-node question" data-node="check"><rect x="2636" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="2652" y="411">質問</text><text class="node-title" x="2652" y="439">小さい入力で、全状態と遷移を列挙で</text><text class="node-title" x="2652" y="462">きますか？</text><text class="node-explanation" x="2652" y="489">列挙した表で状態の重複と、どこに時間がかかるかを</text><text class="node-explanation" x="2652" y="507">確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="2636" y="772" width="320" height="139" rx="7"/><text class="node-kind" x="2652" y="792">分野</text><text class="node-title" x="2652" y="820">条件を確かめる</text><text class="node-explanation" x="2652" y="847">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="2652" y="875">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="state-route"><rect x="1552.5" y="772" width="320" height="121" rx="7"/><text class="node-kind" x="1568.5" y="792">分野</text><text class="node-title" x="1568.5" y="820">選ぶ数・重さ・残す履歴</text><a href="/flowchartcp/flowcharts/#diagram-dp-state" data-route="dp-state"><text x="1568.5" y="857">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="transition-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">候補の範囲と繰り返す計算</text><a href="/flowchartcp/flowcharts/#diagram-dp-transition" data-route="dp-transition"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="lis-count-route"><rect x="816" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="832" y="411">分野</text><text class="node-title" x="832" y="439">増加部分列の最大長を指定して列を数</text><text class="node-title" x="832" y="462">える</text><a href="/flowchartcp/flowcharts/#diagram-generated-lis-count" data-route="generated-lis-count"><text x="832" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="digit-features-route"><rect x="32" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">上限以下の桁の条件と総和</text><a href="/flowchartcp/flowcharts/#diagram-digit-constraints" data-route="digit-constraints"><text x="48" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="permutation-signs-route"><rect x="1180" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1196" y="411">分野</text><text class="node-title" x="1196" y="439">異なる値を一度ずつ使う順列を、隣接</text><text class="node-title" x="1196" y="462">する不等号の条件で数える</text><a href="/flowchartcp/flowcharts/#diagram-permutation-adjacent-signs" data-route="permutation-adjacent-signs"><text x="1196" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="adjacent-colors-route"><rect x="1544" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1560" y="411">分野</text><text class="node-title" x="1560" y="439">残す列や対応する括弧で、隣り合う色</text><text class="node-title" x="1560" y="462">の条件を満たす</text><a href="/flowchartcp/flowcharts/#diagram-adjacent-color-goals" data-route="adjacent-color-goals"><text x="1560" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="two-choice-count-route"><rect x="1908" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1924" y="411">分野</text><text class="node-title" x="1924" y="439">各位置の二候補から非減少な列を作</text><text class="node-title" x="1924" y="462">り、片方をちょうどK回使う</text><a href="/flowchartcp/flowcharts/#diagram-two-choice-count-conditions" data-route="two-choice-count-conditions"><text x="1924" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="paired-survivors-route"><rect x="2272" y="391" width="320" height="167" rx="7"/><text class="node-kind" x="2288" y="411">分野</text><text class="node-title" x="2288" y="439">各高さが二本の列を同時に減らし、最</text><text class="node-title" x="2288" y="462">後に残る位置から元の列の個数を数え</text><text class="node-title" x="2288" y="485">る</text><a href="/flowchartcp/flowcharts/#diagram-paired-height-survivor-conditions" data-route="paired-height-survivor-conditions"><text x="2288" y="522">詳細の質問・図へ →</text></a></g></svg>