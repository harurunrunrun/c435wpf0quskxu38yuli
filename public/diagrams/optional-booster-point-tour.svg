" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M581.167 969 V981 C581.167 1013 755.5 1013 755.5 1045 V1057"/><path d="M755.5 1095 V1107 C755.5 1139 840 1139 840 1171 V1183" marker-end="url(#arrow-optional-booster-point-tour)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1080">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1333 V1363 C840 1395 783 1395 783 1427 V1439"/><path d="M783 1477 V1489 C783 1521 828.5 1521 828.5 1553 V1565" marker-end="url(#arrow-optional-booster-point-tour)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1462">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1333 V1363 C920 1395 907 1395 907 1427 V1439"/><path d="M907 1477 V1489 C907 1521 908.5 1521 908.5 1553 V1565" marker-end="url(#arrow-optional-booster-point-tour)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1462">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1333 V1363 C1000 1395 1035.5 1395 1035.5 1427 V1439"/><path d="M1035.5 1477 V1489 C1035.5 1521 988.5 1521 988.5 1553 V1565" marker-end="url(#arrow-optional-booster-point-tour)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1439" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1462">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="500.5" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="516.5" y="52">質問</text><text class="node-title" x="516.5" y="80">回る点と移動規則は、どの形ですか？</text><text class="node-explanation" x="516.5" y="107">必須・任意の点、加速の回数、加速が有効になる時刻</text><text class="node-explanation" x="516.5" y="125">を確かめます。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="391" width="320" height="173" rx="7"/><text class="node-kind" x="558.5555555555557" y="411">質問</text><text class="node-title" x="558.5555555555557" y="439">点数が少なく、各加速点は最初の訪問</text><text class="node-title" x="558.5555555555557" y="462">で一度だけ速度を 2 倍にします</text><text class="node-title" x="558.5555555555557" y="485">か？</text><text class="node-explanation" x="558.5555555555557" y="512">同じ点へ戻っても、二回目の加速を受け取れません。</text><text class="node-explanation" x="558.5555555555557" y="530">訪問済み集合の加速点数で速度を定めます。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="778" width="320" height="191" rx="7"/><text class="node-kind" x="357.1666666666667" y="798">質問</text><text class="node-title" x="357.1666666666667" y="826">どの二点間も直線距離で移動でき、出</text><text class="node-title" x="357.1666666666667" y="849">発時点の速度で移動時間が決まります</text><text class="node-title" x="357.1666666666667" y="872">か？</text><text class="node-explanation" x="357.1666666666667" y="899">新しい加速点へ到着するまでの移動に、その点の加速</text><text class="node-explanation" x="357.1666666666667" y="917">を先に使いません。必須点を全て含む集合から、原点</text><text class="node-explanation" x="357.1666666666667" y="935">へ戻る費用を比べます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">訪問済み集合と現在点を持ち、加速を</text><text class="node-title" x="48" y="1254">次の移動から反映する</text><a href="/flowchartcp/techniques/optional-booster-subset-speed/"><title>任意の加速点がある巡回は、訪問集合から今の速度を決め、必須点だけの完了を認めるの記事へ</title><text x="48" y="1293">任意の加速点がある巡回は、訪問集合から今の速度</text><text x="48" y="1311">を決め、必須点だけの完了を認める</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1203">候補</text><text class="node-title" x="412" y="1231">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1270">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1294">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1183" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1203">質問</text><text class="node-title" x="776" y="1231">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1254">書き出せますか？</text><text class="node-explanation" x="776" y="1281">必須・任意の点、加速の回数、加速が有効になる時刻</text><text class="node-explanation" x="776" y="1299">を確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1565" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1585">分野</text><text class="node-title" x="764.5" y="1613">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1650">詳細の質問・図へ →</text></a></g></svg>