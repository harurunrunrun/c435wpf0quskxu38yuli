<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-optional-booster-point-tour flow-desc-optional-booster-point-tour" width="1112" height="1718" viewBox="0 0 1112 1718" data-flow-svg="optional-booster-point-tour"><title id="flow-title-optional-booster-point-tour">訪問済み集合と現在点を持ち、加速を次の移動から反映するの解法フローチャート</title><desc id="flow-desc-optional-booster-point-tour">必須・任意の点、加速の回数、加速が有効になる時刻を確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-optional-booster-point-tour" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge mandatory-optional" data-edge="model:mandatory-optional:goal"><title>平面の必須点と任意の加速点を回り、原点へ戻る</title><path d="M564.5 159 V171 C564.5 203 246.5 203 246.5 235 V247"/><path d="M246.5 303 V315 C246.5 347 702.556 347 702.556 379 V391" marker-end="url(#arrow-optional-booster-point-tour)"/><g class="flow-edge-label" data-edge-label="model:mandatory-optional:goal" tabindex="0" role="group" aria-label="選択肢：平面の必須点と任意の加速点を回り、原点へ戻る"><rect x="124" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="246.5" y="270">平面の必須点と任意の加速点を回り、</text><text text-anchor="middle" x="246.5" y="288">原点へ戻る</text></g></g><g class="flow-edge graph-roads" data-edge="model:graph-roads:fallback"><title>道路や障害物で移動経路が制限される</title><path d="M628.5 159 V171 C628.5 203 535.5 203 535.5 235 V247"/><path d="M535.5 285 V315 C535.5 347 962 347 962 379 V391 V576 C962 608 962 608 962 640 V652 V702 C962 734 962 734 962 766 V778 V981 C962 1013 962 1013 962 1045 V1057 V1107 C962 1139 588 1139 588 1171 V1183" marker-end="url(#arrow-optional-booster-point-tour)"/><g class="flow-edge-label" data-edge-label="model:graph-roads:fallback" tabindex="0" role="group" aria-label="選択肢：道路や障害物で移動経路が制限される"><rect x="413" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="535.5" y="270">道路や障害物で移動経路が制限される</text></g></g><g class="flow-edge all-mandatory" data-edge="model:all-mandatory:fallback"><title>全ての点を必ず訪れる必要があり、加速点はない</title><path d="M692.5 159 V171 C692.5 203 824.5 203 824.5 235 V247"/><path d="M824.5 303 V315 C824.5 347 1018 347 1018 379 V391 V576 C1018 608 1018 608 1018 640 V652 V702 C1018 734 1018 734 1018 766 V778 V981 C1018 1013 1018 1013 1018 1045 V1057 V1107 C1018 1139 652 1139 652 1171 V1183" marker-end="url(#arrow-optional-booster-point-tour)"/><g class="flow-edge-label" data-edge-label="model:all-mandatory:fallback" tabindex="0" role="group" aria-label="選択肢：全ての点を必ず訪れる必要があり、加速点はない"><rect x="702" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="270">全ての点を必ず訪れる必要があり、加</text><text text-anchor="middle" x="824.5" y="288">速点はない</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M756.5 159 V171 C756.5 203 1035.5 203 1035.5 235 V247"/><path d="M1035.5 285 V315 C1035.5 347 1074 347 1074 379 V391 V576 C1074 608 1074 608 1074 640 V652 V702 C1074 734 1074 734 1074 766 V778 V981 C1074 1013 1074 1013 1074 1045 V1057 V1107 C1074 1139 1000 1139 1000 1171 V1183" marker-end="url(#arrow-optional-booster-point-tour)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="goal:yes:guard"><title>はい</title><path d="M622.556 564 V576 C622.556 608 501.167 608 501.167 640 V652"/><path d="M501.167 690 V702 C501.167 734 501.167 734 501.167 766 V778" marker-end="url(#arrow-optional-booster-point-tour)"/><g class="flow-edge-label" data-edge-label="goal:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="461.1666666666667" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="501.1666666666667" y="675">はい</text></g></g><g class="flow-edge no" data-edge="goa