<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-geometry-directions flow-desc-geometry-directions" width="1336" height="1743" viewBox="0 0 1336 1743" data-flow-svg="geometry-directions"><title id="flow-title-geometry-directions">方向と角度による個数の解法フローチャート</title><desc id="flow-desc-geometry-directions">整数の方向を正規化し、同方向・逆方向・直交・角度を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-geometry-directions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge collinear" data-edge="goal:collinear:collinear-distinct"><title>K 点以上を通る直線の数</title><path d="M816 159 V171 C816 203 724 203 724 235 V247"/><path d="M724 285 V315 C724 347 724 347 724 379 V391" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="goal:collinear:collinear-distinct" tabindex="0" role="group" aria-label="選択肢：K 点以上を通る直線の数"><rect x="634" y="247" width="180" height="38" rx="5"/><text text-anchor="middle" x="724" y="270">K 点以上を通る直線の数</text></g></g><g class="flow-edge perpendicular" data-edge="goal:perpendicular:perpendicular-route"><title>内積が 0 の二対象を同時に選ばない部分集合</title><path d="M752 159 V171 C752 203 360 203 360 235 V247"/><path d="M360 303 V315 C360 347 360 347 360 379 V391" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="goal:perpendicular:perpendicular-route" tabindex="0" role="group" aria-label="選択肢：内積が 0 の二対象を同時に選ばない部分集合"><rect x="237.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="360" y="270">内積が 0 の二対象を同時に選ばな</text><text text-anchor="middle" x="360" y="288">い部分集合</text></g></g><g class="flow-edge triangles" data-edge="goal:triangles:triangles-nondegenerate"><title>三点組を鋭角・直角・鈍角に分類する</title><path d="M880 159 V171 C880 203 1048.5 203 1048.5 235 V247"/><path d="M1048.5 285 V315 C1048.5 347 1088 347 1088 379 V391" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="goal:triangles:triangles-nondegenerate" tabindex="0" role="group" aria-label="選択肢：三点組を鋭角・直角・鈍角に分類する"><rect x="926" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="1048.5" y="270">三点組を鋭角・直角・鈍角に分類する</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M944 159 V171 C944 203 1259.5 203 1259.5 235 V247"/><path d="M1259.5 285 V315 C1259.5 347 1298 347 1298 379 V391 V571 C1298 603 1298 603 1298 635 V647 V697 C1298 729 1298 729 1298 761 V773 V976 C1298 1008 1298 1008 1298 1040 V1052 V1102 C1298 1134 1194.667 1134 1194.667 1166 V1178" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1215" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1259.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="collinear-distinct:yes:collinear-count"><title>はい</title><path d="M724 559 V571 C724 603 453.5 603 453.5 635 V647"/><path d="M453.5 685 V697 C453.5 729 453.5 729 453.5 761 V773" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="collinear-distinct:yes:collinear-count" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="413.5" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="453.5" y="670">はい</text></g></g><g class="flow-edge no" data-edge="collinear-distinct:no:fallback"><title>いいえ</title><path d="M644 559 V571 C644 603 72 603 72 635 V647"/><path d="M72 685 V697 C72 729 38 729 38 761 V773 V976 C38 1008 38 1008 38 1040 V1052 V1102 C38 1134 38 1134 38 1166 V1178 V1358 C38 1390 651.8 1390 651.8 1422 V1434 V1484 C651.8 1516 545.133 1516 545.133 1548 V1560" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="collinear-distinct:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="32" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="670">いいえ</text></g></g><g class="flow-edge unknown" data-edge="collinear-distinct:unknown:check"><title>わからない</title><path d="M804 559 V571 C804 603 749 603 749 635 V647"/><path d="M749 685 V697 C749 729 749 729 749 761 V773 V976 C749 1008 749 1008 749 1040 V1052 V1102 C749 1134 1034.667 1134 1034.667 1166 V1178" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="collinear-distinct:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="704.5" y="647" width="89" height="38" rx="5"/><text text-anchor="middle" x="749" y="670">わからない</text></g></g><g class="flow-edge yes" data-edge="collinear-count:yes:collinear-result"><title>はい</title><path d="M373.5 964 V976 C373.5 1008 248 1008 248 1040 V1052"/><path d="M248 1090 V1102 C248 1134 248 1134 248 1166 V1178" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="collinear-count:yes:collinear-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="1075">はい</text></g></g><g class="flow-edge no" data-edge="collinear-count:no:fallback"><title>いいえ</title><path d="M453.5 964 V976 C453.5 1008 458 1008 458 1040 V1052"/><path d="M458 1090 V1102 C458 1134 458 1134 458 1166 V1178 V1358 C458 1390 707.8 1390 707.8 1422 V1434 V1484 C707.8 1516 598.467 1516 598.467 1548 V1560" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="collinear-count:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="418" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="458" y="1075">いいえ</text></g></g><g class="flow-edge unknown" data-edge="collinear-count:unknown:check"><title>わからない</title><path d="M533.5 964 V976 C533.5 1008 654.5 1008 654.5 1040 V1052"/><path d="M654.5 1090 V1102 C654.5 1134 981.333 1134 981.333 1166 V1178" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="collinear-count:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="610" y="1052" width="89" height="38" rx="5"/><text text-anchor="middle" x="654.5" y="1075">わからない</text></g></g><g class="flow-edge yes" data-edge="triangles-nondegenerate:yes:triangles-order"><title>はい</title><path d="M1008 541 V571 C1008 603 951 603 951 635 V647"/><path d="M951 685 V697 C951 729 964.5 729 964.5 761 V773" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="triangles-nondegenerate:yes:triangles-order" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="911" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="951" y="670">はい</text></g></g><g class="flow-edge no" data-edge="triangles-nondegenerate:no:fallback"><title>いいえ</title><path d="M1088 541 V571 C1088 603 1075 603 1075 635 V647"/><path d="M1075 685 V697 C1075 729 1186 729 1186 761 V773 V976 C1186 1008 1186 1008 1186 1040 V1052 V1102 C1186 1134 1298 1134 1298 1166 V1178 V1358 C1298 1390 1298 1390 1298 1422 V1434 V1484 C1298 1516 758.467 1516 758.467 1548 V1560" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="triangles-nondegenerate:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="670">いいえ</text></g></g><g class="flow-edge unknown" data-edge="triangles-nondegenerate:unknown:check"><title>わからない</title><path d="M1168 541 V571 C1168 603 1203.5 603 1203.5 635 V647"/><path d="M1203.5 685 V697 C1203.5 729 1242 729 1242 761 V773 V976 C1242 1008 1242 1008 1242 1040 V1052 V1102 C1242 1134 1141.333 1134 1141.333 1166 V1178" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="triangles-nondegenerate:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="647" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="670">わからない</text></g></g><g class="flow-edge yes" data-edge="triangles-order:yes:triangle-result"><title>はい</title><path d="M964.5 923 V976 C964.5 1008 963 1008 963 1040 V1052"/><path d="M963 1090 V1102 C963 1134 724 1134 724 1166 V1178" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="triangles-order:yes:triangle-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="923" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1075">はい</text></g></g><g class="flow-edge no" data-edge="triangles-order:no:fallback"><title>いいえ</title><path d="M884.5 923 V976 C884.5 1008 839 1008 839 1040 V1052"/><path d="M839 1090 V1102 C839 1134 514 1134 514 1166 V1178 V1358 C514 1390 763.8 1390 763.8 1422 V1434 V1484 C763.8 1516 651.8 1516 651.8 1548 V1560" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="triangles-order:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="799" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="839" y="1075">いいえ</text></g></g><g class="flow-edge unknown" data-edge="triangles-order:unknown:check"><title>わからない</title><path d="M1044.5 923 V976 C1044.5 1008 1091.5 1008 1091.5 1040 V1052"/><path d="M1091.5 1090 V1102 C1091.5 1134 1088 1134 1088 1166 V1178" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="triangles-order:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1052" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1075">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1008 1333 V1358 C1008 1390 853.8 1390 853.8 1422 V1434"/><path d="M853.8 1472 V1484 C853.8 1516 705.133 1516 705.133 1548 V1560" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="813.8" y="1434" width="80" height="38" rx="5"/><text text-anchor="middle" x="853.8" y="1457">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1088 1333 V1358 C1088 1390 1075 1390 1075 1422 V1434"/><path d="M1075 1472 V1484 C1075 1516 1085.917 1516 1085.917 1548 V1560" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="1434" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="1457">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1168 1333 V1358 C1168 1390 1203.5 1390 1203.5 1422 V1434"/><path d="M1203.5 1472 V1484 C1203.5 1516 1192.583 1516 1192.583 1548 V1560" marker-end="url(#arrow-geometry-directions)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="1434" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="1457">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="688" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="704" y="52">質問</text><text class="node-title" x="704" y="80">方向から何を数えますか？</text><text class="node-explanation" x="704" y="107">点を通る直線と、二成分を持つ対象の組の条件を区別</text><text class="node-explanation" x="704" y="125">します。</text></g><g class="flow-node question" data-node="collinear-distinct"><rect x="564" y="391" width="320" height="168" rx="7"/><text class="node-kind" x="580" y="411">質問</text><text class="node-title" x="580" y="439">点は異なる整数座標で、同じ直線の逆</text><text class="node-title" x="580" y="462">方向も一つの方向にまとめますか？</text><text class="node-explanation" x="580" y="489">方向の二成分を gcd で割り、符号の規約を揃え</text><text class="node-explanation" x="580" y="507">ます。K=1 は無数の直線になるので先に扱いま</text><text class="node-explanation" x="580" y="525">す。</text></g><g class="flow-node question" data-node="collinear-count"><rect x="293.5" y="773" width="320" height="191" rx="7"/><text class="node-kind" x="309.5" y="793">質問</text><text class="node-title" x="309.5" y="821">同じ直線上の最小添字の点を始点にし</text><text class="node-title" x="309.5" y="844">た場合だけ、その直線を数えられます</text><text class="node-title" x="309.5" y="867">か？</text><text class="node-explanation" x="309.5" y="894">方向の組に自分より小さい添字の点が一つでもあれ</text><text class="node-explanation" x="309.5" y="912">ば、その直線は別の始点で数えるため、今は数えませ</text><text class="node-explanation" x="309.5" y="930">ん。</text></g><g class="flow-node result" data-node="collinear-result"><rect x="88" y="1178" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="1198">候補</text><text class="node-title" x="104" y="1226">座標差の gcd と符号で方向を揃</text><text class="node-title" x="104" y="1249">え、直線の重複を除く</text><a href="/flowchartcp/techniques/collinear-direction-gcd/"><title>同一直線の点を、最大公約数と向きの統一でまとめるの記事へ</title><text x="104" y="1288">同一直線の点を、最大公約数と向きの統一でまとめ</text><text x="104" y="1306">る</text></a></g><g class="flow-node question" data-node="triangles-nondegenerate"><rect x="928" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="944" y="411">質問</text><text class="node-title" x="944" y="439">点は異なり、どの三点も同じ直線上に</text><text class="node-title" x="944" y="462">ないと保証されていますか？</text><text class="node-explanation" x="944" y="489">退化する三点組がある場合は、全三点組から角分類を</text><text class="node-explanation" x="944" y="507">引く式に補正が必要です。</text></g><g class="flow-node question" data-node="triangles-order"><rect x="804.5" y="773" width="320" height="150" rx="7"/><text class="node-kind" x="820.5" y="793">質問</text><text class="node-title" x="820.5" y="821">一つの頂点を固定し、方向順で直角以</text><text class="node-title" x="820.5" y="844">上になる範囲を動かせますか？</text><text class="node-explanation" x="820.5" y="871">浮動小数の角度を使わず、半平面・外積・内積の符号</text><text class="node-explanation" x="820.5" y="889">で方向と 90 度・180 度を区別します。</text></g><g class="flow-node result" data-node="triangle-result"><rect x="564" y="1178" width="320" height="168" rx="7"/><text class="node-kind" x="580" y="1198">候補</text><text class="node-title" x="580" y="1226">中心からの方向を順に並べ、直角・鈍</text><text class="node-title" x="580" y="1249">角の相手を二つの境界で数える</text><a href="/flowchartcp/techniques/angle-vector-two-pointers/"><title>三角形の角を、中心からの方向順と二つの境界でまとめて数えるの記事へ</title><text x="580" y="1288">三角形の角を、中心からの方向順と二つの境界でま</text><text x="580" y="1306">とめて数える</text></a></g><g class="flow-node question" data-node="check"><rect x="928" y="1178" width="320" height="155" rx="7"/><text class="node-kind" x="944" y="1198">質問</text><text class="node-title" x="944" y="1226">座標の範囲、境界、重複、共線の場合</text><text class="node-title" x="944" y="1249">を問題文と小さい例で確認できます</text><text class="node-title" x="944" y="1272">か？</text><text class="node-explanation" x="944" y="1299">保証される形と、必要な幾何の性質を区別します。</text></g><g class="flow-node result" data-node="fallback"><rect x="491.79999999999995" y="1560" width="320" height="151" rx="7"/><text class="node-kind" x="507.79999999999995" y="1580">候補</text><text class="node-title" x="507.79999999999995" y="1608">入力の形と退化する場合を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="507.79999999999995" y="1647">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="507.79999999999995" y="1671">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="979.25" y="1560" width="320" height="121" rx="7"/><text class="node-kind" x="995.25" y="1580">分野</text><text class="node-title" x="995.25" y="1608">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="995.25" y="1645">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="perpendicular-route"><rect x="200" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="216" y="411">分野</text><text class="node-title" x="216" y="439">内積 0 を禁止する二成分選択</text><a href="/flowchartcp/flowcharts/#diagram-geometry-perpendicular" data-route="geometry-perpendicular"><text x="216" y="476">詳細の質問・図へ →</text></a></g></svg>