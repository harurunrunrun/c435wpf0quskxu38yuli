<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-algebra-series-transitions flow-desc-algebra-series-transitions" width="1168" height="968" viewBox="0 0 1168 968" data-flow-svg="algebra-series-transitions"><title id="flow-title-algebra-series-transitions">係数列への演算と線形遷移の解法フローチャート</title><desc id="flow-desc-algebra-series-transitions">係数列の逆数・対数・指数と、同じ線形遷移の繰り返しを分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-algebra-series-transitions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="series:yes:fps"><title>その他の、逆数・対数・指数の係数の条件</title><path d="M584 182 V194 C584 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-algebra-series-transitions)"/><g class="flow-edge-label" data-edge-label="series:yes:fps" tabindex="0" role="group" aria-label="選択肢：その他の、逆数・対数・指数の係数の条件"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">その他の、逆数・対数・指数の係数の</text><text text-anchor="middle" x="192" y="311">条件</text></g></g><g class="flow-edge no" data-edge="series:no:transition"><title>同じ線形遷移や漸化式の繰り返し</title><path d="M648 182 V194 C648 226 556 226 556 258 V270"/><path d="M556 308 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-algebra-series-transitions)"/><g class="flow-edge-label" data-edge-label="series:no:transition" tabindex="0" role="group" aria-label="選択肢：同じ線形遷移や漸化式の繰り返し"><rect x="446.5" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">同じ線形遷移や漸化式の繰り返し</text></g></g><g class="flow-edge operation" data-edge="series:operation:series-operation-route"><title>積の逆・対数・指数のどれかの先頭 N 項</title><path d="M712 182 V194 C712 226 880.5 226 880.5 258 V270"/><path d="M880.5 326 V338 C880.5 370 920 370 920 402 V414" marker-end="url(#arrow-algebra-series-transitions)"/><g class="flow-edge-label" data-edge-label="series:operation:series-operation-route" tabindex="0" role="group" aria-label="選択肢：積の逆・対数・指数のどれかの先頭 N 項"><rect x="758" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="880.5" y="293">積の逆・対数・指数のどれかの先頭 </text><text text-anchor="middle" x="880.5" y="311">N 項</text></g></g><g class="flow-edge unknown" data-edge="series:unknown:check"><title>わからない</title><path d="M776 182 V194 C776 226 1091.5 226 1091.5 258 V270"/><path d="M1091.5 308 V338 C1091.5 370 1130 370 1130 402 V414 V577 C1130 609 1070.5 609 1070.5 641 V653 V703 C1070.5 735 1029.333 735 1029.333 767 V779" marker-end="url(#arrow-algebra-series-transitions)"/><g class="flow-edge-label" data-edge-label="series:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="transition:yes:matrix"><title>はい</title><path d="M476 546 V577 C476 609 248 609 248 641 V653"/><path d="M248 691 V703 C248 735 248 735 248 767 V779" marker-end="url(#arrow-algebra-series-transitions)"/><g class="flow-edge-label" data-edge-label="transition:yes:matrix" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="653" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="676">はい</text></g></g><g class="flow-edge no" data-edge="transition:no:recurrence"><title>いいえ</title><path d="M556 546 V577 C556 609 612 609 612 641 V653"/><path d="M612 691 V703 C612 735 612 735 612 767 V779" marker-end="url(#arrow-algebra-series-transitions)"/><g class="flow-edge-label" data-edge-label="transition:no:recurrence" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="653" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="676">いいえ</text></g></g><g class="flow-edge unknown" data-edge="transition:unknown:check"><title>わからない</title><path d="M636 546 V577 C636 609 976 609 976 641 V653"/><path d="M976 691 V703 C976 735 922.667 735 922.667 767 V779" marker-end="url(#arrow-algebra-series-transitions)"/><g class="flow-edge-label" data-edge-label="transition:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="653" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="676">わからない</text></g></g><g class="flow-node question" data-node="series"><rect x="520" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="536" y="52">質問</text><text class="node-title" x="536" y="80">必要な先頭の係数列の操作はどれです</text><text class="node-title" x="536" y="103">か？</text><text class="node-explanation" x="536" y="130">係数列の積の逆・対数・指数を求める場合と、同じ遷</text><text class="node-explanation" x="536" y="148">移を繰り返す場合を分けます。</text></g><g class="flow-node result" data-node="fps"><rect x="32" y="414" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="434">候補</text><text class="node-title" x="48" y="462">形式的冪級数</text><a href="/flowchartcp/techniques/formal-power-series/"><title>形式的冪級数の記事へ</title><text x="48" y="501">形式的冪級数</text></a><a href="/flowchartcp/techniques/ntt/"><title>NTT・畳み込みの記事へ</title><text x="48" y="525">NTT・畳み込み</text></a></g><g class="flow-node question" data-node="transition"><rect x="396" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="412" y="434">質問</text><text class="node-title" x="412" y="462">同じ線形遷移を、非常に大きい回数繰</text><text class="node-title" x="412" y="485">り返しますか？</text><text class="node-explanation" x="412" y="512">行列の大きさと行列積のコストを確認します。</text></g><g class="flow-node result" data-node="matrix"><rect x="88" y="779" width="320" height="127" rx="7"/><text class="node-kind" x="104" y="799">候補</text><text class="node-title" x="104" y="827">行列累乗</text><a href="/flowchartcp/techniques/matrix-exponentiation/"><title>行列累乗の記事へ</title><text x="104" y="866">行列累乗</text></a></g><g class="flow-node route" data-node="recurrence"><rect x="452" y="779" width="320" height="157" rx="7"/><text class="node-kind" x="468" y="799">分野</text><text class="node-title" x="468" y="827">漸化式の係数・初期項と求める項</text><text class="node-explanation" x="468" y="854">係数と初期項がある場合と、有限列に合う式を推測す</text><text class="node-explanation" x="468" y="872">る場合を区別します。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-recurrence-information" data-route="algebra-recurrence-information"><text x="468" y="900">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="816" y="779" width="320" height="157" rx="7"/><text class="node-kind" x="832" y="799">分野</text><text class="node-title" x="832" y="827">係数の逆数と指定の法</text><text class="node-explanation" x="832" y="854">係数の逆数が必要か、指定の法で逆数が存在するかを</text><text class="node-explanation" x="832" y="872">確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-invertibility" data-route="algebra-invertibility"><text x="832" y="900">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="series-operation-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">必要な係数列の先頭だけを求める</text><a href="/flowchartcp/flowcharts/#diagram-series-coefficients" data-route="series-coefficients"><text x="776" y="499">詳細の質問・図へ →</text></a></g></svg>