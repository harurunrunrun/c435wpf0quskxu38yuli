<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-selection-sizes flow-desc-tree-selection-sizes" width="1504" height="1731" viewBox="0 0 1504 1731" data-flow-svg="tree-selection-sizes"><title id="flow-title-tree-selection-sizes">木全体の最適値と選ぶ個数・辺数の条件の解法フローチャート</title><desc id="flow-desc-tree-selection-sizes">木全体の最適値、選んだ個数ごとの答え、各頂点の接続本数の上限を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-selection-sizes" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="rooted:yes:all-roots"><title>はい</title><path d="M702.667 505 V535 C702.667 567 724 567 724 599 V611"/><path d="M724 649 V661 C724 693 724 693 724 725 V737" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="rooted:yes:all-roots" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="684" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="724" y="634">はい</text></g></g><g class="flow-edge no" data-edge="rooted:no:state"><title>いいえ</title><path d="M622.667 505 V535 C622.667 567 450 567 450 599 V611"/><path d="M450 649 V661 C450 693 413.333 693 413.333 725 V737" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="rooted:no:state" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="410" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="rooted:unknown:check"><title>わからない</title><path d="M782.667 505 V535 C782.667 567 934 567 934 599 V611"/><path d="M934 649 V661 C934 693 934 693 934 725 V737 V940 C934 972 860.5 972 860.5 1004 V1016 V1066 C860.5 1098 822 1098 822 1130 V1142 V1322 C822 1354 1186 1354 1186 1386 V1398 V1448 C1186 1480 1263.143 1480 1263.143 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="rooted:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="889.5" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="934" y="634">わからない</text></g></g><g class="flow-edge yes" data-edge="all-roots:yes:exclude-one"><title>はい</title><path d="M724 887 V940 C724 972 556 972 556 1004 V1016"/><path d="M556 1054 V1066 C556 1098 556 1098 556 1130 V1142" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="all-roots:yes:exclude-one" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="all-roots:no:tree-result"><title>いいえ</title><path d="M644 887 V940 C644 972 192 972 192 1004 V1016"/><path d="M192 1054 V1066 C192 1098 192 1098 192 1130 V1142" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="all-roots:no:tree-result" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="152" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="all-roots:unknown:check"><title>わからない</title><path d="M804 887 V940 C804 972 766 972 766 1004 V1016"/><path d="M766 1054 V1066 C766 1098 766 1098 766 1130 V1142 V1322 C766 1354 1130 1354 1130 1386 V1398 V1448 C1130 1480 1217.429 1480 1217.429 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="all-roots:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="721.5" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="766" y="1039">わからない</text></g></g><g class="flow-edge yes" data-edge="exclude-one:yes:reroot-specific"><title>はい</title><path d="M476 1274 V1322 C476 1354 556 1354 556 1386 V1398"/><path d="M556 1436 V1448 C556 1480 556 1480 556 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="exclude-one:yes:reroot-specific" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1421">はい</text></g></g><g class="flow-edge no" data-edge="exclude-one:no:fallback"><title>いいえ</title><path d="M556 1274 V1322 C556 1354 907 1354 907 1386 V1398"/><path d="M907 1436 V1448 C907 1480 842 1480 842 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="exclude-one:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1421">いいえ</text></g></g><g class="flow-edge unknown" data-edge="exclude-one:unknown:check"><title>わからない</title><path d="M636 1274 V1322 C636 1354 1035.5 1354 1035.5 1386 V1398"/><path d="M1035.5 1436 V1448 C1035.5 1480 1171.714 1480 1171.714 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="exclude-one:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1398" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1421">わからない</text></g></g><g class="flow-edge one" data-edge="tree-objective:one:rooted"><title>木全体の一つの最適値</title><path d="M893.375 141 V153 C893.375 185 702.667 185 702.667 217 V229"/><path d="M702.667 267 V297 C702.667 329 702.667 329 702.667 361 V373" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="tree-objective:one:rooted" tabindex="0" role="group" aria-label="選択肢：木全体の一つの最適値"><rect x="625.6666666666666" y="229" width="154" height="38" rx="5"/><text text-anchor="middle" x="702.6666666666666" y="252">木全体の一つの最適値</text></g></g><g class="flow-edge count" data-edge="tree-objective:count:state"><title>選んだ個数・覆った個数ごとの答え</title><path d="M829.375 141 V153 C829.375 185 360 185 360 217 V229"/><path d="M360 267 V297 C360 329 360 329 360 361 V373 V535 C360 567 360 567 360 599 V611 V661 C360 693 306.667 693 306.667 725 V737" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="tree-objective:count:state" tabindex="0" role="group" aria-label="選択肢：選んだ個数・覆った個数ごとの答え"><rect x="244" y="229" width="232" height="38" rx="5"/><text text-anchor="middle" x="360" y="252">選んだ個数・覆った個数ごとの答え</text></g></g><g class="flow-edge degree-capacity" data-edge="tree-objective:degree-capacity:parent-edge-capacity"><title>各頂点の辺数上限を守り、選ぶ辺の重みを最大にする</title><path d="M957.375 141 V153 C957.375 185 1211.333 185 1211.333 217 V229"/><path d="M1211.333 285 V297 C1211.333 329 1211.333 329 1211.333 361 V373" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="tree-objective:degree-capacity:parent-edge-capacity" tabindex="0" role="group" aria-label="選択肢：各頂点の辺数上限を守り、選ぶ辺の重みを最大にする"><rect x="1088.8333333333333" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1211.3333333333333" y="252">各頂点の辺数上限を守り、選ぶ辺の重</text><text text-anchor="middle" x="1211.3333333333333" y="270">みを最大にする</text></g></g><g class="flow-edge unknown" data-edge="tree-objective:unknown:check"><title>わからない</title><path d="M1021.375 141 V153 C1021.375 185 1427.5 185 1427.5 217 V229"/><path d="M1427.5 267 V297 C1427.5 329 1466 329 1466 361 V373 V535 C1466 567 1466 567 1466 599 V611 V661 C1466 693 1466 693 1466 725 V737 V940 C1466 972 1466 972 1466 1004 V1016 V1066 C1466 1098 1466 1098 1466 1130 V1142 V1322 C1466 1354 1466 1354 1466 1386 V1398 V1448 C1466 1480 1400.286 1480 1400.286 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="tree-objective:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1383" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1427.5" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="parent-edge-capacity:yes:capacity-upper-bound"><title>はい</title><path d="M1211.333 523 V535 C1211.333 567 1200 567 1200 599 V611"/><path d="M1200 649 V661 C1200 693 1200 693 1200 725 V737" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="parent-edge-capacity:yes:capacity-upper-bound" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1160" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="1200" y="634">はい</text></g></g><g class="flow-edge no" data-edge="parent-edge-capacity:no:fallback"><title>いいえ</title><path d="M1131.333 523 V535 C1131.333 567 1062.5 567 1062.5 599 V611"/><path d="M1062.5 649 V661 C1062.5 693 990 693 990 725 V737 V940 C990 972 916.5 972 916.5 1004 V1016 V1066 C916.5 1098 878 1098 878 1130 V1142 V1322 C878 1354 1242 1354 1242 1386 V1398 V1448 C1242 1480 922 1480 922 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="parent-edge-capacity:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1022.5" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="1062.5" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="parent-edge-capacity:unknown:check"><title>わからない</title><path d="M1291.333 523 V535 C1291.333 567 1371.5 567 1371.5 599 V611"/><path d="M1371.5 649 V661 C1371.5 693 1410 693 1410 725 V737 V940 C1410 972 1410 972 1410 1004 V1016 V1066 C1410 1098 1410 1098 1410 1130 V1142 V1322 C1410 1354 1410 1354 1410 1386 V1398 V1448 C1410 1480 1354.571 1480 1354.571 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="parent-edge-capacity:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1327" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="1371.5" y="634">わからない</text></g></g><g class="flow-edge yes" data-edge="capacity-upper-bound:yes:degree-capacity-result"><title>はい</title><path d="M1200 928 V940 C1200 972 1144 972 1144 1004 V1016"/><path d="M1144 1054 V1066 C1144 1098 1144 1098 1144 1130 V1142" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="capacity-upper-bound:yes:degree-capacity-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1104" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="1144" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="capacity-upper-bound:no:fallback"><title>いいえ</title><path d="M1120 928 V940 C1120 972 1006.5 972 1006.5 1004 V1016"/><path d="M1006.5 1054 V1066 C1006.5 1098 934 1098 934 1130 V1142 V1322 C934 1354 1298 1354 1298 1386 V1398 V1448 C1298 1480 1002 1480 1002 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="capacity-upper-bound:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="966.5" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="1006.5" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="capacity-upper-bound:unknown:check"><title>わからない</title><path d="M1280 928 V940 C1280 972 1315.5 972 1315.5 1004 V1016"/><path d="M1315.5 1054 V1066 C1315.5 1098 1354 1098 1354 1130 V1142 V1322 C1354 1354 1354 1354 1354 1386 V1398 V1448 C1354 1480 1308.857 1480 1308.857 1512 V1524" marker-end="url(#arrow-tree-selection-sizes)"/><g class="flow-edge-label" data-edge-label="capacity-upper-bound:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1271" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="1315.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="rooted"><rect x="542.6666666666666" y="373" width="320" height="132" rx="7"/><text class="node-kind" x="558.6666666666666" y="393">質問</text><text class="node-title" x="558.6666666666666" y="421">根を決めると、子の結果だけから親の</text><text class="node-title" x="558.6666666666666" y="444">結果を作れますか？</text><text class="node-explanation" x="558.6666666666666" y="471">木の各辺を一度ずつたどる計算で済むか確認します。</text></g><g class="flow-node question" data-node="all-roots"><rect x="564" y="737" width="320" height="150" rx="7"/><text class="node-kind" x="580" y="757">質問</text><text class="node-title" x="580" y="785">すべての頂点を根にした場合の答えが</text><text class="node-title" x="580" y="808">必要ですか？</text><text class="node-explanation" x="580" y="835">根ごとに DFS を繰り返さず、隣接辺ごとの情報</text><text class="node-explanation" x="580" y="853">を使い回します。</text></g><g class="flow-node route" data-node="state"><rect x="200" y="737" width="320" height="121" rx="7"/><text class="node-kind" x="216" y="757">分野</text><text class="node-title" x="216" y="785">親へ伝える個数・集合・二頂点の情報</text><a href="/flowchartcp/flowcharts/#diagram-tree-parent-summary-shape" data-route="tree-parent-summary-shape"><text x="216" y="822">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1126" y="1524" width="320" height="121" rx="7"/><text class="node-kind" x="1142" y="1544">分野</text><text class="node-title" x="1142" y="1572">一辺を切った片側から伝える情報</text><a href="/flowchartcp/flowcharts/#diagram-tree-cut-side-information" data-route="tree-cut-side-information"><text x="1142" y="1609">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="tree-result"><rect x="32" y="1142" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">木 DP</text><a href="/flowchartcp/techniques/tree-dp/"><title>木DPの記事へ</title><text x="48" y="1229">木DP</text></a></g><g class="flow-node result" data-node="fallback"><rect x="762" y="1524" width="320" height="151" rx="7"/><text class="node-kind" x="778" y="1544">候補</text><text class="node-title" x="778" y="1572">辺をまたぐ状態を設計する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="778" y="1611">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="778" y="1635">反例探し</text></a></g><g class="flow-node question" data-node="exclude-one"><rect x="396" y="1142" width="320" height="132" rx="7"/><text class="node-kind" x="412" y="1162">質問</text><text class="node-title" x="412" y="1190">一つの隣接辺を除いた集計を、順序を</text><text class="node-title" x="412" y="1213">保って作れますか？</text><text class="node-explanation" x="412" y="1240">各隣接辺からの情報を接頭辞と接尾辞へまとめます。</text></g><g class="flow-node result" data-node="reroot-specific"><rect x="396" y="1524" width="320" height="175" rx="7"/><text class="node-kind" x="412" y="1544">候補</text><text class="node-title" x="412" y="1572">接頭辞・接尾辞で一辺を除く</text><a href="/flowchartcp/techniques/reroot-prefix-suffix/"><title>全方位木DPで一つの方向だけ除いて集計するの記事へ</title><text x="412" y="1611">全方位木DPで一つの方向だけ除いて集計する</text></a><a href="/flowchartcp/techniques/reroot-directed-edge-state/"><title>全方位木DPの状態を辺の向きごとに定義するの記事へ</title><text x="412" y="1635">全方位木DPの状態を辺の向きごとに定義する</text></a><a href="/flowchartcp/techniques/rerooting/"><title>全方位木DPの記事へ</title><text x="412" y="1659">全方位木DP</text></a></g><g class="flow-node question" data-node="tree-objective"><rect x="765.375" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="781.375" y="52">質問</text><text class="node-title" x="781.375" y="80">木から求める答えはどれですか？</text><text class="node-explanation" x="781.375" y="107">全体の最適値と、個数別・頂点別の答えを分けます。</text></g><g class="flow-node question" data-node="parent-edge-capacity"><rect x="1051.3333333333333" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="1067.3333333333333" y="393">質問</text><text class="node-title" x="1067.3333333333333" y="421">親への辺を選ぶかで、子へ残す辺数の</text><text class="node-title" x="1067.3333333333333" y="444">上限が一つ変わりますか？</text><text class="node-explanation" x="1067.3333333333333" y="471">親への辺を使う・使わないという二つの状態を持ち、</text><text class="node-explanation" x="1067.3333333333333" y="489">残った枠で子への辺を選びます。</text></g><g class="flow-node question" data-node="capacity-upper-bound"><rect x="1040" y="737" width="320" height="191" rx="7"/><text class="node-kind" x="1056" y="757">質問</text><text class="node-title" x="1056" y="785">辺の条件は各頂点の接続本数の上限だ</text><text class="node-title" x="1056" y="808">けで、枠を使い切る必要はありません</text><text class="node-title" x="1056" y="831">か？</text><text class="node-explanation" x="1056" y="858">選択辺の条件は各頂点の上限だけです。全体でちょう</text><text class="node-explanation" x="1056" y="876">ど K 本などの追加制約はありません。各子への辺</text><text class="node-explanation" x="1056" y="894">の正の増分だけを上限個数まで取ります。</text></g><g class="flow-node result" data-node="degree-capacity-result"><rect x="984" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="1000" y="1162">候補</text><text class="node-title" x="1000" y="1190">親への辺の有無を二状態にし、子への</text><text class="node-title" x="1000" y="1213">辺の利益を大きい順に選ぶ</text><a href="/flowchartcp/techniques/tree-dp-degree-capacity/"><title>木の接続数制限は、親の辺を選ぶかで残り枠を分けるの記事へ</title><text x="1000" y="1252">木の接続数制限は、親の辺を選ぶかで残り枠を分け</text><text x="1000" y="1270">る</text></a></g></svg>