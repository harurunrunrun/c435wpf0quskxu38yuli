<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-cut-side-information flow-desc-tree-cut-side-information" width="1112" height="943" viewBox="0 0 1112 943" data-flow-svg="tree-cut-side-information"><title id="flow-title-tree-cut-side-information">一辺を切った片側から伝える情報の解法フローチャート</title><desc id="flow-desc-tree-cut-side-information">切った辺をまたいで必要になる情報と、辺の向きごとに定める状態を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-cut-side-information" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="check:yes:edge-state"><title>はい</title><path d="M752.833 182 V194 C752.833 226 556 226 556 258 V270"/><path d="M556 308 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-tree-cut-side-information)"/><g class="flow-edge-label" data-edge-label="check:yes:edge-state" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M832.833 182 V194 C832.833 226 907 226 907 258 V270"/><path d="M907 308 V320 C907 352 1014.5 352 1014.5 384 V396 V558 C1014.5 590 1014.5 590 1014.5 622 V634 V684 C1014.5 716 920 716 920 748 V760" marker-end="url(#arrow-tree-cut-side-information)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M912.833 182 V194 C912.833 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V320 C1035.5 352 1070.5 352 1070.5 384 V396 V558 C1070.5 590 1070.5 590 1070.5 622 V634 V684 C1070.5 716 1000 716 1000 748 V760" marker-end="url(#arrow-tree-cut-side-information)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="edge-state:yes:edge-result"><title>はい</title><path d="M476 546 V558 C476 590 192 590 192 622 V634"/><path d="M192 672 V684 C192 716 192 716 192 748 V760" marker-end="url(#arrow-tree-cut-side-information)"/><g class="flow-edge-label" data-edge-label="edge-state:yes:edge-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="657">はい</text></g></g><g class="flow-edge no" data-edge="edge-state:no:fallback"><title>いいえ</title><path d="M556 546 V558 C556 590 556 590 556 622 V634"/><path d="M556 672 V684 C556 716 556 716 556 748 V760" marker-end="url(#arrow-tree-cut-side-information)"/><g class="flow-edge-label" data-edge-label="edge-state:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="edge-state:unknown:uncertain"><title>わからない</title><path d="M636 546 V558 C636 590 920 590 920 622 V634"/><path d="M920 672 V684 C920 716 840 716 840 748 V760" marker-end="url(#arrow-tree-cut-side-information)"/><g class="flow-edge-label" data-edge-label="edge-state:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="657">わからない</text></g></g><g class="flow-node question" data-node="check"><rect x="672.8333333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="688.8333333333334" y="52">質問</text><text class="node-title" x="688.8333333333334" y="80">一辺を切った片側から、反対側へ伝え</text><text class="node-title" x="688.8333333333334" y="103">る情報を定義できますか？</text><text class="node-explanation" x="688.8333333333334" y="130">木 DP と全方位木 DP のどちらでも、辺をま</text><text class="node-explanation" x="688.8333333333334" y="148">たぐ情報を明確にします。</text></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="760" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="780">分野</text><text class="node-title" x="776" y="808">条件を確かめる</text><text class="node-explanation" x="776" y="835">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="780">候補</text><text class="node-title" x="412" y="808">辺をまたぐ状態を設計する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="847">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="871">反例探し</text></a></g><g class="flow-node question" data-node="edge-state"><rect x="396" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="416">質問</text><text class="node-title" x="412" y="444">一辺を切った片側の結果を、辺の向き</text><text class="node-title" x="412" y="467">ごとに定義できますか？</text><text class="node-explanation" x="412" y="494">頂点ごとの値より、隣接辺へ渡す情報を先に定義しま</text><text class="node-explanation" x="412" y="512">す。</text></g><g class="flow-node result" data-node="edge-result"><rect x="32" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">有向辺ごとに片側の情報を持つ</text><a href="/flowchartcp/techniques/reroot-directed-edge-state/"><title>全方位木DPの状態を辺の向きごとに定義するの記事へ</title><text x="48" y="847">全方位木DPの状態を辺の向きごとに定義する</text></a><a href="/flowchartcp/techniques/rerooting/"><title>全方位木DPの記事へ</title><text x="48" y="871">全方位木DP</text></a></g></svg>