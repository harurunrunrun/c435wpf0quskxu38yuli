<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-quadratic-grid-profile-conditions flow-desc-quadratic-grid-profile-conditions" width="748" height="1411" viewBox="0 0 748 1411" data-flow-svg="quadratic-grid-profile-conditions"><title id="flow-title-quadratic-grid-profile-conditions">巨大な行数と列ごとの最小費用の解法フローチャート</title><desc id="flow-desc-quadratic-grid-profile-conditions">辺費用・移動方向・始点と処理できる制約を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-quadratic-grid-profile-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="grid-model:yes:monotone-moves"><title>はい</title><path d="M464.5 205 V217 C464.5 249 419 249 419 281 V293"/><path d="M419 331 V343 C419 375 432.5 375 432.5 407 V419" marker-end="url(#arrow-quadratic-grid-profile-conditions)"/><g class="flow-edge-label" data-edge-label="grid-model:yes:monotone-moves" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="316">はい</text></g></g><g class="flow-edge no" data-edge="grid-model:no:check"><title>いいえ</title><path d="M544.5 205 V217 C544.5 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V622 C654 654 654 654 654 686 V698 V748 C654 780 654 780 654 812 V824 V1027 C654 1059 654 1059 654 1091 V1103 V1153 C654 1185 624.571 1185 624.571 1217 V1229" marker-end="url(#arrow-quadratic-grid-profile-conditions)"/><g class="flow-edge-label" data-edge-label="grid-model:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="grid-model:unknown:check"><title>わからない</title><path d="M624.5 205 V217 C624.5 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 407 V419 V622 C710 654 710 654 710 686 V698 V748 C710 780 710 780 710 812 V824 V1027 C710 1059 710 1059 710 1091 V1103 V1153 C710 1185 670.286 1185 670.286 1217 V1229" marker-end="url(#arrow-quadratic-grid-profile-conditions)"/><g class="flow-edge-label" data-edge-label="grid-model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="monotone-moves:yes:bounds"><title>はい</title><path d="M352.5 610 V622 C352.5 654 307 654 307 686 V698"/><path d="M307 736 V748 C307 780 319.5 780 319.5 812 V824" marker-end="url(#arrow-quadratic-grid-profile-conditions)"/><g class="flow-edge-label" data-edge-label="monotone-moves:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="698" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="721">はい</text></g></g><g class="flow-edge no" data-edge="monotone-moves:no:check"><title>いいえ</title><path d="M432.5 610 V622 C432.5 654 431 654 431 686 V698"/><path d="M431 736 V748 C431 780 542 780 542 812 V824 V1027 C542 1059 542 1059 542 1091 V1103 V1153 C542 1185 533.143 1185 533.143 1217 V1229" marker-end="url(#arrow-quadratic-grid-profile-conditions)"/><g class="flow-edge-label" data-edge-label="monotone-moves:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="698" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="721">いいえ</text></g></g><g class="flow-edge unknown" data-edge="monotone-moves:unknown:check"><title>わからない</title><path d="M512.5 610 V622 C512.5 654 559.5 654 559.5 686 V698"/><path d="M559.5 736 V748 C559.5 780 598 780 598 812 V824 V1027 C598 1059 598 1059 598 1091 V1103 V1153 C598 1185 578.857 1185 578.857 1217 V1229" marker-end="url(#arrow-quadratic-grid-profile-conditions)"/><g class="flow-edge-label" data-edge-label="monotone-moves:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="698" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="721">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 1015 V1027 C239.5 1059 192 1059 192 1091 V1103"/><path d="M192 1141 V1153 C192 1185 192 1185 192 1217 V1229" marker-end="url(#arrow-quadratic-grid-profile-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1126">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 1015 V1027 C319.5 1059 319 1059 319 1091 V1103"/><path d="M319 1141 V1153 C319 1185 441.714 1185 441.714 1217 V1229" marker-end="url(#arrow-quadratic-grid-profile-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1126">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 1015 V1027 C399.5 1059 447.5 1059 447.5 1091 V1103"/><path d="M447.5 1141 V1153 C447.5 1185 487.429 1185 487.429 1217 V1229" marker-end="url(#arrow-quadratic-grid-profile-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1103" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1126">わからない</text></g></g><g class="flow-node question" data-node="grid-model"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">列番号を一つ増やす費用が現在の行番</text><text class="node-title" x="400.5" y="103">号の二乗で、行番号を一つ増やす費用</text><text class="node-title" x="400.5" y="126">はその列の固定値ですか？</text><text class="node-explanation" x="400.5" y="153">列ごとに、到着費用を行番号の関数として持ちます。</text><text class="node-explanation" x="400.5" y="171">一般の辺費用では、この関数の形を保てません。</text></g><g class="flow-node question" data-node="monotone-moves"><rect x="272.5" y="419" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">始点は行1・列1で、障害物がなく、</text><text class="node-title" x="288.5" y="490">行と列の番号を増やす二操作だけです</text><text class="node-title" x="288.5" y="513">か？</text><text class="node-explanation" x="288.5" y="540">列へ入る行を決めてから下へ進みます。費用関数の離</text><text class="node-explanation" x="288.5" y="558">散増分が非減少なので、変更されるのは末尾だけで</text><text class="node-explanation" x="288.5" y="576">す。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="824" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="844">質問</text><text class="node-title" x="175.5" y="872">行数は10^9以下、列数と問い合わ</text><text class="node-title" x="175.5" y="895">せ数は各20万以下、列費用は1..</text><text class="node-title" x="175.5" y="918">10^9ですか？</text><text class="node-explanation" x="175.5" y="945">行・列は1始まりです。一行・一列や問い合わせ0件</text><text class="node-explanation" x="175.5" y="963">も扱えます。複数の問い合わせを列順に処理し、元の</text><text class="node-explanation" x="175.5" y="981">順に返します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1229" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="1249">候補</text><text class="node-title" x="48" y="1277">二乗追加を遅延し、一定傾きを超える</text><text class="node-title" x="48" y="1300">末尾だけを直線へ置き換える</text><a href="/flowchartcp/techniques/convex-piecewise-quadratic-suffix-cap/"><title>行数が巨大な格子の最小費用を、区分二次式で保つの記事へ</title><text x="48" y="1339">行数が巨大な格子の最小費用を、区分二次式で保つ</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1229" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1249">分野</text><text class="node-title" x="412" y="1277">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1314">詳細の質問・図へ →</text></a></g></svg>