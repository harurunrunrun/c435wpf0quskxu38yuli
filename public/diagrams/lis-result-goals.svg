わからない</text></g></g><g class="flow-edge yes" data-edge="layers:yes:member-answer"><title>はい</title><path d="M167.5 974 V986 C167.5 1018 122 1018 122 1050 V1062"/><path d="M122 1100 V1112 C122 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-lis-result-goals)"/><g class="flow-edge-label" data-edge-label="layers:yes:member-answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="82" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="122" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="layers:no:check"><title>いいえ</title><path d="M247.5 974 V986 C247.5 1018 246 1018 246 1050 V1062"/><path d="M246 1100 V1112 C246 1144 792 1144 792 1176 V1188" marker-end="url(#arrow-lis-result-goals)"/><g class="flow-edge-label" data-edge-label="layers:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="206" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="246" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="layers:unknown:check"><title>わからない</title><path d="M327.5 974 V986 C327.5 1018 374.5 1018 374.5 1050 V1062"/><path d="M374.5 1100 V1112 C374.5 1144 824 1144 824 1176 V1188" marker-end="url(#arrow-lis-result-goals)"/><g class="flow-edge-label" data-edge-label="layers:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="330" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="374.5" y="1085">わからない</text></g></g><g class="flow-edge yes" data-edge="strict-count:yes:index-distinct"><title>はい</title><path d="M772.5 564 V599 C772.5 631 727 631 727 663 V675"/><path d="M727 713 V725 C727 757 740.5 757 740.5 789 V801" marker-end="url(#arrow-lis-result-goals)"/><g class="flow-edge-label" data-edge-label="strict-count:yes:index-distinct" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="687" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="727" y="698">はい</text></g></g><g class="flow-edge no" data-edge="strict-count:no:check"><title>いいえ</title><path d="M852.5 564 V599 C852.5 631 851 631 851 663 V675"/><path d="M851 713 V725 C851 757 962 757 962 789 V801 V986 C962 1018 962 1018 962 1050 V1062 V1112 C962 1144 984 1144 984 1176 V1188" marker-end="url(#arrow-lis-result-goals)"/><g class="flow-edge-label" data-edge-label="strict-count:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="811" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="851" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="strict-count:unknown:check"><title>わからない</title><path d="M932.5 564 V599 C932.5 631 979.5 631 979.5 663 V675"/><path d="M979.5 713 V725 C979.5 757 1018 757 1018 789 V801 V986 C1018 1018 1018 1018 1018 1050 V1062 V1112 C1018 1144 1016 1144 1016 1176 V1188" marker-end="url(#arrow-lis-result-goals)"/><g class="flow-edge-label" data-edge-label="strict-count:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="935" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="979.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="index-distinct:yes:count-answer"><title>はい</title><path d="M660.5 974 V986 C660.5 1018 615 1018 615 1050 V1062"/><path d="M615 1100 V1112 C615 1144 556 1144 556 1176 V1188" marker-end="url(#arrow-lis-result-goals)"/><g class="flow-edge-label" data-edge-label="index-distinct:yes:count-answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="575" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="615" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="index-distinct:no:check"><title>いいえ</title><path d="M740.5 974 V986 C740.5 1018 739 1018 739 1050 V1062"/><path d="M739 1100 V1112 C739 1144 920 1144 920 1176 V1188" marker-end="url(#arrow-lis-result-goals)"/><g class="flow-edge-label" data-edge-label="index-distinct:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="699" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="739" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="index-distinct:unknown:check"><title>わからない</title><path d="M820.5 974 V986 C820.5 1018 867.5 1018 867.5 1050 V1062"/><path d="M867.5 1100 V1112 C867.5 1144 952 1144 952 1176 V1188" marker-end="url(#arrow-lis-result-goals)"/><g class="flow-edge-label" data-edge-label="index-distinct:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="823" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="867.5" y="1085">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="606" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="622" y="52">質問</text><text class="node-title" x="622" y="80">最長の増加部分列について、何を求め</text><text class="node-title" x="622" y="103">ますか？</text><text class="node-explanation" x="622" y="130">同じ値でも位置が違う場合を区別し、列の更新がある</text><text class="node-explanation" x="622" y="148">か確認します。</text></g><g class="flow-node question" data-node="strict-member"><rect x="278" y="414" width="320" height="173" rx="7"/><text class="node-kind" x="294" y="434">質問</text><text class="node-title" x="294" y="462">固定された列から、元の順序を保ち、</text><text class="node-title" x="294" y="485">値が厳密に増える部分列を選びます</text><text class="node-title" x="294" y="508">か？</text><text class="node-explanation" x="294" y="535">値が等しい要素は続けて選べません。更新付きの列は</text><text class="node-explanation" x="294" y="553">前後の長さが変わります。</text></g><g class="flow-node question" data-node="layers"><rect x="87.5" y="801" width="320" height="173" rx="7"/><text class="node-kind" x="103.5" y="821">質問</text><text class="node-title" x="103.5" y="849">各位置で終わる長さと始まる長さを求</text><text class="node-title" x="103.5" y="872">め、全体の最長に届く位置だけを残せ</text><text class="node-title" x="103.5" y="895">ますか？</text><text class="node-explanation" x="103.5" y="922">前後の長さの和から1を引きます。必須性は、残った</text><text class="node-explanation" x="103.5" y="940">候補を前向きの長さごとに数えて判定します。</text></g><g class="flow-node question" data-node="strict-count"><rect x="692.5" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="708.5" y="434">質問</text><text class="node-title" x="708.5" y="462">固定された列の、値が厳密に増える最</text><text class="node-title" x="708.5" y="485">長の部分列を数えますか？</text><text class="node-explanation" x="708.5" y="512">値の小さい範囲から、長さ最大と同率の個数加算を一</text><text class="node-explanation" x="708.5" y="530">緒に求めます。</text></g><g class="flow-node question" data-node="index-distinct"><rect x="580.5" y="801" width="320" height="173" rx="7"/><text class="node-kind" x="596.5" y="821">質問</text><text class="node-title" x="596.5" y="849">同じ値の列になっても位置の選び方を</text><text class="node-title" x="596.5" y="872">区別し、個数を計算する法も決まって</text><text class="node-title" x="596.5" y="895">いますか？</text><text class="node-explanation" x="596.5" y="922">値の列を重複なく数える問題とは異なります。個数が</text><text class="node-explanation" x="596.5" y="940">法で0でも、存在する状態の長さは消しません。</text></g><g class="flow-node result" data-node="member-answer"><rect x="32" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">前後の長さと、各段に残る候補数で三</text><text class="node-title" x="48" y="1259">分類する</text><a href="/flowchartcp/techniques/lis-through-each-position/"><title>最長増加部分列に使える位置と必須の位置は、前後の長さと同じ段の候補数で分けるの記事へ</title><text x="48" y="1298">最長増加部分列に使える位置と必須の位置は、前後</text><text x="48" y="1316">の長さと同じ段の候補数で分ける</text></a></g><g class="flow-node result" data-node="count-answer"><rect x="396" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="412" y="1208">候補</text><text class="node-title" x="412" y="1236">長さ最大と、同じ長さの個数を組にし</text><text class="node-title" x="412" y="1259">て集約する</text><a href="/flowchartcp/techniques/lis-length-count-monoid/"><title>最長増加部分列の個数は、最大の長さと同率の個数を一緒にまとめるの記事へ</title><text x="412" y="1298">最長増加部分列の個数は、最大の長さと同率の個数</text><text x="412" y="1316">を一緒にまとめる</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="1188" width="320" height="144" rx="7"/><text class="node-kind" x="776" y="1208">分野</text><text class="node-title" x="776" y="1236">適用条件と、残す必要のある情報を確</text><text class="node-title" x="776" y="1259">かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="1296">詳細の質問・図へ →</text></a></g></svg>