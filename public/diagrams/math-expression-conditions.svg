<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-math-expression-conditions flow-desc-math-expression-conditions" width="1112" height="950" viewBox="0 0 1112 950" data-flow-svg="math-expression-conditions"><title id="flow-title-math-expression-conditions">式の積・変換の条件の解法フローチャート</title><desc id="flow-desc-math-expression-conditions">多項式の積や繰り返す変換で表せるかを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-math-expression-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="polynomial:yes:algebra-route"><title>はい</title><path d="M476 182 V194 C476 226 192 226 192 258 V270"/><path d="M192 308 V320 C192 352 192 352 192 384 V396" marker-end="url(#arrow-math-expression-conditions)"/><g class="flow-edge-label" data-edge-label="polynomial:yes:algebra-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">はい</text></g></g><g class="flow-edge no" data-edge="polynomial:no:digits"><title>いいえ</title><path d="M556 182 V194 C556 226 556 226 556 258 V270"/><path d="M556 308 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-math-expression-conditions)"/><g class="flow-edge-label" data-edge-label="polynomial:no:digits" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="polynomial:unknown:check"><title>わからない</title><path d="M636 182 V194 C636 226 920 226 920 258 V270"/><path d="M920 308 V320 C920 352 920 352 920 384 V396" marker-end="url(#arrow-math-expression-conditions)"/><g class="flow-edge-label" data-edge-label="polynomial:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M840 546 V565 C840 597 556 597 556 629 V641"/><path d="M556 679 V691 C556 723 556 723 556 755 V767" marker-end="url(#arrow-math-expression-conditions)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="641" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="664">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 546 V565 C920 597 907 597 907 629 V641"/><path d="M907 679 V691 C907 723 866.667 723 866.667 755 V767" marker-end="url(#arrow-math-expression-conditions)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="641" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="664">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 546 V565 C1000 597 1035.5 597 1035.5 629 V641"/><path d="M1035.5 679 V691 C1035.5 723 973.333 723 973.333 755 V767" marker-end="url(#arrow-math-expression-conditions)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="641" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="664">わからない</text></g></g><g class="flow-node question" data-node="polynomial"><rect x="396" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="52">質問</text><text class="node-title" x="412" y="80">多項式・数列の畳み込み・線形変換を</text><text class="node-title" x="412" y="103">扱いますか？</text><text class="node-explanation" x="412" y="130">係数の和と積、形式的な級数、繰り返し変換を区別し</text><text class="node-explanation" x="412" y="148">ます。</text></g><g class="flow-node route" data-node="digits"><rect x="396" y="396" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="416">分野</text><text class="node-title" x="412" y="444">整数の桁と上限の条件</text><text class="node-explanation" x="412" y="471">桁の出現条件、桁和の余り、整数の総和、十進区間の</text><text class="node-explanation" x="412" y="489">可除性を区別します。</text><a href="/flowchartcp/flowcharts/#diagram-math-digit-conditions" data-route="math-digit-conditions"><text x="412" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="416">質問</text><text class="node-title" x="776" y="444">答えは「個数」「最適値」「存在判</text><text class="node-title" x="776" y="467">定」のどれか区別できますか？</text><text class="node-explanation" x="776" y="494">同じ入力でも、求める量によって使う演算が異なりま</text><text class="node-explanation" x="776" y="512">す。</text></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="767" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="787">分野</text><text class="node-title" x="776" y="815">条件を確かめる</text><text class="node-explanation" x="776" y="842">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="870">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="algebra-route"><rect x="32" y="396" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="416">分野</text><text class="node-title" x="48" y="444">積の集計・同じ計算の繰り返し</text><a href="/flowchartcp/flowcharts/#diagram-algebra" data-route="algebra"><text x="48" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="767" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="787">候補</text><text class="node-title" x="412" y="815">求める量を式にする</text><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="412" y="854">寄与の数え上げ</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="878">状態の設計</text></a></g></svg>