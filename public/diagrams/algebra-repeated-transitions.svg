<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-algebra-repeated-transitions flow-desc-algebra-repeated-transitions" width="2568" height="961" viewBox="0 0 2568 961" data-flow-svg="algebra-repeated-transitions"><title id="flow-title-algebra-repeated-transitions">同じ変換の繰り返し・遠い項の解法フローチャート</title><desc id="flow-desc-algebra-repeated-transitions">同じ線形変換の繰り返し、累乗の総和、漸化式の遠い項を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-algebra-repeated-transitions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge matrix-power" data-edge="algebra-task:matrix-power:transition"><title>同じ行列や線形変換を何度も掛ける</title><path d="M1714.333 141 V153 C1714.333 185 788.5 185 788.5 217 V229"/><path d="M788.5 267 V297 C788.5 329 788.5 329 788.5 361 V373" marker-end="url(#arrow-algebra-repeated-transitions)"/><g class="flow-edge-label" data-edge-label="algebra-task:matrix-power:transition" tabindex="0" role="group" aria-label="選択肢：同じ行列や線形変換を何度も掛ける"><rect x="672.5" y="229" width="232" height="38" rx="5"/><text text-anchor="middle" x="788.5" y="252">同じ行列や線形変換を何度も掛ける</text></g></g><g class="flow-edge known-recurrence" data-edge="algebra-task:known-recurrence:recurrence"><title>係数が分かっている漸化式の遠い項</title><path d="M1767.667 141 V153 C1767.667 185 1709 185 1709 217 V229"/><path d="M1709 267 V297 C1709 329 1712 329 1712 361 V373 V553 C1712 585 1712 585 1712 617 V629 V679 C1712 711 609.333 711 609.333 743 V755" marker-end="url(#arrow-algebra-repeated-transitions)"/><g class="flow-edge-label" data-edge-label="algebra-task:known-recurrence:recurrence" tabindex="0" role="group" aria-label="選択肢：係数が分かっている漸化式の遠い項"><rect x="1593" y="229" width="232" height="38" rx="5"/><text text-anchor="middle" x="1709" y="252">係数が分かっている漸化式の遠い項</text></g></g><g class="flow-edge fit-recurrence" data-edge="algebra-task:fit-recurrence:sample