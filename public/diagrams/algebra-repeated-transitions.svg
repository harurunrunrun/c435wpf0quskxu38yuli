edge-label" data-edge-label="sample-recurrence:no:proof" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1886" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1926" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="sample-recurrence:unknown:check"><title>わからない</title><path d="M2007.5 523 V553 C2007.5 585 2054.5 585 2054.5 617 V629"/><path d="M2054.5 667 V679 C2054.5 711 1616 711 1616 743 V755" marker-end="url(#arrow-algebra-repeated-transitions)"/><g class="flow-edge-label" data-edge-label="sample-recurrence:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2010" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="2054.5" y="652">わからない</text></g></g><g class="flow-edge yes" data-edge="power-sum-check:yes:power-sum-result"><title>はい</title><path d="M2370.5 541 V553 C2370.5 585 2372 585 2372 617 V629"/><path d="M2372 667 V679 C2372 711 2012 711 2012 743 V755" marker-end="url(#arrow-algebra-repeated-transitions)"/><g class="flow-edge-label" data-edge-label="power-sum-check:yes:power-sum-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="2332" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="2372" y="652">はい</text></g></g><g class="flow-edge no" data-edge="power-sum-check:no:fallback"><title>いいえ</title><path d="M2450.5 541 V553 C2450.5 585 2496 585 2496 617 V629"/><path d="M2496 667 V679 C2496 711 2376 711 2376 743 V755" marker-end="url(#arrow-algebra-repeated-transitions)"/><g class="flow-edge-label" data-edge-label="power-sum-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2456" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="2496" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="power-sum-check:unknown:check"><title>わからない</title><path d="M2290.5 541 V553 C2290.5 585 2243.5 585 2243.5 617 V629"/><path d="M2243.5 667 V679 C2243.5 711 1744 711 1744 743 V755" marker-end="url(#arrow-algebra-repeated-transitions)"/><g class="flow-edge-label" data-edge-label="power-sum-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2199" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="2243.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="algebra-task"><rect x="1661" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1677" y="52">質問</text><text class="node-title" x="1677" y="80">数列や式の計算はどの形ですか？</text><text class="node-explanation" x="1677" y="107">積の和と、和の最小値では使う演算が異なります。</text></g><g class="flow-node question" data-node="transition"><rect x="628.5" y="373" width="320" height="132" rx="7"/><text class="node-kind" x="644.5" y="393">質問</text><text class="node-title" x="644.5" y="421">同じ線形遷移を、非常に大きい回数繰</text><text class="node-title" x="644.5" y="444">り返しますか？</text><text class="node-explanation" x="644.5" y="471">行列の大きさと行列積のコストを確認します。</text></g><g class="flow-node result" data-node="matrix"><rect x="32" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="775">候補</text><text class="node-title" x="48" y="803">行列累乗</text><a href="/flowchartcp/techniques/matrix-exponentiation/"><title>行列累乗の記事へ</title><text x="48" y="842">行列累乗</text></a></g><g class="flow-node route" data-node="recurrence"><rect x="396" y="755" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="775">分野</text><text class="node-title" x="412" y="803">漸化式の係数・初期項と求める項</text><text class="node-explanation" x="412" y="830">係数と初期項がある場合と、有限列に合う式を推測す</text><text class="node-explanation" x="412" y="848">る場合を区別します。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-recurrence-information" data-route="algebra-recurrence-information"><text x="412" y="876">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1488" y="755" width="320" height="157" rx="7"/><text class="node-kind" x="1504" y="775">分野</text><text class="node-title" x="1504" y="803">係数の逆数と指定の法</text><text class="node-explanation" x="1504" y="830">係数の逆数が必要か、指定の法で逆数が存在するかを</text><text class="node-explanation" x="1504" y="848">確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-invertibility" data-route="algebra-invertibility"><text x="1504" y="876">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="sample-recurrence"><rect x="1767.5" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="1783.5" y="393">質問</text><text class="node-title" x="1783.5" y="421">与えられた有限列に一致する、最短の</text><text class="node-title" x="1783.5" y="444">線形漸化式を求めますか？</text><text class="node-explanation" x="1783.5" y="471">無限の未来の式の証明とは異なり、有限列を満たす式</text><text class="node-explanation" x="1783.5" y="489">の探索が目的です。</text></g><g class="flow-node result" data-node="sample-result"><rect x="760" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="775">候補</text><text class="node-title" x="776" y="803">有限列を満たす線形漸化式を求める</text><a href="/flowchartcp/techniques/linear-recurrence/"><title>線形漸化式の高速計算の記事へ</title><text x="776" y="842">線形漸化式の高速計算</text></a></g><g class="flow-node result" data-node="proof"><rect x="1124" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="1140" y="775">候補</text><text class="node-title" x="1140" y="803">漸化式の根拠を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="1140" y="842">反例探し</text></a><a href="/flowchartcp/techniques/invariant/"><title>不変量の記事へ</title><text x="1140" y="866">不変量</text></a></g><g class="flow-node question" data-node="power-sum-check"><rect x="2210.5" y="373" width="320" height="168" rx="7"/><text class="node-kind" x="2226.5" y="393">質問</text><text class="node-title" x="2226.5" y="421">累乗 P と、それまでの累乗和 S</text><text class="node-title" x="2226.5" y="444"> を一緒に結合できますか？</text><text class="node-explanation" x="2226.5" y="471">長さ a と b の二つをつなぐと、累乗は </text><text class="node-explanation" x="2226.5" y="489">PaPb、累乗和は Sa+PaSb です。法が合</text><text class="node-explanation" x="2226.5" y="507">成数でも割り算は不要です。</text></g><g class="flow-node result" data-node="power-sum-result"><rect x="1852" y="755" width="320" height="174" rx="7"/><text class="node-kind" x="1868" y="775">候補</text><text class="node-title" x="1868" y="803">累乗とその累乗の総和を、一つの組と</text><text class="node-title" x="1868" y="826">して倍化する</text><a href="/flowchartcp/techniques/matrix-walk-sum-block/"><title>累乗と累乗の和を一組にして倍々に計算するの記事へ</title><text x="1868" y="865">累乗と累乗の和を一組にして倍々に計算する</text></a><a href="/flowchartcp/techniques/matrix-exponentiation/"><title>行列累乗の記事へ</title><text x="1868" y="889">行列累乗</text></a></g><g class="flow-node result" data-node="fallback"><rect x="2216" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="2232" y="775">候補</text><text class="node-title" x="2232" y="803">演算と係数の範囲を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="2232" y="842">状態の設計</text></a></g></svg>