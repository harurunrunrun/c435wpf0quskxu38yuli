<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-linear-equal-neighbors flow-desc-linear-equal-neighbors" width="916" height="1689" viewBox="0 0 916 1689" data-flow-svg="linear-equal-neighbors"><title id="flow-title-linear-equal-neighbors">一列の色の同色境界の個数の解法フローチャート</title><desc id="flow-desc-linear-equal-neighbors">色が変わる境界で列を分割し、塊ごとに色を選びます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-linear-equal-neighbors" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="line:yes:colors"><title>はい</title><path d="M623.583 182 V194 C623.583 226 560.25 226 560.25 258 V270"/><path d="M560.25 308 V320 C560.25 352 560.25 352 560.25 384 V396" marker-end="url(#arrow-linear-equal-neighbors)"/><g class="flow-edge-label" data-edge-label="line:yes:colors" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="520.25" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="560.25" y="293">はい</text></g></g><g class="flow-edge no" data-edge="line:no:fallback"><title>いいえ</title><path d="M703.583 182 V194 C703.583 226 711 226 711 258 V270"/><path d="M711 308 V320 C711 352 822 352 822 384 V396 V558 C822 590 822 590 822 622 V634 V684 C822 716 822 716 822 748 V760 V922 C822 954 822 954 822 986 V998 V1048 C822 1080 878 1080 878 1112 V1124 V1304 C878 1336 878 1336 878 1368 V1380 V1430 C878 1462 456 1462 456 1494 V1506" marker-end="url(#arrow-linear-equal-neighbors)"/><g class="flow-edge-label" data-edge-label="line:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="671" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="711" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="line:unknown:check"><title>わからない</title><path d="M783.583 182 V194 C783.583 226 839.5 226 839.5 258 V270"/><path d="M839.5 308 V320 C839.5 352 878 352 87