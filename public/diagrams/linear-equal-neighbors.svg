t x="683" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="657">わからない</text></g></g><g class="flow-edge exact" data-edge="equality-count:exact:equal-result"><title>ちょうど k 本</title><path d="M258.25 910 V922 C258.25 954 106 954 106 986 V998"/><path d="M106 1036 V1048 C106 1080 138.667 1080 138.667 1112 V1124" marker-end="url(#arrow-linear-equal-neighbors)"/><g class="flow-edge-label" data-edge-label="equality-count:exact:equal-result" tabindex="0" role="group" aria-label="選択肢：ちょうど k 本"><rect x="42" y="998" width="128" height="38" rx="5"/><text text-anchor="middle" x="106" y="1021">ちょうど k 本</text></g></g><g class="flow-edge at-most" data-edge="equality-count:at-most:equal-result"><title>k 本以下</title><path d="M322.25 910 V922 C322.25 954 258.5 954 258.5 986 V998"/><path d="M258.5 1036 V1048 C258.5 1080 245.333 1080 245.333 1112 V1124" marker-end="url(#arrow-linear-equal-neighbors)"/><g class="flow-edge-label" data-edge-label="equality-count:at-most:equal-result" tabindex="0" role="group" aria-label="選択肢：k 本以下"><rect x="214" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="258.5" y="1021">k 本以下</text></g></g><g class="flow-edge other" data-edge="equality-count:other:fallback"><title>他の複雑な位置条件もある</title><path d="M386.25 910 V922 C386.25 954 437 954 437 986 V998"/><path d="M437 1036 V1048 C437 1080 402 1080 402 1112 V1124 V1304 C402 1336 360 1336 360 1368 V1380 V1430 C360 1462 264 1462 264 1494 V1506" marker-end="url(#arrow-linear-equal-neighbors)"/><g class="flow-edge-label" data-edge-label="equality-count:other:fallback" tabindex="0" role="group" aria-label="選択肢：他の複雑な位置条件もある"><rect x="347" y="998" width="180" height="38" rx="5"/><text text-anchor="middle" x="437" y="1021">他の複雑な位置条件もある</text></g></g><g class="flow-edge unknown" data-edge="equality-count:unknown:check"><title>わからない</title><path d="M450.25 910 V922 C450.25 954 615.5 954 615.5 986 V998"/><path d="M615.5 1036 V1048 C615.5 1080 588 1080 588 1112 V1124" marker-end="url(#arrow-linear-equal-neighbors)"/><g class="flow-edge-label" data-edge-label="equality-count:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="571" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="615.5" y="1021">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 1274 V1304 C588 1336 506 1336 506 1368 V1380"/><path d="M506 1418 V1430 C506 1462 392 1462 392 1494 V1506" marker-end="url(#arrow-linear-equal-neighbors)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1380" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1403">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 1274 V1304 C668 1336 655 1336 655 1368 V1380"/><path d="M655 1418 V1430 C655 1462 670.667 1462 670.667 1494 V1506" marker-end="url(#arrow-linear-equal-neighbors)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1380" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1403">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 1274 V1304 C748 1336 783.5 1336 783.5 1368 V1380"/><path d="M783.5 1418 V1430 C783.5 1462 777.333 1462 777.333 1494 V1506" marker-end="url(#arrow-linear-equal-neighbors)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1380" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1403">わからない</text></g></g><g class="flow-node question" data-node="line"><rect x="543.5833333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="559.5833333333334" y="52">質問</text><text class="node-title" x="559.5833333333334" y="80">色は一列に並び、先頭と末尾は隣接し</text><text class="node-title" x="559.5833333333334" y="103">ませんか？</text><text class="node-explanation" x="559.5833333333334" y="130">環では先頭と末尾の一致条件も加わり、同じ式を使え</text><text class="node-explanation" x="559.5833333333334" y="148">ません。</text></g><g class="flow-node question" data-node="colors"><rect x="400.25" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="416.25" y="416">質問</text><text class="node-title" x="416.25" y="444">各位置の候補は共通の m 色で、他</text><text class="node-title" x="416.25" y="467">の位置制約はありませんか？</text><text class="node-explanation" x="416.25" y="494">同色境界を選んだ後、最初の塊は m 通り、次の塊</text><text class="node-explanation" x="416.25" y="512">は前の色以外の m−1 通りです。</text></g><g class="flow-node question" data-node="equality-count"><rect x="194.25" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="210.25" y="780">質問</text><text class="node-title" x="210.25" y="808">同色になる隣接境界の個数は、どの条</text><text class="node-title" x="210.25" y="831">件ですか？</text><text class="node-explanation" x="210.25" y="858">隣接境界は n−1 本です。n=1 や m=1 </text><text class="node-explanation" x="210.25" y="876">の境界でも式を確認します。</text></g><g class="flow-node result" data-node="equal-result"><rect x="32" y="1124" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1144">候補</text><text class="node-title" x="48" y="1172">同色境界の位置を選び、色が変わる塊</text><text class="node-title" x="48" y="1195">の個数だけ m−1 を掛ける</text><a href="/flowchartcp/techniques/coloring-equal-adjacencies/"><title>同色の隣接数を指定する色列は、同色にする境界を先に選ぶの記事へ</title><text x="48" y="1234">同色の隣接数を指定する色列は、同色にする境界を</text><text x="48" y="1252">先に選ぶ</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="1124" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="1144">質問</text><text class="node-title" x="524" y="1172">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="1195">確認できますか？</text><text class="node-explanation" x="524" y="1222">区別する対象、求める個数、操作の条件を確認しま</text><text class="node-explanation" x="524" y="1240">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1506" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1526">候補</text><text class="node-title" x="216" y="1554">条件と数え方をもう一度確かめる</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="216" y="1593">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1617">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1506" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1526">分野</text><text class="node-title" x="580" y="1554">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1591">詳細の質問・図へ →</text></a></g></svg>