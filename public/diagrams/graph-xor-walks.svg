ight="38" rx="5"/><text text-anchor="middle" x="514.5" y="1021">わからない</text></g></g><g class="flow-edge yes" data-edge="xor-offline:yes:xor-undo"><title>はい</title><path d="M688.5 887 V922 C688.5 954 643 954 643 986 V998"/><path d="M643 1036 V1048 C643 1080 668 1080 668 1112 V1124" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="xor-offline:yes:xor-undo" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="603" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="643" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="xor-offline:no:fallback"><title>いいえ</title><path d="M768.5 887 V922 C768.5 954 767 954 767 986 V998"/><path d="M767 1036 V1048 C767 1080 878 1080 878 1112 V1124 V1286 C878 1318 878 1318 878 1350 V1362 V1412 C878 1444 682 1444 682 1476 V1488 V1698 C682 1730 665 1730 665 1762 V1774 V1824 C665 1856 584 1856 584 1888 V1900" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="xor-offline:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="727" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="767" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="xor-offline:unknown:check"><title>わからない</title><path d="M848.5 887 V922 C848.5 954 895.5 954 895.5 986 V998"/><path d="M895.5 1036 V1048 C895.5 1080 934 1080 934 1112 V1124 V1286 C934 1318 934 1318 934 1350 V1362 V1412 C934 1444 892 1444 892 1476 V1488" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="xor-offline:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="851" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="895.5" y="1021">わからない</text></g></g><g class="flow-edge yes" data-edge="xor-undo:yes:xor-rollback-result"><title>はい</title><path d="M588 1274 V1286 C588 1318 531 1318 531 1350 V1362"/><path d="M531 1400 V1412 C531 1444 416 1444 416 1476 V1488" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="xor-undo:yes:xor-rollback-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="491" y="1362" width="80" height="38" rx="5"/><text text-anchor="middle" x="531" y="1385">はい</text></g></g><g class="flow-edge no" data-edge="xor-undo:no:fallback"><title>いいえ</title><path d="M668 1274 V1286 C668 1318 655 1318 655 1350 V1362"/><path d="M655 1400 V1412 C655 1444 626 1444 626 1476 V1488 V1698 C626 1730 609 1730 609 1762 V1774 V1824 C609 1856 530.667 1856 530.667 1888 V1900" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="xor-undo:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1362" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1385">いいえ</text></g></g><g class="flow-edge unknown" data-edge="xor-undo:unknown:check"><title>わからない</title><path d="M748 1274 V1286 C748 1318 783.5 1318 783.5 1350 V1362"/><path d="M783.5 1400 V1412 C783.5 1444 838.667 1444 838.667 1476 V1488" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="xor-undo:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1362" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1385">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M812 1638 V1698 C812 1730 755 1730 755 1762 V1774"/><path d="M755 1812 V1824 C755 1856 637.333 1856 637.333 1888 V1900" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="715" y="1774" width="80" height="38" rx="5"/><text text-anchor="middle" x="755" y="1797">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M892 1638 V1698 C892 1730 879 1730 879 1762 V1774"/><path d="M879 1812 V1824 C879 1856 894.667 1856 894.667 1888 V1900" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="839" y="1774" width="80" height="38" rx="5"/><text text-anchor="middle" x="879" y="1797">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M972 1638 V1698 C972 1730 1007.5 1730 1007.5 1762 V1774"/><path d="M1007.5 1812 V1824 C1007.5 1856 1001.333 1856 1001.333 1888 V1900" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="963" y="1774" width="89" height="38" rx="5"/><text text-anchor="middle" x="1007.5" y="1797">わからない</text></g></g><g class="flow-node question" data-node="revisit"><rect x="737.7407407407408" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="753.7407407407408" y="52">質問</text><text class="node-title" x="753.7407407407408" y="80">無向の辺を、同じ再訪できる経路で何</text><text class="node-title" x="753.7407407407408" y="103">度通ってもよいですか？</text><text class="node-explanation" x="753.7407407407408" y="130">頂点や辺の再訪を禁じた単純路へ、閉路の XOR </text><text class="node-explanation" x="753.7407407407408" y="148">の組合せをそのまま適用しません。</text></g><g class="flow-node question" data-node="changes"><rect x="534.7222222222223" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="550.7222222222223" y="416">質問</text><text class="node-title" x="550.7222222222223" y="444">辺は問い合わせの間に変わりますか？</text><text class="node-explanation" x="550.7222222222223" y="471">閉路で変えられる XOR の集合を、成分ごとに保</text><text class="node-explanation" x="550.7222222222223" y="489">ちます。</text></g><g class="flow-node question" data-node="static-cycle"><rect x="204.16666666666669" y="737" width="320" height="173" rx="7"/><text class="node-kind" x="220.16666666666669" y="757">質問</text><text class="node-title" x="220.16666666666669" y="785">始点からの経路 XOR と、閉路の</text><text class="node-title" x="220.16666666666669" y="808"> XOR を組み合わせて全再訪でき</text><text class="node-title" x="220.16666666666669" y="831">る経路を表せますか？</text><text class="node-explanation" x="220.16666666666669" y="858">到達先までの経路 XOR に、同じ成分内の閉路 </text><text class="node-explanation" x="220.16666666666669" y="876">XOR を足し合わせ、数値を最小にします。</text></g><g class="flow-node result" data-node="static-result"><rect x="32" y="1124" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="1144">候補</text><text class="node-title" x="48" y="1172">経路 XOR を、閉路 XOR の</text><text class="node-title" x="48" y="1195">組合せで小さくする</text><a href="/flowchartcp/techniques/xor-basis/"><title>XOR基底の記事へ</title><text x="48" y="1234">XOR基底</text></a></g><g class="flow-node question" data-node="xor-offline"><rect x="608.5" y="737" width="320" height="150" rx="7"/><text class="node-kind" x="624.5" y="757">質問</text><text class="node-title" x="624.5" y="785">全操作を先に読み、各辺の有効な時間</text><text class="node-title" x="624.5" y="808">区間を列挙できますか？</text><text class="node-explanation" x="624.5" y="835">追加と削除の間だけ、その辺を有効にする時間の分割</text><text class="node-explanation" x="624.5" y="853">を作ります。</text></g><g class="flow-node question" data-node="xor-undo"><rect x="508" y="1124" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="1144">質問</text><text class="node-title" x="524" y="1172">閉路 XOR の変更を記録し、最後</text><text class="node-title" x="524" y="1195">の変更から元に戻せますか？</text><text class="node-explanation" x="524" y="1222">基底だけでなく、成分の併合と経路 XOR の潜在</text><text class="node-explanation" x="524" y="1240">値も復元する必要があります。</text></g><g class="flow-node result" data-node="xor-rollback-result"><rect x="256" y="1488" width="320" height="198" rx="7"/><text class="node-kind" x="272" y="1508">候補</text><text class="node-title" x="272" y="1536">時間区間をたどり、閉路 XOR の</text><text class="node-title" x="272" y="1559">基底と成分情報を巻き戻す</text><a href="/flowchartcp/techniques/linear-basis-rollback/"><title>追加した数のXOR基底を、行の記録で巻き戻すの記事へ</title><text x="272" y="1598">追加した数のXOR基底を、行の記録で巻き戻す</text></a><a href="/flowchartcp/techniques/rollback-dsu/"><title>巻き戻し可能Union-Findの記事へ</title><text x="272" y="1622">巻き戻し可能Union-Find</text></a><a href="/flowchartcp/techniques/xor-basis/"><title>XOR基底の記事へ</title><text x="272" y="1646">XOR基底</text></a></g><g class="flow-node question" data-node="check"><rect x="732" y="1488" width="320" height="150" rx="7"/><text class="node-kind" x="748" y="1508">質問</text><text class="node-title" x="748" y="1536">必要な条件を、問題文と小さい例から</text><text class="node-title" x="748" y="1559">確認できますか？</text><text class="node-explanation" x="748" y="1586">どの性質が入力で保証され、どの性質を式や操作から</text><text class="node-explanation" x="748" y="1604">示す必要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="424" y="1900" width="320" height="151" rx="7"/><text class="node-kind" x="440" y="1920">候補</text><text class="node-title" x="440" y="1948">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="440" y="1987">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="440" y="2011">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="788" y="1900" width="320" height="121" rx="7"/><text class="node-kind" x="804" y="1920">分野</text><text class="node-title" x="804" y="1948">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="804" y="1985">詳細の質問・図へ →</text></a></g></svg>