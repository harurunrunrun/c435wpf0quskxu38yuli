<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-graph-xor-walks flow-desc-graph-xor-walks" width="1140" height="2083" viewBox="0 0 1140 2083" data-flow-svg="graph-xor-walks"><title id="flow-title-graph-xor-walks">辺重み XOR と時間による辺の変更の解法フローチャート</title><desc id="flow-desc-graph-xor-walks">辺の再訪を許すことと、閉路の XOR を組み合わせることを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-graph-xor-walks" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="revisit:yes:changes"><title>はい</title><path d="M817.741 182 V194 C817.741 226 694.722 226 694.722 258 V270"/><path d="M694.722 308 V320 C694.722 352 694.722 352 694.722 384 V396" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="revisit:yes:changes" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="654.7222222222223" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="694.7222222222223" y="293">はい</text></g></g><g class="flow-edge no" data-edge="revisit:no:fallback"><title>いいえ</title><path d="M897.741 182 V194 C897.741 226 935 226 935 258 V270"/><path d="M935 308 V320 C935 352 1046 352 1046 384 V396 V535 C1046 567 1046 567 1046 599 V611 V661 C1046 693 1046 693 1046 725 V737 V922 C1046 954 1046 954 1046 986 V998 V1048 C1046 1080 1046 1080 1046 1112 V1124 V1286 C1046 1318 1046 1318 1046 1350 V1362 V1412 C1046 1444 1102 1444 1102 1476 V1488 V1698 C1102 1730 1102 1730 1102 1762 V1774 V1824 C1102 1856 690.667 1856 690.667 1888 V1900" marker-end="url(#arrow-graph-xor-walks)"/><g class="flow-edge-label" data-edge-label="revisit:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="895" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="935" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="revisit:unknown:check"><title>わからない</