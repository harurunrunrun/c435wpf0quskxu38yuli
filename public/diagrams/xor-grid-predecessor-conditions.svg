<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-xor-grid-predecessor-conditions flow-desc-xor-grid-predecessor-conditions" width="748" height="1365" viewBox="0 0 748 1365" data-flow-svg="xor-grid-predecessor-conditions"><title id="flow-title-xor-grid-predecessor-conditions">一セルの誤りを含む格子更新の逆算の解法フローチャート</title><desc id="flow-desc-xor-grid-predecessor-conditions">更新や行動の規則と、扱う範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-xor-grid-predecessor-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="infinite-xor-grid:yes:one-error-step"><title>はい</title><path d="M464.5 223 V235 C464.5 267 419 267 419 299 V311"/><path d="M419 349 V361 C419 393 432.5 393 432.5 425 V437" marker-end="url(#arrow-xor-grid-predecessor-conditions)"/><g class="flow-edge-label" data-edge-label="infinite-xor-grid:yes:one-error-step" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="334">はい</text></g></g><g class="flow-edge no" data-edge="infinite-xor-grid:no:check"><title>いいえ</title><path d="M544.5 223 V235 C544.5 267 543 267 543 299 V311"/><path d="M543 349 V361 C543 393 654 393 654 425 V437 V599 C654 631 654 631 654 663 V675 V725 C654 757 654 757 654 789 V801 V981 C654 1013 654 1013 654 1045 V1057 V1107 C654 1139 624.571 1139 624.571 1171 V1183" marker-end="url(#arrow-xor-grid-predecessor-conditions)"/><g class="flow-edge-label" data-edge-label="infinite-xor-grid:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="infinite-xor-grid:unknown:check"><title>わからない</title><path d="M624.5 223 V235 C624.5 267 671.5 267 671.5 299 V311"/><path d="M671.5 349 V361 C671.5 393 710 393 710 425 V437 V599 C710 631 710 631 710 663 V675 V725 C710 757 710 757 710 789 V801 V981 C710 1013 710 1013 710 1045 V1057 V1107 C710 1139 670.286 1139 670.286 1171 V1183" marker-end="url(#arrow-xor-grid-predecessor-conditions)"/><g class="flow-edge-label" data-edge-label="infinite-xor-grid:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="one-error-step:yes:size"><title>はい</title><path d="M352.5 587 V599 C352.5 631 307 631 307 663 V675"/><path d="M307 713 V725 C307 757 319.5 757 319.5 789 V801" marker-end="url(#arrow-xor-grid-predecessor-conditions)"/><g class="flow-edge-label" data-edge-label="one-error-step:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="698">はい</text></g></g><g class="flow-edge no" data-edge="one-error-step:no:check"><title>いいえ</title><path d="M432.5 587 V599 C432.5 631 431 631 431 663 V675"/><path d="M431 713 V725 C431 757 542 757 542 789 V801 V981 C542 1013 542 1013 542 1045 V1057 V1107 C542 1139 533.143 1139 533.143 1171 V1183" marker-end="url(#arrow-xor-grid-predecessor-conditions)"/><g class="flow-edge-label" data-edge-label="one-error-step:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="one-error-step:unknown:check"><title>わからない</title><path d="M512.5 587 V599 C512.5 631 559.5 631 559.5 663 V675"/><path d="M559.5 713 V725 C559.5 757 598 757 598 789 V801 V981 C598 1013 598 1013 598 1045 V1057 V1107 C598 1139 578.857 1139 578.857 1171 V1183" marker-end="url(#arrow-xor-grid-predecessor-conditions)"/><g class="flow-edge-label" data-edge-label="one-error-step:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M239.5 969 V981 C239.5 1013 192 1013 192 1045 V1057"/><path d="M192 1095 V1107 C192 1139 192 1139 192 1171 V1183" marker-end="url(#arrow-xor-grid-predecessor-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 969 V981 C319.5 1013 319 1013 319 1045 V1057"/><path d="M319 1095 V1107 C319 1139 441.714 1139 441.714 1171 V1183" marker-end="url(#arrow-xor-grid-predecessor-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 969 V981 C399.5 1013 447.5 1013 447.5 1045 V1057"/><path d="M447.5 1095 V1107 C447.5 1139 487.429 1139 487.429 1171 V1183" marker-end="url(#arrow-xor-grid-predecessor-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="infinite-xor-grid"><rect x="384.5" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">外側を0とする無限格子で、自身と周</text><text class="node-title" x="400.5" y="103">囲8マスのXORへ同時更新します</text><text class="node-title" x="400.5" y="126">か？</text><text class="node-explanation" x="400.5" y="153">1のある範囲は有限で、初期状態は空でないものとし</text><text class="node-explanation" x="400.5" y="171">ます。切り抜き画像の外側が未知な場合とは異なりま</text><text class="node-explanation" x="400.5" y="189">す。</text></g><g class="flow-node question" data-node="one-error-step"><rect x="272.5" y="437" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="457">質問</text><text class="node-title" x="288.5" y="485">各更新後の反転は高々一マスで、初期</text><text class="node-title" x="288.5" y="508">図形の外接長方形を最小にしますか？</text><text class="node-explanation" x="288.5" y="535">誤りは任意の場所に起こり、遠くに孤立した1が増え</text><text class="node-explanation" x="288.5" y="553">る場合も含みます。更新回数0も認めます。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="801" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="821">質問</text><text class="node-title" x="175.5" y="849">観測した図形の全外接範囲が分かり、</text><text class="node-title" x="175.5" y="872">縦横はそれぞれ300以下ですか？</text><text class="node-explanation" x="175.5" y="899">両辺は正で、少なくとも一マスが1です。一段の逆算</text><text class="node-explanation" x="175.5" y="917">は面積に比例し、成功するたびに縦横が少なくとも2</text><text class="node-explanation" x="175.5" y="935">ずつ縮みます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">行と列の剰余で誤りを特定し、二方向</text><text class="node-title" x="48" y="1254">の畳み込みを逆算する</text><a href="/flowchartcp/techniques/xor-grid-predecessor-boundary-single-error/"><title>一セルの誤りがあるXOR格子更新を逆算するの記事へ</title><text x="48" y="1293">一セルの誤りがあるXOR格子更新を逆算する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1203">分野</text><text class="node-title" x="412" y="1231">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1268">詳細の質問・図へ →</text></a></g></svg>