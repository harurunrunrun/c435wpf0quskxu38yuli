<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-bounded-spread-subset-conditions flow-desc-bounded-spread-subset-conditions" width="748" height="1360" viewBox="0 0 748 1360" data-flow-svg="bounded-spread-subset-conditions"><title id="flow-title-bounded-spread-subset-conditions">重さの幅を使って範囲内の部分集合を探すの解法フローチャート</title><desc id="flow-desc-bounded-spread-subset-conditions">許容幅と重さの差、一つの添字列を返す条件を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-bounded-spread-subset-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="positive-spread-range:yes:original-index-witness"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-bounded-spread-subset-conditions)"/><g class="flow-edge-label" data-edge-label="positive-spread-range:yes:original-index-witness" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="positive-spread-range:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V576 C654 608 654 608 654 640 V652 V702 C654 734 654 734 654 766 V778 V958 C654 990 654 990 654 1022 V1034 V1084 C654 1116 624.571 1116 624.571 1148 V1160" marker-end="url(#arrow-bounded-spread-subset-conditions)"/><g class="flow-edge-label" data-edge-label="positive-spread-range:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="positive-spread-range:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V576 C710 608 710 608 710 640 V652 V702 C710 734 710 734 710 766 V778 V958 C710 990 710 990 710 1022 V1034 V1084 C710 1116 670.286 1116 670.286 1148 V1160" marker-end="url(#arrow-bounded-spread-subset-conditions)"/><g class="flow-edge-label" data-edge-label="positive-spread-range:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="original-index-witness:yes:bounds"><title>はい</title><path d="M352.5 564 V576 C352.5 608 307 608 307 640 V652"/><path d="M307 690 V702 C307 734 319.5 734 319.5 766 V778" marker-end="url(#arrow-bounded-spread-subset-conditions)"/><g class="flow-edge-label" data-edge-label="original-index-witness:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="675">はい</text></g></g><g class="flow-edge no" data-edge="original-index-witness:no:check"><title>いいえ</title><path d="M432.5 564 V576 C432.5 608 431 608 431 640 V652"/><path d="M431 690 V702 C431 734 542 734 542 766 V778 V958 C542 990 542 990 542 1022 V1034 V1084 C542 1116 533.143 1116 533.143 1148 V1160" marker-end="url(#arrow-bounded-spread-subset-conditions)"/><g class="flow-edge-label" data-edge-label="original-index-witness:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="original-index-witness:unknown:check"><title>わからない</title><path d="M512.5 564 V576 C512.5 608 559.5 608 559.5 640 V652"/><path d="M559.5 690 V702 C559.5 734 598 734 598 766 V778 V958 C598 990 598 990 598 1022 V1034 V1084 C598 1116 578.857 1116 578.857 1148 V1160" marker-end="url(#arrow-bounded-spread-subset-conditions)"/><g class="flow-edge-label" data-edge-label="original-index-witness:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 946 V958 C239.5 990 192 990 192 1022 V1034"/><path d="M192 1072 V1084 C192 1116 192 1116 192 1148 V1160" marker-end="url(#arrow-bounded-spread-subset-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 946 V958 C319.5 990 319 990 319 1022 V1034"/><path d="M319 1072 V1084 C319 1116 441.714 1116 441.714 1148 V1160" marker-end="url(#arrow-bounded-spread-subset-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 946 V958 C399.5 990 447.5 990 447.5 1022 V1034"/><path d="M447.5 1072 V1084 C447.5 1116 487.429 1116 487.429 1148 V1160" marker-end="url(#arrow-bounded-spread-subset-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1057">わからない</text></g></g><g class="flow-node question" data-node="positive-spread-range"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">重さは正で、合計の許容範囲の幅が、</text><text class="node-title" x="400.5" y="103">重さの最大差以上ですか？</text><text class="node-explanation" x="400.5" y="130">閉区間[l,u]の幅u−lがmax(w)−min</text><text class="node-explanation" x="400.5" y="148">(w)以上です。この保証があって初めて、ソート後</text><text class="node-explanation" x="400.5" y="166">の連続区間だけを探せます。</text></g><g class="flow-node question" data-node="original-index-witness"><rect x="272.5" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">個数を固定せず部分集合を一つ選び、</text><text class="node-title" x="288.5" y="485">元の添字を返せばよいですか？</text><text class="node-explanation" x="288.5" y="512">各要素は一回まで選びます。個数や順序の最適化、選</text><text class="node-explanation" x="288.5" y="530">び方の数、全ての到達和の出力は求めません。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="798">質問</text><text class="node-title" x="175.5" y="826">要素数1〜20万で、重さと範囲の両</text><text class="node-title" x="175.5" y="849">端は1〜2^31−1ですか？</text><text class="node-explanation" x="175.5" y="876">入力の個数・値・範囲・幅の条件を検査し、和を64</text><text class="node-explanation" x="175.5" y="894">ビットで計算します。掲載する一般APIは空の入力</text><text class="node-explanation" x="175.5" y="912">も解なしとして扱います。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1180">候補</text><text class="node-title" x="48" y="1208">ソート後の連続区間から、部分集合の</text><text class="node-title" x="48" y="1231">元の添字を復元する</text><a href="/flowchartcp/techniques/bounded-spread-subset-sum-sorted-window-witness/"><title>合計を範囲に収める部分集合を、重さの幅を使って一つ見つけるの記事へ</title><text x="48" y="1270">合計を範囲に収める部分集合を、重さの幅を使って</text><text x="48" y="1288">一つ見つける</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1160" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1180">分野</text><text class="node-title" x="412" y="1208">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1245">詳細の質問・図へ →</text></a></g></svg>