l="all-edge-trails:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="698" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="721">わからない</text></g></g><g class="flow-edge yes" data-edge="almost-dag-bounds:yes:result"><title>はい</title><path d="M239.5 1015 V1027 C239.5 1059 192 1059 192 1091 V1103"/><path d="M192 1141 V1153 C192 1185 192 1185 192 1217 V1229" marker-end="url(#arrow-almost-dag-routing-conditions)"/><g class="flow-edge-label" data-edge-label="almost-dag-bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1126">はい</text></g></g><g class="flow-edge no" data-edge="almost-dag-bounds:no:check"><title>いいえ</title><path d="M319.5 1015 V1027 C319.5 1059 319 1059 319 1091 V1103"/><path d="M319 1141 V1153 C319 1185 441.714 1185 441.714 1217 V1229" marker-end="url(#arrow-almost-dag-routing-conditions)"/><g class="flow-edge-label" data-edge-label="almost-dag-bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1126">いいえ</text></g></g><g class="flow-edge unknown" data-edge="almost-dag-bounds:unknown:check"><title>わからない</title><path d="M399.5 1015 V1027 C399.5 1059 447.5 1059 447.5 1091 V1103"/><path d="M447.5 1141 V1153 C447.5 1185 487.429 1185 487.429 1217 V1229" marker-end="url(#arrow-almost-dag-routing-conditions)"/><g class="flow-edge-label" data-edge-label="almost-dag-bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1103" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1126">わからない</text></g></g><g class="flow-node question" data-node="directed-simple-roles"><rect x="384.5" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">自己ループと多重辺のない有向グラフ</text><text class="node-title" x="400.5" y="103">で、送り手と受け手を同数指定します</text><text class="node-title" x="400.5" y="126">か？</text><text class="node-explanation" x="400.5" y="153">送り手と受け手は各一人以上で、同じ頂点は両方を兼</text><text class="node-explanation" x="400.5" y="171">ねません。逆向きの二辺は同時に存在しても構いませ</text><text class="node-explanation" x="400.5" y="189">ん。</text></g><g class="flow-node question" data-node="all-edge-trails"><rect x="272.5" y="437" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="457">質問</text><text class="node-title" x="288.5" y="485">各送り手から異なる受け手へ、全辺を</text><text class="node-title" x="288.5" y="508">合計一回ずつ使う経路分解の個数を求</text><text class="node-title" x="288.5" y="531">めますか？</text><text class="node-explanation" x="288.5" y="558">頂点の再訪と、送り手・受け手の途中通過を許しま</text><text class="node-explanation" x="288.5" y="576">す。送り手と受け手の対応の違いも数えます。</text></g><g class="flow-node question" data-node="almost-dag-bounds"><rect x="159.5" y="824" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="844">質問</text><text class="node-title" x="175.5" y="872">頂点数は2〜100、番号が減る辺は</text><text class="node-title" x="175.5" y="895">二本以下で、法は正の32ビット整数</text><text class="node-title" x="175.5" y="918">ですか？</text><text class="node-explanation" x="175.5" y="945">それ以外の辺は番号が増える向きです。正の32ビッ</text><text class="node-explanation" x="175.5" y="963">ト整数を法とする個数を、O(N³)時間・O(N</text><text class="node-explanation" x="175.5" y="981">²)追加領域で求めます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1229" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1249">候補</text><text class="node-title" x="48" y="1277">戻る辺を含む未完成の道の端点を追</text><text class="node-title" x="48" y="1300">い、閉じた循環を除く</text><a href="/flowchartcp/techniques/almost-dag-edge-routing-pairing-frontier-cycle-count/"><title>戻る辺が二本以下の有向グラフで、道の端を追って全辺の経路分解を数えるの記事へ</title><text x="48" y="1339">戻る辺が二本以下の有向グラフで、道の端を追って</text><text x="48" y="1357">全辺の経路分解を数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1229" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1249">分野</text><text class="node-title" x="412" y="1277">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1314">詳細の質問・図へ →</text></a></g></svg>