rker-end="url(#arrow-assignment-choice-division-goals)"/><g class="flow-edge-label" data-edge-label="purpose:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-node question" data-node="cut"><rect x="567.5" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="583.5" y="434">質問</text><text class="node-title" x="583.5" y="462">二つの側へ分けるコストを、境界の辺</text><text class="node-title" x="583.5" y="485">の容量として表せますか？</text><text class="node-explanation" x="583.5" y="512">選択肢を二値にし、元の目的値とカットの値が一致す</text><text class="node-explanation" x="583.5" y="530">るか確認します。</text></g><g class="flow-node question" data-node="nonbipartite"><rect x="592" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="608" y="798">質問</text><text class="node-title" x="608" y="826">二部でないグラフの一対一対応です</text><text class="node-title" x="608" y="849">か？</text><text class="node-explanation" x="608" y="876">一般グラフのマッチングを、通常の二部マッチング用</text><text class="node-explanation" x="608" y="894">フローへそのまま変換しないようにします。</text></g><g class="flow-node route" data-node="check"><rect x="760" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="1162">分野</text><text class="node-title" x="776" y="1190">合法な割当と数量の対応</text><a href="/flowchartcp/flowcharts/#diagram-assignment-integer-representation" data-route="assignment-integer-representation"><text x="776" y="1227">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="mincut"><rect x="228" y="778" width="320" height="127" rx="7"/><text class="node-kind" x="244" y="798">候補</text><text class="node-title" x="244" y="826">最小カット</text><a href="/flowchartcp/techniques/max-flow/"><title>最大流・最小カットの記事へ</title><text x="244" y="865">最大流・最小カット</text></a></g><g class="flow-node result" data-node="matching-general"><rect x="32" y="1142" width="320" height="174" rx="7"/><text class="node-kind" x="48" 