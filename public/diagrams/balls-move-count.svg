8" rx="5"/><text text-anchor="middle" x="727.5" y="1039">わからない</text></g></g><g class="flow-edge yes" data-edge="exact-boundary:yes:exact-result"><title>はい</title><path d="M476 1310 V1322 C476 1354 304 1354 304 1386 V1398"/><path d="M304 1436 V1448 C304 1480 304 1480 304 1512 V1524" marker-end="url(#arrow-balls-move-count)"/><g class="flow-edge-label" data-edge-label="exact-boundary:yes:exact-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="264" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="304" y="1421">はい</text></g></g><g class="flow-edge no" data-edge="exact-boundary:no:fallback"><title>いいえ</title><path d="M556 1310 V1322 C556 1354 514 1354 514 1386 V1398"/><path d="M514 1436 V1448 C514 1480 514 1480 514 1512 V1524 V1704 C514 1736 472 1736 472 1768 V1780 V1830 C472 1862 376 1862 376 1894 V1906" marker-end="url(#arrow-balls-move-count)"/><g class="flow-edge-label" data-edge-label="exact-boundary:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="474" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="514" y="1421">いいえ</text></g></g><g class="flow-edge unknown" data-edge="exact-boundary:unknown:check"><title>わからない</title><path d="M636 1310 V1322 C636 1354 671.5 1354 671.5 1386 V1398"/><path d="M671.5 1436 V1448 C671.5 1480 684 1480 684 1512 V1524" marker-end="url(#arrow-balls-move-count)"/><g class="flow-edge-label" data-edge-label="exact-boundary:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="1398" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="1421">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M700 1674 V1704 C700 1736 618 1736 618 1768 V1780"/><path d="M618 1818 V1830 C618 1862 504 1862 504 1894 V1906" marker-end="url(#arrow-balls-move-count)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="578" y="1780" width="80" height="38" rx="5"/><text text-anchor="middle" x="618" y="1803">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M780 1674 V1704 C780 1736 767 1736 767 1768 V1780"/><path d="M767 1818 V1830 C767 1862 782.667 1862 782.667 1894 V1906" marker-end="url(#arrow-balls-move-count)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="727" y="1780" width="80" height="38" rx="5"/><text text-anchor="middle" x="767" y="1803">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M860 1674 V1704 C860 1736 895.5 1736 895.5 1768 V1780"/><path d="M895.5 1818 V1830 C895.5 1862 889.333 1862 889.333 1894 V1906" marker-end="url(#arrow-balls-move-count)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="851" y="1780" width="89" height="38" rx="5"/><text text-anchor="middle" x="895.5" y="1803">わからない</text></g></g><g class="flow-node question" data-node="initial"><rect x="657.2037037037038" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="673.2037037037038" y="52">質問</text><text class="node-title" x="673.2037037037038" y="80">区別する n 個の箱に各一個から始</text><text class="node-title" x="673.2037037037038" y="103">め、同じ物一個を任意の別の箱へ移せ</text><text class="node-title" x="673.2037037037038" y="126">ますか？</text><text class="node-explanation" x="673.2037037037038" y="153">最終配分だけを数えます。操作列の違いは数えず、全</text><text class="node-explanation" x="673.2037037037038" y="171">ての箱の組の間で移せます。</text></g><g class="flow-node question" data-node="box-count"><rect x="517.1111111111111" y="419" width="320" height="168" rx="7"/><text class="node-kind" x="533.1111111111111" y="439">質問</text><text class="node-title" x="533.1111111111111" y="467">箱数は 3 以上で法より小さく、箱</text><text class="node-title" x="533.1111111111111" y="490">数分の階乗表を保存できますか？</text><text class="node-explanation" x="533.1111111111111" y="517">掲載実装は n≥3 と非負の移動回数を扱います。</text><text class="node-explanation" x="533.1111111111111" y="535">一箱・二箱では、ちょうど回数の到達条件を別に考え</text><text class="node-explanation" x="533.1111111111111" y="553">ます。</text></g><g class="flow-node question" data-node="moves"><rect x="320.8333333333333" y="801" width="320" height="127" rx="7"/><text class="node-kind" x="336.8333333333333" y="821">質問</text><text class="node-title" x="336.8333333333333" y="849">移動回数の条件はどれですか？</text><text class="node-explanation" x="336.8333333333333" y="876">最少で作れる回数と、余分な往復を含めてちょうど行</text><text class="node-explanation" x="336.8333333333333" y="894">う回数を分けます。</text></g><g class="flow-node question" data-node="exact-boundary"><rect x="396" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="412" y="1162">質問</text><text class="node-title" x="412" y="1190">k=0,1 を別扱いし、余分な操作</text><text class="node-title" x="412" y="1213">を挿入できる条件を確認できますか？</text><text class="node-explanation" x="412" y="1240">三箱以上では、一回の移動を第三の箱を経由する二回</text><text class="node-explanation" x="412" y="1258">に置き換えられます。初期状態への復帰は二回・三回</text><text class="node-explanation" x="412" y="1276">を使えます。k=1 では初期配分へ戻れません。</text></g><g class="flow-node result" data-node="at-most-result"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">空箱を選び、残った箱への非負の増加</text><text class="node-title" x="48" y="1213">分を仕切りで数える</text><a href="/flowchartcp/techniques/redistribution-zero-count/"><title>各箱に一個からの再分配は、空の箱の数で最小移動回数を数えるの記事へ</title><text x="48" y="1252">各箱に一個からの再分配は、空の箱の数で最小移動</text><text x="48" y="1270">回数を数える</text></a></g><g class="flow-node result" data-node="exact-result"><rect x="144" y="1524" width="320" height="168" rx="7"/><text class="node-kind" x="160" y="1544">候補</text><text class="node-title" x="160" y="1572">空箱数で数え、ちょうど回数にする余</text><text class="node-title" x="160" y="1595">分な操作と小さい境界を分ける</text><a href="/flowchartcp/techniques/redistribution-zero-count/"><title>各箱に一個からの再分配は、空の箱の数で最小移動回数を数えるの記事へ</title><text x="160" y="1634">各箱に一個からの再分配は、空の箱の数で最小移動</text><text x="160" y="1652">回数を数える</text></a></g><g class="flow-node question" data-node="check"><rect x="620" y="1524" width="320" height="150" rx="7"/><text class="node-kind" x="636" y="1544">質問</text><text class="node-title" x="636" y="1572">必要な条件を、問題文と小さい例から</text><text class="node-title" x="636" y="1595">確認できますか？</text><text class="node-explanation" x="636" y="1622">区別する対象、求める個数、操作の条件を確認しま</text><text class="node-explanation" x="636" y="1640">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="312" y="1906" width="320" height="151" rx="7"/><text class="node-kind" x="328" y="1926">候補</text><text class="node-title" x="328" y="1954">条件と数え方をもう一度確かめる</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="328" y="1993">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="328" y="2017">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="676" y="1906" width="320" height="121" rx="7"/><text class="node-kind" x="692" y="1926">分野</text><text class="node-title" x="692" y="1954">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="692" y="1991">詳細の質問・図へ →</text></a></g></svg>