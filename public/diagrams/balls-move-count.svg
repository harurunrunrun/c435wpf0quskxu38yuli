<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-balls-move-count flow-desc-balls-move-count" width="1028" height="2089" viewBox="0 0 1028 2089" data-flow-svg="balls-move-count"><title id="flow-title-balls-move-count">一個ずつの移動による配分の解法フローチャート</title><desc id="flow-desc-balls-move-count">最少移動回数を空箱の個数に置き換えます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-balls-move-count" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="initial:yes:box-count"><title>はい</title><path d="M737.204 205 V217 C737.204 249 677.111 249 677.111 281 V293"/><path d="M677.111 331 V343 C677.111 375 677.111 375 677.111 407 V419" marker-end="url(#arrow-balls-move-count)"/><g class="flow-edge-label" data-edge-label="initial:yes:box-count" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="637.1111111111111" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="677.1111111111111" y="316">はい</text></g></g><g class="flow-edge no" data-edge="initial:no:fallback"><title>いいえ</title><path d="M817.204 205 V217 C817.204 249 823 249 823 281 V293"/><path d="M823 331 V343 C823 375 934 375 934 407 V419 V599 C934 631 934 631 934 663 V675 V725 C934 757 934 757 934 789 V801 V940 C934 972 934 972 934 1004 V1016 V1066 C934 1098 934 1098 934 1130 V1142 V1322 C934 1354 934 1354 934 1386 V1398 V1448 C934 1480 990 1480 990 1512 V1524 V1704 C990 1736 990 1736 990 1768 V1780 V1830 C990 1862 568 1862 568 1894 V1906" marker-end="url(#arrow-balls-move-count)"/><g class="flow-edge-label" data-edge-label="initial:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="783" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="823" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="initial:unknown:check"><title>わからない</title><path d="M897.204 205 V217 C897.2