allback"><title>はい</title><path d="M588 892 V940 C588 972 450 972 450 1004 V1016"/><path d="M450 1054 V1066 C450 1098 384 1098 384 1130 V1142" marker-end="url(#arrow-even-outdegree-edge-directions)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 892 V940 C668 972 655 972 655 1004 V1016"/><path d="M655 1054 V1066 C655 1098 614.667 1098 614.667 1130 V1142" marker-end="url(#arrow-even-outdegree-edge-directions)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 892 V940 C748 972 783.5 972 783.5 1004 V1016"/><path d="M783.5 1054 V1066 C783.5 1098 721.333 1098 721.333 1130 V1142" marker-end="url(#arrow-even-outdegree-edge-directions)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">無向の単純グラフで、各辺を一方向へ</text><text class="node-title" x="475.7222222222223" y="103">自由に向けられますか？</text><text class="node-explanation" x="475.7222222222223" y="130">辺の向きに固定条件はなく、強連結性は要求しませ</text><text class="node-explanation" x="475.7222222222223" y="148">ん。</text></g><g class="flow-node question" data-node="goal"><rect x="260.6666666666667" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">全頂点の出次数を偶数にする一例、ま</text><text class="node-title" x="276.6666666666667" y="467">たは不可能の判定を求めますか？</text><text class="node-explanation" x="276.6666666666667" y="494">連結でなくてもよく、成分ごとに条件を満たす必要が</text><text class="node-explanation" x="276.6666666666667" y="512">あります。</text></g><g class="flow-node result" data-node="orientation-result"><rect x="32" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">各成分の辺数を確かめ、子から親へ向</text><text class="node-title" x="48" y="831">きを決める</text><a href="/flowchartcp/techniques/even-outdegree-orientation/"><title>全出次数を偶数にする向き付けは、各成分の辺数を確かめて葉から親辺で直すの記事へ</title><text x="48" y="870">全出次数を偶数にする向き付けは、各成分の辺数を</text><text x="48" y="888">確かめて葉から親辺で直す</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="760" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="780">質問</text><text class="node-title" x="524" y="808">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="831">確認できますか？</text><text class="node-explanation" x="524" y="858">操作の条件と、求める個数・値・順序を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1142" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1162">候補</text><text class="node-title" x="160" y="1190">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1229">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1253">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1162">分野</text><text class="node-title" x="524" y="1190">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1227">詳細の質問・図へ →</text></a></g></svg>