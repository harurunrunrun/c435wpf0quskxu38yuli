edge-tour)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1439">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 1310 V1340 C668 1372 655 1372 655 1404 V1416"/><path d="M655 1454 V1466 C655 1498 670.667 1498 670.667 1530 V1542" marker-end="url(#arrow-graph-edge-tour)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1439">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 1310 V1340 C748 1372 783.5 1372 783.5 1404 V1416"/><path d="M783.5 1454 V1466 C783.5 1498 777.333 1498 777.333 1530 V1542" marker-end="url(#arrow-graph-edge-tour)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1416" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1439">わからない</text></g></g><g class="flow-node question" data-node="directed"><rect x="549.0185185185186" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="565.0185185185186" y="52">質問</text><text class="node-title" x="565.0185185185186" y="80">辺には向きがあり、指定した始点から</text><text class="node-title" x="565.0185185185186" y="103">指定した終点へ進みますか？</text><text class="node-explanation" x="565.0185185185186" y="130">ここでは有向辺を一回ずつ使う経路を扱います。無向</text><text class="node-explanation" x="565.0185185185186" y="148">では次数の偶奇など別の条件になります。</text></g><g class="flow-node question" data-node="degree-difference"><rect x="416.55555555555554" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="432.55555555555554" y="416">質問</text><text class="node-title" x="432.55555555555554" y="444">入る辺と出る辺の差を、始点・終点の</text><text class="node-title" x="432.55555555555554" y="467">必要条件として判定できますか？</text><text class="node-explanation" x="432.55555555555554" y="494">条件に合わなければ経路は存在しません。合う場合で</text><text class="node-explanation" x="432.55555555555554" y="512">も別成分の閉路が残る場合があるため、次に使用した</text><text class="node-explanation" x="432.55555555555554" y="530">全辺を確認します。</text></g><g class="flow-node question" data-node="edge-coverage"><rect x="243.16666666666669" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="259.1666666666667" y="798">質問</text><text class="node-title" x="259.1666666666667" y="826">組み立てた経路がすべての辺を使った</text><text class="node-title" x="259.1666666666667" y="849">か、辺数で検査できますか？</text><text class="node-explanation" x="259.1666666666667" y="876">次数条件を満たしても、別の成分に均衡した閉路が残</text><text class="node-explanation" x="259.1666666666667" y="894">る場合があります。元の辺数と一致しなければ経路な</text><text class="node-explanation" x="259.1666666666667" y="912">しと判定します。</text></g><g class="flow-node result" data-node="edge-tour-result"><rect x="32" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1180">候補</text><text class="node-title" x="48" y="1208">使い終えた頂点を逆順に並べ、全辺を</text><text class="node-title" x="48" y="1231">使ったことを検査する</text><a href="/flowchartcp/techniques/euler-degree-connectivity/"><title>すべての有向辺を一度ずつ通る経路を、次数と辺の消費で作るの記事へ</title><text x="48" y="1270">すべての有向辺を一度ずつ通る経路を、次数と辺の</text><text x="48" y="1288">消費で作る</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="1160" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="1180">質問</text><text class="node-title" x="524" y="1208">入力例から、判定に使う条件を一つず</text><text class="node-title" x="524" y="1231">つ確かめられますか？</text><text class="node-explanation" x="524" y="1258">どの条件が問題文で保証され、どの条件を証明する必</text><text class="node-explanation" x="524" y="1276">要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1542" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1562">候補</text><text class="node-title" x="216" y="1590">必要な条件を小さい例で確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="216" y="1629">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1653">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1542" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1562">分野</text><text class="node-title" x="580" y="1590">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1627">詳細の質問・図へ →</text></a></g></svg>