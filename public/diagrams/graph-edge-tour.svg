<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-graph-edge-tour flow-desc-graph-edge-tour" width="916" height="1725" viewBox="0 0 916 1725" data-flow-svg="graph-edge-tour"><title id="flow-title-graph-edge-tour">すべての辺を一回使う経路の解法フローチャート</title><desc id="flow-desc-graph-edge-tour">各頂点を一回使う条件と、各辺を一回使う条件を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-graph-edge-tour" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="directed:yes:degree-difference"><title>はい</title><path d="M629.019 182 V194 C629.019 226 576.556 226 576.556 258 V270"/><path d="M576.556 308 V320 C576.556 352 576.556 352 576.556 384 V396" marker-end="url(#arrow-graph-edge-tour)"/><g class="flow-edge-label" data-edge-label="directed:yes:degree-difference" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="536.5555555555555" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="576.5555555555555" y="293">はい</text></g></g><g class="flow-edge no" data-edge="directed:no:fallback"><title>いいえ</title><path d="M709.019 182 V194 C709.019 226 711 226 711 258 V270"/><path d="M711 308 V320 C711 352 822 352 822 384 V396 V576 C822 608 822 608 822 640 V652 V702 C822 734 822 734 822 766 V778 V958 C822 990 822 990 822 1022 V1034 V1084 C822 1116 878 1116 878 1148 V1160 V1340 C878 1372 878 1372 878 1404 V1416 V1466 C878 1498 456 1498 456 1530 V1542" marker-end="url(#arrow-graph-edge-tour)"/><g class="flow-edge-label" data-edge-label="directed:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="671" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="711" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="directed:unknown:check"><title>わからない</title><path d="M789.019 182 V194 C789.019 226 839.5 226 839.5 258 V270"/><path d="M839.5 308 V320 C8