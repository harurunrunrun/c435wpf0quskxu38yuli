<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-fixed-count-signed-product flow-desc-fixed-count-signed-product" width="860" height="1371" viewBox="0 0 860 1371" data-flow-svg="fixed-count-signed-product"><title id="flow-title-fixed-count-signed-product">固定個数の積と符号の交換の解法フローチャート</title><desc id="flow-desc-fixed-count-signed-product">絶対値上位の符号を調べ、正にできる境界交換と零・負の場合を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-fixed-count-signed-product" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:ordering"><title>はい</title><path d="M539.722 205 V217 C539.722 249 420.667 249 420.667 281 V293"/><path d="M420.667 331 V343 C420.667 375 420.667 375 420.667 407 V419" marker-end="url(#arrow-fixed-count-signed-product)"/><g class="flow-edge-label" data-edge-label="model:yes:ordering" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="316">はい</text></g></g><g class="flow-edge no" data-edge="model:no:fallback"><title>いいえ</title><path d="M619.722 205 V217 C619.722 249 655 249 655 281 V293"/><path d="M655 331 V343 C655 375 762.5 375 762.5 407 V419 V581 C762.5 613 762.5 613 762.5 645 V657 V707 C762.5 739 458 739 458 771 V783 V986 C458 1018 360 1018 360 1050 V1062 V1112 C360 1144 304 1144 304 1176 V1188" marker-end="url(#arrow-fixed-count-signed-product)"/><g class="flow-edge-label" data-edge-label="model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M699.722 205 V217 C699.722 249 783.5 249 783.5 281 V293"/><path d="M783.5 331 V343 C783.5 375 818.5 375 818.5 407 V419 V581 C818.5 613 818.5 613 818.5 645 V657 V707 C818.5 739 721.333 739 721.333 771 V783" marker-end="url(#arrow-fixed-count-signed-product)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="ordering:yes:product-result"><title>はい</title><path d="M340.667 569 V581 C340.667 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-fixed-count-signed-product)"/><g class="flow-edge-label" data-edge-label="ordering:yes:product-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="ordering:no:fallback"><title>いいえ</title><path d="M420.667 569 V581 C420.667 613 402 613 402 645 V657"/><path d="M402 695 V707 C402 739 402 739 402 771 V783 V986 C402 1018 304 1018 304 1050 V1062 V1112 C304 1144 224 1144 224 1176 V1188" marker-end="url(#arrow-fixed-count-signed-product)"/><g class="flow-edge-label" data-edge-label="ordering:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="ordering:unknown:check"><title>わからない</title><path d="M500.667 569 V581 C500.667 613 668 613 668 645 V657"/><path d="M668 695 V707 C668 739 614.667 739 614.667 771 V783" marker-end="url(#arrow-fixed-count-signed-product)"/><g class="flow-edge-label" data-edge-label="ordering:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 915 V986 C588 1018 450 1018 450 1050 V1062"/><path d="M450 1100 V1112 C450 1144 384 1144 384 1176 V1188" marker-end="url(#arrow-fixed-count-signed-product)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 915 V986 C668 1018 655 1018 655 1050 V1062"/><path d="M655 1100 V1112 C655 1144 614.667 1144 614.667 1176 V1188" marker-end="url(#arrow-fixed-count-signed-product)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 915 V986 C748 1018 783.5 1018 783.5 1050 V1062"/><path d="M783.5 1100 V1112 C783.5 1144 721.333 1144 721.333 1176 V1188" marker-end="url(#arrow-fixed-count-signed-product)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1085">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="459.7222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">負や零を含む整数から、1≤K≤N </text><text class="node-title" x="475.7222222222223" y="103">の任意の K 個を選んだ積を最大に</text><text class="node-title" x="475.7222222222223" y="126">しますか？</text><text class="node-explanation" x="475.7222222222223" y="153">同じ値も入力の添字ごとに一個です。必ず K 個を</text><text class="node-explanation" x="475.7222222222223" y="171">選び、空集合は対象にしません。</text></g><g class="flow-node question" data-node="ordering"><rect x="260.6666666666667" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="439">質問</text><text class="node-title" x="276.6666666666667" y="467">選択は真の整数の積の大小で決め、法</text><text class="node-title" x="276.6666666666667" y="490">を使うなら選択後だけですか？</text><text class="node-explanation" x="276.6666666666667" y="517">積の剰余の大小は、元の積の大小を保ちません。正の</text><text class="node-explanation" x="276.6666666666667" y="535">積が作れない場合も、零と負の積を分けます。</text></g><g class="flow-node result" data-node="product-result"><rect x="32" y="783" width="320" height="191" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">絶対値上位 K 個の符号を確認し、</text><text class="node-title" x="48" y="854">境界の符号交換か零・最小絶対値を選</text><text class="node-title" x="48" y="877">ぶ</text><a href="/flowchartcp/techniques/maximum-product-sign-exchange/"><title>負数を含むK個の積最大化は、絶対値の上位から符号を一回の交換で直すの記事へ</title><text x="48" y="916">負数を含むK個の積最大化は、絶対値の上位から符</text><text x="48" y="934">号を一回の交換で直す</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="783" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="803">質問</text><text class="node-title" x="524" y="831">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="854">確認できますか？</text><text class="node-explanation" x="524" y="881">時間、順番、使える回数と目的値を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1188" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1208">候補</text><text class="node-title" x="160" y="1236">条件と選び方をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1275">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1299">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1188" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1208">分野</text><text class="node-title" x="524" y="1236">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1273">詳細の質問・図へ →</text></a></g></svg>