<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-count-equivalent-arrangements flow-desc-count-equivalent-arrangements" width="1168" height="949" viewBox="0 0 1168 949" data-flow-svg="count-equivalent-arrangements"><title id="flow-title-count-equivalent-arrangements">同じとみなす配置の解法フローチャート</title><desc id="flow-desc-count-equivalent-arrangements">回転や裏返しで同じとみなす配置を数えます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-count-equivalent-arrangements" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge rotation" data-edge="identity-kind:rotation:necklace-route"><title>環の色列を、回転したものだけ同一視する</title><path d="M593.75 182 V194 C593.75 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-count-equivalent-arrangements)"/><g class="flow-edge-label" data-edge-label="identity-kind:rotation:necklace-route" tabindex="0" role="group" aria-label="選択肢：環の色列を、回転したものだけ同一視する"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">環の色列を、回転したものだけ同一視</text><text text-anchor="middle" x="192" y="311">する</text></g></g><g class="flow-edge reflection" data-edge="identity-kind:reflection:bracelet-route"><title>環の色列を、回転・裏返ししたものを同一視する</title><path d="M657.75 182 V194 C657.75 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-count-equivalent-arrangements)"/><g class="flow-edge-label" data-edge-label="identity-kind:reflection:bracelet-route" tabindex="0" role="group" aria-label="選択肢：環の色列を、回転・裏返ししたものを同一視する"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">環の色列を、回転・裏返ししたものを</text><text text-anchor="middle" x="556" y="311">同一視する</text></g></g><g class="flow-edge other" data-edge="identity-kind:other:symmetry"><title>その他の回転・付け替え</title><path d="M721.75 182 V194 C721.75 226 919.5 226 919.5 258 V270"/><path d="M919.5 308 V338 C919.5 370 920 370 920 402 V414" marker-end="url(#arrow-count-equivalent-arrangements)"/><g class="flow-edge-label" data-edge-label="identity-kind:other:symmetry" tabindex="0" role="group" aria-label="選択肢：その他の回転・付け替え"><rect x="836" y="270" width="167" height="38" rx="5"/><text text-anchor="middle" x="919.5" y="293">その他の回転・付け替え</text></g></g><g class="flow-edge unknown" data-edge="identity-kind:unknown:check"><title>わからない</title><path d="M785.75 182 V194 C785.75 226 1091.5 226 1091.5 258 V270"/><path d="M1091.5 308 V338 C1091.5 370 1130 370 1130 402 V414 V558 C1130 590 1070.5 590 1070.5 622 V634 V684 C1070.5 716 1029.333 716 1029.333 748 V760" marker-end="url(#arrow-count-equivalent-arrangements)"/><g class="flow-edge-label" data-edge-label="identity-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="symmetry:yes:symmetry-result"><title>はい</title><path d="M840 546 V558 C840 590 248 590 248 622 V634"/><path d="M248 672 V684 C248 716 248 716 248 748 V760" marker-end="url(#arrow-count-equivalent-arrangements)"/><g class="flow-edge-label" data-edge-label="symmetry:yes:symmetry-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="657">はい</text></g></g><g class="flow-edge no" data-edge="symmetry:no:subsets"><title>いいえ</title><path d="M920 546 V558 C920 590 612 590 612 622 V634"/><path d="M612 672 V684 C612 716 612 716 612 748 V760" marker-end="url(#arrow-count-equivalent-arrangements)"/><g class="flow-edge-label" data-edge-label="symmetry:no:subsets" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="symmetry:unknown:check"><title>わからない</title><path d="M1000 546 V558 C1000 590 976 590 976 622 V634"/><path d="M976 672 V684 C976 716 922.667 716 922.667 748 V760" marker-end="url(#arrow-count-equivalent-arrangements)"/><g class="flow-edge-label" data-edge-label="symmetry:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="657">わからない</text></g></g><g class="flow-node question" data-node="identity-kind"><rect x="529.75" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="545.75" y="52">質問</text><text class="node-title" x="545.75" y="80">何を動かして同じ配置とみなします</text><text class="node-title" x="545.75" y="103">か？</text><text class="node-explanation" x="545.75" y="130">回転だけと、反転も認める場合は、固定される配置の</text><text class="node-explanation" x="545.75" y="148">数が異なります。</text></g><g class="flow-node route" data-node="necklace-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">回転で同じになる環の色列</text><a href="/flowchartcp/flowcharts/#diagram-colored-necklaces" data-route="colored-necklaces"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="bracelet-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">反転も認める環の色列</text><a href="/flowchartcp/flowcharts/#diagram-colored-bracelets" data-route="colored-bracelets"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="symmetry"><rect x="760" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="776" y="434">質問</text><text class="node-title" x="776" y="462">回転・並べ替えなどで同じものになる</text><text class="node-title" x="776" y="485">状態がありますか？</text><text class="node-explanation" x="776" y="512">代表を選ぶか、同値類の大きさの違いを考慮します。</text></g><g class="flow-node route" data-node="check"><rect x="816" y="760" width="320" height="157" rx="7"/><text class="node-kind" x="832" y="780">分野</text><text class="node-title" x="832" y="808">数え方を小さい例で確かめる</text><text class="node-explanation" x="832" y="835">一つの対象を何回数えるか、重複や空集合を含めて確</text><text class="node-explanation" x="832" y="853">認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-small-enumeration" data-route="count-small-enumeration"><text x="832" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="symmetry-result"><rect x="88" y="760" width="320" height="127" rx="7"/><text class="node-kind" x="104" y="780">候補</text><text class="node-title" x="104" y="808">同値な状態をまとめる</text><a href="/flowchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="104" y="847">対称性</text></a></g><g class="flow-node route" data-node="subsets"><rect x="452" y="760" width="320" height="157" rx="7"/><text class="node-kind" x="468" y="780">分野</text><text class="node-title" x="468" y="808">部分集合の値の集計</text><text class="node-explanation" x="468" y="835">部分集合に沿った集計か、桁を順に選ぶ数え上げかを</text><text class="node-explanation" x="468" y="853">確認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-subset-aggregation" data-route="count-subset-aggregation"><text x="468" y="881">詳細の質問・図へ →</text></a></g></svg>