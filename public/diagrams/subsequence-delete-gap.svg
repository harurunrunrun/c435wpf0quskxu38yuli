:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="contained:yes:one-gap"><title>はい</title><path d="M539.722 182 V194 C539.722 226 420.667 226 420.667 258 V270"/><path d="M420.667 308 V320 C420.667 352 420.667 352 420.667 384 V396" marker-end="url(#arrow-subsequence-delete-gap)"/><g class="flow-edge-label" data-edge-label="contained:yes:one-gap" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="contained:no:fallback"><title>いいえ</title><path d="M619.722 182 V194 C619.722 226 655 226 655 258 V270"/><path d="M655 308 V320 C655 352 762.5 352 762.5 384 V396 V599 C762.5 631 762.5 631 762.5 663 V675 V725 C762.5 757 458 757 458 789 V801 V981 C458 1013 360 1013 360 1045 V1057 V1107 C360 1139 304 1139 304 1171 V1183" marker-end="url(#arrow-subsequence-delete-gap)"/><g class="flow-edge-label" data-edge-label="contained:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="contained:unknown:check"><title>わからない</title><path d="M699.722 182 V194 C699.722 226 783.5 226 783.5 258 V270"/><path d="M783.5 308 V320 C783.5 352 818.5 352 818.