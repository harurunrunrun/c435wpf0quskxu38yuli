013 450 1045 V1057"/><path d="M450 1095 V1107 C450 1139 384 1139 384 1171 V1183" marker-end="url(#arrow-subsequence-delete-gap)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 951 V981 C668 1013 655 1013 655 1045 V1057"/><path d="M655 1095 V1107 C655 1139 614.667 1139 614.667 1171 V1183" marker-end="url(#arrow-subsequence-delete-gap)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 951 V981 C748 1013 783.5 1013 783.5 1045 V1057"/><path d="M783.5 1095 V1107 C783.5 1139 721.333 1139 721.333 1171 V1183" marker-end="url(#arrow-subsequence-delete-gap)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="contained"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">残す指定列は、もとの本文の部分列と</text><text class="node-title" x="475.7222222222223" y="103">して取り出せますか？</text><text class="node-explanation" x="475.7222222222223" y="130">取り出せない場合は、この条件を保つ削除区間はあり</text><text class="node-explanation" x="475.7222222222223" y="148">ません。まず指定列そのものの可否を確認します。</text></g><g class="flow-node question" data-node="one-gap"><rect x="260.6666666666667" y="396" width="320" height="191" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">削除するのは連続した一か所で、残す</text><text class="node-title" x="276.6666666666667" y="467">指定列の途中で左右を分けられます</text><text class="node-title" x="276.6666666666667" y="490">か？</text><text class="node-explanation" x="276.6666666666667" y="517">各分割について、前半の最も早い終了位置と、後半の</text><text class="node-explanation" x="276.6666666666667" y="535">最も遅い開始位置の間を比べます。複数区間の削除で</text><text class="node-explanation" x="276.6666666666667" y="553">は、この一つの間隔だけでは足りません。</text></g><g class="flow-node result" data-node="gap-result"><rect x="32" y="801" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="821">候補</text><text class="node-title" x="48" y="849">前半の最早位置と後半の最遅位置の間</text><text class="node-title" x="48" y="872">隔を最大にする</text><a href="/flowchartcp/techniques/subsequence-delete-gap/"><title>残す部分列を前後に分け、最早・最遅の一致位置の間を消すの記事へ</title><text x="48" y="911">残す部分列を前後に分け、最早・最遅の一致位置の</text><text x="48" y="929">間を消す</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="801" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="821">質問</text><text class="node-title" x="524" y="849">入力例で、位置・重複・変更の条件を</text><text class="node-title" x="524" y="872">一つずつ確かめられますか？</text><text class="node-explanation" x="524" y="899">取り出せる文字の位置、同じ文字列を一回と数える</text><text class="node-explanation" x="524" y="917">か、途中で変わるものを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1203">候補</text><text class="node-title" x="160" y="1231">文字列と操作の条件を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1270">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1294">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1203">分野</text><text class="node-title" x="524" y="1231">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1268">詳細の質問・図へ →</text></a></g></svg>