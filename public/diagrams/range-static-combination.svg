<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-static-combination flow-desc-range-static-combination" width="1112" height="1677" viewBox="0 0 1112 1677" data-flow-svg="range-static-combination"><title id="flow-title-range-static-combination">区間の結合と値・移動の条件の解法フローチャート</title><desc id="flow-desc-range-static-combination">隣り合う区間を結合できるかを確かめ、値の大小関係や繰り返す移動の条件を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-static-combination" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="assoc:yes:segment"><title>はい</title><path d="M719.833 182 V194 C719.833 226 500 226 500 258 V270"/><path d="M500 308 V320 C500 352 500 352 500 384 V396" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="assoc:yes:segment" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="460" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="500" y="293">はい</text></g></g><g class="flow-edge no" data-edge="assoc:no:order"><title>いいえ</title><path d="M799.833 182 V194 C799.833 226 864 226 864 258 V270"/><path d="M864 308 V320 C864 352 864 352 864 384 V396" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="assoc:no:order" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="824" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="864" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assoc:unknown:check"><title>わからない</title><path d="M879.833 182 V194 C879.833 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V320 C1035.5 352 1074 352 1074 384 V396 V558 C1074 590 1074 590 1074 622 V634 V684 C1074 716 1074 716 1074 748 V760 V922 C1074 954 1070.5 954 1070.5 986 V998 V1048 C1070.5 1080 1000 1080 1000 1112 V1124" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="assoc:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="order:yes:compression"><title>はい</title><path d="M784 546 V558 C784 590 444 590 444 622 V634"/><path d="M444 672 V684 C444 716 444 716 444 748 V760" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="order:yes:compression" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="404" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="444" y="657">はい</text></g></g><g class="flow-edge no" data-edge="order:no:recursive"><title>いいえ</title><path d="M864 546 V558 C864 590 808 590 808 622 V634"/><path d="M808 672 V684 C808 716 808 716 808 748 V760" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="order:no:recursive" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="768" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="808" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="order:unknown:check"><title>わからない</title><path d="M944 546 V558 C944 590 979.5 590 979.5 622 V634"/><path d="M979.5 672 V684 C979.5 716 1018 716 1018 748 V760 V922 C1018 954 1014.5 954 1014.5 986 V998 V1048 C1014.5 1080 920 1080 920 1112 V1124" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="order:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="935" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="979.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="recursive:yes:doubling"><title>はい</title><path d="M728 910 V922 C728 954 192 954 192 986 V998"/><path d="M192 1036 V1048 C192 1080 192 1080 192 1112 V1124" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="recursive:yes:doubling" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="recursive:no:fallback"><title>いいえ</title><path d="M808 910 V922 C808 954 556 954 556 986 V998"/><path d="M556 1036 V1048 C556 1080 556 1080 556 1112 V1124" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="recursive:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="recursive:unknown:check"><title>わからない</title><path d="M888 910 V922 C888 954 920 954 920 986 V998"/><path d="M920 1036 V1048 C920 1080 840 1080 840 1112 V1124" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="recursive:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="1021">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:prefix"><title>はい</title><path d="M840 1292 V1304 C840 1336 556 1336 556 1368 V1380"/><path d="M556 1418 V1430 C556 1462 556 1462 556 1494 V1506" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="check:yes:prefix" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="1380" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1403">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1292 V1304 C920 1336 907 1336 907 1368 V1380"/><path d="M907 1418 V1430 C907 1462 866.667 1462 866.667 1494 V1506" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1380" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1403">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1292 V1304 C1000 1336 1035.5 1336 1035.5 1368 V1380"/><path d="M1035.5 1418 V1430 C1035.5 1462 973.333 1462 973.333 1494 V1506" marker-end="url(#arrow-range-static-combination)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1380" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1403">わからない</text></g></g><g class="flow-node question" data-node="assoc"><rect x="639.8333333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="655.8333333333334" y="52">質問</text><text class="node-title" x="655.8333333333334" y="80">隣り合う区間の答えを、まとめる順序</text><text class="node-title" x="655.8333333333334" y="103">によらず結合できますか？</text><text class="node-explanation" x="655.8333333333334" y="130">順序を保って結合します。交換法則は不要ですが、空</text><text class="node-explanation" x="655.8333333333334" y="148">区間の単位元が必要です。</text></g><g class="flow-node question" data-node="order"><rect x="704" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="720" y="416">質問</text><text class="node-title" x="720" y="444">値の大小関係だけでよく、値域が大き</text><text class="node-title" x="720" y="467">いですか？</text><text class="node-explanation" x="720" y="494">座標圧縮は値の順序を保存します。元の距離や和は別</text><text class="node-explanation" x="720" y="512">に保持します。</text></g><g class="flow-node question" data-node="recursive"><rect x="648" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="664" y="780">質問</text><text class="node-title" x="664" y="808">同じ操作を何度も繰り返した到達先を</text><text class="node-title" x="664" y="831">求めますか？</text><text class="node-explanation" x="664" y="858">次の位置が一意に決まり、繰り返し回数が大きい場合</text><text class="node-explanation" x="664" y="876">を考えます。</text></g><g class="flow-node question" data-node="check"><rect x="760" y="1124" width="320" height="168" rx="7"/><text class="node-kind" x="776" y="1144">質問</text><text class="node-title" x="776" y="1172">集計の演算に、接頭辞の不要な部分を</text><text class="node-title" x="776" y="1195">消す逆演算がありますか？</text><text class="node-explanation" x="776" y="1222">整数の和や XOR ならあります。min・max</text><text class="node-explanation" x="776" y="1240"> には一般にありません。未確認なら候補を断定しま</text><text class="node-explanation" x="776" y="1258">せん。</text></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="1506" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="1526">分野</text><text class="node-title" x="776" y="1554">条件を確かめる</text><text class="node-explanation" x="776" y="1581">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="1609">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="prefix"><rect x="396" y="1506" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1526">候補</text><text class="node-title" x="412" y="1554">累積和・接頭辞 XOR</text><a href="/flowchartcp/techniques/prefix-sum/"><title>累積和の記事へ</title><text x="412" y="1593">累積和</text></a></g><g class="flow-node result" data-node="segment"><rect x="340" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="356" y="416">候補</text><text class="node-title" x="356" y="444">セグメント木</text><a href="/flowchartcp/techniques/segment-tree/"><title>セグメント木の記事へ</title><text x="356" y="483">セグメント木</text></a></g><g class="flow-node result" data-node="compression"><rect x="284" y="760" width="320" height="127" rx="7"/><text class="node-kind" x="300" y="780">候補</text><text class="node-title" x="300" y="808">座標圧縮</text><a href="/flowchartcp/techniques/coordinate-compression/"><title>座標圧縮の記事へ</title><text x="300" y="847">座標圧縮</text></a></g><g class="flow-node result" data-node="doubling"><rect x="32" y="1124" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="1144">候補</text><text class="node-title" x="48" y="1172">ダブリング</text><a href="/flowchartcp/techniques/doubling/"><title>ダブリングの記事へ</title><text x="48" y="1211">ダブリング</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1124" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1144">候補</text><text class="node-title" x="412" y="1172">集計する情報を見直す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1211">状態の設計</text></a><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="412" y="1235">寄与の数え上げ</text></a></g></svg>