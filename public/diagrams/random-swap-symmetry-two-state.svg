ck"><title>わからない</title><path d="M826.111 587 V599 C826.111 631 923.5 631 923.5 663 V675"/><path d="M923.5 713 V725 C923.5 757 962 757 962 789 V801 V986 C962 1018 962 1018 962 1050 V1062 V1112 C962 1144 920 1144 920 1176 V1188" marker-end="url(#arrow-random-swap-symmetry-two-state)"/><g class="flow-edge-label" data-edge-label="assumptions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M439.833 974 V986 C439.833 1018 192 1018 192 1050 V1062"/><path d="M192 1100 V1112 C192 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-random-swap-symmetry-two-state)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M519.833 974 V986 C519.833 1018 556 1018 556 1050 V1062"/><path d="M556 1100 V1112 C556 1144 476 1144 476 1176 V1188" marker-end="url(#arrow-random-swap-symmetry-two-state)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M599.833 974 V986 C599.833 1018 811.5 1018 811.5 1050 V1062"/><path d="M811.5 1100 V1112 C811.5 1144 840 1144 840 1176 V1188" marker-end="url(#arrow-random-swap-symmetry-two-state)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="767" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1085">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1338 V1405 C840 1437 783 1437 783 1469 V1481"/><path d="M783 1519 V1531 C783 1563 828.5 1563 828.5 1595 V1607" marker-end="url(#arrow-random-swap-symmetry-two-state)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1481" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1504">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1338 V1405 C920 1437 907 1437 907 1469 V1481"/><path d="M907 1519 V1531 C907 1563 908.5 1563 908.5 1595 V1607" marker-end="url(#arrow-random-swap-symmetry-two-state)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1481" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1504">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1338 V1405 C1000 1437 1035.5 1437 1035.5 1469 V1481"/><path d="M1035.5 1519 V1531 C1035.5 1563 988.5 1563 988.5 1595 V1607" marker-end="url(#arrow-random-swap-symmetry-two-state)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1481" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1504">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="638.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="654.5" y="52">質問</text><text class="node-title" x="654.5" y="80">ランダムな操作と終了の規則はどれで</text><text class="node-title" x="654.5" y="103">すか？</text><text class="node-explanation" x="654.5" y="130">二位置を復元抽出するか、追う球が一つか、他の位置</text><text class="node-explanation" x="654.5" y="148">が対称かを確かめます。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="414" width="320" height="173" rx="7"/><text class="node-kind" x="602.1111111111112" y="434">質問</text><text class="node-title" x="602.1111111111112" y="462">追うのは一つの印付き球で、最初の位</text><text class="node-title" x="602.1111111111112" y="485">置一つと、残り N−1 の位置が対</text><text class="node-title" x="602.1111111111112" y="508">称ですか？</text><text class="node-explanation" x="602.1111111111112" y="535">複数の球の同時位置や相関を求めるときには、二状態</text><text class="node-explanation" x="602.1111111111112" y="553">だけで必要な情報が足りるかを別に確認します。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="801" width="320" height="173" rx="7"/><text class="node-kind" x="375.83333333333337" y="821">質問</text><text class="node-title" x="375.83333333333337" y="849">交換回数 K が決まっており、求め</text><text class="node-title" x="375.83333333333337" y="872">るのは一つの印付き球の位置の期待値</text><text class="node-title" x="375.83333333333337" y="895">ですか？</text><text class="node-explanation" x="375.83333333333337" y="922">一回の抽出を復元しない場合とは係数が違います。N</text><text class="node-explanation" x="375.83333333333337" y="940">=1 は唯一の位置に留まる境界として処理します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">一個の印付き要素をランダム交換する</text><text class="node-title" x="48" y="1259">なら、元の位置と残りの位置に分ける</text><a href="/flowchartcp/techniques/random-swap-symmetry-two-state/"><title>一個の印付き要素をランダム交換するなら、元の位置と残りの位置に分けるの記事へ</title><text x="48" y="1298">一個の印付き要素をランダム交換するなら、元の位</text><text x="48" y="1316">置と残りの位置に分ける</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1188" width="320" height="205" rx="7"/><text class="node-kind" x="412" y="1208">候補</text><text class="node-title" x="412" y="1236">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1263">相異なる二位置を選ぶ場合や選択に偏りがある場合</text><text class="node-explanation" x="412" y="1281">は、二状態でまとめられるかと遷移確率を再計算しま</text><text class="node-explanation" x="412" y="1299">す。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1329">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1353">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1188" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1208">質問</text><text class="node-title" x="776" y="1236">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1259">確認できますか？</text><text class="node-explanation" x="776" y="1286">二位置を復元抽出するか、追う球が一つか、他の位置</text><text class="node-explanation" x="776" y="1304">が対称かを確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1607" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1627">分野</text><text class="node-title" x="764.5" y="1655">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1682">二位置を復元抽出するか、追う球が一つか、他の位置</text><text class="node-explanation" x="764.5" y="1700">が対称かを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1728">詳細の質問・図へ →</text></a></g></svg>