<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-random-swap-symmetry-two-state flow-desc-random-swap-symmetry-two-state" width="1112" height="1796" viewBox="0 0 1112 1796" data-flow-svg="random-swap-symmetry-two-state"><title id="flow-title-random-swap-symmetry-two-state">一個の印付き要素をランダム交換するなら、元の位置と残りの位置に分けるの解法フローチャート</title><desc id="flow-desc-random-swap-symmetry-two-state">二位置を復元抽出するか、追う球が一つか、他の位置が対称かを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-random-swap-symmetry-two-state" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge with-replacement" data-edge="model:with-replacement:assumptions"><title>N 個の位置から二つを独立・一様に選び、同じ位置も許して交換する</title><path d="M718.5 182 V194 C718.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 326 V338 C535.5 370 746.111 370 746.111 402 V414" marker-end="url(#arrow-random-swap-symmetry-two-state)"/><g class="flow-edge-label" data-edge-label="model:with-replacement:assumptions" tabindex="0" role="group" aria-label="選択肢：N 個の位置から二つを独立・一様に選び、同じ位置も許して交換する"><rect x="413" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="535.5" y="293">N 個の位置から二つを独立・一様に</text><text text-anchor="middle" x="535.5" y="311">選び、同じ位置も許して交換する</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>相異なる二つの位置だけを選ぶ、または位置ごとに選択確率が違う</title><path d="M798.5 182 V194 C798.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V599 C1018 631 1018 631 1018 663 V675 V725 C1018 757 1018 757 1018 789 V801 V986 C1018 1018 1018 1018 1018 1050 V1062 V1112 C1018 1144 636 1144 636 1176 V1188" marker-end="url(#arrow-random-swap-symmetry-two-state)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：相異なる二つの位置だけを選ぶ、または位置ごとに選択確率が違う"><rect x=