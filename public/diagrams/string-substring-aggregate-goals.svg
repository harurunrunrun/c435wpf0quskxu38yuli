ke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge singleton-total" data-edge="append:singleton-total:singleton-total-route"><title>全ての位置区間に一回だけ現れる文字数の合計</title><path d="M642 182 V194 C642 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-string-substring-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="append:singleton-total:singleton-total-route" tabindex="0" role="group" aria-label="選択肢：全ての位置区間に一回だけ現れる文字数の合計"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">全ての位置区間に一回だけ現れる文字</text><text text-anchor="middle" x="192" y="311">数の合計</text></g></g><g class="flow-edge decimal-divisibility" data-edge="append:decimal-divisibility:divisibility-route"><title>十進数字の部分文字列が、指定数で割り切れる個数</title><path d="M706 182 V194 C706 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-string-substring-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="append:decimal-divisibility:divisibility-route" tabindex="0" role="group" aria-label="選択肢：十進数字の部分文字列が、指定数で割り切れる個数"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">十進数字の部分文字列が、指定数で割</text><text text-anchor="middle" x="556" y="311">り切れる個数</text></g></g><g class="flow-edge suffix-lcp-sum" data-edge="append:suffix-lcp-sum:suffix-lcp-sum-route"><title>各開始位置について、全接尾辞との共通接頭辞長の総和</title><path d="M770 182 V194 C770 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-string-substring-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="append:suffix-lcp-sum:suffix-lcp-sum-route" tabindex="0" role="group" aria-label="選択肢：各開始位置について、全接尾辞との共通接頭辞長の総和"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">各開始位置について、全接尾辞との共</text><text text-anchor="middle" x="920" y="311">通接頭辞長の総和</text></g></g><g class="flow-edge unknown" data-edge="append:unknown:check"><title>わからない</title><path d="M834 182 V194 C834 226 1284 226 1284 258 V270"/><path d="M1284 308 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-string-substring-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="append:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:sam"><title>はい</title><path d="M1204 564 V576 C1204 608 920 608 920 640 V652"/><path d="M920 690 V702 C920 734 920 734 920 766 V778" marker-end="url(#arrow-string-substring-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:sam" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="675">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 564 V576 C1284 608 1271 608 1271 640 V652"/><path d="M1271 690 V702 C1271 734 1230.667 734 1230.667 766 V778" marker-end="url(#arrow-string-substring-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="652" wid