<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-grid-bounding-expectation flow-desc-grid-bounding-expectation" width="860" height="1343" viewBox="0 0 860 1343" data-flow-svg="grid-bounding-expectation"><title id="flow-title-grid-bounding-expectation">選んだマスの外接長方形の期待面積の解法フローチャート</title><desc id="flow-desc-grid-bounding-expectation">各マスが外接長方形に入る確率を足します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-grid-bounding-expectation" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="sampling:yes:four-sides"><title>はい</title><path d="M539.722 182 V194 C539.722 226 420.667 226 420.667 258 V270"/><path d="M420.667 308 V320 C420.667 352 420.667 352 420.667 384 V396" marker-end="url(#arrow-grid-bounding-expectation)"/><g class="flow-edge-label" data-edge-label="sampling:yes:four-sides" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="sampling:no:fallback"><title>いいえ</title><path d="M619.722 182 V194 C619.722 226 655 226 655 258 V270"/><path d="M655 308 V320 C655 352 762.5 352 762.5 384 V396 V576 C762.5 608 762.5 608 762.5 640 V652 V702 C762.5 734 458 734 458 766 V778 V958 C458 990 360 990 360 1022 V1034 V1084 C360 1116 304 1116 304 1148 V1160" marker-end="url(#arrow-grid-bounding-expectation)"/><g class="flow-edge-label" data-edge-label="sampling:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="sampling:unknown:check"><title>わからない</title><path d="M699.722 182 V194 C699.722 226 783.5 226 783.5 258 V270"/><path d="M783.5 308 V320 C783.5 352 818.5 352 818.5 384 V396 V576 C818.5 608 818.5 608 818.5 640 V652 V702 C818.5 734 721.333 734 721.333 766 V778" marker-end="url(#arrow-grid-bounding-expectation)"/><g class="flow-edge-label" data-edge-label="sampling:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="four-sides:yes:bounding-result"><title>はい</title><path d="M340.667 564 V576 C340.667 608 192 608 192 640 V652"/><path d="M192 690 V702 C192 734 192 734 192 766 V778" marker-end="url(#arrow-grid-bounding-expectation)"/><g class="flow-edge-label" data-edge-label="four-sides:yes:bounding-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="675">はい</text></g></g><g class="flow-edge no" data-edge="four-sides:no:fallback"><title>いいえ</title><path d="M420.667 564 V576 C420.667 608 402 608 402 640 V652"/><path d="M402 690 V702 C402 734 402 734 402 766 V778 V958 C402 990 304 990 304 1022 V1034 V1084 C304 1116 224 1116 224 1148 V1160" marker-end="url(#arrow-grid-bounding-expectation)"/><g class="flow-edge-label" data-edge-label="four-sides:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="four-sides:unknown:check"><title>わからない</title><path d="M500.667 564 V576 C500.667 608 668 608 668 640 V652"/><path d="M668 690 V702 C668 734 614.667 734 614.667 766 V778" marker-end="url(#arrow-grid-bounding-expectation)"/><g class="flow-edge-label" data-edge-label="four-sides:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 928 V958 C588 990 450 990 450 1022 V1034"/><path d="M450 1072 V1084 C450 1116 384 1116 384 1148 V1160" marker-end="url(#arrow-grid-bounding-expectation)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 928 V958 C668 990 655 990 655 1022 V1034"/><path d="M655 1072 V1084 C655 1116 614.667 1116 614.667 1148 V1160" marker-end="url(#arrow-grid-bounding-expectation)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 928 V958 C748 990 783.5 990 783.5 1022 V1034"/><path d="M783.5 1072 V1084 C783.5 1116 721.333 1116 721.333 1148 V1160" marker-end="url(#arrow-grid-bounding-expectation)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1057">わからない</text></g></g><g class="flow-node question" data-node="sampling"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">長方形格子の全マスから、異なる K</text><text class="node-title" x="475.7222222222223" y="103"> マスを一様に選びますか？</text><text class="node-explanation" x="475.7222222222223" y="130">K≥1。重み付きの抽選や重複を許す抽選とは、分母</text><text class="node-explanation" x="475.7222222222223" y="148">が異なります。</text></g><g class="flow-node question" data-node="four-sides"><rect x="260.6666666666667" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">格子の面積は法より小さく、選択数の</text><text class="node-title" x="276.6666666666667" y="467">逆元を計算できますか？</text><text class="node-explanation" x="276.6666666666667" y="494">あるマスが含まれないのは、全選択点がその上・下・</text><text class="node-explanation" x="276.6666666666667" y="512">左・右のいずれか一方にあるときです。四条件の交わ</text><text class="node-explanation" x="276.6666666666667" y="530">りを包除します。</text></g><g class="flow-node result" data-node="bounding-result"><rect x="32" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="798">候補</text><text class="node-title" x="48" y="826">各マスの上下左右の外側に全点がある</text><text class="node-title" x="48" y="849">事象を包除し、含まれる確率を足す</text><a href="/flowchartcp/techniques/subset-bounding-box-expectation/"><title>無作為に選ぶマスの外接長方形は、各マスを含まない四方向の包除で数えるの記事へ</title><text x="48" y="888">無作為に選ぶマスの外接長方形は、各マスを含まな</text><text x="48" y="906">い四方向の包除で数える</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="798">質問</text><text class="node-title" x="524" y="826">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="849">確認できますか？</text><text class="node-explanation" x="524" y="876">区別する対象、求める個数、操作の条件を確認しま</text><text class="node-explanation" x="524" y="894">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1160" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1180">候補</text><text class="node-title" x="160" y="1208">条件と数え方をもう一度確かめる</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="160" y="1247">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1271">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1160" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1180">分野</text><text class="node-title" x="524" y="1208">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1245">詳細の質問・図へ →</text></a></g></svg>