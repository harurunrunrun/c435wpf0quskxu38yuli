<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-limited-value-changes flow-desc-range-limited-value-changes" width="1532" height="1701" viewBox="0 0 1532 1701" data-flow-svg="range-limited-value-changes"><title id="flow-title-range-limited-value-changes">上限・下限・余り・反転による変更の解法フローチャート</title><desc id="flow-desc-range-limited-value-changes">値の変換方法と、途中の集計が必要か最後の値だけかを区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-limited-value-changes" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="beats-proof:yes:beats-result"><title>はい</title><path d="M571.167 928 V940 C571.167 972 192 972 192 1004 V1016"/><path d="M192 1054 V1066 C192 1098 192 1098 192 1130 V1142" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="beats-proof:yes:beats-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="beats-proof:no:fallback"><title>いいえ</title><path d="M651.167 928 V940 C651.167 972 556 972 556 1004 V1016"/><path d="M556 1054 V1066 C556 1098 556 1098 556 1130 V1142" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="beats-proof:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="beats-proof:unknown:check"><title>わからない</title><path d="M731.167 928 V940 C731.167 972 1205.5 972 1205.5 1004 V1016"/><path d="M1205.5 1054 V1066 C1205.5 1098 1125.5 1098 1125.5 1130 V1142" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="beats-proof:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1161" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="1205.5" y="1039">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:lazy"><title>はい</title><path d="M1125.5 1292 V1328 C1125.5 1360 920 1360 920 1392 V1404"/><path d="M920 1442 V1454 C920 1486 920 1486 920 1518 V1530" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="check:yes:lazy" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="1404" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1427">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1205.5 1292 V1328 C1205.5 1360 1284 1360 1284 1392 V1404"/><path d="M1284 1442 V1454 C1284 1486 1230.667 1486 1230.667 1518 V1530" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1244" y="1404" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="1427">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1285.5 1292 V1328 C1285.5 1360 1412.5 1360 1412.5 1392 V1404"/><path d="M1412.5 1442 V1454 C1412.5 1486 1337.333 1486 1337.333 1518 V1530" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1368" y="1404" width="89" height="38" rx="5"/><text text-anchor="middle" x="1412.5" y="1427">わからない</text></g></g><g class="flow-edge cap" data-edge="change-kind:cap:cap-goal"><title>区間の値を、指定の上限・下限で切る</title><path d="M766.933 164 V176 C766.933 208 192 208 192 240 V252"/><path d="M192 290 V320 C192 352 192 352 192 384 V396" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="change-kind:cap:cap-goal" tabindex="0" role="group" aria-label="選択肢：区間の値を、指定の上限・下限で切る"><rect x="69.5" y="252" width="245" height="38" rx="5"/><text text-anchor="middle" x="192" y="275">区間の値を、指定の上限・下限で切る</text></g></g><g class="flow-edge range-modulo" data-edge="change-kind:range-modulo:modulo-route"><title>区間を正の数で割った余りにし、区間和と点代入も行う</title><path d="M820.267 164 V176 C820.267 208 556 208 556 240 V252"/><path d="M556 308 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="change-kind:range-modulo:modulo-route" tabindex="0" role="group" aria-label="選択肢：区間を正の数で割った余りにし、区間和と点代入も行う"><rect x="433.5" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="275">区間を正の数で割った余りにし、区間</text><text text-anchor="middle" x="556" y="293">和と点代入も行う</text></g></g><g class="flow-edge binary-flip" data-edge="change-kind:binary-flip:flip-run-route"><title>区間の 0/1 を反転し、区間の最長の 1 の連続を求める</title><path d="M873.6 164 V176 C873.6 208 920 208 920 240 V252"/><path d="M920 308 V320 C920 352 920 352 920 384 V396" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="change-kind:binary-flip:flip-run-route" tabindex="0" role="group" aria-label="選択肢：区間の 0/1 を反転し、区間の最長の 1 の連続を求める"><rect x="797.5" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="275">区間の 0/1 を反転し、区間の最</text><text text-anchor="middle" x="920" y="293">長の 1 の連続を求める</text></g></g><g class="flow-edge stabilizing" data-edge="change-kind:stabilizing:stabilizing-route"><title>区間を約数個数・整数平方根などへ変え、繰り返すと値が固定する</title><path d="M926.933 164 V176 C926.933 208 1244.5 208 1244.5 240 V252"/><path d="M1244.5 308 V320 C1244.5 352 1284 352 1284 384 V396" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="change-kind:stabilizing:stabilizing-route" tabindex="0" role="group" aria-label="選択肢：区間を約数個数・整数平方根などへ変え、繰り返すと値が固定する"><rect x="1122" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="1244.5" y="275">区間を約数個数・整数平方根などへ変</text><text text-anchor="middle" x="1244.5" y="293">え、繰り返すと値が固定する</text></g></g><g class="flow-edge unknown" data-edge="change-kind:unknown:check"><title>わからない</title><path d="M980.267 164 V176 C980.267 208 1455.5 208 1455.5 240 V252"/><path d="M1455.5 290 V320 C1455.5 352 1494 352 1494 384 V396 V558 C1494 590 1394.5 590 1394.5 622 V634 V702 C1394.5 734 1356 734 1356 766 V778 V940 C1356 972 1356 972 1356 1004 V1016 V1066 C1356 1098 1285.5 1098 1285.5 1130 V1142" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="change-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1411" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="1455.5" y="275">わからない</text></g></g><g class="flow-edge aggregate" data-edge="cap-goal:aggregate:beats-proof"><title>途中にも区間の和・最小値・最大値を求める</title><path d="M112 546 V558 C112 590 651.167 590 651.167 622 V634"/><path d="M651.167 690 V702 C651.167 734 651.167 734 651.167 766 V778" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="cap-goal:aggregate:beats-proof" tabindex="0" role="group" aria-label="選択肢：途中にも区間の和・最小値・最大値を求める"><rect x="528.6666666666666" y="634" width="245" height="56" rx="5"/><text text-anchor="middle" x="651.1666666666666" y="657">途中にも区間の和・最小値・最大値を</text><text text-anchor="middle" x="651.1666666666666" y="675">求める</text></g></g><g class="flow-edge final-values" data-edge="cap-goal:final-values:clamp-route"><title>全ての変更を終えた後の、各位置の値だけ</title><path d="M192 546 V558 C192 590 1015.167 590 1015.167 622 V634"/><path d="M1015.167 690 V702 C1015.167 734 1015.167 734 1015.167 766 V778" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="cap-goal:final-values:clamp-route" tabindex="0" role="group" aria-label="選択肢：全ての変更を終えた後の、各位置の値だけ"><rect x="892.6666666666666" y="634" width="245" height="56" rx="5"/><text text-anchor="middle" x="1015.1666666666666" y="657">全ての変更を終えた後の、各位置の値</text><text text-anchor="middle" x="1015.1666666666666" y="675">だけ</text></g></g><g class="flow-edge unknown" data-edge="cap-goal:unknown:check"><title>わからない</title><path d="M272 546 V558 C272 590 1300 590 1300 622 V634"/><path d="M1300 672 V702 C1300 734 1300 734 1300 766 V778 V940 C1300 972 1300 972 1300 1004 V1016 V1066 C1300 1098 1205.5 1098 1205.5 1130 V1142" marker-end="url(#arrow-range-limited-value-changes)"/><g class="flow-edge-label" data-edge-label="cap-goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1255.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1300" y="657">わからない</text></g></g><g class="flow-node question" data-node="beats-proof"><rect x="491.16666666666663" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="507.16666666666663" y="798">質問</text><text class="node-title" x="507.16666666666663" y="826">最大値・第二最大値・個数などで更新</text><text class="node-title" x="507.16666666666663" y="849">を止め、計算量を評価できますか？</text><text class="node-explanation" x="507.16666666666663" y="876">条件を満たさないノードに降りる回数の償却解析が必</text><text class="node-explanation" x="507.16666666666663" y="894">要です。</text></g><g class="flow-node question" data-node="check"><rect x="1045.5" y="1142" width="320" height="150" rx="7"/><text class="node-kind" x="1061.5" y="1162">質問</text><text class="node-title" x="1061.5" y="1190">区間への代入・加算を、区間和と長さ</text><text class="node-title" x="1061.5" y="1213">から一括で反映できますか？</text><text class="node-explanation" x="1061.5" y="1240">sum と length を持ち、写像が結合を保</text><text class="node-explanation" x="1061.5" y="1258">つこと、タグの合成を定義できることを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="1530" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="1550">分野</text><text class="node-title" x="1140" y="1578">条件を確かめる</text><text class="node-explanation" x="1140" y="1605">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="1633">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="beats-result"><rect x="32" y="1142" width="320" height="174" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">Segment Tree </text><text class="node-title" x="48" y="1213">Beats</text><a href="/flowchartcp/techniques/range-chmin-second-maximum/"><title>区間の上限更新を第二最大値でまとめて処理するの記事へ</title><text x="48" y="1252">区間の上限更新を第二最大値でまとめて処理する</text></a><a href="/flowchartcp/techniques/segment-tree-beats/"><title>Segment Tree Beatsの記事へ</title><text x="48" y="1276">Segment Tree Beats</text></a></g><g class="flow-node result" data-node="lazy"><rect x="760" y="1530" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="1550">候補</text><text class="node-title" x="776" y="1578">遅延セグメント木</text><a href="/flowchartcp/techniques/lazy-segment-tree/"><title>遅延セグメント木の記事へ</title><text x="776" y="1617">遅延セグメント木</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1142" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1162">候補</text><text class="node-title" x="412" y="1190">保持する区間情報を増やす</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1229">状態の設計</text></a></g><g class="flow-node question" data-node="change-kind"><rect x="713.6" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="729.6" y="52">質問</text><text class="node-title" x="729.6" y="80">一回の操作で、どの値がどう変わりま</text><text class="node-title" x="729.6" y="103">すか？</text><text class="node-explanation" x="729.6" y="130">更新する範囲と、問い合わせる量を選びます。</text></g><g class="flow-node question" data-node="cap-goal"><rect x="32" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="416">質問</text><text class="node-title" x="48" y="444">上限・下限の変更の後、いつ何を答え</text><text class="node-title" x="48" y="467">ますか？</text><text class="node-explanation" x="48" y="494">途中の和・最小値などが必要か、最後に各値だけ出せ</text><text class="node-explanation" x="48" y="512">ばよいかで、持つ情報が異なります。</text></g><g class="flow-node route" data-node="clamp-route"><rect x="855.1666666666666" y="778" width="320" height="121" rx="7"/><text class="node-kind" x="871.1666666666666" y="798">分野</text><text class="node-title" x="871.1666666666666" y="826">上下限の変更を関数として合成する</text><a href="/flowchartcp/flowcharts/#diagram-range-final-clamps" data-route="range-final-clamps"><text x="871.1666666666666" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="modulo-route"><rect x="396" y="396" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="416">分野</text><text class="node-title" x="412" y="444">値が大きい所だけを余りへ変える</text><a href="/flowchartcp/flowcharts/#diagram-range-modulo-changes" data-route="range-modulo-changes"><text x="412" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="flip-run-route"><rect x="760" y="396" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="416">分野</text><text class="node-title" x="776" y="444">二値を反転した区間の連続長</text><a href="/flowchartcp/flowcharts/#diagram-binary-flip-runs" data-route="binary-flip-runs"><text x="776" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="stabilizing-route"><rect x="1124" y="396" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="416">分野</text><text class="node-title" x="1140" y="444">区間を約数個数・整数平方根などへ変</text><text class="node-title" x="1140" y="467">え、繰り返すと値が固定する</text><a href="/flowchartcp/flowcharts/#diagram-range-stabilizing-updates" data-route="range-stabilizing-updates"><text x="1140" y="504">詳細の質問・図へ →</text></a></g></svg>