oup" aria-label="選択肢：いいえ"><rect x="158" y="1093" width="80" height="38" rx="5"/><text text-anchor="middle" x="198" y="1116">いいえ</text></g></g><g class="flow-edge unknown" data-edge="combine:unknown:check"><title>わからない</title><path d="M432 964 V1017 C432 1049 810.5 1049 810.5 1081 V1093"/><path d="M810.5 1131 V1143 C810.5 1175 844 1175 844 1207 V1219" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="combine:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="766" y="1093" width="89" height="38" rx="5"/><text text-anchor="middle" x="810.5" y="1116">わからない</text></g></g><g class="flow-edge yes" data-edge="both-orders:yes:path-result"><title>はい</title><path d="M636 1005 V1017 C636 1049 446 1049 446 1081 V1093"/><path d="M446 1131 V1143 C446 1175 461.333 1175 461.333 1207 V1219" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="both-orders:yes:path-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="406" y="1093" width="80" height="38" rx="5"/><text text-anchor="middle" x="446" y="1116">はい</text></g></g><g class="flow-edge no" data-edge="both-orders:no:fallback"><title>いいえ</title><path d="M716 1005 V1017 C716 1049 570 1049 570 1081 V1093"/><path d="M570 1131 V1143 C570 1175 618 1175 618 1207 V1219 V1399 C618 1431 601 1431 601 1463 V1475 V1525 C601 1557 522.667 1557 522.667 1589 V1601" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="both-orders:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="530" y="1093" width="80" height="38" rx="5"/><text text-anchor="middle" x="570" y="1116">いいえ</text></g></g><g class="flow-edge unknown" data-edge="both-orders:unknown:check"><title>わからない</title><path d="M796 1005 V1017 C796 1049 943.5 1049 943.5 1081 V1093"/><path d="M943.5 1131 V1143 C943.5 1175 908 1175 908 1207 V1219" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="both-orders:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="899" y="1093" width="89" height="38" rx="5"/><text text-anchor="middle" x="943.5" y="1116">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M860 1387 V1399 C860 1431 691 1431 691 1463 V1475"/><path d="M691 1513 V1525 C691 1557 576 1557 576 1589 V1601" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="651" y="1475" width="80" height="38" rx="5"/><text text-anchor="middle" x="691" y="1498">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M940 1387 V1399 C940 1431 927 1431 927 1463 V1475"/><path d="M927 1513 V1525 C927 1557 886.667 1557 886.667 1589 V1601" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="887" y="1475" width="80" height="38" rx="5"/><text text-anchor="middle" x="927" y="1498">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1020 1387 V1399 C1020 1431 1055.5 1431 1055.5 1463 V1475"/><path d="M1055.5 1513 V1525 C1055.5 1557 993.333 1557 993.333 1589 V1601" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1011" y="1475" width="89" height="38" rx="5"/><text text-anchor="middle" x="1055.5" y="1498">わからない</text></g></g><g class="flow-node question" data-node="forest"><rect x="687.6666666666666" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="703.6666666666666" y="52">質問</text><text class="node-title" x="703.6666666666666" y="80">辺を追加・切断しても、各成分は木の</text><text class="node-title" x="703.6666666666666" y="103">ままですか？</text><text class="node-explanation" x="703.6666666666666" y="130">閉路がある一般のグラフでは、二頂点間の経路を一本</text><text class="node-explanation" x="703.6666666666666" y="148">として扱えません。辺を追加するときは別の成分どう</text><text class="node-explanation" x="703.6666666666666" y="166">しをつなぎます。</text></g><g class="flow-node question" data-node="aggregate"><rect x="422.5" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="438.5" y="434">質問</text><text class="node-title" x="438.5" y="462">変化する森について、何を集計・更新</text><text class="node-title" x="438.5" y="485">しますか？</text><text class="node-explanation" x="438.5" y="512">経路の和と、通る向きで順序が決まる合成を分けま</text><text class="node-explanation" x="438.5" y="530">す。部分木や経路全体の一括更新には別の情報が必要</text><text class="node-explanation" x="438.5" y="548">です。</text></g><g class="flow-node question" data-node="combine"><rect x="192" y="814" width="320" height="150" rx="7"/><text class="node-kind" x="208" y="834">質問</text><text class="node-title" x="208" y="862">経路片の要約を定数時間で結合し、頂</text><text class="node-title" x="208" y="885">点の値を一点ずつ更新できますか？</text><text class="node-explanation" x="208" y="912">結合は括弧の付け方に依存しない必要があります。頂</text><text class="node-explanation" x="208" y="930">点の追加・削除と、辺のつなぎ替えも区別します。</text></g><g class="flow-node question" data-node="both-orders"><rect x="556" y="814" width="320" height="191" rx="7"/><text class="node-kind" x="572" y="834">質問</text><text class="node-title" x="572" y="862">正順・逆順の要約を定数サイズで持</text><text class="node-title" x="572" y="885">ち、定数時間で結合・反転できます</text><text class="node-title" x="572" y="908">か？</text><text class="node-explanation" x="572" y="935">関数合成は順序を交換できません。結合は括弧の付け</text><text class="node-explanation" x="572" y="953">方に依存せず、反転時には正順と逆順の要約を交換し</text><text class="node-explanation" x="572" y="971">ます。</text></g><g class="flow-node result" data-node="path-result"><rect x="248" y="1219" width="320" height="150" rx="7"/><text class="node-kind" x="264" y="1239">候補</text><text class="node-title" x="264" y="1267">経路を一本の補助木へ露出し、両向き</text><text class="node-title" x="264" y="1290">の要約を保つ</text><a href="/flowchartcp/techniques/dynamic-forest-path-aggregate/"><title>辺をつなぎ替えながら、向きのあるパスを集計するの記事へ</title><text x="264" y="1329">辺をつなぎ替えながら、向きのあるパスを集計する</text></a></g><g class="flow-node question" data-node="check"><rect x="780" y="1219" width="320" height="168" rx="7"/><text class="node-kind" x="796" y="1239">質問</text><text class="node-title" x="796" y="1267">変わる辺・値の位置・問い合わせる経</text><text class="node-title" x="796" y="1290">路を区別できますか？</text><text class="node-explanation" x="796" y="1317">木の形が固定なら、部分木の区間化や経路分解も選べ</text><text class="node-explanation" x="796" y="1335">ます。辺が変わる場合は、更新後も森であるかを確か</text><text class="node-explanation" x="796" y="1353">めます。</text></g><g class="flow-node result" data-node="fallback"><rect x="416" y="1601" width="320" height="174" rx="7"/><text class="node-kind" x="432" y="1621">候補</text><text class="node-title" x="432" y="1649">森である条件と、更新する範囲を確認</text><text class="node-title" x="432" y="1672">する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="432" y="1711">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="432" y="1735">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="780" y="1601" width="320" height="121" rx="7"/><text class="node-kind" x="796" y="1621">分野</text><text class="node-title" x="796" y="1649">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="796" y="1686">詳細の質問・図へ →</text></a></g></svg>