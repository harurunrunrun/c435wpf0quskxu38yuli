<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dynamic-forest-path-values flow-desc-dynamic-forest-path-values" width="1132" height="1807" viewBox="0 0 1132 1807" data-flow-svg="dynamic-forest-path-values"><title id="flow-title-dynamic-forest-path-values">つなぎ替わる森の経路集計の解法フローチャート</title><desc id="flow-desc-dynamic-forest-path-values">各成分が木であることと、値を結合する順序を確認し、辺の変更と経路の集計を両立させます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dynamic-forest-path-values" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="forest:yes:aggregate"><title>はい</title><path d="M767.667 200 V212 C767.667 244 582.5 244 582.5 276 V288"/><path d="M582.5 326 V338 C582.5 370 582.5 370 582.5 402 V414" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="forest:yes:aggregate" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="542.5" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="582.5" y="311">はい</text></g></g><g class="flow-edge no" data-edge="forest:no:fallback"><title>いいえ</title><path d="M847.667 200 V212 C847.667 244 905 244 905 276 V288"/><path d="M905 326 V338 C905 370 905 370 905 402 V414 V594 C905 626 905 626 905 658 V670 V738 C905 770 982 770 982 802 V814 V1017 C982 1049 716 1049 716 1081 V1093 V1143 C716 1175 730 1175 730 1207 V1219 V1399 C730 1431 837 1431 837 1463 V1475 V1525 C837 1557 682.667 1557 682.667 1589 V1601" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="forest:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="865" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="905" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="forest:unknown:check"><title>わからない</title><path d="M927.667 200 V212 C927.667 244 1055.5 244 1055.5 276 V288"/><path d="M1055.5 326 V338 C1055.5 370 1094 370 1094 402 V414 V594 C1094 626 1094 626 1094 658 V670 V738 C1094 770 1094 770 1094 802 V814 V1017 C1094 1049 1094 1049 1094 1081 V1093 V1143 C1094 1175 1036 1175 1036 1207 V1219" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="forest:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1011" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="1055.5" y="311">わからない</text></g></g><g class="flow-edge commutative" data-edge="aggregate:commutative:combine"><title>一点の値を変え、経路の和・最大値などを求める</title><path d="M486.5 582 V594 C486.5 626 154.5 626 154.5 658 V670"/><path d="M154.5 726 V738 C154.5 770 352 770 352 802 V814" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="aggregate:commutative:combine" tabindex="0" role="group" aria-label="選択肢：一点の値を変え、経路の和・最大値などを求める"><rect x="32" y="670" width="245" height="56" rx="5"/><text text-anchor="middle" x="154.5" y="693">一点の値を変え、経路の和・最大値な</text><text text-anchor="middle" x="154.5" y="711">どを求める</text></g></g><g class="flow-edge ordered" data-edge="aggregate:ordered:both-orders"><title>一点の関数を変え、経路の順に合成する</title><path d="M550.5 582 V594 C550.5 626 443.5 626 443.5 658 V670"/><path d="M443.5 726 V738 C443.5 770 716 770 716 802 V814" marker-end="url(#arrow-dynamic-forest-path-values)"/><g class="flow-edge-label" data-edge-label="aggregate:ordered:both-orders" tabindex="0" role="group" aria-label="選択肢：一点の関数を変え、経路の順に合成する"><rect x="321" y="670" width="245" height="56" rx="5"/><text text-anchor="middle" x="443.5" y="693">一点の関数を変え、経路の順に合成す</text><text text-anchor="middle" x="443.5" y="711">る</text></g></g><g class="flow-edge other" data-edge="aggregate:other:fallback"><title>部分木の集計・経路全体の値の一括更新</title><path d="M614.5 582 V594 C614.5 626 732.5 626 732.5 658 V670"/><path d="M732.5 726 V738 C732.5 770 926 770 926 802 V814 V1017 C926 1049 660 1049 660 