<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-shortest-path flow-desc-shortest-path" width="2568" height="580" viewBox="0 0 2568 580" data-flow-svg="shortest-path"><title id="flow-title-shortest-path">移動回数・移動費用の解法フローチャート</title><desc id="flow-desc-shortest-path">重み、閉路、求める頂点の組で方法を選びます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-shortest-path" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge distance-costs" data-edge="movement:distance-costs:distance-costs-route"><title>移動の費用や、距離を求める始点を扱う</title><path d="M1164 159 V171 C1164 203 192 203 192 235 V247"/><path d="M192 303 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-shortest-path)"/><g class="flow-edge-label" data-edge-label="movement:distance-costs:distance-costs-route" tabindex="0" role="group" aria-label="選択肢：移動の費用や、距離を求める始点を扱う"><rect x="69.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="270">移動の費用や、距離を求める始点を扱</text><text text-anchor="middle" x="192" y="288">う</text></g></g><g class="flow-edge movement-memory" data-edge="movement:movement-memory:movement-memory-route"><title>位置以外に、モード・方向・残り資源を覚える</title><path d="M1204 159 V171 C1204 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-shortest-path)"/><g class="flow-edge-label" data-edge-label="movement:movement-memory:movement-memory-route" tabindex="0" role="group" aria-label="選択肢：位置以外に、モード・方向・残り資源を覚える"><rect x="433.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">位置以外に、モード・方向・残り資源</text><text text-anchor="middle" x="556" y="288">を覚える</text></g></g><g class="flow-edge many-connections" data-edge="movement:many-connections:many-connections-route"><title>多数の移動が、区間・集合・共通の費用式で決まる</title><path d="M1244 159 V171 C1244 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-shortest-path)"/><g class="flow-edge-label" data-edge-label="movement:many-connections:many-connections-route" tabindex="0" role="group" aria-label="選択肢：多数の移動が、区間・集合・共通の費用式で決まる"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">多数の移動が、区間・集合・共通の費</text><text text-anchor="middle" x="920" y="288">用式で決まる</text></g></g><g class="flow-edge xor-walk" data-edge="movement:xor-walk:xor-walk-route"><title>辺重みの合計ではなく、XOR を最小にする再訪できる経路</title><path d="M1284 159 V171 C1284 203 1284 203 1284 235 V247"/><path d="M1284 303 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-shortest-path)"/><g class="flow-edge-label" data-edge-label="movement:xor-walk:xor-walk-route" tabindex="0" role="group" aria-label="選択肢：辺重みの合計ではなく、XOR を最小にする再訪できる経路"><rect x="1161.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="270">辺重みの合計ではなく、XOR を最</text><text text-anchor="middle" x="1284" y="288">小にする再訪できる経路</text></g></g><g class="flow-edge mandatory-edges" data-edge="movement:mandatory-edges:mandatory-edges-route"><title>全ての最短路に必要な辺、または一辺を軽くして必須にする最小量</title><path d="M1324 159 V171 C1324 203 1648 203 1648 235 V247"/><path d="M1648 303 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-shortest-path)"/><g class="flow-edge-label" data-edge-label="movement:mandatory-edges:mandatory-edges-route" tabindex="0" role="group" aria-label="選択肢：全ての最短路に必要な辺、または一辺を軽くして必須にする最小量"><rect x="1525.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="270">全ての最短路に必要な辺、または一辺</text><text text-anchor="middle" x="1648" y="288">を軽くして必須にする最小量</text></g></g><g class="flow-edge exact-k-cost" data-edge="movement:exact-k-cost:exact-k-cost-route"><title>ちょうどK本の辺を使い、移動費用を最小にする</title><path d="M1364 159 V171 C1364 203 2012 203 2012 235 V247"/><path d="M2012 303 V315 C2012 347 2012 347 2012 379 V391" marker-end="url(#arrow-shortest-path)"/><g class="flow-edge-label" data-edge-label="movement:exact-k-cost:exact-k-cost-route" tabindex="0" role="group" aria-label="選択肢：ちょうどK本の辺を使い、移動費用を最小にする"><rect x="1889.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="270">ちょうどK本の辺を使い、移動費用を</text><text text-anchor="middle" x="2012" y="288">最小にする</text></g></g><g class="flow-edge unknown" data-edge="movement:unknown:check"><title>わからない</title><path d="M1404 159 V171 C1404 203 2376 203 2376 235 V247"/><path d="M2376 285 V315 C2376 347 2376 347 2376 379 V391" marker-end="url(#arrow-shortest-path)"/><g class="flow-edge-label" data-edge-label="movement:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2331.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="2376" y="270">わからない</text></g></g><g class="flow-node question" data-node="movement"><rect x="1124" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1140" y="52">質問</text><text class="node-title" x="1140" y="80">移動の特徴はどれですか？</text><text class="node-explanation" x="1140" y="107">元の頂点だけでは足りない情報と、移動費用を選びま</text><text class="node-explanation" x="1140" y="125">す。</text></g><g class="flow-node route" data-node="distance-costs-route"><rect x="32" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">移動費用と距離を求める始点</text><text class="node-explanation" x="48" y="466">通常の距離、複数始点、負の辺を含む全点対、一辺だ</text><text class="node-explanation" x="48" y="484">けの割引を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-cost-source-goals" data-route="shortest-cost-source-goals"><text x="48" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="movement-memory-route"><rect x="396" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">位置と一緒に覚える情報</text><text class="node-explanation" x="412" y="466">通れる辺を決めるモード、直前の方向、移動で使う資</text><text class="node-explanation" x="412" y="484">源を区別します。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-position-state-goals" data-route="shortest-position-state-goals"><text x="412" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="many-connections-route"><rect x="760" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">多数の移動に共通する構造</text><text class="node-explanation" x="776" y="466">費用が規則式で決まる移動、区間への移動、集合を通</text><text class="node-explanation" x="776" y="484">じた移動を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-shared-connection-goals" data-route="shortest-shared-connection-goals"><text x="776" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="xor-walk-route"><rect x="1124" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">辺重み XOR と時間による辺の変</text><text class="node-title" x="1140" y="462">更</text><a href="/flowchartcp/flowcharts/#diagram-graph-xor-walks" data-route="graph-xor-walks"><text x="1140" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="2216" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="2232" y="411">分野</text><text class="node-title" x="2232" y="439">移動費用の符号を確かめる</text><text class="node-explanation" x="2232" y="466">負の費用が許されるかを問題文の範囲から確かめ、適</text><text class="node-explanation" x="2232" y="484">用できる探索を判断します。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-edge-cost-sign-check" data-route="shortest-edge-cost-sign-check"><text x="2232" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="mandatory-edges-route"><rect x="1488" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">全ての最短路に必要な辺、または一辺</text><text class="node-title" x="1504" y="462">を軽くして必須にする最小量</text><a href="/flowchartcp/flowcharts/#diagram-shortest-mandatory-edge" data-route="shortest-mandatory-edge"><text x="1504" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="exact-k-cost-route"><rect x="1852" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="411">分野</text><text class="node-title" x="1868" y="439">ちょうどK本の辺を使い、移動費用を</text><text class="node-title" x="1868" y="462">最小にする</text><a href="/flowchartcp/flowcharts/#diagram-exact-k-edge-cost-conditions" data-route="exact-k-edge-cost-conditions"><text x="1868" y="499">詳細の質問・図へ →</text></a></g></svg>