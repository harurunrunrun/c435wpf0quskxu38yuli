340 C828.5 1372 783 1372 783 1404 V1416"/><path d="M783 1454 V1466 C783 1498 668 1498 668 1530 V1542" marker-end="url(#arrow-permutation-swaps)"/><g class="flow-edge-label" data-edge-label="swap-size:yes:swap-leaf-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1439">はい</text></g></g><g class="flow-edge no" data-edge="swap-size:no:fallback"><title>いいえ</title><path d="M908.5 1328 V1340 C908.5 1372 907 1372 907 1404 V1416"/><path d="M907 1454 V1466 C907 1498 878 1498 878 1530 V1542 V1722 C878 1754 836 1754 836 1786 V1798 V1848 C836 1880 748 1880 748 1912 V1924" marker-end="url(#arrow-permutation-swaps)"/><g class="flow-edge-label" data-edge-label="swap-size:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1439">いいえ</text></g></g><g class="flow-edge unknown" data-edge="swap-size:unknown:check"><title>わからない</title><path d="M988.5 1328 V1340 C988.5 1372 1035.5 1372 1035.5 1404 V1416"/><path d="M1035.5 1454 V1466 C1035.5 1498 1090.667 1498 1090.667 1530 V1542" marker-end="url(#arrow-permutation-swaps)"/><g class="flow-edge-label" data-edge-label="swap-size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1416" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1439">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1064 1692 V1722 C1064 1754 982 1754 982 1786 V1798"/><path d="M982 1836 V1848 C982 1880 876 1880 876 1912 V1924" marker-end="url(#arrow-permutation-swaps)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="942" y="1798" width="80" height="38" rx="5"/><text text-anchor="middle" x="982" y="1821">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1144 1692 V1722 C1144 1754 1131 1754 1131 1786 V1798"/><path d="M1131 1836 V1848 C1131 1880 1090.667 1880 1090.667 1912 V1924" marker-end="url(#arrow-permutation-swaps)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1091" y="1798" width="80" height="38" rx="5"/><text text-anchor="middle" x="1131" y="1821">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1224 1692 V1722 C1224 1754 1259.5 1754 1259.5 1786 V1798"/><path d="M1259.5 1836 V1848 C1259.5 1880 1197.333 1880 1197.333 1912 V1924" marker-end="url(#arrow-permutation-swaps)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1215" y="1798" width="89" height="38" rx="5"/><text text-anchor="middle" x="1259.5" y="1821">わからない</text></g></g><g class="flow-node question" data-node="swap-kind"><rect x="707.388888888889" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="723.388888888889" y="52">質問</text><text class="node-title" x="723.388888888889" y="80">一回に交換できる位置はどれですか？</text><text class="node-explanation" x="723.388888888889" y="107">順列の値はすべて異なり、各値の目標位置が一つに定</text><text class="node-explanation" x="723.388888888889" y="125">まります。</text></g><g class="flow-node question" data-node="permutation-values"><rect x="214.83333333333331" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="230.83333333333331" y="411">質問</text><text class="node-title" x="230.83333333333331" y="439">各値は一回ずつ現れ、値の目標位置を</text><text class="node-title" x="230.83333333333331" y="462">一意に決められますか？</text><text class="node-explanation" x="230.83333333333331" y="489">今の位置から目標位置への対応を一周する循環に分</text><text class="node-explanation" x="230.83333333333331" y="507">け、一つの循環を交換で解消します。</text></g><g class="flow-node result" data-node="permutation-result"><rect x="32" y="755" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="775">候補</text><text class="node-title" x="48" y="803">位置と目標の循環を分け、長さ L </text><text class="node-title" x="48" y="826">の循環を L−1 回で直す</text><a href="/flowchartcp/techniques/permutation-cycle-minimum-swaps/"><title>任意の二箇所を交換できる順列は、値の現在位置を持って直すの記事へ</title><text x="48" y="865">任意の二箇所を交換できる順列は、値の現在位置を</text><text x="48" y="883">持って直す</text></a></g><g class="flow-node question" data-node="swap-components"><rect x="807.8333333333334" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="823.8333333333334" y="411">質問</text><text class="node-title" x="823.8333333333334" y="439">各値の現在位置と目標位置は、交換可</text><text class="node-title" x="823.8333333333334" y="462">能な位置の同じ成分内ですか？</text><text class="node-explanation" x="823.8333333333334" y="489">違う成分へ値を運ぶことはできません。同じ成分な</text><text class="node-explanation" x="823.8333333333334" y="507">ら、許された位置対の全域木上を運べます。</text></g><g class="flow-node question" data-node="swap-leaf"><rect x="508" y="755" width="320" height="191" rx="7"/><text class="node-kind" x="524" y="775">質問</text><text class="node-title" x="524" y="803">各位置対を何度でも使え、木の葉へ目</text><text class="node-title" x="524" y="826">標値を運んだ後、その葉を除けます</text><text class="node-title" x="524" y="849">か？</text><text class="node-explanation" x="524" y="876">各許された交換対は何度でも使えます。葉を確定する</text><text class="node-explanation" x="524" y="894">と残りは小さい木になります。使用回数が一回限りな</text><text class="node-explanation" x="524" y="912">どの制約がある場合は、同じ構築を断定しません。</text></g><g class="flow-node question" data-node="swap-size"><rect x="748.5" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="764.5" y="1180">質問</text><text class="node-title" x="764.5" y="1208">葉までの経路の交換を、出力できる操</text><text class="node-title" x="764.5" y="1231">作数以内で繰り返せますか？</text><text class="node-explanation" x="764.5" y="1258">最短の交換列を求める方法ではありません。N≤</text><text class="node-explanation" x="764.5" y="1276">1000 なら O(N^2) の構築を操作数上限</text><text class="node-explanation" x="764.5" y="1294">と比較します。</text></g><g class="flow-node result" data-node="swap-leaf-result"><rect x="508" y="1542" width="320" height="168" rx="7"/><text class="node-kind" x="524" y="1562">候補</text><text class="node-title" x="524" y="1590">交換可能な木の葉から、目標値を運ん</text><text class="node-title" x="524" y="1613">で確定する</text><a href="/flowchartcp/techniques/permutation-tree-leaf-fix/"><title>交換できる位置対が限られるなら、木の葉から目的の値を固定するの記事へ</title><text x="524" y="1652">交換できる位置対が限られるなら、木の葉から目的</text><text x="524" y="1670">の値を固定する</text></a></g><g class="flow-node result" data-node="swap-impossible"><rect x="872" y="755" width="320" height="168" rx="7"/><text class="node-kind" x="888" y="775">候補</text><text class="node-title" x="888" y="803">値の位置と目標位置が別成分なら、交</text><text class="node-title" x="888" y="826">換不能と判定する</text><a href="/flowchartcp/techniques/permutation-tree-leaf-fix/"><title>交換できる位置対が限られるなら、木の葉から目的の値を固定するの記事へ</title><text x="888" y="865">交換できる位置対が限られるなら、木の葉から目的</text><text x="888" y="883">の値を固定する</text></a></g><g class="flow-node question" data-node="check"><rect x="984" y="1542" width="320" height="150" rx="7"/><text class="node-kind" x="1000" y="1562">質問</text><text class="node-title" x="1000" y="1590">必要な条件を、問題文と小さい例から</text><text class="node-title" x="1000" y="1613">確認できますか？</text><text class="node-explanation" x="1000" y="1640">どの性質が入力で保証され、どの性質を式や操作から</text><text class="node-explanation" x="1000" y="1658">示す必要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="620" y="1924" width="320" height="151" rx="7"/><text class="node-kind" x="636" y="1944">候補</text><text class="node-title" x="636" y="1972">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="636" y="2011">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="636" y="2035">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="984" y="1924" width="320" height="121" rx="7"/><text class="node-kind" x="1000" y="1944">分野</text><text class="node-title" x="1000" y="1972">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1000" y="2009">詳細の質問・図へ →</text></a></g></svg>