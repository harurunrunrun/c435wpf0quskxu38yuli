<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-permutation-swaps flow-desc-permutation-swaps" width="1336" height="2107" viewBox="0 0 1336 2107" data-flow-svg="permutation-swaps"><title id="flow-title-permutation-swaps">交換できる位置と順列の並べ直しの解法フローチャート</title><desc id="flow-desc-permutation-swaps">任意交換と、指定された位置対だけの交換を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-permutation-swaps" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge arbitrary" data-edge="swap-kind:arbitrary:permutation-values"><title>任意の二位置を交換できる</title><path d="M787.389 159 V171 C787.389 203 374.833 203 374.833 235 V247"/><path d="M374.833 285 V315 C374.833 347 374.833 347 374.833 379 V391" marker-end="url(#arrow-permutation-swaps)"/><g class="flow-edge-label" data-edge-label="swap-kind:arbitrary:permutation-values" tabindex="0" role="group" aria-label="選択肢：任意の二位置を交換できる"><rect x="284.8333333333333" y="247" width="180" height="38" rx="5"/><text text-anchor="middle" x="374.8333333333333" y="270">任意の二位置を交換できる</text></g></g><g class="flow-edge allowed-pairs" data-edge="swap-kind:allowed-pairs:swap-components"><title>入力で指定された位置対だけを交換できる</title><path d="M867.389 159 V171 C867.389 203 967.833 203 967.833 235 V247"/><path d="M967.833 303 V315 C967.833 347 967.833 347 967.833 379 V391" marker-end="url(#arrow-permutation-swaps)"/><g class="flow-edge-label" data-edge-label="swap-kind:allowed-pairs:swap-components" tabindex="0" role="group" aria-label="選択肢：入力で指定された位置対だけを交換できる"><rect x="845.3333333333334" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="967.8333333333334" y="270">入力で指定された位置対だけを交換で</text><text text-anchor="middle" x="967.8333333333334" y="288">きる</text></g></g><g class="flow-edge unknown" data-edge="swap-kind:unknown:check"><title>わからない</title><path d="M947.389 159 V171 C947.389