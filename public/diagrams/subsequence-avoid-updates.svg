>はい</title><path d="M588 969 V999 C588 1031 450 1031 450 1063 V1075"/><path d="M450 1113 V1125 C450 1157 384 1157 384 1189 V1201" marker-end="url(#arrow-subsequence-avoid-updates)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 969 V999 C668 1031 655 1031 655 1063 V1075"/><path d="M655 1113 V1125 C655 1157 614.667 1157 614.667 1189 V1201" marker-end="url(#arrow-subsequence-avoid-updates)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 969 V999 C748 1031 783.5 1031 783.5 1063 V1075"/><path d="M783.5 1113 V1125 C783.5 1157 721.333 1157 721.333 1189 V1201" marker-end="url(#arrow-subsequence-avoid-updates)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1098">わからない</text></g></g><g class="flow-node question" data-node="specific"><rect x="459.7222222222223" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">避ける列は abc で、本文と置換</text><text class="node-title" x="475.7222222222223" y="103">先の文字は a・b・c のみです</text><text class="node-title" x="475.7222222222223" y="126">か？</text><text class="node-explanation" x="475.7222222222223" y="153">ab、bc、abc を避ける最少費用を、左右の区</text><text class="node-explanation" x="475.7222222222223" y="171">間の要約からまとめます。この少数の値だけで扱える</text><text class="node-explanation" x="475.7222222222223" y="189">理由は、指定列と文字集合に依存します。</text></g><g class="flow-node question" data-node="unit-cost"><rect x="260.6666666666667" y="437" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="457">質問</text><text class="node-title" x="276.6666666666667" y="485">一文字の置換費用は一律で、問い合わ</text><text class="node-title" x="276.6666666666667" y="508">せによる変更は一か所ずつですか？</text><text class="node-explanation" x="276.6666666666667" y="535">最少削除数と最少置換数の一致を、この abc の</text><text class="node-explanation" x="276.6666666666667" y="553">条件で示します。重み付きの置換や他の禁止列へ、そ</text><text class="node-explanation" x="276.6666666666667" y="571">のまま流用しません。</text></g><g class="flow-node result" data-node="avoid-result"><rect x="32" y="819" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">ab・bc・abc を避ける費用</text><text class="node-title" x="48" y="890">を、区間の連結で更新する</text><a href="/flowchartcp/techniques/forbidden-abc-segment-summary/"><title>部分列 abc を消す最小費用を、区間の六つの値で併合するの記事へ</title><text x="48" y="929">部分列 abc を消す最小費用を、区間の六つの</text><text x="48" y="947">値で併合する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="839">質問</text><text class="node-title" x="524" y="867">入力例で、位置・重複・変更の条件を</text><text class="node-title" x="524" y="890">一つずつ確かめられますか？</text><text class="node-explanation" x="524" y="917">取り出せる文字の位置、同じ文字列を一回と数える</text><text class="node-explanation" x="524" y="935">か、途中で変わるものを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1201" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1221">候補</text><text class="node-title" x="160" y="1249">文字列と操作の条件を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1288">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1312">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1201" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1221">分野</text><text class="node-title" x="524" y="1249">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1286">詳細の質問・図へ →</text></a></g></svg>