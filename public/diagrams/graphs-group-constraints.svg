<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-graphs-group-constraints flow-desc-graphs-group-constraints" width="2568" height="938" viewBox="0 0 2568 938" data-flow-svg="graphs-group-constraints"><title id="flow-title-graphs-group-constraints">組分け・割当・変数どうしの条件の解法フローチャート</title><desc id="flow-desc-graphs-group-constraints">組を選ぶ、容量を割り当てる、変数どうしの制約を満たす問題を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-graphs-group-constraints" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge assignment" data-edge="shortest:assignment:flow-route"><title>組を選ぶ・容量を割り当てる</title><path d="M1164 159 V171 C1164 203 192 203 192 235 V247"/><path d="M192 285 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="shortest:assignment:flow-route" tabindex="0" role="group" aria-label="選択肢：組を選ぶ・容量を割り当てる"><rect x="95.5" y="247" width="193" height="38" rx="5"/><text text-anchor="middle" x="192" y="270">組を選ぶ・容量を割り当てる</text></g></g><g class="flow-edge partition-small" data-edge="shortest:partition-small:small-groups-route"><title>少数の頂点を、内部の全組に辺があるグループへ分ける</title><path d="M1204 159 V171 C1204 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="shortest:partition-small:small-groups-route" tabindex="0" role="group" aria-label="選択肢：少数の頂点を、内部の全組に辺があるグループへ分ける"><rect x="433.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">少数の頂点を、内部の全組に辺がある</text><text text-anchor="middle" x="556" y="288">グループへ分ける</text></g></g><g class="flow-edge constraints" data-edge="shortest:constraints:constraints-route"><title>二つの値の禁止組・偶奇・差の条件を満たせるか</title><path d="M1244 159 V171 C1244 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="shortest:constraints:constraints-route" tabindex="0" role="group" aria-label="選択肢：二つの値の禁止組・偶奇・差の条件を満たせるか"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">二つの値の禁止組・偶奇・差の条件を</text><text text-anchor="middle" x="920" y="288">満たせるか</text></g></g><g class="flow-edge tree-color-union" data-edge="shortest:tree-color-union:tree-color-union-route"><title>木の色を丸ごと併合し、一色の全頂点を連結にする</title><path d="M1284 159 V171 C1284 203 1284 203 1284 235 V247"/><path d="M1284 303 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="shortest:tree-color-union:tree-color-union-route" tabindex="0" role="group" aria-label="選択肢：木の色を丸ごと併合し、一色の全頂点を連結にする"><rect x="1161.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="270">木の色を丸ごと併合し、一色の全頂点</text><text text-anchor="middle" x="1284" y="288">を連結にする</text></g></g><g class="flow-edge three-size-two-connected" data-edge="shortest:three-size-two-connected:three-size-two-connected-route"><title>全頂点を指定の三サイズへ分け、少なくとも二集合を連結にする</title><path d="M1324 159 V171 C1324 203 1648 203 1648 235 V247"/><path d="M1648 303 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="shortest:three-size-two-connected:three-size-two-connected-route" tabindex="0" role="group" aria-label="選択肢：全頂点を指定の三サイズへ分け、少なくとも二集合を連結にする"><rect x="1525.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="270">全頂点を指定の三サイズへ分け、少な</text><text text-anchor="middle" x="1648" y="288">くとも二集合を連結にする</text></g></g><g class="flow-edge cyclic-ranks" data-edge="shortest:cyclic-ranks:cyclic-ranks-route"><title>円周の各位置で、自分より高い個数から確定する大小を調べる</title><path d="M1364 159 V171 C1364 203 2012 203 2012 235 V247"/><path d="M2012 303 V315 C2012 347 2012 347 2012 379 V391" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="shortest:cyclic-ranks:cyclic-ranks-route" tabindex="0" role="group" aria-label="選択肢：円周の各位置で、自分より高い個数から確定する大小を調べる"><rect x="1889.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="270">円周の各位置で、自分より高い個数か</text><text text-anchor="middle" x="2012" y="288">ら確定する大小を調べる</text></g></g><g class="flow-edge unknown" data-edge="shortest:unknown:check"><title>わからない</title><path d="M1404 159 V171 C1404 203 2376 203 2376 235 V247"/><path d="M2376 285 V315 C2376 347 2376 347 2376 379 V391" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="shortest:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2331.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="2376" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M2296 541 V553 C2296 585 2012 585 2012 617 V629"/><path d="M2012 667 V679 C2012 711 2012 711 2012 743 V755" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1972" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="2012" y="652">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2376 541 V553 C2376 585 2363 585 2363 617 V629"/><path d="M2363 667 V679 C2363 711 2322.667 711 2322.667 743 V755" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2323" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="2363" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2456 541 V553 C2456 585 2491.5 585 2491.5 617 V629"/><path d="M2491.5 667 V679 C2491.5 711 2429.333 711 2429.333 743 V755" marker-end="url(#arrow-graphs-group-constraints)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2447" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="2491.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="shortest"><rect x="1124" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1140" y="52">質問</text><text class="node-title" x="1140" y="80">頂点・辺について何を求めますか？</text><text class="node-explanation" x="1140" y="107">最短距離だけでなく、負閉路、順序、連結性、木の集</text><text class="node-explanation" x="1140" y="125">計を区別します。</text></g><g class="flow-node question" data-node="check"><rect x="2216" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="2232" y="411">質問</text><text class="node-title" x="2232" y="439">木・閉路のない一方通行のグラフ・そ</text><text class="node-title" x="2232" y="462">の他を、制約から区別できますか？</text><text class="node-explanation" x="2232" y="489">辺数だけで木や DAG を断定せず、連結性と閉路</text><text class="node-explanation" x="2232" y="507">も確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="2216" y="755" width="320" height="139" rx="7"/><text class="node-kind" x="2232" y="775">分野</text><text class="node-title" x="2232" y="803">条件を確かめる</text><text class="node-explanation" x="2232" y="830">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="2232" y="858">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="flow-route"><rect x="32" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">組の選択・容量・割当</text><a href="/flowchartcp/flowcharts/#diagram-flow-matching" data-route="flow-matching"><text x="48" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1852" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="1868" y="775">候補</text><text class="node-title" x="1868" y="803">頂点・辺の意味を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1868" y="842">状態の設計</text></a><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="1868" y="866">グラフへの帰着</text></a></g><g class="flow-node route" data-node="small-groups-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">選ぶ数・重さ・残す履歴</text><a href="/flowchartcp/flowcharts/#diagram-dp-state" data-route="dp-state"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="constraints-route"><rect x="760" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">二値の禁止組・差の制約</text><a href="/flowchartcp/flowcharts/#diagram-graph-constraints" data-route="graph-constraints"><text x="776" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="tree-color-union-route"><rect x="1124" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">木の色を丸ごと併合し、一色の全頂点</text><text class="node-title" x="1140" y="462">を連結にする</text><a href="/flowchartcp/flowcharts/#diagram-tree-color-closure-conditions" data-route="tree-color-closure-conditions"><text x="1140" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="three-size-two-connected-route"><rect x="1488" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">全頂点を指定の三サイズへ分け、少な</text><text class="node-title" x="1504" y="462">くとも二集合を連結にする</text><a href="/flowchartcp/flowcharts/#diagram-three-size-two-connected-conditions" data-route="three-size-two-connected-conditions"><text x="1504" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="cyclic-ranks-route"><rect x="1852" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="411">分野</text><text class="node-title" x="1868" y="439">円周の各位置で、自分より高い個数か</text><text class="node-title" x="1868" y="462">ら確定する大小を調べる</text><a href="/flowchartcp/flowcharts/#diagram-cyclic-window-height-order-conditions" data-route="cyclic-window-height-order-conditions"><text x="1868" y="499">詳細の質問・図へ →</text></a></g></svg>