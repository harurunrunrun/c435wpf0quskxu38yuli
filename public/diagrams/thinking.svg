<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-thinking flow-desc-thinking" width="1840" height="956" viewBox="0 0 1840 956" data-flow-svg="thinking"><title id="flow-title-thinking">考察の進め方の解法フローチャート</title><desc id="flow-desc-thinking">全探索、式の変形、状態、正当性のどこを進めるか選びます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-thinking" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge operation-goals" data-edge="reason-task:operation-goals:operation-goals-route"><title>操作を戻す・条件に合う形を作る</title><path d="M813.333 182 V194 C813.333 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-thinking)"/><g class="flow-edge-label" data-edge-label="reason-task:operation-goals:operation-goals-route" tabindex="0" role="group" aria-label="選択肢：操作を戻す・条件に合う形を作る"><rect x="82.5" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">操作を戻す・条件に合う形を作る</text></g></g><g class="flow-edge maintained-conditions" data-edge="reason-task:maintained-conditions:maintained-conditions-route"><title>操作中に保つ量・途中の不足を調べる</title><path d="M866.667 182 V194 C866.667 226 556 226 556 258 V270"/><path d="M556 308 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-thinking)"/><g class="flow-edge-label" data-edge-label="reason-task:maintained-conditions:maintained-conditions-route" tabindex="0" role="group" aria-label="選択肢：操作中に保つ量・途中の不足を調べる"><rect x="433.5" y="270" width="245" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">操作中に保つ量・途中の不足を調べる</text></g></g><g class="flow-edge next-choice" data-edge="reason-task:next-choice:next-choice-route"><title>次の一手・あり得る状態を絞る</title><path d="M920 182 V194 C920 226 920 226 920 258 V270"/><path d="M920 308 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-thinking)"/><g class="flow-edge-label" data-edge-label="reason-task:next-choice:next-choice-route" tabindex="0" role="group" aria-label="選択肢：次の一手・あり得る状態を絞る"><rect x="817" y="270" width="206" height="38" rx="5"/><text text-anchor="middle" x="920" y="293">次の一手・あり得る状態を絞る</text></g></g><g class="flow-edge small-examples-counts" data-edge="reason-task:small-examples-counts:small-examples-counts-route"><title>小さい例の答え・各要素の寄与を調べる</title><path d="M973.333 182 V194 C973.333 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-thinking)"/><g class="flow-edge-label" data-edge-label="reason-task:small-examples-counts:small-examples-counts-route" tabindex="0" role="group" aria-label="選択肢：小さい例の答え・各要素の寄与を調べる"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">小さい例の答え・各要素の寄与を調べ</text><text text-anchor="middle" x="1284" y="311">る</text></g></g><g class="flow-edge unknown" data-edge="reason-task:unknown:check"><title>わからない</title><path d="M1026.667 182 V194 C1026.667 226 1648 226 1648 258 V270"/><path d="M1648 308 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-thinking)"/><g class="flow-edge-label" data-edge-label="reason-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1603.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1648" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:observation"><title>はい</title><path d="M1568 546 V583 C1568 615 1284 615 1284 647 V659"/><path d="M1284 697 V709 C1284 741 1284 741 1284 773 V785" marker-end="url(#arrow-thinking)"/><g class="flow-edge-label" data-edge-label="check:yes:observation" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1244" y="659" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="682">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1648 546 V583 C1648 615 1635 615 1635 647 V659"/><path d="M1635 697 V709 C1635 741 1594.667 741 1594.667 773 V785" marker-end="url(#arrow-thinking)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1595" y="659" width="80" height="38" rx="5"/><text text-anchor="middle" x="1635" y="682">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1728 546 V583 C1728 615 1763.5 615 1763.5 647 V659"/><path d="M1763.5 697 V709 C1763.5 741 1701.333 741 1701.333 773 V785" marker-end="url(#arrow-thinking)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1719" y="659" width="89" height="38" rx="5"/><text text-anchor="middle" x="1763.5" y="682">わからない</text></g></g><g class="flow-node question" data-node="reason-task"><rect x="760" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="52">質問</text><text class="node-title" x="776" y="80">操作や解の特徴として、どれを調べた</text><text class="node-title" x="776" y="103">いですか？</text><text class="node-explanation" x="776" y="130">入力例から見える構造と、まだ示せていない主張を選</text><text class="node-explanation" x="776" y="148">びます。</text></g><g class="flow-node route" data-node="operation-goals-route"><rect x="32" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">操作を戻す・条件に合う形を作る</text><text class="node-explanation" x="48" y="489">完成形を作る操作や、操作を逆にたどったときの変化</text><text class="node-explanation" x="48" y="507">を調べます。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-operation-goals" data-route="thinking-operation-goals"><text x="48" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="maintained-conditions-route"><rect x="396" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">操作中に保つ量・途中の不足</text><text class="node-explanation" x="412" y="489">操作の前後で保たれる量や、途中で守るべき条件を調</text><text class="node-explanation" x="412" y="507">べます。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-maintained-conditions" data-route="thinking-maintained-conditions"><text x="412" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="next-choice-route"><rect x="760" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">次の一手・あり得る状態</text><text class="node-explanation" x="776" y="489">先の操作に必要な情報、選択の正当性、可能な状態の</text><text class="node-explanation" x="776" y="507">集合を調べます。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-next-choice" data-route="thinking-next-choice"><text x="776" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="small-examples-counts-route"><rect x="1124" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">小さい例の答え・各要素の寄与</text><text class="node-explanation" x="1140" y="489">小さい入力の全列挙と、各要素が答えに加わる回数か</text><text class="node-explanation" x="1140" y="507">ら性質を探します。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-small-examples-counts" data-route="thinking-small-examples-counts"><text x="1140" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1488" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="1504" y="434">質問</text><text class="node-title" x="1504" y="462">手で追える入力の、操作と答えを列挙</text><text class="node-title" x="1504" y="485">できますか？</text><text class="node-explanation" x="1504" y="512">抽象的な式を、最小の例に戻して確認します。</text></g><g class="flow-node result" data-node="observation"><rect x="1124" y="785" width="320" height="127" rx="7"/><text class="node-kind" x="1140" y="805">候補</text><text class="node-title" x="1140" y="833">小規模全探索から観察する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="1140" y="872">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1488" y="785" width="320" height="139" rx="7"/><text class="node-kind" x="1504" y="805">分野</text><text class="node-title" x="1504" y="833">条件を確かめる</text><text class="node-explanation" x="1504" y="860">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1504" y="888">詳細の質問・図へ →</text></a></g></svg>