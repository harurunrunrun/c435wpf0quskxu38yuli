<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-disjoint-mask-conditions flow-desc-disjoint-mask-conditions" width="748" height="1342" viewBox="0 0 748 1342" data-flow-svg="disjoint-mask-conditions"><title id="flow-title-disjoint-mask-conditions">各値とANDが0になる相手を探すの解法フローチャート</title><desc id="flow-desc-disjoint-mask-conditions">入力の固定、ビット幅、相手の選び方を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-disjoint-mask-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="fixed:yes:small-b"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-disjoint-mask-conditions)"/><g class="flow-edge-label" data-edge-label="fixed:yes:small-b" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="fixed:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V558 C654 590 654 590 654 622 V634 V684 C654 716 654 716 654 748 V760 V940 C654 972 654 972 654 1004 V1016 V1066 C654 1098 624.571 1098 624.571 1130 V1142" marker-end="url(#arrow-disjoint-mask-conditions)"/><g class="flow-edge-label" data-edge-label="fixed:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V558 C710 590 710 590 710 622 V634 V684 C710 716 710 716 710 748 V760 V940 C710 972 710 972 710 1004 V1016 V1066 C710 1098 670.286 1098 670.286 1130 V1142" marker-end="url(#arrow-disjoint-mask-conditions)"/><g class="flow-edge-label" data-edge-label="fixed:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="small-b:yes:value-witness"><title>はい</title><path d="M352.5 546 V558 C352.5 590 307 590 307 622 V634"/><path d="M307 672 V684 C307 716 319.5 716 319.5 748 V760" marker-end="url(#arrow-disjoint-mask-conditions)"/><g class="flow-edge-label" data-edge-label="small-b:yes:value-witness" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="657">はい</text></g></g><g class="flow-edge no" data-edge="small-b:no:check"><title>いいえ</title><path d="M432.5 546 V558 C432.5 590 431 590 431 622 V634"/><path d="M431 672 V684 C431 716 542 716 542 748 V760 V940 C542 972 542 972 542 1004 V1016 V1066 C542 1098 533.143 1098 533.143 1130 V1142" marker-end="url(#arrow-disjoint-mask-conditions)"/><g class="flow-edge-label" data-edge-label="small-b:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="small-b:unknown:check"><title>わからない</title><path d="M512.5 546 V558 C512.5 590 559.5 590 559.5 622 V634"/><path d="M559.5 672 V684 C559.5 716 598 716 598 748 V760 V940 C598 972 598 972 598 1004 V1016 V1066 C598 1098 578.857 1098 578.857 1130 V1142" marker-end="url(#arrow-disjoint-mask-conditions)"/><g class="flow-edge-label" data-edge-label="small-b:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="value-witness:yes:answer"><title>はい</title><path d="M239.5 928 V940 C239.5 972 192 972 192 1004 V1016"/><path d="M192 1054 V1066 C192 1098 192 1098 192 1130 V1142" marker-end="url(#arrow-disjoint-mask-conditions)"/><g class="flow-edge-label" data-edge-label="value-witness:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="value-witness:no:check"><title>いいえ</title><path d="M319.5 928 V940 C319.5 972 319 972 319 1004 V1016"/><path d="M319 1054 V1066 C319 1098 441.714 1098 441.714 1130 V1142" marker-end="url(#arrow-disjoint-mask-conditions)"/><g class="flow-edge-label" data-edge-label="value-witness:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="value-witness:unknown:check"><title>わからない</title><path d="M399.5 928 V940 C399.5 972 447.5 972 447.5 1004 V1016"/><path d="M447.5 1054 V1066 C447.5 1098 487.429 1098 487.429 1130 V1142" marker-end="url(#arrow-disjoint-mask-conditions)"/><g class="flow-edge-label" data-edge-label="value-witness:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="fixed"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">入力列は固定で、各値について相手を</text><text class="node-title" x="400.5" y="103">独立に調べますか？</text><text class="node-explanation" x="400.5" y="130">全体で相手を一度ずつ使う割当や、入力値の追加・削</text><text class="node-explanation" x="400.5" y="148">除は扱いません。</text></g><g class="flow-node question" data-node="small-b"><rect x="272.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">全て非負で、ビット幅Bの全マスクを</text><text class="node-title" x="288.5" y="467">保存・走査できますか？</text><text class="node-explanation" x="288.5" y="494">掲載実装はBが22以下。B×2のB乗程度の前処理</text><text class="node-explanation" x="288.5" y="512">と、2のB乗個の表が必要です。</text></g><g class="flow-node question" data-node="value-witness"><rect x="159.5" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">入力中の相手の値を一つ返せばよく、</text><text class="node-title" x="175.5" y="831">同じ位置の使用も許されますか？</text><text class="node-explanation" x="175.5" y="858">原典のように全値が正なら同じ位置は適合しません。</text><text class="node-explanation" x="175.5" y="876">0を許して異なる位置を要求する場合には、0の個数</text><text class="node-explanation" x="175.5" y="894">や別の添字も必要です。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">各補集合に含まれる入力値を、部分集</text><text class="node-title" x="48" y="1213">合からの伝播で保存する</text><a href="/flowchartcp/techniques/disjoint-mask-subset-witness/"><title>各値とANDが0になる相手は、補集合に含まれる入力値を一つずつ保存するの記事へ</title><text x="48" y="1252">各値とANDが0になる相手は、補集合に含まれる</text><text x="48" y="1270">入力値を一つずつ保存する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1162">分野</text><text class="node-title" x="412" y="1190">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1227">詳細の質問・図へ →</text></a></g></svg>