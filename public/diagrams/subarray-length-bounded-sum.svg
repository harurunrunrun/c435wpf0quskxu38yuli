h d="M588 933 V1005 C588 1037 450 1037 450 1069 V1081"/><path d="M450 1119 V1131 C450 1163 384 1163 384 1195 V1207" marker-end="url(#arrow-subarray-length-bounded-sum)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1081" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1104">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 933 V1005 C668 1037 655 1037 655 1069 V1081"/><path d="M655 1119 V1131 C655 1163 614.667 1163 614.667 1195 V1207" marker-end="url(#arrow-subarray-length-bounded-sum)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1081" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1104">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 933 V1005 C748 1037 783.5 1037 783.5 1069 V1081"/><path d="M783.5 1119 V1131 C783.5 1163 721.333 1163 721.333 1195 V1207" marker-end="url(#arrow-subarray-length-bounded-sum)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1081" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1104">わからない</text></g></g><g class="flow-node question" data-node="bounds"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">長さの条件は 1≤a≤b≤N で、</text><text class="node-title" x="475.7222222222223" y="103">値は変わらない数列ですか？</text><text class="node-explanation" x="475.7222222222223" y="130">負数を含んでも使えます。和そのものを正の値の単調</text><text class="node-explanation" x="475.7222222222223" y="148">性で窓にしません。</text></g><g class="flow-node question" data-node="prefix"><rect x="260.6666666666667" y="396" width="320" height="191" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">右端 r の区間和を、P[r]−</text><text class="node-title" x="276.6666666666667" y="467">min(P[l])、l∈[r−b,</text><text class="node-title" x="276.6666666666667" y="490">r−a] と書けますか？</text><text class="node-explanation" x="276.6666666666667" y="517">右端を増やすと、候補の両端も右へ進みます。古い候</text><text class="node-explanation" x="276.6666666666667" y="535">補は期限切れで消し、新しい小さい接頭辞に劣る候補</text><text class="node-explanation" x="276.6666666666667" y="553">も消します。</text></g><g class="flow-node result" data-node="sum-result"><rect x="32" y="801" width="320" height="192" rx="7"/><text class="node-kind" x="48" y="821">候補</text><text class="node-title" x="48" y="849">右端を進め、使える接頭辞の最小値を</text><text class="node-title" x="48" y="872">期限付きの候補として持つ</text><a href="/flowchartcp/techniques/dp-sliding-min/"><title>遷移元の範囲が右へ動くDPを単調キューで計算するの記事へ</title><text x="48" y="911">遷移元の範囲が右へ動くDPを単調キューで計算す</text><text x="48" y="929">る</text></a><a href="/flowchartcp/techniques/monotone-queue/"><title>単調キューの記事へ</title><text x="48" y="953">単調キュー</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="801" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="821">質問</text><text class="node-title" x="524" y="849">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="872">確認できますか？</text><text class="node-explanation" x="524" y="899">入力の更新、許される操作、境界を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1207" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1227">候補</text><text class="node-title" x="160" y="1255">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1294">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1318">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1207" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1227">分野</text><text class="node-title" x="524" y="1255">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1292">詳細の質問・図へ →</text></a></g></svg>