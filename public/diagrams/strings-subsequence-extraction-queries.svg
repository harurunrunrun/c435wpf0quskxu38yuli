<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strings-subsequence-extraction-queries flow-desc-strings-subsequence-extraction-queries" width="1476" height="1790" viewBox="0 0 1476 1790" data-flow-svg="strings-subsequence-extraction-queries"><title id="flow-title-strings-subsequence-extraction-queries">本文からの部分列の取り出しの解法フローチャート</title><desc id="flow-desc-strings-subsequence-extraction-queries">固定または反復する本文から指定列を取り出し、区間内で指定された形の部分列を最長にします。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strings-subsequence-extraction-queries" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge many-queries" data-edge="subsequence-check:many-queries:subsequence-query-order"><title>固定された本文から、多数の列を部分列として取り出せるか</title><path d="M892 182 V194 C892 226 500 226 500 258 V270"/><path d="M500 326 V356 C500 388 500 388 500 420 V432" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="subsequence-check:many-queries:subsequence-query-order" tabindex="0" role="group" aria-label="選択肢：固定された本文から、多数の列を部分列として取り出せるか"><rect x="377.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="500" y="293">固定された本文から、多数の列を部分</text><text text-anchor="middle" x="500" y="311">列として取り出せるか</text></g></g><g class="flow-edge repeated-text" data-edge="subsequence-check:repeated-text:repeat-next-check"><title>本文を無限に繰り返した列から、部分列を取り出す</title><path d="M956 182 V194 C956 226 864 226 864 258 V270"/><path d="M864 326 V356 C864 388 864 388 864 420 V432" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="subsequence-check:repeated-text:repeat-next-check" tabindex="0" role="group" aria-label="選択肢：本文を無限に繰り返した列から、部分列を取り出す"><rect x="741.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="864" y="293">本文を無限に繰り返した列から、部分</text><text text-anchor="middle" x="864" y="311">列を取り出す</text></g></g><g class="flow-edge slash-balanced" data-edge="subsequence-check:slash-balanced:slash-balanced-route"><title>指定区間から 1 の列・スラッシュ・同数の 2 の列を最長で取り出す</title><path d="M1020 182 V194 C1020 226 1188.5 226 1188.5 258 V270"/><path d="M1188.5 344 V356 C1188.5 388 1228 388 1228 420 V432" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="subsequence-check:slash-balanced:slash-balanced-route" tabindex="0" role="group" aria-label="選択肢：指定区間から 1 の列・スラッシュ・同数の 2 の列を最長で取り出す"><rect x="1066" y="270" width="245" height="74" rx="5"/><text text-anchor="middle" x="1188.5" y="293">指定区間から 1 の列・スラッ</text><text text-anchor="middle" x="1188.5" y="311">シュ・同数の 2 の列を最長で取り</text><text text-anchor="middle" x="1188.5" y="329">出す</text></g></g><g class="flow-edge unknown" data-edge="subsequence-check:unknown:check"><title>わからない</title><path d="M1084 182 V194 C1084 226 1399.5 226 1399.5 258 V270"/><path d="M1399.5 308 V356 C1399.5 388 1438 388 1438 420 V432 V612 C1438 644 1438 644 1438 676 V688 V756 C1438 788 1438 788 1438 820 V832 V1035 C1438 1067 1438 1067 1438 1099 V1111 V1161 C1438 1193 1390.667 1193 1390.667 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="subsequence-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:substring-route"><title>はい</title><path d="M1204 1387 V1417 C1204 1449 920 1449 920 1481 V1493"/><path d="M920 1531 V1543 C920 1575 920 1575 920 1607 V1619" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="check:yes:substring-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="1493" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1516">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 1387 V1417 C1284 1449 1271 1449 1271 1481 V1493"/><path d="M1271 1531 V1543 C1271 1575 1230.667 1575 1230.667 1607 V1619" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="1493" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="1516">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 1387 V1417 C1364 1449 1399.5 1449 1399.5 1481 V1493"/><path d="M1399.5 1531 V1543 C1399.5 1575 1337.333 1575 1337.333 1607 V1619" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="1493" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="1516">わからない</text></g></g><g class="flow-edge yes" data-edge="next-occurrence-check:yes:next-occurrence-result"><title>はい</title><path d="M616 1000 V1035 C616 1067 923 1067 923 1099 V1111"/><path d="M923 1149 V1161 C923 1193 556 1193 556 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="next-occurrence-check:yes:next-occurrence-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="883" y="1111" width="80" height="38" rx="5"/><text text-anchor="middle" x="923" y="1134">はい</text></g></g><g class="flow-edge no" data-edge="next-occurrence-check:no:fallback"><title>いいえ</title><path d="M696 1000 V1035 C696 1067 1047 1067 1047 1099 V1111"/><path d="M1047 1149 V1161 C1047 1193 920 1193 920 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="next-occurrence-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1007" y="1111" width="80" height="38" rx="5"/><text text-anchor="middle" x="1047" y="1134">いいえ</text></g></g><g class="flow-edge unknown" data-edge="next-occurrence-check:unknown:check"><title>わからない</title><path d="M776 1000 V1035 C776 1067 1175.5 1067 1175.5 1099 V1111"/><path d="M1175.5 1149 V1161 C1175.5 1193 1230.667 1193 1230.667 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="next-occurrence-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1131" y="1111" width="89" height="38" rx="5"/><text text-anchor="middle" x="1175.5" y="1134">わからない</text></g></g><g class="flow-edge yes" data-edge="repeat-next-check:yes:repeat-next-result"><title>はい</title><path d="M784 600 V612 C784 644 1091 644 1091 676 V688"/><path d="M1091 726 V756 C1091 788 1116 788 1116 820 V832" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="repeat-next-check:yes:repeat-next-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1051" y="688" width="80" height="38" rx="5"/><text text-anchor="middle" x="1091" y="711">はい</text></g></g><g class="flow-edge no" data-edge="repeat-next-check:no:fallback"><title>いいえ</title><path d="M864 600 V612 C864 644 1215 644 1215 676 V688"/><path d="M1215 726 V756 C1215 788 1326 788 1326 820 V832 V1035 C1326 1067 1326 1067 1326 1099 V1111 V1161 C1326 1193 1000 1193 1000 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="repeat-next-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1175" y="688" width="80" height="38" rx="5"/><text text-anchor="middle" x="1215" y="711">いいえ</text></g></g><g class="flow-edge unknown" data-edge="repeat-next-check:unknown:check"><title>わからない</title><path d="M944 600 V612 C944 644 1343.5 644 1343.5 676 V688"/><path d="M1343.5 726 V756 C1343.5 788 1382 788 1382 820 V832 V1035 C1382 1067 1382 1067 1382 1099 V1111 V1161 C1382 1193 1337.333 1193 1337.333 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="repeat-next-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1299" y="688" width="89" height="38" rx="5"/><text text-anchor="middle" x="1343.5" y="711">わからない</text></g></g><g class="flow-edge together" data-edge="subsequence-query-order:together:waiting-check"><title>一覧を先に受け取り、まとめて照合できる</title><path d="M420 600 V612 C420 644 332 644 332 676 V688"/><path d="M332 744 V756 C332 788 332 788 332 820 V832" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="subsequence-query-order:together:waiting-check" tabindex="0" role="group" aria-label="選択肢：一覧を先に受け取り、まとめて照合できる"><rect x="209.5" y="688" width="245" height="56" rx="5"/><text text-anchor="middle" x="332" y="711">一覧を先に受け取り、まとめて照合で</text><text text-anchor="middle" x="332" y="729">きる</text></g></g><g class="flow-edge online" data-edge="subsequence-query-order:online:next-occurrence-check"><title>問い合わせを一つずつ受け取り、その都度答える</title><path d="M500 600 V612 C500 644 696 644 696 676 V688"/><path d="M696 744 V756 C696 788 696 788 696 820 V832" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="subsequence-query-order:online:next-occurrence-check" tabindex="0" role="group" aria-label="選択肢：問い合わせを一つずつ受け取り、その都度答える"><rect x="573.5" y="688" width="245" height="56" rx="5"/><text text-anchor="middle" x="696" y="711">問い合わせを一つずつ受け取り、その</text><text text-anchor="middle" x="696" y="729">都度答える</text></g></g><g class="flow-edge unknown" data-edge="subsequence-query-order:unknown:check"><title>わからない</title><path d="M580 600 V612 C580 644 907 644 907 676 V688"/><path d="M907 726 V756 C907 788 906 788 906 820 V832 V1035 C906 1067 1270 1067 1270 1099 V1111 V1161 C1270 1193 1284 1193 1284 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="subsequence-query-order:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="862.5" y="688" width="89" height="38" rx="5"/><text text-anchor="middle" x="907" y="711">わからない</text></g></g><g class="flow-edge yes" data-edge="waiting-check:yes:waiting-result"><title>はい</title><path d="M252 1023 V1035 C252 1067 192 1067 192 1099 V1111"/><path d="M192 1149 V1161 C192 1193 192 1193 192 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="waiting-check:yes:waiting-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1111" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1134">はい</text></g></g><g class="flow-edge no" data-edge="waiting-check:no:fallback"><title>いいえ</title><path d="M332 1023 V1035 C332 1067 666 1067 666 1099 V1111"/><path d="M666 1149 V1161 C666 1193 840 1193 840 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="waiting-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="626" y="1111" width="80" height="38" rx="5"/><text text-anchor="middle" x="666" y="1134">いいえ</text></g></g><g class="flow-edge unknown" data-edge="waiting-check:unknown:check"><title>わからない</title><path d="M412 1023 V1035 C412 1067 794.5 1067 794.5 1099 V1111"/><path d="M794.5 1149 V1161 C794.5 1193 1177.333 1193 1177.333 1225 V1237" marker-end="url(#arrow-strings-subsequence-extraction-queries)"/><g class="flow-edge-label" data-edge-label="waiting-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="750" y="1111" width="89" height="38" rx="5"/><text text-anchor="middle" x="794.5" y="1134">わからない</text></g></g><g class="flow-node question" data-node="subsequence-check"><rect x="828" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="844" y="52">質問</text><text class="node-title" x="844" y="80">どの本文から、どの形の部分列を取り</text><text class="node-title" x="844" y="103">出しますか？</text><text class="node-explanation" x="844" y="130">本文の反復と問い合わせの受け取り方、残す部分列の</text><text class="node-explanation" x="844" y="148">形を確かめます。</text></g><g class="flow-node question" data-node="check"><rect x="1124" y="1237" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="1257">質問</text><text class="node-title" x="1140" y="1285">求めているのは、連続した部分文字列</text><text class="node-title" x="1140" y="1308">ですか？</text><text class="node-explanation" x="1140" y="1335">連続しない部分列なら、添字や最後の文字などを状態</text><text class="node-explanation" x="1140" y="1353">にする DP を検討します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="1619" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="1639">分野</text><text class="node-title" x="1140" y="1667">条件を確かめる</text><text class="node-explanation" x="1140" y="1694">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="1722">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="substring-route"><rect x="760" y="1619" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="1639">分野</text><text class="node-title" x="776" y="1667">部分文字列</text><a href="/flowchartcp/flowcharts/#diagram-string-substring" data-route="string-substring"><text x="776" y="1704">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="760" y="1237" width="320" height="151" rx="7"/><text class="node-kind" x="776" y="1257">候補</text><text class="node-title" x="776" y="1285">必要な文字列情報を定義する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="776" y="1324">状態の設計</text></a><a href="/flowchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="776" y="1348">対称性</text></a></g><g class="flow-node question" data-node="next-occurrence-check"><rect x="536" y="832" width="320" height="168" rx="7"/><text class="node-kind" x="552" y="852">質問</text><text class="node-title" x="552" y="880">各文字の次の出現へ進めれば、最も早</text><text class="node-title" x="552" y="903">い取り出し方を保てますか？</text><text class="node-explanation" x="552" y="930">本文の位置を戻さず、問い合わせの文字を順番に見ま</text><text class="node-explanation" x="552" y="948">す。文字種が大きい場合は出現位置の列で二分探索し</text><text class="node-explanation" x="552" y="966">ます。</text></g><g class="flow-node result" data-node="next-occurrence-result"><rect x="396" y="1237" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="1257">候補</text><text class="node-title" x="412" y="1285">本文の各位置から、次に現れる文字の</text><text class="node-title" x="412" y="1308">位置へ進む</text><a href="/flowchartcp/techniques/substring-subsequence-next/"><title>部分列の一致を、各文字の次の出現位置で進めるの記事へ</title><text x="412" y="1347">部分列の一致を、各文字の次の出現位置で進める</text></a></g><g class="flow-node question" data-node="repeat-next-check"><rect x="704" y="432" width="320" height="168" rx="7"/><text class="node-kind" x="720" y="452">質問</text><text class="node-title" x="720" y="480">必要な文字が本文にすべてあり、末尾</text><text class="node-title" x="720" y="503">を越えたら次の一周へ戻れますか？</text><text class="node-explanation" x="720" y="530">本文に一度も現れない文字が必要なら不可能です。次</text><text class="node-explanation" x="720" y="548">の出現が現在の周にないときだけ、一周分を足しま</text><text class="node-explanation" x="720" y="566">す。</text></g><g class="flow-node result" data-node="repeat-next-result"><rect x="956" y="832" width="320" height="150" rx="7"/><text class="node-kind" x="972" y="852">候補</text><text class="node-title" x="972" y="880">次の出現位置へ進み、末尾を越えた回</text><text class="node-title" x="972" y="903">数を数える</text><a href="/flowchartcp/techniques/substring-subsequence-next/"><title>部分列の一致を、各文字の次の出現位置で進めるの記事へ</title><text x="972" y="942">部分列の一致を、各文字の次の出現位置で進める</text></a></g><g class="flow-node question" data-node="subsequence-query-order"><rect x="340" y="432" width="320" height="168" rx="7"/><text class="node-kind" x="356" y="452">質問</text><text class="node-title" x="356" y="480">問い合わせる列を、本文を読む前にま</text><text class="node-title" x="356" y="503">とめて受け取れますか？</text><text class="node-explanation" x="356" y="530">全ての列が先に分かる場合は、次に必要な文字が同じ</text><text class="node-explanation" x="356" y="548">列を一緒に進められます。逐次の問い合わせには、本</text><text class="node-explanation" x="356" y="566">文の次の出現位置を使えます。</text></g><g class="flow-node question" data-node="waiting-check"><rect x="172" y="832" width="320" height="191" rx="7"/><text class="node-kind" x="188" y="852">質問</text><text class="node-title" x="188" y="880">同じ本文の一文字で、一つの問い合わ</text><text class="node-title" x="188" y="903">せを二文字以上進めないようにできま</text><text class="node-title" x="188" y="926">すか？</text><text class="node-explanation" x="188" y="953">処理開始時の待ち一覧だけを取り出します。同じ文字</text><text class="node-explanation" x="188" y="971">を次にも待つ列は、新しい一覧へ戻し、次の位置まで</text><text class="node-explanation" x="188" y="989">処理しません。</text></g><g class="flow-node result" data-node="waiting-result"><rect x="32" y="1237" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1257">候補</text><text class="node-title" x="48" y="1285">次に必要な文字が同じ列だけを、一文</text><text class="node-title" x="48" y="1308">字ずつ進める</text><a href="/flowchartcp/techniques/subsequence-waiting-buckets/"><title>多数の部分列照合を、次に待っている文字ごとの列で進めるの記事へ</title><text x="48" y="1347">多数の部分列照合を、次に待っている文字ごとの列</text><text x="48" y="1365">で進める</text></a></g><g class="flow-node route" data-node="slash-balanced-route"><rect x="1068" y="432" width="320" height="121" rx="7"/><text class="node-kind" x="1084" y="452">分野</text><text class="node-title" x="1084" y="480">区間内の中央と、左右の文字数</text><a href="/flowchartcp/flowcharts/#diagram-slash-balanced-subsequence" data-route="slash-balanced-subsequence"><text x="1084" y="517">詳細の質問・図へ →</text></a></g></svg>