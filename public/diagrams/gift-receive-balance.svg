<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-gift-receive-balance flow-desc-gift-receive-balance" width="860" height="1330" viewBox="0 0 860 1330" data-flow-svg="gift-receive-balance"><title id="flow-title-gift-receive-balance">受取個数の差を小さくする割当の解法フローチャート</title><desc id="flow-desc-gift-receive-balance">受取数を入れる区間を固定し、その範囲で全ての品物を渡せるか調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-gift-receive-balance" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:bounds"><title>はい</title><path d="M539.722 182 V194 C539.722 226 420.667 226 420.667 258 V270"/><path d="M420.667 308 V320 C420.667 352 420.667 352 420.667 384 V396" marker-end="url(#arrow-gift-receive-balance)"/><g class="flow-edge-label" data-edge-label="model:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="model:no:fallback"><title>いいえ</title><path d="M619.722 182 V194 C619.722 226 655 226 655 258 V270"/><path d="M655 308 V320 C655 352 762.5 352 762.5 384 V396 V581 C762.5 613 762.5 613 762.5 645 V657 V707 C762.5 739 458 739 458 771 V783 V945 C458 977 360 977 360 1009 V1021 V1071 C360 1103 304 1103 304 1135 V1147" marker-end="url(#arrow-gift-receive-balance)"/><g class="flow-edge-label" data-edge-label="model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M699.722 182 V194 C699.722 226 783.5 226 783.5 258 V270"/><path d="M783.5 308 V320 C783.5 352 818.5 352 818.5 384 V396 V581 C818.5 613 818.5 613 818.5 645 V657 V707 C818.5 739 721.333 739 721.333 771 V783" marker-end="url(#arrow-gift-receive-balance)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:balance-result"><title>はい</title><path d="M340.667 569 V581 C340.667 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-gift-receive-balance)"/><g class="flow-edge-label" data-edge-label="bounds:yes:balance-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:fallback"><title>いいえ</title><path d="M420.667 569 V581 C420.667 613 402 613 402 645 V657"/><path d="M402 695 V707 C402 739 402 739 402 771 V783 V945 C402 977 304 977 304 1009 V1021 V1071 C304 1103 224 1103 224 1135 V1147" marker-end="url(#arrow-gift-receive-balance)"/><g class="flow-edge-label" data-edge-label="bounds:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M500.667 569 V581 C500.667 613 668 613 668 645 V657"/><path d="M668 695 V707 C668 739 614.667 739 614.667 771 V783" marker-end="url(#arrow-gift-receive-balance)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 915 V945 C588 977 450 977 450 1009 V1021"/><path d="M450 1059 V1071 C450 1103 384 1103 384 1135 V1147" marker-end="url(#arrow-gift-receive-balance)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1044">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 915 V945 C668 977 655 977 655 1009 V1021"/><path d="M655 1059 V1071 C655 1103 614.667 1103 614.667 1135 V1147" marker-end="url(#arrow-gift-receive-balance)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1044">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 915 V945 C748 977 783.5 977 783.5 1009 V1021"/><path d="M783.5 1059 V1071 C783.5 1103 721.333 1103 721.333 1135 V1147" marker-end="url(#arrow-gift-receive-balance)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1021" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1044">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">各品物を候補の人のうち一人へ渡し、</text><text class="node-title" x="475.7222222222223" y="103">人ごとの受取個数を揃えたいですか？</text><text class="node-explanation" x="475.7222222222223" y="130">人の受取個数の最大と最小の差を最小にし、同じ差な</text><text class="node-explanation" x="475.7222222222223" y="148">ら最小受取数を高める場合も含みます。</text></g><g class="flow-node question" data-node="bounds"><rect x="260.6666666666667" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">受取個数を l..h に固定したと</text><text class="node-title" x="276.6666666666667" y="467">き、全品物を渡せるかの判定へ変えら</text><text class="node-title" x="276.6666666666667" y="490">れますか？</text><text class="node-explanation" x="276.6666666666667" y="517">品物から候補の人への辺は一個分、人から出口への辺</text><text class="node-explanation" x="276.6666666666667" y="535">は下限 l・上限 h として扱います。</text></g><g class="flow-node result" data-node="balance-result"><rect x="32" y="783" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">受取数の候補区間を固定し、下限・上</text><text class="node-title" x="48" y="854">限付きの割当が可能か調べる</text><a href="/flowchartcp/techniques/lower-bound-flow/"><title>流量下限付きフローの記事へ</title><text x="48" y="893">流量下限付きフロー</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="783" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="803">質問</text><text class="node-title" x="524" y="831">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="854">確認できますか？</text><text class="node-explanation" x="524" y="881">操作の順序、更新する値、求める量を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1147" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1167">候補</text><text class="node-title" x="160" y="1195">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1234">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1258">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1147" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1167">分野</text><text class="node-title" x="524" y="1195">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1232">詳細の質問・図へ →</text></a></g></svg>