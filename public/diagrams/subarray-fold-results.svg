ext-anchor="middle" x="402" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="gcd-bound:unknown:check"><title>わからない</title><path d="M514.833 564 V576 C514.833 608 710.5 608 710.5 640 V652"/><path d="M710.5 690 V702 C710.5 734 952 734 952 766 V778" marker-end="url(#arrow-subarray-fold-results)"/><g class="flow-edge-label" data-edge-label="gcd-bound:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="666" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="710.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="or-bound:yes:fold-or-result"><title>はい</title><path d="M884.5 559 V576 C884.5 608 839 608 839 640 V652"/><path d="M839 690 V702 C839 734 612 734 612 766 V778" marker-end="url(#arrow-subarray-fold-results)"/><g class="flow-edge-label" data-edge-label="or-bound:yes:fold-or-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="799" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="839" y="675">はい</text></g></g><g class="flow-edge no" data-edge="or-bound:no:fallback"><title>いいえ</title><path d="M964.5 559 V576 C964.5 608 963 608 963 640 V652"/><path d="M963 690 V702 C963 734 822 734 822 766 V778 V958 C822 990 780 990 780 1022 V1034 V1084 C780 1116 692 1116 692 1148 V1160" marker-end="url(#arrow-subarray-fold-results)"/><g class="flow-edge-label" data-edge-label="or-bound:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="or-bound:unknown:check"><title>わからない</title><path d="M1044.5 559 V576 C1044.5 608 1091.5 608 1091.5 640 V652"/><path d="M1091.5 690 V702 C1091.5 734 1032 734 1032 766 V778" marker-end="url(#arrow-subarray-fold-results)"/><g class="flow-edge-label" data-edge-label="or-bound:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M952 910 V958 C952 990 870 990 870 1022 V1034"/><path d="M870 1072 V1084 C870 1116 756 1116 756 1148 V1160" marker-end="url(#arrow-subarray-fold-results)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="830" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="870" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1032 910 V958 C1032 990 1019 990 1019 1022 V1034"/><path d="M1019 1072 V1084 C1019 1116 1034.667 1116 1034.667 1148 V1160" marker-end="url(#arrow-subarray-fold-results)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="979" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="1019" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1112 910 V958 C1112 990 1147.5 990 1147.5 1022 V1034"/><path d="M1147.5 1072 V1084 C1147.5 1116 1141.333 1116 1141.333 1148 V1160" marker-end="url(#arrow-subarray-fold-results)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1103" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="1147.5" y="1057">わからない</text></g></g><g class="flow-node question" data-node="operation"><rect x="727.2083333333333" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="743.2083333333333" y="52">質問</text><text class="node-title" x="743.2083333333333" y="80">区間の集計はどの演算ですか？</text><text class="node-explanation" x="743.2083333333333" y="107">区間を伸ばすと、集計値が変わる回数を少なくできる</text><text class="node-explanation" x="743.2083333333333" y="125">演算を使います。</text></g><g class="flow-node question" data-node="gcd-bound"><rect x="274.8333333333333" y="391" width="320" height="173" rx="7"/><text class="node-kind" x="290.8333333333333" y="411">質問</text><text class="node-title" x="290.8333333333333" y="439">全ての値が正整数で、GCD が変わ</text><text class="node-title" x="290.8333333333333" y="462">るたび真の約数になり、短い値列へま</text><text class="node-title" x="290.8333333333333" y="485">とめられますか？</text><text class="node-explanation" x="290.8333333333333" y="512">正の GCD は変わるたび半分以下になります。掲</text><text class="node-explanation" x="290.8333333333333" y="530">載実装は 0 を含む配列を受け付けません。</text></g><g class="flow-node question" data-node="or-bound"><rect x="804.5" y="391" width="320" height="168" rx="7"/><text class="node-kind" x="820.5" y="411">質問</text><text class="node-title" x="820.5" y="439">固定幅の非負整数で、区間を伸ばすと</text><text class="node-title" x="820.5" y="462">立つビットが増えるだけですか？</text><text class="node-explanation" x="820.5" y="489">異なる値へ変わるたび、新しいビットが少なくとも一</text><text class="node-explanation" x="820.5" y="507">つ立ちます。和や XOR は同じ上限を持ちませ</text><text class="node-explanation" x="820.5" y="525">ん。</text></g><g class="flow-node result" data-node="fold-gcd-result"><rect x="32" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="798">候補</text><text class="node-title" x="48" y="826">前の右端の短い値列へ GCD を作</text><text class="node-title" x="48" y="849">用させ、等しい値と区間数をまとめる</text><a href="/flowchartcp/techniques/subarray-fold-value-runs/"><title>同じ右端のGCDやORは、値が変わる部分だけを短い列にまとめるの記事へ</title><text x="48" y="888">同じ右端のGCDやORは、値が変わる部分だけを</text><text x="48" y="906">短い列にまとめる</text></a></g><g class="flow-node result" data-node="fold-or-result"><rect x="452" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="468" y="798">候補</text><text class="node-title" x="468" y="826">前の右端の短い値列へ OR を作用</text><text class="node-title" x="468" y="849">させ、同じ結果をまとめる</text><a href="/flowchartcp/techniques/subarray-fold-value-runs/"><title>同じ右端のGCDやORは、値が変わる部分だけを短い列にまとめるの記事へ</title><text x="468" y="888">同じ右端のGCDやORは、値が変わる部分だけを</text><text x="468" y="906">短い列にまとめる</text></a></g><g class="flow-node question" data-node="check"><rect x="872" y="778" width="320" height="132" rx="7"/><text class="node-kind" x="888" y="798">質問</text><text class="node-title" x="888" y="826">必要な条件を、問題文と小さい例から</text><text class="node-title" x="888" y="849">確認できますか？</text><text class="node-explanation" x="888" y="876">操作の条件と、求める個数・値・順序を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="564" y="1160" width="320" height="151" rx="7"/><text class="node-kind" x="580" y="1180">候補</text><text class="node-title" x="580" y="1208">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="580" y="1247">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="580" y="1271">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="928" y="1160" width="320" height="121" rx="7"/><text class="node-kind" x="944" y="1180">分野</text><text class="node-title" x="944" y="1208">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="944" y="1245">詳細の質問・図へ →</text></a></g></svg>