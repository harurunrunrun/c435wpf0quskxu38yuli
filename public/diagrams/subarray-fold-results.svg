<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-subarray-fold-results flow-desc-subarray-fold-results" width="1280" height="1343" viewBox="0 0 1280 1343" data-flow-svg="subarray-fold-results"><title id="flow-title-subarray-fold-results">全区間の GCD・OR の値と個数の解法フローチャート</title><desc id="flow-desc-subarray-fold-results">同じ右端の区間を、集計結果が同じ連続部分ごとにまとめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-subarray-fold-results" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge gcd" data-edge="operation:gcd:gcd-bound"><title>正整数の最大公約数ごとの区間数</title><path d="M791.208 159 V171 C791.208 203 434.833 203 434.833 235 V247"/><path d="M434.833 285 V315 C434.833 347 434.833 347 434.833 379 V391" marker-end="url(#arrow-subarray-fold-results)"/><g class="flow-edge-label" data-edge-label="operation:gcd:gcd-bound" tabindex="0" role="group" aria-label="選択肢：正整数の最大公約数ごとの区間数"><rect x="325.3333333333333" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="434.8333333333333" y="270">正整数の最大公約数ごとの区間数</text></g></g><g class="flow-edge or" data-edge="operation:or:or-bound"><title>非負整数のビット OR の異なる結果値</title><path d="M855.208 159 V171 C855.208 203 846.5 203 846.5 235 V247"/><path d="M846.5 303 V315 C846.5 347 964.5 347 964.5 379 V391" marker-end="url(#arrow-subarray-fold-results)"/><g class="flow-edge-label" data-edge-label="operation:or:or-bound" tabindex="0" role="group" aria-label="選択肢：非負整数のビット OR の異なる結果値"><rect x="724" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="846.5" y="270">非負整数のビット OR の異なる結</text><text text-anchor="middle" x="846.5" y="288">果値</text></g></g><g class="flow-edge other" data-edge="operation:other:fallback"><title>その他の演算</title><path d="M919.208 159 V171 C919.208 203 1064 203 1064 235 V247"/><path d="M1064 285 V315 C1064 347 1186 347 1186 379 V391