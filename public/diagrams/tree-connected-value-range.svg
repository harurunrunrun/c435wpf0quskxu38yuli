<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-connected-value-range flow-desc-tree-connected-value-range" width="860" height="1412" viewBox="0 0 860 1412" data-flow-svg="tree-connected-value-range"><title id="flow-title-tree-connected-value-range">値の幅が小さい木の連結集合の解法フローチャート</title><desc id="flow-desc-tree-connected-value-range">最小の値と入力位置を担当にし、許された部分木の選び方を合成します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-connected-value-range" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="tree:yes:owner"><title>はい</title><path d="M539.722 205 V217 C539.722 249 420.667 249 420.667 281 V293"/><path d="M420.667 331 V343 C420.667 375 420.667 375 420.667 407 V419" marker-end="url(#arrow-tree-connected-value-range)"/><g class="flow-edge-label" data-edge-label="tree:yes:owner" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="316">はい</text></g></g><g class="flow-edge no" data-edge="tree:no:fallback"><title>いいえ</title><path d="M619.722 205 V217 C619.722 249 655 249 655 281 V293"/><path d="M655 331 V343 C655 375 762.5 375 762.5 407 V419 V622 C762.5 654 762.5 654 762.5 686 V698 V748 C762.5 780 458 780 458 812 V824 V1027 C458 1059 360 1059 360 1091 V1103 V1153 C360 1185 304 1185 304 1217 V1229" marker-end="url(#arrow-tree-connected-value-range)"/><g class="flow-edge-label" data-edge-label="tree:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="tree:unknown:check"><title>わからない</title><path d="M699.722 205 V217 C699.722 249 783.5 249 783.5 281 V293"/><path d="M783.5 331 V343 C783.5 375 818.5 