V1027 C588 1059 450 1059 450 1091 V1103"/><path d="M450 1141 V1153 C450 1185 384 1185 384 1217 V1229" marker-end="url(#arrow-tree-connected-value-range)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1126">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 974 V1027 C668 1059 655 1059 655 1091 V1103"/><path d="M655 1141 V1153 C655 1185 614.667 1185 614.667 1217 V1229" marker-end="url(#arrow-tree-connected-value-range)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1126">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 974 V1027 C748 1059 783.5 1059 783.5 1091 V1103"/><path d="M783.5 1141 V1153 C783.5 1185 721.333 1185 721.333 1217 V1229" marker-end="url(#arrow-tree-connected-value-range)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1103" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1126">わからない</text></g></g><g class="flow-node question" data-node="tree"><rect x="459.7222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">対象は木の非空の連結した頂点集合</text><text class="node-title" x="475.7222222222223" y="103">で、値の最大−最小だけを制限します</text><text class="node-title" x="475.7222222222223" y="126">か？</text><text class="node-explanation" x="475.7222222222223" y="153">頂点数などの追加条件がある場合は、別の状態も必要</text><text class="node-explanation" x="475.7222222222223" y="171">です。</text></g><g class="flow-node question" data-node="owner"><rect x="260.6666666666667" y="419" width="320" height="191" rx="7"/><text class="node-kind" x="276.6666666666667" y="439">質問</text><text class="node-title" x="276.6666666666667" y="467">最小値が等しいときの担当を入力位置</text><text class="node-title" x="276.6666666666667" y="490">で一意に決め、各担当からの走査が制</text><text class="node-title" x="276.6666666666667" y="513">限内ですか？</text><text class="node-explanation" x="276.6666666666667" y="540">担当より小さい (値,入力位置) の頂点を除き、</text><text class="node-explanation" x="276.6666666666667" y="558">担当から値が上限内の頂点だけで連結した集合を数え</text><text class="node-explanation" x="276.6666666666667" y="576">ます。全担当で O(N²) です。</text></g><g class="flow-node result" data-node="connected-result"><rect x="32" y="824" width="320" height="191" rx="7"/><text class="node-kind" x="48" y="844">候補</text><text class="node-title" x="48" y="872">最小の (値,入力位置) を一人に</text><text class="node-title" x="48" y="895">決め、その根を含む連結集合を子から</text><text class="node-title" x="48" y="918">合成する</text><a href="/flowchartcp/techniques/connected-set-minimum-root/"><title>値幅を制限する木の連結集合は、最小値の頂点を添字で一つに決めて根にするの記事へ</title><text x="48" y="957">値幅を制限する木の連結集合は、最小値の頂点を添</text><text x="48" y="975">字で一つに決めて根にする</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="824" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="844">質問</text><text class="node-title" x="524" y="872">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="895">確認できますか？</text><text class="node-explanation" x="524" y="922">使える操作、残す履歴、求める個数や最適値を確認し</text><text class="node-explanation" x="524" y="940">ます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1229" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1249">候補</text><text class="node-title" x="160" y="1277">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1316">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1340">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1229" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1249">分野</text><text class="node-title" x="524" y="1277">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1314">詳細の質問・図へ →</text></a></g></svg>