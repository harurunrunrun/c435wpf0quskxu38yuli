はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1980.833 1275 V1287 C1980.833 1319 2055 1319 2055 1351 V1363"/><path d="M2055 1401 V1413 C2055 1445 2014.667 1445 2014.667 1477 V1489" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2015" y="1363" width="80" height="38" rx="5"/><text text-anchor="middle" x="2055" y="1386">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2060.833 1275 V1287 C2060.833 1319 2183.5 1319 2183.5 1351 V1363"/><path d="M2183.5 1401 V1413 C2183.5 1445 2121.333 1445 2121.333 1477 V1489" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2139" y="1363" width="89" height="38" rx="5"/><text text-anchor="middle" x="2183.5" y="1386">わからない</text></g></g><g class="flow-edge point-value-goals" data-edge="change-kind:point-value-goals:point-value-goals-route"><title>一点の値を変え、区間の集計・順位・重みつき和を答える</title><path d="M1132.714 164 V176 C1132.714 208 192 208 192 240 V252"/><path d="M192 308 V320 C192 352 192 352 192 384 V396" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="change-kind:point-value-goals:point-value-goals-route" tabindex="0" role="group" aria-label="選択肢：一点の値を変え、区間の集計・順位・重みつき和を答える"><rect x="69.5" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="275">一点の値を変え、区間の集計・順位・</text><text text-anchor="middle" x="192" y="293">重みつき和を答える</text></g></g><g class="flow-edge uniform-value-effects" data-edge="change-kind:uniform-value-effects:uniform-value-effects-route"><title>区間へ加算・一次変換を行う、または確率的な変更を扱う</title><path d="M1172.714 164 V176 C1172.714 208 556 208 556 240 V252"/><path d="M556 308 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="change-kind:uniform-value-effects:uniform-value-effects-route" tabindex="0" role="group" aria-label="選択肢：区間へ加算・一次変換を行う、または確率的な変更を扱う"><rect x="433.5" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="275">区間へ加算・一次変換を行う、または</text><text text-anchor="middle" x="556" y="293">確率的な変更を扱う</text></g></g><g class="flow-edge limited-value-changes" data-edge="change-kind:limited-value-changes:limited-value-changes-route"><title>区間の値を上限・下限・余り・二値反転で変える</title><path d="M1212.714 164 V176 C1212.714 208 920 208 920 240 V252"/><path d="M920 308 V320 C920 352 920 352 920 384 V396" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="change-kind:limited-value-changes:limited-value-changes-route" tabindex="0" role="group" aria-label="選択肢：区間の値を上限・下限・余り・二値反転で変える"><rect x="797.5" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="275">区間の値を上限・下限・余り・二値反</text><text text-anchor="middle" x="920" y="293">転で変える</text></g></g><g class="flow-edge rectangle" data-edge="change-kind:rectangle:rectangle-check"><title>長方形に加算し、全部終えた後の値を求める</title><path d="M1252.714 164 V176 C1252.714 208 1284 208 1284 240 V252"/><path d="M1284 308 V320 C1284 352 1284 352 1284 384 V396" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="change-kind:rectangle:rectangle-check" tabindex="0" role="group" aria-label="選択肢：長方形に加算し、全部終えた後の値を求める"><rect x="1161.5" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="275">長方形に加算し、全部終えた後の値を</text><text text-anchor="middle" x="1284" y="293">求める</text></g></g><g class="flow-edge past" data-edge="change-kind:past:versions"><title>更新前の版にも問い合わせる</title><path d="M1292.714 164 V176 C1292.714 208 1648 208 1648 240 V252"/><path d="M1648 290 V320 C1648 352 1648 352 1648 384 V396" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="change-kind:past:versions" tabindex="0" role="group" aria-label="選択肢：更新前の版にも問い合わせる"><rect x="1551.5" y="252" width="193" height="38" rx="5"/><text text-anchor="middle" x="1648" y="275">更新前の版にも問い合わせる</text></g></g><g class="flow-edge fibonacci-add" data-edge="change-kind:fibonacci-add:fibonacci-add-route"><title>区間の左端から順に1,1,2,3,…を加算し、区間和を答える</title><path d="M1332.714 164 V176 C1332.714 208 1985.5 208 1985.5 240 V252"/><path d="M1985.5 308 V320 C1985.5 352 2012 352 2012 384 V396" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="change-kind:fibonacci-add:fibonacci-add-route" tabindex="0" role="group" aria-label="選択肢：区間の左端から順に1,1,2,3,…を加算し、区間和を答える"><rect x="1876" y="252" width="219" height="56" rx="5"/><text text-anchor="middle" x="1985.5" y="275">区間の左端から順に1,1,2,</text><text text-anchor="middle" x="1985.5" y="293">3,…を加算し、区間和を答える</text></g></g><g class="flow-edge unknown" data-edge="change-kind:unknown:check"><title>わからない</title><path d="M1372.714 164 V176 C1372.714 208 2183.5 208 2183.5 240 V252"/><path d="M2183.5 290 V320 C2183.5 352 2222 352 2222 384 V396 V558 C2222 590 2222 590 2222 622 V634 V684 C2222 716 2222 716 2222 748 V760 V923 C2222 955 2187.333 955 2187.333 987 V999 V1049 C2187.333 1081 2076.833 1081 2076.833 1113 V1125" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="change-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2139" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="2183.5" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="rectangle-check:yes:rectangle-result"><title>はい</title><path d="M1204 546 V558 C1204 590 808 590 808 622 V634"/><path d="M808 672 V684 C808 716 808 716 808 748 V760" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="rectangle-check:yes:rectangle-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="768" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="808" y="657">はい</text></g></g><g class="flow-edge no" data-edge="rectangle-check:no:offline"><title>いいえ</title><path d="M1284 546 V558 C1284 590 1172 590 1172 622 V634"/><path d="M1172 672 V684 C1172 716 1172 716 1172 748 V760" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="rectangle-check:no:offline" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1132" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="1172" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="rectangle-check:unknown:check"><title>わからない</title><path d="M1364 546 V558 C1364 590 1382 590 1382 622 V634"/><path d="M1382 672 V684 C1382 716 1382 716 1382 748 V760 V923 C1382 955 2075.333 955 2075.333 987 V999 V1049 C2075.333 1081 1948.833 1081 1948.833 1113 V1125" marker-end="url(#arrow-range-update)"/><g class="flow-edge-label" data-edge-label="rectangle-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1337.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1382" y="657">わからない</text></g></g><g class="flow-node question" data-node="versions"><rect x="1488" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="1504" y="416">質問</text><text class="node-title" x="1504" y="444">過去の時点の配列にも問い合わせます</text><text class="node-title" x="1504" y="467">か？</text><text class="node-explanation" x="1504" y="494">更新前の状態を残し、複数の版を参照する必要がある</text><text class="node-explanation" x="1504" y="512">か確認します。</text></g><g class="flow-node route" data-node="point"><rect x="1796" y="760" width="320" height="121" rx="7"/><text class="node-kind" x="1812" y="780">分野</text><text class="node-title" x="1812" y="808">変わる位置と、保持する区間情報</text><a href="/flowchartcp/flowcharts/#diagram-range-change-granularity" data-route="range-change-granularity"><text x="1812" y="845">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="offline"><rect x="1012" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="1028" y="780">質問</text><text class="node-title" x="1028" y="808">すべての更新後の配列だけを使います</text><text class="node-title" x="1028" y="831">か？</text><text class="node-explanation" x="1028" y="858">途中の問い合わせがない区間加算なら、更新を差分と</text><text class="node-explanation" x="1028" y="876">して貯められます。</text></g><g class="flow-node question" data-node="check"><rect x="1820.8333333333333" y="1125" width="320" height="150" rx="7"/><text class="node-kind" x="1836.8333333333333" y="1145">質問</text><text class="node-title" x="1836.8333333333333" y="1173">区間への代入・加算を、区間和と長さ</text><text class="node-title" x="1836.8333333333333" y="1196">から一括で反映できますか？</text><text class="node-explanation" x="1836.8333333333333" y="1223">sum と length を持ち、写像が結合を保</text><text class="node-explanation" x="1836.8333333333333" y="1241">つこと、タグの合成を定義できることを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1908" y="1489" width="320" height="139" rx="7"/><text class="node-kind" x="1924" y="1509">分野</text><text class="node-title" x="1924" y="1537">条件を確かめる</text><text class="node-explanation" x="1924" y="1564">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1924" y="1592">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="persistent"><rect x="1432" y="760" width="320" height="127" rx="7"/><text class="node-kind" x="1448" y="780">候補</text><text class="node-title" x="1448" y="808">永続セグメント木</text><a href="/flowchartcp/techniques/persistent-segment-tree/"><title>永続セグメント木の記事へ</title><text x="1448" y="847">永続セグメント木</text></a></g><g class="flow-node result" data-node="lazy"><rect x="1544" y="1489" width="320" height="127" rx="7"/><text class="node-kind" x="1560" y="1509">候補</text><text class="node-title" x="1560" y="1537">遅延セグメント木</text><a href="/flowchartcp/techniques/lazy-segment-tree/"><title>遅延セグメント木の記事へ</title><text x="1560" y="1576">遅延セグメント木</text></a></g><g class="flow-node result" data-node="difference"><rect x="1012" y="1125" width="320" height="127" rx="7"/><text class="node-kind" x="1028" y="1145">候補</text><text class="node-title" x="1028" y="1173">差分配列</text><a href="/flowchartcp/techniques/difference-array/"><title>いもす法の記事へ</title><text x="1028" y="1212">いもす法</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1376" y="1125" width="320" height="127" rx="7"/><text class="node-kind" x="1392" y="1145">候補</text><text class="node-title" x="1392" y="1173">保持する区間情報を増やす</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1392" y="1212">状態の設計</text></a></g><g class="flow-node question" data-node="change-kind"><rect x="1092.7142857142858" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="1108.7142857142858" y="52">質問</text><text class="node-title" x="1108.7142857142858" y="80">一回の操作で、どの値がどう変わりま</text><text class="node-title" x="1108.7142857142858" y="103">すか？</text><text class="node-explanation" x="1108.7142857142858" y="130">更新する範囲と、問い合わせる量を選びます。</text></g><g class="flow-node question" data-node="rectangle-check"><rect x="1124" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="416">質問</text><text class="node-title" x="1140" y="444">二次元の領域を長方形として加算しま</text><text class="node-title" x="1140" y="467">すか？</text><text class="node-explanation" x="1140" y="494">更新のたびに四隅へ符号を付け、最後に二方向へ累積</text><text class="node-explanation" x="1140" y="512">します。</text></g><g class="flow-node result" data-node="rectangle-result"><rect x="648" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="664" y="780">候補</text><text class="node-title" x="664" y="808">長方形更新を四隅の差分にする</text><a href="/flowchartcp/techniques/difference-2d-corners/"><title>長方形への加算を四隅に記録するの記事へ</title><text x="664" y="847">長方形への加算を四隅に記録する</text></a><a href="/flowchartcp/techniques/difference-array/"><title>いもす法の記事へ</title><text x="664" y="871">いもす法</text></a></g><g class="flow-node route" data-node="point-value-goals-route"><rect x="32" y="396" width="320" 