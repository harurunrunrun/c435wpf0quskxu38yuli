g class="flow-edge-label" data-edge-label="area-monotone:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="area-squared-integer:yes:area-result"><title>はい</title><path d="M323.167 928 V940 C323.167 972 192 972 192 1004 V1016"/><path d="M192 1054 V1066 C192 1098 192 1098 192 1130 V1142" marker-end="url(#arrow-geometry-area-cut)"/><g class="flow-edge-label" data-edge-label="area-squared-integer:yes:area-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="area-squared-integer:no:fallback"><title>いいえ</title><path d="M403.167 928 V940 C403.167 972 402 972 402 1004 V1016"/><path d="M402 1054 V1066 C402 1098 402 1098 402 1130 V1142 V1322 C402 1354 360 1354 360 1386 V1398 V1448 C360 1480 264 1480 264 1512 V1524" marker-end="url(#arrow-geometry-area-cut)"/><g class="flow-edge-label" data-edge-label="area-squared-integer:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="area-squared-integer:unknown:check"><title>わからない</title><path d="M483.167 928 V940 C483.167 972 615.5 972 615.5 1004 V1016"/><path d="M615.5 1054 V1066 C615.5 1098 588 1098 588 1130 V1142" marker-end="url(#arrow-geometry-area-cut)"/><g class="flow-edge-label" data-edge-label="area-squared-integer:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="571" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="615.5" y="1039">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 1297 V1322 C588 1354 506 1354 506 1386 V1398"/><path d="M506 1436 V1448 C506 1480 392 1480 392 1512 V1524" marker-end="url(#arrow-geometry-area-cut)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1421">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 1297 V1322 C668 1354 655 1354 655 1386 V1398"/><path d="M655 1436 V1448 C655 1480 670.667 1480 670.667 1512 V1524" marker-end="url(#arrow-geometry-area-cut)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1421">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 1297 V1322 C748 1354 783.5 1354 783.5 1386 V1398"/><path d="M783.5 1436 V1448 C783.5 1480 777.333 1480 777.333 1512 V1524" marker-end="url(#arrow-geometry-area-cut)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1398" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1421">わからない</text></g></g><g class="flow-node question" data-node="convex-cycle"><rect x="549.0185185185186" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="565.0185185185186" y="52">質問</text><text class="node-title" x="565.0185185185186" y="80">多角形は凸で、頂点が周回順に与えら</text><text class="node-title" x="565.0185185185186" y="103">れますか？</text><text class="node-explanation" x="565.0185185185186" y="130">非凸では端点を進めた片側面積が同じ向きに増えると</text><text class="node-explanation" x="565.0185185185186" y="148">は限りません。</text></g><g class="flow-node question" data-node="area-monotone"><rect x="416.55555555555554" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="432.55555555555554" y="416">質問</text><text class="node-title" x="432.55555555555554" y="444">弦の片端を固定して他端を進めると、</text><text class="node-title" x="432.55555555555554" y="467">片側面積は単調に増えますか？</text><text class="node-explanation" x="432.55555555555554" y="494">方向と隣接頂点を整理し、目標の割合をまたぐ前後の</text><text class="node-explanation" x="432.55555555555554" y="512">端点だけを比べます。</text></g><g class="flow-node question" data-node="area-squared-integer"><rect x="243.16666666666669" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="259.1666666666667" y="780">質問</text><text class="node-title" x="259.1666666666667" y="808">面積の二倍を外積の和で計算し、割合</text><text class="node-title" x="259.1666666666667" y="831">の比較も整数でできますか？</text><text class="node-explanation" x="259.1666666666667" y="858">四分の一なら、片側の面積二倍を 4 倍して全体の</text><text class="node-explanation" x="259.1666666666667" y="876">面積二倍との差を取ります。非隣接の頂点を選ぶ制約</text><text class="node-explanation" x="259.1666666666667" y="894">も守ります。</text></g><g class="flow-node result" data-node="area-result"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">片側面積が目標をまたぐ二つの端点</text><text class="node-title" x="48" y="1213">を、後戻りせずに比べる</text><a href="/flowchartcp/techniques/convex-polygon-half-area/"><title>凸多角形を切る弦の面積を、端点の単調移動で目標へ近づけるの記事へ</title><text x="48" y="1252">凸多角形を切る弦の面積を、端点の単調移動で目標</text><text x="48" y="1270">へ近づける</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="1142" width="320" height="155" rx="7"/><text class="node-kind" x="524" y="1162">質問</text><text class="node-title" x="524" y="1190">座標の範囲、境界、重複、共線の場合</text><text class="node-title" x="524" y="1213">を問題文と小さい例で確認できます</text><text class="node-title" x="524" y="1236">か？</text><text class="node-explanation" x="524" y="1263">保証される形と、必要な幾何の性質を区別します。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1524" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1544">候補</text><text class="node-title" x="216" y="1572">入力の形と退化する場合を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1611">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="216" y="1635">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1524" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1544">分野</text><text class="node-title" x="580" y="1572">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1609">詳細の質問・図へ →</text></a></g></svg>