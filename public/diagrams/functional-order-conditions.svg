<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-functional-order-conditions flow-desc-functional-order-conditions" width="748" height="1360" viewBox="0 0 748 1360" data-flow-svg="functional-order-conditions"><title id="flow-title-functional-order-conditions">一人ずつの相手との前後条件を満たす順序の解法フローチャート</title><desc id="flow-desc-functional-order-conditions">相手が一つ、非負の罰則、自由な順序の条件を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-functional-order-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="one-successor:yes:nonnegative"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-functional-order-conditions)"/><g class="flow-edge-label" data-edge-label="one-successor:yes:nonnegative" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="one-successor:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V571 C654 603 654 603 654 635 V647 V697 C654 729 654 729 654 761 V773 V958 C654 990 654 990 654 1022 V1034 V1084 C654 1116 624.571 1116 624.571 1148 V1160" marker-end="url(#arrow-functional-order-conditions)"/><g class="flow-edge-label" data-edge-label="one-successor:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="one-successor:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V571 C710 603 710 603 710 635 V647 V697 C710 729 710 729 710 761 V773 V958 C710 990 710 990 710 1022 V1034 V1084 C710 1116 670.286 1116 670.286 1148 V1160" marker-end="url(#arrow-functional-order-conditions)"/><g class="flow-edge-label" data-edge-label="one-successor:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="nonnegative:yes:free-order"><title>はい</title><path d="M352.5 559 V571 C352.5 603 307 603 307 635 V647"/><path d="M307 685 V697 C307 729 319.5 729 319.5 761 V773" marker-end="url(#arrow-functional-order-conditions)"/><g class="flow-edge-label" data-edge-label="nonnegative:yes:free-order" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="670">はい</text></g></g><g class="flow-edge no" data-edge="nonnegative:no:check"><title>いいえ</title><path d="M432.5 559 V571 C432.5 603 431 603 431 635 V647"/><path d="M431 685 V697 C431 729 542 729 542 761 V773 V958 C542 990 542 990 542 1022 V1034 V1084 C542 1116 533.143 1116 533.143 1148 V1160" marker-end="url(#arrow-functional-order-conditions)"/><g class="flow-edge-label" data-edge-label="nonnegative:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="670">いいえ</text></g></g><g class="flow-edge unknown" data-edge="nonnegative:unknown:check"><title>わからない</title><path d="M512.5 559 V571 C512.5 603 559.5 603 559.5 635 V647"/><path d="M559.5 685 V697 C559.5 729 598 729 598 761 V773 V958 C598 990 598 990 598 1022 V1034 V1084 C598 1116 578.857 1116 578.857 1148 V1160" marker-end="url(#arrow-functional-order-conditions)"/><g class="flow-edge-label" data-edge-label="nonnegative:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="647" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="670">わからない</text></g></g><g class="flow-edge yes" data-edge="free-order:yes:answer"><title>はい</title><path d="M239.5 946 V958 C239.5 990 192 990 192 1022 V1034"/><path d="M192 1072 V1084 C192 1116 192 1116 192 1148 V1160" marker-end="url(#arrow-functional-order-conditions)"/><g class="flow-edge-label" data-edge-label="free-order:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="free-order:no:check"><title>いいえ</title><path d="M319.5 946 V958 C319.5 990 319 990 319 1022 V1034"/><path d="M319 1072 V1084 C319 1116 441.714 1116 441.714 1148 V1160" marker-end="url(#arrow-functional-order-conditions)"/><g class="flow-edge-label" data-edge-label="free-order:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="free-order:unknown:check"><title>わからない</title><path d="M399.5 946 V958 C399.5 990 447.5 990 447.5 1022 V1034"/><path d="M447.5 1072 V1084 C447.5 1116 487.429 1116 487.429 1148 V1160" marker-end="url(#arrow-functional-order-conditions)"/><g class="flow-edge-label" data-edge-label="free-order:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1057">わからない</text></g></g><g class="flow-node question" data-node="one-successor"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">各要素に相手が一つだけあり、相手が</text><text class="node-title" x="400.5" y="103">自分より先なら罰則が発生しますか？</text><text class="node-explanation" x="400.5" y="130">条件を自分から相手への有向辺にします。複数の相手</text><text class="node-explanation" x="400.5" y="148">がある一般の前後条件では、閉路同士が独立とは限り</text><text class="node-explanation" x="400.5" y="166">ません。</text></g><g class="flow-node question" data-node="nonnegative"><rect x="272.5" y="414" width="320" height="145" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">全ての罰則は0以上ですか？</text><text class="node-explanation" x="288.5" y="489">非負なら、閉路で一つだけ条件を破る最小罰則が下界</text><text class="node-explanation" x="288.5" y="507">になります。負の罰則では複数を破る方が得になる場</text><text class="node-explanation" x="288.5" y="525">合があります。</text></g><g class="flow-node question" data-node="free-order"><rect x="159.5" y="773" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="793">質問</text><text class="node-title" x="175.5" y="821">全要素を一度ずつ自由に並べられ、他</text><text class="node-title" x="175.5" y="844">の前後条件や位置制限はありません</text><text class="node-title" x="175.5" y="867">か？</text><text class="node-explanation" x="175.5" y="894">自己ループは、自分が自分より先に現れることはない</text><text class="node-explanation" x="175.5" y="912">という厳密な前後比較なら罰則0です。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1180">候補</text><text class="node-title" x="48" y="1208">閉路に入る前の頂点を先に並べ、各閉</text><text class="node-title" x="48" y="1231">路の最小罰則だけを払う</text><a href="/flowchartcp/techniques/functional-cycle-minimum-order-cost/"><title>各要素に一つの前後条件がある順序は、閉路ごとの最小罰則で作るの記事へ</title><text x="48" y="1270">各要素に一つの前後条件がある順序は、閉路ごとの</text><text x="48" y="1288">最小罰則で作る</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1160" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1180">分野</text><text class="node-title" x="412" y="1208">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1245">詳細の質問・図へ →</text></a></g></svg>