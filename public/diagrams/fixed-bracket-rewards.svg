<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-fixed-bracket-rewards flow-desc-fixed-bracket-rewards" width="860" height="1307" viewBox="0 0 860 1307" data-flow-svg="fixed-bracket-rewards"><title id="flow-title-fixed-bracket-rewards">固定した勝ち抜き表の勝数報酬の解法フローチャート</title><desc id="flow-desc-fixed-bracket-rewards">片側の勝者を固定したとき、相手側の最良値を共通に使います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-fixed-bracket-rewards" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="bracket:yes:rewards"><title>はい</title><path d="M539.722 164 V176 C539.722 208 420.667 208 420.667 240 V252"/><path d="M420.667 290 V302 C420.667 334 420.667 334 420.667 366 V378" marker-end="url(#arrow-fixed-bracket-rewards)"/><g class="flow-edge-label" data-edge-label="bracket:yes:rewards" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="275">はい</text></g></g><g class="flow-edge no" data-edge="bracket:no:fallback"><title>いいえ</title><path d="M619.722 164 V176 C619.722 208 655 208 655 240 V252"/><path d="M655 290 V302 C655 334 762.5 334 762.5 366 V378 V540 C762.5 572 762.5 572 762.5 604 V616 V666 C762.5 698 458 698 458 730 V742 V922 C458 954 360 954 360 986 V998 V1048 C360 1080 304 1080 304 1112 V1124" marker-end="url(#arrow-fixed-bracket-rewards)"/><g class="flow-edge-label" data-edge-label="bracket:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="275">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bracket:unknown:check"><title>わからない</title><path d="M699.722 164 V176 C699.722 208 783.5 208 783.5 240 V252"/><path d="M783.5 290 V302 C783.5 334 818.5 334 818.5 366 V378 V540 C818.5 572 818.5 572 818.5 604 V616 V666 C818.5 698 721.333 698 721.333 730 V742" marker-end="url(#arrow-fixed-bracket-rewards)"/><g class="flow-edge-label" data-edge-label="bracket:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="rewards:yes:tournament-result"><title>はい</title><path d="M340.667 528 V540 C340.667 572 192 572 192 604 V616"/><path d="M192 654 V666 C192 698 192 698 192 730 V742" marker-end="url(#arrow-fixed-bracket-rewards)"/><g class="flow-edge-label" data-edge-label="rewards:yes:tournament-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="616" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="639">はい</text></g></g><g class="flow-edge no" data-edge="rewards:no:fallback"><title>いいえ</title><path d="M420.667 528 V540 C420.667 572 402 572 402 604 V616"/><path d="M402 654 V666 C402 698 402 698 402 730 V742 V922 C402 954 304 954 304 986 V998 V1048 C304 1080 224 1080 224 1112 V1124" marker-end="url(#arrow-fixed-bracket-rewards)"/><g class="flow-edge-label" data-edge-label="rewards:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="616" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="639">いいえ</text></g></g><g class="flow-edge unknown" data-edge="rewards:unknown:check"><title>わからない</title><path d="M500.667 528 V540 C500.667 572 668 572 668 604 V616"/><path d="M668 654 V666 C668 698 614.667 698 614.667 730 V742" marker-end="url(#arrow-fixed-bracket-rewards)"/><g class="flow-edge-label" data-edge-label="rewards:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="616" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="639">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 892 V922 C588 954 450 954 450 986 V998"/><path d="M450 1036 V1048 C450 1080 384 1080 384 1112 V1124" marker-end="url(#arrow-fixed-bracket-rewards)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 892 V922 C668 954 655 954 655 986 V998"/><path d="M655 1036 V1048 C655 1080 614.667 1080 614.667 1112 V1124" marker-end="url(#arrow-fixed-bracket-rewards)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 892 V922 C748 954 783.5 954 783.5 986 V998"/><path d="M783.5 1036 V1048 C783.5 1080 721.333 1080 721.333 1112 V1124" marker-end="url(#arrow-fixed-bracket-rewards)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1021">わからない</text></g></g><g class="flow-node question" data-node="bracket"><rect x="459.7222222222223" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">人数は二の冪で、固定した完全二分の</text><text class="node-title" x="475.7222222222223" y="103">勝ち抜き表ですか？</text><text class="node-explanation" x="475.7222222222223" y="130">組合せを変更する操作や敗者復活はありません。</text></g><g class="flow-node question" data-node="rewards"><rect x="260.6666666666667" y="378" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="398">質問</text><text class="node-title" x="276.6666666666667" y="426">各試合の勝者を自由に選べ、個人の報</text><text class="node-title" x="276.6666666666667" y="449">酬は最終勝数だけで決まりますか？</text><text class="node-explanation" x="276.6666666666667" y="476">対戦相手ごとの相性や報酬はありません。勝数が増え</text><text class="node-explanation" x="276.6666666666667" y="494">ても報酬が減る表も扱えます。</text></g><g class="flow-node result" data-node="tournament-result"><rect x="32" y="742" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="762">候補</text><text class="node-title" x="48" y="790">勝者別の片側の値へ、相手側の最良値</text><text class="node-title" x="48" y="813">を一回だけ求めて足す</text><a href="/flowchartcp/techniques/tournament-opponent-maximum/"><title>固定トーナメントの報酬最大化は、相手側の最良を全勝者で共有するの記事へ</title><text x="48" y="852">固定トーナメントの報酬最大化は、相手側の最良を</text><text x="48" y="870">全勝者で共有する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="742" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="762">質問</text><text class="node-title" x="524" y="790">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="813">確認できますか？</text><text class="node-explanation" x="524" y="840">使える操作、残す履歴、求める個数や最適値を確認し</text><text class="node-explanation" x="524" y="858">ます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1124" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1144">候補</text><text class="node-title" x="160" y="1172">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1211">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1235">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1124" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1144">分野</text><text class="node-title" x="524" y="1172">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1209">詳細の質問・図へ →</text></a></g></svg>