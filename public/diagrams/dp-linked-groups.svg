<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dp-linked-groups flow-desc-dp-linked-groups" width="2260" height="1695" viewBox="0 0 2260 1695" data-flow-svg="dp-linked-groups"><title id="flow-title-dp-linked-groups">二者の条件・組分け・選択の依存関係の解法フローチャート</title><desc id="flow-desc-dp-linked-groups">二者を同時に選べるか、組の合計や広がり、別の対象も選ぶ条件を確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dp-linked-groups" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge cyclic-neighbors" data-edge="defined:cyclic-neighbors:cycle-route"><title>円環に並ぶ選択で、隣り合う二つに条件がある</title><path d="M1130.857 141 V153 C1130.857 185 192 185 192 217 V229"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="defined:cyclic-neighbors:cycle-route" tabindex="0" role="group" aria-label="選択肢：円環に並ぶ選択で、隣り合う二つに条件がある"><rect x="69.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="252">円環に並ぶ選択で、隣り合う二つに条</text><text text-anchor="middle" x="192" y="270">件がある</text></g></g><g class="flow-edge balanced-groups" data-edge="defined:balanced-groups:balanced-sum"><title>仕事や数値を二組へ分け、合計をできるだけ均等にする</title><path d="M1170.857 141 V153 C1170.857 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="defined:balanced-groups:balanced-sum" tabindex="0" role="group" aria-label="選択肢：仕事や数値を二組へ分け、合計をできるだけ均等にする"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">仕事や数値を二組へ分け、合計をでき</text><text text-anchor="middle" x="556" y="270">るだけ均等にする</text></g></g><g class="flow-edge two-values" data-edge="defined:two-values:two-values-route"><title>各対象に二つの候補があり、二者の選択が制限される</title><path d="M1210.857 141 V153 C1210.857 185 920 185 920 217 V229"/><path d="M920 285 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="defined:two-values:two-values-route" tabindex="0" role="group" aria-label="選択肢：各対象に二つの候補があり、二者の選択が制限される"><rect x="797.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="252">各対象に二つの候補があり、二者の選</text><text text-anchor="middle" x="920" y="270">択が制限される</text></g></g><g class="flow-edge group-spread" data-edge="defined:group-spread:group-spread-route"><title>組ごとの最大値−最小値の総和を制限して、組分けを数える</title><path d="M1250.857 141 V153 C1250.857 185 1284 185 1284 217 V229"/><path d="M1284 285 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="defined:group-spread:group-spread-route" tabindex="0" role="group" aria-label="選択肢：組ごとの最大値−最小値の総和を制限して、組分けを数える"><rect x="1161.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="252">組ごとの最大値−最小値の総和を制限</text><text text-anchor="middle" x="1284" y="270">して、組分けを数える</text></g></g><g class="flow-edge perpendicular-subset" data-edge="defined:perpendicular-subset:perpendicular-route"><title>整数二成分の内積が 0 の二者を同時に選ばない</title><path d="M1290.857 141 V153 C1290.857 185 1648 185 1648 217 V229"/><path d="M1648 285 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="defined:perpendicular-subset:perpendicular-route" tabindex="0" role="group" aria-label="選択肢：整数二成分の内積が 0 の二者を同時に選ばない"><rect x="1525.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="252">整数二成分の内積が 0 の二者を同</text><text text-anchor="middle" x="1648" y="270">時に選ばない</text></g></g><g class="flow-edge dependency-selection" data-edge="defined:dependency-selection:closure-route"><title>対象ごとの利益を足し、選ぶと別の対象も必要になる</title><path d="M1330.857 141 V153 C1330.857 185 1972.5 185 1972.5 217 V229"/><path d="M1972.5 285 V297 C1972.5 329 2012 329 2012 361 V373" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="defined:dependency-selection:closure-route" tabindex="0" role="group" aria-label="選択肢：対象ごとの利益を足し、選ぶと別の対象も必要になる"><rect x="1850" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1972.5" y="252">対象ごとの利益を足し、選ぶと別の対</text><text text-anchor="middle" x="1972.5" y="270">象も必要になる</text></g></g><g class="flow-edge unknown" data-edge="defined:unknown:check"><title>わからない</title><path d="M1370.857 141 V153 C1370.857 185 2183.5 185 2183.5 217 V229"/><path d="M2183.5 267 V297 C2183.5 329 2222 329 2222 361 V373 V576 C2222 608 1932.833 608 1932.833 640 V652 V702 C1932.833 734 1821.833 734 1821.833 766 V778 V940 C1821.833 972 1821.833 972 1821.833 1004 V1016 V1066 C1821.833 1098 1695.333 1098 1695.333 1130 V1142" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="defined:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2139" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="2183.5" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:state-route"><title>はい</title><path d="M1535.333 1292 V1322 C1535.333 1354 1329.833 1354 1329.833 1386 V1398"/><path d="M1329.833 1436 V1448 C1329.833 1480 1329.833 1480 1329.833 1512 V1524" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="check:yes:state-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1289.8333333333333" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="1329.8333333333333" y="1421">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1615.333 1292 V1322 C1615.333 1354 1693.833 1354 1693.833 1386 V1398"/><path d="M1693.833 1436 V1448 C1693.833 1480 1640.5 1480 1640.5 1512 V1524" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-l