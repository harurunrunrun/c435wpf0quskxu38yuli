nknown:check"><title>わからない</title><path d="M636 564 V576 C636 608 1838.333 608 1838.333 640 V652"/><path d="M1838.333 690 V702 C1838.333 734 1765.833 734 1765.833 766 V778 V940 C1765.833 972 1765.833 972 1765.833 1004 V1016 V1066 C1765.833 1098 1615.333 1098 1615.333 1130 V1142" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="balanced-sum:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1793.8333333333333" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1838.3333333333333" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="balanced-nonnegative:yes:balanced-result"><title>はい</title><path d="M950.444 928 V940 C950.444 972 556 972 556 1004 V1016"/><path d="M556 1054 V1066 C556 1098 556 1098 556 1130 V1142" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="balanced-nonnegative:yes:balanced-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="balanced-nonnegative:no:fallback"><title>いいえ</title><path d="M1030.444 928 V940 C1030.444 972 920 972 920 1004 V1016"/><path d="M920 1054 V1066 C920 1098 866.667 1098 866.667 1130 V1142" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="balanced-nonnegative:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="880" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="balanced-nonnegative:unknown:check"><title>わからない</title><path d="M1110.444 928 V940 C1110.444 972 1615.333 972 1615.333 1004 V1016"/><path d="M1615.333 1054 V1066 C1615.333 1098 1535.333 1098 1535.333 1130 V1142" marker-end="url(#arrow-dp-linked-groups)"/><g class="flow-edge-label" data-edge-label="balanced-nonnegative:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1570.8333333333333" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="1615.3333333333333" y="1039">わからない</text></g></g><g class="flow-node question" data-node="defined"><rect x="1090.857142857143" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1106.857142857143" y="52">質問</text><text class="node-title" x="1106.857142857143" y="80">選び方や分け方の特徴はどれですか？</text><text class="node-explanation" x="1106.857142857143" y="107">入力の上限と、求める制約から探します。</text></g><g class="flow-node question" data-node="check"><rect x="1455.3333333333333" y="1142" width="320" height="150" rx="7"/><text class="node-kind" x="1471.3333333333333" y="1162">質問</text><text class="node-title" x="1471.3333333333333" y="1190">小さい入力で、全状態と遷移を列挙で</text><text class="node-title" x="1471.3333333333333" y="1213">きますか？</text><text class="node-explanation" x="1471.3333333333333" y="1240">列挙した表で状態の重複と、どこに時間がかかるかを</text><text class="node-explanation" x="1471.3333333333333" y="1258">確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1533.8333333333333" y="1524" width="320" height="139" rx="7"/><text class="node-kind" x="1549.8333333333333" y="1544">分野</text><text class="node-title" x="1549.8333333333333" y="1572">条件を確かめる</text><text class="node-explanation" x="1549.8333333333333" y="1599">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1549.8333333333333" y="1627">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="state-route"><rect x="1169.8333333333333" y="1524" width="320" height="121" rx="7"/><text class="node-kind" x="1185.8333333333333" y="1544">分野</text><text class="node-title" x="1185.8333333333333" y="1572">選ぶ数・重さ・残す履歴</text><a href="/flowchartcp/flowcharts/#diagram-dp-state" data-route="dp-state"><text x="1185.8333333333333" y="1609">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="760" y="1142" width="320" height="151" rx="7"/><text class="node-kind" x="776" y="1162">候補</text><text class="node-title" x="776" y="1190">状態の意味と計算順を確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="776" y="1229">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="776" y="1253">反例探し</text></a></g><g class="flow-node route" data-node="cycle-route"><rect x="32" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">円環の端をまたぐ条件</text><a href="/flowchartcp/flowcharts/#diagram-dp-cycle" data-route="dp-cycle"><text x="48" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="balanced-sum"><rect x="396" y="373" width="320" height="191" rx="7"/><text class="node-kind" x="412" y="393">質問</text><text class="node-title" x="412" y="421">一組に入れる合計の可否が分かれば、</text><text class="node-title" x="412" y="444">二組の最大の合計を最小にできます</text><text class="node-title" x="412" y="467">か？</text><text class="node-explanation" x="412" y="494">合計 S が決まると、もう一組は総和−S です。</text><text class="node-explanation" x="412" y="512">各数値を一度ずつ使う、非負整数の合計の可否へ進み</text><text class="node-explanation" x="412" y="530">ます。</text></g><g class="flow-node question" data-node="balanced-nonnegative"><rect x="870.4444444444443" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="886.4444444444443" y="798">質問</text><text class="node-title" x="886.4444444444443" y="826">数値は非負整数で、合計の値域がビッ</text><text class="node-title" x="886.4444444444443" y="849">ト列として制限内に収まりますか？</text><text class="node-explanation" x="886.4444444444443" y="876">数値の大きさが大きすぎる場合は、合計を全て持つ方</text><text class="node-explanation" x="886.4444444444443" y="894">法は使えません。</text></g><g class="flow-node result" data-node="balanced-result"><rect x="396" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="412" y="1162">候補</text><text class="node-title" x="412" y="1190">一組に入れられる合計をビット列で求</text><text class="node-title" x="412" y="1213">め、もう一組との差を比べる</text><a href="/flowchartcp/techniques/knapsack-bitset-shift/"><title>部分和の可否だけならビット列をずらしてまとめて更新するの記事へ</title><text x="412" y="1252">部分和の可否だけならビット列をずらしてまとめて</text><text x="412" y="1270">更新する</text></a></g><g class="flow-node route" data-node="two-values-route"><rect x="760" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">二者の選択に関する条件</text><a href="/flowchartcp/flowcharts/#diagram-graph-constraints" data-route="graph-constraints"><text x="776" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="group-spread-route"><rect x="1124" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">組の広がりを、隣り合う値の差で数え</text><text class="node-title" x="1140" y="444">る</text><a href="/flowchartcp/flowcharts/#diagram-group-spread" data-route="group-spread"><text x="1140" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="perpendicular-route"><rect x="1488" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">二成分の方向による選択条件</text><a href="/flowchartcp/flowcharts/#diagram-geometry-perpendicular" data-route="geometry-perpendicular"><text x="1504" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="closure-route"><rect x="1852" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1868" y="393">分野</text><text class="node-title" x="1868" y="421">選択の依存条件と総利益</text><a href="/flowchartcp/flowcharts/#diagram-selection-closure" data-route="selection-closure"><text x="1868" y="458">詳細の質問・図へ →</text></a></g></svg>