767" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1098">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1351 V1418 C840 1450 783 1450 783 1482 V1494"/><path d="M783 1532 V1544 C783 1576 828.5 1576 828.5 1608 V1620" marker-end="url(#arrow-roulette-choice-zero-outcomes)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1494" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1517">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1351 V1418 C920 1450 907 1450 907 1482 V1494"/><path d="M907 1532 V1544 C907 1576 908.5 1576 908.5 1608 V1620" marker-end="url(#arrow-roulette-choice-zero-outcomes)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1494" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1517">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1351 V1418 C1000 1450 1035.5 1450 1035.5 1482 V1494"/><path d="M1035.5 1532 V1544 C1035.5 1576 988.5 1576 988.5 1608 V1620" marker-end="url(#arrow-roulette-choice-zero-outcomes)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1494" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1517">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="638.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="654.5" y="52">質問</text><text class="node-title" x="654.5" y="80">ランダムな操作と終了の規則はどれで</text><text class="node-title" x="654.5" y="103">すか？</text><text class="node-explanation" x="654.5" y="130">選択は毎回変更できるか、回数制限、得点の符号、0</text><text class="node-explanation" x="654.5" y="148"> 得点と費用の扱いを確認します。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="432" width="320" height="150" rx="7"/><text class="node-kind" x="602.1111111111112" y="452">質問</text><text class="node-title" x="602.1111111111112" y="480">ルーレットは毎回自由に選べ、費用は</text><text class="node-title" x="602.1111111111112" y="503">正で、出目は非負整数ですか？</text><text class="node-explanation" x="602.1111111111112" y="530">残りの必要得点だけで次の選択を決められます。一回</text><text class="node-explanation" x="602.1111111111112" y="548">しか使えないなら、使用済みの情報も必要です。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="796" width="320" height="191" rx="7"/><text class="node-kind" x="375.83333333333337" y="816">質問</text><text class="node-title" x="375.83333333333337" y="844">同じ残量なら料金と出目分布は過去に</text><text class="node-title" x="375.83333333333337" y="867">よらず一定で、少なくとも一台は正の</text><text class="node-title" x="375.83333333333337" y="890">得点を出しますか？</text><text class="node-explanation" x="375.83333333333337" y="917">0 だけの選択では進めません。0 の確率を無視せ</text><text class="node-explanation" x="375.83333333333337" y="935">ず、費用も含めた式を 1−p0 で割ってから最小</text><text class="node-explanation" x="375.83333333333337" y="953">化します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1201" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1221">候補</text><text class="node-title" x="48" y="1249">行動を選べる増分DPは、行動ごとの</text><text class="node-title" x="48" y="1272">足踏みを除いてから最小化する</text><a href="/flowchartcp/techniques/roulette-choice-zero-outcomes/"><title>行動を選べる増分DPは、行動ごとの足踏みを除いてから最小化するの記事へ</title><text x="48" y="1311">行動を選べる増分DPは、行動ごとの足踏みを除い</text><text x="48" y="1329">てから最小化する</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1201" width="320" height="205" rx="7"/><text class="node-kind" x="412" y="1221">候補</text><text class="node-title" x="412" y="1249">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1276">負の得点や使用回数制限があると、残り得点だけの前</text><text class="node-explanation" x="412" y="1294">向き計算では足りません。履歴や循環への対応を増や</text><text class="node-explanation" x="412" y="1312">します。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1342">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1366">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1201" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1221">質問</text><text class="node-title" x="776" y="1249">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1272">確認できますか？</text><text class="node-explanation" x="776" y="1299">選択は毎回変更できるか、回数制限、得点の符号、0</text><text class="node-explanation" x="776" y="1317"> 得点と費用の扱いを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1620" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1640">分野</text><text class="node-title" x="764.5" y="1668">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1695">選択は毎回変更できるか、回数制限、得点の符号、0</text><text class="node-explanation" x="764.5" y="1713"> 得点と費用の扱いを確認します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1741">詳細の質問・図へ →</text></a></g></svg>