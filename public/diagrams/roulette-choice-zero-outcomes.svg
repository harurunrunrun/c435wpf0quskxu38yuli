<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-roulette-choice-zero-outcomes flow-desc-roulette-choice-zero-outcomes" width="1112" height="1809" viewBox="0 0 1112 1809" data-flow-svg="roulette-choice-zero-outcomes"><title id="flow-title-roulette-choice-zero-outcomes">行動を選べる増分DPは、行動ごとの足踏みを除いてから最小化するの解法フローチャート</title><desc id="flow-desc-roulette-choice-zero-outcomes">選択は毎回変更できるか、回数制限、得点の符号、0 得点と費用の扱いを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-roulette-choice-zero-outcomes" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge adaptive-choice" data-edge="model:adaptive-choice:assumptions"><title>操作ごとにルーレットを選び、費用を払って非負得点を足し、目標以上で終わる</title><path d="M718.5 182 V194 C718.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 344 V356 C535.5 388 746.111 388 746.111 420 V432" marker-end="url(#arrow-roulette-choice-zero-outcomes)"/><g class="flow-edge-label" data-edge-label="model:adaptive-choice:assumptions" tabindex="0" role="group" aria-label="選択肢：操作ごとにルーレットを選び、費用を払って非負得点を足し、目標以上で終わる"><rect x="413" y="270" width="245" height="74" rx="5"/><text text-anchor="middle" x="535.5" y="293">操作ごとにルーレットを選び、費用を</text><text text-anchor="middle" x="535.5" y="311">払って非負得点を足し、目標以上で終</text><text text-anchor="middle" x="535.5" y="329">わる</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>同じルーレットを事前に固定する、負の得点がある、または一回ずつしか使えない</title><path d="M798.5 182 V194 C798.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 344 V356 C824.5 388 1018 388 1018 420 V432 V594 C1018 626 1018 626 1018 658 V670 V720 C1018 752 1018 752 1018 784 V796 V999 C1018 1031 1018 1031 1018 1063 V1075 V1125 C1018 1157 636 1157 636 1189 V1201" marker-end="url(#arrow-roulette-choice-zero-outcomes)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：同じルーレットを事前に固定する、負の得点がある、または一回ずつしか使えない"><rect x="702" y="270" width="245" height="74" rx="5"/><text text-anchor="middle" x="824.5" y="293">同じルーレットを事前に固定する、負</text><text text-anchor="middle" x="824.5" y="311">の得点がある、または一回ずつしか使</text><text text-anchor="middle" x="824.5" y="329">えない</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M878.5 182 V194 C878.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V356 C1035.5 388 1074 388 1074 420 V432 V594 C1074 626 1074 626 1074 658 V670 V720 C1074 752 1074 752 1074 784 V796 V999 C1074 1031 1074 1031 1074 1063 V1075 V1125 C1074 1157 1000 1157 1000 1189 V1201" marker-end="url(#arrow-roulette-choice-zero-outcomes)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 582 V594 C666.111 626 519.833 626 519.833 658 V670"/><path d="M519.833 708 V720 C519.833 752 519.833 752 519.833 784 V796" marker-end="url(#arrow-roulette-choice-zero-outcomes)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="693">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 582 V594 C746.111 626 795 626 795 658 V670"/><path d="M795 708 V720 C795 752 906 752 906 784 V796 V999 C906 1031 906 1031 906 1063 V1075 V1125 C906 1157 556 1157 556 1189 V1201" marker-end="url(#arrow-roulette-choice-zero-outcomes)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="670" width="80" height="38" rx="5"/