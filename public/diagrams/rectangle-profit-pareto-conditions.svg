l="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="one-pair:yes:answer"><title>はい</title><path d="M239.5 910 V922 C239.5 954 192 954 192 986 V998"/><path d="M192 1036 V1048 C192 1080 192 1080 192 1112 V1124" marker-end="url(#arrow-rectangle-profit-pareto-conditions)"/><g class="flow-edge-label" data-edge-label="one-pair:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="one-pair:no:check"><title>いいえ</title><path d="M319.5 910 V922 C319.5 954 319 954 319 986 V998"/><path d="M319 1036 V1048 C319 1080 441.714 1080 441.714 1112 V1124" marker-end="url(#arrow-rectangle-profit-pareto-conditions)"/><g class="flow-edge-label" data-edge-label="one-pair:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="one-pair:unknown:check"><title>わからない</title><path d="M399.5 910 V922 C399.5 954 447.5 954 447.5 986 V998"/><path d="M447.5 1036 V1048 C447.5 1080 487.429 1080 487.429 1112 V1124" marker-end="url(#arrow-rectangle-profit-pareto-conditions)"/><g class="flow-edge-label" data-edge-label="one-pair:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1021">わからない</text></g></g><g class="flow-node question" data-node="two-differences"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">各対象が価格と時刻を持ち、利益は価</text><text class="node-title" x="400.5" y="103">格差×取引期間で決まりますか？</text><text class="node-explanation" x="400.5" y="130">明示された相性辺の利益ではなく、二群の座標から全</text><text class="node-explanation" x="400.5" y="148">組の利益が定まります。</text></g><g class="flow-node question" data-node="positive"><rect x="272.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">利益を得る組は価格差と期間がともに</text><text class="node-title" x="288.5" y="467">正で、取引しない選択もできますか？</text><text class="node-explanation" x="288.5" y="494">二差が両方負のとき、積だけを見て正利益と数えては</text><text class="node-explanation" x="288.5" y="512">いけません。</text></g><g class="flow-node question" data-node="one-pair"><rect x="159.5" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">二群から一つずつだけ選び、他の組別</text><text class="node-title" x="175.5" y="831">制約や同時割当はありませんか？</text><text class="node-explanation" x="175.5" y="858">両座標で劣る候補を除くと、正利益の相手の範囲と最</text><text class="node-explanation" x="175.5" y="876">適添字が単調になります。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1124" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1144">候補</text><text class="node-title" x="48" y="1172">支配される点を除き、中央の最適相手</text><text class="node-title" x="48" y="1195">を境に前後の探索範囲を分ける</text><a href="/flowchartcp/techniques/pareto-pruned-max-rectangle-monotone-partner/"><title>二つの差の積で決まる最大利益は、劣る候補を除いて最適な相手の範囲を絞るの記事へ</title><text x="48" y="1234">二つの差の積で決まる最大利益は、劣る候補を除い</text><text x="48" y="1252">て最適な相手の範囲を絞る</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1124" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1144">分野</text><text class="node-title" x="412" y="1172">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1209">詳細の質問・図へ →</text></a></g></svg>