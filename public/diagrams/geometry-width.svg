<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-geometry-width flow-desc-geometry-width" width="860" height="1349" viewBox="0 0 860 1349" data-flow-svg="geometry-width"><title id="flow-title-geometry-width">平行壁の最小幅の解法フローチャート</title><desc id="flow-desc-geometry-width">非凸入力も凸包へ写し、支持線の幅を比べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-geometry-width" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="width-hull:yes:width-support"><title>はい</title><path d="M539.722 182 V194 C539.722 226 420.667 226 420.667 258 V270"/><path d="M420.667 308 V320 C420.667 352 420.667 352 420.667 384 V396" marker-end="url(#arrow-geometry-width)"/><g class="flow-edge-label" data-edge-label="width-hull:yes:width-support" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="width-hull:no:fallback"><title>いいえ</title><path d="M619.722 182 V194 C619.722 226 655 226 655 258 V270"/><path d="M655 308 V320 C655 352 762.5 352 762.5 384 V396 V558 C762.5 590 762.5 590 762.5 622 V634 V684 C762.5 716 458 716 458 748 V760 V964 C458 996 360 996 360 1028 V1040 V1090 C360 1122 304 1122 304 1154 V1166" marker-end="url(#arrow-geometry-width)"/><g class="flow-edge-label" data-edge-label="width-hull:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="width-hull:unknown:check"><title>わからない</title><path d="M699.722 182 V194 C699.722 226 783.5 226 783.5 258 V270"/><path d="M783.5 308 V320 C783.5 352 818.5 352 818.5 384 V396 V558 C818.5 590 818.5 590 818.5 622 V634 V684 C818.5 716 721.333 716 721.333 748 V760" marker-end="url(#arrow-geometry-width)"/><g class="flow-edge-label" data-edge-label="width-hull:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="width-support:yes:width-result"><title>はい</title><path d="M340.667 546 V558 C340.667 590 192 590 192 622 V634"/><path d="M192 672 V684 C192 716 192 716 192 748 V760" marker-end="url(#arrow-geometry-width)"/><g class="flow-edge-label" data-edge-label="width-support:yes:width-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="657">はい</text></g></g><g class="flow-edge no" data-edge="width-support:no:fallback"><title>いいえ</title><path d="M420.667 546 V558 C420.667 590 402 590 402 622 V634"/><path d="M402 672 V684 C402 716 402 716 402 748 V760 V964 C402 996 304 996 304 1028 V1040 V1090 C304 1122 224 1122 224 1154 V1166" marker-end="url(#arrow-geometry-width)"/><g class="flow-edge-label" data-edge-label="width-support:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="width-support:unknown:check"><title>わからない</title><path d="M500.667 546 V558 C500.667 590 668 590 668 622 V634"/><path d="M668 672 V684 C668 716 614.667 716 614.667 748 V760" marker-end="url(#arrow-geometry-width)"/><g class="flow-edge-label" data-edge-label="width-support:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 915 V964 C588 996 450 996 450 1028 V1040"/><path d="M450 1078 V1090 C450 1122 384 1122 384 1154 V1166" marker-end="url(#arrow-geometry-width)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1040" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1063">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 915 V964 C668 996 655 996 655 1028 V1040"/><path d="M655 1078 V1090 C655 1122 614.667 1122 614.667 1154 V1166" marker-end="url(#arrow-geometry-width)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1040" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1063">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 915 V964 C748 996 783.5 996 783.5 1028 V1040"/><path d="M783.5 1078 V1090 C783.5 1122 721.333 1122 721.333 1154 V1166" marker-end="url(#arrow-geometry-width)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1040" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1063">わからない</text></g></g><g class="flow-node question" data-node="width-hull"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">全点または多角形を挟む条件は、凸包</text><text class="node-title" x="475.7222222222223" y="103">を挟む条件と同じですか？</text><text class="node-explanation" x="475.7222222222223" y="130">入力が非凸でも、平行壁に入るかはその凸包で決まり</text><text class="node-explanation" x="475.7222222222223" y="148">ます。</text></g><g class="flow-node question" data-node="width-support"><rect x="260.6666666666667" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">凸包の辺と、その辺から最も離れた支</text><text class="node-title" x="276.6666666666667" y="467">持点の間の幅を比較できますか？</text><text class="node-explanation" x="276.6666666666667" y="494">面積二倍を辺長で割って幅を求めます。辺長 0 の</text><text class="node-explanation" x="276.6666666666667" y="512">重複点を除き、全共線なら幅 0 です。</text></g><g class="flow-node result" data-node="width-result"><rect x="32" y="760" width="320" height="192" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">凸包の各辺に平行な支持線を置き、最</text><text class="node-title" x="48" y="831">小の幅を求める</text><a href="/flowchartcp/techniques/convex-minimum-width/"><title>図形を挟む平行線の最小幅を、凸包の辺ごとに求めるの記事へ</title><text x="48" y="870">図形を挟む平行線の最小幅を、凸包の辺ごとに求め</text><text x="48" y="888">る</text></a><a href="/flowchartcp/techniques/convex-hull/"><title>凸包の記事へ</title><text x="48" y="912">凸包</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="760" width="320" height="155" rx="7"/><text class="node-kind" x="524" y="780">質問</text><text class="node-title" x="524" y="808">座標の範囲、境界、重複、共線の場合</text><text class="node-title" x="524" y="831">を問題文と小さい例で確認できます</text><text class="node-title" x="524" y="854">か？</text><text class="node-explanation" x="524" y="881">保証される形と、必要な幾何の性質を区別します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1166" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1186">候補</text><text class="node-title" x="160" y="1214">入力の形と退化する場合を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1253">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1277">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1166" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1186">分野</text><text class="node-title" x="524" y="1214">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1251">詳細の質問・図へ →</text></a></g></svg>