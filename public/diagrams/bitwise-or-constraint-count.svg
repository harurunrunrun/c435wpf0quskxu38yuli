<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-bitwise-or-constraint-count flow-desc-bitwise-or-constraint-count" width="1112" height="1778" viewBox="0 0 1112 1778" data-flow-svg="bitwise-or-constraint-count"><title id="flow-title-bitwise-or-constraint-count">少数の整数のOR条件は、各ビットの割当数を別々に数えて掛けるの解法フローチャート</title><desc id="flow-desc-bitwise-or-constraint-count">ビット数と整数の個数を分け、桁をまたぐ制約がないことを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-bitwise-or-constraint-count" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge triplet-or" data-edge="model:triplet-or:assumptions"><title>少数の整数列で、指定された三要素の OR が与えられる</title><path d="M718.5 182 V194 C718.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 326 V338 C535.5 370 746.111 370 746.111 402 V414" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="model:triplet-or:assumptions" tabindex="0" role="group" aria-label="選択肢：少数の整数列で、指定された三要素の OR が与えられる"><rect x="413" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="535.5" y="293">少数の整数列で、指定された三要素の</text><text text-anchor="middle" x="535.5" y="311"> OR が与えられる</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>桁の和・要素ごとの大小関係など、異なる桁を結ぶ条件もある</title><path d="M798.5 182 V194 C798.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V599 C1018 631 1018 631 1018 663 V675 V725 C1018 757 1018 757 1018 789 V801 V986 C1018 1018 1018 1018 1018 1050 V1062 V1112 C1018 1144 636 1144 636 1176 V1188" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：桁の和・要素ごとの大小関係など、異なる桁を結ぶ条件もある"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">桁の和・要素ごとの大小関係など、異</text><text text-anchor="middle" x="824.5" y="311">なる桁を結ぶ条件もある</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M878.5 182 V194 C878.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V599 C1074 631 1074 631 1074 663 V675 V725 C1074 757 1074 757 1074 789 V801 V986 C1074 1018 1074 1018 1074 1050 V1062 V1112 C1074 1144 1000 1144 1000 1176 V1188" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 587 V599 C666.111 631 519.833 631 519.833 663 V675"/><path d="M519.833 713 V725 C519.833 757 519.833 757 519.833 789 V801" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="698">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 587 V599 C746.111 631 795 631 795 663 V675"/><path d="M795 713 V725 C795 757 906 757 906 789 V801 V986 C906 1018 906 1018 906 1050 V1062 V1112 C906 1144 556 1144 556 1176 V1188" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"><title>わからない</title><path d="M826.111 587 V599 C826.111 631 923.5 631 923.5 663 V675"/><path d="M923.5 713 V725 C923.5 757 962 757 962 789 V801 V986 C962 1018 962 1018 962 1050 V1062 V1112 C962 1144 920 1144 920 1176 V1188" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="assumptions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M439.833 974 V986 C439.833 1018 192 1018 192 1050 V1062"/><path d="M192 1100 V1112 C192 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M519.833 974 V986 C519.833 1018 556 1018 556 1050 V1062"/><path d="M556 1100 V1112 C556 1144 476 1144 476 1176 V1188" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M599.833 974 V986 C599.833 1018 811.5 1018 811.5 1050 V1062"/><path d="M811.5 1100 V1112 C811.5 1144 840 1144 840 1176 V1188" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="767" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1085">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1338 V1387 C840 1419 783 1419 783 1451 V1463"/><path d="M783 1501 V1513 C783 1545 828.5 1545 828.5 1577 V1589" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1463" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1486">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1338 V1387 C920 1419 907 1419 907 1451 V1463"/><path d="M907 1501 V1513 C907 1545 908.5 1545 908.5 1577 V1589" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1463" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1486">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1338 V1387 C1000 1419 1035.5 1419 1035.5 1451 V1463"/><path d="M1035.5 1501 V1513 C1035.5 1545 988.5 1545 988.5 1577 V1589" marker-end="url(#arrow-bitwise-or-constraint-count)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1463" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1486">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="638.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="654.5" y="52">質問</text><text class="node-title" x="654.5" y="80">整数や列について指定される条件はど</text><text class="node-title" x="654.5" y="103">れですか？</text><text class="node-explanation" x="654.5" y="130">ビット数と整数の個数を分け、桁をまたぐ制約がない</text><text class="node-explanation" x="654.5" y="148">ことを確認します。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="414" width="320" height="173" rx="7"/><text class="node-kind" x="602.1111111111112" y="434">質問</text><text class="node-title" x="602.1111111111112" y="462">全要素が 0 以上 2^B 未満</text><text class="node-title" x="602.1111111111112" y="485">で、桁どうしを結ぶ追加条件はありま</text><text class="node-title" x="602.1111111111112" y="508">せんか？</text><text class="node-explanation" x="602.1111111111112" y="535">三要素の OR の等式なら、各桁の 0/1 割当</text><text class="node-explanation" x="602.1111111111112" y="553">を独立に確認できます。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="801" width="320" height="173" rx="7"/><text class="node-kind" x="375.83333333333337" y="821">質問</text><text class="node-title" x="375.83333333333337" y="849">整数の個数は12個以下、条件は</text><text class="node-title" x="375.83333333333337" y="872">100個以下、各整数は64ビット以</text><text class="node-title" x="375.83333333333337" y="895">内ですか？</text><text class="node-explanation" x="375.83333333333337" y="922">値域のビット数が多くても、指数化するのは整数の個</text><text class="node-explanation" x="375.83333333333337" y="940">数です。全ての条件を各割当で検査します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">少数の整数のOR条件は、各ビットの</text><text class="node-title" x="48" y="1259">割当数を別々に数えて掛ける</text><a href="/flowchartcp/techniques/bitwise-or-constraint-count/"><title>少数の整数のOR条件は、各ビットの割当数を別々に数えて掛けるの記事へ</title><text x="48" y="1298">少数の整数のOR条件は、各ビットの割当数を別々</text><text x="48" y="1316">に数えて掛ける</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1188" width="320" height="187" rx="7"/><text class="node-kind" x="412" y="1208">候補</text><text class="node-title" x="412" y="1236">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1263">桁どうしに条件がある場合は、各桁の成立数を独立に</text><text class="node-explanation" x="412" y="1281">掛けられません。持ち越す情報を状態へ入れます。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1311">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1335">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1188" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1208">質問</text><text class="node-title" x="776" y="1236">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1259">確認できますか？</text><text class="node-explanation" x="776" y="1286">ビット数と整数の個数を分け、桁をまたぐ制約がない</text><text class="node-explanation" x="776" y="1304">ことを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1589" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1609">分野</text><text class="node-title" x="764.5" y="1637">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1664">ビット数と整数の個数を分け、桁をまたぐ制約がない</text><text class="node-explanation" x="764.5" y="1682">ことを確認します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1710">詳細の質問・図へ →</text></a></g></svg>