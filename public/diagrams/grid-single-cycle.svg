<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-grid-single-cycle flow-desc-grid-single-cycle" width="972" height="2135" viewBox="0 0 972 2135" data-flow-svg="grid-single-cycle"><title id="flow-title-grid-single-cycle">細い盤面を一つの閉路で覆うの解法フローチャート</title><desc id="flow-desc-grid-single-cycle">盤面の幅と、境界を横切る端点のつながりを使い、途中に余分な閉路ができないよう数えます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-grid-single-cycle" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="cover:yes:width"><title>はい</title><path d="M688.5 200 V212 C688.5 244 643 244 643 276 V288"/><path d="M643 326 V338 C643 370 656.5 370 656.5 402 V414" marker-end="url(#arrow-grid-single-cycle)"/><g class="flow-edge-label" data-edge-label="cover:yes:width" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="603" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="643" y="311">はい</text></g></g><g class="flow-edge no" data-edge="cover:no:fallback"><title>いいえ</title><path d="M768.5 200 V212 C768.5 244 767 244 767 276 V288"/><path d="M767 326 V338 C767 370 878 370 878 402 V414 V576 C878 608 878 608 878 640 V652 V702 C878 734 878 734 878 766 V778 V958 C878 990 878 990 878 1022 V1034 V1084 C878 1116 878 1116 878 1148 V1160 V1345 C878 1377 878 1377 878 1409 V1421 V1471 C878 1503 934 1503 934 1535 V1547 V1727 C934 1759 934 1759 934 1791 V1803 V1853 C934 1885 522.667 1885 522.667 1917 V1929" marker-end="url(#arrow-grid-single-cycle)"/><g class="flow-edge-label" data-edge-label="cover:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="727" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="767" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="cover:unknown:check"><title>わからない</title><path d="M848.5 200 V212 C848.5 244 895.5 244 895.5 276 V288"/><path 