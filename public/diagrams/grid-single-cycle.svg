ge yes" data-edge="closing:yes:cycle-result"><title>はい</title><path d="M304.5 1333 V1345 C304.5 1377 192 1377 192 1409 V1421"/><path d="M192 1459 V1471 C192 1503 192 1503 192 1535 V1547" marker-end="url(#arrow-grid-single-cycle)"/><g class="flow-edge-label" data-edge-label="closing:yes:cycle-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1421" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1444">はい</text></g></g><g class="flow-edge no" data-edge="closing:no:fallback"><title>いいえ</title><path d="M384.5 1333 V1345 C384.5 1377 402 1377 402 1409 V1421"/><path d="M402 1459 V1471 C402 1503 402 1503 402 1535 V1547 V1727 C402 1759 385 1759 385 1791 V1803 V1853 C385 1885 309.333 1885 309.333 1917 V1929" marker-end="url(#arrow-grid-single-cycle)"/><g class="flow-edge-label" data-edge-label="closing:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="1421" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="1444">いいえ</text></g></g><g class="flow-edge unknown" data-edge="closing:unknown:check"><title>わからない</title><path d="M464.5 1333 V1345 C464.5 1377 559.5 1377 559.5 1409 V1421"/><path d="M559.5 1459 V1471 C559.5 1503 628 1503 628 1535 V1547" marker-end="url(#arrow-grid-single-cycle)"/><g class="flow-edge-label" data-edge-label="closing:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="1421" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="1444">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M644 1697 V1727 C644 1759 587 1759 587 1791 V1803"/><path d="M587 1841 V1853 C587 1885 469.333 1885 469.333 1917 V1929" marker-end="url(#arrow-grid-single-cycle)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="547" y="1803" width="80" height="38" rx="5"/><text text-anchor="middle" x="587" y="1826">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M724 1697 V1727 C724 1759 711 1759 711 1791 V1803"/><path d="M711 1841 V1853 C711 1885 726.667 1885 726.667 1917 V1929" marker-end="url(#arrow-grid-single-cycle)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="671" y="1803" width="80" height="38" rx="5"/><text text-anchor="middle" x="711" y="1826">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M804 1697 V1727 C804 1759 839.5 1759 839.5 1791 V1803"/><path d="M839.5 1841 V1853 C839.5 1885 833.333 1885 833.333 1917 V1929" marker-end="url(#arrow-grid-single-cycle)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="795" y="1803" width="89" height="38" rx="5"/><text text-anchor="middle" x="839.5" y="1826">わからない</text></g></g><g class="flow-node question" data-node="cover"><rect x="608.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="624.5" y="52">質問</text><text class="node-title" x="624.5" y="80">全ての使用マスを一度ずつ通る、一つ</text><text class="node-title" x="624.5" y="103">の閉路を数えますか？</text><text class="node-explanation" x="624.5" y="130">障害物を避け、上下左右の隣接辺で全ての使用マスを</text><text class="node-explanation" x="624.5" y="148">つなぎます。複数の閉路に分かれる配置は数えませ</text><text class="node-explanation" x="624.5" y="166">ん。</text></g><g class="flow-node question" data-node="width"><rect x="496.5" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="512.5" y="434">質問</text><text class="node-title" x="512.5" y="462">短い辺の幅が小さく、境界の状態を全</text><text class="node-title" x="512.5" y="485">列挙できますか？</text><text class="node-explanation" x="512.5" y="512">必要なら盤面を転置します。縦横の積よりも、幅に対</text><text class="node-explanation" x="512.5" y="530">する状態数が計算量を左右します。</text></g><g class="flow-node question" data-node="ends"><rect x="373" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="389" y="798">質問</text><text class="node-title" x="389" y="826">各使用マスの次数を 2 にし、境界</text><text class="node-title" x="389" y="849">の端点のつながりを管理できますか？</text><text class="node-explanation" x="389" y="876">処理済み部分の各経路の二端を同じ組として持ちま</text><text class="node-explanation" x="389" y="894">す。占有の有無だけでは、二つの閉路を一つと区別で</text><text class="node-explanation" x="389" y="912">きません。</text></g><g class="flow-node question" data-node="closing"><rect x="224.5" y="1160" width="320" height="173" rx="7"/><text class="node-kind" x="240.5" y="1180">質問</text><text class="node-title" x="240.5" y="1208">最後の使用マスより前で閉じる閉路を</text><text class="node-title" x="240.5" y="1231">除き、閉じるとき境界を空にします</text><text class="node-title" x="240.5" y="1254">か？</text><text class="node-explanation" x="240.5" y="1281">盤面の右下が障害物なら、最後に処理する使用マスは</text><text class="node-explanation" x="240.5" y="1299">右下とは限りません。</text></g><g class="flow-node result" data-node="cycle-result"><rect x="32" y="1547" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1567">候補</text><text class="node-title" x="48" y="1595">境界に経路の端点の組を持ち、最後だ</text><text class="node-title" x="48" y="1618">け閉路を閉じる</text><a href="/flowchartcp/techniques/frontier-single-cycle/"><title>細い盤面を一本の閉路で覆うなら、境界の端点のつながりを持つの記事へ</title><text x="48" y="1657">細い盤面を一本の閉路で覆うなら、境界の端点のつ</text><text x="48" y="1675">ながりを持つ</text></a></g><g class="flow-node question" data-node="check"><rect x="564" y="1547" width="320" height="150" rx="7"/><text class="node-kind" x="580" y="1567">質問</text><text class="node-title" x="580" y="1595">必ず通るマスと、閉路を一つにする条</text><text class="node-title" x="580" y="1618">件が分かりますか？</text><text class="node-explanation" x="580" y="1645">一部のマスを省く経路、固定した始終点の経路、複数</text><text class="node-explanation" x="580" y="1663">閉路を許す配置では、状態や終了条件が変わります。</text></g><g class="flow-node result" data-node="fallback"><rect x="256" y="1929" width="320" height="174" rx="7"/><text class="node-kind" x="272" y="1949">候補</text><text class="node-title" x="272" y="1977">通るマス・各マスの次数・つながりの</text><text class="node-title" x="272" y="2000">条件を確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="272" y="2039">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="272" y="2063">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="620" y="1929" width="320" height="121" rx="7"/><text class="node-kind" x="636" y="1949">分野</text><text class="node-title" x="636" y="1977">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="636" y="2014">詳細の質問・図へ →</text></a></g></svg>