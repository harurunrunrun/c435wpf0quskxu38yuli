<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-fixed-count-objective flow-desc-fixed-count-objective" width="1168" height="943" viewBox="0 0 1168 943" data-flow-svg="fixed-count-objective"><title id="flow-title-fixed-count-objective">選ぶ個数が固定された目的値の解法フローチャート</title><desc id="flow-desc-fixed-count-objective">K 個の選択で、種類の追加と積の符号を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-fixed-count-objective" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge diversity" data-edge="objective:diversity:diversity-route"><title>価値の和＋選んだ種類数に応じて増える報酬</title><path d="M541.875 182 V194 C541.875 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-fixed-count-objective)"/><g class="flow-edge-label" data-edge-label="objective:diversity:diversity-route" tabindex="0" role="group" aria-label="選択肢：価値の和＋選んだ種類数に応じて増える報酬"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">価値の和＋選んだ種類数に応じて増え</text><text text-anchor="middle" x="192" y="311">る報酬</text></g></g><g class="flow-edge product" data-edge="objective:product:product-route"><title>負や零もある整数の積を、整数として最大にする</title><path d="M605.875 182 V194 C605.875 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-fixed-count-objective)"/><g class="flow-edge-label" data-edge-label="objective:product:product-route" tabindex="0" role="group" aria-label="選択肢：負や零もある整数の積を、整数として最大にする"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">負や零もある整数の積を、整数として</text><text text-anchor="middle" x="556" y="311">最大にする</text></g></g><g class="flow-edge other" data-edge="objective:other:fallback"><title>その他の個数固定の目的値</title><path d="M669.875 182 V194 C669.875 226 812.5 226 812.5 258 V270"/><path d="M812.5 308 V338 C812.5 370 766 370 766 402 V414 V558 C766 590 612 590 612 622 V634 V684 C612 716 558.667 716 558.667 748 V760" marker-end="url(#arrow-fixed-count-objective)"/><g class="flow-edge-label" data-edge-label="objective:other:fallback" tabindex="0" role="group" aria-label="選択肢：その他の個数固定の目的値"><rect x="722.5" y="270" width="180" height="38" rx="5"/><text text-anchor="middle" x="812.5" y="293">その他の個数固定の目的値</text></g></g><g class="flow-edge unknown" data-edge="objective:unknown:check"><title>わからない</title><path d="M733.875 182 V194 C733.875 226 991 226 991 258 V270"/><path d="M991 308 V338 C991 370 976 370 976 402 V414" marker-end="url(#arrow-fixed-count-objective)"/><g class="flow-edge-label" data-edge-label="objective:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="946.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="991" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M896 546 V558 C896 590 702 590 702 622 V634"/><path d="M702 672 V684 C702 716 665.333 716 665.333 748 V760" marker-end="url(#arrow-fixed-count-objective)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="662" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="702" y="657">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 546 V558 C976 590 963 590 963 622 V634"/><path d="M963 672 V684 C963 716 922.667 716 922.667 748 V760" marker-end="url(#arrow-fixed-count-objective)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 546 V558 C1056 590 1091.5 590 1091.5 622 V634"/><path d="M1091.5 672 V684 C1091.5 716 1029.333 716 1029.333 748 V760" marker-end="url(#arrow-fixed-count-objective)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="657">わからない</text></g></g><g class="flow-node question" data-node="objective"><rect x="477.875" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="493.875" y="52">質問</text><text class="node-title" x="493.875" y="80">ちょうど K 個を選び、どの値を最</text><text class="node-title" x="493.875" y="103">大にしますか？</text><text class="node-explanation" x="493.875" y="130">価値の和、種類に対する報酬、積の大小では選び方が</text><text class="node-explanation" x="493.875" y="148">異なります。</text></g><g class="flow-node route" data-node="diversity-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">固定個数で種類を増やす交換</text><a href="/flowchartcp/flowcharts/#diagram-fixed-count-diversity" data-route="fixed-count-diversity"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="product-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">固定個数の積と符号の交換</text><a href="/flowchartcp/flowcharts/#diagram-fixed-count-signed-product" data-route="fixed-count-signed-product"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="816" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="832" y="434">質問</text><text class="node-title" x="832" y="462">必要な条件を、問題文と小さい例から</text><text class="node-title" x="832" y="485">確認できますか？</text><text class="node-explanation" x="832" y="512">時間、順番、使える回数と目的値を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="452" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="468" y="780">候補</text><text class="node-title" x="468" y="808">条件と選び方をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="468" y="847">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="468" y="871">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="760" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="780">分野</text><text class="node-title" x="832" y="808">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="845">詳細の質問・図へ →</text></a></g></svg>