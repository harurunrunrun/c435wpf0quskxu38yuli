<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strings-subsequence-goals flow-desc-strings-subsequence-goals" width="1840" height="949" viewBox="0 0 1840 949" data-flow-svg="strings-subsequence-goals"><title id="flow-title-strings-subsequence-goals">部分列の個数・照合・削除と変更の解法フローチャート</title><desc id="flow-desc-strings-subsequence-goals">元の順序で文字を残し、部分列の種類数、指定列の取り出し、削除や置換の条件を調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strings-subsequence-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge count-construction" data-edge="subsequence-check:count-construction:count-construction-route"><title>種類数・指定長の最小列・取り出せない列</title><path d="M813.333 182 V194 C813.333 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-strings-subsequence-goals)"/><g class="flow-edge-label" data-edge-label="subsequence-check:count-construction:count-construction-route" tabindex="0" role="group" aria-label="選択肢：種類数・指定長の最小列・取り出せない列"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">種類数・指定長の最小列・取り出せな</text><text text-anchor="middle" x="192" y="311">い列</text></g></g><g class="flow-edge extraction-queries" data-edge="subsequence-check:extraction-queries:extraction-queries-route"><title>固定・反復本文から指定列や指定形を取り出す</title><path d="M866.667 182 V194 C866.667 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-strings-subsequence-goals)"/><g class="flow-edge-label" data-edge-label="subsequence-check:extraction-queries:extraction-queries-route" tabindex="0" role="group" aria-label="選択肢：固定・反復本文から指定列や指定形を取り出す"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">固定・反復本文から指定列や指定形を</text><text text-anchor="middle" x="556" y="311">取り出す</text></g></g><g class="flow-edge removal-changes" data-edge="subsequence-check:removal-changes:removal-changes-route"><title>連続削除・文字変更・その他の条件</title><path d="M920 182 V194 C920 226 920 226 920 258 V270"/><path d="M920 308 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-strings-subsequence-goals)"/><g class="flow-edge-label" data-edge-label="subsequence-check:removal-changes:removal-changes-route" tabindex="0" role="group" aria-label="選択肢：連続削除・文字変更・その他の条件"><rect x="804" y="270" width="232" height="38" rx="5"/><text text-anchor="middle" x="920" y="293">連続削除・文字変更・その他の条件</text></g></g><g class="flow-edge common-reconstruction" data-edge="subsequence-check:common-reconstruction:common-reconstruction-route"><title>二つの列に共通する最長の部分列を求める</title><path d="M973.333 182 V194 C973.333 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-strings-subsequence-goals)"/><g class="flow-edge-label" data-edge-label="subsequence-check:common-reconstruction:common-reconstruction-route" tabindex="0" role="group" aria-label="選択肢：二つの列に共通する最長の部分列を求める"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">二つの列に共通する最長の部分列を求</text><text text-anchor="middle" x="1284" y="311">める</text></g></g><g class="flow-edge unknown" data-edge="subsequence-check:unknown:check"><title>わからない</title><path d="M1026.667 182 V194 C1026.667 226 1648 226 1648 258 V270"/><path d="M1648 308 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-strings-subsequence-goals)"/><g class="flow-edge-label" data-edge-label="subsequence-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1603.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1648" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:substring-route"><title>はい</title><path d="M1568 564 V576 C1568 608 1284 608 1284 640 V652"/><path d="M1284 690 V702 C1284 734 1284 734 1284 766 V778" marker-end="url(#arrow-strings-subsequence-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:substring-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1244" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="675">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1648 564 V576 C1648 608 1635 608 1635 640 V652"/><path d="M1635 690 V702 C1635 734 1594.667 734 1594.667 766 V778" marker-end="url(#arrow-strings-subsequence-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1595" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1635" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1728 564 V576 C1728 608 1763.5 608 1763.5 640 V652"/><path d="M1763.5 690 V702 C1763.5 734 1701.333 734 1701.333 766 V778" marker-end="url(#arrow-strings-subsequence-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1719" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1763.5" y="675">わからない</text></g></g><g class="flow-node question" data-node="subsequence-check"><rect x="760" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="52">質問</text><text class="node-title" x="776" y="80">連続していない部分列について何を求</text><text class="node-title" x="776" y="103">めますか？</text><text class="node-explanation" x="776" y="130">取り出せる列の個数、複数の列の照合、取り出せない</text><text class="node-explanation" x="776" y="148">列の構築、削除や置換の費用を分けます。</text></g><g class="flow-node question" data-node="check"><rect x="1488" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1504" y="434">質問</text><text class="node-title" x="1504" y="462">求めているのは、連続した部分文字列</text><text class="node-title" x="1504" y="485">ですか？</text><text class="node-explanation" x="1504" y="512">連続しない部分列なら、添字や最後の文字などを状態</text><text class="node-explanation" x="1504" y="530">にする DP を検討します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1488" y="778" width="320" height="139" rx="7"/><text class="node-kind" x="1504" y="798">分野</text><text class="node-title" x="1504" y="826">条件を確かめる</text><text class="node-explanation" x="1504" y="853">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1504" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="substring-route"><rect x="1124" y="778" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="798">分野</text><text class="node-title" x="1140" y="826">部分文字列</text><a href="/flowchartcp/flowcharts/#diagram-string-substring" data-route="string-substring"><text x="1140" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="count-construction-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">部分列の種類数と構築</text><a href="/flowchartcp/flowcharts/#diagram-strings-subsequence-count-construction" data-route="strings-subsequence-count-construction"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="extraction-queries-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">本文からの部分列の取り出し</text><a href="/flowchartcp/flowcharts/#diagram-strings-subsequence-extraction-queries" data-route="strings-subsequence-extraction-queries"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="removal-changes-route"><rect x="760" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">部分列を残す削除と、部分列を避ける</text><text class="node-title" x="776" y="4