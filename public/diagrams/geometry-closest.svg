C588 1013 450 1013 450 1045 V1057"/><path d="M450 1095 V1107 C450 1139 384 1139 384 1171 V1183" marker-end="url(#arrow-geometry-closest)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 956 V981 C668 1013 655 1013 655 1045 V1057"/><path d="M655 1095 V1107 C655 1139 614.667 1139 614.667 1171 V1183" marker-end="url(#arrow-geometry-closest)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 956 V981 C748 1013 783.5 1013 783.5 1045 V1057"/><path d="M783.5 1095 V1107 C783.5 1139 721.333 1139 721.333 1171 V1183" marker-end="url(#arrow-geometry-closest)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="closest-integer"><rect x="459.7222222222223" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">ユークリッド距離の二乗を正確に計算</text><text class="node-title" x="475.7222222222223" y="103">でき、同じ座標の二点は距離 0 と</text><text class="node-title" x="475.7222222222223" y="126">扱えますか？</text><text class="node-explanation" x="475.7222222222223" y="153">dx^2+dy^2 を計算します。差を取る前に十</text><text class="node-explanation" x="475.7222222222223" y="171">分な型へ広げ、平方と和があふれないことを確認しま</text><text class="node-explanation" x="475.7222222222223" y="189">す。</text></g><g class="flow-node question" data-node="closest-strip"><rect x="260.6666666666667" y="437" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="457">質問</text><text class="node-title" x="276.6666666666667" y="485">左右で分けた最小距離を使い、分割線</text><text class="node-title" x="276.6666666666667" y="508">の近くの帯だけを比べられますか？</text><text class="node-explanation" x="276.6666666666667" y="535">各側の点間距離の下限を使うと、y 順の帯で一定個</text><text class="node-explanation" x="276.6666666666667" y="553">数の近い点だけを調べれば足ります。</text></g><g class="flow-node result" data-node="closest-result"><rect x="32" y="801" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="821">候補</text><text class="node-title" x="48" y="849">x で左右を分け、境目の帯を y </text><text class="node-title" x="48" y="872">順で比べる</text><a href="/flowchartcp/techniques/geometry-closest-pair/"><title>最も近い二点を、左右の境界付近だけ比較して求めるの記事へ</title><text x="48" y="911">最も近い二点を、左右の境界付近だけ比較して求め</text><text x="48" y="929">る</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="801" width="320" height="155" rx="7"/><text class="node-kind" x="524" y="821">質問</text><text class="node-title" x="524" y="849">座標の範囲、境界、重複、共線の場合</text><text class="node-title" x="524" y="872">を問題文と小さい例で確認できます</text><text class="node-title" x="524" y="895">か？</text><text class="node-explanation" x="524" y="922">保証される形と、必要な幾何の性質を区別します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1203">候補</text><text class="node-title" x="160" y="1231">入力の形と退化する場合を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1270">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1294">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1203">分野</text><text class="node-title" x="524" y="1231">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1268">詳細の質問・図へ →</text></a></g></svg>