<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-heuristic-ordered-route flow-desc-heuristic-ordered-route" width="1336" height="1730" viewBox="0 0 1336 1730" data-flow-svg="heuristic-ordered-route"><title id="flow-title-heuristic-ordered-route">先行条件のある訪問順の解法フローチャート</title><desc id="flow-desc-heuristic-ordered-route">区間の反転と、受取・配達の二点の挿入を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-heuristic-ordered-route" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge reverse" data-edge="operation:reverse:symmetric-distance"><title>訪問列の内部の一区間を反転する</title><path d="M830.944 164 V176 C830.944 208 424.833 208 424.833 240 V252"/><path d="M424.833 290 V320 C424.833 352 424.833 352 424.833 384 V396" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="operation:reverse:symmetric-distance" tabindex="0" role="group" aria-label="選択肢：訪問列の内部の一区間を反転する"><rect x="315.3333333333333" y="252" width="219" height="38" rx="5"/><text text-anchor="middle" x="424.8333333333333" y="275">訪問列の内部の一区間を反転する</text></g></g><g class="flow-edge insert-pair" data-edge="operation:insert-pair:pair-order-only"><title>一注文の受取と配達を、元の順を保って差し込む</title><path d="M910.944 164 V176 C910.944 208 1048.5 208 1048.5 240 V252"/><path d="M1048.5 308 V320 C1048.5 352 1076.5 352 1076.5 384 V396" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="operation:insert-pair:pair-order-only" tabindex="0" role="group" aria-label="選択肢：一注文の受取と配達を、元の順を保って差し込む"><rect x="926" y="252" width="245" height="56" rx="5"/><text text-anchor="middle" x="1048.5" y="275">一注文の受取と配達を、元の順を保っ</text><text text-anchor="middle" x="1048.5" y="293">て差し込む</text></g></g><g class="flow-edge unknown" data-edge="operation:unknown:check"><title>わからない</title><path d="M990.944 164 V176 C990.944 208 1259.5 208 1259.5 240 V252"/><path d="M1259.5 290 V320 C1259.5 352 1298 352 1298 384 V396 V558 C1298 590 1298 590 1298 622 V634 V684 C1298 716 1298 716 1298 748 V760 V963 C1298 995 1298 995 1298 1027 V1039 V1089 C1298 1121 1194.667 1121 1194.667 1153 V1165" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="operation:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1215" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="1259.5" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="symmetric-distance:yes:reverse-precedence"><title>はい</title><path d="M424.833 546 V558 C424.833 590 453.5 590 453.5 622 V634"/><path d="M453.5 672 V684 C453.5 716 453.5 716 453.5 748 V760" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="symmetric-distance:yes:reverse-precedence" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="413.5" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="453.5" y="657">はい</text></g></g><g class="flow-edge no" data-edge="symmetric-distance:no:fallback"><title>いいえ</title><path d="M344.833 546 V558 C344.833 590 72 590 72 622 V634"/><path d="M72 672 V684 C72 716 38 716 38 748 V760 V963 C38 995 38 995 38 1027 V1039 V1089 C38 1121 38 1121 38 1153 V1165 V1345 C38 1377 651.8 1377 651.8 1409 V1421 V1471 C651.8 1503 545.133 1503 545.133 1535 V1547" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="symmetric-distance:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="32" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="symmetric-distance:unknown:check"><title>わからない</title><path d="M504.833 546 V558 C504.833 590 749 590 749 622 V634"/><path d="M749 672 V684 C749 716 749 716 749 748 V760 V963 C749 995 749 995 749 1027 V1039 V1089 C749 1121 1034.667 1