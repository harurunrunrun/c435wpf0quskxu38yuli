pair-gap-separable"><title>はい</title><path d="M996.5 546 V558 C996.5 590 951 590 951 622 V634"/><path d="M951 672 V684 C951 716 964.5 716 964.5 748 V760" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="pair-order-only:yes:pair-gap-separable" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="911" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="951" y="657">はい</text></g></g><g class="flow-edge no" data-edge="pair-order-only:no:fallback"><title>いいえ</title><path d="M1076.5 546 V558 C1076.5 590 1075 590 1075 622 V634"/><path d="M1075 672 V684 C1075 716 1186 716 1186 748 V760 V963 C1186 995 1186 995 1186 1027 V1039 V1089 C1186 1121 1298 1121 1298 1153 V1165 V1345 C1298 1377 1298 1377 1298 1409 V1421 V1471 C1298 1503 758.467 1503 758.467 1535 V1547" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="pair-order-only:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="pair-order-only:unknown:check"><title>わからない</title><path d="M1156.5 546 V558 C1156.5 590 1203.5 590 1203.5 622 V634"/><path d="M1203.5 672 V684 C1203.5 716 1242 716 1242 748 V760 V963 C1242 995 1242 995 1242 1027 V1039 V1089 C1242 1121 1141.333 1121 1141.333 1153 V1165" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="pair-order-only:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="pair-gap-separable:yes:insertion-result"><title>はい</title><path d="M964.5 933 V963 C964.5 995 963 995 963 1027 V1039"/><path d="M963 1077 V1089 C963 1121 724 1121 724 1153 V1165" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="pair-gap-separable:yes:insertion-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="923" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="pair-gap-separable:no:fallback"><title>いいえ</title><path d="M884.5 933 V963 C884.5 995 839 995 839 1027 V1039"/><path d="M839 1077 V1089 C839 1121 514 1121 514 1153 V1165 V1345 C514 1377 763.8 1377 763.8 1409 V1421 V1471 C763.8 1503 651.8 1503 651.8 1535 V1547" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="pair-gap-separable:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="799" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="839" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="pair-gap-separable:unknown:check"><title>わからない</title><path d="M1044.5 933 V963 C1044.5 995 1091.5 995 1091.5 1027 V1039"/><path d="M1091.5 1077 V1089 C1091.5 1121 1088 1121 1088 1153 V1165" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="pair-gap-separable:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1062">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1008 1315 V1345 C1008 1377 853.8 1377 853.8 1409 V1421"/><path d="M853.8 1459 V1471 C853.8 1503 705.133 1503 705.133 1535 V1547" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="813.8" y="1421" width="80" height="38" rx="5"/><text text-anchor="middle" x="853.8" y="1444">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1088 1315 V1345 C1088 1377 1075 1377 1075 1409 V1421"/><path d="M1075 1459 V1471 C1075 1503 1085.917 1503 1085.917 1535 V1547" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="1421" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="1444">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1168 1315 V1345 C1168 1377 1203.5 1377 1203.5 1409 V1421"/><path d="M1203.5 1459 V1471 C1203.5 1503 1192.583 1503 1192.583 1535 V1547" marker-end="url(#arrow-heuristic-ordered-route)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="1421" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="1444">わからない</text></g></g><g class="flow-node question" data-node="operation"><rect x="750.9444444444443" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="766.9444444444443" y="52">質問</text><text class="node-title" x="766.9444444444443" y="80">合法な訪問列へどの変更を試します</text><text class="node-title" x="766.9444444444443" y="103">か？</text><text class="node-explanation" x="766.9444444444443" y="130">始点・終点と、他の訪問順を固定した局所操作です。</text></g><g class="flow-node question" data-node="symmetric-distance"><rect x="264.8333333333333" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="280.8333333333333" y="416">質問</text><text class="node-title" x="280.8333333333333" y="444">距離は対称で、固定始終点の間の内部</text><text class="node-title" x="280.8333333333333" y="467">区間だけを反転しますか？</text><text class="node-explanation" x="280.8333333333333" y="494">対称なら区間内部の辺の費用は変わらず、両端のつな</text><text class="node-explanation" x="280.8333333333333" y="512">ぎ替えだけで差分を求められます。</text></g><g class="flow-node question" data-node="reverse-precedence"><rect x="293.5" y="760" width="320" height="191" rx="7"/><text class="node-kind" x="309.5" y="780">質問</text><text class="node-title" x="309.5" y="808">各受取・配達を一度ずつ合法に訪れ、</text><text class="node-title" x="309.5" y="831">両方が反転区間内の注文を除けます</text><text class="node-title" x="309.5" y="854">か？</text><text class="node-explanation" x="309.5" y="881">各注文の二 ID は各一回、元の列は受取先行で</text><text class="node-explanation" x="309.5" y="899">す。追加の時刻・容量制約はありません。両方を反転</text><text class="node-explanation" x="309.5" y="917">すると順序が逆になり不正です。</text></g><g class="flow-node result" data-node="reverse-result"><rect x="88" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="1185">候補</text><text class="node-title" x="104" y="1213">反転する区間の先行違反を除き、両端</text><text class="node-title" x="104" y="1236">の辺だけで距離差を取る</text><a href="/flowchartcp/techniques/heuristic-precedence-two-opt/"><title>受取が配達より先の巡回路では、両地点を含まない区間だけ反転するの記事へ</title><text x="104" y="1275">受取が配達より先の巡回路では、両地点を含まない</text><text x="104" y="1293">区間だけ反転する</text></a></g><g class="flow-node question" data-node="pair-order-only"><rect x="916.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="932.5" y="416">質問</text><text class="node-title" x="932.5" y="444">挿入する二点は受取が先で、容量など</text><text class="node-title" x="932.5" y="467">の追加制約はありませんか？</text><text class="node-explanation" x="932.5" y="494">残りの合法な訪問順を保ち、まだない一注文を挿入し</text><text class="node-explanation" x="932.5" y="512">ます。選ぶ注文本数など全体条件は別に検査します。</text></g><g class="flow-node question" data-node="pair-gap-separable"><rect x="804.5" y="760" width="320" height="173" rx="7"/><text class="node-kind" x="820.5" y="780">質問</text><text class="node-title" x="820.5" y="808">異なる二つの隙間への挿入費用を分</text><text class="node-title" x="820.5" y="831">け、同じ隙間への挿入も別に比べられ</text><text class="node-title" x="820.5" y="854">ますか？</text><text class="node-explanation" x="820.5" y="881">受取の隙間 i が配達の隙間 j より前なら、配</text><text class="node-explanation" x="820.5" y="899">達候補を進めながら前の最小受取費用を保持します。</text></g><g class="flow-node result" data-node="insertion-result"><rect x="564" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="580" y="1185">候補</text><text class="node-title" x="580" y="1213">受取の挿入費用の接頭辞最小値を使</text><text class="node-title" x="580" y="1236">い、配達の隙間を進める</text><a href="/flowchartcp/techniques/heuristic-paired-insertion-prefix/"><title>受取と配達の挿入は、先に入れられる最小増分を走査中に持つの記事へ</title><text x="580" y="1275">受取と配達の挿入は、先に入れられる最小増分を走</text><text x="580" y="1293">査中に持つ</text></a></g><g class="flow-node question" data-node="check"><rect x="928" y="1165" width="320" height="150" rx="7"/><text class="node-kind" x="944" y="1185">質問</text><text class="node-title" x="944" y="1213">得点の式、合法性、固定する部分と変</text><text class="node-title" x="944" y="1236">更する部分を確認できますか？</text><text class="node-explanation" x="944" y="1263">差分評価が正しくても、その候補が合法であるとは限</text><text class="node-explanation" x="944" y="1281">りません。必要な制約を別に検査します。</text></g><g class="flow-node result" data-node="fallback"><rect x="491.79999999999995" y="1547" width="320" height="151" rx="7"/><text class="node-kind" x="507.79999999999995" y="1567">候補</text><text class="node-title" x="507.79999999999995" y="1595">評価と合法性を小さい変更で確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="507.79999999999995" y="1634">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="507.79999999999995" y="1658">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="979.25" y="1547" width="320" height="121" rx="7"/><text class="node-kind" x="995.25" y="1567">分野</text><text class="node-title" x="995.25" y="1595">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="995.25" y="1632">詳細の質問・図へ →</text></a></g></svg>