<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-graphs-directed-progress flow-desc-graphs-directed-progress" width="2260" height="1349" viewBox="0 0 2260 1349" data-flow-svg="graphs-directed-progress"><title id="flow-title-graphs-directed-progress">辺の向き・閉路・進む順番の解法フローチャート</title><desc id="flow-desc-graphs-directed-progress">閉路の有無、依存先を守る順番、前へ進む回数を確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-graphs-directed-progress" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge negative-cycle" data-edge="shortest:negative-cycle:negative-cycle-result"><title>負の費用の閉路があるか</title><path d="M1130.857 159 V171 C1130.857 203 192 203 192 235 V247"/><path d="M192 285 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="shortest:negative-cycle:negative-cycle-result" tabindex="0" role="group" aria-label="選択肢：負の費用の閉路があるか"><rect x="108.5" y="247" width="167" height="38" rx="5"/><text text-anchor="middle" x="192" y="270">負の費用の閉路があるか</text></g></g><g class="flow-edge longest" data-edge="shortest:longest:longest-check"><title>依存関係に沿う最長の経路</title><path d="M1170.857 159 V171 C1170.857 203 556 203 556 235 V247"/><path d="M556 285 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="shortest:longest:longest-check" tabindex="0" role="group" aria-label="選択肢：依存関係に沿う最長の経路"><rect x="466" y="247" width="180" height="38" rx="5"/><text text-anchor="middle" x="556" y="270">依存関係に沿う最長の経路</text></g></g><g class="flow-edge order" data-edge="shortest:order:order-check"><title>依存先を守る処理順</title><path d="M1210.857 159 V171 C1210.857 203 920 203 920 235 V247"/><path d="M920 285 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="shortest:order:order-check" tabindex="0" role="group" aria-label="選択肢：依存先を守る処理順"><rect x="849.5" y="247" width="141" height="38" rx="5"/><text text-anchor="middle" x="920" y="270">依存先を守る処理順</text></g></g><g class="flow-edge increasing-labels" data-edge="shortest:increasing-labels:labels-check"><title>大きい値の位置へ移動して、回数を最大にする</title><path d="M1330.857 159 V171 C1330.857 203 1972.5 203 1972.5 235 V247"/><path d="M1972.5 303 V315 C1972.5 347 2012 347 2012 379 V391" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="shortest:increasing-labels:labels-check" tabindex="0" role="group" aria-label="選択肢：大きい値の位置へ移動して、回数を最大にする"><rect x="1850" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1972.5" y="270">大きい値の位置へ移動して、回数を最</text><text text-anchor="middle" x="1972.5" y="288">大にする</text></g></g><g class="flow-edge single-successor-order" data-edge="shortest:single-successor-order:single-successor-order-route"><title>各人に一人の相手があり、その相手を先にすると罰則を払う順序</title><path d="M1250.857 159 V171 C1250.857 203 1284 203 1284 235 V247"/><path d="M1284 303 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="shortest:single-successor-order:single-successor-order-route" tabindex="0" role="group" aria-label="選択肢：各人に一人の相手があり、その相手を先にすると罰則を払う順序"><rect x="1161.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="270">各人に一人の相手があり、その相手を</text><text text-anchor="middle" x="1284" y="288">先にすると罰則を払う順序</text></g></g><g class="flow-edge forward-avoidance" data-edge="shortest:forward-avoidance:forward-avoidance-route"><title>番号が増える辺だけのグラフで、各頂点を一つずつ使わない最短距離</title><path d="M1290.857 159 V171 C1290.857 203 1648 203 1648 235 V247"/><path d="M1648 303 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="shortest:forward-avoidance:forward-avoidance-route" tabindex="0" role="group" aria-label="選択肢：番号が増える辺だけのグラフで、各頂点を一つずつ使わない最短距離"><rect x="1525.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="270">番号が増える辺だけのグラフで、各頂</text><text text-anchor="middle" x="1648" y="288">点を一つずつ使わない最短距離</text></g></g><g class="flow-edge unknown" data-edge="shortest:unknown:check"><title>わからない</title><path d="M1370.857 159 V171 C1370.857 203 2183.5 203 2183.5 235 V247"/><path d="M2183.5 285 V315 C2183.5 347 2222 347 2222 379 V391 V576 C2222 608 2064.5 608 2064.5 640 V652 V702 C2064.5 734 1800 734 1800 766 V778" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="shortest:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2139" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="2183.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1624 928 V964 C1624 996 1442 996 1442 1028 V1040"/><path d="M1442 1078 V1090 C1442 1122 1328 1122 1328 1154 V1166" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1402" y="1040" width="80" height="38" rx="5"/><text text-anchor="middle" x="1442" y="1063">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1704 928 V964 C1704 996 1948.25 996 1948.25 1028 V1040"/><path d="M1948.25 1078 V1090 C1948.25 1122 1894.917 1122 1894.917 1154 V1166" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1908.25" y="1040" width="80" height="38" rx="5"/><text text-anchor="middle" x="1948.25" y="1063">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1784 928 V964 C1784 996 2076.75 996 2076.75 1028 V1040"/><path d="M2076.75 1078 V1090 C2076.75 1122 2001.583 1122 2001.583 1154 V1166" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2032.25" y="1040" width="89" height="38" rx="5"/><text text-anchor="middle" x="2076.75" y="1063">わからない</text></g></g><g class="flow-edge yes" data-edge="longest-check:yes:longest-result"><title>はい</title><path d="M476 541 V576 C476 608 556 608 556 640 V652"/><path d="M556 690 V702 C556 734 556 734 556 766 V778" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="longest-check:yes:longest-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="675">はい</text></g></g><g class="flow-edge no" data-edge="longest-check:no:fallback"><title>いいえ</title><path d="M556 541 V576 C556 608 1018 608 1018 640 V652"/><path d="M1018 690 V702 C1018 734 1018 734 1018 766 V778 V964 C1018 996 1296 996 1296 1028 V1040 V1090 C1296 1122 1200 1122 1200 1154 V1166" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="longest-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="978" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1018" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="longest-check:unknown:check"><title>わからない</title><path d="M636 541 V576 C636 608 1704 608 1704 640 V652"/><path d="M1704 690 V702 C1704 734 1608 734 1608 766 V778" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="longest-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1659.5" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1704" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="order-check:yes:order-result"><title>はい</title><path d="M920 541 V576 C920 608 1284 608 1284 640 V652"/><path d="M1284 690 V702 C1284 734 1284 734 1284 766 V778" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="order-check:yes:order-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1244" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="675">はい</text></g></g><g class="flow-edge no" data-edge="order-check:no:fallback"><title>いいえ</title><path d="M840 541 V576 C840 608 1142 608 1142 640 V652"/><path d="M1142 690 V702 C1142 734 1074 734 1074 766 V778 V964 C1074 996 1352 996 1352 1028 V1040 V1090 C1352 1122 1264 1122 1264 1154 V1166" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="order-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1102" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1142" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="order-check:unknown:check"><title>わからない</title><path d="M1000 541 V576 C1000 608 1837 608 1837 640 V652"/><path d="M1837 690 V702 C1837 734 1672 734 1672 766 V778" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="order-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1792.5" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1837" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="labels-check:yes:labels-result"><title>はい</title><path d="M2092 564 V576 C2092 608 2154.5 608 2154.5 640 V652"/><path d="M2154.5 690 V702 C2154.5 734 2068 734 2068 766 V778" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="labels-check:yes:labels-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="2114.5" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="2154.5" y="675">はい</text></g></g><g class="flow-edge no" data-edge="labels-check:no:fallback"><title>いいえ</title><path d="M1932 564 V576 C1932 608 1494 608 1494 640 V652"/><path d="M1494 690 V702 C1494 734 1494 734 1494 766 V778 V964 C1494 996 1532 996 1532 1028 V1040 V1090 C1532 1122 1392 1122 1392 1154 V1166" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="labels-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1454" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1494" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="labels-check:unknown:check"><title>わからない</title><path d="M2012 564 V576 C2012 608 1970 608 1970 640 V652"/><path d="M1970 690 V702 C1970 734 1736 734 1736 766 V778" marker-end="url(#arrow-graphs-directed-progress)"/><g class="flow-edge-label" data-edge-label="labels-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1925.5" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1970" y="675">わからない</text></g></g><g class="flow-node question" data-node="shortest"><rect x="1090.857142857143" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1106.857142857143" y="52">質問</text><text class="node-title" x="1106.857142857143" y="80">頂点・辺について何を求めますか？</text><text class="node-explanation" x="1106.857142857143" y="107">最短距離だけでなく、負閉路、順序、連結性、木の集</text><text class="node-explanation" x="1106.857142857143" y="125">計を区別します。</text></g><g class="flow-node question" data-node="check"><rect x="1544" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="1560" y="798">質問</text><text class="node-title" x="1560" y="826">木・閉路のない一方通行のグラフ・そ</text><text class="node-title" x="1560" y="849">の他を、制約から区別できますか？</text><text class="node-explanation" x="1560" y="876">辺数だけで木や DAG を断定せず、連結性と閉路</text><text class="node-explanation" x="1560" y="894">も確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1788.25" y="1166" width="320" height="139" rx="7"/><text class="node-kind" x="1804.25" y="1186">分野</text><text class="node-title" x="1804.25" y="1214">条件を確かめる</text><text class="node-explanation" x="1804.25" y="1241">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1804.25" y="1269">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1136" y="1166" width="320" height="151" rx="7"/><text class="node-kind" x="1152" y="1186">候補</text><text class="node-title" x="1152" y="1214">頂点・辺の意味を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1152" y="1253">状態の設計</text></a><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="1152" y="1277">グラフへの帰着</text></a></g><g class="flow-node question" data-node="longest-check"><rect x="396" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="411">質問</text><text class="node-title" x="412" y="439">有向閉路がないと保証されています</text><text class="node-title" x="412" y="462">か？</text><text class="node-explanation" x="412" y="489">閉路がある一般グラフの最長単純路へ、同じ手法を適</text><text class="node-explanation" x="412" y="507">用しないようにします。</text></g><g class="flow-node question" data-node="order-check"><rect x="760" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="411">質問</text><text class="node-title" x="776" y="439">先に終える作業から、後の作業へ辺を</text><text class="node-title" x="776" y="462">張れますか？</text><text class="node-explanation" x="776" y="489">閉路がある場合は、処理順が存在しないことも答えに</text><text class="node-explanation" x="776" y="507">含めます。</text></g><g class="flow-node result" data-node="negative-cycle-result"><rect x="32" y="391" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="411">候補</text><text class="node-title" x="48" y="439">繰り返しの緩和で負閉路を調べる</text><a href="/flowchartcp/techniques/bellman-ford/"><title>ベルマン–フォード法の記事へ</title><text x="48" y="478">ベルマン–フォード法</text></a></g><g class="flow-node result" data-node="longest-result"><rect x="396" y="778" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="798">候補</text><text class="node-title" x="412" y="826">依存順で最長経路を更新する</text><a href="/flowchartcp/techniques/dag-dp/"><title>DAG上のDPの記事へ</title><text x="412" y="865">DAG上のDP</text></a></g><g class="flow-node result" data-node="order-result"><rect x="1124" y="778" width="320" height="127" rx="7"/><text class="node-kind" x="1140" y="798">候補</text><text class="node-title" x="1140" y="826">依存関係を満たす順序を求める</text><a href="/flowchartcp/techniques/topological-sort/"><title>トポロジカルソートの記事へ</title><text x="1140" y="865">トポロジカルソート</text></a></g><g class="flow-node question" data-node="labels-check"><rect x="1852" y="391" width="320" height="173" rx="7"/><text class="node-kind" x="1868" y="411">質問</text><text class="node-title" x="1868" y="439">同じ値の位置の答えをすべて計算して</text><text class="node-title" x="1868" y="462">から、その値の候補をまとめて反映で</text><text class="node-title" x="1868" y="485">きますか？</text><text class="node-explanation" x="1868" y="512">より大きい値へしか移動できないなら、同じ値同士を</text><text class="node-explanation" x="1868" y="530">遷移元にしないようにします。</text></g><g class="flow-node result" data-node="labels-result"><rect x="1908" y="778" width="320" height="174" rx="7"/><text class="node-kind" x="1924" y="798">候補</text><text class="node-title" x="1924" y="826">同じ値の位置を計算してから候補へ追</text><text class="node-title" x="1924" y="849">加する</text><a href="/flowchartcp/techniques/dp-batch-equal-keys/"><title>厳密な大小条件のDPは同じ値をまとめて更新するの記事へ</title><text x="1924" y="888">厳密な大小条件のDPは同じ値をまとめて更新する</text></a><a href="/flowchartcp/techniques/dag-dp/"><title>DAG上のDPの記事へ</title><text x="1924" y="912">DAG上のDP</text></a></g><g class="flow-node route" data-node="single-successor-order-route"><rect x="1124" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">各人に一人の相手があり、その相手を</text><text class="node-title" x="1140" y="462">先にすると罰則を払う順序</text><a href="/flowchartcp/flowcharts/#diagram-functional-order-conditions" data-route="functional-order-conditions"><text x="1140" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="forward-avoidance-route"><rect x="1488" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">番号が増える辺だけのグラフで、各頂</text><text class="node-title" x="1504" y="462">点を一つずつ使わない最短距離</text><a href="/flowchartcp/flowcharts/#diagram-forward-vertex-avoidance-conditions" data-route="forward-vertex-avoidance-conditions"><text x="1504" y="499">詳細の質問・図へ →</text></a></g></svg>