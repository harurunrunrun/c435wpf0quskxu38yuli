<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-bit-constraint-features flow-desc-bit-constraint-features" width="3660" height="931" viewBox="0 0 3660 931" data-flow-svg="bit-constraint-features"><title id="flow-title-bit-constraint-features">整数・列のビット条件の解法フローチャート</title><desc id="flow-desc-bit-constraint-features">演算だけでなく、整数の個数、上限、出力が構築・個数・最大値のどれかを分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-bit-constraint-features" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge range-and" data-edge="goal:range-and:range-and-route"><title>各区間の AND を指定し、その条件を満たす整数列を一つ作る</title><path d="M1699.091 182 V194 C1699.091 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-bit-constraint-features)"/><g class="flow-edge-label" data-edge-label="goal:range-and:range-and-route" tabindex="0" role="group" aria-label="選択肢：各区間の AND を指定し、その条件を満たす整数列を一つ作る"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">各区間の AND を指定し、その条</text><text text-anchor="middle" x="192" y="311">件を満たす整数列を一つ作る</text></g></g><g class="flow-edge or-count" data-edge="goal:or-count:or-count-route"><title>少数の整数について、三つ選んだ OR の等式を満たす列の個数</title><path d="M1728.182 182 V194 C1728.182 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-bit-constraint-features)"/><g class="flow-edge-label" data-edge-label="goal:or-count:or-count-route" tabindex="0" role="group" aria-label="選択肢：少数の整数について、三つ選んだ OR の等式を満たす列の個数"><rect x="440" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">少数の整数について、三つ選んだ </text><text text-anchor="middle" x="556" y="311">OR の等式を満たす列の個数</text></g></g><g class="flow-edge sum-xor-bound" data-edge="goal:sum-xor-bound:sum-xor-bound-route"><title>和と XOR が等しい二数の組を、和の上限付きで数える</title><path d="M1757.273 182 V194 C1757.273 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-bit-constraint-features)"/><g class="flow-edge-label" data-edge-label="goal:sum-xor-bound:sum-xor-bound-route" tabindex="0" role="group" aria-label="選択肢：和と XOR が等しい二数の組を、和の上限付きで数える"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">和と XOR が等しい二数の組を、</text><text text-anchor="middle" x="920" y="311">和の上限付きで数える</text></g></g><g class="flow-edge popcounts" data-edge="goal:popcounts:popcounts-route"><title>XOR と二数それぞれの 1 ビット数を指定し、二数を作る</title><path d="M1786.364 182 V194 C1786.364 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-bit-constraint-features)"/><g class="flow-edge-label" data-edge-label="goal:popcounts:popcounts-route" tabindex="0" role="group" aria-label="選択肢：XOR と二数それぞれの 1 ビット数を指定し、二数を作る"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">XOR と二数それぞれの 1 ビッ</text><text text-anchor="middle" x="1284" y="311">ト数を指定し、二数を作る</text></g></g><g class="flow-edge bounded-xor" data-edge="goal:bounded-xor:bounded-xor-route"><title>共通の X に上限を付け、各値との XOR の合計を最大化する</title><path d="M1815.455 182 V194 C1815.455 226 1648 226 1648 258 V270"/><path d="M1648 326 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-bit-constraint-features)"/><g class="flow-edge-label" data-edge-label="goal:bounded-xor:bounded-xor-route" tabindex="0" role="group" aria-label="選択肢：共通の X に上限を付け、各値との XOR の合計を最大化する"><rect x="1525.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="293">共通の X に上限を付け、各値との</text><text text-anchor="middle" x="1648" y="311"> XOR の合計を最大化する</text></g></g><g class="flow-edge and-sum" data-edge="goal:and-sum:and-sum-route"><title>二数の AND と通常の和を同時に指定し、存在を判定する</title><path d="M1844.545 182 V194 C1844.545 226 2012 226 2012 258 V270"/><path d="M2012 326 V338 C2012 370 2012 370 2012 402 V414" marker-end="url(#arrow-bit-constraint-features)"/><g class="flow-edge-label" data-edge-label="goal:and-sum:and-sum-route" tabindex="0" role="group" aria-label="選択肢：二数の AND と通常の和を同時に指定し、存在を判定する"><rect x="1889.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="293">二数の AND と通常の和を同時に</text><text text-anchor="middle" x="2012" y="311">指定し、存在を判定する</text></g></g><g class="flow-edge buy-generators" data-edge="goal:buy-generators:buy-generators-route"><title>値を購入し、買った値の部分集合 XOR で全ての値を作る費用</title><path d="M1873.636 182 V194 C1873.636 226 2376 226 2376 258 V270"/><path d="M2376 326 V338 C2376 370 2376 370 2376 402 V414" marker-end="url(#arrow-bit-constraint-features)"/><g class="flow-edge-label" data-edge-label="goal:buy-generators:buy-generators-route" tabindex="0" role="group" aria-label="選択肢：値を購入し、買った値の部分集合 XOR で全ての値を作る費用"><rect x="2260" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="2376" y="293">値を購入し、買った値の部分集合 </text><text text-anchor="middle" x="2376" y="311">XOR で全ての値を作る費用</text></g></g><g class="flow-edge sum-xor-window" data-edge="goal:sum-xor-window:sum-xor-window-route"><title>通常の和と XOR が等しい、連続区間の個数</title><path d="M1902.727 182 V194 C1902.727 226 2740 226 2740 258 V270"/><path d="M2740 326 V338 C2740 370 2740 370 2740 402 V414" marker-end="url(#arrow-bit-constraint-features)"/><g class="flow-edge-label" data-edge-label="goal:sum-xor-window:sum-xor-window-route" tabindex="0" role="group" aria-label="選択肢：通常の和と XOR が等しい、連続区間の個数"><rect x="2617.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="2740" y="293">通常の和と XOR が等しい、連続</text><text text-anchor="middle" x="2740" y="311">区間の個数</text></g></g><g class="flow-edge xor-minimax" data-edge="goal:xor-minimax:xor-minimax-route"><title>全要素へ同じXORをかけ、変換後の最大値を最小にする</title><path d="M1931.818 182 V194 C1931.818 226 3104 226 3104 258 V270"/><path d="M3104 326 V338 C3104 