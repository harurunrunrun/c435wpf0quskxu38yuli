ound" data-route="carryfree-sum-xor-bound"><text x="776" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="popcounts-route"><rect x="1124" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">XOR と二数それぞれの 1 ビッ</text><text class="node-title" x="1140" y="485">ト数を指定し、二数を作る</text><a href="/flowchartcp/flowcharts/#diagram-xor-popcount-construction" data-route="xor-popcount-construction"><text x="1140" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="bounded-xor-route"><rect x="1488" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="434">分野</text><text class="node-title" x="1504" y="462">共通の X に上限を付け、各値との</text><text class="node-title" x="1504" y="485"> XOR の合計を最大化する</text><a href="/flowchartcp/flowcharts/#diagram-bounded-xor-sum-maximum" data-route="bounded-xor-sum-maximum"><text x="1504" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="and-sum-route"><rect x="1852" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="434">分野</text><text class="node-title" x="1868" y="462">二数の AND と通常の和を同時に</text><text class="node-title" x="1868" y="485">指定し、存在を判定する</text><a href="/flowchartcp/flowcharts/#diagram-and-sum-disjoint-remainder" data-route="and-sum-disjoint-remainder"><text x="1868" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="buy-generators-route"><rect x="2216" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="2232" y="434">分野</text><text class="node-title" x="2232" y="462">値を購入し、買った値の部分集合 </text><text class="node-title" x="2232" y="485">XOR で全ての値を作る費用</text><a href="/flowchartcp/flowcharts/#diagram-minimum-cost-xor-generators" data-route="minimum-cost-xor-generators"><text x="2232" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="sum-xor-window-route"><rect x="2580" y="414" width="320" height="144" rx="7"/><text cla