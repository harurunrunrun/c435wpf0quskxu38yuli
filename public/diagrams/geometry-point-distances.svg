<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-geometry-point-distances flow-desc-geometry-point-distances" width="1840" height="920" viewBox="0 0 1840 920" data-flow-svg="geometry-point-distances"><title id="flow-title-geometry-point-distances">点どうしの距離・向き・角度の解法フローチャート</title><desc id="flow-desc-geometry-point-distances">遠い二点、近い二点、距離の種類、向きや角度の条件を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-geometry-point-distances" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge far" data-edge="geometry-task:far:far-route"><title>直線距離（ユークリッド距離）が最大の二点</title><path d="M813.333 141 V153 C813.333 185 192 185 192 217 V229"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-geometry-point-distances)"/><g class="flow-edge-label" data-edge-label="geometry-task:far:far-route" tabindex="0" role="group" aria-label="選択肢：直線距離（ユークリッド距離）が最大の二点"><rect x="69.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="252">直線距離（ユークリッド距離）が最大</text><text text-anchor="middle" x="192" y="270">の二点</text></g></g><g class="flow-edge manhattan" data-edge="geometry-task:manhattan:l1-route"><title>|dx|+|dy| の距離の最大値・連結費用</title><path d="M866.667 141 V153 C866.667 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-geometry-point-distances)"/><g class="flow-edge-label" data-edge-label="geometry-task:manhattan:l1-route" tabindex="0" role="group" aria-label="選択肢：|dx|+|dy| の距離の最大値・連結費用"><rect x="440" y="229" width="232" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">|dx|+|dy| の距離の最大</text><text text-anchor="middle" x="556" y="270">値・連結費用</text></g></g><g class="flow-edge closest" data-edge="geometry-task:closest:closest-route"><title>直線距離（ユークリッド距離）が最小の二点</title><path d="M920 141 V153 C920 185 920 185 920 217 V229"/><path d="M920 285 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-geometry-point-distances)"/><g class="flow-edge-label" data-edge-label="geometry-task:closest:closest-route" tabindex="0" role="group" aria-label="選択肢：直線距離（ユークリッド距離）が最小の二点"><rect x="797.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="252">直線距離（ユークリッド距離）が最小</text><text text-anchor="middle" x="920" y="270">の二点</text></g></g><g class="flow-edge directions" data-edge="geometry-task:directions:directions-route"><title>同一直線・直交・三角形の角度の個数</title><path d="M973.333 141 V153 C973.333 185 1284 185 1284 217 V229"/><path d="M1284 267 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-geometry-point-distances)"/><g class="flow-edge-label" data-edge-label="geometry-task:directions:directions-route" tabindex="0" role="group" aria-label="選択肢：同一直線・直交・三角形の角度の個数"><rect x="1161.5" y="229" width="245" height="38" rx="5"/><text text-anchor="middle" x="1284" y="252">同一直線・直交・三角形の角度の個数</text></g></g><g class="flow-edge unknown" data-edge="geometry-task:unknown:check"><title>わからない</title><path d="M1026.667 141 V153 C1026.667 185 1648 185 1648 217 V229"/><path d="M1648 267 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-geometry-point-distances)"/><g class="flow-edge-label" data-edge-label="geometry-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1603.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1648" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1568 523 V535 C1568 567 1284 567 1284 599 V611"/><path d="M1284 649 V661 C1284 693 1284 693 1284 725 V737" marker-end="url(#arrow-geometry-point-distances)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1244" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="634">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1648 523 V535 C1648 567 1635 567 1635 599 V611"/><path d="M1635 649 V661 C1635 693 1594.667 693 1594.667 725 V737" marker-end="url(#arrow-geometry-point-distances)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1595" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="1635" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1728 523 V535 C1728 567 1763.5 567 1763.5 599 V611"/><path d="M1763.5 649 V661 C1763.5 693 1701.333 693 1701.333 725 V737" marker-end="url(#arrow-geometry-point-distances)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1719" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="1763.5" y="634">わからない</text></g></g><g class="flow-node question" data-node="geometry-task"><rect x="760" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="776" y="52">質問</text><text class="node-title" x="776" y="80">点や座標から何を求めますか？</text><text class="node-explanation" x="776" y="107">長方形の集計と、外周や距離の問題を分けます。</text></g><g class="flow-node question" data-node="check"><rect x="1488" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="1504" y="393">質問</text><text class="node-title" x="1504" y="421">小さい座標で、共線・同一点・境界上</text><text class="node-title" x="1504" y="444">の場合を列挙できますか？</text><text class="node-explanation" x="1504" y="471">一般位置を仮定する前に、入力の制約で保証されてい</text><text class="node-explanation" x="1504" y="489">るかを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1488" y="737" width="320" height="139" rx="7"/><text class="node-kind" x="1504" y="757">分野</text><text class="node-title" x="1504" y="785">条件を確かめる</text><text class="node-explanation" x="1504" y="812">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1504" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1124" y="737" width="320" height="151" rx="7"/><text class="node-kind" x="1140" y="757">候補</text><text class="node-title" x="1140" y="785">境界ケースから条件を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="1140" y="824">反例探し</text></a><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="1140" y="848">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="closest-route"><rect x="760" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">最も近い二点の距離</text><a href="/flowchartcp/flowcharts/#diagram-geometry-closest" data-route="geometry-closest"><text x="776" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="far-route"><rect x="32" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">最も遠い二点の距離</text><a href="/flowchartcp/flowcharts/#diagram-geometry-farthest" data-route="geometry-farthest"><text x="48" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="l1-route"><rect x="396" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">絶対値の和の距離と連結</text><a href="/flowchartcp/flowcharts/#diagram-geometry-l1" data-route="geometry-l1"><text x="412" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="directions-route"><rect x="1124" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">直線・直交・角分類</text><a href="/flowchartcp/flowcharts/#diagram-geometry-directions" data-route="geometry-directions"><text x="1140" y="458">詳細の質問・図へ →</text></a></g></svg>