<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-shortest-shared-connection-goals flow-desc-shortest-shared-connection-goals" width="1532" height="1316" viewBox="0 0 1532 1316" data-flow-svg="shortest-shared-connection-goals"><title id="flow-title-shortest-shared-connection-goals">多数の移動に共通する構造の解法フローチャート</title><desc id="flow-desc-shortest-shared-connection-goals">費用が規則式で決まる移動、区間への移動、集合を通じた移動を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-shortest-shared-connection-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge dense-rule" data-edge="movement:dense-rule:dense-check"><title>全組の移動費用が規則式で決まり、辺が多い</title><path d="M766.933 159 V171 C766.933 203 192 203 192 235 V247"/><path d="M192 303 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="movement:dense-rule:dense-check" tabindex="0" role="group" aria-label="選択肢：全組の移動費用が規則式で決まり、辺が多い"><rect x="69.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="270">全組の移動費用が規則式で決まり、辺</text><text text-anchor="middle" x="192" y="288">が多い</text></g></g><g class="flow-edge range-edges" data-edge="movement:range-edges:range-edge-cost"><title>頂点と、添字の区間内の全頂点を結ぶ移動</title><path d="M820.267 159 V171 C820.267 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="movement:range-edges:range-edge-cost" tabindex="0" role="group" aria-label="選択肢：頂点と、添字の区間内の全頂点を結ぶ移動"><rect x="433.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">頂点と、添字の区間内の全頂点を結ぶ</text><text text-anchor="middle" x="556" y="288">移動</text></g></g><g class="flow-edge shared-set" data-edge="movement:shared-set:supernode-cost"><title>集合やグループの共通要素を通じた移動回数</title><path d="M873.6 159 V171 C873.6 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="movement:shared-set:supernode-cost" tabindex="0" role="group" aria-label="選択肢：集合やグループの共通要素を通じた移動回数"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">集合やグループの共通要素を通じた移</text><text text-anchor="middle" x="920" y="288">動回数</text></g></g><g class="flow-edge skywalks" data-edge="movement:skywalks:skywalks-route"><title>地面から伸びるビルと空中通路を伝う最短距離</title><path d="M926.933 159 V171 C926.933 203 1244.5 203 1244.5 235 V247"/><path d="M1244.5 303 V315 C1244.5 347 1284 347 1284 379 V391" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="movement:skywalks:skywalks-route" tabindex="0" role="group" aria-label="選択肢：地面から伸びるビルと空中通路を伝う最短距離"><rect x="1122" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1244.5" y="270">地面から伸びるビルと空中通路を伝う</text><text text-anchor="middle" x="1244.5" y="288">最短距離</text></g></g><g class="flow-edge unknown" data-edge="movement:unknown:check"><title>わからない</title><path d="M980.267 159 V171 C980.267 203 1455.5 203 1455.5 235 V247"/><path d="M1455.5 285 V315 C1455.5 347 1494 347 1494 379 V391 V560 C1494 592 1473 592 1473 624 V636 V686 C1473 718 1434.5 718 1434.5 750 V762 V925 C1434.5 957 1434.5 957 1434.5 989 V1001 V1051 C1434.5 1083 1364 1083 1364 1115 V1127" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="movement:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1411" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1455.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="dense-check:yes:dense-result"><title>はい</title><path d="M112 523 V560 C112 592 192 592 192 624 V636"/><path d="M192 674 V686 C192 718 192 718 192 750 V762" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="dense-check:yes:dense-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="659">はい</text></g></g><g class="flow-edge no" data-edge="dense-check:no:reduction"><title>いいえ</title><path d="M192 523 V560 C192 592 920 592 920 624 V636"/><path d="M920 674 V686 C920 718 920 718 920 750 V762" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="dense-check:no:reduction" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="880" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="659">いいえ</text></g></g><g class="flow-edge unknown" data-edge="dense-check:unknown:check"><title>わからない</title><path d="M272 523 V560 C272 592 1378.5 592 1378.5 624 V636"/><path d="M1378.5 674 V686 C1378.5 718 1378.5 718 1378.5 750 V762 V925 C1378.5 957 1378.5 957 1378.5 989 V1001 V1051 C1378.5 1083 1284 1083 1284 1115 V1127" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="dense-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1334" y="636" width="89" height="38" rx="5"/><text text-anchor="middle" x="1378.5" y="659">わからない</text></g></g><g class="flow-edge yes" data-edge="reduction:yes:reduction-result"><title>はい</title><path d="M840 912 V925 C840 957 556 957 556 989 V1001"/><path d="M556 1039 V1051 C556 1083 556 1083 556 1115 V1127" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="reduction:yes:reduction-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="1001" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1024">はい</text></g></g><g class="flow-edge no" data-edge="reduction:no:fallback"><title>いいえ</title><path d="M920 912 V925 C920 957 920 957 920 989 V1001"/><path d="M920 1039 V1051 C920 1083 920 1083 920 1115 V1127" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="reduction:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="880" y="1001" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1024">いいえ</text></g></g><g class="flow-edge unknown" data-edge="reduction:unknown:check"><title>わからない</title><path d="M1000 912 V925 C1000 957 1284 957 1284 989 V1001"/><path d="M1284 1039 V1051 C1284 1083 1204 1083 1204 1115 V1127" marker-end="url(#arrow-shortest-shared-connection-goals)"/><g class="flow-edge-label" data-edge-label="reduction:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="1001" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="1024">わからない</text></g></g><g class="flow-node question" data-node="movement"><rect x="713.6" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="729.6" y="52">質問</text><text class="node-title" x="729.6" y="80">移動の特徴はどれですか？</text><text class="node-explanation" x="729.6" y="107">元の頂点だけでは足りない情報と、移動費用を選びま</text><text class="node-explanation" x="729.6" y="125">す。</text></g><g class="flow-node question" data-node="dense-check"><rect x="32" y="391" width="320" height="132" rx="7"/><text class="node-kind" x="48" y="411">質問</text><text class="node-title" x="48" y="439">同じ費用の移動を、補助の位置や頂点</text><text class="node-title" x="48" y="462">を経由してまとめられますか？</text><text class="node-explanation" x="48" y="489">元の二頂点間の最小費用を変えない対応が必要です。</text></g><g class="flow-node result" data-node="dense-result"><rect x="32" y="762" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="782">候補</text><text class="node-title" x="48" y="810">共通する移動を補助頂点へまとめる</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="48" y="849">グラフへの帰着</text></a><a href="/flowchartcp/techniques/coordinate-compression/"><title>座標圧縮の記事へ</title><text x="48" y="873">座標圧縮</text></a></g><g class="flow-node question" data-node="reduction"><rect x="760" y="762" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="782">質問</text><text class="node-title" x="776" y="810">特殊な構造で負の辺をなくすか、状態</text><text class="node-title" x="776" y="833">数を減らせますか？</text><text class="node-explanation" x="776" y="860">重みの付け替えは経路比較を保つ必要があります。根</text><text class="node-explanation" x="776" y="878">拠のない貪欲処理は避けます。</text></g><g class="flow-node result" data-node="reduction-result"><rect x="396" y="1127" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1147">候補</text><text class="node-title" x="412" y="1175">経路のモデルを変える</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="412" y="1214">グラフへの帰着</text></a></g><g class="flow-node result" data-node="fallback"><rect x="760" y="1127" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="1147">候補</text><text class="node-title" x="776" y="1175">重みと必要な距離を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="776" y="1214">状態の設計</text></a></g><g class="flow-node route" data-node="check"><rect x="1124" y="1127" width="320" height="157" rx="7"/><text class="node-kind" x="1140" y="1147">分野</text><text class="node-title" x="1140" y="1175">移動費用の符号を確かめる</text><text class="node-explanation" x="1140" y="1202">負の費用が許されるかを問題文の範囲から確かめ、適</text><text class="node-explanation" x="1140" y="1220">用できる探索を判断します。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-edge-cost-sign-check" data-route="shortest-edge-cost-sign-check"><text x="1140" y="1248">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="range-edge-cost"><rect x="396" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">点と区間を結ぶ移動の費用と向き</text><text class="node-explanation" x="412" y="466">区間内への共通費用と、点から区間へ向かうか区間か</text><text class="node-explanation" x="412" y="484">ら点へ向かうかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-interval-connection-details" data-route="shortest-interval-connection-details"><text x="412" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="supernode-cost"><rect x="760" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">共通の集合を通じた移動回数</text><text class="node-explanation" x="776" y="466">要素と集合の二段階の移動で、元の合法な移動と回数</text><text class="node-explanation" x="776" y="484">を再現できるかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-shared-set-details" data-route="shortest-shared-set-details"><text x="776" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="skywalks-route"><rect x="1124" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">地面から伸びるビルと空中通路を伝う</text><text class="node-title" x="1140" y="462">最短距離</text><a href="/flowchartcp/flowcharts/#diagram-skywalk-shortest-path-conditions" data-route="skywalk-shortest-path-conditions"><text x="1140" y="499">詳細の質問・図へ →</text></a></g></svg>