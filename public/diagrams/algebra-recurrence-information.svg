ion:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1663" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1707.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="recurrence-product:yes:recurrence-coefficient-result"><title>はい</title><path d="M1388.5 951 V963 C1388.5 995 1343 995 1343 1027 V1039"/><path d="M1343 1077 V1089 C1343 1121 920 1121 920 1153 V1165" marker-end="url(#arrow-algebra-recurrence-information)"/><g class="flow-edge-label" data-edge-label="recurrence-product:yes:recurrence-coefficient-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1303" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="1343" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="recurrence-product:no:fallback"><title>いいえ</title><path d="M1468.5 951 V963 C1468.5 995 1467 995 1467 1027 V1039"/><path d="M1467 1077 V1089 C1467 1121 1284 1121 1284 1153 V1165" marker-end="url(#arrow-algebra-recurrence-information)"/><g class="flow-edge-label" data-edge-label="recurrence-product:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1427" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="1467" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="recurrence-product:unknown:check"><title>わからない</title><path d="M1548.5 951 V963 C1548.5 995 1595.5 995 1595.5 1027 V1039"/><path d="M1595.5 1077 V1089 C1595.5 1121 1648 1121 1648 1153 V1165" marker-end="url(#arrow-algebra-recurrence-information)"/><g class="flow-edge-label" data-edge-label="recurrence-product:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1551" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="1595.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="recurrence"><rect x="1192" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1208" y="52">質問</text><text class="node-title" x="1208" y="80">漸化式について、どの情報と目的があ</text><text class="node-title" x="1208" y="103">りますか？</text><text class="node-explanation" x="1208" y="130">係数と初期項が分かっている場合と、小さい例からの</text><text class="node-explanation" x="1208" y="148">推測を区別します。</text></g><g class="flow-node result" data-node="linear"><rect x="704" y="414" width="320" height="127" rx="7"/><text class="node-kind" x="720" y="434">候補</text><text class="node-title" x="720" y="462">線形漸化式の高速計算</text><a href="/flowchartcp/techniques/linear-recurrence/"><title>線形漸化式の高速計算の記事へ</title><text x="720" y="501">線形漸化式の高速計算</text></a></g><g class="flow-node question" data-node="unknown-coeff"><rect x="1068" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1084" y="434">質問</text><text class="node-title" x="1084" y="462">小さい例から推測した漸化式しか分</text><text class="node-title" x="1084" y="485">かっていませんか？</text><text class="node-explanation" x="1084" y="512">有限個の一致だけで、その先も同じ漸化式が成り立つ</text><text class="node-explanation" x="1084" y="530">とは限りません。</text></g><g class="flow-node question" data-node="sample-recurrence"><rect x="456.83333333333337" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="472.83333333333337" y="798">質問</text><text class="node-title" x="472.83333333333337" y="826">与えられた有限列に一致する、最短の</text><text class="node-title" x="472.83333333333337" y="849">線形漸化式を求めますか？</text><text class="node-explanation" x="472.83333333333337" y="876">無限の未来の式の証明とは異なり、有限列を満たす式</text><text class="node-explanation" x="472.83333333333337" y="894">の探索が目的です。</text></g><g class="flow-node result" data-node="sample-result"><rect x="32" y="1165" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="1185">候補</text><text class="node-title" x="48" y="1213">有限列を満たす線形漸化式を求める</text><a href="/flowchartcp/techniques/linear-recurrence/"><title>線形漸化式の高速計算の記事へ</title><text x="48" y="1252">線形漸化式の高速計算</text></a></g><g class="flow-node result" data-node="proof"><rect x="396" y="1165" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1185">候補</text><text class="node-title" x="412" y="1213">漸化式の根拠を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1252">反例探し</text></a><a href="/flowchartcp/techniques/invariant/"><title>不変量の記事へ</title><text x="412" y="1276">不変量</text></a></g><g class="flow-node route" data-node="check"><rect x="1488" y="1165" width="320" height="157" rx="7"/><text class="node-kind" x="1504" y="1185">分野</text><text class="node-title" x="1504" y="1213">係数の逆数と指定の法</text><text class="node-explanation" x="1504" y="1240">係数の逆数が必要か、指定の法で逆数が存在するかを</text><text class="node-explanation" x="1504" y="1258">確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-invertibility" data-route="algebra-invertibility"><text x="1504" y="1286">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1124" y="1165" width="320" height="127" rx="7"/><text class="node-kind" x="1140" y="1185">候補</text><text class="node-title" x="1140" y="1213">演算と係数の範囲を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1140" y="1252">状態の設計</text></a></g><g class="flow-node question" data-node="recurrence-fraction"><rect x="1432" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1448" y="434">質問</text><text class="node-title" x="1448" y="462">固定係数の漸化式を、P(x)/Q</text><text class="node-title" x="1448" y="485">(x) の係数に写せますか？</text><text class="node-explanation" x="1448" y="512">Q の定数項は 1。初期項から P を作り、欲し</text><text class="node-explanation" x="1448" y="530">い項の偶奇に応じて不要な係数を除きます。</text></g><g class="flow-node question" data-node="recurrence-product"><rect x="1308.5" y="778" width="320" height="173" rx="7"/><text class="node-kind" x="1324.5" y="798">質問</text><text class="node-title" x="1324.5" y="826">Q(x) と Q(−x) などの積</text><text class="node-title" x="1324.5" y="849">を、必要な長さで高速に計算できます</text><text class="node-title" x="1324.5" y="872">か？</text><text class="node-explanation" x="1324.5" y="899">次数と法の変換長を確認します。k が巨大でも、次</text><text class="node-explanation" x="1324.5" y="917">数に比例した係数列を保ちます。</text></g><g class="flow-node result" data-node="recurrence-coefficient-result"><rect x="760" y="1165" width="320" height="192" rx="7"/><text class="node-kind" x="776" y="1185">候補</text><text class="node-title" x="776" y="1213">分母の符号を反転して掛け、項番号を</text><text class="node-title" x="776" y="1236">半分へ減らす</text><a href="/flowchartcp/techniques/linear-recurrence-bostan-mori/"><title>遠い項だけを求める漸化式で、偶数番目と奇数番目を分けるの記事へ</title><text x="776" y="1275">遠い項だけを求める漸化式で、偶数番目と奇数番目</text><text x="776" y="1293">を分ける</text></a><a href="/flowchartcp/techniques/linear-recurrence/"><title>線形漸化式の高速計算の記事へ</title><text x="776" y="1317">線形漸化式の高速計算</text></a></g></svg>