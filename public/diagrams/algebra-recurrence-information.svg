<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-algebra-recurrence-information flow-desc-algebra-recurrence-information" width="1840" height="1389" viewBox="0 0 1840 1389" data-flow-svg="algebra-recurrence-information"><title id="flow-title-algebra-recurrence-information">漸化式の係数・初期項と求める項の解法フローチャート</title><desc id="flow-desc-algebra-recurrence-information">係数と初期項がある場合と、有限列に合う式を推測する場合を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-algebra-recurrence-information" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="recurrence:yes:linear"><title>その他の、固定係数と初期項がある漸化式</title><path d="M1256 182 V194 C1256 226 864 226 864 258 V270"/><path d="M864 326 V338 C864 370 864 370 864 402 V414" marker-end="url(#arrow-algebra-recurrence-information)"/><g class="flow-edge-label" data-edge-label="recurrence:yes:linear" tabindex="0" role="group" aria-label="選択肢：その他の、固定係数と初期項がある漸化式"><rect x="741.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="864" y="293">その他の、固定係数と初期項がある漸</text><text text-anchor="middle" x="864" y="311">化式</text></g></g><g class="flow-edge no" data-edge="recurrence:no:unknown-coeff"><title>係数がまだ分からず、小さい例を調べる</title><path d="M1320 182 V194 C1320 226 1228 226 1228 258 V270"/><path d="M1228 326 V338 C1228 370 1228 370 1228 402 V414" marker-end="url(#arrow-algebra-recurrence-information)"/><g class="flow-edge-label" data-edge-label="recurrence:no:unknown-coeff" tabindex="0" role="group" aria-label="選択肢：係数がまだ分からず、小さい例を調べる"><rect x="1105.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1228" y="293">係数がまだ分からず、小さい例を調べ</text><text text-anchor="middle" x="1228" y="311">る</text></g></g><g class="flow-edge far-term" data-edge="recurrence:far-term:recurrence-fraction"><title>初期項と係数があり、一つの遠い項だけが必要</title><path d="M1384 182 V194 C1384 226 1552.5 226 1552.5 258 V270"/><path d="M1552.5 326 V338 C1552.5 370 1592 370 1592 402 V414" marker-end="url(#arrow-algebra-recurrence-information)"/><g class="flow-edge-label" data-edge-label="recurrence:far-term:recurrence-fraction" tabindex="0" role="group" aria-label="選択肢：初期項と係数があり、一つの遠い項だけが必要"><rect x="1430" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1552.5" y="293">初期項と係数があり、一つの遠い項だ</text><text text-anchor="middle" x="1552.5" y="311">けが必要</text></g></g><g class="flow-edge unknown" data-edge="recurrence:unknown:check"><title>わからない</title><path d="M1448 182 V194 C1448 226 1763.5 226 1763.5 258 V270"/><path d="M1763.5 308 V338 C1763.5 370 1802 370 1802 402 V414 V576 C1802 608 1802 608 1802 640 V652 V702 C1802 734 1802 734 1802 766 V778 V963 C1802 995 1802 995 1802 1027 V1039 V1089 C1802 1121 1754.667 1121 1754.667 1153 V1165" marker-end="url(#arrow-algebra-recurrence-information)"/><g class="flow-edge-label" data-edge-label="recurrence:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1719" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1763.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="unknown-coeff:yes:sample-recurrence"><title>はい</title><path d="M1148 564 V576 C1148 608 616.833 608 616.833 640 V652"/><path d="M616.833 690 V702 C616.833 734 616.833 734 616.833 766 V778" marker-end="url(#arrow-algebra-recurrence-information)"/><g class="flow-edge-label" data-edge-label="unknown-coeff:yes:sample-recurrence" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="576.8333333333334" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="616.8333333333334" y="675">はい</text></g></g><g class="flow-edge no" data-edge="unknown-coeff:no:fallback"><title>いいえ</title><path d="M1228 564 V576 C1228 608 1197 608 1197 640 V652"/><path d="M1197 690 V702 C1197 734 1197 734 1197 766 V778 V963 C1197 995 1197 995 1197 1027 V1039 V1089 C1197 1121 1204 1121 1204