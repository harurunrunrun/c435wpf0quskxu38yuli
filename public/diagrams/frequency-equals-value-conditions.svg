="38" rx="5"/><text text-anchor="middle" x="559.5" y="685">わからない</text></g></g><g class="flow-edge yes" data-edge="all-queries:yes:answer"><title>はい</title><path d="M239.5 938 V950 C239.5 982 192 982 192 1014 V1026"/><path d="M192 1064 V1076 C192 1108 192 1108 192 1140 V1152" marker-end="url(#arrow-frequency-equals-value-conditions)"/><g class="flow-edge-label" data-edge-label="all-queries:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1026" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1049">はい</text></g></g><g class="flow-edge no" data-edge="all-queries:no:check"><title>いいえ</title><path d="M319.5 938 V950 C319.5 982 319 982 319 1014 V1026"/><path d="M319 1064 V1076 C319 1108 441.714 1108 441.714 1140 V1152" marker-end="url(#arrow-frequency-equals-value-conditions)"/><g class="flow-edge-label" data-edge-label="all-queries:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1026" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1049">いいえ</text></g></g><g class="flow-edge unknown" data-edge="all-queries:unknown:check"><title>わからない</title><path d="M399.5 938 V950 C399.5 982 447.5 982 447.5 1014 V1026"/><path d="M447.5 1064 V1076 C447.5 1108 487.429 1108 487.429 1140 V1152" marker-end="url(#arrow-frequency-equals-value-conditions)"/><g class="flow-edge-label" data-edge-label="all-queries:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1026" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1049">わからない</text></g></g><g class="flow-node question" data-node="fixed"><rect x="384.5" y="32" width="320" height="155" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">更新のない配列の区間ごとに、値xが</text><text class="node-title" x="400.5" y="103">ちょうどx回現れる種類数を求めます</text><text class="node-title" x="400.5" y="126">か？</text><text class="node-explanation" x="400.5" y="153">出現回数の和や、全ての値の種類数とは異なります。</text></g><g class="flow-node question" data-node="positive"><rect x="272.5" y="401" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="421">質問</text><text class="node-title" x="288.5" y="449">値は正整数で、配列長Nより大きい値</text><text class="node-title" x="288.5" y="472">は条件を満たさないと分けられます</text><text class="node-title" x="288.5" y="495">か？</text><text class="node-explanation" x="288.5" y="522">値域全体ではなく1..Nの出現位置を持ちます。値</text><text class="node-explanation" x="288.5" y="540">を圧縮しても、必要な出現回数は元の値のままです。</text></g><g class="flow-node question" data-node="all-queries"><rect x="159.5" y="788" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="808">質問</text><text class="node-title" x="175.5" y="836">全ての質問を先に読み、右端順にまと</text><text class="node-title" x="175.5" y="859">めて処理できますか？</text><text class="node-explanation" x="175.5" y="886">一つの右端では、各値をちょうど指定回数含む左端が</text><text class="node-explanation" x="175.5" y="904">一つの連続範囲になります。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1152" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1172">候補</text><text class="node-title" x="48" y="1200">右端を進め、変わった値の古い左端範</text><text class="node-title" x="48" y="1223">囲を取り消して新しい範囲を足す</text><a href="/flowchartcp/techniques/frequency-equals-value-offline/"><title>出現回数が値に等しい種類数は、条件を満たす左端の区間を更新するの記事へ</title><text x="48" y="1262">出現回数が値に等しい種類数は、条件を満たす左端</text><text x="48" y="1280">の区間を更新する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1152" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1172">分野</text><text class="node-title" x="412" y="1200">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1237">詳細の質問・図へ →</text></a></g></svg>