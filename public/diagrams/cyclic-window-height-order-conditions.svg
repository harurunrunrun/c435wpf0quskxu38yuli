<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-cyclic-window-height-order-conditions flow-desc-cyclic-window-height-order-conditions" width="748" height="1401" viewBox="0 0 748 1401" data-flow-svg="cyclic-window-height-order-conditions"><title id="flow-title-cyclic-window-height-order-conditions">円周の窓内の個数から確定する大小の解法フローチャート</title><desc id="flow-desc-cyclic-window-height-order-conditions">観測する窓の意味と、全配置に共通する比較が必要かを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-cyclic-window-height-order-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="fixed-cyclic-window:yes:all-configurations"><title>はい</title><path d="M464.5 223 V235 C464.5 267 419 267 419 299 V311"/><path d="M419 349 V361 C419 393 432.5 393 432.5 425 V437" marker-end="url(#arrow-cyclic-window-height-order-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-cyclic-window:yes:all-configurations" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="334">はい</text></g></g><g class="flow-edge no" data-edge="fixed-cyclic-window:no:check"><title>いいえ</title><path d="M544.5 223 V235 C544.5 267 543 267 543 299 V311"/><path d="M543 349 V361 C543 393 654 393 654 425 V437 V617 C654 649 654 649 654 681 V693 V743 C654 775 654 775 654 807 V819 V999 C654 1031 654 1031 654 1063 V1075 V1125 C654 1157 624.571 1157 624.571 1189 V1201" marker-end="url(#arrow-cyclic-window-height-order-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-cyclic-window:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed-cyclic-window:unknown:check"><title>わからない</title><path d="M624.5 223 V235 C624.5 267 671.5 267 671.5 299 V311"/><path d="M671.5 349 V361 C671.5 393 710 393 710 425 V437 V617 C710 649 710 649 710 681 V693 V743 C710 775 710 775 710 807 V819 V999 C710 1031 710 1031 710 1063 V1075 V1125 C710 1157 670.286 1157 670.286 1189 V1201" marker-end="url(#arrow-cyclic-window-height-order-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-cyclic-window:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="all-configurations:yes:bounds"><title>はい</title><path d="M352.5 605 V617 C352.5 649 307 649 307 681 V693"/><path d="M307 731 V743 C307 775 319.5 775 319.5 807 V819" marker-end="url(#arrow-cyclic-window-height-order-conditions)"/><g class="flow-edge-label" data-edge-label="all-configurations:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="716">はい</text></g></g><g class="flow-edge no" data-edge="all-configurations:no:check"><title>いいえ</title><path d="M432.5 605 V617 C432.5 649 431 649 431 681 V693"/><path d="M431 731 V743 C431 775 542 775 542 807 V819 V999 C542 1031 542 1031 542 1063 V1075 V1125 C542 1157 533.143 1157 533.143 1189 V1201" marker-end="url(#arrow-cyclic-window-height-order-conditions)"/><g class="flow-edge-label" data-edge-label="all-configurations:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="all-configurations:unknown:check"><title>わからない</title><path d="M512.5 605 V617 C512.5 649 559.5 649 559.5 681 V693"/><path d="M559.5 731 V743 C559.5 775 598 775 598 807 V819 V999 C598 1031 598 1031 598 1063 V1075 V1125 C598 1157 578.857 1157 578.857 1189 V1201" marker-end="url(#arrow-cyclic-window-height-order-conditions)"/><g class="flow-edge-label" data-edge-label="all-configurations:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 987 V999 C239.5 1031 192 1031 192 1063 V1075"/><path d="M192 1113 V1125 C192 1157 192 1157 192 1189 V1201" marker-end="url(#arrow-cyclic-window-height-order-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 987 V999 C319.5 1031 319 1031 319 1063 V1075"/><path d="M319 1113 V1125 C319 1157 441.714 1157 441.714 1189 V1201" marker-end="url(#arrow-cyclic-window-height-order-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 987 V999 C399.5 1031 447.5 1031 447.5 1063 V1075"/><path d="M447.5 1113 V1125 C447.5 1157 487.429 1157 487.429 1189 V1201" marker-end="url(#arrow-cyclic-window-height-order-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1098">わからない</text></g></g><g class="flow-node question" data-node="fixed-cyclic-window"><rect x="384.5" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">円周上で、時計回りの次のK−1個の</text><text class="node-title" x="400.5" y="103">うち自分より高い個数が分かります</text><text class="node-title" x="400.5" y="126">か？</text><text class="node-explanation" x="400.5" y="153">全位置で同じKを使い、窓の位置は固定します。対象</text><text class="node-explanation" x="400.5" y="171">を除去した後も、詰め直した列の次のK−1個を見る</text><text class="node-explanation" x="400.5" y="189">ものではありません。</text></g><g class="flow-node question" data-node="all-configurations"><rect x="272.5" y="437" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="457">質問</text><text class="node-title" x="288.5" y="485">高さは全て異なり、条件に合う全配置</text><text class="node-title" x="288.5" y="508">で大小が決まるかを求めますか？</text><text class="node-explanation" x="288.5" y="535">条件に合う配置が存在します。一つの復元結果の比較</text><text class="node-explanation" x="288.5" y="553">だけでは足りず、両方の大小が可能なら曖昧と答えま</text><text class="node-explanation" x="288.5" y="571">す。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="819" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="839">質問</text><text class="node-title" x="175.5" y="867">対象と比較の回数はそれぞれ20万以</text><text class="node-title" x="175.5" y="890">下で、1≤K≤Nですか？</text><text class="node-explanation" x="175.5" y="917">Nは対象数です。観測する個数は0〜K−1で、初期</text><text class="node-explanation" x="175.5" y="935">化後は対象も観測値も変更しません。掲載実装はK=</text><text class="node-explanation" x="175.5" y="953">1にも対応します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1201" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1221">候補</text><text class="node-title" x="48" y="1249">全配置で共通する近距離の大小を使</text><text class="node-title" x="48" y="1272">い、左右の候補をたどる</text><a href="/flowchartcp/techniques/cyclic-window-height-poset-two-neighbor-doubling/"><title>円周上の「自分より高い個数」から、必ず成り立つ大小関係を求めるの記事へ</title><text x="48" y="1311">円周上の「自分より高い個数」から、必ず成り立つ</text><text x="48" y="1329">大小関係を求める</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1201" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1221">分野</text><text class="node-title" x="412" y="1249">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1286">詳細の質問・図へ →</text></a></g></svg>