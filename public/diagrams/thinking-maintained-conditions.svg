x="340" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="356" y="434">分野</text><text class="node-title" x="356" y="462">不変量と仮説の検証</text><text class="node-explanation" x="356" y="489">操作で変わらない量を探し、仮説が正しいか小さい入</text><text class="node-explanation" x="356" y="507">力で確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-invariants-validation" data-route="thinking-invariants-validation"><text x="356" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="prefix-resource"><rect x="704" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="720" y="434">質問</text><text class="node-title" x="720" y="462">どの接頭辞でも、使用量が供給量を超</text><text class="node-title" x="720" y="485">えないことが必要ですか？</text><text class="node-explanation" x="720" y="512">合計量だけでなく、途中で資源が足りるかを確かめま</text><text class="node-explanation" x="720" y="530">す。</text></g><g class="flow-node result" data-node="prefix-resource-result"><rect x="32" y="785" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="805">候補</text><text class="node-title" x="48" y="833">すべての接頭辞で不足がないことを調</text><text class="node-title" x="48" y="856">べる</text><a href="/flowchartcp/techniques/prefix-feasibility/"><title>括弧列の判定を、合計と接頭和の最小値で持つの記事へ</title><text x="48" y="895">括弧列の判定を、合計と接頭和の最小値で持つ</text></a></g><g class="flow-node route" data-node="reference"><rect x="396" y="785" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="805">分野</text><text class="node-title" x="412" y="833">小さい入力の全列挙と規則の観察</text><text class="node-explanation" x="412" y="860">全列挙で得た答えや最適解を調べ、候補となる規則を</text><text class="node-explanation" x="412" y="878">探します。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-small-input-enumeration" data-route="thinking-small-input-enumeration"><text x="412" y="906">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="785" width="320" height="132" rx="7"/><text class="node-kind" x="776" y="805">質問</text><text class="node-title" x="776" y="833">手で追える入力の、操作と答えを列挙</text><text class="node-title" x="776" y="856">できますか？</text><text class="node-explanation" x="776" y="883">抽象的な式を、最小の例に戻して確認します。</text></g><g class="flow-node result" data-node="observation"><rect x="396" y="1156" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1176">候補</text><text class="node-title" x="412" y="1204">小規模全探索から観察する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="412" y="1243">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="1156" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="1176">分野</text><text class="node-title" x="776" y="1204">条件を確かめる</text><text class="node-explanation" x="776" y="1231">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="1259">詳細の質問・図へ →</text></a></g></svg>