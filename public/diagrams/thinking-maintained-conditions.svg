<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-thinking-maintained-conditions flow-desc-thinking-maintained-conditions" width="1112" height="1327" viewBox="0 0 1112 1327" data-flow-svg="thinking-maintained-conditions"><title id="flow-title-thinking-maintained-conditions">操作中に保つ量・途中の不足の解法フローチャート</title><desc id="flow-desc-thinking-maintained-conditions">操作の前後で保たれる量や、途中で守るべき条件を調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-thinking-maintained-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge invariant" data-edge="reason-task:invariant:invariant"><title>繰り返す操作で、変わらない量を探す</title><path d="M706.667 182 V194 C706.667 226 500 226 500 258 V270"/><path d="M500 308 V338 C500 370 500 370 500 402 V414" marker-end="url(#arrow-thinking-maintained-conditions)"/><g class="flow-edge-label" data-edge-label="reason-task:invariant:invariant" tabindex="0" role="group" aria-label="選択肢：繰り返す操作で、変わらない量を探す"><rect x="377.5" y="270" width="245" height="38" rx="5"/><text text-anchor="middle" x="500" y="293">繰り返す操作で、変わらない量を探す</text></g></g><g class="flow-edge prefix" data-edge="reason-task:prefix:prefix-resource"><title>順番に資源を使い、途中でも不足しないか</title><path d="M786.667 182 V194 C786.667 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 864 370 864 402 V414" marker-end="url(#arrow-thinking-maintained-conditions)"/><g class="flow-edge-label" data-edge-label="reason-task:prefix:prefix-resource" tabindex="0" role="group" aria-label="選択肢：順番に資源を使い、途中でも不足しないか"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">順番に資源を使い、途中でも不足しな</text><text text-anchor="middle" x="824.5" y="311">いか</text></g></g><g class="flow-edge unknown" data-edge="reason-task:unknown:check"><title>わからない</title><path d="M866.667 182 V194 C866.667 226 1035.5 2