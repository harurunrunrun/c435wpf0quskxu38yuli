<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-timed-work-cover flow-desc-timed-work-cover" width="860" height="1431" viewBox="0 0 860 1431" data-flow-svg="timed-work-cover"><title id="flow-title-timed-work-cover">時刻順の作業を最少人数で担当するの解法フローチャート</title><desc id="flow-desc-timed-work-cover">一人が続けて実行できる作業の関係を、循環しない鎖に分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-timed-work-cover" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="chain:yes:acyclic"><title>はい</title><path d="M539.722 223 V235 C539.722 267 420.667 267 420.667 299 V311"/><path d="M420.667 349 V361 C420.667 393 420.667 393 420.667 425 V437" marker-end="url(#arrow-timed-work-cover)"/><g class="flow-edge-label" data-edge-label="chain:yes:acyclic" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="334">はい</text></g></g><g class="flow-edge no" data-edge="chain:no:fallback"><title>いいえ</title><path d="M619.722 223 V235 C619.722 267 655 267 655 299 V311"/><path d="M655 349 V361 C655 393 762.5 393 762.5 425 V437 V640 C762.5 672 762.5 672 762.5 704 V716 V766 C762.5 798 458 798 458 830 V842 V1046 C458 1078 360 1078 360 1110 V1122 V1172 C360 1204 304 1204 304 1236 V1248" marker-end="url(#arrow-timed-work-cover)"/><g class="flow-edge-label" data-edge-label="chain:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="chain:unknown:check"><title>わからない</title><path d="M699.722 223 V235 C699.722 267 783.5 267 783.5 299 V311"/><path d="M783.5 349 V361 C783.5 393 818.5 393 818.5 425 V437 V640 C818.5 672 818.5 672 818.5 704 V716 V766 C818.5 798 721.333 798 721.333 830 V842" marker-end="url(#arrow-timed-work-cover)"/><g class="flow-edge-label" data-edge-label="chain:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="acyclic:yes:cover-result"><title>はい</title><path d="M340.667 628 V640 C340.667 672 192 672 192 704 V716"/><path d="M192 754 V766 C192 798 192 798 192 830 V842" marker-end="url(#arrow-timed-work-cover)"/><g class="flow-edge-label" data-edge-label="acyclic:yes:cover-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="716" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="739">はい</text></g></g><g class="flow-edge no" data-edge="acyclic:no:fallback"><title>いいえ</title><path d="M420.667 628 V640 C420.667 672 402 672 402 704 V716"/><path d="M402 754 V766 C402 798 402 798 402 830 V842 V1046 C402 1078 304 1078 304 1110 V1122 V1172 C304 1204 224 1204 224 1236 V1248" marker-end="url(#arrow-timed-work-cover)"/><g class="flow-edge-label" data-edge-label="acyclic:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="716" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="739">いいえ</text></g></g><g class="flow-edge unknown" data-edge="acyclic:unknown:check"><title>わからない</title><path d="M500.667 628 V640 C500.667 672 668 672 668 704 V716"/><path d="M668 754 V766 C668 798 614.667 798 614.667 830 V842" marker-end="url(#arrow-timed-work-cover)"/><g class="flow-edge-label" data-edge-label="acyclic:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="716" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="739">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 992 V1046 C588 1078 450 1078 450 1110 V1122"/><path d="M450 1160 V1172 C450 1204 384 1204 384 1236 V1248" marker-end="url(#arrow-timed-work-cover)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1122" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1145">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 992 V1046 C668 1078 655 1078 655 1110 V1122"/><path d="M655 1160 V1172 C655 1204 614.667 1204 614.667 1236 V1248" marker-end="url(#arrow-timed-work-cover)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1122" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1145">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 992 V1046 C748 1078 783.5 1078 783.5 1110 V1122"/><path d="M783.5 1160 V1172 C783.5 1204 721.333 1204 721.333 1236 V1248" marker-end="url(#arrow-timed-work-cover)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1122" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1145">わからない</text></g></g><g class="flow-node question" data-node="chain"><rect x="459.7222222222223" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">各作業は一回ずつ担当し、一人が次に</text><text class="node-title" x="475.7222222222223" y="103">担当できる作業を二者の条件で判定で</text><text class="node-title" x="475.7222222222223" y="126">きますか？</text><text class="node-explanation" x="475.7222222222223" y="153">決まった場所と時刻なら、最短移動時間が時刻差以下</text><text class="node-explanation" x="475.7222222222223" y="171">かを調べます。開始場所は自由で、作業間に人数以外</text><text class="node-explanation" x="475.7222222222223" y="189">の制約がないことを確認します。</text></g><g class="flow-node question" data-node="acyclic"><rect x="260.6666666666667" y="437" width="320" height="191" rx="7"/><text class="node-kind" x="276.6666666666667" y="457">質問</text><text class="node-title" x="276.6666666666667" y="485">続けて担当できる関係に循環がなく、</text><text class="node-title" x="276.6666666666667" y="508">担当者の初期位置を自由に置けます</text><text class="node-title" x="276.6666666666667" y="531">か？</text><text class="node-explanation" x="276.6666666666667" y="558">時刻の増える関係なら循環しません。一人の担当列は</text><text class="node-explanation" x="276.6666666666667" y="576">一本の鎖になり、作業を左右のコピーへ分けて前後の</text><text class="node-explanation" x="276.6666666666667" y="594">組を選べます。</text></g><g class="flow-node result" data-node="cover-result"><rect x="32" y="842" width="320" height="192" rx="7"/><text class="node-kind" x="48" y="862">候補</text><text class="node-title" x="48" y="890">作業の前後の対応を最大にし、作業数</text><text class="node-title" x="48" y="913">から引いて最少人数を求める</text><a href="/flowchartcp/techniques/dag-path-cover-vertex-disjoint/"><title>時刻の決まった仕事を、前後に一つずつつなぎ最小人数に分けるの記事へ</title><text x="48" y="952">時刻の決まった仕事を、前後に一つずつつなぎ最小</text><text x="48" y="970">人数に分ける</text></a><a href="/flowchartcp/techniques/matching/"><title>二部マッチングの記事へ</title><text x="48" y="994">二部マッチング</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="842" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="862">質問</text><text class="node-title" x="524" y="890">合法な選択と、選ぶ回数・費用の条件</text><text class="node-title" x="524" y="913">を一つずつ確かめられますか？</text><text class="node-explanation" x="524" y="940">一対象を何回使えるか、必ず選ぶ対象があるか、経路</text><text class="node-explanation" x="524" y="958">はどこまで共用できるかを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1248" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1268">候補</text><text class="node-title" x="160" y="1296">選択の条件と目的値を整理する</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="160" y="1335">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1359">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1248" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1268">分野</text><text class="node-title" x="524" y="1296">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1333">詳細の質問・図へ →</text></a></g></svg>