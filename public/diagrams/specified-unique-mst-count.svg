<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-specified-unique-mst-count flow-desc-specified-unique-mst-count" width="1112" height="1759" viewBox="0 0 1112 1759" data-flow-svg="specified-unique-mst-count"><title id="flow-title-specified-unique-mst-count">重み順に成分を併合し、各新しい頂点対の追加辺の選択肢を数えるの解法フローチャート</title><desc id="flow-desc-specified-unique-mst-count">唯一の最小全域木を要求するか、同重みの別の木を許すかを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-specified-unique-mst-count" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge unique" data-edge="model:unique:goal"><title>追加後のグラフで、唯一の最小全域木にする</title><path d="M574.25 182 V194 C574.25 226 272.5 226 272.5 258 V270"/><path d="M272.5 326 V338 C272.5 370 702.556 370 702.556 402 V414" marker-end="url(#arrow-specified-unique-mst-count)"/><g class="flow-edge-label" data-edge-label="model:unique:goal" tabindex="0" role="group" aria-label="選択肢：追加後のグラフで、唯一の最小全域木にする"><rect x="150" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="272.5" y="293">追加後のグラフで、唯一の最小全域木</text><text text-anchor="middle" x="272.5" y="311">にする</text></g></g><g class="flow-edge one-of" data-edge="model:one-of:fallback"><title>複数ある最小全域木の一つでよい</title><path d="M638.25 182 V194 C638.25 226 548.5 226 548.5 258 V270"/><path d="M548.5 308 V338 C548.5 370 962 370 962 402 V414 V617 C962 649 962 649 962 681 V693 V743 C962 775 962 775 962 807 V819 V1022 C962 1054 962 1054 962 1086 V1098 V1148 C962 1180 588 1180 588 1212 V1224" marker-end="url(#arrow-specified-unique-mst-count)"/><g class="flow-edge-label" data-edge-label="model:one-of:fallback" tabindex="0" role="group" aria-label="選択肢：複数ある最小全域木の一つでよい"><rect x="439" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="548.5" y="293">複数ある最小全域木の一つでよい</text></g></g><g class="flow-edge arbitrary-tree" data-ed