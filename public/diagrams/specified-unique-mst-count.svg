ata-edge="guard:unknown:check"><title>わからない</title><path d="M581.167 1010 V1022 C581.167 1054 755.5 1054 755.5 1086 V1098"/><path d="M755.5 1136 V1148 C755.5 1180 840 1180 840 1212 V1224" marker-end="url(#arrow-specified-unique-mst-count)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1098" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1121">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1374 V1404 C840 1436 783 1436 783 1468 V1480"/><path d="M783 1518 V1530 C783 1562 828.5 1562 828.5 1594 V1606" marker-end="url(#arrow-specified-unique-mst-count)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1480" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1503">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1374 V1404 C920 1436 907 1436 907 1468 V1480"/><path d="M907 1518 V1530 C907 1562 908.5 1562 908.5 1594 V1606" marker-end="url(#arrow-specified-unique-mst-count)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1480" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1503">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1374 V1404 C1000 1436 1035.5 1436 1035.5 1468 V1480"/><path d="M1035.5 1518 V1530 C1035.5 1562 988.5 1562 988.5 1594 V1606" marker-end="url(#arrow-specified-unique-mst-count)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1480" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1503">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="510.25" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="526.25" y="52">質問</text><text class="node-title" x="526.25" y="80">指定された木を、どのように全域木と</text><text class="node-title" x="526.25" y="103">して残しますか？</text><text class="node-explanation" x="526.25" y="130">唯一の最小全域木を要求するか、同重みの別の木を許</text><text class="node-explanation" x="526.25" y="148">すかを確認します。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="558.5555555555557" y="434">質問</text><text class="node-title" x="558.5555555555557" y="462">単純無向グラフで、追加する各辺は無</text><text class="node-title" x="558.5555555555557" y="485">しまたは整数重み 1..S を選べ</text><text class="node-title" x="558.5555555555557" y="508">ますか？</text><text class="node-explanation" x="558.5555555555557" y="535">指定された木の辺は固定され、同じ頂点対に複数の追</text><text class="node-explanation" x="558.5555555555557" y="553">加辺は許しません。木の辺も 1..S に入りま</text><text class="node-explanation" x="558.5555555555557" y="571">す。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="819" width="320" height="191" rx="7"/><text class="node-kind" x="357.1666666666667" y="839">質問</text><text class="node-title" x="357.1666666666667" y="867">追加する辺の重みを、その両端の木上</text><text class="node-title" x="357.1666666666667" y="890">経路の最大重みより厳密に大きくでき</text><text class="node-title" x="357.1666666666667" y="913">ますか？</text><text class="node-explanation" x="357.1666666666667" y="940">同じ重みを許すと別の最小全域木が生じます。重み </text><text class="node-explanation" x="357.1666666666667" y="958">w で成分サイズ a,b を併合すると、新しい </text><text class="node-explanation" x="357.1666666666667" y="976">ab−1 組に各 S−w+1 通りがあります。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1224" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1244">候補</text><text class="node-title" x="48" y="1272">重み順に成分を併合し、各新しい頂点</text><text class="node-title" x="48" y="1295">対の追加辺の選択肢を数える</text><a href="/flowchartcp/techniques/unique-mst-completion-count/"><title>指定した木を唯一の最小全域木にする追加辺は、結合される成分の頂点対で数えるの記事へ</title><text x="48" y="1334">指定した木を唯一の最小全域木にする追加辺は、結</text><text x="48" y="1352">合される成分の頂点対で数える</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1224" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1244">候補</text><text class="node-title" x="412" y="1272">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1311">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1335">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1224" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1244">質問</text><text class="node-title" x="776" y="1272">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1295">書き出せますか？</text><text class="node-explanation" x="776" y="1322">唯一の最小全域木を要求するか、同重みの別の木を許</text><text class="node-explanation" x="776" y="1340">すかを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1606" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1626">分野</text><text class="node-title" x="764.5" y="1654">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1691">詳細の質問・図へ →</text></a></g></svg>