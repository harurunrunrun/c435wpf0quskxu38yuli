<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-and-zero-subset-conditions flow-desc-and-zero-subset-conditions" width="748" height="1347" viewBox="0 0 748 1347" data-flow-svg="and-zero-subset-conditions"><title id="flow-title-and-zero-subset-conditions">選んだ全要素のANDが0になる個数の解法フローチャート</title><desc id="flow-desc-and-zero-subset-conditions">非空、ビット幅、添字の区別と追加制約を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-and-zero-subset-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="all-subsets:yes:small-b"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-and-zero-subset-conditions)"/><g class="flow-edge-label" data-edge-label="all-subsets:yes:small-b" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="all-subsets:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V558 C654 590 654 590 654 622 V634 V684 C654 716 654 716 654 748 V760 V945 C654 977 654 977 654 1009 V1021 V1071 C654 1103 624.571 1103 624.571 1135 V1147" marker-end="url(#arrow-and-zero-subset-conditions)"/><g class="flow-edge-label" data-edge-label="all-subsets:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="all-subsets:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V558 C710 590 710 590 710 622 V634 V684 C710 716 710 716 710 748 V760 V945 C710 977 710 977 710 1009 V1021 V1071 C710 1103 670.286 1103 670.286 1135 V1147" marker-end="url(#arrow-and-zero-subset-conditions)"/><g class="flow-edge-label" data-edge-label="all-subsets:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="small-b:yes:positions"><title>はい</title><path d="M352.5 546 V558 C352.5 590 307 590 307 622 V634"/><path d="M307 672 V684 C307 716 319.5 716 319.5 748 V760" marker-end="url(#arrow-and-zero-subset-conditions)"/><g class="flow-edge-label" data-edge-label="small-b:yes:positions" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="657">はい</text></g></g><g class="flow-edge no" data-edge="small-b:no:check"><title>いいえ</title><path d="M432.5 546 V558 C432.5 590 431 590 431 622 V634"/><path d="M431 672 V684 C431 716 542 716 542 748 V760 V945 C542 977 542 977 542 1009 V1021 V1071 C542 1103 533.143 1103 533.143 1135 V1147" marker-end="url(#arrow-and-zero-subset-conditions)"/><g class="flow-edge-label" data-edge-label="small-b:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="small-b:unknown:check"><title>わからない</title><path d="M512.5 546 V558 C512.5 590 559.5 590 559.5 622 V634"/><path d="M559.5 672 V684 C559.5 716 598 716 598 748 V760 V945 C598 977 598 977 598 1009 V1021 V1071 C598 1103 578.857 1103 578.857 1135 V1147" marker-end="url(#arrow-and-zero-subset-conditions)"/><g class="flow-edge-label" data-edge-label="small-b:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="positions:yes:answer"><title>はい</title><path d="M239.5 933 V945 C239.5 977 192 977 192 1009 V1021"/><path d="M192 1059 V1071 C192 1103 192 1103 192 1135 V1147" marker-end="url(#arrow-and-zero-subset-conditions)"/><g class="flow-edge-label" data-edge-label="positions:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1044">はい</text></g></g><g class="flow-edge no" data-edge="positions:no:check"><title>いいえ</title><path d="M319.5 933 V945 C319.5 977 319 977 319 1009 V1021"/><path d="M319 1059 V1071 C319 1103 441.714 1103 441.714 1135 V1147" marker-end="url(#arrow-and-zero-subset-conditions)"/><g class="flow-edge-label" data-edge-label="positions:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1044">いいえ</text></g></g><g class="flow-edge unknown" data-edge="positions:unknown:check"><title>わからない</title><path d="M399.5 933 V945 C399.5 977 447.5 977 447.5 1009 V1021"/><path d="M447.5 1059 V1071 C447.5 1103 487.429 1103 487.429 1135 V1147" marker-end="url(#arrow-and-zero-subset-conditions)"/><g class="flow-edge-label" data-edge-label="positions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1021" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1044">わからない</text></g></g><g class="flow-node question" data-node="all-subsets"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">全要素のANDが0になる、全ての非</text><text class="node-title" x="400.5" y="103">空の添字部分集合を数えますか？</text><text class="node-explanation" x="400.5" y="130">全体のANDを一回求める問題や、二要素だけの</text><text class="node-explanation" x="400.5" y="148">ANDが0になる個数とは異なります。</text></g><g class="flow-node question" data-node="small-b"><rect x="272.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">全て非負で、全マスクの上位集合を集</text><text class="node-title" x="288.5" y="467">計できるビット幅ですか？</text><text class="node-explanation" x="288.5" y="494">掲載実装はBが20以下。各マスクの全ての1を持つ</text><text class="node-explanation" x="288.5" y="512">入力数を、B×2のB乗程度でまとめます。</text></g><g class="flow-node question" data-node="positions"><rect x="159.5" y="760" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">同じ値でも添字が違えば別に選び、選</text><text class="node-title" x="175.5" y="831">ぶ個数や隣接関係の追加制約はありま</text><text class="node-title" x="175.5" y="854">せんか？</text><text class="node-explanation" x="175.5" y="881">各マスクの全ての1を持つ入力がc個なら、そこから</text><text class="node-explanation" x="175.5" y="899">の非空な選び方は2のc乗−1です。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1147" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1167">候補</text><text class="node-title" x="48" y="1195">上位集合の個数から非空な選び方を求</text><text class="node-title" x="48" y="1218">め、1ビットの残りを包除する</text><a href="/flowchartcp/techniques/subset-and-zero-superset-inclusion/"><title>選んだ数のANDを0にする個数は、残る1ビットを上位集合の集計と包除で消すの記事へ</title><text x="48" y="1257">選んだ数のANDを0にする個数は、残る1ビット</text><text x="48" y="1275">を上位集合の集計と包除で消す</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1147" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1167">分野</text><text class="node-title" x="412" y="1195">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1232">詳細の質問・図へ →</text></a></g></svg>