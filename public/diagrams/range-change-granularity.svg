dge-label="beats:no:action" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="936" y="616" width="80" height="38" rx="5"/><text text-anchor="middle" x="976" y="639">いいえ</text></g></g><g class="flow-edge unknown" data-edge="beats:unknown:check"><title>わからない</title><path d="M1355.833 528 V540 C1355.833 572 1511.5 572 1511.5 604 V616"/><path d="M1511.5 654 V666 C1511.5 698 1550 698 1550 730 V742 V904 C1550 936 1371.5 936 1371.5 968 V980 V1030 C1371.5 1062 1141.333 1062 1141.333 1094 V1106" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="beats:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1467" y="616" width="89" height="38" rx="5"/><text text-anchor="middle" x="1511.5" y="639">わからない</text></g></g><g class="flow-edge yes" data-edge="beats-proof:yes:beats-result"><title>はい</title><path d="M1420 892 V904 C1420 936 1517.5 936 1517.5 968 V980"/><path d="M1517.5 1018 V1030 C1517.5 1062 1452 1062 1452 1094 V1106" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="beats-proof:yes:beats-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1477.5" y="980" width="80" height="38" rx="5"/><text text-anchor="middle" x="1517.5" y="1003">はい</text></g></g><g class="flow-edge no" data-edge="beats-proof:no:fallback"><title>いいえ</title><path d="M1260 892 V904 C1260 936 848 936 848 968 V980"/><path d="M848 1018 V1030 C848 1062 777.333 1062 777.333 1094 V1106" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="beats-proof:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="808" y="980" width="80" height="38" rx="5"/><text text-anchor="middle" x="848" y="1003">いいえ</text></g></g><g class="flow-edge unknown" data-edge="beats-proof:unknown:check"><title>わからない</title><path d="M1340 892 V904 C1340 936 1277 936 1277 968 V980"/><path d="M1277 1018 V1030 C1277 1062 1088 1062 1088 1094 V1106" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="beats-proof:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1232.5" y="980" width="89" height="38" rx="5"/><text text-anchor="middle" x="1277" y="1003">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:lazy"><title>はい</title><path d="M1008 1256 V1292 C1008 1324 1088 1324 1088 1356 V1368"/><path d="M1088 1406 V1418 C1088 1450 1088 1450 1088 1482 V1494" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="check:yes:lazy" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1048" y="1368" width="80" height="38" rx="5"/><text text-anchor="middle" x="1088" y="1391">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1088 1256 V1292 C1088 1324 1439 1324 1439 1356 V1368"/><path d="M1439 1406 V1418 C1439 1450 1398.667 1450 1398.667 1482 V1494" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1399" y="1368" width="80" height="38" rx="5"/><text text-anchor="middle" x="1439" y="1391">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1168 1256 V1292 C1168 1324 1567.5 1324 1567.5 1356 V1368"/><path d="M1567.5 1406 V1418 C1567.5 1450 1505.333 1450 1505.333 1482 V1494" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1523" y="1368" width="89" height="38" rx="5"/><text text-anchor="middle" x="1567.5" y="1391">わからない</text></g></g><g class="flow-node question" data-node="point"><rect x="956" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="972" y="52">質問</text><text class="node-title" x="972" y="80">一回の更新で変わる位置は一つです</text><text class="node-title" x="972" y="103">か？</text><text class="node-explanation" x="972" y="130">一点の加算・代入と、区間全体の変更を分けます。</text></g><g class="flow-node question" data-node="add"><rect x="344.6666666666667" y="378" width="320" height="127" rx="7"/><text class="node-kind" x="360.6666666666667" y="398">質問</text><text class="node-title" x="360.6666666666667" y="426">一点加算と区間和を扱いますか？</text><text class="node-explanation" x="360.6666666666667" y="453">可換な群として集計できる場合に BIT を使えま</text><text class="node-explanation" x="360.6666666666667" y="471">す。単なる結合性だけでは十分ではありません。</text></g><g class="flow-node question" data-node="assoc"><rect x="396" y="742" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="762">質問</text><text class="node-title" x="412" y="790">隣り合う区間の答えをまとめて、全体</text><text class="node-title" x="412" y="813">の答えを求められますか？</text><text class="node-explanation" x="412" y="840">一点代入、区間 min、行列積などを、単位元と結</text><text class="node-explanation" x="412" y="858">合演算で表します。</text></g><g class="flow-node question" data-node="beats"><rect x="1115.8333333333333" y="378" width="320" height="150" rx="7"/><text class="node-kind" x="1131.8333333333333" y="398">質問</text><text class="node-title" x="1131.8333333333333" y="426">区間 chmin・chmax と区</text><text class="node-title" x="1131.8333333333333" y="449">間和を組み合わせますか？</text><text class="node-explanation" x="1131.8333333333333" y="476">値ごとの変化を通常の区間和だけから計算できない更</text><text class="node-explanation" x="1131.8333333333333" y="494">新です。</text></g><g class="flow-node question" data-node="beats-proof"><rect x="1180" y="742" width="320" height="150" rx="7"/><text class="node-kind" x="1196" y="762">質問</text><text class="node-title" x="1196" y="790">最大値・第二最大値・個数などで更新</text><text class="node-title" x="1196" y="813">を止め、計算量を評価できますか？</text><text class="node-explanation" x="1196" y="840">条件を満たさないノードに降りる回数の償却解析が必</text><text class="node-explanation" x="1196" y="858">要です。</text></g><g class="flow-node route" data-node="action"><rect x="816" y="742" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="762">分野</text><text class="node-title" x="832" y="790">区間情報への反映と、変更の合成</text><a href="/flowchartcp/flowcharts/#diagram-range-change-composition" data-route="range-change-composition"><text x="832" y="827">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="928" y="1106" width="320" height="150" rx="7"/><text class="node-kind" x="944" y="1126">質問</text><text class="node-title" x="944" y="1154">区間への代入・加算を、区間和と長さ</text><text class="node-title" x="944" y="1177">から一括で反映できますか？</text><text class="node-explanation" x="944" y="1204">sum と length を持ち、写像が結合を保</text><text class="node-explanation" x="944" y="1222">つこと、タグの合成を定義できることを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1292" y="1494" width="320" height="139" rx="7"/><text class="node-kind" x="1308" y="1514">分野</text><text class="node-title" x="1308" y="1542">条件を確かめる</text><text class="node-explanation" x="1308" y="1569">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1308" y="1597">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="bit"><rect x="32" y="742" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="762">候補</text><text class="node-title" x="48" y="790">Fenwick 木</text><a href="/flowchartcp/techniques/fenwick-tree/"><title>Fenwick Treeの記事へ</title><text x="48" y="829">Fenwick Tree</text></a></g><g class="flow-node result" data-node="segment"><rect x="200" y="1106" width="320" height="127" rx="7"/><text class="node-kind" x="216" y="1126">候補</text><text class="node-title" x="216" y="1154">セグメント木</text><a href="/flowchartcp/techniques/segment-tree/"><title>セグメント木の記事へ</title><text x="216" y="1193">セグメント木</text></a></g><g class="flow-node result" data-node="beats-result"><rect x="1292" y="1106" width="320" height="174" rx="7"/><text class="node-kind" x="1308" y="1126">候補</text><text class="node-title" x="1308" y="1154">Segment Tree </text><text class="node-title" x="1308" y="1177">Beats</text><a href="/flowchartcp/techniques/range-chmin-second-maximum/"><title>区間の上限更新を第二最大値でまとめて処理するの記事へ</title><text x="1308" y="1216">区間の上限更新を第二最大値でまとめて処理する</text></a><a href="/flowchartcp/techniques/segment-tree-beats/"><title>Segment Tree Beatsの記事へ</title><text x="1308" y="1240">Segment Tree Beats</text></a></g><g class="flow-node result" data-node="lazy"><rect x="928" y="1494" width="320" height="127" rx="7"/><text class="node-kind" x="944" y="1514">候補</text><text class="node-title" x="944" y="1542">遅延セグメント木</text><a href="/flowchartcp/techniques/lazy-segment-tree/"><title>遅延セグメント木の記事へ</title><text x="944" y="1581">遅延セグメント木</text></a></g><g class="flow-node result" data-node="fallback"><rect x="564" y="1106" width="320" height="127" rx="7"/><text class="node-kind" x="580" y="1126">候補</text><text class="node-title" x="580" y="1154">保持する区間情報を増やす</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="580" y="1193">状態の設計</text></a></g></svg>