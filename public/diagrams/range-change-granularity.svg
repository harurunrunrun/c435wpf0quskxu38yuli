<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-change-granularity flow-desc-range-change-granularity" width="1644" height="1665" viewBox="0 0 1644 1665" data-flow-svg="range-change-granularity"><title id="flow-title-range-change-granularity">変わる位置と、保持する区間情報の解法フローチャート</title><desc id="flow-desc-range-change-granularity">一点の変更か、上限下限による変更か、区間全体へ反映できる変更かを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-change-granularity" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="point:yes:add"><title>はい</title><path d="M1036 164 V176 C1036 208 504.667 208 504.667 240 V252"/><path d="M504.667 290 V302 C504.667 334 504.667 334 504.667 366 V378" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="point:yes:add" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="464.6666666666667" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="504.6666666666667" y="275">はい</text></g></g><g class="flow-edge no" data-edge="point:no:beats"><title>いいえ</title><path d="M1116 164 V176 C1116 208 1275.833 208 1275.833 240 V252"/><path d="M1275.833 290 V302 C1275.833 334 1275.833 334 1275.833 366 V378" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="point:no:beats" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1235.8333333333333" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="1275.8333333333333" y="275">いいえ</text></g></g><g class="flow-edge unknown" data-edge="point:unknown:check"><title>わからない</title><path d="M1196 164 V176 C1196 208 1567.5 208 1567.5 240 V252"/><path d="M1567.5 290 V302 C1567.5 334 1606 334 1606 366 V378 V540 C1606 572 1606 572 1606 604 V616 V666 C1606 698 1606 698 1606 730 V742 V904 C1606 936 1427.5 936 1427.5 968 V980 V1030 C1427.5 1062 1194.667 1062 1194.667 1094 V1106" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="point:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1523" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="1567.5" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="add:yes:bit"><title>はい</title><path d="M424.667 505 V540 C424.667 572 192 572 192 604 V616"/><path d="M192 654 V666 C192 698 192 698 192 730 V742" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="add:yes:bit" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="616" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="639">はい</text></g></g><g class="flow-edge no" data-edge="add:no:assoc"><title>いいえ</title><path d="M504.667 505 V540 C504.667 572 556 572 556 604 V616"/><path d="M556 654 V666 C556 698 556 698 556 730 V742" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="add:no:assoc" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="616" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="639">いいえ</text></g></g><g class="flow-edge unknown" data-edge="add:unknown:check"><title>わからない</title><path d="M584.667 505 V540 C584.667 572 766 572 766 604 V616"/><path d="M766 654 V666 C766 698 766 698 766 730 V742 V904 C766 936 1182.5 936 1182.5 968 V980 V1030 C1182.5 1062 1034.667 1062 1034.667 1094 V1106" marker-end="url(#arrow-range-change-granularity)"/><g class="flow-edge-label" data-edge-label="add:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="721.5" y="616" width="89" height="38" rx="5"/><text text-anchor="middle" x="766" y="639">わからない</text></g></g><g class="flow-edge yes" data-edge="assoc:yes:segment"><title>はい</title><path d="M476 892 V904 C476 936 360 936 360 968 V980"/><path d="M360 1018 V1030 C360 1062 360 1062 360 1094