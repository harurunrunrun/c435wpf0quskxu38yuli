<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-connectivity-weight-thresholds flow-desc-connectivity-weight-thresholds" width="1476" height="943" viewBox="0 0 1476 943" data-flow-svg="connectivity-weight-thresholds"><title id="flow-title-connectivity-weight-thresholds">重さの条件を満たす辺のつながりの解法フローチャート</title><desc id="flow-desc-connectivity-weight-thresholds">使える辺が増える順に問い合わせを処理できるかを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-connectivity-weight-thresholds" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge low" data-edge="threshold-direction:low:threshold-check"><title>閾値未満・閾値以下</title><path d="M943.056 159 V171 C943.056 203 652.833 203 652.833 235 V247"/><path d="M652.833 285 V297 C652.833 329 652.833 329 652.833 361 V373" marker-end="url(#arrow-connectivity-weight-thresholds)"/><g class="flow-edge-label" data-edge-label="threshold-direction:low:threshold-check" tabindex="0" role="group" aria-label="選択肢：閾値未満・閾値以下"><rect x="582.3333333333334" y="247" width="141" height="38" rx="5"/><text text-anchor="middle" x="652.8333333333334" y="270">閾値未満・閾値以下</text></g></g><g class="flow-edge high" data-edge="threshold-direction:high:threshold-high-check"><title>閾値より大きい・閾値以上</title><path d="M1023.056 159 V171 C1023.056 203 1016.833 203 1016.833 235 V247"/><path d="M1016.833 285 V297 C1016.833 329 1016.833 329 1016.833 361 V373" marker-end="url(#arrow-connectivity-weight-thresholds)"/><g class="flow-edge-label" data-edge-label="threshold-direction:high:threshold-high-check" tabindex="0" role="group" aria-label="選択肢：閾値より大きい・閾値以上"><rect x="926.8333333333334" y="247" width="180" height="38" rx="5"/><text text-anchor="middle" x="1016.8333333333334" y="270">閾値より大きい・閾値以上</text></g></g><g class="flow-edge unknown" data-edge="threshold-direction:unknown:check"><title>わからない</title><path d="M1103.056 159 V171 C1103.056 203 1399.5 203 1399.5 235 V247"/><path d="M1399.5 285 V297 C1399.5 329 1438 329 1438 361 V373 V535 C1438 567 1438 567 1438 599 V611 V661 C1438 693 1364 693 1364 725 V737" marker-end="url(#arrow-connectivity-weight-thresholds)"/><g class="flow-edge-label" data-edge-label="threshold-direction:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="threshold-check:yes:threshold-result"><title>はい</title><path d="M572.833 523 V535 C572.833 567 192 567 192 599 V611"/><path d="M192 649 V661 C192 693 192 693 192 725 V737" marker-end="url(#arrow-connectivity-weight-thresholds)"/><g class="flow-edge-label" data-edge-label="threshold-check:yes:threshold-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="634">はい</text></g></g><g class="flow-edge no" data-edge="threshold-check:no:fallback"><title>いいえ</title><path d="M652.833 523 V535 C652.833 567 556 567 556 599 V611"/><path d="M556 649 V661 C556 693 502.667 693 502.667 725 V737" marker-end="url(#arrow-connectivity-weight-thresholds)"/><g class="flow-edge-label" data-edge-label="threshold-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="threshold-check:unknown:check"><title>わからない</title><path d="M732.833 523 V535 C732.833 567 1210.5 567 1210.5 599 V611"/><path d="M1210.5 649 V661 C1210.5 693 1204 693 1204 725 V737" marker-end="url(#arrow-connectivity-weight-thresholds)"/><g class="flow-edge-label" data-edge-label="threshold-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1166" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="1210.5" y="634">わからない</text></g></g><g class="flow-edge yes" data-edge="threshold-high-check:yes:threshold-high-result"><title>はい</title><path d="M1016.833 523 V535 C1016.833 567 920 567 920 599 V611"/><path d="M920 649 V661 C920 693 920 693 920 725 V737" marker-end="url(#arrow-connectivity-weight-thresholds)"/><g class="flow-edge-label" data-edge-label="threshold-high-check:yes:threshold-high-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="634">はい</text></g></g><g class="flow-edge no" data-edge="threshold-high-check:no:fallback"><title>いいえ</title><path d="M936.833 523 V535 C936.833 567 680 567 680 599 V611"/><path d="M680 649 V661 C680 693 609.333 693 609.333 725 V737" marker-end="url(#arrow-connectivity-weight-thresholds)"/><g class="flow-edge-label" data-edge-label="threshold-high-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="640" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="680" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="threshold-high-check:unknown:check"><title>わからない</title><path d="M1096.833 523 V535 C1096.833 567 1343.5 567 1343.5 599 V611"/><path d="M1343.5 649 V661 C1343.5 693 1284 693 1284 725 V737" marker-end="url(#arrow-connectivity-weight-thresholds)"/><g class="flow-edge-label" data-edge-label="threshold-high-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1299" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="1343.5" y="634">わからない</text></g></g><g class="flow-node question" data-node="threshold-direction"><rect x="863.0555555555557" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="879.0555555555557" y="52">質問</text><text class="node-title" x="879.0555555555557" y="80">使える辺の重さは、どの条件ですか？</text><text class="node-explanation" x="879.0555555555557" y="107">閾値を動かすと使える辺が増える順に、問い合わせと</text><text class="node-explanation" x="879.0555555555557" y="125">辺を並べます。</text></g><g class="flow-node question" data-node="threshold-check"><rect x="492.83333333333337" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="508.83333333333337" y="393">質問</text><text class="node-title" x="508.83333333333337" y="421">辺と問い合わせを、重さ・閾値の順に</text><text class="node-title" x="508.83333333333337" y="444">処理できますか？</text><text class="node-explanation" x="508.83333333333337" y="471">閾値以下の辺だけを追加し、成分を分割する必要をな</text><text class="node-explanation" x="508.83333333333337" y="489">くします。</text></g><g class="flow-node result" data-node="threshold-result"><rect x="32" y="737" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="757">候補</text><text class="node-title" x="48" y="785">閾値順に辺を加えて問い合わせる</text><a href="/flowchartcp/techniques/dsu-threshold-queries/"><title>重みのしきい値順に辺を追加して連結性を共有するの記事へ</title><text x="48" y="824">重みのしきい値順に辺を追加して連結性を共有する</text></a><a href="/flowchartcp/techniques/offline-queries/"><title>オフラインクエリの記事へ</title><text x="48" y="848">オフラインクエリ</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="737" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="757">候補</text><text class="node-title" x="412" y="785">変更する辺と時刻を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="824">状態の設計</text></a></g><g class="flow-node route" data-node="check"><rect x="1124" y="737" width="320" height="157" rx="7"/><text class="node-kind" x="1140" y="757">分野</text><text class="node-title" x="1140" y="785">操作と問い合わせの順序を確かめる</text><text class="node-explanation" x="1140" y="812">追加や削除を先に読めるかを確かめ、操作を整理する</text><text class="node-explanation" x="1140" y="830">か、足りない条件を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-operation-order" data-route="connectivity-operation-order"><text x="1140" y="858">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="threshold-high-check"><rect x="856.8333333333334" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="872.8333333333334" y="393">質問</text><text class="node-title" x="872.8333333333334" y="421">問い合わせは独立で先に分かり、閾値</text><text class="node-title" x="872.8333333333334" y="444">の降順に処理できますか？</text><text class="node-explanation" x="872.8333333333334" y="471">閾値以上なら、重い辺からその閾値の辺まで追加しま</text><text class="node-explanation" x="872.8333333333334" y="489">す。同じ重さの辺を追加してから質問します。</text></g><g class="flow-node result" data-node="threshold-high-result"><rect x="760" y="737" width="320" height="174" rx="7"/><text class="node-kind" x="776" y="757">候補</text><text class="node-title" x="776" y="785">重い辺から追加し、成分の人数や連結</text><text class="node-title" x="776" y="808">性を答える</text><a href="/flowchartcp/techniques/dsu-threshold-queries/"><title>重みのしきい値順に辺を追加して連結性を共有するの記事へ</title><text x="776" y="847">重みのしきい値順に辺を追加して連結性を共有する</text></a><a href="/flowchartcp/techniques/offline-queries/"><title>オフラインクエリの記事へ</title><text x="776" y="871">オフラインクエリ</text></a></g></svg>