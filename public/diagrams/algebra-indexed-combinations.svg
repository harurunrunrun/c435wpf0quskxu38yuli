"38" rx="5"/><text text-anchor="middle" x="1707.5" y="634">わからない</text></g></g><g class="flow-node question" data-node="algebra-task"><rect x="1148.875" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1164.875" y="52">質問</text><text class="node-title" x="1164.875" y="80">数列や式の計算はどの形ですか？</text><text class="node-explanation" x="1164.875" y="107">積の和と、和の最小値では使う演算が異なります。</text></g><g class="flow-node question" data-node="convolution"><rect x="531.5" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="547.5" y="393">質問</text><text class="node-title" x="547.5" y="421">二つの数列の積を、添字の和ごとに集</text><text class="node-title" x="547.5" y="444">計しますか？</text><text class="node-explanation" x="547.5" y="471">c[k]=sum a[i]b[k-i] の形で</text><text class="node-explanation" x="547.5" y="489">す。</text></g><g class="flow-node result" data-node="ntt-result"><rect x="32" y="737" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="757">候補</text><text class="node-title" x="48" y="785">NTT による畳み込み</text><a href="/flowchartcp/techniques/ntt/"><title>NTT・畳み込みの記事へ</title><text x="48" y="824">NTT・畳み込み</text></a></g><g class="flow-node route" data-node="series"><rect x="396" y="737" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="757">分野</text><text class="node-title" x="412" y="785">係数列への演算と線形遷移</text><text class="node-explanation" x="412" y="812">係数列の逆数・対数・指数と、同じ線形遷移の繰り返</text><text class="node-explanation" x="412" y="830">しを分けます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-series-transitions" data-route="algebra-series-transitions"><text x="412" y="858">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1488" y="737" width="320" height="157" rx="7"/><text class="node-kind" x="1504" y="757">分野</text><text class="node-title" x="1504" y="785">係数の逆数と指定の法</text><text class="node-explanation" x="1504" y="812">係数の逆数が必要か、指定の法で逆数が存在するかを</text><text class="node-explanation" x="1504" y="830">確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-invertibility" data-route="algebra-invertibility"><text x="1504" y="858">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="min-plus-check"><rect x="1068" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="1084" y="393">質問</text><text class="node-title" x="1084" y="421">片方の列の隣との差が、順に増えると</text><text class="node-title" x="1084" y="444">保証されていますか？</text><text class="node-explanation" x="1084" y="471">和の最小値を表の行最小値へ変えると、最適位置の単</text><text class="node-explanation" x="1084" y="489">調性を示せる場合があります。</text></g><g class="flow-node result" data-node="min-plus-result"><rect x="760" y="737" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="757">候補</text><text class="node-title" x="776" y="785">差が増える列を使って和の最小値をま</text><text class="node-title" x="776" y="808">とめる</text><a href="/flowchartcp/techniques/monge-smawk/"><title>Monge配列・SMAWKの記事へ</title><text x="776" y="847">Monge配列・SMAWK</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1124" y="737" width="320" height="127" rx="7"/><text class="node-kind" x="1140" y="757">候補</text><text class="node-title" x="1140" y="785">演算と係数の範囲を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1140" y="824">状態の設計</text></a></g><g class="flow-node route" data-node="coefficient-product-route"><rect x="1432" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1448" y="393">分野</text><text class="node-title" x="1448" y="421">積の添字条件と係数の重み</text><a href="/flowchartcp/flowcharts/#diagram-coefficient-products" data-route="coefficient-products"><text x="1448" y="458">詳細の質問・図へ →</text></a></g></svg>