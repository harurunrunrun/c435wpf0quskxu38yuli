<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-mst-edge-roles flow-desc-mst-edge-roles" width="1112" height="567" viewBox="0 0 1112 567" data-flow-svg="mst-edge-roles"><title id="flow-title-mst-edge-roles">全域木の辺の分類と、最小値の次の解法フローチャート</title><desc id="flow-desc-mst-edge-roles">各辺が最小解に必要か、最小値と等しい別解を除くかを分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-mst-edge-roles" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge classification" data-edge="goal:classification:classify"><title>各辺が全ての最小解に必要か、一部だけか、使われないか</title><path d="M476 182 V194 C476 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-mst-edge-roles)"/><g class="flow-edge-label" data-edge-label="goal:classification:classify" tabindex="0" role="group" aria-label="選択肢：各辺が全ての最小解に必要か、一部だけか、使われないか"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">各辺が全ての最小解に必要か、一部だ</text><text text-anchor="middle" x="192" y="311">けか、使われないか</text></g></g><g class="flow-edge strict-second" data-edge="goal:strict-second:strict"><title>最小総重みと等しい別解を除いた、次の総重み</title><path d="M556 182 V194 C556 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-mst-edge-roles)"/><g class="flow-edge-label" data-edge-label="goal:strict-second:strict" tabindex="0" role="group" aria-label="選択肢：最小総重みと等しい別解を除いた、次の総重み"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">最小総重みと等しい別解を除いた、次</text><text text-anchor="middle" x="556" y="311">の総重み</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M636 182 V194 C636 226 920 226 920 258 V270"/><path d="M920 308 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-mst-edge-roles)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="293">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="396" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="52">質問</text><text class="node-title" x="412" y="80">全頂点をつなぐ辺について、何を求め</text><text class="node-title" x="412" y="103">ますか？</text><text class="node-explanation" x="412" y="130">同じ重みの別解と、総重みが厳密に大きい解を区別し</text><text class="node-explanation" x="412" y="148">ます。</text></g><g class="flow-node route" data-node="classify"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">各辺が最小全域木に入る条件</text><a href="/flowchartcp/flowcharts/#diagram-mst-edge-classification-conditions" data-route="mst-edge-classification-conditions"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="strict"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">最小値より厳密に重い木の条件</text><a href="/flowchartcp/flowcharts/#diagram-strict-second-mst-conditions" data-route="strict-second-mst-conditions"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">まだ確認できていない条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="499">詳細の質問・図へ →</text></a></g></svg>