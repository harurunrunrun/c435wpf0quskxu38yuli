l(#arrow-thinking-small-examples-counts)"/><g class="flow-edge-label" data-edge-label="check:yes:observation" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="1012" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1035">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 899 V936 C920 968 907 968 907 1000 V1012"/><path d="M907 1050 V1062 C907 1094 866.667 1094 866.667 1126 V1138" marker-end="url(#arrow-thinking-small-examples-counts)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1012" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1035">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 899 V936 C1000 968 1035.5 968 1035.5 1000 V1012"/><path d="M1035.5 1050 V1062 C1035.5 1094 973.333 1094 973.333 1126 V1138" marker-end="url(#arrow-thinking-small-examples-counts)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1012" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1035">わからない</text></g></g><g class="flow-node question" data-node="reason-task"><rect x="639.6666666666666" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="655.6666666666666" y="52">質問</text><text class="node-title" x="655.6666666666666" y="80">操作や解の特徴として、どれを調べた</text><text class="node-title" x="655.6666666666666" y="103">いですか？</text><text class="node-explanation" x="655.6666666666666" y="130">入力例から見える構造と、まだ示せていない主張を選</text><text class="node-explanation" x="655.6666666666666" y="148">びます。</text></g><g class="flow-node route" data-node="reference"><rect x="340" y="396" width="320" height="157" rx="7"/><text class="node-kind" x="356" y="416">分野</text><text class="node-title" x="356" y="444">小さい入力の全列挙と規則の観察</text><text class="node-explanation" x="356" y="471">全列挙で得た答えや最適解を調べ、候補となる規則を</text><text class="node-explanation" x="356" y="489">探します。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-small-input-enumeration" data-route="thinking-small-input-enumeration"><text x="356" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="count"><rect x="704" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="720" y="416">質問</text><text class="node-title" x="720" y="444">対象を列挙するより、各要素の寄与を</text><text class="node-title" x="720" y="467">数えた方が簡単ですか？</text><text class="node-explanation" x="720" y="494">どの位置・辺・値が何回答えに含まれるかを考えま</text><text class="node-explanation" x="720" y="512">す。</text></g><g class="flow-node result" data-node="contribution-result"><rect x="32" y="767" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="787">候補</text><text class="node-title" x="48" y="815">数える順序を変える</text><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="48" y="854">寄与の数え上げ</text></a></g><g class="flow-node route" data-node="reverse"><rect x="396" y="767" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="787">分野</text><text class="node-title" x="412" y="815">逆向きの操作と、局所的な選択</text><text class="node-explanation" x="412" y="842">操作を戻したときの選択肢と、局所的な選択を正当化</text><text class="node-explanation" x="412" y="860">する条件を調べます。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-reverse-choices" data-route="thinking-reverse-choices"><text x="412" y="888">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="767" width="320" height="132" rx="7"/><text class="node-kind" x="776" y="787">質問</text><text class="node-title" x="776" y="815">手で追える入力の、操作と答えを列挙</text><text class="node-title" x="776" y="838">できますか？</text><text class="node-explanation" x="776" y="865">抽象的な式を、最小の例に戻して確認します。</text></g><g class="flow-node result" data-node="observation"><rect x="396" y="1138" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1158">候補</text><text class="node-title" x="412" y="1186">小規模全探索から観察する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="412" y="1225">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="1138" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="1158">分野</text><text class="node-title" x="776" y="1186">条件を確かめる</text><text class="node-explanation" x="776" y="1213">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="1241">詳細の質問・図へ →</text></a></g></svg>