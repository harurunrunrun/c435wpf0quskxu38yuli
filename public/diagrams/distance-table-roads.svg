<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-distance-table-roads flow-desc-distance-table-roads" width="1168" height="1343" viewBox="0 0 1168 1343" data-flow-svg="distance-table-roads"><title id="flow-title-distance-table-roads">全頂点対間の距離から必要な辺を復元するの解法フローチャート</title><desc id="flow-desc-distance-table-roads">三点の距離の不等式を確認し、他の頂点を経由できる辺を除きます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-distance-table-roads" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="format:yes:triangle"><title>はい</title><path d="M584.833 182 V194 C584.833 226 612 226 612 258 V270"/><path d="M612 308 V320 C612 352 612 352 612 384 V396" marker-end="url(#arrow-distance-table-roads)"/><g class="flow-edge-label" data-edge-label="format:yes:triangle" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="572" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="293">はい</text></g></g><g class="flow-edge no" data-edge="format:no:fallback"><title>いいえ</title><path d="M504.833 182 V194 C504.833 226 72 226 72 258 V270"/><path d="M72 308 V320 C72 352 38 352 38 384 V396 V576 C38 608 38 608 38 640 V652 V702 C38 734 38 734 38 766 V778 V958 C38 990 438.5 990 438.5 1022 V1034 V1084 C438.5 1116 385.167 1116 385.167 1148 V1160" marker-end="url(#arrow-distance-table-roads)"/><g class="flow-edge-label" data-edge-label="format:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="32" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="format:unknown:check"><title>わからない</title><path d="M664.833 182 V194 C664.833 226 1070.5 226 1070.5 258 V270"/><path d="M1070.5 308 V320 C1070.5 352 1070.5 352 1070.5 384 V396 V576 C1070.5 608 1070.5 608 1070.5 640 V652 V702 C1070.5 734 1029.333 734 1029.333 766 V778" marker-end="url(#arrow-distance-table-roads)"/><g class="flow-edge-label" data-edge-label="format:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1026" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1070.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="triangle:yes:essential-result"><title>はい</title><path d="M532 564 V576 C532 608 248 608 248 640 V652"/><path d="M248 690 V702 C248 734 248 734 248 766 V778" marker-end="url(#arrow-distance-table-roads)"/><g class="flow-edge-label" data-edge-label="triangle:yes:essential-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="675">はい</text></g></g><g class="flow-edge no" data-edge="triangle:no:invalid-result"><title>いいえ</title><path d="M612 564 V576 C612 608 612 608 612 640 V652"/><path d="M612 690 V702 C612 734 612 734 612 766 V778" marker-end="url(#arrow-distance-table-roads)"/><g class="flow-edge-label" data-edge-label="triangle:no:invalid-result" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="triangle:unknown:check"><title>わからない</title><path d="M692 564 V576 C692 608 976 608 976 640 V652"/><path d="M976 690 V702 C976 734 922.667 734 922.667 766 V778" marker-end="url(#arrow-distance-table-roads)"/><g class="flow-edge-label" data-edge-label="triangle:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M896 910 V958 C896 990 528.5 990 528.5 1022 V1034"/><path d="M528.5 1072 V1084 C528.5 1116 491.833 1116 491.833 1148 V1160" marker-end="url(#arrow-distance-table-roads)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="488.5" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="528.5" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 910 V958 C976 990 963 990 963 1022 V1034"/><path d="M963 1072 V1084 C963 1116 922.667 1116 922.667 1148 V1160" marker-end="url(#arrow-distance-table-roads)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 910 V958 C1056 990 1091.5 990 1091.5 1022 V1034"/><path d="M1091.5 1072 V1084 C1091.5 1116 1029.333 1116 1029.333 1148 V1160" marker-end="url(#arrow-distance-table-roads)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1057">わからない</text></g></g><g class="flow-node question" data-node="format"><rect x="424.83333333333337" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="440.83333333333337" y="52">質問</text><text class="node-title" x="440.83333333333337" y="80">表は対称で、対角は 0、異なる二頂</text><text class="node-title" x="440.83333333333337" y="103">点間の距離は正整数ですか？</text><text class="node-explanation" x="440.83333333333337" y="130">全頂点間の道路に沿った最短距離の表を、無向の正整</text><text class="node-explanation" x="440.83333333333337" y="148">数長の道路で復元します。</text></g><g class="flow-node question" data-node="triangle"><rect x="452" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="468" y="416">質問</text><text class="node-title" x="468" y="444">全ての異なる三点で、直接の距離は第</text><text class="node-title" x="468" y="467">三点経由の距離以下ですか？</text><text class="node-explanation" x="468" y="494">D[u][v] ≤ D[u][k]+D[k]</text><text class="node-explanation" x="468" y="512">[v] を全三点で調べます。大きい値の加算のあふ</text><text class="node-explanation" x="468" y="530">れにも注意します。</text></g><g class="flow-node result" data-node="essential-result"><rect x="88" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="798">候補</text><text class="node-title" x="104" y="826">第三点を経由して等しい距離になる辺</text><text class="node-title" x="104" y="849">を除き、残る二点の距離を合計する</text><a href="/flowchartcp/techniques/distance-matrix-essential-edges/"><title>最短距離の表から道路を復元するなら、第三の頂点で等号になる辺を除くの記事へ</title><text x="104" y="888">最短距離の表から道路を復元するなら、第三の頂点</text><text x="104" y="906">で等号になる辺を除く</text></a></g><g class="flow-node result" data-node="invalid-result"><rect x="452" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="468" y="798">候補</text><text class="node-title" x="468" y="826">第三点経由で表の距離より短くなるた</text><text class="node-title" x="468" y="849">め、この距離表は復元できない</text><a href="/flowchartcp/techniques/distance-matrix-essential-edges/"><title>最短距離の表から道路を復元するなら、第三の頂点で等号になる辺を除くの記事へ</title><text x="468" y="888">最短距離の表から道路を復元するなら、第三の頂点</text><text x="468" y="906">で等号になる辺を除く</text></a></g><g class="flow-node question" data-node="check"><rect x="816" y="778" width="320" height="132" rx="7"/><text class="node-kind" x="832" y="798">質問</text><text class="node-title" x="832" y="826">必要な条件を、問題文と小さい例から</text><text class="node-title" x="832" y="849">確認できますか？</text><text class="node-explanation" x="832" y="876">辺の向き、再訪、求める量と制約を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="278.5" y="1160" width="320" height="151" rx="7"/><text class="node-kind" x="294.5" y="1180">候補</text><text class="node-title" x="294.5" y="1208">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="294.5" y="1247">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="294.5" y="1271">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1160" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="1180">分野</text><text class="node-title" x="832" y="1208">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1245">詳細の質問・図へ →</text></a></g></svg>