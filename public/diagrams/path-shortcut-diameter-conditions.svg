dge-label="one-main-shortcut:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 974 V986 C239.5 1018 192 1018 192 1050 V1062"/><path d="M192 1100 V1112 C192 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-path-shortcut-diameter-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 974 V986 C319.5 1018 319 1018 319 1050 V1062"/><path d="M319 1100 V1112 C319 1144 441.714 1144 441.714 1176 V1188" marker-end="url(#arrow-path-shortcut-diameter-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 974 V986 C399.5 1018 447.5 1018 447.5 1050 V1062"/><path d="M447.5 1100 V1112 C447.5 1144 487.429 1144 487.429 1176 V1188" marker-end="url(#arrow-path-shortcut-diameter-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1085">わからない</text></g></g><g class="flow-node question" data-node="path-one-branch"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">一本の主線の各駅に、高々一本の行き</text><text class="node-title" x="400.5" y="103">止まりの枝が付きますか？</text><text class="node-explanation" x="400.5" y="130">主線は正の長さの道で、長さ0の枝は存在しないもの</text><text class="node-explanation" x="400.5" y="148">として扱います。</text></g><g class="flow-node question" data-node="one-main-shortcut"><rect x="272.5" y="396" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">異なる二つの主駅へ長さ固定の一本を</text><text class="node-title" x="288.5" y="467">追加し、駅同士の最短距離の最大値を</text><text class="node-title" x="288.5" y="490">最小にしますか？</text><text class="node-explanation" x="288.5" y="517">隣り合う主駅も端点にできます。近道は無向で、最短</text><text class="node-explanation" x="288.5" y="535">路が必ず使う必要はありません。辺の途中の任意点は</text><text class="node-explanation" x="288.5" y="553">直径の対象にしません。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="801" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="821">質問</text><text class="node-title" x="175.5" y="849">主駅は2〜100万、主線と近道の長</text><text class="node-title" x="175.5" y="872">さは1〜10億、枝は0〜10億の整</text><text class="node-title" x="175.5" y="895">数ですか？</text><text class="node-explanation" x="175.5" y="922">近道を置く場所は主駅に限ります。枝先や辺の途中に</text><text class="node-explanation" x="175.5" y="940">は置きません。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">遠すぎる駅の組を四つの境界にまと</text><text class="node-title" x="48" y="1259">め、近道の二端点を駅の上から探す</text><a href="/flowchartcp/techniques/path-shortcut-diameter-rotated-constraints-extrema-sweep/"><title>一本道へ近道を一本足して直径を縮めるなら、遠すぎる駅の組を四つの境界にまとめるの記事へ</title><text x="48" y="1298">一本道へ近道を一本足して直径を縮めるなら、遠す</text><text x="48" y="1316">ぎる駅の組を四つの境界にまとめる</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1188" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1208">分野</text><text class="node-title" x="412" y="1236">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1273">詳細の質問・図へ →</text></a></g></svg>