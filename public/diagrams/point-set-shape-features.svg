<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-point-set-shape-features flow-desc-point-set-shape-features" width="3660" height="931" viewBox="0 0 3660 931" data-flow-svg="point-set-shape-features"><title id="flow-title-point-set-shape-features">点集合・円・平行移動・壁の解法フローチャート</title><desc id="flow-desc-point-set-shape-features">平行四辺形の個数と台形の最大重み、円の格子点と円の半径、移動の一致と移動の反復を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-point-set-shape-features" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge parallelograms" data-edge="goal:parallelograms:parallelograms-route"><title>平面の点から、正の面積の平行四辺形を数える</title><path d="M1699.091 182 V194 C1699.091 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-point-set-shape-features)"/><g class="flow-edge-label" data-edge-label="goal:parallelograms:parallelograms-route" tabindex="0" role="group" aria-label="選択肢：平面の点から、正の面積の平行四辺形を数える"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">平面の点から、正の面積の平行四辺形</text><text text-anchor="middle" x="192" y="311">を数える</text></g></g><g class="flow-edge circle-lattice" data-edge="goal:circle-lattice:circle-lattice-route"><title>小数で与えられる円の内部・円周上の整数格子点を数える</title><path d="M1728.182 182 V194 C1728.182 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-point-set-shape-features)"/><g class="flow-edge-label" data-edge-label="goal:circle-lattice:circle-lattice-route" tabindex="0" role="group" aria-label="選択肢：小数で与えられる円の内部・円周上の整数格子点を数える"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">小数で与えられる円の内部・円周上の</text><text text-anchor="middle" x="556" y="311">整数格子点を数える</text></g></g><g class="flow-edge same-points" data-edge="goal:same-points:same-points-route"><title>点集合が回転と平行移動だけで一致するか</title><path d="M1757.273 182 V194 C1757.273 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-point-set-shape-features)"/><g class="flow-edge-label" data-edge-label="goal:same-points:same-points-route" tabindex="0" role="group" aria-label="選択肢：点集合が回転と平行移動だけで一致するか"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">点集合が回転と平行移動だけで一致す</text><text text-anchor="middle" x="920" y="311">るか</text></g></g><g class="flow-edge translated-polygons" data-edge="goal:translated-polygons:translated-polygons-route"><title>同じ凸多角形を平行移動した全領域に、質問点が入るか</title><path d="M1786.364 182 V194 C1786.364 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-point-set-shape-features)"/><g class="flow-edge-label" data-edge-label="goal:translated-polygons:translated-polygons-route" tabindex="0" role="group" aria-label="選択肢：同じ凸多角形を平行移動した全領域に、質問点が入るか"><rect x="1168" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">同じ凸多角形を平行移動した全領域</text><text text-anchor="middle" x="1284" y="311">に、質問点が入るか</text></g></g><g class="flow-edge repeat-moves" data-edge="goal:repeat-moves:repeat-moves-route"><title>同じ上下左右の移動列を大量に繰り返し、訪れた格子点を数える</title><path d="M1815.455 182 V194 C1815.455 226 1648 226 1648 258 V270"/><path d="M1648 326 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-point-set-shape-features)"/><g class="flow-edge-label" data-edge-label="goal:repeat-moves:repeat-moves-route" tabindex="0" role="group" aria-label="選択肢：同じ上下左右の移動列を大量に繰り返し、訪れた格子点を数える"><rect x="1525.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="293">同じ上下左右の移動列を大量に繰り返</text><text text-anchor="middle" x="1648" y="311">し、訪れた格子点を数える</text></g></g><g class="flow-edge wall-area" data-edge="goal:wall-area:wall-area-route"><title>軸平行の線分の壁で区切られた、原点から動ける領域の面積</title><path d="M1844.545 182 V194 C1844.545 226 2012 226 2012 258 V270"/><path d="M2012 326 V338 C2012 370 2012 370 2012 402 V414" marker-end="url(#arrow-point-set-shape-features)"/><g class="flow-edge-label" data-edge-label="goal:wall-area:wall-area-route" tabindex="0" role="group" aria-label="選択肢：軸平行の線分の壁で区切られた、原点から動ける領域の面積"><rect x="1889.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="293">軸平行の線分の壁で区切られた、原点</text><text text-anchor="middle" x="2012" y="311">から動ける領域の面積</text></g></g><g class="flow-edge cover-circle" data-edge="goal:cover-circle:cover-circle-route"><title>全点を覆う円の半径を最小にし、中心は自由に選べる</title><path d="M1873.636 182 V194 C1873.636 226 2376 226 2376 258 V270"/><path d="M2376 326 V338 C2376 370 2376 370 2376 402 V414" marker-end="url(#arrow-point-set-shape-features)"/><g class="flow-edge-label" data-edge-label="goal:cover-circle:cover-circle-route" tabindex="0" role="group" aria-label="選択肢：全点を覆う円の半径を最小にし、中心は自由に選べる"><rect x="2253.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="2376" y="293">全点を覆う円の半径を最小にし、中心</text><text text-anchor="middle" x="2376" y="311">は自由に選べる</text></g></g><g class="flow-edge weighted-trapezoid" data-edge="goal:weighted-trapezoid:weighted-trapezoid-route"><title>重み付きの点から、等脚台形の四点の重み和を最大にする</title><path d="M1902.727 182 V194 C1902.727 226 2740 226 2740 258 V270"/><path d="M2740 326 V338 C2740 370 2740 370 2740 402 V414" marker-end="url(#arrow-point-set-shape-features)"/><g class="flow-edge-label" data-edge-label="goal:weighted-trapezoid:weighted-trapezoid-route" tabindex="0" role="group" aria-label="選択肢：重み付きの点から、等脚台形の四点の重み和を最大にする"><rect x="2617.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="2740" y="293">重み付きの点から、等脚台形の四点の</text><text text-anchor="middle" x="2740" y="311">重み和を最大にする</text></g></g><g class="flow-edge diagonal-square-cover" data-edge="goal:diagonal-square-cover:diagonal-square-cover-route"><title>主対角線上に角を持つ正方形を高々K個選び、全点を覆う面積を最小にする</title><path