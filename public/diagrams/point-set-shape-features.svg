="462">点集合が回転と平行移動だけで一致す</text><text class="node-title" x="776" y="485">るか</text><a href="/flowchartcp/flowcharts/#diagram-point-congruence-cyclic-signature" data-route="point-congruence-cyclic-signature"><text x="776" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="translated-polygons-route"><rect x="1124" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">同じ凸多角形を平行移動した全領域</text><text class="node-title" x="1140" y="485">に、質問点が入るか</text><a href="/flowchartcp/flowcharts/#diagram-translated-convex-halfplane-max" data-route="translated-convex-halfplane-max"><text x="1140" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="repeat-moves-route"><rect x="1488" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="434">分野</text><text class="node-title" x="1504" y="462">同じ上下左右の移動列を大量に繰り返</text><text class="node-title" x="1504" y="485">し、訪れた格子点を数える</text><a href="/flowchartcp/flowcharts/#diagram-repeated-grid-walk-orbits" data-route="repeated-grid-walk-orbits"><text x="1504" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="wall-area-route"><rect x="1852" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="434">分野</text><text class="node-title" x="1868" y="462">軸平行の線分の壁で区切られた、原点</text><text class="node-title" x="1868" y="485">から動ける領域の面積</text><a href="/flowchartcp/flowcharts/#diagram-plane-wall-compressed-cells" data-route="plane-wall-compressed-cells"><text x="1868" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="cover-circle-route"><rect x="2216" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="2232" y="434">分野</text><text class="node-title" x="2232" y="462">全点を覆う円の半径を最小にし、中心</text><text class="node-title" x="2232" y="485">は自由に選べる</text><a href="/flowchartcp/flowcharts/#diagram-disk-cover-center-intersections" data-route="disk-cover-center-in