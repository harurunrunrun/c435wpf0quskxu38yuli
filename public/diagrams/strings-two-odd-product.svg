duct)"/><g class="flow-edge-label" data-edge-label="odd:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="disjoint:yes:answer"><title>はい</title><path d="M314.167 546 V558 C314.167 590 192 590 192 622 V634"/><path d="M192 672 V684 C192 716 192 716 192 748 V760" marker-end="url(#arrow-strings-two-odd-product)"/><g class="flow-edge-label" data-edge-label="disjoint:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="657">はい</text></g></g><g class="flow-edge no" data-edge="disjoint:no:check"><title>いいえ</title><path d="M394.167 546 V558 C394.167 590 431 590 431 622 V634"/><path d="M431 672 V684 C431 716 460 716 460 748 V760" marker-end="url(#arrow-strings-two-odd-product)"/><g class="flow-edge-label" data-edge-label="disjoint:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="disjoint:unknown:check"><title>わからない</title><path d="M474.167 546 V558 C474.167 590 559.5 590 559.5 622 V634"/><path d="M559.5 672 V684 C559.5 716 524 716 524 748 V760" marker-end="url(#arrow-strings-two-odd-product)"/><g class="flow-edge-label" data-edge-label="disjoint:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-node question" data-node="odd"><rect x="376.2222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="392.2222222222223" y="52">質問</text><text class="node-title" x="392.2222222222223" y="80">固定文字列から、非空の奇数長回文を</text><text class="node-title" x="392.2222222222223" y="103">二つ選びますか？</text><text class="node-explanation" x="392.2222222222223" y="130">偶数長を許す場合は、偶数長の半径と端点情報も別に</text><text class="node-explanation" x="392.2222222222223" y="148">用意する必要があります。</text></g><g class="flow-node question" data-node="disjoint"><rect x="234.16666666666669" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="250.16666666666669" y="416">質問</text><text class="node-title" x="250.16666666666669" y="444">二つは重ならず、目的は長さの積の最</text><text class="node-title" x="250.16666666666669" y="467">大化ですか？</text><text class="node-explanation" x="250.16666666666669" y="494">間に使わない文字があっても構いません。各切れ目の</text><text class="node-explanation" x="250.16666666666669" y="512">左と右では、最長の回文を選べばよくなります。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">端点ごとの最長回文を伝え、切れ目の</text><text class="node-title" x="48" y="831">両側を組み合わせる</text><a href="/flowchartcp/techniques/palindrome-two-disjoint-product/"><title>重ならない二つの奇数長回文を、端点ごとの最長長と切れ目で組み合わせるの記事へ</title><text x="48" y="870">重ならない二つの奇数長回文を、端点ごとの最長長</text><text x="48" y="888">と切れ目で組み合わせる</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="760" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="780">分野</text><text class="node-title" x="412" y="808">前提と、求める対象を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="845">詳細の質問・図へ →</text></a></g></svg>