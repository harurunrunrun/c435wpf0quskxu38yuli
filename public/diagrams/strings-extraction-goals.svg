ult-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge substrings" data-edge="text-task:substrings:substring-route"><title>部分文字列の個数・出現・辞書順</title><path d="M559.333 182 V194 C559.333 226 141.5 226 141.5 258 V270"/><path d="M141.5 308 V338 C141.5 370 38 370 38 402 V414 V576 C38 608 94 608 94 640 V652 V702 C94 734 94 734 94 766 V778 V941 C94 973 466.5 973 466.5 1005 V1017 V1067 C466.5 1099 413.167 1099 413.167 1131 V1143" marker-end="url(#arrow-strings-extraction-goals)"/><g class="flow-edge-label" data-edge-label="text-task:substrings:substring-route" tabindex="0" role="group" aria-label="選択肢：部分文字列の個数・出現・辞書順"><rect x="32" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="141.5" y="293">部分文字列の個数・出現・辞書順</text></g></g><g class="flow-edge palindrome" data-edge="text-task:palindrome:palindrome-route"><title>回文の種類・出現・区間判定・文字の変更</title><path d="M612.667 182 V194 C612.667 226 417.5 226 417.5 258 V270"/><path d="M417.5 326 V338 C417.5 370 248 370 248 402 V414" marker-end="url(#arrow-strings-extraction-goals)"/><g class="flow-edge-label" data-edge-label="text-task:palindrome:palindrome-route" tabindex="0" role="group" aria-label="選択肢：回文の種類・出現・区間判定・文字の変更"><rect x="295" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="417.5" y="293">回文の種類・出現・区間判定・文字の</text><text text-anchor="middle" x="417.5" y="311">変更</text></g></g>