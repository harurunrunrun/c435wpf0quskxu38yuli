<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-string-palindrome flow-desc-string-palindrome" width="2204" height="926" viewBox="0 0 2204 926" data-flow-svg="string-palindrome"><title id="flow-title-string-palindrome">回文の解法フローチャート</title><desc id="flow-desc-string-palindrome">異なる回文の管理と、区間の一致判定を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-string-palindrome" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge types-growth" data-edge="distinct:types-growth:types-growth-route"><title>異なる回文の種類・末尾への追加</title><path d="M987.714 159 V171 C987.714 203 192 203 192 235 V247"/><path d="M192 285 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-string-palindrome)"/><g class="flow-edge-label" data-edge-label="distinct:types-growth:types-growth-route" tabindex="0" role="group" aria-label="選択肢：異なる回文の種類・末尾への追加"><rect x="82.5" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="192" y="270">異なる回文の種類・末尾への追加</text></g></g><g class="flow-edge fixed-queries-counts" data-edge="distinct:fixed-queries-counts:fixed-queries-counts-route"><title>固定された列の区間判定・出現総数・次数</title><path d="M1033.429 159 V171 C1033.429 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-string-palindrome)"/><g class="flow-edge-label" data-edge-label="distinct:fixed-queries-counts:fixed-queries-counts-route" tabindex="0" role="group" aria-label="選択肢：固定された列の区間判定・出現総数・次数"><rect x="433.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">固定された列の区間判定・出現総数・</text><text text-anchor="middle" x="556" y="288">次数</text></g></g><g class="flow-edge changes-erasure" data-edge="distinct:changes-erasure:changes-erasure-route"><title>一文字の変更・連続回文の削除</title><path d="M1079.143 159 V171 C1079.143 203 920 203 920 235 V247"/><path d="M920 285 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-string-palindrome)"/><g class="flow-edge-label" data-edge-label="distinct:changes-erasure:changes-erasure-route" tabindex="0" role="group" aria-label="選択肢：一文字の変更・連続回文の削除"><rect x="817" y="247" width="206" height="38" rx="5"/><text text-anchor="middle" x="920" y="270">一文字の変更・連続回文の削除</text></g></g><g class="flow-edge two-odd-product" data-edge="distinct:two-odd-product:two-odd-product-route"><title>重ならない二つの奇数長回文を選び、長さの積を最大にする</title><path d="M1124.857 159 V171 C1124.857 203 1284 203 1284 235 V247"/><path d="M1284 303 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-string-palindrome)"/><g class="flow-edge-label" data-edge-label="distinct:two-odd-product:two-odd-product-route" tabindex="0" role="group" aria-label="選択肢：重ならない二つの奇数長回文を選び、長さの積を最大にする"><rect x="1161.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="270">重ならない二つの奇数長回文を選び、</text><text text-anchor="middle" x="1284" y="288">長さの積を最大にする</text></g></g><g class="flow-edge length-frequency" data-edge="distinct:length-frequency:length-frequency-route"><title>回文を一種類選び、長さと重なりを含む出現回数の積を最大にする</title><path d="M1170.571 159 V171 C1170.571 203 1648 203 1648 235 V247"/><path d="M1648 303 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-string-palindrome)"/><g class="flow-edge-label" data-edge-label="distinct:length-frequency:length-frequency-route" tabindex="0" role="group" aria-label="選択肢：回文を一種類選び、長さと重なりを含む出現回数の積を最大にする"><rect x="1525.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="270">回文を一種類選び、長さと重なりを含</text><text text-anchor="middle" x="1648" y="288">む出現回数の積を最大にする</text></g></g><g class="flow-edge unknown" data-edge="distinct:unknown:check"><title>わからない</title><path d="M1216.286 159 V171 C1216.286 203 2012 203 2012 235 V247"/><path d="M2012 285 V315 C2012 347 2012 347 2012 379 V391" marker-end="url(#arrow-string-palindrome)"/><g class="flow-edge-label" data-edge-label="distinct:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1967.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="2012" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:eertree"><title>はい</title><path d="M1932 541 V553 C1932 585 1648 585 1648 617 V629"/><path d="M1648 667 V679 C1648 711 1648 711 1648 743 V755" marker-end="url(#arrow-string-palindrome)"/><g class="flow-edge-label" data-edge-label="check:yes:eertree" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1608" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1648" y="652">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2012 541 V553 C2012 585 1999 585 1999 617 V629"/><path d="M1999 667 V679 C1999 711 1958.667 711 1958.667 743 V755" marker-end="url(#arrow-string-palindrome)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1959" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1999" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2092 541 V553 C2092 585 2127.5 585 2127.5 617 V629"/><path d="M2127.5 667 V679 C2127.5 711 2065.333 711 2065.333 743 V755" marker-end="url(#arrow-string-palindrome)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2083" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="2127.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="distinct"><rect x="942" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="958" y="52">質問</text><text class="node-title" x="958" y="80">回文について何を求めますか？</text><text class="node-explanation" x="958" y="107">種類数、末尾追加、固定区間の判定、出現の総数を分</text><text class="node-explanation" x="958" y="125">けます。</text></g><g class="flow-node question" data-node="check"><rect x="1852" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="1868" y="411">質問</text><text class="node-title" x="1868" y="439">区別したい対象は、回文の文字列の種</text><text class="node-title" x="1868" y="462">類ですか？</text><text class="node-explanation" x="1868" y="489">種類と出現回数を混同せず、回文木で何を集計するか</text><text class="node-explanation" x="1868" y="507">を決めます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1852" y="755" width="320" height="139" rx="7"/><text class="node-kind" x="1868" y="775">分野</text><text class="node-title" x="1868" y="803">条件を確かめる</text><text class="node-explanation" x="1868" y="830">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1868" y="858">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="eertree"><rect x="1488" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="1504" y="775">候補</text><text class="node-title" x="1504" y="803">回文木</text><a href="/flowchartcp/techniques/palindromic-tree/"><title>回文木の記事へ</title><text x="1504" y="842">回文木</text></a></g><g class="flow-node route" data-node="types-growth-route"><rect x="32" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">回文の種類と末尾への追加</text><a href="/flowchartcp/flowcharts/#diagram-string-palindrome-type-growth" data-route="string-palindrome-type-growth"><text x="48" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="fixed-queries-counts-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">固定された列の回文判定と出現数</text><a href="/flowchartcp/flowcharts/#diagram-string-palindrome-static-counts" data-route="string-palindrome-static-counts"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="changes-erasure-route"><rect x="760" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">文字の変更と回文の削除</text><a href="/flowchartcp/flowcharts/#diagram-string-palindrome-change-goals" data-route="string-palindrome-change-goals"><text x="776" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="two-odd-product-route"><rect x="1124" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">重ならない二つの奇数長回文を選び、</text><text class="node-title" x="1140" y="462">長さの積を最大にする</text><a href="/flowchartcp/flowcharts/#diagram-strings-two-odd-product" data-route="strings-two-odd-product"><text x="1140" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="length-frequency-route"><rect x="1488" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">回文を一種類選び、長さと重なりを含</text><text class="node-title" x="1504" y="462">む出現回数の積を最大にする</text><a href="/flowchartcp/flowcharts/#diagram-palindrome-length-frequency-conditions" data-route="palindrome-length-frequency-conditions"><text x="1504" y="499">詳細の質問・図へ →</text></a></g></svg>