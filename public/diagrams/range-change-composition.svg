<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-change-composition flow-desc-range-change-composition" width="1168" height="1295" viewBox="0 0 1168 1295" data-flow-svg="range-change-composition"><title id="flow-title-range-change-composition">区間情報への反映と、変更の合成の解法フローチャート</title><desc id="flow-desc-range-change-composition">区間全体への変更を集計値へ反映できるか、変更をまとめてから値を復元すれば足りるかを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-change-composition" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="action:yes:lazy"><title>はい</title><path d="M504.833 182 V194 C504.833 226 72 226 72 258 V270"/><path d="M72 308 V320 C72 352 38 352 38 384 V396 V558 C38 590 38 590 38 622 V634 V684 C38 716 38 716 38 748 V760 V922 C38 954 438.5 954 438.5 986 V998 V1048 C438.5 1080 385.167 1080 385.167 1112 V1124" marker-end="url(#arrow-range-change-composition)"/><g class="flow-edge-label" data-edge-label="action:yes:lazy" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="32" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="293">はい</text></g></g><g class="flow-edge no" data-edge="action:no:offline"><title>いいえ</title><path d="M584.833 182 V194 C584.833 226 612 226 612 258 V270"/><path d="M612 308 V320 C612 352 612 352 612 384 V396" marker-end="url(#arrow-range-change-composition)"/><g class="flow-edge-label" data-edge-label="action:no:offline" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="action:unknown:check"><title>わからない</title><path d="M664.833 182 V194 C664.833 226 1070.5 226 1070.5 258 V270"/><path d="M1070.5 308 V320 C1070.5 352 1070.5 352 1070.5 384 V396 V558 C1070.5 590 1070.5 590 1070.5 622 V634 V684 C1070.5 716 1029.333 716 1029.333 748 V760" marker-end="url(#arrow-range-change-composition)"/><g class="flow-edge-label" data-edge-label="action:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1026" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1070.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="offline:yes:difference"><title>はい</title><path d="M532 546 V558 C532 590 248 590 248 622 V634"/><path d="M248 672 V684 C248 716 248 716 248 748 V760" marker-end="url(#arrow-range-change-composition)"/><g class="flow-edge-label" data-edge-label="offline:yes:difference" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="657">はい</text></g></g><g class="flow-edge no" data-edge="offline:no:fallback"><title>いいえ</title><path d="M612 546 V558 C612 590 612 590 612 622 V634"/><path d="M612 672 V684 C612 716 612 716 612 748 V760" marker-end="url(#arrow-range-change-composition)"/><g class="flow-edge-label" data-edge-label="offline:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="offline:unknown:check"><title>わからない</title><path d="M692 546 V558 C692 590 976 590 976 622 V634"/><path d="M976 672 V684 C976 716 922.667 716 922.667 748 V760" marker-end="url(#arrow-range-change-composition)"/><g class="flow-edge-label" data-edge-label="offline:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:lazy"><title>はい</title><path d="M896 910 V922 C896 954 528.5 954 528.5 986 V998"/><path d="M528.5 1036 V1048 C528.5 1080 491.833 1080 491.833 1112 V1124" marker-end="url(#arrow-range-change-composition)"/><g class="flow-edge-label" data-edge-label="check:yes:lazy" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="488.5" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="528.5" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 910 V922 C976 954 963 954 963 986 V998"/><path d="M963 1036 V1048 C963 1080 922.667 1080 922.667 1112 V1124" marker-end="url(#arrow-range-change-composition)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 910 V922 C1056 954 1091.5 954 1091.5 986 V998"/><path d="M1091.5 1036 V1048 C1091.5 1080 1029.333 1080 1029.333 1112 V1124" marker-end="url(#arrow-range-change-composition)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1021">わからない</text></g></g><g class="flow-node question" data-node="action"><rect x="424.83333333333337" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="440.83333333333337" y="52">質問</text><text class="node-title" x="440.83333333333337" y="80">更新後の区間情報を一括で計算でき、</text><text class="node-title" x="440.83333333333337" y="103">更新の合成もできますか？</text><text class="node-explanation" x="440.83333333333337" y="130">区間加算・代入なら和と長さを保持します。代入と加</text><text class="node-explanation" x="440.83333333333337" y="148">算を混ぜる場合は合成の順序を定義します。</text></g><g class="flow-node question" data-node="offline"><rect x="452" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="468" y="416">質問</text><text class="node-title" x="468" y="444">すべての更新後の配列だけを使います</text><text class="node-title" x="468" y="467">か？</text><text class="node-explanation" x="468" y="494">途中の問い合わせがない区間加算なら、更新を差分と</text><text class="node-explanation" x="468" y="512">して貯められます。</text></g><g class="flow-node question" data-node="check"><rect x="816" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="832" y="780">質問</text><text class="node-title" x="832" y="808">区間への代入・加算を、区間和と長さ</text><text class="node-title" x="832" y="831">から一括で反映できますか？</text><text class="node-explanation" x="832" y="858">sum と length を持ち、写像が結合を保</text><text class="node-explanation" x="832" y="876">つこと、タグの合成を定義できることを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1124" width="320" height="139" rx="7"/><text class="node-kind" x="832" y="1144">分野</text><text class="node-title" x="832" y="1172">条件を確かめる</text><text class="node-explanation" x="832" y="1199">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1227">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="lazy"><rect x="278.5" y="1124" width="320" height="127" rx="7"/><text class="node-kind" x="294.5" y="1144">候補</text><text class="node-title" x="294.5" y="1172">遅延セグメント木</text><a href="/flowchartcp/techniques/lazy-segment-tree/"><title>遅延セグメント木の記事へ</title><text x="294.5" y="1211">遅延セグメント木</text></a></g><g class="flow-node result" data-node="difference"><rect x="88" y="760" width="320" height="127" rx="7"/><text class="node-kind" x="104" y="780">候補</text><text class="node-title" x="104" y="808">差分配列</text><a href="/flowchartcp/techniques/difference-array/"><title>いもす法の記事へ</title><text x="104" y="847">いもす法</text></a></g><g class="flow-node result" data-node="fallback"><rect x="452" y="760" width="320" height="127" rx="7"/><text class="node-kind" x="468" y="780">候補</text><text class="node-title" x="468" y="808">保持する区間情報を増やす</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="468" y="847">状態の設計</text></a></g></svg>