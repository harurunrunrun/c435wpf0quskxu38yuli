<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-string-substring flow-desc-string-substring" width="2204" height="949" viewBox="0 0 2204 949" data-flow-svg="string-substring"><title id="flow-title-string-substring">部分文字列の解法フローチャート</title><desc id="flow-desc-string-substring">辞書順、出現回数、追加処理の必要性を調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-string-substring" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge order-processing" data-edge="append:order-processing:order-processing-route"><title>追加・辞書順・巡回シフト</title><path d="M987.714 182 V194 C987.714 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-string-substring)"/><g class="flow-edge-label" data-edge-label="append:order-processing:order-processing-route" tabindex="0" role="group" aria-label="選択肢：追加・辞書順・巡回シフト"><rect x="102" y="270" width="180" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">追加・辞書順・巡回シフト</text></g></g><g class="flow-edge distinct-repeats" data-edge="append:distinct-repeats:distinct-repeats-route"><title>種類数・長さ別の個数・繰り返す列</title><path d="M1033.429 182 V194 C1033.429 226 556 226 556 258 V270"/><path d="M556 308 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-string-substring)"/><g class="flow-edge-label" data-edge-label="append:distinct-repeats:distinct-repeats-route" tabindex="0" role="group" aria-label="選択肢：種類数・長さ別の個数・繰り返す列"><rect x="440" y="270" width="232" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">種類数・長さ別の個数・繰り返す列</text></g></g><g class="flow-edge position-aggregates" data-edge="append:position-aggregates:position-aggregates-route"><title>全区間の文字数・可除性・一致長の総和</title><path d="M1079.143 182 V194 C1079.143 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-string-substring)"/><g class="flow-edge-label" data-edge-label="append:position-aggregates:position-aggregates-route" tabindex="0" role="group" aria-label="選択肢：全区間の文字数・可除性・一致長の総和"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">全区間の文字数・可除性・一致長の総</text><text text-anchor="middle" x="920" y="311">和</text></g></g><g class="flow-edge common-all" data-edge="append:common-all:common-all-route"><title>複数の文字列の全てに現れる、最長の連続部分を求める</title><path d="M1124.857 182 V194 C1124.857 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-string-substring)"/><g class="flow-edge-label" data-edge-label="append:common-all:common-all-route" tabindex="0" role="group" aria-label="選択肢：複数の文字列の全てに現れる、最長の連続部分を求める"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">複数の文字列の全てに現れる、最長の</text><text text-anchor="middle" x="1284" y="311">連続部分を求める</text></g></g><g class="flow-edge unique-common" data-edge="append:unique-common:unique-common-route"><title>二つの本文に、それぞれ一回だけ現れる最短の連続部分</title><path d="M1170.571 182 V194 C1170.571 226 1648 226 1648 258 V270"/><path d="M1648 326 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-string-substring)"/><g class="flow-edge-label" data-edge-label="append:unique-common:unique-common-route" tabindex="0" role="group" aria-label="選択肢：二つの本文に、それぞれ一回だけ現れる最短の連続部分"><rect x="1525.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="293">二つの本文に、それぞれ一回だけ現れ</text><text text-anchor="middle" x="1648" y="311">る最短の連続部分</text></g></g><g class="flow-edge unknown" data-edge="append:unknown:check"><title>わからない</title><path d="M1216.286 182 V194 C1216.286 226 2012 226 2012 258 V270"/><path d="M2012 308 V338 C2012 370 2012 370 2012 402 V414" marker-end="url(#arrow-string-substring)"/><g class="flow-edge-label" data-edge-label="append:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1967.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="2012" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:sam"><title>はい</title><path d="M1932 564 V576 C1932 608 1648 608 1648 640 V652"/><path d="M1648 690 V702 C1648 734 1648 734 1648 766 V778" marker-end="url(#arrow-string-substring)"/><g class="flow-edge-label" data-edge-label="check:yes:sam" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1608" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1648" y="675">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2012 564 V576 C2012 608 1999 608 1999 640 V652"/><path d="M1999 690 V702 C1999 734 1958.667 734 1958.667 766 V778" marker-end="url(#arrow-string-substring)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1959" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1999" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2092 564 V576 C2092 608 2127.5 608 2127.5 640 V652"/><path d="M2127.5 690 V702 C2127.5 734 2065.333 734 2065.333 766 V778" marker-end="url(#arrow-string-substring)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2083" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="2127.5" y="675">わからない</text></g></g><g class="flow-node question" data-node="append"><rect x="942" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="958" y="52">質問</text><text class="node-title" x="958" y="80">部分文字列について必要な処理はどれ</text><text class="node-title" x="958" y="103">ですか？</text><text class="node-explanation" x="958" y="130">末尾追加、静的な種類数、反復、巡回シフトを分けま</text><text class="node-explanation" x="958" y="148">す。</text></g><g class="flow-node question" data-node="check"><rect x="1852" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1868" y="434">質問</text><text class="node-title" x="1868" y="462">二つの部分文字列が同じとき、出現位</text><text class="node-title" x="1868" y="485">置や後続の扱いも共通ですか？</text><text class="node-explanation" x="1868" y="512">何を一状態にまとめるかを確認し、必要なら出現集合</text><text class="node-explanation" x="1868" y="530">の同値性を使います。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1852" y="778" width="320" height="139" rx="7"/><text class="node-kind" x="1868" y="798">分野</text><text class="node-title" x="1868" y="826">条件を確かめる</text><text class="node-explanation" x="1868" y="853">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1868" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="sam"><rect x="1488" y="778" width="320" height="127" rx="7"/><text class="node-kind" x="1504" y="798">候補</text><text class="node-title" x="1504" y="826">接尾辞オートマトン</text><a href="/flowchartcp/techniques/suffix-automaton/"><title>接尾辞オートマトンの記事へ</title><text x="1504" y="865">接尾辞オートマトン</text></a></g><g class="flow-node route" data-node="order-processing-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">部分文字列の追加と順序</text><a href="/flowchartcp/flowcharts/#diagram-string-substring-order-goals" data-route="string-substring-order-goals"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="distinct-repeats-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">部分文字列の種類と繰り返し</text><a href="/flowchartcp/flowcharts/#diagram-string-substring-distinct-goals" data-route="string-substring-distinct-goals"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="position-aggregates-route"><rect x="760" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">全区間の文字数・可除性・一致長の総</text><text class="node-title" x="776" y="485">和</text><a href="/flowchartcp/flowcharts/#diagram-string-substring-aggregate-goals" data-route="string-substring-aggregate-goals"><text x="776" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="common-all-route"><rect x="1124" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">複数の文字列の全てに現れる、最長の</text><text class="node-title" x="1140" y="485">連続部分を求める</text><a href="/flowchartcp/flowcharts/#diagram-strings-common-all" data-route="strings-common-all"><text x="1140" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="unique-common-route"><rect x="1488" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="434">分野</text><text class="node-title" x="1504" y="462">二つの本文に、それぞれ一回だけ現れ</text><text class="node-title" x="1504" y="485">る最短の連続部分</text><a href="/flowchartcp/flowcharts/#diagram-shortest-common-unique-conditions" data-route="shortest-common-unique-conditions"><text x="1504" y="522">詳細の質問・図へ →</text></a></g></svg>