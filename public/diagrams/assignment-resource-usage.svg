<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-assignment-resource-usage flow-desc-assignment-resource-usage" width="1112" height="1678" viewBox="0 0 1112 1678" data-flow-svg="assignment-resource-usage"><title id="flow-title-assignment-resource-usage">対象の使用回数と二つへの分割の解法フローチャート</title><desc id="flow-desc-assignment-resource-usage">一対一の対応か、回数に上限のある割当か、二つの側への分割かを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-assignment-resource-usage" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="bipartite:yes:matching-result"><title>はい</title><path d="M719.833 164 V176 C719.833 208 500 208 500 240 V252"/><path d="M500 290 V302 C500 334 500 334 500 366 V378" marker-end="url(#arrow-assignment-resource-usage)"/><g class="flow-edge-label" data-edge-label="bipartite:yes:matching-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="460" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="500" y="275">はい</text></g></g><g class="flow-edge no" data-edge="bipartite:no:capacity"><title>いいえ</title><path d="M799.833 164 V176 C799.833 208 864 208 864 240 V252"/><path d="M864 290 V302 C864 334 864 334 864 366 V378" marker-end="url(#arrow-assignment-resource-usage)"/><g class="flow-edge-label" data-edge-label="bipartite:no:capacity" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="824" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="864" y="275">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bipartite:unknown:check"><title>わからない</title><path d="M879.833 164 V176 C879.833 208 1035.5 208 1035.5 240 V252"/><path d="M1035.5 290 V302 C1035.5 334 1074 334 1074 366 V378 V541 C1074 573 1074 573 1074 605 V617 V667 C1074 699 1074 699 1074 731 V743 V906 C1074 938 1074 938 1074 970 V982 V1032 C1074 1064 1074 1064 1074 1096