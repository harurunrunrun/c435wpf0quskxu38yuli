k"><title>いいえ</title><path d="M752 1258 V1270 C752 1302 556 1302 556 1334 V1346"/><path d="M556 1384 V1396 C556 1428 556 1428 556 1460 V1472" marker-end="url(#arrow-assignment-resource-usage)"/><g class="flow-edge-label" data-edge-label="nonbipartite:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1346" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1369">いいえ</text></g></g><g class="flow-edge unknown" data-edge="nonbipartite:unknown:check"><title>わからない</title><path d="M832 1258 V1270 C832 1302 867.5 1302 867.5 1334 V1346"/><path d="M867.5 1384 V1396 C867.5 1428 824 1428 824 1460 V1472" marker-end="url(#arrow-assignment-resource-usage)"/><g class="flow-edge-label" data-edge-label="nonbipartite:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="823" y="1346" width="89" height="38" rx="5"/><text text-anchor="middle" x="867.5" y="1369">わからない</text></g></g><g class="flow-node question" data-node="bipartite"><rect x="639.8333333333334" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="655.8333333333334" y="52">質問</text><text class="node-title" x="655.8333333333334" y="80">二つの集合の間で、一対一の対応を選</text><text class="node-title" x="655.8333333333334" y="103">びますか？</text><text class="node-explanation" x="655.8333333333334" y="130">各要素を高々一回使う二部マッチングか確認します。</text></g><g class="flow-node question" data-node="capacity"><rect x="704" y="378" width="320" height="150" rx="7"/><text class="node-kind" x="720" y="398">質問</text><text class="node-title" x="720" y="426">各頂点・辺の使用回数を容量で制限で</text><text class="node-title" x="720" y="449">きますか？</text><text class="node-explanation" x="720" y="476">頂点容量は頂点を入口と出口に分けて表せることがあ</text><text class="node-explanation" x="720" y="494">ります。</text></g><g class="flow-node question" data-node="cut"><rect x="648" y="743" width="320" height="150" rx="7"/><text class="node-kind" x="664" y="763">質問</text><text class="node-title" x="664" y="791">二つの側へ分けるコストを、境界の辺</text><text class="node-title" x="664" y="814">の容量として表せますか？</text><text class="node-explanation" x="664" y="841">選択肢を二値にし、元の目的値とカットの値が一致す</text><text class="node-explanation" x="664" y="859">るか確認します。</text></g><g class="flow-node question" data-node="nonbipartite"><rect x="592" y="1108" width="320" height="150" rx="7"/><text class="node-kind" x="608" y="1128">質問</text><text class="node-title" x="608" y="1156">二部でないグラフの一対一対応です</text><text class="node-title" x="608" y="1179">か？</text><text class="node-explanation" x="608" y="1206">一般グラフのマッチングを、通常の二部マッチング用</text><text class="node-explanation" x="608" y="1224">フローへそのまま変換しないようにします。</text></g><g class="flow-node route" data-node="check"><rect x="760" y="1472" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="1492">分野</text><text class="node-title" x="776" y="1520">合法な割当と数量の対応</text><a href="/flowchartcp/flowcharts/#diagram-assignment-integer-representation" data-route="assignment-integer-representation"><text x="776" y="1557">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="matching-result"><rect x="340" y="378" width="320" height="151" rx="7"/><text class="node-kind" x="356" y="398">候補</text><text class="node-title" x="356" y="426">二部マッチング</text><a href="/flowchartcp/techniques/matching/"><title>二部マッチングの記事へ</title><text x="356" y="465">二部マッチング</text></a><a href="/flowchartcp/techniques/max-flow/"><title>最大流・最小カットの記事へ</title><text x="356" y="489">最大流・最小カット</text></a></g><g class="flow-node result" data-node="maxflow"><rect x="284" y="743" width="320" height="151" rx="7"/><text class="node-kind" x="300" y="763">候補</text><text class="node-title" x="300" y="791">最大流</text><a href="/flowchartcp/techniques/max-flow/"><title>最大流・最小カットの記事へ</title><text x="300" y="830">最大流・最小カット</text></a><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="300" y="854">グラフへの帰着</text></a></g><g class="flow-node result" data-node="mincut"><rect x="228" y="1108" width="320" height="127" rx="7"/><text class="node-kind" x="244" y="1128">候補</text><text class="node-title" x="244" y="1156">最小カット</text><a href="/flowchartcp/techniques/max-flow/"><title>最大流・最小カットの記事へ</title><text x="244" y="1195">最大流・最小カット</text></a></g><g class="flow-node result" data-node="matching-general"><rect x="32" y="1472" width="320" height="174" rx="7"/><text class="node-kind" x="48" y="1492">候補</text><text class="node-title" x="48" y="1520">一般グラフのマッチングの条件を確認</text><text class="node-title" x="48" y="1543">する</text><a href="/flowchartcp/techniques/matching/"><title>二部マッチングの記事へ</title><text x="48" y="1582">二部マッチング</text></a><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="48" y="1606">グラフへの帰着</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1472" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1492">候補</text><text class="node-title" x="412" y="1520">制約と目的値の対応を作る</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="412" y="1559">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1583">反例探し</text></a></g></svg>