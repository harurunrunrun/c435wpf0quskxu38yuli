<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-slash-balanced-subsequence flow-desc-slash-balanced-subsequence" width="1112" height="1718" viewBox="0 0 1112 1718" data-flow-svg="slash-balanced-subsequence"><title id="flow-title-slash-balanced-subsequence">中央のスラッシュを動かし、左の 1 と右の 2 が釣り合う位置を探すの解法フローチャート</title><desc id="flow-desc-slash-balanced-subsequence">左右の個数の一致、スラッシュ一個、部分列として飛ばせることを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-slash-balanced-subsequence" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge balanced-slash" data-edge="model:balanced-slash:goal"><title>1 を k 個、スラッシュ一つ、2 を同じ k 個、この順に取る</title><path d="M597 182 V194 C597 226 298.5 226 298.5 258 V270"/><path d="M298.5 326 V338 C298.5 370 702.556 370 702.556 402 V414" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="model:balanced-slash:goal" tabindex="0" role="group" aria-label="選択肢：1 を k 個、スラッシュ一つ、2 を同じ k 個、この順に取る"><rect x="176" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="298.5" y="293">1 を k 個、スラッシュ一つ、2</text><text text-anchor="middle" x="298.5" y="311"> を同じ k 個、この順に取る</text></g></g><g class="flow-edge contiguous" data-edge="model:contiguous:fallback"><title>1 の列・スラッシュ・2 の列が、元の区間で連続する必要がある</title><path d="M661 182 V194 C661 226 587.5 226 587.5 258 V270"/><path d="M587.5 326 V338 C587.5 370 962 370 962 402 V414 V576 C962 608 962 608 962 640 V652 V702 C962 734 962 734 962 766 V778 V981 C962 1013 962 1013 962 1045 V1057 V1107 C962 1139 588 1139 588 1171 V1183" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="model:contiguous:fallback" tabindex="0" role="group" aria-label="選択肢：1 の列・スラッシュ・2 の列が、元の区間で連続する必要がある"><rect x="465" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="587.5" y="293">1 の列・スラッシュ・2 の列が、</text><text text-anchor="middle" x="587.5" y="311">元の区間で連続する必要がある</text></g></g><g class="flow-edge unequal-sides" data-edge="model:unequal-sides:fallback"><title>左右の文字数は異なってよい</title><path d="M725 182 V194 C725 226 850.5 226 850.5 258 V270"/><path d="M850.5 308 V338 C850.5 370 1018 370 1018 402 V414 V576 C1018 608 1018 608 1018 640 V652 V702 C1018 734 1018 734 1018 766 V778 V981 C1018 1013 1018 1013 1018 1045 V1057 V1107 C1018 1139 652 1139 652 1171 V1183" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="model:unequal-sides:fallback" tabindex="0" role="group" aria-label="選択肢：左右の文字数は異なってよい"><rect x="754" y="270" width="193" height="38" rx="5"/><text text-anchor="middle" x="850.5" y="293">左右の文字数は異なってよい</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M789 182 V194 C789 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V576 C1074 608 1074 608 1074 640 V652 V702 C1074 734 1074 734 1074 766 V778 V981 C1074 1013 1074 1013 1074 1045 V1057 V1107 C1074 1139 1000 1139 1000 1171 V1183" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="goal:yes:guard"><title>はい</title><path d="M622.556 564 V576 C622.556 608 501.167 608 501.167 640 V652"/><path d="M501.167 690 V702 C501.167 734 501.167 734 501.167 766 V778" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="goal:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="461.1666666666667" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="501.1666666666667" y="675">はい</text></g></g><g class="flow-edge no" data-edge="goal:no:fallback"><title>いいえ</title><path d="M702.556 564 V576 C702.556 608 739 608 739 640 V652"/><path d="M739 690 V702 C739 734 850 734 850 766 V778 V981 C850 1013 850 1013 850 1045 V1057 V1107 C850 1139 524 1139 524 1171 V1183" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="goal:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="699" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="739" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M782.556 564 V576 C782.556 608 867.5 608 867.5 640 V652"/><path d="M867.5 690 V702 C867.5 734 906 734 906 766 V778 V981 C906 1013 906 1013 906 1045 V1057 V1107 C906 1139 920 1139 920 1171 V1183" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="823" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="867.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M421.167 969 V981 C421.167 1013 192 1013 192 1045 V1057"/><path d="M192 1095 V1107 C192 1139 192 1139 192 1171 V1183" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M501.167 969 V981 C501.167 1013 556 1013 556 1045 V1057"/><path d="M556 1095 V1107 C556 1139 460 1139 460 1171 V1183" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M581.167 969 V981 C581.167 1013 755.5 1013 755.5 1045 V1057"/><path d="M755.5 1095 V1107 C755.5 1139 840 1139 840 1171 V1183" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1080">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1333 V1363 C840 1395 783 1395 783 1427 V1439"/><path d="M783 1477 V1489 C783 1521 828.5 1521 828.5 1553 V1565" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1462">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1333 V1363 C920 1395 907 1395 907 1427 V1439"/><path d="M907 1477 V1489 C907 1521 908.5 1521 908.5 1553 V1565" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1462">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1333 V1363 C1000 1395 1035.5 1395 1035.5 1427 V1439"/><path d="M1035.5 1477 V1489 C1035.5 1521 988.5 1521 988.5 1553 V1565" marker-end="url(#arrow-slash-balanced-subsequence)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1439" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1462">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="533" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="549" y="52">質問</text><text class="node-title" x="549" y="80">指定区間から取り出す列の形はどれで</text><text class="node-title" x="549" y="103">すか？</text><text class="node-explanation" x="549" y="130">左右の個数の一致、スラッシュ一個、部分列として飛</text><text class="node-explanation" x="549" y="148">ばせることを確認します。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="558.5555555555557" y="434">質問</text><text class="node-title" x="558.5555555555557" y="462">本文は固定され、残す位置を飛ばして</text><text class="node-title" x="558.5555555555557" y="485">もよく、k=0 も許されますか？</text><text class="node-explanation" x="558.5555555555557" y="512">中央のスラッシュを一つ固定すれば、左右で使える文</text><text class="node-explanation" x="558.5555555555557" y="530">字数の小さい方が k の最大値です。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="778" width="320" height="191" rx="7"/><text class="node-kind" x="357.1666666666667" y="798">質問</text><text class="node-title" x="357.1666666666667" y="826">中央を右へ動かすと、左の 1 の個</text><text class="node-title" x="357.1666666666667" y="849">数は減らず、右の 2 の個数は増え</text><text class="node-title" x="357.1666666666667" y="872">ませんか？</text><text class="node-explanation" x="357.1666666666667" y="899">二数の大小が入れ替わる境界と、その前後のスラッ</text><text class="node-explanation" x="357.1666666666667" y="917">シュだけを比べます。文字の位置を部分列として選ぶ</text><text class="node-explanation" x="357.1666666666667" y="935">ため、間の別の文字は無視できます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">中央のスラッシュを動かし、左の 1</text><text class="node-title" x="48" y="1254"> と右の 2 が釣り合う位置を探す</text><a href="/flowchartcp/techniques/slash-subsequence-crossing/"><title>同数の1と2を一つの区切りの前後から選ぶ区間質問は、左右の個数が交差する場所を探すの記事へ</title><text x="48" y="1293">同数の1と2を一つの区切りの前後から選ぶ区間質</text><text x="48" y="1311">問は、左右の個数が交差する場所を探す</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1203">候補</text><text class="node-title" x="412" y="1231">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1270">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1294">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1183" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1203">質問</text><text class="node-title" x="776" y="1231">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1254">書き出せますか？</text><text class="node-explanation" x="776" y="1281">左右の個数の一致、スラッシュ一個、部分列として飛</text><text class="node-explanation" x="776" y="1299">ばせることを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1565" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1585">分野</text><text class="node-title" x="764.5" y="1613">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1650">詳細の質問・図へ →</text></a></g></svg>