<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-unique-initial-prefix-oracle-conditions flow-desc-unique-initial-prefix-oracle-conditions" width="748" height="1383" viewBox="0 0 748 1383" data-flow-svg="unique-initial-prefix-oracle-conditions"><title id="flow-title-unique-initial-prefix-oracle-conditions">先頭の文字を目印にする連結質問の解法フローチャート</title><desc id="flow-desc-unique-initial-prefix-oracle-conditions">返答の意味、先頭の文字の一意性、質問の予算を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-unique-initial-prefix-oracle-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="prefix-oracle:yes:unique-initial"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-unique-initial-prefix-oracle-conditions)"/><g class="flow-edge-label" data-edge-label="prefix-oracle:yes:unique-initial" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="prefix-oracle:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V594 C654 626 654 626 654 658 V670 V720 C654 752 654 752 654 784 V796 V981 C654 1013 654 1013 654 1045 V1057 V1107 C654 1139 624.571 1139 624.571 1171 V1183" marker-end="url(#arrow-unique-initial-prefix-oracle-conditions)"/><g class="flow-edge-label" data-edge-label="prefix-oracle:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="prefix-oracle:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V594 C710 626 710 626 710 658 V670 V720 C710 752 710 752 710 784 V796 V981 C710 1013 710 1013 710 1045 V1057 V1107 C710 1139 670.286 1139 670.286 1171 V1183" marker-end="url(#arrow-unique-initial-prefix-oracle-conditions)"/><g class="flow-edge-label" data-edge-label="prefix-oracle:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="unique-initial:yes:query-budget"><title>はい</title><path d="M352.5 582 V594 C352.5 626 307 626 307 658 V670"/><path d="M307 708 V720 C307 752 319.5 752 319.5 784 V796" marker-end="url(#arrow-unique-initial-prefix-oracle-conditions)"/><g class="flow-edge-label" data-edge-label="unique-initial:yes:query-budget" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="693">はい</text></g></g><g class="flow-edge no" data-edge="unique-initial:no:check"><title>いいえ</title><path d="M432.5 582 V594 C432.5 626 431 626 431 658 V670"/><path d="M431 708 V720 C431 752 542 752 542 784 V796 V981 C542 1013 542 1013 542 1045 V1057 V1107 C542 1139 533.143 1139 533.143 1171 V1183" marker-end="url(#arrow-unique-initial-prefix-oracle-conditions)"/><g class="flow-edge-label" data-edge-label="unique-initial:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="unique-initial:unknown:check"><title>わからない</title><path d="M512.5 582 V594 C512.5 626 559.5 626 559.5 658 V670"/><path d="M559.5 708 V720 C559.5 752 598 752 598 784 V796 V981 C598 1013 598 1013 598 1045 V1057 V1107 C598 1139 578.857 1139 578.857 1171 V1183" marker-end="url(#arrow-unique-initial-prefix-oracle-conditions)"/><g class="flow-edge-label" data-edge-label="unique-initial:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="query-budget:yes:result"><title>はい</title><path d="M239.5 969 V981 C239.5 1013 192 1013 192 1045 V1057"/><path d="M192 1095 V1107 C192 1139 192 1139 192 1171 V1183" marker-end="url(#arrow-unique-initial-prefix-oracle-conditions)"/><g class="flow-edge-label" data-edge-label="query-budget:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="query-budget:no:check"><title>いいえ</title><path d="M319.5 969 V981 C319.5 1013 319 1013 319 1045 V1057"/><path d="M319 1095 V1107 C319 1139 441.714 1139 441.714 1171 V1183" marker-end="url(#arrow-unique-initial-prefix-oracle-conditions)"/><g class="flow-edge-label" data-edge-label="query-budget:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="query-budget:unknown:check"><title>わからない</title><path d="M399.5 969 V981 C399.5 1013 447.5 1013 447.5 1045 V1057"/><path d="M447.5 1095 V1107 C447.5 1139 487.429 1139 487.429 1171 V1183" marker-end="url(#arrow-unique-initial-prefix-oracle-conditions)"/><g class="flow-edge-label" data-edge-label="query-budget:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="prefix-oracle"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">返答は、未知列の接頭辞が質問内に現</text><text class="node-title" x="400.5" y="103">れる最大の長さですか？</text><text class="node-explanation" x="400.5" y="130">未知列は四種類の文字からなり、長さは既知で、質問</text><text class="node-explanation" x="400.5" y="148">を始める前から固定されています。連続する部分文字</text><text class="node-explanation" x="400.5" y="166">列としての出現を使います。</text></g><g class="flow-node question" data-node="unique-initial"><rect x="272.5" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">未知列の先頭の文字は、その後に一度</text><text class="node-title" x="288.5" y="485">も現れませんか？</text><text class="node-explanation" x="288.5" y="512">この文字を一致の開始位置の目印にします。先頭以外</text><text class="node-explanation" x="288.5" y="530">にも現れると、連結した質問で三候補を区別する証明</text><text class="node-explanation" x="288.5" y="548">が成り立ちません。</text></g><g class="flow-node question" data-node="query-budget"><rect x="159.5" y="796" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="816">質問</text><text class="node-title" x="175.5" y="844">列の長さは1〜2000で、長さ4N</text><text class="node-title" x="175.5" y="867">以内の質問をN+2回まで送れます</text><text class="node-title" x="175.5" y="890">か？</text><text class="node-explanation" x="175.5" y="917">Nは未知列の長さです。中間の各文字を一回で決め、</text><text class="node-explanation" x="175.5" y="935">先頭と末尾にそれぞれ最大二回を使います。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">候補を連結し、三通りの返答で次の文</text><text class="node-title" x="48" y="1254">字を決める</text><a href="/flowchartcp/techniques/unique-first-symbol-prefix-oracle-multiplexing/"><title>先頭の文字が再び現れない列を、候補を連結した質問で復元するの記事へ</title><text x="48" y="1293">先頭の文字が再び現れない列を、候補を連結した質</text><text x="48" y="1311">問で復元する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1203">分野</text><text class="node-title" x="412" y="1231">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1268">詳細の質問・図へ →</text></a></g></svg>