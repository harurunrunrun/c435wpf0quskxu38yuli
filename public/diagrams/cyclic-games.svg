<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-cyclic-games flow-desc-cyclic-games" width="860" height="1390" viewBox="0 0 860 1390" data-flow-svg="cyclic-games"><title id="flow-title-cyclic-games">循環する対戦と引分の解法フローチャート</title><desc id="flow-desc-cyclic-games">同じ状態を再訪できるゲームで、確定した勝敗から逆向きに伝えます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-cyclic-games" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="reuse:yes:draw-rule"><title>はい</title><path d="M539.722 205 V217 C539.722 249 420.667 249 420.667 281 V293"/><path d="M420.667 331 V343 C420.667 375 420.667 375 420.667 407 V419" marker-end="url(#arrow-cyclic-games)"/><g class="flow-edge-label" data-edge-label="reuse:yes:draw-rule" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="316">はい</text></g></g><g class="flow-edge no" data-edge="reuse:no:fallback"><title>いいえ</title><path d="M619.722 205 V217 C619.722 249 655 249 655 281 V293"/><path d="M655 331 V343 C655 375 762.5 375 762.5 407 V419 V599 C762.5 631 762.5 631 762.5 663 V675 V725 C762.5 757 458 757 458 789 V801 V1005 C458 1037 360 1037 360 1069 V1081 V1131 C360 1163 304 1163 304 1195 V1207" marker-end="url(#arrow-cyclic-games)"/><g class="flow-edge-label" data-edge-label="reuse:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="reuse:unknown:check"><title>わからない</title><path d="M699.722 205 V217 C699.722 249 783.5 249 783.5 281 V293"/><path d="M783.5 331 V343 C783.5 375 818.5 375 818.5 407 V419 V599 C818.5 631 818.5 631 818.5 663 V675 V725 C818.5 757 721.333 757 721.333 789 V801" marker-end="url(#arrow-cyclic-games)"/><g class="flow-edge-label" data-edge-label="reuse:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="draw-rule:yes:retrograde-result"><title>はい</title><path d="M340.667 587 V599 C340.667 631 192 631 192 663 V675"/><path d="M192 713 V725 C192 757 192 757 192 789 V801" marker-end="url(#arrow-cyclic-games)"/><g class="flow-edge-label" data-edge-label="draw-rule:yes:retrograde-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="698">はい</text></g></g><g class="flow-edge no" data-edge="draw-rule:no:fallback"><title>いいえ</title><path d="M420.667 587 V599 C420.667 631 402 631 402 663 V675"/><path d="M402 713 V725 C402 757 402 757 402 789 V801 V1005 C402 1037 304 1037 304 1069 V1081 V1131 C304 1163 224 1163 224 1195 V1207" marker-end="url(#arrow-cyclic-games)"/><g class="flow-edge-label" data-edge-label="draw-rule:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="draw-rule:unknown:check"><title>わからない</title><path d="M500.667 587 V599 C500.667 631 668 631 668 663 V675"/><path d="M668 713 V725 C668 757 614.667 757 614.667 789 V801" marker-end="url(#arrow-cyclic-games)"/><g class="flow-edge-label" data-edge-label="draw-rule:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 951 V1005 C588 1037 450 1037 450 1069 V1081"/><path d="M450 1119 V1131 C450 1163 384 1163 384 1195 V1207" marker-end="url(#arrow-cyclic-games)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1081" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1104">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 951 V1005 C668 1037 655 1037 655 1069 V1081"/><path d="M655 1119 V1131 C655 1163 614.667 1163 614.667 1195 V1207" marker-end="url(#arrow-cyclic-games)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1081" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1104">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 951 V1005 C748 1037 783.5 1037 783.5 1069 V1081"/><path d="M783.5 1119 V1131 C783.5 1163 721.333 1163 721.333 1195 V1207" marker-end="url(#arrow-cyclic-games)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1081" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1104">わからない</text></g></g><g class="flow-node question" data-node="reuse"><rect x="459.7222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">同じ単語や操作を再使用でき、現在の</text><text class="node-title" x="475.7222222222223" y="103">接続状態だけで次の合法手が決まりま</text><text class="node-title" x="475.7222222222223" y="126">すか？</text><text class="node-explanation" x="475.7222222222223" y="153">使った単語を二度使えない場合には、既使用集合を状</text><text class="node-explanation" x="475.7222222222223" y="171">態へ追加する必要があります。</text></g><g class="flow-node question" data-node="draw-rule"><rect x="260.6666666666667" y="419" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="439">質問</text><text class="node-title" x="276.6666666666667" y="467">合法手がない側は負け、負け回避を優</text><text class="node-title" x="276.6666666666667" y="490">先し、永続する対戦は引分ですか？</text><text class="node-explanation" x="276.6666666666667" y="517">単に循環があることだけでは、その状態が引分とは決</text><text class="node-explanation" x="276.6666666666667" y="535">まりません。勝ちへ強制できる辺や負けへ強制される</text><text class="node-explanation" x="276.6666666666667" y="553">状態を先に確定します。</text></g><g class="flow-node result" data-node="retrograde-result"><rect x="32" y="801" width="320" height="192" rx="7"/><text class="node-kind" x="48" y="821">候補</text><text class="node-title" x="48" y="849">終端の負けから逆に勝敗を確定し、</text><text class="node-title" x="48" y="872">残った状態を引分とする</text><a href="/flowchartcp/techniques/retrograde-winning-draw/"><title>終了しない対戦は、負け状態から逆向きに勝敗を確定するの記事へ</title><text x="48" y="911">終了しない対戦は、負け状態から逆向きに勝敗を確</text><text x="48" y="929">定する</text></a><a href="/flowchartcp/techniques/game-theory/"><title>Grundy数の記事へ</title><text x="48" y="953">Grundy数</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="801" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="821">質問</text><text class="node-title" x="524" y="849">合法手、終了、返答、回数制限を、問</text><text class="node-title" x="524" y="872">題文で確認できますか？</text><text class="node-explanation" x="524" y="899">独立性や終了ルールが違う場合には、同じ勝敗・問い</text><text class="node-explanation" x="524" y="917">合わせ設計を使えません。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1207" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1227">候補</text><text class="node-title" x="160" y="1255">ルールと必要な情報を確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1294">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1318">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1207" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1227">分野</text><text class="node-title" x="524" y="1255">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1292">詳細の質問・図へ →</text></a></g></svg>