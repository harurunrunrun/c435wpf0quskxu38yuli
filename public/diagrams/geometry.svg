<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-geometry flow-desc-geometry" width="3296" height="950" viewBox="0 0 3296 950" data-flow-svg="geometry"><title id="flow-title-geometry">座標・長方形・距離の解法フローチャート</title><desc id="flow-desc-geometry">外積、凸包、単調な走査、値域の探索を使います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-geometry" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge point-distances" data-edge="geometry-task:point-distances:category-point-distances"><title>点どうしの距離・向き・角度</title><path d="M1520 141 V153 C1520 185 192 185 192 217 V229"/><path d="M192 267 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="geometry-task:point-distances:category-point-distances" tabindex="0" role="group" aria-label="選択肢：点どうしの距離・向き・角度"><rect x="95.5" y="229" width="193" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">点どうしの距離・向き・角度</text></g></g><g class="flow-edge enclosing-regions" data-edge="geometry-task:enclosing-regions:category-enclosing-regions"><title>図形・点集合の形・面積・比較</title><path d="M1552 141 V153 C1552 185 556 185 556 217 V229"/><path d="M556 267 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="geometry-task:enclosing-regions:category-enclosing-regions" tabindex="0" role="group" aria-label="選択肢：図形・点集合の形・面積・比較"><rect x="453" y="229" width="206" height="38" rx="5"/><text text-anchor="middle" x="556" y="252">図形・点集合の形・面積・比較</text></g></g><g class="flow-edge rectangle-aggregates" data-edge="geometry-task:rectangle-aggregates:category-rectangle-aggregates"><title>長方形や座標範囲の集計</title><path d="M1584 141 V153 C1584 185 920 185 920 217 V229"/><path d="M920 267 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="geometry-task:rectangle-aggregates:category-rectangle-aggregates" tabindex="0" role="group" aria-label="選択肢：長方形や座標範囲の集計"><rect x="836.5" y="229" width="167" height="38" rx="5"/><text text-anchor="middle" x="920" y="252">長方形や座標範囲の集計</text></g></g><g class="flow-edge boundary-relations" data-edge="geometry-task:boundary-relations:category-boundary-relations"><title>点の内外・交差・接続・壁で区切る領域</title><path d="M1616 141 V153 C1616 185 1284 185 1284 217 V229"/><path d="M1284 285 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="geometry-task:boundary-relations:category-boundary-relations" tabindex="0" role="group" aria-label="選択肢：点の内外・交差・接続・壁で区切る領域"><rect x="1161.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="252">点の内外・交差・接続・壁で区切る領</text><text text-anchor="middle" x="1284" y="270">域</text></g></g><g class="flow-edge travel-partition" data-edge="geometry-task:travel-partition:category-travel-partition"><title>移動・格子経路・長方形の切り分け</title><path d="M1648 141 V153 C1648 185 1648 185 1648 217 V229"/><path d="M1648 267 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="geometry-task:travel-partition:category-travel-partition" tabindex="0" role="group" aria-label="選択肢：移動・格子経路・長方形の切り分け"><rect x="1532" y="229" width="232" height="38" rx="5"/><text text-anchor="middle" x="1648" y="252">移動・格子経路・長方形の切り分け</text></g></g><g class="flow-edge circle-harvest" data-edge="geometry-task:circle-harvest:circle-harvest-route"><title>同速度で円周を歩き、再生する対象を得る個数を指定時刻まで数える</title><path d="M1680 141 V153 C1680 185 2012 185 2012 217 V229"/><path d="M2012 285 V297 C2012 329 2012 329 2012 361 V373" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="geometry-task:circle-harvest:circle-harvest-route" tabindex="0" role="group" aria-label="選択肢：同速度で円周を歩き、再生する対象を得る個数を指定時刻まで数える"><rect x="1889.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="252">同速度で円周を歩き、再生する対象を</text><text text-anchor="middle" x="2012" y="270">得る個数を指定時刻まで数える</text></g></g><g class="flow-edge skyline-stars" data-edge="geometry-task:skyline-stars:skyline-stars-route"><title>ビルを含まない長方形に星を高々一つ残すよう、星を消す費用を最小にする</title><path d="M1712 141 V153 C1712 185 2376 185 2376 217 V229"/><path d="M2376 285 V297 C2376 329 2376 329 2376 361 V373" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="geometry-task:skyline-stars:skyline-stars-route" tabindex="0" role="group" aria-label="選択肢：ビルを含まない長方形に星を高々一つ残すよう、星を消す費用を最小にする"><rect x="2253.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="2376" y="252">ビルを含まない長方形に星を高々一つ</text><text text-anchor="middle" x="2376" y="270">残すよう、星を消す費用を最小にする</text></g></g><g class="flow-edge orthogonal-cover" data-edge="geometry-task:orthogonal-cover:orthogonal-cover-route"><title>全点を通る縦横の折れ線を、少ない本数で作る</title><path d="M1744 141 V153 C1744 185 2740 185 2740 217 V229"/><path d="M2740 285 V297 C2740 329 2740 329 2740 361 V373" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="geometry-task:orthogonal-cover:orthogonal-cover-route" tabindex="0" role="group" aria-label="選択肢：全点を通る縦横の折れ線を、少ない本数で作る"><rect x="2617.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="2740" y="252">全点を通る縦横の折れ線を、少ない本</text><text text-anchor="middle" x="2740" y="270">数で作る</text></g></g><g class="flow-edge unknown" data-edge="geometry-task:unknown:check"><title>わからない</title><path d="M1776 141 V153 C1776 185 3104 185 3104 217 V229"/><path d="M3104 267 V297 C3104 329 3104 329 3104 361 V373" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="geometry-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="3059.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="3104" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M3024 523 V565 C3024 597 2740 597 2740 629 V641"/><path d="M2740 679 V691 C2740 723 2740 723 2740 755 V767" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="2700" y="641" width="80" height="38" rx="5"/><text text-anchor="middle" x="2740" y="664">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M3104 523 V565 C3104 597 3091 597 3091 629 V641"/><path d="M3091 679 V691 C3091 723 3050.667 723 3050.667 755 V767" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="3051" y="641" width="80" height="38" rx="5"/><text text-anchor="middle" x="3091" y="664">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M3184 523 V565 C3184 597 3219.5 597 3219.5 629 V641"/><path d="M3219.5 679 V691 C3219.5 723 3157.333 723 3157.333 755 V767" marker-end="url(#arrow-geometry)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="3175" y="641" width="89" height="38" rx="5"/><text text-anchor="middle" x="3219.5" y="664">わからない</text></g></g><g class="flow-node question" data-node="geometry-task"><rect x="1488" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1504" y="52">質問</text><text class="node-title" x="1504" y="80">点や座標から何を求めますか？</text><text class="node-explanation" x="1504" y="107">長方形の集計と、外周や距離の問題を分けます。</text></g><g class="flow-node question" data-node="check"><rect x="2944" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="2960" y="393">質問</text><text class="node-title" x="2960" y="421">小さい座標で、共線・同一点・境界上</text><text class="node-title" x="2960" y="444">の場合を列挙できますか？</text><text class="node-explanation" x="2960" y="471">一般位置を仮定する前に、入力の制約で保証されてい</text><text class="node-explanation" x="2960" y="489">るかを確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="2944" y="767" width="320" height="139" rx="7"/><text class="node-kind" x="2960" y="787">分野</text><text class="node-title" x="2960" y="815">条件を確かめる</text><text class="node-explanation" x="2960" y="842">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="2960" y="870">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="2580" y="767" width="320" height="151" rx="7"/><text class="node-kind" x="2596" y="787">候補</text><text class="node-title" x="2596" y="815">境界ケースから条件を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="2596" y="854">反例探し</text></a><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="2596" y="878">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="category-point-distances"><rect x="32" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">点どうしの距離・向き・角度</text><text class="node-explanation" x="48" y="448">遠い二点、近い二点、距離の種類、向きや角度の条件</text><text class="node-explanation" x="48" y="466">を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-geometry-point-distances" data-route="geometry-point-distances"><text x="48" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-enclosing-regions"><rect x="396" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">図形・点集合の形・面積・比較</text><text class="node-explanation" x="412" y="448">外周、最小幅、格子点、面積、点集合や領域の形を分</text><text class="node-explanation" x="412" y="466">けます。</text><a href="/flowchartcp/flowcharts/#diagram-geometry-enclosing-regions" data-route="geometry-enclosing-regions"><text x="412" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-rectangle-aggregates"><rect x="760" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">長方形や座標範囲の集計</text><text class="node-explanation" x="776" y="448">長方形内の集計、重なり・和集合、座標の大小条件を</text><text class="node-explanation" x="776" y="466">分けます。</text><a href="/flowchartcp/flowcharts/#diagram-geometry-rectangle-aggregates" data-route="geometry-rectangle-aggregates"><text x="776" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-boundary-relations"><rect x="1124" y="373" width="320" height="180" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">点の内外・交差・接続・壁で区切る領</text><text class="node-title" x="1140" y="444">域</text><text class="node-explanation" x="1140" y="471">点の内外、線分・円周の交差や接続、壁で区切る領域</text><text class="node-explanation" x="1140" y="489">の条件を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-geometry-boundary-relations" data-route="geometry-boundary-relations"><text x="1140" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-travel-partition"><rect x="1488" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">移動・格子経路・長方形の切り分け</text><text class="node-explanation" x="1504" y="448">自己相似な地図、格子の経路、長方形の切り分けを区</text><text class="node-explanation" x="1504" y="466">別します。</text><a href="/flowchartcp/flowcharts/#diagram-geometry-travel-partition" data-route="geometry-travel-partition"><text x="1504" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="circle-harvest-route"><rect x="1852" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="393">分野</text><text class="node-title" x="1868" y="421">同速度で円周を歩き、再生する対象を</text><text class="node-title" x="1868" y="444">得る個数を指定時刻まで数える</text><a href="/flowchartcp/flowcharts/#diagram-circle-timed-arrivals-conditions" data-route="circle-timed-arrivals-conditions"><text x="1868" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="skyline-stars-route"><rect x="2216" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="2232" y="393">分野</text><text class="node-title" x="2232" y="421">ビルを含まない長方形に星を高々一つ</text><text class="node-title" x="2232" y="444">残すよう、星を消す費用を最小にする</text><a href="/flowchartcp/flowcharts/#diagram-skyline-star-path-conditions" data-route="skyline-star-path-conditions"><text x="2232" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="orthogonal-cover-route"><rect x="2580" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="2596" y="393">分野</text><text class="node-title" x="2596" y="421">全点を通る縦横の折れ線を、少ない本</text><text class="node-title" x="2596" y="444">数で作る</text><a href="/flowchartcp/flowcharts/#diagram-orthogonal-point-cover-conditions" data-route="orthogonal-point-cover-conditions"><text x="2596" y="481">詳細の質問・図へ →</text></a></g></svg>