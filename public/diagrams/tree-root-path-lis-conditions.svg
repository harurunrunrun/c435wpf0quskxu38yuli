x="559.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="rollback:yes:answer"><title>はい</title><path d="M239.5 928 V940 C239.5 972 192 972 192 1004 V1016"/><path d="M192 1054 V1066 C192 1098 192 1098 192 1130 V1142" marker-end="url(#arrow-tree-root-path-lis-conditions)"/><g class="flow-edge-label" data-edge-label="rollback:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="rollback:no:check"><title>いいえ</title><path d="M319.5 928 V940 C319.5 972 319 972 319 1004 V1016"/><path d="M319 1054 V1066 C319 1098 441.714 1098 441.714 1130 V1142" marker-end="url(#arrow-tree-root-path-lis-conditions)"/><g class="flow-edge-label" data-edge-label="rollback:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="rollback:unknown:check"><title>わからない</title><path d="M399.5 928 V940 C399.5 972 447.5 972 447.5 1004 V1016"/><path d="M447.5 1054 V1066 C447.5 1098 487.429 1098 487.429 1130 V1142" marker-end="url(#arrow-tree-root-path-lis-conditions)"/><g class="flow-edge-label" data-edge-label="rollback:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="fixed-root"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">根は一つに固定され、更新のない木の</text><text class="node-title" x="400.5" y="103">根から各頂点への経路を読みますか？</text><text class="node-explanation" x="400.5" y="130">経路は根から終点への順で読みます。根が毎回変わる</text><text class="node-explanation" x="400.5" y="148">場合や任意の二頂点間の質問には、このまま使えませ</text><text class="node-explanation" x="400.5" y="166">ん。</text></g><g class="flow-node question" data-node="strict"><rect x="272.5" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">求めるのは、値が厳密に増加する部分</text><text class="node-title" x="288.5" y="485">列の最長の長さですか？</text><text class="node-explanation" x="288.5" y="512">同じ値は続けて選びません。部分列の個数や各経路で</text><text class="node-explanation" x="288.5" y="530">の具体的な復元は、この実装の出力に含みません。</text></g><g class="flow-node question" data-node="rollback"><rect x="159.5" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="798">質問</text><text class="node-title" x="175.5" y="826">子の枝を処理した後、末尾配列の更新</text><text class="node-title" x="175.5" y="849">した1か所を元に戻せますか？</text><text class="node-explanation" x="175.5" y="876">枝に入る前の長さ・更新位置・元の値を記録します。</text><text class="node-explanation" x="175.5" y="894">兄弟の経路で前の枝の値を使わないようにします。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">末尾配列を一か所更新し、枝から戻る</text><text class="node-title" x="48" y="1213">ときに復元する</text><a href="/flowchartcp/techniques/tree-root-path-lis-rollback/"><title>根から各頂点までのLISは、枝から戻るときに末尾配列を復元するの記事へ</title><text x="48" y="1252">根から各頂点までのLISは、枝から戻るときに末</text><text x="48" y="1270">尾配列を復元する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1162">分野</text><text class="node-title" x="412" y="1190">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1227">詳細の質問・図へ →</text></a></g></svg>