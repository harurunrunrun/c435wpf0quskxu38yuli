C710 613 710 613 710 645 V657 V707 C710 739 710 739 710 771 V783 V945 C710 977 710 977 710 1009 V1021 V1071 C710 1103 670.286 1103 670.286 1135 V1147" marker-end="url(#arrow-bipartite-addition-conditions)"/><g class="flow-edge-label" data-edge-label="simple:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="independent:yes:recolor"><title>はい</title><path d="M352.5 569 V581 C352.5 613 307 613 307 645 V657"/><path d="M307 695 V707 C307 739 319.5 739 319.5 771 V783" marker-end="url(#arrow-bipartite-addition-conditions)"/><g class="flow-edge-label" data-edge-label="independent:yes:recolor" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="680">はい</text></g></g><g class="flow-edge no" data-edge="independent:no:check"><title>いいえ</title><path d="M432.5 569 V581 C432.5 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 542 739 542 771 V783 V945 C542 977 542 977 542 1009 V1021 V1071 C542 1103 533.143 1103 533.143 1135 V1147" marker-end="url(#arrow-bipartite-addition-conditions)"/><g class="flow-edge-label" data-edge-label="independent:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="independent:unknown:check"><title>わからない</title><path d="M512.5 569 V581 C512.5 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 598 739 598 771 V783 V945 C598 977 598 977 598 1009 V1021 V1071 C598 1103 578.857 1103 578.857 1135 V1147" marker-end="url(#arrow-bipartite-addition-conditions)"/><g class="flow-edge-label" data-edge-label="independent:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="recolor:yes:answer"><title>はい</title><path d="M239.5 933 V945 C239.5 977 192 977 192 1009 V1021"/><path d="M192 1059 V1071 C192 1103 192 1103 192 1135 V1147" marker-end="url(#arrow-bipartite-addition-conditions)"/><g class="flow-edge-label" data-edge-label="recolor:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1044">はい</text></g></g><g class="flow-edge no" data-edge="recolor:no:check"><title>いいえ</title><path d="M319.5 933 V945 C319.5 977 319 977 319 1009 V1021"/><path d="M319 1059 V1071 C319 1103 441.714 1103 441.714 1135 V1147" marker-end="url(#arrow-bipartite-addition-conditions)"/><g class="flow-edge-label" data-edge-label="recolor:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1044">いいえ</text></g></g><g class="flow-edge unknown" data-edge="recolor:unknown:check"><title>わからない</title><path d="M399.5 933 V945 C399.5 977 447.5 977 447.5 1009 V1021"/><path d="M447.5 1059 V1071 C447.5 1103 487.429 1103 487.429 1135 V1147" marker-end="url(#arrow-bipartite-addition-conditions)"/><g class="flow-edge-label" data-edge-label="recolor:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1021" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1044">わからない</text></g></g><g class="flow-node question" data-node="simple"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">重複辺と自己ループのない、単純な無</text><text class="node-title" x="400.5" y="103">向グラフですか？</text><text class="node-explanation" x="400.5" y="130">既存辺の数をそのまま除く式なので、入力を辺集合と</text><text class="node-explanation" x="400.5" y="148">して扱えることを確認します。</text></g><g class="flow-node question" data-node="independent"><rect x="272.5" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">存在しない辺を一本だけ、元のグラフ</text><text class="node-title" x="288.5" y="467">に独立に加えられる頂点対を数えます</text><text class="node-title" x="288.5" y="490">か？</text><text class="node-explanation" x="288.5" y="517">複数本を同時に加える組合せや、追加を積み重ねる操</text><text class="node-explanation" x="288.5" y="535">作列は別に扱います。</text></g><g class="flow-node question" data-node="recolor"><rect x="159.5" y="783" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="803">質問</text><text class="node-title" x="175.5" y="831">頂点の色は指定されず、連結成分ごと</text><text class="node-title" x="175.5" y="854">に二色を反転しても構いませんか？</text><text class="node-explanation" x="175.5" y="881">別成分の二頂点は、片方の色を反転すれば接続できま</text><text class="node-explanation" x="175.5" y="899">す。元のグラフに奇閉路があれば答えは0です。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1147" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1167">候補</text><text class="node-title" x="48" y="1195">全頂点対から既存辺と同じ成分の同色</text><text class="node-title" x="48" y="1218">対を引く</text><a href="/flowchartcp/techniques/bipartite-component-edge-addition-count/"><title>二部性を保つ辺の追加は、同じ成分の同色対だけを除いて数えるの記事へ</title><text x="48" y="1257">二部性を保つ辺の追加は、同じ成分の同色対だけを</text><text x="48" y="1275">除いて数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1147" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1167">分野</text><text class="node-title" x="412" y="1195">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1232">詳細の質問・図へ →</text></a></g></svg>