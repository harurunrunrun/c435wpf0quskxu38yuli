<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-forest-trigger flow-desc-forest-trigger" width="916" height="1712" viewBox="0 0 916 1712" data-flow-svg="forest-trigger"><title id="flow-title-forest-trigger">葉から始まる連鎖の得点の解法フローチャート</title><desc id="flow-desc-forest-trigger">親へ続く一つの経路と、子の領域内で確定する得点を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-forest-trigger" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="parent-forest:yes:trigger-stop"><title>はい</title><path d="M629.019 164 V176 C629.019 208 576.556 208 576.556 240 V252"/><path d="M576.556 290 V302 C576.556 334 576.556 334 576.556 366 V378" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="parent-forest:yes:trigger-stop" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="536.5555555555555" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="576.5555555555555" y="275">はい</text></g></g><g class="flow-edge no" data-edge="parent-forest:no:fallback"><title>いいえ</title><path d="M709.019 164 V176 C709.019 208 711 208 711 240 V252"/><path d="M711 290 V302 C711 334 822 334 822 366 V378 V581 C822 613 822 613 822 645 V657 V707 C822 739 822 739 822 771 V783 V945 C822 977 822 977 822 1009 V1021 V1071 C822 1103 878 1103 878 1135 V1147 V1327 C878 1359 878 1359 878 1391 V1403 V1453 C878 1485 456 1485 456 1517 V1529" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="parent-forest:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="671" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="711" y="275">いいえ</text></g></g><g class="flow-edge unknown" data-edge="parent-forest:unknown:check"><title>わからない</title><path d="M789.019 164 V176 C789.019 208 839.5 208 839.5 240 V252"/><path d="M839.5 290 V302 C839.5 334 878 334 878 366 V378 V581 C878 613 878 613 878 645 V657 V707 C878 739 878 739 878 771 V783 V945 C878 977 878 977 878 1009 V1021 V1071 C878 1103 748 1103 748 1135 V1147" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="parent-forest:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="795" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="839.5" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="trigger-stop:yes:trigger-continue"><title>はい</title><path d="M496.556 569 V581 C496.556 613 403.167 613 403.167 645 V657"/><path d="M403.167 695 V707 C403.167 739 403.167 739 403.167 771 V783" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="trigger-stop:yes:trigger-continue" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="363.1666666666667" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="403.1666666666667" y="680">はい</text></g></g><g class="flow-edge no" data-edge="trigger-stop:no:fallback"><title>いいえ</title><path d="M576.556 569 V581 C576.556 613 599 613 599 645 V657"/><path d="M599 695 V707 C599 739 710 739 710 771 V783 V945 C710 977 710 977 710 1009 V1021 V1071 C710 1103 458 1103 458 1135 V1147 V1327 C458 1359 416 1359 416 1391 V1403 V1453 C416 1485 328 1485 328 1517 V1529" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="trigger-stop:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="559" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="599" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="trigger-stop:unknown:check"><title>わからない</title><path d="M656.556 569 V581 C656.556 613 727.5 613 727.5 645 V657"/><path d="M727.5 695 V707 C727.5 739 766 739 766 771 V783 V945 C766 977 766 977 766 1009 V1021 V1071 C766 1103 668 1103 668 1135 V1147" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="trigger-stop:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="trigger-continue:yes:trigger-result"><title>はい</title><path d="M323.167 933 V945 C323.167 977 192 977 192 1009 V1021"/><path d="M192 1059 V1071 C192 1103 192 1103 192 1135 V1147" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="trigger-continue:yes:trigger-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1044">はい</text></g></g><g class="flow-edge no" data-edge="trigger-continue:no:fallback"><title>いいえ</title><path d="M403.167 933 V945 C403.167 977 402 977 402 1009 V1021"/><path d="M402 1059 V1071 C402 1103 402 1103 402 1135 V1147 V1327 C402 1359 360 1359 360 1391 V1403 V1453 C360 1485 264 1485 264 1517 V1529" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="trigger-continue:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="1044">いいえ</text></g></g><g class="flow-edge unknown" data-edge="trigger-continue:unknown:check"><title>わからない</title><path d="M483.167 933 V945 C483.167 977 615.5 977 615.5 1009 V1021"/><path d="M615.5 1059 V1071 C615.5 1103 588 1103 588 1135 V1147" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="trigger-continue:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="571" y="1021" width="89" height="38" rx="5"/><text text-anchor="middle" x="615.5" y="1044">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 1297 V1327 C588 1359 506 1359 506 1391 V1403"/><path d="M506 1441 V1453 C506 1485 392 1485 392 1517 V1529" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1403" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1426">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 1297 V1327 C668 1359 655 1359 655 1391 V1403"/><path d="M655 1441 V1453 C655 1485 670.667 1485 670.667 1517 V1529" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1403" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1426">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 1297 V1327 C748 1359 783.5 1359 783.5 1391 V1403"/><path d="M783.5 1441 V1453 C783.5 1485 777.333 1485 777.333 1517 V1529" marker-end="url(#arrow-forest-trigger)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1403" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1426">わからない</text></g></g><g class="flow-node question" data-node="parent-forest"><rect x="549.0185185185186" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="565.0185185185186" y="52">質問</text><text class="node-title" x="565.0185185185186" y="80">各頂点の親は高々一つで、親をたどる</text><text class="node-title" x="565.0185185185186" y="103">と循環しませんか？</text><text class="node-explanation" x="565.0185185185186" y="130">複数の根を持つ森も、根ごとに独立に処理できます。</text></g><g class="flow-node question" data-node="trigger-stop"><rect x="416.55555555555554" y="378" width="320" height="191" rx="7"/><text class="node-kind" x="432.55555555555554" y="398">質問</text><text class="node-title" x="432.55555555555554" y="426">頂点の重みは非負で、葉からの連鎖が</text><text class="node-title" x="432.55555555555554" y="449">既訪問で止まり、得点は経路の最大値</text><text class="node-title" x="432.55555555555554" y="472">ですか？</text><text class="node-explanation" x="432.55555555555554" y="499">一経路の得点を最大の非負重みとします。子から親へ</text><text class="node-explanation" x="432.55555555555554" y="517">進む経路の一つだけが初めて親を動かし、他は既に動</text><text class="node-explanation" x="432.55555555555554" y="535">いた親で止まります。</text></g><g class="flow-node question" data-node="trigger-continue"><rect x="243.16666666666669" y="783" width="320" height="150" rx="7"/><text class="node-kind" x="259.1666666666667" y="803">質問</text><text class="node-title" x="259.1666666666667" y="831">子の継続値の一つだけを親へ残し、他</text><text class="node-title" x="259.1666666666667" y="854">は子側で得点として確定できますか？</text><text class="node-explanation" x="259.1666666666667" y="881">親の重みで持ち上げる一経路には最小の継続値を選</text><text class="node-explanation" x="259.1666666666667" y="899">び、他の継続値はそのまま得点へ足します。</text></g><g class="flow-node result" data-node="trigger-result"><rect x="32" y="1147" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1167">候補</text><text class="node-title" x="48" y="1195">最小の継続値だけを親へ渡し、他の子</text><text class="node-title" x="48" y="1218">の得点を確定する</text><a href="/flowchartcp/techniques/forest-trigger-minimum-continuation/"><title>合流した経路の最大値を足すなら、最小の一経路を親へ渡すの記事へ</title><text x="48" y="1257">合流した経路の最大値を足すなら、最小の一経路を</text><text x="48" y="1275">親へ渡す</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="1147" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="1167">質問</text><text class="node-title" x="524" y="1195">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="1218">確認できますか？</text><text class="node-explanation" x="524" y="1245">どの性質が入力で保証され、どの性質を式や操作から</text><text class="node-explanation" x="524" y="1263">示す必要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1529" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1549">候補</text><text class="node-title" x="216" y="1577">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="216" y="1616">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1640">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1529" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1549">分野</text><text class="node-title" x="580" y="1577">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1614">詳細の質問・図へ →</text></a></g></svg>