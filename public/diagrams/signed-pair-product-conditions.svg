<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-signed-pair-product-conditions flow-desc-signed-pair-product-conditions" width="748" height="1001" viewBox="0 0 748 1001" data-flow-svg="signed-pair-product-conditions"><title id="flow-title-signed-pair-product-conditions">負数と0を含む二数の積のK番目の解法フローチャート</title><desc id="flow-desc-signed-pair-product-conditions">添字対の区別、重複、順位と整数演算の条件を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-signed-pair-product-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="pairs:yes:rank"><title>はい</title><path d="M456.222 182 V194 C456.222 226 394.167 226 394.167 258 V270"/><path d="M394.167 308 V320 C394.167 352 394.167 352 394.167 384 V396" marker-end="url(#arrow-signed-pair-product-conditions)"/><g class="flow-edge-label" data-edge-label="pairs:yes:rank" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="354.1666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="394.1666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="pairs:no:check"><title>いいえ</title><path d="M536.222 182 V194 C536.222 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V599 C654 631 654 631 654 663 V675 V725 C654 757 588 757 588 789 V801" marker-end="url(#arrow-signed-pair-product-conditions)"/><g class="flow-edge-label" data-edge-label="pairs:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="pairs:unknown:check"><title>わからない</title><path d="M616.222 182 V194 C616.222 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V599 C710 631 710 631 710 663 V675 V725 C710 757 652 757 652 789 V801" marker-end="url(#arrow-signed-pair-product-conditions)"/><g class="flow-edge-label" data-edge-label="pairs:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="rank:yes:answer"><title>はい</title><path d="M314.167 587 V599 C314.167 631 192 631 192 663 V675"/><path d="M192 713 V725 C192 757 192 757 192 789 V801" marker-end="url(#arrow-signed-pair-product-conditions)"/><g class="flow-edge-label" data-edge-label="rank:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="698">はい</text></g></g><g class="flow-edge no" data-edge="rank:no:check"><title>いいえ</title><path d="M394.167 587 V599 C394.167 631 431 631 431 663 V675"/><path d="M431 713 V725 C431 757 460 757 460 789 V801" marker-end="url(#arrow-signed-pair-product-conditions)"/><g class="flow-edge-label" data-edge-label="rank:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="rank:unknown:check"><title>わからない</title><path d="M474.167 587 V599 C474.167 631 559.5 631 559.5 663 V675"/><path d="M559.5 713 V725 C559.5 757 524 757 524 789 V801" marker-end="url(#arrow-signed-pair-product-conditions)"/><g class="flow-edge-label" data-edge-label="rank:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="698">わからない</text></g></g><g class="flow-node question" data-node="pairs"><rect x="376.2222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="392.2222222222223" y="52">質問</text><text class="node-title" x="392.2222222222223" y="80">固定した一つの整数列の、異なる添字</text><text class="node-title" x="392.2222222222223" y="103">i&lt;jの全ての対が対象ですか？</text><text class="node-explanation" x="392.2222222222223" y="130">同じ値が複数あれば添字の組数だけ数えます。二本の</text><text class="node-explanation" x="392.2222222222223" y="148">配列から一つずつ選ぶ形式とは異なります。</text></g><g class="flow-node question" data-node="rank"><rect x="234.16666666666669" y="396" width="320" height="191" rx="7"/><text class="node-kind" x="250.16666666666669" y="416">質問</text><text class="node-title" x="250.16666666666669" y="444">重複を残して並べた積のK番目が必要</text><text class="node-title" x="250.16666666666669" y="467">で、積を正確な整数で比較できます</text><text class="node-title" x="250.16666666666669" y="490">か？</text><text class="node-explanation" x="250.16666666666669" y="517">負数と0も含めて符号ごとにしきい値以下を数えま</text><text class="node-explanation" x="250.16666666666669" y="535">す。全対を同時に選ぶ際の追加制約はないものとしま</text><text class="node-explanation" x="250.16666666666669" y="553">す。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="801" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="821">候補</text><text class="node-title" x="48" y="849">負・0・正の積の組数を数え、K個以</text><text class="node-title" x="48" y="872">上になる最初の値を探す</text><a href="/flowchartcp/techniques/kth-signed-pair-product/"><title>負数を含む積のK番目は、符号ごとにしきい値以下の組を数えるの記事へ</title><text x="48" y="911">負数を含む積のK番目は、符号ごとにしきい値以下</text><text x="48" y="929">の組を数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="801" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="821">分野</text><text class="node-title" x="412" y="849">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="886">詳細の質問・図へ →</text></a></g></svg>