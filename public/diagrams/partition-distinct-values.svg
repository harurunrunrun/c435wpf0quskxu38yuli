間の値の総和</title><path d="M762.375 159 V171 C762.375 203 876.5 203 876.5 235 V247"/><path d="M876.5 285 V297 C876.5 329 1018 329 1018 361 V373 V535 C1018 567 1018 567 1018 599 V611 V661 C1018 693 1018 693 1018 725 V737 V940 C1018 972 1018 972 1018 1004 V1016 V1066 C1018 1098 652 1098 652 1130 V1142" marker-end="url(#arrow-partition-distinct-values)"/><g class="flow-edge-label" data-edge-label="model:sum-values:fallback" tabindex="0" role="group" aria-label="選択肢：その区間の値の総和"><rect x="806" y="247" width="141" height="38" rx="5"/><text text-anchor="middle" x="876.5" y="270">その区間の値の総和</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M826.375 159 V171 C826.375 203 1035.5 203 1035.5 235 V247"/><path d="M1035.5 285 V297 C1035.5 329 1074 329 1074 361 V373 V535 C1074 567 1074 567 1074 599 V611 V661 C1074 693 1074 693 1074 725 V737 V940 C1074 972 1074 972 1074 1004 V1016 V1066 C1074 1098 1000 1098 1000 1130 V1142" marker-end="url(#arrow-partition-distinct-values)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="goal:yes:guard"><title>はい</title><path d="M622.556 523 V535 C622.556 567 501.167 567 501.167 599 V611"/><path d="M501.167 649 V661 C501.167 693 501.167 693 501.167 725 V737" marker-end="url(#arrow-partition-distinct-values)"/><g class="flow-edge-label" data-edge-label="goal:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="461.1666666666667" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="501.1666666666667" y="634">はい</text></g></g><g class="flow-edge no" data-edge="goal:no:fallback"><title>いいえ</title><path d="M702.556 523 V535 C702.556 567 739 567 739 599 V611"/><path d="M739 649 V661 C739 693 850 693 850 725 V737 V940 C850 972 850 972 850 1004 V1016 V1066 C850 109