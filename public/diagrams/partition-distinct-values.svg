8 840 1098 840 1130 V1142" marker-end="url(#arrow-partition-distinct-values)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1039">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1292 V1322 C840 1354 783 1354 783 1386 V1398"/><path d="M783 1436 V1448 C783 1480 828.5 1480 828.5 1512 V1524" marker-end="url(#arrow-partition-distinct-values)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1421">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1292 V1322 C920 1354 907 1354 907 1386 V1398"/><path d="M907 1436 V1448 C907 1480 908.5 1480 908.5 1512 V1524" marker-end="url(#arrow-partition-distinct-values)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1421">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1292 V1322 C1000 1354 1035.5 1354 1035.5 1386 V1398"/><path d="M1035.5 1436 V1448 C1035.5 1480 988.5 1480 988.5 1512 V1524" marker-end="url(#arrow-partition-distinct-values)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1398" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1421">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="570.375" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="586.375" y="52">質問</text><text class="node-title" x="586.375" y="80">各区間の得点は、どの量ですか？</text><text class="node-explanation" x="586.375" y="107">区間の得点の式と、ちょうど K 個・非空という制</text><text class="node-explanation" x="586.375" y="125">約を確かめます。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="558.5555555555557" y="393">質問</text><text class="node-title" x="558.5555555555557" y="421">固定された列を、ちょうど K 個の</text><text class="node-title" x="558.5555555555557" y="444">非空連続区間へ分けますか？</text><text class="node-explanation" x="558.5555555555557" y="471">未到達状態は −INF とし、空区間を作って段数</text><text class="node-explanation" x="558.5555555555557" y="489">だけ増やさないようにします。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="737" width="320" height="191" rx="7"/><text class="node-kind" x="357.1666666666667" y="757">質問</text><text class="node-title" x="357.1666666666667" y="785">新しい位置 i の値の前回位置を </text><text class="node-title" x="357.1666666666667" y="808">p とし、開始位置 p+1..i </text><text class="node-title" x="357.1666666666667" y="831">だけ得点が 1 増えますか？</text><text class="node-explanation" x="357.1666666666667" y="858">分割位置 j=開始位置−1 なら更新範囲は </text><text class="node-explanation" x="357.1666666666667" y="876">p..i−1 です。候補の最大値を区間加算と合わ</text><text class="node-explanation" x="357.1666666666667" y="894">せて持ちます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">同じ値の直前の出現から、新しい種類</text><text class="node-title" x="48" y="1213">が増える分割位置だけへ足す</text><a href="/flowchartcp/techniques/partition-distinct-range-add/"><title>区間の種類数で分割するDPは、直前の同値位置から増える候補だけへ加算するの記事へ</title><text x="48" y="1252">区間の種類数で分割するDPは、直前の同値位置か</text><text x="48" y="1270">ら増える候補だけへ加算する</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1142" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1162">候補</text><text class="node-title" x="412" y="1190">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1229">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1253">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1142" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1162">質問</text><text class="node-title" x="776" y="1190">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1213">書き出せますか？</text><text class="node-explanation" x="776" y="1240">区間の得点の式と、ちょうど K 個・非空という制</text><text class="node-explanation" x="776" y="1258">約を確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1524" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1544">分野</text><text class="node-title" x="764.5" y="1572">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1609">詳細の質問・図へ →</text></a></g></svg>