"flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1310 V1377 C840 1409 783 1409 783 1441 V1453"/><path d="M783 1491 V1503 C783 1535 828.5 1535 828.5 1567 V1579" marker-end="url(#arrow-point-congruence-cyclic-signature)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1453" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1476">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1310 V1377 C920 1409 907 1409 907 1441 V1453"/><path d="M907 1491 V1503 C907 1535 908.5 1535 908.5 1567 V1579" marker-end="url(#arrow-point-congruence-cyclic-signature)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1453" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1476">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1310 V1377 C1000 1409 1035.5 1409 1035.5 1441 V1453"/><path d="M1035.5 1491 V1503 C1035.5 1535 988.5 1535 988.5 1567 V1579" marker-end="url(#arrow-point-congruence-cyclic-signature)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1453" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1476">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="638.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="654.5" y="52">質問</text><text class="node-title" x="654.5" y="80">点や領域について求める量と、許され</text><text class="node-title" x="654.5" y="103">る操作はどれですか？</text><text class="node-explanation" x="654.5" y="130">点の対応の自由、反転の可否、拡大縮小の可否、重心</text><text class="node-explanation" x="654.5" y="148">に点がある場合を区別します。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="602.1111111111112" y="434">質問</text><text class="node-title" x="602.1111111111112" y="462">点は各集合内で相異なり、反転を許さ</text><text class="node-title" x="602.1111111111112" y="485">ず、点の対応は自由ですか？</text><text class="node-explanation" x="602.1111111111112" y="512">対応する点を入力順で結び付けません。重心を引き、</text><text class="node-explanation" x="602.1111111111112" y="530">同じ方向上の点も長さで順序を決めます。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="375.83333333333337" y="798">質問</text><text class="node-title" x="375.83333333333337" y="826">各集合は20万点以下の整数点で、座</text><text class="node-title" x="375.83333333333337" y="849">標の絶対値は10億以下ですか？</text><text class="node-explanation" x="375.83333333333337" y="876">重心上の零ベクトルは別に扱います。外積の符号を落</text><text class="node-explanation" x="375.83333333333337" y="894">とすと反転を区別できません。巡回開始位置は自由で</text><text class="node-explanation" x="375.83333333333337" y="912">す。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1180">候補</text><text class="node-title" x="48" y="1208">点集合の回転と平行移動による一致</text><text class="node-title" x="48" y="1231">を、重心からの巡回列で判定する</text><a href="/flowchartcp/techniques/point-congruence-cyclic-signature/"><title>点集合の回転と平行移動による一致を、重心からの巡回列で判定するの記事へ</title><text x="48" y="1270">点集合の回転と平行移動による一致を、重心からの</text><text x="48" y="1288">巡回列で判定する</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1160" width="320" height="205" rx="7"/><text class="node-kind" x="412" y="1180">候補</text><text class="node-title" x="412" y="1208">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1235">反転を許す場合には向きを反転した列との比較が別に</text><text class="node-explanation" x="412" y="1253">必要です。拡大縮小も許す場合は長さの正規化を考え</text><text class="node-explanation" x="412" y="1271">ます。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1301">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1325">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1160" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1180">質問</text><text class="node-title" x="776" y="1208">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1231">確認できますか？</text><text class="node-explanation" x="776" y="1258">点の対応の自由、反転の可否、拡大縮小の可否、重心</text><text class="node-explanation" x="776" y="1276">に点がある場合を区別します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1579" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1599">分野</text><text class="node-title" x="764.5" y="1627">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1654">点の対応の自由、反転の可否、拡大縮小の可否、重心</text><text class="node-explanation" x="764.5" y="1672">に点がある場合を区別します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1700">詳細の質問・図へ →</text></a></g></svg>