<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-point-congruence-cyclic-signature flow-desc-point-congruence-cyclic-signature" width="1112" height="1768" viewBox="0 0 1112 1768" data-flow-svg="point-congruence-cyclic-signature"><title id="flow-title-point-congruence-cyclic-signature">点集合の回転と平行移動による一致を、重心からの巡回列で判定するの解法フローチャート</title><desc id="flow-desc-point-congruence-cyclic-signature">点の対応の自由、反転の可否、拡大縮小の可否、重心に点がある場合を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-point-congruence-cyclic-signature" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge rigid-motion" data-edge="model:rigid-motion:assumptions"><title>二つの点集合が、回転と平行移動だけで一致するかを判定する</title><path d="M718.5 182 V194 C718.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 326 V338 C535.5 370 746.111 370 746.111 402 V414" marker-end="url(#arrow-point-congruence-cyclic-signature)"/><g class="flow-edge-label" data-edge-label="model:rigid-motion:assumptions" tabindex="0" role="group" aria-label="選択肢：二つの点集合が、回転と平行移動だけで一致するかを判定する"><rect x="413" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="535.5" y="293">二つの点集合が、回転と平行移動だけ</text><text text-anchor="middle" x="535.5" y="311">で一致するかを判定する</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>反転や拡大縮小も許す、または一部の点だけが一致すればよい</title><path d="M798.5 182 V194 C798.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V576 C1018 608 1018 608 1018 640 V652 V702 C1018 734 1018 734 1018 766 V778 V958 C1018 990 1018 990 1018 1022 V1034 V1084 C1018 1116 636 1116 636 1148 V1160" marker-end="url(#arrow-point-congruence-cyclic-signature)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：反転や拡大縮小も許す、または一部の点だけが一致すればよい"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">反転や拡大縮小も許す、または一部の</text><text text-anchor="middle" x="824.5" y="311">点だけが一致すればよい</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M878.5 182 V194 C878.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V576 C1074 608 1074 608 1074 640 V652 V702 C1074 734 1074 734 1074 766 V778 V958 C1074 990 1074 990 1074 1022 V1034 V1084 C1074 1116 1000 1116 1000 1148 V1160" marker-end="url(#arrow-point-congruence-cyclic-signature)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 564 V576 C666.111 608 519.833 608 519.833 640 V652"/><path d="M519.833 690 V702 C519.833 734 519.833 734 519.833 766 V778" marker-end="url(#arrow-point-congruence-cyclic-signature)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="675">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 564 V576 C746.111 608 795 608 795 640 V652"/><path d="M795 690 V702 C795 734 906 734 906 766 V778 V958 C906 990 906 990 906 1022 V1034 V1084 C906 1116 556 1116 556 1148 V1160" marker-end="url(#arrow-point-congruence-cyclic-signature)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"