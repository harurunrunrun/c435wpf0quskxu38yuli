in"><title>いいえ</title><path d="M1004 1656 V1686 C1004 1718 991 1718 991 1750 V1762"/><path d="M991 1800 V1812 C991 1844 1001.917 1844 1001.917 1876 V1888" marker-end="url(#arrow-range-changing-statistics)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="951" y="1762" width="80" height="38" rx="5"/><text text-anchor="middle" x="991" y="1785">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1084 1656 V1686 C1084 1718 1119.5 1718 1119.5 1750 V1762"/><path d="M1119.5 1800 V1812 C1119.5 1844 1108.583 1844 1108.583 1876 V1888" marker-end="url(#arrow-range-changing-statistics)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1075" y="1762" width="89" height="38" rx="5"/><text text-anchor="middle" x="1119.5" y="1785">わからない</text></g></g><g class="flow-node question" data-node="query-kind"><rect x="686.2407407407408" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="702.2407407407408" y="52">質問</text><text class="node-title" x="702.2407407407408" y="80">代入を含む数列で、区間から何を求め</text><text class="node-title" x="702.2407407407408" y="103">ますか？</text><text class="node-explanation" x="702.2407407407408" y="130">値そのものの順位と、値の出現回数の条件を区別しま</text><text class="node-explanation" x="702.2407407407408" y="148">す。</text></g><g class="flow-node question" data-node="kth-offline"><rect x="225.72222222222223" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="241.72222222222223" y="416">質問</text><text class="node-title" x="241.72222222222223" y="444">すべての代入と質問を先に読めます</text><text class="node-title" x="241.72222222222223" y="467">か？</text><text class="node-explanation" x="241.72222222222223" y="494">各代入を古い値の削除と新しい値の追加へ分け、質問</text><text class="node-explanation" x="241.72222222222223" y="512">の時刻を保ちます。</text></g><g class="flow-node question" data-node="kth-time-order"><rect x="260.1666666666667" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="276.1666666666667" y="780">質問</text><text class="node-title" x="276.1666666666667" y="808">値の閾値以下の個数を数えるとき、元</text><text class="node-title" x="276.1666666666667" y="831">の更新順と質問順を保てますか？</text><text class="node-explanation" x="276.1666666666667" y="858">値域で操作を二分しても、時刻順は変えません。右側</text><text class="node-explanation" x="276.1666666666667" y="876">の質問では左側にある個数だけ順位を減らします。</text></g><g class="flow-node result" data-node="kth-result"><rect x="88" y="1124" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="1144">候補</text><text class="node-title" x="104" y="1172">値の閾値で操作を分け、時刻順の出現</text><text class="node-title" x="104" y="1195">数で区間順位を絞る</text><a href="/flowchartcp/techniques/offline-kth-divide-values/"><title>更新付きの区間順位を、答えの値でまとめて二分するの記事へ</title><text x="104" y="1234">更新付きの区間順位を、答えの値でまとめて二分す</text><text x="104" y="1252">る</text></a></g><g class="flow-node question" data-node="mex-offline"><rect x="832.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="848.5" y="416">質問</text><text class="node-title" x="848.5" y="444">全操作を先に読み、代入前と代入後の</text><text class="node-title" x="848.5" y="467">値を保存できますか？</text><text class="node-explanation" x="848.5" y="494">区間の両端だけでなく、適用済み代入の数も動かしま</text><text class="node-explanation" x="848.5" y="512">す。</text></g><g class="flow-node question" data-node="mex-undo"><rect x="720.5" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="736.5" y="780">質問</text><text class="node-title" x="736.5" y="808">更新時刻を戻すとき、区間にある値の</text><text class="node-title" x="736.5" y="831">頻度も元に戻せますか？</text><text class="node-explanation" x="736.5" y="858">更新位置が今の区間内かを判定し、古い値の頻度と新</text><text class="node-explanation" x="736.5" y="876">しい値の頻度を入れ替えます。</text></g><g class="flow-node question" data-node="mex-frequency-domain"><rect x="676" y="1124" width="320" height="150" rx="7"/><text class="node-kind" x="692" y="1144">質問</text><text class="node-title" x="692" y="1172">値の頻度ごとに、その頻度を持つ値の</text><text class="node-title" x="692" y="1195">種類数を保てますか？</text><text class="node-explanation" x="692" y="1222">値そのものの最小未出現ではありません。出現回数 </text><text class="node-explanation" x="692" y="1240">1,2,… に現れない最小の正整数を求めます。</text></g><g class="flow-node result" data-node="mex-result"><rect x="424" y="1506" width="320" height="168" rx="7"/><text class="node-kind" x="440" y="1526">候補</text><text class="node-title" x="440" y="1554">区間の両端と更新時刻を動かし、頻度</text><text class="node-title" x="440" y="1577">の頻度を更新する</text><a href="/flowchartcp/techniques/mo-with-updates/"><title>区間の質問を、端点と更新時刻の三方向へ並べ替えるの記事へ</title><text x="440" y="1616">区間の質問を、端点と更新時刻の三方向へ並べ替え</text><text x="440" y="1634">る</text></a></g><g class="flow-node question" data-node="check"><rect x="844" y="1506" width="320" height="150" rx="7"/><text class="node-kind" x="860" y="1526">質問</text><text class="node-title" x="860" y="1554">必要な条件を、問題文と小さい例から</text><text class="node-title" x="860" y="1577">確認できますか？</text><text class="node-explanation" x="860" y="1604">どの性質が入力で保証され、どの性質を式や操作から</text><text class="node-explanation" x="860" y="1622">示す必要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="438" y="1888" width="320" height="151" rx="7"/><text class="node-kind" x="454" y="1908">候補</text><text class="node-title" x="454" y="1936">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="454" y="1975">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="454" y="1999">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="895.25" y="1888" width="320" height="121" rx="7"/><text class="node-kind" x="911.25" y="1908">分野</text><text class="node-title" x="911.25" y="1936">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="911.25" y="1973">詳細の質問・図へ →</text></a></g></svg>