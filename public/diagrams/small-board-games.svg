<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-small-board-games flow-desc-small-board-games" width="860" height="1367" viewBox="0 0 860 1367" data-flow-svg="small-board-games"><title id="flow-title-small-board-games">即時勝利がある小さい盤面の解法フローチャート</title><desc id="flow-desc-small-board-games">盤面が埋まる前の勝利条件を、得点より先に判定します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-small-board-games" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="board-small:yes:terminal-priority"><title>はい</title><path d="M539.722 182 V194 C539.722 226 420.667 226 420.667 258 V270"/><path d="M420.667 308 V320 C420.667 352 420.667 352 420.667 384 V396" marker-end="url(#arrow-small-board-games)"/><g class="flow-edge-label" data-edge-label="board-small:yes:terminal-priority" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="board-small:no:fallback"><title>いいえ</title><path d="M619.722 182 V194 C619.722 226 655 226 655 258 V270"/><path d="M655 308 V320 C655 352 762.5 352 762.5 384 V396 V576 C762.5 608 762.5 608 762.5 640 V652 V702 C762.5 734 458 734 458 766 V778 V982 C458 1014 360 1014 360 1046 V1058 V1108 C360 1140 304 1140 304 1172 V1184" marker-end="url(#arrow-small-board-games)"/><g class="flow-edge-label" data-edge-label="board-small:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="board-small:unknown:check"><title>わからない</title><path d="M699.722 182 V194 C699.722 226 783.5 226 783.5 258 V270"/><path d="M783.5 308 V320 C783.5 352 818.5 352 818.5 384 V396 V576 C818.5 608 818.5 608 818.5 640 V652 V702 C818.5 734 721.333 734 721.333 766 V778" marker-end="url(#arrow-small-board-games)"/><g class="flow-edge-label" data-edge-label="board-small:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="terminal-priority:yes:board-result"><title>はい</title><path d="M340.667 564 V576 C340.667 608 192 608 192 640 V652"/><path d="M192 690 V702 C192 734 192 734 192 766 V778" marker-end="url(#arrow-small-board-games)"/><g class="flow-edge-label" data-edge-label="terminal-priority:yes:board-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="675">はい</text></g></g><g class="flow-edge no" data-edge="terminal-priority:no:fallback"><title>いいえ</title><path d="M420.667 564 V576 C420.667 608 402 608 402 640 V652"/><path d="M402 690 V702 C402 734 402 734 402 766 V778 V982 C402 1014 304 1014 304 1046 V1058 V1108 C304 1140 224 1140 224 1172 V1184" marker-end="url(#arrow-small-board-games)"/><g class="flow-edge-label" data-edge-label="terminal-priority:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="terminal-priority:unknown:check"><title>わからない</title><path d="M500.667 564 V576 C500.667 608 668 608 668 640 V652"/><path d="M668 690 V702 C668 734 614.667 734 614.667 766 V778" marker-end="url(#arrow-small-board-games)"/><g class="flow-edge-label" data-edge-label="terminal-priority:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 928 V982 C588 1014 450 1014 450 1046 V1058"/><path d="M450 1096 V1108 C450 1140 384 1140 384 1172 V1184" marker-end="url(#arrow-small-board-games)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1058" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1081">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 928 V982 C668 1014 655 1014 655 1046 V1058"/><path d="M655 1096 V1108 C655 1140 614.667 1140 614.667 1172 V1184" marker-end="url(#arrow-small-board-games)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1058" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1081">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 928 V982 C748 1014 783.5 1014 783.5 1046 V1058"/><path d="M783.5 1096 V1108 C783.5 1140 721.333 1140 721.333 1172 V1184" marker-end="url(#arrow-small-board-games)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1058" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1081">わからない</text></g></g><g class="flow-node question" data-node="board-small"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">盤面が小さく、二者が交互に空きマス</text><text class="node-title" x="475.7222222222223" y="103">を一つ自分の色に塗りますか？</text><text class="node-explanation" x="475.7222222222223" y="130">各マスは空き・一方の色・他方の色の三状態で表し、</text><text class="node-explanation" x="475.7222222222223" y="148">手番も盤面から定められるか確認します。</text></g><g class="flow-node question" data-node="terminal-priority"><rect x="260.6666666666667" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">並びで即時勝利となり、満盤だけ重み</text><text class="node-title" x="276.6666666666667" y="467">を比較し、総重みは奇数ですか？</text><text class="node-explanation" x="276.6666666666667" y="494">3×3 盤面で満盤の同点がない条件です。負の重み</text><text class="node-explanation" x="276.6666666666667" y="512">があっても、並びによる即時勝利を後回しにしませ</text><text class="node-explanation" x="276.6666666666667" y="530">ん。総和が偶数なら掲載実装の前提外です。</text></g><g class="flow-node result" data-node="board-result"><rect x="32" y="778" width="320" height="192" rx="7"/><text class="node-kind" x="48" y="798">候補</text><text class="node-title" x="48" y="826">即時勝利を先に判定し、全合法な一手</text><text class="node-title" x="48" y="849">の勝敗を比べる</text><a href="/flowchartcp/techniques/weighted-board-terminal-minimax/"><title>盤面の勝利条件と得点比較が混在するなら、終了判定を先に行うの記事へ</title><text x="48" y="888">盤面の勝利条件と得点比較が混在するなら、終了判</text><text x="48" y="906">定を先に行う</text></a><a href="/flowchartcp/techniques/game-theory/"><title>Grundy数の記事へ</title><text x="48" y="930">Grundy数</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="798">質問</text><text class="node-title" x="524" y="826">合法手、終了、返答、回数制限を、問</text><text class="node-title" x="524" y="849">題文で確認できますか？</text><text class="node-explanation" x="524" y="876">独立性や終了ルールが違う場合には、同じ勝敗・問い</text><text class="node-explanation" x="524" y="894">合わせ設計を使えません。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1184" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1204">候補</text><text class="node-title" x="160" y="1232">ルールと必要な情報を確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1271">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1295">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1184" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1204">分野</text><text class="node-title" x="524" y="1232">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1269">詳細の質問・図へ →</text></a></g></svg>