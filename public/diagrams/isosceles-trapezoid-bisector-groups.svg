<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-isosceles-trapezoid-bisector-groups flow-desc-isosceles-trapezoid-bisector-groups" width="1112" height="1791" viewBox="0 0 1112 1791" data-flow-svg="isosceles-trapezoid-bisector-groups"><title id="flow-title-isosceles-trapezoid-bisector-groups">等脚台形の二つの底辺を、垂直二等分線が同じで中点が異なる点対から選ぶの解法フローチャート</title><desc id="flow-desc-isosceles-trapezoid-bisector-groups">重み和と個数の違い、長方形の扱い、退化の除外、全点対列挙の上限を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-isosceles-trapezoid-bisector-groups" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge weighted-four" data-edge="model:weighted-four:assumptions"><title>相異なる四点から等脚台形を作り、四頂点の重みの和を最大化する</title><path d="M718.5 182 V194 C718.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 326 V338 C535.5 370 746.111 370 746.111 402 V414" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="model:weighted-four:assumptions" tabindex="0" role="group" aria-label="選択肢：相異なる四点から等脚台形を作り、四頂点の重みの和を最大化する"><rect x="413" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="535.5" y="293">相異なる四点から等脚台形を作り、四</text><text text-anchor="middle" x="535.5" y="311">頂点の重みの和を最大化する</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>台形の数を求める、または長方形を除くなど追加の形条件がある</title><path d="M798.5 182 V194 C798.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V576 C1018 608 1018 608 1018 640 V652 V702 C1018 734 1018 734 1018 766 V778 V981 C1018 1013 1018 1013 1018 1045 V1057 V1107 C1018 1139 636 1139 636 1171 V1183" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：台形の数を求める、または長方形を除くなど追加の形条件がある"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">台形の数を求める、または長方形を除</text><text text-anchor="middle" x="824.5" y="311">くなど追加の形条件がある</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M878.5 182 V194 C878.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V576 C1074 608 1074 608 1074 640 V652 V702 C1074 734 1074 734 1074 766 V778 V981 C1074 1013 1074 1013 1074 1045 V1057 V1107 C1074 1139 1000 1139 1000 1171 V1183" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 564 V576 C666.111 608 519.833 608 519.833 640 V652"/><path d="M519.833 690 V702 C519.833 734 519.833 734 519.833 766 V778" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="675">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 564 V576 C746.111 608 795 608 795 640 V652"/><path d="M795 690 V702 C795 734 906 734 906 766 V778 V981 C906 1013 906 1013 906 1045 V1057 V1107 C906 1139 556 1139 556 1171 V1183" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"><title>わからない</title><path d="M826.111 564 V576 C826.111 608 923.5 608 923.5 640 V652"/><path d="M923.5 690 V702 C923.5 734 962 734 962 766 V778 V981 C962 1013 962 1013 962 1045 V1057 V1107 C962 1139 920 1139 920 1171 V1183" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="assumptions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M439.833 969 V981 C439.833 1013 192 1013 192 1045 V1057"/><path d="M192 1095 V1107 C192 1139 192 1139 192 1171 V1183" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M519.833 969 V981 C519.833 1013 556 1013 556 1045 V1057"/><path d="M556 1095 V1107 C556 1139 476 1139 476 1171 V1183" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M599.833 969 V981 C599.833 1013 811.5 1013 811.5 1045 V1057"/><path d="M811.5 1095 V1107 C811.5 1139 840 1139 840 1171 V1183" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="767" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1080">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1333 V1400 C840 1432 783 1432 783 1464 V1476"/><path d="M783 1514 V1526 C783 1558 828.5 1558 828.5 1590 V1602" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1476" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1499">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1333 V1400 C920 1432 907 1432 907 1464 V1476"/><path d="M907 1514 V1526 C907 1558 908.5 1558 908.5 1590 V1602" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1476" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1499">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1333 V1400 C1000 1432 1035.5 1432 1035.5 1464 V1476"/><path d="M1035.5 1514 V1526 C1035.5 1558 988.5 1558 988.5 1590 V1602" marker-end="url(#arrow-isosceles-trapezoid-bisector-groups)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1476" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1499">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="638.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="654.5" y="52">質問</text><text class="node-title" x="654.5" y="80">点や領域について求める量と、許され</text><text class="node-title" x="654.5" y="103">る操作はどれですか？</text><text class="node-explanation" x="654.5" y="130">重み和と個数の違い、長方形の扱い、退化の除外、全</text><text class="node-explanation" x="654.5" y="148">点対列挙の上限を確認します。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="602.1111111111112" y="434">質問</text><text class="node-title" x="602.1111111111112" y="462">正の面積の等脚台形を対象とし、長方</text><text class="node-title" x="602.1111111111112" y="485">形も含みますか？</text><text class="node-explanation" x="602.1111111111112" y="512">平行な対辺の垂直二等分線が共通になります。原典の</text><text class="node-explanation" x="602.1111111111112" y="530">等脚台形の定義と長方形の扱いを確かめます。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="778" width="320" height="191" rx="7"/><text class="node-kind" x="375.83333333333337" y="798">質問</text><text class="node-title" x="375.83333333333337" y="826">点は1000個以下の整数点で、各重</text><text class="node-title" x="375.83333333333337" y="849">みは正、座標の絶対値と重みは10億</text><text class="node-title" x="375.83333333333337" y="872">以下ですか？</text><text class="node-explanation" x="375.83333333333337" y="899">同じ中点の二組は同一直線上の退化になるため、上位</text><text class="node-explanation" x="375.83333333333337" y="917">二組を無条件に選びません。線の正規化と座標積の桁</text><text class="node-explanation" x="375.83333333333337" y="935">あふれも確認します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">等脚台形の二つの底辺を、垂直二等分</text><text class="node-title" x="48" y="1254">線が同じで中点が異なる点対から選ぶ</text><a href="/flowchartcp/techniques/isosceles-trapezoid-bisector-groups/"><title>等脚台形の二つの底辺を、垂直二等分線が同じで中点が異なる点対から選ぶの記事へ</title><text x="48" y="1293">等脚台形の二つの底辺を、垂直二等分線が同じで中</text><text x="48" y="1311">点が異なる点対から選ぶ</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1183" width="320" height="205" rx="7"/><text class="node-kind" x="412" y="1203">候補</text><text class="node-title" x="412" y="1231">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1258">個数を数える場合や長方形を除く場合には、重み上位</text><text class="node-explanation" x="412" y="1276">だけの集計では足りません。中点・長さなどを追加し</text><text class="node-explanation" x="412" y="1294">て数え直します。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1324">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1348">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1183" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1203">質問</text><text class="node-title" x="776" y="1231">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1254">確認できますか？</text><text class="node-explanation" x="776" y="1281">重み和と個数の違い、長方形の扱い、退化の除外、全</text><text class="node-explanation" x="776" y="1299">点対列挙の上限を確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1602" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1622">分野</text><text class="node-title" x="764.5" y="1650">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1677">重み和と個数の違い、長方形の扱い、退化の除外、全</text><text class="node-explanation" x="764.5" y="1695">点対列挙の上限を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1723">詳細の質問・図へ →</text></a></g></svg>