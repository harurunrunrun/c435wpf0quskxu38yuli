ain"><title>わからない</title><path d="M1056 910 V940 C1056 972 1091.5 972 1091.5 1004 V1016"/><path d="M1091.5 1054 V1066 C1091.5 1098 1029.333 1098 1029.333 1130 V1142" marker-end="url(#arrow-string-substring-order-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1039">わからない</text></g></g><g class="flow-edge yes" data-edge="rotation-check:yes:rotation-result"><title>はい</title><path d="M840 546 V558 C840 590 248 590 248 622 V634"/><path d="M248 672 V684 C248 716 248 716 248 748 V760" marker-end="url(#arrow-string-substring-order-goals)"/><g class="flow-edge-label" data-edge-label="rotation-check:yes:rotation-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="657">はい</text></g></g><g class="flow-edge no" data-edge="rotation-check:no:fallback"><title>いいえ</title><path d="M920 546 V558 C920 590 612 590 612 622 V634"/><path d="M612 672 V684 C612 716 612 716 612 748 V760" marker-end="url(#arrow-string-substring-order-goals)"/><g class="flow-edge-label" data-edge-label="rotation-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="rotation-check:unknown:check"><title>わからない</title><path d="M1000 546 V558 C1000 590 976 590 976 622 V634"/><path d="M976 672 V684 C976 716 922.667 716 922.667 748 V760" marker-end="url(#arrow-string-substring-order-goals)"/><g class="flow-edge-label" data-edge-label="rotation-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="657">わからない</text></g></g><g class="flow-node question" data-node="append"><rect x="512.25" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="528.25" y="52">質問</text><text class="node-title" x="528.25" y="80">列の追加や、順位・巡回シフトを扱い</text><text class="node-title" x="528.25" y="103">ますか？</text><text class="node-explanation" x="528.25" y="130">文字を追加する処理と、固定された列の順位・巡回の</text><text class="node-explanation" x="528.25" y="148">比較を区別します。</text></g><g class="flow-node route" data-node="lex"><rect x="396" y="396" width="320" height="144" rx="7"/><text class="node-kind" x="412" y="416">分野</text><text class="node-title" x="412" y="444">固定された部分文字列の順位・出現・</text><text class="node-title" x="412" y="467">分類</text><a href="/flowchartcp/flowcharts/#diagram-string-substring-rank-details" data-route="string-substring-rank-details"><text x="412" y="504">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="816" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="832" y="780">質問</text><text class="node-title" x="832" y="808">二つの部分文字列が同じとき、出現位</text><text class="node-title" x="832" y="831">置や後続の扱いも共通ですか？</text><text class="node-explanation" x="832" y="858">何を一状態にまとめるかを確認し、必要なら出現集合</text><text class="node-explanation" x="832" y="876">の同値性を使います。</text></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1142" width="320" height="139" rx="7"/><text class="node-kind" x="832" y="1162">分野</text><text class="node-title" x="832" y="1190">条件を確かめる</text><text class="node-explanation" x="832" y="1217">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1245">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="sam"><rect x="278.5" y="1142" width="320" height="127" rx="7"/><text class="node-kind" x="294.5" y="1162">候補</text><text class="node-title" x="294.5" y="1190">接尾辞オートマトン</text><a href="/flowchartcp/techniques/suffix-automaton/"><title>接尾辞オートマトンの記事へ</title><text x="294.5" y="1229">接尾辞オートマトン</text></a></g><g class="flow-node result" data-node="fallback"><rect x="452" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="468" y="780">候補</text><text class="node-title" x="468" y="808">部分文字列を何で区別するか決める</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="468" y="847">状態の設計</text></a><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="468" y="871">寄与の数え上げ</text></a></g><g class="flow-node question" data-node="rotation-check"><rect x="760" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="416">質問</text><text class="node-title" x="776" y="444">すべての候補は、同じ長さの文字列を</text><text class="node-title" x="776" y="467">巡回させただけですか？</text><text class="node-explanation" x="776" y="494">一般の接尾辞の比較と、長さ n を保つ巡回シフト</text><text class="node-explanation" x="776" y="512">を区別します。</text></g><g class="flow-node result" data-node="rotation-result"><rect x="88" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="780">候補</text><text class="node-title" x="104" y="808">候補の二つの開始位置を比較し、劣る</text><text class="node-title" x="104" y="831">開始位置をまとめて飛ばす</text><a href="/flowchartcp/techniques/rotation-minimum/"><title>巡回シフトの最小候補を不一致位置までまとめて捨てるの記事へ</title><text x="104" y="870">巡回シフトの最小候補を不一致位置までまとめて捨</text><text x="104" y="888">てる</text></a></g></svg>