 class="flow-edge-label" data-edge-label="kind:minmax:assoc" tabindex="0" role="group" aria-label="選択肢：指定区間の最小値・最大値"><rect x="1194" y="229" width="180" height="38" rx="5"/><text text-anchor="middle" x="1284" y="252">指定区間の最小値・最大値</text></g></g><g class="flow-edge multiset" data-edge="kind:multiset:multiset"><title>二つの区間の値を並べ替えると一致するか</title><path d="M996.25 141 V153 C996.25 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-range-static-aggregate-forms)"/><g class="flow-edge-label" data-edge-label="kind:multiset:multiset" tabindex="0" role="group" aria-label="選択肢：二つの区間の値を並べ替えると一致するか"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">二つの区間の値を並べ替えると一致す</text><text text-anchor="middle" x="556" y="270">るか</text></g></g><g class="flow-edge apply" data-edge="kind:apply:all-update"><title>区間加算を全部終えた後の値</title><path d="M1188.25 141 V153 C1188.25 185 1514.5 185 1514.5 217 V229"/><path d="M1514.5 267 V297 C1514.5 329 1511.167 329 1511.167 361 V373" marker-end="url(#arrow-range-static-aggregate-forms)"/><g class="flow-edge-label" data-edge-label="kind:apply:all-update" tabindex="0" role="group" aria-label="選択肢：区間加算を全部終えた後の値"><rect x="1418" y="229" width="193" height="38" rx="5"/><text text-anchor="middle" x="1514.5" y="252">区間加算を全部終えた後の値</text></g></g><g class="flow-edge unknown" data-edge="kind:unknown:check"><title>わからない</title><path d="M1060.25 141 V153 C1060.25 185 1014.5 185 1014.5 217 V229"/><path d="M1014.5 267 V297 C1014.5 329 1014.5 329 1014.5 361 V373 V535 C1014.5 567 1014.5 567 1014.5 599 V611 V661 C1014.5 693 920 693 920 725 V737" marker-end="url(#arrow-range-static-aggregate-forms)"/><g class="flow-edge-label" data-edge-label="kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="970" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1014.5" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="multiset:yes:multiset-result"><title>はい</title><path d="M476 523 V535 C476 567 192 567 192 599 V611"/><path d="M192 649 V661 C192 693 192 693 192 725 V737" marker-end="url(#arrow-range-static-aggregate-forms)"/><g class="flow-edge-label" data-edge-label="multiset:yes:multiset-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="634">はい</text></g></g><g class="flow-edge no" data-edge="multiset:no:fallback"><title>いいえ</title><path d="M556 523 V535 C556 567 556 567 556 599 V611"/><path d="M556 649 V661 C556 693 556 693 556 725 V737" marker-end="url(#arrow-range-static-aggregate-forms)"/><g class="flow-edge-label" data-edge-label="multiset:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="multiset:unknown:check"><title>わからない</title><path d="M636 523 V535 C636 567 920 567 920 599 V611"/><path d="M920 649 V661 C920 693 840 693 840 725 V737" marker-end="url(#arrow-range-static-aggregate-forms)"/><g class="flow-edge-label" data-edge-label="multiset:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="634">わからない</text></g></g><g class="flow-node question" data-node="all-update"><rect x="1351.1666666666667" y="373" width="320" height="132" rx="7"/><text class="node-kind" x="1367.1666666666667" y="393">質問</text><text class="node-title" x="1367.1666666666667" y="421">すべての区間加算を終えた後の配列だ</text><text class="node-title" x="1367.1666666666667" y="444">けが必要ですか？</text><text class="node-explanation" x="1367.1666666666667" y="471">更新と問い合わせが交互に現れない場合に使います。</text></g><g class="flow-node route" data-node="assoc"><rect x="1124" y="737" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="757">分野</text><text class="node-title" x="1140" y="785">区間の結合と値・移動の条件</text><a href="/flowchartcp/flowcharts/#diagram-range-static-combination" data-route="range-static-combination"><text x="1140" y="822">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="737" width="320" height="168" rx="7"/><text class="node-kind" x="776" y="757">質問</text><text class="node-title" x="776" y="785">集計の演算に、接頭辞の不要な部分を</text><text class="node-title" x="776" y="808">消す逆演算がありますか？</text><text class="node-explanation" x="776" y="835">整数の和や XOR ならあります。min・max</text><text class="node-explanation" x="776" y="853"> には一般にありません。未確認なら候補を断定しま</text><text class="node-explanation" x="776" y="871">せん。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="1119" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="1139">分野</text><text class="node-title" x="1140" y="1167">条件を確かめる</text><text class="node-explanation" x="1140" y="1194">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="1222">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="prefix"><rect x="760" y="1119" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="1139">候補</text><text class="node-title" x="776" y="1167">累積和・接頭辞 XOR</text><a href="/flowchartcp/techniques/prefix-sum/"><title>累積和の記事へ</title><text x="776" y="1206">累積和</text></a></g><g class="flow-node result" data-node="difference"><rect x="1488" y="737" width="320" height="127" rx="7"/><text class="node-kind" x="1504" y="757">候補</text><text class="node-title" x="1504" y="785">差分配列</text><a href="/flowchartcp/techniques/difference-array/"><title>いもす法の記事へ</title><text x="1504" y="824">いもす法</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="737" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="757">候補</text><text class="node-title" x="412" y="785">集計する情報を見直す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="824">状態の設計</text></a><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="412" y="848">寄与の数え上げ</text></a></g><g class="flow-node question" data-node="kind"><rect x="932.25" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="948.25" y="52">質問</text><text class="node-title" x="948.25" y="80">変わらない配列から何を求めますか？</text><text class="node-explanation" x="948.25" y="107">演算の性質は、具体的な集計内容から確かめます。</text></g><g class="flow-node question" data-node="multiset"><rect x="396" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="393">質問</text><text class="node-title" x="412" y="421">並び順を無視した一致判定に、低い確</text><text class="node-title" x="412" y="444">率の誤判定を許容できますか？</text><text class="node-explanation" x="412" y="471">各値の乱数を足し、区間ごとの多重集合を表す方法が</text><text class="node-explanation" x="412" y="489">あります。</text></g><g class="flow-node result" data-node="multiset-result"><rect x="32" y="737" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="757">候補</text><text class="node-title" x="48" y="785">値ごとの乱数和で多重集合を比べる</text><a href="/flowchartcp/techniques/randomized-algorithms/"><title>乱択アルゴリズムの記事へ</title><text x="48" y="824">乱択アルゴリズム</text></a><a href="/flowchartcp/techniques/prefix-sum/"><title>累積和の記事へ</title><text x="48" y="848">累積和</text></a></g></svg>