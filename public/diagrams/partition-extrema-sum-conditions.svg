581 C710 613 710 613 710 645 V657 V707 C710 739 652 739 652 771 V783" marker-end="url(#arrow-partition-extrema-sum-conditions)"/><g class="flow-edge-label" data-edge-label="weight:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="fixed-coefficients:yes:answer"><title>はい</title><path d="M314.167 569 V581 C314.167 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-partition-extrema-sum-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-coefficients:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="fixed-coefficients:no:check"><title>いいえ</title><path d="M394.167 569 V581 C394.167 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 460 739 460 771 V783" marker-end="url(#arrow-partition-extrema-sum-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-coefficients:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed-coefficients:unknown:check"><title>わからない</title><path d="M474.167 569 V581 C474.167 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 524 739 524 771 V783" marker-end="url(#arrow-partition-extrema-sum-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-coefficients:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-node question" data-node="weight"><rect x="376.2222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="392.2222222222223" y="52">質問</text><text class="node-title" x="392.2222222222223" y="80">列を非空区間へ分け、最後の区間の重</text><text class="node-title" x="392.2222222222223" y="103">みを最大値と最小値の差にできます</text><text class="node-title" x="392.2222222222223" y="126">か？</text><text class="node-explanation" x="392.2222222222223" y="153">最大値の項と最小値の項へ線形に分けます。最大値と</text><text class="node-explanation" x="392.2222222222223" y="171">最小値の積には、この二つの和だけでは足りません。</text></g><g class="flow-node question" data-node="fixed-coefficients"><rect x="234.16666666666669" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="250.16666666666669" y="439">質問</text><text class="node-title" x="250.16666666666669" y="467">右端を伸ばす順に計算し、各切れ目よ</text><text class="node-title" x="250.16666666666669" y="490">り前のDPは既に確定していますか？</text><text class="node-explanation" x="250.16666666666669" y="517">同じ極値となる始点の係数を足します。始点数ではな</text><text class="node-explanation" x="250.16666666666669" y="535">く、確定済みのDPの総和が必要です。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">同じ極値の始点を、DPの重みを持つ</text><text class="node-title" x="48" y="854">単調スタックへまとめる</text><a href="/flowchartcp/techniques/partition-extrema-weighted-sum/"><title>分割の重みに区間の最大値・最小値が掛かるなら、同じ極値の遷移をまとめるの記事へ</title><text x="48" y="893">分割の重みに区間の最大値・最小値が掛かるなら、</text><text x="48" y="911">同じ極値の遷移をまとめる</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="783" width="320" height="144" rx="7"/><text class="node-kind" x="412" y="803">分野</text><text class="node-title" x="412" y="831">適用条件と、残す必要のある情報を確</text><text class="node-title" x="412" y="854">かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="891">詳細の質問・図へ →</text></a></g></svg>