<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-math flow-desc-math" width="3296" height="927" viewBox="0 0 3296 927" data-flow-svg="math"><title id="flow-title-math">整数の条件・数え上げの解法フローチャート</title><desc id="flow-desc-math">数える対象と、必要な代数的な演算を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-math" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge integer-equations" data-edge="number-task:integer-equations:category-integer-equations"><title>整数の等式・約数・余り・累乗</title><path d="M1520 141 V153 C1520 185 192 185 192 217 V229"/><path d="M192 267 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="number-task:integer-equations:category-integer-equations" tabindex="0" role="group" aria-label="選択肢：整数の等式・約数・余り・累乗"><rect x="89" y="229" width="206" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">整数の等式・約数・余り・累乗</text></g></g><g class="flow-edge bits-digits" data-edge="number-task:bits-digits:category-bits-digits"><title>桁や AND・OR・XOR の条件</title><path d="M1552 141 V153 C1552 185 556 185 556 217 V229"/><path d="M556 267 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="number-task:bits-digits:category-bits-digits" tabindex="0" role="group" aria-label="選択肢：桁や AND・OR・XOR の条件"><rect x="433.5" y="229" width="245" height="38" rx="5"/><text text-anchor="middle" x="556" y="252">桁や AND・OR・XOR の条件</text></g></g><g class="flow-edge counting-totals" data-edge="number-task:counting-totals:category-counting-totals"><title>組合せ・式の係数・割り算の総和</title><path d="M1584 141 V153 C1584 185 920 185 920 217 V229"/><path d="M920 267 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="number-task:counting-totals:category-counting-totals" tabindex="0" role="group" aria-label="選択肢：組合せ・式の係数・割り算の総和"><rect x="810.5" y="229" width="219" height="38" rx="5"/><text text-anchor="middle" x="920" y="252">組合せ・式の係数・割り算の総和</text></g></g><g class="flow-edge representable-sums" data-edge="number-task:representable-sums:representable-sums-route"><title>同じ非負の数を繰り返し足し、大きな範囲で作れる合計額を数える</title><path d="M1616 141 V153 C1616 185 1284 185 1284 217 V229"/><path d="M1284 285 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="number-task:representable-sums:representable-sums-route" tabindex="0" role="group" aria-label="選択肢：同じ非負の数を繰り返し足し、大きな範囲で作れる合計額を数える"><rect x="1161.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="252">同じ非負の数を繰り返し足し、大きな</text><text text-anchor="middle" x="1284" y="270">範囲で作れる合計額を数える</text></g></g><g class="flow-edge totient-prefix" data-edge="number-task:totient-prefix:totient-prefix-route"><title>非常に大きい上限までのトーティエント関数の総和を求める</title><path d="M1648 141 V153 C1648 185 1648 185 1648 217 V229"/><path d="M1648 285 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="number-task:totient-prefix:totient-prefix-route" tabindex="0" role="group" aria-label="選択肢：非常に大きい上限までのトーティエント関数の総和を求める"><rect x="1525.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="252">非常に大きい上限までのトーティエン</text><text text-anchor="middle" x="1648" y="270">ト関数の総和を求める</text></g></g><g class="flow-edge sum-divisor" data-edge="number-task:sum-divisor:sum-divisor-route"><title>上限以下で、自分の十進の桁和で割り切れる正整数の個数</title><path d="M1680 141 V153 C1680 185 2012 185 2012 217 V229"/><path d="M2012 285 V297 C2012 329 2012 329 2012 361 V373" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="number-task:sum-divisor:sum-divisor-route" tabindex="0" role="group" aria-label="選択肢：上限以下で、自分の十進の桁和で割り切れる正整数の個数"><rect x="1889.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="252">上限以下で、自分の十進の桁和で割り</text><text text-anchor="middle" x="2012" y="270">切れる正整数の個数</text></g></g><g class="flow-edge real-offset" data-edge="number-task:real-offset:real-offset-route"><title>全ての分母に同じ実数を足し、正の量を割った和を指定値へ合わせる</title><path d="M1712 141 V153 C1712 185 2376 185 2376 217 V229"/><path d="M2376 285 V297 C2376 329 2376 329 2376 361 V373" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="number-task:real-offset:real-offset-route" tabindex="0" role="group" aria-label="選択肢：全ての分母に同じ実数を足し、正の量を割った和を指定値へ合わせる"><rect x="2253.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="2376" y="252">全ての分母に同じ実数を足し、正の量</text><text text-anchor="middle" x="2376" y="270">を割った和を指定値へ合わせる</text></g></g><g class="flow-edge series-square" data-edge="number-task:series-square:series-square-route"><title>二乗すると与えた列になる係数列を一つ求め、存在しない場合も判定する</title><path d="M1744 141 V153 C1744 185 2740 185 2740 217 V229"/><path d="M2740 285 V297 C2740 329 2740 329 2740 361 V373" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="number-task:series-square:series-square-route" tabindex="0" role="group" aria-label="選択肢：二乗すると与えた列になる係数列を一つ求め、存在しない場合も判定する"><rect x="2617.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="2740" y="252">二乗すると与えた列になる係数列を一</text><text text-anchor="middle" x="2740" y="270">つ求め、存在しない場合も判定する</text></g></g><g class="flow-edge unknown" data-edge="number-task:unknown:check"><title>わからない</title><path d="M1776 141 V153 C1776 185 3104 185 3104 217 V229"/><path d="M3104 267 V297 C3104 329 3104 329 3104 361 V373" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="number-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="3059.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="3104" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M3024 523 V542 C3024 574 2740 574 2740 606 V618"/><path d="M2740 656 V668 C2740 700 2740 700 2740 732 V744" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="2700" y="618" width="80" height="38" rx="5"/><text text-anchor="middle" x="2740" y="641">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M3104 523 V542 C3104 574 3091 574 3091 606 V618"/><path d="M3091 656 V668 C3091 700 3050.667 700 3050.667 732 V744" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="3051" y="618" width="80" height="38" rx="5"/><text text-anchor="middle" x="3091" y="641">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M3184 523 V542 C3184 574 3219.5 574 3219.5 606 V618"/><path d="M3219.5 656 V668 C3219.5 700 3157.333 700 3157.333 732 V744" marker-end="url(#arrow-math)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="3175" y="618" width="89" height="38" rx="5"/><text text-anchor="middle" x="3219.5" y="641">わからない</text></g></g><g class="flow-node question" data-node="number-task"><rect x="1488" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1504" y="52">質問</text><text class="node-title" x="1504" y="80">整数や式について何を求めますか？</text><text class="node-explanation" x="1504" y="107">演算と、値の大きさの制約を選びます。</text></g><g class="flow-node question" data-node="check"><rect x="2944" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="2960" y="393">質問</text><text class="node-title" x="2960" y="421">答えは「個数」「最適値」「存在判</text><text class="node-title" x="2960" y="444">定」のどれか区別できますか？</text><text class="node-explanation" x="2960" y="471">同じ入力でも、求める量によって使う演算が異なりま</text><text class="node-explanation" x="2960" y="489">す。</text></g><g class="flow-node route" data-node="uncertain"><rect x="2944" y="744" width="320" height="139" rx="7"/><text class="node-kind" x="2960" y="764">分野</text><text class="node-title" x="2960" y="792">条件を確かめる</text><text class="node-explanation" x="2960" y="819">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="2960" y="847">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="2580" y="744" width="320" height="151" rx="7"/><text class="node-kind" x="2596" y="764">候補</text><text class="node-title" x="2596" y="792">求める量を式にする</text><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="2596" y="831">寄与の数え上げ</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="2596" y="855">状態の設計</text></a></g><g class="flow-node route" data-node="category-integer-equations"><rect x="32" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">整数の等式・約数・余り・累乗</text><text class="node-explanation" x="48" y="448">約数・互いに素の条件、変数間の差、余り・累乗の等</text><text class="node-explanation" x="48" y="466">式を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-math-integer-equations" data-route="math-integer-equations"><text x="48" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-bits-digits"><rect x="396" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">桁や AND・OR・XOR の条件</text><text class="node-explanation" x="412" y="448">整数の桁の条件、XORで作れる値、ビット演算の合</text><text class="node-explanation" x="412" y="466">計や等式を区別します。</text><a href="/flowchartcp/flowcharts/#diagram-math-bits-digits" data-route="math-bits-digits"><text x="412" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-counting-totals"><rect x="760" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">組合せ・式の係数・割り算の総和</text><text class="node-explanation" x="776" y="448">選び方の個数、式の積や係数、床を含む多数の項の総</text><text class="node-explanation" x="776" y="466">和を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-math-counting-totals" data-route="math-counting-totals"><text x="776" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="representable-sums-route"><rect x="1124" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">同じ非負の数を繰り返し足し、大きな</text><text class="node-title" x="1140" y="444">範囲で作れる合計額を数える</text><a href="/flowchartcp/flowcharts/#diagram-integer-representable-residues" data-route="integer-representable-residues"><text x="1140" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="totient-prefix-route"><rect x="1488" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">非常に大きい上限までのトーティエン</text><text class="node-title" x="1504" y="444">ト関数の総和を求める</text><a href="/flowchartcp/flowcharts/#diagram-totient-prefix-quotients" data-route="totient-prefix-quotients"><text x="1504" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="sum-divisor-route"><rect x="1852" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="393">分野</text><text class="node-title" x="1868" y="421">上限以下で、自分の十進の桁和で割り</text><text class="node-title" x="1868" y="444">切れる正整数の個数</text><a href="/flowchartcp/flowcharts/#diagram-digit-sum-divisor-conditions" data-route="digit-sum-divisor-conditions"><text x="1868" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="real-offset-route"><rect x="2216" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="2232" y="393">分野</text><text class="node-title" x="2232" y="421">全ての分母に同じ実数を足し、正の量</text><text class="node-title" x="2232" y="444">を割った和を指定値へ合わせる</text><a href="/flowchartcp/flowcharts/#diagram-real-offset-positive-conditions" data-route="real-offset-positive-conditions"><text x="2232" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="series-square-route"><rect x="2580" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="2596" y="393">分野</text><text class="node-title" x="2596" y="421">二乗から係数列を復元する</text><a href="/flowchartcp/flowcharts/#diagram-series-square-root-conditions" data-route="series-square-root-conditions"><text x="2596" y="458">詳細の質問・図へ →</text></a></g></svg>