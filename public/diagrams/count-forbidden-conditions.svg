<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-count-forbidden-conditions flow-desc-count-forbidden-conditions" width="1532" height="1303" viewBox="0 0 1532 1303" data-flow-svg="count-forbidden-conditions"><title id="flow-title-count-forbidden-conditions">禁止・一致条件のある数え上げの解法フローチャート</title><desc id="flow-desc-count-forbidden-conditions">元の位置、同じ位置、行や列、一般の禁止条件を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-count-forbidden-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1260 887 V918 C1260 950 1066 950 1066 982 V994"/><path d="M1066 1032 V1044 C1066 1076 1029.333 1076 1029.333 1108 V1120" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1026" y="994" width="80" height="38" rx="5"/><text text-anchor="middle" x="1066" y="1017">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1340 887 V918 C1340 950 1327 950 1327 982 V994"/><path d="M1327 1032 V1044 C1327 1076 1286.667 1076 1286.667 1108 V1120" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1287" y="994" width="80" height="38" rx="5"/><text text-anchor="middle" x="1327" y="1017">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1420 887 V918 C1420 950 1455.5 950 1455.5 982 V994"/><path d="M1455.5 1032 V1044 C1455.5 1076 1393.333 1076 1393.333 1108 V1120" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1411" y="994" width="89" height="38" rx="5"/><text text-anchor="middle" x="1455.5" y="1017">わからない</text></g></g><g class="flow-edge yes" data-edge="forbidden-check:yes:forbidden-result"><title>はい</title><path d="M1204 541 V553 C1204 585 920 585 920 617 V629"/><path d="M920 667 V679 C920 711 920 711 920 743 V755" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="forbidden-check:yes:forbidden-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="652">はい</text></g></g><g class="flow-edge no" data-edge="forbidden-check:no:fallback"><title>いいえ</title><path d="M1284 541 V553 C1284 585 1130 585 1130 617 V629"/><path d="M1130 667 V679 C1130 711 1130 711 1130 743 V755 V918 C1130 950 976 950 976 982 V994 V1044 C976 1076 922.667 1076 922.667 1108 V1120" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="forbidden-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1090" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1130" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="forbidden-check:unknown:check"><title>わからない</title><path d="M1364 541 V553 C1364 585 1340 585 1340 617 V629"/><path d="M1340 667 V679 C1340 711 1286.667 711 1286.667 743 V755" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="forbidden-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1295.5" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="1340" y="652">わからない</text></g></g><g class="flow-edge permutation-fixed" data-edge="forbidden-kind:permutation-fixed:derangement-route"><title>順列で元の位置への配置を禁止する、または一致する位置数を指定する</title><path d="M766.933 159 V171 C766.933 203 192 203 192 235 V247"/><path d="M192 303 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="forbidden-kind:permutation-fixed:derangement-route" tabindex="0" role="group" aria-label="選択肢：順列で元の位置への配置を禁止する、または一致する位置数を指定する"><rect x="69.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="270">順列で元の位置への配置を禁止する、</text><text text-anchor="middle" x="192" y="288">または一致する位置数を指定する</text></g></g><g class="flow-edge coordinate-match" data-edge="forbidden-kind:coordinate-match:injective-route"><title>二つの列がそれぞれ重複を持たず、同じ位置の値が違う</title><path d="M820.267 159 V171 C820.267 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="forbidden-kind:coordinate-match:injective-route" tabindex="0" role="group" aria-label="選択肢：二つの列がそれぞれ重複を持たず、同じ位置の値が違う"><rect x="433.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">二つの列がそれぞれ重複を持たず、同</text><text text-anchor="middle" x="556" y="288">じ位置の値が違う</text></g></g><g class="flow-edge rows-cols" data-edge="forbidden-kind:rows-cols:grid-colors-route"><title>二色のマスが、同じ行・同じ列を使わない</title><path d="M873.6 159 V171 C873.6 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="forbidden-kind:rows-cols:grid-colors-route" tabindex="0" role="group" aria-label="選択肢：二色のマスが、同じ行・同じ列を使わない"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">二色のマスが、同じ行・同じ列を使わ</text><text text-anchor="middle" x="920" y="288">ない</text></g></g><g class="flow-edge other" data-edge="forbidden-kind:other:forbidden-check"><title>複数の禁止条件の交わりを数えられる</title><path d="M926.933 159 V171 C926.933 203 1244.5 203 1244.5 235 V247"/><path d="M1244.5 285 V315 C1244.5 347 1284 347 1284 379 V391" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="forbidden-kind:other:forbidden-check" tabindex="0" role="group" aria-label="選択肢：複数の禁止条件の交わりを数えられる"><rect x="1122" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="1244.5" y="270">複数の禁止条件の交わりを数えられる</text></g></g><g class="flow-edge unknown" data-edge="forbidden-kind:unknown:check"><title>わからない</title><path d="M980.267 159 V171 C980.267 203 1455.5 203 1455.5 235 V247"/><path d="M1455.5 285 V315 C1455.5 347 1494 347 1494 379 V391 V553 C1494 585 1434.5 585 1434.5 617 V629 V679 C1434.5 711 1393.333 711 1393.333 743 V755" marker-end="url(#arrow-count-forbidden-conditions)"/><g class="flow-edge-label" data-edge-label="forbidden-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1411" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1455.5" y="270">わからない</text></g></g><g class="flow-node question" data-node="check"><rect x="1180" y="755" width="320" height="132" rx="7"/><text class="node-kind" x="1196" y="775">質問</text><text class="node-title" x="1196" y="803">一つの対象を何回数えているか、小さ</text><text class="node-title" x="1196" y="826">い例で確認できますか？</text><text class="node-explanation" x="1196" y="853">重複、空集合、固定点の有無を調べます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1180" y="1120" width="320" height="139" rx="7"/><text class="node-kind" x="1196" y="1140">分野</text><text class="node-title" x="1196" y="1168">条件を確かめる</text><text class="node-explanation" x="1196" y="1195">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1196" y="1223">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="816" y="1120" width="320" height="151" rx="7"/><text class="node-kind" x="832" y="1140">候補</text><text class="node-title" x="832" y="1168">小規模全探索で数え方を確認する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="832" y="1207">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="832" y="1231">反例探し</text></a></g><g class="flow-node question" data-node="forbidden-check"><rect x="1124" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="411">質問</text><text class="node-title" x="1140" y="439">同時に満たす禁止条件の個数を、各部</text><text class="node-title" x="1140" y="462">分集合ごとに数えられますか？</text><text class="node-explanation" x="1140" y="489">不在条件などの重複を補正するため、交わりを数えま</text><text class="node-explanation" x="1140" y="507">す。</text></g><g class="flow-node result" data-node="forbidden-result"><rect x="760" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="776" y="775">候補</text><text class="node-title" x="776" y="803">禁止条件の交わりを包除する</text><a href="/flowchartcp/techniques/inclusion-exclusion-forbidden/"><title>全ての指定文字を含む列を、欠ける文字から数えるの記事へ</title><text x="776" y="842">全ての指定文字を含む列を、欠ける文字から数える</text></a><a href="/flowchartcp/techniques/complement-counting/"><title>補集合で数えるの記事へ</title><text x="776" y="866">補集合で数える</text></a></g><g class="flow-node question" data-node="forbidden-kind"><rect x="713.6" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="729.6" y="52">質問</text><text class="node-title" x="729.6" y="80">禁止・一致条件は、どの形ですか？</text><text class="node-explanation" x="729.6" y="107">同じ物を二回使えるかと、位置ごとの一致条件を分け</text><text class="node-explanation" x="729.6" y="125">ます。</text></g><g class="flow-node route" data-node="derangement-route"><rect x="32" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">元の位置に置かない順列</text><a href="/flowchartcp/flowcharts/#diagram-permutation-fixed-positions" data-route="permutation-fixed-positions"><text x="48" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="injective-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">重複のない二列の同位置不一致</text><a href="/flowchartcp/flowcharts/#diagram-injective-pair-positions" data-route="injective-pair-positions"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="grid-colors-route"><rect x="760" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">二色が行・列を共有しない配置</text><a href="/flowchartcp/flowcharts/#diagram-grid-color-rows-cols" data-route="grid-color-rows-cols"><text x="776" y="476">詳細の質問・図へ →</text></a></g></svg>