<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-sequence-operation-goals flow-desc-sequence-operation-goals" width="2260" height="943" viewBox="0 0 2260 943" data-flow-svg="sequence-operation-goals"><title id="flow-title-sequence-operation-goals">列を変える操作と、目標の形の解法フローチャート</title><desc id="flow-desc-sequence-operation-goals">交換・加算・出現位置・一括減算の操作を、問題の目標から区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-sequence-operation-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge equal-pair" data-edge="goal:equal-pair:equal-route"><title>二列を同時に交換して、同じ列にできるか</title><path d="M1106.786 182 V194 C1106.786 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="goal:equal-pair:equal-route" tabindex="0" role="group" aria-label="選択肢：二列を同時に交換して、同じ列にできるか"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">二列を同時に交換して、同じ列にでき</text><text text-anchor="middle" x="192" y="311">るか</text></g></g><g class="flow-edge unequal-pair" data-edge="goal:unequal-pair:unequal-route"><title>片方だけを並べ替え、同じ位置に同じ値を置かない</title><path d="M1146.786 182 V194 C1146.786 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="goal:unequal-pair:unequal-route" tabindex="0" role="group" aria-label="選択肢：片方だけを並べ替え、同じ位置に同じ値を置かない"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">片方だけを並べ替え、同じ位置に同じ</text><text text-anchor="middle" x="556" y="311">値を置かない</text></g></g><g class="flow-edge add-to-sorted" data-edge="goal:add-to-sorted:add-route"><title>一要素を別の要素へ加え、非減少列を作る</title><path d="M1186.786 182 V194 C1186.786 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="goal:add-to-sorted:add-route" tabindex="0" role="group" aria-label="選択肢：一要素を別の要素へ加え、非減少列を作る"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">一要素を別の要素へ加え、非減少列を</text><text text-anchor="middle" x="920" y="311">作る</text></g></g><g class="flow-edge occurrence-position" data-edge="goal:occurrence-position:occurrence-route"><title>各値の、指定順位の出現を予約位置へ置く</title><path d="M1226.786 182 V194 C1226.786 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="goal:occurrence-position:occurrence-route" tabindex="0" role="group" aria-label="選択肢：各値の、指定順位の出現を予約位置へ置く"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">各値の、指定順位の出現を予約位置へ</text><text text-anchor="middle" x="1284" y="311">置く</text></g></g><g class="flow-edge circular-zero" data-edge="goal:circular-zero:ramp-route"><title>環の全位置から、回転した 1,2,…,N を引いて全零にできるか</title><path d="M1266.786 182 V194 C1266.786 226 1648 226 1648 258 V270"/><path d="M1648 326 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="goal:circular-zero:ramp-route" tabindex="0" role="group" aria-label="選択肢：環の全位置から、回転した 1,2,…,N を引いて全零にできるか"><rect x="1525.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="293">環の全位置から、回転した 1,</text><text text-anchor="middle" x="1648" y="311">2,…,N を引いて全零にできるか</text></g></g><g class="flow-edge other" data-edge="goal:other:fallback"><title>その他の操作や、目標の形</title><path d="M1306.786 182 V194 C1306.786 226 1904.5 226 1904.5 258 V270"/><path d="M1904.5 308 V338 C1904.5 370 1858 370 1858 402 V414 V558 C1858 590 1704 590 1704 622 V634 V684 C1704 716 1650.667 716 1650.667 748 V760" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="goal:other:fallback" tabindex="0" role="group" aria-label="選択肢：その他の操作や、目標の形"><rect x="1814.5" y="270" width="180" height="38" rx="5"/><text text-anchor="middle" x="1904.5" y="293">その他の操作や、目標の形</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M1346.786 182 V194 C1346.786 226 2083 226 2083 258 V270"/><path d="M2083 308 V338 C2083 370 2068 370 2068 402 V414" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2038.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="2083" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1988 546 V558 C1988 590 1794 590 1794 622 V634"/><path d="M1794 672 V684 C1794 716 1757.333 716 1757.333 748 V760" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1754" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="1794" y="657">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2068 546 V558 C2068 590 2055 590 2055 622 V634"/><path d="M2055 672 V684 C2055 716 2014.667 716 2014.667 748 V760" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2015" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="2055" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2148 546 V558 C2148 590 2183.5 590 2183.5 622 V634"/><path d="M2183.5 672 V684 C2183.5 716 2121.333 716 2121.333 748 V760" marker-end="url(#arrow-sequence-operation-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2139" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="2183.5" y="657">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="1066.7857142857142" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1082.7857142857142" y="52">質問</text><text class="node-title" x="1082.7857142857142" y="80">操作によって、列をどの形にします</text><text class="node-title" x="1082.7857142857142" y="103">か？</text><text class="node-explanation" x="1082.7857142857142" y="130">許される操作が似ていても、一致・不一致・整列・全</text><text class="node-explanation" x="1082.7857142857142" y="148">零は別の目標です。</text></g><g class="flow-node route" data-node="equal-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">三添字を共有する二列の同時交換</text><a href="/flowchartcp/flowcharts/#diagram-two-sequence-shared-swaps" data-route="two-sequence-shared-swaps"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="unequal-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">片方だけを並べ替えて等値を避ける</text><a href="/flowchartcp/flowcharts/#diagram-two-sequence-unequal-arrangement" data-route="two-sequence-unequal-arrangement"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="add-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">要素加算だけで非減少列を作る</text><a href="/flowchartcp/flowcharts/#diagram-sequence-addition-to-nondecreasing" data-route="sequence-addition-to-nondecreasing"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="occurrence-route"><rect x="1124" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">出現順位の予約と前後の配置</text><a href="/flowchartcp/flowcharts/#diagram-reserved-occurrence-placement" data-route="reserved-occurrence-placement"><text x="1140" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="ramp-route"><rect x="1488" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="434">分野</text><text class="node-title" x="1504" y="462">環への一括減算の必要回数</text><a href="/flowchartcp/flowcharts/#diagram-circular-ramp-to-zero" data-route="circular-ramp-to-zero"><text x="1504" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1908" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="1924" y="434">質問</text><text class="node-title" x="1924" y="462">必要な条件を、問題文と小さい例から</text><text class="node-title" x="1924" y="485">確認できますか？</text><text class="node-explanation" x="1924" y="512">操作の条件と、求める個数・値・順序を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="1544" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="1560" y="780">候補</text><text class="node-title" x="1560" y="808">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1560" y="847">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="1560" y="871">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1908" y="760" width="320" height="121" rx="7"/><text class="node-kind" x="1924" y="780">分野</text><text class="node-title" x="1924" y="808">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1924" y="845">詳細の質問・図へ →</text></a></g></svg>