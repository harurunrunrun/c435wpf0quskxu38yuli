<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strings-common-all flow-desc-strings-common-all" width="748" height="983" viewBox="0 0 748 983" data-flow-svg="strings-common-all"><title id="flow-title-strings-common-all">全ての文字列に共通する連続部分の解法フローチャート</title><desc id="flow-desc-strings-common-all">共通部分列との違いと、全入力の候補を残すことを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strings-common-all" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="contiguous:yes:shortest-base"><title>はい</title><path d="M456.222 205 V217 C456.222 249 394.167 249 394.167 281 V293"/><path d="M394.167 331 V343 C394.167 375 394.167 375 394.167 407 V419" marker-end="url(#arrow-strings-common-all)"/><g class="flow-edge-label" data-edge-label="contiguous:yes:shortest-base" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="354.1666666666667" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="394.1666666666667" y="316">はい</text></g></g><g class="flow-edge no" data-edge="contiguous:no:check"><title>いいえ</title><path d="M536.222 205 V217 C536.222 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V581 C654 613 654 613 654 645 V657 V707 C654 739 588 739 588 771 V783" marker-end="url(#arrow-strings-common-all)"/><g class="flow-edge-label" data-edge-label="contiguous:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="contiguous:unknown:check"><title>わからない</title><path d="M616.222 205 V217 C616.222 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 407 V419 V581 C710 613 710 613 710 645 V657 V707 C710 739 652 739 652 771 V783" marker-end="url(#arrow-strings-common-all)"/><g class="flow-edge-label" data-edge-label="contiguous:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="shortest-base:yes:answer"><title>はい</title><path d="M314.167 569 V581 C314.167 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-strings-common-all)"/><g class="flow-edge-label" data-edge-label="shortest-base:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="shortest-base:no:check"><title>いいえ</title><path d="M394.167 569 V581 C394.167 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 460 739 460 771 V783" marker-end="url(#arrow-strings-common-all)"/><g class="flow-edge-label" data-edge-label="shortest-base:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="shortest-base:unknown:check"><title>わからない</title><path d="M474.167 569 V581 C474.167 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 524 739 524 771 V783" marker-end="url(#arrow-strings-common-all)"/><g class="flow-edge-label" data-edge-label="shortest-base:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-node question" data-node="contiguous"><rect x="376.2222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="392.2222222222223" y="52">質問</text><text class="node-title" x="392.2222222222223" y="80">固定された複数の文字列から、全てに</text><text class="node-title" x="392.2222222222223" y="103">共通する連続部分文字列を求めます</text><text class="node-title" x="392.2222222222223" y="126">か？</text><text class="node-explanation" x="392.2222222222223" y="153">飛び飛びの部分列や、一部の入力だけに現れる条件は</text><text class="node-explanation" x="392.2222222222223" y="171">別の問題です。</text></g><g class="flow-node question" data-node="shortest-base"><rect x="234.16666666666669" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="250.16666666666669" y="439">質問</text><text class="node-title" x="250.16666666666669" y="467">最短の文字列を基準にし、入力ごとの</text><text class="node-title" x="250.16666666666669" y="490">一致長を接尾辞へ伝えられますか？</text><text class="node-explanation" x="250.16666666666669" y="517">各状態の最大一致長を伝播した後、入力間の最小値を</text><text class="node-explanation" x="250.16666666666669" y="535">取ります。一つの候補だけを次の入力へ渡しません。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">状態ごとの最大一致長を集め、全入力</text><text class="node-title" x="48" y="854">での最小値を取る</text><a href="/flowchartcp/techniques/sam-common-all-strings/"><title>複数の文字列に共通する最長部分文字列を、状態ごとの一致長の最小値で求めるの記事へ</title><text x="48" y="893">複数の文字列に共通する最長部分文字列を、状態ご</text><text x="48" y="911">との一致長の最小値で求める</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="783" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="803">分野</text><text class="node-title" x="412" y="831">前提と、求める対象を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="868">詳細の質問・図へ →</text></a></g></svg>