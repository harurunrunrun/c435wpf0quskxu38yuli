<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-connectivity-operation-order flow-desc-connectivity-operation-order" width="748" height="567" viewBox="0 0 748 567" data-flow-svg="connectivity-operation-order"><title id="flow-title-connectivity-operation-order">操作と問い合わせの順序を確かめるの解法フローチャート</title><desc id="flow-desc-connectivity-operation-order">追加や削除を先に読めるかを確かめ、操作を整理するか、足りない条件を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-connectivity-operation-order" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M388.833 182 V194 C388.833 226 192 226 192 258 V270"/><path d="M192 308 V320 C192 352 192 352 192 384 V396" marker-end="url(#arrow-connectivity-operation-order)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M468.833 182 V194 C468.833 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 502.667 352 502.667 384 V396" marker-end="url(#arrow-connectivity-operation-order)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M548.833 182 V194 C548.833 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 609.333 352 609.333 384 V396" marker-end="url(#arrow-connectivity-operation-order)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-node question" data-node="check"><rect x="308.8333333333333" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="324.8333333333333" y="52">質問</text><text class="node-title" x="324.8333333333333" y="80">各辺の追加・削除時刻を、問い合わせ</text><text class="node-title" x="324.8333333333333" y="103">より先に取得できますか？</text><text class="node-explanation" x="324.8333333333333" y="130">オフラインでなければ、逆順処理や時刻の分割をその</text><text class="node-explanation" x="324.8333333333333" y="148">まま使えません。</text></g><g class="flow-node result" data-node="fallback"><rect x="32" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="416">候補</text><text class="node-title" x="48" y="444">変更する辺と時刻を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="48" y="483">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="396" y="396" width="320" height="139" rx="7"/><text class="node-kind" x="412" y="416">分野</text><text class="node-title" x="412" y="444">条件を確かめる</text><text class="node-explanation" x="412" y="471">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="499">詳細の質問・図へ →</text></a></g></svg>