<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-mex-sort-conditions flow-desc-mex-sort-conditions" width="748" height="1019" viewBox="0 0 748 1019" data-flow-svg="mex-sort-conditions"><title id="flow-title-mex-sort-conditions">mexを代入して列を整えるの解法フローチャート</title><desc id="flow-desc-mex-sort-conditions">配列全体のmex、任意の位置、完成形と回数上限を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-mex-sort-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="missing-min:yes:fixed-target"><title>はい</title><path d="M456.222 200 V212 C456.222 244 394.167 244 394.167 276 V288"/><path d="M394.167 326 V338 C394.167 370 394.167 370 394.167 402 V414" marker-end="url(#arrow-mex-sort-conditions)"/><g class="flow-edge-label" data-edge-label="missing-min:yes:fixed-target" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="354.1666666666667" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="394.1666666666667" y="311">はい</text></g></g><g class="flow-edge no" data-edge="missing-min:no:check"><title>いいえ</title><path d="M536.222 200 V212 C536.222 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V617 C654 649 654 649 654 681 V693 V743 C654 775 588 775 588 807 V819" marker-end="url(#arrow-mex-sort-conditions)"/><g class="flow-edge-label" data-edge-label="missing-min:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="missing-min:unknown:check"><title>わからない</title><path d="M616.222 200 V212 C616.222 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V617 C710 649 710 649 710 681 V693 V743 C710 775 652 775 652 807 V819" marker-end="url(#arrow-mex-sort-conditions)"/><g class="flow-edge-label" data-edge-label="missing-min:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="fixed-target:yes:answer"><title>はい</title><path d="M314.167 605 V617 C314.167 649 192 649 192 681 V693"/><path d="M192 731 V743 C192 775 192 775 192 807 V819" marker-end="url(#arrow-mex-sort-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-target:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="716">はい</text></g></g><g class="flow-edge no" data-edge="fixed-target:no:check"><title>いいえ</title><path d="M394.167 605 V617 C394.167 649 431 649 431 681 V693"/><path d="M431 731 V743 C431 775 460 775 460 807 V819" marker-end="url(#arrow-mex-sort-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-target:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed-target:unknown:check"><title>わからない</title><path d="M474.167 605 V617 C474.167 649 559.5 649 559.5 681 V693"/><path d="M559.5 731 V743 C559.5 775 524 775 524 807 V819" marker-end="url(#arrow-mex-sort-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-target:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="716">わからない</text></g></g><g class="flow-node question" data-node="missing-min"><rect x="376.2222222222223" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="392.2222222222223" y="52">質問</text><text class="node-title" x="392.2222222222223" y="80">任意の一要素を、配列全体の現在の</text><text class="node-title" x="392.2222222222223" y="103">mexへ置き換えられますか？</text><text class="node-explanation" x="392.2222222222223" y="130">mexは出現しない最小の非負整数です。区間だけの</text><text class="node-explanation" x="392.2222222222223" y="148">mexや、置換先の位置に制約がある操作には、その</text><text class="node-explanation" x="392.2222222222223" y="166">まま使えません。</text></g><g class="flow-node question" data-node="fixed-target"><rect x="234.16666666666669" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="250.16666666666669" y="434">質問</text><text class="node-title" x="250.16666666666669" y="462">値0からNを許し、0,1,...,</text><text class="node-title" x="250.16666666666669" y="485">N−1への完成でよく、2N回以内な</text><text class="node-title" x="250.16666666666669" y="508">らよいですか？</text><text class="node-explanation" x="250.16666666666669" y="535">途中で値Nを使います。最小回数や異なる指定の完成</text><text class="node-explanation" x="250.16666666666669" y="553">形が必要な場合、ここで回数や到達性を断定しませ</text><text class="node-explanation" x="250.16666666666669" y="571">ん。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="819" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">mexと同じ添字を固定し、mex=</text><text class="node-title" x="48" y="890">Nのときだけ未完成の位置を変える</text><a href="/flowchartcp/techniques/mex-sort-fix-positions/"><title>配列のmexを代入できるなら、値と添字が一致する位置を増やすの記事へ</title><text x="48" y="929">配列のmexを代入できるなら、値と添字が一致す</text><text x="48" y="947">る位置を増やす</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="819" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="839">分野</text><text class="node-title" x="412" y="867">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="904">詳細の質問・図へ →</text></a></g></svg>