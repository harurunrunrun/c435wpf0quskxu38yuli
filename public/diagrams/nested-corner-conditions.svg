<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-nested-corner-conditions flow-desc-nested-corner-conditions" width="748" height="1393" viewBox="0 0 748 1393" data-flow-svg="nested-corner-conditions"><title id="flow-title-nested-corner-conditions">角の対応付けと長方形の境界検査の解法フローチャート</title><desc id="flow-desc-nested-corner-conditions">操作の単位と、必要な制約を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-nested-corner-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="corner-model:yes:laminar-boundaries"><title>はい</title><path d="M464.5 205 V217 C464.5 249 419 249 419 281 V293"/><path d="M419 331 V343 C419 375 432.5 375 432.5 407 V419" marker-end="url(#arrow-nested-corner-conditions)"/><g class="flow-edge-label" data-edge-label="corner-model:yes:laminar-boundaries" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="316">はい</text></g></g><g class="flow-edge no" data-edge="corner-model:no:check"><title>いいえ</title><path d="M544.5 205 V217 C544.5 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V604 C654 636 654 636 654 668 V680 V730 C654 762 654 762 654 794 V806 V968 C654 1000 654 1000 654 1032 V1044 V1094 C654 1126 624.571 1126 624.571 1158 V1170" marker-end="url(#arrow-nested-corner-conditions)"/><g class="flow-edge-label" data-edge-label="corner-model:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="corner-model:unknown:check"><title>わからない</title><path d="M624.5 205 V217 C624.5 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 407 V419 V604 C710 636 710 636 710 668 V680 V730 C710 762 710 762 710 794 V806 V968 C710 1000 710 1000 710 1032 V1044 V1094 C710 1126 670.286 1126 670.286 1158 V1170" marker-end="url(#arrow-nested-corner-conditions)"/><g class="flow-edge-label" data-edge-label="corner-model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="laminar-boundaries:yes:size"><title>はい</title><path d="M352.5 592 V604 C352.5 636 307 636 307 668 V680"/><path d="M307 718 V730 C307 762 319.5 762 319.5 794 V806" marker-end="url(#arrow-nested-corner-conditions)"/><g class="flow-edge-label" data-edge-label="laminar-boundaries:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="703">はい</text></g></g><g class="flow-edge no" data-edge="laminar-boundaries:no:check"><title>いいえ</title><path d="M432.5 592 V604 C432.5 636 431 636 431 668 V680"/><path d="M431 718 V730 C431 762 542 762 542 794 V806 V968 C542 1000 542 1000 542 1032 V1044 V1094 C542 1126 533.143 1126 533.143 1158 V1170" marker-end="url(#arrow-nested-corner-conditions)"/><g class="flow-edge-label" data-edge-label="laminar-boundaries:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="703">いいえ</text></g></g><g class="flow-edge unknown" data-edge="laminar-boundaries:unknown:check"><title>わからない</title><path d="M512.5 592 V604 C512.5 636 559.5 636 559.5 668 V680"/><path d="M559.5 718 V730 C559.5 762 598 762 598 794 V806 V968 C598 1000 598 1000 598 1032 V1044 V1094 C598 1126 578.857 1126 578.857 1158 V1170" marker-end="url(#arrow-nested-corner-conditions)"/><g class="flow-edge-label" data-edge-label="laminar-boundaries:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="680" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M239.5 956 V968 C239.5 1000 192 1000 192 1032 V1044"/><path d="M192 1082 V1094 C192 1126 192 1126 192 1158 V1170" marker-end="url(#arrow-nested-corner-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1044" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1067">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 956 V968 C319.5 1000 319 1000 319 1032 V1044"/><path d="M319 1082 V1094 C319 1126 441.714 1126 441.714 1158 V1170" marker-end="url(#arrow-nested-corner-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1044" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1067">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 956 V968 C399.5 1000 447.5 1000 447.5 1032 V1044"/><path d="M447.5 1082 V1094 C447.5 1126 487.429 1126 487.429 1158 V1170" marker-end="url(#arrow-nested-corner-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1044" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1067">わからない</text></g></g><g class="flow-node question" data-node="corner-model"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">左上角と右下角の集合が同数あり、二</text><text class="node-title" x="400.5" y="103">集合を合わせた全ての位置が相異なり</text><text class="node-title" x="400.5" y="126">ますか？</text><text class="node-explanation" x="400.5" y="153">角の種類は既知で、各左上角に右下角を一つずつ対応</text><text class="node-explanation" x="400.5" y="171">させます。</text></g><g class="flow-node question" data-node="laminar-boundaries"><rect x="272.5" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">二長方形は離れるか境界に触れない包</text><text class="node-title" x="288.5" y="490">含とし、合法な対応を一つ返せばよい</text><text class="node-title" x="288.5" y="513">ですか？</text><text class="node-explanation" x="288.5" y="540">境界の接触・重なりも禁止します。幅0や高さ0の線</text><text class="node-explanation" x="288.5" y="558">分は許し、角の対応後にも境界を検査します。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="806" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="826">質問</text><text class="node-title" x="175.5" y="854">各集合は10万点以下で、行・列は</text><text class="node-title" x="175.5" y="877">1..10^9の整数ですか？</text><text class="node-explanation" x="175.5" y="904">同じ列の角は行の昇順。辺の検査では同じ列の追加→</text><text class="node-explanation" x="175.5" y="922">検査→削除で端点を含めます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1170" width="320" height="191" rx="7"/><text class="node-kind" x="48" y="1190">候補</text><text class="node-title" x="48" y="1218">最も下の未対応角を対応させ、平行辺</text><text class="node-title" x="48" y="1241">の重なりと縦横辺の交差を別に検査す</text><text class="node-title" x="48" y="1264">る</text><a href="/flowchartcp/techniques/nested-rectangle-corner-sweep-and-validation/"><title>左右の角だけから長方形を対応させ、境界の交差を別に確かめるの記事へ</title><text x="48" y="1303">左右の角だけから長方形を対応させ、境界の交差を</text><text x="48" y="1321">別に確かめる</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1170" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1190">分野</text><text class="node-title" x="412" y="1218">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1255">詳細の質問・図へ →</text></a></g></svg>