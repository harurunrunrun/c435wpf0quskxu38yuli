<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-subtree-collections flow-desc-tree-subtree-collections" width="804" height="1272" viewBox="0 0 804 1272" data-flow-svg="tree-subtree-collections"><title id="flow-title-tree-subtree-collections">部分木の集合と過去の版の解法フローチャート</title><desc id="flow-desc-tree-subtree-collections">部分木の集合を併合するか、木上の値の過去の状態を残すかを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-subtree-collections" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="merge:yes:small"><title>はい</title><path d="M411.833 182 V194 C411.833 226 192 226 192 258 V270"/><path d="M192 308 V320 C192 352 192 352 192 384 V396" marker-end="url(#arrow-tree-subtree-collections)"/><g class="flow-edge-label" data-edge-label="merge:yes:small" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">はい</text></g></g><g class="flow-edge no" data-edge="merge:no:versions"><title>いいえ</title><path d="M491.833 182 V194 C491.833 226 556 226 556 258 V270"/><path d="M556 308 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-tree-subtree-collections)"/><g class="flow-edge-label" data-edge-label="merge:no:versions" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="merge:unknown:check"><title>わからない</title><path d="M571.833 182 V194 C571.833 226 727.5 226 727.5 258 V270"/><path d="M727.5 308 V320 C727.5 352 766 352 766 384 V396 V535 C766 567 706.5 567 706.5 599 V611 V661 C706.5 693 665.333 693 665.333 725 V737" marker-end="url(#arrow-tree-subtree-collections)"/><g class="flow-edge-label" data-edge-label="merge:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="versions:yes:persistent"><title>はい</title><path d="M476 523 V535 C476 567 192 567 192 599 V611"/><path d="M192 649 V661 C192 693 192 693 192 725 V737" marker-end="url(#arrow-tree-subtree-collections)"/><g class="flow-edge-label" data-edge-label="versions:yes:persistent" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="634">はい</text></g></g><g class="flow-edge no" data-edge="versions:no:fallback"><title>いいえ</title><path d="M556 523 V535 C556 567 402 567 402 599 V611"/><path d="M402 649 V661 C402 693 402 693 402 725 V737 V899 C402 931 248 931 248 963 V975 V1025 C248 1057 194.667 1057 194.667 1089 V1101" marker-end="url(#arrow-tree-subtree-collections)"/><g class="flow-edge-label" data-edge-label="versions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="versions:unknown:check"><title>わからない</title><path d="M636 523 V535 C636 567 612 567 612 599 V611"/><path d="M612 649 V661 C612 693 558.667 693 558.667 725 V737" marker-end="url(#arrow-tree-subtree-collections)"/><g class="flow-edge-label" data-edge-label="versions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="567.5" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="612" y="634">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M532 887 V899 C532 931 338 931 338 963 V975"/><path d="M338 1013 V1025 C338 1057 301.333 1057 301.333 1089 V1101" marker-end="url(#arrow-tree-subtree-collections)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="298" y="975" width="80" height="38" rx="5"/><text text-anchor="middle" x="338" y="998">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M612 887 V899 C612 931 599 931 599 963 V975"/><path d="M599 1013 V1025 C599 1057 558.667 1057 558.667 1089 V1101" marker-end="url(#arrow-tree-subtree-collections)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="559" y="975" width="80" height="38" rx="5"/><text text-anchor="middle" x="599" y="998">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M692 887 V899 C692 931 727.5 931 727.5 963 V975"/><path d="M727.5 1013 V1025 C727.5 1057 665.333 1057 665.333 1089 V1101" marker-end="url(#arrow-tree-subtree-collections)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="975" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="998">わからない</text></g></g><g class="flow-node question" data-node="merge"><rect x="331.8333333333333" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="347.8333333333333" y="52">質問</text><text class="node-title" x="347.8333333333333" y="80">部分木ごとの集合・頻度表を親へ併合</text><text class="node-title" x="347.8333333333333" y="103">しますか？</text><text class="node-explanation" x="347.8333333333333" y="130">小さい表を大きい表へ移すと、要素の移動回数を抑え</text><text class="node-explanation" x="347.8333333333333" y="148">られます。</text></g><g class="flow-node question" data-node="versions"><rect x="396" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="416">質問</text><text class="node-title" x="412" y="444">木上の値の過去の版を参照しますか？</text><text class="node-explanation" x="412" y="471">木の構造が固定で、値だけが版ごとに変化する場合を</text><text class="node-explanation" x="412" y="489">考えます。</text></g><g class="flow-node question" data-node="check"><rect x="452" y="737" width="320" height="150" rx="7"/><text class="node-kind" x="468" y="757">質問</text><text class="node-title" x="468" y="785">問い合わせ対象は、祖先・部分木・一</text><text class="node-title" x="468" y="808">本の経路のどれか書けますか？</text><text class="node-explanation" x="468" y="835">根を決め、対象となる頂点や辺を小さな木に描いてみ</text><text class="node-explanation" x="468" y="853">ます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="452" y="1101" width="320" height="139" rx="7"/><text class="node-kind" x="468" y="1121">分野</text><text class="node-title" x="468" y="1149">条件を確かめる</text><text class="node-explanation" x="468" y="1176">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="468" y="1204">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="small"><rect x="32" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="416">候補</text><text class="node-title" x="48" y="444">小さい集合から併合する</text><a href="/flowchartcp/techniques/small-to-large/"><title>マージテクの記事へ</title><text x="48" y="483">マージテク</text></a></g><g class="flow-node result" data-node="persistent"><rect x="32" y="737" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="757">候補</text><text class="node-title" x="48" y="785">木上の値を永続化する</text><a href="/flowchartcp/techniques/persistent-segment-tree/"><title>永続セグメント木の記事へ</title><text x="48" y="824">永続セグメント木</text></a></g><g class="flow-node result" data-node="fallback"><rect x="88" y="1101" width="320" height="127" rx="7"/><text class="node-kind" x="104" y="1121">候補</text><text class="node-title" x="104" y="1149">問い合わせの対象を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="104" y="1188">状態の設計</text></a></g></svg>