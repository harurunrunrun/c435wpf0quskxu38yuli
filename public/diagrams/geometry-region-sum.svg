ct{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="sum-average:yes:sum-convex"><title>はい</title><path d="M539.722 200 V212 C539.722 244 420.667 244 420.667 276 V288"/><path d="M420.667 326 V338 C420.667 370 420.667 370 420.667 402 V414" marker-end="url(#arrow-geometry-region-sum)"/><g class="flow-edge-label" data-edge-label="sum-average:yes:sum-convex" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="311">はい</text></g></g><g class="flow-edge no" data-edge="sum-average:no:fallback"><title>いいえ</title><path d="M619.722 200 V212 C619.722 244 655 244 655 276 V288"/><path d="M655 326 V338 C655 370 762.5 370 762.5 402 V414 V617 C762.5 649 762.5 649 762.5 681 V693 V743 C762.5 775 458 775 458 807 V819 V1041 C458 1073 360 1073 360 1105 V1117 V1167 C360 1199 304 1199 304 1231 V1243" marker-end="url(#arrow-geometry-region-sum)"/><g class="flow-edge-label" data-edge-label="sum-average:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="sum-average:unknown:check"><title>わからない</title><path d="M699.722 200 V212 C699.722 244 783.5 244 783.5 276 V288"/><path d="M783.5 326 V338 C783.5 370 818.5 370 818.5 402 V414 V617 C818.5 649 818.5 649 818.5 681 V693 V743 C818.5 775 721.333 775 721.333 807 V819" marker-end="url(#arrow-geometry-region-sum)"/><g class="flow-edge-label" data-edge-label="sum-average:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="sum-convex:yes:minkowski-result"><title>はい</title><path d="M340.667 605 V617 C340.667 649 192 649 192 681 V693"/><path d="M192 731 V743 C192 775 192 775 192 807 V819" marker-end="url(#arrow-geometry-region-sum)"/><g class="flow-edge-label" data-edge-label="sum-convex:yes:minkowski-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="716">はい</text></g></g><g class="flow-edge no" data-edge="sum-convex:no:fallback"><title>いいえ</title><path d="M420.667 605 V617 C420.667 649 402 649 402 681 V693"/><path d="M402 731 V743 C402 775 402 775 402 807 V819 V1041 C402 1073 304 1073 304 1105 V1117 V1167 C304 1199 224 1199 224 1231 V1243" marker-end="url(#arrow-geometry-region-sum)"/><g class="flow-edge-label" data-edge-label="sum-convex:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="sum-convex:unknown:check"><title>わからない</title><path d="M500.667 605 V617 C500.667 649 668 649 668 681 V693"/><path d="M668 731 V743 C668 775 614.667 775 614.667 807 V819" marker-end="url(#arrow-geometry-region-sum)"/><g class="flow-edge-label" data-edge-label="sum-convex:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 974 V1041 C588 1073 450 1073 450 1105 V1117"/><path d="M450 1155 V1167 C450 1199 384 1199 384 1231 V1243" marker-end="url(#arrow-geometry-region-sum)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1117" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1140">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 974 V1041 C668 1073 655 1073 655 1105 V1117"/><path d="M655 1155 V1167 C655 1199 614.667 1199 614.667 1231 V1243" marker-end="url(#arrow-geometry-region-sum)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1117" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1140">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 974 V1041 C748 1073 783.5 1073 783.5 1105 V1117"/><path d="M783.5 1155 V1167 C783.5 1199 721.333 1199 721.333 1231 V1243" marker-end="url(#arrow-geometry-region-sum)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1117" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1140">わからない</text></g></g><g class="flow-node question" data-node="sum-average"><rect x="459.7222222222223" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">各領域内の連続座標から自由に一点を</text><text class="node-title" x="475.7222222222223" y="103">選び、和・平均の条件を作りますか？</text><text class="node-explanation" x="475.7222222222223" y="130">格子点や頂点だけに選択を限定しません。三領域から</text><text class="node-explanation" x="475.7222222222223" y="148">の平均 q は、各一点の和が 3q になる条件へ</text><text class="node-explanation" x="475.7222222222223" y="166">変えます。</text></g><g class="flow-node question" data-node="sum-convex"><rect x="260.6666666666667" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="276.6666666666667" y="434">質問</text><text class="node-title" x="276.6666666666667" y="462">各領域は三点以上の狭義凸で、頂点は</text><text class="node-title" x="276.6666666666667" y="485">周回順にあり、辺の方向を併合できま</text><text class="node-title" x="276.6666666666667" y="508">すか？</text><text class="node-explanation" x="276.6666666666667" y="535">掲載実装は反時計回りの狭義凸へ揃えた領域を扱いま</text><text class="node-explanation" x="276.6666666666667" y="553">す。非凸、点や線分に退化する入力領域は同じ実装の</text><text class="node-explanation" x="276.6666666666667" y="571">対象外です。</text></g><g class="flow-node result" data-node="minkowski-result"><rect x="32" y="819" width="320" height="210" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">各凸領域の辺を方向順に併合し、和の</text><text class="node-title" x="48" y="890">領域への所属を調べる</text><a href="/flowchartcp/techniques/convex-minkowski-sum/"><title>凸領域から一点ずつ選ぶ位置の和を、辺の方向順に併合するの記事へ</title><text x="48" y="929">凸領域から一点ずつ選ぶ位置の和を、辺の方向順に</text><text x="48" y="947">併合する</text></a><a href="/flowchartcp/techniques/convex-point-membership/"><title>凸多角形の内外を、一頂点からの扇形の二分探索で判定するの記事へ</title><text x="48" y="971">凸多角形の内外を、一頂点からの扇形の二分探索で</text><text x="48" y="989">判定する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="819" width="320" height="155" rx="7"/><text class="node-kind" x="524" y="839">質問</text><text class="node-title" x="524" y="867">座標の範囲、境界、重複、共線の場合</text><text class="node-title" x="524" y="890">を問題文と小さい例で確認できます</text><text class="node-title" x="524" y="913">か？</text><text class="node-explanation" x="524" y="940">保証される形と、必要な幾何の性質を区別します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1243" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1263">候補</text><text class="node-title" x="160" y="1291">入力の形と退化する場合を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1330">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1354">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1243" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1263">分野</text><text class="node-title" x="524" y="1291">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1328">詳細の質問・図へ →</text></a></g></svg>