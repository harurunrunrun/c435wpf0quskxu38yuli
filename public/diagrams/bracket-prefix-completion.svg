<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-bracket-prefix-completion flow-desc-bracket-prefix-completion" width="972" height="2089" viewBox="0 0 972 2089" data-flow-svg="bracket-prefix-completion"><title id="flow-title-bracket-prefix-completion">括弧の接頭辞を完成する個数の解法フローチャート</title><desc id="flow-desc-bracket-prefix-completion">接頭辞の高さを求め、途中で負になる完成列を反射して引きます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-bracket-prefix-completion" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="alphabet:yes:prefix"><title>はい</title><path d="M640.537 182 V194 C640.537 226 499.111 226 499.111 258 V270"/><path d="M499.111 308 V320 C499.111 352 499.111 352 499.111 384 V396" marker-end="url(#arrow-bracket-prefix-completion)"/><g class="flow-edge-label" data-edge-label="alphabet:yes:prefix" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="459.11111111111114" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="499.11111111111114" y="293">はい</text></g></g><g class="flow-edge no" data-edge="alphabet:no:fallback"><title>いいえ</title><path d="M720.537 182 V194 C720.537 226 767 226 767 258 V270"/><path d="M767 308 V320 C767 352 878 352 878 384 V396 V558 C878 590 878 590 878 622 V634 V684 C878 716 878 716 878 748 V760 V940 C878 972 878 972 878 1004 V1016 V1066 C878 1098 878 1098 878 1130 V1142 V1322 C878 1354 878 1354 878 1386 V1398 V1448 C878 1480 934 1480 934 1512 V1524 V1704 C934 1736 934 1736 934 1768 V1780 V1830 C934 1862 496 1862 496 1894 V1906" marker-end="url(#arrow-bracket-prefix-completion)"/><g class="flow-edge-label" data-edge-label="alphabet:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="727" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="767" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-e