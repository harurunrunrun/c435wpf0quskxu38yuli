or="middle" x="727.5" y="1039">わからない</text></g></g><g class="flow-edge yes" data-edge="binomial:yes:bracket-result"><title>はい</title><path d="M476 1292 V1322 C476 1354 304 1354 304 1386 V1398"/><path d="M304 1436 V1448 C304 1480 304 1480 304 1512 V1524" marker-end="url(#arrow-bracket-prefix-completion)"/><g class="flow-edge-label" data-edge-label="binomial:yes:bracket-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="264" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="304" y="1421">はい</text></g></g><g class="flow-edge no" data-edge="binomial:no:fallback"><title>いいえ</title><path d="M556 1292 V1322 C556 1354 514 1354 514 1386 V1398"/><path d="M514 1436 V1448 C514 1480 514 1480 514 1512 V1524 V1704 C514 1736 416 1736 416 1768 V1780 V1830 C416 1862 336 1862 336 1894 V1906" marker-end="url(#arrow-bracket-prefix-completion)"/><g class="flow-edge-label" data-edge-label="binomial:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="474" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="514" y="1421">いいえ</text></g></g><g class="flow-edge unknown" data-edge="binomial:unknown:check"><title>わからない</title><path d="M636 1292 V1322 C636 1354 671.5 1354 671.5 1386 V1398"/><path d="M671.5 1436 V1448 C671.5 1480 628 1480 628 1512 V1524" marker-end="url(#arrow-bracket-prefix-completion)"/><g class="flow-edge-label" data-edge-label="binomial:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="1398" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="1421">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M644 1674 V1704 C644 1736 506 1736 506 1768 V1780"/><path d="M506 1818 V1830 C506 1862 416 1862 416 1894 V1906" marker-end="url(#arrow-bracket-prefix-completion)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1780" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1803">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M724 1674 V1704 C724 1736 711 1736 711 1768 V1780"/><path d="M711 1818 V1830 C711 1862 726.667 1862 726.667 1894 V1906" marker-end="url(#arrow-bracket-prefix-completion)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="671" y="1780" width="80" height="38" rx="5"/><text text-anchor="middle" x="711" y="1803">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M804 1674 V1704 C804 1736 839.5 1736 839.5 1768 V1780"/><path d="M839.5 1818 V1830 C839.5 1862 833.333 1862 833.333 1894 V1906" marker-end="url(#arrow-bracket-prefix-completion)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="795" y="1780" width="89" height="38" rx="5"/><text text-anchor="middle" x="839.5" y="1803">わからない</text></g></g><g class="flow-node question" data-node="alphabet"><rect x="560.5370370370371" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="576.5370370370371" y="52">質問</text><text class="node-title" x="576.5370370370371" y="80">括弧は開き・閉じの一種類で、接頭辞</text><text class="node-title" x="576.5370370370371" y="103">を変えずに指定長へ完成しますか？</text><text class="node-explanation" x="576.5370370370371" y="130">途中で閉じ括弧が多くならず、最後に開き括弧と閉じ</text><text class="node-explanation" x="576.5370370370371" y="148">括弧が同数になる列を数えます。</text></g><g class="flow-node question" data-node="prefix"><rect x="339.11111111111114" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="355.11111111111114" y="416">質問</text><text class="node-title" x="355.11111111111114" y="444">与えられた接頭辞は、どの状態です</text><text class="node-title" x="355.11111111111114" y="467">か？</text><text class="node-explanation" x="355.11111111111114" y="494">開き括弧を +1、閉じ括弧を −1 として、全て</text><text class="node-explanation" x="355.11111111111114" y="512">の途中の高さを確認します。</text></g><g class="flow-node question" data-node="feasible"><rect x="361.83333333333337" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="377.83333333333337" y="780">質問</text><text class="node-title" x="377.83333333333337" y="808">残りで高さ 0 へ戻れる歩数・偶奇</text><text class="node-title" x="377.83333333333337" y="831">ですか？</text><text class="node-explanation" x="377.83333333333337" y="858">総長が奇数、接頭辞が長すぎる、開きを使いすぎる場</text><text class="node-explanation" x="377.83333333333337" y="876">合は完成できません。残りの開き・閉じの回数が非負</text><text class="node-explanation" x="377.83333333333337" y="894">整数になるかを確認します。</text></g><g class="flow-node question" data-node="binomial"><rect x="396" y="1142" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="1162">質問</text><text class="node-title" x="412" y="1190">必要な二項係数を、法と値域に合わせ</text><text class="node-title" x="412" y="1213">て計算できますか？</text><text class="node-explanation" x="412" y="1240">掲載実装は総長が素数の法より小さい範囲で階乗と逆</text><text class="node-explanation" x="412" y="1258">階乗を前計算します。</text></g><g class="flow-node result" data-node="bracket-result"><rect x="144" y="1524" width="320" height="168" rx="7"/><text class="node-kind" x="160" y="1544">候補</text><text class="node-title" x="160" y="1572">残りの歩き方から、高さ −1 へ落</text><text class="node-title" x="160" y="1595">ちる列を反射して引く</text><a href="/flowchartcp/techniques/ballot-prefix-reflection/"><title>途中の高さが決まった括弧列は、初めて負になる経路を反射して引くの記事へ</title><text x="160" y="1634">途中の高さが決まった括弧列は、初めて負になる経</text><text x="160" y="1652">路を反射して引く</text></a></g><g class="flow-node result" data-node="zero-result"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">変えられない接頭辞や残りの回数の条</text><text class="node-title" x="48" y="1213">件から、完成数は零</text><a href="/flowchartcp/techniques/ballot-prefix-reflection/"><title>途中の高さが決まった括弧列は、初めて負になる経路を反射して引くの記事へ</title><text x="48" y="1252">途中の高さが決まった括弧列は、初めて負になる経</text><text x="48" y="1270">路を反射して引く</text></a></g><g class="flow-node question" data-node="check"><rect x="564" y="1524" width="320" height="150" rx="7"/><text class="node-kind" x="580" y="1544">質問</text><text class="node-title" x="580" y="1572">必要な条件を、問題文と小さい例から</text><text class="node-title" x="580" y="1595">確認できますか？</text><text class="node-explanation" x="580" y="1622">区別する対象、求める個数、操作の条件を確認しま</text><text class="node-explanation" x="580" y="1640">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="256" y="1906" width="320" height="151" rx="7"/><text class="node-kind" x="272" y="1926">候補</text><text class="node-title" x="272" y="1954">条件と数え方をもう一度確かめる</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="272" y="1993">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="272" y="2017">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="620" y="1906" width="320" height="121" rx="7"/><text class="node-kind" x="636" y="1926">分野</text><text class="node-title" x="636" y="1954">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="636" y="1991">詳細の質問・図へ →</text></a></g></svg>