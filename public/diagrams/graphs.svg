<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-graphs flow-desc-graphs" width="2568" height="945" viewBox="0 0 2568 945" data-flow-svg="graphs"><title id="flow-title-graphs">移動・つながり・依存関係の解法フローチャート</title><desc id="flow-desc-graphs">経路、連結性、木、流量、依存関係を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-graphs" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge walk-goals" data-edge="shortest:walk-goals:category-walk-goals"><title>移動費用・訪れる頂点・辺の通り方</title><path d="M1164 159 V171 C1164 203 192 203 192 235 V247"/><path d="M192 285 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="shortest:walk-goals:category-walk-goals" tabindex="0" role="group" aria-label="選択肢：移動費用・訪れる頂点・辺の通り方"><rect x="76" y="247" width="232" height="38" rx="5"/><text text-anchor="middle" x="192" y="270">移動費用・訪れる頂点・辺の通り方</text></g></g><g class="flow-edge directed-progress" data-edge="shortest:directed-progress:category-directed-progress"><title>辺の向き・閉路・進む順番</title><path d="M1204 159 V171 C1204 203 556 203 556 235 V247"/><path d="M556 285 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="shortest:directed-progress:category-directed-progress" tabindex="0" role="group" aria-label="選択肢：辺の向き・閉路・進む順番"><rect x="466" y="247" width="180" height="38" rx="5"/><text text-anchor="middle" x="556" y="270">辺の向き・閉路・進む順番</text></g></g><g class="flow-edge network-connection" data-edge="shortest:network-connection:category-network-connection"><title>全体の接続・接続の変化・道路の復元</title><path d="M1244 159 V171 C1244 203 920 203 920 235 V247"/><path d="M920 285 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="shortest:network-connection:category-network-connection" tabindex="0" role="group" aria-label="選択肢：全体の接続・接続の変化・道路の復元"><rect x="797.5" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="920" y="270">全体の接続・接続の変化・道路の復元</text></g></g><g class="flow-edge rooted-tree-goals" data-edge="shortest:rooted-tree-goals:category-rooted-tree-goals"><title>木の各点の答え・部分木・経路</title><path d="M1284 159 V171 C1284 203 1284 203 1284 235 V247"/><path d="M1284 285 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="shortest:rooted-tree-goals:category-rooted-tree-goals" tabindex="0" role="group" aria-label="選択肢：木の各点の答え・部分木・経路"><rect x="1181" y="247" width="206" height="38" rx="5"/><text text-anchor="middle" x="1284" y="270">木の各点の答え・部分木・経路</text></g></g><g class="flow-edge group-constraints" data-edge="shortest:group-constraints:category-group-constraints"><title>組分け・割当・変数どうしの条件</title><path d="M1324 159 V171 C1324 203 1648 203 1648 235 V247"/><path d="M1648 285 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="shortest:group-constraints:category-group-constraints" tabindex="0" role="group" aria-label="選択肢：組分け・割当・変数どうしの条件"><rect x="1538.5" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="1648" y="270">組分け・割当・変数どうしの条件</text></g></g><g class="flow-edge timed-arrivals" data-edge="shortest:timed-arrivals:timed-arrivals-route"><title>次の行き先が一つの移動で、複数の始点からの累積到着を数える</title><path d="M1364 159 V171 C1364 203 2012 203 2012 235 V247"/><path d="M2012 303 V315 C2012 347 2012 347 2012 379 V391" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="shortest:timed-arrivals:timed-arrivals-route" tabindex="0" role="group" aria-label="選択肢：次の行き先が一つの移動で、複数の始点からの累積到着を数える"><rect x="1889.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="270">次の行き先が一つの移動で、複数の始</text><text text-anchor="middle" x="2012" y="288">点からの累積到着を数える</text></g></g><g class="flow-edge unknown" data-edge="shortest:unknown:check"><title>わからない</title><path d="M1404 159 V171 C1404 203 2376 203 2376 235 V247"/><path d="M2376 285 V315 C2376 347 2376 347 2376 379 V391" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="shortest:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2331.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="2376" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M2296 541 V560 C2296 592 2012 592 2012 624 V636"/><path d="M2012 674 V686 C2012 718 2012 718 2012 750 V762" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1972" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="2012" y="659">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2376 541 V560 C2376 592 2363 592 2363 624 V636"/><path d="M2363 674 V686 C2363 718 2322.667 718 2322.667 750 V762" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2323" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="2363" y="659">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2456 541 V560 C2456 592 2491.5 592 2491.5 624 V636"/><path d="M2491.5 674 V686 C2491.5 718 2429.333 718 2429.333 750 V762" marker-end="url(#arrow-graphs)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2447" y="636" width="89" height="38" rx="5"/><text text-anchor="middle" x="2491.5" y="659">わからない</text></g></g><g class="flow-node question" data-node="shortest"><rect x="1124" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1140" y="52">質問</text><text class="node-title" x="1140" y="80">頂点・辺について何を求めますか？</text><text class="node-explanation" x="1140" y="107">最短距離だけでなく、負閉路、順序、連結性、木の集</text><text class="node-explanation" x="1140" y="125">計を区別します。</text></g><g class="flow-node question" data-node="check"><rect x="2216" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="2232" y="411">質問</text><text class="node-title" x="2232" y="439">木・閉路のない一方通行のグラフ・そ</text><text class="node-title" x="2232" y="462">の他を、制約から区別できますか？</text><text class="node-explanation" x="2232" y="489">辺数だけで木や DAG を断定せず、連結性と閉路</text><text class="node-explanation" x="2232" y="507">も確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="2216" y="762" width="320" height="139" rx="7"/><text class="node-kind" x="2232" y="782">分野</text><text class="node-title" x="2232" y="810">条件を確かめる</text><text class="node-explanation" x="2232" y="837">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="2232" y="865">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1852" y="762" width="320" height="151" rx="7"/><text class="node-kind" x="1868" y="782">候補</text><text class="node-title" x="1868" y="810">頂点・辺の意味を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1868" y="849">状態の設計</text></a><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="1868" y="873">グラフへの帰着</text></a></g><g class="flow-node route" data-node="category-walk-goals"><rect x="32" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">移動費用・訪れる頂点・辺の通り方</text><text class="node-explanation" x="48" y="466">最短の移動、訪問回数、同じ頂点の再訪、各辺を通る</text><text class="node-explanation" x="48" y="484">条件を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-graphs-walk-goals" data-route="graphs-walk-goals"><text x="48" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-directed-progress"><rect x="396" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">辺の向き・閉路・進む順番</text><text class="node-explanation" x="412" y="466">閉路の有無、依存先を守る順番、前へ進む回数を確か</text><text class="node-explanation" x="412" y="484">めます。</text><a href="/flowchartcp/flowcharts/#diagram-graphs-directed-progress" data-route="graphs-directed-progress"><text x="412" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-network-connection"><rect x="760" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">全体の接続・接続の変化・道路の復元</text><text class="node-explanation" x="776" y="466">到達性、全頂点の接続、辺の追加・削除と、道路の復</text><text class="node-explanation" x="776" y="484">元条件を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-graphs-network-connection" data-route="graphs-network-connection"><text x="776" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-rooted-tree-goals"><rect x="1124" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">木の各点の答え・部分木・経路</text><text class="node-explanation" x="1140" y="466">木の経路・部分木への質問と、各頂点や指定経路に対</text><text class="node-explanation" x="1140" y="484">する条件を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-graphs-rooted-tree-goals" data-route="graphs-rooted-tree-goals"><text x="1140" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="category-group-constraints"><rect x="1488" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">組分け・割当・変数どうしの条件</text><text class="node-explanation" x="1504" y="466">組を選ぶ、容量を割り当てる、変数どうしの制約を満</text><text class="node-explanation" x="1504" y="484">たす問題を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-graphs-group-constraints" data-route="graphs-group-constraints"><text x="1504" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="timed-arrivals-route"><rect x="1852" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="411">分野</text><text class="node-title" x="1868" y="439">次の行き先が一つの移動で、複数の始</text><text class="node-title" x="1868" y="462">点からの累積到着を数える</text><a href="/flowchartcp/flowcharts/#diagram-timed-functional-arrivals-conditions" data-route="timed-functional-arrivals-conditions"><text x="1868" y="499">詳細の質問・図へ →</text></a></g></svg>