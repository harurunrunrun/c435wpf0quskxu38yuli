<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-permutation-inversion-count-conditions flow-desc-permutation-inversion-count-conditions" width="748" height="1388" viewBox="0 0 748 1388" data-flow-svg="permutation-inversion-count-conditions"><title id="flow-title-permutation-inversion-count-conditions">転倒数を指定した順列の個数の解法フローチャート</title><desc id="flow-desc-permutation-inversion-count-conditions">全て異なる値、転倒の定義、計算できる軸の大きさを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-permutation-inversion-count-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="permutation:yes:inversions"><title>はい</title><path d="M464.5 205 V217 C464.5 249 419 249 419 281 V293"/><path d="M419 331 V343 C419 375 432.5 375 432.5 407 V419" marker-end="url(#arrow-permutation-inversion-count-conditions)"/><g class="flow-edge-label" data-edge-label="permutation:yes:inversions" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="316">はい</text></g></g><g class="flow-edge no" data-edge="permutation:no:check"><title>いいえ</title><path d="M544.5 205 V217 C544.5 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V604 C654 636 654 636 654 668 V680 V730 C654 762 654 762 654 794 V806 V986 C654 1018 654 1018 654 1050 V1062 V1112 C654 1144 624.571 1144 624.571 1176 V1188" marker-end="url(#arrow-permutation-inversion-count-conditions)"/><g class="flow-edge-label" data-edge-label="permutation:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="permutation:unknown:check"><title>わからない</title><path d="M624.5 205 V217 C624.5 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 407 V419 V604 C710 636 710 636 710 668 V680 V730 C710 762 710 762 710 794 V806 V986 C710 1018 710 1018 710 1050 V1062 V1112 C710 1144 670.286 1144 670.286 1176 V1188" marker-end="url(#arrow-permutation-inversion-count-conditions)"/><g class="flow-edge-label" data-edge-label="permutation:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="inversions:yes:small-k"><title>はい</title><path d="M352.5 592 V604 C352.5 636 307 636 307 668 V680"/><path d="M307 718 V730 C307 762 319.5 762 319.5 794 V806" marker-end="url(#arrow-permutation-inversion-count-conditions)"/><g class="flow-edge-label" data-edge-label="inversions:yes:small-k" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="703">はい</text></g></g><g class="flow-edge no" data-edge="inversions:no:check"><title>いいえ</title><path d="M432.5 592 V604 C432.5 636 431 636 431 668 V680"/><path d="M431 718 V730 C431 762 542 762 542 794 V806 V986 C542 1018 542 1018 542 1050 V1062 V1112 C542 1144 533.143 1144 533.143 1176 V1188" marker-end="url(#arrow-permutation-inversion-count-conditions)"/><g class="flow-edge-label" data-edge-label="inversions:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="703">いいえ</text></g></g><g class="flow-edge unknown" data-edge="inversions:unknown:check"><title>わからない</title><path d="M512.5 592 V604 C512.5 636 559.5 636 559.5 668 V680"/><path d="M559.5 718 V730 C559.5 762 598 762 598 794 V806 V986 C598 1018 598 1018 598 1050 V1062 V1112 C598 1144 578.857 1144 578.857 1176 V1188" marker-end="url(#arrow-permutation-inversion-count-conditions)"/><g class="flow-edge-label" data-edge-label="inversions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="680" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-edge yes" data-edge="small-k:yes:answer"><title>はい</title><path d="M239.5 974 V986 C239.5 1018 192 1018 192 1050 V1062"/><path d="M192 1100 V1112 C192 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-permutation-inversion-count-conditions)"/><g class="flow-edge-label" data-edge-label="small-k:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="small-k:no:check"><title>いいえ</title><path d="M319.5 974 V986 C319.5 1018 319 1018 319 1050 V1062"/><path d="M319 1100 V1112 C319 1144 441.714 1144 441.714 1176 V1188" marker-end="url(#arrow-permutation-inversion-count-conditions)"/><g class="flow-edge-label" data-edge-label="small-k:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="small-k:unknown:check"><title>わからない</title><path d="M399.5 974 V986 C399.5 1018 447.5 1018 447.5 1050 V1062"/><path d="M447.5 1100 V1112 C447.5 1144 487.429 1144 487.429 1176 V1188" marker-end="url(#arrow-permutation-inversion-count-conditions)"/><g class="flow-edge-label" data-edge-label="small-k:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1085">わからない</text></g></g><g class="flow-node question" data-node="permutation"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">使う値は全て異なる固定集合で、位置</text><text class="node-title" x="400.5" y="103">ごとの値や隣接不等号の追加条件はあ</text><text class="node-title" x="400.5" y="126">りませんか？</text><text class="node-explanation" x="400.5" y="153">値の大小だけを使い、1からNの順列として数えま</text><text class="node-explanation" x="400.5" y="171">す。</text></g><g class="flow-node question" data-node="inversions"><rect x="272.5" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">条件は、i&lt;jかつa[i]&gt;a</text><text class="node-title" x="288.5" y="490">[j]となる添字対がちょうどK個あ</text><text class="node-title" x="288.5" y="513">ることですか？</text><text class="node-explanation" x="288.5" y="540">最大値を挿す位置は自由で、その右にある要素数だけ</text><text class="node-explanation" x="288.5" y="558">転倒が増えます。</text></g><g class="flow-node question" data-node="small-k"><rect x="159.5" y="806" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="826">質問</text><text class="node-title" x="175.5" y="854">不可能なKを分けた後、Nと計算する</text><text class="node-title" x="175.5" y="877">転倒数の積を処理できますか？</text><text class="node-explanation" x="175.5" y="904">最大転倒数をMとし、値の大小反転によりKとM−K</text><text class="node-explanation" x="175.5" y="922">の小さい方まで計算できます。掲載実装はN,Kが</text><text class="node-explanation" x="175.5" y="940">1000以下です。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">最大値の挿入で増える0..i−1の</text><text class="node-title" x="48" y="1259">転倒数を、幅付きの和で足す</text><a href="/flowchartcp/techniques/permutation-inversion-window-dp/"><title>転倒数が指定された順列は、最大値の挿入で増える個数を窓の和にするの記事へ</title><text x="48" y="1298">転倒数が指定された順列は、最大値の挿入で増える</text><text x="48" y="1316">個数を窓の和にする</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1188" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1208">分野</text><text class="node-title" x="412" y="1236">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1273">詳細の質問・図へ →</text></a></g></svg>