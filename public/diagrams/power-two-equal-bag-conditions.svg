data-edge-label="distinct-equal-values:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="bounded-supply:yes:result"><title>はい</title><path d="M239.5 951 V963 C239.5 995 192 995 192 1027 V1039"/><path d="M192 1077 V1089 C192 1121 192 1121 192 1153 V1165" marker-end="url(#arrow-power-two-equal-bag-conditions)"/><g class="flow-edge-label" data-edge-label="bounded-supply:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="bounded-supply:no:check"><title>いいえ</title><path d="M319.5 951 V963 C319.5 995 319 995 319 1027 V1039"/><path d="M319 1077 V1089 C319 1121 441.714 1121 441.714 1153 V1165" marker-end="url(#arrow-power-two-equal-bag-conditions)"/><g class="flow-edge-label" data-edge-label="bounded-supply:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounded-supply:unknown:check"><title>わからない</title><path d="M399.5 951 V963 C399.5 995 447.5 995 447.5 1027 V1039"/><path d="M447.5 1077 V1089 C447.5 1121 487.429 1121 487.429 1153 V1165" marker-end="url(#arrow-power-two-equal-bag-conditions)"/><g class="flow-edge-label" data-edge-label="bounded-supply:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="power-two-supply"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">品物の重さは1,2,4,...で、</text><text class="node-title" x="400.5" y="103">種類ごとに有限の在庫がありますか？</text><text class="node-explanation" x="400.5" y="130">各種類の在庫は非負整数です。下位の重さだけを合わ</text><text class="node-explanation" x="400.5" y="148">せた供給量を使います。</text></g><g class="flow-node question" data-node="distinct-equal-values"><rect x="272.5" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">全ての袋を同じ合計にできる、相異な</text><text class="node-title" x="288.5" y="467">る値の個数を求めますか？</text><text class="node-explanation" x="288.5" y="494">使わない品物を残せ、空袋も許します。袋ごとに中身</text><text class="node-explanation" x="288.5" y="512">の種類構成が違ってもよく、配り方の個数は数えませ</text><text class="node-explanation" x="288.5" y="530">ん。</text></g><g class="flow-node question" data-node="bounded-supply"><rect x="159.5" y="778" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="798">質問</text><text class="node-title" x="175.5" y="826">重さの種類は63以下で、品物の重さ</text><text class="node-title" x="175.5" y="849">の総和と袋数は2^63−1以下です</text><text class="node-title" x="175.5" y="872">か？</text><text class="node-explanation" x="175.5" y="899">袋数は正の整数です。可能な合計に0を含め、種類数</text><text class="node-explanation" x="175.5" y="917">は符号なし64ビットで返します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1185">候補</text><text class="node-title" x="48" y="1213">下位桁の供給量で可否を決め、2の累</text><text class="node-title" x="48" y="1236">乗で上限を分けて数える</text><a href="/flowchartcp/techniques/bounded-power-two-equal-bag-prefix-cap-memoization/"><title>重さが2の累乗の品物を各袋に配り、等しくできる合計値を数えるの記事へ</title><text x="48" y="1275">重さが2の累乗の品物を各袋に配り、等しくできる</text><text x="48" y="1293">合計値を数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1185">分野</text><text class="node-title" x="412" y="1213">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1250">詳細の質問・図へ →</text></a></g></svg>