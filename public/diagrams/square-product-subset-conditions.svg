rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="small-primes:yes:answer"><title>はい</title><path d="M239.5 928 V940 C239.5 972 192 972 192 1004 V1016"/><path d="M192 1054 V1066 C192 1098 192 1098 192 1130 V1142" marker-end="url(#arrow-square-product-subset-conditions)"/><g class="flow-edge-label" data-edge-label="small-primes:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="small-primes:no:check"><title>いいえ</title><path d="M319.5 928 V940 C319.5 972 319 972 319 1004 V1016"/><path d="M319 1054 V1066 C319 1098 441.714 1098 441.714 1130 V1142" marker-end="url(#arrow-square-product-subset-conditions)"/><g class="flow-edge-label" data-edge-label="small-primes:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="small-primes:unknown:check"><title>わからない</title><path d="M399.5 928 V940 C399.5 972 447.5 972 447.5 1004 V1016"/><path d="M447.5 1054 V1066 C447.5 1098 487.429 1098 487.429 1130 V1142" marker-end="url(#arrow-square-product-subset-conditions)"/><g class="flow-edge-label" data-edge-label="small-primes:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="positive"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">配列の値は正整数で、積が完全平方数</text><text class="node-title" x="400.5" y="103">になる条件ですか？</text><text class="node-explanation" x="400.5" y="130">0や負数は別の扱いが必要です。正整数では全ての素</text><text class="node-explanation" x="400.5" y="148">因数の指数が偶数であることと同値です。</text></g><g class="flow-node question" data-node="subsets"><rect x="272.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">非空の添字集合を自由に選び、同じ値</text><text class="node-title" x="288.5" y="467">でも位置が違えば別の選び方ですか？</text><text class="node-explanation" x="288.5" y="494">選ぶ個数や合計値の制約はなく、同じ値を何個選ぶか</text><text class="node-explanation" x="288.5" y="512">の偶奇だけで積の指数が決まります。</text></g><g class="flow-node question" data-node="small-primes"><rect x="159.5" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">現れる素数の種類が少なく、その偶奇</text><text class="node-title" x="175.5" y="831">の全組合せを持てますか？</text><text class="node-explanation" x="175.5" y="858">掲載実装は値1..70、19素数の2^19状態で</text><text class="node-explanation" x="175.5" y="876">す。素数の種類が多い場合、この状態数では処理でき</text><text class="node-explanation" x="175.5" y="894">ません。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">値ごとの偶数個・奇数個の選択数を重</text><text class="node-title" x="48" y="1213">みにして、素因数の偶奇を更新する</text><a href="/flowchartcp/techniques/square-product-subsets-parity-mask/"><title>積が平方になる部分集合は、素因数の指数の偶奇と同じ値の選択数をまとめるの記事へ</title><text x="48" y="1252">積が平方になる部分集合は、素因数の指数の偶奇と</text><text x="48" y="1270">同じ値の選択数をまとめる</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1162">分野</text><text class="node-title" x="412" y="1190">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1227">詳細の質問・図へ →</text></a></g></svg>