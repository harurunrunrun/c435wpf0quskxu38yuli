<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-precompiled-permutation-conditions flow-desc-precompiled-permutation-conditions" width="748" height="1406" viewBox="0 0 748 1406" data-flow-svg="precompiled-permutation-conditions"><title id="flow-title-precompiled-permutation-conditions">一回の未知置換を文字列集合の所属質問で復元するの解法フローチャート</title><desc id="flow-desc-precompiled-permutation-conditions">固定された置換、書き込みと質問の順序、長さと回数制限を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-precompiled-permutation-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="fixed-shared-permutation:yes:precompile-membership"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-precompiled-permutation-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-shared-permutation:yes:precompile-membership" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="fixed-shared-permutation:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V617 C654 649 654 649 654 681 V693 V743 C654 775 654 775 654 807 V819 V1004 C654 1036 654 1036 654 1068 V1080 V1130 C654 1162 624.571 1162 624.571 1194 V1206" marker-end="url(#arrow-precompiled-permutation-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-shared-permutation:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed-shared-permutation:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V617 C710 649 710 649 710 681 V693 V743 C710 775 710 775 710 807 V819 V1004 C710 1036 710 1036 710 1068 V1080 V1130 C710 1162 670.286 1162 670.286 1194 V1206" marker-end="url(#arrow-precompiled-permutation-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-shared-permutation:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="precompile-membership:yes:bounds-budget"><title>はい</title><path d="M352.5 605 V617 C352.5 649 307 649 307 681 V693"/><path d="M307 731 V743 C307 775 319.5 775 319.5 807 V819" marker-end="url(#arrow-precompiled-permutation-conditions)"/><g class="flow-edge-label" data-edge-label="precompile-membership:yes:bounds-budget" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="716">はい</text></g></g><g class="flow-edge no" data-edge="precompile-membership:no:check"><title>いいえ</title><path d="M432.5 605 V617 C432.5 649 431 649 431 681 V693"/><path d="M431 731 V743 C431 775 542 775 542 807 V819 V1004 C542 1036 542 1036 542 1068 V1080 V1130 C542 1162 533.143 1162 533.143 1194 V1206" marker-end="url(#arrow-precompiled-permutation-conditions)"/><g class="flow-edge-label" data-edge-label="precompile-membership:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="precompile-membership:unknown:check"><title>わからない</title><path d="M512.5 605 V617 C512.5 649 559.5 649 559.5 681 V693"/><path d="M559.5 731 V743 C559.5 775 598 775 598 807 V819 V1004 C598 1036 598 1036 598 1068 V1080 V1130 C598 1162 578.857 1162 578.857 1194 V1206" marker-end="url(#arrow-precompiled-permutation-conditions)"/><g class="flow-edge-label" data-edge-label="precompile-membership:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds-budget:yes:result"><title>はい</title><path d="M239.5 992 V1004 C239.5 1036 192 1036 192 1068 V1080"/><path d="M192 1118 V1130 C192 1162 192 1162 192 1194 V1206" marker-end="url(#arrow-precompiled-permutation-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-budget:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1080" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1103">はい</text></g></g><g class="flow-edge no" data-edge="bounds-budget:no:check"><title>いいえ</title><path d="M319.5 992 V1004 C319.5 1036 319 1036 319 1068 V1080"/><path d="M319 1118 V1130 C319 1162 441.714 1162 441.714 1194 V1206" marker-end="url(#arrow-precompiled-permutation-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-budget:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1080" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1103">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds-budget:unknown:check"><title>わからない</title><path d="M399.5 992 V1004 C399.5 1036 447.5 1036 447.5 1068 V1080"/><path d="M447.5 1118 V1130 C447.5 1162 487.429 1162 487.429 1194 V1206" marker-end="url(#arrow-precompiled-permutation-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-budget:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1080" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1103">わからない</text></g></g><g class="flow-node question" data-node="fixed-shared-permutation"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">全ての二値文字列に、同じ固定のビッ</text><text class="node-title" x="400.5" y="103">ト位置置換が一回だけ作用しますか？</text><text class="node-explanation" x="400.5" y="130">長さは全てNで、置換は最初から固定です。各要素の</text><text class="node-explanation" x="400.5" y="148">値を別々に変えたり、質問の途中で置換を変えたりし</text><text class="node-explanation" x="400.5" y="166">ません。</text></g><g class="flow-node question" data-node="precompile-membership"><rect x="272.5" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">全書き込みの後に一回だけ並べ替え、</text><text class="node-title" x="288.5" y="485">その後は所属だけを質問して全対応を</text><text class="node-title" x="288.5" y="508">返しますか？</text><text class="node-explanation" x="288.5" y="535">集合は最初に空です。書き込みは返答を見る前に全て</text><text class="node-explanation" x="288.5" y="553">終えます。出力位置iに来た元の位置p[i]を返し</text><text class="node-explanation" x="288.5" y="571">ます。</text></g><g class="flow-node question" data-node="bounds-budget"><rect x="159.5" y="819" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="839">質問</text><text class="node-title" x="175.5" y="867">長さは1〜128の二冪で、登録N </text><text class="node-title" x="175.5" y="890">log₂N/2回・質問N log₂</text><text class="node-title" x="175.5" y="913">N回の予算がありますか？</text><text class="node-explanation" x="175.5" y="940">N=32なら登録80回・質問160回、N=128</text><text class="node-explanation" x="175.5" y="958">なら登録448回・質問896回を使います。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1206" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1226">候補</text><text class="node-title" x="48" y="1254">区間外を1にした文字列を先に登録</text><text class="node-title" x="48" y="1277">し、所属判定で位置集合を二分する</text><a href="/flowchartcp/techniques/precompiled-permutation-partition-signature-membership/"><title>一度だけ並べ替わるビットの対応を、集合への所属質問で復元するの記事へ</title><text x="48" y="1316">一度だけ並べ替わるビットの対応を、集合への所属</text><text x="48" y="1334">質問で復元する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1206" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1226">分野</text><text class="node-title" x="412" y="1254">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1291">詳細の質問・図へ →</text></a></g></svg>