<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-selection-closure flow-desc-selection-closure" width="860" height="1408" viewBox="0 0 860 1408" data-flow-svg="selection-closure"><title id="flow-title-selection-closure">選択の依存条件と総利益の解法フローチャート</title><desc id="flow-desc-selection-closure">正の利益を捨てる費用と、負の利益を引き受ける費用を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-selection-closure" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="implication:yes:capacity-bound"><title>はい</title><path d="M539.722 223 V235 C539.722 267 420.667 267 420.667 299 V311"/><path d="M420.667 349 V361 C420.667 393 420.667 393 420.667 425 V437" marker-end="url(#arrow-selection-closure)"/><g class="flow-edge-label" data-edge-label="implication:yes:capacity-bound" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="334">はい</text></g></g><g class="flow-edge no" data-edge="implication:no:fallback"><title>いいえ</title><path d="M619.722 223 V235 C619.722 267 655 267 655 299 V311"/><path d="M655 349 V361 C655 393 762.5 393 762.5 425 V437 V617 C762.5 649 762.5 649 762.5 681 V693 V743 C762.5 775 458 775 458 807 V819 V1023 C458 1055 360 1055 360 1087 V1099 V1149 C360 1181 304 1181 304 1213 V1225" marker-end="url(#arrow-selection-closure)"/><g class="flow-edge-label" data-edge-label="implication:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="implication:unknown:check"><title>わからない</title><path d="M699.722 223 V235 C699.722 267 783.5 267 783.5 299 V311"/><path d="M783.5 349 V361 C783.5 393 818.5 393 818.5 425 V437 V617 C818.5 649 818.5 649 818.5 681 V693 V743 C818.5 775 721.333 775 721.333 807 V819" marker-end="url(#arrow-selection-closure)"/><g class="flow-edge-label" data-edge-label="implication:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="capacity-bound:yes:closure-result"><title>はい</title><path d="M340.667 605 V617 C340.667 649 192 649 192 681 V693"/><path d="M192 731 V743 C192 775 192 775 192 807 V819" marker-end="url(#arrow-selection-closure)"/><g class="flow-edge-label" data-edge-label="capacity-bound:yes:closure-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="716">はい</text></g></g><g class="flow-edge no" data-edge="capacity-bound:no:fallback"><title>いいえ</title><path d="M420.667 605 V617 C420.667 649 402 649 402 681 V693"/><path d="M402 731 V743 C402 775 402 775 402 807 V819 V1023 C402 1055 304 1055 304 1087 V1099 V1149 C304 1181 224 1181 224 1213 V1225" marker-end="url(#arrow-selection-closure)"/><g class="flow-edge-label" data-edge-label="capacity-bound:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="capacity-bound:unknown:check"><title>わからない</title><path d="M500.667 605 V617 C500.667 649 668 649 668 681 V693"/><path d="M668 731 V743 C668 775 614.667 775 614.667 807 V819" marker-end="url(#arrow-selection-closure)"/><g class="flow-edge-label" data-edge-label="capacity-bound:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 969 V1023 C588 1055 450 1055 450 1087 V1099"/><path d="M450 1137 V1149 C450 1181 384 1181 384 1213 V1225" marker-end="url(#arrow-selection-closure)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1099" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1122">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 969 V1023 C668 1055 655 1055 655 1087 V1099"/><path d="M655 1137 V1149 C655 1181 614.667 1181 614.667 1213 V1225" marker-end="url(#arrow-selection-closure)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1099" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1122">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 969 V1023 C748 1055 783.5 1055 783.5 1087 V1099"/><path d="M783.5 1137 V1149 C783.5 1181 721.333 1181 721.333 1213 V1225" marker-end="url(#arrow-selection-closure)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1099" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1122">わからない</text></g></g><g class="flow-node question" data-node="implication"><rect x="459.7222222222223" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">利益は対象ごとの和で、選択条件は</text><text class="node-title" x="475.7222222222223" y="103">「u を選ぶなら v も選ぶ」の含</text><text class="node-title" x="475.7222222222223" y="126">意だけですか？</text><text class="node-explanation" x="475.7222222222223" y="153">選択した側から未選択の側へ含意辺が出る状態を禁止</text><text class="node-explanation" x="475.7222222222223" y="171">します。正確な選択個数、資源の総量制限、排他的な</text><text class="node-explanation" x="475.7222222222223" y="189">選択や組合せによる追加利益がある場合は、このモ…</text></g><g class="flow-node question" data-node="capacity-bound"><rect x="260.6666666666667" y="437" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="457">質問</text><text class="node-title" x="276.6666666666667" y="485">正の利益の総和 W に一を足した容</text><text class="node-title" x="276.6666666666667" y="508">量を、計算型で扱えますか？</text><text class="node-explanation" x="276.6666666666667" y="535">含意だけなら空集合も合法で、その損失は正の利益の</text><text class="node-explanation" x="276.6666666666667" y="553">総和 W です。含意辺を W+1 にすれば、含意</text><text class="node-explanation" x="276.6666666666667" y="571">違反を含む切断はこの合法な損失より大きくなりま…</text></g><g class="flow-node result" data-node="closure-result"><rect x="32" y="819" width="320" height="192" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">正の利益の総和から、依存条件を守る</text><text class="node-title" x="48" y="890">ための最小損失を引く</text><a href="/flowchartcp/techniques/maximum-profit-closure/"><title>選ぶと別の対象も必要になる利益最大化を、含意を切れないカットへ直すの記事へ</title><text x="48" y="929">選ぶと別の対象も必要になる利益最大化を、含意を</text><text x="48" y="947">切れないカットへ直す</text></a><a href="/flowchartcp/techniques/max-flow/"><title>最大流・最小カットの記事へ</title><text x="48" y="971">最大流・最小カット</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="839">質問</text><text class="node-title" x="524" y="867">合法な選択と、選ぶ回数・費用の条件</text><text class="node-title" x="524" y="890">を一つずつ確かめられますか？</text><text class="node-explanation" x="524" y="917">一対象を何回使えるか、必ず選ぶ対象があるか、経路</text><text class="node-explanation" x="524" y="935">はどこまで共用できるかを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1225" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1245">候補</text><text class="node-title" x="160" y="1273">選択の条件と目的値を整理する</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="160" y="1312">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1336">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1225" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1245">分野</text><text class="node-title" x="524" y="1273">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1310">詳細の質問・図へ →</text></a></g></svg>