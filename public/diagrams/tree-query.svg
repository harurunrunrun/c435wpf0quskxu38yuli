<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-query flow-desc-tree-query" width="2204" height="585" viewBox="0 0 2204 585" data-flow-svg="tree-query"><title id="flow-title-tree-query">木の祖先・部分木・経路の解法フローチャート</title><desc id="flow-desc-tree-query">祖先、部分木、経路、距離、少数の指定頂点を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-query" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge ancestors-and-paths" data-edge="target:ancestors-and-paths:ancestors-and-paths-route"><title>祖先や、一本・複数の経路について答える</title><path d="M987.714 141 V153 C987.714 185 192 185 192 217 V229"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-tree-query)"/><g class="flow-edge-label" data-edge-label="target:ancestors-and-paths:ancestors-and-paths-route" tabindex="0" role="group" aria-label="選択肢：祖先や、一本・複数の経路について答える"><rect x="69.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="252">祖先や、一本・複数の経路について答</text><text text-anchor="middle" x="192" y="270">える</text></g></g><g class="flow-edge subtree-values" data-edge="target:subtree-values:subtree-values-route"><title>部分木の値や、含まれる色について答える</title><path d="M1033.429 141 V153 C1033.429 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-tree-query)"/><g class="flow-edge-label" data-edge-label="target:subtree-values:subtree-values-route" tabindex="0" role="group" aria-label="選択肢：部分木の値や、含まれる色について答える"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">部分木の値や、含まれる色について答</text><text text-anchor="middle" x="556" y="270">える</text></g></g><g class="flow-edge specified-vertices" data-edge="target:specified-vertices:specified-vertices-route"><title>指定した少数の頂点や、印を付けた頂点を扱う</title><path d="M1079.143 141 V153 C1079.143 185 920 185 920 217 V229"/><path d="M920 285 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-tree-query)"/><g class="flow-edge-label" data-edge-label="target:specified-vertices:specified-vertices-route" tabindex="0" role="group" aria-label="選択肢：指定した少数の頂点や、印を付けた頂点を扱う"><rect x="797.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="252">指定した少数の頂点や、印を付けた頂</text><text text-anchor="middle" x="920" y="270">点を扱う</text></g></g><g class="flow-edge distance" data-edge="target:distance:centroid"><title>長さの条件を満たす二頂点の経路の個数・最小辺数</title><path d="M1124.857 141 V153 C1124.857 185 1284 185 1284 217 V229"/><path d="M1284 285 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-tree-query)"/><g class="flow-edge-label" data-edge-label="target:distance:centroid" tabindex="0" role="group" aria-label="選択肢：長さの条件を満たす二頂点の経路の個数・最小辺数"><rect x="1161.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="252">長さの条件を満たす二頂点の経路の個</text><text text-anchor="middle" x="1284" y="270">数・最小辺数</text></g></g><g class="flow-edge changing-forest" data-edge="target:changing-forest:changing-forest-route"><title>辺をつなぐ・切る操作があり、経路の値を集計する</title><path d="M1170.571 141 V153 C1170.571 185 1648 185 1648 217 V229"/><path d="M1648 285 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-tree-query)"/><g class="flow-edge-label" data-edge-label="target:changing-forest:changing-forest-route" tabindex="0" role="group" aria-label="選択肢：辺をつなぐ・切る操作があり、経路の値を集計する"><rect x="1525.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="252">辺をつなぐ・切る操作があり、経路の</text><text text-anchor="middle" x="1648" y="270">値を集計する</text></g></g><g class="flow-edge unknown" data-edge="target:unknown:check"><title>わからない</title><path d="M1216.286 141 V153 C1216.286 185 2012 185 2012 217 V229"/><path d="M2012 267 V297 C2012 329 2012 329 2012 361 V373" marker-end="url(#arrow-tree-query)"/><g class="flow-edge-label" data-edge-label="target:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1967.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="2012" y="252">わからない</text></g></g><g class="flow-node question" data-node="target"><rect x="942" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="958" y="52">質問</text><text class="node-title" x="958" y="80">木のどの部分について答えますか？</text><text class="node-explanation" x="958" y="107">根、値が付く場所、対象の頂点の範囲を選びます。</text></g><g class="flow-node route" data-node="ancestors-and-paths-route"><rect x="32" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">祖先と経路の問い合わせ</text><text class="node-explanation" x="48" y="448">祖先への移動、経路上の値、複数の経路を通る回数を</text><text class="node-explanation" x="48" y="466">分けます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-ancestor-path-goals" data-route="tree-ancestor-path-goals"><text x="48" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="subtree-values-route"><rect x="396" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">部分木の値と色</text><text class="node-explanation" x="412" y="448">部分木への集計や更新と、色の種類や出現回数につい</text><text class="node-explanation" x="412" y="466">ての問い合わせを分けます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-subtree-value-goals" data-route="tree-subtree-value-goals"><text x="412" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="specified-vertices-route"><rect x="760" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">指定頂点と印のある頂点</text><text class="node-explanation" x="776" y="448">少数の頂点だけを指定する場合、印を追加する場合、</text><text class="node-explanation" x="776" y="466">印同士を分離する場合を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-marked-vertex-goals" data-route="tree-marked-vertex-goals"><text x="776" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="centroid"><rect x="1124" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">二頂点の経路の長さと求める量</text><a href="/flowchartcp/flowcharts/#diagram-tree-pair-distance" data-route="tree-pair-distance"><text x="1140" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1852" y="373" width="320" height="180" rx="7"/><text class="node-kind" x="1868" y="393">分野</text><text class="node-title" x="1868" y="421">問い合わせで対象となる頂点を確かめ</text><text class="node-title" x="1868" y="444">る</text><text class="node-explanation" x="1868" y="471">根を決めて対象を図に描き、祖先・部分木・経路のど</text><text class="node-explanation" x="1868" y="489">れを扱うかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-query-target-check" data-route="tree-query-target-check"><text x="1868" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="changing-forest-route"><rect x="1488" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">つなぎ替わる森の経路集計</text><a href="/flowchartcp/flowcharts/#diagram-dynamic-forest-path-values" data-route="dynamic-forest-path-values"><text x="1504" y="458">詳細の質問・図へ →</text></a></g></svg>