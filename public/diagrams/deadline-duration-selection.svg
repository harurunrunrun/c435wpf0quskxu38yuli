ack"><title>はい</title><path d="M588 892 V940 C588 972 450 972 450 1004 V1016"/><path d="M450 1054 V1066 C450 1098 384 1098 384 1130 V1142" marker-end="url(#arrow-deadline-duration-selection)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 892 V940 C668 972 655 972 655 1004 V1016"/><path d="M655 1054 V1066 C655 1098 614.667 1098 614.667 1130 V1142" marker-end="url(#arrow-deadline-duration-selection)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 892 V940 C748 972 783.5 972 783.5 1004 V1016"/><path d="M783.5 1054 V1066 C783.5 1098 721.333 1098 721.333 1130 V1142" marker-end="url(#arrow-deadline-duration-selection)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">全仕事が時刻 0 から使え、一人が</text><text class="node-title" x="475.7222222222223" y="103">中断せずに任意の順で行えますか？</text><text class="node-explanation" x="475.7222222222223" y="130">仕事ごとの開始可能時刻や、先に行う依存関係はあり</text><text class="node-explanation" x="475.7222222222223" y="148">ません。処理時間は正です。</text></g><g class="flow-node question" data-node="objective"><rect x="260.6666666666667" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">完了が締切以下の仕事の件数を最大に</text><text class="node-title" x="276.6666666666667" y="467">し、仕事ごとの重みはありませんか？</text><text class="node-explanation" x="276.6666666666667" y="494">同じ件数なら、残す総処理時間を短くすると以後の仕</text><text class="node-explanation" x="276.6666666666667" y="512">事を入れやすくなります。</text></g><g class="flow-node result" data-node="deadline-result"><rect x="32" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">締切順に追加し、時間が超えたら採用</text><text class="node-title" x="48" y="831">済みの最長仕事を一つ外す</text><a href="/flowchartcp/techniques/deadline-duration-remove-longest/"><title>締切までに終える仕事数は、締切順に足して超えたら最長の仕事を外すの記事へ</title><text x="48" y="870">締切までに終える仕事数は、締切順に足して超えた</text><text x="48" y="888">ら最長の仕事を外す</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="760" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="780">質問</text><text class="node-title" x="524" y="808">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="831">確認できますか？</text><text class="node-explanation" x="524" y="858">時間、順番、使える回数と目的値を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1142" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1162">候補</text><text class="node-title" x="160" y="1190">条件と選び方をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1229">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1253">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1162">分野</text><text class="node-title" x="524" y="1190">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1227">詳細の質問・図へ →</text></a></g></svg>