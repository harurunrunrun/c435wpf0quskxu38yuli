<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dice-product-prime-exponents flow-desc-dice-product-prime-exponents" width="1112" height="1809" viewBox="0 0 1112 1809" data-flow-svg="dice-product-prime-exponents"><title id="flow-title-dice-product-prime-exponents">小さな出目の積で目標に一致させるなら、必要な素因数の指数だけを持つの解法フローチャート</title><desc id="flow-desc-dice-product-prime-exponents">目標ちょうどか以上か、初期積、出目 1 の扱い、目標の素因数を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dice-product-prime-exponents" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge exact-product" data-edge="model:exact-product:assumptions"><title>独立な 1..6 のサイコロで積を更新し、目標にちょうど達する確率を求める</title><path d="M718.5 182 V194 C718.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 344 V356 C535.5 388 746.111 388 746.111 420 V432" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="model:exact-product:assumptions" tabindex="0" role="group" aria-label="選択肢：独立な 1..6 のサイコロで積を更新し、目標にちょうど達する確率を求める"><rect x="413" y="270" width="245" height="74" rx="5"/><text text-anchor="middle" x="535.5" y="293">独立な 1..6 のサイコロで積を</text><text text-anchor="middle" x="535.5" y="311">更新し、目標にちょうど達する確率を</text><text text-anchor="middle" x="535.5" y="329">求める</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>目標以上で成功する、または出目・分布が変わる</title><path d="M798.5 182 V194 C798.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V356 C824.5 388 1018 388 1018 420 V432 V617 C1018 649 1018 649 1018 681 V693 V743 C1018 775 1018 775 1018 807 V819 V999 C1018 1031 1018 1031 1018 1063 V1075 V1125 C1018 1157 636 1157 636 1189 V1201" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：目標以上で成功する、または出目・分布が変わる"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">目標以上で成功する、または出目・分</text><text text-anchor="middle" x="824.5" y="311">布が変わる</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M878.5 182 V194 C878.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V356 C1035.5 388 1074 388 1074 420 V432 V617 C1074 649 1074 649 1074 681 V693 V743 C1074 775 1074 775 1074 807 V819 V999 C1074 1031 1074 1031 1074 1063 V1075 V1125 C1074 1157 1000 1157 1000 1189 V1201" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 605 V617 C666.111 649 519.833 649 519.833 681 V693"/><path d="M519.833 731 V743 C519.833 775 519.833 775 519.833 807 V819" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="716">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 605 V617 C746.111 649 795 649 795 681 V693"/><path d="M795 731 V743 C795 775 906 775 906 807 V819 V999 C906 1031 906 1031 906 1063 V1075 V1125 C906 1157 556 1157 556 1189 V1201" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"><title>わからない</title><path d="M826.111 605 V617 C826.111 649 923.5 649 923.5 681 V693"/><path d="M923.5 731 V743 C923.5 775 962 775 962 807 V819 V999 C962 1031 962 1031 962 1063 V1075 V1125 C962 1157 920 1157 920 1189 V1201" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="assumptions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M439.833 987 V999 C439.833 1031 192 1031 192 1063 V1075"/><path d="M192 1113 V1125 C192 1157 192 1157 192 1189 V1201" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M519.833 987 V999 C519.833 1031 556 1031 556 1063 V1075"/><path d="M556 1113 V1125 C556 1157 476 1157 476 1189 V1201" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M599.833 987 V999 C599.833 1031 811.5 1031 811.5 1063 V1075"/><path d="M811.5 1113 V1125 C811.5 1157 840 1157 840 1189 V1201" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="767" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1098">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1351 V1418 C840 1450 783 1450 783 1482 V1494"/><path d="M783 1532 V1544 C783 1576 828.5 1576 828.5 1608 V1620" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1494" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1517">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1351 V1418 C920 1450 907 1450 907 1482 V1494"/><path d="M907 1532 V1544 C907 1576 908.5 1576 908.5 1608 V1620" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1494" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1517">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1351 V1418 C1000 1450 1035.5 1450 1035.5 1482 V1494"/><path d="M1035.5 1532 V1544 C1035.5 1576 988.5 1576 988.5 1608 V1620" marker-end="url(#arrow-dice-product-prime-exponents)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1494" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1517">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="638.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="654.5" y="52">質問</text><text class="node-title" x="654.5" y="80">ランダムな操作と終了の規則はどれで</text><text class="node-title" x="654.5" y="103">すか？</text><text class="node-explanation" x="654.5" y="130">目標ちょうどか以上か、初期積、出目 1 の扱い、</text><text class="node-explanation" x="654.5" y="148">目標の素因数を確認します。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="432" width="320" height="173" rx="7"/><text class="node-kind" x="602.1111111111112" y="452">質問</text><text class="node-title" x="602.1111111111112" y="480">初期積は 1 で、積が目標より大き</text><text class="node-title" x="602.1111111111112" y="503">くなれば成功できず、出目は独立・等</text><text class="node-title" x="602.1111111111112" y="526">確率ですか？</text><text class="node-explanation" x="602.1111111111112" y="553">目標の素因数が 2・3・5 以外なら到達できませ</text><text class="node-explanation" x="602.1111111111112" y="571">ん。目標 1 は、開始した時点で成功です。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="819" width="320" height="168" rx="7"/><text class="node-kind" x="375.83333333333337" y="839">質問</text><text class="node-title" x="375.83333333333337" y="867">目標は10の18乗以下の正整数で、</text><text class="node-title" x="375.83333333333337" y="890">掛けた値が減る操作はありませんか？</text><text class="node-explanation" x="375.83333333333337" y="917">積全体を値域で持たず、目標の指数を超える遷移は失</text><text class="node-explanation" x="375.83333333333337" y="935">敗にします。等確率の出目 1 を除くと、残りの五</text><text class="node-explanation" x="375.83333333333337" y="953">つを重み 1/5 で扱えます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1201" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1221">候補</text><text class="node-title" x="48" y="1249">小さな出目の積で目標に一致させるな</text><text class="node-title" x="48" y="1272">ら、必要な素因数の指数だけを持つ</text><a href="/flowchartcp/techniques/dice-product-prime-exponents/"><title>小さな出目の積で目標に一致させるなら、必要な素因数の指数だけを持つの記事へ</title><text x="48" y="1311">小さな出目の積で目標に一致させるなら、必要な素</text><text x="48" y="1329">因数の指数だけを持つ</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1201" width="320" height="205" rx="7"/><text class="node-kind" x="412" y="1221">候補</text><text class="node-title" x="412" y="1249">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1276">出目や分布が変われば使える素因数も自己遷移の係数</text><text class="node-explanation" x="412" y="1294">も変わります。残り五つを一律 1/5 としないで</text><text class="node-explanation" x="412" y="1312">書き直します。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1342">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1366">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1201" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1221">質問</text><text class="node-title" x="776" y="1249">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1272">確認できますか？</text><text class="node-explanation" x="776" y="1299">目標ちょうどか以上か、初期積、出目 1 の扱い、</text><text class="node-explanation" x="776" y="1317">目標の素因数を確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1620" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1640">分野</text><text class="node-title" x="764.5" y="1668">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1695">目標ちょうどか以上か、初期積、出目 1 の扱い、</text><text class="node-explanation" x="764.5" y="1713">目標の素因数を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1741">詳細の質問・図へ →</text></a></g></svg>