-distance)"/><g class="flow-edge-label" data-edge-label="unit:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="cost:yes:edge-result"><title>はい</title><path d="M323.167 928 V940 C323.167 972 192 972 192 1004 V1016"/><path d="M192 1054 V1066 C192 1098 192 1098 192 1130 V1142" marker-end="url(#arrow-unit-edge-failure-distance)"/><g class="flow-edge-label" data-edge-label="cost:yes:edge-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="cost:no:fallback"><title>いいえ</title><path d="M403.167 928 V940 C403.167 972 402 972 402 1004 V1016"/><path d="M402 1054 V1066 C402 1098 402 1098 402 1130 V1142 V1322 C402 1354 360 1354 360 1386 V1398 V1448 C360 1480 264 1480 264 1512 V1524" marker-end="url(#arrow-unit-edge-failure-distance)"/><g class="flow-edge-label" data-edge-label="cost:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="cost:unknown:check"><title>わからない</title><path d="M483.167 928 V940 C483.167 972 615.5 972 615.5 1004 V1016"/><path d="M615.5 1054 V1066 C615.5 1098 588 1098 588 1130 V1142" marker-end="url(#arrow-unit-edge-failure-distance)"/><g class="flow-edge-label" data-edge-label="cost:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="571" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="615.5" y="1039">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 1274 V1322 C588 1354 506 1354 506 1386 V1398"/><path d="M506 1436 V1448 C506 1480 392 1480 392 1512 V1524" marker-end="url(#arrow-unit-edge-failure-distance)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1421">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 1274 V1322 C668 1354 655 1354 655 1386 V1398"/><path d="M655 1436 V1448 C655 1480 670.667 1480 670.667 1512 V1524" marker-end="url(#arrow-unit-edge-failure-distance)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1421">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 1274 V1322 C748 1354 783.5 1354 783.5 1386 V1398"/><path d="M783.5 1436 V1448 C783.5 1480 777.333 1480 777.333 1512 V1524" marker-end="url(#arrow-unit-edge-failure-distance)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1398" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1421">わからない</text></g></g><g class="flow-node question" data-node="independent"><rect x="549.0185185185186" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="565.0185185185186" y="52">質問</text><text class="node-title" x="565.0185185185186" y="80">各辺を一本ずつ、元のグラフに対して</text><text class="node-title" x="565.0185185185186" y="103">独立に禁止しますか？</text><text class="node-explanation" x="565.0185185185186" y="130">前の質問で禁止した辺は、次の質問では元に戻りま</text><text class="node-explanation" x="565.0185185185186" y="148">す。</text></g><g class="flow-node question" data-node="unit"><rect x="416.55555555555554" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="432.55555555555554" y="416">質問</text><text class="node-title" x="432.55555555555554" y="444">辺は有向で、全ての長さが 1 です</text><text class="node-title" x="432.55555555555554" y="467">か？</text><text class="node-explanation" x="432.55555555555554" y="494">一つの最短経路を取り、そこにない辺を禁止した答え</text><text class="node-explanation" x="432.55555555555554" y="512">は元の最短距離になります。</text></g><g class="flow-node question" data-node="cost"><rect x="243.16666666666669" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="259.1666666666667" y="780">質問</text><text class="node-title" x="259.1666666666667" y="808">一つの最短経路上の辺だけを禁止して</text><text class="node-title" x="259.1666666666667" y="831">再探索する計算量が制限内ですか？</text><text class="node-explanation" x="259.1666666666667" y="858">再探索は高々 N−1 回で、全体 O(N(N+</text><text class="node-explanation" x="259.1666666666667" y="876">M))。N が大きすぎると、この方法だけでは十分</text><text class="node-explanation" x="259.1666666666667" y="894">に減りません。</text></g><g class="flow-node result" data-node="edge-result"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">選んだ最短経路上の辺だけを、一本ず</text><text class="node-title" x="48" y="1213">つ禁止して再探索する</text><a href="/flowchartcp/techniques/unweighted-edge-removal-shortest/"><title>一本ずつ辺を禁止する最短距離は、選んだ最短路の辺だけ再探索するの記事へ</title><text x="48" y="1252">一本ずつ辺を禁止する最短距離は、選んだ最短路の</text><text x="48" y="1270">辺だけ再探索する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="1142" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="1162">質問</text><text class="node-title" x="524" y="1190">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="1213">確認できますか？</text><text class="node-explanation" x="524" y="1240">辺の向き、再訪、求める量と制約を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1524" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1544">候補</text><text class="node-title" x="216" y="1572">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="216" y="1611">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1635">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1524" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1544">分野</text><text class="node-title" x="580" y="1572">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1609">詳細の質問・図へ →</text></a></g></svg>