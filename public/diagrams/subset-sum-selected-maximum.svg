<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-subset-sum-selected-maximum flow-desc-subset-sum-selected-maximum" width="860" height="1384" viewBox="0 0 860 1384" data-flow-svg="subset-sum-selected-maximum"><title id="flow-title-subset-sum-selected-maximum">合計が選択中の最大値以下になる集合数の解法フローチャート</title><desc id="flow-desc-subset-sum-selected-maximum">最大値の担当を一つに決め、その前の候補の合計だけ数えます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-subset-sum-selected-maximum" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:positive"><title>はい</title><path d="M539.722 223 V235 C539.722 267 420.667 267 420.667 299 V311"/><path d="M420.667 349 V361 C420.667 393 420.667 393 420.667 425 V437" marker-end="url(#arrow-subset-sum-selected-maximum)"/><g class="flow-edge-label" data-edge-label="model:yes:positive" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="334">はい</text></g></g><g class="flow-edge no" data-edge="model:no:fallback"><title>いいえ</title><path d="M619.722 223 V235 C619.722 267 655 267 655 299 V311"/><path d="M655 349 V361 C655 393 762.5 393 762.5 425 V437 V617 C762.5 649 762.5 649 762.5 681 V693 V743 C762.5 775 458 775 458 807 V819 V999 C458 1031 360 1031 360 1063 V1075 V1125 C360 1157 304 1157 304 1189 V1201" marker-end="url(#arrow-subset-sum-selected-maximum)"/><g class="flow-edge-label" data-edge-label="model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M699.722 223 V235 C699.722 267 783.5 267 783.5 299 V311"/><path d="M783.5 349 V361 C783.5 393 818.5 393 818.5 425 V437 V617 C818.5 649 818.5 649 818.5 681 V693 V743 C818.5 775 721.333 775 721.333 807 V819" marker-end="url(#arrow-subset-sum-selected-maximum)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="positive:yes:sum-result"><title>はい</title><path d="M340.667 605 V617 C340.667 649 192 649 192 681 V693"/><path d="M192 731 V743 C192 775 192 775 192 807 V819" marker-end="url(#arrow-subset-sum-selected-maximum)"/><g class="flow-edge-label" data-edge-label="positive:yes:sum-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="716">はい</text></g></g><g class="flow-edge no" data-edge="positive:no:fallback"><title>いいえ</title><path d="M420.667 605 V617 C420.667 649 402 649 402 681 V693"/><path d="M402 731 V743 C402 775 402 775 402 807 V819 V999 C402 1031 304 1031 304 1063 V1075 V1125 C304 1157 224 1157 224 1189 V1201" marker-end="url(#arrow-subset-sum-selected-maximum)"/><g class="flow-edge-label" data-edge-label="positive:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="positive:unknown:check"><title>わからない</title><path d="M500.667 605 V617 C500.667 649 668 649 668 681 V693"/><path d="M668 731 V743 C668 775 614.667 775 614.667 807 V819" marker-end="url(#arrow-subset-sum-selected-maximum)"/><g class="flow-edge-label" data-edge-label="positive:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 969 V999 C588 1031 450 1031 450 1063 V1075"/><path d="M450 1113 V1125 C450 1157 384 1157 384 1189 V1201" marker-end="url(#arrow-subset-sum-selected-maximum)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 969 V999 C668 1031 655 1031 655 1063 V1075"/><path d="M655 1113 V1125 C655 1157 614.667 1157 614.667 1189 V1201" marker-end="url(#arrow-subset-sum-selected-maximum)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 969 V999 C748 1031 783.5 1031 783.5 1063 V1075"/><path d="M783.5 1113 V1125 C783.5 1157 721.333 1157 721.333 1189 V1201" marker-end="url(#arrow-subset-sum-selected-maximum)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1098">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="459.7222222222223" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">各対象に A,B があり、非空集合</text><text class="node-title" x="475.7222222222223" y="103">で B の総和≤選んだ A の最大</text><text class="node-title" x="475.7222222222223" y="126">値を要求しますか？</text><text class="node-explanation" x="475.7222222222223" y="153">最大 A の担当を、(A,入力の位置) の順で最</text><text class="node-explanation" x="475.7222222222223" y="171">後の一人に決めれば、A が等しくても一つの担当に</text><text class="node-explanation" x="475.7222222222223" y="189">なります。</text></g><g class="flow-node question" data-node="positive"><rect x="260.6666666666667" y="437" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="457">質問</text><text class="node-title" x="276.6666666666667" y="485">A,B は非負整数で、最大 A ま</text><text class="node-title" x="276.6666666666667" y="508">での合計表を保存できますか？</text><text class="node-explanation" x="276.6666666666667" y="535">B が非負なら、大きすぎる途中の合計を捨てても、</text><text class="node-explanation" x="276.6666666666667" y="553">後で小さく戻ることはありません。B=0 も一要素</text><text class="node-explanation" x="276.6666666666667" y="571">として区別します。</text></g><g class="flow-node result" data-node="sum-result"><rect x="32" y="819" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">A 順で最後の担当を決め、その前の</text><text class="node-title" x="48" y="890">合計に B を加えて上限を調べる</text><a href="/flowchartcp/techniques/subset-sum-max-threshold/"><title>一方の和が他方の最大値以下になる部分集合は、最大値の担当を決めて数えるの記事へ</title><text x="48" y="929">一方の和が他方の最大値以下になる部分集合は、最</text><text x="48" y="947">大値の担当を決めて数える</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="839">質問</text><text class="node-title" x="524" y="867">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="890">確認できますか？</text><text class="node-explanation" x="524" y="917">使える操作、残す履歴、求める個数や最適値を確認し</text><text class="node-explanation" x="524" y="935">ます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1201" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1221">候補</text><text class="node-title" x="160" y="1249">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1288">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1312">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1201" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1221">分野</text><text class="node-title" x="524" y="1249">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1286">詳細の質問・図へ →</text></a></g></svg>