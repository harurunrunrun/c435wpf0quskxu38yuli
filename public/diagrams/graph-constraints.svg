-label="選択肢：いいえ"><rect x="822" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="862" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="two-values:unknown:check"><title>わからない</title><path d="M920.167 541 V553 C920.167 585 990.5 585 990.5 617 V629"/><path d="M990.5 667 V679 C990.5 711 934 711 934 743 V755 V941 C934 973 1298 973 1298 1005 V1017 V1067 C1298 1099 1256 1099 1256 1131 V1143" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="two-values:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="946" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="990.5" y="652">わからない</text></g></g><g class="flow-edge yes" data-edge="forbidden-implications:yes:two-sat-result"><title>はい</title><path d="M588 928 V941 C588 973 895 973 895 1005 V1017"/><path d="M895 1055 V1067 C895 1099 780 1099 780 1131 V1143" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="forbidden-implications:yes:two-sat-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="855" y="1017" width="80" height="38" rx="5"/><text text-anchor="middle" x="895" y="1040">はい</text></g></g><g class="flow-edge no" data-edge="forbidden-implications:no:fallback"><title>いいえ</title><path d="M668 928 V941 C668 973 1019 973 1019 1005 V1017"/><path d="M1019 1055 V1067 C1019 1099 990 1099 990 1131 V1143 V1329 C990 1361 973 1361 973 1393 V1405 V1455 C973 1487 894.667 1487 894.667 1519 V1531" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="forbidden-implications:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="979" y="1017" width="80" height="38" rx="5"/><text text-anchor="middle" x="1019" y="1040">いいえ</text></g></g><g class="flow-edge unknown" data-edge="forbidden-implications:unknown:check"><title>わからない</title><path d="M748 928 V941 C748 973 1147.5 973 1147.5 1005 V1017"/><path d="M1147.5 1055 V1067 C1147.5 1099 12