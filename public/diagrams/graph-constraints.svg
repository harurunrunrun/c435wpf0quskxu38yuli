<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-graph-constraints flow-desc-graph-constraints" width="1504" height="1714" viewBox="0 0 1504 1714" data-flow-svg="graph-constraints"><title id="flow-title-graph-constraints">二値の禁止組・差の制約の解法フローチャート</title><desc id="flow-desc-graph-constraints">各変数が取る値と、二者間の条件の形から分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-graph-constraints" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge parity" data-edge="constraint-kind:parity:parity-domain"><title>0/1 の値が同じか違うかを指定する</title><path d="M868.75 159 V171 C868.75 203 374.833 203 374.833 235 V247"/><path d="M374.833 303 V315 C374.833 347 374.833 347 374.833 379 V391" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="constraint-kind:parity:parity-domain" tabindex="0" role="group" aria-label="選択肢：0/1 の値が同じか違うかを指定する"><rect x="252.33333333333331" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="374.8333333333333" y="270">0/1 の値が同じか違うかを指定す</text><text text-anchor="middle" x="374.8333333333333" y="288">る</text></g></g><g class="flow-edge forbidden-pairs" data-edge="constraint-kind:forbidden-pairs:two-values"><title>各変数に二つの選択肢があり、選択肢の組を禁止する</title><path d="M932.75 159 V171 C932.75 203 840.167 203 840.167 235 V247"/><path d="M840.167 303 V315 C840.167 347 840.167 347 840.167 379 V391" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="constraint-kind:forbidden-pairs:two-values" tabindex="0" role="group" aria-label="選択肢：各変数に二つの選択肢があり、選択肢の組を禁止する"><rect x="717.6666666666666" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="840.1666666666666" y="270">各変数に二つの選択肢があり、選択肢</text><text text-anchor="middle" x="840.1666666666666" y="288">の組を禁止する</text></g></g><g class="flow-edge difference" data-edge="constraint-kind:difference:difference-equations"><title>Xa−Xb=d という差の等式を追加する</title><path d="M996.75 159 V171 C996.75 203 1216.5 203 1216.5 235 V247"/><path d="M1216.5 303 V315 C1216.5 347 1244.5 347 1244.5 379 V391" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="constraint-kind:difference:difference-equations" tabindex="0" role="group" aria-label="選択肢：Xa−Xb=d という差の等式を追加する"><rect x="1094" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1216.5" y="270">Xa−Xb=d という差の等式を追</text><text text-anchor="middle" x="1216.5" y="288">加する</text></g></g><g class="flow-edge unknown" data-edge="constraint-kind:unknown:check"><title>わからない</title><path d="M1060.75 159 V171 C1060.75 203 1427.5 203 1427.5 235 V247"/><path d="M1427.5 285 V315 C1427.5 347 1466 347 1466 379 V391 V553 C1466 585 1466 585 1466 617 V629 V679 C1466 711 1466 711 1466 743 V755 V941 C1466 973 1466 973 1466 1005 V1017 V1067 C1466 1099 1362.667 1099 1362.667 1131 V1143" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="constraint-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1383" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1427.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="parity-domain:yes:parity-result"><title>はい</title><path d="M294.833 541 V553 C294.833 585 192 585 192 617 V629"/><path d="M192 667 V679 C192 711 192 711 192 743 V755" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="parity-domain:yes:parity-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="652">はい</text></g></g><g class="flow-edge no" data-edge="parity-domain:no:fallback"><title>いいえ</title><path d="M374.833 541 V553 C374.833 585 402 585 402 617 V629"/><path d="M402 667 V679 C402 711 402 711 402 743 V755 V941 C402 973 570 973 57