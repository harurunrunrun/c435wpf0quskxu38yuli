<rect x="1327" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="1371.5" y="652">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1176 1293 V1329 C1176 1361 1119 1361 1119 1393 V1405"/><path d="M1119 1443 V1455 C1119 1487 1001.333 1487 1001.333 1519 V1531" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1079" y="1405" width="80" height="38" rx="5"/><text text-anchor="middle" x="1119" y="1428">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1256 1293 V1329 C1256 1361 1243 1361 1243 1393 V1405"/><path d="M1243 1443 V1455 C1243 1487 1258.667 1487 1258.667 1519 V1531" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1203" y="1405" width="80" height="38" rx="5"/><text text-anchor="middle" x="1243" y="1428">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1336 1293 V1329 C1336 1361 1371.5 1361 1371.5 1393 V1405"/><path d="M1371.5 1443 V1455 C1371.5 1487 1365.333 1487 1365.333 1519 V1531" marker-end="url(#arrow-graph-constraints)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1327" y="1405" width="89" height="38" rx="5"/><text text-anchor="middle" x="1371.5" y="1428">わからない</text></g></g><g class="flow-node question" data-node="constraint-kind"><rect x="804.75" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="820.75" y="52">質問</text><text class="node-title" x="820.75" y="80">二つの変数の間の条件はどれですか？</text><text class="node-explanation" x="820.75" y="107">二値の論理条件と、整数の差の等式では状態の持ち方</text><text class="node-explanation" x="820.75" y="125">が異なります。</text></g><g class="flow-node question" data-node="parity-domain"><rect x="214.83333333333331" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="230.83333333333331" y="411">質問</text><text class="node-title" x="230.83333333333331" y="439">値は二種類だけで、各制約は同じ・違</text><text class="node-title" x="230.83333333333331" y="462">うという関係ですか？</text><text class="node-explanation" x="230.83333333333331" y="489">三種類以上の値や、大小の制約は、二つの色だけの判</text><text class="node-explanation" x="230.83333333333331" y="507">定に変換できません。</text></g><g class="flow-node result" data-node="parity-result"><rect x="32" y="755" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="775">候補</text><text class="node-title" x="48" y="803">同じ・違う関係を、成分内の偶奇とし</text><text class="node-title" x="48" y="826">て伝える</text><a href="/flowchartcp/techniques/bipartite-parity-constraints/"><title>同じ・異なるという二値制約を偶奇として伝播するの記事へ</title><text x="48" y="865">同じ・異なるという二値制約を偶奇として伝播する</text></a></g><g class="flow-node question" data-node="two-values"><rect x="680.1666666666666" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="696.1666666666666" y="411">質問</text><text class="node-title" x="696.1666666666666" y="439">各変数の候補はちょうど二つで、禁止</text><text class="node-title" x="696.1666666666666" y="462">する条件は二者の選択肢の組ですか？</text><text class="node-explanation" x="696.1666666666666" y="489">三つ以上の候補や、三変数を同時に含む条件を、同じ</text><text class="node-explanation" x="696.1666666666666" y="507">方法で断定しないようにします。</text></g><g class="flow-node question" data-node="forbidden-implications"><rect x="508" y="755" width="320" height="173" rx="7"/><text class="node-kind" x="524" y="775">質問</text><text class="node-title" x="524" y="803">禁止組を選ぶと、もう一方は反対の選</text><text class="node-title" x="524" y="826">択をするという二つの含意にできます</text><text class="node-title" x="524" y="849">か？</text><text class="node-explanation" x="524" y="876">(x=a,y=b) を禁止するなら x=a→y≠</text><text class="node-explanation" x="524" y="894">b と y=b→x≠a を両方張ります。</text></g><g class="flow-node result" data-node="two-sat-result"><rect x="620" y="1143" width="320" height="174" rx="7"/><text class="node-kind" x="636" y="1163">候補</text><text class="node-title" x="636" y="1191">二つの選択肢の禁止組を、相互の含意</text><text class="node-title" x="636" y="1214">へ写す</text><a href="/flowchartcp/techniques/two-sat-forbidden-pairs/"><title>二つの選択肢の禁止組を含意に直すの記事へ</title><text x="636" y="1253">二つの選択肢の禁止組を含意に直す</text></a><a href="/flowchartcp/techniques/scc/"><title>強連結成分分解の記事へ</title><text x="636" y="1277">強連結成分分解</text></a></g><g class="flow-node question" data-node="difference-equations"><rect x="1084.5" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="1100.5" y="411">質問</text><text class="node-title" x="1100.5" y="439">条件は差の等式だけで、差を加算して</text><text class="node-title" x="1100.5" y="462">つなげられますか？</text><text class="node-explanation" x="1100.5" y="489">差の下限・上限という不等式や、積の条件は同じ併合</text><text class="node-explanation" x="1100.5" y="507">では表せません。</text></g><g class="flow-node result" data-node="difference-result"><rect x="984" y="755" width="320" height="174" rx="7"/><text class="node-kind" x="1000" y="775">候補</text><text class="node-title" x="1000" y="803">代表との値の差を保存し、成分の併合</text><text class="node-title" x="1000" y="826">時に矛盾を確かめる</text><a href="/flowchartcp/techniques/dsu-potential-differences/"><title>変数間の差の制約を根からの差で管理するの記事へ</title><text x="1000" y="865">変数間の差の制約を根からの差で管理する</text></a><a href="/flowchartcp/techniques/union-find/"><title>Union-Findの記事へ</title><text x="1000" y="889">Union-Find</text></a></g><g class="flow-node question" data-node="check"><rect x="1096" y="1143" width="320" height="150" rx="7"/><text class="node-kind" x="1112" y="1163">質問</text><text class="node-title" x="1112" y="1191">入力例から、判定に使う条件を一つず</text><text class="node-title" x="1112" y="1214">つ確かめられますか？</text><text class="node-explanation" x="1112" y="1241">どの条件が問題文で保証され、どの条件を証明する必</text><text class="node-explanation" x="1112" y="1259">要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="788" y="1531" width="320" height="151" rx="7"/><text class="node-kind" x="804" y="1551">候補</text><text class="node-title" x="804" y="1579">必要な条件を小さい例で確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="804" y="1618">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="804" y="1642">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1152" y="1531" width="320" height="121" rx="7"/><text class="node-kind" x="1168" y="1551">分野</text><text class="node-title" x="1168" y="1579">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1168" y="1616">詳細の質問・図へ →</text></a></g></svg>