<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-independent-first-arrival flow-desc-independent-first-arrival" width="860" height="1407" viewBox="0 0 860 1407" data-flow-svg="independent-first-arrival"><title id="flow-title-independent-first-arrival">交互に進む二人の先着確率の解法フローチャート</title><desc id="flow-desc-independent-first-arrival">初到着と、相手がまだ到着しない確率を別々に計算します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-independent-first-arrival" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="independent:yes:order"><title>はい</title><path d="M539.722 223 V235 C539.722 267 420.667 267 420.667 299 V311"/><path d="M420.667 349 V361 C420.667 393 420.667 393 420.667 425 V437" marker-end="url(#arrow-independent-first-arrival)"/><g class="flow-edge-label" data-edge-label="independent:yes:order" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="334">はい</text></g></g><g class="flow-edge no" data-edge="independent:no:fallback"><title>いいえ</title><path d="M619.722 223 V235 C619.722 267 655 267 655 299 V311"/><path d="M655 349 V361 C655 393 762.5 393 762.5 425 V437 V640 C762.5 672 762.5 672 762.5 704 V716 V766 C762.5 798 458 798 458 830 V842 V1022 C458 1054 360 1054 360 1086 V1098 V1148 C360 1180 304 1180 304 1212 V1224" marker-end="url(#arrow-independent-first-arrival)"/><g class="flow-edge-label" data-edge-label="independent:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="independent:unknown:check"><title>わからない</title><path d="M699.722 223 V235 C699.722 267 783.5 267 783.5 299 V311"/><path d="M783.5 349 V361 C783.5 393 818.5 393 818.5 425 V437 V640 C818.5 672 818.5 672 818.5 704 V716 V766 C818.5 798 721.333 798 721.333 830 V842" marker-end="url(#arrow-independent-first-arrival)"/><g class="flow-edge-label" data-edge-label="independent:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="order:yes:race-result"><title>はい</title><path d="M340.667 628 V640 C340.667 672 192 672 192 704 V716"/><path d="M192 754 V766 C192 798 192 798 192 830 V842" marker-end="url(#arrow-independent-first-arrival)"/><g class="flow-edge-label" data-edge-label="order:yes:race-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="716" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="739">はい</text></g></g><g class="flow-edge no" data-edge="order:no:fallback"><title>いいえ</title><path d="M420.667 628 V640 C420.667 672 402 672 402 704 V716"/><path d="M402 754 V766 C402 798 402 798 402 830 V842 V1022 C402 1054 304 1054 304 1086 V1098 V1148 C304 1180 224 1180 224 1212 V1224" marker-end="url(#arrow-independent-first-arrival)"/><g class="flow-edge-label" data-edge-label="order:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="716" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="739">いいえ</text></g></g><g class="flow-edge unknown" data-edge="order:unknown:check"><title>わからない</title><path d="M500.667 628 V640 C500.667 672 668 672 668 704 V716"/><path d="M668 754 V766 C668 798 614.667 798 614.667 830 V842" marker-end="url(#arrow-independent-first-arrival)"/><g class="flow-edge-label" data-edge-label="order:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="716" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="739">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 992 V1022 C588 1054 450 1054 450 1086 V1098"/><path d="M450 1136 V1148 C450 1180 384 1180 384 1212 V1224" marker-end="url(#arrow-independent-first-arrival)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1121">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 992 V1022 C668 1054 655 1054 655 1086 V1098"/><path d="M655 1136 V1148 C655 1180 614.667 1180 614.667 1212 V1224" marker-end="url(#arrow-independent-first-arrival)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1121">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 992 V1022 C748 1054 783.5 1054 783.5 1086 V1098"/><path d="M783.5 1136 V1148 C783.5 1180 721.333 1180 721.333 1212 V1224" marker-end="url(#arrow-independent-first-arrival)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1098" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1121">わからない</text></g></g><g class="flow-node question" data-node="independent"><rect x="459.7222222222223" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">二人の進み方は独立で、それぞれ毎回</text><text class="node-title" x="475.7222222222223" y="103"> 1..P・1..Q を一様に引き</text><text class="node-title" x="475.7222222222223" y="126">ますか？</text><text class="node-explanation" x="475.7222222222223" y="153">それぞれの出目の範囲は固定で、終点を超えた分は終</text><text class="node-explanation" x="475.7222222222223" y="171">点へまとめます。毎回少なくとも一進むため、初到着</text><text class="node-explanation" x="475.7222222222223" y="189">の回数は有限です。</text></g><g class="flow-node question" data-node="order"><rect x="260.6666666666667" y="437" width="320" height="191" rx="7"/><text class="node-kind" x="276.6666666666667" y="457">質問</text><text class="node-title" x="276.6666666666667" y="485">二人は終点より手前から交互に進み、</text><text class="node-title" x="276.6666666666667" y="508">同じ周回で到着すれば先手が勝ちます</text><text class="node-title" x="276.6666666666667" y="531">か？</text><text class="node-explanation" x="276.6666666666667" y="558">先手が t 回目に初到着するとき、後手は t−1</text><text class="node-explanation" x="276.6666666666667" y="576"> 回終了時点でまだ到着していればよい条件です。後</text><text class="node-explanation" x="276.6666666666667" y="594">手の t 回目の生存を掛けると同時周回の勝ちを…</text></g><g class="flow-node result" data-node="race-result"><rect x="32" y="842" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="862">候補</text><text class="node-title" x="48" y="890">先手の初到着と後手の一回前の未到着</text><text class="node-title" x="48" y="913">を掛け、回数ごとに足す</text><a href="/flowchartcp/techniques/independent-race-first-hit/"><title>交互の独立な競争は、先着時刻の分布と相手の生存確率を掛けるの記事へ</title><text x="48" y="952">交互の独立な競争は、先着時刻の分布と相手の生存</text><text x="48" y="970">確率を掛ける</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="842" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="862">質問</text><text class="node-title" x="524" y="890">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="913">確認できますか？</text><text class="node-explanation" x="524" y="940">何を一つの状態にし、何を別の答えとして数えるか、</text><text class="node-explanation" x="524" y="958">制約で列挙が間に合うかを確かめます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1224" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1244">候補</text><text class="node-title" x="160" y="1272">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1311">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1335">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1224" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1244">分野</text><text class="node-title" x="524" y="1272">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1309">詳細の質問・図へ →</text></a></g></svg>