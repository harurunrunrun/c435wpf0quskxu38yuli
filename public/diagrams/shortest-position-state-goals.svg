<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-shortest-position-state-goals flow-desc-shortest-position-state-goals" width="1476" height="963" viewBox="0 0 1476 963" data-flow-svg="shortest-position-state-goals"><title id="flow-title-shortest-position-state-goals">位置と一緒に覚える情報の解法フローチャート</title><desc id="flow-desc-shortest-position-state-goals">通れる辺を決めるモード、直前の方向、移動で使う資源を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-shortest-position-state-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge switch" data-edge="movement:switch:switch-check"><title>スイッチやモードで通れる辺が変わる</title><path d="M893.625 159 V171 C893.625 203 500 203 500 235 V247"/><path d="M500 285 V315 C500 347 500 347 500 379 V391" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="movement:switch:switch-check" tabindex="0" role="group" aria-label="選択肢：スイッチやモードで通れる辺が変わる"><rect x="377.5" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="500" y="270">スイッチやモードで通れる辺が変わる</text></g></g><g class="flow-edge turn" data-edge="movement:turn:turn-check"><title>進む向きや曲がる回数に費用がある</title><path d="M1021.625 159 V171 C1021.625 203 1195 203 1195 235 V247"/><path d="M1195 285 V315 C1195 347 1228 347 1228 379 V391" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="movement:turn:turn-check" tabindex="0" role="group" aria-label="選択肢：進む向きや曲がる回数に費用がある"><rect x="1079" y="247" width="232" height="38" rx="5"/><text text-anchor="middle" x="1195" y="270">進む向きや曲がる回数に費用がある</text></g></g><g class="flow-edge resource" data-edge="movement:resource:resource-limit"><title>移動で資源を消費し、場所で補充できる</title><path d="M957.625 159 V171 C957.625 203 864 203 864 235 V247"/><path d="M864 303 V315 C864 347 864 347 864 379 V391" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="movement:resource:resource-limit" tabindex="0" role="group" aria-label="選択肢：移動で資源を消費し、場所で補充できる"><rect x="741.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="864" y="270">移動で資源を消費し、場所で補充でき</text><text text-anchor="middle" x="864" y="288">る</text></g></g><g class="flow-edge unknown" data-edge="movement:unknown:check"><title>わからない</title><path d="M1085.625 159 V171 C1085.625 203 1399.5 203 1399.5 235 V247"/><path d="M1399.5 285 V315 C1399.5 347 1438 347 1438 379 V391 V560 C1438 592 1438 592 1438 624 V636 V686 C1438 718 1364 718 1364 750 V762" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="movement:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="switch-check:yes:switch-result"><title>はい</title><path d="M420 541 V560 C420 592 192 592 192 624 V636"/><path d="M192 674 V686 C192 718 192 718 192 750 V762" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="switch-check:yes:switch-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="659">はい</text></g></g><g class="flow-edge no" data-edge="switch-check:no:fallback"><title>いいえ</title><path d="M500 541 V560 C500 592 556 592 556 624 V636"/><path d="M556 674 V686 C556 718 502.667 718 502.667 750 V762" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="switch-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="659">いいえ</text></g></g><g class="flow-edge unknown" data-edge="switch-check:unknown:check"><title>わからない</title><path d="M580 541 V560 C580 592 1210.5 592 1210.5 624 V636"/><path d="M1210.5 674 V686 C1210.5 718 1204 718 1204 750 V762" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="switch-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1166" y="636" width="89" height="38" rx="5"/><text text-anchor="middle" x="1210.5" y="659">わからない</text></g></g><g class="flow-edge yes" data-edge="turn-check:yes:turn-result"><title>はい</title><path d="M1228 541 V560 C1228 592 920 592 920 624 V636"/><path d="M920 674 V686 C920 718 920 718 920 750 V762" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="turn-check:yes:turn-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="659">はい</text></g></g><g class="flow-edge no" data-edge="turn-check:no:fallback"><title>いいえ</title><path d="M1148 541 V560 C1148 592 680 592 680 624 V636"/><path d="M680 674 V686 C680 718 609.333 718 609.333 750 V762" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="turn-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="640" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="680" y="659">いいえ</text></g></g><g class="flow-edge unknown" data-edge="turn-check:unknown:check"><title>わからない</title><path d="M1308 541 V560 C1308 592 1343.5 592 1343.5 624 V636"/><path d="M1343.5 674 V686 C1343.5 718 1284 718 1284 750 V762" marker-end="url(#arrow-shortest-position-state-goals)"/><g class="flow-edge-label" data-edge-label="turn-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1299" y="636" width="89" height="38" rx="5"/><text text-anchor="middle" x="1343.5" y="659">わからない</text></g></g><g class="flow-node question" data-node="movement"><rect x="829.625" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="845.625" y="52">質問</text><text class="node-title" x="845.625" y="80">移動の特徴はどれですか？</text><text class="node-explanation" x="845.625" y="107">元の頂点だけでは足りない情報と、移動費用を選びま</text><text class="node-explanation" x="845.625" y="125">す。</text></g><g class="flow-node question" data-node="switch-check"><rect x="340" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="356" y="411">質問</text><text class="node-title" x="356" y="439">位置とスイッチ・モードの組で、次の</text><text class="node-title" x="356" y="462">移動を決められますか？</text><text class="node-explanation" x="356" y="489">同じ位置でも次に進める場所が違うなら、別の状態に</text><text class="node-explanation" x="356" y="507">します。</text></g><g class="flow-node result" data-node="switch-result"><rect x="32" y="762" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="782">候補</text><text class="node-title" x="48" y="810">位置とモードを別の頂点にする</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="48" y="849">状態の設計</text></a><a href="/flowchartcp/techniques/bfs/"><title>幅優先探索の記事へ</title><text x="48" y="873">幅優先探索</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="762" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="782">候補</text><text class="node-title" x="412" y="810">重みと必要な距離を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="849">状態の設計</text></a></g><g class="flow-node route" data-node="check"><rect x="1124" y="762" width="320" height="157" rx="7"/><text class="node-kind" x="1140" y="782">分野</text><text class="node-title" x="1140" y="810">移動費用の符号を確かめる</text><text class="node-explanation" x="1140" y="837">負の費用が許されるかを問題文の範囲から確かめ、適</text><text class="node-explanation" x="1140" y="855">用できる探索を判断します。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-edge-cost-sign-check" data-route="shortest-edge-cost-sign-check"><text x="1140" y="883">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="turn-check"><rect x="1068" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="1084" y="411">質問</text><text class="node-title" x="1084" y="439">現在位置と直前の方向を覚えれば、曲</text><text class="node-title" x="1084" y="462">がる費用を計算できますか？</text><text class="node-explanation" x="1084" y="489">向きを変えず進む辺と、向きを変える辺で費用を分け</text><text class="node-explanation" x="1084" y="507">ます。</text></g><g class="flow-node result" data-node="turn-result"><rect x="760" y="762" width="320" height="169" rx="7"/><text class="node-kind" x="776" y="782">候補</text><text class="node-title" x="776" y="810">直前の方向を状態に加える</text><a href="/flowchartcp/techniques/turn-penalty-state/"><title>曲がる回数を最小にするため、直前の向きを状態に持つの記事へ</title><text x="776" y="849">曲がる回数を最小にするため、直前の向きを状態に</text><text x="776" y="867">持つ</text></a><a href="/flowchartcp/techniques/zero-one-bfs/"><title>0-1 BFSの記事へ</title><text x="776" y="891">0-1 BFS</text></a></g><g class="flow-node route" data-node="resource-limit"><rect x="704" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="720" y="411">分野</text><text class="node-title" x="720" y="439">移動で消費・補充する資源</text><text class="node-explanation" x="720" y="466">資源の上限を切れる根拠と、位置・所持量で次の行動</text><text class="node-explanation" x="720" y="484">が決まる条件を確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-resource-state-details" data-route="shortest-resource-state-details"><text x="720" y="512">詳細の質問・図へ →</text></a></g></svg>