="704.8333333333334" y="52">質問</text><text class="node-title" x="704.8333333333334" y="80">部分木について、どの操作や問い合わ</text><text class="node-title" x="704.8333333333334" y="103">せがありますか？</text><text class="node-explanation" x="704.8333333333334" y="130">木の根が固定かどうかと、途中で値が変わるかを選び</text><text class="node-explanation" x="704.8333333333334" y="148">ます。</text></g><g class="flow-node question" data-node="subtree"><rect x="436" y="414" width="320" height="127" rx="7"/><text class="node-kind" x="452" y="434">質問</text><text class="node-title" x="452" y="462">部分木の値を集計・更新しますか？</text><text class="node-explanation" x="452" y="489">DFS の入退出時刻で、部分木が連続する範囲にな</text><text class="node-explanation" x="452" y="507">るように並べます。</text></g><g class="flow-node result" data-node="subtree-result"><rect x="421.5" y="755" width="320" height="175" rx="7"/><text class="node-kind" x="437.5" y="775">候補</text><text class="node-title" x="437.5" y="803">DFS 順と区間データ構造</text><a href="/flowchartcp/techniques/subtree-euler-interval/"><title>部分木をDFS順の連続区間に変換するの記事へ</title><text x="437.5" y="842">部分木をDFS順の連続区間に変換する</text></a><a href="/flowchartcp/techniques/segment-tree/"><title>セグメント木の記事へ</title><text x="437.5" y="866">セグメント木</text></a><a href="/flowchartcp/techniques/fenwick-tree/"><title>Fenwick Treeの記事へ</title><text x="437.5" y="890">Fenwick Tree</text></a></g><g class="flow-node route" data-node="path"><rect x="785.5" y="755" width="320" height="157" rx="7"/><text class="node-kind" x="801.5" y="775">分野</text><text class="node-title" x="801.5" y="803">二頂点間の経路の集計・更新</text><text class="node-explanation" x="801.5" y="830">経路への集計や更新が必要かを確認し、少数の指定頂</text><text class="node-explanation" x="801.5" y="848">点についての問い合わせへ進みます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-path-aggregation" data-route="tree-path-aggregation"><text x="801.5" y="876">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1149.5" y="755" width="320" height="180" rx="7"/><text class="node-kind" x="1165.5" y="775">分野</text><text class="node-title" x="1165.5" y="803">問い合わせで対象となる頂点を確かめ</text><text class="node-title" x="1165.5" y="826">る</text><text class="node-explanation" x="1165.5" y="853">根を決めて対象を図に描き、祖先・部分木・経路のど</text><text class="node-explanation" x="1165.5" y="871">れを扱うかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-query-target-check" data-route="tree-query-target-check"><text x="1165.5" y="899">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="reroot-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">根が変わる部分木の範囲</text><a href="/flowchartcp/flowcharts/#diagram-tree-root-change" data-route="tree-root-change"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="overwrite-route"><rect x="800" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="816" y="434">分野</text><text class="node-title" x="816" y="462">部分木と祖先への上書きの時刻</text><a href="/flowchartcp/flowcharts/#diagram-tree-last-write" data-route="tree-last-write"><text x="816" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="leaf-labels-route"><rect x="1164" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="1180" y="434">分野</text><text class="node-title" x="1180" y="462">葉の番号から、部分木の区間を作る</text><a href="/flowchartcp/flowcharts/#diagram-rooted-tree-leaf-labels" data-route="rooted-tree-leaf-labels"><text x="1180" y="499">詳細の質問・図へ →</text></a></g></svg>