<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-thinking-next-choice flow-desc-thinking-next-choice" width="1476" height="931" viewBox="0 0 1476 931" data-flow-svg="thinking-next-choice"><title id="flow-title-thinking-next-choice">次の一手・あり得る状態の解法フローチャート</title><desc id="flow-desc-thinking-next-choice">先の操作に必要な情報、選択の正当性、可能な状態の集合を調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-thinking-next-choice" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge state" data-edge="reason-task:state:state-route"><title>次の一手に必要な情報を決める</title><path d="M642 182 V194 C642 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-thinking-next-choice)"/><g class="flow-edge-label" data-edge-label="reason-task:state:state-route" tabindex="0" role="group" aria-label="選択肢：次の一手に必要な情報を決める"><rect x="89" y="270" width="206" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">次の一手に必要な情報を決める</text></g></g><g class="flow-edge greedy" data-edge="reason-task:greedy:proof-route"><title>局所的に選んでよいことを示す</title><path d="M706 182 V194 C706 226 556 226 556 258 V270"/><path d="M556 308 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-thinking-next-choice)"/><g class="flow-edge-label" data-edge-label="reason-task:greedy:proof-route" tabindex="0" role="group" aria-label="選択肢：局所的に選んでよいことを示す"><rect x="453" y="270" width="206" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">局所的に選んでよいことを示す</text></g></g><g class="flow-edge hidden-item" data-edge="reason-task:hidden-item:hidden-item-route"><title>中身が不明な移動で、特別な一個があり得る場所を求める</title><path d="M770 182 V194 C770 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-thinking-next-choice)"/><g class="flow-edge-label" data-edge-label="reason-task:hidden-item:hidden-item-route" tabindex="0" role="group" aria-label="選択肢：中身が不明な移動で、特別な一個があり得る場所を求める"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">中身が不明な移動で、特別な一個があ</text><text text-anchor="middle" x="920" y="311">り得る場所を求める</text></g></g><g class="flow-edge unknown" data-edge="reason-task:unknown:check"><title>わからない</title><path d="M834 182 V194 C834 226 1284 226 1284 258 V270"/><path d="M1284 308 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-thinking-next-choice)"/><g class="flow-edge-label" data-edge-label="reason-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:observation"><title>はい</title><path d="M1204 546 V558 C1204 590 920 590 920 622 V634"/><path d="M920 672 V684 C920 716 920 716 920 748 V760" marker-end="url(#arrow-thinking-next-choice)"/><g class="flow-edge-label" data-edge-label="check:yes:observation" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="657">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 546 V558 C1284 590 1271 590 1271 622 V634"/><path d="M1271 672 V684 C1271 716 1230.667 716 1230.667 748 V760" marker-end="url(#arrow-thinking-next-choice)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 546 V558 C1364 590 1399.5 590 1399.5 622 V634"/><path d="M1399.5 672 V684 C1399.5 716 1337.333 716 1337.333 748 V760" marker-end="url(#arrow-thinking-next-choice)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="657">わからない</text></g></g><g class="flow-node question" data-node="reason-task"><rect x="578" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="594" y="52">質問</text><text class="node-title" x="594" y="80">操作や解の特徴として、どれを調べた</text><text class="node-title" x="594" y="103">いですか？</text><text class="node-explanation" x="594" y="130">入力例から見える構造と、まだ示せていない主張を選</text><text class="node-explanation" x="594" y="148">びます。</text></g><g class="flow-node route" data-node="state-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">状態と帰着を考える</text><a href="/flowchartcp/flowcharts/#diagram-thinking-state" data-route="thinking-state"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="proof-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">貪欲法と正当性</text><a href="/flowchartcp/flowcharts/#diagram-thinking-proof" data-route="thinking-proof"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="hidden-item-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">不明な一個の移動と可能位置</text><a href="/flowchartcp/flowcharts/#diagram-hidden-special-item-transfers" data-route="hidden-special-item-transfers"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1124" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="1140" y="434">質問</text><text class="node-title" x="1140" y="462">手で追える入力の、操作と答えを列挙</text><text class="node-title" x="1140" y="485">できますか？</text><text class="node-explanation" x="1140" y="512">抽象的な式を、最小の例に戻して確認します。</text></g><g class="flow-node result" data-node="observation"><rect x="760" y="760" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="780">候補</text><text class="node-title" x="776" y="808">小規模全探索から観察する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="776" y="847">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="760" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="780">分野</text><text class="node-title" x="1140" y="808">条件を確かめる</text><text class="node-explanation" x="1140" y="835">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="863">詳細の質問・図へ →</text></a></g></svg>