<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-ancestor-path-goals flow-desc-tree-ancestor-path-goals" width="1896" height="1325" viewBox="0 0 1896 1325" data-flow-svg="tree-ancestor-path-goals"><title id="flow-title-tree-ancestor-path-goals">祖先と経路の問い合わせの解法フローチャート</title><desc id="flow-desc-tree-ancestor-path-goals">祖先への移動、経路上の値、複数の経路を通る回数を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-ancestor-path-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge ancestor" data-edge="target:ancestor:ancestor"><title>何個か上の祖先・二頂点の共通祖先</title><path d="M949.048 141 V153 C949.048 185 192 185 192 217 V229"/><path d="M192 267 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="target:ancestor:ancestor" tabindex="0" role="group" aria-label="選択肢：何個か上の祖先・二頂点の共通祖先"><rect x="76" y="229" width="232" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">何個か上の祖先・二頂点の共通祖先</text></g></g><g class="flow-edge path-static" data-edge="target:path-static:static-kind"><title>値が変わらない一本の経路の集計・順位</title><path d="M994.762 141 V153 C994.762 185 556 185 556 217 V229"/><path d="M556 285 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="target:path-static:static-kind" tabindex="0" role="group" aria-label="選択肢：値が変わらない一本の経路の集計・順位"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">値が変わらない一本の経路の集計・順</text><text text-anchor="middle" x="556" y="270">位</text></g></g><g class="flow-edge path-change" data-edge="target:path-change:changed-kind"><title>値が変わる経路の集計・更新</title><path d="M1040.476 141 V153 C1040.476 185 920 185 920 217 V229"/><path d="M920 267 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="target:path-change:changed-kind" tabindex="0" role="group" aria-label="選択肢：値が変わる経路の集計・更新"><rect x="823.5" y="229" width="193" height="38" rx="5"/><text text-anchor="middle" x="920" y="252">値が変わる経路の集計・更新</text></g></g><g class="flow-edge batch-paths" data-edge="target:batch-paths:batch-path-route"><title>全ての指定経路を足した後の、辺・頂点ごとの通過回数</title><path d="M1086.19 141 V153 C1086.19 185 1284 185 1284 217 V229"/><path d="M1284 285 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="target:batch-paths:batch-path-route" tabindex="0" role="group" aria-label="選択肢：全ての指定経路を足した後の、辺・頂点ごとの通過回数"><rect x="1161.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="252">全ての指定経路を足した後の、辺・頂</text><text text-anchor="middle" x="1284" y="270">点ごとの通過回数</text></g></g><g class="flow-edge local-routing-labels" data-edge="target:local-routing-labels:local-routing-labels-route"><title>木へラベルを配り、現在地・目的地・隣接先のラベルだけで次の一歩を決める</title><path d="M1131.905 141 V153 C1131.905 185 1608.5 185 1608.5 217 V229"/><path d="M1608.5 303 V315 C1608.5 347 1648 347 1648 379 V391" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="target:local-routing-labels:local-routing-labels-route" tabindex="0" role="group" aria-label="選択肢：木へラベルを配り、現在地・目的地・隣接先のラベルだけで次の一歩を決める"><rect x="1486" y="229" width="245" height="74" rx="5"/><text text-anchor="middle" x="1608.5" y="252">木へラベルを配り、現在地・目的地・</text><text text-anchor="middle" x="1608.5" y="270">隣接先のラベルだけで次の一歩を決め</text><text text-anchor="middle" x="1608.5" y="288">る</text></g></g><g class="flow-edge unknown" data-edge="target:unknown:check"><title>わからない</title><path d="M1177.619 141 V153 C1177.619 185 1819.5 185 1819.5 217 V229"/><path d="M1819.5 267 V315 C1819.5 347 1858 347 1858 379 V391 V570 C1858 602 1473 602 1473 634 V646 V696 C1473 728 1434.5 728 1434.5 760 V772 V911 C1434.5 943 1434.5 943 1434.5 975 V987 V1037 C1434.5 1069 1364 1069 1364 1101 V1113" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="target:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1775" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1819.5" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="ancestor:yes:doubling"><title>はい</title><path d="M112 541 V570 C112 602 192 602 192 634 V646"/><path d="M192 684 V696 C192 728 192 728 192 760 V772" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="ancestor:yes:doubling" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="646" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="669">はい</text></g></g><g class="flow-edge no" data-edge="ancestor:no:subtree"><title>いいえ</title><path d="M192 541 V570 C192 602 920 602 920 634 V646"/><path d="M920 684 V696 C920 728 920 728 920 760 V772" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="ancestor:no:subtree" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="880" y="646" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="669">いいえ</text></g></g><g class="flow-edge unknown" data-edge="ancestor:unknown:check"><title>わからない</title><path d="M272 541 V570 C272 602 1378.5 602 1378.5 634 V646"/><path d="M1378.5 684 V696 C1378.5 728 1378.5 728 1378.5 760 V772 V911 C1378.5 943 1378.5 943 1378.5 975 V987 V1037 C1378.5 1069 1284 1069 1284 1101 V1113" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="ancestor:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1334" y="646" width="89" height="38" rx="5"/><text text-anchor="middle" x="1378.5" y="669">わからない</text></g></g><g class="flow-edge yes" data-edge="subtree:yes:subtree-result"><title>はい</title><path d="M840 899 V911 C840 943 556 943 556 975 V987"/><path d="M556 1025 V1037 C556 1069 556 1069 556 1101 V1113" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="subtree:yes:subtree-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="987" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1010">はい</text></g></g><g class="flow-edge no" data-edge="subtree:no:path"><title>いいえ</title><path d="M920 899 V911 C920 943 920 943 920 975 V987"/><path d="M920 1025 V1037 C920 1069 920 1069 920 1101 V1113" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="subtree:no:path" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="880" y="987" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1010">いいえ</text></g></g><g class="flow-edge unknown" data-edge="subtree:unknown:check"><title>わからない</title><path d="M1000 899 V911 C1000 943 1284 943 1284 975 V987"/><path d="M1284 1025 V1037 C1284 1069 1204 1069 1204 1101 V1113" marker-end="url(#arrow-tree-ancestor-path-goals)"/><g class="flow-edge-label" data-edge-label="subtree:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="987" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="1010">わからない</text></g></g><g class="flow-node question" data-node="target"><rect x="903.3333333333333" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="919.3333333333333" y="52">質問</text><text class="node-title" x="919.3333333333333" y="80">木のどの部分について答えますか？</text><text class="node-explanation" x="919.3333333333333" y="107">根、値が付く場所、対象の頂点の範囲を選びます。</text></g><g class="flow-node question" data-node="ancestor"><rect x="32" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="411">質問</text><text class="node-title" x="48" y="439">祖先への移動や LCA が必要です</text><text class="node-title" x="48" y="462">か？</text><text class="node-explanation" x="48" y="489">k 個上の祖先、二頂点の共通祖先、距離の計算を考</text><text class="node-explanation" x="48" y="507">えます。</text></g><g class="flow-node result" data-node="doubling"><rect x="32" y="772" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="792">候補</text><text class="node-title" x="48" y="820">ダブリングと LCA</text><a href="/flowchartcp/techniques/doubling/"><title>ダブリングの記事へ</title><text x="48" y="859">ダブリング</text></a></g><g class="flow-node question" data-node="subtree"><rect x="760" y="772" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="792">質問</text><text class="node-title" x="776" y="820">部分木の値を集計・更新しますか？</text><text class="node-explanation" x="776" y="847">DFS の入退出時刻で、部分木が連続する範囲にな</text><text class="node-explanation" x="776" y="865">るように並べます。</text></g><g class="flow-node result" data-node="subtree-result"><rect x="396" y="1113" width="320" height="175" rx="7"/><text class="node-kind" x="412" y="1133">候補</text><text class="node-title" x="412" y="1161">DFS 順と区間データ構造</text><a href="/flowchartcp/techniques/subtree-euler-interval/"><title>部分木をDFS順の連続区間に変換するの記事へ</title><text x="412" y="1200">部分木をDFS順の連続区間に変換する</text></a><a href="/flowchartcp/techniques/segment-tree/"><title>セグメント木の記事へ</title><text x="412" y="1224">セグメント木</text></a><a href="/flowchartcp/techniques/fenwick-tree/"><title>Fenwick Treeの記事へ</title><text x="412" y="1248">Fenwick Tree</text></a></g><g class="flow-node route" data-node="path"><rect x="760" y="1113" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="1133">分野</text><text class="node-title" x="776" y="1161">二頂点間の経路の集計・更新</text><text class="node-explanation" x="776" y="1188">経路への集計や更新が必要かを確認し、少数の指定頂</text><text class="node-explanation" x="776" y="1206">点についての問い合わせへ進みます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-path-aggregation" data-route="tree-path-aggregation"><text x="776" y="1234">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1124" y="1113" width="320" height="180" rx="7"/><text class="node-kind" x="1140" y="1133">分野</text><text class="node-title" x="1140" y="1161">問い合わせで対象となる頂点を確かめ</text><text class="node-title" x="1140" y="1184">る</text><text class="node-explanation" x="1140" y="1211">根を決めて対象を図に描き、祖先・部分木・経路のど</text><text class="node-explanation" x="1140" y="1229">れを扱うかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-query-target-check" data-route="tree-query-target-check"><text x="1140" y="1257">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="static-kind"><rect x="396" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">値が変わらない経路の集計と順位</text><text class="node-explanation" x="412" y="466">経路の和や XOR、値の順位など、固定された値か</text><text class="node-explanation" x="412" y="484">ら求める量を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-fixed-path-value-details" data-route="tree-fixed-path-value-details"><text x="412" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="changed-kind"><rect x="760" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">値を変える経路の集計と更新</text><text class="node-explanation" x="776" y="466">経路の値の集計、向きを持つ関数合成、値の上書きを</text><text class="node-explanation" x="776" y="484">分けます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-changing-path-value-details" data-route="tree-changing-path-value-details"><text x="776" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="batch-path-route"><rect x="1124" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">全経路を加算した後の通過回数</text><a href="/flowchartcp/flowcharts/#diagram-tree-batch-paths" data-route="tree-batch-paths"><text x="1140" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="local-routing-labels-route"><rect x="1488" y="391" width="320" height="167" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">木へラベルを配り、現在地・目的地・</text><text class="node-title" x="1504" y="462">隣接先のラベルだけで次の一歩を決め</text><text class="node-title" x="1504" y="485">る</text><a href="/flowchartcp/flowcharts/#diagram-tree-local-routing-label-conditions" data-route="tree-local-routing-label-conditions"><text x="1504" y="522">詳細の質問・図へ →</text></a></g></svg>