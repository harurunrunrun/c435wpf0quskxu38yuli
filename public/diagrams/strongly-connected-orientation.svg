<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strongly-connected-orientation flow-desc-strongly-connected-orientation" width="1168" height="1325" viewBox="0 0 1168 1325" data-flow-svg="strongly-connected-orientation"><title id="flow-title-strongly-connected-orientation">無向辺を片方向にする構築の解法フローチャート</title><desc id="flow-desc-strongly-connected-orientation">一本の辺を切っても分かれない構造を、往復できる向きへ変えます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strongly-connected-orientation" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="fixed:yes:connected"><title>はい</title><path d="M584.833 182 V194 C584.833 226 612 226 612 258 V270"/><path d="M612 308 V320 C612 352 612 352 612 384 V396" marker-end="url(#arrow-strongly-connected-orientation)"/><g class="flow-edge-label" data-edge-label="fixed:yes:connected" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="572" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="293">はい</text></g></g><g class="flow-edge no" data-edge="fixed:no:fallback"><title>いいえ</title><path d="M504.833 182 V194 C504.833 226 72 226 72 258 V270"/><path d="M72 308 V320 C72 352 38 352 38 384 V396 V558 C38 590 38 590 38 622 V634 V684 C38 716 38 716 38 748 V760 V940 C38 972 438.5 972 438.5 1004 V1016 V1066 C438.5 1098 385.167 1098 385.167 1130 V1142" marker-end="url(#arrow-strongly-connected-orientation)"/><g class="flow-edge-label" data-edge-label="fixed:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="32" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed:unknown:check"><title>わからない</title><path d="M664.833 182 V194 C664.833 226 1070.5 226 1070.5 258 V270"/><path d="M1070.5 308 V320 C1070.5 352 1070.5 352 1070.5 384 V396 V558 C1070.5 590 1070.5 590 1070.5 622 V634 V684 C1070.5 716 1029.333 716 1029.333 748 V760" marker-end="url(#arrow-strongly-connected-orientation)"/><g class="flow-edge-label" data-edge-label="fixed:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1026" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1070.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="connected:yes:orientation-result"><title>はい</title><path d="M532 546 V558 C532 590 248 590 248 622 V634"/><path d="M248 672 V684 C248 716 248 716 248 748 V760" marker-end="url(#arrow-strongly-connected-orientation)"/><g class="flow-edge-label" data-edge-label="connected:yes:orientation-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="657">はい</text></g></g><g class="flow-edge no" data-edge="connected:no:impossible-result"><title>いいえ</title><path d="M612 546 V558 C612 590 612 590 612 622 V634"/><path d="M612 672 V684 C612 716 612 716 612 748 V760" marker-end="url(#arrow-strongly-connected-orientation)"/><g class="flow-edge-label" data-edge-label="connected:no:impossible-result" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="connected:unknown:check"><title>わからない</title><path d="M692 546 V558 C692 590 976 590 976 622 V634"/><path d="M976 672 V684 C976 716 922.667 716 922.667 748 V760" marker-end="url(#arrow-strongly-connected-orientation)"/><g class="flow-edge-label" data-edge-label="connected:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M896 892 V940 C896 972 528.5 972 528.5 1004 V1016"/><path d="M528.5 1054 V1066 C528.5 1098 491.833 1098 491.833 1130 V1142" marker-end="url(#arrow-strongly-connected-orientation)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="488.5" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="528.5" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 892 V940 C976 972 963 972 963 1004 V1016"/><path d="M963 1054 V1066 C963 1098 922.667 1098 922.667 1130 V1142" marker-end="url(#arrow-strongly-connected-orientation)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 892 V940 C1056 972 1091.5 972 1091.5 1004 V1016"/><path d="M1091.5 1054 V1066 C1091.5 1098 1029.333 1098 1029.333 1130 V1142" marker-end="url(#arrow-strongly-connected-orientation)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="fixed"><rect x="424.83333333333337" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="440.83333333333337" y="52">質問</text><text class="node-title" x="440.83333333333337" y="80">元の無向辺を一本ずつ片方向にし、辺</text><text class="node-title" x="440.83333333333337" y="103">の追加・削除はしませんか？</text><text class="node-explanation" x="440.83333333333337" y="130">既存の辺の向きが固定されている場合は、同じ構築を</text><text class="node-explanation" x="440.83333333333337" y="148">そのまま使えません。</text></g><g class="flow-node question" data-node="connected"><rect x="452" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="468" y="416">質問</text><text class="node-title" x="468" y="444">全頂点がつながり、どの一本の辺を除</text><text class="node-title" x="468" y="467">いても全頂点がつながりますか？</text><text class="node-explanation" x="468" y="494">元から不連結、または一本で切れる接続があると、全</text><text class="node-explanation" x="468" y="512">頂点間の往復は作れません。</text></g><g class="flow-node result" data-node="orientation-result"><rect x="88" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="780">候補</text><text class="node-title" x="104" y="808">探索で下る辺を下向きにし、先祖へ戻</text><text class="node-title" x="104" y="831">れる辺を上向きにする</text><a href="/flowchartcp/techniques/bridgeless-strong-orientation/"><title>全頂点間を行き来できる一方通行化は、橋を確かめて木の辺を下へ戻り辺を上へ向けるの記事へ</title><text x="104" y="870">全頂点間を行き来できる一方通行化は、橋を確かめ</text><text x="104" y="888">て木の辺を下へ戻り辺を上へ向ける</text></a></g><g class="flow-node result" data-node="impossible-result"><rect x="452" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="468" y="780">候補</text><text class="node-title" x="468" y="808">不連結または一本で切れる接続がある</text><text class="node-title" x="468" y="831">ため、全体の往復は作れない</text><a href="/flowchartcp/techniques/bridgeless-strong-orientation/"><title>全頂点間を行き来できる一方通行化は、橋を確かめて木の辺を下へ戻り辺を上へ向けるの記事へ</title><text x="468" y="870">全頂点間を行き来できる一方通行化は、橋を確かめ</text><text x="468" y="888">て木の辺を下へ戻り辺を上へ向ける</text></a></g><g class="flow-node question" data-node="check"><rect x="816" y="760" width="320" height="132" rx="7"/><text class="node-kind" x="832" y="780">質問</text><text class="node-title" x="832" y="808">必要な条件を、問題文と小さい例から</text><text class="node-title" x="832" y="831">確認できますか？</text><text class="node-explanation" x="832" y="858">辺の向き、再訪、求める量と制約を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="278.5" y="1142" width="320" height="151" rx="7"/><text class="node-kind" x="294.5" y="1162">候補</text><text class="node-title" x="294.5" y="1190">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="294.5" y="1229">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="294.5" y="1253">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="1162">分野</text><text class="node-title" x="832" y="1190">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1227">詳細の質問・図へ →</text></a></g></svg>