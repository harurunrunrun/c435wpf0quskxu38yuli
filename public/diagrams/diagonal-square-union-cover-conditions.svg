(#arrow-diagonal-square-union-cover-conditions)"/><g class="flow-edge-label" data-edge-label="union-at-most-k:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="716" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="739">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 1033 V1045 C239.5 1077 192 1077 192 1109 V1121"/><path d="M192 1159 V1171 C192 1203 192 1203 192 1235 V1247" marker-end="url(#arrow-diagonal-square-union-cover-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1121" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1144">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 1033 V1045 C319.5 1077 319 1077 319 1109 V1121"/><path d="M319 1159 V1171 C319 1203 441.714 1203 441.714 1235 V1247" marker-end="url(#arrow-diagonal-square-union-cover-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1121" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1144">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 1033 V1045 C399.5 1077 447.5 1077 447.5 1109 V1121"/><path d="M447.5 1159 V1171 C447.5 1203 487.429 1203 487.429 1235 V1247" marker-end="url(#arrow-diagonal-square-union-cover-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1121" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1144">わからない</text></g></g><g class="flow-node question" data-node="diagonal-cell-squares"><rect x="384.5" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">マス目に沿った正方形を選び、向かい</text><text class="node-title" x="400.5" y="103">合う二つの角が同じ主対角線上にあり</text><text class="node-title" x="400.5" y="126">ますか？</text><text class="node-explanation" x="400.5" y="153">指定セルを全て覆います。二つの角を主対角線上に持</text><text class="node-explanation" x="400.5" y="171">つので、各範囲は同じ区間[a,b]を行と列へ使う</text><text class="node-explanation" x="400.5" y="189">[a,b]²です。</text></g><g class="flow-node question" data-node="union-at-most-k"><rect x="272.5" y="437" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="457">質問</text><text class="node-title" x="288.5" y="485">高々K個で全指定セルを覆い、重なっ</text><text class="node-title" x="288.5" y="508">たマスは一度だけ数えて面積を最小に</text><text class="node-title" x="288.5" y="531">しますか？</text><text class="node-explanation" x="288.5" y="558">指定セルの重複は許されます。K枚を必ず異なる範囲</text><text class="node-explanation" x="288.5" y="576">で使う制約ではなく、写真の単純な面積和も目的とし</text><text class="node-explanation" x="288.5" y="594">ません。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="842" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="862">質問</text><text class="node-title" x="175.5" y="890">指定セルは1〜10万個、盤面の一辺</text><text class="node-title" x="175.5" y="913">は1〜100万で、Kは1〜指定セル</text><text class="node-title" x="175.5" y="936">数ですか？</text><text class="node-explanation" x="175.5" y="963">座標は盤面内の0始まり整数です。面積は</text><text class="node-explanation" x="175.5" y="981">64bit、直線の交点比較は128bitで計算し</text><text class="node-explanation" x="175.5" y="999">ます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1247" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1267">候補</text><text class="node-title" x="48" y="1295">重なりを引く区間分割DPから、枚数</text><text class="node-title" x="48" y="1318">の状態を外す</text><a href="/flowchartcp/techniques/diagonal-square-union-cover-monge-penalty-cht/"><title>対角線に沿う正方形の被覆を、重なり補正と枚数の罰金で最小にするの記事へ</title><text x="48" y="1357">対角線に沿う正方形の被覆を、重なり補正と枚数の</text><text x="48" y="1375">罰金で最小にする</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1247" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1267">分野</text><text class="node-title" x="412" y="1295">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1332">詳細の質問・図へ →</text></a></g></svg>