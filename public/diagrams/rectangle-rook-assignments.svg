<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-rectangle-rook-assignments flow-desc-rectangle-rook-assignments" width="860" height="1385" viewBox="0 0 860 1385" data-flow-svg="rectangle-rook-assignments"><title id="flow-title-rectangle-rook-assignments">長方形候補からの配置の解法フローチャート</title><desc id="flow-desc-rectangle-rook-assignments">一駒の候補が行区間と列区間の直積になることを使います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-rectangle-rook-assignments" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="product:yes:capacity"><title>はい</title><path d="M539.722 200 V212 C539.722 244 420.667 244 420.667 276 V288"/><path d="M420.667 326 V338 C420.667 370 420.667 370 420.667 402 V414" marker-end="url(#arrow-rectangle-rook-assignments)"/><g class="flow-edge-label" data-edge-label="product:yes:capacity" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="311">はい</text></g></g><g class="flow-edge no" data-edge="product:no:fallback"><title>いいえ</title><path d="M619.722 200 V212 C619.722 244 655 244 655 276 V288"/><path d="M655 326 V338 C655 370 762.5 370 762.5 402 V414 V594 C762.5 626 762.5 626 762.5 658 V670 V720 C762.5 752 458 752 458 784 V796 V1000 C458 1032 360 1032 360 1064 V1076 V1126 C360 1158 304 1158 304 1190 V1202" marker-end="url(#arrow-rectangle-rook-assignments)"/><g class="flow-edge-label" data-edge-label="product:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="product:unknown:check"><title>わからない</title><path d="M699.722 200 V212 C699.722 244 783.5 244 783.5 276 V288"/><path d="M783.5 326 V338 C783.5 370 818.5 370 818.5 402 V414 V594 C818.5 626 818.5 626 818.5 658 V670 V720 C818.5 752 721.333 752 721.333 784 V796" marker-end="url(#arrow-rectangle-rook-assignments)"/><g class="flow-edge-label" data-edge-label="product:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="capacity:yes:rook-result"><title>はい</title><path d="M340.667 582 V594 C340.667 626 192 626 192 658 V670"/><path d="M192 708 V720 C192 752 192 752 192 784 V796" marker-end="url(#arrow-rectangle-rook-assignments)"/><g class="flow-edge-label" data-edge-label="capacity:yes:rook-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="693">はい</text></g></g><g class="flow-edge no" data-edge="capacity:no:fallback"><title>いいえ</title><path d="M420.667 582 V594 C420.667 626 402 626 402 658 V670"/><path d="M402 708 V720 C402 752 402 752 402 784 V796 V1000 C402 1032 304 1032 304 1064 V1076 V1126 C304 1158 224 1158 224 1190 V1202" marker-end="url(#arrow-rectangle-rook-assignments)"/><g class="flow-edge-label" data-edge-label="capacity:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="capacity:unknown:check"><title>わからない</title><path d="M500.667 582 V594 C500.667 626 668 626 668 658 V670"/><path d="M668 708 V720 C668 752 614.667 752 614.667 784 V796" marker-end="url(#arrow-rectangle-rook-assignments)"/><g class="flow-edge-label" data-edge-label="capacity:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 946 V1000 C588 1032 450 1032 450 1064 V1076"/><path d="M450 1114 V1126 C450 1158 384 1158 384 1190 V1202" marker-end="url(#arrow-rectangle-rook-assignments)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1076" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1099">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 946 V1000 C668 1032 655 1032 655 1064 V1076"/><path d="M655 1114 V1126 C655 1158 614.667 1158 614.667 1190 V1202" marker-end="url(#arrow-rectangle-rook-assignments)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1076" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1099">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 946 V1000 C748 1032 783.5 1032 783.5 1064 V1076"/><path d="M783.5 1114 V1126 C783.5 1158 721.333 1158 721.333 1190 V1202" marker-end="url(#arrow-rectangle-rook-assignments)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1076" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1099">わからない</text></g></g><g class="flow-node question" data-node="product"><rect x="459.7222222222223" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">一駒の置ける場所は、許された行と許</text><text class="node-title" x="475.7222222222223" y="103">された列の全ての組合せですか？</text><text class="node-explanation" x="475.7222222222223" y="130">途中に穴がある候補集合では、許された行と列を別々</text><text class="node-explanation" x="475.7222222222223" y="148">につなぐと、禁止された組も作ってしまいます。直積</text><text class="node-explanation" x="475.7222222222223" y="166">の条件が必要です。</text></g><g class="flow-node question" data-node="capacity"><rect x="260.6666666666667" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="434">質問</text><text class="node-title" x="276.6666666666667" y="462">各駒・各行・各列は高々一回使い、置</text><text class="node-title" x="276.6666666666667" y="485">く駒数を最大にしますか？</text><text class="node-explanation" x="276.6666666666667" y="512">一駒の入口と出口を容量一でつなぎます。行から駒、</text><text class="node-explanation" x="276.6666666666667" y="530">駒から列へ進む一単位を、一つの合法な配置へ対応さ</text><text class="node-explanation" x="276.6666666666667" y="548">せます。</text></g><g class="flow-node result" data-node="rook-result"><rect x="32" y="796" width="320" height="192" rx="7"/><text class="node-kind" x="48" y="816">候補</text><text class="node-title" x="48" y="844">行・駒の入口・駒の出口・列をつな</text><text class="node-title" x="48" y="867">ぎ、駒数を最大にする</text><a href="/flowchartcp/techniques/rectangle-rook-flow/"><title>行と列を独立に選べる駒の配置を、駒の中央の容量一本で制限するの記事へ</title><text x="48" y="906">行と列を独立に選べる駒の配置を、駒の中央の容量</text><text x="48" y="924">一本で制限する</text></a><a href="/flowchartcp/techniques/max-flow/"><title>最大流・最小カットの記事へ</title><text x="48" y="948">最大流・最小カット</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="816">質問</text><text class="node-title" x="524" y="844">合法な選択と、選ぶ回数・費用の条件</text><text class="node-title" x="524" y="867">を一つずつ確かめられますか？</text><text class="node-explanation" x="524" y="894">一対象を何回使えるか、必ず選ぶ対象があるか、経路</text><text class="node-explanation" x="524" y="912">はどこまで共用できるかを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1202" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1222">候補</text><text class="node-title" x="160" y="1250">選択の条件と目的値を整理する</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="160" y="1289">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1313">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1202" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1222">分野</text><text class="node-title" x="524" y="1250">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1287">詳細の質問・図へ →</text></a></g></svg>