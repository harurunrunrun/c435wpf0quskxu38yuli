08 1371.5 608 1371.5 640 V652"/><path d="M1371.5 690 V702 C1371.5 734 1410 734 1410 766 V778 V982 C1410 1014 1410 1014 1410 1046 V1058 V1108 C1410 1140 1309.333 1140 1309.333 1172 V1184" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="binomial-units:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1327" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1371.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="binomial-product:yes:binomial-product-result"><title>はい</title><path d="M1064 928 V982 C1064 1014 1007 1014 1007 1046 V1058"/><path d="M1007 1096 V1108 C1007 1140 836 1140 836 1172 V1184" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="binomial-product:yes:binomial-product-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="967" y="1058" width="80" height="38" rx="5"/><text text-anchor="middle" x="1007" y="1081">はい</text></g></g><g class="flow-edge no" data-edge="binomial-product:no:fallback"><title>いいえ</title><path d="M1144 928 V982 C1144 1014 1131 1014 1131 1046 V1058"/><path d="M1131 1096 V1108 C1131 1140 1046 1140 1046 1172 V1184 V1370 C1046 1402 1029 1402 1029 1434 V1446 V1496 C1029 1528 928.4 1528 928.4 1560 V1572" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="binomial-product:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1091" y="1058" width="80" height="38" rx="5"/><text text-anchor="middle" x="1131" y="1081">いいえ</text></g></g><g class="flow-edge unknown" data-edge="binomial-product:unknown:check"><title>わからない</title><path d="M1224 928 V982 C1224 1014 1259.5 1014 1259.5 1046 V1058"/><path d="M1259.5 1096 V1108 C1259.5 1140 1256 1140 1256 1172 V1184" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="binomial-product:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1215" y="1058" width="89" height="38" rx="5"/><text text-anchor="middle" x="1259.5" y="1081">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1176 1334 V1370 C1176 1402 1119 1402 1119 1434 V1446"/><path d="M1119 1484 V1496 C1119 1528 981.733 1528 981.733 1560 V1572" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1079" y="1446" width="80" height="38" rx="5"/><text text-anchor="middle" x="1119" y="1469">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1256 1334 V1370 C1256 1402 1243 1402 1243 1434 V1446"/><path d="M1243 1484 V1496 C1243 1528 1253.917 1528 1253.917 1560 V1572" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1203" y="1446" width="80" height="38" rx="5"/><text text-anchor="middle" x="1243" y="1469">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1336 1334 V1370 C1336 1402 1371.5 1402 1371.5 1434 V1446"/><path d="M1371.5 1484 V1496 C1371.5 1528 1360.583 1528 1360.583 1560 V1572" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1327" y="1446" width="89" height="38" rx="5"/><text text-anchor="middle" x="1371.5" y="1469">わからない</text></g></g><g class="flow-node question" data-node="index-condition"><rect x="804.75" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="820.75" y="52">質問</text><text class="node-title" x="820.75" y="80">積の項を、どの添字条件でまとめます</text><text class="node-title" x="820.75" y="103">か？</text><text class="node-explanation" x="820.75" y="130">添字の和、XOR、交わらない集合では条件が異なり</text><text class="node-explanation" x="820.75" y="148">ます。</text></g><g class="flow-node question" data-node="xor-unit"><rect x="214.83333333333331" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="230.83333333333331" y="434">質問</text><text class="node-title" x="230.83333333333331" y="462">列の長さは 2 の冪で、その長さが</text><text class="node-title" x="230.83333333333331" y="485">係数の法で逆元を持ちますか？</text><text class="node-explanation" x="230.83333333333331" y="512">奇数の法では 2 の冪は可逆です。法 2 では同</text><text class="node-explanation" x="230.83333333333331" y="530">じ逆変換を使えません。</text></g><g class="flow-node result" data-node="xor-product-result"><rect x="32" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="798">候補</text><text class="node-title" x="48" y="826">和と差で係数を変換し、XOR ごと</text><text class="node-title" x="48" y="849">の積をまとめる</text><a href="/flowchartcp/techniques/xor-convolution-transform/"><title>添字の XOR ごとの積和を、和と差の変換で求めるの記事へ</title><text x="48" y="888">添字の XOR ごとの積和を、和と差の変換で求</text><text x="48" y="906">める</text></a></g><g class="flow-node question" data-node="disjoint-ring"><rect x="680.1666666666666" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="696.1666666666666" y="434">質問</text><text class="node-title" x="696.1666666666666" y="462">重なる集合の項を引く減算ができ、集</text><text class="node-title" x="696.1666666666666" y="485">合サイズごとの表を保存できますか？</text><text class="node-explanation" x="696.1666666666666" y="512">集合の大きさも添字にし、最後に |A|+|B|=</text><text class="node-explanation" x="696.1666666666666" y="530">|S| の項だけ取ると、重なりを除けます。</text></g><g class="flow-node result" data-node="disjoint-result"><rect x="508" y="778" width="320" height="192" rx="7"/><text class="node-kind" x="524" y="798">候補</text><text class="node-title" x="524" y="826">集合の大きさごとに集計し、重ならな</text><text class="node-title" x="524" y="849">い分割の積和を残す</text><a href="/flowchartcp/techniques/subset-convolution-ranked/"><title>集合を重ならない二つに分ける和を、要素数別に畳み込むの記事へ</title><text x="524" y="888">集合を重ならない二つに分ける和を、要素数別に畳</text><text x="524" y="906">み込む</text></a><a href="/flowchartcp/techniques/subset-transform/"><title>部分集合ゼータ変換の記事へ</title><text x="524" y="930">部分集合ゼータ変換</text></a></g><g class="flow-node question" data-node="binomial-units"><rect x="1084.5" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1100.5" y="434">質問</text><text class="node-title" x="1100.5" y="462">必要な階乗と逆階乗が、指定された法</text><text class="node-title" x="1100.5" y="485">で可逆ですか？</text><text class="node-explanation" x="1100.5" y="512">二項係数を k!/(i!(k−i)!) に分け、</text><text class="node-explanation" x="1100.5" y="530">各係数の階乗を先に外します。</text></g><g class="flow-node question" data-node="binomial-product"><rect x="984" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="1000" y="798">質問</text><text class="node-title" x="1000" y="826">階乗を外した二列の積を、必要な長さ</text><text class="node-title" x="1000" y="849">で高速に計算できますか？</text><text class="node-explanation" x="1000" y="876">法が変換長に対応するか、他の正確な乗算法があるか</text><text class="node-explanation" x="1000" y="894">を確認します。</text></g><g class="flow-node result" data-node="binomial-product-result"><rect x="676" y="1184" width="320" height="174" rx="7"/><text class="node-kind" x="692" y="1204">候補</text><text class="node-title" x="692" y="1232">階乗で係数を正規化して積を取り、最</text><text class="node-title" x="692" y="1255">後に階乗を戻す</text><a href="/flowchartcp/techniques/binomial-convolution-factorials/"><title>二項係数が付く遷移を、階乗で割って畳み込むの記事へ</title><text x="692" y="1294">二項係数が付く遷移を、階乗で割って畳み込む</text></a><a href="/flowchartcp/techniques/ntt/"><title>NTT・畳み込みの記事へ</title><text x="692" y="1318">NTT・畳み込み</text></a></g><g class="flow-node question" data-node="check"><rect x="1096" y="1184" width="320" height="150" rx="7"/><text class="node-kind" x="1112" y="1204">質問</text><text class="node-title" x="1112" y="1232">必要な条件を、問題文と小さい例から</text><text class="node-title" x="1112" y="1255">確認できますか？</text><text class="node-explanation" x="1112" y="1282">どの性質が入力で保証され、どの性質を式や操作から</text><text class="node-explanation" x="1112" y="1300">示す必要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="768.4" y="1572" width="320" height="151" rx="7"/><text class="node-kind" x="784.4" y="1592">候補</text><text class="node-title" x="784.4" y="1620">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="784.4" y="1659">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="784.4" y="1683">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1147.25" y="1572" width="320" height="121" rx="7"/><text class="node-kind" x="1163.25" y="1592">分野</text><text class="node-title" x="1163.25" y="1620">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1163.25" y="1657">詳細の質問・図へ →</text></a></g></svg>