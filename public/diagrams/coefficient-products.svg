<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-coefficient-products flow-desc-coefficient-products" width="1504" height="1755" viewBox="0 0 1504 1755" data-flow-svg="coefficient-products"><title id="flow-title-coefficient-products">積の添字条件と係数の重みの解法フローチャート</title><desc id="flow-desc-coefficient-products">添字の条件により、まとめ方と逆演算の条件が異なります。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-coefficient-products" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge xor" data-edge="index-condition:xor:xor-unit"><title>i XOR j が同じになる積を足す</title><path d="M868.75 182 V194 C868.75 226 374.833 226 374.833 258 V270"/><path d="M374.833 326 V338 C374.833 370 374.833 370 374.833 402 V414" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="index-condition:xor:xor-unit" tabindex="0" role="group" aria-label="選択肢：i XOR j が同じになる積を足す"><rect x="252.33333333333331" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="374.8333333333333" y="293">i XOR j が同じになる積を足</text><text text-anchor="middle" x="374.8333333333333" y="311">す</text></g></g><g class="flow-edge disjoint" data-edge="index-condition:disjoint:disjoint-ring"><title>交わらない二集合に分け、和集合ごとの積を足す</title><path d="M932.75 182 V194 C932.75 226 840.167 226 840.167 258 V270"/><path d="M840.167 326 V338 C840.167 370 840.167 370 840.167 402 V414" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="index-condition:disjoint:disjoint-ring" tabindex="0" role="group" aria-label="選択肢：交わらない二集合に分け、和集合ごとの積を足す"><rect x="717.6666666666666" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="840.1666666666666" y="293">交わらない二集合に分け、和集合ごと</text><text text-anchor="middle" x="840.1666666666666" y="311">の積を足す</text></g></g><g class="flow-edge binomial" data-edge="index-condition:binomial:binomial-units"><title>C(k,i) を掛けた a[i]b[k−i] の和</title><path d="M996.75 182 V194 C996.75 226 1216.5 226 1216.5 258 V270"/><path d="M1216.5 326 V338 C1216.5 370 1244.5 370 1244.5 402 V414" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="index-condition:binomial:binomial-units" tabindex="0" role="group" aria-label="選択肢：C(k,i) を掛けた a[i]b[k−i] の和"><rect x="1094" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1216.5" y="293">C(k,i) を掛けた a[i]b</text><text text-anchor="middle" x="1216.5" y="311">[k−i] の和</text></g></g><g class="flow-edge unknown" data-edge="index-condition:unknown:check"><title>わからない</title><path d="M1060.75 182 V194 C1060.75 226 1427.5 226 1427.5 258 V270"/><path d="M1427.5 308 V338 C1427.5 370 1466 370 1466 402 V414 V576 C1466 608 1466 608 1466 640 V652 V702 C1466 734 1466 734 1466 766 V778 V982 C1466 1014 1466 1014 1466 1046 V1058 V1108 C1466 1140 1362.667 1140 1362.667 1172 V1184" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="index-condition:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1383" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1427.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="xor-unit:yes:xor-product-result"><title>はい</title><path d="M294.833 564 V576 C294.833 608 192 608 192 640 V652"/><path d="M192 690 V702 C192 734 192 734 192 766 V778" marker-end="url(#arrow-coefficient-products)"/><g class="flow-edge-label" data-edge-label="xor-unit:yes:xor-product-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="675">はい</text></g></g><g class="flow-edge no" data-edge="xor-unit:no:fallback"><title>いいえ</title><path d="M374.833 564 V576 C374.833 608 402 608 402 640 V652"/><path d="M402 690 V702 C402 734 402 734 402 766 V778 V982 C402 1014 570 1014 570 1046 