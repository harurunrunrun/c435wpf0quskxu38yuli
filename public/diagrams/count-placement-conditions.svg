<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-count-placement-conditions flow-desc-count-placement-conditions" width="1896" height="1356" viewBox="0 0 1896 1356" data-flow-svg="count-placement-conditions"><title id="flow-title-count-placement-conditions">物の配分・並びの条件の解法フローチャート</title><desc id="flow-desc-count-placement-conditions">箱への配分、禁止条件、括弧の接頭辞、隣の色との一致を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-count-placement-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge identical" data-edge="count-kind:identical:distribution-kind"><title>同じ物を、いくつかの箱へ配る</title><path d="M949.048 182 V194 C949.048 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="count-kind:identical:distribution-kind" tabindex="0" role="group" aria-label="選択肢：同じ物を、いくつかの箱へ配る"><rect x="89" y="270" width="206" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">同じ物を、いくつかの箱へ配る</text></g></g><g class="flow-edge forbidden" data-edge="count-kind:forbidden:forbidden-kind"><title>いくつかの禁止条件を一つも満たさない個数</title><path d="M994.762 182 V194 C994.762 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="count-kind:forbidden:forbidden-kind" tabindex="0" role="group" aria-label="選択肢：いくつかの禁止条件を一つも満たさない個数"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">いくつかの禁止条件を一つも満たさな</text><text text-anchor="middle" x="556" y="311">い個数</text></g></g><g class="flow-edge bracket-prefix" data-edge="count-kind:bracket-prefix:bracket-route"><title>与えた括弧の接頭辞を、正しい括弧列へ完成する個数</title><path d="M1040.476 182 V194 C1040.476 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="count-kind:bracket-prefix:bracket-route" tabindex="0" role="group" aria-label="選択肢：与えた括弧の接頭辞を、正しい括弧列へ完成する個数"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">与えた括弧の接頭辞を、正しい括弧列</text><text text-anchor="middle" x="920" y="311">へ完成する個数</text></g></g><g class="flow-edge equal-neighbors" data-edge="count-kind:equal-neighbors:equal-neighbor-route"><title>一列の色で、隣の色が等しくなる境界の個数を制限する</title><path d="M1086.19 182 V194 C1086.19 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="count-kind:equal-neighbors:equal-neighbor-route" tabindex="0" role="group" aria-label="選択肢：一列の色で、隣の色が等しくなる境界の個数を制限する"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">一列の色で、隣の色が等しくなる境界</text><text text-anchor="middle" x="1284" y="311">の個数を制限する</text></g></g><g class="flow-edge inversions" data-edge="count-kind:inversions:inversions-route"><title>1からNを一度ずつ並べ、左の方が大きい添字対をちょうどK個にする</title><path d="M1131.905 182 V194 C1131.905 226 1608.5 226 1608.5 258 V270"/><path d="M1608.5 326 V338 C1608.5 370 1648 370 1648 402 V414" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="count-kind:inversions:inversions-route" tabindex="0" role="group" aria-label="選択肢：1からNを一度ずつ並べ、左の方が大きい添字対をちょうどK個にする"><rect x="1486" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1608.5" y="293">1からNを一度ずつ並べ、左の方が大</text><text text-anchor="middle" x="1608.5" y="311">きい添字対をちょうどK個にする</text></g></g><g class="flow-edge unknown" data-edge="count-kind:unknown:check"><title>わからない</title><path d="M1177.619 182 V194 C1177.619 226 1819.5 226 1819.5 258 V270"/><path d="M1819.5 308 V338 C1819.5 370 1858 370 1858 402 V414 V583 C1858 615 1259.778 615 1259.778 647 V659 V727 C1259.778 759 1220.278 759 1220.278 791 V803 V965 C1220.278 997 1173.333 997 1173.333 1029 V1041 V1091 C1173.333 1123 1102.833 1123 1102.833 1155 V1167" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="count-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1775" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1819.5" y="293">わからない</text></g></g><g class="flow-edge sum" data-edge="distribution-kind:sum:boxes-check"><title>総数と箱ごとの下限だけを指定する</title><path d="M112 546 V583 C112 615 590.278 615 590.278 647 V659"/><path d="M590.278 697 V727 C590.278 759 590.278 759 590.278 791 V803" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="distribution-kind:sum:boxes-check" tabindex="0" role="group" aria-label="選択肢：総数と箱ごとの下限だけを指定する"><rect x="474.2777777777778" y="659" width="232" height="38" rx="5"/><text text-anchor="middle" x="590.2777777777778" y="682">総数と箱ごとの下限だけを指定する</text></g></g><g class="flow-edge moves" data-edge="distribution-kind:moves:redistribution-route"><title>各箱一個から、一個を他の箱へ移す回数を制限する</title><path d="M192 546 V583 C192 615 954.278 615 954.278 647 V659"/><path d="M954.278 715 V727 C954.278 759 954.278 759 954.278 791 V803" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="distribution-kind:moves:redistribution-route" tabindex="0" role="group" aria-label="選択肢：各箱一個から、一個を他の箱へ移す回数を制限する"><rect x="831.7777777777778" y="659" width="245" height="56" rx="5"/><text text-anchor="middle" x="954.2777777777778" y="682">各箱一個から、一個を他の箱へ移す回</text><text text-anchor="middle" x="954.2777777777778" y="700">数を制限する</text></g></g><g class="flow-edge unknown" data-edge="distribution-kind:unknown:check"><title>わからない</title><path d="M272 546 V583 C272 615 1165.278 615 1165.278 647 V659"/><path d="M1165.278 697 V727 C1165.278 759 1164.278 759 1164.278 791 V803 V965 C1164.278 997 1117.333 997 1117.333 1029 V1041 V1091 C1117.333 1123 1022.833 1123 1022.833 1155 V1167" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="distribution-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1120.7777777777778" y="659" width="89" height="38" rx="5"/><text text-anchor="middle" x="1165.2777777777778" y="682">わからない</text></g></g><g class="flow-edge yes" data-edge="boxes-check:yes:boxes-result"><title>はい</title><path d="M510.278 953 V965 C510.278 997 192 997 192 1029 V1041"/><path d="M192 1079 V1091 C192 1123 192 1123 192 1155 V1167" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="boxes-check:yes:boxes-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1041" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1064">はい</text></g></g><g class="flow-edge no" data-edge="boxes-check:no:fallback"><title>いいえ</title><path d="M590.278 953 V965 C590.278 997 556 997 556 1029 V1041"/><path d="M556 1079 V1091 C556 1123 556 1123 556 1155 V1167" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="boxes-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1041" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1064">いいえ</text></g></g><g class="flow-edge unknown" data-edge="boxes-check:unknown:check"><title>わからない</title><path d="M670.278 953 V965 C670.278 997 1022.833 997 1022.833 1029 V1041"/><path d="M1022.833 1079 V1091 C1022.833 1123 942.833 1123 942.833 1155 V1167" marker-end="url(#arrow-count-placement-conditions)"/><g class="flow-edge-label" data-edge-label="boxes-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="978.3333333333334" y="1041" width="89" height="38" rx="5"/><text text-anchor="middle" x="1022.8333333333334" y="1064">わからない</text></g></g><g class="flow-node question" data-node="count-kind"><rect x="903.3333333333333" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="919.3333333333333" y="52">質問</text><text class="node-title" x="919.3333333333333" y="80">数える対象には、どの特徴があります</text><text class="node-title" x="919.3333333333333" y="103">か？</text><text class="node-explanation" x="919.3333333333333" y="130">禁止条件、同じ物の配置、二つの選び方への寄与を分</text><text class="node-explanation" x="919.3333333333333" y="148">けます。</text></g><g class="flow-node question" data-node="distribution-kind"><rect x="32" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="48" y="434">質問</text><text class="node-title" x="48" y="462">箱への配分には、どの制約があります</text><text class="node-title" x="48" y="485">か？</text><text class="node-explanation" x="48" y="512">同じ物を区別せず、箱は区別します。</text></g><g class="flow-node route" data-node="forbidden-kind"><rect x="396" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">禁止・一致条件のある数え上げ</text><text class="node-explanation" x="412" y="489">元の位置、同じ位置、行や列、一般の禁止条件を区別</text><text class="node-explanation" x="412" y="507">します。</text><a href="/flowchartcp/flowcharts/#diagram-count-forbidden-conditions" data-route="count-forbidden-conditions"><text x="412" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="bracket-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">括弧の接頭辞を完成する個数</text><a href="/flowchartcp/flowcharts/#diagram-bracket-prefix-completion" data-route="bracket-prefix-completion"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="equal-neighbor-route"><rect x="1124" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">一列の色の同色境界の個数</text><a href="/flowchartcp/flowcharts/#diagram-linear-equal-neighbors" data-route="linear-equal-neighbors"><text x="1140" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="862.8333333333334" y="1167" width="320" height="157" rx="7"/><text class="node-kind" x="878.8333333333334" y="1187">分野</text><text class="node-title" x="878.8333333333334" y="1215">数え方を小さい例で確かめる</text><text class="node-explanation" x="878.8333333333334" y="1242">一つの対象を何回数えるか、重複や空集合を含めて確</text><text class="node-explanation" x="878.8333333333334" y="1260">認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-small-enumeration" data-route="count-small-enumeration"><text x="878.8333333333334" y="1288">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="boxes-check"><rect x="430.2777777777778" y="803" width="320" height="150" rx="7"/><text class="node-kind" x="446.2777777777778" y="823">質問</text><text class="node-title" x="446.2777777777778" y="851">箱ごとの個数だけを区別し、下限を引</text><text class="node-title" x="446.2777777777778" y="874">くとすべて非負になりますか？</text><text class="node-explanation" x="446.2777777777778" y="901">同じ物の並び順は区別しません。上限がある場合は追</text><text class="node-explanation" x="446.2777777777778" y="919">加の処理が必要です。</text></g><g class="flow-node route" data-node="redistribution-route"><rect x="794.2777777777778" y="803" width="320" height="121" rx="7"/><text class="node-kind" x="810.2777777777778" y="823">分野</text><text class="node-title" x="810.2777777777778" y="851">一個ずつの移動による配分</text><a href="/flowchartcp/flowcharts/#diagram-balls-move-count" data-route="balls-move-count"><text x="810.2777777777778" y="888">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="boxes-result"><rect x="32" y="1167" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="1187">候補</text><text class="node-title" x="48" y="1215">下限を引いて仕切りの置き方を数える</text><a href="/flowchartcp/techniques/stars-and-bars/"><title>単調な列を差分にして非負整数の和を数えるの記事へ</title><text x="48" y="1254">単調な列を差分にして非負整数の和を数える</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1167" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1187">候補</text><text class="node-title" x="412" y="1215">小規模全探索で数え方を確認する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="412" y="1254">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1278">反例探し</text></a></g><g class="flow-node route" data-node="inversions-route"><rect x="1488" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="434">分野</text><text class="node-title" x="1504" y="462">1からNを一度ずつ並べ、左の方が大</text><text class="node-title" x="1504" y="485">きい添字対をちょうどK個にする</text><a href="/flowchartcp/flowcharts/#diagram-permutation-inversion-count-conditions" data-route="permutation-inversion-count-conditions"><text x="1504" y="522">詳細の質問・図へ →</text></a></g></svg>