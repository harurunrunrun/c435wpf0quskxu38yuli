<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-thinking-invariants-validation flow-desc-thinking-invariants-validation" width="1112" height="1260" viewBox="0 0 1112 1260" data-flow-svg="thinking-invariants-validation"><title id="flow-title-thinking-invariants-validation">不変量と仮説の検証の解法フローチャート</title><desc id="flow-desc-thinking-invariants-validation">操作で変わらない量を探し、仮説が正しいか小さい入力で確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-thinking-invariants-validation" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="invariant:yes:invariant-result"><title>はい</title><path d="M719.833 164 V176 C719.833 208 500 208 500 240 V252"/><path d="M500 290 V302 C500 334 500 334 500 366 V378" marker-end="url(#arrow-thinking-invariants-validation)"/><g class="flow-edge-label" data-edge-label="invariant:yes:invariant-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="460" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="500" y="275">はい</text></g></g><g class="flow-edge no" data-edge="invariant:no:test"><title>いいえ</title><path d="M799.833 164 V176 C799.833 208 864 208 864 240 V252"/><path d="M864 290 V302 C864 334 864 334 864 366 V378" marker-end="url(#arrow-thinking-invariants-validation)"/><g class="flow-edge-label" data-edge-label="invariant:no:test" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="824" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="864" y="275">いいえ</text></g></g><g class="flow-edge unknown" data-edge="invariant:unknown:check"><title>わからない</title><path d="M879.833 164 V176 C879.833 208 1035.5 208 1035.5 240 V252"/><path d="M1035.5 290 V302 C1035.5 334 1074 334 1074 366 V378 V522 C1074 554 1014.5 554 1014.5 586 V598 V648 C1014.5 680 973.333 680 973.333 712 V724" marker-end="url(#arrow-thinking-invariants-validation)"/><g class="flow-edge-label" data-edge-label="invariant:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="test:yes:counterexample-result"><title>はい</title><path d="M784 510 V522 C784 554 192 554 192 586 V598"/><path d="M192 636 V648 C192 680 192 680 192 712 V724" marker-end="url(#arrow-thinking-invariants-validation)"/><g class="flow-edge-label" data-edge-label="test:yes:counterexample-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="598" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="621">はい</text></g></g><g class="flow-edge no" data-edge="test:no:fallback"><title>いいえ</title><path d="M864 510 V522 C864 554 556 554 556 586 V598"/><path d="M556 636 V648 C556 680 556 680 556 712 V724" marker-end="url(#arrow-thinking-invariants-validation)"/><g class="flow-edge-label" data-edge-label="test:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="598" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="621">いいえ</text></g></g><g class="flow-edge unknown" data-edge="test:unknown:check"><title>わからない</title><path d="M944 510 V522 C944 554 920 554 920 586 V598"/><path d="M920 636 V648 C920 680 866.667 680 866.667 712 V724" marker-end="url(#arrow-thinking-invariants-validation)"/><g class="flow-edge-label" data-edge-label="test:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="598" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="621">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:observation"><title>はい</title><path d="M840 856 V887 C840 919 556 919 556 951 V963"/><path d="M556 1001 V1013 C556 1045 556 1045 556 1077 V1089" marker-end="url(#arrow-thinking-invariants-validation)"/><g class="flow-edge-label" data-edge-label="check:yes:observation" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="963" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="986">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 856 V887 C920 919 907 919 907 951 V963"/><path d="M907 1001 V1013 C907 1045 866.667 1045 866.667 1077 V1089" marker-end="url(#arrow-thinking-invariants-validation)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="963" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="986">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 856 V887 C1000 919 1035.5 919 1035.5 951 V963"/><path d="M1035.5 1001 V1013 C1035.5 1045 973.333 1045 973.333 1077 V1089" marker-end="url(#arrow-thinking-invariants-validation)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="963" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="986">わからない</text></g></g><g class="flow-node question" data-node="invariant"><rect x="639.8333333333334" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="655.8333333333334" y="52">質問</text><text class="node-title" x="655.8333333333334" y="80">操作の前後で変わらない量や、変わる</text><text class="node-title" x="655.8333333333334" y="103">向きが決まった量がありますか？</text><text class="node-explanation" x="655.8333333333334" y="130">偶奇、和、連結性、順序などを調べます。</text></g><g class="flow-node result" data-node="invariant-result"><rect x="340" y="378" width="320" height="127" rx="7"/><text class="node-kind" x="356" y="398">候補</text><text class="node-title" x="356" y="426">不変量・単調な量を探す</text><a href="/flowchartcp/techniques/invariant/"><title>不変量の記事へ</title><text x="356" y="465">不変量</text></a></g><g class="flow-node question" data-node="test"><rect x="704" y="378" width="320" height="132" rx="7"/><text class="node-kind" x="720" y="398">質問</text><text class="node-title" x="720" y="426">仮説や実装が正しいか確かめたいです</text><text class="node-title" x="720" y="449">か？</text><text class="node-explanation" x="720" y="476">全探索と比較し、失敗する入力を小さくします。</text></g><g class="flow-node result" data-node="counterexample-result"><rect x="32" y="724" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="744">候補</text><text class="node-title" x="48" y="772">反例探索・差分検証</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="48" y="811">反例探し</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="724" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="744">候補</text><text class="node-title" x="412" y="772">制約と求める量を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="811">状態の設計</text></a><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="412" y="835">小さい入力で全探索する</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="724" width="320" height="132" rx="7"/><text class="node-kind" x="776" y="744">質問</text><text class="node-title" x="776" y="772">手で追える入力の、操作と答えを列挙</text><text class="node-title" x="776" y="795">できますか？</text><text class="node-explanation" x="776" y="822">抽象的な式を、最小の例に戻して確認します。</text></g><g class="flow-node result" data-node="observation"><rect x="396" y="1089" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1109">候補</text><text class="node-title" x="412" y="1137">小規模全探索から観察する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="412" y="1176">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="1089" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="1109">分野</text><text class="node-title" x="776" y="1137">条件を確かめる</text><text class="node-explanation" 