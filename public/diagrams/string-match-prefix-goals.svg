<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-string-match-prefix-goals flow-desc-string-match-prefix-goals" width="1532" height="1296" viewBox="0 0 1532 1296" data-flow-svg="string-match-prefix-goals"><title id="flow-title-string-match-prefix-goals">接頭辞の一致と連結の解法フローチャート</title><desc id="flow-desc-string-match-prefix-goals">接頭辞の一致長、接尾辞との一致、接頭辞をつなぐ片数や語どうしの一致長を求めます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-string-match-prefix-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="prefix:yes:prefix-accuracy"><title>各位置と接頭辞の一致長</title><path d="M766.933 182 V194 C766.933 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="prefix:yes:prefix-accuracy" tabindex="0" role="group" aria-label="選択肢：各位置と接頭辞の一致長"><rect x="108.5" y="270" width="167" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">各位置と接頭辞の一致長</text></g></g><g class="flow-edge border-period" data-edge="prefix:border-period:border-route"><title>接頭辞と接尾辞の一致・繰り返しの周期</title><path d="M820.267 182 V194 C820.267 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="prefix:border-period:border-route" tabindex="0" role="group" aria-label="選択肢：接頭辞と接尾辞の一致・繰り返しの周期"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">接頭辞と接尾辞の一致・繰り返しの周</text><text text-anchor="middle" x="556" y="311">期</text></g></g><g class="flow-edge prefix-pieces" data-edge="prefix:prefix-pieces:prefix-pieces-route"><title>一つの文字列の接頭辞をつなぎ、目的の列を最少の片数で作る</title><path d="M873.6 182 V194 C873.6 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="prefix:prefix-pieces:prefix-pieces-route" tabindex="0" role="group" aria-label="選択肢：一つの文字列の接頭辞をつなぎ、目的の列を最少の片数で作る"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">一つの文字列の接頭辞をつなぎ、目的</text><text text-anchor="middle" x="920" y="311">の列を最少の片数で作る</text></g></g><g class="flow-edge sorted-word-lcp" data-edge="prefix:sorted-word-lcp:sorted-word-lcp-route"><title>各語について、別の語と最も長く一致する接頭辞</title><path d="M926.933 182 V194 C926.933 226 1244.5 226 1244.5 258 V270"/><path d="M1244.5 326 V338 C1244.5 370 1284 370 1284 402 V414" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="prefix:sorted-word-lcp:sorted-word-lcp-route" tabindex="0" role="group" aria-label="選択肢：各語について、別の語と最も長く一致する接頭辞"><rect x="1122" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1244.5" y="293">各語について、別の語と最も長く一致</text><text text-anchor="middle" x="1244.5" y="311">する接頭辞</text></g></g><g class="flow-edge unknown" data-edge="prefix:unknown:check"><title>わからない</title><path d="M980.267 182 V194 C980.267 226 1455.5 226 1455.5 258 V270"/><path d="M1455.5 308 V338 C1455.5 370 1494 370 1494 402 V414 V558 C1494 590 1283.375 590 1283.375 622 V634 V684 C1283.375 716 1242.208 716 1242.208 748 V760" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="prefix:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1411" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1455.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:z"><title>はい</title><path d="M1108.875 910 V923 C1108.875 955 704.875 955 704.875 987 V999"/><path d="M704.875 1037 V1049 C704.875 1081 668.208 1081 668.208 1113 V1125" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:z" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="664.875" y="999" width="80" height="38" rx="5"/><text text-anchor="middle" x="704.875" y="1022">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1188.875 910 V923 C1188.875 955 1226 955 1226 987 V999"/><path d="M1226 1037 V1049 C1226 1081 1172.667 1081 1172.667 1113 V1125" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1186" y="999" width="80" height="38" rx="5"/><text text-anchor="middle" x="1226" y="1022">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1268.875 910 V923 C1268.875 955 1354.5 955 1354.5 987 V999"/><path d="M1354.5 1037 V1049 C1354.5 1081 1279.333 1081 1279.333 1113 V1125" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1310" y="999" width="89" height="38" rx="5"/><text text-anchor="middle" x="1354.5" y="1022">わからない</text></g></g><g class="flow-edge exact" data-edge="prefix-accuracy:exact:z"><title>必ず正しい一致長</title><path d="M112 546 V558 C112 590 614.875 590 614.875 622 V634"/><path d="M614.875 672 V684 C614.875 716 614.875 716 614.875 748 V760 V923 C614.875 955 614.875 955 614.875 987 V999 V1049 C614.875 1081 561.542 1081 561.542 1113 V1125" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="prefix-accuracy:exact:z" tabindex="0" role="group" aria-label="選択肢：必ず正しい一致長"><rect x="550.875" y="634" width="128" height="38" rx="5"/><text text-anchor="middle" x="614.875" y="657">必ず正しい一致長</text></g></g><g class="flow-edge probabilistic" data-edge="prefix-accuracy:probabilistic:hash-prefix"><title>低い確率の誤判定を許容する</title><path d="M192 546 V558 C192 590 824.875 590 824.875 622 V634"/><path d="M824.875 672 V684 C824.875 716 824.875 716 824.875 748 V760" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="prefix-accuracy:probabilistic:hash-prefix" tabindex="0" role="group" aria-label="選択肢：低い確率の誤判定を許容する"><rect x="728.375" y="634" width="193" height="38" rx="5"/><text text-anchor="middle" x="824.875" y="657">低い確率の誤判定を許容する</text></g></g><g class="flow-edge unknown" data-edge="prefix-accuracy:unknown:check"><title>わからない</title><path d="M272 546 V558 C272 590 1188.875 590 1188.875 622 V634"/><path d="M1188.875 672 V684 C1188.875 716 1135.542 716 1135.542 748 V760" marker-end="url(#arrow-string-match-prefix-goals)"/><g class="flow-edge-label" data-edge-label="prefix-accuracy:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1144.375" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1188.875" y="657">わからない</text></g></g><g class="flow-node question" data-node="prefix"><rect x="713.6" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="729.6" y="52">質問</text><text class="node-title" x="729.6" y="80">接頭辞について、どの関係を調べます</text><text class="node-title" x="729.6" y="103">か？</text><text class="node-explanation" x="729.6" y="130">同じ本文内の一致、語どうしの一致、接頭辞を材料に</text><text class="node-explanation" x="729.6" y="148">する構築を区別します。</text></g><g class="flow-node question" data-node="check"><rect x="1028.875" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="1044.875" y="780">質問</text><text class="node-title" x="1044.875" y="808">比較対象の片方を、同じ接頭辞として</text><text class="node-title" x="1044.875" y="831">固定できますか？</text><text class="node-explanation" x="1044.875" y="858">接頭辞を固定できるなら Z 配列で線形時間の比較</text><text class="node-explanation" x="1044.875" y="876">を考えます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1066" y="1125" width="320" height="139" rx="7"/><text class="node-kind" x="1082" y="1145">分野</text><text class="node-title" x="1082" y="1173">条件を確かめる</text><text class="node-explanation" x="1082" y="1200">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1082" y="1228">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="z"><rect x="454.875" y="1125" width="320" height="127" rx="7"/><text class="node-kind" x="470.875" y="1145">候補</text><text class="node-title" x="470.875" y="1173">Z アルゴリズム</text><a href="/flowchartcp/techniques/z-algorithm/"><title>Zアルゴリズムの記事へ</title><text x="470.875" y="1212">Zアルゴリズム</text></a></g><g class="flow-node question" data-node="prefix-accuracy"><rect x="32" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="48" y="434">質問</text><text class="node-title" x="48" y="462">一致長の計算で、どの正確さが必要で</text><text class="node-title" x="48" y="485">すか？</text><text class="node-explanation" x="48" y="512">厳密な一致と、衝突の可能性を許す比較を分けます。</text></g><g class="flow-node result" data-node="hash-prefix"><rect x="664.875" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="680.875" y="780">候補</text><text class="node-title" x="680.875" y="808">区間ハッシュで一致長を探索する</text><a href="/flowchartcp/techniques/rolling-hash/"><title>ローリングハッシュの記事へ</title><text x="680.875" y="847">ローリングハッシュ</text></a><a href="/flowchartcp/techniques/binary-search/"><title>二分探索の記事へ</title><text x="680.875" y="871">二分探索</text></a></g><g class="flow-node route" data-node="border-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">接頭辞・接尾辞と周期</text><a href="/flowchartcp/flowcharts/#diagram-string-prefix-structure" data-route="string-prefix-structure"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="prefix-pieces-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">使える接頭辞の長さと、片数の最小化</text><a href="/flowchartcp/flowcharts/#diagram-prefix-piece-cover" data-route="prefix-piece-cover"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="sorted-word-lcp-route"><rect x="1124" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">語の一覧に対する最長の共通接頭辞</text><a href="/flowchartcp/flowcharts/#diagram-sorted-word-neighbor-lcp" data-route="sorted-word-neighbor-lcp"><text x="1140" y="499">詳細の質問・図へ →</text></a></g></svg>