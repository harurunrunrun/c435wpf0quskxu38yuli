<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-xor-popcount-construction flow-desc-xor-popcount-construction" width="1112" height="1814" viewBox="0 0 1112 1814" data-flow-svg="xor-popcount-construction"><title id="flow-title-xor-popcount-construction">XORと二数の1の個数を指定した構築は、異なる桁と共通の1へ分けるの解法フローチャート</title><desc id="flow-desc-xor-popcount-construction">XOR の桁数、各 1 の個数、共通に 1 を置ける桁数を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-xor-popcount-construction" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge fixed-width" data-edge="model:fixed-width:assumptions"><title>B ビット未満の二数の XOR と、それぞれの 1 の個数を指定する</title><path d="M718.5 182 V194 C718.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 344 V356 C535.5 388 746.111 388 746.111 420 V432" marker-end="url(#arrow-xor-popcount-construction)"/><g class="flow-edge-label" data-edge-label="model:fixed-width:assumptions" tabindex="0" role="group" aria-label="選択肢：B ビット未満の二数の XOR と、それぞれの 1 の個数を指定する"><rect x="413" y="270" width="245" height="74" rx="5"/><text text-anchor="middle" x="535.5" y="293">B ビット未満の二数の XOR </text><text text-anchor="middle" x="535.5" y="311">と、それぞれの 1 の個数を指定す</text><text text-anchor="middle" x="535.5" y="329">る</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>ビット数が無制限、または XOR 以外にも桁を結ぶ条件がある</title><path d="M798.5 182 V194 C798.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V356 C824.5 388 1018 388 1018 420 V432 V617 C1018 649 1018 649 1018 681 V693 V743 C1018 775 1018 775 1018 807 V819 V1022 C1018 1054 1018 1054 1018 1086 V1098 V1148 C1018 1180 636 1180 636 1212 V1224" marker-end="url(#arrow-xor-popcount-construction)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：ビット数が無制限、または XOR 以外にも桁を結ぶ条件がある"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">ビット数が無制限、または XOR </text><text text-anchor="middle" x="824.5" y="311">以外にも桁を結ぶ条件がある</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M878.5 182 V194 C878.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V356 C1035.5 388 1074 388 1074 420 V432 V617 C1074 649 1074 649 1074 681 V693 V743 C1074 775 1074 775 1074 807 V819 V1022 C1074 1054 1074 1054 1074 1086 V1098 V1148 C1074 1180 1000 1180 1000 1212 V1224" marker-end="url(#arrow-xor-popcount-construction)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 605 V617 C666.111 649 519.833 649 519.833 681 V693"/><path d="M519.833 731 V743 C519.833 775 519.833 775 519.833 807 V819" marker-end="url(#arrow-xor-popcount-construction)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="716">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 605 V617 C746.111 649 795 649 795 681 V693"/><path d="M795 731 V743 C795 775 906 775 906 807 V819 V1022 C906 1054 906 1054 906 1086 V1098 V1148 C906 1180 556 1180 556 1212 V1224" marker-end="url(#arrow-xor-popcount-construction)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"><title