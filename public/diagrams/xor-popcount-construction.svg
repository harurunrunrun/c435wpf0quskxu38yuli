e="check:yes:uncertain"><title>はい</title><path d="M840 1374 V1423 C840 1455 783 1455 783 1487 V1499"/><path d="M783 1537 V1549 C783 1581 828.5 1581 828.5 1613 V1625" marker-end="url(#arrow-xor-popcount-construction)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1499" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1522">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1374 V1423 C920 1455 907 1455 907 1487 V1499"/><path d="M907 1537 V1549 C907 1581 908.5 1581 908.5 1613 V1625" marker-end="url(#arrow-xor-popcount-construction)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1499" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1522">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1374 V1423 C1000 1455 1035.5 1455 1035.5 1487 V1499"/><path d="M1035.5 1537 V1549 C1035.5 1581 988.5 1581 988.5 1613 V1625" marker-end="url(#arrow-xor-popcount-construction)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1499" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1522">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="638.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="654.5" y="52">質問</text><text class="node-title" x="654.5" y="80">整数や列について指定される条件はど</text><text class="node-title" x="654.5" y="103">れですか？</text><text class="node-explanation" x="654.5" y="130">XOR の桁数、各 1 の個数、共通に 1 を置</text><text class="node-explanation" x="654.5" y="148">ける桁数を確認します。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="432" width="320" height="173" rx="7"/><text class="node-kind" x="602.1111111111112" y="452">質問</text><text class="node-title" x="602.1111111111112" y="480">二数は 0≤X,Y&lt;2^B で、</text><text class="node-title" x="602.1111111111112" y="503">a,b は 0..B の範囲です</text><text class="node-title" x="602.1111111111112" y="526">か？</text><text class="node-explanation" x="602.1111111111112" y="553">XOR の指定値にも B 桁の上限が必要です。負</text><text class="node-explanation" x="602.1111111111112" y="571">数や符号拡張を含めません。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="819" width="320" height="191" rx="7"/><text class="node-kind" x="375.83333333333337" y="839">質問</text><text class="node-title" x="375.83333333333337" y="867">一組を作るか不可能と答えればよく、</text><text class="node-title" x="375.83333333333337" y="890">各ビットの位置には他の制約がありま</text><text class="node-title" x="375.83333333333337" y="913">せんか？</text><text class="node-explanation" x="375.83333333333337" y="940">共通の 1 は (a+b−c)/2 個です。C </text><text class="node-explanation" x="375.83333333333337" y="958">が 1 の桁の割当数と、C が 0 の桁の容量を</text><text class="node-explanation" x="375.83333333333337" y="976">別々に確認します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1224" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1244">候補</text><text class="node-title" x="48" y="1272">XORと二数の1の個数を指定した構</text><text class="node-title" x="48" y="1295">築は、異なる桁と共通の1へ分ける</text><a href="/flowchartcp/techniques/xor-popcount-construction/"><title>XORと二数の1の個数を指定した構築は、異なる桁と共通の1へ分けるの記事へ</title><text x="48" y="1334">XORと二数の1の個数を指定した構築は、異なる</text><text x="48" y="1352">桁と共通の1へ分ける</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1224" width="320" height="187" rx="7"/><text class="node-kind" x="412" y="1244">候補</text><text class="node-title" x="412" y="1272">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1299">固定ビット幅や個数条件が違う場合は、XOR が </text><text class="node-explanation" x="412" y="1317">1 の桁と 0 の桁の必要数を改めて列挙します。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1347">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1371">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1224" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1244">質問</text><text class="node-title" x="776" y="1272">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1295">確認できますか？</text><text class="node-explanation" x="776" y="1322">XOR の桁数、各 1 の個数、共通に 1 を置</text><text class="node-explanation" x="776" y="1340">ける桁数を確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1625" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1645">分野</text><text class="node-title" x="764.5" y="1673">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1700">XOR の桁数、各 1 の個数、共通に 1 を置</text><text class="node-explanation" x="764.5" y="1718">ける桁数を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1746">詳細の質問・図へ →</text></a></g></svg>