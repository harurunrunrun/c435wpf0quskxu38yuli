<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-count-sum-contributions flow-desc-count-sum-contributions" width="1168" height="973" viewBox="0 0 1168 973" data-flow-svg="count-sum-contributions"><title id="flow-title-count-sum-contributions">各要素・各位置・部分集合の集計の解法フローチャート</title><desc id="flow-desc-count-sum-contributions">位置の組の積、各要素の寄与、部分集合に沿った集計を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-count-sum-contributions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge pair-product" data-edge="count-kind:pair-product:pair-product-check"><title>異なる二つの位置の値の積の総和</title><path d="M587.25 182 V194 C587.25 226 192 226 192 258 V270"/><path d="M192 308 V320 C192 352 192 352 192 384 V396" marker-end="url(#arrow-count-sum-contributions)"/><g class="flow-edge-label" data-edge-label="count-kind:pair-product:pair-product-check" tabindex="0" role="group" aria-label="選択肢：異なる二つの位置の値の積の総和"><rect x="82.5" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">異なる二つの位置の値の積の総和</text></g></g><g class="flow-edge contribution" data-edge="count-kind:contribution:contribution-kind"><title>各要素が何回含まれるかを数える</title><path d="M651.25 182 V194 C651.25 226 556 226 556 258 V270"/><path d="M556 308 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-count-sum-contributions)"/><g class="flow-edge-label" data-edge-label="count-kind:contribution:contribution-kind" tabindex="0" role="group" aria-label="選択肢：各要素が何回含まれるかを数える"><rect x="446.5" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">各要素が何回含まれるかを数える</text></g></g><g class="flow-edge subsets" data-edge="count-kind:subsets:subsets"><title>集合とその部分集合に関する集計</title><path d="M715.25 182 V194 C715.25 226 893.5 226 893.5 258 V270"/><path d="M893.5 308 V320 C893.5 352 920 352 920 384 V396" marker-end="url(#arrow-count-sum-contributions)"/><g class="flow-edge-label" data-edge-label="count-kind:subsets:subsets" tabindex="0" role="group" aria-label="選択肢：集合とその部分集合に関する集計"><rect x="784" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="893.5" y="293">集合とその部分集合に関する集計</text></g></g><g class="flow-edge unknown" data-edge="count-kind:unknown:check"><title>わからない</title><path d="M779.25 182 V194 C779.25 226 1091.5 226 1091.5 258 V270"/><path d="M1091.5 308 V320 C1091.5 352 1130 352 1130 384 V396 V565 C1130 597 1014.5 597 1014.5 629 V641 V691 C1014.5 723 973.333 723 973.333 755 V767" marker-end="url(#arrow-count-sum-contributions)"/><g class="flow-edge-label" data-edge-label="count-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="pair-product-check:yes:pair-product-result"><title>はい</title><path d="M112 546 V565 C112 597 192 597 192 629 V641"/><path d="M192 679 V691 C192 723 192 723 192 755 V767" marker-end="url(#arrow-count-sum-contributions)"/><g class="flow-edge-label" data-edge-label="pair-product-check:yes:pair-product-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="641" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="664">はい</text></g></g><g class="flow-edge no" data-edge="pair-product-check:no:fallback"><title>いいえ</title><path d="M192 546 V565 C192 597 556 597 556 629 V641"/><path d="M556 679 V691 C556 723 556 723 556 755 V767" marker-end="url(#arrow-count-sum-contributions)"/><g class="flow-edge-label" data-edge-label="pair-product-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="641" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="664">いいえ</text></g></g><g class="flow-edge unknown" data-edge="pair-product-check:unknown:check"><title>わからない</title><path d="M272 546 V565 C272 597 920 597 920 629 V641"/><path d="M920 679 V691 C920 723 866.667 723 866.667 755 V767" marker-end="url(#arrow-count-sum-contributions)"/><g class="flow-edge-label" data-edge-label="pair-product-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="641" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="664">わからない</text></g></g><g class="flow-node question" data-node="count-kind"><rect x="523.25" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="539.25" y="52">質問</text><text class="node-title" x="539.25" y="80">数える対象には、どの特徴があります</text><text class="node-title" x="539.25" y="103">か？</text><text class="node-explanation" x="539.25" y="130">禁止条件、同じ物の配置、二つの選び方への寄与を分</text><text class="node-explanation" x="539.25" y="148">けます。</text></g><g class="flow-node question" data-node="pair-product-check"><rect x="32" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="416">質問</text><text class="node-title" x="48" y="444">一方の位置を固定すると、残りの値の</text><text class="node-title" x="48" y="467">和をまとめられますか？</text><text class="node-explanation" x="48" y="494">i&lt;j の組なら、接頭辞または接尾辞の和を使って</text><text class="node-explanation" x="48" y="512">積をまとめます。</text></g><g class="flow-node route" data-node="contribution-kind"><rect x="396" y="396" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="416">分野</text><text class="node-title" x="412" y="444">選び方ごとの量を合計する</text><text class="node-explanation" x="412" y="471">最大値・最小値、外接長方形、一般の寄与を区別し、</text><text class="node-explanation" x="412" y="489">同じ配置や部分集合の集計も確認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-contribution-goals" data-route="count-contribution-goals"><text x="412" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="subsets"><rect x="760" y="396" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="416">分野</text><text class="node-title" x="776" y="444">部分集合の値の集計</text><text class="node-explanation" x="776" y="471">部分集合に沿った集計か、桁を順に選ぶ数え上げかを</text><text class="node-explanation" x="776" y="489">確認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-subset-aggregation" data-route="count-subset-aggregation"><text x="776" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="767" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="787">分野</text><text class="node-title" x="776" y="815">数え方を小さい例で確かめる</text><text class="node-explanation" x="776" y="842">一つの対象を何回数えるか、重複や空集合を含めて確</text><text class="node-explanation" x="776" y="860">認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-small-enumeration" data-route="count-small-enumeration"><text x="776" y="888">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="pair-product-result"><rect x="32" y="767" width="320" height="174" rx="7"/><text class="node-kind" x="48" y="787">候補</text><text class="node-title" x="48" y="815">一方の位置を固定し、他方の和をまと</text><text class="node-title" x="48" y="838">める</text><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="48" y="877">寄与の数え上げ</text></a><a href="/flowchartcp/techniques/prefix-sum/"><title>累積和の記事へ</title><text x="48" y="901">累積和</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="767" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="787">候補</text><text class="node-title" x="412" y="815">小規模全探索で数え方を確認する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="412" y="854">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="878">反例探し</text></a></g></svg>