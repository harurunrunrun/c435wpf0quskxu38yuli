<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-shortest-distance-goals flow-desc-shortest-distance-goals" width="1840" height="921" viewBox="0 0 1840 921" data-flow-svg="shortest-distance-goals"><title id="flow-title-shortest-distance-goals">最小費用と経路に求める量の解法フローチャート</title><desc id="flow-desc-shortest-distance-goals">距離だけか、最短経路の個数、安い順の経路、ラベル列まで必要かを区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-shortest-distance-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="check:yes:dijkstra-result"><title>はい</title><path d="M1568 541 V560 C1568 592 1284 592 1284 624 V636"/><path d="M1284 674 V686 C1284 718 1284 718 1284 750 V762" marker-end="url(#arrow-shortest-distance-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:dijkstra-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1244" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="659">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1648 541 V560 C1648 592 1635 592 1635 624 V636"/><path d="M1635 674 V686 C1635 718 1594.667 718 1594.667 750 V762" marker-end="url(#arrow-shortest-distance-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1595" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="1635" y="659">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1728 541 V560 C1728 592 1763.5 592 1763.5 624 V636"/><path d="M1763.5 674 V686 C1763.5 718 1701.333 718 1701.333 750 V762" marker-end="url(#arrow-shortest-distance-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1719" y="636" width="89" height="38" rx="5"/><text text-anchor="middle" x="1763.5" y="659">わからない</text></g></g><g class="flow-edge distance-only" data-edge="ordinary-goal:distance-only:unweighted"><title>最小費用・最小回数だけ</title><path d="M813.333 159 V171 C813.333 203 192 203 192 235 V247"/><path d="M192 285 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-shortest-distance-goals)"/><g class="flow-edge-label" data-edge-label="ordinary-goal:distance-only:unweighted" tabindex="0" role="group" aria-label="選択肢：最小費用・最小回数だけ"><rect x="108.5" y="247" width="167" height="38" rx="5"/><text text-anchor="middle" x="192" y="270">最小費用・最小回数だけ</text></g></g><g class="flow-edge route-statistics" data-edge="ordinary-goal:route-statistics:statistics-route"><title>最小費用の経路の個数と、辺数の最小・最大</title><path d="M866.667 159 V171 C866.667 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-shortest-distance-goals)"/><g class="flow-edge-label" data-edge-label="ordinary-goal:route-statistics:statistics-route" tabindex="0" role="group" aria-label="選択肢：最小費用の経路の個数と、辺数の最小・最大"><rect x="440" y="247" width="232" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">最小費用の経路の個数と、辺数の最</text><text text-anchor="middle" x="556" y="288">小・最大</text></g></g><g class="flow-edge k-walks" data-edge="ordinary-goal:k-walks:k-walks-route"><title>費用が小さい順の K 本の経路。頂点・辺の再訪と同費用の別経路を含む</title><path d="M920 159 V171 C920 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-shortest-distance-goals)"/><g class="flow-edge-label" data-edge-label="ordinary-goal:k-walks:k-walks-route" tabindex="0" role="group" aria-label="選択肢：費用が小さい順の K 本の経路。頂点・辺の再訪と同費用の別経路を含む"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">費用が小さい順の K 本の経路。頂</text><text text-anchor="middle" x="920" y="288">点・辺の再訪と同費用の別経路を含む</text></g></g><g class="flow-edge label-sequence" data-edge="ordinary-goal:label-sequence:label-frontier-route"><title>辺数が最小の経路の中で、辺の色・ラベルの列を辞書順最小にする</title><path d="M973.333 159 V171 C973.333 203 1284 203 1284 235 V247"/><path d="M1284 303 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-shortest-distance-goals)"/><g class="flow-edge-label" data-edge-label="ordinary-goal:label-sequence:label-frontier-route" tabindex="0" role="group" aria-label="選択肢：辺数が最小の経路の中で、辺の色・ラベルの列を辞書順最小にする"><rect x="1161.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="270">辺数が最小の経路の中で、辺の色・ラ</text><text text-anchor="middle" x="1284" y="288">ベルの列を辞書順最小にする</text></g></g><g class="flow-edge unknown" data-edge="ordinary-goal:unknown:check"><title>わからない</title><path d="M1026.667 159 V171 C1026.667 203 1648 203 1648 235 V247"/><path d="M1648 285 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-shortest-distance-goals)"/><g class="flow-edge-label" data-edge-label="ordinary-goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1603.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1648" y="270">わからない</text></g></g><g class="flow-node route" data-node="unweighted"><rect x="32" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">辺の費用と負の閉路</text><text class="node-explanation" x="48" y="466">辺の費用の種類と閉路の条件から、最短距離を計算す</text><text class="node-explanation" x="48" y="484">る方法を選びます。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-edge-costs" data-route="shortest-edge-costs"><text x="48" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1488" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="1504" y="411">質問</text><text class="node-title" x="1504" y="439">問題文の重みの下限が 0 以上だと</text><text class="node-title" x="1504" y="462">確認できますか？</text><text class="node-explanation" x="1504" y="489">整数か実数かだけでは足りません。負の値が許される</text><text class="node-explanation" x="1504" y="507">かを調べます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1488" y="762" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="782">分野</text><text class="node-title" x="1504" y="810">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1504" y="847">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="dijkstra-result"><rect x="1124" y="762" width="320" height="127" rx="7"/><text class="node-kind" x="1140" y="782">候補</text><text class="node-title" x="1140" y="810">Dijkstra 法</text><a href="/flowchartcp/techniques/dijkstra/"><title>ダイクストラ法の記事へ</title><text x="1140" y="849">ダイクストラ法</text></a></g><g class="flow-node question" data-node="ordinary-goal"><rect x="760" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="52">質問</text><text class="node-title" x="776" y="80">最小費用のほかに、何を求めますか？</text><text class="node-explanation" x="776" y="107">経路の個数や辺数も求めるときは、同じ最小費用にな</text><text class="node-explanation" x="776" y="125">る遷移を残します。</text></g><g class="flow-node route" data-node="statistics-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">最短経路だけの個数と辺数</text><a href="/flowchartcp/flowcharts/#diagram-shortest-route-statistics" data-route="shortest-route-statistics"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="k-walks-route"><rect x="760" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">再訪できる経路の費用を安い順に求め</text><text class="node-title" x="776" y="462">る</text><a href="/flowchartcp/flowcharts/#diagram-k-cheapest-revisiting-walks" data-route="k-cheapest-revisiting-walks"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="label-frontier-route"><rect x="1124" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">同じ最短辺数の中で最小の辺ラベル列</text><a href="/flowchartcp/flowcharts/#diagram-lexicographic-shortest-labels" data-route="lexicographic-shortest-labels"><text x="1140" y="476">詳細の質問・図へ →</text></a></g></svg>