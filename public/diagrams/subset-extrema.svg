<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-subset-extrema flow-desc-subset-extrema" width="860" height="1384" viewBox="0 0 860 1384" data-flow-svg="subset-extrema"><title id="flow-title-subset-extrema">選んだ最大値・最小値の寄与の解法フローチャート</title><desc id="flow-desc-subset-extrema">ソートした順位を代表にして、選ばれる組の数を掛けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-subset-extrema" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="indices:yes:binomial"><title>はい</title><path d="M539.722 223 V235 C539.722 267 420.667 267 420.667 299 V311"/><path d="M420.667 349 V361 C420.667 393 420.667 393 420.667 425 V437" marker-end="url(#arrow-subset-extrema)"/><g class="flow-edge-label" data-edge-label="indices:yes:binomial" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="334">はい</text></g></g><g class="flow-edge no" data-edge="indices:no:fallback"><title>いいえ</title><path d="M619.722 223 V235 C619.722 267 655 267 655 299 V311"/><path d="M655 349 V361 C655 393 762.5 393 762.5 425 V437 V617 C762.5 649 762.5 649 762.5 681 V693 V743 C762.5 775 458 775 458 807 V819 V999 C458 1031 360 1031 360 1063 V1075 V1125 C360 1157 304 1157 304 1189 V1201" marker-end="url(#arrow-subset-extrema)"/><g class="flow-edge-label" data-edge-label="indices:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="indices:unknown:check"><title>わからない</title><path d="M699.722 223 V235 C699.722 267 783.5 267 783.5 299 V311"/><path d="M783.5 349 V361 C783.5 393 818.5 393 818.5 425 V437 V617 C818.5 649 818.5 649 818.5 681 V693 V743 C818.5 775 721.333 775 721.333 807 V819" marker-end="url(#arrow-subset-extrema)"/><g class="flow-edge-label" data-edge-label="indices:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="binomial:yes:extrema-result"><title>はい</title><path d="M340.667 605 V617 C340.667 649 192 649 192 681 V693"/><path d="M192 731 V743 C192 775 192 775 192 807 V819" marker-end="url(#arrow-subset-extrema)"/><g class="flow-edge-label" data-edge-label="binomial:yes:extrema-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="716">はい</text></g></g><g class="flow-edge no" data-edge="binomial:no:fallback"><title>いいえ</title><path d="M420.667 605 V617 C420.667 649 402 649 402 681 V693"/><path d="M402 731 V743 C402 775 402 775 402 807 V819 V999 C402 1031 304 1031 304 1063 V1075 V1125 C304 1157 224 1157 224 1189 V1201" marker-end="url(#arrow-subset-extrema)"/><g class="flow-edge-label" data-edge-label="binomial:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="binomial:unknown:check"><title>わからない</title><path d="M500.667 605 V617 C500.667 649 668 649 668 681 V693"/><path d="M668 731 V743 C668 775 614.667 775 614.667 807 V819" marker-end="url(#arrow-subset-extrema)"/><g class="flow-edge-label" data-edge-label="binomial:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 969 V999 C588 1031 450 1031 450 1063 V1075"/><path d="M450 1113 V1125 C450 1157 384 1157 384 1189 V1201" marker-end="url(#arrow-subset-extrema)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 969 V999 C668 1031 655 1031 655 1063 V1075"/><path d="M655 1113 V1125 C655 1157 614.667 1157 614.667 1189 V1201" marker-end="url(#arrow-subset-extrema)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 969 V999 C748 1031 783.5 1031 783.5 1063 V1075"/><path d="M783.5 1113 V1125 C783.5 1157 721.333 1157 721.333 1189 V1201" marker-end="url(#arrow-subset-extrema)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1098">わからない</text></g></g><g class="flow-node question" data-node="indices"><rect x="459.7222222222223" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">添字が異なれば値が等しくても別の選</text><text class="node-title" x="475.7222222222223" y="103">択で、ちょうど K 個を選びます</text><text class="node-title" x="475.7222222222223" y="126">か？</text><text class="node-explanation" x="475.7222222222223" y="153">選ばれた最大値の代表を、ソート後の最後の位置に固</text><text class="node-explanation" x="475.7222222222223" y="171">定します。最小値は最初の位置です。 選ぶ添字の組</text><text class="node-explanation" x="475.7222222222223" y="189">に追加制約がなく、任意の K 個を選べることも…</text></g><g class="flow-node question" data-node="binomial"><rect x="260.6666666666667" y="437" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="457">質問</text><text class="node-title" x="276.6666666666667" y="485">値をソートしてよく、必要な二項係数</text><text class="node-title" x="276.6666666666667" y="508">を計算できますか？</text><text class="node-explanation" x="276.6666666666667" y="535">位置 i を最大値の代表にする選択は、前の i </text><text class="node-explanation" x="276.6666666666667" y="553">個から K−1 個を選びます。等値も順位で一意に</text><text class="node-explanation" x="276.6666666666667" y="571">なります。</text></g><g class="flow-node result" data-node="extrema-result"><rect x="32" y="819" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">最大値と最小値をソート後の順位で一</text><text class="node-title" x="48" y="890">意に代表し、選ばれる組数を掛ける</text><a href="/flowchartcp/techniques/subset-extrema-rank/"><title>K個を選ぶ最大値と最小値の総和は、並べた順位ごとの二項係数にするの記事へ</title><text x="48" y="929">K個を選ぶ最大値と最小値の総和は、並べた順位ご</text><text x="48" y="947">との二項係数にする</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="839">質問</text><text class="node-title" x="524" y="867">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="890">確認できますか？</text><text class="node-explanation" x="524" y="917">区別する対象、求める個数、操作の条件を確認しま</text><text class="node-explanation" x="524" y="935">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1201" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1221">候補</text><text class="node-title" x="160" y="1249">条件と数え方をもう一度確かめる</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="160" y="1288">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1312">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1201" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1221">分野</text><text class="node-title" x="524" y="1249">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1286">詳細の質問・図へ →</text></a></g></svg>