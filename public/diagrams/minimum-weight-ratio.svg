<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-minimum-weight-ratio flow-desc-minimum-weight-ratio" width="860" height="1389" viewBox="0 0 860 1389" data-flow-svg="minimum-weight-ratio"><title id="flow-title-minimum-weight-ratio">重量の下限がある選択の比率の解法フローチャート</title><desc id="flow-desc-minimum-weight-ratio">比率の候補を利益に変換し、下限達成後の重さを一つにまとめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-minimum-weight-ratio" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:cap"><title>はい</title><path d="M539.722 205 V217 C539.722 249 420.667 249 420.667 281 V293"/><path d="M420.667 331 V343 C420.667 375 420.667 375 420.667 407 V419" marker-end="url(#arrow-minimum-weight-ratio)"/><g class="flow-edge-label" data-edge-label="model:yes:cap" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="316">はい</text></g></g><g class="flow-edge no" data-edge="model:no:fallback"><title>いいえ</title><path d="M619.722 205 V217 C619.722 249 655 249 655 281 V293"/><path d="M655 331 V343 C655 375 762.5 375 762.5 407 V419 V622 C762.5 654 762.5 654 762.5 686 V698 V748 C762.5 780 458 780 458 812 V824 V1004 C458 1036 360 1036 360 1068 V1080 V1130 C360 1162 304 1162 304 1194 V1206" marker-end="url(#arrow-minimum-weight-ratio)"/><g class="flow-edge-label" data-edge-label="model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M699.722 205 V217 C699.722 249 783.5 249 783.5 281 V293"/><path d="M783.5 331 V343 C783.5 375 818.5 375 818.5 407 V419 V622 C818.5 654 818.5 654 818.5 686 V698 V748 C818.5 780 721.333 780 721.333 812 V824" marker-end="url(#arrow-minimum-weight-ratio)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="cap:yes:ratio-result"><title>はい</title><path d="M340.667 610 V622 C340.667 654 192 654 192 686 V698"/><path d="M192 736 V748 C192 780 192 780 192 812 V824" marker-end="url(#arrow-minimum-weight-ratio)"/><g class="flow-edge-label" data-edge-label="cap:yes:ratio-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="698" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="721">はい</text></g></g><g class="flow-edge no" data-edge="cap:no:fallback"><title>いいえ</title><path d="M420.667 610 V622 C420.667 654 402 654 402 686 V698"/><path d="M402 736 V748 C402 780 402 780 402 812 V824 V1004 C402 1036 304 1036 304 1068 V1080 V1130 C304 1162 224 1162 224 1194 V1206" marker-end="url(#arrow-minimum-weight-ratio)"/><g class="flow-edge-label" data-edge-label="cap:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="698" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="721">いいえ</text></g></g><g class="flow-edge unknown" data-edge="cap:unknown:check"><title>わからない</title><path d="M500.667 610 V622 C500.667 654 668 654 668 686 V698"/><path d="M668 736 V748 C668 780 614.667 780 614.667 812 V824" marker-end="url(#arrow-minimum-weight-ratio)"/><g class="flow-edge-label" data-edge-label="cap:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="698" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="721">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 974 V1004 C588 1036 450 1036 450 1068 V1080"/><path d="M450 1118 V1130 C450 1162 384 1162 384 1194 V1206" marker-end="url(#arrow-minimum-weight-ratio)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1080" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1103">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 974 V1004 C668 1036 655 1036 655 1068 V1080"/><path d="M655 1118 V1130 C655 1162 614.667 1162 614.667 1194 V1206" marker-end="url(#arrow-minimum-weight-ratio)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1080" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1103">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 974 V1004 C748 1036 783.5 1036 783.5 1068 V1080"/><path d="M783.5 1118 V1130 C783.5 1162 721.333 1162 721.333 1194 V1206" marker-end="url(#arrow-minimum-weight-ratio)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1080" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1103">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="459.7222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">各対象を高々一回選び、正の重量の合</text><text class="node-title" x="475.7222222222223" y="103">計を正の下限 W 以上にして比率を</text><text class="node-title" x="475.7222222222223" y="126">最大にしますか？</text><text class="node-explanation" x="475.7222222222223" y="153">比率は非負の才能・価値の総和を、正の重量の総和で</text><text class="node-explanation" x="475.7222222222223" y="171">割ったものです。対象は高々一回ずつ選びます。</text></g><g class="flow-node question" data-node="cap"><rect x="260.6666666666667" y="419" width="320" height="191" rx="7"/><text class="node-kind" x="276.6666666666667" y="439">質問</text><text class="node-title" x="276.6666666666667" y="467">重量下限 W は小さく、達成した後</text><text class="node-title" x="276.6666666666667" y="490">は余分な重量に新しい条件がありませ</text><text class="node-title" x="276.6666666666667" y="513">んか？</text><text class="node-explanation" x="276.6666666666667" y="540">比率の候補を q として、各利益を才能−q×重量</text><text class="node-explanation" x="276.6666666666667" y="558">へ変えます。下限を満たした重さは W へまとめ、</text><text class="node-explanation" x="276.6666666666667" y="576">最大利益を残します。</text></g><g class="flow-node result" data-node="ratio-result"><rect x="32" y="824" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="844">候補</text><text class="node-title" x="48" y="872">比率の候補で利益へ変換し、重さ W</text><text class="node-title" x="48" y="895"> 以上の状態を W に丸める</text><a href="/flowchartcp/techniques/ratio-knapsack-weight-cap/"><title>重量下限を満たす比率最大化は、比率を仮定して重さを下限で丸めるの記事へ</title><text x="48" y="934">重量下限を満たす比率最大化は、比率を仮定して重</text><text x="48" y="952">さを下限で丸める</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="824" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="844">質問</text><text class="node-title" x="524" y="872">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="895">確認できますか？</text><text class="node-explanation" x="524" y="922">使える操作、残す履歴、求める個数や最適値を確認し</text><text class="node-explanation" x="524" y="940">ます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1206" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1226">候補</text><text class="node-title" x="160" y="1254">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1293">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1317">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1206" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1226">分野</text><text class="node-title" x="524" y="1254">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1291">詳細の質問・図へ →</text></a></g></svg>