39"/><path d="M755.5 1077 V1089 C755.5 1121 840 1121 840 1153 V1165" marker-end="url(#arrow-suffix-lcp-pair-sums)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1062">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1315 V1345 C840 1377 783 1377 783 1409 V1421"/><path d="M783 1459 V1471 C783 1503 828.5 1503 828.5 1535 V1547" marker-end="url(#arrow-suffix-lcp-pair-sums)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1421" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1444">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1315 V1345 C920 1377 907 1377 907 1409 V1421"/><path d="M907 1459 V1471 C907 1503 908.5 1503 908.5 1535 V1547" marker-end="url(#arrow-suffix-lcp-pair-sums)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1421" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1444">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1315 V1345 C1000 1377 1035.5 1377 1035.5 1409 V1421"/><path d="M1035.5 1459 V1471 C1035.5 1503 988.5 1503 988.5 1535 V1547" marker-end="url(#arrow-suffix-lcp-pair-sums)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1421" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1444">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="515.125" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="531.125" y="52">質問</text><text class="node-title" x="531.125" y="80">一致長を、どの組について集計します</text><text class="node-title" x="531.125" y="103">か？</text><text class="node-explanation" x="531.125" y="130">接尾辞を対象にすること、最大ではなく総和を求める</text><text class="node-explanation" x="531.125" y="148">ことを区別します。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="558.5555555555557" y="434">質問</text><text class="node-title" x="558.5555555555557" y="462">本文は固定され、全ての開始位置から</text><text class="node-title" x="558.5555555555557" y="485">の接尾辞が対象ですか？</text><text class="node-explanation" x="558.5555555555557" y="512">末尾に文字を追加する処理や、別々の語の一覧とは必</text><text class="node-explanation" x="558.5555555555557" y="530">要な前処理が異なります。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="778" width="320" height="173" rx="7"/><text class="node-kind" x="357.1666666666667" y="798">質問</text><text class="node-title" x="357.1666666666667" y="826">辞書順で隣接する一致長の、区間最小</text><text class="node-title" x="357.1666666666667" y="849">値が両端接尾辞の一致長になります</text><text class="node-title" x="357.1666666666667" y="872">か？</text><text class="node-explanation" x="357.1666666666667" y="899">この性質から、片側へ広げた区間の最小値の総和を単</text><text class="node-explanation" x="357.1666666666667" y="917">調なスタックでまとめられます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1185">候補</text><text class="node-title" x="48" y="1213">隣接接尾辞の一致長を、区間の最小値</text><text class="node-title" x="48" y="1236">としてまとめる</text><a href="/flowchartcp/techniques/suffix-lcp-pair-sum/"><title>全接尾辞との共通接頭辞の長さの和は、LCPの区間最小値を個数付きでまとめるの記事へ</title><text x="48" y="1275">全接尾辞との共通接頭辞の長さの和は、LCPの区</text><text x="48" y="1293">間最小値を個数付きでまとめる</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1165" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1185">候補</text><text class="node-title" x="412" y="1213">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1252">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1276">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1165" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1185">質問</text><text class="node-title" x="776" y="1213">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1236">書き出せますか？</text><text class="node-explanation" x="776" y="1263">接尾辞を対象にすること、最大ではなく総和を求める</text><text class="node-explanation" x="776" y="1281">ことを区別します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1547" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1567">分野</text><text class="node-title" x="764.5" y="1595">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1632">詳細の質問・図へ →</text></a></g></svg>