<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-two-source-mixture-conditions flow-desc-two-source-mixture-conditions" width="748" height="1424" viewBox="0 0 748 1424" data-flow-svg="two-source-mixture-conditions"><title id="flow-title-two-source-mixture-conditions">二始点からの混合と、到着量の幾何平均の最大化の解法フローチャート</title><desc id="flow-desc-two-source-mixture-conditions">種類別の保存則、共有する容量、目的と数値範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-two-source-mixture-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="two-source-shared-capacity:yes:multiplicative-objective"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-two-source-mixture-conditions)"/><g class="flow-edge-label" data-edge-label="two-source-shared-capacity:yes:multiplicative-objective" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="two-source-shared-capacity:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V617 C654 649 654 649 654 681 V693 V743 C654 775 654 775 654 807 V819 V1022 C654 1054 654 1054 654 1086 V1098 V1148 C654 1180 624.571 1180 624.571 1212 V1224" marker-end="url(#arrow-two-source-mixture-conditions)"/><g class="flow-edge-label" data-edge-label="two-source-shared-capacity:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="two-source-shared-capacity:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V617 C710 649 710 649 710 681 V693 V743 C710 775 710 775 710 807 V819 V1022 C710 1054 710 1054 710 1086 V1098 V1148 C710 1180 670.286 1180 670.286 1212 V1224" marker-end="url(#arrow-two-source-mixture-conditions)"/><g class="flow-edge-label" data-edge-label="two-source-shared-capacity:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="multiplicative-objective:yes:size"><title>はい</title><path d="M352.5 605 V617 C352.5 649 307 649 307 681 V693"/><path d="M307 731 V743 C307 775 319.5 775 319.5 807 V819" marker-end="url(#arrow-two-source-mixture-conditions)"/><g class="flow-edge-label" data-edge-label="multiplicative-objective:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="716">はい</text></g></g><g class="flow-edge no" data-edge="multiplicative-objective:no:check"><title>いいえ</title><path d="M432.5 605 V617 C432.5 649 431 649 431 681 V693"/><path d="M431 731 V743 C431 775 542 775 542 807 V819 V1022 C542 1054 542 1054 542 1086 V1098 V1148 C542 1180 533.143 1180 533.143 1212 V1224" marker-end="url(#arrow-two-source-mixture-conditions)"/><g class="flow-edge-label" data-edge-label="multiplicative-objective:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="multiplicative-objective:unknown:check"><title>わからない</title><path d="M512.5 605 V617 C512.5 649 559.5 649 559.5 681 V693"/><path d="M559.5 731 V743 C559.5 775 598 775 598 807 V819 V1022 C598 1054 598 1054 598 1086 V1098 V1148 C598 1180 578.857 1180 578.857 1212 V1224" marker-end="url(#arrow-two-source-mixture-conditions)"/><g class="flow-edge-label" data-edge-label="multiplicative-objective:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M239.5 1010 V1022 C239.5 1054 192 1054 192 1086 V1098"/><path d="M192 1136 V1148 C192 1180 192 1180 192 1212 V1224" marker-end="url(#arrow-two-source-mixture-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1121">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 1010 V1022 C319.5 1054 319 1054 319 1086 V1098"/><path d="M319 1136 V1148 C319 1180 441.714 1180 441.714 1212 V1224" marker-end="url(#arrow-two-source-mixture-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1121">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 1010 V1022 C399.5 1054 447.5 1054 447.5 1086 V1098"/><path d="M447.5 1136 V1148 C447.5 1180 487.429 1180 487.429 1212 V1224" marker-end="url(#arrow-two-source-mixture-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1098" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1121">わからない</text></g></g><g class="flow-node question" data-node="two-source-shared-capacity"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">二種類を別々の始点から一つの終点へ</text><text class="node-title" x="400.5" y="103">送り、無向辺の容量を共有しますか？</text><text class="node-explanation" x="400.5" y="130">各種類の保存則を別々に守ります。同じ向きなら混合</text><text class="node-explanation" x="400.5" y="148">後に分離できますが、同じ辺で二種類を逆向きに流せ</text><text class="node-explanation" x="400.5" y="166">ません。</text></g><g class="flow-node question" data-node="multiplicative-objective"><rect x="272.5" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">二種類の到着量の重み付き幾何平均を</text><text class="node-title" x="288.5" y="485">最大にし、辺ごとの流れも求めます</text><text class="node-title" x="288.5" y="508">か？</text><text class="node-explanation" x="288.5" y="535">0&lt;α&lt;1とし、一方の種類が容量を使う倍率vは全</text><text class="node-explanation" x="288.5" y="553">辺で一定です。種類による通行禁止や、途中の配合制</text><text class="node-explanation" x="288.5" y="571">約はありません。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="819" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="839">質問</text><text class="node-title" x="175.5" y="867">頂点は3〜200、辺容量は0〜10</text><text class="node-title" x="175.5" y="890">の整数で、重みと容量倍率を分母</text><text class="node-title" x="175.5" y="913">100億以下の整数比で表せますか？</text><text class="node-explanation" x="175.5" y="940">自己ループと重複辺はなく、1≤v≤10です。空の</text><text class="node-explanation" x="175.5" y="958">辺集合や非連結も扱えます。元の小数10桁以内の入</text><text class="node-explanation" x="175.5" y="976">力は厳密な比へ変換できます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1224" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1244">候補</text><text class="node-title" x="48" y="1272">単独と合計の最大流から配分を決め、</text><text class="node-title" x="48" y="1295">同方向の合計流を二種類へ分ける</text><a href="/flowchartcp/techniques/two-source-concave-flow-mixture-decomposition/"><title>二始点の混合流は、三つの最大流で配分を決め、同方向の合計流から分解するの記事へ</title><text x="48" y="1334">二始点の混合流は、三つの最大流で配分を決め、同</text><text x="48" y="1352">方向の合計流から分解する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1224" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1244">分野</text><text class="node-title" x="412" y="1272">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1309">詳細の質問・図へ →</text></a></g></svg>