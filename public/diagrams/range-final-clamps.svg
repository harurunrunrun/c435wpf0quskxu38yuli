1121 384 1153 V1165" marker-end="url(#arrow-range-final-clamps)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 915 V963 C668 995 655 995 655 1027 V1039"/><path d="M655 1077 V1089 C655 1121 614.667 1121 614.667 1153 V1165" marker-end="url(#arrow-range-final-clamps)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 915 V963 C748 995 783.5 995 783.5 1027 V1039"/><path d="M783.5 1077 V1089 C783.5 1121 721.333 1121 721.333 1153 V1165" marker-end="url(#arrow-range-final-clamps)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="operation"><rect x="459.7222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">操作は x を max(x,h) </text><text class="node-title" x="475.7222222222223" y="103">または min(x,h) に変える</text><text class="node-title" x="475.7222222222223" y="126">だけですか？</text><text class="node-explanation" x="475.7222222222223" y="153">区間加算や値の和への問い合わせは、ここで持つ上下</text><text class="node-explanation" x="475.7222222222223" y="171">限の組だけでは処理しません。</text></g><g class="flow-node question" data-node="order"><rect x="260.6666666666667" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="439">質問</text><text class="node-title" x="276.6666666666667" y="467">途中の集計は不要で、全操作後の各位</text><text class="node-title" x="276.6666666666667" y="490">置の値だけを求めますか？</text><text class="node-explanation" x="276.6666666666667" y="517">min(max(x,lo),hi) の形で関数を</text><text class="node-explanation" x="276.6666666666667" y="535">表し、新しい操作を古い操作の後ろへ合成します。</text></g><g class="flow-node result" data-node="clamp-result"><rect x="32" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">上限と下限の二つを、後から来る変更</text><text class="node-title" x="48" y="854">で同時に切る</text><a href="/flowchartcp/techniques/range-clamp-composition/"><title>区間の上限・下限更新で最後の各値だけ欲しいなら、切り詰める写像を合成するの記事へ</title><text x="48" y="893">区間の上限・下限更新で最後の各値だけ欲しいな</text><text x="48" y="911">ら、切り詰める写像を合成する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="783" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="803">質問</text><text class="node-title" x="524" y="831">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="854">確認できますか？</text><text class="node-explanation" x="524" y="881">操作の順序、更新する値、求める量を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1165" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1185">候補</text><text class="node-title" x="160" y="1213">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1252">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1276">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1185">分野</text><text class="node-title" x="524" y="1213">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1250">詳細の質問・図へ →</text></a></g></svg>