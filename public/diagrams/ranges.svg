<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-ranges flow-desc-ranges" width="2204" height="908" viewBox="0 0 2204 908" data-flow-svg="ranges"><title id="flow-title-ranges">配列・区間の解法フローチャート</title><desc id="flow-desc-ranges">静的な集計、更新、連続部分列、オフライン処理を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-ranges" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge aggregate-goals" data-edge="updates:aggregate-goals:aggregate-goals-route"><title>連続する区間・利用期間・開催日の得点を集計する</title><path d="M987.714 159 V171 C987.714 203 192 203 192 235 V247"/><path d="M192 303 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-ranges)"/><g class="flow-edge-label" data-edge-label="updates:aggregate-goals:aggregate-goals-route" tabindex="0" role="group" aria-label="選択肢：連続する区間・利用期間・開催日の得点を集計する"><rect x="69.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="270">連続する区間・利用期間・開催日の得</text><text text-anchor="middle" x="192" y="288">点を集計する</text></g></g><g class="flow-edge query-times" data-edge="updates:query-times:query-times-route"><title>多数の問い合わせ・過去の状態・初めて条件を満たす時刻</title><path d="M1033.429 159 V171 C1033.429 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-ranges)"/><g class="flow-edge-label" data-edge-label="updates:query-times:query-times-route" tabindex="0" role="group" aria-label="選択肢：多数の問い合わせ・過去の状態・初めて条件を満たす時刻"><rect x="433.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">多数の問い合わせ・過去の状態・初め</text><text text-anchor="middle" x="556" y="288">て条件を満たす時刻</text></g></g><g class="flow-edge selected-elements" data-edge="updates:selected-elements:selected-elements-route"><title>複数の値・増加する部分列・順位から要素を選ぶ</title><path d="M1079.143 159 V171 C1079.143 203 920 203 920 235 V247"/><path d="