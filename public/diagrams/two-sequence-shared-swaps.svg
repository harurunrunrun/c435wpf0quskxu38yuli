<rect x="260.6666666666667" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="439">質問</text><text class="node-title" x="276.6666666666667" y="467">操作を任意回繰り返し、二列を完全に</text><text class="node-title" x="276.6666666666667" y="490">一致させられるかを判定しますか？</text><text class="node-explanation" x="276.6666666666667" y="517">交換回数の最小値や、交換列そのものの出力は扱いま</text><text class="node-explanation" x="276.6666666666667" y="535">せん。</text></g><g class="flow-node result" data-node="swap-result"><rect x="32" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">多重集合を比べ、重複がなければ相対</text><text class="node-title" x="48" y="854">順列の偶奇を調べる</text><a href="/flowchartcp/techniques/simultaneous-swap-parity/"><title>三添字を使う同時交換は、同値の有無と対応順の偶奇で判定するの記事へ</title><text x="48" y="893">三添字を使う同時交換は、同値の有無と対応順の偶</text><text x="48" y="911">奇で判定する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="783" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="803">質問</text><text class="node-title" x="524" y="831">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="854">確認できますか？</text><text class="node-explanation" x="524" y="881">操作の条件と、求める個数・値・順序を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1165" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1185">候補</text><text class="node-title" x="160" y="1213">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1252">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1276">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1185">分野</text><text class="node-title" x="524" y="1213">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" 