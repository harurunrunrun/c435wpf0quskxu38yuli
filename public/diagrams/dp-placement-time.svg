選択肢：はい"><rect x="516" y="1028" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1051">はい</text></g></g><g class="flow-edge no" data-edge="square-cost-check:no:fallback"><title>いいえ</title><path d="M920 940 V952 C920 984 920 984 920 1016 V1028"/><path d="M920 1066 V1078 C920 1110 920 1110 920 1142 V1154" marker-end="url(#arrow-dp-placement-time)"/><g class="flow-edge-label" data-edge-label="square-cost-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="880" y="1028" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1051">いいえ</text></g></g><g class="flow-edge unknown" data-edge="square-cost-check:unknown:check"><title>わからない</title><path d="M1000 940 V952 C1000 984 1672.833 984 1672.833 1016 V1028"/><path d="M1672.833 1066 V1078 C1672.833 1110 1592.833 1110 1592.833 1142 V1154" marker-end="url(#arrow-dp-placement-time)"/><g class="flow-edge-label" data-edge-label="square-cost-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1628.3333333333333" y="1028" width="89" height="38" rx="5"/><text text-anchor="middle" x="1672.8333333333333" y="1051">わからない</text></g></g><g class="flow-node question" data-node="defined"><rect x="916.0714285714287" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="932.0714285714287" y="52">質問</text><text class="node-title" x="932.0714285714287" y="80">選び方や分け方の特徴はどれですか？</text><text class="node-explanation" x="932.0714285714287" y="107">入力の上限と、求める制約から探します。</text></g><g class="flow-node question" data-node="check"><rect x="1512.8333333333333" y="1154" width="320" height="150" rx="7"/><text class="node-kind" x="1528.8333333333333" y="1174">質問</text><text class="node-title" x="1528.8333333333333" y="1202">小さい入力で、全状態と遷移を列挙で</text><text class="node-title" x="1528.8333333333333" y="1225">きますか？</text><text class="node-explanation" x="1528.8333333333333" y="1252">列挙した表で状態の重複と、どこに時間がかかるかを</text><text class="node-explanation" x="1528.8333333333333" y="