<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-count-integer-digits flow-desc-count-integer-digits" width="1112" height="567" viewBox="0 0 1112 567" data-flow-svg="count-integer-digits"><title id="flow-title-count-integer-digits">桁を順に選ぶ整数の解法フローチャート</title><desc id="flow-desc-count-integer-digits">接頭辞から次の状態を更新できるかを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-count-integer-digits" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="digits:yes:digit"><title>はい</title><path d="M476 164 V176 C476 208 192 208 192 240 V252"/><path d="M192 290 V302 C192 334 192 334 192 366 V378" marker-end="url(#arrow-count-integer-digits)"/><g class="flow-edge-label" data-edge-label="digits:yes:digit" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="275">はい</text></g></g><g class="flow-edge no" data-edge="digits:no:fallback"><title>いいえ</title><path d="M556 164 V176 C556 208 556 208 556 240 V252"/><path d="M556 290 V302 C556 334 556 334 556 366 V378" marker-end="url(#arrow-count-integer-digits)"/><g class="flow-edge-label" data-edge-label="digits:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="275">いいえ</text></g></g><g class="flow-edge unknown" data-edge="digits:unknown:check"><title>わからない</title><path d="M636 164 V176 C636 208 920 208 920 240 V252"/><path d="M920 290 V302 C920 334 920 334 920 366 V378" marker-end="url(#arrow-count-integer-digits)"/><g class="flow-edge-label" data-edge-label="digits:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="275">わからない</text></g></g><g class="flow-node question" data-node="digits"><rect x="396" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="412" y="52">質問</text><text class="node-title" x="412" y="80">整数の桁を順に決めることで数えられ</text><text class="node-title" x="412" y="103">ますか？</text><text class="node-explanation" x="412" y="130">上限の接頭辞と一致しているかを持ちます。</text></g><g class="flow-node result" data-node="digit"><rect x="32" y="378" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="398">候補</text><text class="node-title" x="48" y="426">桁 DP</text><a href="/flowchartcp/techniques/digit-dp/"><title>桁DPの記事へ</title><text x="48" y="465">桁DP</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="378" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="398">候補</text><text class="node-title" x="412" y="426">小規模全探索で数え方を確認する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="412" y="465">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="489">反例探し</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="378" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="398">分野</text><text class="node-title" x="776" y="426">数え方を小さい例で確かめる</text><text class="node-explanation" x="776" y="453">一つの対象を何回数えるか、重複や空集合を含めて確</text><text class="node-explanation" x="776" y="471">認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-small-enumeration" data-route="count-small-enumeration"><text x="776" y="499">詳細の質問・図へ →</text></a></g></svg>