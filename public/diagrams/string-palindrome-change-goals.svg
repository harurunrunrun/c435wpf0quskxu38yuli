<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-string-palindrome-change-goals flow-desc-string-palindrome-change-goals" width="1476" height="1779" viewBox="0 0 1476 1779" data-flow-svg="string-palindrome-change-goals"><title id="flow-title-string-palindrome-change-goals">文字の変更と回文の削除の解法フローチャート</title><desc id="flow-desc-string-palindrome-change-goals">一文字を変更した後の回文判定と、連続する回文の削除で列を空にする最少回数を扱います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-string-palindrome-change-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge point-updates" data-edge="distinct:point-updates:update-hash-permission"><title>文字を一か所ずつ変更し、指定区間が回文か調べる</title><path d="M1070.667 182 V194 C1070.667 226 864 226 864 258 V270"/><path d="M864 326 V338 C864 370 864 370 864 402 V414" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="distinct:point-updates:update-hash-permission" tabindex="0" role="group" aria-label="選択肢：文字を一か所ずつ変更し、指定区間が回文か調べる"><rect x="741.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="864" y="293">文字を一か所ずつ変更し、指定区間が</text><text text-anchor="middle" x="864" y="311">回文か調べる</text></g></g><g class="flow-edge erase-contiguous" data-edge="distinct:erase-contiguous:palindrome-erasure-route"><title>現在の列の任意の連続回文を一回で消し、全部消す最少回数</title><path d="M1150.667 182 V194 C1150.667 226 1188.5 226 1188.5 258 V270"/><path d="M1188.5 326 V338 C1188.5 370 1228 370 1228 402 V414" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="distinct:erase-contiguous:palindrome-erasure-route" tabindex="0" role="group" aria-label="選択肢：現在の列の任意の連続回文を一回で消し、全部消す最少回数"><rect x="1066" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1188.5" y="293">現在の列の任意の連続回文を一回で消</text><text text-anchor="middle" x="1188.5" y="311">し、全部消す最少回数</text></g></g><g class="flow-edge unknown" data-edge="distinct:unknown:check"><title>わからない</title><path d="M1230.667 182 V194 C1230.667 226 1399.5 226 1399.5 258 V270"/><path d="M1399.5 308 V338 C1399.5 370 1438 370 1438 402 V414 V594 C1438 626 1438 626 1438 658 V670 V720 C1438 752 1438 752 1438 784 V796 V976 C1438 1008 1438 1008 1438 1040 V1052 V1102 C1438 1134 1380 1134 1380 1166 V1178" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="distinct:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:eertree"><title>はい</title><path d="M1204 1328 V1406 C1204 1438 920 1438 920 1470 V1482"/><path d="M920 1520 V1532 C920 1564 920 1564 920 1596 V1608" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:eertree" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="1482" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1505">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 1328 V1406 C1284 1438 1271 1438 1271 1470 V1482"/><path d="M1271 1520 V1532 C1271 1564 1230.667 1564 1230.667 1596 V1608" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="1482" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="1505">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 1328 V1406 C1364 1438 1399.5 1438 1399.5 1470 V1482"/><path d="M1399.5 1520 V1532 C1399.5 1564 1337.333 1564 1337.333 1596 V1608" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="1482" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="1505">わからない</text></g></g><g class="flow-edge yes" data-edge="update-hash-permission:yes:update-point-check"><title>はい</title><path d="M784 582 V594 C784 626 551.5 626 551.5 658 V670"/><path d="M551.5 708 V720 C551.5 752 551.5 752 551.5 784 V796" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="update-hash-permission:yes:update-point-check" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="511.5" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="551.5" y="693">はい</text></g></g><g class="flow-edge no" data-edge="update-hash-permission:no:exact-updates-budget"><title>いいえ</title><path d="M864 582 V594 C864 626 1160.5 626 1160.5 658 V670"/><path d="M1160.5 708 V720 C1160.5 752 1160.5 752 1160.5 784 V796" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="update-hash-permission:no:exact-updates-budget" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1120.5" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="1160.5" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="update-hash-permission:unknown:check"><title>わからない</title><path d="M944 582 V594 C944 626 1343.5 626 1343.5 658 V670"/><path d="M1343.5 708 V720 C1343.5 752 1382 752 1382 784 V796 V976 C1382 1008 1382 1008 1382 1040 V1052 V1102 C1382 1134 1316 1134 1316 1166 V1178" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="update-hash-permission:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1299" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="1343.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="update-point-check:yes:update-hash-result"><title>はい</title><path d="M471.5 964 V976 C471.5 1008 192 1008 192 1040 V1052"/><path d="M192 1090 V1102 C192 1134 192 1134 192 1166 V1178" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="update-point-check:yes:update-hash-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1075">はい</text></g></g><g class="flow-edge no" data-edge="update-point-check:no:fallback"><title>いいえ</title><path d="M551.5 964 V976 C551.5 1008 556 1008 556 1040 V1052"/><path d="M556 1090 V1102 C556 1134 502.667 1134 502.667 1166 V1178" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="update-point-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1075">いいえ</text></g></g><g class="flow-edge unknown" data-edge="update-point-check:unknown:check"><title>わからない</title><path d="M631.5 964 V976 C631.5 1008 906.5 1008 906.5 1040 V1052"/><path d="M906.5 1090 V1102 C906.5 1134 1188 1134 1188 1166 V1178" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="update-point-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="862" y="1052" width="89" height="38" rx="5"/><text text-anchor="middle" x="906.5" y="1075">わからない</text></g></g><g class="flow-edge yes" data-edge="exact-updates-budget:yes:exact-updates-result"><title>はい</title><path d="M1080.5 964 V976 C1080.5 1008 1035 1008 1035 1040 V1052"/><path d="M1035 1090 V1102 C1035 1134 920 1134 920 1166 V1178" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="exact-updates-budget:yes:exact-updates-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="995" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="1035" y="1075">はい</text></g></g><g class="flow-edge no" data-edge="exact-updates-budget:no:fallback"><title>いいえ</title><path d="M1160.5 964 V976 C1160.5 1008 1159 1008 1159 1040 V1052"/><path d="M1159 1090 V1102 C1159 1134 609.333 1134 609.333 1166 V1178" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="exact-updates-budget:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1119" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="1159" y="1075">いいえ</text></g></g><g class="flow-edge unknown" data-edge="exact-updates-budget:unknown:check"><title>わからない</title><path d="M1240.5 964 V976 C1240.5 1008 1287.5 1008 1287.5 1040 V1052"/><path d="M1287.5 1090 V1102 C1287.5 1134 1252 1134 1252 1166 V1178" marker-end="url(#arrow-string-palindrome-change-goals)"/><g class="flow-edge-label" data-edge-label="exact-updates-budget:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1243" y="1052" width="89" height="38" rx="5"/><text text-anchor="middle" x="1287.5" y="1075">わからない</text></g></g><g class="flow-node question" data-node="distinct"><rect x="990.6666666666667" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1006.6666666666667" y="52">質問</text><text class="node-title" x="1006.6666666666667" y="80">文字の変更と、連続回文の削除のどち</text><text class="node-title" x="1006.6666666666667" y="103">らですか？</text><text class="node-explanation" x="1006.6666666666667" y="130">一文字の置換と、現在の列から連続する回文を丸ごと</text><text class="node-explanation" x="1006.6666666666667" y="148">消す操作を区別します。</text></g><g class="flow-node question" data-node="check"><rect x="1124" y="1178" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="1198">質問</text><text class="node-title" x="1140" y="1226">区別したい対象は、回文の文字列の種</text><text class="node-title" x="1140" y="1249">類ですか？</text><text class="node-explanation" x="1140" y="1276">種類と出現回数を混同せず、回文木で何を集計するか</text><text class="node-explanation" x="1140" y="1294">を決めます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="1608" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="1628">分野</text><text class="node-title" x="1140" y="1656">条件を確かめる</text><text class="node-explanation" x="1140" y="1683">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="1711">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="eertree"><rect x="760" y="1608" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="1628">候補</text><text class="node-title" x="776" y="1656">回文木</text><a href="/flowchartcp/techniques/palindromic-tree/"><title>回文木の記事へ</title><text x="776" y="1695">回文木</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1178" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1198">候補</text><text class="node-title" x="412" y="1226">回文の種類・出現・長さを分ける</text><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="412" y="1265">寄与の数え上げ</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1289">状態の設計</text></a></g><g class="flow-node question" data-node="update-hash-permission"><rect x="704" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="720" y="434">質問</text><text class="node-title" x="720" y="462">ハッシュ衝突による、確率的な誤判定</text><text class="node-title" x="720" y="485">を許容できますか？</text><text class="node-explanation" x="720" y="512">正順と逆順のハッシュを区間の長さと一緒に連結しま</text><text class="node-explanation" x="720" y="530">す。複数法や乱数基数は衝突を減らしますが、厳密一</text><text class="node-explanation" x="720" y="548">致を保証しません。</text></g><g class="flow-node question" data-node="update-point-check"><rect x="391.5" y="796" width="320" height="168" rx="7"/><text class="node-kind" x="407.5" y="816">質問</text><text class="node-title" x="407.5" y="844">更新は一文字ずつで、区間を元の左右</text><text class="node-title" x="407.5" y="867">の順序で連結できますか？</text><text class="node-explanation" x="407.5" y="894">正順では右区間の長さで左区間のハッシュの桁位置を</text><text class="node-explanation" x="407.5" y="912">調整し、逆順では逆にします。左右を交換すると値が</text><text class="node-explanation" x="407.5" y="930">変わるため、問い合わせの集計順も保存します。</text></g><g class="flow-node result" data-node="update-hash-result"><rect x="32" y="1178" width="320" height="216" rx="7"/><text class="node-kind" x="48" y="1198">候補</text><text class="node-title" x="48" y="1226">正順・逆順のハッシュと長さを連結</text><text class="node-title" x="48" y="1249">し、一文字の変更を反映する</text><a href="/flowchartcp/techniques/palindrome-update-hash-monoid/"><title>文字更新と区間回文判定を、正順・逆順ハッシュの併合で扱うの記事へ</title><text x="48" y="1288">文字更新と区間回文判定を、正順・逆順ハッシュの</text><text x="48" y="1306">併合で扱う</text></a><a href="/flowchartcp/techniques/rolling-hash/"><title>ローリングハッシュの記事へ</title><text x="48" y="1330">ローリングハッシュ</text></a><a href="/flowchartcp/techniques/segment-tree/"><title>セグメント木の記事へ</title><text x="48" y="1354">セグメント木</text></a></g><g class="flow-node question" data-node="exact-updates-budget"><rect x="1000.5" y="796" width="320" height="168" rx="7"/><text class="node-kind" x="1016.5" y="816">質問</text><text class="node-title" x="1016.5" y="844">変更後に作り直すか、問い合わせ区間</text><text class="node-title" x="1016.5" y="867">を直接比べる総時間が制限内ですか？</text><text class="node-explanation" x="1016.5" y="894">変更のない区間へ静的な比較構造を作る費用と、短い</text><text class="node-explanation" x="1016.5" y="912">区間の両端を直接比べる費用を見積もります。一文字</text><text class="node-explanation" x="1016.5" y="930">の更新だけで静的な構造の値が保たれるとは限りま…</text></g><g class="flow-node result" data-node="exact-updates-result"><rect x="760" y="1178" width="320" height="174" rx="7"/><text class="node-kind" x="776" y="1198">候補</text><text class="node-title" x="776" y="1226">変更を反映した構造か、両端の直接比</text><text class="node-title" x="776" y="1249">較で厳密に判定する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="776" y="1288">状態の設計</text></a><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="776" y="1312">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="palindrome-erasure-route"><rect x="1068" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="1084" y="434">分野</text><text class="node-title" x="1084" y="462">回文削除で、元の境界を一緒に消す</text><a href="/flowchartcp/flowcharts/#diagram-palindrome-erasure-sequence" data-route="palindrome-erasure-sequence"><text x="1084" y="499">詳細の質問・図へ →</text></a></g></svg>