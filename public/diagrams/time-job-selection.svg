<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-time-job-selection flow-desc-time-job-selection" width="1476" height="943" viewBox="0 0 1476 943" data-flow-svg="time-job-selection"><title id="flow-title-time-job-selection">仕事の時刻と処理時間の解法フローチャート</title><desc id="flow-desc-time-job-selection">開始時刻を自由にする仕事と、利用できる時刻の区間、固定時刻の区間を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-time-job-selection" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge deadline-duration" data-edge="timing:deadline-duration:deadline-route"><title>全仕事は時刻 0 から使え、処理時間と完了締切が決まる</title><path d="M642 182 V194 C642 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-time-job-selection)"/><g class="flow-edge-label" data-edge-label="timing:deadline-duration:deadline-route" tabindex="0" role="group" aria-label="選択肢：全仕事は時刻 0 から使え、処理時間と完了締切が決まる"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">全仕事は時刻 0 から使え、処理時</text><text text-anchor="middle" x="192" y="311">間と完了締切が決まる</text></g></g><g class="flow-edge unit-release-expiry" data-edge="timing:unit-release-expiry:unit-route"><title>処理を始められる時刻が区間で決まり、次の処理まで一単位あける</title><path d="M706 182 V194 C706 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-time-job-selection)"/><g class="flow-edge-label" data-edge-label="timing:unit-release-expiry:unit-route" tabindex="0" role="group" aria-label="選択肢：処理を始められる時刻が区間で決まり、次の処理まで一単位あける"><rect x="440" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">処理を始められる時刻が区間で決ま</text><text text-anchor="middle" x="556" y="311">り、次の処理まで一単位あける</text></g></g><g class="flow-edge fixed-intervals" data-edge="timing:fixed-intervals:interval-route"><title>開始と終了が固定された区間を、K 人へ割り当てる</title><path d="M770 182 V194 C770 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-time-job-selection)"/><g class="flow-edge-label" data-edge-label="timing:fixed-intervals:interval-route" tabindex="0" role="group" aria-label="選択肢：開始と終了が固定された区間を、K 人へ割り当てる"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">開始と終了が固定された区間を、K </text><text text-anchor="middle" x="920" y="311">人へ割り当てる</text></g></g><g class="flow-edge unknown" data-edge="timing:unknown:check"><title>わからない</title><path d="M834 182 V194 C834 226 1284 226 1284 258 V270"/><path d="M1284 308 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-time-job-selection)"/><g class="flow-edge-label" data-edge-label="timing:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1204 546 V558 C1204 590 920 590 920 622 V634"/><path d="M920 672 V684 C920 716 920 716 920 748 V760" marker-end="url(#arrow-time-job-selection)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="657">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 546 V558 C1284 590 1271 590 1271 622 V634"/><path d="M1271 672 V684 C1271 716 1230.667 716 1230.667 748 V760" marker-end="url(#arrow-time-job-selection)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 546 V558 C1364 590 1399.5 590 1399.5 622 V634"/><path d="M1399.5 672 V684 C1399.5 716 1337.333 716 1337.333 748 V760" marker-end="url(#arrow-time-job-selection)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="657">わからない</text></g></g><g class="flow-node question" data-node="timing"><rect x="578" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="594" y="52">質問</text><text class="node-title" x="594" y="80">一件の仕事の時間は、どのように指定</text><text class="node-title" x="594" y="103">されますか？</text><text class="node-explanation" x="594" y="130">途中で中断できるか、報酬が同じ一件かも確認しま</text><text class="node-explanation" x="594" y="148">す。</text></g><g class="flow-node route" data-node="deadline-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">締切と異なる処理時間の最多採用</text><a href="/flowchartcp/flowcharts/#diagram-deadline-duration-selection" data-route="deadline-duration-selection"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="unit-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">整数の利用時刻の単位仕事</text><a href="/flowchartcp/flowcharts/#diagram-unit-release-expiry-selection" data-route="unit-release-expiry-selection"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="interval-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">固定区間を K 人へ割り当てる</text><a href="/flowchartcp/flowcharts/#diagram-interval-k-resources" data-route="interval-k-resources"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1124" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="1140" y="434">質問</text><text class="node-title" x="1140" y="462">必要な条件を、問題文と小さい例から</text><text class="node-title" x="1140" y="485">確認できますか？</text><text class="node-explanation" x="1140" y="512">時間、順番、使える回数と目的値を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="760" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="776" y="780">候補</text><text class="node-title" x="776" y="808">条件と選び方をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="776" y="847">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="776" y="871">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="760" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="780">分野</text><text class="node-title" x="1140" y="808">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="845">詳細の質問・図へ →</text></a></g></svg>