<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-grid-arrangements flow-desc-grid-arrangements" width="1476" height="938" viewBox="0 0 1476 938" data-flow-svg="grid-arrangements"><title id="flow-title-grid-arrangements">格子の配置・被覆・経路の解法フローチャート</title><desc id="flow-desc-grid-arrangements">隣接した組、行と列の資源、通路の被覆、盤面全体の敷き詰めを分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-grid-arrangements" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge pairing-cover" data-edge="goal:pairing-cover:pairing-cover-route"><title>隣接する組・駒・通路・タイルでマスを覆う</title><path d="M642 159 V171 C642 203 192 203 192 235 V247"/><path d="M192 303 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-grid-arrangements)"/><g class="flow-edge-label" data-edge-label="goal:pairing-cover:pairing-cover-route" tabindex="0" role="group" aria-label="選択肢：隣接する組・駒・通路・タイルでマスを覆う"><rect x="69.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="270">隣接する組・駒・通路・タイルでマス</text><text text-anchor="middle" x="192" y="288">を覆う</text></g></g><g class="flow-edge movement-cycles" data-edge="goal:movement-cycles:movement-cycles-route"><title>経路・収集・全ての使用マスを通る一つの閉路</title><path d="M706 159 V171 C706 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-grid-arrangements)"/><g class="flow-edge-label" data-edge-label="goal:movement-cycles:movement-cycles-route" tabindex="0" role="group" aria-label="選択肢：経路・収集・全ての使用マスを通る一つの閉路"><rect x="433.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">経路・収集・全ての使用マスを通る一</text><text text-anchor="middle" x="556" y="288">つの閉路</text></g></g><g class="flow-edge color-numbers" data-edge="goal:color-numbers:color-numbers-route"><title>色や数を置く条件・選んだマスの外接長方形</title><path d="M770 159 V171 C770 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-grid-arrangements)"/><g class="flow-edge-label" data-edge-label="goal:color-numbers:color-numbers-route" tabindex="0" role="group" aria-label="選択肢：色や数を置く条件・選んだマスの外接長方形"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">色や数を置く条件・選んだマスの外接</text><text text-anchor="middle" x="920" y="288">長方形</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M834 159 V171 C834 203 1284 203 1284 235 V247"/><path d="M1284 285 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-grid-arrangements)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1204 541 V553 C1204 585 920 585 920 617 V629"/><path d="M920 667 V679 C920 711 920 711 920 743 V755" marker-end="url(#arrow-grid-arrangements)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="652">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 541 V553 C1284 585 1271 585 1271 617 V629"/><path d="M1271 667 V679 C1271 711 1230.667 711 1230.667 743 V755" marker-end="url(#arrow-grid-arrangements)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 541 V553 C1364 585 1399.5 585 1399.5 617 V629"/><path d="M1399.5 667 V679 C1399.5 711 1337.333 711 1337.333 743 V755" marker-end="url(#arrow-grid-arrangements)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="578" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="594" y="52">質問</text><text class="node-title" x="594" y="80">格子で何を求めますか？</text><text class="node-explanation" x="594" y="107">置く対象の大きさ、全てのマスを覆う必要、移動方向</text><text class="node-explanation" x="594" y="125">と経路の条件を選びます。</text></g><g class="flow-node question" data-node="check"><rect x="1124" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="411">質問</text><text class="node-title" x="1140" y="439">合法な選択と、選ぶ回数・費用の条件</text><text class="node-title" x="1140" y="462">を一つずつ確かめられますか？</text><text class="node-explanation" x="1140" y="489">一対象を何回使えるか、必ず選ぶ対象があるか、経路</text><text class="node-explanation" x="1140" y="507">はどこまで共用できるかを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="760" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="776" y="775">候補</text><text class="node-title" x="776" y="803">選択の条件と目的値を整理する</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="776" y="842">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="776" y="866">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="775">分野</text><text class="node-title" x="1140" y="803">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="pairing-cover-route"><rect x="32" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">格子の組合せと被覆</text><a href="/flowchartcp/flowcharts/#diagram-grid-pairing-cover" data-route="grid-pairing-cover"><text x="48" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="movement-cycles-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">格子の経路と一つの閉路</text><a href="/flowchartcp/flowcharts/#diagram-grid-movement-cycles" data-route="grid-movement-cycles"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="color-numbers-route"><rect x="760" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">格子の色・数・外接長方形</text><a href="/flowchartcp/flowcharts/#diagram-grid-color-numbers" data-route="grid-color-numbers"><text x="776" y="476">詳細の質問・図へ →</text></a></g></svg>