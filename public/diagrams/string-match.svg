<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-string-match flow-desc-string-match" width="1476" height="949" viewBox="0 0 1476 949" data-flow-svg="string-match"><title id="flow-title-string-match">文字列の一致の解法フローチャート</title><desc id="flow-desc-string-match">接頭辞比較と、任意区間の繰り返し比較を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-string-match" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge prefix-relations" data-edge="prefix:prefix-relations:prefix-relations-route"><title>接頭辞の一致・接尾辞との関係・接頭辞の連結</title><path d="M642 182 V194 C642 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-string-match)"/><g class="flow-edge-label" data-edge-label="prefix:prefix-relations:prefix-relations-route" tabindex="0" role="group" aria-label="選択肢：接頭辞の一致・接尾辞との関係・接頭辞の連結"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">接頭辞の一致・接尾辞との関係・接頭</text><text text-anchor="middle" x="192" y="311">辞の連結</text></g></g><g class="flow-edge occurrence-queries" data-edge="prefix:occurrence-queries:occurrence-queries-route"><title>本文中の語の出現・区間の比較</title><path d="M706 182 V194 C706 226 556 226 556 258 V270"/><path d="M556 308 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-string-match)"/><g class="flow-edge-label" data-edge-label="prefix:occurrence-queries:occurrence-queries-route" tabindex="0" role="group" aria-label="選択肢：本文中の語の出現・区間の比較"><rect x="453" y="270" width="206" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">本文中の語の出現・区間の比較</text></g></g><g class="flow-edge transformed-inputs" data-edge="prefix:transformed-inputs:transformed-inputs-route"><title>任意の文字を許す位置・連結境界・周期表示</title><path d="M770 182 V194 C770 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-string-match)"/><g class="flow-edge-label" data-edge-label="prefix:transformed-inputs:transformed-inputs-route" tabindex="0" role="group" aria-label="選択肢：任意の文字を許す位置・連結境界・周期表示"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">任意の文字を許す位置・連結境界・周</text><text text-anchor="middle" x="920" y="311">期表示</text></g></g><g class="flow-edge unknown" data-edge="prefix:unknown:check"><title>わからない</title><path d="M834 182 V194 C834 226 1284 226 1284 258 V270"/><path d="M1284 308 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-string-match)"/><g class="flow-edge-label" data-edge-label="prefix:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:z"><title>はい</title><path d="M1204 564 V576 C1204 608 920 608 920 640 V652"/><path d="M920 690 V702 C920 734 920 734 920 766 V778" marker-end="url(#arrow-string-match)"/><g class="flow-edge-label" data-edge-label="check:yes:z" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="675">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 564 V576 C1284 608 1271 608 1271 640 V652"/><path d="M1271 690 V702 C1271 734 1230.667 734 1230.667 766 V778" marker-end="url(#arrow-string-match)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 564 V576 C1364 608 1399.5 608 1399.5 640 V652"/><path d="M1399.5 690 V702 C1399.5 734 1337.333 734 1337.333 766 V778" marker-end="url(#arrow-string-match)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="675">わからない</text></g></g><g class="flow-node question" data-node="prefix"><rect x="578" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="594" y="52">質問</text><text class="node-title" x="594" y="80">比較したい文字列の関係はどれです</text><text class="node-title" x="594" y="103">か？</text><text class="node-explanation" x="594" y="130">接頭辞・接尾辞・周期、通常の一致、複数の語を分け</text><text class="node-explanation" x="594" y="148">ます。</text></g><g class="flow-node question" data-node="check"><rect x="1124" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="434">質問</text><text class="node-title" x="1140" y="462">比較対象の片方を、同じ接頭辞として</text><text class="node-title" x="1140" y="485">固定できますか？</text><text class="node-explanation" x="1140" y="512">接頭辞を固定できるなら Z 配列で線形時間の比較</text><text class="node-explanation" x="1140" y="530">を考えます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="778" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="798">分野</text><text class="node-title" x="1140" y="826">条件を確かめる</text><text class="node-explanation" x="1140" y="853">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="z"><rect x="760" y="778" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="798">候補</text><text class="node-title" x="776" y="826">Z アルゴリズム</text><a href="/flowchartcp/techniques/z-algorithm/"><title>Zアルゴリズムの記事へ</title><text x="776" y="865">Zアルゴリズム</text></a></g><g class="flow-node route" data-node="prefix-relations-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">接頭辞の一致と連結</text><a href="/flowchartcp/flowcharts/#diagram-string-match-prefix-goals" data-route="string-match-prefix-goals"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="occurrence-queries-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">本文中の語の出現・区間の比較</text><a href="/flowchartcp/flowcharts/#diagram-string-match-occurrence-goals" data-route="string-match-occurrence-goals"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="transformed-inputs-route"><rect x="760" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">任意の文字を許す位置・連結境界・周</text><text class="node-title" x="776" y="485">期表示</text><a href="/flowchartcp/flowcharts/#diagram-string-match-transformed-inputs" data-route="string-match-transformed-inputs"><text x="776" y="522">詳細の質問・図へ →</text></a></g></svg>