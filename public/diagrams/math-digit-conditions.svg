67 V679 C2127.5 711 1749.556 711 1749.556 743 V755" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="threshold:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2083" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="2127.5" y="652">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1669.556 905 V941 C1669.556 973 1265.556 973 1265.556 1005 V1017"/><path d="M1265.556 1055 V1067 C1265.556 1099 1199.556 1099 1199.556 1131 V1143" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1225.5555555555557" y="1017" width="80" height="38" rx="5"/><text text-anchor="middle" x="1265.5555555555557" y="1040">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1749.556 905 V941 C1749.556 973 1594.917 973 1594.917 1005 V1017"/><path d="M1594.917 1055 V1067 C1594.917 1099 1541.583 1099 1541.583 1131 V1143" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1554.9166666666667" y="1017" width="80" height="38" rx="5"/><text text-anchor="middle" x="1594.9166666666667" y="1040">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1829.556 905 V941 C1829.556 973 1723.417 973 1723.417 1005 V1017"/><path d="M1723.417 1055 V1067 C1723.417 1099 1648.25 1099 1648.25 1131 V1143" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1678.9166666666667" y="1017" width="89" height="38" rx="5"/><text text-anchor="middle" x="1723.4166666666667" y="1040">わからない</text></g></g><g class="flow-edge yes" data-edge="digit-residue-check:yes:digit-residue-result"><title>はい</title><path d="M476 541 V553 C476 585 556 585 556 617 V629"/><path d="M556 667 V679 C556 711 556 711 556 743 V755" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="digit-residue-check:yes:digit-residue-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="652">はい</text></g></g><g class="flow-edge no" data-edge="digit-residue-check:no:fallback"><title>いいえ</title><path d="M556 541 V553 C556 585 1119.556 585 1119.556 617 V629"/><path d="M1119.556 667 V679 C1119.556 711 1119.556 711 1119.556 743 V755 V941 C1119.556 973 1119.556 973 1119.556 1005 V1017 V1067 C1119.556 1099 1039.556 1099 1039.556 1131 V1143" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="digit-residue-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1079.5555555555557" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1119.5555555555557" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="digit-residue-check:unknown:check"><title>わからない</title><path d="M636 541 V553 C636 585 1746.5 585 1746.5 617 V629"/><path d="M1746.5 667 V679 C1746.5 711 1669.556 711 1669.556 743 V755" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="digit-residue-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1702" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="1746.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="digits"><rect x="1090.857142857143" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1106.857142857143" y="52">質問</text><text class="node-title" x="1106.857142857143" y="80">整数の桁の条件はどれですか？</text><text class="node-explanation" x="1106.857142857143" y="107">上限の接頭辞との一致だけでなく、次の桁を決めるの</text><text class="node-explanation" x="1106.857142857143" y="125">に必要な情報を選びます。</text></g><g class="flow-node question" data-node="threshold"><rect x="760" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="411">質問</text><text class="node-title" x="776" y="439">数値の候補を固定すると、判定問題へ</text><text class="node-title" x="776" y="462">変えられますか？</text><text class="node-explanation" x="776" y="489">候補が増えると可能性が一方向に変わることを確認し</text><text class="node-explanation" x="776" y="507">ます。</text></g><g class="flow-node question" data-node="check"><rect x="1589.5555555555557" y="755" width="320" height="150" rx="7"/><text class="node-kind" x="1605.5555555555557" y="775">質問</text><text class="node-title" x="1605.5555555555557" y="803">答えは「個数」「最適値」「存在判</text><text class="node-title" x="1605.5555555555557" y="826">定」のどれか区別できますか？</text><text class="node-explanation" x="1605.5555555555557" y="853">同じ入力でも、求める量によって使う演算が異なりま</text><text class="node-explanation" x="1605.5555555555557" y="871">す。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1434.9166666666667" y="1143" width="320" height="139" rx="7"/><text class="node-kind" x="1450.9166666666667" y="1163">分野</text><text class="node-title" x="1450.9166666666667" y="1191">条件を確かめる</text><text class="node-explanation" x="1450.9166666666667" y="1218">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1450.9166666666667" y="1246">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="digit-result"><rect x="32" y="391" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="411">候補</text><text class="node-title" x="48" y="439">桁 DP</text><a href="/flowchartcp/techniques/digit-dp/"><title>桁DPの記事へ</title><text x="48" y="478">桁DP</text></a></g><g class="flow-node result" data-node="binary-result"><rect x="1169.5555555555557" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="1185.5555555555557" y="775">候補</text><text class="node-title" x="1185.5555555555557" y="803">答えの二分探索</text><a href="/flowchartcp/techniques/binary-search/"><title>二分探索の記事へ</title><text x="1185.5555555555557" y="842">二分探索</text></a></g><g class="flow-node result" data-node="fallback"><rect x="959.5555555555557" y="1143" width="320" height="151" rx="7"/><text class="node-kind" x="975.5555555555557" y="1163">候補</text><text class="node-title" x="975.5555555555557" y="1191">求める量を式にする</text><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="975.5555555555557" y="1230">寄与の数え上げ</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="975.5555555555557" y="1254">状態の設計</text></a></g><g class="flow-node question" data-node="digit-residue-check"><rect x="396" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="411">質問</text><text class="node-title" x="412" y="439">上限との大小と桁和の余りを覚えれ</text><text class="node-title" x="412" y="462">ば、残りの条件が決まりますか？</text><text class="node-explanation" x="412" y="489">先頭のゼロは桁和を変えません。正整数だけなら、す</text><text class="node-explanation" x="412" y="507">べての桁が 0 の列を最後に除きます。</text></g><g class="flow-node result" data-node="digit-residue-result"><rect x="396" y="755" width="320" height="174" rx="7"/><text class="node-kind" x="412" y="775">候補</text><text class="node-title" x="412" y="803">上限の接頭辞との一致と、桁和の余り</text><text class="node-title" x="412" y="826">を持って数字を選ぶ</text><a href="/flowchartcp/techniques/digit-sum-residue-dp/"><title>桁和の条件は合計でなく余りだけを持つの記事へ</title><text x="412" y="865">桁和の条件は合計でなく余りだけを持つ</text></a><a href="/flowchartcp/techniques/digit-dp/"><title>桁DPの記事へ</title><text x="412" y="889">桁DP</text></a></g><g class="flow-node route" data-node="required-digits-route"><rect x="1124" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">数字の出現条件と整数の総和</text><a href="/flowchartcp/flowcharts/#diagram-digit-required-values" data-route="digit-required-values"><text x="1140" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="rank-sum-route"><rect x="1488" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">桁数ごとの順位の総和</text><a href="/flowchartcp/flowcharts/#diagram-decimal-length-rank-total" data-route="decimal-length-rank-total"><text x="1504" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="substring-divisibility-route"><rect x="1852" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1868" y="411">分野</text><text class="node-title" x="1868" y="439">十進部分文字列の可除性</text><a href="/flowchartcp/flowcharts/#diagram-decimal-substring-remainders" data-route="decimal-substring-remainders"><text x="1868" y="476">詳細の質問・図へ →</text></a></g></svg>