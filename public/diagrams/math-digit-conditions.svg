<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-math-digit-conditions flow-desc-math-digit-conditions" width="2260" height="1326" viewBox="0 0 2260 1326" data-flow-svg="math-digit-conditions"><title id="flow-title-math-digit-conditions">整数の桁と上限の条件の解法フローチャート</title><desc id="flow-desc-math-digit-conditions">桁の出現条件、桁和の余り、整数の総和、十進区間の可除性を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-math-digit-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="digits:yes:digit-result"><title>数字の出現・大小など一般の桁の条件</title><path d="M1130.857 159 V171 C1130.857 203 192 203 192 235 V247"/><path d="M192 285 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="digits:yes:digit-result" tabindex="0" role="group" aria-label="選択肢：数字の出現・大小など一般の桁の条件"><rect x="69.5" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="192" y="270">数字の出現・大小など一般の桁の条件</text></g></g><g class="flow-edge sum-residue" data-edge="digits:sum-residue:digit-residue-check"><title>上限以下で、桁の和の余りを指定する</title><path d="M1170.857 159 V171 C1170.857 203 556 203 556 235 V247"/><path d="M556 285 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="digits:sum-residue:digit-residue-check" tabindex="0" role="group" aria-label="選択肢：上限以下で、桁の和の余りを指定する"><rect x="433.5" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="556" y="270">上限以下で、桁の和の余りを指定する</text></g></g><g class="flow-edge no" data-edge="digits:no:threshold"><title>桁以外の数値の最適値・存在条件</title><path d="M1210.857 159 V171 C1210.857 203 920 203 920 235 V247"/><path d="M920 285 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="digits:no:threshold" tabindex="0" role="group" aria-label="選択肢：桁以外の数値の最適値・存在条件"><rect x="810.5" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="920" y="270">桁以外の数値の最適値・存在条件</text></g></g><g class="flow-edge required-sum" data-edge="digits:required-sum:required-digits-route"><title>指定の全数字を含む、上限以下の正整数の総和</title><path d="M1250.857 159 V171 C1250.857 203 1284 203 1284 235 V247"/><path d="M1284 303 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="digits:required-sum:required-digits-route" tabindex="0" role="group" aria-label="選択肢：指定の全数字を含む、上限以下の正整数の総和"><rect x="1161.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="270">指定の全数字を含む、上限以下の正整</text><text text-anchor="middle" x="1284" y="288">数の総和</text></g></g><g class="flow-edge digit-rank-sum" data-edge="digits:digit-rank-sum:rank-sum-route"><title>同じ桁数の正整数内の順位を、上限まで足す</title><path d="M1290.857 159 V171 C1290.857 203 1648 203 1648 235 V247"/><path d="M1648 303 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="digits:digit-rank-sum:rank-sum-route" tabindex="0" role="group" aria-label="選択肢：同じ桁数の正整数内の順位を、上限まで足す"><rect x="1525.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="270">同じ桁数の正整数内の順位を、上限ま</text><text text-anchor="middle" x="1648" y="288">で足す</text></g></g><g class="flow-edge substring-divisible" data-edge="digits:substring-divisible:substring-divisibility-route"><title>十進数字列の、指定数で割り切れる位置区間の個数</title><path d="M1330.857 159 V171 C1330.857 203 1972.5 203 1972.5 235 V247"/><path d="M1972.5 303 V315 C1972.5 347 2012 347 2012 379 V391" marker-end="url(#arrow-math-digit-conditions)"/><g class="flow-edge-label" data-edge-label="digits:substring-divisible:substring-divisibility-route" tabindex="0" role="group" aria-label="選択肢：十進数字列の、指定数で割り切れる位置区間の個数"><rect x="18