<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-static flow-desc-range-static" width="1896" height="1673" viewBox="0 0 1896 1673" data-flow-svg="range-static"><title id="flow-title-range-static">値が変わらない区間の集計の解法フローチャート</title><desc id="flow-desc-range-static">区間集計の演算と、問い合わせの形式を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-static" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="invert:yes:prefix"><title>はい</title><path d="M840 541 V553 C840 585 598 585 598 617 V629"/><path d="M598 667 V679 C598 711 598 711 598 743 V755 V918 C598 950 766 950 766 982 V994 V1044 C766 1076 766 1076 766 1108 V1120 V1300 C766 1332 1067 1332 1067 1364 V1376 V1426 C1067 1458 1013.667 1458 1013.667 1490 V1502" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="invert:yes:prefix" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="558" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="598" y="652">はい</text></g></g><g class="flow-edge no" data-edge="invert:no:all-update"><title>いいえ</title><path d="M920 541 V553 C920 585 808 585 808 617 V629"/><path d="M808 667 V679 C808 711 808 711 808 743 V755" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="invert:no:all-update" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="768" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="808" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="invert:unknown:check"><title>わからない</title><path d="M1000 541 V553 C1000 585 1018 585 1018 617 V629"/><path d="M1018 667 V679 C1018 711 1018 711 1018 743 V755 V918 C1018 950 1746 950 1746 982 V994 V1044 C1746 1076 1672 1076 1672 1108 V1120" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="invert:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="973.5" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="1018" y="652">わからない</text></g></g><g class="flow-edge yes" data-edge="all-update:yes:difference"><title>はい</title><path d="M728 887 V918 C728 950 976 950 976 982 V994"/><path d="M976 1032 V1044 C976 1076 976 1076 976 1108 V1120" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="all-update:yes:difference" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="936" y="994" width="80" height="38" rx="5"/><text text-anchor="middle" x="976" y="1017">はい</text></g></g><g class="flow-edge no" data-edge="all-update:no:assoc"><title>いいえ</title><path d="M808 887 V918 C808 950 1340 950 1340 982 V994"/><path d="M1340 1032 V1044 C1340 1076 1340 1076 1340 1108 V1120" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="all-update:no:assoc" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1300" y="994" width="80" height="38" rx="5"/><text text-anchor="middle" x="1340" y="1017">いいえ</text></g></g><g class="flow-edge unknown" data-edge="all-update:unknown:check"><title>わからない</title><path d="M888 887 V918 C888 950 1651.5 950 1651.5 982 V994"/><path d="M1651.5 1032 V1044 C1651.5 1076 1608 1076 1608 1108 V1120" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="all-update:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1607" y="994" width="89" height="38" rx="5"/><text text-anchor="middle" x="1651.5" y="1017">わからない</text></g></g><g class="flow-edge yes" data-edge="recursive:yes:doubling"><title>はい</title><path d="M1204 523 V553 C1204 585 1228 585 1228 617 V629"/><path d="M1228 667 V679 C1228 711 1228 711 1228 743 V755" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="recursive:yes:doubling" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1188" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1228" y="652">はい</text></g></g><g class="flow-edge no" data-edge="recursive:no:fallback"><title>いいえ</title><path d="M1284 523 V553 C1284 585 1592 585 1592 617 V629"/><path d="M1592 667 V679 C1592 711 1592 711 1592 743 V755" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="recursive:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1552" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1592" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="recursive:unknown:check"><title>わからない</title><path d="M1364 523 V553 C1364 585 1763.5 585 1763.5 617 V629"/><path d="M1763.5 667 V679 C1763.5 711 1802 711 1802 743 V755 V918 C1802 950 1802 950 1802 982 V994 V1044 C1802 1076 1736 1076 1736 1108 V1120" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="recursive:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1719" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="1763.5" y="652">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:prefix"><title>はい</title><path d="M1624 1288 V1300 C1624 1332 1157 1332 1157 1364 V1376"/><path d="M1157 1414 V1426 C1157 1458 1120.333 1458 1120.333 1490 V1502" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="check:yes:prefix" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1117" y="1376" width="80" height="38" rx="5"/><text text-anchor="middle" x="1157" y="1399">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1704 1288 V1300 C1704 1332 1691 1332 1691 1364 V1376"/><path d="M1691 1414 V1426 C1691 1458 1650.667 1458 1650.667 1490 V1502" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1651" y="1376" width="80" height="38" rx="5"/><text text-anchor="middle" x="1691" y="1399">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1784 1288 V1300 C1784 1332 1819.5 1332 1819.5 1364 V1376"/><path d="M1819.5 1414 V1426 C1819.5 1458 1757.333 1458 1757.333 1490 V1502" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1775" y="1376" width="89" height="38" rx="5"/><text text-anchor="middle" x="1819.5" y="1399">わからない</text></g></g><g class="flow-edge occurrence-goals" data-edge="kind:occurrence-goals:occurrence-goals-route"><title>値の出現・区間内の順位・条件を満たす部分列数</title><path d="M949.048 141 V153 C949.048 185 192 185 192 217 V229"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="kind:occurrence-goals:occurrence-goals-route" tabindex="0" role="group" aria-label="選択肢：値の出現・区間内の順位・条件を満たす部分列数"><rect x="69.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="252">値の出現・区間内の順位・条件を満た</text><text text-anchor="middle" x="192" y="270">す部分列数</text></g></g><g class="flow-edge aggregate-forms" data-edge="kind:aggregate-forms:aggregate-forms-route"><title>最小最大・並べ替えた一致・全加算後の値</title><path d="M994.762 141 V153 C994.762 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="kind:aggregate-forms:aggregate-forms-route" tabindex="0" role="group" aria-label="選択肢：最小最大・並べ替えた一致・全加算後の値"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">最小最大・並べ替えた一致・全加算後</text><text text-anchor="middle" x="556" y="270">の値</text></g></g><g class="flow-edge sum" data-edge="kind:sum:invert"><title>指定区間の和・XOR</title><path d="M1040.476 141 V153 C1040.476 185 920 185 920 217 V229"/><path d="M920 267 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="kind:sum:invert" tabindex="0" role="group" aria-label="選択肢：指定区間の和・XOR"><rect x="843" y="229" width="154" height="38" rx="5"/><text text-anchor="middle" x="920" y="252">指定区間の和・XOR</text></g></g><g class="flow-edge iterate" data-edge="kind:iterate:recursive"><title>同じ移動を K 回繰り返した位置</title><path d="M1086.19 141 V153 C1086.19 185 1284 185 1284 217 V229"/><path d="M1284 267 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="kind:iterate:recursive" tabindex="0" role="group" aria-label="選択肢：同じ移動を K 回繰り返した位置"><rect x="1168" y="229" width="232" height="38" rx="5"/><text text-anchor="middle" x="1284" y="252">同じ移動を K 回繰り返した位置</text></g></g><g class="flow-edge paint-strokes" data-edge="kind:paint-strokes:paint-strokes-route"><title>薄い色へ戻せない区間塗装で、指定区間の最小筆数を求める</title><path d="M1131.905 141 V153 C1131.905 185 1608.5 185 1608.5 217 V229"/><path d="M1608.5 285 V297 C1608.5 329 1648 329 1648 361 V373" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="kind:paint-strokes:paint-strokes-route" tabindex="0" role="group" aria-label="選択肢：薄い色へ戻せない区間塗装で、指定区間の最小筆数を求める"><rect x="1486" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1608.5" y="252">薄い色へ戻せない区間塗装で、指定区</text><text text-anchor="middle" x="1608.5" y="270">間の最小筆数を求める</text></g></g><g class="flow-edge unknown" data-edge="kind:unknown:check"><title>わからない</title><path d="M1177.619 141 V153 C1177.619 185 1819.5 185 1819.5 217 V229"/><path d="M1819.5 267 V297 C1819.5 329 1858 329 1858 361 V373 V553 C1858 585 1858 585 1858 617 V629 V679 C1858 711 1858 711 1858 743 V755 V918 C1858 950 1858 950 1858 982 V994 V1044 C1858 1076 1800 1076 1800 1108 V1120" marker-end="url(#arrow-range-static)"/><g class="flow-edge-label" data-edge-label="kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1775" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1819.5" y="252">わからない</text></g></g><g class="flow-node question" data-node="invert"><rect x="760" y="373" width="320" height="168" rx="7"/><text class="node-kind" x="776" y="393">質問</text><text class="node-title" x="776" y="421">区間の答えを、二つの接頭辞の差や逆</text><text class="node-title" x="776" y="444">演算で求められますか？</text><text class="node-explanation" x="776" y="471">和なら prefix[r]-prefix[l]、</text><text class="node-explanation" x="776" y="489">XOR なら prefix[r]^prefix</text><text class="node-explanation" x="776" y="507">[l] です。区間最小値は同じ方法では求まりま…</text></g><g class="flow-node question" data-node="all-update"><rect x="648" y="755" width="320" height="132" rx="7"/><text class="node-kind" x="664" y="775">質問</text><text class="node-title" x="664" y="803">すべての区間加算を終えた後の配列だ</text><text class="node-title" x="664" y="826">けが必要ですか？</text><text class="node-explanation" x="664" y="853">更新と問い合わせが交互に現れない場合に使います。</text></g><g class="flow-node route" data-node="assoc"><rect x="1180" y="1120" width="320" height="121" rx="7"/><text class="node-kind" x="1196" y="1140">分野</text><text class="node-title" x="1196" y="1168">区間の結合と値・移動の条件</text><a href="/flowchartcp/flowcharts/#diagram-range-static-combination" data-route="range-static-combination"><text x="1196" y="1205">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="recursive"><rect x="1124" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="393">質問</text><text class="node-title" x="1140" y="421">同じ操作を何度も繰り返した到達先を</text><text class="node-title" x="1140" y="444">求めますか？</text><text class="node-explanation" x="1140" y="471">次の位置が一意に決まり、繰り返し回数が大きい場合</text><text class="node-explanation" x="1140" y="489">を考えます。</text></g><g class="flow-node question" data-node="check"><rect x="1544" y="1120" width="320" height="168" rx="7"/><text class="node-kind" x="1560" y="1140">質問</text><text class="node-title" x="1560" y="1168">集計の演算に、接頭辞の不要な部分を</text><text class="node-title" x="1560" y="1191">消す逆演算がありますか？</text><text class="node-explanation" x="1560" y="1218">整数の和や XOR ならあります。min・max</text><text class="node-explanation" x="1560" y="1236"> には一般にありません。未確認なら候補を断定しま</text><text class="node-explanation" x="1560" y="1254">せん。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1544" y="1502" width="320" height="139" rx="7"/><text class="node-kind" x="1560" y="1522">分野</text><text class="node-title" x="1560" y="1550">条件を確かめる</text><text class="node-explanation" x="1560" y="1577">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1560" y="1605">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="prefix"><rect x="907" y="1502" width="320" height="127" rx="7"/><text class="node-kind" x="923" y="1522">候補</text><text class="node-title" x="923" y="1550">累積和・接頭辞 XOR</text><a href="/flowchartcp/techniques/prefix-sum/"><title>累積和の記事へ</title><text x="923" y="1589">累積和</text></a></g><g class="flow-node result" data-node="difference"><rect x="816" y="1120" width="320" height="127" rx="7"/><text class="node-kind" x="832" y="1140">候補</text><text class="node-title" x="832" y="1168">差分配列</text><a href="/flowchartcp/techniques/difference-array/"><title>いもす法の記事へ</title><text x="832" y="1207">いもす法</text></a></g><g class="flow-node result" data-node="doubling"><rect x="1068" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="1084" y="775">候補</text><text class="node-title" x="1084" y="803">ダブリング</text><a href="/flowchartcp/techniques/doubling/"><title>ダブリングの記事へ</title><text x="1084" y="842">ダブリング</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1432" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="1448" y="775">候補</text><text class="node-title" x="1448" y="803">集計する情報を見直す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1448" y="842">状態の設計</text></a><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="1448" y="866">寄与の数え上げ</text></a></g><g class="flow-node question" data-node="kind"><rect x="903.3333333333333" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="919.3333333333333" y="52">質問</text><text class="node-title" x="919.3333333333333" y="80">変わらない配列から何を求めますか？</text><text class="node-explanation" x="919.3333333333333" y="107">演算の性質は、具体的な集計内容から確かめます。</text></g><g class="flow-node route" data-node="occurrence-goals-route"><rect x="32" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">固定区間の出現回数・順位・部分列数</text><a href="/flowchartcp/flowcharts/#diagram-range-static-occurrence-goals" data-route="range-static-occurrence-goals"><text x="48" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="aggregate-forms-route"><rect x="396" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">固定区間の最小最大・値の一致・最終</text><text class="node-title" x="412" y="444">値</text><a href="/flowchartcp/flowcharts/#diagram-range-static-aggregate-forms" data-route="range-static-aggregate-forms"><text x="412" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="paint-strokes-route"><rect x="1488" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">薄い色へ戻せない区間塗装で、指定区</text><text class="node-title" x="1504" y="444">間の最小筆数を求める</text><a href="/flowchartcp/flowcharts/#diagram-monotone-paint-stroke-conditions" data-route="monotone-paint-stroke-conditions"><text x="1504" y="481">詳細の質問・図へ →</text></a></g></svg>