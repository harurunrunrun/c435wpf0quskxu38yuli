<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-singleton-witness flow-desc-range-singleton-witness" width="860" height="1366" viewBox="0 0 860 1366" data-flow-svg="range-singleton-witness"><title id="flow-title-range-singleton-witness">固定区間の一度だけ現れる値の解法フローチャート</title><desc id="flow-desc-range-singleton-witness">右端を進め、各値の最新位置に直前位置を残します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-singleton-witness" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="offline:yes:latest"><title>はい</title><path d="M539.722 200 V212 C539.722 244 420.667 244 420.667 276 V288"/><path d="M420.667 326 V338 C420.667 370 420.667 370 420.667 402 V414" marker-end="url(#arrow-range-singleton-witness)"/><g class="flow-edge-label" data-edge-label="offline:yes:latest" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="311">はい</text></g></g><g class="flow-edge no" data-edge="offline:no:fallback"><title>いいえ</title><path d="M619.722 200 V212 C619.722 244 655 244 655 276 V288"/><path d="M655 326 V338 C655 370 762.5 370 762.5 402 V414 V599 C762.5 631 762.5 631 762.5 663 V675 V725 C762.5 757 458 757 458 789 V801 V981 C458 1013 360 1013 360 1045 V1057 V1107 C360 1139 304 1139 304 1171 V1183" marker-end="url(#arrow-range-singleton-witness)"/><g class="flow-edge-label" data-edge-label="offline:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="offline:unknown:check"><title>わからない</title><path d="M699.722 200 V212 C699.722 244 783.5 244 783.5 276 V288"/><path d="M783.5 326 V338 C783.5 370 818.5 370 818.5 402 V414 V599 C818.5 631 818.5 631 818.5 663 V675 V725 C818.5 757 721.333 757 721.333 789 V801" marker-end="url(#arrow-range-singleton-witness)"/><g class="flow-edge-label" data-edge-label="offline:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="latest:yes:witness-result"><title>はい</title><path d="M340.667 587 V599 C340.667 631 192 631 192 663 V675"/><path d="M192 713 V725 C192 757 192 757 192 789 V801" marker-end="url(#arrow-range-singleton-witness)"/><g class="flow-edge-label" data-edge-label="latest:yes:witness-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="698">はい</text></g></g><g class="flow-edge no" data-edge="latest:no:fallback"><title>いいえ</title><path d="M420.667 587 V599 C420.667 631 402 631 402 663 V675"/><path d="M402 713 V725 C402 757 402 757 402 789 V801 V981 C402 1013 304 1013 304 1045 V1057 V1107 C304 1139 224 1139 224 1171 V1183" marker-end="url(#arrow-range-singleton-witness)"/><g class="flow-edge-label" data-edge-label="latest:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="latest:unknown:check"><title>わからない</title><path d="M500.667 587 V599 C500.667 631 668 631 668 663 V675"/><path d="M668 713 V725 C668 757 614.667 757 614.667 789 V801" marker-end="url(#arrow-range-singleton-witness)"/><g class="flow-edge-label" data-edge-label="latest:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 933 V981 C588 1013 450 1013 450 1045 V1057"/><path d="M450 1095 V1107 C450 1139 384 1139 384 1171 V1183" marker-end="url(#arrow-range-singleton-witness)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 933 V981 C668 1013 655 1013 655 1045 V1057"/><path d="M655 1095 V1107 C655 1139 614.667 1139 614.667 1171 V1183" marker-end="url(#arrow-range-singleton-witness)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 933 V981 C748 1013 783.5 1013 783.5 1045 V1057"/><path d="M783.5 1095 V1107 C783.5 1139 721.333 1139 721.333 1171 V1183" marker-end="url(#arrow-range-singleton-witness)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="offline"><rect x="459.7222222222223" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">数列は固定で、全ての区間の問い合わ</text><text class="node-title" x="475.7222222222223" y="103">せを先に読めますか？</text><text class="node-explanation" x="475.7222222222223" y="130">求めるのは、一度だけ現れる値を任意に一つです。値</text><text class="node-explanation" x="475.7222222222223" y="148">の最小値や種類数とは分け、質問の右端まで要素を入</text><text class="node-explanation" x="475.7222222222223" y="166">れて元の順へ答えを戻します。</text></g><g class="flow-node question" data-node="latest"><rect x="260.6666666666667" y="414" width="320" height="173" rx="7"/><text class="node-kind" x="276.6666666666667" y="434">質問</text><text class="node-title" x="276.6666666666667" y="462">同じ値の古い最新位置を消し、新しい</text><text class="node-title" x="276.6666666666667" y="485">最新位置に直前位置を記録できます</text><text class="node-title" x="276.6666666666667" y="508">か？</text><text class="node-explanation" x="276.6666666666667" y="535">[L,R] の最新位置の中で直前位置が L 未満</text><text class="node-explanation" x="276.6666666666667" y="553">なら、その値は区間内に一回だけ現れます。</text></g><g class="flow-node result" data-node="witness-result"><rect x="32" y="801" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="821">候補</text><text class="node-title" x="48" y="849">右端順に最新位置を更新し、直前位置</text><text class="node-title" x="48" y="872">が左端より前の値を探す</text><a href="/flowchartcp/techniques/offline-range-singleton-witness/"><title>区間に一度だけ現れる値は、最新位置の直前出現が左端より前かで探すの記事へ</title><text x="48" y="911">区間に一度だけ現れる値は、最新位置の直前出現が</text><text x="48" y="929">左端より前かで探す</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="801" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="821">質問</text><text class="node-title" x="524" y="849">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="872">確認できますか？</text><text class="node-explanation" x="524" y="899">操作の条件と、求める個数・値・順序を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1203">候補</text><text class="node-title" x="160" y="1231">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1270">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1294">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1203">分野</text><text class="node-title" x="524" y="1231">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1268">詳細の質問・図へ →</text></a></g></svg>