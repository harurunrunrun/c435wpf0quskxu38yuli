<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-query-times flow-desc-range-query-times" width="1112" height="1272" viewBox="0 0 1112 1272" data-flow-svg="range-query-times"><title id="flow-title-range-query-times">問い合わせの順序と参照する時点の解法フローチャート</title><desc id="flow-desc-range-query-times">問い合わせをまとめられるか、過去の版が必要か、目標へ初めて達する時点かを分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-query-times" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge offline" data-edge="updates:offline:offline-route"><title>多数の問い合わせをまとめて処理する</title><path d="M579.75 159 V171 C579.75 203 290 203 290 235 V247"/><path d="M290 285 V315 C290 347 290 347 290 379 V391 V553 C290 585 556 585 556 617 V629 V679 C556 711 502.667 711 502.667 743 V755" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="updates:offline:offline-route" tabindex="0" role="group" aria-label="選択肢：多数の問い合わせをまとめて処理する"><rect x="167.5" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="290" y="270">多数の問い合わせをまとめて処理する</text></g></g><g class="flow-edge past" data-edge="updates:past:past-range"><title>過去の時点にも問い合わせる</title><path d="M643.75 159 V171 C643.75 203 553 203 553 235 V247"/><path d="M553 285 V315 C553 347 500 347 500 379 V391" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="updates:past:past-range" tabindex="0" role="group" aria-label="選択肢：過去の時点にも問い合わせる"><rect x="456.5" y="247" width="193" height="38" rx="5"/><text text-anchor="middle" x="553" y="270">過去の時点にも問い合わせる</text></g></g><g class="flow-edge first-threshold" data-edge="updates:first-threshold:time-threshold-route"><title>所属位置の総和が目標へ初めて達する時刻</title><path d="M707.75 159 V171 C707.75 203 824.5 203 824.5 235 V247"/><path d="M824.5 303 V315 C824.5 347 864 347 864 379 V391" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="updates:first-threshold:time-threshold-route" tabindex="0" role="group" aria-label="選択肢：所属位置の総和が目標へ初めて達する時刻"><rect x="702" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="270">所属位置の総和が目標へ初めて達する</text><text text-anchor="middle" x="824.5" y="288">時刻</text></g></g><g class="flow-edge unknown" data-edge="updates:unknown:check"><title>わからない</title><path d="M771.75 159 V171 C771.75 203 1035.5 203 1035.5 235 V247"/><path d="M1035.5 285 V315 C1035.5 347 1074 347 1074 379 V391 V553 C1074 585 1014.5 585 1014.5 617 V629 V679 C1014.5 711 973.333 711 973.333 743 V755" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="updates:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:update-route"><title>はい</title><path d="M840 905 V917 C840 949 192 949 192 981 V993"/><path d="M192 1031 V1043 C192 1075 192 1075 192 1107 V1119" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="check:yes:update-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1016">はい</text></g></g><g class="flow-edge no" data-edge="check:no:static-route"><title>いいえ</title><path d="M920 905 V917 C920 949 556 949 556 981 V993"/><path d="M556 1031 V1043 C556 1075 556 1075 556 1107 V1119" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="check:no:static-route" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1016">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 905 V917 C1000 949 920 949 920 981 V993"/><path d="M920 1031 V1043 C920 1075 920 1075 920 1107 V1119" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="993" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="1016">わからない</text></g></g><g class="flow-edge yes" data-edge="past-range:yes:persistent-result"><title>はい</title><path d="M420 541 V553 C420 585 646 585 646 617 V629"/><path d="M646 667 V679 C646 711 192 711 192 743 V755" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="past-range:yes:persistent-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="606" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="646" y="652">はい</text></g></g><g class="flow-edge no" data-edge="past-range:no:offline-route"><title>いいえ</title><path d="M500 541 V553 C500 585 770 585 770 617 V629"/><path d="M770 667 V679 C770 711 609.333 711 609.333 743 V755" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="past-range:no:offline-route" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="730" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="770" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="past-range:unknown:check"><title>わからない</title><path d="M580 541 V553 C580 585 920 585 920 617 V629"/><path d="M920 667 V679 C920 711 866.667 711 866.667 743 V755" marker-end="url(#arrow-range-query-times)"/><g class="flow-edge-label" data-edge-label="past-range:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="652">わからない</text></g></g><g class="flow-node question" data-node="updates"><rect x="515.75" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="531.75" y="52">質問</text><text class="node-title" x="531.75" y="80">数列について、何を求めますか？</text><text class="node-explanation" x="531.75" y="107">値が変わるか、区間が連続しているか、答えの形を選</text><text class="node-explanation" x="531.75" y="125">びます。</text></g><g class="flow-node question" data-node="check"><rect x="760" y="755" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="775">質問</text><text class="node-title" x="776" y="803">操作の一覧に、配列の値を変更する命</text><text class="node-title" x="776" y="826">令がありますか？</text><text class="node-explanation" x="776" y="853">問題文の操作を「値を変える」「値を読む」に分けて</text><text class="node-explanation" x="776" y="871">ください。</text></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="1119" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="1139">分野</text><text class="node-title" x="776" y="1167">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="1204">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="update-route"><rect x="32" y="1119" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="1139">分野</text><text class="node-title" x="48" y="1167">値が変わる区間の集計</text><a href="/flowchartcp/flowcharts/#diagram-range-update" data-route="range-update"><text x="48" y="1204">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="offline-route"><rect x="396" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="775">分野</text><text class="node-title" x="412" y="803">問い合わせをまとめる条件</text><a href="/flowchartcp/flowcharts/#diagram-range-offline" data-route="range-offline"><text x="412" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="static-route"><rect x="396" y="1119" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1139">分野</text><text class="node-title" x="412" y="1167">値が変わらない区間の集計</text><a href="/flowchartcp/flowcharts/#diagram-range-static" data-route="range-static"><text x="412" y="1204">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="past-range"><rect x="340" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="356" y="411">質問</text><text class="node-title" x="356" y="439">各更新後の状態を残し、指定された版</text><text class="node-title" x="356" y="462">を参照しますか？</text><text class="node-explanation" x="356" y="489">過去の値の集合が必要か、操作を巻き戻せば足りるか</text><text class="node-explanation" x="356" y="507">を分けます。</text></g><g class="flow-node result" data-node="persistent-result"><rect x="32" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="775">候補</text><text class="node-title" x="48" y="803">過去の配列を参照する</text><a href="/flowchartcp/techniques/persistent-segment-tree/"><title>永続セグメント木の記事へ</title><text x="48" y="842">永続セグメント木</text></a></g><g class="flow-node route" data-node="time-threshold-route"><rect x="704" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="720" y="411">分野</text><text class="node-title" x="720" y="439">総量が初めて閾値に達する時刻</text><a href="/flowchartcp/flowcharts/#diagram-time-thresholds" data-route="time-thresholds"><text x="720" y="476">詳細の質問・図へ →</text></a></g></svg>