<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-lcs-reconstruction flow-desc-lcs-reconstruction" width="1224" height="1402" viewBox="0 0 1224 1402" data-flow-svg="lcs-reconstruction"><title id="flow-title-lcs-reconstruction">共通部分列の長さと、省メモリでの復元の解法フローチャート</title><desc id="flow-desc-lcs-reconstruction">二つの列の順序を保って取り出す最長の共通部分列を、長さだけ求める場合と実際に復元する場合に分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-lcs-reconstruction" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge sequence" data-edge="output:sequence:recompute-time"><title>最長の部分列そのものを、省メモリで復元する</title><path d="M768.944 200 V212 C768.944 244 434.833 244 434.833 276 V288"/><path d="M434.833 344 V356 C434.833 388 434.833 388 434.833 420 V432" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="output:sequence:recompute-time" tabindex="0" role="group" aria-label="選択肢：最長の部分列そのものを、省メモリで復元する"><rect x="312.3333333333333" y="288" width="245" height="56" rx="5"/><text text-anchor="middle" x="434.8333333333333" y="311">最長の部分列そのものを、省メモリで</text><text text-anchor="middle" x="434.8333333333333" y="329">復元する</text></g></g><g class="flow-edge length" data-edge="output:length:length-time"><title>最長の長さだけを求める</title><path d="M848.944 200 V212 C848.944 244 964.5 244 964.5 276 V288"/><path d="M964.5 326 V356 C964.5 388 964.5 388 964.5 420 V432" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="output:length:length-time" tabindex="0" role="group" aria-label="選択肢：最長の長さだけを求める"><rect x="881" y="288" width="167" height="38" rx="5"/><text text-anchor="middle" x="964.5" y="311">最長の長さだけを求める</text></g></g><g class="flow-edge unknown" data-edge="output:unknown:check"><title>わからない</title><path d="M928.944 200 V212 C928.944 244 1147.5 244 1147.5 276 V288"/><path d="M1147.5 326 V356 C1147.5 388 1186 388 1186 420 V432 V612 C1186 644 1186 644 1186 676 V688 V738 C1186 770 1112 770 1112 802 V814" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="output:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1103" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="1147.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="recompute-time:yes:hirschberg"><title>はい</title><path d="M354.833 600 V612 C354.833 644 192 644 192 676 V688"/><path d="M192 726 V738 C192 770 192 770 192 802 V814" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="recompute-time:yes:hirschberg" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="688" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="711">はい</text></g></g><g class="flow-edge no" data-edge="recompute-time:no:fallback"><title>いいえ</title><path d="M434.833 600 V612 C434.833 644 402 644 402 676 V688"/><path d="M402 726 V738 C402 770 402 770 402 802 V814 V994 C402 1026 668 1026 668 1058 V1070 V1120 C668 1152 588 1152 588 1184 V1196" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="recompute-time:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="688" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="711">いいえ</text></g></g><g class="flow-edge unknown" data-edge="recompute-time:unknown:check"><title>わからない</title><path d="M514.833 600 V612 C514.833 644 710.5 644 710.5 676 V688"/><path d="M710.5 726 V738 C710.5 770 952 770 952 802 V814" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="recompute-time:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="666" y="688" width="89" height="38" rx="5"/><text text-anchor="middle" x="710.5" y="711">わからない</text></g></g><g class="flow-edge yes" data-edge="length-time:yes:rolling"><title>はい</title><path d="M884.5 582 V612 C884.5 644 839 644 839 676 V688"/><path d="M839 726 V738 C839 770 612 770 612 802 V814" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="length-time:yes:rolling" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="799" y="688" width="80" height="38" rx="5"/><text text-anchor="middle" x="839" y="711">はい</text></g></g><g class="flow-edge no" data-edge="length-time:no:fallback"><title>いいえ</title><path d="M964.5 582 V612 C964.5 644 963 644 963 676 V688"/><path d="M963 726 V738 C963 770 822 770 822 802 V814 V994 C822 1026 724 1026 724 1058 V1070 V1120 C724 1152 668 1152 668 1184 V1196" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="length-time:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="688" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="711">いいえ</text></g></g><g class="flow-edge unknown" data-edge="length-time:unknown:check"><title>わからない</title><path d="M1044.5 582 V612 C1044.5 644 1091.5 644 1091.5 676 V688"/><path d="M1091.5 726 V738 C1091.5 770 1032 770 1032 802 V814" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="length-time:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="688" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="711">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M952 964 V994 C952 1026 814 1026 814 1058 V1070"/><path d="M814 1108 V1120 C814 1152 748 1152 748 1184 V1196" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="774" y="1070" width="80" height="38" rx="5"/><text text-anchor="middle" x="814" y="1093">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1032 964 V994 C1032 1026 1019 1026 1019 1058 V1070"/><path d="M1019 1108 V1120 C1019 1152 978.667 1152 978.667 1184 V1196" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="979" y="1070" width="80" height="38" rx="5"/><text text-anchor="middle" x="1019" y="1093">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1112 964 V994 C1112 1026 1147.5 1026 1147.5 1058 V1070"/><path d="M1147.5 1108 V1120 C1147.5 1152 1085.333 1152 1085.333 1184 V1196" marker-end="url(#arrow-lcs-reconstruction)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1103" y="1070" width="89" height="38" rx="5"/><text text-anchor="middle" x="1147.5" y="1093">わからない</text></g></g><g class="flow-node question" data-node="output"><rect x="688.9444444444443" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="704.9444444444443" y="52">質問</text><text class="node-title" x="704.9444444444443" y="80">二つの列に共通する最長の部分列か</text><text class="node-title" x="704.9444444444443" y="103">ら、何を出力しますか？</text><text class="node-explanation" x="704.9444444444443" y="130">長さだけなら前の行を捨てられます。列そのものを復</text><text class="node-explanation" x="704.9444444444443" y="148">元するときは、前後の長さを再計算して分割点を決め</text><text class="node-explanation" x="704.9444444444443" y="166">ます。</text></g><g class="flow-node question" data-node="recompute-time"><rect x="274.8333333333333" y="432" width="320" height="168" rx="7"/><text class="node-kind" x="290.8333333333333" y="452">質問</text><text class="node-title" x="290.8333333333333" y="480">二つの長さの積に比例する再計算は、</text><text class="node-title" x="290.8333333333333" y="503">時間制限内ですか？</text><text class="node-explanation" x="290.8333333333333" y="530">接頭辞と接尾辞の共通部分列長を二行で求めます。メ</text><text class="node-explanation" x="290.8333333333333" y="548">モリは減りますが、時間のオーダーは全表の計算と同</text><text class="node-explanation" x="290.8333333333333" y="566">じです。</text></g><g class="flow-node question" data-node="length-time"><rect x="804.5" y="432" width="320" height="150" rx="7"/><text class="node-kind" x="820.5" y="452">質問</text><text class="node-title" x="820.5" y="480">二つの長さの積に比例する計算は、時</text><text class="node-title" x="820.5" y="503">間制限内ですか？</text><text class="node-explanation" x="820.5" y="530">列の復元が不要なら、短い列を横軸にして二行だけを</text><text class="node-explanation" x="820.5" y="548">保存できます。</text></g><g class="flow-node result" data-node="hirschberg"><rect x="32" y="814" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="834">候補</text><text class="node-title" x="48" y="862">前後の長さから分割点を選び、共通部</text><text class="node-title" x="48" y="885">分列を復元する</text><a href="/flowchartcp/techniques/lcs-hirschberg-reconstruction/"><title>最長共通部分列を省メモリで復元するなら、前後の長さから分割位置を探すの記事へ</title><text x="48" y="924">最長共通部分列を省メモリで復元するなら、前後の</text><text x="48" y="942">長さから分割位置を探す</text></a></g><g class="flow-node result" data-node="rolling"><rect x="452" y="814" width="320" height="150" rx="7"/><text class="node-kind" x="468" y="834">候補</text><text class="node-title" x="468" y="862">短い列を横軸にして、二行だけで長さ</text><text class="node-title" x="468" y="885">を求める</text><a href="/flowchartcp/techniques/dp-dimension-rolling/"><title>直前の層しか使わないDPは配列を使い回すの記事へ</title><text x="468" y="924">直前の層しか使わないDPは配列を使い回す</text></a></g><g class="flow-node question" data-node="check"><rect x="872" y="814" width="320" height="150" rx="7"/><text class="node-kind" x="888" y="834">質問</text><text class="node-title" x="888" y="862">必要なのは長さだけか、実際の列かを</text><text class="node-title" x="888" y="885">確認できますか？</text><text class="node-explanation" x="888" y="912">複数の最長列から一つでよいのか、辞書順など追加の</text><text class="node-explanation" x="888" y="930">条件があるのかも分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="508" y="1196" width="320" height="174" rx="7"/><text class="node-kind" x="524" y="1216">候補</text><text class="node-title" x="524" y="1244">出力条件と、再計算できる範囲を確か</text><text class="node-title" x="524" y="1267">める</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="524" y="1306">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="524" y="1330">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="872" y="1196" width="320" height="121" rx="7"/><text class="node-kind" x="888" y="1216">分野</text><text class="node-title" x="888" y="1244">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="888" y="1281">詳細の質問・図へ →</text></a></g></svg>