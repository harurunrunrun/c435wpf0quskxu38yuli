refix-order:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1843.2777777777776" y="677" width="89" height="38" rx="5"/><text text-anchor="middle" x="1887.7777777777776" y="700">わからない</text></g></g><g class="flow-edge yes" data-edge="mean-check:yes:prefix-order-result"><title>はい</title><path d="M1204 564 V601 C1204 633 1591.778 633 1591.778 665 V677"/><path d="M1591.778 715 V727 C1591.778 759 1521.111 759 1521.111 791 V803" marker-end="url(#arrow-window-sum-conditions)"/><g class="flow-edge-label" data-edge-label="mean-check:yes:prefix-order-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1551.7777777777776" y="677" width="80" height="38" rx="5"/><text text-anchor="middle" x="1591.7777777777776" y="700">はい</text></g></g><g class="flow-edge no" data-edge="mean-check:no:fallback"><title>いいえ</title><path d="M1284 564 V601 C1284 633 1715.778 633 1715.778 665 V677"/><path d="M1715.778 715 V727 C1715.778 759 1677.778 759 1677.778 791 V803 V990 C1677.778 1022 1313.778 1022 1313.778 1054 V1066 V1116 C1313.778 1148 1257.778 1148 1257.778 1180 V1192" marker-end="url(#arrow-window-sum-conditions)"/><g class="flow-edge-label" data-edge-label="mean-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1675.7777777777776" y="677" width="80" height="38" rx="5"/><text text-anchor="middle" x="1715.7777777777776" y="700">いいえ</text></g></g><g class="flow-edge unknown" data-edge="mean-check:unknown:check"><title>わからない</title><path d="M1364 564 V601 C1364 633 2020.778 633 2020.778 665 V677"/><path d="M2020.778 715 V727 C2020.778 759 1887.778 759 1887.778 791 V803" marker-end="url(#arrow-window-sum-conditions)"/><g class="flow-edge-label" data-edge-label="mean-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1976.2777777777776" y="677" width="89" height="38" rx="5"/><text text-anchor="middle" x="2020.7777777777776" y="700">わからない</text></g></g><g class="flow-node question" data-node="check"><rect x="1727.7777777777776" y="803" width="320" height="150" rx="7"/><text class="node-kind" x="1743.7777777777776" y="823">質問</text><text class="node-title" x="1743.7777777777776" y="851">区間を広げると、判定に使う量が増え</text><text class="node-title" x="1743.7777777777776" y="874">続けると証明できますか？</text><text class="node-explanation" x="1743.7777777777776" y="901">区間和なら全要素が非負であることを確認します。実</text><text class="node-explanation" x="1743.7777777777776" y="919">験だけで単調性を断定しません。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1837.5833333333333" y="1192" width="320" height="139" rx="7"/><text class="node-kind" x="1853.5833333333333" y="1212">分野</text><text class="node-title" x="1853.5833333333333" y="1240">条件を確かめる</text><text class="node-explanation" x="1853.5833333333333" y="1267">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1853.5833333333333" y="1295">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="prefix-count"><rect x="32" y="414" width="320" height="175" rx="7"/><text class="node-kind" x="48" y="434">候補</text><text class="node-title" x="48" y="462">接頭辞和と出現回数</text><a href="/flowchartcp/techniques/subarray-prefix-frequency/"><title>和が指定値になる区間を累積和の頻度で数えるの記事へ</title><text x="48" y="501">和が指定値になる区間を累積和の頻度で数える</text></a><a href="/flowchartcp/techniques/prefix-sum/"><title>累積和の記事へ</title><text x="48" y="525">累積和</text></a><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="48" y="549">寄与の数え上げ</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1097.7777777777776" y="1192" width="320" height="151" rx="7"/><text class="node-kind" x="1113.7777777777776" y="1212">候補</text><text class="node-title" x="1113.7777777777776" y="1240">連続区間の状態を作り直す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1113.7777777777776" y="1279">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="1113.7777777777776" y="1303">反例探し</text></a></g><g class="flow-node question" data-node="wanted"><rect x="1090.857142857143" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1106.857142857143" y="52">質問</text><text class="node-title" x="1106.857142857143" y="80">連続する区間について何を求めます</text><text class="node-title" x="1106.857142857143" y="103">か？</text><text class="node-explanation" x="1106.857142857143" y="130">固定長の窓、種類数、和、最大・最小の寄与を区別し</text><text class="node-explanation" x="1106.857142857143" y="148">ます。</text></g><g class="flow-node question" data-node="prefix-order"><rect x="396" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="434">質問</text><text class="node-title" x="412" y="462">区間和の条件を、二つの接頭辞和の大</text><text class="node-title" x="412" y="485">小関係へ変形できますか？</text><text class="node-explanation" x="412" y="512">負数があっても大小関係を満たす過去の接頭辞を数え</text><text class="node-explanation" x="412" y="530">られます。</text></g><g class="flow-node result" data-node="prefix-order-result"><rect x="1307.7777777777776" y="803" width="320" height="175" rx="7"/><text class="node-kind" x="1323.7777777777776" y="823">候補</text><text class="node-title" x="1323.7777777777776" y="851">接頭辞和の大小関係を数える</text><a href="/flowchartcp/techniques/subarray-prefix-order/"><title>和や平均の下限を累積和の大小関係に直すの記事へ</title><text x="1323.7777777777776" y="890">和や平均の下限を累積和の大小関係に直す</text></a><a href="/flowchartcp/techniques/coordinate-compression/"><title>座標圧縮の記事へ</title><text x="1323.7777777777776" y="914">座標圧縮</text></a><a href="/flowchartcp/techniques/fenwick-tree/"><title>Fenwick Treeの記事へ</title><text x="1323.7777777777776" y="938">Fenwick Tree</text></a></g><g class="flow-node question" data-node="mean-check"><rect x="1124" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="434">質問</text><text class="node-title" x="1140" y="462">各要素から閾値を引くと、平均の条件</text><text class="node-title" x="1140" y="485">を区間和の条件へ変えられますか？</text><text class="node-explanation" x="1140" y="512">負になる値を含むので、尺取りの単調性を仮定せず接</text><text class="node-explanation" x="1140" y="530">頭辞の大小関係を数えます。</text></g><g class="flow-node route" data-node="bounded-sum-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">長さ制限つきの最大区間和</text><a href="/flowchartcp/flowcharts/#diagram-subarray-length-bounded-sum" data-route="subarray-length-bounded-sum"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="carryfree-sum-xor-route"><rect x="1488" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="434">分野</text><text class="node-title" x="1504" y="462">通常の和と XOR が一致する連続</text><text class="node-title" x="1504" y="485">区間</text><a href="/flowchartcp/flowcharts/#diagram-carryfree-subarray-window" data-route="carryfree-subarray-window"><text x="1504" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="top-k-bounded-route"><rect x="1852" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="434">分野</text><text class="node-title" x="1868" y="462">長さ制限を満たす異なる区間和を、大</text><text class="node-title" x="1868" y="485">きい順にK個取り出す</text><a href="/flowchartcp/flowcharts/#diagram-top-k-bounded-subarray-conditions" data-route="top-k-bounded-subarray-conditions"><text x="1868" y="522">詳細の質問・図へ →</text></a></g></svg>