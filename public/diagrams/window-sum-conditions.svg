<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-window-sum-conditions flow-desc-window-sum-conditions" width="2260" height="1375" viewBox="0 0 2260 1375" data-flow-svg="window-sum-conditions"><title id="flow-title-window-sum-conditions">区間和・平均と長さの条件の解法フローチャート</title><desc id="flow-desc-window-sum-conditions">和の一致・大小、平均の閾値、長さの上限下限、ビットの重なりを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-window-sum-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1807.778 953 V990 C1807.778 1022 1403.778 1022 1403.778 1054 V1066"/><path d="M1403.778 1104 V1116 C1403.778 1148 1337.778 1148 1337.778 1180 V1192" marker-end="url(#arrow-window-sum-conditions)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1363.7777777777776" y="1066" width="80" height="38" rx="5"/><text text-anchor="middle" x="1403.7777777777776" y="1089">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1887.778 953 V990 C1887.778 1022 1997.583 1022 1997.583 1054 V1066"/><path d="M1997.583 1104 V1116 C1997.583 1148 1944.25 1148 1944.25 1180 V1192" marker-end="url(#arrow-window-sum-conditions)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1957.5833333333333" y="1066" width="80" height="38" rx="5"/><text text-anchor="middle" x="1997.5833333333333" y="1089">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1967.778 953 V990 C1967.778 1022 2126.083 1022 2126.083 1054 V1066"/><path d="M2126.083 1104 V1116 C2126.083 1148 2050.917 1148 2050.917 1180 V1192" marker-end="url(#arrow-window-sum-conditions)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2081.583333333333" y="1066" width="89" height="38" rx="5"/><text text-anchor="middle" x="2126.083333333333" y="1089">わからない</text></g></g><g class="flow-edge sum-equal" data-edge="wanted:sum-equal:prefix-count"><title>区間和が指定値になる個数</title><path d="M1130.857 182 V194 C1130.857 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-window-sum-conditions)"/><g class="flow-edge-label" data-edge-label="wanted:sum-equal:prefix-count" tabindex="0" role="group" aria-label="選択肢：区間和が指定値になる個数"><rect x="102" y="270" width="180" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">区間和が指定値になる個数</text></g></g><g class="flow-edge sum-order" data-edge="wanted:sum-order:prefix-order"><title>区間和が指定値以下・以上になる個数</title><path d="M1170.857 182 V194 C1170.857 226 556 226 556 258 V270"/><path d="M556 308 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-window-sum-conditions)"/><g class="flow-edge-label" data-edge-label="wanted:sum-order:prefix-order" tabindex="0" role="group" aria-label="選択肢：区間和が指定値以下・以上になる個数"><rect x="433.5" y="270" width="245" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">区間和が指定値以下・以上になる個数</text></g></g><g class="flow-edge mean-bound" data-edge="wanted:mean-bound:mean-check"><title>平均が指定値以上・以下になる区間の個数</title><path d="M1250.857 182 V194 C1250.857 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-window-sum-conditions)"/><g class="flow-edge-label" data-edge-label="wanted:mean-bound:mean-check" tabindex="0" role="group" aria-label="選択肢：平均が指定値以上・以下になる区間の個数"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">平均が指定値以上・以下になる区間の</text><text text-anchor="middle" x="1284" y="311">個数</text></g></g><g class="flow-edge bounded-length-sum" data-edge="wanted:bou