<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-xor-interval-triples-conditions flow-desc-xor-interval-triples-conditions" width="748" height="1406" viewBox="0 0 748 1406" data-flow-svg="xor-interval-triples-conditions"><title id="flow-title-xor-interval-triples-conditions">区間集合から、全ての二数間でXORを制限した三数を選ぶの解法フローチャート</title><desc id="flow-desc-xor-interval-triples-conditions">対象の表し方と、数える量の条件を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-xor-interval-triples-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="interval-union:yes:pairwise-limit"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-xor-interval-triples-conditions)"/><g class="flow-edge-label" data-edge-label="interval-union:yes:pairwise-limit" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="interval-union:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V599 C654 631 654 631 654 663 V675 V725 C654 757 654 757 654 789 V801 V1004 C654 1036 654 1036 654 1068 V1080 V1130 C654 1162 624.571 1162 624.571 1194 V1206" marker-end="url(#arrow-xor-interval-triples-conditions)"/><g class="flow-edge-label" data-edge-label="interval-union:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="interval-union:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V599 C710 631 710 631 710 663 V675 V725 C710 757 710 757 710 789 V801 V1004 C710 1036 710 1036 710 1068 V1080 V1130 C710 1162 670.286 1162 670.286 1194 V1206" marker-end="url(#arrow-xor-interval-triples-conditions)"/><g class="flow-edge-label" data-edge-label="interval-union:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="pairwise-limit:yes:size"><title>はい</title><path d="M352.5 587 V599 C352.5 631 307 631 307 663 V675"/><path d="M307 713 V725 C307 757 319.5 757 319.5 789 V801" marker-end="url(#arrow-xor-interval-triples-conditions)"/><g class="flow-edge-label" data-edge-label="pairwise-limit:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="698">はい</text></g></g><g class="flow-edge no" data-edge="pairwise-limit:no:check"><title>いいえ</title><path d="M432.5 587 V599 C432.5 631 431 631 431 663 V675"/><path d="M431 713 V725 C431 757 542 757 542 789 V801 V1004 C542 1036 542 1036 542 1068 V1080 V1130 C542 1162 533.143 1162 533.143 1194 V1206" marker-end="url(#arrow-xor-interval-triples-conditions)"/><g class="flow-edge-label" data-edge-label="pairwise-limit:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="pairwise-limit:unknown:check"><title>わからない</title><path d="M512.5 587 V599 C512.5 631 559.5 631 559.5 663 V675"/><path d="M559.5 713 V725 C559.5 757 598 757 598 789 V801 V1004 C598 1036 598 1036 598 1068 V1080 V1130 C598 1162 578.857 1162 578.857 1194 V1206" marker-end="url(#arrow-xor-interval-triples-conditions)"/><g class="flow-edge-label" data-edge-label="pairwise-limit:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M239.5 992 V1004 C239.5 1036 192 1036 192 1068 V1080"/><path d="M192 1118 V1130 C192 1162 192 1162 192 1194 V1206" marker-end="url(#arrow-xor-interval-triples-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1080" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1103">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 992 V1004 C319.5 1036 319 1036 319 1068 V1080"/><path d="M319 1118 V1130 C319 1162 441.714 1162 441.714 1194 V1206" marker-end="url(#arrow-xor-interval-triples-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1080" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1103">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 992 V1004 C399.5 1036 447.5 1036 447.5 1068 V1080"/><path d="M447.5 1118 V1130 C447.5 1162 487.429 1162 487.429 1194 V1206" marker-end="url(#arrow-xor-interval-triples-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1080" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1103">わからない</text></g></g><g class="flow-node question" data-node="interval-union"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">候補は、昇順で互いに重ならない非負</text><text class="node-title" x="400.5" y="103">整数の閉区間の和ですか？</text><text class="node-explanation" x="400.5" y="130">区間に含まれる整数の総数は巨大でも構いません。重</text><text class="node-explanation" x="400.5" y="148">複した整数を別個体として数えません。隣接区間は統</text><text class="node-explanation" x="400.5" y="166">合できます。</text></g><g class="flow-node question" data-node="pairwise-limit"><rect x="272.5" y="414" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">相異なる三数を順序なしで選び、三つ</text><text class="node-title" x="288.5" y="485">全ての組のXORが同じK以下となる</text><text class="node-title" x="288.5" y="508">個数を求めますか？</text><text class="node-explanation" x="288.5" y="535">三数をまとめてXORした値の条件や、組ごとに上限</text><text class="node-explanation" x="288.5" y="553">が異なる条件とは区別します。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="801" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="821">質問</text><text class="node-title" x="175.5" y="849">区間数は2万以下、端点は0..10</text><text class="node-title" x="175.5" y="872">^9、1≤K≤10^9で、法10^</text><text class="node-title" x="175.5" y="895">9+7の個数を求めますか？</text><text class="node-explanation" x="175.5" y="922">K+1未満へ直してから2のべき乗のブロックに分け</text><text class="node-explanation" x="175.5" y="940">ます。空集合は0、重複・逆順・範囲外は掲載API</text><text class="node-explanation" x="175.5" y="958">の例外です。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1206" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1226">候補</text><text class="node-title" x="48" y="1254">一対二の分かれ方を、各一数が持つ許</text><text class="node-title" x="48" y="1277">容相手数の二項係数にまとめる</text><a href="/flowchartcp/techniques/xor-bounded-triples-intervals/"><title>どの二数のXORも上限以下となる三数を、区間集合から数えるの記事へ</title><text x="48" y="1316">どの二数のXORも上限以下となる三数を、区間集</text><text x="48" y="1334">合から数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1206" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1226">分野</text><text class="node-title" x="412" y="1254">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1291">詳細の質問・図へ →</text></a></g></svg>