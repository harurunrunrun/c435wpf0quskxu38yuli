<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-time-thresholds flow-desc-time-thresholds" width="916" height="1689" viewBox="0 0 916 1689" data-flow-svg="time-thresholds"><title id="flow-title-time-thresholds">総量が初めて閾値に達する時刻の解法フローチャート</title><desc id="flow-desc-time-thresholds">複数の対象の判定を、同じ操作列の走査へまとめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-time-thresholds" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="offline:yes:monotone"><title>はい</title><path d="M629.019 182 V194 C629.019 226 576.556 226 576.556 258 V270"/><path d="M576.556 308 V320 C576.556 352 576.556 352 576.556 384 V396" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="offline:yes:monotone" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="536.5555555555555" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="576.5555555555555" y="293">はい</text></g></g><g class="flow-edge no" data-edge="offline:no:fallback"><title>いいえ</title><path d="M709.019 182 V194 C709.019 226 711 226 711 258 V270"/><path d="M711 308 V320 C711 352 822 352 822 384 V396 V558 C822 590 822 590 822 622 V634 V684 C822 716 822 716 822 748 V760 V922 C822 954 822 954 822 986 V998 V1048 C822 1080 878 1080 878 1112 V1124 V1304 C878 1336 878 1336 878 1368 V1380 V1430 C878 1462 456 1462 456 1494 V1506" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="offline:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="671" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="711" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="offline:unknown:check"><title>わからない</title><path d="M789.019 182 V194 C789.019 226 839.5 226 839.5 258 V270"/><path d="M839.5 308 V320 C839.5 352 878 352 878 384 V396 V558 C878 590 878 590 878 622 V634 V684 C878 716 878 716 878 748 V760 V922 C878 954 878 954 878 986 V998 V1048 C878 1080 748 1080 748 1112 V1124" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="offline:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="795" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="839.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="monotone:yes:batch-replay"><title>はい</title><path d="M496.556 546 V558 C496.556 590 403.167 590 403.167 622 V634"/><path d="M403.167 672 V684 C403.167 716 403.167 716 403.167 748 V760" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="monotone:yes:batch-replay" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="363.1666666666667" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="403.1666666666667" y="657">はい</text></g></g><g class="flow-edge no" data-edge="monotone:no:fallback"><title>いいえ</title><path d="M576.556 546 V558 C576.556 590 599 590 599 622 V634"/><path d="M599 672 V684 C599 716 710 716 710 748 V760 V922 C710 954 710 954 710 986 V998 V1048 C710 1080 458 1080 458 1112 V1124 V1304 C458 1336 416 1336 416 1368 V1380 V1430 C416 1462 328 1462 328 1494 V1506" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="monotone:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="559" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="599" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="monotone:unknown:check"><title>わからない</title><path d="M656.556 546 V558 C656.556 590 727.5 590 727.5 622 V634"/><path d="M727.5 672 V684 C727.5 716 766 716 766 748 V760 V922 C766 954 766 954 766 986 V998 V1048 C766 1080 668 1080 668 1112 V1124" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="monotone:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="683" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="batch-replay:yes:time-result"><title>はい</title><path d="M323.167 910 V922 C323.167 954 192 954 192 986 V998"/><path d="M192 1036 V1048 C192 1080 192 1080 192 1112 V1124" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="batch-replay:yes:time-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="batch-replay:no:fallback"><title>いいえ</title><path d="M403.167 910 V922 C403.167 954 402 954 402 986 V998"/><path d="M402 1036 V1048 C402 1080 402 1080 402 1112 V1124 V1304 C402 1336 360 1336 360 1368 V1380 V1430 C360 1462 264 1462 264 1494 V1506" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="batch-replay:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="batch-replay:unknown:check"><title>わからない</title><path d="M483.167 910 V922 C483.167 954 615.5 954 615.5 986 V998"/><path d="M615.5 1036 V1048 C615.5 1080 588 1080 588 1112 V1124" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="batch-replay:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="571" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="615.5" y="1021">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 1274 V1304 C588 1336 506 1336 506 1368 V1380"/><path d="M506 1418 V1430 C506 1462 392 1462 392 1494 V1506" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1380" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1403">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 1274 V1304 C668 1336 655 1336 655 1368 V1380"/><path d="M655 1418 V1430 C655 1462 670.667 1462 670.667 1494 V1506" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1380" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1403">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 1274 V1304 C748 1336 783.5 1336 783.5 1368 V1380"/><path d="M783.5 1418 V1430 C783.5 1462 777.333 1462 777.333 1494 V1506" marker-end="url(#arrow-time-thresholds)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1380" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1403">わからない</text></g></g><g class="flow-node question" data-node="offline"><rect x="549.0185185185186" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="565.0185185185186" y="52">質問</text><text class="node-title" x="565.0185185185186" y="80">各対象の目標、所属位置、すべての更</text><text class="node-title" x="565.0185185185186" y="103">新を先に読めますか？</text><text class="node-explanation" x="565.0185185185186" y="130">最初に達する時刻を探すため、途中の判定を再生しま</text><text class="node-explanation" x="565.0185185185186" y="148">す。</text></g><g class="flow-node question" data-node="monotone"><rect x="416.55555555555554" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="432.55555555555554" y="416">質問</text><text class="node-title" x="432.55555555555554" y="444">更新によって各対象の総量は減らず、</text><text class="node-title" x="432.55555555555554" y="467">時刻への判定が単調ですか？</text><text class="node-explanation" x="432.55555555555554" y="494">非負加算などが必要です。負の更新で目標未満へ戻る</text><text class="node-explanation" x="432.55555555555554" y="512">場合には、そのまま二分探索できません。</text></g><g class="flow-node question" data-node="batch-replay"><rect x="243.16666666666669" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="259.1666666666667" y="780">質問</text><text class="node-title" x="259.1666666666667" y="808">複数の途中時刻の判定を、操作列の一</text><text class="node-title" x="259.1666666666667" y="831">度の走査で計算できますか？</text><text class="node-explanation" x="259.1666666666667" y="858">同じ二分探索段の判定を時刻順に並べ、更新を一度ず</text><text class="node-explanation" x="259.1666666666667" y="876">つ加えて各所属位置の総量を調べます。</text></g><g class="flow-node result" data-node="time-result"><rect x="32" y="1124" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1144">候補</text><text class="node-title" x="48" y="1172">対象ごとの二分探索を揃え、同じ時刻</text><text class="node-title" x="48" y="1195">までの更新を共有する</text><a href="/flowchartcp/techniques/parallel-binary-search-time/"><title>初めて条件を満たす時刻を、全対象の二分探索で共有するの記事へ</title><text x="48" y="1234">初めて条件を満たす時刻を、全対象の二分探索で共</text><text x="48" y="1252">有する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="1124" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="1144">質問</text><text class="node-title" x="524" y="1172">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="1195">確認できますか？</text><text class="node-explanation" x="524" y="1222">どの性質が入力で保証され、どの性質を式や操作から</text><text class="node-explanation" x="524" y="1240">示す必要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1506" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1526">候補</text><text class="node-title" x="216" y="1554">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="216" y="1593">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1617">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1506" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1526">分野</text><text class="node-title" x="580" y="1554">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1591">詳細の質問・図へ →</text></a></g></svg>