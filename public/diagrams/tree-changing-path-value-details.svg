<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-changing-path-value-details flow-desc-tree-changing-path-value-details" width="1476" height="626" viewBox="0 0 1476 626" data-flow-svg="tree-changing-path-value-details"><title id="flow-title-tree-changing-path-value-details">値を変える経路の集計と更新の解法フローチャート</title><desc id="flow-desc-tree-changing-path-value-details">経路の値の集計、向きを持つ関数合成、値の上書きを分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-changing-path-value-details" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge aggregate" data-edge="changed-kind:aggregate:path"><title>経路の和・最大値・連続部分の最適値など</title><path d="M642 182 V194 C642 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-tree-changing-path-value-details)"/><g class="flow-edge-label" data-edge-label="changed-kind:aggregate:path" tabindex="0" role="group" aria-label="選択肢：経路の和・最大値・連続部分の最適値など"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">経路の和・最大値・連続部分の最適値</text><text text-anchor="middle" x="192" y="311">など</text></g></g><g class="flow-edge directed-compose" data-edge="changed-kind:directed-compose:composition-route"><title>各頂点の一次関数を、始点から終点の順に合成する</title><path d="M706 182 V194 C706 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-tree-changing-path-value-details)"/><g class="flow-edge-label" data-edge-label="changed-kind:directed-compose:composition-route" tabindex="0" role="group" aria-label="選択肢：各頂点の一次関数を、始点から終点の順に合成する"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">各頂点の一次関数を、始点から終点の</text><text text-anchor="middle" x="556" y="311">順に合成する</text></g></g><g class="flow-edge last-write" data-edge="changed-kind:last-write:overwrite-route"><title>部分木を 1、根から指定頂点を 0 に上書きし、点を読む</title><path d="M770 182 V194 C770 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-tree-changing-path-value-details)"/><g class="flow-edge-label" data-edge-label="changed-kind:last-write:overwrite-route" tabindex="0" role="group" aria-label="選択肢：部分木を 1、根から指定頂点を 0 に上書きし、点を読む"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">部分木を 1、根から指定頂点を 0</text><text text-anchor="middle" x="920" y="311"> に上書きし、点を読む</text></g></g><g class="flow-edge unknown" data-edge="changed-kind:unknown:check"><title>わからない</title><path d="M834 182 V194 C834 226 1284 226 1284 258 V270"/><path d="M1284 308 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-tree-changing-path-value-details)"/><g class="flow-edge-label" data-edge-label="changed-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="293">わからない</text></g></g><g class="flow-node question" data-node="changed-kind"><rect x="578" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="594" y="52">質問</text><text class="node-title" x="594" y="80">値が変わる経路から、何を求めます</text><text class="node-title" x="594" y="103">か？</text><text class="node-explanation" x="594" y="130">和や最大値の集計と、始点から終点へ順に作用させる</text><text class="node-explanation" x="594" y="148">計算を分けます。</text></g><g class="flow-node route" data-node="path"><rect x="32" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">二頂点間の経路の集計・更新</text><text class="node-explanation" x="48" y="489">経路への集計や更新が必要かを確認し、少数の指定頂</text><text class="node-explanation" x="48" y="507">点についての問い合わせへ進みます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-path-aggregation" data-route="tree-path-aggregation"><text x="48" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="composition-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">向きを持つ経路の関数合成</text><a href="/flowchartcp/flowcharts/#diagram-tree-directed-functions" data-route="tree-directed-functions"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="overwrite-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">部分木と祖先への上書きの時刻</text><a href="/flowchartcp/flowcharts/#diagram-tree-last-write" data-route="tree-last-write"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1124" y="414" width="320" height="180" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">問い合わせで対象となる頂点を確かめ</text><text class="node-title" x="1140" y="485">る</text><text class="node-explanation" x="1140" y="512">根を決めて対象を図に描き、祖先・部分木・経路のど</text><text class="node-explanation" x="1140" y="530">れを扱うかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-query-target-check" data-route="tree-query-target-check"><text x="1140" y="558">詳細の質問・図へ →</text></a></g></svg>