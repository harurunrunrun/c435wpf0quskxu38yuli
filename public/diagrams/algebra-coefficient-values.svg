<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-algebra-coefficient-values flow-desc-algebra-coefficient-values" width="1112" height="562" viewBox="0 0 1112 562" data-flow-svg="algebra-coefficient-values"><title id="flow-title-algebra-coefficient-values">係数列・多数の点での値の解法フローチャート</title><desc id="flow-desc-algebra-coefficient-values">多項式の係数列への演算と、多数の点での値や変数の移動を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-algebra-coefficient-values" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge series" data-edge="algebra-task:series:series"><title>掛けると 1 になる係数列・指数・対数</title><path d="M476 141 V153 C476 185 192 185 192 217 V229"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-algebra-coefficient-values)"/><g class="flow-edge-label" data-edge-label="algebra-task:series:series" tabindex="0" role="group" aria-label="選択肢：掛けると 1 になる係数列・指数・対数"><rect x="69.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="252">掛けると 1 になる係数列・指数・</text><text text-anchor="middle" x="192" y="270">対数</text></g></g><g class="flow-edge values-shift" data-edge="algebra-task:values-shift:evaluation-route"><title>多項式の多数点での値・変数をずらした係数</title><path d="M556 141 V153 C556 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-algebra-coefficient-values)"/><g class="flow-edge-label" data-edge-label="algebra-task:values-shift:evaluation-route" tabindex="0" role="group" aria-label="選択肢：多項式の多数点での値・変数をずらした係数"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">多項式の多数点での値・変数をずらし</text><text text-anchor="middle" x="556" y="270">た係数</text></g></g><g class="flow-edge unknown" data-edge="algebra-task:unknown:check"><title>わからない</title><path d="M636 141 V153 C636 185 920 185 920 217 V229"/><path d="M920 267 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-algebra-coefficient-values)"/><g class="flow-edge-label" data-edge-label="algebra-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="252">わからない</text></g></g><g class="flow-node question" data-node="algebra-task"><rect x="396" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="412" y="52">質問</text><text class="node-title" x="412" y="80">数列や式の計算はどの形ですか？</text><text class="node-explanation" x="412" y="107">積の和と、和の最小値では使う演算が異なります。</text></g><g class="flow-node route" data-node="series"><rect x="32" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">係数列への演算と線形遷移</text><text class="node-explanation" x="48" y="448">係数列の逆数・対数・指数と、同じ線形遷移の繰り返</text><text class="node-explanation" x="48" y="466">しを分けます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-series-transitions" data-route="algebra-series-transitions"><text x="48" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="evaluation-route"><rect x="396" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">多数の評価点と変数の移動</text><a href="/flowchartcp/flowcharts/#diagram-polynomial-values" data-route="polynomial-values"><text x="412" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">係数の逆数と指定の法</text><text class="node-explanation" x="776" y="448">係数の逆数が必要か、指定の法で逆数が存在するかを</text><text class="node-explanation" x="776" y="466">確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-invertibility" data-route="algebra-invertibility"><text x="776" y="494">詳細の質問・図へ →</text></a></g></svg>