eight="38" rx="5"/><text text-anchor="middle" x="559.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="supported-length:yes:result"><title>はい</title><path d="M239.5 946 V958 C239.5 990 192 990 192 1022 V1034"/><path d="M192 1072 V1084 C192 1116 192 1116 192 1148 V1160" marker-end="url(#arrow-series-square-root-conditions)"/><g class="flow-edge-label" data-edge-label="supported-length:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="supported-length:no:check"><title>いいえ</title><path d="M319.5 946 V958 C319.5 990 319 990 319 1022 V1034"/><path d="M319 1072 V1084 C319 1116 441.714 1116 441.714 1148 V1160" marker-end="url(#arrow-series-square-root-conditions)"/><g class="flow-edge-label" data-edge-label="supported-length:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="supported-length:unknown:check"><title>わからない</title><path d="M399.5 946 V958 C399.5 990 447.5 990 447.5 1022 V1034"/><path d="M447.5 1072 V1084 C447.5 1116 487.429 1116 487.429 1148 V1160" marker-end="url(#arrow-series-square-root-conditions)"/><g class="flow-edge-label" data-edge-label="supported-length:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1057">わからない</text></g></g><g class="flow-node question" data-node="odd-field"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">係数の演算は、2以外の素数を法とし</text><text class="node-title" x="400.5" y="103">て行いますか？</text><text class="node-explanation" x="400.5" y="130">2の逆元と、非零の定数項の逆元を使います。合成数</text><text class="node-explanation" x="400.5" y="148">の法や標数2では同じ手順をそのまま適用できませ</text><text class="node-explanation" x="400.5" y="166">ん。</text></g><g class="flow-node question" data-node="one-or-none"><rect x="272.5" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">解がない場合はそう報告し、解がある</text><text class="node-title" x="288.5" y="485">場合は一つ返せばよいですか？</text><text class="node-explanation" x="288.5" y="512">先頭の零も含めて扱います。最初の非零次数が奇数、</text><text class="node-explanation" x="288.5" y="530">またはその係数が平方非剰余なら、解がないと判定し</text><text class="node-explanation" x="288.5" y="548">ます。</text></g><g class="flow-node question" data-node="supported-length"><rect x="159.5" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="816">質問</text><text class="node-title" x="175.5" y="844">法は998244353で、必要な項</text><text class="node-title" x="175.5" y="867">数と入力長は2の21乗以下ですか？</text><text class="node-explanation" x="175.5" y="894">掲載コードの条件です。別の法では定数項の平方根・</text><text class="node-explanation" x="175.5" y="912">係数積を差し替え、変換長も確認します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1180">候補</text><text class="node-title" x="48" y="1208">先頭の零を外し、定数項の根から正し</text><text class="node-title" x="48" y="1231">い係数を倍々に伸ばす</text><a href="/flowchartcp/techniques/fps-square-root/"><title>二乗すると元の列になる係数を、最初の非零項から求めるの記事へ</title><text x="48" y="1270">二乗すると元の列になる係数を、最初の非零項から</text><text x="48" y="1288">求める</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1160" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1180">分野</text><text class="node-title" x="412" y="1208">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1245">詳細の質問・図へ →</text></a></g></svg>