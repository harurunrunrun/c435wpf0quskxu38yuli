<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-combinatorics flow-desc-combinatorics" width="2204" height="603" viewBox="0 0 2204 603" data-flow-svg="combinatorics"><title id="flow-title-combinatorics">対象と数え方の解法フローチャート</title><desc id="flow-desc-combinatorics">余事象、寄与、対称性、集合、桁を使い分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-combinatorics" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge select-values" data-edge="count-kind:select-values:group-select-values"><title>選ぶ個数・値・桁の条件</title><path d="M987.714 182 V194 C987.714 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-combinatorics)"/><g class="flow-edge-label" data-edge-label="count-kind:select-values:group-select-values" tabindex="0" role="group" aria-label="選択肢：選ぶ個数・値・桁の条件"><rect x="108.5" y="270" width="167" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">選ぶ個数・値・桁の条件</text></g></g><g class="flow-edge place-constraints" data-edge="count-kind:place-constraints:group-place-constraints"><title>物の配分・並びの条件</title><path d="M1033.429 182 V194 C1033.429 226 556 226 556 258 V270"/><path d="M556 308 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-combinatorics)"/><g class="flow-edge-label" data-edge-label="count-kind:place-constraints:group-place-constraints" tabindex="0" role="group" aria-label="選択肢：物の配分・並びの条件"><rect x="479" y="270" width="154" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">物の配分・並びの条件</text></g></g><g class="flow-edge sum-values" data-edge="count-kind:sum-values:group-sum-values"><title>各要素・各位置・部分集合の集計</title><path d="M1079.143 182 V194 C1079.143 226 920 226 920 258 V270"/><path d="M920 308 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-combinatorics)"/><g class="flow-edge-label" data-edge-label="count-kind:sum-values:group-sum-values" tabindex="0" role="group" aria-label="選択肢：各要素・各位置・部分集合の集計"><rect x="810.5" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="920" y="293">各要素・各位置・部分集合の集計</text></g></g><g class="flow-edge symmetry" data-edge="count-kind:symmetry:identity-kind"><title>回転・付け替えで同じになる対象</title><path d="M1124.857 182 V194 C1124.857 226 1284 226 1284 258 V270"/><path d="M1284 308 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-combinatorics)"/><g class="flow-edge-label" data-edge-label="count-kind:symmetry:identity-kind" tabindex="0" role="group" aria-label="選択肢：回転・付け替えで同じになる対象"><rect x="1174.5" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="1284" y="293">回転・付け替えで同じになる対象</text></g></g><g class="flow-edge xor-triples" data-edge="count-kind:xor-triples:xor-triples-route"><title>整数区間の集合から、どの二数のXORも上限以下となる三数を数える</title><path d="M1170.571 182 V194 C1170.571 226 1648 226 1648 258 V270"/><path d="M1648 326 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-combinatorics)"/><g class="flow-edge-label" data-edge-label="count-kind:xor-triples:xor-triples-route" tabindex="0" role="group" aria-label="選択肢：整数区間の集合から、どの二数のXORも上限以下となる三数を数える"><rect x="1525.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="293">整数区間の集合から、どの二数の</text><text text-anchor="middle" x="1648" y="311">XORも上限以下となる三数を数える</text></g></g><g class="flow-edge unknown" data-edge="count-kind:unknown:check"><title>わからない</title><path d="M1216.286 182 V194 C1216.286 226 2012 226 2012 258 V270"/><path d="M2012 308 V338 C2012 370 2012 370 2012 402 V414" marker-end="url(#arrow-combinatorics)"/><g class="flow-edge-label" data-edge-label="count-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1967.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="2012" y="293">わからない</text></g></g><g class="flow-node question" data-node="count-kind"><rect x="942" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="958" y="52">質問</text><text class="node-title" x="958" y="80">数える対象には、どの特徴があります</text><text class="node-title" x="958" y="103">か？</text><text class="node-explanation" x="958" y="130">禁止条件、同じ物の配置、二つの選び方への寄与を分</text><text class="node-explanation" x="958" y="148">けます。</text></g><g class="flow-node route" data-node="group-select-values"><rect x="32" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">選ぶ個数・値・桁の条件</text><text class="node-explanation" x="48" y="489">選ぶ個数、選ぶ値の大小、整数の桁に条件がある場合</text><text class="node-explanation" x="48" y="507">を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-count-selected-values" data-route="count-selected-values"><text x="48" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="group-place-constraints"><rect x="396" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">物の配分・並びの条件</text><text class="node-explanation" x="412" y="489">箱への配分、禁止条件、括弧の接頭辞、隣の色との一</text><text class="node-explanation" x="412" y="507">致を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-count-placement-conditions" data-route="count-placement-conditions"><text x="412" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="group-sum-values"><rect x="760" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">各要素・各位置・部分集合の集計</text><text class="node-explanation" x="776" y="489">位置の組の積、各要素の寄与、部分集合に沿った集計</text><text class="node-explanation" x="776" y="507">を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-count-sum-contributions" data-route="count-sum-contributions"><text x="776" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="identity-kind"><rect x="1124" y="414" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">同じとみなす配置</text><text class="node-explanation" x="1140" y="489">回転や裏返しで同じとみなす配置を数えます。</text><a href="/flowchartcp/flowcharts/#diagram-count-equivalent-arrangements" data-route="count-equivalent-arrangements"><text x="1140" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1852" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="1868" y="434">分野</text><text class="node-title" x="1868" y="462">数え方を小さい例で確かめる</text><text class="node-explanation" x="1868" y="489">一つの対象を何回数えるか、重複や空集合を含めて確</text><text class="node-explanation" x="1868" y="507">認します。</text><a href="/flowchartcp/flowcharts/#diagram-count-small-enumeration" data-route="count-small-enumeration"><text x="1868" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="xor-triples-route"><rect x="1488" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="434">分野</text><text class="node-title" x="1504" y="462">整数区間の集合から、どの二数の</text><text class="node-title" x="1504" y="485">XORも上限以下となる三数を数える</text><a href="/flowchartcp/flowcharts/#diagram-xor-interval-triples-conditions" data-route="xor-interval-triples-conditions"><text x="1504" y="522">詳細の質問・図へ →</text></a></g></svg>