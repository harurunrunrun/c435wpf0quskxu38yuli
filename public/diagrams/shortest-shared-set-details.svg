<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-shortest-shared-set-details flow-desc-shortest-shared-set-details" width="1112" height="1049" viewBox="0 0 1112 1049" data-flow-svg="shortest-shared-set-details"><title id="flow-title-shortest-shared-set-details">共通の集合を通じた移動回数の解法フローチャート</title><desc id="flow-desc-shortest-shared-set-details">要素と集合の二段階の移動で、元の合法な移動と回数を再現できるかを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-shortest-shared-set-details" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="supernode-cost:yes:supernode-zero-one"><title>はい</title><path d="M752.833 182 V194 C752.833 226 556 226 556 258 V270"/><path d="M556 308 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-shortest-shared-set-details)"/><g class="flow-edge-label" data-edge-label="supernode-cost:yes:supernode-zero-one" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">はい</text></g></g><g class="flow-edge no" data-edge="supernode-cost:no:fallback"><title>いいえ</title><path d="M832.833 182 V194 C832.833 226 907 226 907 258 V270"/><path d="M907 308 V320 C907 352 1014.5 352 1014.5 384 V396 V599 C1014.5 631 1014.5 631 1014.5 663 V675 V725 C1014.5 757 609.333 757 609.333 789 V801" marker-end="url(#arrow-shortest-shared-set-details)"/><g class="flow-edge-label" data-edge-label="supernode-cost:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="supernode-cost:unknown:check"><title>わからない</title><path d="M912.833 182 V194 C912.833 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V320 C1035.5 352 1070.5 352 1070.5 384 V396 V599 C1070.5 631 1070.5 631 1070.5 663 V675 V725 C1070.5 757 973.333 757 973.333 789 V801" marker-end="url(#arrow-shortest-shared-set-details)"/><g class="flow-edge-label" data-edge-label="supernode-cost:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="supernode-zero-one:yes:supernode-result"><title>はい</title><path d="M476 587 V599 C476 631 192 631 192 663 V675"/><path d="M192 713 V725 C192 757 192 757 192 789 V801" marker-end="url(#arrow-shortest-shared-set-details)"/><g class="flow-edge-label" data-edge-label="supernode-zero-one:yes:supernode-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="698">はい</text></g></g><g class="flow-edge no" data-edge="supernode-zero-one:no:fallback"><title>いいえ</title><path d="M556 587 V599 C556 631 556 631 556 663 V675"/><path d="M556 713 V725 C556 757 502.667 757 502.667 789 V801" marker-end="url(#arrow-shortest-shared-set-details)"/><g class="flow-edge-label" data-edge-label="supernode-zero-one:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="supernode-zero-one:unknown:check"><title>わからない</title><path d="M636 587 V599 C636 631 920 631 920 663 V675"/><path d="M920 713 V725 C920 757 866.667 757 866.667 789 V801" marker-end="url(#arrow-shortest-shared-set-details)"/><g class="flow-edge-label" data-edge-label="supernode-zero-one:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="698">わからない</text></g></g><g class="flow-node question" data-node="supernode-cost"><rect x="672.8333333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="688.8333333333334" y="52">質問</text><text class="node-title" x="688.8333333333334" y="80">同じ集合への所属を、要素→集合→要</text><text class="node-title" x="688.8333333333334" y="103">素という二段階の移動にできますか？</text><text class="node-explanation" x="688.8333333333334" y="130">要素間を全部結ぶ代わりに、所属関係だけの辺を作り</text><text class="node-explanation" x="688.8333333333334" y="148">ます。</text></g><g class="flow-node question" data-node="supernode-zero-one"><rect x="396" y="396" width="320" height="191" rx="7"/><text class="node-kind" x="412" y="416">質問</text><text class="node-title" x="412" y="444">二段階のうち片方を 0、もう片方を</text><text class="node-title" x="412" y="467"> 1 として、元の費用を再現できま</text><text class="node-title" x="412" y="490">すか？</text><text class="node-explanation" x="412" y="517">集合に入る回数など、何を 1 と数えるかを決めま</text><text class="node-explanation" x="412" y="535">す。元の操作回数との定数差があるなら最後に補正し</text><text class="node-explanation" x="412" y="553">ます。</text></g><g class="flow-node result" data-node="supernode-result"><rect x="32" y="801" width="320" height="216" rx="7"/><text class="node-kind" x="48" y="821">候補</text><text class="node-title" x="48" y="849">共通の集合を補助頂点にして、0・1</text><text class="node-title" x="48" y="872"> の辺で移動する</text><a href="/flowchartcp/techniques/zero-one-bfs-supernodes/"><title>同じ集合内の移動を仮想頂点への入場と退出に分けるの記事へ</title><text x="48" y="911">同じ集合内の移動を仮想頂点への入場と退出に分け</text><text x="48" y="929">る</text></a><a href="/flowchartcp/techniques/zero-one-bfs/"><title>0-1 BFSの記事へ</title><text x="48" y="953">0-1 BFS</text></a><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="48" y="977">グラフへの帰着</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="801" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="821">候補</text><text class="node-title" x="412" y="849">重みと必要な距離を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="888">状態の設計</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="801" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="821">分野</text><text class="node-title" x="776" y="849">移動費用の符号を確かめる</text><text class="node-explanation" x="776" y="876">負の費用が許されるかを問題文の範囲から確かめ、適</text><text class="node-explanation" x="776" y="894">用できる探索を判断します。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-edge-cost-sign-check" data-route="shortest-edge-cost-sign-check"><text x="776" y="922">詳細の質問・図へ →</text></a></g></svg>