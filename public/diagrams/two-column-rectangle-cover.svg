<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-two-column-rectangle-cover flow-desc-two-column-rectangle-cover" width="860" height="1307" viewBox="0 0 860 1307" data-flow-svg="two-column-rectangle-cover"><title id="flow-title-two-column-rectangle-cover">二列を任意の長方形で敷き詰めるの解法フローチャート</title><desc id="flow-desc-two-column-rectangle-cover">最上段の二マスが同じ部品か、別の部品かだけを残します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-two-column-rectangle-cover" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="board:yes:blocks"><title>はい</title><path d="M539.722 164 V176 C539.722 208 420.667 208 420.667 240 V252"/><path d="M420.667 290 V302 C420.667 334 420.667 334 420.667 366 V378" marker-end="url(#arrow-two-column-rectangle-cover)"/><g class="flow-edge-label" data-edge-label="board:yes:blocks" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="275">はい</text></g></g><g class="flow-edge no" data-edge="board:no:fallback"><title>いいえ</title><path d="M619.722 164 V176 C619.722 208 655 208 655 240 V252"/><path d="M655 290 V302 C655 334 762.5 334 762.5 366 V378 V540 C762.5 572 762.5 572 762.5 604 V616 V666 C762.5 698 458 698 458 730 V742 V922 C458 954 360 954 360 986 V998 V1048 C360 1080 304 1080 304 1112 V1124" marker-end="url(#arrow-two-column-rectangle-cover)"/><g class="flow-edge-label" data-edge-label="board:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="275">いいえ</text></g></g><g class="flow-edge unknown" data-edge="board:unknown:check"><title>わからない</title><path d="M699.722 164 V176 C699.722 208 783.5 208 783.5 240 V252"/><path d="M783.5 290 V302 C783.5 334 818.5 33