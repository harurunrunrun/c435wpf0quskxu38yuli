954 450 954 450 986 V998"/><path d="M450 1036 V1048 C450 1080 384 1080 384 1112 V1124" marker-end="url(#arrow-two-column-rectangle-cover)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 892 V922 C668 954 655 954 655 986 V998"/><path d="M655 1036 V1048 C655 1080 614.667 1080 614.667 1112 V1124" marker-end="url(#arrow-two-column-rectangle-cover)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 892 V922 C748 954 783.5 954 783.5 986 V998"/><path d="M783.5 1036 V1048 C783.5 1080 721.333 1080 721.333 1112 V1124" marker-end="url(#arrow-two-column-rectangle-cover)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1021">わからない</text></g></g><g class="flow-node question" data-node="board"><rect x="459.7222222222223" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">盤面は幅 2・整数高さの長方形で、</text><text class="node-title" x="475.7222222222223" y="103">穴なく全体を覆いますか？</text><text class="node-explanation" x="475.7222222222223" y="130">部品の幅・高さは正整数で、軸に沿って置きます。</text></g><g class="flow-node question" data-node="blocks"><rect x="260.6666666666667" y="378" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="398">質問</text><text class="node-title" x="276.6666666666667" y="426">部品は高さの上限なく使え、分割線が</text><text class="node-title" x="276.6666666666667" y="449">違う配置を別に数えますか？</text><text class="node-explanation" x="276.6666666666667" y="476">部品の種類・個数に制限はありません。反転して異な</text><text class="node-explanation" x="276.6666666666667" y="494">る見た目になる配置も別に数えます。</text></g><g class="flow-node result" data-node="tile-result"><rect x="32" y="742" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="762">候補</text><text class="node-title" x="48" y="790">最上段の中央が同じ長方形か別かを二</text><text class="node-title" x="48" y="813">状態にして、次の段へ伸ばす</text><a href="/flowchartcp/techniques/two-column-rectangle-tiles/"><title>幅二の矩形敷き詰めは、上段の二マスが同じ部品かだけを持つの記事へ</title><text x="48" y="852">幅二の矩形敷き詰めは、上段の二マスが同じ部品か</text><text x="48" y="870">だけを持つ</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="742" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="762">質問</text><text class="node-title" x="524" y="790">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="813">確認できますか？</text><text class="node-explanation" x="524" y="840">使える操作、残す履歴、求める個数や最適値を確認し</text><text class="node-explanation" x="524" y="858">ます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1124" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1144">候補</text><text class="node-title" x="160" y="1172">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1211">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1235">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1124" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1144">分野</text><text class="node-title" x="524" y="1172">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1209">詳細の質問・図へ →</text></a></g></svg>