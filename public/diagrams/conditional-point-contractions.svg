<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-conditional-point-contractions flow-desc-conditional-point-contractions" width="793" height="2193" viewBox="0 0 793 2193" data-flow-svg="conditional-point-contractions"><title id="flow-title-conditional-point-contractions">条件付き一括移動と個体の位置の解法フローチャート</title><desc id="flow-desc-conditional-point-contractions">操作の単位と、必要な制約を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-conditional-point-contractions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge triangle" data-edge="movement-kind:triangle:triangle-condition"><title>三角形x+y≤N内の点を、水平・垂直の掃除で境界へ押す</title><path d="M399.5 182 V194 C399.5 226 216.5 226 216.5 258 V270"/><path d="M216.5 326 V338 C216.5 370 402.833 370 402.833 402 V414" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="movement-kind:triangle:triangle-condition" tabindex="0" role="group" aria-label="選択肢：三角形x+y≤N内の点を、水平・垂直の掃除で境界へ押す"><rect x="94" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="216.5" y="293">三角形x+y≤N内の点を、水平・垂</text><text text-anchor="middle" x="216.5" y="311">直の掃除で境界へ押す</text></g></g><g class="flow-edge intervals" data-edge="movement-kind:intervals:shrink-only"><title>指定点を含む区間の片端を縮め、追加とID照会を行う</title><path d="M479.5 182 V194 C479.5 226 505.5 226 505.5 258 V270"/><path d="M505.5 326 V338 C505.5 370 612.833 370 612.833 402 V414 V617 C612.833 649 566 649 566 681 V693 V743 C566 775 530.833 775 530.833 807 V819" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="movement-kind:intervals:shrink-only" tabindex="0" role="group" aria-label="選択肢：指定点を含む区間の片端を縮め、追加とID照会を行う"><rect x="383" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="505.5" y="293">指定点を含む区間の片端を縮め、追加</text><text text-anchor="middle" x="505.5" y="311">とID照会を行う</text></g></g><g class="flow-edge unknown" data-edge="movement-kind:unknown:check"><title>わからない</title><path d="M559.5 182 V194 C559.5 226 716.5 226 716.5 258 V270"/><path d="M716.5 308 V338 C716.5 370 755 370 755 402 V414 V617 C755 649 755 649 755 681 V693 V743 C755 775 755 775 755 807 V819 V1004 C755 1036 755 1036 755 1068 V1080 V1130 C755 1162 755 1162 755 1194 V1206 V1386 C755 1418 755 1418 755 1450 V1462 V1512 C755 1544 755 1544 755 1576 V1588 V1791 C755 1823 755 1823 755 1855 V1867 V1917 C755 1949 684 1949 684 1981 V1993" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="movement-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="672" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="716.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="triangle-condition:yes:shrink-only"><title>はい</title><path d="M402.833 605 V617 C402.833 649 476 649 476 681 V693"/><path d="M476 731 V743 C476 775 424.167 775 424.167 807 V819" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="triangle-condition:yes:shrink-only" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="436" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="476" y="716">はい</text></g></g><g class="flow-edge no" data-edge="triangle-condition:no:check"><title>いいえ</title><path d="M322.833 605 V617 C322.833 649 72 649 72 681 V693"/><path d="M72 731 V743 C72 775 55 775 55 807 V819 V1004 C55 1036 55 1036 55 1068 V1080 V1130 C55 1162 55 1162 55 1194 V1206 V1386 C55 1418 55 1418 55 1450 V1462 V1512 C55 1544 55 1544 55 1576 V1588 V1791 C55 1823 162 1823 162 1855 V1867 V1917 C162 1949 428 1949 428 1981 V1993" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="triangle-condition:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ">