76" y="1103">いいえ</text></g></g><g class="flow-edge unknown" data-edge="shrink-only:unknown:check"><title>わからない</title><path d="M557.5 992 V1004 C557.5 1036 604.5 1036 604.5 1068 V1080"/><path d="M604.5 1118 V1130 C604.5 1162 643 1162 643 1194 V1206 V1386 C643 1418 643 1418 643 1450 V1462 V1512 C643 1544 643 1544 643 1576 V1588 V1791 C643 1823 643 1823 643 1855 V1867 V1917 C643 1949 620 1949 620 1981 V1993" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="shrink-only:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="560" y="1080" width="89" height="38" rx="5"/><text text-anchor="middle" x="604.5" y="1103">わからない</text></g></g><g class="flow-edge yes" data-edge="known-coordinates:yes:size"><title>はい</title><path d="M285.5 1374 V1386 C285.5 1418 240 1418 240 1450 V1462"/><path d="M240 1500 V1512 C240 1544 265 1544 265 1576 V1588" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="known-coordinates:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="200" y="1462" width="80" height="38" rx="5"/><text text-anchor="middle" x="240" y="1485">はい</text></g></g><g class="flow-edge no" data-edge="known-coordinates:no:check"><title>いいえ</title><path d="M365.5 1374 V1386 C365.5 1418 364 1418 364 1450 V1462"/><path d="M364 1500 V1512 C364 1544 475 1544 475 1576 V1588 V1791 C475 1823 475 1823 475 1855 V1867 V1917 C475 1949 524 1949 524 1981 V1993" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="known-coordinates:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="324" y="1462" width="80" height="38" rx="5"/><text text-anchor="middle" x="364" y="1485">いいえ</text></g></g><g class="flow-edge unknown" data-edge="known-coordinates:unknown:check"><title>わからない</title><path d="M445.5 1374 V1386 C445.5 1418 492.5 1418 492.5 1450 V1462"/><path d="M492.5 1500 V1512 C492.5 1544 531 1544 531 1576 V1588 V1791 C531 1823 531 1823 531 1855 V1867 V1917 C531 1949 556 1949 556 1981 V1993" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="known-coordinates:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="448" y="1462" width="89" height="38" rx="5"/><text text-anchor="middle" x="492.5" y="1485">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M185 1779 V1791 C185 1823 72 1823 72 1855 V1867"/><path d="M72 1905 V1917 C72 1949 192 1949 192 1981 V1993" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="32" y="1867" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="1890">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M265 1779 V1791 C265 1823 252 1823 252 1855 V1867"/><path d="M252 1905 V1917 C252 1949 460 1949 460 1981 V1993" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="212" y="1867" width="80" height="38" rx="5"/><text text-anchor="middle" x="252" y="1890">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M345 1779 V1791 C345 1823 380.5 1823 380.5 1855 V1867"/><path d="M380.5 1905 V1917 C380.5 1949 492 1949 492 1981 V1993" marker-end="url(#arrow-conditional-point-contractions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="336" y="1867" width="89" height="38" rx="5"/><text text-anchor="middle" x="380.5" y="1890">わからない</text></g></g><g class="flow-node question" data-node="movement-kind"><rect x="319.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="335.5" y="52">質問</text><text class="node-title" x="335.5" y="80">どの対象を、どのようにまとめて変更</text><text class="node-title" x="335.5" y="103">しますか？</text><text class="node-explanation" x="335.5" y="130">個体番号を保ったまま、位置または区間の端点を変更</text><text class="node-explanation" x="335.5" y="148">します。</text></g><g class="flow-node question" data-node="triangle-condition"><rect x="242.83333333333331" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="258.8333333333333" y="434">質問</text><text class="node-title" x="258.8333333333333" y="462">右向きはx&lt;N−Lかつy≤Lをx=</text><text class="node-title" x="258.8333333333333" y="485">N−Lへ、上向きはx≤Lかつy&lt;N</text><text class="node-title" x="258.8333333333333" y="508">−Lをy=N−Lへ動かしますか？</text><text class="node-explanation" x="258.8333333333333" y="535">x+y≤Nの点を[y,N−x]へ写すと、対象が切</text><text class="node-explanation" x="258.8333333333333" y="553">断点を含む区間になり、片端の縮小に一致します。等</text><text class="node-explanation" x="258.8333333333333" y="571">号では元からその境界にあり、位置は変わりません。</text></g><g class="flow-node question" data-node="shrink-only"><rect x="317.5" y="819" width="320" height="173" rx="7"/><text class="node-kind" x="333.5" y="839">質問</text><text class="node-title" x="333.5" y="867">空でない区間を伸ばさず、指定点を含</text><text class="node-title" x="333.5" y="890">む区間の片端をその点に縮める操作だ</text><text class="node-title" x="333.5" y="913">けですか？</text><text class="node-explanation" x="333.5" y="940">追加した個体は追加時点から参加し、以前の変更は受</text><text class="node-explanation" x="333.5" y="958">けません。個体IDは重複座標でも別々に保ちます。</text></g><g class="flow-node question" data-node="known-coordinates"><rect x="205.5" y="1206" width="320" height="168" rx="7"/><text class="node-kind" x="221.5" y="1226">質問</text><text class="node-title" x="221.5" y="1254">使う端点と切断点を事前に集めて圧縮</text><text class="node-title" x="221.5" y="1277">できますか？</text><text class="node-explanation" x="221.5" y="1304">イベント順は変えず、座標だけを準備します。未登録</text><text class="node-explanation" x="221.5" y="1322">の切断点を後から使う操作には、そのまま対応しませ</text><text class="node-explanation" x="221.5" y="1340">ん。</text></g><g class="flow-node question" data-node="size"><rect x="105" y="1588" width="320" height="191" rx="7"/><text class="node-kind" x="121" y="1608">質問</text><text class="node-title" x="121" y="1636">追加後の個体は150万以下で、端</text><text class="node-title" x="121" y="1659">点・切断点の登録件数は300万程度</text><text class="node-title" x="121" y="1682">に収まりますか？</text><text class="node-explanation" x="121" y="1709">元の点移動ではN≤10^9、初期個体50万以下、</text><text class="node-explanation" x="121" y="1727">操作100万以下が掲載実装の条件です。座標・操</text><text class="node-explanation" x="121" y="1745">作・出力も含めて領域を見積もります。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1993" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="2013">候補</text><text class="node-title" x="48" y="2041">縮小に合わせて格納ノードを降り、同</text><text class="node-title" x="48" y="2064">じ端点の個体をまとめる</text><a href="/flowchartcp/techniques/interval-stabbing-endpoint-contraction-dsu/"><title>切断点を含む区間の片端を縮めるなら、区間木と端点ごとの併合集合で管理するの記事へ</title><text x="48" y="2103">切断点を含む区間の片端を縮めるなら、区間木と端</text><text x="48" y="2121">点ごとの併合集合で管理する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1993" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="2013">分野</text><text class="node-title" x="412" y="2041">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="2078">詳細の質問・図へ →</text></a></g></svg>