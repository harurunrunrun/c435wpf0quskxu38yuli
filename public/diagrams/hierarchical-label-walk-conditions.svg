e-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="reset-order:yes:endpoints"><title>はい</title><path d="M464.5 205 V217 C464.5 249 419 249 419 281 V293"/><path d="M419 331 V343 C419 375 432.5 375 432.5 407 V419" marker-end="url(#arrow-hierarchical-label-walk-conditions)"/><g class="flow-edge-label" data-edge-label="reset-order:yes:endpoints" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="316">はい</text></g></g><g class="flow-edge no" data-edge="reset-order:no:check"><title>いいえ</title><path d="M544.5 205 V217 C544.5 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V604 C654 636 654 636 654 668 V680 V730 C654 762 654 762 654 794 V806 V991 C654 1023 654 1023 654 1055 V1067 V1117 C654 1149 624.571 1149 624.571 1181 V1193" marker-end="url(#arrow-hierarchical-label-walk-conditions)"/><g class="flow-edge-label" data-edge-label="reset-order:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="reset-order:unknown:check"><title>わからない</title><path d="M624.5 205 V217 C624.5 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 407 V419 V604 C710 636 710 636 710 668 V680 V730 C710 762 710 762 710 794 V806 V991 C710 1023 710 1023 710 1055 V1067 V1117 C710 1149 670.286 1149 670.286 1181 V1193" marker-end="url(#arrow-hierarchical-label-walk-conditions)"/><g class="flow-edge-label" data-edge-label="reset-order:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="endpoints:yes:bounded-sizes"><title>はい</title><path d="M352.5 592 V604 C352.5 636 307 636 307 668 V680"/><path d="M307 718 V730 C307 762 319.5 762 319.5 794 V806" marker-end="url(#arrow-hierarchical-label-walk-conditions)"/><g class="flow-edge-label" data-edge-label="endpoints:yes:bounded-sizes" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="703">はい</text></g></g><g class="flow-edge no" data-edge="endpoints:no:check"><title>いいえ</title><path d="M432.5 592 V604 C432.5 636 431 636 431 668 V680"/><path d="M431 718 V730 C431 762 542 762 542 794 V806 V991 C542 1023 542 1023 542 1055 V1067 V1117 C542 1149 533.143 1149 533.143 1181 V1193" marker-end="url(#arrow-hierarchical-label-walk-conditions)"/><g class="flow-edge-label" data-edge-label="endpoints:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="703">いいえ</text></g></g><g class="flow-edge unknown" data-edge="endpoints:unknown:check"><title>わからない</title><path d="M512.5 592 V604 C512.5 636 559.5 636 559.5 668 V680"/><path d="M559.5 718 V730 C559.5 762 598 762 598 794 V806 V991 C598 1023 598 1023 598 1055 V1067 V1117 C598 1149 578.857 1149 578.857 1181 V1193" marker-end="url(#arrow-hierarchical-label-walk-conditions)"/><g class="flow-edge-label" data-edge-label="endpoints:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="680" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-edge yes" data-edge="bounded-sizes:yes:answer"><title>はい</title><path d="M239.5 979 V991 C239.5 1023 192 1023 192 1055 V1067"/><path d="M192 1105 V1117 C192 1149 192 1149 192 1181 V1193" marker-end="url(#arrow-hierarchical-label-walk-conditions)"/><g class="flow-edge-label" data-edge-label="bounded-sizes:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1067" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1090">はい</text></g></g><g class="flow-edge no" data-edge="bounded-sizes:no:check"><title>いいえ</title><path d="M319.5 979 V991 C319.5 1023 319 1023 319 1055 V1067"/><path d="M319 1105 V1117 C319 1149 441.714 1149 441.714 1181 V1193" marker-end="url(#arrow-hierarchical-label-walk-conditions)"/><g class="flow-edge-label" data-edge-label="bounded-sizes:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1067" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1090">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounded-sizes:unknown:check"><title>わからない</title><path d="M399.5 979 V991 C399.5 1023 447.5 1023 447.5 1055 V1067"/><path d="M447.5 1105 V1117 C447.5 1149 487.429 1149 487.429 1181 V1193" marker-end="url(#arrow-hierarchical-label-walk-conditions)"/><g class="flow-edge-label" data-edge-label="bounded-sizes:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1067" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1090">わからない</text></g></g><g class="flow-node question" data-node="reset-order"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">同じ番号を再び使うまでに、その番号</text><text class="node-title" x="400.5" y="103">より大きい番号を使う必要があります</text><text class="node-title" x="400.5" y="126">か？</text><text class="node-explanation" x="400.5" y="153">使える最大番号は高々一回なので、その番号を使う位</text><text class="node-explanation" x="400.5" y="171">置で列を前後に分けられます。</text></g><g class="flow-node question" data-node="endpoints"><rect x="272.5" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">始点と最初の番号、終点と最後の番号</text><text class="node-title" x="288.5" y="490">が指定され、初期位置での一回の使用</text><text class="node-title" x="288.5" y="513">も数えますか？</text><text class="node-explanation" x="288.5" y="540">空の番号列は数えません。移動なしの一回押下は、始</text><text class="node-explanation" x="288.5" y="558">終条件が一致するときに数えます。</text></g><g class="flow-node question" data-node="bounded-sizes"><rect x="159.5" y="806" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="826">質問</text><text class="node-title" x="175.5" y="854">頂点数・番号数・質問数が小さく、質</text><text class="node-title" x="175.5" y="877">問の始終条件を端点として表へ加えら</text><text class="node-title" x="175.5" y="900">れますか？</text><text class="node-explanation" x="175.5" y="927">掲載実装は全て60以下。番号上限の層を一つずつ増</text><text class="node-explanation" x="175.5" y="945">やして、全質問の計算を共有します。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1193" width="320" height="191" rx="7"/><text class="node-kind" x="48" y="1213">候補</text><text class="node-title" x="48" y="1241">最大番号を使う部屋で前後に分割し、</text><text class="node-title" x="48" y="1264">問い合わせ端点も含めた個数表へ外積</text><text class="node-title" x="48" y="1287">を足す</text><a href="/flowchartcp/techniques/hierarchical-reset-walk-count/"><title>大きい番号で再使用できる移動列は、最大番号の前後に分けて数えるの記事へ</title><text x="48" y="1326">大きい番号で再使用できる移動列は、最大番号の前</text><text x="48" y="1344">後に分けて数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1193" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1213">分野</text><text class="node-title" x="412" y="1241">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1278">詳細の質問・図へ →</text></a></g></svg>