<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-string-prefix-structure flow-desc-string-prefix-structure" width="1952" height="1343" viewBox="0 0 1952 1343" data-flow-svg="string-prefix-structure"><title id="flow-title-string-prefix-structure">接頭辞・接尾辞と周期の解法フローチャート</title><desc id="flow-desc-string-prefix-structure">全体の両端が一致する長さと、繰り返しの単位を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-string-prefix-structure" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge borders" data-edge="kind:borders:border-occurrences"><title>両端と同じ文字列の出現回数</title><path d="M1170.125 182 V194 C1170.125 226 542 226 542 258 V270"/><path d="M542 308 V338 C542 370 542 370 542 402 V414" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="kind:borders:border-occurrences" tabindex="0" role="group" aria-label="選択肢：両端と同じ文字列の出現回数"><rect x="445.5" y="270" width="193" height="38" rx="5"/><text text-anchor="middle" x="542" y="293">両端と同じ文字列の出現回数</text></g></g><g class="flow-edge partial-period" data-edge="kind:partial-period:partial-period-check"><title>末尾が途中でもよい、すべての繰り返しの長さ</title><path d="M1234.125 182 V194 C1234.125 226 1286 226 1286 258 V270"/><path d="M1286 326 V338 C1286 370 1286 370 1286 402 V414" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="kind:partial-period:partial-period-check" tabindex="0" role="group" aria-label="選択肢：末尾が途中でもよい、すべての繰り返しの長さ"><rect x="1163.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1286" y="293">末尾が途中でもよい、すべての繰り返</text><text text-anchor="middle" x="1286" y="311">しの長さ</text></g></g><g class="flow-edge period" data-edge="kind:period:period-divides"><title>全体を同じ文字列の繰り返しにする最短の長さ</title><path d="M1362.125 182 V194 C1362.125 226 1729 226 1729 258 V270"/><path d="M1729 326 V338 C1729 370 1729 370 1729 402 V414" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="kind:period:period-divides" tabindex="0" role="group" aria-label="選択肢：全体を同じ文字列の繰り返しにする最短の長さ"><rect x="1606.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1729" y="293">全体を同じ文字列の繰り返しにする最</text><text text-anchor="middle" x="1729" y="311">短の長さ</text></g></g><g class="flow-edge unknown" data-edge="kind:unknown:check"><title>わからない</title><path d="M1298.125 182 V194 C1298.125 226 1507.5 226 1507.5 258 V270"/><path d="M1507.5 308 V338 C1507.5 370 1507.5 370 1507.5 402 V414 V594 C1507.5 626 1507.5 626 1507.5 658 V670 V720 C1507.5 752 1064 752 1064 784 V796" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1463" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1507.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="border-occurrences:yes:border-result"><title>はい</title><path d="M462 564 V594 C462 626 192 626 192 658 V670"/><path d="M192 708 V720 C192 752 192 752 192 784 V796" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="border-occurrences:yes:border-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="693">はい</text></g></g><g class="flow-edge no" data-edge="border-occurrences:no:fallback"><title>いいえ</title><path d="M542 564 V594 C542 626 402 626 402 658 V670"/><path d="M402 708 V720 C402 752 402 752 402 784 V796 V958 C402 990 630.667 990 630.667 1022 V1034 V1084 C630.667 1116 550.667 1116 550.667 1148 V1160" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="border-occurrences:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="border-occurrences:unknown:check"><title>わからない</title><path d="M622 564 V594 C622 626 1032 626 1032 658 V670"/><path d="M1032 708 V720 C1032 752 936 752 936 784 V796" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="border-occurrences:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="987.5" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="1032" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="period-divides:yes:period-result"><title>はい</title><path d="M1729 564 V594 C1729 626 1730.5 626 1730.5 658 V670"/><path d="M1730.5 708 V720 C1730.5 752 1396 752 1396 784 V796" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="period-divides:yes:period-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1690.5" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="1730.5" y="693">はい</text></g></g><g class="flow-edge no" data-edge="period-divides:no:period-full"><title>いいえ</title><path d="M1809 564 V594 C1809 626 1854.5 626 1854.5 658 V670"/><path d="M1854.5 708 V720 C1854.5 752 1760 752 1760 784 V796" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="period-divides:no:period-full" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1814.5" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="1854.5" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="period-divides:unknown:check"><title>わからない</title><path d="M1649 564 V594 C1649 626 1602 626 1602 658 V670"/><path d="M1602 708 V720 C1602 752 1128 752 1128 784 V796" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="period-divides:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1557.5" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="1602" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M952 946 V958 C952 990 776.667 990 776.667 1022 V1034"/><path d="M776.667 1072 V1084 C776.667 1116 710.667 1116 710.667 1148 V1160" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="736.6666666666666" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="776.6666666666666" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1032 946 V958 C1032 990 1220.25 990 1220.25 1022 V1034"/><path d="M1220.25 1072 V1084 C1220.25 1116 1166.917 1116 1166.917 1148 V1160" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1180.25" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="1220.25" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1112 946 V958 C1112 990 1348.75 990 1348.75 1022 V1034"/><path d="M1348.75 1072 V1084 C1348.75 1116 1273.583 1116 1273.583 1148 V1160" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1304.25" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="1348.75" y="1057">わからない</text></g></g><g class="flow-edge yes" data-edge="partial-period-check:yes:partial-period-result"><title>はい</title><path d="M1286 582 V594 C1286 626 1284.5 626 1284.5 658 V670"/><path d="M1284.5 708 V720 C1284.5 752 668 752 668 784 V796" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="partial-period-check:yes:partial-period-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1244.5" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284.5" y="693">はい</text></g></g><g class="flow-edge no" data-edge="partial-period-check:no:fallback"><title>いいえ</title><path d="M1206 582 V594 C1206 626 1160.5 626 1160.5 658 V670"/><path d="M1160.5 708 V720 C1160.5 752 458 752 458 784 V796 V958 C458 990 686.667 990 686.667 1022 V1034 V1084 C686.667 1116 630.667 1116 630.667 1148 V1160" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="partial-period-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1120.5" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="1160.5" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="partial-period-check:unknown:check"><title>わからない</title><path d="M1366 582 V594 C1366 626 1413 626 1413 658 V670"/><path d="M1413 708 V720 C1413 752 1000 752 1000 784 V796" marker-end="url(#arrow-string-prefix-structure)"/><g class="flow-edge-label" data-edge-label="partial-period-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1368.5" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="1413" y="693">わからない</text></g></g><g class="flow-node question" data-node="kind"><rect x="1106.125" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1122.125" y="52">質問</text><text class="node-title" x="1122.125" y="80">一致する接頭辞と接尾辞について何を</text><text class="node-title" x="1122.125" y="103">求めますか？</text><text class="node-explanation" x="1122.125" y="130">同じ文字列の出現回数と、全体を割り切る周期では確</text><text class="node-explanation" x="1122.125" y="148">認する条件が異なります。</text></g><g class="flow-node question" data-node="border-occurrences"><rect x="382" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="398" y="434">質問</text><text class="node-title" x="398" y="462">重なって現れる同じ文字列も、別の出</text><text class="node-title" x="398" y="485">現として数えますか？</text><text class="node-explanation" x="398" y="512">接頭辞に一致する長さを短い接頭辞へ伝えて数える方</text><text class="node-explanation" x="398" y="530">法は、重なる出現も含めます。</text></g><g class="flow-node result" data-node="border-result"><rect x="32" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="816">候補</text><text class="node-title" x="48" y="844">接頭辞の出現回数を、短い一致先へ伝</text><text class="node-title" x="48" y="867">える</text><a href="/flowchartcp/techniques/prefix-border-occurrences/"><title>接頭辞の出現回数を、短い一致先へ集約するの記事へ</title><text x="48" y="906">接頭辞の出現回数を、短い一致先へ集約する</text></a></g><g class="flow-node question" data-node="period-divides"><rect x="1569" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1585" y="434">質問</text><text class="node-title" x="1585" y="462">候補の単位の長さが、文字列全体の長</text><text class="node-title" x="1585" y="485">さを割り切りますか？</text><text class="node-explanation" x="1585" y="512">p=n−最長の真の接頭辞兼接尾辞の長さを候補にし</text><text class="node-explanation" x="1585" y="530">ます。割り切らなければ全体の長さを答えにします。</text></g><g class="flow-node result" data-node="period-result"><rect x="1236" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="1252" y="816">候補</text><text class="node-title" x="1252" y="844">最長の両端一致から周期の候補を取</text><text class="node-title" x="1252" y="867">り、割り切れるか調べる</text><a href="/flowchartcp/techniques/period-from-border/"><title>周期の長さを接頭辞と接尾辞の一致から求めるの記事へ</title><text x="1252" y="906">周期の長さを接頭辞と接尾辞の一致から求める</text></a></g><g class="flow-node result" data-node="period-full"><rect x="1600" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="1616" y="816">候補</text><text class="node-title" x="1616" y="844">割り切れない周期候補を退け、全体を</text><text class="node-title" x="1616" y="867">一単位にする</text><a href="/flowchartcp/techniques/period-from-border/"><title>周期の長さを接頭辞と接尾辞の一致から求めるの記事へ</title><text x="1616" y="906">周期の長さを接頭辞と接尾辞の一致から求める</text></a></g><g class="flow-node question" data-node="check"><rect x="872" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="888" y="816">質問</text><text class="node-title" x="888" y="844">入力例から、判定に使う条件を一つず</text><text class="node-title" x="888" y="867">つ確かめられますか？</text><text class="node-explanation" x="888" y="894">どの条件が問題文で保証され、どの条件を証明する必</text><text class="node-explanation" x="888" y="912">要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="470.66666666666663" y="1160" width="320" height="151" rx="7"/><text class="node-kind" x="486.66666666666663" y="1180">候補</text><text class="node-title" x="486.66666666666663" y="1208">必要な条件を小さい例で確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="486.66666666666663" y="1247">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="486.66666666666663" y="1271">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1060.25" y="1160" width="320" height="121" rx="7"/><text class="node-kind" x="1076.25" y="1180">分野</text><text class="node-title" x="1076.25" y="1208">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1076.25" y="1245">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="partial-period-check"><rect x="1126" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="1142" y="434">質問</text><text class="node-title" x="1142" y="462">最後の繰り返しは途中で終わってよ</text><text class="node-title" x="1142" y="485">く、すべての周期を列挙しますか？</text><text class="node-explanation" x="1142" y="512">長さ p の周期では、長さ n−p の接頭辞と接</text><text class="node-explanation" x="1142" y="530">尾辞が一致すればよく、n が p で割り切れる必</text><text class="node-explanation" x="1142" y="548">要はありません。</text></g><g class="flow-node result" data-node="partial-period-result"><rect x="508" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="816">候補</text><text class="node-title" x="524" y="844">両端が一致する各長さを、末尾途中の</text><text class="node-title" x="524" y="867">周期の長さへ写す</text><a href="/flowchartcp/techniques/period-from-border/"><title>周期の長さを接頭辞と接尾辞の一致から求めるの記事へ</title><text x="524" y="906">周期の長さを接頭辞と接尾辞の一致から求める</text></a></g></svg>