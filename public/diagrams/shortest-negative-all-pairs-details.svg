<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-shortest-negative-all-pairs-details flow-desc-shortest-negative-all-pairs-details" width="1112" height="1013" viewBox="0 0 1112 1013" data-flow-svg="shortest-negative-all-pairs-details"><title id="flow-title-shortest-negative-all-pairs-details">負の辺を含む全ての始点からの距離の解法フローチャート</title><desc id="flow-desc-shortest-negative-all-pairs-details">負閉路がなく、経路の優劣を保って辺の費用を非負に変えられるかを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-shortest-negative-all-pairs-details" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="reweight-cycle:yes:reweight-potential"><title>はい</title><path d="M752.833 182 V194 C752.833 226 556 226 556 258 V270"/><path d="M556 308 V320 C556 352 556 352 556 384 V396" marker-end="url(#arrow-shortest-negative-all-pairs-details)"/><g class="flow-edge-label" data-edge-label="reweight-cycle:yes:reweight-potential" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">はい</text></g></g><g class="flow-edge no" data-edge="reweight-cycle:no:fallback"><title>いいえ</title><path d="M832.833 182 V194 C832.833 226 907 226 907 258 V270"/><path d="M907 308 V320 C907 352 1014.5 352 1014.5 384 V396 V581 C1014.5 613 1014.5 613 1014.5 645 V657 V707 C1014.5 739 609.333 739 609.333 771 V783" marker-end="url(#arrow-shortest-negative-all-pairs-details)"/><g class="flow-edge-label" data-edge-label="reweight-cycle:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="reweight-cycle:unknown:check"><title>わからない</title><path d="M912.833 182 V194 C912.833 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V320 C1035.5 352 1070.5 352 1070.5 384 V396 V581 C1070.5 613 1070.5 613 1070.5 645 V657 V707 C1070.5 739 973.333 739 973.333 771 V783" marker-end="url(#arrow-shortest-negative-all-pairs-details)"/><g class="flow-edge-label" data-edge-label="reweight-cycle:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="reweight-potential:yes:reweight-result"><title>はい</title><path d="M476 569 V581 C476 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-shortest-negative-all-pairs-details)"/><g class="flow-edge-label" data-edge-label="reweight-potential:yes:reweight-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="reweight-potential:no:fallback"><title>いいえ</title><path d="M556 569 V581 C556 613 556 613 556 645 V657"/><path d="M556 695 V707 C556 739 502.667 739 502.667 771 V783" marker-end="url(#arrow-shortest-negative-all-pairs-details)"/><g class="flow-edge-label" data-edge-label="reweight-potential:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="reweight-potential:unknown:check"><title>わからない</title><path d="M636 569 V581 C636 613 920 613 920 645 V657"/><path d="M920 695 V707 C920 739 866.667 739 866.667 771 V783" marker-end="url(#arrow-shortest-negative-all-pairs-details)"/><g class="flow-edge-label" data-edge-label="reweight-potential:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="680">わからない</text></g></g><g class="flow-node question" data-node="reweight-cycle"><rect x="672.8333333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="688.8333333333334" y="52">質問</text><text class="node-title" x="688.8333333333334" y="80">どの頂点からも到達できる扱いで、負</text><text class="node-title" x="688.8333333333334" y="103">閉路がないと確認できますか？</text><text class="node-explanation" x="688.8333333333334" y="130">負閉路を含むグラフでは有限の最短距離が定まらない</text><text class="node-explanation" x="688.8333333333334" y="148">組があります。</text></g><g class="flow-node question" data-node="reweight-potential"><rect x="396" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="412" y="416">質問</text><text class="node-title" x="412" y="444">頂点ごとの値 h で、w(u,v)</text><text class="node-title" x="412" y="467">+h[u]−h[v] がすべて非負</text><text class="node-title" x="412" y="490">になりますか？</text><text class="node-explanation" x="412" y="517">経路上の h の項は始点と終点の差にまとまり、元</text><text class="node-explanation" x="412" y="535">の経路の優劣を保ちます。</text></g><g class="flow-node result" data-node="reweight-result"><rect x="32" y="783" width="320" height="198" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">頂点の値を足し引きして、負の辺を非</text><text class="node-title" x="48" y="854">負へ置き換える</text><a href="/flowchartcp/techniques/dijkstra-potential-reweight/"><title>負の辺を頂点の値の差で非負へ変換するの記事へ</title><text x="48" y="893">負の辺を頂点の値の差で非負へ変換する</text></a><a href="/flowchartcp/techniques/bellman-ford/"><title>ベルマン–フォード法の記事へ</title><text x="48" y="917">ベルマン–フォード法</text></a><a href="/flowchartcp/techniques/dijkstra/"><title>ダイクストラ法の記事へ</title><text x="48" y="941">ダイクストラ法</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="783" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="803">候補</text><text class="node-title" x="412" y="831">重みと必要な距離を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="870">状態の設計</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="783" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="803">分野</text><text class="node-title" x="776" y="831">移動費用の符号を確かめる</text><text class="node-explanation" x="776" y="858">負の費用が許されるかを問題文の範囲から確かめ、適</text><text class="node-explanation" x="776" y="876">用できる探索を判断します。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-edge-cost-sign-check" data-route="shortest-edge-cost-sign-check"><text x="776" y="904">詳細の質問・図へ →</text></a></g></svg>