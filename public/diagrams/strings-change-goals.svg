<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strings-change-goals flow-desc-strings-change-goals" width="3352" height="1355" viewBox="0 0 3352 1355" data-flow-svg="strings-change-goals"><title id="flow-title-strings-change-goals">文字や桁の変更・追加の解法フローチャート</title><desc id="flow-desc-strings-change-goals">括弧や二値の変更、整数への桁追加、括弧列を完成する個数を調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strings-change-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge parentheses" data-edge="text-task:parentheses:parentheses-check"><title>括弧を入れ替え、指定区間が正しい括弧列か調べる</title><path d="M1676.541 182 V194 C1676.541 226 192 226 192 258 V270"/><path d="M192 326 V356 C192 388 192 388 192 420 V432" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:parentheses:parentheses-check" tabindex="0" role="group" aria-label="選択肢：括弧を入れ替え、指定区間が正しい括弧列か調べる"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">括弧を入れ替え、指定区間が正しい括</text><text text-anchor="middle" x="192" y="311">弧列か調べる</text></g></g><g class="flow-edge append-digits" data-edge="text-task:append-digits:decimal-route"><title>各整数の末尾に桁を追加して、順序を保った増加列にする</title><path d="M1705.632 182 V194 C1705.632 226 556 226 556 258 V270"/><path d="M556 326 V356 C556 388 556 388 556 420 V432" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:append-digits:decimal-route" tabindex="0" role="group" aria-label="選択肢：各整数の末尾に桁を追加して、順序を保った増加列にする"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">各整数の末尾に桁を追加して、順序を</text><text text-anchor="middle" x="556" y="311">保った増加列にする</text></g></g><g class="flow-edge bracket-prefix" data-edge="text-task:bracket-prefix:bracket-completion-route"><title>括弧の接頭辞を、指定長の正しい括弧列へ完成する個数</title><path d="M1734.723 182 V194 C1734.723 226 920 226 920 258 V270"/><path d="M920 326 V356 C920 388 920 388 920 420 V432" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:bracket-prefix:bracket-completion-route" tabindex="0" role="group" aria-label="選択肢：括弧の接頭辞を、指定長の正しい括弧列へ完成する個数"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">括弧の接頭辞を、指定長の正しい括弧</text><text text-anchor="middle" x="920" y="311">列へ完成する個数</text></g></g><g class="flow-edge binary-flip" data-edge="text-task:binary-flip:binary-flip-route"><title>0/1 の区間を反転し、指定区間の最長の 1 の連続を求める</title><path d="M1763.814 182 V194 C1763.814 226 1284 226 1284 258 V270"/><path d="M1284 326 V356 C1284 388 1284 388 1284 420 V432" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:binary-flip:binary-flip-route" tabindex="0" role="group" aria-label="選択肢：0/1 の区間を反転し、指定区間の最長の 1 の連続を求める"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">0/1 の区間を反転し、指定区間の</text><text text-anchor="middle" x="1284" y="311">最長の 1 の連続を求める</text></g></g><g class="flow-edge global-replace" data-edge="text-task:global-replace:global-replace-route"><title>現在の同じ文字を全て別の文字へ置き換える</title><path d="M1792.905 182 V194 C1792.905 226 1648 226 1648 258 V270"/><path d="M1648 326 V356 C1648 388 1648 388 1648 420 V432" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:global-replace:global-replace-route" tabindex="0" role="group" aria-label="選択肢：現在の同じ文字を全て別の文字へ置き換える"><rect x="1525.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="293">現在の同じ文字を全て別の文字へ置き</text><text text-anchor="middle" x="1648" y="311">換える</text></g></g><g class="flow-edge fill-pattern" data-edge="text-task:fill-pattern:fill-pattern-route"><title>未定の文字を補い、同じ語の重複を許す出現数を最大にする</title><path d="M1821.995 182 V194 C1821.995 226 2012 226 2012 258 V270"/><path d="M2012 326 V356 C2012 388 2012 388 2012 420 V432" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:fill-pattern:fill-pattern-route" tabindex="0" role="group" aria-label="選択肢：未定の文字を補い、同じ語の重複を許す出現数を最大にする"><rect x="1889.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="293">未定の文字を補い、同じ語の重複を許</text><text text-anchor="middle" x="2012" y="311">す出現数を最大にする</text></g></g><g class="flow-edge palindrome-swaps" data-edge="text-task:palindrome-swaps:palindrome-swaps-route"><title>隣り合う二文字の交換だけで、任意の回文を最少回数で作る</title><path d="M1851.086 182 V194 C1851.086 226 2376 226 2376 258 V270"/><path d="M2376 326 V356 C2376 388 2376 388 2376 420 V432" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:palindrome-swaps:palindrome-swaps-route" tabindex="0" role="group" aria-label="選択肢：隣り合う二文字の交換だけで、任意の回文を最少回数で作る"><rect x="2253.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="2376" y="293">隣り合う二文字の交換だけで、任意の</text><text text-anchor="middle" x="2376" y="311">回文を最少回数で作る</text></g></g><g class="flow-edge letter-rules" data-edge="text-task:letter-rules:letter-rules-route"><title>各位置の一文字を規則に従って繰り返し置換し、別の語へ変換できるか調べる</title><path d="M1880.177 182 V194 C1880.177 226 2740 226 2740 258 V270"/><path d="M2740 344 V356 C2740 388 2740 388 2740 420 V432" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:letter-rules:letter-rules-route" tabindex="0" role="group" aria-label="選択肢：各位置の一文字を規則に従って繰り返し置換し、別の語へ変換できるか調べる"><rect x="2617.5" y="270" width="245" height="74" rx="5"/><text text-anchor="middle" x="2740" y="293">各位置の一文字を規則に従って繰り返</text><text text-anchor="middle" x="2740" y="311">し置換し、別の語へ変換できるか調べ</text><text text-anchor="middle" x="2740" y="329">る</text></g></g><g class="flow-edge comma-propagation" data-edge="text-task:comma-propagation:comma-propagation-route"><title>同じ語の前後へ読点を繰り返し追加し、増えなくなる文章を求める</title><path d="M1909.268 182 V194 C1909.268 226 3071 226 3071 258 V270"/><path d="M3071 326 V356 C3071 388 3104 388 3104 420 V432" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:comma-propagation:comma-propagation-route" tabindex="0" role="group" aria-label="選択肢：同じ語の前後へ読点を繰り返し追加し、増えなくなる文章を求める"><rect x="2955" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="3071" y="293">同じ語の前後へ読点を繰り返し追加</text><text text-anchor="middle" x="3071" y="311">し、増えなくなる文章を求める</text></g></g><g class="flow-edge unknown" data-edge="text-task:unknown:check"><title>わからない</title><path d="M1938.359 182 V194 C1938.359 226 3275.5 226 3275.5 258 V270"/><path d="M3275.5 308 V356 C3275.5 388 3314 388 3314 420 V432 V617 C3314 649 2259.25 649 2259.25 681 V693 V743 C2259.25 775 2218.083 775 2218.083 807 V819" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="text-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="3231" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="3275.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:substring-route"><title>はい</title><path d="M2084.75 969 V982 C2084.75 1014 1879.25 1014 1879.25 1046 V1058"/><path d="M1879.25 1096 V1108 C1879.25 1140 1879.25 1140 1879.25 1172 V1184" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:substring-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1839.25" y="1058" width="80" height="38" rx="5"/><text text-anchor="middle" x="1879.25" y="1081">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2164.75 969 V982 C2164.75 1014 2243.25 1014 2243.25 1046 V1058"/><path d="M2243.25 1096 V1108 C2243.25 1140 2189.917 1140 2189.917 1172 V1184" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2203.25" y="1058" width="80" height="38" rx="5"/><text text-anchor="middle" x="2243.25" y="1081">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2244.75 969 V982 C2244.75 1014 2371.75 1014 2371.75 1046 V1058"/><path d="M2371.75 1096 V1108 C2371.75 1140 2296.583 1140 2296.583 1172 V1184" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2327.25" y="1058" width="89" height="38" rx="5"/><text text-anchor="middle" x="2371.75" y="1081">わからない</text></g></g><g class="flow-edge yes" data-edge="parentheses-check:yes:parentheses-result"><title>はい</title><path d="M112 605 V617 C112 649 192 649 192 681 V693"/><path d="M192 731 V743 C192 775 192 775 192 807 V819" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="parentheses-check:yes:parentheses-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="716">はい</text></g></g><g class="flow-edge no" data-edge="parentheses-check:no:fallback"><title>いいえ</title><path d="M192 605 V617 C192 649 556 649 556 681 V693"/><path d="M556 731 V743 C556 775 556 775 556 807 V819" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="parentheses-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="parentheses-check:unknown:check"><title>わからない</title><path d="M272 605 V617 C272 649 2164.75 649 2164.75 681 V693"/><path d="M2164.75 731 V743 C2164.75 775 2111.417 775 2111.417 807 V819" marker-end="url(#arrow-strings-change-goals)"/><g class="flow-edge-label" data-edge-label="parentheses-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2120.25" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="2164.75" y="716">わからない</text></g></g><g class="flow-node question" data-node="text-task"><rect x="1647.45" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1663.45" y="52">質問</text><text class="node-title" x="1663.45" y="80">どの文字や桁を、どのように変更しま</text><text class="node-title" x="1663.45" y="103">すか？</text><text class="node-explanation" x="1663.45" y="130">変更できる位置と操作の種類、変更後に求める量を確</text><text class="node-explanation" x="1663.45" y="148">かめます。</text></g><g class="flow-node question" data-node="check"><rect x="2004.75" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="2020.75" y="839">質問</text><text class="node-title" x="2020.75" y="867">求めているのは、連続した部分文字列</text><text class="node-title" x="2020.75" y="890">ですか？</text><text class="node-explanation" x="2020.75" y="917">連続しない部分列なら、添字や最後の文字などを状態</text><text class="node-explanation" x="2020.75" y="935">にする DP を検討します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="2083.25" y="1184" width="320" height="139" rx="7"/><text class="node-kind" x="2099.25" y="1204">分野</text><text class="node-title" x="2099.25" y="1232">条件を確かめる</text><text class="node-explanation" x="2099.25" y="1259">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="2099.25" y="1287">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="substring-route"><rect x="1719.25" y="1184" width="320" height="121" rx="7"/><text class="node-kind" x="1735.25" y="1204">分野</text><text class="node-title" x="1735.25" y="1232">部分文字列</text><a href="/flowchartcp/flowcharts/#diagram-string-substring" data-route="string-substring"><text x="1735.25" y="1269">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="819" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="839">候補</text><text class="node-title" x="412" y="867">必要な文字列情報を定義する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="906">状態の設計</text></a><a href="/flowchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="412" y="930">対称性</text></a></g><g class="flow-node question" data-node="parentheses-check"><rect x="32" y="432" width="320" height="173" rx="7"/><text class="node-kind" x="48" y="452">質問</text><text class="node-title" x="48" y="480">左括弧を +1、右括弧を -1 と</text><text class="node-title" x="48" y="503">すると、区間の総和と最小接頭和で判</text><text class="node-title" x="48" y="526">定できますか？</text><text class="node-explanation" x="48" y="553">総和 0 で、どの途中でも負にならなければ正しい</text><text class="node-explanation" x="48" y="571">括弧列です。</text></g><g class="flow-node result" data-node="parentheses-result"><rect x="32" y="819" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">括弧の総和と最小接頭和をまとめる</text><a href="/flowchartcp/techniques/prefix-feasibility/"><title>括弧列の判定を、合計と接頭和の最小値で持つの記事へ</title><text x="48" y="906">括弧列の判定を、合計と接頭和の最小値で持つ</text></a><a href="/flowchartcp/techniques/segment-tree/"><title>セグメント木の記事へ</title><text x="48" y="930">セグメント木</text></a></g><g class="flow-node route" data-node="decimal-route"><rect x="396" y="432" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="452">分野</text><text class="node-title" x="412" y="480">末尾の桁追加で増加列にする</text><a href="/flowchartcp/flowcharts/#diagram-decimal-increasing" data-route="decimal-increasing"><text x="412" y="517">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="bracket-completion-route"><rect x="760" y="432" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="452">分野</text><text class="node-title" x="776" y="480">括弧の接頭辞を完成する個数</text><a href="/flowchartcp/flowcharts/#diagram-bracket-prefix-completion" data-ro