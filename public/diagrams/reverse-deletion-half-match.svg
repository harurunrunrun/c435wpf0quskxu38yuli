5.5" y="1416">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="500.5" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="516.5" y="52">質問</text><text class="node-title" x="516.5" y="80">削除後に満たす関係はどれですか？</text><text class="node-explanation" x="516.5" y="107">削除した列と、残った列のどちらを逆順にするかを明</text><text class="node-explanation" x="516.5" y="125">確にします。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="558.5555555555557" y="411">質問</text><text class="node-title" x="558.5555555555557" y="439">列は固定で、削除できる開始位置は </text><text class="node-title" x="558.5555555555557" y="462">0..N ですか？</text><text class="node-explanation" x="558.5555555555557" y="489">残る左側と右側を、削除部分の逆順の対応位置へそれ</text><text class="node-explanation" x="558.5555555555557" y="507">ぞれ照合します。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="755" width="320" height="168" rx="7"/><text class="node-kind" x="357.1666666666667" y="775">質問</text><text class="node-title" x="357.1666666666667" y="803">残った左側と右側を、削除部分の逆順</text><text class="node-title" x="357.1666666666667" y="826">の対応位置へ別々に照合できますか？</text><text class="node-explanation" x="357.1666666666667" y="853">二つの境界からの一致長を前計算し、それぞれで必要</text><text class="node-explanation" x="357.1666666666667" y="871">な長さ以上の一致があるかを確認します。比較する長</text><text class="node-explanation" x="357.1666666666667" y="889">さは N 以下に限ります。ハッシュ衝突の仮定は…</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1137" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1157">候補</text><text class="node-title" x="48" y="1185">削除位置の左右を、逆順との二つの一</text><text class="node-title" x="48" y="1208">致長で確かめる</text><a href="/flowchartcp/techniques/reverse-deletion-two-z/"><title>半分の長さを削って残りが削除部分の逆順になる条件は、二つの前後一致へ分けるの記事へ</title><text x="48" y="1247">半分の長さを削って残りが削除部分の逆順になる条</text><text x="48" y="1265">件は、二つの前後一致へ分ける</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1137" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1157">候補</text><text class="node-title" x="412" y="1185">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1224">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1248">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1137" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1157">質問</text><text class="node-title" x="776" y="1185">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1208">書き出せますか？</text><text class="node-explanation" x="776" y="1235">削除した列と、残った列のどちらを逆順にするかを明</text><text class="node-explanation" x="776" y="1253">確にします。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1519" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1539">分野</text><text class="node-title" x="764.5" y="1567">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1604">詳細の質問・図へ →</text></a></g></svg>