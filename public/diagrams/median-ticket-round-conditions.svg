sult rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="color-rounds:yes:median-deviation"><title>はい</title><path d="M464.5 205 V217 C464.5 249 419 249 419 281 V293"/><path d="M419 331 V343 C419 375 432.5 375 432.5 407 V419" marker-end="url(#arrow-median-ticket-round-conditions)"/><g class="flow-edge-label" data-edge-label="color-rounds:yes:median-deviation" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="316">はい</text></g></g><g class="flow-edge no" data-edge="color-rounds:no:check"><title>いいえ</title><path d="M544.5 205 V217 C544.5 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V599 C654 631 654 631 654 663 V675 V725 C654 757 654 757 654 789 V801 V986 C654 1018 654 1018 654 1050 V1062 V1112 C654 1144 624.571 1144 624.571 1176 V1188" marker-end="url(#arrow-median-ticket-round-conditions)"/><g class="flow-edge-label" data-edge-label="color-rounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="color-rounds:unknown:check"><title>わからない</title><path d="M624.5 205 V217 C624.5 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 