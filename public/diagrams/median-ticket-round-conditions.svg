group" aria-label="選択肢：わからない"><rect x="515" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 974 V986 C239.5 1018 192 1018 192 1050 V1062"/><path d="M192 1100 V1112 C192 1144 192 1144 192 1176 V1188" marker-end="url(#arrow-median-ticket-round-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1085">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 974 V986 C319.5 1018 319 1018 319 1050 V1062"/><path d="M319 1100 V1112 C319 1144 441.714 1144 441.714 1176 V1188" marker-end="url(#arrow-median-ticket-round-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1062" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1085">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 974 V986 C399.5 1018 447.5 1018 447.5 1050 V1062"/><path d="M447.5 1100 V1112 C447.5 1144 487.429 1144 487.429 1176 V1188" marker-end="url(#arrow-median-ticket-round-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1062" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1085">わからない</text></g></g><g class="flow-node question" data-node="color-rounds"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">色の種類は偶数で、各回に全ての色か</text><text class="node-title" x="400.5" y="103">ら一枚ずつ選び、同じ券を再び使いま</text><text class="node-title" x="400.5" y="126">せんか？</text><text class="node-explanation" x="400.5" y="153">各色の券数は等しく、回による使用禁止などの追加条</text><text class="node-explanation" x="400.5" y="171">件はありません。</text></g><g class="flow-node question" data-node="median-deviation"><rect x="272.5" y="419" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">各回の中央値への絶対差和を合計し、</text><text class="node-title" x="288.5" y="490">その最大値と券の割当を求めますか？</text><text class="node-explanation" x="288.5" y="517">中心を動かした絶対差和の最小値が、一回の得点で</text><text class="node-explanation" x="288.5" y="535">す。各回の得点の最小値を最大にする目的とは区別し</text><text class="node-explanation" x="288.5" y="553">ます。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="801" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="821">質問</text><text class="node-title" x="175.5" y="849">色数と各色の枚数は1500以下、回</text><text class="node-title" x="175.5" y="872">数は1以上で各色の枚数以下、券の値</text><text class="node-title" x="175.5" y="895">は0..10^9ですか？</text><text class="node-explanation" x="175.5" y="922">色数は2以上の偶数で、各色の値は非減少順です。同</text><text class="node-explanation" x="175.5" y="940">じ値の券も別々に使えます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1188" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1208">候補</text><text class="node-title" x="48" y="1236">各色の両端を正負に選び、非増加の増</text><text class="node-title" x="48" y="1259">分で枚数を配分して各回へ戻す</text><a href="/flowchartcp/techniques/median-ticket-extreme-selection-round-decomposition/"><title>各色から毎回一枚選び、中央値からの絶対差和を最大にするの記事へ</title><text x="48" y="1298">各色から毎回一枚選び、中央値からの絶対差和を最</text><text x="48" y="1316">大にする</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1188" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1208">分野</text><text class="node-title" x="412" y="1236">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1273">詳細の質問・図へ →</text></a></g></svg>