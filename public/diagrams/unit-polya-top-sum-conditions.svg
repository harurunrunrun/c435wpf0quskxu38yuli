<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-unit-polya-top-sum-conditions flow-desc-unit-polya-top-sum-conditions" width="748" height="1447" viewBox="0 0 748 1447" data-flow-svg="unit-polya-top-sum-conditions"><title id="flow-title-unit-polya-top-sum-conditions">比例して増える個数の上位合計の解法フローチャート</title><desc id="flow-desc-unit-polya-top-sum-conditions">初期個数・選び方・求める期待値と数値の範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-unit-polya-top-sum-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="unit-initial-reinforcement:yes:fixed-horizon-top-sum"><title>はい</title><path d="M464.5 223 V235 C464.5 267 419 267 419 299 V311"/><path d="M419 349 V361 C419 393 432.5 393 432.5 425 V437" marker-end="url(#arrow-unit-polya-top-sum-conditions)"/><g class="flow-edge-label" data-edge-label="unit-initial-reinforcement:yes:fixed-horizon-top-sum" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="334">はい</text></g></g><g class="flow-edge no" data-edge="unit-initial-reinforcement:no:check"><title>いいえ</title><path d="M544.5 223 V235 C544.5 267 543 267 543 299 V311"/><path d="M543 349 V361 C543 393 654 393 654 425 V437 V640 C654 672 654 672 654 704 V716 V766 C654 798 654 798 654 830 V842 V1045 C654 1077 654 1077 654 1109 V1121 V1171 C654 1203 624.571 1203 624.571 1235 V1247" marker-end="url(#arrow-unit-polya-top-sum-conditions)"/><g class="flow-edge-label" data-edge-label="unit-initial-reinforcement:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="unit-initial-reinforcement:unknown:check"><title>わからない</title><path d="M624.5 223 V235 C624.5 267 671.5 267 671.5 299 V311"/><path d="M671.5 349 V361 C671.5 393 710 393 710 425 V437 V640 C710 672 710 672 710 704 V716 V766 C710 798 710 798 710 830 V842 V1045 C710 1077 710 1077 710 1109 V1121 V1171 C710 1203 670.286 1203 670.286 1235 V1247" marker-end="url(#arrow-unit-polya-top-sum-conditions)"/><g class="flow-edge-label" data-edge-label="unit-initial-reinforcement:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="fixed-horizon-top-sum:yes:bounds-numeric"><title>はい</title><path d="M352.5 628 V640 C352.5 672 307 672 307 704 V716"/><path d="M307 754 V766 C307 798 319.5 798 319.5 830 V842" marker-end="url(#arrow-unit-polya-top-sum-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-horizon-top-sum:yes:bounds-numeric" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="716" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="739">はい</text></g></g><g class="flow-edge no" data-edge="fixed-horizon-top-sum:no:check"><title>いいえ</title><path d="M432.5 628 V640 C432.5 672 431 672 431 704 V716"/><path d="M431 754 V766 C431 798 542 798 542 830 V842 V1045 C542 1077 542 1077 542 1109 V1121 V1171 C542 1203 533.143 1203 533.143 1235 V1247" marker-end="url(#arrow-unit-polya-top-sum-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-horizon-top-sum:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="716" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="739">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed-horizon-top-sum:unknown:check"><title>わからない</title><path d="M512.5 628 V640 C512.5 672 559.5 672 559.5 704 V716"/><path d="M559.5 754 V766 C559.5 798 598 798 598 830 V842 V1045 C598 1077 598 1077 598 1109 V1121 V1171 C598 1203 578.857 1203 578.857 1235 V1247" marker-end="url(#arrow-unit-polya-top-sum-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-horizon-top-sum:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="716" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="739">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds-numeric:yes:result"><title>はい</title><path d="M239.5 1033 V1045 C239.5 1077 192 1077 192 1109 V1121"/><path d="M192 1159 V1171 C192 1203 192 1203 192 1235 V1247" marker-end="url(#arrow-unit-polya-top-sum-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-numeric:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1121" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1144">はい</text></g></g><g class="flow-edge no" data-edge="bounds-numeric:no:check"><title>いいえ</title><path d="M319.5 1033 V1045 C319.5 1077 319 1077 319 1109 V1121"/><path d="M319 1159 V1171 C319 1203 441.714 1203 441.714 1235 V1247" marker-end="url(#arrow-unit-polya-top-sum-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-numeric:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1121" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1144">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds-numeric:unknown:check"><title>わからない</title><path d="M399.5 1033 V1045 C399.5 1077 447.5 1077 447.5 1109 V1121"/><path d="M447.5 1159 V1171 C447.5 1203 487.429 1203 487.429 1235 V1247" marker-end="url(#arrow-unit-polya-top-sum-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-numeric:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1121" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1144">わからない</text></g></g><g class="flow-node question" data-node="unit-initial-reinforcement"><rect x="384.5" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">最初は全員が一個ずつ持ち、全ての品</text><text class="node-title" x="400.5" y="103">物から一個を一様に選び、その所有者</text><text class="node-title" x="400.5" y="126">の品物を一個増やしますか？</text><text class="node-explanation" x="400.5" y="153">人を一様に選ぶ操作とは異なります。初期個数と、一</text><text class="node-explanation" x="400.5" y="171">回に増える個数がどちらも1であることを確認しま</text><text class="node-explanation" x="400.5" y="189">す。</text></g><g class="flow-node question" data-node="fixed-horizon-top-sum"><rect x="272.5" y="437" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="457">質問</text><text class="node-title" x="288.5" y="485">決まった回数の操作後、持っている個</text><text class="node-title" x="288.5" y="508">数が多い上位r人の合計期待値を求め</text><text class="node-title" x="288.5" y="531">ますか？</text><text class="node-explanation" x="288.5" y="558">全員の個数の和が決まっているため、各人の個数は独</text><text class="node-explanation" x="288.5" y="576">立ではありません。順位そのものの確率や、終了まで</text><text class="node-explanation" x="288.5" y="594">の期待回数を求める場合は別に考えます。</text></g><g class="flow-node question" data-node="bounds-numeric"><rect x="159.5" y="842" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="862">質問</text><text class="node-title" x="175.5" y="890">人数と操作回数は1〜500、上位人</text><text class="node-title" x="175.5" y="913">数は1〜人数で、誤差10⁻⁶を許し</text><text class="node-title" x="175.5" y="936">ますか？</text><text class="node-explanation" x="175.5" y="963">この範囲なら、組合せの個数と上位合計の総和を非負</text><text class="node-explanation" x="175.5" y="981">項のDPで求められます。掲載APIは操作0回と上</text><text class="node-explanation" x="175.5" y="999">位0人にも対応します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1247" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1267">候補</text><text class="node-title" x="48" y="1295">一様な増加量の組成を数え、上位合計</text><text class="node-title" x="48" y="1318">の総和をDPで求める</text><a href="/flowchartcp/techniques/polya-urn-uniform-composition-top-r-sum/"><title>多く持つ人ほど増えやすい過程で、上位の合計期待値を求めるの記事へ</title><text x="48" y="1357">多く持つ人ほど増えやすい過程で、上位の合計期待</text><text x="48" y="1375">値を求める</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1247" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1267">分野</text><text class="node-title" x="412" y="1295">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1332">詳細の質問・図へ →</text></a></g></svg>