8 716 598 748 V760 V940 C598 972 598 972 598 1004 V1016 V1066 C598 1098 578.857 1098 578.857 1130 V1142" marker-end="url(#arrow-orthogonal-point-cover-conditions)"/><g class="flow-edge-label" data-edge-label="free-crossing-orthogonal-cover:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds-and-segment-budget:yes:result"><title>はい</title><path d="M239.5 928 V940 C239.5 972 192 972 192 1004 V1016"/><path d="M192 1054 V1066 C192 1098 192 1098 192 1130 V1142" marker-end="url(#arrow-orthogonal-point-cover-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-and-segment-budget:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="bounds-and-segment-budget:no:check"><title>いいえ</title><path d="M319.5 928 V940 C319.5 972 319 972 319 1004 V1016"/><path d="M319 1054 V1066 C319 1098 441.714 1098 441.714 1130 V1142" marker-end="url(#arrow-orthogonal-point-cover-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-and-segment-budget:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds-and-segment-budget:unknown:check"><title>わからない</title><path d="M399.5 928 V940 C399.5 972 447.5 972 447.5 1004 V1016"/><path d="M447.5 1054 V1066 C447.5 1098 487.429 1098 487.429 1130 V1142" marker-end="url(#arrow-orthogonal-point-cover-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-and-segment-budget:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="distinct-positive-coordinates"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">全点は原点より右上で、横座標も縦座</text><text class="node-title" x="400.5" y="103">標もそれぞれ異なりますか？</text><text class="node-explanation" x="400.5" y="130">横座標どうし、縦座標どうしの相異性をそれぞれ確認</text><text class="node-explanation" x="400.5" y="148">します。これにより長方形の各極値が一意になりま</text><text class="node-explanation" x="400.5" y="166">す。</text></g><g class="flow-node question" data-node="free-crossing-orthogonal-cover"><rect x="272.5" y="414" width="320" height="132" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">交差と重なりを許す縦横の折れ線で、</text><text class="node-title" x="288.5" y="485">全点を通ればよいですか？</text><text class="node-explanation" x="288.5" y="512">原点から始め、点を線分の途中に置けます。</text></g><g class="flow-node question" data-node="bounds-and-segment-budget"><rect x="159.5" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">10万点以下で、点数に三本足した本</text><text class="node-title" x="175.5" y="831">数までの構成で足りますか？</text><text class="node-explanation" x="175.5" y="858">入力座標は1以上10億以下で、出力座標は少なくと</text><text class="node-explanation" x="175.5" y="876">も0から10億+1まで使えます。座標は64ビット</text><text class="node-explanation" x="175.5" y="894">整数で扱います。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">二つの単調鎖と内外の螺旋を、各一本</text><text class="node-title" x="48" y="1213">の追加で接続する</text><a href="/flowchartcp/techniques/orthogonal-point-cover-spiral-two-chains/"><title>点集合を二つの単調鎖と螺旋に分け、少ない縦横線分で結ぶの記事へ</title><text x="48" y="1252">点集合を二つの単調鎖と螺旋に分け、少ない縦横線</text><text x="48" y="1270">分で結ぶ</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1162">分野</text><text class="node-title" x="412" y="1190">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1227">詳細の質問・図へ →</text></a></g></svg>