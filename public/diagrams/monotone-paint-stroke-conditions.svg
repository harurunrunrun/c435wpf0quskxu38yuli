nknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="offline-bounds:yes:result"><title>はい</title><path d="M239.5 910 V922 C239.5 954 192 954 192 986 V998"/><path d="M192 1036 V1048 C192 1080 192 1080 192 1112 V1124" marker-end="url(#arrow-monotone-paint-stroke-conditions)"/><g class="flow-edge-label" data-edge-label="offline-bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="offline-bounds:no:check"><title>いいえ</title><path d="M319.5 910 V922 C319.5 954 319 954 319 986 V998"/><path d="M319 1036 V1048 C319 1080 441.714 1080 441.714 1112 V1124" marker-end="url(#arrow-monotone-paint-stroke-conditions)"/><g class="flow-edge-label" data-edge-label="offline-bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="offline-bounds:unknown:check"><title>わからない</title><path d="M399.5 910 V922 C399.5 954 447.5 954 447.5 986 V998"/><path d="M447.5 1036 V1048 C447.5 1080 487.429 1080 487.429 1112 V1124" marker-end="url(#arrow-monotone-paint-stroke-conditions)"/><g class="flow-edge-label" data-edge-label="offline-bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1021">わからない</text></g></g><g class="flow-node question" data-node="ordered-overwrite"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">連続区間を一色に塗れ、濃い色を薄い</text><text class="node-title" x="400.5" y="103">色で上書きできない設定ですか？</text><text class="node-explanation" x="400.5" y="130">色には薄い順の全順序があります。完成させたい色の</text><text class="node-explanation" x="400.5" y="148">列は固定されています。</text></g><g class="flow-node question" data-node="isolated-range"><rect x="272.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">指定区間の外を未塗装に残し、中を仕</text><text class="node-title" x="288.5" y="467">上げる最小の筆数を求めますか？</text><text class="node-explanation" x="288.5" y="494">各質問は、全て未塗装の状態から独立に考えます。前</text><text class="node-explanation" x="288.5" y="512">の質問で塗った状態は引き継ぎません。</text></g><g class="flow-node question" data-node="offline-bounds"><rect x="159.5" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">列長・質問数は20万以下で、全質問</text><text class="node-title" x="175.5" y="831">を先読みできますか？</text><text class="node-explanation" x="175.5" y="858">各質問の区間は列の中にあります。完成色は質問の間</text><text class="node-explanation" x="175.5" y="876">で変わりません。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1124" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1144">候補</text><text class="node-title" x="48" y="1172">同色を結べる対の本数を、区間長から</text><text class="node-title" x="48" y="1195">引く</text><a href="/flowchartcp/techniques/monotone-paint-stroke-links-offline-containment/"><title>薄い色へ戻せない区間塗装の最小回数を、同色を結ぶ対で数えるの記事へ</title><text x="48" y="1234">薄い色へ戻せない区間塗装の最小回数を、同色を結</text><text x="48" y="1252">ぶ対で数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1124" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1144">分野</text><text class="node-title" x="412" y="1172">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1209">詳細の質問・図へ →</text></a></g></svg>