<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-heuristic-models flow-desc-heuristic-models" width="2568" height="938" viewBox="0 0 2568 938" data-flow-svg="heuristic-models"><title id="flow-title-heuristic-models">変更する対象と得点の構造の解法フローチャート</title><desc id="flow-desc-heuristic-models">一長方形、経路の末尾、訪問順、日程、一円の局所変更を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-heuristic-models" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge rectangles" data-edge="model:rectangles:rectangle-route"><title>一つの軸平行長方形・その一辺</title><path d="M1164 159 V171 C1164 203 192 203 192 235 V247"/><path d="M192 285 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="model:rectangles:rectangle-route" tabindex="0" role="group" aria-label="選択肢：一つの軸平行長方形・その一辺"><rect x="89" y="247" width="206" height="38" rx="5"/><text text-anchor="middle" x="192" y="270">一つの軸平行長方形・その一辺</text></g></g><g class="flow-edge path-tail" data-edge="model:path-tail:path-route"><title>再使用できないタイル経路の末尾</title><path d="M1204 159 V171 C1204 203 556 203 556 235 V247"/><path d="M556 285 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="model:path-tail:path-route" tabindex="0" role="group" aria-label="選択肢：再使用できないタイル経路の末尾"><rect x="446.5" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="556" y="270">再使用できないタイル経路の末尾</text></g></g><g class="flow-edge ordered-route" data-edge="model:ordered-route:ordered-route"><title>受取が配達より前になる訪問順</title><path d="M1244 159 V171 C1244 203 920 203 920 235 V247"/><path d="M920 285 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="model:ordered-route:ordered-route" tabindex="0" role="group" aria-label="選択肢：受取が配達より前になる訪問順"><rect x="817" y="247" width="206" height="38" rx="5"/><text text-anchor="middle" x="920" y="270">受取が配達より前になる訪問順</text></g></g><g class="flow-edge schedule" data-edge="model:schedule:schedule-route"><title>毎日の種類と、前回開催からの日数の減点</title><path d="M1284 159 V171 C1284 203 1284 203 1284 235 V247"/><path d="M1284 303 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="model:schedule:schedule-route" tabindex="0" role="group" aria-label="選択肢：毎日の種類と、前回開催からの日数の減点"><rect x="1161.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="270">毎日の種類と、前回開催からの日数の</text><text text-anchor="middle" x="1284" y="288">減点</text></g></g><g class="flow-edge circle-cover" data-edge="model:circle-cover:cover-route"><title>有効な円を固定し、一円の整数半径</title><path d="M1324 159 V171 C1324 203 1648 203 1648 235 V247"/><path d="M1648 285 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="model:circle-cover:cover-route" tabindex="0" role="group" aria-label="選択肢：有効な円を固定し、一円の整数半径"><rect x="1532" y="247" width="232" height="38" rx="5"/><text text-anchor="middle" x="1648" y="270">有効な円を固定し、一円の整数半径</text></g></g><g class="flow-edge other" data-edge="model:other:general-route"><title>その他の入力・評価・構築順</title><path d="M1364 159 V171 C1364 203 2012 203 2012 235 V247"/><path d="M2012 285 V315 C2012 347 2012 347 2012 379 V391" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="model:other:general-route" tabindex="0" role="group" aria-label="選択肢：その他の入力・評価・構築順"><rect x="1915.5" y="247" width="193" height="38" rx="5"/><text text-anchor="middle" x="2012" y="270">その他の入力・評価・構築順</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M1404 159 V171 C1404 203 2376 203 2376 235 V247"/><path d="M2376 285 V315 C2376 347 2376 347 2376 379 V391" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2331.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="2376" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M2296 541 V553 C2296 585 2012 585 2012 617 V629"/><path d="M2012 667 V679 C2012 711 2012 711 2012 743 V755" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1972" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="2012" y="652">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2376 541 V553 C2376 585 2363 585 2363 617 V629"/><path d="M2363 667 V679 C2363 711 2322.667 711 2322.667 743 V755" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2323" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="2363" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2456 541 V553 C2456 585 2491.5 585 2491.5 617 V629"/><path d="M2491.5 667 V679 C2491.5 711 2429.333 711 2429.333 743 V755" marker-end="url(#arrow-heuristic-models)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2447" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="2491.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="1124" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1140" y="52">質問</text><text class="node-title" x="1140" y="80">主にどの部分を変更しますか？</text><text class="node-explanation" x="1140" y="107">固定する部分と、変更により影響する得点や制約を選</text><text class="node-explanation" x="1140" y="125">びます。</text></g><g class="flow-node route" data-node="rectangle-route"><rect x="32" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">長方形の面積得点と一辺の候補</text><a href="/flowchartcp/flowcharts/#diagram-heuristic-rectangles" data-route="heuristic-rectangles"><text x="48" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="path-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">使わないタイルの経路を伸ばす</text><a href="/flowchartcp/flowcharts/#diagram-heuristic-grid-path" data-route="heuristic-grid-path"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="ordered-route"><rect x="760" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">先行条件のある訪問順</text><a href="/flowchartcp/flowcharts/#diagram-heuristic-ordered-route" data-route="heuristic-ordered-route"><text x="776" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="schedule-route"><rect x="1124" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">開催日程の間隔費用と変更</text><a href="/flowchartcp/flowcharts/#diagram-heuristic-schedule" data-route="heuristic-schedule"><text x="1140" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="cover-route"><rect x="1488" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">円の被覆と半径候補</text><a href="/flowchartcp/flowcharts/#diagram-heuristic-cover" data-route="heuristic-cover"><text x="1504" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="2216" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="2232" y="411">質問</text><text class="node-title" x="2232" y="439">得点の式、合法性、固定する部分と変</text><text class="node-title" x="2232" y="462">更する部分を確認できますか？</text><text class="node-explanation" x="2232" y="489">差分評価が正しくても、その候補が合法であるとは限</text><text class="node-explanation" x="2232" y="507">りません。必要な制約を別に検査します。</text></g><g class="flow-node result" data-node="fallback"><rect x="1852" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="1868" y="775">候補</text><text class="node-title" x="1868" y="803">評価と合法性を小さい変更で確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="1868" y="842">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1868" y="866">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="2216" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="2232" y="775">分野</text><text class="node-title" x="2232" y="803">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="2232" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="general-route"><rect x="1852" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1868" y="411">分野</text><text class="node-title" x="1868" y="439">合法解と評価から探索を組み立てる</text><a href="/flowchartcp/flowcharts/#diagram-heuristic-general" data-route="heuristic-general"><text x="1868" y="476">詳細の質問・図へ →</text></a></g></svg>