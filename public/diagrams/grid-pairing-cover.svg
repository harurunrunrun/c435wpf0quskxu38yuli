<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-grid-pairing-cover flow-desc-grid-pairing-cover" width="1952" height="1344" viewBox="0 0 1952 1344" data-flow-svg="grid-pairing-cover"><title id="flow-title-grid-pairing-cover">格子の組合せと被覆の解法フローチャート</title><desc id="flow-desc-grid-pairing-cover">隣接する二マスの組、駒、通路、タイルを使う配置や被覆を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-grid-pairing-cover" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge neighbor-pairs" data-edge="goal:neighbor-pairs:pair-target"><title>隣接した二マスの組を、重ならずに選ぶ</title><path d="M1240.267 159 V171 C1240.267 203 976 203 976 235 V247"/><path d="M976 303 V315 C976 347 976 347 976 379 V391" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="goal:neighbor-pairs:pair-target" tabindex="0" role="group" aria-label="選択肢：隣接した二マスの組を、重ならずに選ぶ"><rect x="853.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="976" y="270">隣接した二マスの組を、重ならずに選</text><text text-anchor="middle" x="976" y="288">ぶ</text></g></g><g class="flow-edge rectangle-rooks" data-edge="goal:rectangle-rooks:rook-route"><title>駒ごとの長方形内へ置き、行・列を二回使わない</title><path d="M1186.933 159 V171 C1186.933 203 612 203 612 235 V247"/><path d="M612 303 V315 C612 347 612 347 612 379 V391" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="goal:rectangle-rooks:rook-route" tabindex="0" role="group" aria-label="選択肢：駒ごとの長方形内へ置き、行・列を二回使わない"><rect x="489.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="612" y="270">駒ごとの長方形内へ置き、行・列を二</text><text text-anchor="middle" x="612" y="288">回使わない</text></g></g><g class="flow-edge corridor-cover" data-edge="goal:corridor-cover:corridor-route"><title>障害物で区切られた横・縦の通路で、全ての空きマスを覆う</title><path d="M1293.6 159 V171 C1293.6 203 1340 203 1340 235 V247"/><path d="M1340 303 V315 C1340 347 1340 347 1340 379 V391" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="goal:corridor-cover:corridor-route" tabindex="0" role="group" aria-label="選択肢：障害物で区切られた横・縦の通路で、全ての空きマスを覆う"><rect x="1217.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1340" y="270">障害物で区切られた横・縦の通路で、</text><text text-anchor="middle" x="1340" y="288">全ての空きマスを覆う</text></g></g><g class="flow-edge domino-tilings" data-edge="goal:domino-tilings:tile-shape"><title>長方形全体をタイルで敷き詰める配置の個数</title><path d="M1346.933 159 V171 C1346.933 203 1664.5 203 1664.5 235 V247"/><path d="M1664.5 303 V315 C1664.5 347 1704 347 1704 379 V391" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="goal:domino-tilings:tile-shape" tabindex="0" role="group" aria-label="選択肢：長方形全体をタイルで敷き詰める配置の個数"><rect x="1542" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1664.5" y="270">長方形全体をタイルで敷き詰める配置</text><text text-anchor="middle" x="1664.5" y="288">の個数</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M1400.267 159 V171 C1400.267 203 1875.5 203 1875.5 235 V247"/><path d="M1875.5 285 V315 C1875.5 347 1914 347 1914 379 V391 V553 C1914 585 1914 585 1914 617 V629 V697 C1914 729 1112 729 1112 761 V773" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1831" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1875.5" y="270">わからない</text></g></g><g class="flow-edge maximize" data-edge="pair-target:maximize:matching-result"><title>使える二マスの組の個数を最大にする</title><path d="M880 541 V553 C880 585 192 585 192 617 V629"/><path d="M192 667 V697 C192 729 192 729 192 761 V773" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="pair-target:maximize:matching-result" tabindex="0" role="group" aria-label="選択肢：使える二マスの組の個数を最大にする"><rect x="69.5" y="629" width="245" height="38" rx="5"/><text text-anchor="middle" x="192" y="652">使える二マスの組の個数を最大にする</text></g></g><g class="flow-edge mandatory" data-edge="pair-target:mandatory:mandatory-route"><title>二マスの組に必ず入れるマスと、禁止・任意のマスがある</title><path d="M1008 541 V553 C1008 585 698.5 585 698.5 617 V629"/><path d="M698.5 685 V697 C698.5 729 612 729 612 761 V773" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="pair-target:mandatory:mandatory-route" tabindex="0" role="group" aria-label="選択肢：二マスの組に必ず入れるマスと、禁止・任意のマスがある"><rect x="582.5" y="629" width="232" height="56" rx="5"/><text text-anchor="middle" x="698.5" y="652">二マスの組に必ず入れるマスと、禁</text><text text-anchor="middle" x="698.5" y="670">止・任意のマスがある</text></g></g><g class="flow-edge other" data-edge="pair-target:other:fallback"><title>その他の隣接した組の条件</title><path d="M944 541 V553 C944 585 448.5 585 448.5 617 V629"/><path d="M448.5 667 V697 C448.5 729 402 729 402 761 V773 V959 C402 991 752 991 752 1023 V1035 V1085 C752 1117 672 1117 672 1149 V1161" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="pair-target:other:fallback" tabindex="0" role="group" aria-label="選択肢：その他の隣接した組の条件"><rect x="358.5" y="629" width="180" height="38" rx="5"/><text text-anchor="middle" x="448.5" y="652">その他の隣接した組の条件</text></g></g><g class="flow-edge unknown" data-edge="pair-target:unknown:check"><title>わからない</title><path d="M1072 541 V553 C1072 585 923.5 585 923.5 617 V629"/><path d="M923.5 667 V697 C923.5 729 952 729 952 761 V773" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="pair-target:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="652">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M952 923 V959 C952 991 898 991 898 1023 V1035"/><path d="M898 1073 V1085 C898 1117 832 1117 832 1149 V1161" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="858" y="1035" width="80" height="38" rx="5"/><text text-anchor="middle" x="898" y="1058">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1032 923 V959 C1032 991 1220.25 991 1220.25 1023 V1035"/><path d="M1220.25 1073 V1085 C1220.25 1117 1166.917 1117 1166.917 1149 V1161" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1180.25" y="1035" width="80" height="38" rx="5"/><text text-anchor="middle" x="1220.25" y="1058">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1112 923 V959 C1112 991 1348.75 991 1348.75 1023 V1035"/><path d="M1348.75 1073 V1085 C1348.75 1117 1273.583 1117 1273.583 1149 V1161" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1304.25" y="1035" width="89" height="38" rx="5"/><text text-anchor="middle" x="1348.75" y="1058">わからない</text></g></g><g class="flow-edge domino" data-edge="tile-shape:domino:domino-route"><title>隣接する二マスの長方形だけ</title><path d="M1736 518 V553 C1736 585 1478.5 585 1478.5 617 V629"/><path d="M1478.5 667 V697 C1478.5 729 1396 729 1396 761 V773" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="tile-shape:domino:domino-route" tabindex="0" role="group" aria-label="選択肢：隣接する二マスの長方形だけ"><rect x="1382" y="629" width="193" height="38" rx="5"/><text text-anchor="middle" x="1478.5" y="652">隣接する二マスの長方形だけ</text></g></g><g class="flow-edge any-rectangles" data-edge="tile-shape:any-rectangles:rectangle-tile-route"><title>幅 2 の盤面に、任意の正整数幅・高さの長方形</title><path d="M1800 518 V553 C1800 585 1741.5 585 1741.5 617 V629"/><path d="M1741.5 685 V697 C1741.5 729 1760 729 1760 761 V773" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="tile-shape:any-rectangles:rectangle-tile-route" tabindex="0" role="group" aria-label="選択肢：幅 2 の盤面に、任意の正整数幅・高さの長方形"><rect x="1619" y="629" width="245" height="56" rx="5"/><text text-anchor="middle" x="1741.5" y="652">幅 2 の盤面に、任意の正整数幅・</text><text text-anchor="middle" x="1741.5" y="670">高さの長方形</text></g></g><g class="flow-edge other" data-edge="tile-shape:other:fallback"><title>その他の部品の形や個数制限</title><path d="M1608 518 V553 C1608 585 1108.5 585 1108.5 617 V629"/><path d="M1108.5 667 V697 C1108.5 729 822 729 822 761 V773 V959 C822 991 808 991 808 1023 V1035 V1085 C808 1117 752 1117 752 1149 V1161" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="tile-shape:other:fallback" tabindex="0" role="group" aria-label="選択肢：その他の部品の形や個数制限"><rect x="1012" y="629" width="193" height="38" rx="5"/><text text-anchor="middle" x="1108.5" y="652">その他の部品の形や個数制限</text></g></g><g class="flow-edge unknown" data-edge="tile-shape:unknown:check"><title>わからない</title><path d="M1672 518 V553 C1672 585 1293.5 585 1293.5 617 V629"/><path d="M1293.5 667 V697 C1293.5 729 1032 729 1032 761 V773" marker-end="url(#arrow-grid-pairing-cover)"/><g class="flow-edge-label" data-edge-label="tile-shape:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1249" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="1293.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="1133.6" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1149.6" y="52">質問</text><text class="node-title" x="1149.6" y="80">格子で何を求めますか？</text><text class="node-explanation" x="1149.6" y="107">置く対象の大きさ、全てのマスを覆う必要、移動方向</text><text class="node-explanation" x="1149.6" y="125">と経路の条件を選びます。</text></g><g class="flow-node question" data-node="pair-target"><rect x="816" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="832" y="411">質問</text><text class="node-title" x="832" y="439">隣接した二マスの選び方で、何を求め</text><text class="node-title" x="832" y="462">ますか？</text><text class="node-explanation" x="832" y="489">最大個数を求める場合と、指定マスを必ず二マスの組</text><text class="node-explanation" x="832" y="507">へ含める場合を分けます。</text></g><g class="flow-node result" data-node="matching-result"><rect x="32" y="773" width="320" height="174" rx="7"/><text class="node-kind" x="48" y="793">候補</text><text class="node-title" x="48" y="821">マスの偶奇で二つに分け、重ならない</text><text class="node-title" x="48" y="844">組数を最大にする</text><a href="/flowchartcp/techniques/matching/"><title>二部マッチングの記事へ</title><text x="48" y="883">二部マッチング</text></a><a href="/flowchartcp/techniques/max-flow/"><title>最大流・最小カットの記事へ</title><text x="48" y="907">最大流・最小カット</text></a></g><g class="flow-node route" data-node="mandatory-route"><rect x="452" y="773" width="320" height="121" rx="7"/><text class="node-kind" x="468" y="793">分野</text><text class="node-title" x="468" y="821">必ず組へ含める対象</text><a href="/flowchartcp/flowcharts/#diagram-mandatory-pairing" data-route="mandatory-pairing"><text x="468" y="858">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="rook-route"><rect x="452" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="468" y="411">分野</text><text class="node-title" x="468" y="439">長方形候補からの配置</text><a href="/flowchartcp/flowcharts/#diagram-rectangle-rook-assignments" data-route="rectangle-rook-assignments"><text x="468" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="corridor-route"><rect x="1180" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1196" y="411">分野</text><text class="node-title" x="1196" y="439">障害物で区切られた通路の被覆</text><a href="/flowchartcp/flowcharts/#diagram-grid-corridor-cover" data-route="grid-corridor-cover"><text x="1196" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="872" y="773" width="320" height="150" rx="7"/><text class="node-kind" x="888" y="793">質問</text><text class="node-title" x="888" y="821">合法な選択と、選ぶ回数・費用の条件</text><text class="node-title" x="888" y="844">を一つずつ確かめられますか？</text><text class="node-explanation" x="888" y="871">一対象を何回使えるか、必ず選ぶ対象があるか、経路</text><text class="node-explanation" x="888" y="889">はどこまで共用できるかを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="592" y="1161" width="320" height="151" rx="7"/><text class="node-kind" x="608" y="1181">候補</text><text class="node-title" x="608" y="1209">選択の条件と目的値を整理する</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="608" y="1248">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="608" y="1272">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1060.25" y="1161" width="320" height="121" rx="7"/><text class="node-kind" x="1076.25" y="1181">分野</text><text class="node-title" x="1076.25" y="1209">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1076.25" y="1246">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="domino-route"><rect x="1236" y="773" width="320" height="121" rx="7"/><text class="node-kind" x="1252" y="793">分野</text><text class="node-title" x="1252" y="821">細い盤面の敷き詰め数</text><a href="/flowchartcp/flowcharts/#diagram-domino-tilings" data-route="domino-tilings"><text x="1252" y="858">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="tile-shape"><rect x="1544" y="391" width="320" height="127" rx="7"/><text class="node-kind" x="1560" y="411">質問</text><text class="node-title" x="1560" y="439">使えるタイルの形は、どれですか？</text><text class="node-explanation" x="1560" y="466">部品の高さを制限するか、幅が固定された盤面かを確</text><text class="node-explanation" x="1560" y="484">認します。</text></g><g class="flow-node route" data-node="rectangle-tile-route"><rect x="1600" y="773" width="320" height="121" rx="7"/><text class="node-kind" x="1616" y="793">分野</text><text class="node-title" x="1616" y="821">二列を任意の長方形で敷き詰める</text><a href="/flowchartcp/flowcharts/#diagram-two-column-rectangle-cover" data-route="two-column-rectangle-cover"><text x="1616" y="858">詳細の質問・図へ →</text></a></g></svg>