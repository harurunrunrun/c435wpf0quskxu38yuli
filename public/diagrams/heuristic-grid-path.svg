ristic-grid-path)"/><g class="flow-edge-label" data-edge-label="path-relaxation:yes:path-tile-max" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="911" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="951" y="716">はい</text></g></g><g class="flow-edge no" data-edge="path-relaxation:no:fallback"><title>いいえ</title><path d="M1076.5 605 V617 C1076.5 649 1075 649 1075 681 V693"/><path d="M1075 731 V743 C1075 775 1186 775 1186 807 V819 V1022 C1186 1054 1186 1054 1186 1086 V1098 V1148 C1186 1180 1298 1180 1298 1212 V1224 V1404 C1298 1436 1298 1436 1298 1468 V1480 V1530 C1298 1562 758.467 1562 758.467 1594 V1606" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="path-relaxation:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="path-relaxation:unknown:check"><title>わからない</title><path d="M1156.5 605 V617 C1156.5 649 1203.5 649 1203.5 681 V693"/><path d="M1203.5 731 V743 C1203.5 775 1242 775 1242 807 V819 V1022 C1242 1054 1242 1054 1242 1086 V1098 V1148 C1242 1180 1141.333 1180 1141.333 1212 V1224" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="path-relaxation:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="path-tile-max:yes:path-upper-result"><title>はい</title><path d="M964.5 1010 V1022 C964.5 1054 963 1054 963 1086 V1098"/><path d="M963 1136 V1148 C963 1180 724 1180 724 1212 V1224" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="path-tile-max:yes:path-upper-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="923" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1121">はい</text></g></g><g class="flow-edge no" data-edge="path-tile-max:no:fallback"><title>いいえ</title><path d="M884.5 1010 V1022 C884.5 1054 839 1054 839 1086 V1098"/><path d="M839 1136 V1148 C839 1180 514 1180 514 1212 V1224 V1404 C514 1436 763.8 1436 763.8 1468 V1480 V1530 C763.8 1562 651.8 1562 651.8 1594 V1606" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="path-tile-max:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="799" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="839" y="1121">いいえ</text></g></g><g class="flow-edge unknown" data-edge="path-tile-max:unknown:check"><title>わからない</title><path d="M1044.5 1010 V1022 C1044.5 1054 1091.5 1054 1091.5 1086 V1098"/><path d="M1091.5 1136 V1148 C1091.5 1180 1088 1180 1088 1212 V1224" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="path-tile-max:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1098" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1121">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1008 1374 V1404 C1008 1436 853.8 1436 853.8 1468 V1480"/><path d="M853.8 1518 V1530 C853.8 1562 705.133 1562 705.133 1594 V1606" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="813.8" y="1480" width="80" height="38" rx="5"/><text text-anchor="middle" x="853.8" y="1503">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1088 1374 V1404 C1088 1436 1075 1436 1075 1468 V1480"/><path d="M1075 1518 V1530 C1075 1562 1085.917 1562 1085.917 1594 V1606" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="1480" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="1503">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1168 1374 V1404 C1168 1436 1203.5 1436 1203.5 1468 V1480"/><path d="M1203.5 1518 V1530 C1203.5 1562 1192.583 1562 1192.583 1594 V1606" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="1480" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="1503">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="750.9444444444443" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="766.9444444444443" y="52">質問</text><text class="node-title" x="766.9444444444443" y="80">未使用タイルの経路で何を改善します</text><text class="node-title" x="766.9444444444443" y="103">か？</text><text class="node-explanation" x="766.9444444444443" y="130">同じタイル ID の別マスも再使用できない規則を</text><text class="node-explanation" x="766.9444444444443" y="148">保持します。</text></g><g class="flow-node question" data-node="path-tile-once"><rect x="264.8333333333333" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="280.8333333333333" y="434">質問</text><text class="node-title" x="280.8333333333333" y="462">同じタイル ID は一度だけ使い、</text><text class="node-title" x="280.8333333333333" y="485">初期マスを含む先頭を残しますか？</text><text class="node-explanation" x="280.8333333333333" y="512">同じマスだけを禁止すると、別マスにある使用済みタ</text><text class="node-explanation" x="280.8333333333333" y="530">イルへ進めてしまいます。</text></g><g class="flow-node question" data-node="path-restore"><rect x="293.5" y="819" width="320" height="173" rx="7"/><text class="node-kind" x="309.5" y="839">質問</text><text class="node-title" x="309.5" y="867">末尾を外して作り直し、失敗なら経</text><text class="node-title" x="309.5" y="890">路・位置・得点・使用 ID をすべ</text><text class="node-title" x="309.5" y="913">て戻せますか？</text><text class="node-explanation" x="309.5" y="940">先頭の使用 ID は消さず、試した末尾だけを逆順</text><text class="node-explanation" x="309.5" y="958">に戻します。</text></g><g class="flow-node result" data-node="path-tail-result"><rect x="88" y="1224" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="1244">候補</text><text class="node-title" x="104" y="1272">経路の末尾を取り外し、使用タイルと</text><text class="node-title" x="104" y="1295">得点の差分を逆順に戻す</text><a href="/flowchartcp/techniques/heuristic-path-tail-rollback/"><title>タイルを一度だけ使う経路は、末尾だけ外して再構築し、失敗したら戻すの記事へ</title><text x="104" y="1334">タイルを一度だけ使う経路は、末尾だけ外して再構</text><text x="104" y="1352">築し、失敗したら戻す</text></a></g><g class="flow-node question" data-node="path-relaxation"><rect x="916.5" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="932.5" y="434">質問</text><text class="node-title" x="932.5" y="462">未使用タイルの到達範囲を、制約を緩</text><text class="node-title" x="932.5" y="485">めて過小評価しないように求められま</text><text class="node-title" x="932.5" y="508">すか？</text><text class="node-explanation" x="932.5" y="535">先頭の使用済みタイルは通り抜けません。出発点であ</text><text class="node-explanation" x="932.5" y="553">る末尾タイルも既使用で、同 ID の別マスへ入れ</text><text class="node-explanation" x="932.5" y="571">ません。残る未使用タイルの再通行は緩めます。</text></g><g class="flow-node question" data-node="path-tile-max"><rect x="804.5" y="819" width="320" height="191" rx="7"/><text class="node-kind" x="820.5" y="839">質問</text><text class="node-title" x="820.5" y="867">得点はマスの加算で、各タイルの最大</text><text class="node-title" x="820.5" y="890">点を負なら 0 として一回ずつ足せ</text><text class="node-title" x="820.5" y="913">ますか？</text><text class="node-explanation" x="820.5" y="940">一経路は一タイルから高々一マスを選びます。使わな</text><text class="node-explanation" x="820.5" y="958">いタイルもあるため、各タイル最大点を max</text><text class="node-explanation" x="820.5" y="976">(0,最大点) として足せば、負得点を含んでも…</text></g><g class="flow-node result" data-node="path-upper-result"><rect x="564" y="1224" width="320" height="168" rx="7"/><text class="node-kind" x="580" y="1244">候補</text><text class="node-title" x="580" y="1272">到達可能な各タイルの最大点を足し</text><text class="node-title" x="580" y="1295">て、残り得点の上限にする</text><a href="/flowchartcp/techniques/heuristic-path-reachable-upper-bound/"><title>経路の続きの上界は、到達できる未使用タイルごとの最大得点を足すの記事へ</title><text x="580" y="1334">経路の続きの上界は、到達できる未使用タイルごと</text><text x="580" y="1352">の最大得点を足す</text></a></g><g class="flow-node question" data-node="check"><rect x="928" y="1224" width="320" height="150" rx="7"/><text class="node-kind" x="944" y="1244">質問</text><text class="node-title" x="944" y="1272">得点の式、合法性、固定する部分と変</text><text class="node-title" x="944" y="1295">更する部分を確認できますか？</text><text class="node-explanation" x="944" y="1322">差分評価が正しくても、その候補が合法であるとは限</text><text class="node-explanation" x="944" y="1340">りません。必要な制約を別に検査します。</text></g><g class="flow-node result" data-node="fallback"><rect x="491.79999999999995" y="1606" width="320" height="151" rx="7"/><text class="node-kind" x="507.79999999999995" y="1626">候補</text><text class="node-title" x="507.79999999999995" y="1654">評価と合法性を小さい変更で確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="507.79999999999995" y="1693">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="507.79999999999995" y="1717">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="979.25" y="1606" width="320" height="121" rx="7"/><text class="node-kind" x="995.25" y="1626">分野</text><text class="node-title" x="995.25" y="1654">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="995.25" y="1691">詳細の質問・図へ →</text></a></g></svg>