<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-heuristic-grid-path flow-desc-heuristic-grid-path" width="1336" height="1789" viewBox="0 0 1336 1789" data-flow-svg="heuristic-grid-path"><title id="flow-title-heuristic-grid-path">使わないタイルの経路を伸ばすの解法フローチャート</title><desc id="flow-desc-heuristic-grid-path">マスとタイル ID を区別し、末尾の状態を戻します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-heuristic-grid-path" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge tail" data-edge="goal:tail:path-tile-once"><title>固定した先頭を残し、末尾を作り直す</title><path d="M830.944 182 V194 C830.944 226 424.833 226 424.833 258 V270"/><path d="M424.833 308 V338 C424.833 370 424.833 370 424.833 402 V414" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="goal:tail:path-tile-once" tabindex="0" role="group" aria-label="選択肢：固定した先頭を残し、末尾を作り直す"><rect x="302.3333333333333" y="270" width="245" height="38" rx="5"/><text text-anchor="middle" x="424.8333333333333" y="293">固定した先頭を残し、末尾を作り直す</text></g></g><g class="flow-edge upper" data-edge="goal:upper:path-relaxation"><title>到達可能な残り得点の上限で枝を捨てる</title><path d="M910.944 182 V194 C910.944 226 1048.5 226 1048.5 258 V270"/><path d="M1048.5 326 V338 C1048.5 370 1076.5 370 1076.5 402 V414" marker-end="url(#arrow-heuristic-grid-path)"/><g class="flow-edge-label" data-edge-label="goal:upper:path-relaxation" tabindex="0" role="group" aria-label="選択肢：到達可能な残り得点の上限で枝を捨てる"><rect x="926" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1048.5" y="293">到達可能な残り得点の上限で枝を捨て</text><text text-anchor="middle" x="1048.5" y="311">る</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M990.944 182 V194 C990.944 226 1259.5 226 1259.5 258 V270"/><path d="M1259.5 308 V338 C1259.5 370 1298 370 1298 