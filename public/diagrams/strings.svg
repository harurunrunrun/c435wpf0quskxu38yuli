<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strings flow-desc-strings" width="1840" height="908" viewBox="0 0 1840 908" data-flow-svg="strings"><title id="flow-title-strings">一致・部分文字列・回文の解法フローチャート</title><desc id="flow-desc-strings">一致、部分文字列、回文、順序を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strings" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge comparison" data-edge="text-task:comparison:comparison-route"><title>一致の比較・編集距離</title><path d="M813.333 159 V171 C813.333 203 192 203 192 235 V247"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-strings)"/><g class="flow-edge-label" data-edge-label="text-task:comparison:comparison-route" tabindex="0" role="group" aria-label="選択肢：一致の比較・編集距離"><rect x="115" y="247" width="154" height="38" rx="5"/><text text-anchor="middle" x="192" y="270">一致の比較・編集距離</text></g></g><g class="flow-edge extraction" data-edge="text-task:extraction:extraction-route"><title>連続区間・飛び飛びの取り出し</title><path d="M866.667 159 V171 C866.667 203 556 203 556 235 V247"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-strings)"/><g class="flow-edge-label" data-edge-label="text-task:extraction:extraction-route" tabindex="0" role="group" aria-label="選択肢：連続区間・飛び飛びの取り出し"><rect x="453" y="247" width="206" height="38" rx="5"/><text text-anchor="middle" x="556" y="270">連続区間・飛び飛びの取り出し</text></g></g><g class="flow-edge changes" data-edge="text-task:changes:changes-route"><title>文字や桁の変更・追加</title><path d="M920 159 V171 C920 203 920 203 920 235 V247"/><path d="M920 285 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-strings)"/><g class="flow-edge-label" data-edge-label="text-task:changes:changes-route" tabindex="0" role="group" aria-label="選択肢：文字や桁の変更・追加"><rect x="843" y="247" width="154" height="38" rx="5"/><text text-anchor="middle" x="920" y="270">文字や桁の変更・追加</text></g></g><g class="flow-edge order-turns" data-edge="text-task:order-turns:order-turns-route"><title>連結する順序・単語を使う手番</title><path d="M973.333 159 V171 C973.333 203 1284 203 1284 235 V247"/><path d="M1284 285 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-strings)"/><g class="flow-edge-label" data-edge-label="text-task:order-turns:order-turns-route" tabindex="0" role="group" aria-label="選択肢：連結する順序・単語を使う手番"><rect x="1181" y="247" width="206" height="38" rx="5"/><text text-anchor="middle" x="1284" y="270">連結する順序・単語を使う手番</text></g></g><g class="flow-edge unknown" data-edge="text-task:unknown:check"><title>わからない</title><path d="M1026.667 159 V171 C1026.667 203 1648 203 1648 235 V247"/><path d="M1648 285 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-strings)"/><g class="flow-edge-label" data-edge-label="text-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1603.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1648" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:substring-route"><title>はい</title><path d="M1568 523 V535 C1568 567 1284 567 1284 599 V611"/><path d="M1284 649 V661 C1284 693 1284 693 1284 725 V737" marker-end="url(#arrow-strings)"/><g class="flow-edge-label" data-edge-label="check:yes:substring-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1244" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="634">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1648 523 V535 C1648 567 1635 567 1635 599 V611"/><path d="M1635 649 V661 C1635 693 1594.667 693 1594.667 725 V737" marker-end="url(#arrow-strings)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1595" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="1635" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1728 523 V535 C1728 567 1763.5 567 1763.5 599 V611"/><path d="M1763.5 649 V661 C1763.5 693 1701.333 693 1701.333 725 V737" marker-end="url(#arrow-strings)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1719" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="1763.5" y="634">わからない</text></g></g><g class="flow-node question" data-node="text-task"><rect x="760" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="52">質問</text><text class="node-title" x="776" y="80">文字列から何を求めますか？</text><text class="node-explanation" x="776" y="107">接頭辞の照合、連続した部分文字列、位置を飛ばす部</text><text class="node-explanation" x="776" y="125">分列、回文を分けます。</text></g><g class="flow-node question" data-node="check"><rect x="1488" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="1504" y="393">質問</text><text class="node-title" x="1504" y="421">求めているのは、連続した部分文字列</text><text class="node-title" x="1504" y="444">ですか？</text><text class="node-explanation" x="1504" y="471">連続しない部分列なら、添字や最後の文字などを状態</text><text class="node-explanation" x="1504" y="489">にする DP を検討します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1488" y="737" width="320" height="139" rx="7"/><text class="node-kind" x="1504" y="757">分野</text><text class="node-title" x="1504" y="785">条件を確かめる</text><text class="node-explanation" x="1504" y="812">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1504" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="substring-route"><rect x="1124" y="737" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="757">分野</text><text class="node-title" x="1140" y="785">部分文字列</text><a href="/flowchartcp/flowcharts/#diagram-string-substring" data-route="string-substring"><text x="1140" y="822">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="comparison-route"><rect x="32" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">一致の比較・編集距離</text><a href="/flowchartcp/flowcharts/#diagram-strings-comparison-goals" data-route="strings-comparison-goals"><text x="48" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="extraction-route"><rect x="396" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">連続区間・飛び飛びの取り出し</text><a href="/flowchartcp/flowcharts/#diagram-strings-extraction-goals" data-route="strings-extraction-goals"><text x="412" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="changes-route"><rect x="760" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">文字や桁の変更・追加</text><a href="/flowchartcp/flowcharts/#diagram-strings-change-goals" data-route="strings-change-goals"><text x="776" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="order-turns-route"><rect x="1124" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">連結する順序・単語を使う手番</text><a href="/flowchartcp/flowcharts/#diagram-strings-order-turns" data-route="strings-order-turns"><text x="1140" y="458">詳細の質問・図へ →</text></a></g></svg>