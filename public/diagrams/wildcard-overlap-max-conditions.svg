<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-wildcard-overlap-max-conditions flow-desc-wildcard-overlap-max-conditions" width="748" height="1347" viewBox="0 0 748 1347" data-flow-svg="wildcard-overlap-max-conditions"><title id="flow-title-wildcard-overlap-max-conditions">未定の文字を補う語の出現数の最大化の解法フローチャート</title><desc id="flow-desc-wildcard-overlap-max-conditions">連続出現、文字選択の独立性、処理できる状態数を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-wildcard-overlap-max-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="one-pattern:yes:independent"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-wildcard-overlap-max-conditions)"/><g class="flow-edge-label" data-edge-label="one-pattern:yes:independent" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="one-pattern:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V581 C654 613 654 613 654 645 V657 V707 C654 739 654 739 654 771 V783 V945 C654 977 654 977 654 1009 V1021 V1071 C654 1103 624.571 1103 624.571 1135 V1147" marker-end="url(#arrow-wildcard-overlap-max-conditions)"/><g class="flow-edge-label" data-edge-label="one-pattern:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="one-pattern:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V581 C710 613 710 613 710 645 V657 V707 C710 739 710 739 710 771 V783 V945 C710 977 710 977 710 1009 V1021 V1071 C710 1103 670.286 1103 670.286 1135 V1147" marker-end="url(#arrow-wildcard-overlap-max-conditions)"/><g class="flow-edge-label" data-edge-label="one-pattern:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="independent:yes:size"><title>はい</title><path d="M352.5 569 V581 C352.5 613 307 613 307 645 V657"/><path d="M307 695 V707 C307 739 319.5 739 319.5 771 V783" marker-end="url(#arrow-wildcard-overlap-max-conditions)"/><g class="flow-edge-label" data-edge-label="independent:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="680">はい</text></g></g><g class="flow-edge no" data-edge="independent:no:check"><title>いいえ</title><path d="M432.5 569 V581 C432.5 613 431 613 431 645 V657"/><path d="M431 695 V707 C431 739 542 739 542 771 V783 V945 C542 977 542 977 542 1009 V1021 V1071 C542 1103 533.143 1103 533.143 1135 V1147" marker-end="url(#arrow-wildcard-overlap-max-conditions)"/><g class="flow-edge-label" data-edge-label="independent:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="independent:unknown:check"><title>わからない</title><path d="M512.5 569 V581 C512.5 613 559.5 613 559.5 645 V657"/><path d="M559.5 695 V707 C559.5 739 598 739 598 771 V783 V945 C598 977 598 977 598 1009 V1021 V1071 C598 1103 578.857 1103 578.857 1135 V1147" marker-end="url(#arrow-wildcard-overlap-max-conditions)"/><g class="flow-edge-label" data-edge-label="independent:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:answer"><title>はい</title><path d="M239.5 933 V945 C239.5 977 192 977 192 1009 V1021"/><path d="M192 1059 V1071 C192 1103 192 1103 192 1135 V1147" marker-end="url(#arrow-wildcard-overlap-max-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1044">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 933 V945 C319.5 977 319 977 319 1009 V1021"/><path d="M319 1059 V1071 C319 1103 441.714 1103 441.714 1135 V1147" marker-end="url(#arrow-wildcard-overlap-max-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1021" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1044">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 933 V945 C399.5 977 447.5 977 447.5 1009 V1021"/><path d="M447.5 1059 V1071 C447.5 1103 487.429 1103 487.429 1135 V1147" marker-end="url(#arrow-wildcard-overlap-max-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1021" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1044">わからない</text></g></g><g class="flow-node question" data-node="one-pattern"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">一つの固定された非空の語の連続出現</text><text class="node-title" x="400.5" y="103">を数え、重なった出現も許しますか？</text><text class="node-explanation" x="400.5" y="130">部分列や、出現区間が重ならない選び方とは分けま</text><text class="node-explanation" x="400.5" y="148">す。</text></g><g class="flow-node question" data-node="independent"><rect x="272.5" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">未定の各位置は独立に文字を選べ、文</text><text class="node-title" x="288.5" y="467">字の使用個数などの全体制約はありま</text><text class="node-title" x="288.5" y="490">せんか？</text><text class="node-explanation" x="288.5" y="517">掲載実装では疑問符を英小文字一文字へ変え、既に決</text><text class="node-explanation" x="288.5" y="535">まった文字は変えません。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="783" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="803">質問</text><text class="node-title" x="175.5" y="831">本文長と語の長さの積に、文字種類数</text><text class="node-title" x="175.5" y="854">を掛けた遷移を処理できますか？</text><text class="node-explanation" x="175.5" y="881">一致中の接頭辞の長さを状態にします。掲載実装は長</text><text class="node-explanation" x="175.5" y="899">さ各10^5以下、積10^7以下です。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1147" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1167">候補</text><text class="node-title" x="48" y="1195">一致長ごとに最大出現数を持ち、完成</text><text class="node-title" x="48" y="1218">後も接尾辞の一致を残す</text><a href="/flowchartcp/techniques/wildcard-pattern-overlap-automaton/"><title>文字を補って同じ語の出現数を最大化するときは、一致後も接尾辞の一致を残すの記事へ</title><text x="48" y="1257">文字を補って同じ語の出現数を最大化するときは、</text><text x="48" y="1275">一致後も接尾辞の一致を残す</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1147" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1167">分野</text><text class="node-title" x="412" y="1195">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1232">詳細の質問・図へ →</text></a></g></svg>