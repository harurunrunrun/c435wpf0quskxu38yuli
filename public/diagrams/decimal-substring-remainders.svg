<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-decimal-substring-remainders flow-desc-decimal-substring-remainders" width="1588" height="1343" viewBox="0 0 1588 1343" data-flow-svg="decimal-substring-remainders"><title id="flow-title-decimal-substring-remainders">割り切れる十進部分文字列の解法フローチャート</title><desc id="flow-desc-decimal-substring-remainders">数字列の位置区間を数え、法と十進の桁移動の関係を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-decimal-substring-remainders" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:modulus"><title>はい</title><path d="M789.133 182 V194 C789.133 226 804.9 226 804.9 258 V270"/><path d="M804.9 308 V320 C804.9 352 804.9 352 804.9 384 V396" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="model:yes:modulus" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="764.9" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="804.9" y="293">はい</text></g></g><g class="flow-edge no" data-edge="model:no:fallback"><title>いいえ</title><path d="M709.133 182 V194 C709.133 226 72 226 72 258 V270"/><path d="M72 308 V320 C72 352 38 352 38 384 V396 V558 C38 590 38 590 38 622 V634 V702 C38 734 38 734 38 766 V778 V958 C38 990 585 990 585 1022 V1034 V1084 C585 1116 505 1116 505 1148 V1160" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="32" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M869.133 182 V194 C869.133 226 1490.5 226 1490.5 258 V270"/><path d="M1490.5 308 V320 C1490.5 352 1490.5 352 1490.5 384 V396 V558 C1490.5 590 1490.5 590 1490.5 622 V634 V702 C1490.5 734 1449.333 734 1449.333 766 V778" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1446" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1490.5" y="293">わからない</text></g></g><g class="flow-edge prime" data-edge="modulus:prime:prime-result"><title>P が素数と保証される（2・5 も含む）</title><path d="M698.233 546 V558 C698.233 590 248 590 248 622 V634"/><path d="M248 690 V702 C248 734 248 734 248 766 V778" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="modulus:prime:prime-result" tabindex="0" role="group" aria-label="選択肢：P が素数と保証される（2・5 も含む）"><rect x="125.5" y="634" width="245" height="56" rx="5"/><text text-anchor="middle" x="248" y="657">P が素数と保証される（2・5 も</text><text text-anchor="middle" x="248" y="675">含む）</text></g></g><g class="flow-edge coprime" data-edge="modulus:coprime:suffix-result"><title>P は正で、10 と互いに素</title><path d="M804.9 546 V558 C804.9 590 806.5 590 806.5 622 V634"/><path d="M806.5 672 V702 C806.5 734 668 734 668 766 V778" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="modulus:coprime:suffix-result" tabindex="0" role="group" aria-label="選択肢：P は正で、10 と互いに素"><rect x="703.5" y="634" width="206" height="38" rx="5"/><text text-anchor="middle" x="806.5" y="657">P は正で、10 と互いに素</text></g></g><g class="flow-edge two-five" data-edge="modulus:two-five:last-digit-result"><title>P は 2 または 5</title><path d="M858.233 546 V558 C858.233 590 1037 590 1037 622 V634"/><path d="M1037 672 V702 C1037 734 1032 734 1032 766 V778" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="modulus:two-five:last-digit-result" tabindex="0" role="group" aria-label="選択肢：P は 2 または 5"><rect x="953.5" y="634" width="167" height="38" rx="5"/><text text-anchor="middle" x="1037" y="657">P は 2 または 5</text></g></g><g class="flow-edge other" data-edge="modulus:other:fallback"><title>4・10・20 など、10 と共通因子を持つその他の法</title><path d="M751.567 546 V558 C751.567 590 537 590 537 622 V634"/><path d="M537 690 V702 C537 734 458 734 458 766 V778 V958 C458 990 641 990 641 1022 V1034 V1084 C641 1116 585 1116 585 1148 V1160" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="modulus:other:fallback" tabindex="0" role="group" aria-label="選択肢：4・10・20 など、10 と共通因子を持つその他の法"><rect x="414.5" y="634" width="245" height="56" rx="5"/><text text-anchor="middle" x="537" y="657">4・10・20 など、10 と共通</text><text text-anchor="middle" x="537" y="675">因子を持つその他の法</text></g></g><g class="flow-edge unknown" data-edge="modulus:unknown:check"><title>わからない</title><path d="M911.567 546 V558 C911.567 590 1396 590 1396 622 V634"/><path d="M1396 672 V702 C1396 734 1342.667 734 1342.667 766 V778" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="modulus:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1351.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1396" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1316 910 V958 C1316 990 731 990 731 1022 V1034"/><path d="M731 1072 V1084 C731 1116 665 1116 665 1148 V1160" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="691" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="731" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1396 910 V958 C1396 990 1383 990 1383 1022 V1034"/><path d="M1383 1072 V1084 C1383 1116 1342.667 1116 1342.667 1148 V1160" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1343" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="1383" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1476 910 V958 C1476 990 1511.5 990 1511.5 1022 V1034"/><path d="M1511.5 1072 V1084 C1511.5 1116 1449.333 1116 1449.333 1148 V1160" marker-end="url(#arrow-decimal-substring-remainders)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1467" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="1511.5" y="1057">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="629.1333333333333" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="645.1333333333333" y="52">質問</text><text class="node-title" x="645.1333333333333" y="80">十進数字列の非空の連続区間を、出現</text><text class="node-title" x="645.1333333333333" y="103">位置を区別して数えますか？</text><text class="node-explanation" x="645.1333333333333" y="130">先頭の 0 も許します。同じ数字列でも位置が異な</text><text class="node-explanation" x="645.1333333333333" y="148">れば別の区間です。</text></g><g class="flow-node question" data-node="modulus"><rect x="644.9" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="660.9" y="416">質問</text><text class="node-title" x="660.9" y="444">割る数 P について、どの条件があ</text><text class="node-title" x="660.9" y="467">りますか？</text><text class="node-explanation" x="660.9" y="494">接尾辞を右にそろえると 10 の累乗が掛かりま</text><text class="node-explanation" x="660.9" y="512">す。その因子を消せるかが重要です。</text></g><g class="flow-node result" data-node="prime-result"><rect x="88" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="798">候補</text><text class="node-title" x="104" y="826">2・5 は末尾、それ以外は接尾辞の</text><text class="node-title" x="104" y="849">余りの一致を数える</text><a href="/flowchartcp/techniques/decimal-substring-divisibility/"><title>十進部分文字列の可除性は、10と互いに素なら右揃えの余りを照合するの記事へ</title><text x="104" y="888">十進部分文字列の可除性は、10と互いに素なら右</text><text x="104" y="906">揃えの余りを照合する</text></a></g><g class="flow-node result" data-node="suffix-result"><rect x="508" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="524" y="798">候補</text><text class="node-title" x="524" y="826">右揃えした接尾辞の余りが同じ二位置</text><text class="node-title" x="524" y="849">を数える</text><a href="/flowchartcp/techniques/decimal-substring-divisibility/"><title>十進部分文字列の可除性は、10と互いに素なら右揃えの余りを照合するの記事へ</title><text x="524" y="888">十進部分文字列の可除性は、10と互いに素なら右</text><text x="524" y="906">揃えの余りを照合する</text></a></g><g class="flow-node result" data-node="last-digit-result"><rect x="872" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="888" y="798">候補</text><text class="node-title" x="888" y="826">割り切れる末尾から、そこまでの開始</text><text class="node-title" x="888" y="849">位置を全て数える</text><a href="/flowchartcp/techniques/decimal-substring-divisibility/"><title>十進部分文字列の可除性は、10と互いに素なら右揃えの余りを照合するの記事へ</title><text x="888" y="888">十進部分文字列の可除性は、10と互いに素なら右</text><text x="888" y="906">揃えの余りを照合する</text></a></g><g class="flow-node question" data-node="check"><rect x="1236" y="778" width="320" height="132" rx="7"/><text class="node-kind" x="1252" y="798">質問</text><text class="node-title" x="1252" y="826">必要な条件を、問題文と小さい例から</text><text class="node-title" x="1252" y="849">確認できますか？</text><text class="node-explanation" x="1252" y="876">操作の条件と、求める個数・値・順序を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="425" y="1160" width="320" height="151" rx="7"/><text class="node-kind" x="441" y="1180">候補</text><text class="node-title" x="441" y="1208">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="441" y="1247">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="441" y="1271">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1236" y="1160" width="320" height="121" rx="7"/><text class="node-kind" x="1252" y="1180">分野</text><text class="node-title" x="1252" y="1208">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1252" y="1245">詳細の質問・図へ →</text></a></g></svg>