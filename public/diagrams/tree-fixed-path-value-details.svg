<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-fixed-path-value-details flow-desc-tree-fixed-path-value-details" width="1112" height="972" viewBox="0 0 1112 972" data-flow-svg="tree-fixed-path-value-details"><title id="flow-title-tree-fixed-path-value-details">値が変わらない経路の集計と順位の解法フローチャート</title><desc id="flow-desc-tree-fixed-path-value-details">経路の和や XOR、値の順位など、固定された値から求める量を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-fixed-path-value-details" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge sum" data-edge="static-kind:sum:prefix-check"><title>和・XOR・長さ</title><path d="M662.625 182 V194 C662.625 226 444 226 444 258 V270"/><path d="M444 308 V320 C444 352 444 352 444 384 V396" marker-end="url(#arrow-tree-fixed-path-value-details)"/><g class="flow-edge-label" data-edge-label="static-kind:sum:prefix-check" tabindex="0" role="group" aria-label="選択肢：和・XOR・長さ"><rect x="380" y="270" width="128" height="38" rx="5"/><text text-anchor="middle" x="444" y="293">和・XOR・長さ</text></g></g><g class="flow-edge kth" data-edge="static-kind:kth:kth-route"><title>小さい順で k 番目の頂点値</title><path d="M726.625 182 V194 C726.625 226 672 226 672 258 V270"/><path d="M672 308 V320 C672 352 808 352 808 384 V396" marker-end="url(#arrow-tree-fixed-path-value-details)"/><g class="flow-edge-label" data-edge-label="static-kind:kth:kth-route" tabindex="0" role="group" aria-label="選択肢：小さい順で k 番目の頂点値"><rect x="569" y="270" width="206" height="38" rx="5"/><text text-anchor="middle" x="672" y="293">小さい順で k 番目の頂点値</text></g></g><g class="flow-edge other" data-edge="static-kind:other:path"><title>その他の経路集計</title><path d="M790.625 182 V194 C790.625 226 883 226 883 258 V270"/><path d="M883 308 V320 C883 352 1018 352 1018 384 V396 V558 C1018 590 1014.5 590 1014.5 622 V634 V684 C1014.5 716 609.333 716 609.333 748 V760" marker-end="url(#arrow-tree-fixed-path-value-details)"/><g class="flow-edge-label" data-edge-label="static-kind:other:path" tabindex="0" role="group" aria-label="選択肢：その他の経路集計"><rect x="819" y="270" width="128" height="38" rx="5"/><text text-anchor="middle" x="883" y="293">その他の経路集計</text></g></g><g class="flow-edge unknown" data-edge="static-kind:unknown:check"><title>わからない</title><path d="M854.625 182 V194 C854.625 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V320 C1035.5 352 1074 352 1074 384 V396 V558 C1074 590 1070.5 590 1070.5 622 V634 V684 C1070.5 716 973.333 716 973.333 748 V760" marker-end="url(#arrow-tree-fixed-path-value-details)"/><g class="flow-edge-label" data-edge-label="static-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="prefix-check:yes:prefix-result"><title>はい</title><path d="M364 546 V558 C364 590 192 590 192 622 V634"/><path d="M192 672 V684 C192 716 192 716 192 748 V760" marker-end="url(#arrow-tree-fixed-path-value-details)"/><g class="flow-edge-label" data-edge-label="prefix-check:yes:prefix-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="657">はい</text></g></g><g class="flow-edge no" data-edge="prefix-check:no:path"><title>いいえ</title><path d="M444 546 V558 C444 590 556 590 556 622 V634"/><path d="M556 672 V684 C556 716 502.667 716 502.667 748 V760" marker-end="url(#arrow-tree-fixed-path-value-details)"/><g class="flow-edge-label" data-edge-label="prefix-check:no:path" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="prefix-check:unknown:check"><title>わからない</title><path d="M524 546 V558 C524 590 920 590 920 622 V634"/><path d="M920 672 V684 C920 716 866.667 716 866.667 748 V760" marker-end="url(#arrow-tree-fixed-path-value-details)"/><g class="flow-edge-label" data-edge-label="prefix-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="657">わからない</text></g></g><g class="flow-node question" data-node="static-kind"><rect x="598.625" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="614.625" y="52">質問</text><text class="node-title" x="614.625" y="80">経路上の固定値から、何を求めます</text><text class="node-title" x="614.625" y="103">か？</text><text class="node-explanation" x="614.625" y="130">同じ値の出現も、頂点ごとに一つの要素として扱いま</text><text class="node-explanation" x="614.625" y="148">す。</text></g><g class="flow-node question" data-node="prefix-check"><rect x="284" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="300" y="416">質問</text><text class="node-title" x="300" y="444">根からの和・XOR と共通祖先から</text><text class="node-title" x="300" y="467">経路を復元できますか？</text><text class="node-explanation" x="300" y="494">辺の値か頂点の値かで、共通祖先の補正が変わりま</text><text class="node-explanation" x="300" y="512">す。</text></g><g class="flow-node result" data-node="prefix-result"><rect x="32" y="760" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">根からの累積値を共通祖先で補正する</text><a href="/flowchartcp/techniques/tree-path-prefix-lca/"><title>木の経路和を根からの累積和とLCAで求めるの記事へ</title><text x="48" y="847">木の経路和を根からの累積和とLCAで求める</text></a></g><g class="flow-node route" data-node="path"><rect x="396" y="760" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="780">分野</text><text class="node-title" x="412" y="808">二頂点間の経路の集計・更新</text><text class="node-explanation" x="412" y="835">経路への集計や更新が必要かを確認し、少数の指定頂</text><text class="node-explanation" x="412" y="853">点についての問い合わせへ進みます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-path-aggregation" data-route="tree-path-aggregation"><text x="412" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="760" width="320" height="180" rx="7"/><text class="node-kind" x="776" y="780">分野</text><text class="node-title" x="776" y="808">問い合わせで対象となる頂点を確かめ</text><text class="node-title" x="776" y="831">る</text><text class="node-explanation" x="776" y="858">根を決めて対象を図に描き、祖先・部分木・経路のど</text><text class="node-explanation" x="776" y="876">れを扱うかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-query-target-check" data-route="tree-query-target-check"><text x="776" y="904">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="kth-route"><rect x="648" y="396" width="320" height="121" rx="7"/><text class="node-kind" x="664" y="416">分野</text><text class="node-title" x="664" y="444">経路の順位と値の頻度</text><a href="/flowchartcp/flowcharts/#diagram-tree-path-order" data-route="tree-path-order"><text x="664" y="481">詳細の質問・図へ →</text></a></g></svg>