<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-polynomial-known-samples flow-desc-polynomial-known-samples" width="1336" height="1748" viewBox="0 0 1336 1748" data-flow-svg="polynomial-known-samples"><title id="flow-title-polynomial-known-samples">既知の点と値からの復元の解法フローチャート</title><desc id="flow-desc-polynomial-known-samples">点と値から係数全体を復元する場合と、連続した整数での値から別の一点だけを求める場合を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-polynomial-known-samples" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge coefficients" data-edge="output:coefficients:distinct-field"><title>点数未満の次数で、全ての係数を復元する</title><path d="M830.944 159 V171 C830.944 203 424.833 203 424.833 235 V247"/><path d="M424.833 303 V315 C424.833 347 424.833 347 424.833 379 V391" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="output:coefficients:distinct-field" tabindex="0" role="group" aria-label="選択肢：点数未満の次数で、全ての係数を復元する"><rect x="302.3333333333333" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="424.8333333333333" y="270">点数未満の次数で、全ての係数を復元</text><text text-anchor="middle" x="424.8333333333333" y="288">する</text></g></g><g class="flow-edge one-value" data-edge="output:one-value:degree-samples"><title>係数は不要で、別の一点の値を求める</title><path d="M910.944 159 V171 C910.944 203 1048.5 203 1048.5 235 V247"/><path d="M1048.5 285 V315 C1048.5 347 1076.5 347 1076.5 379 V391" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="output:one-value:degree-samples" tabindex="0" role="group" aria-label="選択肢：係数は不要で、別の一点の値を求める"><rect x="926" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="1048.5" y="270">係数は不要で、別の一点の値を求める</text></g></g><g class="flow-edge unknown" data-edge="output:unknown:check"><title>わからない</title><path d="M990.944 159 V171 C990.944 203 1259.5 203 1259.5 235 V247"/><path d="M1259.5 285 V315 C1259.5 347 1298 347 1298 379 V391 V594 C1298 626 1298 626 1298 658 V670 V720 C1298 752 1298 752 1298 784 V796 V958 C1298 990 1298 990 1298 1022 V1034 V1084 C1298 1116 1194.667 1116 1194.667 1148 V1160" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="output:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1215" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1259.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="distinct-field:yes:fast-products"><title>はい</title><path d="M424.833 559 V594 C424.833 626 453.5 626 453.5 658 V670"/><path d="M453.5 708 V720 C453.5 752 453.5 752 453.5 784 V796" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="distinct-field:yes:fast-products" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="413.5" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="453.5" y="693">はい</text></g></g><g class="flow-edge no" data-edge="distinct-field:no:fallback"><title>いいえ</title><path d="M344.833 559 V594 C344.833 626 72 626 72 658 V670"/><path d="M72 708 V720 C72 752 38 752 38 784 V796 V958 C38 990 38 990 38 1022 V1034 V1084 C38 1116 38 1116 38 1148 V1160 V1340 C38 1372 651.8 1372 651.8 1404 V1416 V1466 C651.8 1498 545.133 1498 545.133 1530 V1542" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="distinct-field:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="32" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="distinct-field:unknown:check"><title>わからない</title><path d="M504.833 559 V594 C504.833 626 749 626 749 658 V670"/><path d="M749 708 V720 C749 752 749 752 749 784 V796 V958 C749 990 749 990 749 1022 V1034 V1084 C749 1116 1034.667 1116 10