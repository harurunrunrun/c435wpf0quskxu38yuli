ve" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="923" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="factorial-field:no:fallback"><title>いいえ</title><path d="M884.5 946 V958 C884.5 990 839 990 839 1022 V1034"/><path d="M839 1072 V1084 C839 1116 514 1116 514 1148 V1160 V1340 C514 1372 763.8 1372 763.8 1404 V1416 V1466 C763.8 1498 651.8 1498 651.8 1530 V1542" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="factorial-field:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="799" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="839" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="factorial-field:unknown:check"><title>わからない</title><path d="M1044.5 946 V958 C1044.5 990 1091.5 990 1091.5 1022 V1034"/><path d="M1091.5 1072 V1084 C1091.5 1116 1088 1116 1088 1148 V1160" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="factorial-field:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1057">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1008 1310 V1340 C1008 1372 853.8 1372 853.8 1404 V1416"/><path d="M853.8 1454 V1466 C853.8 1498 705.133 1498 705.133 1530 V1542" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="813.8" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="853.8" y="1439">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1088 1310 V1340 C1088 1372 1075 1372 1075 1404 V1416"/><path d="M1075 1454 V1466 C1075 1498 1085.917 1498 1085.917 1530 V1542" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="1439">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1168 1310 V1340 C1168 1372 1203.5 1372 1203.5 1404 V1416"/><path d="M1203.5 1454 V1466 C1203.5 1498 1192.583 1498 1192.583 1530 V1542" marker-end="url(#arrow-polynomial-known-samples)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="1416" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="1439">わからない</text></g></g><g class="flow-node question" data-node="output"><rect x="750.9444444444443" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="766.9444444444443" y="52">質問</text><text class="node-title" x="766.9444444444443" y="80">既知の点と値から、何を求めますか？</text><text class="node-explanation" x="766.9444444444443" y="107">多項式の係数を全て求める場合と、次数の上限を使っ</text><text class="node-explanation" x="766.9444444444443" y="125">て別の点の値だけ求める場合を分けます。</text></g><g class="flow-node question" data-node="distinct-field"><rect x="264.8333333333333" y="391" width="320" height="168" rx="7"/><text class="node-kind" x="280.8333333333333" y="411">質問</text><text class="node-title" x="280.8333333333333" y="439">既知の点は一つ以上で、素数の法の下</text><text class="node-title" x="280.8333333333333" y="462">で互いに異なりますか？</text><text class="node-explanation" x="280.8333333333333" y="489">同じ整数かどうかではなく、法を取った点が異なるこ</text><text class="node-explanation" x="280.8333333333333" y="507">とを確認します。重複点や合成数の法を同じ実装へ渡</text><text class="node-explanation" x="280.8333333333333" y="525">せません。</text></g><g class="flow-node question" data-node="fast-products"><rect x="293.5" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="309.5" y="816">質問</text><text class="node-title" x="309.5" y="844">必要な多項式の積と剰余を、高速かつ</text><text class="node-title" x="309.5" y="867">正確に計算できますか？</text><text class="node-explanation" x="309.5" y="894">積の木と微分値の多点評価を使います。掲載実装の法</text><text class="node-explanation" x="309.5" y="912">と、畳み込みの長さ・メモリの上限を確認します。</text></g><g class="flow-node result" data-node="interpolation"><rect x="88" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="1180">候補</text><text class="node-title" x="104" y="1208">点を根とする積の微分で重みを求め、</text><text class="node-title" x="104" y="1231">係数を併合する</text><a href="/flowchartcp/techniques/polynomial-interpolation-product-tree/"><title>多数の点と値から、一次式の積を使って多項式を復元するの記事へ</title><text x="104" y="1270">多数の点と値から、一次式の積を使って多項式を復</text><text x="104" y="1288">元する</text></a></g><g class="flow-node question" data-node="degree-samples"><rect x="916.5" y="391" width="320" height="191" rx="7"/><text class="node-kind" x="932.5" y="411">質問</text><text class="node-title" x="932.5" y="439">次数が D 以下だと示せて、0 か</text><text class="node-title" x="932.5" y="462">ら D までの各整数での値が分かり</text><text class="node-title" x="932.5" y="485">ますか？</text><text class="node-explanation" x="932.5" y="512">小さい例に合うだけでは次数の証明になりません。累</text><text class="node-explanation" x="932.5" y="530">積和などの操作から次数の上限を示し、D+1 個の</text><text class="node-explanation" x="932.5" y="548">値を用意します。</text></g><g class="flow-node question" data-node="factorial-field"><rect x="804.5" y="796" width="320" height="150" rx="7"/><text class="node-kind" x="820.5" y="816">質問</text><text class="node-title" x="820.5" y="844">法 p は素数で、D は p より</text><text class="node-title" x="820.5" y="867">小さいですか？</text><text class="node-explanation" x="820.5" y="894">0,1,...,D が法の下で異なり、D! の逆</text><text class="node-explanation" x="820.5" y="912">元を取れることが必要です。</text></g><g class="flow-node result" data-node="consecutive"><rect x="564" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="580" y="1180">候補</text><text class="node-title" x="580" y="1208">前後の積と逆階乗を使い、一点の値を</text><text class="node-title" x="580" y="1231">線形時間で求める</text><a href="/flowchartcp/techniques/lagrange-consecutive-values/"><title>連続する整数での値から、前後の積で遠い一点を求めるの記事へ</title><text x="580" y="1270">連続する整数での値から、前後の積で遠い一点を求</text><text x="580" y="1288">める</text></a></g><g class="flow-node question" data-node="check"><rect x="928" y="1160" width="320" height="150" rx="7"/><text class="node-kind" x="944" y="1180">質問</text><text class="node-title" x="944" y="1208">次数の上限・点の重複・計算する法を</text><text class="node-title" x="944" y="1231">確認できますか？</text><text class="node-explanation" x="944" y="1258">任意の点での多点評価と、値からの復元を区別し、逆</text><text class="node-explanation" x="944" y="1276">元が必要な分母を書き出します。</text></g><g class="flow-node result" data-node="fallback"><rect x="491.79999999999995" y="1542" width="320" height="174" rx="7"/><text class="node-kind" x="507.79999999999995" y="1562">候補</text><text class="node-title" x="507.79999999999995" y="1590">点の条件と次数を確かめ、使う演算を</text><text class="node-title" x="507.79999999999995" y="1613">選び直す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="507.79999999999995" y="1652">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="507.79999999999995" y="1676">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="979.25" y="1542" width="320" height="121" rx="7"/><text class="node-kind" x="995.25" y="1562">分野</text><text class="node-title" x="995.25" y="1590">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="995.25" y="1627">詳細の質問・図へ →</text></a></g></svg>