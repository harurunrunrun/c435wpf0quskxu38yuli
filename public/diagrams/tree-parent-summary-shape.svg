337 556 1369 V1381"/><path d="M556 1419 V1431 C556 1463 556 1463 556 1495 V1507" marker-end="url(#arrow-tree-parent-summary-shape)"/><g class="flow-edge-label" data-edge-label="history:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1381" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1404">いいえ</text></g></g><g class="flow-edge unknown" data-edge="history:unknown:check"><title>わからない</title><path d="M832 1293 V1305 C832 1337 867.5 1337 867.5 1369 V1381"/><path d="M867.5 1419 V1431 C867.5 1463 824 1463 824 1495 V1507" marker-end="url(#arrow-tree-parent-summary-shape)"/><g class="flow-edge-label" data-edge-label="history:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="823" y="1381" width="89" height="38" rx="5"/><text text-anchor="middle" x="867.5" y="1404">わからない</text></g></g><g class="flow-node question" data-node="state"><rect x="639.8333333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="655.8333333333334" y="52">質問</text><text class="node-title" x="655.8333333333334" y="80">親へ伝える情報に、選ぶ個数や容量が</text><text class="node-title" x="655.8333333333334" y="103">含まれますか？</text><text class="node-explanation" x="655.8333333333334" y="130">子の DP 表を畳み込むときの合計計算量を見積も</text><text class="node-explanation" x="655.8333333333334" y="148">ります。</text></g><g class="flow-node question" data-node="merge"><rect x="704" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="720" y="416">質問</text><text class="node-title" x="720" y="444">部分木の色や値の頻度表を保持します</text><text class="node-title" x="720" y="467">か？</text><text class="node-explanation" x="720" y="494">単一の値でなく、集合や辞書を子から併合する場合で</text><text class="node-explanation" x="720" y="512">す。</text></g><g class="flow-node question" data-node="pairs"><rect x="648" y="779" width="320" height="150" rx="7"/><text class="node-kind" x="664" y="799">質問</text><text class="node-title" x="664" y="827">二頂点の距離など、別の子の頂点同士</text><text class="node-title" x="664" y="850">を組にしますか？</text><text class="node-explanation" x="664" y="877">最小共通祖先や重心を経由する組として数える方法を</text><text class="node-explanation" x="664" y="895">考えます。</text></g><g class="flow-node question" data-node="history"><rect x="592" y="1143" width="320" height="150" rx="7"/><text class="node-kind" x="608" y="1163">質問</text><text class="node-title" x="608" y="1191">親へ返す状態は、子の並べ方に依存し</text><text class="node-title" x="608" y="1214">ませんか？</text><text class="node-explanation" x="608" y="1241">交換可能な子なら対称性を使えます。順序付きの木な</text><text class="node-explanation" x="608" y="1259">ら順序を保持します。</text></g><g class="flow-node route" data-node="check"><rect x="760" y="1507" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="1527">分野</text><text class="node-title" x="776" y="1555">一辺を切った片側から伝える情報</text><a href="/flowchartcp/flowcharts/#diagram-tree-cut-side-information" data-route="tree-cut-side-information"><text x="776" y="1592">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="tree-result"><rect x="32" y="1507" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="1527">候補</text><text class="node-title" x="48" y="1555">木 DP</text><a href="/flowchartcp/techniques/tree-dp/"><title>木DPの記事へ</title><text x="48" y="1594">木DP</text></a></g><g class="flow-node result" data-node="knapsack"><rect x="340" y="396" width="320" height="169" rx="7"/><text class="node-kind" x="356" y="416">候補</text><text class="node-title" x="356" y="444">木 DP の個数表を併合する</text><a href="/flowchartcp/techniques/tree-knapsack-cardinality/"><title>木の個数DPは部分木サイズまでに範囲を絞って併合するの記事へ</title><text x="356" y="483">木の個数DPは部分木サイズまでに範囲を絞って併</text><text x="356" y="501">合する</text></a><a href="/flowchartcp/techniques/tree-dp/"><title>木DPの記事へ</title><text x="356" y="525">木DP</text></a></g><g class="flow-node result" data-node="small"><rect x="284" y="779" width="320" height="127" rx="7"/><text class="node-kind" x="300" y="799">候補</text><text class="node-title" x="300" y="827">部分木の表を小さい方から併合する</text><a href="/flowchartcp/techniques/small-to-large/"><title>マージテクの記事へ</title><text x="300" y="866">マージテク</text></a></g><g class="flow-node route" data-node="centroid"><rect x="228" y="1143" width="320" height="121" rx="7"/><text class="node-kind" x="244" y="1163">分野</text><text class="node-title" x="244" y="1191">二頂点の経路の長さと求める量</text><a href="/flowchartcp/flowcharts/#diagram-tree-pair-distance" data-route="tree-pair-distance"><text x="244" y="1228">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1507" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1527">候補</text><text class="node-title" x="412" y="1555">辺をまたぐ状態を設計する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1594">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1618">反例探し</text></a></g></svg>