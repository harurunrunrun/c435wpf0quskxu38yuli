<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-mst-edge-classification-conditions flow-desc-mst-edge-classification-conditions" width="748" height="960" viewBox="0 0 748 960" data-flow-svg="mst-edge-classification-conditions"><title id="flow-title-mst-edge-classification-conditions">各辺が最小全域木に入る条件の解法フローチャート</title><desc id="flow-desc-mst-edge-classification-conditions">無向性と連結性、同重みの処理順序を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-mst-edge-classification-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="connected:yes:grouped"><title>はい</title><path d="M456.222 182 V194 C456.222 226 394.167 226 394.167 258 V270"/><path d="M394.167 308 V320 C394.167 352 394.167 352 394.167 384 V396" marker-end="url(#arrow-mst-edge-classification-conditions)"/><g class="flow-edge-label" data-edge-label="connected:yes:grouped" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="354.1666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="394.1666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="connected:no:check"><title>いいえ</title><path d="M536.222 182 V194 C536.222 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V558 C654 590 654 590 654 622 V634 V684 C654 716 588 716 588 748 V760" marker-end="url(#arrow-mst-edge-classification-conditions)"/><g class="flow-edge-label" data-edge-label="connected:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="connected:unknown:check"><title>わからない</title><path d="M616.222 182 V194 C616.222 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V558 C710 590 710 590 710 622 V634 V684 C710 716 652 716 652 748 V760" marker-end="url(#arrow-mst-edge-classification-conditions)"/><g class="flow-edge-label" data-edge-label="connected:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="grouped:yes:answer"><title>はい</title><path d="M314.167 546 V558 C314.167 590 192 590 192 622 V634"/><path d="M192 672 V684 C192 716 192 716 192 748 V760" marker-end="url(#arrow-mst-edge-classification-conditions)"/><g class="flow-edge-label" data-edge-label="grouped:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="657">はい</text></g></g><g class="flow-edge no" data-edge="grouped:no:check"><title>いいえ</title><path d="M394.167 546 V558 C394.167 590 431 590 431 622 V634"/><path d="M431 672 V684 C431 716 460 716 460 748 V760" marker-end="url(#arrow-mst-edge-classification-conditions)"/><g class="flow-edge-label" data-edge-label="grouped:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="grouped:unknown:check"><title>わからない</title><path d="M474.167 546 V558 C474.167 590 559.5 590 559.5 622 V634"/><path d="M559.5 672 V684 C559.5 716 524 716 524 748 V760" marker-end="url(#arrow-mst-edge-classification-conditions)"/><g class="flow-edge-label" data-edge-label="grouped:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-node question" data-node="connected"><rect x="376.2222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="392.2222222222223" y="52">質問</text><text class="node-title" x="392.2222222222223" y="80">固定された連結な無向重み付きグラフ</text><text class="node-title" x="392.2222222222223" y="103">ですか？</text><text class="node-explanation" x="392.2222222222223" y="130">非連結なら全域木はなく、成分ごとの最小全域森を分</text><text class="node-explanation" x="392.2222222222223" y="148">類する問題か確認します。</text></g><g class="flow-node question" data-node="grouped"><rect x="234.16666666666669" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="250.16666666666669" y="416">質問</text><text class="node-title" x="250.16666666666669" y="444">軽い辺だけで成分を縮約し、同じ重み</text><text class="node-title" x="250.16666666666669" y="467">の辺を併合する前に調べられますか？</text><text class="node-explanation" x="250.16666666666669" y="494">縮約後は多重辺が生じます。橋の判定では親頂点では</text><text class="node-explanation" x="250.16666666666669" y="512">なく辺番号で逆向きの辺を除きます。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">同重みの候補を縮約後の橋で三分類す</text><text class="node-title" x="48" y="831">る</text><a href="/flowchartcp/techniques/mst-equal-weight-edge-classification/"><title>最小全域木に必須の辺は、同じ重みの辺をまとめて縮約後の橋で判定するの記事へ</title><text x="48" y="870">最小全域木に必須の辺は、同じ重みの辺をまとめて</text><text x="48" y="888">縮約後の橋で判定する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="760" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="780">分野</text><text class="node-title" x="412" y="808">まだ確認できていない条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="845">詳細の質問・図へ →</text></a></g></svg>