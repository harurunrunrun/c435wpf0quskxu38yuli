<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-periodic-consecutive-word-chain flow-desc-periodic-consecutive-word-chain" width="1112" height="1654" viewBox="0 0 1112 1654" data-flow-svg="periodic-consecutive-word-chain"><title id="flow-title-periodic-consecutive-word-chain">一致する開始位置を周期の余りで持ち、連続する語の鎖を調べるの解法フローチャート</title><desc id="flow-desc-periodic-consecutive-word-chain">部分列として飛ばして取る場合と、連続した語の反復を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-periodic-consecutive-word-chain" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge consecutive-word" data-edge="model:consecutive-word:goal"><title>一つの固定語を、隙間なく連続して並べられる最大回数</title><path d="M564.5 159 V171 C564.5 203 246.5 203 246.5 235 V247"/><path d="M246.5 303 V315 C246.5 347 702.556 347 702.556 379 V391" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="model:consecutive-word:goal" tabindex="0" role="group" aria-label="選択肢：一つの固定語を、隙間なく連続して並べられる最大回数"><rect x="124" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="246.5" y="270">一つの固定語を、隙間なく連続して並</text><text text-anchor="middle" x="246.5" y="288">べられる最大回数</text></g></g><g class="flow-edge subsequence" data-edge="model:subsequence:fallback"><title>位置を飛ばして、指定列を部分列として取り出す</title><path d="M628.5 159 V171 C628.5 203 535.5 203 535.5 235 V247"/><path d="M535.5 303 V315 C535.5 347 962 347 962 379 V391 V553 C962 585 962 585 962 617 V629 V679 C962 711 962 711 962 743 V755 V917 C962 949 962 949 962 981 V993 V1043 C962 1075 588 1075 588 1107 V1119" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="model:subsequence:fallback" tabindex="0" role="group" aria-label="選択肢：位置を飛ばして、指定列を部分列として取り出す"><rect x="413" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="535.5" y="270">位置を飛ばして、指定列を部分列とし</text><text text-anchor="middle" x="535.5" y="288">て取り出す</text></g></g><g class="flow-edge any-occurrences" data-edge="model:any-occurrences:fallback"><title>一つの語の出現回数を、隙間を許して数える</title><path d="M692.5 159 V171 C692.5 203 824.5 203 824.5 235 V247"/><path d="M824.5 303 V315 C824.5 347 1018 347 1018 379 V391 V553 C1018 585 1018 585 1018 617 V629 V679 C1018 711 1018 711 1018 743 V755 V917 C1018 949 1018 949 1018 981 V993 V1043 C1018 1075 652 1075 652 1107 V1119" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="model:any-occurrences:fallback" tabindex="0" role="group" aria-label="選択肢：一つの語の出現回数を、隙間を許して数える"><rect x="702" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="270">一つの語の出現回数を、隙間を許して</text><text text-anchor="middle" x="824.5" y="288">数える</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M756.5 159 V171 C756.5 203 1035.5 203 1035.5 235 V247"/><path d="M1035.5 285 V315 C1035.5 347 1074 347 1074 379 V391 V553 C1074 585 1074 585 1074 617 V629 V679 C1074 711 1074 711 1074 743 V755 V917 C1074 949 1074 949 1074 981 V993 V1043 C1074 1075 1000 1075 1000 1107 V1119" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="goal:yes:guard"><title>はい</title><path d="M622.556 541 V553 C622.556 585 501.167 585 501.167 617 V629"/><path d="M501.167 667 V679 C501.167 711 501.167 711 501.167 743 V755" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="goal:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="461.1666666666667" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="501.1666666666667" y="652">はい</text></g></g><g class="flow-edge no" data-edge="goal:no:fallback"><title>いいえ</title><path d="M702.556 541 V553 C702.556 585 739 585 739 617 V629"/><path d="M739 667 V679 C739 711 850 711 850 743 V755 V917 C850 949 850 949 850 981 V993 V1043 C850 1075 524 1075 524 1107 V1119" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="goal:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="699" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="739" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M782.556 541 V553 C782.556 585 867.5 585 867.5 617 V629"/><path d="M867.5 667 V679 C867.5 711 906 711 906 743 V755 V917 C906 949 906 949 906 981 V993 V1043 C906 1075 920 1075 920 1107 V1119" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="823" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="867.5" y="652">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M421.167 905 V917 C421.167 949 192 949 192 981 V993"/><path d="M192 1031 V1043 C192 1075 192 1075 192 1107 V1119" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1016">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M501.167 905 V917 C501.167 949 556 949 556 981 V993"/><path d="M556 1031 V1043 C556 1075 460 1075 460 1107 V1119" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1016">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M581.167 905 V917 C581.167 949 755.5 949 755.5 981 V993"/><path d="M755.5 1031 V1043 C755.5 1075 840 1075 840 1107 V1119" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="993" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1016">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1269 V1299 C840 1331 783 1331 783 1363 V1375"/><path d="M783 1413 V1425 C783 1457 828.5 1457 828.5 1489 V1501" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1375" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1398">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1269 V1299 C920 1331 907 1331 907 1363 V1375"/><path d="M907 1413 V1425 C907 1457 908.5 1457 908.5 1489 V1501" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1375" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1398">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1269 V1299 C1000 1331 1035.5 1331 1035.5 1363 V1375"/><path d="M1035.5 1413 V1425 C1035.5 1457 988.5 1457 988.5 1489 V1501" marker-end="url(#arrow-periodic-consecutive-word-chain)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1375" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1398">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="500.5" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="516.5" y="52">質問</text><text class="node-title" x="516.5" y="80">繰り返す本文から、何を求めますか？</text><text class="node-explanation" x="516.5" y="107">部分列として飛ばして取る場合と、連続した語の反復</text><text class="node-explanation" x="516.5" y="125">を分けます。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="558.5555555555557" y="411">質問</text><text class="node-title" x="558.5555555555557" y="439">本文と語はどちらも非空で、本文は同</text><text class="node-title" x="558.5555555555557" y="462">じ内容を無限に繰り返しますか？</text><text class="node-explanation" x="558.5555555555557" y="489">一致するかは、開始位置を本文長で割った余りだけで</text><text class="node-explanation" x="558.5555555555557" y="507">決まります。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="755" width="320" height="150" rx="7"/><text class="node-kind" x="357.1666666666667" y="775">質問</text><text class="node-title" x="357.1666666666667" y="803">一つの語の直後は、開始位置を語の長</text><text class="node-title" x="357.1666666666667" y="826">さだけ進めた余りですか？</text><text class="node-explanation" x="357.1666666666667" y="853">一致する余りだけを残します。成功した余りだけの循</text><text class="node-explanation" x="357.1666666666667" y="871">環があるなら、語を無限に並べられます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1119" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1139">候補</text><text class="node-title" x="48" y="1167">一致する開始位置を周期の余りで持</text><text class="node-title" x="48" y="1190">ち、連続する語の鎖を調べる</text><a href="/flowchartcp/techniques/periodic-match-residue-chains/"><title>無限に繰り返す本文で同じ語を連続させるなら、開始位置の余りをつなぐの記事へ</title><text x="48" y="1229">無限に繰り返す本文で同じ語を連続させるなら、開</text><text x="48" y="1247">始位置の余りをつなぐ</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1119" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1139">候補</text><text class="node-title" x="412" y="1167">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1206">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1230">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1119" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1139">質問</text><text class="node-title" x="776" y="1167">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1190">書き出せますか？</text><text class="node-explanation" x="776" y="1217">部分列として飛ばして取る場合と、連続した語の反復</text><text class="node-explanation" x="776" y="1235">を分けます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1501" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1521">分野</text><text class="node-title" x="764.5" y="1549">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1586">詳細の質問・図へ →</text></a></g></svg>