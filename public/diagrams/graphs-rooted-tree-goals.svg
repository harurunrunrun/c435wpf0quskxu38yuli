<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-graphs-rooted-tree-goals flow-desc-graphs-rooted-tree-goals" width="2932" height="938" viewBox="0 0 2932 938" data-flow-svg="graphs-rooted-tree-goals"><title id="flow-title-graphs-rooted-tree-goals">木の各点の答え・部分木・経路の解法フローチャート</title><desc id="flow-desc-graphs-rooted-tree-goals">木の経路・部分木への質問と、各頂点や指定経路に対する条件を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-graphs-rooted-tree-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge tree-range" data-edge="shortest:tree-range:tree-query-route"><title>木の経路・部分木への問い合わせ</title><path d="M1341.556 159 V171 C1341.556 203 192 203 192 235 V247"/><path d="M192 285 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="shortest:tree-range:tree-query-route" tabindex="0" role="group" aria-label="選択肢：木の経路・部分木への問い合わせ"><rect x="82.5" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="192" y="270">木の経路・部分木への問い合わせ</text></g></g><g class="flow-edge tree-answer" data-edge="shortest:tree-answer:tree-dp-route"><title>木の各部分から答えを合成する</title><path d="M1377.111 159 V171 C1377.111 203 556 203 556 235 V247"/><path d="M556 285 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="shortest:tree-answer:tree-dp-route" tabindex="0" role="group" aria-label="選択肢：木の各部分から答えを合成する"><rect x="453" y="247" width="206" height="38" rx="5"/><text text-anchor="middle" x="556" y="270">木の各部分から答えを合成する</text></g></g><g class="flow-edge forest-trigger" data-edge="shortest:forest-trigger:forest-trigger-route"><title>葉から親へ一度だけ連鎖し、経路の最大重みの総和を高める</title><path d="M1412.667 159 V171 C1412.667 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="shortest:forest-trigger:forest-trigger-route" tabindex="0" role="group" aria-label="選択肢：葉から親へ一度だけ連鎖し、経路の最大重みの総和を高める"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">葉から親へ一度だけ連鎖し、経路の最</text><text text-anchor="middle" x="920" y="288">大重みの総和を高める</text></g></g><g class="flow-edge tree-path-black-constraints" data-edge="shortest:tree-path-black-constraints:path-black-route"><title>木の少数の指定経路が、それぞれ黒い辺を一つ以上持つ色付けの個数</title><path d="M1448.222 159 V171 C1448.222 203 1284 203 1284 235 V247"/><path d="M1284 303 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="shortest:tree-path-black-constraints:path-black-route" tabindex="0" role="group" aria-label="選択肢：木の少数の指定経路が、それぞれ黒い辺を一つ以上持つ色付けの個数"><rect x="1161.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="270">木の少数の指定経路が、それぞれ黒い</text><text text-anchor="middle" x="1284" y="288">辺を一つ以上持つ色付けの個数</text></g></g><g class="flow-edge root-path-lis" data-edge="shortest:root-path-lis:root-path-lis-route"><title>根から各頂点までの経路で、値が厳密に増加する部分列の最長長</title><path d="M1483.778 159 V171 C1483.778 203 1648 203 1648 235 V247"/><path d="M1648 303 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="shortest:root-path-lis:root-path-lis-route" tabindex="0" role="group" aria-label="選択肢：根から各頂点までの経路で、値が厳密に増加する部分列の最長長"><rect x="1525.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="270">根から各頂点までの経路で、値が厳密</text><text text-anchor="middle" x="1648" y="288">に増加する部分列の最長長</text></g></g><g class="flow-edge increasing-labels" data-edge="shortest:increasing-labels:increasing-labels-route"><title>親が子より先になる頂点の選び順を、全ての始点で数える</title><path d="M1519.333 159 V171 C1519.333 203 2012 203 2012 235 V247"/><path d="M2012 303 V315 C2012 347 2012 347 2012 379 V391" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="shortest:increasing-labels:increasing-labels-route" tabindex="0" role="group" aria-label="選択肢：親が子より先になる頂点の選び順を、全ての始点で数える"><rect x="1889.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="2012" y="270">親が子より先になる頂点の選び順を、</text><text text-anchor="middle" x="2012" y="288">全ての始点で数える</text></g></g><g class="flow-edge tree-color-union" data-edge="shortest:tree-color-union:tree-color-union-route"><title>木の色を丸ごと併合し、一色の全頂点を連結にする</title><path d="M1554.889 159 V171 C1554.889 203 2376 203 2376 235 V247"/><path d="M2376 303 V315 C2376 347 2376 347 2376 379 V391" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="shortest:tree-color-union:tree-color-union-route" tabindex="0" role="group" aria-label="選択肢：木の色を丸ごと併合し、一色の全頂点を連結にする"><rect x="2253.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="2376" y="270">木の色を丸ごと併合し、一色の全頂点</text><text text-anchor="middle" x="2376" y="288">を連結にする</text></g></g><g class="flow-edge unknown" data-edge="shortest:unknown:check"><title>わからない</title><path d="M1590.444 159 V171 C1590.444 203 2740 203 2740 235 V247"/><path d="M2740 285 V315 C2740 347 2740 347 2740 379 V391" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="shortest:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2695.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="2740" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M2660 541 V553 C2660 585 2376 585 2376 617 V629"/><path d="M2376 667 V679 C2376 711 2376 711 2376 743 V755" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="2336" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="2376" y="652">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2740 541 V553 C2740 585 2727 585 2727 617 V629"/><path d="M2727 667 V679 C2727 711 2686.667 711 2686.667 743 V755" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="2687" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="2727" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2820 541 V553 C2820 585 2855.5 585 2855.5 617 V629"/><path d="M2855.5 667 V679 C2855.5 711 2793.333 711 2793.333 743 V755" marker-end="url(#arrow-graphs-rooted-tree-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2811" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="2855.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="shortest"><rect x="1306" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="1322" y="52">質問</text><text class="node-title" x="1322" y="80">頂点・辺について何を求めますか？</text><text class="node-explanation" x="1322" y="107">最短距離だけでなく、負閉路、順序、連結性、木の集</text><text class="node-explanation" x="1322" y="125">計を区別します。</text></g><g class="flow-node question" data-node="check"><rect x="2580" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="2596" y="411">質問</text><text class="node-title" x="2596" y="439">木・閉路のない一方通行のグラフ・そ</text><text class="node-title" x="2596" y="462">の他を、制約から区別できますか？</text><text class="node-explanation" x="2596" y="489">辺数だけで木や DAG を断定せず、連結性と閉路</text><text class="node-explanation" x="2596" y="507">も確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="2580" y="755" width="320" height="139" rx="7"/><text class="node-kind" x="2596" y="775">分野</text><text class="node-title" x="2596" y="803">条件を確かめる</text><text class="node-explanation" x="2596" y="830">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="2596" y="858">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="tree-query-route"><rect x="32" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">木の祖先・部分木・経路</text><a href="/flowchartcp/flowcharts/#diagram-tree-query" data-route="tree-query"><text x="48" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="tree-dp-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">木の子からまとめる答え</text><a href="/flowchartcp/flowcharts/#diagram-tree-dp" data-route="tree-dp"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="2216" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="2232" y="775">候補</text><text class="node-title" x="2232" y="803">頂点・辺の意味を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="2232" y="842">状態の設計</text></a><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="2232" y="866">グラフへの帰着</text></a></g><g class="flow-node route" data-node="forest-trigger-route"><rect x="760" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">葉から始まる連鎖の得点</text><a href="/flowchartcp/flowcharts/#diagram-forest-trigger" data-route="forest-trigger"><text x="776" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="path-black-route"><rect x="1124" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">少数の経路に黒い辺が必要な色付け</text><a href="/flowchartcp/flowcharts/#diagram-tree-path-black-constraints" data-route="tree-path-black-constraints"><text x="1140" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="root-path-lis-route"><rect x="1488" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">根から各頂点までの経路で、値が厳密</text><text class="node-title" x="1504" y="462">に増加する部分列の最長長</text><a href="/flowchartcp/flowcharts/#diagram-tree-root-path-lis-conditions" data-route="tree-root-path-lis-conditions"><text x="1504" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="increasing-labels-route"><rect x="1852" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="411">分野</text><text class="node-title" x="1868" y="439">親が子より先になる頂点の選び順を、</text><text class="node-title" x="1868" y="462">全ての始点で数える</text><a href="/flowchartcp/flowcharts/#diagram-tree-increasing-labels-conditions" data-route="tree-increasing-labels-conditions"><text x="1868" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="tree-color-union-route"><rect x="2216" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="2232" y="411">分野</text><text class="node-title" x="2232" y="439">木の色を丸ごと併合し、一色の全頂点</text><text class="node-title" x="2232" y="462">を連結にする</text><a href="/flowchartcp/flowcharts/#diagram-tree-color-closure-conditions" data-route="tree-color-closure-conditions"><text x="2232" y="499">詳細の質問・図へ →</text></a></g></svg>