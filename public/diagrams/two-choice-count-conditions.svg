<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-two-choice-count-conditions flow-desc-two-choice-count-conditions" width="748" height="1329" viewBox="0 0 748 1329" data-flow-svg="two-choice-count-conditions"><title id="flow-title-two-choice-count-conditions">二候補の順序と使用回数の解法フローチャート</title><desc id="flow-desc-two-choice-count-conditions">操作の条件と、求める答えの形式を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-two-choice-count-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="two-options:yes:ordered-count"><title>はい</title><path d="M464.5 164 V176 C464.5 208 419 208 419 240 V252"/><path d="M419 290 V302 C419 334 432.5 334 432.5 366 V378" marker-end="url(#arrow-two-choice-count-conditions)"/><g class="flow-edge-label" data-edge-label="two-options:yes:ordered-count" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="275">はい</text></g></g><g class="flow-edge no" data-edge="two-options:no:check"><title>いいえ</title><path d="M544.5 164 V176 C544.5 208 543 208 543 240 V252"/><path d="M543 290 V302 C543 334 654 334 654 366 V378 V540 C654 572 654 572 654 604 V616 V666 C654 698 654 698 654 730 V742 V927 C654 959 654 959 654 991 V1003 V1053 C654 1085 624.571 1085 624.571 1117 V1129" marker-end="url(#arrow-two-choice-count-conditions)"/><g class="flow-edge-label" data-edge-label="two-options:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="252" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="275">いいえ</text></g></g><g class="flow-edge unknown" data-edge="two-options:unknown:check"><title>わからない</title><path d="M624.5 164 V176 C624.5 208 671.5 208 671.5 240 V252"/><path d="M671.5 290 V302 C671.5 334 710 334 710 366 V378 V540 C710 572