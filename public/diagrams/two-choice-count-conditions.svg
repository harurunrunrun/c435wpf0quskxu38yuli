ext-anchor="middle" x="559.5" y="639">わからない</text></g></g><g class="flow-edge yes" data-edge="length:yes:result"><title>はい</title><path d="M239.5 915 V927 C239.5 959 192 959 192 991 V1003"/><path d="M192 1041 V1053 C192 1085 192 1085 192 1117 V1129" marker-end="url(#arrow-two-choice-count-conditions)"/><g class="flow-edge-label" data-edge-label="length:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1003" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1026">はい</text></g></g><g class="flow-edge no" data-edge="length:no:check"><title>いいえ</title><path d="M319.5 915 V927 C319.5 959 319 959 319 991 V1003"/><path d="M319 1041 V1053 C319 1085 441.714 1085 441.714 1117 V1129" marker-end="url(#arrow-two-choice-count-conditions)"/><g class="flow-edge-label" data-edge-label="length:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1003" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1026">いいえ</text></g></g><g class="flow-edge unknown" data-edge="length:unknown:check"><title>わからない</title><path d="M399.5 915 V927 C399.5 959 447.5 959 447.5 991 V1003"/><path d="M447.5 1041 V1053 C447.5 1085 487.429 1085 487.429 1117 V1129" marker-end="url(#arrow-two-choice-count-conditions)"/><g class="flow-edge-label" data-edge-label="length:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1003" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1026">わからない</text></g></g><g class="flow-node question" data-node="two-options"><rect x="384.5" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">各位置の固定された二つの値から一つ</text><text class="node-title" x="400.5" y="103">ずつ選び、位置の順序を保ちますか？</text><text class="node-explanation" x="400.5" y="130">同じ値でもAから選ぶかBから選ぶかを区別します。</text></g><g class="flow-node question" data-node="ordered-count"><rect x="272.5" y="378" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="398">質問</text><text class="node-title" x="288.5" y="426">選んだ値が非減少で、AをちょうどK</text><text class="node-title" x="288.5" y="449">回使う選択列を一つ求めますか？</text><text class="node-explanation" x="288.5" y="476">追加の選択制限や選択列の個数を数える条件がある場</text><text class="node-explanation" x="288.5" y="494">合は、その情報も状態に必要です。</text></g><g class="flow-node question" data-node="length"><rect x="159.5" y="742" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="762">質問</text><text class="node-title" x="175.5" y="790">位置数は100万以下で、0≤K≤位</text><text class="node-title" x="175.5" y="813">置数、値は符号付き64ビット整数に</text><text class="node-title" x="175.5" y="836">収まりますか？</text><text class="node-explanation" x="175.5" y="863">可否だけなら直前の区間だけ、復元するなら各位置の</text><text class="node-explanation" x="175.5" y="881">区間を保存できます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1129" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1149">候補</text><text class="node-title" x="48" y="1177">終端ごとの到達可能な使用数を整数区</text><text class="node-title" x="48" y="1200">間で持ち、後ろから選択を戻す</text><a href="/flowchartcp/techniques/two-choice-nondecreasing-count-interval-reconstruction/"><title>二択で非減少な列を作るとき、選んだ個数を区間で持つの記事へ</title><text x="48" y="1239">二択で非減少な列を作るとき、選んだ個数を区間で</text><text x="48" y="1257">持つ</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1129" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1149">分野</text><text class="node-title" x="412" y="1177">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1214">詳細の質問・図へ →</text></a></g></svg>