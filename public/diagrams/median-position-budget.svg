"M450 1090 V1102 C450 1134 384 1134 384 1166 V1178" marker-end="url(#arrow-median-position-budget)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1075">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 928 V976 C668 1008 655 1008 655 1040 V1052"/><path d="M655 1090 V1102 C655 1134 614.667 1134 614.667 1166 V1178" marker-end="url(#arrow-median-position-budget)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1075">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 928 V976 C748 1008 783.5 1008 783.5 1040 V1052"/><path d="M783.5 1090 V1102 C783.5 1134 721.333 1134 721.333 1166 V1178" marker-end="url(#arrow-median-position-budget)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1052" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1075">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="459.7222222222223" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">選んだ各対象を共通の位置へ集め、費</text><text class="node-title" x="475.7222222222223" y="103">用は距離の絶対値の総和ですか？</text><text class="node-explanation" x="475.7222222222223" y="130">全ての対象の重みは同じで、移動先は自由に選べま</text><text class="node-explanation" x="475.7222222222223" y="148">す。対象の重みが違う場合は、普通の中央値の式をそ</text><text class="node-explanation" x="475.7222222222223" y="166">のまま使いません。</text></g><g class="flow-node question" data-node="order"><rect x="260.6666666666667" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="434">質問</text><text class="node-title" x="276.6666666666667" y="462">元の位置の順に並べてよく、予算は非</text><text class="node-title" x="276.6666666666667" y="485">負ですか？</text><text class="node-explanation" x="276.6666666666667" y="512">最適な対象は位置の連続区間として選べます。中央値</text><text class="node-explanation" x="276.6666666666667" y="530">までの費用は位置の累積和から求めます。重複位置も</text><text class="node-explanation" x="276.6666666666667" y="548">許します。</text></g><g class="flow-node result" data-node="median-result"><rect x="32" y="796" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="816">候補</text><text class="node-title" x="48" y="844">中央値までの距離の和を累積和で求</text><text class="node-title" x="48" y="867">め、予算内の連続区間を伸ばす</text><a href="/flowchartcp/techniques/median-window-budget/"><title>一次元で同じ重さの対象を集めるなら、中央値への費用を区間和で求めて窓を動かすの記事へ</title><text x="48" y="906">一次元で同じ重さの対象を集めるなら、中央値への</text><text x="48" y="924">費用を区間和で求めて窓を動かす</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="796" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="816">質問</text><text class="node-title" x="524" y="844">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="867">確認できますか？</text><text class="node-explanation" x="524" y="894">操作の順序、更新する値、求める量を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1178" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1198">候補</text><text class="node-title" x="160" y="1226">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1265">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1289">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1178" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1198">分野</text><text class="node-title" x="524" y="1226">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1263">詳細の質問・図へ →</text></a></g></svg>