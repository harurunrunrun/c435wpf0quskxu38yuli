low-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M581.167 969 V981 C581.167 1013 755.5 1013 755.5 1045 V1057"/><path d="M755.5 1095 V1107 C755.5 1139 840 1139 840 1171 V1183" marker-end="url(#arrow-palindrome-erasure-sequence)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1080">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1333 V1363 C840 1395 783 1395 783 1427 V1439"/><path d="M783 1477 V1489 C783 1521 828.5 1521 828.5 1553 V1565" marker-end="url(#arrow-palindrome-erasure-sequence)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1462">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1333 V1363 C920 1395 907 1395 907 1427 V1439"/><path d="M907 1477 V1489 C907 1521 908.5 1521 908.5 1553 V1565" marker-end="url(#arrow-palindrome-erasure-sequence)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1462">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1333 V1363 C1000 1395 1035.5 1395 1035.5 1427 V1439"/><path d="M1035.5 1477 V1489 C1035.5 1521 988.5 1521 988.5 1553 V1565" marker-end="url(#arrow-palindrome-erasure-sequence)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1439" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1462">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="503.75" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="519.75" y="52">質問</text><text class="node-title" x="519.75" y="80">一回で削除できる列は、どの形です</text><text class="node-title" x="519.75" y="103">か？</text><text class="node-explanation" x="519.75" y="130">回文の削除と同色区間の削除、削除後の詰め方を区別</text><text class="node-explanation" x="519.75" y="148">します。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="558.5555555555557" y="434">質問</text><text class="node-title" x="558.5555555555557" y="462">削除した後、左右の残りは詰めて連結</text><text class="node-title" x="558.5555555555557" y="485">されますか？</text><text class="node-explanation" x="558.5555555555557" y="512">元の列で隣接していなくても、内側を消すと両端が隣</text><text class="node-explanation" x="558.5555555555557" y="530">り合います。固定した空白を残すモデルとは異なりま</text><text class="node-explanation" x="558.5555555555557" y="548">す。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="796" width="320" height="173" rx="7"/><text class="node-kind" x="357.1666666666667" y="816">質問</text><text class="node-title" x="357.1666666666667" y="844">両端の値が同じなら、非空の内側を最</text><text class="node-title" x="357.1666666666667" y="867">後に消す回文へ両端を付けられます</text><text class="node-title" x="357.1666666666667" y="890">か？</text><text class="node-explanation" x="357.1666666666667" y="917">内側が空の隣接した二文字は、削除を一回必要としま</text><text class="node-explanation" x="357.1666666666667" y="935">す。異なる両端や途中の分割も比べます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">同色の両端を、内側の最後の削除に付</text><text class="node-title" x="48" y="1254">けて一緒に消す</text><a href="/flowchartcp/techniques/palindrome-erasure-boundary/"><title>連続回文を消す最少回数は、同色の両端を内側の最後の削除に加えるの記事へ</title><text x="48" y="1293">連続回文を消す最少回数は、同色の両端を内側の最</text><text x="48" y="1311">後の削除に加える</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1203">候補</text><text class="node-title" x="412" y="1231">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1270">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1294">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1183" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1203">質問</text><text class="node-title" x="776" y="1231">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1254">書き出せますか？</text><text class="node-explanation" x="776" y="1281">回文の削除と同色区間の削除、削除後の詰め方を区別</text><text class="node-explanation" x="776" y="1299">します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1565" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1585">分野</text><text class="node-title" x="764.5" y="1613">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1650">詳細の質問・図へ →</text></a></g></svg>