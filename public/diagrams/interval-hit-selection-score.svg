<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-interval-hit-selection-score flow-desc-interval-hit-selection-score" width="1112" height="1759" viewBox="0 0 1112 1759" data-flow-svg="interval-hit-selection-score"><title id="flow-title-interval-hit-selection-score">右端順に区間を処理し、最後の選択位置へ報酬を足すの解法フローチャート</title><desc id="flow-desc-interval-hit-selection-score">区間内に一つあればよい条件と、報酬の回数・符号を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-interval-hit-selection-score" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge hit-once" data-edge="model:hit-once:goal"><title>区間内に選択位置が一つ以上あれば、一度だけ受け取る</title><path d="M564.5 182 V194 C564.5 226 246.5 226 246.5 258 V270"/><path d="M246.5 326 V338 C246.5 370 702.556 370 702.556 402 V414" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="model:hit-once:goal" tabindex="0" role="group" aria-label="選択肢：区間内に選択位置が一つ以上あれば、一度だけ受け取る"><rect x="124" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="246.5" y="293">区間内に選択位置が一つ以上あれば、</text><text text-anchor="middle" x="246.5" y="311">一度だけ受け取る</text></g></g><g class="flow-edge per-selected" data-edge="model:per-selected:fallback"><title>区間内の選択位置一つにつき受け取る</title><path d="M628.5 182 V194 C628.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 308 V338 C535.5 370 962 370 962 402 V414 V617 C962 649 962 649 962 681 V693 V743 C962 775 962 775 962 807 V819 V1022 C962 1054 962 1054 962 1086 V1098 V1148 C962 1180 588 1180 588 1212 V1224" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="model:per-selected:fallback" tabindex="0" role="group" aria-label="選択肢：区間内の選択位置一つにつき受け取る"><rect x="413" y="270" width="245" height="38" rx="5"/><text text-anchor="middle" x="535.5" y="293">区間内の選択位置一つにつき受け取る</text></g></g><g class="flow-edge all-selected" data-edge="model:all-selected:fallback"><title>区間の全位置を選んだときだけ受け取る</title><path d="M692.5 182 V194 C692.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V617 C1018 649 1018 649 1018 681 V693 V743 C1018 775 1018 775 1018 807 V819 V1022 C1018 1054 1018 1054 1018 1086 V1098 V1148 C1018 1180 652 1180 652 1212 V1224" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="model:all-selected:fallback" tabindex="0" role="group" aria-label="選択肢：区間の全位置を選んだときだけ受け取る"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">区間の全位置を選んだときだけ受け取</text><text text-anchor="middle" x="824.5" y="311">る</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M756.5 182 V194 C756.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V617 C1074 649 1074 649 1074 681 V693 V743 C1074 775 1074 775 1074 807 V819 V1022 C1074 1054 1074 1054 1074 1086 V1098 V1148 C1074 1180 1000 1180 1000 1212 V1224" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="goal:yes:guard"><title>はい</title><path d="M622.556 605 V617 C622.556 649 501.167 649 501.167 681 V693"/><path d="M501.167 731 V743 C501.167 775 501.167 775 501.167 807 V819" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="goal:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="461.1666666666667" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="501.1666666666667" y="716">はい</text></g></g><g class="flow-edge no" data-edge="goal:no:fallback"><title>いいえ</title><path d="M702.556 605 V617 C702.556 649 739 649 739 681 V693"/><path d="M739 731 V743 C739 775 850 775 850 807 V819 V1022 C850 1054 850 1054 850 1086 V1098 V1148 C850 1180 524 1180 524 1212 V1224" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="goal:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="699" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="739" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M782.556 605 V617 C782.556 649 867.5 649 867.5 681 V693"/><path d="M867.5 731 V743 C867.5 775 906 775 906 807 V819 V1022 C906 1054 906 1054 906 1086 V1098 V1148 C906 1180 920 1180 920 1212 V1224" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="823" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="867.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M421.167 1010 V1022 C421.167 1054 192 1054 192 1086 V1098"/><path d="M192 1136 V1148 C192 1180 192 1180 192 1212 V1224" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1121">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M501.167 1010 V1022 C501.167 1054 556 1054 556 1086 V1098"/><path d="M556 1136 V1148 C556 1180 460 1180 460 1212 V1224" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1121">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M581.167 1010 V1022 C581.167 1054 755.5 1054 755.5 1086 V1098"/><path d="M755.5 1136 V1148 C755.5 1180 840 1180 840 1212 V1224" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1098" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1121">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1374 V1404 C840 1436 783 1436 783 1468 V1480"/><path d="M783 1518 V1530 C783 1562 828.5 1562 828.5 1594 V1606" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1480" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1503">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1374 V1404 C920 1436 907 1436 907 1468 V1480"/><path d="M907 1518 V1530 C907 1562 908.5 1562 908.5 1594 V1606" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1480" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1503">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1374 V1404 C1000 1436 1035.5 1436 1035.5 1468 V1480"/><path d="M1035.5 1518 V1530 C1035.5 1562 988.5 1562 988.5 1594 V1606" marker-end="url(#arrow-interval-hit-selection-score)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1480" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1503">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="500.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="516.5" y="52">質問</text><text class="node-title" x="516.5" y="80">区間の報酬は、どの選択で受け取れま</text><text class="node-title" x="516.5" y="103">すか？</text><text class="node-explanation" x="516.5" y="130">区間内に一つあればよい条件と、報酬の回数・符号を</text><text class="node-explanation" x="516.5" y="148">確認します。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="558.5555555555557" y="434">質問</text><text class="node-title" x="558.5555555555557" y="462">各位置を 0/1 で自由に選び、区</text><text class="node-title" x="558.5555555555557" y="485">間の報酬は負の値も含めて足します</text><text class="node-title" x="558.5555555555557" y="508">か？</text><text class="node-explanation" x="558.5555555555557" y="535">空選択も許し、区間を一つ満たすと報酬を一度だけ受</text><text class="node-explanation" x="558.5555555555557" y="553">け取ります。負の報酬があるため、単に全ての位置を</text><text class="node-explanation" x="558.5555555555557" y="571">選ぶとは限りません。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="819" width="320" height="191" rx="7"/><text class="node-kind" x="357.1666666666667" y="839">質問</text><text class="node-title" x="357.1666666666667" y="867">右端 r まで進んだ時、区間 </text><text class="node-title" x="357.1666666666667" y="890">[l,r] の成立を最後の選択位置</text><text class="node-title" x="357.1666666666667" y="913">が l 以上かで判定できますか？</text><text class="node-explanation" x="357.1666666666667" y="940">新しく r を選ぶ状態は、既存状態の最大値から作</text><text class="node-explanation" x="357.1666666666667" y="958">ります。その後、右端 r の各報酬を候補位置 </text><text class="node-explanation" x="357.1666666666667" y="976">[l,r] に一括で足します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1224" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1244">候補</text><text class="node-title" x="48" y="1272">右端順に区間を処理し、最後の選択位</text><text class="node-title" x="48" y="1295">置へ報酬を足す</text><a href="/flowchartcp/techniques/interval-hit-last-selected/"><title>一つでも選ぶと区間得点が付くなら、最後の選択位置だけで満たした条件を判定するの記事へ</title><text x="48" y="1334">一つでも選ぶと区間得点が付くなら、最後の選択位</text><text x="48" y="1352">置だけで満たした条件を判定する</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1224" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1244">候補</text><text class="node-title" x="412" y="1272">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1311">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1335">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1224" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1244">質問</text><text class="node-title" x="776" y="1272">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1295">書き出せますか？</text><text class="node-explanation" x="776" y="1322">区間内に一つあればよい条件と、報酬の回数・符号を</text><text class="node-explanation" x="776" y="1340">確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1606" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1626">分野</text><text class="node-title" x="764.5" y="1654">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1691">詳細の質問・図へ →</text></a></g></svg>