<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-connected-group-goals flow-desc-tree-connected-group-goals" width="1168" height="1648" viewBox="0 0 1168 1648" data-flow-svg="tree-connected-group-goals"><title id="flow-title-tree-connected-group-goals">部分木・連結集合・切断後の成分の解法フローチャート</title><desc id="flow-desc-tree-connected-group-goals">部分木の頻度表、各成分の印、連結集合の値の範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-connected-group-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="merge:yes:small"><title>はい</title><path d="M112 523 V535 C112 567 192 567 192 599 V611"/><path d="M192 649 V661 C192 693 192 693 192 725 V737" marker-end="url(#arrow-tree-connected-group-goals)"/><g class="flow-edge-label" data-edge-label="merge:yes:small" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="634">はい</text></g></g><g class="flow-edge no" data-edge="merge:no:pairs"><title>いいえ</title><path d="M192 523 V535 C192 567 743.833 567 743.833 599 V611"/><path d="M743.833 649 V661 C743.833 693 743.833 693 743.833 725 V737" marker-end="url(#arrow-tree-connected-group-goals)"/><g class="flow-edge-label" data-edge-label="merge:no:pairs" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="703.8333333333334" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="743.8333333333334" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="merge:unknown:check"><title>わからない</title><path d="M272 523 V535 C272 567 1035.5 567 1035.5 599 V611"/><path d="M1035.5 649 V661 C1035.5 693 1074 693 1074 725 V737 V899 C1074 931 1074 931 1074 963 V975 V1025 C1074 1057 1074 1057 1074 1089 V1101 V1263 C1074 1295 1074 1295 1074 1327 V1339 V1389 C1074 1421 1008 1421 1008 1453 V146