 1453 V1465" marker-end="url(#arrow-tree-connected-group-goals)"/><g class="flow-edge-label" data-edge-label="history:yes:tree-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="1339" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="1362">はい</text></g></g><g class="flow-edge no" data-edge="history:no:fallback"><title>いいえ</title><path d="M808 1251 V1263 C808 1295 612 1295 612 1327 V1339"/><path d="M612 1377 V1389 C612 1421 612 1421 612 1453 V1465" marker-end="url(#arrow-tree-connected-group-goals)"/><g class="flow-edge-label" data-edge-label="history:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="1339" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="1362">いいえ</text></g></g><g class="flow-edge unknown" data-edge="history:unknown:check"><title>わからない</title><path d="M888 1251 V1263 C888 1295 923.5 1295 923.5 1327 V1339"/><path d="M923.5 1377 V1389 C923.5 1421 880 1421 880 1453 V1465" marker-end="url(#arrow-tree-connected-group-goals)"/><g class="flow-edge-label" data-edge-label="history:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="1339" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="1362">わからない</text></g></g><g class="flow-edge sets" data-edge="tree-objective:sets:merge"><title>各部分木の集合や頻度表</title><path d="M584 141 V153 C584 185 192 185 192 217 V229"/><path d="M192 267 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-tree-connected-group-goals)"/><g class="flow-edge-label" data-edge-label="tree-objective:sets:merge" tabindex="0" role="group" aria-label="選択肢：各部分木の集合や頻度表"><rect x="108.5" y="229" width="167" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">各部分木の集合や頻度表</text></g></g><g class="flow-edge one-mark-components" data-edge="tree-objective:one-mark-components:marked-components-route"><title>木を切り、各成分の印が一つになる辺集合を数える</title><path d="M648 141 V153 C648 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-tree-connected-group-goals)"/><g class="flow-edge-label" data-edge-label="tree-objective:one-mark-components:marked-components-route" tabindex="0" role="group" aria-label="選択肢：木を切り、各成分の印が一つになる辺集合を数える"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">木を切り、各成分の印が一つになる辺</text><text text-anchor="middle" x="556" y="270">集合を数える</text></g></g><g class="flow-edge connected-value-range" data-edge="tree-objective:connected-value-range:connected-range-route"><title>最大値−最小値が上限以下になる、非空の連結した頂点集合の個数</title><path d="M712 141 V153 C712 185 880.5 185 880.5 217 V229"/><path d="M880.5 285 V297 C880.5 329 920 329 920 361 V373" marker-end="url(#arrow-tree-connected-group-goals)"/><g class="flow-edge-label" data-edge-label="tree-objective:connected-value-range:connected-range-route" tabindex="0" role="group" aria-label="選択肢：最大値−最小値が上限以下になる、非空の連結した頂点集合の個数"><rect x="758" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="880.5" y="252">最大値−最小値が上限以下になる、非</text><text text-anchor="middle" x="880.5" y="270">空の連結した頂点集合の個数</text></g></g><g class="flow-edge unknown" data-edge="tree-objective:unknown:check"><title>わからない</title><path d="M776 141 V153 C776 185 1091.5 185 1091.5 217 V229"/><path d="M1091.5 267 V297 C1091.5 329 1130 329 1130 361 V373 V535 C1130 567 1130 567 1130 599 V611 V661 C1130 693 1130 693 1130 725 V737 V899 C1130 931 1130 931 1130 963 V975 V1025 C1130 1057 1130 1057 1130 1089 V1101 V1263 C1130 1295 1130 1295 1130 1327 V1339 V1389 C1130 1421 1072 1421 1072 1453 V1465" marker-end="url(#arrow-tree-connected-group-goals)"/><g class="flow-edge-label" data-edge-label="tree-objective:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="252">わからない</text></g></g><g class="flow-node question" data-node="merge"><rect x="32" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="393">質問</text><text class="node-title" x="48" y="421">部分木の色や値の頻度表を保持します</text><text class="node-title" x="48" y="444">か？</text><text class="node-explanation" x="48" y="471">単一の値でなく、集合や辞書を子から併合する場合で</text><text class="node-explanation" x="48" y="489">す。</text></g><g class="flow-node question" data-node="pairs"><rect x="583.8333333333334" y="737" width="320" height="150" rx="7"/><text class="node-kind" x="599.8333333333334" y="757">質問</text><text class="node-title" x="599.8333333333334" y="785">二頂点の距離など、別の子の頂点同士</text><text class="node-title" x="599.8333333333334" y="808">を組にしますか？</text><text class="node-explanation" x="599.8333333333334" y="835">最小共通祖先や重心を経由する組として数える方法を</text><text class="node-explanation" x="599.8333333333334" y="853">考えます。</text></g><g class="flow-node question" data-node="history"><rect x="648" y="1101" width="320" height="150" rx="7"/><text class="node-kind" x="664" y="1121">質問</text><text class="node-title" x="664" y="1149">親へ返す状態は、子の並べ方に依存し</text><text class="node-title" x="664" y="1172">ませんか？</text><text class="node-explanation" x="664" y="1199">交換可能な子なら対称性を使えます。順序付きの木な</text><text class="node-explanation" x="664" y="1217">ら順序を保持します。</text></g><g class="flow-node route" data-node="check"><rect x="816" y="1465" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="1485">分野</text><text class="node-title" x="832" y="1513">一辺を切った片側から伝える情報</text><a href="/flowchartcp/flowcharts/#diagram-tree-cut-side-information" data-route="tree-cut-side-information"><text x="832" y="1550">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="tree-result"><rect x="88" y="1465" width="320" height="127" rx="7"/><text class="node-kind" x="104" y="1485">候補</text><text class="node-title" x="104" y="1513">木 DP</text><a href="/flowchartcp/techniques/tree-dp/"><title>木DPの記事へ</title><text x="104" y="1552">木DP</text></a></g><g class="flow-node result" data-node="small"><rect x="32" y="737" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="757">候補</text><text class="node-title" x="48" y="785">部分木の表を小さい方から併合する</text><a href="/flowchartcp/techniques/small-to-large/"><title>マージテクの記事へ</title><text x="48" y="824">マージテク</text></a></g><g class="flow-node route" data-node="centroid"><rect x="284" y="1101" width="320" height="121" rx="7"/><text class="node-kind" x="300" y="1121">分野</text><text class="node-title" x="300" y="1149">二頂点の経路の長さと求める量</text><a href="/flowchartcp/flowcharts/#diagram-tree-pair-distance" data-route="tree-pair-distance"><text x="300" y="1186">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="452" y="1465" width="320" height="151" rx="7"/><text class="node-kind" x="468" y="1485">候補</text><text class="node-title" x="468" y="1513">辺をまたぐ状態を設計する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="468" y="1552">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="468" y="1576">反例探し</text></a></g><g class="flow-node question" data-node="tree-objective"><rect x="520" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="536" y="52">質問</text><text class="node-title" x="536" y="80">木から求める答えはどれですか？</text><text class="node-explanation" x="536" y="107">全体の最適値と、個数別・頂点別の答えを分けます。</text></g><g class="flow-node route" data-node="marked-components-route"><rect x="396" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">各成分に一つの印を残す木の切断</text><a href="/flowchartcp/flowcharts/#diagram-tree-marked-components" data-route="tree-marked-components"><text x="412" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="connected-range-route"><rect x="760" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">値の幅が小さい木の連結集合</text><a href="/flowchartcp/flowcharts/#diagram-tree-connected-value-range" data-route="tree-connected-value-range"><text x="776" y="458">詳細の質問・図へ →</text></a></g></svg>