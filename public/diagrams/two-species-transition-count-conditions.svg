<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-two-species-transition-count-conditions flow-desc-two-species-transition-count-conditions" width="748" height="1383" viewBox="0 0 748 1383" data-flow-svg="two-species-transition-count-conditions"><title id="flow-title-two-species-transition-count-conditions">隣接する種類の変化回数を使う質問の解法フローチャート</title><desc id="flow-desc-two-species-transition-count-conditions">返答や追加規則の意味と、対象の範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-two-species-transition-count-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="two-species-anchor:yes:distinct-transition-count"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-two-species-transition-count-conditions)"/><g class="flow-edge-label" data-edge-label="two-species-anchor:yes:distinct-transition-count" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="two-species-anchor:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V576 C654 608 654 608 654 640 V652 V702 C654 734 654 734 654 766 V778 V981 C654 1013 654 1013 654 1045 V1057 V1107 C654 1139 624.571 1139 624.571 1171 V1183" marker-end="url(#arrow-two-species-transition-count-conditions)"/><g class="flow-edge-label" data-edge-label="two-species-anchor:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="two-species-anchor:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V576 C710 608 710 608 710 640 V652 V702 C710 734 710 734 710 766 V778 V981 C710 1013 710 1013 710 1045 V1057 V1107 C710 1139 670.286 1139 670.286 1171 V1183" marker-end="url(#arrow-two-species-transition-count-conditions)"/><g class="flow-edge-label" data-edge-label="two-species-anchor:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="distinct-transition-count:yes:budget"><title>はい</title><path d="M352.5 564 V576 C352.5 608 307 608 307 640 V652"/><path d="M307 690 V702 C307 734 319.5 734 319.5 766 V778" marker-end="url(#arrow-two-species-transition-count-conditions)"/><g class="flow-edge-label" data-edge-label="distinct-transition-count:yes:budget" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="675">はい</text></g></g><g class="flow-edge no" data-edge="distinct-transition-count:no:check"><title>いいえ</title><path d="M432.5 564 V576 C432.5 608 431 608 431 640 V652"/><path d="M431 690 V702 C431 734 542 734 542 766 V778 V981 C542 1013 542 1013 542 1045 V1057 V1107 C542 1139 533.143 1139 533.143 1171 V1183" marker-end="url(#arrow-two-species-transition-count-conditions)"/><g class="flow-edge-label" data-edge-label="distinct-transition-count:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="distinct-transition-count:unknown:check"><title>わからない</title><path d="M512.5 564 V576 C512.5 608 559.5 608 559.5 640 V652"/><path d="M559.5 690 V702 C559.5 734 598 734 598 766 V778 V981 C598 1013 598 1013 598 1045 V1057 V1107 C598 1139 578.857 1139 578.857 1171 V1183" marker-end="url(#arrow-two-species-transition-count-conditions)"/><g class="flow-edge-label" data-edge-label="distinct-transition-count:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="budget:yes:result"><title>はい</title><path d="M239.5 969 V981 C239.5 1013 192 1013 192 1045 V1057"/><path d="M192 1095 V1107 C192 1139 192 1139 192 1171 V1183" marker-end="url(#arrow-two-species-transition-count-conditions)"/><g class="flow-edge-label" data-edge-label="budget:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="budget:no:check"><title>いいえ</title><path d="M319.5 969 V981 C319.5 1013 319 1013 319 1045 V1057"/><path d="M319 1095 V1107 C319 1139 441.714 1139 441.714 1171 V1183" marker-end="url(#arrow-two-species-transition-count-conditions)"/><g class="flow-edge-label" data-edge-label="budget:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="budget:unknown:check"><title>わからない</title><path d="M399.5 969 V981 C399.5 1013 447.5 1013 447.5 1045 V1057"/><path d="M447.5 1095 V1107 C447.5 1139 487.429 1139 487.429 1171 V1183" marker-end="url(#arrow-two-species-transition-count-conditions)"/><g class="flow-edge-label" data-edge-label="budget:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="two-species-anchor"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">対象は二種類で、一つだけ種類が分</text><text class="node-title" x="400.5" y="103">かっていますか？</text><text class="node-explanation" x="400.5" y="130">0番がAと分かっています。Aの総数を求め、全対象</text><text class="node-explanation" x="400.5" y="148">の種類を一つずつ出力する必要はありません。</text></g><g class="flow-node question" data-node="distinct-transition-count"><rect x="272.5" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">相異なる番号を並べ、隣り合う種類の</text><text class="node-title" x="288.5" y="467">変化回数を質問できますか？</text><text class="node-explanation" x="288.5" y="494">相手が回答を途中で選んでも、過去の全回答と整合す</text><text class="node-explanation" x="288.5" y="512">る配置が残るものとします。一問の中で同じ番号を重</text><text class="node-explanation" x="288.5" y="530">複させません。</text></g><g class="flow-node question" data-node="budget"><rect x="159.5" y="778" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="798">質問</text><text class="node-title" x="175.5" y="826">対象は2万個以下で、226回・総質</text><text class="node-title" x="175.5" y="849">問長10万以内の質問が許されます</text><text class="node-title" x="175.5" y="872">か？</text><text class="node-explanation" x="175.5" y="899">各質問の長さは2以上で、対象数以下です。掲載実装</text><text class="node-explanation" x="175.5" y="917">は全入力で226回以下、総長40306以下を保証</text><text class="node-explanation" x="175.5" y="935">します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">少数の識別から一括計数へ切り替え、</text><text class="node-title" x="48" y="1254">偶奇で次の既知対象も得る</text><a href="/flowchartcp/techniques/interactive-transition-count-species-decision-trees/"><title>隣接する種類の変化回数から、二種類の個数を少ない質問で数えるの記事へ</title><text x="48" y="1293">隣接する種類の変化回数から、二種類の個数を少な</text><text x="48" y="1311">い質問で数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1203">分野</text><text class="node-title" x="412" y="1231">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1268">詳細の質問・図へ →</text></a></g></svg>