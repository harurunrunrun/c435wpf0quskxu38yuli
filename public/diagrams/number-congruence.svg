s" data-edge="check:yes:fallback"><title>はい</title><path d="M969.5 1687 V1717 C969.5 1749 870 1749 870 1781 V1793"/><path d="M870 1831 V1843 C870 1875 780 1875 780 1907 V1919" marker-end="url(#arrow-number-congruence)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="830" y="1793" width="80" height="38" rx="5"/><text text-anchor="middle" x="870" y="1816">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1049.5 1687 V1717 C1049.5 1749 1075 1749 1075 1781 V1793"/><path d="M1075 1831 V1843 C1075 1875 1090.667 1875 1090.667 1907 V1919" marker-end="url(#arrow-number-congruence)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="1793" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="1816">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1129.5 1687 V1717 C1129.5 1749 1203.5 1749 1203.5 1781 V1793"/><path d="M1203.5 1831 V1843 C1203.5 1875 1197.333 1875 1197.333 1907 V1919" marker-end="url(#arrow-number-congruence)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="1793" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="1816">わからない</text></g></g><g class="flow-edge yes" data-edge="period-enumerate:yes:crt-compatible"><title>はい</title><path d="M996.5 559 V571 C996.5 603 951 603 951 635 V647"/><path d="M951 685 V697 C951 729 1029.333 729 1029.333 761 V773" marker-end="url(#arrow-number-congruence)"/><g class="flow-edge-label" data-edge-label="period-enumerate:yes:crt-compatible" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="911" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="951" y="670">はい</text></g></g><g class="flow-edge no" data-edge="period-enumerate:no:fallback"><title>いいえ</title><path d="M1076.5 559 V571 C1076.5 603 1075 603 1075 635 V647"/><path d="M1075 685 V697 C1075 729 1186 729 1186 761 V773 V953 C1186 985 1186 985 1186 1017 V1029 V1079 C1186 1111 1186 1111 1186 1143 V1155 V1335 C1186 1367 1186 1367 1186 1399 V1411 V1461 C1186 1493 1298 1493 1298 1525 V1537 V1717 C1298 1749 1298 1749 1298 1781 V1793 V1843 C1298 1875 860 1875 860 1907 V1919" marker-end="url(#arrow-number-congruence)"/><g class="flow-edge-label" data-edge-label="period-enumerate:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1035" y="647" width="80" height="38" rx="5"/><text text-anchor="middle" x="1075" y="670">いいえ</text></g></g><g class="flow-edge unknown" data-edge="period-enumerate:unknown:check"><title>わからない</title><path d="M1156.5 559 V571 C1156.5 603 1203.5 603 1203.5 635 V647"/><path d="M1203.5 685 V697 C1203.5 729 1242 729 1242 761 V773 V953 C1242 985 1242 985 1242 1017 V1029 V1079 C1242 1111 1242 1111 1242 1143 V1155 V1335 C1242 1367 1242 1367 1242 1399 V1411 V1461 C1242 1493 1102.833 1493 1102.833 1525 V1537" marker-end="url(#arrow-number-congruence)"/><g class="flow-edge-label" data-edge-label="period-enumerate:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1159" y="647" width="89" height="38" rx="5"/><text text-anchor="middle" x="1203.5" y="670">わからない</text></g></g><g class="flow-node question" data-node="form"><rect x="724.5" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="740.5" y="52">質問</text><text class="node-title" x="740.5" y="80">余りの条件はどの形ですか？</text><text class="node-explanation" x="740.5" y="107">逆元が存在するかを先に確認し、法が合成数でも扱い</text><text class="node-explanation" x="740.5" y="125">ます。</text></g><g class="flow-node question" data-node="linear-gcd"><rect x="344.6666666666667" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="360.6666666666667" y="411">質問</text><text class="node-title" x="360.6666666666667" y="439">gcd(a,m) は、指定された </text><text class="node-title" x="360.6666666666667" y="462">b を割り切りますか？</text><text class="node-explanation" x="360.6666666666667" y="489">割り切らないなら解は存在しません。割り切る場合は</text><text class="node-explanation" x="360.6666666666667" y="507"> a,b,m を同じ gcd で割ります。</text></g><g class="flow-node result" data-node="linear-result"><rect x="32" y="773" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="793">候補</text><text class="node-title" x="48" y="821">係数と法の公約数で割り、残った係数</text><text class="node-title" x="48" y="844">の逆元を使う</text><a href="/flowchartcp/techniques/linear-congruence-gcd/"><title>一次合同式は GCD で解の有無を判定してから割るの記事へ</title><text x="48" y="883">一次合同式は GCD で解の有無を判定してから</text><text x="48" y="901">割る</text></a></g><g class="flow-node result" data-node="linear-impossible"><rect x="396" y="773" width="320" height="168" rx="7"/><text class="node-kind" x="412" y="793">候補</text><text class="node-title" x="412" y="821">公約数で割れない余りの条件を、不可</text><text class="node-title" x="412" y="844">能と判定する</text><a href="/flowchartcp/techniques/linear-congruence-gcd/"><title>一次合同式は GCD で解の有無を判定してから割るの記事へ</title><text x="412" y="883">一次合同式は GCD で解の有無を判定してから</text><text x="412" y="901">割る</text></a></g><g class="flow-node question" data-node="crt-compatible"><rect x="816" y="773" width="320" height="150" rx="7"/><text class="node-kind" x="832" y="793">質問</text><text class="node-title" x="832" y="821">二つの余りの差は、二つの法の最大公</text><text class="node-title" x="832" y="844">約数で割り切れますか？</text><text class="node-explanation" x="832" y="871">法が互いに素でなくても、この整合条件を満たせば一</text><text class="node-explanation" x="832" y="889">つの剰余類へ併合できます。</text></g><g class="flow-node question" data-node="crt-overflow"><rect x="396" y="1155" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="1175">質問</text><text class="node-title" x="412" y="1203">併合後の法の最小公倍数を、扱う整数</text><text class="node-title" x="412" y="1226">型に収められますか？</text><text class="node-explanation" x="412" y="1253">法の積を先に計算せず、公約数で割ってから掛けま</text><text class="node-explanation" x="412" y="1271">す。まだ大きい場合は多倍長整数などが必要です。</text></g><g class="flow-node result" data-node="crt-result"><rect x="396" y="1537" width="320" height="168" rx="7"/><text class="node-kind" x="412" y="1557">候補</text><text class="node-title" x="412" y="1585">余りの差の整合性を確認し、公約数を</text><text class="node-title" x="412" y="1608">残して条件を併合する</text><a href="/flowchartcp/techniques/crt-noncoprime/"><title>法が互いに素でない合同式も共通因子を確認して併合するの記事へ</title><text x="412" y="1647">法が互いに素でない合同式も共通因子を確認して併</text><text x="412" y="1665">合する</text></a></g><g class="flow-node result" data-node="crt-impossible"><rect x="760" y="1155" width="320" height="168" rx="7"/><text class="node-kind" x="776" y="1175">候補</text><text class="node-title" x="776" y="1203">同じ公約数について矛盾する余りを、</text><text class="node-title" x="776" y="1226">不可能と判定する</text><a href="/flowchartcp/techniques/crt-noncoprime/"><title>法が互いに素でない合同式も共通因子を確認して併合するの記事へ</title><text x="776" y="1265">法が互いに素でない合同式も共通因子を確認して併</text><text x="776" y="1283">合する</text></a></g><g class="flow-node question" data-node="check"><rect x="889.5" y="1537" width="320" height="150" rx="7"/><text class="node-kind" x="905.5" y="1557">質問</text><text class="node-title" x="905.5" y="1585">入力例から、判定に使う条件を一つず</text><text class="node-title" x="905.5" y="1608">つ確かめられますか？</text><text class="node-explanation" x="905.5" y="1635">どの条件が問題文で保証され、どの条件を証明する必</text><text class="node-explanation" x="905.5" y="1653">要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="620" y="1919" width="320" height="151" rx="7"/><text class="node-kind" x="636" y="1939">候補</text><text class="node-title" x="636" y="1967">必要な条件を小さい例で確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="636" y="2006">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="636" y="2030">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="984" y="1919" width="320" height="121" rx="7"/><text class="node-kind" x="1000" y="1939">分野</text><text class="node-title" x="1000" y="1967">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1000" y="2004">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="period-enumerate"><rect x="916.5" y="391" width="320" height="168" rx="7"/><text class="node-kind" x="932.5" y="411">質問</text><text class="node-title" x="932.5" y="439">各周期の中で有効な余りの候補を、十</text><text class="node-title" x="932.5" y="462">分少数として列挙できますか？</text><text class="node-explanation" x="932.5" y="489">有効区間の幅が小さいなら、二つの余りを一組ずつ選</text><text class="node-explanation" x="932.5" y="507">び、合同式の整合性を調べます。法自体が大きくても</text><text class="node-explanation" x="932.5" y="525">幅の積が小さければ列挙できます。</text></g></svg>