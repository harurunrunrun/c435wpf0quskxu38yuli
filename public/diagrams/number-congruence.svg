<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-number-congruence flow-desc-number-congruence" width="1336" height="2102" viewBox="0 0 1336 2102" data-flow-svg="number-congruence"><title id="flow-title-number-congruence">整数の余りの等式の解法フローチャート</title><desc id="flow-desc-number-congruence">係数や法が互いに素でない場合も、存在条件から判定します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-number-congruence" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge linear" data-edge="form:linear:linear-gcd"><title>a×x の余りを b にする、一つの等式</title><path d="M788.5 159 V171 C788.5 203 470.5 203 470.5 235 V247"/><path d="M470.5 303 V315 C470.5 347 504.667 347 504.667 379 V391" marker-end="url(#arrow-number-congruence)"/><g class="flow-edge-label" data-edge-label="form:linear:linear-gcd" tabindex="0" role="group" aria-label="選択肢：a×x の余りを b にする、一つの等式"><rect x="348" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="470.5" y="270">a×x の余りを b にする、一つ</text><text text-anchor="middle" x="470.5" y="288">の等式</text></g></g><g class="flow-edge several" data-edge="form:several:crt-compatible"><title>異なる法ごとに x の余りを指定する</title><path d="M852.5 159 V171 C852.5 203 759.5 203 759.5 235 V247"/><path d="M759.5 303 V315 C759.5 347 861 347 861 379 V391 V571 C861 603 861 603 861 635 V647 V697 C861 729 922.667 729 922.667 761 V773" marker-end="url(#arrow-number-congruence)"/><g class="flow-edge-label" data-edge-label="form:several:crt-compatible" tabindex="0" role="group" aria-label="選択肢：異なる法ごとに x の余りを指定する"><rect x="637" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="759.5" y="270">異なる法ごとに x の余りを指定す</text><text text-anchor="middle" x="759.5" y="288">る</text></g></g><g class="flow-edge period-windows" data-edge="form:period-windows:period-enumerate"><title>異なる周期の稼働区間が、同時に有効になる時刻</title><path d="M91