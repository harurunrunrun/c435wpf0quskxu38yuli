<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-connectivity-direction-goals flow-desc-connectivity-direction-goals" width="2568" height="944" viewBox="0 0 2568 944" data-flow-svg="connectivity-direction-goals"><title id="flow-title-connectivity-direction-goals">辺の向きと到達性の解法フローチャート</title><desc id="flow-desc-connectivity-direction-goals">一方向にたどれる辺を調べる場合と、無向辺の向きを決める場合を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-connectivity-direction-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge directed" data-edge="operations:directed:directed-purpose"><title>一方通行の辺で、到達先・相互到達・追加する道路を求める</title><path d="M1720.308 141 V153 C1720.308 185 814.875 185 814.875 217 V229"/><path d="M814.875 285 V297 C814.875 329 814.875 329 814.875 361 V373" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="operations:directed:directed-purpose" tabindex="0" role="group" aria-label="選択肢：一方通行の辺で、到達先・相互到達・追加する道路を求める"><rect x="692.375" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="814.875" y="252">一方通行の辺で、到達先・相互到達・</text><text text-anchor="middle" x="814.875" y="270">追加する道路を求める</text></g></g><g class="flow-edge orient-all" data-edge="operations:orient-all:orientation-goal"><title>無向辺の向きを決め、到達性や出次数の条件を満たす</title><path d="M1773.642 141 V153 C1773.642 185 1592 185 1592 217 V229"/><path d="M1592 285 V297 C1592 329 1592 329 1592 361 V373" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="operations:orient-all:orientation-goal" tabindex="0" role="group" aria-label="選択肢：無向辺の向きを決め、到達性や出次数の条件を満たす"><rect x="1469.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1592" y="252">無向辺の向きを決め、到達性や出次数</text><text text-anchor="middle" x="1592" y="270">の条件を満たす</text></g></g><g class="flow-edge tree-reversals" data-edge="operations:tree-reversals:tree-reversals-route"><title>木の一方向の辺を反転し、根から全頂点へ進める費用を全ての根で求める</title><path d="M1826.975 141 V153 C1826.975 185 1956 185 1956 217 V229"/><path d="M1956 285 V297 C1956 329 1956 329 1956 361 V373" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="operations:tree-reversals:tree-reversals-route" tabindex="0" role="group" aria-label="選択肢：木の一方向の辺を反転し、根から全頂点へ進める費用を全ての根で求める"><rect x="1833.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1956" y="252">木の一方向の辺を反転し、根から全頂</text><text text-anchor="middle" x="1956" y="270">点へ進める費用を全ての根で求める</text></g></g><g class="flow-edge reciprocal-closure" data-edge="operations:reciprocal-closure:reciprocal-closure-route"><title>相互に辺がある二頂点への辺を補い、追加ごとに閉包の辺数を数える</title><path d="M1880.308 141 V153 C1880.308 185 2280.5 185 2280.5 217 V229"/><path d="M2280.5 285 V297 C2280.5 329 2320 329 2320 361 V373" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="operations:reciprocal-closure:reciprocal-closure-route" tabindex="0" role="group" aria-label="選択肢：相互に辺がある二頂点への辺を補い、追加ごとに閉包の辺数を数える"><rect x="2158" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="2280.5" y="252">相互に辺がある二頂点への辺を補い、</text><text text-anchor="middle" x="2280.5" y="270">追加ごとに閉包の辺数を数える</text></g></g><g class="flow-edge unknown" data-edge="operations:unknown:check"><title>わからない</title><path d="M1933.642 141 V153 C1933.642 185 2491.5 185 2491.5 217 V229"/><path d="M2491.5 267 V297 C2491.5 329 2530 329 2530 361 V373 V535 C2530 567 2530 567 2530 599 V611 V679 C2530 711 2456 711 2456 743 V755" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="operations:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2447" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="2491.5" y="252">わからない</text></g></g><g class="flow-edge mutual" data-edge="directed-purpose:mutual:scc-result"><title>互いに到達できる頂点を、成分へ分ける</title><path d="M718.875 505 V535 C718.875 567 192 567 192 599 V611"/><path d="M192 667 V679 C192 711 192 711 192 743 V755" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="directed-purpose:mutual:scc-result" tabindex="0" role="group" aria-label="選択肢：互いに到達できる頂点を、成分へ分ける"><rect x="69.5" y="611" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="634">互いに到達できる頂点を、成分へ分け</text><text text-anchor="middle" x="192" y="652">る</text></g></g><g class="flow-edge reachable-counts" data-edge="directed-purpose:reachable-counts:reachable-count-route"><title>各頂点から到達できる頂点の個数</title><path d="M782.875 505 V535 C782.875 567 556 567 556 599 V611"/><path d="M556 649 V679 C556 711 556 711 556 743 V755" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="directed-purpose:reachable-counts:reachable-count-route" tabindex="0" role="group" aria-label="選択肢：各頂点から到達できる頂点の個数"><rect x="446.5" y="611" width="219" height="38" rx="5"/><text text-anchor="middle" x="556" y="634">各頂点から到達できる頂点の個数</text></g></g><g class="flow-edge capital-additions" data-edge="directed-purpose:capital-additions:capital-route"><title>指定した始点から全頂点へ届くように追加する辺数の最小値</title><path d="M846.875 505 V535 C846.875 567 920 567 920 599 V611"/><path d="M920 667 V679 C920 711 920 711 920 743 V755" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="directed-purpose:capital-additions:capital-route" tabindex="0" role="group" aria-label="選択肢：指定した始点から全頂点へ届くように追加する辺数の最小値"><rect x="797.5" y="611" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="634">指定した始点から全頂点へ届くように</text><text text-anchor="middle" x="920" y="652">追加する辺数の最小値</text></g></g><g class="flow-edge unknown" data-edge="directed-purpose:unknown:check"><title>わからない</title><path d="M910.875 505 V535 C910.875 567 1591.5 567 1591.5 599 V611"/><path d="M1591.5 649 V679 C1591.5 711 2296 711 2296 743 V755" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="directed-purpose:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1547" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="1591.5" y="634">わからない</text></g></g><g class="flow-edge strong" data-edge="orientation-goal:strong:orientation-route"><title>どの頂点からも、他の全頂点へ到達できる</title><path d="M1496 523 V535 C1496 567 1802.5 567 1802.5 599 V611"/><path d="M1802.5 667 V679 C1802.5 711 1284 711 1284 743 V755" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="orientation-goal:strong:orientation-route" tabindex="0" role="group" aria-label="選択肢：どの頂点からも、他の全頂点へ到達できる"><rect x="1680" y="611" width="245" height="56" rx="5"/><text text-anchor="middle" x="1802.5" y="634">どの頂点からも、他の全頂点へ到達で</text><text text-anchor="middle" x="1802.5" y="652">きる</text></g></g><g class="flow-edge even-outdegree" data-edge="orientation-goal:even-outdegree:even-orientation-route"><title>全頂点の出次数が偶数</title><path d="M1560 523 V535 C1560 567 2046 567 2046 599 V611"/><path d="M2046 649 V679 C2046 711 1648 711 1648 743 V755" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="orientation-goal:even-outdegree:even-orientation-route" tabindex="0" role="group" aria-label="選択肢：全頂点の出次数が偶数"><rect x="1969" y="611" width="154" height="38" rx="5"/><text text-anchor="middle" x="2046" y="634">全頂点の出次数が偶数</text></g></g><g class="flow-edge other" data-edge="orientation-goal:other:fallback"><title>その他の向きや次数の制約</title><path d="M1624 523 V535 C1624 567 2257 567 2257 599 V611"/><path d="M2257 649 V679 C2257 711 2012 711 2012 743 V755" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="orientation-goal:other:fallback" tabindex="0" role="group" aria-label="選択肢：その他の向きや次数の制約"><rect x="2167" y="611" width="180" height="38" rx="5"/><text text-anchor="middle" x="2257" y="634">その他の向きや次数の制約</text></g></g><g class="flow-edge unknown" data-edge="orientation-goal:unknown:check"><title>わからない</title><path d="M1688 523 V535 C1688 567 2435.5 567 2435.5 599 V611"/><path d="M2435.5 649 V679 C2435.5 711 2376 711 2376 743 V755" marker-end="url(#arrow-connectivity-direction-goals)"/><g class="flow-edge-label" data-edge-label="orientation-goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2391" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="2435.5" y="634">わからない</text></g></g><g class="flow-node question" data-node="operations"><rect x="1666.975" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1682.975" y="52">質問</text><text class="node-title" x="1682.975" y="80">つながりはどのように変わりますか？</text><text class="node-explanation" x="1682.975" y="107">追加、削除、過去の版を区別します。</text></g><g class="flow-node question" data-node="directed-purpose"><rect x="654.875" y="373" width="320" height="132" rx="7"/><text class="node-kind" x="670.875" y="393">質問</text><text class="node-title" x="670.875" y="421">一方通行の辺について、どの答えを求</text><text class="node-title" x="670.875" y="444">めますか？</text><text class="node-explanation" x="670.875" y="471">一方向に届くことと、互いに届くことを区別します。</text></g><g class="flow-node result" data-node="scc-result"><rect x="32" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="48" y="775">候補</text><text class="node-title" x="48" y="803">強連結成分分解</text><a href="/flowchartcp/techniques/scc/"><title>強連結成分分解の記事へ</title><text x="48" y="842">強連結成分分解</text></a></g><g class="flow-node route" data-node="reachable-count-route"><rect x="396" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="775">分野</text><text class="node-title" x="412" y="803">各始点の到達先の重複を除く</text><a href="/flowchartcp/flowcharts/#diagram-dag-reachable-sets" data-route="dag-reachable-sets"><text x="412" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="capital-route"><rect x="760" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="775">分野</text><text class="node-title" x="776" y="803">一つの始点から全体へ届かせる追加辺</text><a href="/flowchartcp/flowcharts/#diagram-capital-added-roads" data-route="capital-added-roads"><text x="776" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="2216" y="755" width="320" height="157" rx="7"/><text class="node-kind" x="2232" y="775">分野</text><text class="node-title" x="2232" y="803">操作と問い合わせの順序を確かめる</text><text class="node-explanation" x="2232" y="830">追加や削除を先に読めるかを確かめ、操作を整理する</text><text class="node-explanation" x="2232" y="848">か、足りない条件を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-operation-order" data-route="connectivity-operation-order"><text x="2232" y="876">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="orientation-goal"><rect x="1432" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="1448" y="393">質問</text><text class="node-title" x="1448" y="421">辺の向き付けで、どの条件を満たしま</text><text class="node-title" x="1448" y="444">すか？</text><text class="node-explanation" x="1448" y="471">頂点間の到達性と、頂点ごとの出次数の偶奇は異なる</text><text class="node-explanation" x="1448" y="489">条件です。</text></g><g class="flow-node route" data-node="orientation-route"><rect x="1124" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="775">分野</text><text class="node-title" x="1140" y="803">無向辺を片方向にする構築</text><a href="/flowchartcp/flowcharts/#diagram-strongly-connected-orientation" data-route="strongly-connected-orientation"><text x="1140" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="even-orientation-route"><rect x="1488" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="775">分野</text><text class="node-title" x="1504" y="803">全頂点の出次数を偶数にする</text><a href="/flowchartcp/flowcharts/#diagram-even-outdegree-edge-directions" data-route="even-outdegree-edge-directions"><text x="1504" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1852" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="1868" y="775">候補</text><text class="node-title" x="1868" y="803">変更する辺と時刻を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1868" y="842">状態の設計</text></a></g><g class="flow-node route" data-node="tree-reversals-route"><rect x="1796" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1812" y="393">分野</text><text class="node-title" x="1812" y="421">木の一方向の辺を反転し、根から全頂</text><text class="node-title" x="1812" y="444">点へ進める費用を全ての根で求める</text><a href="/flowchartcp/flowcharts/#diagram-tree-root-reversal-conditions" data-route="tree-root-reversal-conditions"><text x="1812" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="reciprocal-closure-route"><rect x="2160" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="2176" y="393">分野</text><text class="node-title" x="2176" y="421">相互に辺がある二頂点への辺を補い、</text><text class="node-title" x="2176" y="444">追加ごとに閉包の辺数を数える</text><a href="/flowchartcp/flowcharts/#diagram-reciprocal-closure-conditions" data-route="reciprocal-closure-conditions"><text x="2176" y="481">詳細の質問・図へ →</text></a></g></svg>