<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dp-remaining-history flow-desc-dp-remaining-history" width="1168" height="1308" viewBox="0 0 1168 1308" data-flow-svg="dp-remaining-history"><title id="flow-title-dp-remaining-history">残す履歴と今後の選択の解法フローチャート</title><desc id="flow-desc-dp-remaining-history">二つの履歴が同じ将来の選択と費用になるか、最後の出現だけで足りるかを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dp-remaining-history" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="history:yes:state"><title>はい</title><path d="M504.833 182 V194 C504.833 226 72 226 72 258 V270"/><path d="M72 308 V320 C72 352 38 352 38 384 V396 V558 C38 590 38 590 38 622 V634 V684 C38 716 38 716 38 748 V760 V923 C38 955 438.5 955 438.5 987 V999 V1049 C438.5 1081 385.167 1081 385.167 1113 V1125" marker-end="url(#arrow-dp-remaining-history)"/><g class="flow-edge-label" data-edge-label="history:yes:state" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="32" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="293">はい</text></g></g><g class="flow-edge no" data-edge="history:no:last-occurrence"><title>いいえ</title><path d="M584.833 182 V194 C584.833 226 612 226 612 258 V270"/><path d="M612 308 V320 C612 352 612 352 612 384 V396" marker-end="url(#arrow-dp-remaining-history)"/><g class="flow-edge-label" data-edge-label="history:no:last-occurrence" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="history:unknown:check"><title>わからない</title><path d="M664.833 182 V194 C664.833 226 1070.5 226 1070.5 258 V270"/><path d="M1070.5 308 V320 C1070.5 352 1070.5 352 1070.5 384 V396 V558 C1070.5 590 1070.5 590 1070.5 622 V634 V684 C1070.5 716 1029.333 716 1029.333 748 V760" marker-end="url(#arrow-dp-remaining-history)"/><g class="flow-edge-label" data-edge-label="history:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1026" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1070.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:state"><title>はい</title><path d="M896 910 V923 C896 955 528.5 955 528.5 987 V999"/><path d="M528.5 1037 V1049 C528.5 1081 491.833 1081 491.833 1113 V1125" marker-end="url(#arrow-dp-remaining-history)"/><g class="flow-edge-label" data-edge-label="check:yes:state" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="488.5" y="999" width="80" height="38" rx="5"/><text text-anchor="middle" x="528.5" y="1022">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 910 V923 C976 955 963 955 963 987 V999"/><path d="M963 1037 V1049 C963 1081 922.667 1081 922.667 1113 V1125" marker-end="url(#arrow-dp-remaining-history)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="999" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1022">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 910 V923 C1056 955 1091.5 955 1091.5 987 V999"/><path d="M1091.5 1037 V1049 C1091.5 1081 1029.333 1081 1029.333 1113 V1125" marker-end="url(#arrow-dp-remaining-history)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="999" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1022">わからない</text></g></g><g class="flow-edge yes" data-edge="last-occurrence:yes:last-result"><title>はい</title><path d="M532 546 V558 C532 590 248 590 248 622 V634"/><path d="M248 672 V684 C248 716 248 716 248 748 V760" marker-end="url(#arrow-dp-remaining-history)"/><g class="flow-edge-label" data-edge-label="last-occurrence:yes:last-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="657">はい</text></g></g><g class="flow-edge no" data-edge="last-occurrence:no:fallback"><title>いいえ</title><path d="M612 546 V558 C612 590 612 590 612 622 V634"/><path d="M612 672 V684 C612 716 612 716 612 748 V760" marker-end="url(#arrow-dp-remaining-history)"/><g class="flow-edge-label" data-edge-label="last-occurrence:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="last-occurrence:unknown:check"><title>わからない</title><path d="M692 546 V558 C692 590 976 590 976 622 V634"/><path d="M976 672 V684 C976 716 922.667 716 922.667 748 V760" marker-end="url(#arrow-dp-remaining-history)"/><g class="flow-edge-label" data-edge-label="last-occurrence:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="657">わからない</text></g></g><g class="flow-node question" data-node="history"><rect x="424.83333333333337" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="440.83333333333337" y="52">質問</text><text class="node-title" x="440.83333333333337" y="80">過去の処理順が違っても、今後の選択</text><text class="node-title" x="440.83333333333337" y="103">とコストが同じになりますか？</text><text class="node-explanation" x="440.83333333333337" y="130">必要な情報だけを残し、残りの履歴を捨てられること</text><text class="node-explanation" x="440.83333333333337" y="148">を示します。</text></g><g class="flow-node question" data-node="check"><rect x="816" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="832" y="780">質問</text><text class="node-title" x="832" y="808">二つの履歴について、以後の合法な操</text><text class="node-title" x="832" y="831">作と追加コストを比較できますか？</text><text class="node-explanation" x="832" y="858">同じ状態にまとめた履歴が、すべての未来で同じ振る</text><text class="node-explanation" x="832" y="876">舞いをするかを確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1125" width="320" height="139" rx="7"/><text class="node-kind" x="832" y="1145">分野</text><text class="node-title" x="832" y="1173">条件を確かめる</text><text class="node-explanation" x="832" y="1200">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1228">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="state"><rect x="278.5" y="1125" width="320" height="151" rx="7"/><text class="node-kind" x="294.5" y="1145">候補</text><text class="node-title" x="294.5" y="1173">必要な履歴だけを残す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="294.5" y="1212">状態の設計</text></a><a href="/flowchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="294.5" y="1236">対称性</text></a></g><g class="flow-node result" data-node="fallback"><rect x="452" y="760" width="320" height="151" rx="7"/><text class="node-kind" x="468" y="780">候補</text><text class="node-title" x="468" y="808">同じ状態にまとめられるか検証する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="468" y="847">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="468" y="871">反例探し</text></a></g><g class="flow-node question" data-node="last-occurrence"><rect x="452" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="468" y="416">質問</text><text class="node-title" x="468" y="444">同じ値や文字を最後に使った位置だけ</text><text class="node-title" x="468" y="467">が必要ですか？</text><text class="node-explanation" x="468" y="494">全履歴の代わりに、最後の出現による重複の補正を考</text><text class="node-explanation" x="468" y="512">えます。</text></g><g class="flow-node result" data-node="last-result"><rect x="88" y="760" width="320" height="145" rx="7"/><text class="node-kind" x="104" y="780">候補</text><text class="node-title" x="104" y="808">最後の出現で重複を差し引く</text><a href="/flowchartcp/techniques/dp-last-occurrence/"><title>同じ部分列を重複して数えるときは直前の出現を使うの記事へ</title><text x="104" y="847">同じ部分列を重複して数えるときは直前の出現を使</text><text x="104" y="865">う</text></a></g></svg>