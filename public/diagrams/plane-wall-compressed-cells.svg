<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-plane-wall-compressed-cells flow-desc-plane-wall-compressed-cells" width="1112" height="1791" viewBox="0 0 1112 1791" data-flow-svg="plane-wall-compressed-cells"><title id="flow-title-plane-wall-compressed-cells">軸に平行な壁で囲まれる面積は、座標の間の長方形を頂点にして探索するの解法フローチャート</title><desc id="flow-desc-plane-wall-compressed-cells">壁の向き、端点を通る可否、開始点、無限領域の扱い、圧縮後のセル数を確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-plane-wall-compressed-cells" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge axis-walls" data-edge="model:axis-walls:assumptions"><title>軸平行の線分の壁を通らず、原点から動ける領域の面積を求める</title><path d="M718.5 182 V194 C718.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 326 V338 C535.5 370 746.111 370 746.111 402 V414" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="model:axis-walls:assumptions" tabindex="0" role="group" aria-label="選択肢：軸平行の線分の壁を通らず、原点から動ける領域の面積を求める"><rect x="413" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="535.5" y="293">軸平行の線分の壁を通らず、原点から</text><text text-anchor="middle" x="535.5" y="311">動ける領域の面積を求める</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>斜めの壁・曲線がある、または原点が壁の上にある</title><path d="M798.5 182 V194 C798.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V594 C1018 626 1018 626 1018 658 V670 V720 C1018 752 1018 752 1018 784 V796 V999 C1018 1031 1018 1031 1018 1063 V1075 V1125 C1018 1157 636 1157 636 1189 V1201" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：斜めの壁・曲線がある、または原点が壁の上にある"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">斜めの壁・曲線がある、または原点が</text><text text-anchor="middle" x="824.5" y="311">壁の上にある</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M878.5 182 V194 C878.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V594 C1074 626 1074 626 1074 658 V670 V720 C1074 752 1074 752 1074 784 V796 V999 C1074 1031 1074 1031 1074 1063 V1075 V1125 C1074 1157 1000 1157 1000 1189 V1201" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 582 V594 C666.111 626 519.833 626 519.833 658 V670"/><path d="M519.833 708 V720 C519.833 752 519.833 752 519.833 784 V796" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="693">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 582 V594 C746.111 626 795 626 795 658 V670"/><path d="M795 708 V720 C795 752 906 752 906 784 V796 V999 C906 1031 906 1031 906 1063 V1075 V1125 C906 1157 556 1157 556 1189 V1201" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"><title>わからない</title><path d="M826.111 582 V594 C826.111 626 923.5 626 923.5 658 V670"/><path d="M923.5 708 V720 C923.5 752 962 752 962 784 V796 V999 C962 1031 962 1031 962 1063 V1075 V1125 C962 1157 920 1157 920 1189 V1201" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="assumptions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M439.833 987 V999 C439.833 1031 192 1031 192 1063 V1075"/><path d="M192 1113 V1125 C192 1157 192 1157 192 1189 V1201" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M519.833 987 V999 C519.833 1031 556 1031 556 1063 V1075"/><path d="M556 1113 V1125 C556 1157 476 1157 476 1189 V1201" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M599.833 987 V999 C599.833 1031 811.5 1031 811.5 1063 V1075"/><path d="M811.5 1113 V1125 C811.5 1157 840 1157 840 1189 V1201" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="767" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1098">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1351 V1400 C840 1432 783 1432 783 1464 V1476"/><path d="M783 1514 V1526 C783 1558 828.5 1558 828.5 1590 V1602" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1476" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1499">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1351 V1400 C920 1432 907 1432 907 1464 V1476"/><path d="M907 1514 V1526 C907 1558 908.5 1558 908.5 1590 V1602" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1476" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1499">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1351 V1400 C1000 1432 1035.5 1432 1035.5 1464 V1476"/><path d="M1035.5 1514 V1526 C1035.5 1558 988.5 1558 988.5 1590 V1602" marker-end="url(#arrow-plane-wall-compressed-cells)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1476" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1499">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="638.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="654.5" y="52">質問</text><text class="node-title" x="654.5" y="80">点や領域について求める量と、許され</text><text class="node-title" x="654.5" y="103">る操作はどれですか？</text><text class="node-explanation" x="654.5" y="130">壁の向き、端点を通る可否、開始点、無限領域の扱</text><text class="node-explanation" x="654.5" y="148">い、圧縮後のセル数を確かめます。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="602.1111111111112" y="434">質問</text><text class="node-title" x="602.1111111111112" y="462">壁と端点を通れず、原点はどの壁の上</text><text class="node-title" x="602.1111111111112" y="485">にもありませんか？</text><text class="node-explanation" x="602.1111111111112" y="512">座標値を順位に置き換えて面積を 1 とするのでは</text><text class="node-explanation" x="602.1111111111112" y="530">なく、隣り合う座標間の長方形を一つの領域として持</text><text class="node-explanation" x="602.1111111111112" y="548">ちます。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="796" width="320" height="191" rx="7"/><text class="node-kind" x="375.83333333333337" y="816">質問</text><text class="node-title" x="375.83333333333337" y="844">壁は合計2000本以下の軸平行線分</text><text class="node-title" x="375.83333333333337" y="867">で、整数座標の絶対値は10億以下で</text><text class="node-title" x="375.83333333333337" y="890">すか？</text><text class="node-explanation" x="375.83333333333337" y="917">全壁を覆う外側の枠を用意します。外周へ出られたら</text><text class="node-explanation" x="375.83333333333337" y="935">無限です。内部なら元の座標の差を掛けて面積を足し</text><text class="node-explanation" x="375.83333333333337" y="953">ます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1201" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1221">候補</text><text class="node-title" x="48" y="1249">軸に平行な壁で囲まれる面積は、座標</text><text class="node-title" x="48" y="1272">の間の長方形を頂点にして探索する</text><a href="/flowchartcp/techniques/plane-wall-compressed-cells/"><title>軸に平行な壁で囲まれる面積は、座標の間の長方形を頂点にして探索するの記事へ</title><text x="48" y="1311">軸に平行な壁で囲まれる面積は、座標の間の長方形</text><text x="48" y="1329">を頂点にして探索する</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1201" width="320" height="187" rx="7"/><text class="node-kind" x="412" y="1221">候補</text><text class="node-title" x="412" y="1249">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1276">斜めの線分はこの長方形セル間の壁だけで表せませ</text><text class="node-explanation" x="412" y="1294">ん。交点を含む平面分割など別の表現が必要です。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1324">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1348">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1201" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1221">質問</text><text class="node-title" x="776" y="1249">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1272">確認できますか？</text><text class="node-explanation" x="776" y="1299">壁の向き、端点を通る可否、開始点、無限領域の扱</text><text class="node-explanation" x="776" y="1317">い、圧縮後のセル数を確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1602" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1622">分野</text><text class="node-title" x="764.5" y="1650">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1677">壁の向き、端点を通る可否、開始点、無限領域の扱</text><text class="node-explanation" x="764.5" y="1695">い、圧縮後のセル数を確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1723">詳細の質問・図へ →</text></a></g></svg>