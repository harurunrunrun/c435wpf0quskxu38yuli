<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-interval-k-resources flow-desc-interval-k-resources" width="860" height="1348" viewBox="0 0 860 1348" data-flow-svg="interval-k-resources"><title id="flow-title-interval-k-resources">固定区間を K 人へ割り当てるの解法フローチャート</title><desc id="flow-desc-interval-k-resources">早く終わる区間から、開始前に終わった中で最も遅い担当者を使います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-interval-k-resources" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:objective"><title>はい</title><path d="M539.722 182 V194 C539.722 226 420.667 226 420.667 258 V270"/><path d="M420.667 308 V320 C420.667 352 420.667 352 420.667 384 V396" marker-end="url(#arrow-interval-k-resources)"/><g class="flow-edge-label" data-edge-label="model:yes:objective" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="293">はい</text></g></g><g class="flow-edge no" data-edge="model:no:fallback"><title>いいえ</title><path d="M619.722 182 V194 C619.722 226 655 226 655 258 V270"/><path d="M655 308 V320 C655 352 762.5 352 762.5 384 V396 V581 C762.5 613 762.5 613 762.5 645 V657 V707 C762.5 739 458 739 458 771 V783 V963 C458 995 360 995 360 1027 V1039 V1089 C360 1121 304 1121 304 1153 V1165" marker-end="url(#arrow-interval-k-resources)"/><g class="flow-edge-label" data-edge-label="model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M699.722 182 V194 C699.722 226 783.5 226 783.5 258 V270"/><path d="M783.5 308 V320 C783.5 352 818.5 352 818.5 384 V396 V581 C818.5 613 818.5 613 818.5 645 V657 V707 C818.5 739 721.333 739 721.333 771 V783" marker-end="url(#arrow-interval-k-resources)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="objective:yes:interval-result"><title>はい</title><path d="M340.667 569 V581 C340.667 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-interval-k-resources)"/><g class="flow-edge-label" data-edge-label="objective:yes:interval-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="objective:no:fallback"><title>いいえ</title><path d="M420.667 569 V581 C420.667 613 402 613 402 645 V657"/><path d="M402 695 V707 C402 739 402 739 402 771 V783 V963 C402 995 304 995 304 1027 V1039 V1089 C304 1121 224 1121 224 1153 V1165" marker-end="url(#arrow-interval-k-resources)"/><g class="flow-edge-label" data-edge-label="objective:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="objective:unknown:check"><title>わからない</title><path d="M500.667 569 V581 C500.667 613 668 613 668 645 V657"/><path d="M668 695 V707 C668 739 614.667 739 614.667 771 V783" marker-end="url(#arrow-interval-k-resources)"/><g class="flow-edge-label" data-edge-label="objective:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 915 V963 C588 995 450 995 450 1027 V1039"/><path d="M450 1077 V1089 C450 1121 384 1121 384 1153 V1165" marker-end="url(#arrow-interval-k-resources)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 915 V963 C668 995 655 995 655 1027 V1039"/><path d="M655 1077 V1089 C655 1121 614.667 1121 614.667 1153 V1165" marker-end="url(#arrow-interval-k-resources)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 915 V963 C748 995 783.5 995 783.5 1027 V1039"/><path d="M783.5 1077 V1089 C783.5 1121 721.333 1121 721.333 1153 V1165" marker-end="url(#arrow-interval-k-resources)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">各仕事の開始・終了は固定で、一人が</text><text class="node-title" x="475.7222222222223" y="103">同時に二件を担当できませんか？</text><text class="node-explanation" x="475.7222222222223" y="130">K 人は同じ能力です。選んだ仕事を異なる時刻へず</text><text class="node-explanation" x="475.7222222222223" y="148">らすことはできません。</text></g><g class="flow-node question" data-node="objective"><rect x="260.6666666666667" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">利益は件数だけで、前の終了時刻が次</text><text class="node-title" x="276.6666666666667" y="467">の開始と等しければ続けて担当できま</text><text class="node-title" x="276.6666666666667" y="490">すか？</text><text class="node-explanation" x="276.6666666666667" y="517">使える担当者の中で、最も遅く空いた人を使い、早く</text><text class="node-explanation" x="276.6666666666667" y="535">空いた人を他の早い開始へ残します。</text></g><g class="flow-node result" data-node="interval-result"><rect x="32" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">終了の早い区間から、開始以下の最も</text><text class="node-title" x="48" y="854">遅い終了時刻の担当者へ渡す</text><a href="/flowchartcp/techniques/interval-k-resources-predecessor/"><title>同時にk本まで選べる時間区間は、終了順に見て最も遅く空く担当へ割り当てるの記事へ</title><text x="48" y="893">同時にk本まで選べる時間区間は、終了順に見て最</text><text x="48" y="911">も遅く空く担当へ割り当てる</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="783" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="803">質問</text><text class="node-title" x="524" y="831">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="854">確認できますか？</text><text class="node-explanation" x="524" y="881">時間、順番、使える回数と目的値を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1165" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1185">候補</text><text class="node-title" x="160" y="1213">条件と選び方をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1252">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1276">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1185">分野</text><text class="node-title" x="524" y="1213">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1250">詳細の質問・図へ →</text></a></g></svg>