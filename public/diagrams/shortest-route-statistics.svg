<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-shortest-route-statistics flow-desc-shortest-route-statistics" width="860" height="1302" viewBox="0 0 860 1302" data-flow-svg="shortest-route-statistics"><title id="flow-title-shortest-route-statistics">最短経路だけの個数と辺数の解法フローチャート</title><desc id="flow-desc-shortest-route-statistics">距離が一致する辺だけ残して、距離の増える順で集計します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-shortest-route-statistics" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="positive:yes:tight"><title>はい</title><path d="M539.722 159 V171 C539.722 203 420.667 203 420.667 235 V247"/><path d="M420.667 285 V297 C420.667 329 420.667 329 420.667 361 V373" marker-end="url(#arrow-shortest-route-statistics)"/><g class="flow-edge-label" data-edge-label="positive:yes:tight" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="247" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="270">はい</text></g></g><g class="flow-edge no" data-edge="positive:no:fallback"><title>いいえ</title><path d="M619.722 159 V171 C619.722 203 655 203 655 235 V247"/><path d="M655 285 V297 C655 329 762.5 329 762.5 361 V373 V535 C762.5 567 762.5 567 762.5 599 V611 V661 C762.5 693 458 693 458 725 V737 V917 C458 949 360 949 360 981 V993 V1043 C360 1075 304 1075 304 1107 V1119" marker-end="url(#arrow-shortest-route-statistics)"/><g class="flow-edge-label" data-edge-label="positive:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="247" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="270">いいえ</text></g></g><g class="flow-edge unknown" data-edge="positive:unknown:check"><title>わからない</title><path d="M699.722 159 V171 C699.722 203 783.5 203 783.5 235 V247"/><path d="M783.5 285 V297 C783.5 329 818.5 329 818.5 361 V373 V535 C818.5 567 818.5 567 818.5 599 V611 V661 C818.5 693 721.333 693 721.333 725 V737" marker-end="url(#arrow-shortest-route-statistics)"/><g class="flow-edge-label" data-edge-label="positive:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="tight:yes:statistics-result"><title>はい</title><path d="M340.667 523 V535 C340.667 567 192 567 192 599 V611"/><path d="M192 649 V661 C192 693 192 693 192 725 V737" marker-end="url(#arrow-shortest-route-statistics)"/><g class="flow-edge-label" data-edge-label="tight:yes:statistics-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="634">はい</text></g></g><g class="flow-edge no" data-edge="tight:no:fallback"><title>いいえ</title><path d="M420.667 523 V535 C420.667 567 402 567 402 599 V611"/><path d="M402 649 V661 C402 693 402 693 402 725 V737 V917 C402 949 304 949 304 981 V993 V1043 C304 1075 224 1075 224 1107 V1119" marker-end="url(#arrow-shortest-route-statistics)"/><g class="flow-edge-label" data-edge-label="tight:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="tight:unknown:check"><title>わからない</title><path d="M500.667 523 V535 C500.667 567 668 567 668 599 V611"/><path d="M668 649 V661 C668 693 614.667 693 614.667 725 V737" marker-end="url(#arrow-shortest-route-statistics)"/><g class="flow-edge-label" data-edge-label="tight:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="634">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 887 V917 C588 949 450 949 450 981 V993"/><path d="M450 1031 V1043 C450 1075 384 1075 384 1107 V1119" marker-end="url(#arrow-shortest-route-statistics)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1016">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 887 V917 C668 949 655 949 655 981 V993"/><path d="M655 1031 V1043 C655 1075 614.667 1075 614.667 1107 V1119" marker-end="url(#arrow-shortest-route-statistics)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="993" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1016">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 887 V917 C748 949 783.5 949 783.5 981 V993"/><path d="M783.5 1031 V1043 C783.5 1075 721.333 1075 721.333 1107 V1119" marker-end="url(#arrow-shortest-route-statistics)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="993" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1016">わからない</text></g></g><g class="flow-node question" data-node="positive"><rect x="459.7222222222223" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">全ての辺の費用は、厳密に正ですか？</text><text class="node-explanation" x="475.7222222222223" y="107">0 の辺があると同じ距離の間に閉路ができ、距離の</text><text class="node-explanation" x="475.7222222222223" y="125">昇順だけでは依存関係を処理できません。</text></g><g class="flow-node question" data-node="tight"><rect x="260.6666666666667" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="393">質問</text><text class="node-title" x="276.6666666666667" y="421">辺 u→v を、d[u]+費用=d</text><text class="node-title" x="276.6666666666667" y="444">[v] のときだけ残せますか？</text><text class="node-explanation" x="276.6666666666667" y="471">到達していない頂点を除きます。平行辺は、異なる移</text><text class="node-explanation" x="276.6666666666667" y="489">動として数えるかを問題文で確認します。</text></g><g class="flow-node result" data-node="statistics-result"><rect x="32" y="737" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="757">候補</text><text class="node-title" x="48" y="785">最短距離を保つ辺だけ残し、距離順に</text><text class="node-title" x="48" y="808">経路数・最小辺数・最大辺数を伝える</text><a href="/flowchartcp/techniques/shortest-tight-dag-statistics/"><title>最短路の個数と辺数は、正の辺からなる最短距離の順でまとめるの記事へ</title><text x="48" y="847">最短路の個数と辺数は、正の辺からなる最短距離の</text><text x="48" y="865">順でまとめる</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="737" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="757">質問</text><text class="node-title" x="524" y="785">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="808">確認できますか？</text><text class="node-explanation" x="524" y="835">操作の順番、値が変わる範囲、答えの条件を確認しま</text><text class="node-explanation" x="524" y="853">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1119" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1139">候補</text><text class="node-title" x="160" y="1167">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1206">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1230">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1119" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1139">分野</text><text class="node-title" x="524" y="1167">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1204">詳細の質問・図へ →</text></a></g></svg>