<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-thinking-reverse-choices flow-desc-thinking-reverse-choices" width="1112" height="1284" viewBox="0 0 1112 1284" data-flow-svg="thinking-reverse-choices"><title id="flow-title-thinking-reverse-choices">逆向きの操作と、局所的な選択の解法フローチャート</title><desc id="flow-desc-thinking-reverse-choices">操作を戻したときの選択肢と、局所的な選択を正当化する条件を調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-thinking-reverse-choices" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="reverse:yes:reverse-result"><title>はい</title><path d="M719.833 182 V194 C719.833 226 500 226 500 258 V270"/><path d="M500 308 V320 C500 352 500 352 500 384 V396" marker-end="url(#arrow-thinking-reverse-choices)"/><g class="flow-edge-label" data-edge-label="reverse:yes:reverse-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="460" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="500" y="293">はい</text></g></g><g class="flow-edge no" data-edge="reverse:no:greedy"><title>いいえ</title><path d="M799.833 182 V194 C799.833 226 864 226 864 258 V270"/><path d="M864 308 V320 C864 352 864 352 864 384 V396" marker-end="url(#arrow-thinking-reverse-choices)"/><g class="flow-edge-label" data-edge-label="reverse:no:greedy" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="824" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="864" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="reverse:unknown:check"><title>わからない</title><path d="M879.833 182 V194 C879.833 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V320 C1035.5 352 1074 352 1074 384 V396 V540 C1074 572 1014.5 572 1014.5 604 V616 V666 C1014.5 698 973.333 698 973.333 730 V742" marker-end="url(#arrow-thinking-reverse-choices)"/><g class="flow-edge-label" data-edge-label="reverse:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="greedy:yes:proof-route"><title>はい</title><path d="M784 528 V540 C784 572 192 572 192 604 V616"/><path d="M192 654 V666 C192 698 192 698 192 730 V742" marker-end="url(#arrow-thinking-reverse-choices)"/><g class="flow-edge-label" data-edge-label="greedy:yes:proof-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="616" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="639">はい</text></g></g><g class="flow-edge no" data-edge="greedy:no:invariant"><title>いいえ</title><path d="M864 528 V540 C864 572 556 572 556 604 V616"/><path d="M556 654 V666 C556 698 556 698 556 730 V742" marker-end="url(#arrow-thinking-reverse-choices)"/><g class="flow-edge-label" data-edge-label="greedy:no:invariant" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="616" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="639">いいえ</text></g></g><g class="flow-edge unknown" data-edge="greedy:unknown:check"><title>わからない</title><path d="M944 528 V540 C944 572 920 572 920 604 V616"/><path d="M920 654 V666 C920 698 866.667 698 866.667 730 V742" marker-end="url(#arrow-thinking-reverse-choices)"/><g class="flow-edge-label" data-edge-label="greedy:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="616" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="639">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:observation"><title>はい</title><path d="M840 874 V911 C840 943 556 943 556 975 V987"/><path d="M556 1025 V1037 C556 1069 556 1069 556 1101 V1113" marker-end="url(#arrow-thinking-reverse-choices)"/><g class="flow-edge-label" data-edge-label="check:yes:observation" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="987" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1010">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 874 V911 C920 943 907 943 907 975 V987"/><path d="M907 1025 V1037 C907 1069 866.667 1069 866.667 1101 V1113" marker-end="url(#arrow-thinking-reverse-choices)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="987" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1010">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 874 V911 C1000 943 1035.5 943 1035.5 975 V987"/><path d="M1035.5 1025 V1037 C1035.5 1069 973.333 1069 973.333 1101 V1113" marker-end="url(#arrow-thinking-reverse-choices)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="987" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1010">わからない</text></g></g><g class="flow-node question" data-node="reverse"><rect x="639.8333333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="655.8333333333334" y="52">質問</text><text class="node-title" x="655.8333333333334" y="80">最後の操作から戻ると、選択肢が減り</text><text class="node-title" x="655.8333333333334" y="103">ますか？</text><text class="node-explanation" x="655.8333333333334" y="130">削除を追加へ、最後に確定する要素を最初に決める処</text><text class="node-explanation" x="655.8333333333334" y="148">理へ変えます。</text></g><g class="flow-node result" data-node="reverse-result"><rect x="340" y="396" width="320" height="127" rx="7"/><text class="node-kind" x="356" y="416">候補</text><text class="node-title" x="356" y="444">逆向きに考える</text><a href="/flowchartcp/techniques/reverse-thinking/"><title>逆順処理の記事へ</title><text x="356" y="483">逆順処理</text></a></g><g class="flow-node question" data-node="greedy"><rect x="704" y="396" width="320" height="132" rx="7"/><text class="node-kind" x="720" y="416">質問</text><text class="node-title" x="720" y="444">局所的に良さそうな選択をしています</text><text class="node-title" x="720" y="467">か？</text><text class="node-explanation" x="720" y="494">その選択を含む最適解へ変えられる根拠を調べます。</text></g><g class="flow-node route" data-node="proof-route"><rect x="32" y="742" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="762">分野</text><text class="node-title" x="48" y="790">貪欲法と正当性</text><a href="/flowchartcp/flowcharts/#diagram-thinking-proof" data-route="thinking-proof"><text x="48" y="827">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="invariant"><rect x="396" y="742" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="762">分野</text><text class="node-title" x="412" y="790">不変量と仮説の検証</text><text class="node-explanation" x="412" y="817">操作で変わらない量を探し、仮説が正しいか小さい入</text><text class="node-explanation" x="412" y="835">力で確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-invariants-validation" data-route="thinking-invariants-validation"><text x="412" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="742" width="320" height="132" rx="7"/><text class="node-kind" x="776" y="762">質問</text><text class="node-title" x="776" y="790">手で追える入力の、操作と答えを列挙</text><text class="node-title" x="776" y="813">できますか？</text><text class="node-explanation" x="776" y="840">抽象的な式を、最小の例に戻して確認します。</text></g><g class="flow-node result" data-node="observation"><rect x="396" y="1113" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1133">候補</text><text class="node-title" x="412" y="1161">小規模全探索から観察する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="412" y="1200">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="1113" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="1133">分野</text><text class="node-title" x="776" y="1161">条件を確かめる</text><text class="node-explanation" x="776" y="1188">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="1216">詳細の質問・図へ →</text></a></g></svg>