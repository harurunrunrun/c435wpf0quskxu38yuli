ss="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1385" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1408">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 1279 V1309 C668 1341 655 1341 655 1373 V1385"/><path d="M655 1423 V1435 C655 1467 670.667 1467 670.667 1499 V1511" marker-end="url(#arrow-ordered-set-ranks)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1385" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1408">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 1279 V1309 C748 1341 783.5 1341 783.5 1373 V1385"/><path d="M783.5 1423 V1435 C783.5 1467 777.333 1467 777.333 1499 V1511" marker-end="url(#arrow-ordered-set-ranks)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1385" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1408">わからない</text></g></g><g class="flow-node question" data-node="operations"><rect x="549.0185185185186" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="565.0185185185186" y="52">質問</text><text class="node-title" x="565.0185185185186" y="80">重複のない整数集合へ追加・削除し、</text><text class="node-title" x="565.0185185185186" y="103">小さい値の個数や k 番目を求めま</text><text class="node-title" x="565.0185185185186" y="126">すか？</text><text class="node-explanation" x="565.0185185185186" y="153">既にある値の追加と、ない値の削除では個数を変えま</text><text class="node-explanation" x="565.0185185185186" y="171">せん。各値の個数は 0 または 1 です。</text></g><g class="flow-node question" data-node="known-values"><rect x="416.55555555555554" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="432.55555555555554" y="439">質問</text><text class="node-title" x="432.55555555555554" y="467">全操作を先に読め、追加される値を列</text><text class="node-title" x="432.55555555555554" y="490">挙して並べられますか？</text><text class="node-explanation" x="432.55555555555554" y="517">出現する値に添字を振って順序を保ちます。値そのも</text><text class="node-explanation" x="432.55555555555554" y="535">のの距離は使いません。</text></g><g class="flow-node question" data-node="rank-bound"><rect x="243.16666666666669" y="783" width="320" height="150" rx="7"/><text class="node-kind" x="259.1666666666667" y="803">質問</text><text class="node-title" x="259.1666666666667" y="831">k が現在の集合の大きさの範囲外な</text><text class="node-title" x="259.1666666666667" y="854">ら、その場で判定できますか？</text><text class="node-explanation" x="259.1666666666667" y="881">範囲内だけ接頭辞の個数から位置を探します。x 未</text><text class="node-explanation" x="259.1666666666667" y="899">満の個数は x の下限位置までの接頭辞和です。</text></g><g class="flow-node result" data-node="set-rank-result"><rect x="32" y="1147" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="1167">候補</text><text class="node-title" x="48" y="1195">値ごとの 0/1 個数を更新し、接</text><text class="node-title" x="48" y="1218">頭辞の個数から順位の値を探す</text><a href="/flowchartcp/techniques/fenwick-prefix-lower-bound/"><title>累積個数が目標へ届く位置を、木の内部で探すの記事へ</title><text x="48" y="1257">累積個数が目標へ届く位置を、木の内部で探す</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="1147" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="1167">質問</text><text class="node-title" x="524" y="1195">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="1218">確認できますか？</text><text class="node-explanation" x="524" y="1245">入力の更新、許される操作、境界を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1511" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1531">候補</text><text class="node-title" x="216" y="1559">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="216" y="1598">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1622">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1511" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1531">分野</text><text class="node-title" x="580" y="1559">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1596">詳細の質問・図へ →</text></a></g></svg>