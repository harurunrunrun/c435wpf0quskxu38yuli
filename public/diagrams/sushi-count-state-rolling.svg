<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-sushi-count-state-rolling flow-desc-sushi-count-state-rolling" width="1112" height="1832" viewBox="0 0 1112 1832" data-flow-svg="sushi-count-state-rolling"><title id="flow-title-sushi-count-state-rolling">同じ確率で選ぶ容器は、中身の個数ごとにまとめて期待値を計算するの解法フローチャート</title><desc id="flow-desc-sushi-count-state-rolling">一様に選ぶ対象が皿か食べ物か、空皿を選ぶ回数を数えるか、最大個数を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-sushi-count-state-rolling" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge uniform-plates" data-edge="model:uniform-plates:assumptions"><title>N 枚の皿を空皿も含めて一様に選び、食べ物があれば一個減らす</title><path d="M720.667 182 V194 C720.667 226 542 226 542 258 V270"/><path d="M542 326 V338 C542 370 746.111 370 746.111 402 V414" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="model:uniform-plates:assumptions" tabindex="0" role="group" aria-label="選択肢：N 枚の皿を空皿も含めて一様に選び、食べ物があれば一個減らす"><rect x="426" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="542" y="293">N 枚の皿を空皿も含めて一様に選</text><text text-anchor="middle" x="542" y="311">び、食べ物があれば一個減らす</text></g></g><g class="flow-edge different" data-edge="model:different:fallback"><title>残った食べ物から一様に選ぶ、または皿ごとに選ばれる確率が違う</title><path d="M800.667 182 V194 C800.667 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V617 C1018 649 1018 649 1018 681 V693 V743 C1018 775 1018 775 1018 807 V819 V1022 C1018 1054 1018 1054 1018 1086 V1098 V1148 C1018 1180 636 1180 636 1212 V1224" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="model:different:fallback" tabindex="0" role="group" aria-label="選択肢：残った食べ物から一様に選ぶ、または皿ごとに選ばれる確率が違う"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">残った食べ物から一様に選ぶ、または</text><text text-anchor="middle" x="824.5" y="311">皿ごとに選ばれる確率が違う</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M880.667 182 V194 C880.667 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V617 C1074 649 1074 649 1074 681 V693 V743 C1074 775 1074 775 1074 807 V819 V1022 C1074 1054 1074 1054 1074 1086 V1098 V1148 C1074 1180 1000 1180 1000 1212 V1224" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="assumptions:yes:guard"><title>はい</title><path d="M666.111 605 V617 C666.111 649 519.833 649 519.833 681 V693"/><path d="M519.833 731 V743 C519.833 775 519.833 775 519.833 807 V819" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="assumptions:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="479.83333333333337" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="519.8333333333334" y="716">はい</text></g></g><g class="flow-edge no" data-edge="assumptions:no:fallback"><title>いいえ</title><path d="M746.111 605 V617 C746.111 649 795 649 795 681 V693"/><path d="M795 731 V743 C795 775 906 775 906 807 V819 V1022 C906 1054 906 1054 906 1086 V1098 V1148 C906 1180 556 1180 556 1212 V1224" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="assumptions:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="755" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="795" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="assumptions:unknown:check"><title>わからない</title><path d="M826.111 605 V617 C826.111 649 923.5 649 923.5 681 V693"/><path d="M923.5 731 V743 C923.5 775 962 775 962 807 V819 V1022 C962 1054 962 1054 962 1086 V1098 V1148 C962 1180 920 1180 920 1212 V1224" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="assumptions:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="879" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="923.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M439.833 1010 V1022 C439.833 1054 192 1054 192 1086 V1098"/><path d="M192 1136 V1148 C192 1180 192 1180 192 1212 V1224" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1121">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M519.833 1010 V1022 C519.833 1054 556 1054 556 1086 V1098"/><path d="M556 1136 V1148 C556 1180 476 1180 476 1212 V1224" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1121">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M599.833 1010 V1022 C599.833 1054 811.5 1054 811.5 1086 V1098"/><path d="M811.5 1136 V1148 C811.5 1180 840 1180 840 1212 V1224" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="767" y="1098" width="89" height="38" rx="5"/><text text-anchor="middle" x="811.5" y="1121">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1374 V1441 C840 1473 783 1473 783 1505 V1517"/><path d="M783 1555 V1567 C783 1599 828.5 1599 828.5 1631 V1643" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1517" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1540">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1374 V1441 C920 1473 907 1473 907 1505 V1517"/><path d="M907 1555 V1567 C907 1599 908.5 1599 908.5 1631 V1643" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1517" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1540">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1374 V1441 C1000 1473 1035.5 1473 1035.5 1505 V1517"/><path d="M1035.5 1555 V1567 C1035.5 1599 988.5 1599 988.5 1631 V1643" marker-end="url(#arrow-sushi-count-state-rolling)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1517" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1540">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="640.6666666666666" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="656.6666666666666" y="52">質問</text><text class="node-title" x="656.6666666666666" y="80">ランダムな操作と終了の規則はどれで</text><text class="node-title" x="656.6666666666666" y="103">すか？</text><text class="node-explanation" x="656.6666666666666" y="130">一様に選ぶ対象が皿か食べ物か、空皿を選ぶ回数を数</text><text class="node-explanation" x="656.6666666666666" y="148">えるか、最大個数を確認します。</text></g><g class="flow-node question" data-node="assumptions"><rect x="586.1111111111112" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="602.1111111111112" y="434">質問</text><text class="node-title" x="602.1111111111112" y="462">各皿の初期個数は 0..3 で、同</text><text class="node-title" x="602.1111111111112" y="485">じ個数の皿は以後の遷移で区別されま</text><text class="node-title" x="602.1111111111112" y="508">せんか？</text><text class="node-explanation" x="602.1111111111112" y="535">空皿を引いた回数も操作回数に数えます。1・2・3</text><text class="node-explanation" x="602.1111111111112" y="553"> 個の皿数 a,b,c と、元の皿数 N を持ち</text><text class="node-explanation" x="602.1111111111112" y="571">ます。</text></g><g class="flow-node question" data-node="guard"><rect x="359.83333333333337" y="819" width="320" height="191" rx="7"/><text class="node-kind" x="375.83333333333337" y="839">質問</text><text class="node-title" x="375.83333333333337" y="867">皿は300枚以下で、残り個数が同じ</text><text class="node-title" x="375.83333333333337" y="890">皿に、選ばれやすさなどの違いはあり</text><text class="node-title" x="375.83333333333337" y="913">ませんか？</text><text class="node-explanation" x="375.83333333333337" y="940">食べる遷移は (a−1,b,c)、(a+1,b−</text><text class="node-explanation" x="375.83333333333337" y="958">1,c)、(a,b+1,c−1) です。単に全て</text><text class="node-explanation" x="375.83333333333337" y="976">の添字を降順にして上書きしません。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1224" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1244">候補</text><text class="node-title" x="48" y="1272">同じ確率で選ぶ容器は、中身の個数ご</text><text class="node-title" x="48" y="1295">とにまとめて期待値を計算する</text><a href="/flowchartcp/techniques/sushi-count-state-rolling/"><title>同じ確率で選ぶ容器は、中身の個数ごとにまとめて期待値を計算するの記事へ</title><text x="48" y="1334">同じ確率で選ぶ容器は、中身の個数ごとにまとめて</text><text x="48" y="1352">期待値を計算する</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1224" width="320" height="205" rx="7"/><text class="node-kind" x="412" y="1244">候補</text><text class="node-title" x="412" y="1272">条件の異なる部分を分けて考える</text><text class="node-explanation" x="412" y="1299">皿ごとの選択確率が異なる場合、個数だけでまとめる</text><text class="node-explanation" x="412" y="1317">と遷移確率が失われます。同じ確率を持つ種類などの</text><text class="node-explanation" x="412" y="1335">情報を残します。</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1365">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1389">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1224" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1244">質問</text><text class="node-title" x="776" y="1272">入力・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1295">確認できますか？</text><text class="node-explanation" x="776" y="1322">一様に選ぶ対象が皿か食べ物か、空皿を選ぶ回数を数</text><text class="node-explanation" x="776" y="1340">えるか、最大個数を確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1643" width="320" height="157" rx="7"/><text class="node-kind" x="764.5" y="1663">分野</text><text class="node-title" x="764.5" y="1691">確認できていない条件を整理する</text><text class="node-explanation" x="764.5" y="1718">一様に選ぶ対象が皿か食べ物か、空皿を選ぶ回数を数</text><text class="node-explanation" x="764.5" y="1736">えるか、最大個数を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1764">詳細の質問・図へ →</text></a></g></svg>