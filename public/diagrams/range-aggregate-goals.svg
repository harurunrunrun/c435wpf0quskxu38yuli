<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-range-aggregate-goals flow-desc-range-aggregate-goals" width="1861" height="1273" viewBox="0 0 1861 1273" data-flow-svg="range-aggregate-goals"><title id="flow-title-range-aggregate-goals">連続する区間や期間の集計の解法フローチャート</title><desc id="flow-desc-range-aggregate-goals">値が変わるか、長さが固定か、複数の期間が重なるかを分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-range-aggregate-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge change" data-edge="updates:change:update-route"><title>値を変更しながら区間を集計する</title><path d="M866.214 159 V171 C866.214 203 141.5 203 141.5 235 V247"/><path d="M141.5 285 V315 C141.5 347 255 347 255 379 V391 V553 C255 585 675 585 675 617 V629 V679 C675 711 675 711 675 743 V755 V918 C675 950 836.75 950 836.75 982 V994 V1044 C836.75 1076 783.417 1076 783.417 1108 V1120" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="updates:change:update-route" tabindex="0" role="group" aria-label="選択肢：値を変更しながら区間を集計する"><rect x="32" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="141.5" y="270">値を変更しながら区間を集計する</text></g></g><g class="flow-edge static" data-edge="updates:static:static-route"><title>変わらない配列の指定区間を集計する</title><path d="M906.214 159 V171 C906.214 203 417.5 203 417.5 235 V247"/><path d="M417.5 285 V315 C417.5 347 311 347 311 379 V391 V553 C311 585 731 585 731 617 V629 V679 C731 711 731 711 731 743 V755 V918 C731 950 1200.75 950 1200.75 982 V994 V1044 C1200.75 1076 1147.417 1076 1147.417 1108 V1120" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="updates:static:static-route" tabindex="0" role="group" aria-label="選択肢：変わらない配列の指定区間を集計する"><rect x="295" y="247" width="245" height="38" rx="5"/><text text-anchor="middle" x="417.5" y="270">変わらない配列の指定区間を集計する</text></g></g><g class="flow-edge window" data-edge="updates:window:window-route"><title>連続する区間の長さ・個数・和・最大最小</title><path d="M946.214 159 V171 C946.214 203 706.5 203 706.5 235 V247"/><path d="M706.5 303 V315 C706.5 347 521 347 521 379 V391" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="updates:window:window-route" tabindex="0" role="group" aria-label="選択肢：連続する区間の長さ・個数・和・最大最小"><rect x="584" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="706.5" y="270">連続する区間の長さ・個数・和・最大</text><text text-anchor="middle" x="706.5" y="288">最小</text></g></g><g class="flow-edge interval-use" data-edge="updates:interval-use:interval-use-check"><title>複数の利用区間が重なったときの量や容量</title><path d="M986.214 159 V171 C986.214 203 995.5 203 995.5 235 V247"/><path d="M995.5 303 V315 C995.5 347 885 347 885 379 V391" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="updates:interval-use:interval-use-check" tabindex="0" role="group" aria-label="選択肢：複数の利用区間が重なったときの量や容量"><rect x="873" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="995.5" y="270">複数の利用区間が重なったときの量や</text><text text-anchor="middle" x="995.5" y="288">容量</text></g></g><g class="flow-edge schedule-change" data-edge="updates:schedule-change:schedule-score-route"><title>一日の開催種類を変え、間隔減点込みの合計得点を毎回出す</title><path d="M1026.214 159 V171 C1026.214 203 1284.5 203 1284.5 235 V247"/><path d="M1284.5 303 V315 C1284.5 347 1249 347 1249 379 V391" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="updates:schedule-change:schedule-score-route" tabindex="0" role="group" aria-label="選択肢：一日の開催種類を変え、間隔減点込みの合計得点を毎回出す"><rect x="1162" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284.5" y="270">一日の開催種類を変え、間隔減点込み</text><text text-anchor="middle" x="1284.5" y="288">の合計得点を毎回出す</text></g></g><g class="flow-edge meeting-costs" data-edge="updates:meeting-costs:meeting-costs-route"><title>区間内で会場を選び、道中の最大高さの費用を最小にする</title><path d="M1066.214 159 V171 C1066.214 203 1573.5 203 1573.5 235 V247"/><path d="M1573.5 303 V315 C1573.5 347 1613 347 1613 379 V391" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="updates:meeting-costs:meeting-costs-route" tabindex="0" role="group" aria-label="選択肢：区間内で会場を選び、道中の最大高さの費用を最小にする"><rect x="1451" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1573.5" y="270">区間内で会場を選び、道中の最大高さ</text><text text-anchor="middle" x="1573.5" y="288">の費用を最小にする</text></g></g><g class="flow-edge unknown" data-edge="updates:unknown:check"><title>わからない</title><path d="M1106.214 159 V171 C1106.214 203 1784.5 203 1784.5 235 V247"/><path d="M1784.5 285 V315 C1784.5 347 1823 347 1823 379 V391 V553 C1823 585 1763.5 585 1763.5 617 V629 V679 C1763.5 711 1722.333 711 1722.333 743 V755" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="updates:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1740" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1784.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:update-route"><title>はい</title><path d="M1589 905 V918 C1589 950 1290.75 950 1290.75 982 V994"/><path d="M1290.75 1032 V1044 C1290.75 1076 890.083 1076 890.083 1108 V1120" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:update-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1250.75" y="994" width="80" height="38" rx="5"/><text text-anchor="middle" x="1290.75" y="1017">はい</text></g></g><g class="flow-edge no" data-edge="check:no:static-route"><title>いいえ</title><path d="M1669 905 V918 C1669 950 1414.75 950 1414.75 982 V994"/><path d="M1414.75 1032 V1044 C1414.75 1076 1254.083 1076 1254.083 1108 V1120" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="check:no:static-route" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1374.75" y="994" width="80" height="38" rx="5"/><text text-anchor="middle" x="1414.75" y="1017">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1749 905 V918 C1749 950 1669 950 1669 982 V994"/><path d="M1669 1032 V1044 C1669 1076 1669 1076 1669 1108 V1120" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1624.5" y="994" width="89" height="38" rx="5"/><text text-anchor="middle" x="1669" y="1017">わからない</text></g></g><g class="flow-edge yes" data-edge="interval-use-check:yes:interval-use-result"><title>はい</title><path d="M805 541 V553 C805 585 941 585 941 617 V629"/><path d="M941 667 V679 C941 711 941 711 941 743 V755" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="interval-use-check:yes:interval-use-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="901" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="941" y="652">はい</text></g></g><g class="flow-edge no" data-edge="interval-use-check:no:pair-fallback"><title>いいえ</title><path d="M885 541 V553 C885 585 1305 585 1305 617 V629"/><path d="M1305 667 V679 C1305 711 1305 711 1305 743 V755" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="interval-use-check:no:pair-fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1265" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1305" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="interval-use-check:unknown:check"><title>わからない</title><path d="M965 541 V553 C965 585 1669 585 1669 617 V629"/><path d="M1669 667 V679 C1669 711 1615.667 711 1615.667 743 V755" marker-end="url(#arrow-range-aggregate-goals)"/><g class="flow-edge-label" data-edge-label="interval-use-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1624.5" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="1669" y="652">わからない</text></g></g><g class="flow-node question" data-node="updates"><rect x="826.2142857142857" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="842.2142857142857" y="52">質問</text><text class="node-title" x="842.2142857142857" y="80">数列について、何を求めますか？</text><text class="node-explanation" x="842.2142857142857" y="107">値が変わるか、区間が連続しているか、答えの形を選</text><text class="node-explanation" x="842.2142857142857" y="125">びます。</text></g><g class="flow-node question" data-node="check"><rect x="1509" y="755" width="320" height="150" rx="7"/><text class="node-kind" x="1525" y="775">質問</text><text class="node-title" x="1525" y="803">操作の一覧に、配列の値を変更する命</text><text class="node-title" x="1525" y="826">令がありますか？</text><text class="node-explanation" x="1525" y="853">問題文の操作を「値を変える」「値を読む」に分けて</text><text class="node-explanation" x="1525" y="871">ください。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1509" y="1120" width="320" height="121" rx="7"/><text class="node-kind" x="1525" y="1140">分野</text><text class="node-title" x="1525" y="1168">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1525" y="1205">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="update-route"><rect x="676.75" y="1120" width="320" height="121" rx="7"/><text class="node-kind" x="692.75" y="1140">分野</text><text class="node-title" x="692.75" y="1168">値が変わる区間の集計</text><a href="/flowchartcp/flowcharts/#diagram-range-update" data-route="range-update"><text x="692.75" y="1205">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="window-route"><rect x="361" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="377" y="411">分野</text><text class="node-title" x="377" y="439">連続する区間の条件</text><a href="/flowchartcp/flowcharts/#diagram-range-window" data-route="range-window"><text x="377" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="static-route"><rect x="1040.75" y="1120" width="320" height="121" rx="7"/><text class="node-kind" x="1056.75" y="1140">分野</text><text class="node-title" x="1056.75" y="1168">値が変わらない区間の集計</text><a href="/flowchartcp/flowcharts/#diagram-range-static" data-route="range-static"><text x="1056.75" y="1205">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="pair-fallback"><rect x="1145" y="755" width="320" height="127" rx="7"/><text class="node-kind" x="1161" y="775">候補</text><text class="node-title" x="1161" y="803">組の条件を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1161" y="842">状態の設計</text></a></g><g class="flow-node question" data-node="interval-use-check"><rect x="725" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="741" y="411">質問</text><text class="node-title" x="741" y="439">各利用区間の開始と終了で、総量を加</text><text class="node-title" x="741" y="462">算・減算できますか？</text><text class="node-explanation" x="741" y="489">[S,T) なら開始 S に加え、終了 T で減</text><text class="node-explanation" x="741" y="507">らします。同時刻の変更をまとめます。</text></g><g class="flow-node result" data-node="interval-use-result"><rect x="781" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="797" y="775">候補</text><text class="node-title" x="797" y="803">区間の端点で増減して容量を調べる</text><a href="/flowchartcp/techniques/sweep-interval-endpoints/"><title>半開区間の開始と終了を同じ座標でまとめるの記事へ</title><text x="797" y="842">半開区間の開始と終了を同じ座標でまとめる</text></a><a href="/flowchartcp/techniques/difference-array/"><title>いもす法の記事へ</title><text x="797" y="866">いもす法</text></a></g><g class="flow-node route" data-node="schedule-score-route"><rect x="1089" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1105" y="411">分野</text><text class="node-title" x="1105" y="439">開催日の間隔から得点を更新する</text><a href="/flowchartcp/flowcharts/#diagram-heuristic-schedule" data-route="heuristic-schedule"><text x="1105" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="meeting-costs-route"><rect x="1453" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1469" y="411">分野</text><text class="node-title" x="1469" y="439">区間内で会場を選び、道中の最大高さ</text><text class="node-title" x="1469" y="462">の費用を最小にする</text><a href="/flowchartcp/flowcharts/#diagram-range-maximum-meeting-cost-conditions" data-route="range-maximum-meeting-cost-conditions"><text x="1469" y="499">詳細の質問・図へ →</text></a></g></svg>