34"/><path d="M755.5 1072 V1084 C755.5 1116 840 1116 840 1148 V1160" marker-end="url(#arrow-partition-equal-value-pairs)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1057">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1310 V1340 C840 1372 783 1372 783 1404 V1416"/><path d="M783 1454 V1466 C783 1498 828.5 1498 828.5 1530 V1542" marker-end="url(#arrow-partition-equal-value-pairs)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1439">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1310 V1340 C920 1372 907 1372 907 1404 V1416"/><path d="M907 1454 V1466 C907 1498 908.5 1498 908.5 1530 V1542" marker-end="url(#arrow-partition-equal-value-pairs)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1439">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1310 V1340 C1000 1372 1035.5 1372 1035.5 1404 V1416"/><path d="M1035.5 1454 V1466 C1035.5 1498 988.5 1498 988.5 1530 V1542" marker-end="url(#arrow-partition-equal-value-pairs)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1416" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1439">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="585" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="601" y="52">質問</text><text class="node-title" x="601" y="80">各区間の費用は、どの量ですか？</text><text class="node-explanation" x="601" y="107">区間費用の具体式と、最適位置を絞る性質の根拠を確</text><text class="node-explanation" x="601" y="125">認します。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="391" width="320" height="173" rx="7"/><text class="node-kind" x="558.5555555555557" y="411">質問</text><text class="node-title" x="558.5555555555557" y="439">固定された列を、ちょうど K 個の</text><text class="node-title" x="558.5555555555557" y="462">非空連続区間へ分け、費用和を最小に</text><text class="node-title" x="558.5555555555557" y="485">しますか？</text><text class="node-explanation" x="558.5555555555557" y="512">各段は前段の表だけを参照します。到達不能状態を有</text><text class="node-explanation" x="558.5555555555557" y="530">限の値として比べません。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="357.1666666666667" y="798">質問</text><text class="node-title" x="357.1666666666667" y="826">同値組数の四点不等式から、最適な分</text><text class="node-title" x="357.1666666666667" y="849">割位置の単調性を証明できますか？</text><text class="node-explanation" x="357.1666666666667" y="876">区間端の追加は現在の同値個数を足し、削除は個数を</text><text class="node-explanation" x="357.1666666666667" y="894">減らしてから引きます。この更新と最適位置の絞り込</text><text class="node-explanation" x="357.1666666666667" y="912">みを組み合わせます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1180">候補</text><text class="node-title" x="48" y="1208">区間の端を動かして同値の組数を更新</text><text class="node-title" x="48" y="1231">し、最適な分割位置を絞る</text><a href="/flowchartcp/techniques/partition-equal-pairs-moving-window/"><title>同値対の費用で区間分割するなら、切れ目の単調性と窓の頻度更新を組み合わせるの記事へ</title><text x="48" y="1270">同値対の費用で区間分割するなら、切れ目の単調性</text><text x="48" y="1288">と窓の頻度更新を組み合わせる</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1160" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1180">候補</text><text class="node-title" x="412" y="1208">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1247">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1271">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1160" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1180">質問</text><text class="node-title" x="776" y="1208">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1231">書き出せますか？</text><text class="node-explanation" x="776" y="1258">区間費用の具体式と、最適位置を絞る性質の根拠を確</text><text class="node-explanation" x="776" y="1276">認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1542" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1562">分野</text><text class="node-title" x="764.5" y="1590">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1627">詳細の質問・図へ →</text></a></g></svg>