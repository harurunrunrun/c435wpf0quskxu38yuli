t rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge equal-pair-count" data-edge="model:equal-pair-count:goal"><title>値が等しい、異なる二添字の順序なしの組数</title><path d="M649 159 V171 C649 203 428.5 203 428.5 235 V247"/><path d="M428.5 303 V315 C428.5 347 702.556 347 702.556 379 V391" marker-end="url(#arrow-partition-equal-value-pairs)"/><g class="flow-edge-label" data-edge-label="model:equal-pair-count:goal" tabindex="0" role="group" aria-label="選択肢：値が等しい、異なる二添字の順序なしの組数"><rect x="306" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="428.5" y="270">値が等しい、異なる二添字の順序なし</text><text text-anchor="middle" x="428.5" y="288">の組数</text></g></g><g class="flow-edge distinct-count" data-edge="model:distinct-count:fallback"><title>異なる値の種類数</title><path d="M713 159 V171 C713 203 659 203 659 235 V247"/><path d="M659 285 V315 C659 347 962 347 962 379 V391 V576 C962 608 962 608 962 640 V652 V702 C962 734 962 734 962 766 V778 V958 C962 990 962 990 962 1022 V1034 V1084 C962 1116 588 1116 588 1148 V1160" marker-end="url(#arrow-partition-equal-value-pairs)"/><g class="flow-edge-label" data-edge-label="model:distinct-count:fallback" tabindex="0" role="group" aria-label="選択肢：異なる値の種類数"><rect x="595" y="247" width="128" height="38" rx="5"/><text text-anchor="middle" x="659" y="270">異なる値の種類数</text></g></g><g class="flow-edge arbitrary" d