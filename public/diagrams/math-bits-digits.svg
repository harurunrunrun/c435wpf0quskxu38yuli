<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-math-bits-digits flow-desc-math-bits-digits" width="2260" height="1315" viewBox="0 0 2260 1315" data-flow-svg="math-bits-digits"><title id="flow-title-math-bits-digits">桁や AND・OR・XOR の条件の解法フローチャート</title><desc id="flow-desc-math-bits-digits">整数の桁の条件、XORで作れる値、ビット演算の合計や等式を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-math-bits-digits" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge xor" data-edge="number-task:xor:xor"><title>XOR で作れる値・順位</title><path d="M1130.857 141 V153 C1130.857 185 192 185 192 217 V229"/><path d="M192 267 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-math-bits-digits)"/><g class="flow-edge-label" data-edge-label="number-task:xor:xor" tabindex="0" role="group" aria-label="選択肢：XOR で作れる値・順位"><rect x="102" y="229" width="180" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">XOR で作れる値・順位</text></g></g><g class="flow-edge pair-bits" data-edge="number-task:pair-bits:bit-contribution"><title>すべての組の AND・OR・XOR の合計</title><path d="M1170.857 141 V153 C1170.857 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-math-bits-digits)"/><g class="flow-edge-label" data-edge-label="number-task:pair-bits:bit-contribution" tabindex="0" role="group" aria-label="選択肢：すべての組の AND・OR・XOR の合計"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">すべての組の AND・OR・XOR</text><text text-anchor="middle" x="556" y="270"> の合計</text></g></g><g class="flow-edge xor-segments" data-edge="number-task:xor-segments:xor-segment"><title>連続区間の XOR が指定値になる個数</title><path d="M1210.857 141 V153 C1210.857 185 920 185 920 217 V229"/><path d="M920 285 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-math-bits-digits)"/><g class="flow-edge-label" data-edge-label="number-task:xor-segments:xor-segment" tabindex="0" role="group" aria-label="選択肢：連続区間の XOR が指定値になる個数"><rect x="797.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="252">連続区間の XOR が指定値になる</text><text text-anchor="middle" x="920" y="270">個数</text></g></g><g class="flow-edge digits" data-edge="number-task:digits:digits"><title>桁ごとの整数の条件</title><path d="M1250.857 141 V153 C1250.857 185 1284 185 1284 217 V229"/><path d="M1284 267 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-math-bits-digits)"/><g class="flow-edge-label" data-edge-label="number-task:digits:digits" tabindex="0" role="group" aria-label="選択肢：桁ごとの整数の条件"><rect x="1213.5" y="229" width="141" height="38" rx="5"/><text text-anchor="middle" x="1284" y="252">桁ごとの整数の条件</text></g></g><g class="flow-edge bit-constraints" data-edge="number-task:bit-constraints:bit-constraints-route"><title>AND・OR・XOR の等式を満たす整数や列の構築・個数・最適値</title><path d="M1290.857 141 V153 C1290.857 185 1648 185 1648 217 V229"/><path d="M1648 285 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-math-bits-digits)"/><g class="flow-edge-label" data-edge-label="number-task:bit-constraints:bit-constraints-route" tabindex="0" role="group" aria-label="選択肢：AND・OR・XOR の等式を満たす整数や列の構築・個数・最適値"><rect x="1525.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="252">AND・OR・XOR の等式を満た</text><text text-anchor="middle" x="1648" y="270">す整数や列の構築・個数・最適値</text></g></g><g class="flow-edge two-mark-distance-circuit" data-edge="number-task:two-mark-distance-circuit:two-mark-distance-circuit-route"><title>二つの黒画素の距離を、画像を読む前に作った論理回路で判定する</title><path d="M1330.857 141 V153 C1330.857 185 1972.5 185 1972.5 217 V229"/><path d="M1972.5 285 V297 C1972.5 329 2012 329 2012 361 V373" marker-end="url(#arrow-math-bits-digits)"/><g class="flow-edge-label" data-edge-label="number-task:two-mark-distance-circuit:two-mark-distance-circuit-route" tabindex=