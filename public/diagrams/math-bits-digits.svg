" rx="5"/><text text-anchor="middle" x="1746.5" y="641">わからない</text></g></g><g class="flow-edge yes" data-edge="xor-segment:yes:xor-segment-result"><title>はい</title><path d="M840 523 V542 C840 574 1875 574 1875 606 V618"/><path d="M1875 656 V668 C1875 700 1329.556 700 1329.556 732 V744" marker-end="url(#arrow-math-bits-digits)"/><g class="flow-edge-label" data-edge-label="xor-segment:yes:xor-segment-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1835" y="618" width="80" height="38" rx="5"/><text text-anchor="middle" x="1875" y="641">はい</text></g></g><g class="flow-edge no" data-edge="xor-segment:no:fallback"><title>いいえ</title><path d="M920 523 V542 C920 574 1999 574 1999 606 V618"/><path d="M1999 656 V668 C1999 700 1539.556 700 1539.556 732 V744 V930 C1539.556 962 1175.556 962 1175.556 994 V1006 V1056 C1175.556 1088 1119.556 1088 1119.556 1120 V1132" marker-end="url(#arrow-math-bits-digits)"/><g class="flow-edge-label" data-edge-label="xor-segment:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1959" y="618" width="80" height="38" rx="5"/><text text-anchor="middle" x="1999" y="641">いいえ</text></g></g><g class="flow-edge unknown" data-edge="xor-segment:unknown:check"><title>わからない</title><path d="M1000 523 V542 C1000 574 2127.5 574 2127.5 606 V618"/><path d="M2127.5 656 V668 C2127.5 700 1749.556 700 1749.556 732 V744" marker-end="url(#arrow-math-bits-digits)"/><g class="flow-edge-label" data-edge-label="xor-segment:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2083" y="618" width="89" height="38" rx="5"/><text text-anchor="middle" x="2127.5" y="641">わからない</text></g></g><g class="flow-node question" data-node="number-task"><rect x="1090.857142857143" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="1106.857142857143" y="52">質問</text><text class="node-title" x="1106.857142857143" y="80">整数や式について何を求めますか？</text><text class="node-explanation" x="1106.857142857143" y="107">演算と、値の大きさの制約を選びます。</text></g><g class="flow-node route" data-node="xor"><rect x="32" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">XOR で作れる値と順位</text><text class="node-explanation" x="48" y="448">到達可能な XOR 値を調べる場合と、異なる値を</text><text class="node-explanation" x="48" y="466">小さい順に取り出す場合を区別します。</text><a href="/flowchartcp/flowcharts/#diagram-math-xor-values" data-route="math-xor-values"><text x="48" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="digits"><rect x="1124" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">整数の桁と上限の条件</text><text class="node-explanation" x="1140" y="448">桁の出現条件、桁和の余り、整数の総和、十進区間の</text><text class="node-explanation" x="1140" y="466">可除性を区別します。</text><a href="/flowchartcp/flowcharts/#diagram-math-digit-conditions" data-route="math-digit-conditions"><text x="1140" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1589.5555555555557" y="744" width="320" height="150" rx="7"/><text class="node-kind" x="1605.5555555555557" y="764">質問</text><text class="node-title" x="1605.5555555555557" y="792">答えは「個数」「最適値」「存在判</text><text class="node-title" x="1605.5555555555557" y="815">定」のどれか区別できますか？</text><text class="node-explanation" x="1605.5555555555557" y="842">同じ入力でも、求める量によって使う演算が異なりま</text><text class="node-explanation" x="1605.5555555555557" y="860">す。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1434.9166666666667" y="1132" width="320" height="139" rx="7"/><text class="node-kind" x="1450.9166666666667" y="1152">分野</text><text class="node-title" x="1450.9166666666667" y="1180">条件を確かめる</text><text class="node-explanation" x="1450.9166666666667" y="1207">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1450.9166666666667" y="1235">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="959.5555555555557" y="1132" width="320" height="151" rx="7"/><text class="node-kind" x="975.5555555555557" y="1152">候補</text><text class="node-title" x="975.5555555555557" y="1180">求める量を式にする</text><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="975.5555555555557" y="1219">寄与の数え上げ</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="975.5555555555557" y="1243">状態の設計</text></a></g><g class="flow-node question" data-node="bit-contribution"><rect x="396" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="393">質問</text><text class="node-title" x="412" y="421">各ビットの答えを、0 と 1 の個</text><text class="node-title" x="412" y="444">数から独立に数えられますか？</text><text class="node-explanation" x="412" y="471">桁上がりがない演算なら、各ビットの寄与を最後に足</text><text class="node-explanation" x="412" y="489">せます。</text></g><g class="flow-node question" data-node="xor-segment"><rect x="760" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="393">質問</text><text class="node-title" x="776" y="421">区間の XOR を、二つの接頭辞 </text><text class="node-title" x="776" y="444">XOR の差として表せますか？</text><text class="node-explanation" x="776" y="471">prefix[r]^prefix[l] が指定値</text><text class="node-explanation" x="776" y="489">になる過去の接頭辞を数えます。</text></g><g class="flow-node result" data-node="bit-result"><rect x="396" y="744" width="320" height="174" rx="7"/><text class="node-kind" x="412" y="764">候補</text><text class="node-title" x="412" y="792">各ビットの 0・1 の個数で寄与を</text><text class="node-title" x="412" y="815">数える</text><a href="/flowchartcp/techniques/bitwise-contribution/"><title>全ての組の XOR の和をビットごとに数えるの記事へ</title><text x="412" y="854">全ての組の XOR の和をビットごとに数える</text></a><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="412" y="878">寄与の数え上げ</text></a></g><g class="flow-node result" data-node="xor-segment-result"><rect x="1169.5555555555557" y="744" width="320" height="145" rx="7"/><text class="node-kind" x="1185.5555555555557" y="764">候補</text><text class="node-title" x="1185.5555555555557" y="792">接頭辞 XOR の出現回数を数える</text><a href="/flowchartcp/techniques/xor-prefix-count/"><title>区間 XOR が K となる個数を接頭 XOR の頻度で数えるの記事へ</title><text x="1185.5555555555557" y="831">区間 XOR が K となる個数を接頭 XOR</text><text x="1185.5555555555557" y="849"> の頻度で数える</text></a></g><g class="flow-node route" data-node="bit-constraints-route"><rect x="1488" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">AND・OR・XOR の等式を満た</text><text class="node-title" x="1504" y="444">す整数や列の構築・個数・最適値</text><a href="/flowchartcp/flowcharts/#diagram-bit-constraint-features" data-route="bit-constraint-features"><text x="1504" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="two-mark-distance-circuit-route"><rect x="1852" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="393">分野</text><text class="node-title" x="1868" y="421">二つの黒画素の距離を、画像を読む前</text><text class="node-title" x="1868" y="444">に作った論理回路で判定する</text><a href="/flowchartcp/flowcharts/#diagram-two-mark-manhattan-circuit-conditions" data-route="two-mark-manhattan-circuit-conditions"><text x="1868" y="481">詳細の質問・図へ →</text></a></g></svg>