<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-string-substring-distinct-goals flow-desc-string-substring-distinct-goals" width="1840" height="1378" viewBox="0 0 1840 1378" data-flow-svg="string-substring-distinct-goals"><title id="flow-title-string-substring-distinct-goals">部分文字列の種類と繰り返しの解法フローチャート</title><desc id="flow-desc-string-substring-distinct-goals">異なる部分文字列の総数と長さ別の個数、二回以上現れる最長の部分文字列を求めます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-string-substring-distinct-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge distinct-static" data-edge="append:distinct-static:distinct-lcp-check"><title>固定された文字列の、異なる部分文字列の個数</title><path d="M1134.125 182 V194 C1134.125 226 654.5 226 654.5 258 V270"/><path d="M654.5 326 V338 C654.5 370 654.5 370 654.5 402 V414" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="append:distinct-static:distinct-lcp-check" tabindex="0" role="group" aria-label="選択肢：固定された文字列の、異なる部分文字列の個数"><rect x="532" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="654.5" y="293">固定された文字列の、異なる部分文字</text><text text-anchor="middle" x="654.5" y="311">列の個数</text></g></g><g class="flow-edge repeated" data-edge="append:repeated:repeat-overlap"><title>二回以上現れる最長の部分文字列</title><path d="M1198.125 182 V194 C1198.125 226 1202.5 226 1202.5 258 V270"/><path d="M1202.5 308 V338 C1202.5 370 1202.5 370 1202.5 402 V414" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="append:repeated:repeat-overlap" tabindex="0" role="group" aria-label="選択肢：二回以上現れる最長の部分文字列"><rect x="1093" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="1202.5" y="293">二回以上現れる最長の部分文字列</text></g></g><g class="flow-edge length-distribution" data-edge="append:length-distribution:length-interval-check"><title>異なる部分文字列の個数を、全ての長さ別に求める</title><path d="M1326.125 182 V194 C1326.125 226 1642.5 226 1642.5 258 V270"/><path d="M1642.5 326 V338 C1642.5 370 1642.5 370 1642.5 402 V414" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="append:length-distribution:length-interval-check" tabindex="0" role="group" aria-label="選択肢：異なる部分文字列の個数を、全ての長さ別に求める"><rect x="1520" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1642.5" y="293">異なる部分文字列の個数を、全ての長</text><text text-anchor="middle" x="1642.5" y="311">さ別に求める</text></g></g><g class="flow-edge unknown" data-edge="append:unknown:check"><title>わからない</title><path d="M1262.125 182 V194 C1262.125 226 1421 226 1421 258 V270"/><path d="M1421 308 V338 C1421 370 1421 370 1421 402 V414 V599 C1421 631 1421 631 1421 663 V675 V725 C1421 757 952 757 952 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="append:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1376.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1421" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:sam"><title>はい</title><path d="M840 951 V1005 C840 1037 920 1037 920 1069 V1081"/><path d="M920 1119 V1131 C920 1163 920 1163 920 1195 V1207" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="check:yes:sam" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="1081" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1104">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 951 V1005 C920 1037 1284 1037 1284 1069 V1081"/><path d="M1284 1119 V1131 C1284 1163 1230.667 1163 1230.667 1195 V1207" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1244" y="1081" width="80" height="38" rx="5"/><text text-anchor="middle" x="1284" y="1104">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 951 V1005 C1000 1037 1412.5 1037 1412.5 1069 V1081"/><path d="M1412.5 1119 V1131 C1412.5 1163 1337.333 1163 1337.333 1195 V1207" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1368" y="1081" width="89" height="38" rx="5"/><text text-anchor="middle" x="1412.5" y="1104">わからない</text></g></g><g class="flow-edge yes" data-edge="distinct-lcp-check:yes:distinct-lcp-result"><title>はい</title><path d="M574.5 587 V599 C574.5 631 192 631 192 663 V675"/><path d="M192 713 V725 C192 757 192 757 192 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="distinct-lcp-check:yes:distinct-lcp-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="698">はい</text></g></g><g class="flow-edge no" data-edge="distinct-lcp-check:no:fallback"><title>いいえ</title><path d="M734.5 587 V599 C734.5 631 950 631 950 663 V675"/><path d="M950 713 V725 C950 757 1204 757 1204 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="distinct-lcp-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="910" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="950" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="distinct-lcp-check:unknown:check"><title>わからない</title><path d="M654.5 587 V599 C654.5 631 821.5 631 821.5 663 V675"/><path d="M821.5 713 V725 C821.5 757 824 757 824 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="distinct-lcp-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="777" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="821.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="repeat-overlap:yes:repeat-result"><title>はい</title><path d="M1122.5 559 V599 C1122.5 631 1074 631 1074 663 V675"/><path d="M1074 713 V725 C1074 757 556 757 556 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="repeat-overlap:yes:repeat-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1034" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="1074" y="698">はい</text></g></g><g class="flow-edge no" data-edge="repeat-overlap:no:fallback"><title>いいえ</title><path d="M1282.5 559 V599 C1282.5 631 1331 631 1331 663 V675"/><path d="M1331 713 V725 C1331 757 1284 757 1284 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="repeat-overlap:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1291" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="1331" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="repeat-overlap:unknown:check"><title>わからない</title><path d="M1202.5 559 V599 C1202.5 631 1202.5 631 1202.5 663 V675"/><path d="M1202.5 713 V725 C1202.5 757 888 757 888 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="repeat-overlap:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1158" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="1202.5" y="698">わからない</text></g></g><g class="flow-edge yes" data-edge="length-interval-check:yes:length-distribution-result"><title>はい</title><path d="M1722.5 582 V599 C1722.5 631 1768 631 1768 663 V675"/><path d="M1768 713 V725 C1768 757 1648 757 1648 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="length-interval-check:yes:length-distribution-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1728" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="1768" y="698">はい</text></g></g><g class="flow-edge no" data-edge="length-interval-check:no:fallback"><title>いいえ</title><path d="M1642.5 582 V599 C1642.5 631 1644 631 1644 663 V675"/><path d="M1644 713 V725 C1644 757 1364 757 1364 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="length-interval-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1604" y="675" width="80" height="38" rx="5"/><text text-anchor="middle" x="1644" y="698">いいえ</text></g></g><g class="flow-edge unknown" data-edge="length-interval-check:unknown:check"><title>わからない</title><path d="M1562.5 582 V599 C1562.5 631 1515.5 631 1515.5 663 V675"/><path d="M1515.5 713 V725 C1515.5 757 1016 757 1016 789 V801" marker-end="url(#arrow-string-substring-distinct-goals)"/><g class="flow-edge-label" data-edge-label="length-interval-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1471" y="675" width="89" height="38" rx="5"/><text text-anchor="middle" x="1515.5" y="698">わからない</text></g></g><g class="flow-node question" data-node="append"><rect x="1070.125" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1086.125" y="52">質問</text><text class="node-title" x="1086.125" y="80">種類・長さ・繰り返しの、どの量が必</text><text class="node-title" x="1086.125" y="103">要ですか？</text><text class="node-explanation" x="1086.125" y="130">同じ文字列を一種類と数えるか、異なる位置の繰り返</text><text class="node-explanation" x="1086.125" y="148">しを調べるかを区別します。</text></g><g class="flow-node question" data-node="check"><rect x="760" y="801" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="821">質問</text><text class="node-title" x="776" y="849">二つの部分文字列が同じとき、出現位</text><text class="node-title" x="776" y="872">置や後続の扱いも共通ですか？</text><text class="node-explanation" x="776" y="899">何を一状態にまとめるかを確認し、必要なら出現集合</text><text class="node-explanation" x="776" y="917">の同値性を使います。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="1207" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="1227">分野</text><text class="node-title" x="1140" y="1255">条件を確かめる</text><text class="node-explanation" x="1140" y="1282">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="1310">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="sam"><rect x="760" y="1207" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="1227">候補</text><text class="node-title" x="776" y="1255">接尾辞オートマトン</text><a href="/flowchartcp/techniques/suffix-automaton/"><title>接尾辞オートマトンの記事へ</title><text x="776" y="1294">接尾辞オートマトン</text></a></g><g class="flow-node result" data-node="fallback"><rect x="1124" y="801" width="320" height="151" rx="7"/><text class="node-kind" x="1140" y="821">候補</text><text class="node-title" x="1140" y="849">部分文字列を何で区別するか決める</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1140" y="888">状態の設計</text></a><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="1140" y="912">寄与の数え上げ</text></a></g><g class="flow-node question" data-node="distinct-lcp-check"><rect x="494.5" y="414" width="320" height="173" rx="7"/><text class="node-kind" x="510.5" y="434">質問</text><text class="node-title" x="510.5" y="462">隣り合う接尾辞と共通する接頭辞は、</text><text class="node-title" x="510.5" y="485">すでに数えた部分文字列とみなせます</text><text class="node-title" x="510.5" y="508">か？</text><text class="node-explanation" x="510.5" y="535">辞書順で前の接尾辞と重なる長さを引き、残りの接頭</text><text class="node-explanation" x="510.5" y="553">辞だけを新しく数えます。</text></g><g class="flow-node result" data-node="distinct-lcp-result"><rect x="32" y="801" width="320" height="192" rx="7"/><text class="node-kind" x="48" y="821">候補</text><text class="node-title" x="48" y="849">各接尾辞の長さから、隣の共通接頭辞</text><text class="node-title" x="48" y="872">長を引く</text><a href="/flowchartcp/techniques/lcp-distinct-substrings/"><title>異なる部分文字列を、直前の接尾辞との差だけ数えるの記事へ</title><text x="48" y="911">異なる部分文字列を、直前の接尾辞との差だけ数え</text><text x="48" y="929">る</text></a><a href="/flowchartcp/techniques/suffix-array/"><title>接尾辞配列・LCP配列の記事へ</title><text x="48" y="953">接尾辞配列・LCP配列</text></a></g><g class="flow-node question" data-node="repeat-overlap"><rect x="1042.5" y="414" width="320" height="145" rx="7"/><text class="node-kind" x="1058.5" y="434">質問</text><text class="node-title" x="1058.5" y="462">二つの出現が重なってもよいですか？</text><text class="node-explanation" x="1058.5" y="489">重なりを許す場合は隣り合う接尾辞の共通接頭辞長の</text><text class="node-explanation" x="1058.5" y="507">最大値で足ります。重なり禁止では出現位置の間隔も</text><text class="node-explanation" x="1058.5" y="525">必要です。</text></g><g class="flow-node result" data-node="repeat-result"><rect x="396" y="801" width="320" height="192" rx="7"/><text class="node-kind" x="412" y="821">候補</text><text class="node-title" x="412" y="849">隣り合う接尾辞の共通接頭辞長を最大</text><text class="node-title" x="412" y="872">にする</text><a href="/flowchartcp/techniques/lcp-repeated-substring/"><title>同じ部分文字列が K 回現れる条件を LCP の区間最小値にするの記事へ</title><text x="412" y="911">同じ部分文字列が K 回現れる条件を LCP </text><text x="412" y="929">の区間最小値にする</text></a><a href="/flowchartcp/techniques/suffix-array/"><title>接尾辞配列・LCP配列の記事へ</title><text x="412" y="953">接尾辞配列・LCP配列</text></a></g><g class="flow-node question" data-node="length-interval-check"><rect x="1482.5" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="1498.5" y="434">質問</text><text class="node-title" x="1498.5" y="462">本文は固定で、同じ文字列は出現位置</text><text class="node-title" x="1498.5" y="485">が違っても一種類と数えますか？</text><text class="node-explanation" x="1498.5" y="512">長さ 1..n ごとの種類数を求めます。同じ出現</text><text class="node-explanation" x="1498.5" y="530">位置集合を持つ列をまとめると、一状態の寄与は連続</text><text class="node-explanation" x="1498.5" y="548">する長さの範囲になり、範囲への加算として集計で…</text></g><g class="flow-node result" data-node="length-distribution-result"><rect x="1488" y="801" width="320" height="192" rx="7"/><text class="node-kind" x="1504" y="821">候補</text><text class="node-title" x="1504" y="849">状態ごとの長さの範囲に一を足し、全</text><text class="node-title" x="1504" y="872">ての長さの種類数を求める</text><a href="/flowchartcp/techniques/sam-length-distribution/"><title>異なる部分文字列を、状態が受け持つ長さの区間へ一つずつ足すの記事へ</title><text x="1504" y="911">異なる部分文字列を、状態が受け持つ長さの区間へ</text><text x="1504" y="929">一つずつ足す</text></a><a href="/flowchartcp/techniques/suffix-automaton/"><title>接尾辞オートマトンの記事へ</title><text x="1504" y="953">接尾辞オートマトン</text></a></g></svg>