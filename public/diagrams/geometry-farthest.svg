<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-geometry-farthest flow-desc-geometry-farthest" width="860" height="1419" viewBox="0 0 860 1419" data-flow-svg="geometry-farthest"><title id="flow-title-geometry-farthest">最も遠い二点の距離の解法フローチャート</title><desc id="flow-desc-geometry-farthest">凸包へ絞り、反対側の支持点を進めます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-geometry-farthest" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="diameter-hull:yes:diameter-support"><title>はい</title><path d="M539.722 205 V217 C539.722 249 420.667 249 420.667 281 V293"/><path d="M420.667 331 V343 C420.667 375 420.667 375 420.667 407 V419" marker-end="url(#arrow-geometry-farthest)"/><g class="flow-edge-label" data-edge-label="diameter-hull:yes:diameter-support" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="316">はい</text></g></g><g class="flow-edge no" data-edge="diameter-hull:no:fallback"><title>いいえ</title><path d="M619.722 205 V217 C619.722 249 655 249 655 281 V293"/><path d="M655 331 V343 C655 375 762.5 375 762.5 407 V419 V604 C762.5 636 762.5 636 762.5 668 V680 V730 C762.5 762 458 762 458 794 V806 V1034 C458 1066 360 1066 360 1098 V1110 V1160 C360 1192 304 1192 304 1224 V1236" marker-end="url(#arrow-geometry-farthest)"/><g class="flow-edge-label" data-edge-label="diameter-hull:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="diameter-hull:unknown:check"><title>わからない</title><path d="M699.722 205 V217 C699.722 249 783.5 249 783.5 281 V293"/><path d="M783.5 331 V343 C783.5 375 818.5 375 818.5 407 V419 V604 C818.5 636 818.5 636 818.5 668 V680 V730 C818.5 762 721.333 762 721.333 794 V806" marker-end="url(#arrow-geometry-farthest)"/><g class="flow-edge-label" data-edge-label="diameter-hull:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="diameter-support:yes:diameter-result"><title>はい</title><path d="M340.667 592 V604 C340.667 636 192 636 192 668 V680"/><path d="M192 718 V730 C192 762 192 762 192 794 V806" marker-end="url(#arrow-geometry-farthest)"/><g class="flow-edge-label" data-edge-label="diameter-support:yes:diameter-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="703">はい</text></g></g><g class="flow-edge no" data-edge="diameter-support:no:fallback"><title>いいえ</title><path d="M420.667 592 V604 C420.667 636 402 636 402 668 V680"/><path d="M402 718 V730 C402 762 402 762 402 794 V806 V1034 C402 1066 304 1066 304 1098 V1110 V1160 C304 1192 224 1192 224 1224 V1236" marker-end="url(#arrow-geometry-farthest)"/><g class="flow-edge-label" data-edge-label="diameter-support:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="703">いいえ</text></g></g><g class="flow-edge unknown" data-edge="diameter-support:unknown:check"><title>わからない</title><path d="M500.667 592 V604 C500.667 636 668 636 668 668 V680"/><path d="M668 718 V730 C668 762 614.667 762 614.667 794 V806" marker-end="url(#arrow-geometry-farthest)"/><g class="flow-edge-label" data-edge-label="diameter-support:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="680" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="703">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 961 V1034 C588 1066 450 1066 450 1098 V1110"/><path d="M450 1148 V1160 C450 1192 384 1192 384 1224 V1236" marker-end="url(#arrow-geometry-farthest)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1110" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1133">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 961 V1034 C668 1066 655 1066 655 1098 V1110"/><path d="M655 1148 V1160 C655 1192 614.667 1192 614.667 1224 V1236" marker-end="url(#arrow-geometry-farthest)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1110" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1133">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 961 V1034 C748 1066 783.5 1066 783.5 1098 V1110"/><path d="M783.5 1148 V1160 C783.5 1192 721.333 1192 721.333 1224 V1236" marker-end="url(#arrow-geometry-farthest)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1110" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1133">わからない</text></g></g><g class="flow-node question" data-node="diameter-hull"><rect x="459.7222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">ユークリッド距離の最遠二点は外周に</text><text class="node-title" x="475.7222222222223" y="103">あるので、内側の点を捨てられます</text><text class="node-title" x="475.7222222222223" y="126">か？</text><text class="node-explanation" x="475.7222222222223" y="153">原点や境界の特殊位置を仮定しません。重複・全共線</text><text class="node-explanation" x="475.7222222222223" y="171">なら、外周の点数 1・2 も別に扱います。</text></g><g class="flow-node question" data-node="diameter-support"><rect x="260.6666666666667" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="276.6666666666667" y="439">質問</text><text class="node-title" x="276.6666666666667" y="467">外周を周回する順にすると、各辺から</text><text class="node-title" x="276.6666666666667" y="490">最も離れる支持点が後戻りしません</text><text class="node-title" x="276.6666666666667" y="513">か？</text><text class="node-explanation" x="276.6666666666667" y="540">共線の辺を整理した凸包で、反対側の点を進め、両端</text><text class="node-explanation" x="276.6666666666667" y="558">の距離を比較します。</text></g><g class="flow-node result" data-node="diameter-result"><rect x="32" y="806" width="320" height="216" rx="7"/><text class="node-kind" x="48" y="826">候補</text><text class="node-title" x="48" y="854">凸包の辺に対する反対側の支持点を進</text><text class="node-title" x="48" y="877">め、最遠対を比べる</text><a href="/flowchartcp/techniques/convex-diameter-calipers/"><title>最も遠い二点を凸包に絞り、向かい合う頂点を一周させるの記事へ</title><text x="48" y="916">最も遠い二点を凸包に絞り、向かい合う頂点を一周</text><text x="48" y="934">させる</text></a><a href="/flowchartcp/techniques/convex-hull/"><title>凸包の記事へ</title><text x="48" y="958">凸包</text></a><a href="/flowchartcp/techniques/rotating-calipers/"><title>回転キャリパーの記事へ</title><text x="48" y="982">回転キャリパー</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="806" width="320" height="155" rx="7"/><text class="node-kind" x="524" y="826">質問</text><text class="node-title" x="524" y="854">座標の範囲、境界、重複、共線の場合</text><text class="node-title" x="524" y="877">を問題文と小さい例で確認できます</text><text class="node-title" x="524" y="900">か？</text><text class="node-explanation" x="524" y="927">保証される形と、必要な幾何の性質を区別します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1236" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1256">候補</text><text class="node-title" x="160" y="1284">入力の形と退化する場合を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1323">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1347">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1236" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1256">分野</text><text class="node-title" x="524" y="1284">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1321">詳細の質問・図へ →</text></a></g></svg>