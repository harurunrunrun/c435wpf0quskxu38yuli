<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-math-counting-totals flow-desc-math-counting-totals" width="1532" height="1707" viewBox="0 0 1532 1707" data-flow-svg="math-counting-totals"><title id="flow-title-math-counting-totals">組合せ・式の係数・割り算の総和の解法フローチャート</title><desc id="flow-desc-math-counting-totals">選び方の個数、式の積や係数、床を含む多数の項の総和を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-math-counting-totals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge count" data-edge="number-task:count:combinatorics-route"><title>組合せや配置の個数</title><path d="M768.233 141 V153 C768.233 185 192 185 192 217 V229"/><path d="M192 267 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="number-task:count:combinatorics-route" tabindex="0" role="group" aria-label="選択肢：組合せや配置の個数"><rect x="121.5" y="229" width="141" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">組合せや配置の個数</text></g></g><g class="flow-edge quotients" data-edge="number-task:quotients:quotient-check"><title>floor(N/i) を多数の i について集計</title><path d="M821.567 141 V153 C821.567 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="number-task:quotients:quotient-check" tabindex="0" role="group" aria-label="選択肢：floor(N/i) を多数の i について集計"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">floor(N/i) を多数の i</text><text text-anchor="middle" x="556" y="270"> について集計</text></g></g><g class="flow-edge poly" data-edge="number-task:poly:polynomial"><title>積の集計・多項式・線形漸化式</title><path d="M874.9 141 V153 C874.9 185 920 185 920 217 V229"/><path d="M920 267 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="number-task:poly:polynomial" tabindex="0" role="group" aria-label="選択肢：積の集計・多項式・線形漸化式"><rect x="817" y="229" width="206" height="38" rx="5"/><text text-anchor="middle" x="920" y="252">積の集計・多項式・線形漸化式</text></g></g><g class="flow-edge linear-floor-sum" data-edge="number-task:linear-floor-sum:linear-floor-positive"><title>floor((ai+b)/m) の、多数の i に対する総和</title><path d="M928.233 141 V153 C928.233 185 1251 185 1251 217 V229"/><path d="M1251 285 V297 C1251 329 1284 329 1284 361 V373" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="number-task:linear-floor-sum:linear-floor-positive" tabindex="0" role="group" aria-label="選択肢：floor((ai+b)/m) の、多数の i に対する総和"><rect x="1135" y="229" width="232" height="56" rx="5"/><text text-anchor="middle" x="1251" y="252">floor((ai+b)/m) </text><text text-anchor="middle" x="1251" y="270">の、多数の i に対する総和</text></g></g><g class="flow-edge unknown" data-edge="number-task:unknown:check"><title>わからない</title><path d="M981.567 141 V153 C981.567 185 1455.5 185 1455.5 217 V229"/><path d="M1455.5 267 V297 C1455.5 329 1494 329 1494 361 V373 V535 C1494 567 1494 567 1494 599 V611 V661 C1494 693 1494 693 1494 725 V737 V940 C1494 972 1494 972 1494 1004 V1016 V1066 C1494 1098 1436 1098 1436 1130 V1142" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="number-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1411" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1455.5" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1260 1292 V1322 C1260 1354 1122 1354 1122 1386 V1398"/><path d="M1122 1436 V1448 C1122 1480 1008 1480 1008 1512 V1524" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1082" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="1122" y="1421">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1340 1292 V1322 C1340 1354 1327 1354 1327 1386 V1398"/><path d="M1327 1436 V1448 C1327 1480 1286.667 1480 1286.667 1512 V1524" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1287" y="1398" width="80" height="38" rx="5"/><text text-anchor="middle" x="1327" y="1421">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1420 1292 V1322 C1420 1354 1455.5 1354 1455.5 1386 V1398"/><path d="M1455.5 1436 V1448 C1455.5 1480 1393.333 1480 1393.333 1512 V1524" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1411" y="1398" width="89" height="38" rx="5"/><text text-anchor="middle" x="1455.5" y="1421">わからない</text></g></g><g class="flow-edge yes" data-edge="quotient-check:yes:quotient-result"><title>はい</title><path d="M476 523 V535 C476 567 556 567 556 599 V611"/><path d="M556 649 V661 C556 693 556 693 556 725 V737" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="quotient-check:yes:quotient-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="634">はい</text></g></g><g class="flow-edge no" data-edge="quotient-check:no:fallback"><title>いいえ</title><path d="M556 523 V535 C556 567 766 567 766 599 V611"/><path d="M766 649 V661 C766 693 766 693 766 725 V737 V940 C766 972 654 972 654 1004 V1016 V1066 C654 1098 654 1098 654 1130 V1142 V1322 C654 1354 976 1354 976 1386 V1398 V1448 C976 1480 880 1480 880 1512 V1524" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="quotient-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="726" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="766" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="quotient-check:unknown:check"><title>わからない</title><path d="M636 523 V535 C636 567 1266.5 567 1266.5 599 V611"/><path d="M1266.5 649 V661 C1266.5 693 1359.833 693 1359.833 725 V737 V940 C1359.833 972 1249 972 1249 1004 V1016 V1066 C1249 1098 1244 1098 1244 1130 V1142" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="quotient-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1222" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="1266.5" y="634">わからない</text></g></g><g class="flow-edge yes" data-edge="linear-floor-positive:yes:linear-floor-swap"><title>はい</title><path d="M1204 523 V535 C1204 567 1014 567 1014 599 V611"/><path d="M1014 649 V661 C1014 693 1093.833 693 1093.833 725 V737" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="linear-floor-positive:yes:linear-floor-swap" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="974" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="1014" y="634">はい</text></g></g><g class="flow-edge no" data-edge="linear-floor-positive:no:fallback"><title>いいえ</title><path d="M1284 523 V535 C1284 567 1138 567 1138 599 V611"/><path d="M1138 649 V661 C1138 693 1303.833 693 1303.833 725 V737 V940 C1303.833 972 1164 972 1164 1004 V1016 V1066 C1164 1098 1130 1098 1130 1130 V1142 V1322 C1130 1354 1212 1354 1212 1386 V1398 V1448 C1212 1480 1072 1480 1072 1512 V1524" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="linear-floor-positive:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1098" y="611" width="80" height="38" rx="5"/><text text-anchor="middle" x="1138" y="634">いいえ</text></g></g><g class="flow-edge unknown" data-edge="linear-floor-positive:unknown:check"><title>わからない</title><path d="M1364 523 V535 C1364 567 1399.5 567 1399.5 599 V611"/><path d="M1399.5 649 V661 C1399.5 693 1438 693 1438 725 V737 V940 C1438 972 1438 972 1438 1004 V1016 V1066 C1438 1098 1372 1098 1372 1130 V1142" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="linear-floor-positive:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="611" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="634">わからない</text></g></g><g class="flow-edge yes" data-edge="linear-floor-swap:yes:linear-floor-result"><title>はい</title><path d="M1013.833 928 V940 C1013.833 972 864 972 864 1004 V1016"/><path d="M864 1054 V1066 C864 1098 864 1098 864 1130 V1142" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="linear-floor-swap:yes:linear-floor-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="824" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="864" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="linear-floor-swap:no:fallback"><title>いいえ</title><path d="M1093.833 928 V940 C1093.833 972 1074 972 1074 1004 V1016"/><path d="M1074 1054 V1066 C1074 1098 1074 1098 1074 1130 V1142 V1322 C1074 1354 1032 1354 1032 1386 V1398 V1448 C1032 1480 944 1480 944 1512 V1524" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="linear-floor-swap:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1034" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="1074" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="linear-floor-swap:unknown:check"><title>わからない</title><path d="M1173.833 928 V940 C1173.833 972 1343.5 972 1343.5 1004 V1016"/><path d="M1343.5 1054 V1066 C1343.5 1098 1308 1098 1308 1130 V1142" marker-end="url(#arrow-math-counting-totals)"/><g class="flow-edge-label" data-edge-label="linear-floor-swap:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1299" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="1343.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="number-task"><rect x="714.9" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="730.9" y="52">質問</text><text class="node-title" x="730.9" y="80">整数や式について何を求めますか？</text><text class="node-explanation" x="730.9" y="107">演算と、値の大きさの制約を選びます。</text></g><g class="flow-node route" data-node="polynomial"><rect x="760" y="373" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">式の積・変換の条件</text><text class="node-explanation" x="776" y="448">多項式の積や繰り返す変換で表せるかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-math-expression-conditions" data-route="math-expression-conditions"><text x="776" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1180" y="1142" width="320" height="150" rx="7"/><text class="node-kind" x="1196" y="1162">質問</text><text class="node-title" x="1196" y="1190">答えは「個数」「最適値」「存在判</text><text class="node-title" x="1196" y="1213">定」のどれか区別できますか？</text><text class="node-explanation" x="1196" y="1240">同じ入力でも、求める量によって使う演算が異なりま</text><text class="node-explanation" x="1196" y="1258">す。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1180" y="1524" width="320" height="139" rx="7"/><text class="node-kind" x="1196" y="1544">分野</text><text class="node-title" x="1196" y="1572">条件を確かめる</text><text class="node-explanation" x="1196" y="1599">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1196" y="1627">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="combinatorics-route"><rect x="32" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">対象と数え方</text><a href="/flowchartcp/flowcharts/#diagram-combinatorics" data-route="combinatorics"><text x="48" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="816" y="1524" width="320" height="151" rx="7"/><text class="node-kind" x="832" y="1544">候補</text><text class="node-title" x="832" y="1572">求める量を式にする</text><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="832" y="1611">寄与の数え上げ</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="832" y="1635">状態の設計</text></a></g><g class="flow-node question" data-node="quotient-check"><rect x="396" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="393">質問</text><text class="node-title" x="412" y="421">floor(N/i) が同じになる</text><text class="node-title" x="412" y="444"> i の区間をまとめられますか？</text><text class="node-explanation" x="412" y="471">現在の商 q に対して、右端は floor</text><text class="node-explanation" x="412" y="489">(N/q) までです。</text></g><g class="flow-node result" data-node="quotient-result"><rect x="396" y="737" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="757">候補</text><text class="node-title" x="412" y="785">同じ商になる区間を一度に処理する</text><a href="/flowchartcp/techniques/quotient-blocks/"><title>床関数の商が同じ区間をまとめるの記事へ</title><text x="412" y="824">床関数の商が同じ区間をまとめる</text></a></g><g class="flow-node question" data-node="linear-floor-positive"><rect x="1124" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="393">質問</text><text class="node-title" x="1140" y="421">項数 n は非負、割る数 m は正</text><text class="node-title" x="1140" y="444">ですか？</text><text class="node-explanation" x="1140" y="471">係数 a,b は負でも床関数として扱います。整数</text><text class="node-explanation" x="1140" y="489">除算の負の切り捨て規約と、積の型に注意します。</text></g><g class="flow-node question" data-node="linear-floor-swap"><rect x="933.8333333333333" y="737" width="320" height="191" rx="7"/><text class="node-kind" x="949.8333333333333" y="757">質問</text><text class="node-title" x="949.8333333333333" y="785">a,b の整数部分を先に足し、残っ</text><text class="node-title" x="949.8333333333333" y="808">た格子点の数で軸を入れ替えられます</text><text class="node-title" x="949.8333333333333" y="831">か？</text><text class="node-explanation" x="949.8333333333333" y="858">残りを 0≤a,b&lt;m に正規化し、最大高さで行</text><text class="node-explanation" x="949.8333333333333" y="876">と列を交換します。商が減るため、大きい項数を直接</text><text class="node-explanation" x="949.8333333333333" y="894">列挙しません。</text></g><g class="flow-node result" data-node="linear-floor-result"><rect x="704" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="720" y="1162">候補</text><text class="node-title" x="720" y="1190">整数部分を取り出し、格子点の軸を交</text><text class="node-title" x="720" y="1213">換して床関数の和を縮める</text><a href="/flowchartcp/techniques/floor-sum-euclidean/"><title>一次式を割って切り捨てた和を、格子点の縦横を入れ替えて求めるの記事へ</title><text x="720" y="1252">一次式を割って切り捨てた和を、格子点の縦横を入</text><text x="720" y="1270">れ替えて求める</text></a></g></svg>