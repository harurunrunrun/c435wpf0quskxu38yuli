<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-batch-paths flow-desc-tree-batch-paths" width="1224" height="1325" viewBox="0 0 1224 1325" data-flow-svg="tree-batch-paths"><title id="flow-title-tree-batch-paths">指定経路を足した後の通過回数の解法フローチャート</title><desc id="flow-desc-tree-batch-paths">辺と頂点では共通祖先で差し引く位置が異なります。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-batch-paths" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge edge" data-edge="target:edge:offline-edge"><title>辺ごと</title><path d="M768.944 182 V194 C768.944 226 434.833 226 434.833 258 V270"/><path d="M434.833 308 V320 C434.833 352 434.833 352 434.833 384 V396" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="target:edge:offline-edge" tabindex="0" role="group" aria-label="選択肢：辺ごと"><rect x="394.8333333333333" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="434.8333333333333" y="293">辺ごと</text></g></g><g class="flow-edge vertex" data-edge="target:vertex:offline-vertex"><title>両端も含めた頂点ごと</title><path d="M848.944 182 V194 C848.944 226 964.5 226 964.5 258 V270"/><path d="M964.5 308 V320 C964.5 352 964.5 352 964.5 384 V396" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="target:vertex:offline-vertex" tabindex="0" role="group" aria-label="選択肢：両端も含めた頂点ごと"><rect x="887.5" y="270" width="154" height="38" rx="5"/><text text-anchor="middle" x="964.5" y="293">両端も含めた頂点ごと</text></g></g><g class="flow-edge unknown" data-edge="target:unknown:check"><title>わからない</title><path d="M928.944 182 V194 C928.944 226 1147.5 226 1147.5 258 V270"/><path d="M1147.5 308 V320 C1147.5 352 1186 352 1186 384 V396 V558 C1186 590 1186 590 1186 622 V634 V684 C1186 716 1112 716 1112 748 V760" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="target:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1103" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1147.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="offline-edge:yes:edge-result"><title>はい</title><path d="M354.833 546 V558 C354.833 590 192 590 192 622 V634"/><path d="M192 672 V684 C192 716 192 716 192 748 V760" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="offline-edge:yes:edge-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="657">はい</text></g></g><g class="flow-edge no" data-edge="offline-edge:no:fallback"><title>いいえ</title><path d="M434.833 546 V558 C434.833 590 402 590 402 622 V634"/><path d="M402 672 V684 C402 716 402 716 402 748 V760 V940 C402 972 668 972 668 1004 V1016 V1066 C668 1098 588 1098 588 1130 V1142" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="offline-edge:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="offline-edge:unknown:check"><title>わからない</title><path d="M514.833 546 V558 C514.833 590 710.5 590 710.5 622 V634"/><path d="M710.5 672 V684 C710.5 716 952 716 952 748 V760" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="offline-edge:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="666" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="710.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="offline-vertex:yes:vertex-result"><title>はい</title><path d="M884.5 546 V558 C884.5 590 839 590 839 622 V634"/><path d="M839 672 V684 C839 716 612 716 612 748 V760" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="offline-vertex:yes:vertex-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="799" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="839" y="657">はい</text></g></g><g class="flow-edge no" data-edge="offline-vertex:no:fallback"><title>いいえ</title><path d="M964.5 546 V558 C964.5 590 963 590 963 622 V634"/><path d="M963 672 V684 C963 716 822 716 822 748 V760 V940 C822 972 724 972 724 1004 V1016 V1066 C724 1098 668 1098 668 1130 V1142" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="offline-vertex:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="offline-vertex:unknown:check"><title>わからない</title><path d="M1044.5 546 V558 C1044.5 590 1091.5 590 1091.5 622 V634"/><path d="M1091.5 672 V684 C1091.5 716 1032 716 1032 748 V760" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="offline-vertex:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M952 910 V940 C952 972 814 972 814 1004 V1016"/><path d="M814 1054 V1066 C814 1098 748 1098 748 1130 V1142" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="774" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="814" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1032 910 V940 C1032 972 1019 972 1019 1004 V1016"/><path d="M1019 1054 V1066 C1019 1098 978.667 1098 978.667 1130 V1142" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="979" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="1019" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1112 910 V940 C1112 972 1147.5 972 1147.5 1004 V1016"/><path d="M1147.5 1054 V1066 C1147.5 1098 1085.333 1098 1085.333 1130 V1142" marker-end="url(#arrow-tree-batch-paths)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1103" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="1147.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="target"><rect x="688.9444444444443" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="704.9444444444443" y="52">質問</text><text class="node-title" x="704.9444444444443" y="80">通過回数を、どこについて求めます</text><text class="node-title" x="704.9444444444443" y="103">か？</text><text class="node-explanation" x="704.9444444444443" y="130">各経路の両端は指定されています。一頂点だけの経路</text><text class="node-explanation" x="704.9444444444443" y="148">も含めて考えます。</text></g><g class="flow-node question" data-node="offline-edge"><rect x="274.8333333333333" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="290.8333333333333" y="416">質問</text><text class="node-title" x="290.8333333333333" y="444">途中の答えは不要で、全ての経路の加</text><text class="node-title" x="290.8333333333333" y="467">算後だけ答えますか？</text><text class="node-explanation" x="290.8333333333333" y="494">オンラインで途中の辺値を読む場合は、最後の一回の</text><text class="node-explanation" x="290.8333333333333" y="512">累積だけでは足りません。</text></g><g class="flow-node question" data-node="offline-vertex"><rect x="804.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="820.5" y="416">質問</text><text class="node-title" x="820.5" y="444">途中の答えは不要で、全ての経路の加</text><text class="node-title" x="820.5" y="467">算後だけ答えますか？</text><text class="node-explanation" x="820.5" y="494">両端を含めます。共通祖先が根なら、根の親を減算し</text><text class="node-explanation" x="820.5" y="512">ません。</text></g><g class="flow-node result" data-node="edge-result"><rect x="32" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">両端へ足し、共通祖先で二回引いて、</text><text class="node-title" x="48" y="831">子から親へ累積する</text><a href="/flowchartcp/techniques/tree-path-edge-difference/"><title>多数の経路の辺通過回数は、端点とLCAに差分を置いて下から足すの記事へ</title><text x="48" y="870">多数の経路の辺通過回数は、端点とLCAに差分を</text><text x="48" y="888">置いて下から足す</text></a></g><g class="flow-node result" data-node="vertex-result"><rect x="452" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="468" y="780">候補</text><text class="node-title" x="468" y="808">両端へ足し、共通祖先とその親で引い</text><text class="node-title" x="468" y="831">て、子から親へ累積する</text><a href="/flowchartcp/techniques/tree-path-vertex-difference/"><title>多数の経路の頂点通過回数は、LCAとその親で差分を止めるの記事へ</title><text x="468" y="870">多数の経路の頂点通過回数は、LCAとその親で差</text><text x="468" y="888">分を止める</text></a></g><g class="flow-node question" data-node="check"><rect x="872" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="888" y="780">質問</text><text class="node-title" x="888" y="808">必要な条件を、問題文と小さい例から</text><text class="node-title" x="888" y="831">確認できますか？</text><text class="node-explanation" x="888" y="858">操作の順番、値が変わる範囲、答えの条件を確認しま</text><text class="node-explanation" x="888" y="876">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="508" y="1142" width="320" height="151" rx="7"/><text class="node-kind" x="524" y="1162">候補</text><text class="node-title" x="524" y="1190">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="524" y="1229">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="524" y="1253">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="872" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="888" y="1162">分野</text><text class="node-title" x="888" y="1190">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="888" y="1227">詳細の質問・図へ →</text></a></g></svg>