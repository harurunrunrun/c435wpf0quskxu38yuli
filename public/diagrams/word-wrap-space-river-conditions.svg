<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-word-wrap-space-river-conditions flow-desc-word-wrap-space-river-conditions" width="748" height="1406" viewBox="0 0 748 1406" data-flow-svg="word-wrap-space-river-conditions"><title id="flow-title-word-wrap-space-river-conditions">折返し幅と空白の連なりの解法フローチャート</title><desc id="flow-desc-word-wrap-space-river-conditions">単語の配置規則と、つなげる空白、最適な幅の選び方を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-word-wrap-space-river-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="greedy-word-wrap:yes:adjacent-internal-spaces"><title>はい</title><path d="M464.5 223 V235 C464.5 267 419 267 419 299 V311"/><path d="M419 349 V361 C419 393 432.5 393 432.5 425 V437" marker-end="url(#arrow-word-wrap-space-river-conditions)"/><g class="flow-edge-label" data-edge-label="greedy-word-wrap:yes:adjacent-internal-spaces" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="334">はい</text></g></g><g class="flow-edge no" data-edge="greedy-word-wrap:no:check"><title>いいえ</title><path d="M544.5 223 V235 C544.5 267 543 267 543 299 V311"/><path d="M543 349 V361 C543 393 654 393 654 425 V437 V617 C654 649 654 649 654 681 V693 V743 C654 775 654 775 654 807 V819 V1022 C654 1054 654 1054 654 1086 V1098 V1148 C654 1180 624.571 1180 624.571 1212 V1224" marker-end="url(#arrow-word-wrap-space-river-conditions)"/><g class="flow-edge-label" data-edge-label="greedy-word-wrap:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="greedy-word-wrap:unknown:check"><title>わからない</title><path d="M624.5 223 V235 C624.5 267 671.5 267 671.5 299 V311"/><path d="M671.5 349 V361 C671.5 393 710 393 710 425 V437 V617 C710 649 710 649 710 681 V693 V743 C710 775 710 775 710 807 V819 V1022 C710 1054 710 1054 710 1086 V1098 V1148 C710 1180 670.286 1180 670.286 1212 V1224" marker-end="url(#arrow-word-wrap-space-river-conditions)"/><g class="flow-edge-label" data-edge-label="greedy-word-wrap:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="adjacent-internal-spaces:yes:bounds-tie"><title>はい</title><path d="M352.5 605 V617 C352.5 649 307 649 307 681 V693"/><path d="M307 731 V743 C307 775 319.5 775 319.5 807 V819" marker-end="url(#arrow-word-wrap-space-river-conditions)"/><g class="flow-edge-label" data-edge-label="adjacent-internal-spaces:yes:bounds-tie" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="716">はい</text></g></g><g class="flow-edge no" data-edge="adjacent-internal-spaces:no:check"><title>いいえ</title><path d="M432.5 605 V617 C432.5 649 431 649 431 681 V693"/><path d="M431 731 V743 C431 775 542 775 542 807 V819 V1022 C542 1054 542 1054 542 1086 V1098 V1148 C542 1180 533.143 1180 533.143 1212 V1224" marker-end="url(#arrow-word-wrap-space-river-conditions)"/><g class="flow-edge-label" data-edge-label="adjacent-internal-spaces:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="adjacent-internal-spaces:unknown:check"><title>わからない</title><path d="M512.5 605 V617 C512.5 649 559.5 649 559.5 681 V693"/><path d="M559.5 731 V743 C559.5 775 598 775 598 807 V819 V1022 C598 1054 598 1054 598 1086 V1098 V1148 C598 1180 578.857 1180 578.857 1212 V1224" marker-end="url(#arrow-word-wrap-space-river-conditions)"/><g class="flow-edge-label" data-edge-label="adjacent-internal-spaces:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds-tie:yes:result"><title>はい</title><path d="M239.5 1010 V1022 C239.5 1054 192 1054 192 1086 V1098"/><path d="M192 1136 V1148 C192 1180 192 1180 192 1212 V1224" marker-end="url(#arrow-word-wrap-space-river-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-tie:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1121">はい</text></g></g><g class="flow-edge no" data-edge="bounds-tie:no:check"><title>いいえ</title><path d="M319.5 1010 V1022 C319.5 1054 319 1054 319 1086 V1098"/><path d="M319 1136 V1148 C319 1180 441.714 1180 441.714 1212 V1224" marker-end="url(#arrow-word-wrap-space-river-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-tie:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1098" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1121">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds-tie:unknown:check"><title>わからない</title><path d="M399.5 1010 V1022 C399.5 1054 447.5 1054 447.5 1086 V1098"/><path d="M447.5 1136 V1148 C447.5 1180 487.429 1180 487.429 1212 V1224" marker-end="url(#arrow-word-wrap-space-river-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-tie:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1098" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1121">わからない</text></g></g><g class="flow-node question" data-node="greedy-word-wrap"><rect x="384.5" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">順番を変えず、単語を分けず、単語間</text><text class="node-title" x="400.5" y="103">に空白を一つ置いて、各行へ入るだけ</text><text class="node-title" x="400.5" y="126">詰めますか？</text><text class="node-explanation" x="400.5" y="153">等幅文字を左詰めで配置します。改行を自由に選ぶ場</text><text class="node-explanation" x="400.5" y="171">合や、単語間隔を変えて両端を揃える場合には、この</text><text class="node-explanation" x="400.5" y="189">配置の決め方を使えません。</text></g><g class="flow-node question" data-node="adjacent-internal-spaces"><rect x="272.5" y="437" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="457">質問</text><text class="node-title" x="288.5" y="485">単語間の空白を隣の行へつなぎ、列の</text><text class="node-title" x="288.5" y="508">差を1以内にしますか？</text><text class="node-explanation" x="288.5" y="535">行末から右の余白は使いません。空白のない行で連な</text><text class="node-explanation" x="288.5" y="553">りは途切れ、途中の行で終わる連なりも答えの候補で</text><text class="node-explanation" x="288.5" y="571">す。</text></g><g class="flow-node question" data-node="bounds-tie"><rect x="159.5" y="819" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="839">質問</text><text class="node-title" x="175.5" y="867">2〜2500語、語長1〜80で、連</text><text class="node-title" x="175.5" y="890">なりを最長にし、同点なら最小幅を選</text><text class="node-title" x="175.5" y="913">びますか？</text><text class="node-explanation" x="175.5" y="940">実在する空白だけを調べ、配置が変わる次の幅へ進み</text><text class="node-explanation" x="175.5" y="958">ます。行数は将来の長さの上界として使えます。掲載</text><text class="node-explanation" x="175.5" y="976">APIは一語の場合にも対応します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1224" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="1244">候補</text><text class="node-title" x="48" y="1272">単語間の空白だけで行間DPを計算</text><text class="node-title" x="48" y="1295">し、改行が変わる幅へ進む</text><a href="/flowchartcp/techniques/word-wrap-sparse-space-river-dp/"><title>行幅を変えて、空白の連なりを最長にするの記事へ</title><text x="48" y="1334">行幅を変えて、空白の連なりを最長にする</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1224" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1244">分野</text><text class="node-title" x="412" y="1272">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1309">詳細の質問・図へ →</text></a></g></svg>