<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-two-threshold-switch-conditions flow-desc-two-threshold-switch-conditions" width="748" height="1383" viewBox="0 0 748 1383" data-flow-svg="two-threshold-switch-conditions"><title id="flow-title-two-threshold-switch-conditions">通れる頂点の制限を一度切り替える移動の解法フローチャート</title><desc id="flow-desc-two-threshold-switch-conditions">求める集合や移動の条件と、操作・質問の範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-two-threshold-switch-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="undirected-connected:yes:single-threshold-switch"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-two-threshold-switch-conditions)"/><g class="flow-edge-label" data-edge-label="undirected-connected:yes:single-threshold-switch" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="undirected-connected:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V617 C654 649 654 649 654 681 V693 V743 C654 775 654 775 654 807 V819 V981 C654 1013 654 1013 654 1045 V1057 V1107 C654 1139 624.571 1139 624.571 1171 V1183" marker-end="url(#arrow-two-threshold-switch-conditions)"/><g class="flow-edge-label" data-edge-label="undirected-connected:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="undirected-connected:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V617 C710 649 710 649 710 681 V693 V743 C710 775 710 775 710 807 V819 V981 C710 1013 710 1013 710 1045 V1057 V1107 C710 1139 670.286 1139 670.286 1171 V1183" marker-end="url(#arrow-two-threshold-switch-conditions)"/><g class="flow-edge-label" data-edge-label="undirected-connected:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="single-threshold-switch:yes:bounds"><title>はい</title><path d="M352.5 605 V617 C352.5 649 307 649 307 681 V693"/><path d="M307 731 V743 C307 775 319.5 775 319.5 807 V819" marker-end="url(#arrow-two-threshold-switch-conditions)"/><g class="flow-edge-label" data-edge-label="single-threshold-switch:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="716">はい</text></g></g><g class="flow-edge no" data-edge="single-threshold-switch:no:check"><title>いいえ</title><path d="M432.5 605 V617 C432.5 649 431 649 431 681 V693"/><path d="M431 731 V743 C431 775 542 775 542 807 V819 V981 C542 1013 542 1013 542 1045 V1057 V1107 C542 1139 533.143 1139 533.143 1171 V1183" marker-end="url(#arrow-two-threshold-switch-conditions)"/><g class="flow-edge-label" data-edge-label="single-threshold-switch:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="single-threshold-switch:unknown:check"><title>わからない</title><path d="M512.5 605 V617 C512.5 649 559.5 649 559.5 681 V693"/><path d="M559.5 731 V743 C559.5 775 598 775 598 807 V819 V981 C598 1013 598 1013 598 1045 V1057 V1107 C598 1139 578.857 1139 578.857 1171 V1183" marker-end="url(#arrow-two-threshold-switch-conditions)"/><g class="flow-edge-label" data-edge-label="single-threshold-switch:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 969 V981 C239.5 1013 192 1013 192 1045 V1057"/><path d="M192 1095 V1107 C192 1139 192 1139 192 1171 V1183" marker-end="url(#arrow-two-threshold-switch-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 969 V981 C319.5 1013 319 1013 319 1045 V1057"/><path d="M319 1095 V1107 C319 1139 441.714 1139 441.714 1171 V1183" marker-end="url(#arrow-two-threshold-switch-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 969 V981 C399.5 1013 447.5 1013 447.5 1045 V1057"/><path d="M447.5 1095 V1107 C447.5 1139 487.429 1139 487.429 1171 V1183" marker-end="url(#arrow-two-threshold-switch-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="undirected-connected"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">辺が固定された、単純な連結無向グラ</text><text class="node-title" x="400.5" y="103">フですか？</text><text class="node-explanation" x="400.5" y="130">頂点には0からN−1までの番号があり、自己辺や重</text><text class="node-explanation" x="400.5" y="148">複辺はありません。距離の最小値ではなく、目的地ま</text><text class="node-explanation" x="400.5" y="166">で移動できるかを求めます。</text></g><g class="flow-node question" data-node="single-threshold-switch"><rect x="272.5" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">前半は番号L以上、後半はR以下だけ</text><text class="node-title" x="288.5" y="485">を通り、同じ頂点で一度切り替えます</text><text class="node-title" x="288.5" y="508">か？</text><text class="node-explanation" x="288.5" y="535">始点Sと終点EはL≤S、E≤R、L≤Rを満たしま</text><text class="node-explanation" x="288.5" y="553">す。切替地点は前後両方の制限を守り、始点や終点で</text><text class="node-explanation" x="288.5" y="571">切り替えてもかまいません。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="839">質問</text><text class="node-title" x="175.5" y="867">全質問を先に読め、頂点20万・辺</text><text class="node-title" x="175.5" y="890">40万・質問20万以下ですか？</text><text class="node-explanation" x="175.5" y="917">質問ごとに始点・終点・L・Rが変わります。グラフ</text><text class="node-explanation" x="175.5" y="935">は変わらず、全質問をまとめて処理できます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">下限側と上限側の到達成分を二つの葉</text><text class="node-title" x="48" y="1254">区間にし、共通頂点を数える</text><a href="/flowchartcp/techniques/two-threshold-component-merge-trees-rectangle-intersection/"><title>通れる頂点に二種類の制限がある移動を、到達集合の共通部分で判定するの記事へ</title><text x="48" y="1293">通れる頂点に二種類の制限がある移動を、到達集合</text><text x="48" y="1311">の共通部分で判定する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1203">分野</text><text class="node-title" x="412" y="1231">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1268">詳細の質問・図へ →</text></a></g></svg>