<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-subset-bin-count flow-desc-subset-bin-count" width="860" height="1432" viewBox="0 0 860 1432" data-flow-svg="subset-bin-count"><title id="flow-title-subset-bin-count">全品物を同じ容量の箱へ詰めるの解法フローチャート</title><desc id="flow-desc-subset-bin-count">使用済みの集合ごとに、箱数と最後の箱の使用量だけを残します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-subset-bin-count" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="small:yes:identical"><title>はい</title><path d="M539.722 200 V212 C539.722 244 420.667 244 420.667 276 V288"/><path d="M420.667 326 V338 C420.667 370 420.667 370 420.667 402 V414" marker-end="url(#arrow-subset-bin-count)"/><g class="flow-edge-label" data-edge-label="small:yes:identical" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="311">はい</text></g></g><g class="flow-edge no" data-edge="small:no:fallback"><title>いいえ</title><path d="M619.722 200 V212 C619.722 244 655 244 655 276 V288"/><path d="M655 326 V338 C655 370 762.5 370 762.5 402 V414 V617 C762.5 649 762.5 649 762.5 681 V693 V743 C762.5 775 458 775 458 807 V819 V1047 C458 1079 360 1079 360 1111 V1123 V1173 C360 1205 304 1205 304 1237 V1249" marker-end="url(#arrow-subset-bin-count)"/><g class="flow-edge-label" data-edge-label="small:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="small:unknown:check"><title>わからない</title><path d="M699.722 200 V212 C699.722 244 783.5 244 783.5 276 V288"/><path d="M783.5 326 V338 C783.5 370 818.5 370 818.5 402 V414 V617 C818.5 649 818.5 649 818.5 681 V693 V743 C818.5 775 721.333 775 721.333 807 V819" marker-end="url(#arrow-subset-bin-count)"/><g class="flow-edge-label" data-edge-label="small:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="identical:yes:bins-result"><title>はい</title><path d="M340.667 605 V617 C340.667 649 192 649 192 681 V693"/><path d="M192 731 V743 C192 775 192 775 192 807 V819" marker-end="url(#arrow-subset-bin-count)"/><g class="flow-edge-label" data-edge-label="identical:yes:bins-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="716">はい</text></g></g><g class="flow-edge no" data-edge="identical:no:fallback"><title>いいえ</title><path d="M420.667 605 V617 C420.667 649 402 649 402 681 V693"/><path d="M402 731 V743 C402 775 402 775 402 807 V819 V1047 C402 1079 304 1079 304 1111 V1123 V1173 C304 1205 224 1205 224 1237 V1249" marker-end="url(#arrow-subset-bin-count)"/><g class="flow-edge-label" data-edge-label="identical:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="identical:unknown:check"><title>わからない</title><path d="M500.667 605 V617 C500.667 649 668 649 668 681 V693"/><path d="M668 731 V743 C668 775 614.667 775 614.667 807 V819" marker-end="url(#arrow-subset-bin-count)"/><g class="flow-edge-label" data-edge-label="identical:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 969 V1047 C588 1079 450 1079 450 1111 V1123"/><path d="M450 1161 V1173 C450 1205 384 1205 384 1237 V1249" marker-end="url(#arrow-subset-bin-count)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1123" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1146">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 969 V1047 C668 1079 655 1079 655 1111 V1123"/><path d="M655 1161 V1173 C655 1205 614.667 1205 614.667 1237 V1249" marker-end="url(#arrow-subset-bin-count)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1123" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1146">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 969 V1047 C748 1079 783.5 1079 783.5 1111 V1123"/><path d="M783.5 1161 V1173 C783.5 1205 721.333 1205 721.333 1237 V1249" marker-end="url(#arrow-subset-bin-count)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1123" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1146">わからない</text></g></g><g class="flow-node question" data-node="small"><rect x="459.7222222222223" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">品物数が少なく、使用済み集合を全て</text><text class="node-title" x="475.7222222222223" y="103">持つ計算量が制限内ですか？</text><text class="node-explanation" x="475.7222222222223" y="130">集合ごとに各未使用品物を追加するので、N×2^N</text><text class="node-explanation" x="475.7222222222223" y="148"> 程度の時間と 2^N 程度の表が必要です。重さ</text><text class="node-explanation" x="475.7222222222223" y="166">の上限の小ささは不要です。</text></g><g class="flow-node question" data-node="identical"><rect x="260.6666666666667" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="276.6666666666667" y="434">質問</text><text class="node-title" x="276.6666666666667" y="462">全ての箱は同容量で、各品物は非負の</text><text class="node-title" x="276.6666666666667" y="485">重さを持ち、一箱へ分割せずに入れら</text><text class="node-title" x="276.6666666666667" y="508">れますか？</text><text class="node-explanation" x="276.6666666666667" y="535">箱数を優先し、同じ箱数なら最後の箱の使用量が小さ</text><text class="node-explanation" x="276.6666666666667" y="553">い状態を残します。箱ごとの違いや、品物どうしの同</text><text class="node-explanation" x="276.6666666666667" y="571">居制限には、この二値だけでは足りません。</text></g><g class="flow-node result" data-node="bins-result"><rect x="32" y="819" width="320" height="216" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">箱数と最後の箱の使用量を辞書順に比</text><text class="node-title" x="48" y="890">べ、一集合一状態へ圧縮する</text><a href="/flowchartcp/techniques/subset-bin-lexicographic/"><title>同じ容量の箱への分配は、箱数と最後の使用量の二値だけ残すの記事へ</title><text x="48" y="929">同じ容量の箱への分配は、箱数と最後の使用量の二</text><text x="48" y="947">値だけ残す</text></a><a href="/flowchartcp/techniques/bitmask-dp/"><title>bit DPの記事へ</title><text x="48" y="971">bit DP</text></a><a href="/flowchartcp/techniques/dp-state-dominance/"><title>同じ長さの増加部分列は末尾が小さい状態だけ残すの記事へ</title><text x="48" y="995">同じ長さの増加部分列は末尾が小さい状態だけ残す</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="839">質問</text><text class="node-title" x="524" y="867">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="890">確認できますか？</text><text class="node-explanation" x="524" y="917">何を一つの状態にし、何を別の答えとして数えるか、</text><text class="node-explanation" x="524" y="935">制約で列挙が間に合うかを確かめます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1249" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1269">候補</text><text class="node-title" x="160" y="1297">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1336">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1360">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1249" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1269">分野</text><text class="node-title" x="524" y="1297">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1334">詳細の質問・図へ →</text></a></g></svg>