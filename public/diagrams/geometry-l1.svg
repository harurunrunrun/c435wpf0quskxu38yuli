32 1000 360 1000 360 1032 V1044"/><path d="M360 1082 V1094 C360 1126 360 1126 360 1158 V1170" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="octant-candidate:yes:octant-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="320" y="1044" width="80" height="38" rx="5"/><text text-anchor="middle" x="360" y="1067">はい</text></g></g><g class="flow-edge no" data-edge="octant-candidate:no:fallback"><title>いいえ</title><path d="M612 956 V968 C612 1000 570 1000 570 1032 V1044"/><path d="M570 1082 V1094 C570 1126 570 1126 570 1158 V1170 V1350 C570 1382 528 1382 528 1414 V1426 V1476 C528 1508 440 1508 440 1540 V1552" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="octant-candidate:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="530" y="1044" width="80" height="38" rx="5"/><text text-anchor="middle" x="570" y="1067">いいえ</text></g></g><g class="flow-edge unknown" data-edge="octant-candidate:unknown:check"><title>わからない</title><path d="M692 956 V968 C692 1000 839.5 1000 839.5 1032 V1044"/><path d="M839.5 1082 V1094 C839.5 1126 804 1126 804 1158 V1170" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="octant-candidate:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="795" y="1044" width="89" height="38" rx="5"/><text text-anchor="middle" x="839.5" y="1067">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M756 1325 V1350 C756 1382 618 1382 618 1414 V1426"/><path d="M618 1464 V1476 C618 1508 504 1508 504 1540 V1552" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="578" y="1426" width="80" height="38" rx="5"/><text text-anchor="middle" x="618" y="1449">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M836 1325 V1350 C836 1382 823 1382 823 1414 V1426"/><path d="M823 1464 V1476 C823 1508 782.667 1508 782.667 1540 V1552" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="783" y="1426" width="80" height="38" rx="5"/><text text-anchor="middle" x="823" y="1449">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M916 1325 V1350 C916 1382 951.5 1382 951.5 1414 V1426"/><path d="M951.5 1464 V1476 C951.5 1508 889.333 1508 889.333 1540 V1552" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="907" y="1426" width="89" height="38" rx="5"/><text text-anchor="middle" x="951.5" y="1449">わからない</text></g></g><g class="flow-edge yes" data-edge="manhattan-dimension:yes:manhattan-result"><title>はい</title><path d="M336 546 V581 C336 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="manhattan-dimension:yes:manhattan-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="manhattan-dimension:no:fallback"><title>いいえ</title><path d="M416 546 V581 C416 613 386 613 386 645 V657"/><path d="M386 695 V707 C386 739 402 739 402 771 V783 V968 C402 1000 150 1000 150 1032 V1044 V1094 C150 1126 150 1126 150 1158 V1170 V1350 C150 1382 472 1382 472 1414 V1426 V1476 C472 1508 376 1508 376 1540 V1552" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="manhattan-dimension:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="346" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="386" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="manhattan-dimension:unknown:check"><title>わからない</title><path d="M496 546 V581 C496 613 762.5 613 762.5 645 V657"/><path d="M762.5 695 V707 C762.5 739 878 739 878 771 V783 V968 C878 1000 745 1000 745 1032 V1044 V1094 C745 1126 740 1126 740 1158 V1170" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="manhattan-dimension:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="718" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="762.5" y="680">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="551.3333333333334" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="567.3333333333334" y="52">質問</text><text class="node-title" x="567.3333333333334" y="80">|dx|+|dy| の距離から何を</text><text class="node-title" x="567.3333333333334" y="103">求めますか？</text><text class="node-explanation" x="567.3333333333334" y="130">一組の最遠距離と、全点の連結に必要な辺の総費用を</text><text class="node-explanation" x="567.3333333333334" y="148">区別します。</text></g><g class="flow-node question" data-node="octant-nearest"><rect x="620" y="396" width="320" height="173" rx="7"/><text class="node-kind" x="636" y="416">質問</text><text class="node-title" x="636" y="444">距離は二次元の |dx|+|dy|</text><text class="node-title" x="636" y="467"> で、全点対から任意の辺を選べます</text><text class="node-title" x="636" y="490">か？</text><text class="node-explanation" x="636" y="517">使える辺に別の制限がある場合は、最近点だけへ絞る</text><text class="node-explanation" x="636" y="535">根拠が失われます。</text></g><g class="flow-node question" data-node="octant-candidate"><rect x="452" y="783" width="320" height="173" rx="7"/><text class="node-kind" x="468" y="803">質問</text><text class="node-title" x="468" y="831">方向領域の近い点へ置き換えても、最</text><text class="node-title" x="468" y="854">小の連結費用を失わないと示せます</text><text class="node-title" x="468" y="877">か？</text><text class="node-explanation" x="468" y="904">座標を反転・交換して八方向を走査し、領域ごとの最</text><text class="node-explanation" x="468" y="922">近点だけを候補にします。</text></g><g class="flow-node result" data-node="octant-result"><rect x="200" y="1170" width="320" height="168" rx="7"/><text class="node-kind" x="216" y="1190">候補</text><text class="node-title" x="216" y="1218">八方向の最近点を候補辺にし、全点対</text><text class="node-title" x="216" y="1241">の辺を省く</text><a href="/flowchartcp/techniques/manhattan-nearest-octants/"><title>マンハッタン距離の全点対の辺を、八方向の最近点へ絞るの記事へ</title><text x="216" y="1280">マンハッタン距離の全点対の辺を、八方向の最近点</text><text x="216" y="1298">へ絞る</text></a></g><g class="flow-node question" data-node="check"><rect x="676" y="1170" width="320" height="155" rx="7"/><text class="node-kind" x="692" y="1190">質問</text><text class="node-title" x="692" y="1218">座標の範囲、境界、重複、共線の場合</text><text class="node-title" x="692" y="1241">を問題文と小さい例で確認できます</text><text class="node-title" x="692" y="1264">か？</text><text class="node-explanation" x="692" y="1291">保証される形と、必要な幾何の性質を区別します。</text></g><g class="flow-node result" data-node="fallback"><rect x="312" y="1552" width="320" height="151" rx="7"/><text class="node-kind" x="328" y="1572">候補</text><text class="node-title" x="328" y="1600">入力の形と退化する場合を確かめる</text><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="328" y="1639">反例探し</text></a><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="328" y="1663">状態の設計</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="676" y="1552" width="320" height="121" rx="7"/><text class="node-kind" x="692" y="1572">分野</text><text class="node-title" x="692" y="1600">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="692" y="1637">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="manhattan-dimension"><rect x="256" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="272" y="416">質問</text><text class="node-title" x="272" y="444">平面上で |dx|+|dy| を距</text><text class="node-title" x="272" y="467">離に使いますか？</text><text class="node-explanation" x="272" y="494">二次元では u=x+y,v=x−y に写すと、距</text><text class="node-explanation" x="272" y="512">離を max(|du|,|dv|) にできます。</text></g><g class="flow-node result" data-node="manhattan-result"><rect x="32" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">座標の和と差へ写し、絶対値の和を二</text><text class="node-title" x="48" y="854">方向の最大へ変える</text><a href="/flowchartcp/techniques/manhattan-transform/"><title>マンハッタン距離の最大値は x+y と x−y の幅を見るの記事へ</title><text x="48" y="893">マンハッタン距離の最大値は x+y と x−y</text><text x="48" y="911"> の幅を見る</text></a></g></svg>