<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-geometry-l1 flow-desc-geometry-l1" width="1028" height="1735" viewBox="0 0 1028 1735" data-flow-svg="geometry-l1"><title id="flow-title-geometry-l1">絶対値の和の距離と連結の解法フローチャート</title><desc id="flow-desc-geometry-l1">最遠距離と、全点を最小費用でつなぐ条件を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-geometry-l1" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge maximum" data-edge="goal:maximum:manhattan-dimension"><title>最も遠い二点の距離</title><path d="M631.333 182 V194 C631.333 226 416 226 416 258 V270"/><path d="M416 308 V320 C416 352 416 352 416 384 V396" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="goal:maximum:manhattan-dimension" tabindex="0" role="group" aria-label="選択肢：最も遠い二点の距離"><rect x="345.5" y="270" width="141" height="38" rx="5"/><text text-anchor="middle" x="416" y="293">最も遠い二点の距離</text></g></g><g class="flow-edge connect" data-edge="goal:connect:octant-nearest"><title>全点を最小の総費用でつなぐ</title><path d="M711.333 182 V194 C711.333 226 766.5 226 766.5 258 V270"/><path d="M766.5 308 V320 C766.5 352 780 352 780 384 V396" marker-end="url(#arrow-geometry-l1)"/><g class="flow-edge-label" data-edge-label="goal:connect:octant-nearest" tabindex="0" role="group" aria-label="選択肢：全点を最小の総費用でつなぐ"><rect x="670" y="270" width="193" height="38" rx="5"/><text text-anchor="middle" x="766.5" y="293">全点を最小の総費用でつなぐ</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M791.333 182 V194 C791.333 226 951.5 226 951.5 258 V270"/><path d="M951.5 308 V320 C951.5 352 990 352 990 384 V396 V581 C990 613 990 613 990 645 V657 V707 C990 739 990 739 990 771 V783 V968 C990 1000 990 1000 990 1032 V1044 V1094 C990 1126 932 1126 932 1158 V1170" marker-end="url(#arrow-geometry-l1)"/><g clas