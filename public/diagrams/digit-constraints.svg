<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-digit-constraints flow-desc-digit-constraints" width="1112" height="961" viewBox="0 0 1112 961" data-flow-svg="digit-constraints"><title id="flow-title-digit-constraints">上限以下の桁の条件と総和の解法フローチャート</title><desc id="flow-desc-digit-constraints">個数と値の総和、桁の出現、先頭のゼロを分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-digit-constraints" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge required-sum" data-edge="goal:required-sum:required-route"><title>指定された全数字を含む正整数の、値の総和</title><path d="M524 182 V194 C524 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-digit-constraints)"/><g class="flow-edge-label" data-edge-label="goal:required-sum:required-route" tabindex="0" role="group" aria-label="選択肢：指定された全数字を含む正整数の、値の総和"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">指定された全数字を含む正整数の、値</text><text text-anchor="middle" x="192" y="311">の総和</text></g></g><g class="flow-edge count" data-edge="goal:count:ordinary-route"><title>桁の条件を満たす整数の個数</title><path d="M588 182 V194 C588 226 556 226 556 258 V270"/><path d="M556 308 V338 C556 370 502.667 370 502.667 402 V414" marker-end="url(#arrow-digit-constraints)"/><g class="flow-edge-label" data-edge-label="goal:count:ordinary-route" tabindex="0" role="group" aria-label="選択肢：桁の条件を満たす整数の個数"><rect x="459.5" y="270" width="193" height="38" rx="5"/><text text-anchor="middle" x="556" y="293">桁の条件を満たす整数の個数</text></g></g><g class="flow-edge other" data-edge="goal:other:ordinary-route"><title>その他の桁の条件や集計</title><path d="M652 182 V194 C652 226 780 226 780 258 V270"/><path d="M780 308 V338 C780 370 609.333 370 609.333 402 V414" marker-end="url(#arrow-digit-constraints)"/><g class="flow-edge-label" data-edge-label="goal:other:ordinary-route" tabindex="0" role="group" aria-label="選択肢：その他の桁の条件や集計"><rect x="696.5" y="270" width="167" height="38" rx="5"/><text text-anchor="middle" x="780" y="293">その他の桁の条件や集計</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M716 182 V194 C716 226 952 226 952 258 V270"/><path d="M952 308 V338 C952 370 920 370 920 402 V414" marker-end="url(#arrow-digit-constraints)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="907.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="952" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M840 564 V576 C840 608 556 608 556 640 V652"/><path d="M556 690 V702 C556 734 556 734 556 766 V778" marker-end="url(#arrow-digit-constraints)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="675">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 564 V576 C920 608 907 608 907 640 V652"/><path d="M907 690 V702 C907 734 866.667 734 866.667 766 V778" marker-end="url(#arrow-digit-constraints)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 564 V576 C1000 608 1035.5 608 1035.5 640 V652"/><path d="M1035.5 690 V702 C1035.5 734 973.333 734 973.333 766 V778" marker-end="url(#arrow-digit-constraints)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="675">わからない</text></g></g><g class="flow-node question" data-node="goal"><rect x="460" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="476" y="52">質問</text><text class="node-title" x="476" y="80">上限以下の整数について、何を集計し</text><text class="node-title" x="476" y="103">ますか？</text><text class="node-explanation" x="476" y="130">整数を生成する桁の状態に加え、個数だけが必要か、</text><text class="node-explanation" x="476" y="148">生成した値の合計も必要かを確認します。</text></g><g class="flow-node route" data-node="ordinary-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">上限と残す桁の履歴</text><a href="/flowchartcp/flowcharts/#diagram-dp-state" data-route="dp-state"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="434">質問</text><text class="node-title" x="776" y="462">必要な条件を、問題文と小さい例から</text><text class="node-title" x="776" y="485">確認できますか？</text><text class="node-explanation" x="776" y="512">何を一つの状態にし、何を別の答えとして数えるか、</text><text class="node-explanation" x="776" y="530">制約で列挙が間に合うかを確かめます。</text></g><g class="flow-node result" data-node="fallback"><rect x="396" y="778" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="798">候補</text><text class="node-title" x="412" y="826">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="865">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="889">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="778" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="798">分野</text><text class="node-title" x="776" y="826">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="required-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">指定数字を全て含む整数の総和</text><a href="/flowchartcp/flowcharts/#diagram-digit-required-values" data-route="digit-required-values"><text x="48" y="499">詳細の質問・図へ →</text></a></g></svg>