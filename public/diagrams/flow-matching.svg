<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-flow-matching flow-desc-flow-matching" width="1840" height="567" viewBox="0 0 1840 567" data-flow-svg="flow-matching"><title id="flow-title-flow-matching">組の選択・容量・割当の解法フローチャート</title><desc id="flow-desc-flow-matching">必須の対象、同時に使える資源、利益、経路の重複、依存条件を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-flow-matching" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge pair-goals" data-edge="purpose:pair-goals:pair-goals-route"><title>対象を重複して使わずに組を選び、個数・利益・必須の組を求める</title><path d="M813.333 182 V194 C813.333 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-flow-matching)"/><g class="flow-edge-label" data-edge-label="purpose:pair-goals:pair-goals-route" tabindex="0" role="group" aria-label="選択肢：対象を重複して使わずに組を選び、個数・利益・必須の組を求める"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">対象を重複して使わずに組を選び、個</text><text text-anchor="middle" x="192" y="311">数・利益・必須の組を求める</text></g></g><g class="flow-edge place-time-goals" data-edge="purpose:place-time-goals:place-time-goals-route"><title>場所・時刻・商品の条件に従い、行先・担当・割引券を割り当てる</title><path d="M866.667 182 V194 C866.667 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-flow-matching)"/><g class="flow-edge-label" data-edge-label="purpose:place-time-goals:place-time-goals-route" tabindex="0" role="group" aria-label="選択肢：場所・時刻・商品の条件に従い、行先・担当・割引券を割り当てる"><rect x="440" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">場所・時刻・商品の条件に従い、行</text><text text-anchor="middle" x="556" y="311">先・担当・割引券を割り当てる</text></g></g><g class="flow-edge quantity-goals" data-edge="purpose:quantity-goals:quantity-goals-route"><title>割当数量・行列の合計・費用・受取個数を制限する</title><path d="M920 182 V194 C920 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-flow-matching)"/><g class="flow-edge-label" data-edge-label="purpose:quantity-goals:quantity-goals-route" tabindex="0" role="group" aria-label="選択肢：割当数量・行列の合計・費用・受取個数を制限する"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">割当数量・行列の合計・費用・受取個</text><text text-anchor="middle" x="920" y="311">数を制限する</text></g></g><g class="flow-edge choice-division-goals" data-edge="purpose:choice-division-goals:choice-division-goals-route"><title>依存する対象を選ぶ、二つの側に分ける、その他の割当条件</title><path d="M973.333 182 V194 C973.333 226 1284 226 1284 258 V270"/><path d="M1284 326 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-flow-matching)"/><g class="flow-edge-label" data-edge-label="purpose:choice-division-goals:choice-division-goals-route" tabindex="0" role="group" aria-label="選択肢：依存する対象を選ぶ、二つの側に分ける、その他の割当条件"><rect x="1161.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">依存する対象を選ぶ、二つの側に分け</text><text text-anchor="middle" x="1284" y="311">る、その他の割当条件</text></g></g><g class="flow-edge unknown" data-edge="purpose:unknown:check"><title>わからない</title><path d="M1026.667 182 V194 C1026.667 226 1648 226 1648 258 V270"/><path d="M1648 308 V338 C1648 370 1648 370 1648 402 V414" marker-end="url(#arrow-flow-matching)"/><g class="flow-edge-label" data-edge-label="purpose:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1603.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1648" y="293">わからない</text></g></g><g class="flow-node route" data-node="check"><rect x="1488" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="1504" y="434">分野</text><text class="node-title" x="1504" y="462">合法な割当と数量の対応</text><a href="/flowchartcp/flowcharts/#diagram-assignment-integer-representation" data-route="assignment-integer-representation"><text x="1504" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="purpose"><rect x="760" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="52">質問</text><text class="node-title" x="776" y="80">対応や割当について、どの条件の答え</text><text class="node-title" x="776" y="103">を求めますか？</text><text class="node-explanation" x="776" y="130">一つの組を選ぶと何を消費するか、必ず使う対象があ</text><text class="node-explanation" x="776" y="148">るか、個数と費用のどちらが目的かを確認します。</text></g><g class="flow-node route" data-node="pair-goals-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">重複しない組の個数・利益・必須条件</text><a href="/flowchartcp/flowcharts/#diagram-assignment-pair-goals" data-route="assignment-pair-goals"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="place-time-goals-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">場所・時刻・商品の条件に従う割当</text><a href="/flowchartcp/flowcharts/#diagram-assignment-place-time-goals" data-route="assignment-place-time-goals"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="quantity-goals-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">割当数量・費用と受取個数の条件</text><a href="/flowchartcp/flowcharts/#diagram-assignment-quantity-goals" data-route="assignment-quantity-goals"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="choice-division-goals-route"><rect x="1124" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">選択の依存条件と二つへの分割</text><a href="/flowchartcp/flowcharts/#diagram-assignment-choice-division-goals" data-route="assignment-choice-division-goals"><text x="1140" y="499">詳細の質問・図へ →</text></a></g></svg>