><path d="M588 892 V940 C588 972 450 972 450 1004 V1016"/><path d="M450 1054 V1066 C450 1098 384 1098 384 1130 V1142" marker-end="url(#arrow-k-cheapest-revisiting-walks)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 892 V940 C668 972 655 972 655 1004 V1016"/><path d="M655 1054 V1066 C655 1098 614.667 1098 614.667 1130 V1142" marker-end="url(#arrow-k-cheapest-revisiting-walks)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 892 V940 C748 972 783.5 972 783.5 1004 V1016"/><path d="M783.5 1054 V1066 C783.5 1098 721.333 1098 721.333 1130 V1142" marker-end="url(#arrow-k-cheapest-revisiting-walks)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="walks"><rect x="459.7222222222223" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">頂点や辺を再訪でき、同費用の別の歩</text><text class="node-title" x="475.7222222222223" y="103">き方も別の一本として数えますか？</text><text class="node-explanation" x="475.7222222222223" y="130">単純経路や、異なる費用の値だけを列挙する条件では</text><text class="node-explanation" x="475.7222222222223" y="148">ありません。</text></g><g class="flow-node question" data-node="positive"><rect x="260.6666666666667" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="276.6666666666667" y="416">質問</text><text class="node-title" x="276.6666666666667" y="444">全辺の費用は厳密に正で、要求する </text><text class="node-title" x="276.6666666666667" y="467">K は小さいですか？</text><text class="node-explanation" x="276.6666666666667" y="494">各頂点に届く安い歩き方を K 本まで展開します。</text><text class="node-explanation" x="276.6666666666667" y="512">K に比例する候補の計算量を確認します。</text></g><g class="flow-node result" data-node="k-result"><rect x="32" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">安い順に取り出し、各頂点への確定回</text><text class="node-title" x="48" y="831">数を K 回までにする</text><a href="/flowchartcp/techniques/k-shortest-walk-prefix-cap/"><title>再訪できる経路の費用を小さい順にK個求めるなら、各頂点への到達をK回まで確定するの記事へ</title><text x="48" y="870">再訪できる経路の費用を小さい順にK個求めるな</text><text x="48" y="888">ら、各頂点への到達をK回まで確定する</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="760" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="780">質問</text><text class="node-title" x="524" y="808">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="831">確認できますか？</text><text class="node-explanation" x="524" y="858">辺の向き、再訪、求める量と制約を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1142" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1162">候補</text><text class="node-title" x="160" y="1190">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1229">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1253">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1162">分野</text><text class="node-title" x="524" y="1190">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1227">詳細の質問・図へ →</text></a></g></svg>