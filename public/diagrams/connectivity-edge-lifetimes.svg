<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-connectivity-edge-lifetimes flow-desc-connectivity-edge-lifetimes" width="1112" height="966" viewBox="0 0 1112 966" data-flow-svg="connectivity-edge-lifetimes"><title id="flow-title-connectivity-edge-lifetimes">辺が存在する時刻と、併合の取り消しの解法フローチャート</title><desc id="flow-desc-connectivity-edge-lifetimes">追加と削除を時刻の区間で扱えるか、最後の併合から取り消せるかを確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-connectivity-edge-lifetimes" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="lifetimes:yes:rollback"><title>はい</title><path d="M517.5 182 V194 C517.5 226 192 226 192 258 V270"/><path d="M192 308 V320 C192 352 192 352 192 384 V396 V558 C192 590 192 590 192 622 V634 V684 C192 716 138.667 716 138.667 748 V760" marker-end="url(#arrow-connectivity-edge-lifetimes)"/><g class="flow-edge-label" data-edge-label="lifetimes:yes:rollback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">はい</text></g></g><g class="flow-edge no" data-edge="lifetimes:no:undo"><title>いいえ</title><path d="M597.5 182 V194 C597.5 226 586 226 586 258 V270"/><path d="M586 308 V320 C586 352 586 352 586 384 V396" marker-end="url(#arrow-connectivity-edge-lifetimes)"/><g class="flow-edge-label" data-edge-label="lifetimes:no:undo" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="546" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="586" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="lifetimes:unknown:check"><title>わからない</title><path d="M677.5 182 V194 C677.5 226 1014.5 226 1014.5 258 V270"/><path d="M1014.5 308 V320 C1014.5 352 1014.5 352 1014.5 384 V396 V558 C1014.5 590 1014.5 590 1014.5 622 V634 V684 C1014.5 716 973.333 716 973.333 748 V760" marker-end="url(#arrow-connectivity-edge-lifetimes)"/><g class="flow-edge-label" data-edge-label="lifetimes:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="970" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1014.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="undo:yes:rollback"><title>はい</title><path d="M506 546 V558 C506 590 282 590 282 622 V634"/><path d="M282 672 V684 C282 716 245.333 716 245.333 748 V760" marker-end="url(#arrow-connectivity-edge-lifetimes)"/><g class="flow-edge-label" data-edge-label="undo:yes:rollback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="242" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="282" y="657">はい</text></g></g><g class="flow-edge no" data-edge="undo:no:fallback"><title>いいえ</title><path d="M586 546 V558 C586 590 556 590 556 622 V634"/><path d="M556 672 V684 C556 716 556 716 556 748 V760" marker-end="url(#arrow-connectivity-edge-lifetimes)"/><g class="flow-edge-label" data-edge-label="undo:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="undo:unknown:check"><title>わからない</title><path d="M666 546 V558 C666 590 920 590 920 622 V634"/><path d="M920 672 V684 C920 716 866.667 716 866.667 748 V760" marker-end="url(#arrow-connectivity-edge-lifetimes)"/><g class="flow-edge-label" data-edge-label="undo:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="657">わからない</text></g></g><g class="flow-node question" data-node="lifetimes"><rect x="437.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="453.5" y="52">質問</text><text class="node-title" x="453.5" y="80">各辺が存在する時刻の区間を列挙でき</text><text class="node-title" x="453.5" y="103">ますか？</text><text class="node-explanation" x="453.5" y="130">追加と削除が混在する場合、時刻の木へ区間を配置す</text><text class="node-explanation" x="453.5" y="148">る方法を考えます。</text></g><g class="flow-node result" data-node="rollback"><rect x="32" y="760" width="320" height="174" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">時刻の区間分割と Rollback</text><text class="node-title" x="48" y="831"> DSU</text><a href="/flowchartcp/techniques/connectivity-time-intervals/"><title>辺が存在する時間区間を分割して連結性を求めるの記事へ</title><text x="48" y="870">辺が存在する時間区間を分割して連結性を求める</text></a><a href="/flowchartcp/techniques/rollback-dsu/"><title>巻き戻し可能Union-Findの記事へ</title><text x="48" y="894">巻き戻し可能Union-Find</text></a></g><g class="flow-node question" data-node="undo"><rect x="426" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="442" y="416">質問</text><text class="node-title" x="442" y="444">最後に行った併合から順に取り消すだ</text><text class="node-title" x="442" y="467">けで足りますか？</text><text class="node-explanation" x="442" y="494">木の探索など、入るときに併合し戻るときに取り消す</text><text class="node-explanation" x="442" y="512">場合です。</text></g><g class="flow-node result" data-node="fallback"><rect x="396" y="760" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="780">候補</text><text class="node-title" x="412" y="808">変更する辺と時刻を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="847">状態の設計</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="760" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="780">分野</text><text class="node-title" x="776" y="808">操作と問い合わせの順序を確かめる</text><text class="node-explanation" x="776" y="835">追加や削除を先に読めるかを確かめ、操作を整理する</text><text class="node-explanation" x="776" y="853">か、足りない条件を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-operation-order" data-route="connectivity-operation-order"><text x="776" y="881">詳細の質問・図へ →</text></a></g></svg>