<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-dp flow-desc-tree-dp" width="2204" height="549" viewBox="0 0 2204 549" data-flow-svg="tree-dp"><title id="flow-title-tree-dp">木の子からまとめる答えの解法フローチャート</title><desc id="flow-desc-tree-dp">子からの情報、根の変更、距離による集計を整理します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-dp" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge selection-sizes" data-edge="tree-objective:selection-sizes:selection-sizes-route"><title>木全体の最適値、選ぶ個数ごとの答え、頂点ごとの辺数条件</title><path d="M987.714 141 V153 C987.714 185 192 185 192 217 V229"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-tree-dp)"/><g class="flow-edge-label" data-edge-label="tree-objective:selection-sizes:selection-sizes-route" tabindex="0" role="group" aria-label="選択肢：木全体の最適値、選ぶ個数ごとの答え、頂点ごとの辺数条件"><rect x="76" y="229" width="232" height="56" rx="5"/><text text-anchor="middle" x="192" y="252">木全体の最適値、選ぶ個数ごとの答</text><text text-anchor="middle" x="192" y="270">え、頂点ごとの辺数条件</text></g></g><g class="flow-edge vertex-distance-goals" data-edge="tree-objective:vertex-distance-goals:vertex-distance-goals-route"><title>各頂点を基準にする答え、二頂点の距離・経路を集計する</title><path d="M1033.429 141 V153 C1033.429 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-tree-dp)"/><g class="flow-edge-label" data-edge-label="tree-objective:vertex-distance-goals:vertex-distance-goals-route" tabindex="0" role="group" aria-label="選択肢：各頂点を基準にする答え、二頂点の距離・経路を集計する"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">各頂点を基準にする答え、二頂点の距</text><text text-anchor="middle" x="556" y="270">離・経路を集計する</text></g></g><g class="flow-edge connected-group-goals" data-edge="tree-objective:connected-group-goals:connected-group-goals-route"><title>部分木の値、連結な頂点集合、辺を切った後の成分を扱う</title><path d="M1079.143 141 V153 C1079.143 185 920 185 920 217 V229"/><path d="M920 285 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-tree-dp)"/><g class="flow-edge-label" data-edge-label="tree-objective:connected-group-goals:connected-group-goals-route" tabindex="0" role="group" aria-label="選択肢：部分木の値、連結な頂点集合、辺を切った後の成分を扱う"><rect x="804" y="229" width="232" height="56" rx="5"/><text text-anchor="middle" x="920" y="252">部分木の値、連結な頂点集合、辺を</text><text text-anchor="middle" x="920" y="270">切った後の成分を扱う</text></g></g><g class="flow-edge colored-walk-balance" data-edge="tree-objective:colored-walk-balance:colored-walk-route"><title>辺を二色に塗り、指定の移動で二色の通過回数の差を指定する</title><path d="M1124.857 141 V153 C1124.857 185 1284 185 1284 217 V229"/><path d="M1284 285 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-tree-dp)"/><g class="flow-edge-label" data-edge-label="tree-objective:colored-walk-balance:colored-walk-route" tabindex="0" role="group" aria-label="選択肢：辺を二色に塗り、指定の移動で二色の通過回数の差を指定する"><rect x="1161.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1284" y="252">辺を二色に塗り、指定の移動で二色の</text><text text-anchor="middle" x="1284" y="270">通過回数の差を指定する</text></g></g><g class="flow-edge ancestor-path-packing" data-edge="tree-objective:ancestor-path-packing:ancestor-path-packing-route"><title>祖先と子孫を結ぶ経路を選び、頂点を共有せずに重みの合計を最大にする</title><path d="M1170.571 141 V153 C1170.571 185 1648 185 1648 217 V229"/><path d="M1648 285 V297 C1648 329 1648 329 1648 361 V373" marker-end="url(#arrow-tree-dp)"/><g class="flow-edge-label" data-edge-label="tree-objective:ancestor-path-packing:ancestor-path-packing-route" tabindex="0" role="group" aria-label="選択肢：祖先と子孫を結ぶ経路を選び、頂点を共有せずに重みの合計を最大にする"><rect x="1525.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="252">祖先と子孫を結ぶ経路を選び、頂点を</text><text text-anchor="middle" x="1648" y="270">共有せずに重みの合計を最大にする</text></g></g><g class="flow-edge unknown" data-edge="tree-objective:unknown:check"><title>わからない</title><path d="M1216.286 141 V153 C1216.286 185 2012 185 2012 217 V229"/><path d="M2012 267 V297 C2012 329 2012 329 2012 361 V373" marker-end="url(#arrow-tree-dp)"/><g class="flow-edge-label" data-edge-label="tree-objective:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1967.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="2012" y="252">わからない</text></g></g><g class="flow-node route" data-node="check"><rect x="1852" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1868" y="393">分野</text><text class="node-title" x="1868" y="421">一辺を切った片側から伝える情報</text><a href="/flowchartcp/flowcharts/#diagram-tree-cut-side-information" data-route="tree-cut-side-information"><text x="1868" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="tree-objective"><rect x="942" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="958" y="52">質問</text><text class="node-title" x="958" y="80">木から求める答えはどれですか？</text><text class="node-explanation" x="958" y="107">全体の最適値と、個数別・頂点別の答えを分けます。</text></g><g class="flow-node route" data-node="colored-walk-route"><rect x="1124" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">辺の色ごとの通過回数の差</text><a href="/flowchartcp/flowcharts/#diagram-tree-colored-walk-balance" data-route="tree-colored-walk-balance"><text x="1140" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="selection-sizes-route"><rect x="32" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">木全体の最適値と選ぶ個数・辺数の条</text><text class="node-title" x="48" y="444">件</text><a href="/flowchartcp/flowcharts/#diagram-tree-selection-sizes" data-route="tree-selection-sizes"><text x="48" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="vertex-distance-goals-route"><rect x="396" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">各頂点を基準にする答えと二頂点の経</text><text class="node-title" x="412" y="444">路</text><a href="/flowchartcp/flowcharts/#diagram-tree-vertex-distance-goals" data-route="tree-vertex-distance-goals"><text x="412" y="481">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="connected-group-goals-route"><rect x="760" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">部分木・連結集合・切断後の成分</text><a href="/flowchartcp/flowcharts/#diagram-tree-connected-group-goals" data-route="tree-connected-group-goals"><text x="776" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="ancestor-path-packing-route"><rect x="1488" y="373" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="393">分野</text><text class="node-title" x="1504" y="421">祖先と子孫を結ぶ経路を選び、頂点を</text><text class="node-title" x="1504" y="444">共有せずに重みの合計を最大にする</text><a href="/flowchartcp/flowcharts/#diagram-ancestor-path-packing-conditions" data-route="ancestor-path-packing-conditions"><text x="1504" y="481">詳細の質問・図へ →</text></a></g></svg>