<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-shortest-cost-source-goals flow-desc-shortest-cost-source-goals" width="1532" height="969" viewBox="0 0 1532 969" data-flow-svg="shortest-cost-source-goals"><title id="flow-title-shortest-cost-source-goals">移動費用と距離を求める始点の解法フローチャート</title><desc id="flow-desc-shortest-cost-source-goals">通常の距離、複数始点、負の辺を含む全点対、一辺だけの割引を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-shortest-cost-source-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge normal" data-edge="movement:normal:ordinary-goal"><title>位置と辺の費用だけで次の移動が決まる</title><path d="M766.933 159 V171 C766.933 203 192 203 192 235 V247"/><path d="M192 303 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-shortest-cost-source-goals)"/><g class="flow-edge-label" data-edge-label="movement:normal:ordinary-goal" tabindex="0" role="group" aria-label="選択肢：位置と辺の費用だけで次の移動が決まる"><rect x="69.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="270">位置と辺の費用だけで次の移動が決ま</text><text text-anchor="middle" x="192" y="288">る</text></g></g><g class="flow-edge many-starts" data-edge="movement:many-starts:sources"><title>複数の開始点のどれかからの距離</title><path d="M820.267 159 V171 C820.267 203 556 203 556 235 V247"/><path d="M556 285 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-shortest-cost-source-goals)"/><g class="flow-edge-label" data-edge-label="movement:many-starts:sources" tabindex="0" role="group" aria-label="選択肢：複数の開始点のどれかからの距離"><rect x="446.5" y="247" width="219" height="38" rx="5"/><text text-anchor="middle" x="556" y="270">複数の開始点のどれかからの距離</text></g></g><g class="flow-edge all-pairs" data-edge="movement:all-pairs:reweight-cycle"><title>負の辺を含むグラフの、すべての始点からの距離</title><path d="M873.6 159 V171 C873.6 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-shortest-cost-source-goals)"/><g class="flow-edge-label" data-edge-label="movement:all-pairs:reweight-cycle" tabindex="0" role="group" aria-label="選択肢：負の辺を含むグラフの、すべての始点からの距離"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">負の辺を含むグラフの、すべての始点</text><text text-anchor="middle" x="920" y="288">からの距離</text></g></g><g class="flow-edge single-discount" data-edge="movement:single-discount:discount-route"><title>一辺だけ、費用を半分の整数切り捨てにする</title><path d="M926.933 159 V171 C926.933 203 1244.5 203 1244.5 235 V247"/><path d="M1244.5 303 V315 C1244.5 347 1284 347 1284 379 V391" marker-end="url(#arrow-shortest-cost-source-goals)"/><g class="flow-edge-label" data-edge-label="movement:single-discount:discount-route" tabindex="0" role="group" aria-label="選択肢：一辺だけ、費用を半分の整数切り捨てにする"><rect x="1122" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1244.5" y="270">一辺だけ、費用を半分の整数切り捨て</text><text text-anchor="middle" x="1244.5" y="288">にする</text></g></g><g class="flow-edge unknown" data-edge="movement:unknown:check"><title>わからない</title><path d="M980.267 159 V171 C980.267 203 1455.5 203 1455.5 235 V247"/><path d="M1455.5 285 V315 C1455.5 347 1494 347 1494 379 V391 V560 C1494 592 1378.5 592 1378.5 624 V636 V686 C1378.5 718 1337.333 718 1337.333 750 V762" marker-end="url(#arrow-shortest-cost-source-goals)"/><g class="flow-edge-label" data-edge-label="movement:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1411" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="1455.5" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="sources:yes:multi-source"><title>はい</title><path d="M476 541 V560 C476 592 556 592 556 624 V636"/><path d="M556 674 V686 C556 718 556 718 556 750 V762" marker-end="url(#arrow-shortest-cost-source-goals)"/><g class="flow-edge-label" data-edge-label="sources:yes:multi-source" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="659">はい</text></g></g><g class="flow-edge no" data-edge="sources:no:fallback"><title>いいえ</title><path d="M556 541 V560 C556 592 920 592 920 624 V636"/><path d="M920 674 V686 C920 718 920 718 920 750 V762" marker-end="url(#arrow-shortest-cost-source-goals)"/><g class="flow-edge-label" data-edge-label="sources:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="880" y="636" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="659">いいえ</text></g></g><g class="flow-edge unknown" data-edge="sources:unknown:check"><title>わからない</title><path d="M636 541 V560 C636 592 1284 592 1284 624 V636"/><path d="M1284 674 V686 C1284 718 1230.667 718 1230.667 750 V762" marker-end="url(#arrow-shortest-cost-source-goals)"/><g class="flow-edge-label" data-edge-label="sources:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="636" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="659">わからない</text></g></g><g class="flow-node question" data-node="movement"><rect x="713.6" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="729.6" y="52">質問</text><text class="node-title" x="729.6" y="80">移動の特徴はどれですか？</text><text class="node-explanation" x="729.6" y="107">元の頂点だけでは足りない情報と、移動費用を選びま</text><text class="node-explanation" x="729.6" y="125">す。</text></g><g class="flow-node route" data-node="ordinary-goal"><rect x="32" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">最小費用と経路に求める量</text><text class="node-explanation" x="48" y="466">距離だけか、最短経路の個数、安い順の経路、ラベル</text><text class="node-explanation" x="48" y="484">列まで必要かを区別します。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-distance-goals" data-route="shortest-distance-goals"><text x="48" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="sources"><rect x="396" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="412" y="411">質問</text><text class="node-title" x="412" y="439">始点が複数あり、どれか一つからの最</text><text class="node-title" x="412" y="462">短距離を求めますか？</text><text class="node-explanation" x="412" y="489">複数の始点を距離 0 で探索に入れる方法を考えま</text><text class="node-explanation" x="412" y="507">す。</text></g><g class="flow-node result" data-node="multi-source"><rect x="396" y="762" width="320" height="175" rx="7"/><text class="node-kind" x="412" y="782">候補</text><text class="node-title" x="412" y="810">複数始点から探索する</text><a href="/flowchartcp/techniques/multi-source-distance/"><title>多数の始点からの最短距離を一度に求めるの記事へ</title><text x="412" y="849">多数の始点からの最短距離を一度に求める</text></a><a href="/flowchartcp/techniques/bfs/"><title>幅優先探索の記事へ</title><text x="412" y="873">幅優先探索</text></a><a href="/flowchartcp/techniques/dijkstra/"><title>ダイクストラ法の記事へ</title><text x="412" y="897">ダイクストラ法</text></a></g><g class="flow-node result" data-node="fallback"><rect x="760" y="762" width="320" height="127" rx="7"/><text class="node-kind" x="776" y="782">候補</text><text class="node-title" x="776" y="810">重みと必要な距離を整理する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="776" y="849">状態の設計</text></a></g><g class="flow-node route" data-node="check"><rect x="1124" y="762" width="320" height="157" rx="7"/><text class="node-kind" x="1140" y="782">分野</text><text class="node-title" x="1140" y="810">移動費用の符号を確かめる</text><text class="node-explanation" x="1140" y="837">負の費用が許されるかを問題文の範囲から確かめ、適</text><text class="node-explanation" x="1140" y="855">用できる探索を判断します。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-edge-cost-sign-check" data-route="shortest-edge-cost-sign-check"><text x="1140" y="883">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="reweight-cycle"><rect x="760" y="391" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">負の辺を含む全ての始点からの距離</text><text class="node-explanation" x="776" y="466">負閉路がなく、経路の優劣を保って辺の費用を非負に</text><text class="node-explanation" x="776" y="484">変えられるかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-shortest-negative-all-pairs-details" data-route="shortest-negative-all-pairs-details"><text x="776" y="512">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="discount-route"><rect x="1124" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">一辺だけを割り引く移動</text><a href="/flowchartcp/flowcharts/#diagram-shortest-single-discount" data-route="shortest-single-discount"><text x="1140" y="476">詳細の質問・図へ →</text></a></g></svg>