5 1112 1825.917 1112 1825.917 1144 V1156" marker-end="url(#arrow-thinking-operation-goals)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1839.25" y="1030" width="80" height="38" rx="5"/><text text-anchor="middle" x="1879.25" y="1053">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1880.75 917 V954 C1880.75 986 2007.75 986 2007.75 1018 V1030"/><path d="M2007.75 1068 V1080 C2007.75 1112 1932.583 1112 1932.583 1144 V1156" marker-end="url(#arrow-thinking-operation-goals)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1963.25" y="1030" width="89" height="38" rx="5"/><text text-anchor="middle" x="2007.75" y="1053">わからない</text></g></g><g class="flow-node question" data-node="reason-task"><rect x="1277" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="1293" y="52">質問</text><text class="node-title" x="1293" y="80">操作や解の特徴として、どれを調べた</text><text class="node-title" x="1293" y="103">いですか？</text><text class="node-explanation" x="1293" y="130">入力例から見える構造と、まだ示せていない主張を選</text><text class="node-explanation" x="1293" y="148">びます。</text></g><g class="flow-node question" data-node="last-operation"><rect x="32" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="434">質問</text><text class="node-title" x="48" y="462">完成形のどこかから、最後に作られた</text><text class="node-title" x="48" y="485">部分を特定できますか？</text><text class="node-explanation" x="48" y="512">その部分を取り除くと、同じ種類の小さい問題へ戻せ</text><text class="node-explanation" x="48" y="530">るか考えます。</text></g><g class="flow-node result" data-node="last-result"><rect x="32" y="785" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="805">候補</text><text class="node-title" x="48" y="833">最後の操作を特定して逆に取り除く</text><a href="/flowchartcp/techniques/construct-last-operation/"><title>挿入の構築を、最後に取り除ける要素から逆算するの記事へ</title><text x="48" y="872">挿入の構築を、最後に取り除ける要素から逆算する</text></a><a href="/flowchartcp/techniques/reverse-thinking/"><title>逆順処理の記事へ</title><text x="48" y="896">逆順処理</text></a></g><g class="flow-node route" data-node="reference"><rect x="396" y="785" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="805">分野</text><text class="node-title" x="412" y="833">小さい入力の全列挙と規則の観察</text><text class="node-explanation" x="412" y="860">全列挙で得た答えや最適解を調べ、候補となる規則を</text><text class="node-explanation" x="412" y="878">探します。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-small-input-enumeration" data-route="thinking-small-input-enumeration"><text x="412" y="906">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1640.75" y="785" width="320" height="132" rx="7"/><text class="node-kind" x="1656.75" y="805">質問</text><text class="node-title" x="1656.75" y="833">手で追える入力の、操作と答えを列挙</text><text class="node-title" x="1656.75" y="856">できますか？</text><text class="node-explanation" x="1656.75" y="883">抽象的な式を、最小の例に戻して確認します。</text></g><g class="flow-node result" data-node="observation"><rect x="1355.25" y="1156" width="320" height="127" rx="7"/><text class="node-kind" x="1371.25" y="1176">候補</text><text class="node-title" x="1371.25" y="1204">小規模全探索から観察する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="1371.25" y="1243">小さい入力で全探索する</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1719.25" y="1156" width="320" height="139" rx="7"/><text class="node-kind" x="1735.25" y="1176">分野</text><text class="node-title" x="1735.25" y="1204">条件を確かめる</text><text class="node-explanation" x="1735.25" y="1231">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1735.25" y="1259">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="reverse"><rect x="396" y="414" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">逆向きの操作と、局所的な選択</text><text class="node-explanation" x="412" y="489">操作を戻したときの選択肢と、局所的な選択を正当化</text><text class="node-explanation" x="412" y="507">する条件を調べます。</text><a href="/flowchartcp/flowcharts/#diagram-thinking-reverse-choices" data-route="thinking-reverse-choices"><text x="412" y="535">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="graph-build-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">距離 2 の頂点対の個数を合わせる</text><a href="/flowchartcp/flowcharts/#diagram-graph-distance-construction" data-route="graph-distance-construction"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="sequence-goal-route"><rect x="1124" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="434">分野</text><text class="node-title" x="1140" y="462">列を変える操作と、目標の形</text><a href="/flowchartcp/flowcharts/#diagram-sequence-operation-goals" data-route="sequence-operation-goals"><text x="1140" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="mex-or-square-route"><rect x="1488" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="434">分野</text><text class="node-title" x="1504" y="462">配列全体のmexで値を置き換える、</text><text class="node-title" x="1504" y="485">または二度の並べ替えを指定する</text><a href="/flowchartcp/flowcharts/#diagram-sequence-mex-square-goals" data-route="sequence-mex-square-goals"><text x="1504" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="alternating-switches-route"><rect x="1852" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="1868" y="434">分野</text><text class="node-title" x="1868" y="462">交互に出口が変わる回路で、指定列を</text><text class="node-title" x="1868" y="485">出して全状態を元に戻す</text><a href="/flowchartcp/flowcharts/#diagram-alternating-switch-circuit-conditions" data-route="alternating-switch-circuit-conditions"><text x="1868" y="522">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="degree-preserving-tree-route"><rect x="2216" y="414" width="320" height="144" rx="7"/><text class="node-kind" x="2232" y="434">分野</text><text class="node-title" x="2232" y="462">元の次数を変える頂点を最少にして、</text><text class="node-title" x="2232" y="485">木へ作り直す</text><a href="/flowchartcp/flowcharts/#diagram-tree-degree-preservation-conditions" data-route="tree-degree-preservation-conditions"><text x="2232" y="522">詳細の質問・図へ →</text></a></g></svg>