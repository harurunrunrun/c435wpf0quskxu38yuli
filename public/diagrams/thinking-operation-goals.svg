<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-thinking-operation-goals flow-desc-thinking-operation-goals" width="2624" height="1327" viewBox="0 0 2624 1327" data-flow-svg="thinking-operation-goals"><title id="flow-title-thinking-operation-goals">操作を戻す・条件に合う形を作るの解法フローチャート</title><desc id="flow-desc-thinking-operation-goals">完成形を作る操作や、操作を逆にたどったときの変化を調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-thinking-operation-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge construct" data-edge="reason-task:construct:last-operation"><title>完成形から、最後の操作を考える</title><path d="M1312.556 182 V194 C1312.556 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-thinking-operation-goals)"/><g class="flow-edge-label" data-edge-label="reason-task:construct:last-operation" tabindex="0" role="group" aria-label="選択肢：完成形から、最後の操作を考える"><rect x="82.5" y="270" width="219" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">完成形から、最後の操作を考える</text></g></g><g class="flow-edge reverse" data-edge="reason-task:reverse:reverse"><title>削除・分割を逆向きの追加・併合にする</title><path d="M1348.111 182 V194 C1348.111 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-thinking-operation-goals)"/><g class="flow-edge-label" data-edge-label="reason-task:reverse:reverse" tabindex="0" role="group" aria-label="選択肢：削除・分割を逆向きの追加・併合にする"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">削除・分割を逆向きの追加・併合にす</text><text text-anchor="middle" x="556" y="311">る</text></g></g><g class="flow-edge graph-build" data-edge="reason-task:graph-build:graph-build-route"><title>距離や個数の条件を満たすグラフを出力する</title><path d="M1383.667 182 V194 C1383.667 226 920 226 920 258 V270"/><path d="M9