x="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-edge yes" data-edge="small-k:yes:answer"><title>はい</title><path d="M239.5 979 V991 C239.5 1023 192 1023 192 1055 V1067"/><path d="M192 1105 V1117 C192 1149 192 1149 192 1181 V1193" marker-end="url(#arrow-top-k-bounded-subarray-conditions)"/><g class="flow-edge-label" data-edge-label="small-k:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1067" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1090">はい</text></g></g><g class="flow-edge no" data-edge="small-k:no:check"><title>いいえ</title><path d="M319.5 979 V991 C319.5 1023 319 1023 319 1055 V1067"/><path d="M319 1105 V1117 C319 1149 441.714 1149 441.714 1181 V1193" marker-end="url(#arrow-top-k-bounded-subarray-conditions)"/><g class="flow-edge-label" data-edge-label="small-k:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1067" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1090">いいえ</text></g></g><g class="flow-edge unknown" data-edge="small-k:unknown:check"><title>わからない</title><path d="M399.5 979 V991 C399.5 1023 447.5 1023 447.5 1055 V1067"/><path d="M447.5 1105 V1117 C447.5 1149 487.429 1149 487.429 1181 V1193" marker-end="url(#arrow-top-k-bounded-subarray-conditions)"/><g class="flow-edge-label" data-edge-label="small-k:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1067" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1090">わからない</text></g></g><g class="flow-node question" data-node="length"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">更新のない整数列で、全区間に共通す</text><text class="node-title" x="400.5" y="103">る長さの下限Lと上限Rがあります</text><text class="node-title" x="400.5" y="126">か？</text><text class="node-explanation" x="400.5" y="153">負数も使えます。左端を固定したとき、右端候補が一</text><text class="node-explanation" x="400.5" y="171">つの連続範囲になります。</text></g><g class="flow-node question" data-node="overlap"><rect x="272.5" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">区間同士は重なってよく、同じ両端の</text><text class="node-title" x="288.5" y="490">区間を二度選ぶことだけが禁止です</text><text class="node-title" x="288.5" y="513">か？</text><text class="node-explanation" x="288.5" y="540">同じ和でも両端が違えば別の候補です。互いに素な区</text><text class="node-explanation" x="288.5" y="558">間を選ぶ分割問題ではありません。</text></g><g class="flow-node question" data-node="small-k"><rect x="159.5" y="806" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="826">質問</text><text class="node-title" x="175.5" y="854">必要なのは大きい順のK個またはその</text><text class="node-title" x="175.5" y="877">和で、K回の取り出しが制限内です</text><text class="node-title" x="175.5" y="900">か？</text><text class="node-explanation" x="175.5" y="927">元の候補は二次個になり得ます。Kが大きければ、そ</text><text class="node-explanation" x="175.5" y="945">の個数分の処理は避けられません。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1193" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1213">候補</text><text class="node-title" x="48" y="1241">右端範囲の最大を取り出し、残りを左</text><text class="node-title" x="48" y="1264">右の候補範囲へ分ける</text><a href="/flowchartcp/techniques/top-k-bounded-subarray-sums/"><title>長さ制限のある区間和の上位K個は、右端候補を分割して取り出すの記事へ</title><text x="48" y="1303">長さ制限のある区間和の上位K個は、右端候補を分</text><text x="48" y="1321">割して取り出す</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1193" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1213">分野</text><text class="node-title" x="412" y="1241">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1278">詳細の質問・図へ →</text></a></g></svg>