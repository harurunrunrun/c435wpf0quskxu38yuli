<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-top-k-bounded-subarray-conditions flow-desc-top-k-bounded-subarray-conditions" width="748" height="1393" viewBox="0 0 748 1393" data-flow-svg="top-k-bounded-subarray-conditions"><title id="flow-title-top-k-bounded-subarray-conditions">長さ制限付き区間和の上位K個の解法フローチャート</title><desc id="flow-desc-top-k-bounded-subarray-conditions">固定配列、区間の重なり、必要な候補数を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-top-k-bounded-subarray-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="length:yes:overlap"><title>はい</title><path d="M464.5 205 V217 C464.5 249 419 249 419 281 V293"/><path d="M419 331 V343 C419 375 432.5 375 432.5 407 V419" marker-end="url(#arrow-top-k-bounded-subarray-conditions)"/><g class="flow-edge-label" data-edge-label="length:yes:overlap" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="316">はい</text></g></g><g class="flow-edge no" data-edge="length:no:check"><title>いいえ</title><path d="M544.5 205 V217 C544.5 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V604 C654 636 654 636 654 668 V680 V730 C654 762 654 762 654 794 V806 V991 C654 1023 654 1023 654 1055 V1067 V1117 C654 1149 624.571 1149 624.571 1181 V1193" marker-end="url(#arrow-top-k-bounded-subarray-conditions)"/><g class="flow-edge-label" data-edge-label="length:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="length:unknown:check"><title>わからない</title><path d="M624.5 205 V217 C624.5 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 40