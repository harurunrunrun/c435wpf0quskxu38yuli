<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-choose-nearest flow-desc-choose-nearest" width="1476" height="1325" viewBox="0 0 1476 1325" data-flow-svg="choose-nearest"><title id="flow-title-choose-nearest">K 個の位置と最寄りの距離の解法フローチャート</title><desc id="flow-desc-choose-nearest">各位置の重みと、選んだ位置までの距離の費用を使います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-choose-nearest" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="partition:yes:representation"><title>はい</title><path d="M1056.167 182 V194 C1056.167 226 738 226 738 258 V270"/><path d="M738 308 V320 C738 352 738 352 738 384 V396" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="partition:yes:representation" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="698" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="738" y="293">はい</text></g></g><g class="flow-edge no" data-edge="partition:no:check"><title>いいえ</title><path d="M1136.167 182 V194 C1136.167 226 1271 226 1271 258 V270"/><path d="M1271 308 V320 C1271 352 1378.5 352 1378.5 384 V396 V558 C1378.5 590 1378.5 590 1378.5 622 V634 V702 C1378.5 734 1284 734 1284 766 V778" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="partition:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="partition:unknown:check"><title>わからない</title><path d="M1216.167 182 V194 C1216.167 226 1399.5 226 1399.5 258 V270"/><path d="M1399.5 308 V320 C1399.5 352 1434.5 352 1434.5 384 V396 V558 C1434.5 590 1434.5 590 1434.5 622 V634 V702 C1434.5 734 1364 734 1364 766 V778" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="partition:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="293">わからない</text></g></g><g class="flow-edge count" data-edge="representation:count:count-route"><title>個数を変えたときの最適値の差</title><path d="M642 546 V558 C642 590 192 590 192 622 V634"/><path d="M192 672 V702 C192 734 192 734 192 766 V778" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="representation:count:count-route" tabindex="0" role="group" aria-label="選択肢：個数を変えたときの最適値の差"><rect x="89" y="634" width="206" height="38" rx="5"/><text text-anchor="middle" x="192" y="657">個数を変えたときの最適値の差</text></g></g><g class="flow-edge split" data-edge="representation:split:split-route"><title>区間を変えたときの最適な境界の位置</title><path d="M706 546 V558 C706 590 556 590 556 622 V634"/><path d="M556 672 V702 C556 734 556 734 556 766 V778" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="representation:split:split-route" tabindex="0" role="group" aria-label="選択肢：区間を変えたときの最適な境界の位置"><rect x="433.5" y="634" width="245" height="38" rx="5"/><text text-anchor="middle" x="556" y="657">区間を変えたときの最適な境界の位置</text></g></g><g class="flow-edge functions" data-edge="representation:functions:function-route"><title>各候補の費用関数の大小が入れ替わる回数</title><path d="M770 546 V558 C770 590 920 590 920 622 V634"/><path d="M920 690 V702 C920 734 920 734 920 766 V778" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="representation:functions:function-route" tabindex="0" role="group" aria-label="選択肢：各候補の費用関数の大小が入れ替わる回数"><rect x="797.5" y="634" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="657">各候補の費用関数の大小が入れ替わる</text><text text-anchor="middle" x="920" y="675">回数</text></g></g><g class="flow-edge unknown" data-edge="representation:unknown:check"><title>わからない</title><path d="M834 546 V558 C834 590 1284 590 1284 622 V634"/><path d="M1284 672 V702 C1284 734 1204 734 1204 766 V778" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="representation:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:cost-result"><title>はい</title><path d="M1204 928 V940 C1204 972 920 972 920 1004 V1016"/><path d="M920 1054 V1066 C920 1098 920 1098 920 1130 V1142" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="check:yes:cost-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 928 V940 C1284 972 1271 972 1271 1004 V1016"/><path d="M1271 1054 V1066 C1271 1098 1230.667 1098 1230.667 1130 V1142" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 928 V940 C1364 972 1399.5 972 1399.5 1004 V1016"/><path d="M1399.5 1054 V1066 C1399.5 1098 1337.333 1098 1337.333 1130 V1142" marker-end="url(#arrow-choose-nearest)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="partition"><rect x="976.1666666666667" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="992.1666666666667" y="52">質問</text><text class="node-title" x="992.1666666666667" y="80">選んだ位置を並べると、最寄りの位置</text><text class="node-title" x="992.1666666666667" y="103">ごとに連続する区間へ分かれますか？</text><text class="node-explanation" x="992.1666666666667" y="130">境界の同距離の点を一方へ寄せ、区間ごとの費用に分</text><text class="node-explanation" x="992.1666666666667" y="148">けます。</text></g><g class="flow-node question" data-node="representation"><rect x="578" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="594" y="416">質問</text><text class="node-title" x="594" y="444">区間の費用を式にした後、どの特徴を</text><text class="node-title" x="594" y="467">確認しますか？</text><text class="node-explanation" x="594" y="494">いずれも同じ元の問題の費用から導く条件です。方法</text><text class="node-explanation" x="594" y="512">名ではなく、必要な性質を選びます。</text></g><g class="flow-node question" data-node="check"><rect x="1124" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="798">質問</text><text class="node-title" x="1140" y="826">区間ごとの費用を、重みと距離の和と</text><text class="node-title" x="1140" y="849">して計算できますか？</text><text class="node-explanation" x="1140" y="876">小さい列を区間へ分け、選ぶ位置を直接試して式を確</text><text class="node-explanation" x="1140" y="894">認します。</text></g><g class="flow-node route" data-node="count-route"><rect x="32" y="778" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="798">分野</text><text class="node-title" x="48" y="826">個数を固定する・位置を調整する</text><a href="/flowchartcp/flowcharts/#diagram-dp-convex" data-route="dp-convex"><text x="48" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="split-route"><rect x="396" y="778" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="798">分野</text><text class="node-title" x="412" y="826">区間分割の最適な位置</text><a href="/flowchartcp/flowcharts/#diagram-dp-monge" data-route="dp-monge"><text x="412" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="function-route"><rect x="760" y="778" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="798">分野</text><text class="node-title" x="776" y="826">位置・高さによる候補の費用</text><a href="/flowchartcp/flowcharts/#diagram-dp-affine" data-route="dp-affine"><text x="776" y="863">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="1162">分野</text><text class="node-title" x="1140" y="1190">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="1227">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="cost-result"><rect x="760" y="1142" width="320" height="151" rx="7"/><text class="node-kind" x="776" y="1162">候補</text><text class="node-title" x="776" y="1190">小さい区間で費用の式を確認する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="776" y="1229">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/contribution/"><title>寄与の数え上げの記事へ</title><text x="776" y="1253">寄与の数え上げ</text></a></g></svg>