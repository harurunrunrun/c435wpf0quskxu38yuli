-only:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="balanced-and-bounds:yes:result"><title>はい</title><path d="M239.5 969 V981 C239.5 1013 192 1013 192 1045 V1057"/><path d="M192 1095 V1107 C192 1139 192 1139 192 1171 V1183" marker-end="url(#arrow-oriented-pair-swaps-conditions)"/><g class="flow-edge-label" data-edge-label="balanced-and-bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="balanced-and-bounds:no:check"><title>いいえ</title><path d="M319.5 969 V981 C319.5 1013 319 1013 319 1045 V1057"/><path d="M319 1095 V1107 C319 1139 441.714 1139 441.714 1171 V1183" marker-end="url(#arrow-oriented-pair-swaps-conditions)"/><g class="flow-edge-label" data-edge-label="balanced-and-bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="balanced-and-bounds:unknown:check"><title>わからない</title><path d="M399.5 969 V981 C399.5 1013 447.5 1013 447.5 1045 V1057"/><path d="M447.5 1095 V1107 C447.5 1139 487.429 1139 487.429 1171 V1183" marker-end="url(#arrow-oriented-pair-swaps-conditions)"/><g class="flow-edge-label" data-edge-label="balanced-and-bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1080">わからない</text></g></g><g class="flow-node question" data-node="oriented-equal-pairs"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">同サイズの左・右を隣り合わせ、対ど</text><text class="node-title" x="400.5" y="103">うしの順序は自由ですか？</text><text class="node-explanation" x="400.5" y="130">同じサイズが複数対あっても構いません。左を負、右</text><text class="node-explanation" x="400.5" y="148">を正とし、各対は左・右の順に並べます。</text></g><g class="flow-node question" data-node="adjacent-only"><rect x="272.5" y="396" width="320" height="168" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">隣接する二要素の交換だけを使い、交</text><text class="node-title" x="288.5" y="467">換回数を最小にしますか？</text><text class="node-explanation" x="288.5" y="494">値の変更や要素の追加・削除は行いません。離れた二</text><text class="node-explanation" x="288.5" y="512">位置の交換を一回と数える場合とは費用が異なりま</text><text class="node-explanation" x="288.5" y="530">す。</text></g><g class="flow-node question" data-node="balanced-and-bounds"><rect x="159.5" y="778" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="798">質問</text><text class="node-title" x="175.5" y="826">全サイズで左右の個数が等しく、列長</text><text class="node-title" x="175.5" y="849">とサイズ値は32ビット整数の範囲に</text><text class="node-title" x="175.5" y="872">収まりますか？</text><text class="node-explanation" x="175.5" y="899">列長は偶数でINT_MAX以下。サイズは1以上で</text><text class="node-explanation" x="175.5" y="917">INT_MAX以下とし、答えは64ビット整数で返</text><text class="node-explanation" x="175.5" y="935">します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">最初の未処理要素と最も近い相手を対</text><text class="node-title" x="48" y="1254">にし、間に残る個数を数える</text><a href="/flowchartcp/techniques/oriented-equal-pair-adjacent-swaps-fenwick/"><title>隣接交換で同サイズの左右を対にする最小回数の記事へ</title><text x="48" y="1293">隣接交換で同サイズの左右を対にする最小回数</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1183" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1203">分野</text><text class="node-title" x="412" y="1231">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1268">詳細の質問・図へ →</text></a></g></svg>