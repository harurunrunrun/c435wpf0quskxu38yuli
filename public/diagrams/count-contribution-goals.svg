wchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="300" y="1170">対称性</text></a></g><g class="flow-node result" data-node="zeta"><rect x="228" y="1429" width="320" height="127" rx="7"/><text class="node-kind" x="244" y="1449">候補</text><text class="node-title" x="244" y="1477">部分集合ゼータ変換</text><a href="/flowchartcp/techniques/subset-transform/"><title>部分集合ゼータ変換の記事へ</title><text x="244" y="1516">部分集合ゼータ変換</text></a></g><g class="flow-node result" data-node="digit"><rect x="396" y="1775" width="320" height="127" rx="7"/><text class="node-kind" x="412" y="1795">候補</text><text class="node-title" x="412" y="1823">桁 DP</text><a href="/flowchartcp/techniques/digit-dp/"><title>桁DPの記事へ</title><text x="412" y="1862">桁DP</text></a></g><g class="flow-node result" data-node="fallback"><rect x="452" y="2121" width="320" height="151" rx="7"/><text class="node-kind" x="468" y="2141">候補</text><text class="node-title" x="468" y="2169">小規模全探索で数え方を確認する</text><a href="/flowchartcp/techniques/brute-force-observation/"><title>小さい入力で全探索するの記事へ</title><text x="468" y="2208">小さい入力で全探索する</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="468" y="2232">反例探し</text></a></g><g class="flow-node question" data-node="contribution-kind"><rect x="521.625" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="537.625" y="52">質問</text><text class="node-title" x="537.625" y="80">各選び方の、どの量を合計しますか？</text><text class="node-explanation" x="537.625" y="107">添字で選択を区別するかを確認します。</text></g><g class="flow-node route" data-node="extrema-route"><rect x="32" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">選んだ最大値・最小値の寄与</text><a href="/flowchartcp/flowcharts/#diagram-subset-extrema" data-route="subset-extrema"><text x="48" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="box-expectation-route"><rect x="396" y="373" width="320" height="121" rx="7"/><text cla