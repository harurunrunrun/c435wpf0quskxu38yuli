ount-contribution-goals)"/><g class="flow-edge-label" data-edge-label="contribution-kind:other:contribution" tabindex="0" role="group" aria-label="選択肢：要素・位置・組ごとのその他の寄与"><rect x="771" y="229" width="232" height="38" rx="5"/><text text-anchor="middle" x="887" y="252">要素・位置・組ごとのその他の寄与</text></g></g><g class="flow-edge unknown" data-edge="contribution-kind:unknown:check"><title>わからない</title><path d="M777.625 141 V153 C777.625 185 1091.5 185 1091.5 217 V229"/><path d="M1091.5 267 V297 C1091.5 329 1130 329 1130 361 V373 V535 C1130 567 1130 567 1130 599 V611 V661 C1130 693 1130 693 1130 725 V737 V881 C1130 913 1130 913 1130 945 V957 V1007 C1130 1039 1130 1039 1130 1071 V1083 V1227 C1130 1259 1130 1259 1130 1291 V1303 V1353 C1130 1385 1130 1385 1130 1417 V1429 V1573 C1130 1605 1130 1605 1130 1637 V1649 V1699 C1130 1731 1082.667 1731 1082.667 1763 V1775" marker-end="url(#arrow-count-contribution-goals)"/><g class="flow-edge-label" data-edge-label="contribution-kind:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="252">わからない</text></g></g><g class="flow-node question" data-node="contribution"><rect x="760" y="373" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="393">質問</text><text class="node-title" x="776" y="421">答えを各要素・各位置・各組の寄与の</text><text class="node-title" x="776" y="444">和にできますか？</text><text class="node-explanation" x="776" y="471">対象を列挙する代わりに、一つの要素が含まれる回数</text><text class="node-explanation" x="776" y="489">を数えます。</text></g><g class="flow-node question" data-node="symmetry"><rect x="704" y="737" width="320" height="132" rx="7"/><text class="node-kind" x="720" y="757">質問</text><text class="node-title" x="720" y="785">回転・並べ替えなどで同じものになる</text><text class="node-title" x="720" y="808">状態がありますか？</text><text class="node-explanation" x="720" y="835">代表を選ぶか、同値類の大きさの違いを考慮します。</text></g><g class="flow-node question" data-node="subsets"><rect x="648" 