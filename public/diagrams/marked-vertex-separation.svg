<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-marked-vertex-separation flow-desc-marked-vertex-separation" width="1112" height="2077" viewBox="0 0 1112 2077" data-flow-svg="marked-vertex-separation"><title id="flow-title-marked-vertex-separation">必要な分岐と印だけを残し、未印頂点の削除を下から決めるの解法フローチャート</title><desc id="flow-desc-marked-vertex-separation">頂点削除と辺削除、印の削除禁止、削除費用の等しさを確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-marked-vertex-separation" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge unmarked-vertices" data-edge="model:unmarked-vertices:goal"><title>未印頂点だけを、頂点一個の費用 1 で削除できる</title><path d="M605.125 182 V194 C605.125 226 311.5 226 311.5 258 V270"/><path d="M311.5 326 V338 C311.5 370 708.778 370 708.778 402 V414" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="model:unmarked-vertices:goal" tabindex="0" role="group" aria-label="選択肢：未印頂点だけを、頂点一個の費用 1 で削除できる"><rect x="189" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="311.5" y="293">未印頂点だけを、頂点一個の費用 1</text><text text-anchor="middle" x="311.5" y="311"> で削除できる</text></g></g><g class="flow-edge weighted-vertices" data-edge="model:weighted-vertices:fallback"><title>未印頂点を削除できるが、費用が頂点ごとに違う</title><path d="M669.125 182 V194 C669.125 226 600.5 226 600.5 258 V270"/><path d="M600.5 326 V338 C600.5 370 962 370 962 402 V414 V576 C962 608 962 608 962 640 V652 V702 C962 734 962 734 962 766 V778 V958 C962 990 962 990 962 1022 V1034 V1084 C962 1116 962 1116 962 1148 V1160 V1340 C962 1372 962 1372 962 1404 V1416 V1466 C962 1498 588 1498 588 1530 V1542" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="model:weighted-vertices:fallback" tabindex="0" role="group" aria-label="選択肢：未印頂点を削除できるが、費用が頂点ごとに違う"><rect x="478" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="600.5" y="293">未印頂点を削除できるが、費用が頂点</text><text text-anchor="middle" x="600.5" y="311">ごとに違う</text></g></g><g class="flow-edge edges" data-edge="model:edges:fallback"><title>頂点ではなく辺を削除する</title><path d="M733.125 182 V194 C733.125 226 857 226 857 258 V270"/><path d="M857 308 V338 C857 370 1018 370 1018 402 V414 V576 C1018 608 1018 608 1018 640 V652 V702 C1018 734 1018 734 1018 766 V778 V958 C1018 990 1018 990 1018 1022 V1034 V1084 C1018 1116 1018 1116 1018 1148 V1160 V1340 C1018 1372 1018 1372 1018 1404 V1416 V1466 C1018 1498 652 1498 652 1530 V1542" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="model:edges:fallback" tabindex="0" role="group" aria-label="選択肢：頂点ではなく辺を削除する"><rect x="767" y="270" width="180" height="38" rx="5"/><text text-anchor="middle" x="857" y="293">頂点ではなく辺を削除する</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M797.125 182 V194 C797.125 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V576 C1074 608 1074 608 1074 640 V652 V702 C1074 734 1074 734 1074 766 V778 V958 C1074 990 1074 990 1074 1022 V1034 V1084 C1074 1116 1074 1116 1074 1148 V1160 V1340 C1074 1372 1074 1372 1074 1404 V1416 V1466 C1074 1498 1016 1498 1016 1530 V1542" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="goal:yes:adjacent-marks"><title>はい</title><path d="M628.778 564 V576 C628.778 608 519.833 608 519.833 640 V652"/><path d="M519.833 690 V702 C519.833 734 519.833 734 519.833 766 V778" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="goal:yes:adjacent-marks" tabind