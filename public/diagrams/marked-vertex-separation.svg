8 V1340 C584 1372 556 1372 556 1404 V1416"/><path d="M556 1454 V1466 C556 1498 460 1498 460 1530 V1542" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1416" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1439">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M664 1328 V1340 C664 1372 699.5 1372 699.5 1404 V1416"/><path d="M699.5 1454 V1466 C699.5 1498 824 1498 824 1530 V1542" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="655" y="1416" width="89" height="38" rx="5"/><text text-anchor="middle" x="699.5" y="1439">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1692 V1722 C840 1754 783 1754 783 1786 V1798"/><path d="M783 1836 V1848 C783 1880 828.5 1880 828.5 1912 V1924" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1798" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1821">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1692 V1722 C920 1754 907 1754 907 1786 V1798"/><path d="M907 1836 V1848 C907 1880 908.5 1880 908.5 1912 V1924" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1798" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1821">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1692 V1722 C1000 1754 1035.5 1754 1035.5 1786 V1798"/><path d="M1035.5 1836 V1848 C1035.5 1880 988.5 1880 988.5 1912 V1924" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1798" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1821">わからない</text></g></g><g class="flow-edge yes" data-edge="adjacent-marks:yes:impossible"><title>はい</title><path d="M439.833 946 V958 C439.833 990 220 990 220 1022 V1034"/><path d="M220 1072 V1084 C220 1116 220 1116 220 1148 V1160" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="adjacent-marks:yes:impossible" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="180" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="220" y="1057">はい</text></g></g><g class="flow-edge no" data-edge="adjacent-marks:no:guard"><title>いいえ</title><path d="M519.833 946 V958 C519.833 990 584 990 584 1022 V1034"/><path d="M584 1072 V1084 C584 1116 584 1116 584 1148 V1160" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="adjacent-marks:no:guard" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="544" y="1034" width="80" height="38" rx="5"/><text text-anchor="middle" x="584" y="1057">いいえ</text></g></g><g class="flow-edge unknown" data-edge="adjacent-marks:unknown:check"><title>わからない</title><path d="M599.833 946 V958 C599.833 990 755.5 990 755.5 1022 V1034"/><path d="M755.5 1072 V1084 C755.5 1116 794 1116 794 1148 V1160 V1340 C794 1372 794 1372 794 1404 V1416 V1466 C794 1498 888 1498 888 1530 V1542" marker-end="url(#arrow-marked-vertex-separation)"/><g class="flow-edge-label" data-edge-label="adjacent-marks:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1034" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1057">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="541.125" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="557.125" y="52">質問</text><text class="node-title" x="557.125" y="80">印頂点を分離するとき、何を削除でき</text><text class="node-title" x="557.125" y="103">ますか？</text><text class="node-explanation" x="557.125" y="130">頂点削除と辺削除、印の削除禁止、削除費用の等しさ</text><text class="node-explanation" x="557.125" y="148">を確認します。</text></g><g class="flow-node question" data-node="goal"><rect x="548.7777777777778" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="564.7777777777778" y="434">質問</text><text class="node-title" x="564.7777777777778" y="462">固定された無向木で、各問い合わせの</text><text class="node-title" x="564.7777777777778" y="485">印頂点は削除禁止ですか？</text><text class="node-explanation" x="564.7777777777778" y="512">削除後のどの連結成分にも、印頂点が二個以上残らな</text><text class="node-explanation" x="564.7777777777778" y="530">いことを要求します。</text></g><g class="flow-node question" data-node="guard"><rect x="424" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="440" y="1180">質問</text><text class="node-title" x="440" y="1208">印と、それらをつなぐ必要な分岐点だ</text><text class="node-title" x="440" y="1231">けに問い合わせを縮められますか？</text><text class="node-explanation" x="440" y="1258">元の深さと共通祖先で途中の枝を圧縮します。一本の</text><text class="node-explanation" x="440" y="1276">圧縮辺の途中に未印頂点があるかは、元の木の距離で</text><text class="node-explanation" x="440" y="1294">判定します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1542" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1562">候補</text><text class="node-title" x="48" y="1590">必要な分岐と印だけを残し、未印頂点</text><text class="node-title" x="48" y="1613">の削除を下から決める</text><a href="/flowchartcp/techniques/virtual-tree-marked-vertex-separation/"><title>木の指定頂点同士を切り離す最少削除は、合流点と指定頂点だけで判断するの記事へ</title><text x="48" y="1652">木の指定頂点同士を切り離す最少削除は、合流点と</text><text x="48" y="1670">指定頂点だけで判断する</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1542" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1562">候補</text><text class="node-title" x="412" y="1590">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1629">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1653">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1542" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1562">質問</text><text class="node-title" x="776" y="1590">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1613">書き出せますか？</text><text class="node-explanation" x="776" y="1640">頂点削除と辺削除、印の削除禁止、削除費用の等しさ</text><text class="node-explanation" x="776" y="1658">を確認します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1924" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1944">分野</text><text class="node-title" x="764.5" y="1972">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="2009">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="adjacent-marks"><rect x="359.83333333333337" y="778" width="320" height="168" rx="7"/><text class="node-kind" x="375.83333333333337" y="798">質問</text><text class="node-title" x="375.83333333333337" y="826">元の木で、印の付いた二頂点が直接隣</text><text class="node-title" x="375.83333333333337" y="849">り合いますか？</text><text class="node-explanation" x="375.83333333333337" y="876">二つの印の間に削除できる頂点がないため、隣接した</text><text class="node-explanation" x="375.83333333333337" y="894">印があれば不可能です。圧縮後の隣接だけで判定しま</text><text class="node-explanation" x="375.83333333333337" y="912">せん。</text></g><g class="flow-node result" data-node="impossible"><rect x="60" y="1160" width="320" height="168" rx="7"/><text class="node-kind" x="76" y="1180">候補</text><text class="node-title" x="76" y="1208">隣接した印は、未印頂点の削除では分</text><text class="node-title" x="76" y="1231">離できない</text><a href="/flowchartcp/techniques/virtual-tree-marked-vertex-separation/"><title>木の指定頂点同士を切り離す最少削除は、合流点と指定頂点だけで判断するの記事へ</title><text x="76" y="1270">木の指定頂点同士を切り離す最少削除は、合流点と</text><text x="76" y="1288">指定頂点だけで判断する</text></a></g></svg>