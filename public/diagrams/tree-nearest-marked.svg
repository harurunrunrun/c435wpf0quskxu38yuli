<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-nearest-marked flow-desc-tree-nearest-marked" width="916" height="1325" viewBox="0 0 916 1325" data-flow-svg="tree-nearest-marked"><title id="flow-title-tree-nearest-marked">印が増える木の最寄り距離の解法フローチャート</title><desc id="flow-desc-tree-nearest-marked">削除のない印の追加と、最寄り距離の問い合わせを扱います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-nearest-marked" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge add" data-edge="changes:add:weights"><title>追加だけで、一度付いた印は残る</title><path d="M488.75 164 V176 C488.75 208 297.5 208 297.5 240 V252"/><path d="M297.5 290 V302 C297.5 334 439.333 334 439.333 366 V378" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="changes:add:weights" tabindex="0" role="group" aria-label="選択肢：追加だけで、一度付いた印は残る"><rect x="188" y="252" width="219" height="38" rx="5"/><text text-anchor="middle" x="297.5" y="275">追加だけで、一度付いた印は残る</text></g></g><g class="flow-edge remove" data-edge="changes:remove:fallback"><title>追加と削除がある</title><path d="M552.75 164 V176 C552.75 208 515 208 515 240 V252"/><path d="M515 290 V302 C515 334 649.333 334 649.333 366 V378 V558 C649.333 590 492 590 492 622 V634 V684 C492 716 458 716 458 748 V760 V940 C458 972 416 972 416 1004 V1016 V1066 C416 1098 328 1098 328 1130 V1142" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="changes:remove:fallback" tabindex="0" role="group" aria-label="選択肢：追加と削除がある"><rect x="451" y="252" width="128" height="38" rx="5"/><text text-anchor="middle" x="515" y="275">追加と削除がある</text></g></g><g class="flow-edge fixed" data-edge="changes:fixed:fallback"><title>印付き集合は固定</title><path d="M616.75 164 V176 C616.75 208 687 208 687 240 V252"/><path d="M687 290 V302 C687 334 705.333 334 705.333 366 V378 V558 C705.333 590 548 590 548 622 V634 V684 C548 716 514 716 514 748 V760 V940 C514 972 596 972 596 1004 V1016 V1066 C596 1098 456 1098 456 1130 V1142" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="changes:fixed:fallback" tabindex="0" role="group" aria-label="選択肢：印付き集合は固定"><rect x="623" y="252" width="128" height="38" rx="5"/><text text-anchor="middle" x="687" y="275">印付き集合は固定</text></g></g><g class="flow-edge unknown" data-edge="changes:unknown:check"><title>わからない</title><path d="M680.75 164 V176 C680.75 208 839.5 208 839.5 240 V252"/><path d="M839.5 290 V302 C839.5 334 818.5 334 818.5 366 V378 V558 C818.5 590 818.5 590 818.5 622 V634 V684 C818.5 716 777.333 716 777.333 748 V760" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="changes:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="795" y="252" width="89" height="38" rx="5"/><text text-anchor="middle" x="839.5" y="275">わからない</text></g></g><g class="flow-edge yes" data-edge="weights:yes:nearest-result"><title>はい</title><path d="M359.333 546 V558 C359.333 590 192 590 192 622 V634"/><path d="M192 672 V684 C192 716 192 716 192 748 V760" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="weights:yes:nearest-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="657">はい</text></g></g><g class="flow-edge no" data-edge="weights:no:fallback"><title>いいえ</title><path d="M439.333 546 V558 C439.333 590 402 590 402 622 V634"/><path d="M402 672 V684 C402 716 402 716 402 748 V760 V940 C402 972 360 972 360 1004 V1016 V1066 C360 1098 264 1098 264 1130 V1142" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="weights:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="weights:unknown:check"><title>わからない</title><path d="M519.333 546 V558 C519.333 590 724 590 724 622 V634"/><path d="M724 672 V684 C724 716 670.667 716 670.667 748 V760" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="weights:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="679.5" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="724" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M644 910 V940 C644 972 506 972 506 1004 V1016"/><path d="M506 1054 V1066 C506 1098 392 1098 392 1130 V1142" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M724 910 V940 C724 972 711 972 711 1004 V1016"/><path d="M711 1054 V1066 C711 1098 670.667 1098 670.667 1130 V1142" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="671" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="711" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M804 910 V940 C804 972 839.5 972 839.5 1004 V1016"/><path d="M839.5 1054 V1066 C839.5 1098 777.333 1098 777.333 1130 V1142" marker-end="url(#arrow-tree-nearest-marked)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="795" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="839.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="changes"><rect x="424.75" y="32" width="320" height="132" rx="7"/><text class="node-kind" x="440.75" y="52">質問</text><text class="node-title" x="440.75" y="80">印付き頂点は、どのように変わります</text><text class="node-title" x="440.75" y="103">か？</text><text class="node-explanation" x="440.75" y="130">一度付けた印が残るかを確認します。</text></g><g class="flow-node question" data-node="weights"><rect x="279.3333333333333" y="378" width="320" height="168" rx="7"/><text class="node-kind" x="295.3333333333333" y="398">質問</text><text class="node-title" x="295.3333333333333" y="426">木の辺の長さは非負で、距離は経路の</text><text class="node-title" x="295.3333333333333" y="449">長さの和ですか？</text><text class="node-explanation" x="295.3333333333333" y="476">重みのない木は全辺を 1 とします。負の辺では、</text><text class="node-explanation" x="295.3333333333333" y="494">途中の中心を経由した長さを上からの候補として扱え</text><text class="node-explanation" x="295.3333333333333" y="512">ません。</text></g><g class="flow-node result" data-node="nearest-result"><rect x="32" y="760" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="780">候補</text><text class="node-title" x="48" y="808">中心ごとに最寄りの印までの距離を残</text><text class="node-title" x="48" y="831">し、祖先の中心から最小値を取る</text><a href="/flowchartcp/techniques/centroid-nearest-marked/"><title>木の印付き最寄り点は、重心ごとの最短距離を追加時に更新するの記事へ</title><text x="48" y="870">木の印付き最寄り点は、重心ごとの最短距離を追加</text><text x="48" y="888">時に更新する</text></a></g><g class="flow-node question" data-node="check"><rect x="564" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="580" y="780">質問</text><text class="node-title" x="580" y="808">必要な条件を、問題文と小さい例から</text><text class="node-title" x="580" y="831">確認できますか？</text><text class="node-explanation" x="580" y="858">操作の順番、値が変わる範囲、答えの条件を確認しま</text><text class="node-explanation" x="580" y="876">す。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1142" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1162">候補</text><text class="node-title" x="216" y="1190">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="216" y="1229">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1253">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1162">分野</text><text class="node-title" x="580" y="1190">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1227">詳細の質問・図へ →</text></a></g></svg>