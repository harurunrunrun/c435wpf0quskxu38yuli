<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-rooted-tree-leaf-labels flow-desc-rooted-tree-leaf-labels" width="1112" height="1718" viewBox="0 0 1112 1718" data-flow-svg="rooted-tree-leaf-labels"><title id="flow-title-rooted-tree-leaf-labels">葉だけを訪問順に番号付けし、部分木の最小・最大を返すの解法フローチャート</title><desc id="flow-desc-rooted-tree-leaf-labels">全頂点の相異なる番号ではなく、部分木の包含と非交差を表す区間を作ります。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-rooted-tree-leaf-labels" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge nested-subtrees" data-edge="model:nested-subtrees:goal"><title>部分木の包含を区間の包含、別枝を区間の非交差で表す</title><path d="M564.5 182 V194 C564.5 226 246.5 226 246.5 258 V270"/><path d="M246.5 326 V338 C246.5 370 702.556 370 702.556 402 V414" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="model:nested-subtrees:goal" tabindex="0" role="group" aria-label="選択肢：部分木の包含を区間の包含、別枝を区間の非交差で表す"><rect x="124" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="246.5" y="293">部分木の包含を区間の包含、別枝を区</text><text text-anchor="middle" x="246.5" y="311">間の非交差で表す</text></g></g><g class="flow-edge unique-point" data-edge="model:unique-point:fallback"><title>全頂点へ相異なる一点の番号を割り当てる</title><path d="M628.5 182 V194 C628.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 326 V338 C535.5 370 962 370 962 402 V414 V617 C962 649 962 649 962 681 V693 V743 C962 775 962 775 962 807 V819 V981 C962 1013 962 1013 962 1045 V1057 V1107 C962 1139 588 1139 588 1171 V1183" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="model:unique-point:fallback" tabindex="0" role="group" aria-label="選択肢：全頂点へ相異なる一点の番号を割り当てる"><rect x="413" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="535.5" y="293">全頂点へ相異なる一点の番号を割り当</text><text text-anchor="middle" x="535.5" y="311">てる</text></g></g><g class="flow-edge given-intervals" data-edge="model:given-intervals:fallback"><title>指定済みの区間端点を、木に合わせて変更する</title><path d="M692.5 182 V194 C692.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V617 C1018 649 1018 649 1018 681 V693 V743 C1018 775 1018 775 1018 807 V819 V981 C1018 1013 1018 1013 1018 1045 V1057 V1107 C1018 1139 652 1139 652 1171 V1183" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="model:given-intervals:fallback" tabindex="0" role="group" aria-label="選択肢：指定済みの区間端点を、木に合わせて変更する"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">指定済みの区間端点を、木に合わせて</text><text text-anchor="middle" x="824.5" y="311">変更する</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M756.5 182 V194 C756.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V617 C1074 649 1074 649 1074 681 V693 V743 C1074 775 1074 775 1074 807 V819 V981 C1074 1013 1074 1013 1074 1045 V1057 V1107 C1074 1139 1000 1139 1000 1171 V1183" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="goal:yes:guard"><title>はい</title><path d="M622.556 605 V617 C622.556 649 501.167 649 501.167 681 V693"/><path d="M501.167 731 V743 C501.167 775 501.167 775 501.167 807 V819" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="goal:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="461.1666666666667" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="501.1666666666667" y="716">はい</text></g></g><g class="flow-edge no" data-edge="goal:no:fallback"><title>いいえ</title><path d="M702.556 605 V617 C702.556 649 739 649 739 681 V693"/><path d="M739 731 V743 C739 775 850 775 850 807 V819 V981 C850 1013 850 1013 850 1045 V1057 V1107 C850 1139 524 1139 524 1171 V1183" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="goal:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="699" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="739" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M782.556 605 V617 C782.556 649 867.5 649 867.5 681 V693"/><path d="M867.5 731 V743 C867.5 775 906 775 906 807 V819 V981 C906 1013 906 1013 906 1045 V1057 V1107 C906 1139 920 1139 920 1171 V1183" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="823" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="867.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M421.167 969 V981 C421.167 1013 192 1013 192 1045 V1057"/><path d="M192 1095 V1107 C192 1139 192 1139 192 1171 V1183" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1080">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M501.167 969 V981 C501.167 1013 556 1013 556 1045 V1057"/><path d="M556 1095 V1107 C556 1139 460 1139 460 1171 V1183" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1057" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1080">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M581.167 969 V981 C581.167 1013 755.5 1013 755.5 1045 V1057"/><path d="M755.5 1095 V1107 C755.5 1139 840 1139 840 1171 V1183" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1057" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1080">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1333 V1363 C840 1395 783 1395 783 1427 V1439"/><path d="M783 1477 V1489 C783 1521 828.5 1521 828.5 1553 V1565" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1462">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1333 V1363 C920 1395 907 1395 907 1427 V1439"/><path d="M907 1477 V1489 C907 1521 908.5 1521 908.5 1553 V1565" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1439" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1462">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1333 V1363 C1000 1395 1035.5 1395 1035.5 1427 V1439"/><path d="M1035.5 1477 V1489 C1035.5 1521 988.5 1521 988.5 1553 V1565" marker-end="url(#arrow-rooted-tree-leaf-labels)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1439" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1462">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="500.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="516.5" y="52">質問</text><text class="node-title" x="516.5" y="80">頂点へ割り当てる区間は、どの条件を</text><text class="node-title" x="516.5" y="103">表しますか？</text><text class="node-explanation" x="516.5" y="130">全頂点の相異なる番号ではなく、部分木の包含と非交</text><text class="node-explanation" x="516.5" y="148">差を表す区間を作ります。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="558.5555555555557" y="434">質問</text><text class="node-title" x="558.5555555555557" y="462">根が固定され、区間端点は自由に選</text><text class="node-title" x="558.5555555555557" y="485">べ、包含は等しい区間でもよいです</text><text class="node-title" x="558.5555555555557" y="508">か？</text><text class="node-explanation" x="558.5555555555557" y="535">葉の区間は一点、内部頂点の区間は子の区間を全て含</text><text class="node-explanation" x="558.5555555555557" y="553">めればよい設定です。真の包含や全頂点で相異なる区</text><text class="node-explanation" x="558.5555555555557" y="571">間を要求する場合は、別の割り当てが必要です。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="357.1666666666667" y="839">質問</text><text class="node-title" x="357.1666666666667" y="867">各部分木の葉は、深さ優先でまとめて</text><text class="node-title" x="357.1666666666667" y="890">訪れることができますか？</text><text class="node-explanation" x="357.1666666666667" y="917">子の部分木を一つずつ処理すると、その部分木の葉番</text><text class="node-explanation" x="357.1666666666667" y="935">号は連続します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1183" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1203">候補</text><text class="node-title" x="48" y="1231">葉だけを訪問順に番号付けし、部分木</text><text class="node-title" x="48" y="1254">の最小・最大を返す</text><a href="/flowchartcp/techniques/rooted-tree-leaf-interval-labels/"><title>部分木の包含と非交差を区間で表すなら、DFS順の葉だけに番号を付けるの記事へ</title><text x="48" y="1293">部分木の包含と非交差を区間で表すなら、DFS順</text><text x="48" y="1311">の葉だけに番号を付ける</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1183" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1203">候補</text><text class="node-title" x="412" y="1231">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1270">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1294">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1183" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1203">質問</text><text class="node-title" x="776" y="1231">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1254">書き出せますか？</text><text class="node-explanation" x="776" y="1281">全頂点の相異なる番号ではなく、部分木の包含と非交</text><text class="node-explanation" x="776" y="1299">差を表す区間を作ります。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1565" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1585">分野</text><text class="node-title" x="764.5" y="1613">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1650">詳細の質問・図へ →</text></a></g></svg>