lt-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:valuation"><title>はい</title><path d="M584.833 205 V217 C584.833 249 612 249 612 281 V293"/><path d="M612 331 V343 C612 375 612 375 612 407 V419" marker-end="url(#arrow-common-half-odd-multiples)"/><g class="flow-edge-label" data-edge-label="model:yes:valuation" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="572" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="316">はい</text></g></g><g class="flow-edge no" data-edge="model:no:fallback"><title>いいえ</title><path d="M504.833 205 V217 C504.833 249 72 249 72 281 V293"/><path d="M72 331 V343 C72 375 38 375 38 407 V419 V581 C38 613 38 613 38 645 V657 V707 C38 739 38 739 38 771 V783 V963 C38 995 438.5 995 438.5 1027 V1039 V1089 C438.5 1121 385.167 1121 385.167 1153 V1165" marker-end="url(#arrow-common-half-odd-multiples)"/><g class="flow-edge-label" data-edge-label="model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="32" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M664.833 205 V217 C664.833 249 1070.5 249 1070.5 281 V293"/><path d="M1070.5 331 V343 C1070.5 375 1070.5 375 1070.5 407 V419 V581 C1070.5 613 1070.5 613 1070.5 645 V657 V707 C1070.5 739 1029.333 739 1029.333 771 V783" marker-end="url(#arrow-common-half-odd-multiples)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1026" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="1070.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="valuation:yes:half-result"><title>はい</title><path d="M532 569 V581 C532 613 248 613 248 645 V657"/><path d="M248 695 V707 C248 739 248 739 248 771 V783" marker-end="url(#arrow-common-half-odd-multiples)"/><g class="flow-edge-label" data-edge-label="valuation:yes:half-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="680">はい</text></g></g><g class="flow-edge no" data-edge="valuation:no:zero-result"><title>いいえ</title><path d="M612 569 V581 C612 613 612 613 612 645 V657"/><path d="M612 695 V707 C612 739 612 739 612 771 V783" marker-end="url(#arrow-common-half-odd-multiples)"/><g class="flow-edge-label" data-edge-label="valuation:no:zero-result" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="valuation:unknown:check"><title>わからない</title><path d="M692 569 V581 C692 613 976 613 976 645 V657"/><path d="M976 695 V707 C976 739 922.667 739 922.667 771 V783" marker-end="url(#arrow-common-half-odd-multiples)"/><g class="flow-edge-label" data-edge-label="valuation:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="680">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M896 915 V963 C896 995 528.5 995 528.5 1027 V1039"/><path d="M528.5 1077 V1089 C528.5 1121 491.833 1121 491.833 1153 V1165" marker-end="url(#arrow-common-half-odd-multiples)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="488.5" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="528.5" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 915 V963 C976 995 963 995 963 1027 V1039"/><path d="M963 1077 V1089 C963 1121 922.667 1121 922.667 1153 V1165" marker-end="url(#arrow-common-half-odd-multiples)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 915 V963 C1056 995 1091.5 995 1091.5 1027 V1039"/><path d="M1091.5 1077 V1089 C1091.5 1121 1029.333 1121 1029.333 1153 V1165" marker-end="url(#arrow-common-half-odd-multiples)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="424.83333333333337" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="440.83333333333337" y="52">質問</text><text class="node-title" x="440.83333333333337" y="80">全 a_i が正の偶数で、X=</text><text class="node-title" x="440.83333333333337" y="103">(a_i/2)×正の奇数 を全 i</text><text class="node-title" x="440.83333333333337" y="126"> で要求しますか？</text><text class="node-explanation" x="440.83333333333337" y="153">正の X を 1..M で数えます。偶数の商も許</text><text class="node-explanation" x="440.83333333333337" y="171">す条件とは異なります。</text></g><g class="flow-node question" data-node="valuation"><rect x="452" y="419" width="320" height="150" rx="7"/><text class="node-kind" x="468" y="439">質問</text><text class="node-title" x="468" y="467">全 a_i に含まれる 2 の指数</text><text class="node-title" x="468" y="490">は同じですか？</text><text class="node-explanation" x="468" y="517">商が奇数になるには、X と各 a_i/2 の 2</text><text class="node-explanation" x="468" y="535"> の指数が一致しなければなりません。</text></g><g class="flow-node result" data-node="half-result"><rect x="88" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="104" y="803">候補</text><text class="node-title" x="104" y="831">半分の最小公倍数の、上限以下の奇数</text><text class="node-title" x="104" y="854">倍を数える</text><a href="/flowchartcp/techniques/half-multiple-two-adic/"><title>全ての半分の奇数倍を満たす数は、2の指数をそろえて最小公倍数の奇数倍にするの記事へ</title><text x="104" y="893">全ての半分の奇数倍を満たす数は、2の指数をそろ</text><text x="104" y="911">えて最小公倍数の奇数倍にする</text></a></g><g class="flow-node result" data-node="zero-result"><rect x="452" y="783" width="320" height="168" rx="7"/><text class="node-kind" x="468" y="803">候補</text><text class="node-title" x="468" y="831">二の指数が異なるなら、条件を満たす</text><text class="node-title" x="468" y="854"> X は存在しない</text><a href="/flowchartcp/techniques/half-multiple-two-adic/"><title>全ての半分の奇数倍を満たす数は、2の指数をそろえて最小公倍数の奇数倍にするの記事へ</title><text x="468" y="893">全ての半分の奇数倍を満たす数は、2の指数をそろ</text><text x="468" y="911">えて最小公倍数の奇数倍にする</text></a></g><g class="flow-node question" data-node="check"><rect x="816" y="783" width="320" height="132" rx="7"/><text class="node-kind" x="832" y="803">質問</text><text class="node-title" x="832" y="831">必要な条件を、問題文と小さい例から</text><text class="node-title" x="832" y="854">確認できますか？</text><text class="node-explanation" x="832" y="881">操作の条件と、求める個数・値・順序を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="278.5" y="1165" width="320" height="151" rx="7"/><text class="node-kind" x="294.5" y="1185">候補</text><text class="node-title" x="294.5" y="1213">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="294.5" y="1252">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="294.5" y="1276">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="1185">分野</text><text class="node-title" x="832" y="1213">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1250">詳細の質問・図へ →</text></a></g></svg>