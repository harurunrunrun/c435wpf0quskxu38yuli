<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-single-book-sort-walk-conditions flow-desc-single-book-sort-walk-conditions" width="748" height="1401" viewBox="0 0 748 1401" data-flow-svg="single-book-sort-walk-conditions"><title id="flow-title-single-book-sort-walk-conditions">一冊だけ持って並べ替える歩行距離の解法フローチャート</title><desc id="flow-desc-single-book-sort-walk-conditions">順列と直線上の距離、手持ちと帰着の規則、入力範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-single-book-sort-walk-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="permutation-line:yes:one-held-return"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-single-book-sort-walk-conditions)"/><g class="flow-edge-label" data-edge-label="permutation-line:yes:one-held-return" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="permutation-line:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V617 C654 649 654 649 654 681 V693 V743 C654 775 654 775 654 807 V819 V999 C654 1031 654 1031 654 1063 V1075 V1125 C654 1157 624.571 1157 624.571 1189 V1201" marker-end="url(#arrow-single-book-sort-walk-conditions)"/><g class="flow-edge-label" data-edge-label="permutation-line:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="permutation-line:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V617 C710 649 710 649 710 681 V693 V743 C710 775 710 775 710 807 V819 V999 C710 1031 710 1031 710 1063 V1075 V1125 C710 1157 670.286 1157 670.286 1189 V1201" marker-end="url(#arrow-single-book-sort-walk-conditions)"/><g class="flow-edge-label" data-edge-label="permutation-line:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="one-held-return:yes:bounds"><title>はい</title><path d="M352.5 605 V617 C352.5 649 307 649 307 681 V693"/><path d="M307 731 V743 C307 775 319.5 775 319.5 807 V819" marker-end="url(#arrow-single-book-sort-walk-conditions)"/><g class="flow-edge-label" data-edge-label="one-held-return:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="716">はい</text></g></g><g class="flow-edge no" data-edge="one-held-return:no:check"><title>いいえ</title><path d="M432.5 605 V617 C432.5 649 431 649 431 681 V693"/><path d="M431 731 V743 C431 775 542 775 542 807 V819 V999 C542 1031 542 1031 542 1063 V1075 V1125 C542 1157 533.143 1157 533.143 1189 V1201" marker-end="url(#arrow-single-book-sort-walk-conditions)"/><g class="flow-edge-label" data-edge-label="one-held-return:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="one-held-return:unknown:check"><title>わからない</title><path d="M512.5 605 V617 C512.5 649 559.5 649 559.5 681 V693"/><path d="M559.5 731 V743 C559.5 775 598 775 598 807 V819 V999 C598 1031 598 1031 598 1063 V1075 V1125 C598 1157 578.857 1157 578.857 1189 V1201" marker-end="url(#arrow-single-book-sort-walk-conditions)"/><g class="flow-edge-label" data-edge-label="one-held-return:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 987 V999 C239.5 1031 192 1031 192 1063 V1075"/><path d="M192 1113 V1125 C192 1157 192 1157 192 1189 V1201" marker-end="url(#arrow-single-book-sort-walk-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 987 V999 C319.5 1031 319 1031 319 1063 V1075"/><path d="M319 1113 V1125 C319 1157 441.714 1157 441.714 1189 V1201" marker-end="url(#arrow-single-book-sort-walk-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 987 V999 C399.5 1031 447.5 1031 447.5 1063 V1075"/><path d="M447.5 1113 V1125 C447.5 1157 487.429 1157 487.429 1189 V1201" marker-end="url(#arrow-single-book-sort-walk-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1098">わからない</text></g></g><g class="flow-node question" data-node="permutation-line"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">直線上の全位置に一つずつ物があり、</text><text class="node-title" x="400.5" y="103">移動先は同じ位置集合の順列ですか？</text><text class="node-explanation" x="400.5" y="130">各位置の間隔は1で、位置iからjへ歩く距離は絶対</text><text class="node-explanation" x="400.5" y="148">値|i−j|です。物や目的位置の重複・欠落はあり</text><text class="node-explanation" x="400.5" y="166">ません。</text></g><g class="flow-node question" data-node="one-held-return"><rect x="272.5" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">一度に一つだけ持ち、拾う・交換・置</text><text class="node-title" x="288.5" y="485">く操作は無料で、開始位置へ戻るまで</text><text class="node-title" x="288.5" y="508">の最小歩行距離を求めますか？</text><text class="node-explanation" x="288.5" y="535">物を置く先は空き位置である必要があります。手持ち</text><text class="node-explanation" x="288.5" y="553">とその位置の物は交換でき、歩行だけを費用として数</text><text class="node-explanation" x="288.5" y="571">えます。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="819" width="320" height="168" rx="7"/><text class="node-kind" x="175.5" y="839">質問</text><text class="node-title" x="175.5" y="867">位置数は1〜100万で、順列と開始</text><text class="node-title" x="175.5" y="890">位置を0始まりで与えられますか？</text><text class="node-explanation" x="175.5" y="917">答えは32bitを超え得るため、64bitで返し</text><text class="node-explanation" x="175.5" y="935">ます。完成済みの順列でも開始位置は範囲内で指定し</text><text class="node-explanation" x="175.5" y="953">ます。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1201" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1221">候補</text><text class="node-title" x="48" y="1249">運搬距離の和に、サイクルを取り込む</text><text class="node-title" x="48" y="1272">ための往復距離を足す</text><a href="/flowchartcp/techniques/permutation-cycle-interval-closure-two-sided-walk-greedy/"><title>一冊だけ持って並べ替える歩行距離を、サイクルの閉包で求めるの記事へ</title><text x="48" y="1311">一冊だけ持って並べ替える歩行距離を、サイクルの</text><text x="48" y="1329">閉包で求める</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1201" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1221">分野</text><text class="node-title" x="412" y="1249">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1286">詳細の質問・図へ →</text></a></g></svg>