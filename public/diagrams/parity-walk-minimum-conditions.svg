<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-parity-walk-minimum-conditions flow-desc-parity-walk-minimum-conditions" width="748" height="1324" viewBox="0 0 748 1324" data-flow-svg="parity-walk-minimum-conditions"><title id="flow-title-parity-walk-minimum-conditions">到達できる全歩数を保つ最小のグラフの解法フローチャート</title><desc id="flow-desc-parity-walk-minimum-conditions">求めるものと操作の条件、入力の範囲を確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-parity-walk-minimum-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="undirected-connected:yes:all-walk-lengths"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-parity-walk-minimum-conditions)"/><g class="flow-edge-label" data-edge-label="undirected-connected:yes:all-walk-lengths" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="undirected-connected:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V558 C654 590 654 590 654 622 V634 V684 C654 716 654 716 654 748 V760 V922 C654 954 654 954 654 986 V998 V1048 C654 1080 624.571 1080 624.571 1112 V1124" marker-end="url(#arrow-parity-walk-minimum-conditions)"/><g class="flow-edge-label" data-edge-label="undirected-connected:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="undirected-connected:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V558 C710 590 710 590 710 622 V634 V684 C710 716 710 716 710 748 V760 V922 C710 954 710 954 710 986 V998 V1048 C710 1080 670.286 1080 670.286 1112 V1124" marker-end="url(#arrow-parity-walk-minimum-conditions)"/><g class="flow-edge-label" data-edge-label="undirected-connected:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="all-walk-lengths:yes:bounds"><title>はい</title><path d="M352.5 546 V558 C352.5 590 307 590 307 622 V634"/><path d="M307 672 V684 C307 716 319.5 716 319.5 748 V760" marker-end="url(#arrow-parity-walk-minimum-conditions)"/><g class="flow-edge-label" data-edge-label="all-walk-lengths:yes:bounds" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="657">はい</text></g></g><g class="flow-edge no" data-edge="all-walk-lengths:no:check"><title>いいえ</title><path d="M432.5 546 V558 C432.5 590 431 590 431 622 V634"/><path d="M431 672 V684 C431 716 542 716 542 748 V760 V922 C542 954 542 954 542 986 V998 V1048 C542 1080 533.143 1080 533.143 1112 V1124" marker-end="url(#arrow-parity-walk-minimum-conditions)"/><g class="flow-edge-label" data-edge-label="all-walk-lengths:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="all-walk-lengths:unknown:check"><title>わからない</title><path d="M512.5 546 V558 C512.5 590 559.5 590 559.5 622 V634"/><path d="M559.5 672 V684 C559.5 716 598 716 598 748 V760 V922 C598 954 598 954 598 986 V998 V1048 C598 1080 578.857 1080 578.857 1112 V1124" marker-end="url(#arrow-parity-walk-minimum-conditions)"/><g class="flow-edge-label" data-edge-label="all-walk-lengths:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 910 V922 C239.5 954 192 954 192 986 V998"/><path d="M192 1036 V1048 C192 1080 192 1080 192 1112 V1124" marker-end="url(#arrow-parity-walk-minimum-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1021">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 910 V922 C319.5 954 319 954 319 986 V998"/><path d="M319 1036 V1048 C319 1080 441.714 1080 441.714 1112 V1124" marker-end="url(#arrow-parity-walk-minimum-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="998" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1021">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 910 V922 C399.5 954 447.5 954 447.5 986 V998"/><path d="M447.5 1036 V1048 C447.5 1080 487.429 1080 487.429 1112 V1124" marker-end="url(#arrow-parity-walk-minimum-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="998" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1021">わからない</text></g></g><g class="flow-node question" data-node="undirected-connected"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">辺は無向で一歩に数え、自己ループを</text><text class="node-title" x="400.5" y="103">使える連結グラフですか？</text><text class="node-explanation" x="400.5" y="130">同じ頂点対を結ぶ辺は一本までです。各頂点は固定し</text><text class="node-explanation" x="400.5" y="148">た始点から到達できます。</text></g><g class="flow-node question" data-node="all-walk-lengths"><rect x="272.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">各頂点へ到達できる全歩数を保つ、最</text><text class="node-title" x="288.5" y="467">小の辺数を求めますか？</text><text class="node-explanation" x="288.5" y="494">始点と頂点のラベルを固定します。頂点や辺を繰り返</text><text class="node-explanation" x="288.5" y="512">し通れ、元にない辺も使えます。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="760" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">頂点数は2〜10万、辺数は20万以</text><text class="node-title" x="175.5" y="831">下で、全ての辺が分かっていますか？</text><text class="node-explanation" x="175.5" y="858">二つの偶奇それぞれの最短歩数を求め、同じ距離の組</text><text class="node-explanation" x="175.5" y="876">をまとめられる入力です。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1124" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1144">候補</text><text class="node-title" x="48" y="1172">偶奇別の最短歩数をそろえ、次の集合</text><text class="node-title" x="48" y="1195">も助ける辺を選ぶ</text><a href="/flowchartcp/techniques/parity-walk-profile-layer-greedy-realization/"><title>始点から到達できる全歩数を保ち、無向グラフの辺を最少にするの記事へ</title><text x="48" y="1234">始点から到達できる全歩数を保ち、無向グラフの辺</text><text x="48" y="1252">を最少にする</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1124" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1144">分野</text><text class="node-title" x="412" y="1172">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1209">詳細の質問・図へ →</text></a></g></svg>