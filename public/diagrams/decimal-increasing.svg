<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-decimal-increasing flow-desc-decimal-increasing" width="860" height="1384" viewBox="0 0 860 1384" data-flow-svg="decimal-increasing"><title id="flow-title-decimal-increasing">末尾の桁追加で増加列にするの解法フローチャート</title><desc id="flow-desc-decimal-increasing">桁数と接頭辞を比べ、最少の追加桁で前の値を超えます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-decimal-increasing" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="positive-decimal:yes:smallest-extension"><title>はい</title><path d="M539.722 223 V235 C539.722 267 420.667 267 420.667 299 V311"/><path d="M420.667 349 V361 C420.667 393 420.667 393 420.667 425 V437" marker-end="url(#arrow-decimal-increasing)"/><g class="flow-edge-label" data-edge-label="positive-decimal:yes:smallest-extension" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="334">はい</text></g></g><g class="flow-edge no" data-edge="positive-decimal:no:fallback"><title>いいえ</title><path d="M619.722 223 V235 C619.722 267 655 267 655 299 V311"/><path d="M655 349 V361 C655 393 762.5 393 762.5 425 V437 V617 C762.5 649 762.5 649 762.5 681 V693 V743 C762.5 775 458 775 458 807 V819 V999 C458 1031 360 1031 360 1063 V1075 V1125 C360 1157 304 1157 304 1189 V1201" marker-end="url(#arrow-decimal-increasing)"/><g class="flow-edge-label" data-edge-label="positive-decimal:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="positive-decimal:unknown:check"><title>わからない</title><path d="M699.722 223 V235 C699.722 267 783.5 267 783.5 299 V311"/><path d="M783.5 349 V361 C783.5 393 818.5 393 818.5 425 V437 V617 C818.5 649 818.5 649 818.5 681 V693 V743 C818.5 775 721.333 775 721.333 807 V819" marker-end="url(#arrow-decimal-increasing)"/><g class="flow-edge-label" data-edge-label="positive-decimal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="smallest-extension:yes:decimal-result"><title>はい</title><path d="M340.667 605 V617 C340.667 649 192 649 192 681 V693"/><path d="M192 731 V743 C192 775 192 775 192 807 V819" marker-end="url(#arrow-decimal-increasing)"/><g class="flow-edge-label" data-edge-label="smallest-extension:yes:decimal-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="716">はい</text></g></g><g class="flow-edge no" data-edge="smallest-extension:no:fallback"><title>いいえ</title><path d="M420.667 605 V617 C420.667 649 402 649 402 681 V693"/><path d="M402 731 V743 C402 775 402 775 402 807 V819 V999 C402 1031 304 1031 304 1063 V1075 V1125 C304 1157 224 1157 224 1189 V1201" marker-end="url(#arrow-decimal-increasing)"/><g class="flow-edge-label" data-edge-label="smallest-extension:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="693" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="716">いいえ</text></g></g><g class="flow-edge unknown" data-edge="smallest-extension:unknown:check"><title>わからない</title><path d="M500.667 605 V617 C500.667 649 668 649 668 681 V693"/><path d="M668 731 V743 C668 775 614.667 775 614.667 807 V819" marker-end="url(#arrow-decimal-increasing)"/><g class="flow-edge-label" data-edge-label="smallest-extension:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="693" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="716">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 969 V999 C588 1031 450 1031 450 1063 V1075"/><path d="M450 1113 V1125 C450 1157 384 1157 384 1189 V1201" marker-end="url(#arrow-decimal-increasing)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 969 V999 C668 1031 655 1031 655 1063 V1075"/><path d="M655 1113 V1125 C655 1157 614.667 1157 614.667 1189 V1201" marker-end="url(#arrow-decimal-increasing)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 969 V999 C748 1031 783.5 1031 783.5 1063 V1075"/><path d="M783.5 1113 V1125 C783.5 1157 721.333 1157 721.333 1189 V1201" marker-end="url(#arrow-decimal-increasing)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1098">わからない</text></g></g><g class="flow-node question" data-node="positive-decimal"><rect x="459.7222222222223" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">先頭ゼロのない正整数で、末尾へ任意</text><text class="node-title" x="475.7222222222223" y="103">の 0..9 を追加し、順序は変え</text><text class="node-title" x="475.7222222222223" y="126">ませんか？</text><text class="node-explanation" x="475.7222222222223" y="153">追加できる桁は 0..9 のどれでも使えます。0</text><text class="node-explanation" x="475.7222222222223" y="171"> だけなどに制限される場合は、同じ拡張を断定しま</text><text class="node-explanation" x="475.7222222222223" y="189">せん。既存の桁と順序を保ち、十進の文字列として…</text></g><g class="flow-node question" data-node="smallest-extension"><rect x="260.6666666666667" y="437" width="320" height="168" rx="7"/><text class="node-kind" x="276.6666666666667" y="457">質問</text><text class="node-title" x="276.6666666666667" y="485">同じ追加桁数なら、前の値を超える最</text><text class="node-title" x="276.6666666666667" y="508">小の拡張を選んでよいですか？</text><text class="node-explanation" x="276.6666666666667" y="535">小さい拡張は、後の値が超えるための選択肢を減らし</text><text class="node-explanation" x="276.6666666666667" y="553">ません。接頭辞が一致するときは、後半を 1 増や</text><text class="node-explanation" x="276.6666666666667" y="571">せるか確認します。</text></g><g class="flow-node result" data-node="decimal-result"><rect x="32" y="819" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">桁数と接頭辞を比較し、前の値を超え</text><text class="node-title" x="48" y="890">る最小の末尾を追加する</text><a href="/flowchartcp/techniques/append-digits-lexicographic/"><title>末尾への桁追加だけで増加列にするなら、直前を超える最小値にするの記事へ</title><text x="48" y="929">末尾への桁追加だけで増加列にするなら、直前を超</text><text x="48" y="947">える最小値にする</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="839">質問</text><text class="node-title" x="524" y="867">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="890">確認できますか？</text><text class="node-explanation" x="524" y="917">どの性質が入力で保証され、どの性質を式や操作から</text><text class="node-explanation" x="524" y="935">示す必要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1201" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1221">候補</text><text class="node-title" x="160" y="1249">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1288">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1312">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1201" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1221">分野</text><text class="node-title" x="524" y="1249">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1286">詳細の質問・図へ →</text></a></g></svg>