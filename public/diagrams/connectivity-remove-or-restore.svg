<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-connectivity-remove-or-restore flow-desc-connectivity-remove-or-restore" width="1280" height="1291" viewBox="0 0 1280 1291" data-flow-svg="connectivity-remove-or-restore"><title id="flow-title-connectivity-remove-or-restore">辺の削除と過去の版の解法フローチャート</title><desc id="flow-desc-connectivity-remove-or-restore">削除だけの操作、追加と削除の混在、過去の版からの併合について、処理できる順序を確かめます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-connectivity-remove-or-restore" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge delete" data-edge="operations:delete:delete-only"><title>頂点や辺を順に削除するだけ</title><path d="M623.708 141 V153 C623.708 185 192 185 192 217 V229"/><path d="M192 267 V279 C192 311 192 311 192 343 V355 V517 C192 549 192 549 192 581 V593 V643 C192 675 138.667 675 138.667 707 V719" marker-end="url(#arrow-connectivity-remove-or-restore)"/><g class="flow-edge-label" data-edge-label="operations:delete:delete-only" tabindex="0" role="group" aria-label="選択肢：頂点や辺を順に削除するだけ"><rect x="95.5" y="229" width="193" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">頂点や辺を順に削除するだけ</text></g></g><g class="flow-edge mixed" data-edge="operations:mixed:offline"><title>辺の追加・削除が混在する</title><path d="M687.708 141 V153 C687.708 185 548.833 185 548.833 217 V229"/><path d="M548.833 267 V279 C548.833 311 548.833 311 548.833 343 V355" marker-end="url(#arrow-connectivity-remove-or-restore)"/><g class="flow-edge-label" data-edge-label="operations:mixed:offline" tabindex="0" role="group" aria-label="選択肢：辺の追加・削除が混在する"><rect x="458.83333333333337" y="229" width="180" height="38" rx="5"/><text text-anchor="middle" x="548.8333333333334" y="252">辺の追加・削除が混在する</text></g></g><g class="flow-edge branched-version" data-edge="operations:branched-version:version-tree"><title>過去の版を選んで、そこから併合する