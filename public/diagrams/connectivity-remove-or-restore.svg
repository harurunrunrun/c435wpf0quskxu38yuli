ole="group" aria-label="選択肢：わからない"><rect x="764" y="593" width="89" height="38" rx="5"/><text text-anchor="middle" x="808.5" y="616">わからない</text></g></g><g class="flow-edge yes" data-edge="version-tree:yes:version-result"><title>はい</title><path d="M934.5 505 V517 C934.5 549 976 549 976 581 V593"/><path d="M976 631 V643 C976 675 976 675 976 707 V719" marker-end="url(#arrow-connectivity-remove-or-restore)"/><g class="flow-edge-label" data-edge-label="version-tree:yes:version-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="936" y="593" width="80" height="38" rx="5"/><text text-anchor="middle" x="976" y="616">はい</text></g></g><g class="flow-edge no" data-edge="version-tree:no:dynamic"><title>いいえ</title><path d="M854.5 505 V517 C854.5 549 680 549 680 581 V593"/><path d="M680 631 V643 C680 675 609.333 675 609.333 707 V719" marker-end="url(#arrow-connectivity-remove-or-restore)"/><g class="flow-edge-label" data-edge-label="version-tree:no:dynamic" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="640" y="593" width="80" height="38" rx="5"/><text text-anchor="middle" x="680" y="616">いいえ</text></g></g><g class="flow-edge unknown" data-edge="version-tree:unknown:check"><title>わからない</title><path d="M1014.5 505 V517 C1014.5 549 1147.5 549 1147.5 581 V593"/><path d="M1147.5 631 V643 C1147.5 675 1186 675 1186 707 V719 V882 C1186 914 1070.5 914 1070.5 946 V958 V1008 C1070.5 1040 952 1040 952 1072 V1084" marker-end="url(#arrow-connectivity-remove-or-restore)"/><g class="flow-edge-label" data-edge-label="version-tree:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1103" y="593" width="89" height="38" rx="5"/><text text-anchor="middle" x="1147.5" y="616">わからない</text></g></g><g class="flow-node question" data-node="operations"><rect x="559.7083333333334" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="575.7083333333334" y="52">質問</text><text class="node-title" x="575.7083333333334" y="80">つながりはどのように変わりますか？</text><text class="node-explanation" x="575.7083333333334" y="107">追加、削除、過去の版を区別します。</text></g><g class="flow-node question" data-node="delete-only"><rect x="32" y="719" width="320" height="132" rx="7"/><text class="node-kind" x="48" y="739">質問</text><text class="node-title" x="48" y="767">操作は最初にある辺の削除だけです</text><text class="node-title" x="48" y="790">か？</text><text class="node-explanation" x="48" y="817">逆順にすると、削除が追加へ変わります。</text></g><g class="flow-node result" data-node="reverse"><rect x="32" y="1084" width="320" height="175" rx="7"/><text class="node-kind" x="48" y="1104">候補</text><text class="node-title" x="48" y="1132">逆順の辺追加に変える</text><a href="/flowchartcp/techniques/reverse-edge-deletion/"><title>辺の削除を逆順の追加に変えるの記事へ</title><text x="48" y="1171">辺の削除を逆順の追加に変える</text></a><a href="/flowchartcp/techniques/reverse-thinking/"><title>逆順処理の記事へ</title><text x="48" y="1195">逆順処理</text></a><a href="/flowchartcp/techniques/union-find/"><title>Union-Findの記事へ</title><text x="48" y="1219">Union-Find</text></a></g><g class="flow-node route" data-node="lifetimes"><rect x="396" y="1084" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="1104">分野</text><text class="node-title" x="412" y="1132">辺が存在する時刻と、併合の取り消し</text><text class="node-explanation" x="412" y="1159">追加と削除を時刻の区間で扱えるか、最後の併合から</text><text class="node-explanation" x="412" y="1177">取り消せるかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-edge-lifetimes" data-route="connectivity-edge-lifetimes"><text x="412" y="1205">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="760" y="1084" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="1104">分野</text><text class="node-title" x="776" y="1132">操作と問い合わせの順序を確かめる</text><text class="node-explanation" x="776" y="1159">追加や削除を先に読めるかを確かめ、操作を整理する</text><text class="node-explanation" x="776" y="1177">か、足りない条件を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-connectivity-operation-order" data-route="connectivity-operation-order"><text x="776" y="1205">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="offline"><rect x="388.83333333333337" y="355" width="320" height="127" rx="7"/><text class="node-kind" x="404.83333333333337" y="375">質問</text><text class="node-title" x="404.83333333333337" y="403">操作をすべて先に読めますか？</text><text class="node-explanation" x="404.83333333333337" y="430">将来の操作が分からないオンラインの削除は、通常の</text><text class="node-explanation" x="404.83333333333337" y="448"> DSU では扱えません。</text></g><g class="flow-node result" data-node="dynamic"><rect x="396" y="719" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="739">候補</text><text class="node-title" x="412" y="767">オンライン削除のモデルを見直す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="806">状態の設計</text></a><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="412" y="830">グラフへの帰着</text></a></g><g class="flow-node question" data-node="version-tree"><rect x="774.5" y="355" width="320" height="150" rx="7"/><text class="node-kind" x="790.5" y="375">質問</text><text class="node-title" x="790.5" y="403">版の親子関係をすべて先に読んで、木</text><text class="node-title" x="790.5" y="426">としてたどれますか？</text><text class="node-explanation" x="790.5" y="453">一つの枝を終えたら、併合を逆順に取り消して別の枝</text><text class="node-explanation" x="790.5" y="471">へ進みます。</text></g><g class="flow-node result" data-node="version-result"><rect x="816" y="719" width="320" height="127" rx="7"/><text class="node-kind" x="832" y="739">候補</text><text class="node-title" x="832" y="767">版の木をたどって併合を巻き戻す</text><a href="/flowchartcp/techniques/rollback-dsu/"><title>巻き戻し可能Union-Findの記事へ</title><text x="832" y="806">巻き戻し可能Union-Find</text></a></g></svg>