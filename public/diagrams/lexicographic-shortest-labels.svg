<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-lexicographic-shortest-labels flow-desc-lexicographic-shortest-labels" width="860" height="1412" viewBox="0 0 860 1412" data-flow-svg="lexicographic-shortest-labels"><title id="flow-title-lexicographic-shortest-labels">同じ最短辺数の中で最小の辺ラベル列の解法フローチャート</title><desc id="flow-desc-lexicographic-shortest-labels">最短辺数を先に決め、同じ最小接頭列の候補を全て残します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-lexicographic-shortest-labels" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="model:yes:frontier"><title>はい</title><path d="M539.722 223 V235 C539.722 267 420.667 267 420.667 299 V311"/><path d="M420.667 349 V361 C420.667 393 420.667 393 420.667 425 V437" marker-end="url(#arrow-lexicographic-shortest-labels)"/><g class="flow-edge-label" data-edge-label="model:yes:frontier" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="380.6666666666667" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="420.6666666666667" y="334">はい</text></g></g><g class="flow-edge no" data-edge="model:no:fallback"><title>いいえ</title><path d="M619.722 223 V235 C619.722 267 655 267 655 299 V311"/><path d="M655 349 V361 C655 393 762.5 393 762.5 425 V437 V622 C762.5 654 762.5 654 762.5 686 V698 V748 C762.5 780 458 780 458 812 V824 V1027 C458 1059 360 1059 360 1091 V1103 V1153 C360 1185 304 1185 304 1217 V1229" marker-end="url(#arrow-lexicographic-shortest-labels)"/><g class="flow-edge-label" data-edge-label="model:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M699.722 223 V235 C699.722 267 783.5 267 783.5 299 V311"/><path d="M783.5 349 V361 C783.5 393 818.5 393 818.5 425 V437 V622 C818.5 654 818.5 654 818.5 686 V698 V748 C818.5 780 721.333 780 721.333 812 V824" marker-end="url(#arrow-lexicographic-shortest-labels)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="frontier:yes:label-result"><title>はい</title><path d="M340.667 610 V622 C340.667 654 192 654 192 686 V698"/><path d="M192 736 V748 C192 780 192 780 192 812 V824" marker-end="url(#arrow-lexicographic-shortest-labels)"/><g class="flow-edge-label" data-edge-label="frontier:yes:label-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="698" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="721">はい</text></g></g><g class="flow-edge no" data-edge="frontier:no:fallback"><title>いいえ</title><path d="M420.667 610 V622 C420.667 654 402 654 402 686 V698"/><path d="M402 736 V748 C402 780 402 780 402 812 V824 V1027 C402 1059 304 1059 304 1091 V1103 V1153 C304 1185 224 1185 224 1217 V1229" marker-end="url(#arrow-lexicographic-shortest-labels)"/><g class="flow-edge-label" data-edge-label="frontier:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="698" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="721">いいえ</text></g></g><g class="flow-edge unknown" data-edge="frontier:unknown:check"><title>わからない</title><path d="M500.667 610 V622 C500.667 654 668 654 668 686 V698"/><path d="M668 736 V748 C668 780 614.667 780 614.667 812 V824" marker-end="url(#arrow-lexicographic-shortest-labels)"/><g class="flow-edge-label" data-edge-label="frontier:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="623.5" y="698" width="89" height="38" rx="5"/><text text-anchor="middle" x="668" y="721">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 956 V1027 C588 1059 450 1059 450 1091 V1103"/><path d="M450 1141 V1153 C450 1185 384 1185 384 1217 V1229" marker-end="url(#arrow-lexicographic-shortest-labels)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1126">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 956 V1027 C668 1059 655 1059 655 1091 V1103"/><path d="M655 1141 V1153 C655 1185 614.667 1185 614.667 1217 V1229" marker-end="url(#arrow-lexicographic-shortest-labels)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1126">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 956 V1027 C748 1059 783.5 1059 783.5 1091 V1103"/><path d="M783.5 1141 V1153 C783.5 1185 721.333 1185 721.333 1217 V1229" marker-end="url(#arrow-lexicographic-shortest-labels)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1103" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1126">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="459.7222222222223" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">無向の各辺にラベルがあり、辺数最小</text><text class="node-title" x="475.7222222222223" y="103">の中でラベル列を辞書順最小にします</text><text class="node-title" x="475.7222222222223" y="126">か？</text><text class="node-explanation" x="475.7222222222223" y="153">ラベルの合計を最小にする問題ではありません。ラベ</text><text class="node-explanation" x="475.7222222222223" y="171">ルに大小の順序が必要です。 通過済みのラベル数な</text><text class="node-explanation" x="475.7222222222223" y="189">ど、後続に影響する別の履歴制約はありません。</text></g><g class="flow-node question" data-node="frontier"><rect x="260.6666666666667" y="437" width="320" height="173" rx="7"/><text class="node-kind" x="276.6666666666667" y="457">質問</text><text class="node-title" x="276.6666666666667" y="485">最短の残り辺数を一つ減らす辺の中</text><text class="node-title" x="276.6666666666667" y="508">で、同じ最小ラベルの行き先を全て残</text><text class="node-title" x="276.6666666666667" y="531">せますか？</text><text class="node-explanation" x="276.6666666666667" y="558">同じ接頭列で着く頂点が複数あっても、一つに絞りま</text><text class="node-explanation" x="276.6666666666667" y="576">せん。次のラベルの良い候補を残します。</text></g><g class="flow-node result" data-node="label-result"><rect x="32" y="824" width="320" height="191" rx="7"/><text class="node-kind" x="48" y="844">候補</text><text class="node-title" x="48" y="872">終点までの辺数を求め、同じ最小接頭</text><text class="node-title" x="48" y="895">列の到達候補から次の最小ラベルを選</text><text class="node-title" x="48" y="918">ぶ</text><a href="/flowchartcp/techniques/shortest-lexicographic-label-frontier/"><title>最短経路の辺列を辞書順最小にするなら、同じ接頭列の到着点を全て残すの記事へ</title><text x="48" y="957">最短経路の辺列を辞書順最小にするなら、同じ接頭</text><text x="48" y="975">列の到着点を全て残す</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="824" width="320" height="132" rx="7"/><text class="node-kind" x="524" y="844">質問</text><text class="node-title" x="524" y="872">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="895">確認できますか？</text><text class="node-explanation" x="524" y="922">辺の向き、再訪、求める量と制約を確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1229" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1249">候補</text><text class="node-title" x="160" y="1277">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="160" y="1316">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1340">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1229" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1249">分野</text><text class="node-title" x="524" y="1277">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1314">詳細の質問・図へ →</text></a></g></svg>