<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-game-rules flow-desc-game-rules" width="2204" height="938" viewBox="0 0 2204 938" data-flow-svg="game-rules"><title id="flow-title-game-rules">合法手と終わり方による勝敗の解法フローチャート</title><desc id="flow-desc-game-rules">操作不能、即時勝利、循環の引分を区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-game-rules" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge no-move" data-edge="ending:no-move:normal-route"><title>必ず有限回で終わり、二者交互で合法手のない側が負ける</title><path d="M987.714 159 V171 C987.714 203 192 203 192 235 V247"/><path d="M192 303 V315 C192 347 192 347 192 379 V391" marker-end="url(#arrow-game-rules)"/><g class="flow-edge-label" data-edge-label="ending:no-move:normal-route" tabindex="0" role="group" aria-label="選択肢：必ず有限回で終わり、二者交互で合法手のない側が負ける"><rect x="69.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="270">必ず有限回で終わり、二者交互で合法</text><text text-anchor="middle" x="192" y="288">手のない側が負ける</text></g></g><g class="flow-edge immediate-board" data-edge="ending:immediate-board:board-route"><title>盤面の並びが揃うと即時勝利、埋まったときだけ得点比較</title><path d="M1033.429 159 V171 C1033.429 203 556 203 556 235 V247"/><path d="M556 303 V315 C556 347 556 347 556 379 V391" marker-end="url(#arrow-game-rules)"/><g class="flow-edge-label" data-edge-label="ending:immediate-board:board-route" tabindex="0" role="group" aria-label="選択肢：盤面の並びが揃うと即時勝利、埋まったときだけ得点比較"><rect x="433.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="270">盤面の並びが揃うと即時勝利、埋まっ</text><text text-anchor="middle" x="556" y="288">たときだけ得点比較</text></g></g><g class="flow-edge cycle-draw" data-edge="ending:cycle-draw:cycle-route"><title>合法手がない側が負け、永続する対戦は引分</title><path d="M1079.143 159 V171 C1079.143 203 920 203 920 235 V247"/><path d="M920 303 V315 C920 347 920 347 920 379 V391" marker-end="url(#arrow-game-rules)"/><g class="flow-edge-label" data-edge-label="ending:cycle-draw:cycle-route" tabindex="0" role="group" aria-label="選択肢：合法手がない側が負け、永続する対戦は引分"><rect x="797.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="270">合法手がない側が負け、永続する対戦</text><text text-anchor="middle" x="920" y="288">は引分</text></g></g><g class="flow-edge other" data-edge="ending:other:general-route"><title>その他の終了ルール・合法手</title><path d="M1124.857 159 V171 C1124.857 203 1284 203 1284 235 V247"/><path d="M1284 285 V315 C1284 347 1284 347 1284 379 V391" marker-end="url(#arrow-game-rules)"/><g class="flow-edge-label" data-edge-label="ending:other:general-route" tabindex="0" role="group" aria-label="選択肢：その他の終了ルール・合法手"><rect x="1187.5" y="247" width="193" height="38" rx="5"/><text text-anchor="middle" x="1284" y="270">その他の終了ルール・合法手</text></g></g><g class="flow-edge repeated-target" data-edge="ending:repeated-target:repeated-target-route"><title>各頂点の所有者が行き先を決め、目標を繰り返し訪れる側が勝つ</title><path d="M1170.571 159 V171 C1170.571 203 1648 203 1648 235 V247"/><path d="M1648 303 V315 C1648 347 1648 347 1648 379 V391" marker-end="url(#arrow-game-rules)"/><g class="flow-edge-label" data-edge-label="ending:repeated-target:repeated-target-route" tabindex="0" role="group" aria-label="選択肢：各頂点の所有者が行き先を決め、目標を繰り返し訪れる側が勝つ"><rect x="1525.5" y="247" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="270">各頂点の所有者が行き先を決め、目標</text><text text-anchor="middle" x="1648" y="288">を繰り返し訪れる側が勝つ</text></g></g><g class="flow-edge unknown" data-edge="ending:unknown:check"><title>わからない</title><path d="M1216.286 159 V171 C1216.286 203 2012 203 2012 235 V247"/><path d="M2012 285 V315 C2012 347 2012 347 2012 379 V391" marker-end="url(#arrow-game-rules)"/><g class="flow-edge-label" data-edge-label="ending:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1967.5" y="247" width="89" height="38" rx="5"/><text text-anchor="middle" x="2012" y="270">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M1932 541 V553 C1932 585 1648 585 1648 617 V629"/><path d="M1648 667 V679 C1648 711 1648 711 1648 743 V755" marker-end="url(#arrow-game-rules)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="1608" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1648" y="652">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M2012 541 V553 C2012 585 1999 585 1999 617 V629"/><path d="M1999 667 V679 C1999 711 1958.667 711 1958.667 743 V755" marker-end="url(#arrow-game-rules)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1959" y="629" width="80" height="38" rx="5"/><text text-anchor="middle" x="1999" y="652">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M2092 541 V553 C2092 585 2127.5 585 2127.5 617 V629"/><path d="M2127.5 667 V679 C2127.5 711 2065.333 711 2065.333 743 V755" marker-end="url(#arrow-game-rules)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="2083" y="629" width="89" height="38" rx="5"/><text text-anchor="middle" x="2127.5" y="652">わからない</text></g></g><g class="flow-node question" data-node="ending"><rect x="942" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="958" y="52">質問</text><text class="node-title" x="958" y="80">どのように対戦が終わりますか？</text><text class="node-explanation" x="958" y="107">同じ得点や合法手でも、終わり方が違うと勝敗が変わ</text><text class="node-explanation" x="958" y="125">ります。</text></g><g class="flow-node route" data-node="normal-route"><rect x="32" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="411">分野</text><text class="node-title" x="48" y="439">操作不能が負けになる具体的な操作</text><a href="/flowchartcp/flowcharts/#diagram-normal-game-moves" data-route="normal-game-moves"><text x="48" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="board-route"><rect x="396" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="411">分野</text><text class="node-title" x="412" y="439">即時勝利がある小さい盤面</text><a href="/flowchartcp/flowcharts/#diagram-small-board-games" data-route="small-board-games"><text x="412" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="cycle-route"><rect x="760" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="411">分野</text><text class="node-title" x="776" y="439">循環する対戦と引分</text><a href="/flowchartcp/flowcharts/#diagram-cyclic-games" data-route="cyclic-games"><text x="776" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="check"><rect x="1852" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="1868" y="411">質問</text><text class="node-title" x="1868" y="439">合法手、終了、返答、回数制限を、問</text><text class="node-title" x="1868" y="462">題文で確認できますか？</text><text class="node-explanation" x="1868" y="489">独立性や終了ルールが違う場合には、同じ勝敗・問い</text><text class="node-explanation" x="1868" y="507">合わせ設計を使えません。</text></g><g class="flow-node result" data-node="fallback"><rect x="1488" y="755" width="320" height="151" rx="7"/><text class="node-kind" x="1504" y="775">候補</text><text class="node-title" x="1504" y="803">ルールと必要な情報を確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="1504" y="842">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="1504" y="866">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="1852" y="755" width="320" height="121" rx="7"/><text class="node-kind" x="1868" y="775">分野</text><text class="node-title" x="1868" y="803">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1868" y="840">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="general-route"><rect x="1124" y="391" width="320" height="121" rx="7"/><text class="node-kind" x="1140" y="411">分野</text><text class="node-title" x="1140" y="439">状態の順序と独立性を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-game-general" data-route="game-general"><text x="1140" y="476">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="repeated-target-route"><rect x="1488" y="391" width="320" height="144" rx="7"/><text class="node-kind" x="1504" y="411">分野</text><text class="node-title" x="1504" y="439">各頂点の所有者が行き先を決め、目標</text><text class="node-title" x="1504" y="462">を繰り返し訪れる側が勝つ</text><a href="/flowchartcp/flowcharts/#diagram-owned-repeated-target-conditions" data-route="owned-repeated-target-conditions"><text x="1504" y="499">詳細の質問・図へ →</text></a></g></svg>