<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-algebra flow-desc-algebra" width="1532" height="1297" viewBox="0 0 1532 1297" data-flow-svg="algebra"><title id="flow-title-algebra">積の集計・同じ計算の繰り返しの解法フローチャート</title><desc id="flow-desc-algebra">畳み込み、形式的冪級数、線形漸化式、XOR を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-algebra" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge indexed-combinations" data-edge="algebra-task:indexed-combinations:indexed-combinations-route"><title>添字の条件ごとに積・最小値をまとめる</title><path d="M774.833 141 V153 C774.833 185 192 185 192 217 V229"/><path d="M192 285 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="algebra-task:indexed-combinations:indexed-combinations-route" tabindex="0" role="group" aria-label="選択肢：添字の条件ごとに積・最小値をまとめる"><rect x="69.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="252">添字の条件ごとに積・最小値をまとめ</text><text text-anchor="middle" x="192" y="270">る</text></g></g><g class="flow-edge coefficient-values" data-edge="algebra-task:coefficient-values:coefficient-values-route"><title>係数列・多数の点での値を求める</title><path d="M828.167 141 V153 C828.167 185 556 185 556 217 V229"/><path d="M556 267 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="algebra-task:coefficient-values:coefficient-values-route" tabindex="0" role="group" aria-label="選択肢：係数列・多数の点での値を求める"><rect x="446.5" y="229" width="219" height="38" rx="5"/><text text-anchor="middle" x="556" y="252">係数列・多数の点での値を求める</text></g></g><g class="flow-edge repeated-transitions" data-edge="algebra-task:repeated-transitions:repeated-transitions-route"><title>同じ変換の繰り返し・遠い項を求める</title><path d="M881.5 141 V153 C881.5 185 920 185 920 217 V229"/><path d="M920 267 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="algebra-task:repeated-transitions:repeated-transitions-route" tabindex="0" role="group" aria-label="選択肢：同じ変換の繰り返し・遠い項を求める"><rect x="797.5" y="229" width="245" height="38" rx="5"/><text text-anchor="middle" x="920" y="252">同じ変換の繰り返し・遠い項を求める</text></g></g><g class="flow-edge xor" data-edge="algebra-task:xor:xor"><title>XOR の組合せ</title><path d="M934.833 141 V153 C934.833 185 1284 185 1284 217 V229"/><path d="M1284 267 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="algebra-task:xor:xor" tabindex="0" role="group" aria-label="選択肢：XOR の組合せ"><rect x="1220" y="229" width="128" height="38" rx="5"/><text text-anchor="middle" x="1284" y="252">XOR の組合せ</text></g></g><g class="flow-edge unknown" data-edge="algebra-task:unknown:check"><title>わからない</title><path d="M988.167 141 V153 C988.167 185 1455.5 185 1455.5 217 V229"/><path d="M1455.5 267 V297 C1455.5 329 1494 329 1494 361 V373 V542 C1494 574 1494 574 1494 606 V618 V668 C1494 700 1494 700 1494 732 V744 V906 C1494 938 1490.5 938 1490.5 970 V982 V1032 C1490.5 1064 1420 1064 1420 1096 V1108" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="algebra-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1411" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1455.5" y="252">わからない</text></g></g><g class="flow-edge yes" data-edge="xor:yes:basis"><title>はい</title><path d="M1204 505 V542 C1204 574 864 574 864 606 V618"/><path d="M864 656 V668 C864 700 864 700 864 732 V744" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="xor:yes:basis" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="824" y="618" width="80" height="38" rx="5"/><text text-anchor="middle" x="864" y="641">はい</text></g></g><g class="flow-edge no" data-edge="xor:no:convolution"><title>いいえ</title><path d="M1284 505 V542 C1284 574 1228 574 1228 606 V618"/><path d="M1228 656 V668 C1228 700 1228 700 1228 732 V744" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="xor:no:convolution" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1188" y="618" width="80" height="38" rx="5"/><text text-anchor="middle" x="1228" y="641">いいえ</text></g></g><g class="flow-edge unknown" data-edge="xor:unknown:check"><title>わからない</title><path d="M1364 505 V542 C1364 574 1399.5 574 1399.5 606 V618"/><path d="M1399.5 656 V668 C1399.5 700 1438 700 1438 732 V744 V906 C1438 938 1434.5 938 1434.5 970 V982 V1032 C1434.5 1064 1340 1064 1340 1096 V1108" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="xor:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="618" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="641">わからない</text></g></g><g class="flow-edge yes" data-edge="convolution:yes:ntt-result"><title>はい</title><path d="M1148 894 V906 C1148 938 612 938 612 970 V982"/><path d="M612 1020 V1032 C612 1064 612 1064 612 1096 V1108" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="convolution:yes:ntt-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="572" y="982" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="1005">はい</text></g></g><g class="flow-edge no" data-edge="convolution:no:series"><title>いいえ</title><path d="M1228 894 V906 C1228 938 976 938 976 970 V982"/><path d="M976 1020 V1032 C976 1064 976 1064 976 1096 V1108" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="convolution:no:series" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="936" y="982" width="80" height="38" rx="5"/><text text-anchor="middle" x="976" y="1005">いいえ</text></g></g><g class="flow-edge unknown" data-edge="convolution:unknown:check"><title>わからない</title><path d="M1308 894 V906 C1308 938 1340 938 1340 970 V982"/><path d="M1340 1020 V1032 C1340 1064 1260 1064 1260 1096 V1108" marker-end="url(#arrow-algebra)"/><g class="flow-edge-label" data-edge-label="convolution:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1295.5" y="982" width="89" height="38" rx="5"/><text text-anchor="middle" x="1340" y="1005">わからない</text></g></g><g class="flow-node question" data-node="algebra-task"><rect x="721.5" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="737.5" y="52">質問</text><text class="node-title" x="737.5" y="80">数列や式の計算はどの形ですか？</text><text class="node-explanation" x="737.5" y="107">積の和と、和の最小値では使う演算が異なります。</text></g><g class="flow-node route" data-node="indexed-combinations-route"><rect x="32" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">添字の条件ごとの積・最小値</text><text class="node-explanation" x="48" y="448">添字の和、XOR、集合の分割など、組み合わせる条</text><text class="node-explanation" x="48" y="466">件と集計の演算を確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-indexed-combinations" data-route="algebra-indexed-combinations"><text x="48" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="coefficient-values-route"><rect x="396" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">係数列・多数の点での値</text><text class="node-explanation" x="412" y="448">多項式の係数列への演算と、多数の点での値や変数の</text><text class="node-explanation" x="412" y="466">移動を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-coefficient-values" data-route="algebra-coefficient-values"><text x="412" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="repeated-transitions-route"><rect x="760" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">同じ変換の繰り返し・遠い項</text><text class="node-explanation" x="776" y="448">同じ線形変換の繰り返し、累乗の総和、漸化式の遠い</text><text class="node-explanation" x="776" y="466">項を分けます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-repeated-transitions" data-route="algebra-repeated-transitions"><text x="776" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node question" data-node="xor"><rect x="1124" y="373" width="320" height="132" rx="7"/><text class="node-kind" x="1140" y="393">質問</text><text class="node-title" x="1140" y="421">操作は XOR による線形結合です</text><text class="node-title" x="1140" y="444">か？</text><text class="node-explanation" x="1140" y="471">ビットごとの係数を二元体上で考えます。</text></g><g class="flow-node result" data-node="basis"><rect x="704" y="744" width="320" height="127" rx="7"/><text class="node-kind" x="720" y="764">候補</text><text class="node-title" x="720" y="792">XOR 基底</text><a href="/flowchartcp/techniques/xor-basis/"><title>XOR基底の記事へ</title><text x="720" y="831">XOR基底</text></a></g><g class="flow-node question" data-node="convolution"><rect x="1068" y="744" width="320" height="150" rx="7"/><text class="node-kind" x="1084" y="764">質問</text><text class="node-title" x="1084" y="792">二つの数列の積を、添字の和ごとに集</text><text class="node-title" x="1084" y="815">計しますか？</text><text class="node-explanation" x="1084" y="842">c[k]=sum a[i]b[k-i] の形で</text><text class="node-explanation" x="1084" y="860">す。</text></g><g class="flow-node result" data-node="ntt-result"><rect x="452" y="1108" width="320" height="127" rx="7"/><text class="node-kind" x="468" y="1128">候補</text><text class="node-title" x="468" y="1156">NTT による畳み込み</text><a href="/flowchartcp/techniques/ntt/"><title>NTT・畳み込みの記事へ</title><text x="468" y="1195">NTT・畳み込み</text></a></g><g class="flow-node route" data-node="series"><rect x="816" y="1108" width="320" height="157" rx="7"/><text class="node-kind" x="832" y="1128">分野</text><text class="node-title" x="832" y="1156">係数列への演算と線形遷移</text><text class="node-explanation" x="832" y="1183">係数列の逆数・対数・指数と、同じ線形遷移の繰り返</text><text class="node-explanation" x="832" y="1201">しを分けます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-series-transitions" data-route="algebra-series-transitions"><text x="832" y="1229">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1180" y="1108" width="320" height="157" rx="7"/><text class="node-kind" x="1196" y="1128">分野</text><text class="node-title" x="1196" y="1156">係数の逆数と指定の法</text><text class="node-explanation" x="1196" y="1183">係数の逆数が必要か、指定の法で逆数が存在するかを</text><text class="node-explanation" x="1196" y="1201">確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-algebra-invertibility" data-route="algebra-invertibility"><text x="1196" y="1229">詳細の質問・図へ →</text></a></g></svg>