<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-path-black-constraints flow-desc-tree-path-black-constraints" width="1112" height="1736" viewBox="0 0 1112 1736" data-flow-svg="tree-path-black-constraints"><title id="flow-title-tree-path-black-constraints">満たせなかった経路条件の集合を包除し、自由な辺だけを数えるの解法フローチャート</title><desc id="flow-desc-tree-path-black-constraints">少数なのが経路の条件数か、木の辺数かを区別します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-path-black-constraints" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge at-least-black" data-edge="model:at-least-black:goal"><title>少数の指定経路のそれぞれに、黒い辺が一つ以上ある</title><path d="M564.5 182 V194 C564.5 226 246.5 226 246.5 258 V270"/><path d="M246.5 326 V338 C246.5 370 702.556 370 702.556 402 V414" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="model:at-least-black:goal" tabindex="0" role="group" aria-label="選択肢：少数の指定経路のそれぞれに、黒い辺が一つ以上ある"><rect x="124" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="246.5" y="293">少数の指定経路のそれぞれに、黒い辺</text><text text-anchor="middle" x="246.5" y="311">が一つ以上ある</text></g></g><g class="flow-edge exact-black" data-edge="model:exact-black:fallback"><title>指定経路ごとに、黒い辺の本数を固定する</title><path d="M628.5 182 V194 C628.5 226 535.5 226 535.5 258 V270"/><path d="M535.5 326 V338 C535.5 370 962 370 962 402 V414 V594 C962 626 962 626 962 658 V670 V720 C962 752 962 752 962 784 V796 V999 C962 1031 962 1031 962 1063 V1075 V1125 C962 1157 588 1157 588 1189 V1201" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="model:exact-black:fallback" tabindex="0" role="group" aria-label="選択肢：指定経路ごとに、黒い辺の本数を固定する"><rect x="413" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="535.5" y="293">指定経路ごとに、黒い辺の本数を固定</text><text text-anchor="middle" x="535.5" y="311">する</text></g></g><g class="flow-edge vertex-color" data-edge="model:vertex-color:fallback"><title>辺ではなく頂点を塗り、印の数に条件がある</title><path d="M692.5 182 V194 C692.5 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 1018 370 1018 402 V414 V594 C1018 626 1018 626 1018 658 V670 V720 C1018 752 1018 752 1018 784 V796 V999 C1018 1031 1018 1031 1018 1063 V1075 V1125 C1018 1157 652 1157 652 1189 V1201" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="model:vertex-color:fallback" tabindex="0" role="group" aria-label="選択肢：辺ではなく頂点を塗り、印の数に条件がある"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">辺ではなく頂点を塗り、印の数に条件</text><text text-anchor="middle" x="824.5" y="311">がある</text></g></g><g class="flow-edge unknown" data-edge="model:unknown:check"><title>わからない</title><path d="M756.5 182 V194 C756.5 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V594 C1074 626 1074 626 1074 658 V670 V720 C1074 752 1074 752 1074 784 V796 V999 C1074 1031 1074 1031 1074 1063 V1075 V1125 C1074 1157 1000 1157 1000 1189 V1201" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="model:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="goal:yes:guard"><title>はい</title><path d="M622.556 582 V594 C622.556 626 501.167 626 501.167 658 V670"/><path d="M501.167 708 V720 C501.167 752 501.167 752 501.167 784 V796" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="goal:yes:guard" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="461.1666666666667" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="501.1666666666667" y="693">はい</text></g></g><g class="flow-edge no" data-edge="goal:no:fallback"><title>いいえ</title><path d="M702.556 582 V594 C702.556 626 739 626 739 658 V670"/><path d="M739 708 V720 C739 752 850 752 850 784 V796 V999 C850 1031 850 1031 850 1063 V1075 V1125 C850 1157 524 1157 524 1189 V1201" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="goal:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="699" y="670" width="80" height="38" rx="5"/><text text-anchor="middle" x="739" y="693">いいえ</text></g></g><g class="flow-edge unknown" data-edge="goal:unknown:check"><title>わからない</title><path d="M782.556 582 V594 C782.556 626 867.5 626 867.5 658 V670"/><path d="M867.5 708 V720 C867.5 752 906 752 906 784 V796 V999 C906 1031 906 1031 906 1063 V1075 V1125 C906 1157 920 1157 920 1189 V1201" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="goal:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="823" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="867.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="guard:yes:result"><title>はい</title><path d="M421.167 987 V999 C421.167 1031 192 1031 192 1063 V1075"/><path d="M192 1113 V1125 C192 1157 192 1157 192 1189 V1201" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="guard:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1098">はい</text></g></g><g class="flow-edge no" data-edge="guard:no:fallback"><title>いいえ</title><path d="M501.167 987 V999 C501.167 1031 556 1031 556 1063 V1075"/><path d="M556 1113 V1125 C556 1157 460 1157 460 1189 V1201" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="guard:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1075" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1098">いいえ</text></g></g><g class="flow-edge unknown" data-edge="guard:unknown:check"><title>わからない</title><path d="M581.167 987 V999 C581.167 1031 755.5 1031 755.5 1063 V1075"/><path d="M755.5 1113 V1125 C755.5 1157 840 1157 840 1189 V1201" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="1075" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1098">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1351 V1381 C840 1413 783 1413 783 1445 V1457"/><path d="M783 1495 V1507 C783 1539 828.5 1539 828.5 1571 V1583" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1457" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1480">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1351 V1381 C920 1413 907 1413 907 1445 V1457"/><path d="M907 1495 V1507 C907 1539 908.5 1539 908.5 1571 V1583" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1457" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1480">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1351 V1381 C1000 1413 1035.5 1413 1035.5 1445 V1457"/><path d="M1035.5 1495 V1507 C1035.5 1539 988.5 1539 988.5 1571 V1583" marker-end="url(#arrow-tree-path-black-constraints)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1457" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1480">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="500.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="516.5" y="52">質問</text><text class="node-title" x="516.5" y="80">辺の二色塗りで、経路にどの条件があ</text><text class="node-title" x="516.5" y="103">りますか？</text><text class="node-explanation" x="516.5" y="130">少数なのが経路の条件数か、木の辺数かを区別しま</text><text class="node-explanation" x="516.5" y="148">す。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="558.5555555555557" y="434">質問</text><text class="node-title" x="558.5555555555557" y="462">木は固定され、辺はそれぞれ自由に白</text><text class="node-title" x="558.5555555555557" y="485">か黒を選べますか？</text><text class="node-explanation" x="558.5555555555557" y="512">ある経路条件の失敗は、その経路の全辺を白へ固定す</text><text class="node-explanation" x="558.5555555555557" y="530">ることです。失敗条件の集合では、経路の和集合を白</text><text class="node-explanation" x="558.5555555555557" y="548">に固定します。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="796" width="320" height="191" rx="7"/><text class="node-kind" x="357.1666666666667" y="816">質問</text><text class="node-title" x="357.1666666666667" y="844">指定経路の本数 M が小さく、2^</text><text class="node-title" x="357.1666666666667" y="867">M 個の失敗条件集合を処理できます</text><text class="node-title" x="357.1666666666667" y="890">か？</text><text class="node-explanation" x="357.1666666666667" y="917">指数化するのは辺数ではなく制約数です。経路の和集</text><text class="node-explanation" x="357.1666666666667" y="935">合を求め、残りの自由辺の色付けを 2^(自由辺</text><text class="node-explanation" x="357.1666666666667" y="953">数) 通りとして足し引きします。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1201" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1221">候補</text><text class="node-title" x="48" y="1249">満たせなかった経路条件の集合を包除</text><text class="node-title" x="48" y="1272">し、自由な辺だけを数える</text><a href="/flowchartcp/techniques/tree-path-hitting-inclusion-exclusion/"><title>少数の経路に黒辺を必ず置く条件は、失敗する経路の集合を包除するの記事へ</title><text x="48" y="1311">少数の経路に黒辺を必ず置く条件は、失敗する経路</text><text x="48" y="1329">の集合を包除する</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1201" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1221">候補</text><text class="node-title" x="412" y="1249">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1288">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1312">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1201" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1221">質問</text><text class="node-title" x="776" y="1249">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1272">書き出せますか？</text><text class="node-explanation" x="776" y="1299">少数なのが経路の条件数か、木の辺数かを区別しま</text><text class="node-explanation" x="776" y="1317">す。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1583" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1603">分野</text><text class="node-title" x="764.5" y="1631">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1668">詳細の質問・図へ →</text></a></g></svg>