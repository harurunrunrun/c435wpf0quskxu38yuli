<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-matrix-margins flow-desc-matrix-margins" width="1168" height="1431" viewBox="0 0 1168 1431" data-flow-svg="matrix-margins"><title id="flow-title-matrix-margins">下限のある整数表の復元の解法フローチャート</title><desc id="flow-desc-matrix-margins">各項の下限を先に割り当て、残りの行・列の総量を合わせます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-matrix-margins" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="integer:yes:residual"><title>はい</title><path d="M584.833 223 V235 C584.833 267 612 267 612 299 V311"/><path d="M612 349 V361 C612 393 612 393 612 425 V437" marker-end="url(#arrow-matrix-margins)"/><g class="flow-edge-label" data-edge-label="integer:yes:residual" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="572" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="334">はい</text></g></g><g class="flow-edge no" data-edge="integer:no:fallback"><title>いいえ</title><path d="M504.833 223 V235 C504.833 267 72 267 72 299 V311"/><path d="M72 349 V361 C72 393 38 393 38 425 V437 V640 C38 672 38 672 38 704 V716 V766 C38 798 38 798 38 830 V842 V1046 C38 1078 438.5 1078 438.5 1110 V1122 V1172 C438.5 1204 385.167 1204 385.167 1236 V1248" marker-end="url(#arrow-matrix-margins)"/><g class="flow-edge-label" data-edge-label="integer:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="32" y="311" width="80" height="38" rx="5"/><text text-anchor="middle" x="72" y="334">いいえ</text></g></g><g class="flow-edge unknown" data-edge="integer:unknown:check"><title>わからない</title><path d="M664.833 223 V235 C664.833 267 1070.5 267 1070.5 299 V311"/><path d="M1070.5 349 V361 C1070.5 393 1070.5 393 1070.5 425 V437 V640 C1070.5 672 1070.5 672 1070.5 704 V716 V766 C1070.5 798 1029.333 798 1029.333 830 V842" marker-end="url(#arrow-matrix-margins)"/><g class="flow-edge-label" data-edge-label="integer:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1026" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="1070.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="residual:yes:matrix-result"><title>はい</title><path d="M532 628 V640 C532 672 248 672 248 704 V716"/><path d="M248 754 V766 C248 798 248 798 248 830 V842" marker-end="url(#arrow-matrix-margins)"/><g class="flow-edge-label" data-edge-label="residual:yes:matrix-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="208" y="716" width="80" height="38" rx="5"/><text text-anchor="middle" x="248" y="739">はい</text></g></g><g class="flow-edge no" data-edge="residual:no:matrix-impossible"><title>いいえ</title><path d="M612 628 V640 C612 672 612 672 612 704 V716"/><path d="M612 754 V766 C612 798 612 798 612 830 V842" marker-end="url(#arrow-matrix-margins)"/><g class="flow-edge-label" data-edge-label="residual:no:matrix-impossible" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="572" y="716" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="739">いいえ</text></g></g><g class="flow-edge unknown" data-edge="residual:unknown:check"><title>わからない</title><path d="M692 628 V640 C692 672 976 672 976 704 V716"/><path d="M976 754 V766 C976 798 922.667 798 922.667 830 V842" marker-end="url(#arrow-matrix-margins)"/><g class="flow-edge-label" data-edge-label="residual:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="931.5" y="716" width="89" height="38" rx="5"/><text text-anchor="middle" x="976" y="739">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M896 992 V1046 C896 1078 528.5 1078 528.5 1110 V1122"/><path d="M528.5 1160 V1172 C528.5 1204 491.833 1204 491.833 1236 V1248" marker-end="url(#arrow-matrix-margins)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="488.5" y="1122" width="80" height="38" rx="5"/><text text-anchor="middle" x="528.5" y="1145">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M976 992 V1046 C976 1078 963 1078 963 1110 V1122"/><path d="M963 1160 V1172 C963 1204 922.667 1204 922.667 1236 V1248" marker-end="url(#arrow-matrix-margins)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="1122" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1145">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1056 992 V1046 C1056 1078 1091.5 1078 1091.5 1110 V1122"/><path d="M1091.5 1160 V1172 C1091.5 1204 1029.333 1204 1029.333 1236 V1248" marker-end="url(#arrow-matrix-margins)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1122" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1145">わからない</text></g></g><g class="flow-node question" data-node="integer"><rect x="424.83333333333337" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="440.83333333333337" y="52">質問</text><text class="node-title" x="440.83333333333337" y="80">各項は非負の整数で独立の上下限があ</text><text class="node-title" x="440.83333333333337" y="103">り、行と列の合計が指定されています</text><text class="node-title" x="440.83333333333337" y="126">か？</text><text class="node-explanation" x="440.83333333333337" y="153">累積和で合計が与えられた場合は、隣との差を取り、</text><text class="node-explanation" x="440.83333333333337" y="171">各行・各列の合計へ戻します。各項の固定下限だけ先</text><text class="node-explanation" x="440.83333333333337" y="189">に入れます。</text></g><g class="flow-node question" data-node="residual"><rect x="452" y="437" width="320" height="191" rx="7"/><text class="node-kind" x="468" y="457">質問</text><text class="node-title" x="468" y="485">下限を引いた行・列の残量は非負で、</text><text class="node-title" x="468" y="508">残り容量と全体の総和が整合します</text><text class="node-title" x="468" y="531">か？</text><text class="node-explanation" x="468" y="558">行から列への容量を上限−下限にします。行の総残量</text><text class="node-explanation" x="468" y="576">と列の総残量が等しく、その全量を流せれば復元でき</text><text class="node-explanation" x="468" y="594">ます。</text></g><g class="flow-node result" data-node="matrix-result"><rect x="88" y="842" width="320" height="192" rx="7"/><text class="node-kind" x="104" y="862">候補</text><text class="node-title" x="104" y="890">各項の下限を引いて残量を合わせ、整</text><text class="node-title" x="104" y="913">数表へ戻す</text><a href="/flowchartcp/techniques/matrix-margin-lower-offset/"><title>行列の各要素の下限を先に引き、行和と列和を流量で復元するの記事へ</title><text x="104" y="952">行列の各要素の下限を先に引き、行和と列和を流量</text><text x="104" y="970">で復元する</text></a><a href="/flowchartcp/techniques/max-flow/"><title>最大流・最小カットの記事へ</title><text x="104" y="994">最大流・最小カット</text></a></g><g class="flow-node result" data-node="matrix-impossible"><rect x="452" y="842" width="320" height="168" rx="7"/><text class="node-kind" x="468" y="862">候補</text><text class="node-title" x="468" y="890">下限を入れた時点の残量が整合しなけ</text><text class="node-title" x="468" y="913">れば、復元不可能と判定する</text><a href="/flowchartcp/techniques/matrix-margin-lower-offset/"><title>行列の各要素の下限を先に引き、行和と列和を流量で復元するの記事へ</title><text x="468" y="952">行列の各要素の下限を先に引き、行和と列和を流量</text><text x="468" y="970">で復元する</text></a></g><g class="flow-node question" data-node="check"><rect x="816" y="842" width="320" height="150" rx="7"/><text class="node-kind" x="832" y="862">質問</text><text class="node-title" x="832" y="890">合法な選択と、選ぶ回数・費用の条件</text><text class="node-title" x="832" y="913">を一つずつ確かめられますか？</text><text class="node-explanation" x="832" y="940">一対象を何回使えるか、必ず選ぶ対象があるか、経路</text><text class="node-explanation" x="832" y="958">はどこまで共用できるかを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="278.5" y="1248" width="320" height="151" rx="7"/><text class="node-kind" x="294.5" y="1268">候補</text><text class="node-title" x="294.5" y="1296">選択の条件と目的値を整理する</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="294.5" y="1335">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="294.5" y="1359">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1248" width="320" height="121" rx="7"/><text class="node-kind" x="832" y="1268">分野</text><text class="node-title" x="832" y="1296">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1333">詳細の質問・図へ →</text></a></g></svg>