<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strings-order-turns flow-desc-strings-order-turns" width="1112" height="1319" viewBox="0 0 1112 1319" data-flow-svg="strings-order-turns"><title id="flow-title-strings-order-turns">連結する順序・単語を使う手番の解法フローチャート</title><desc id="flow-desc-strings-order-turns">文字列を連結する順序の最適化と、同じ単語を再使用できる手番の勝敗を扱います。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strings-order-turns" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge concatenate" data-edge="text-task:concatenate:concatenate-check"><title>文字列の連結順序でスコアを最大にする</title><path d="M706.667 182 V194 C706.667 226 500 226 500 258 V270"/><path d="M500 326 V338 C500 370 500 370 500 402 V414" marker-end="url(#arrow-strings-order-turns)"/><g class="flow-edge-label" data-edge-label="text-task:concatenate:concatenate-check" tabindex="0" role="group" aria-label="選択肢：文字列の連結順序でスコアを最大にする"><rect x="377.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="500" y="293">文字列の連結順序でスコアを最大にす</text><text text-anchor="middle" x="500" y="311">る</text></g></g><g class="flow-edge reusable-word-game" data-edge="text-task:reusable-word-game:word-cycle-route"><title>同じ単語を何度でも使える、しりとりの勝敗</title><path d="M786.667 182 V194 C786.667 226 824.5 226 824.5 258 V270"/><path d="M824.5 326 V338 C824.5 370 864 370 864 402 V414" marker-end="url(#arrow-strings-order-turns)"/><g class="flow-edge-label" data-edge-label="text-task:reusable-word-game:word-cycle-route" tabindex="0" role="group" aria-label="選択肢：同じ単語を何度でも使える、しりとりの勝敗"><rect x="702" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="824.5" y="293">同じ単語を何度でも使える、しりとり</text><text text-anchor="middle" x="824.5" y="311">の勝敗</text></g></g><g class="flow-edge unknown" data-edge="text-task:unknown:check"><title>わからない</title><path d="M866.667 182 V194 C866.667 226 1035.5 226 1035.5 258 V270"/><path d="M1035.5 308 V338 C1035.5 370 1074 370 1074 402 V414 V581 C1074 613 1014.5 613 1014.5 645 V657 V707 C1014.5 739 973.333 739 973.333 771 V783" marker-end="url(#arrow-strings-order-turns)"/><g class="flow-edge-label" data-edge-label="text-task:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:substring-route"><title>はい</title><path d="M840 933 V946 C840 978 556 978 556 1010 V1022"/><path d="M556 1060 V1072 C556 1104 556 1104 556 1136 V1148" marker-end="url(#arrow-strings-order-turns)"/><g class="flow-edge-label" data-edge-label="check:yes:substring-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="516" y="1022" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1045">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 933 V946 C920 978 907 978 907 1010 V1022"/><path d="M907 1060 V1072 C907 1104 866.667 1104 866.667 1136 V1148" marker-end="url(#arrow-strings-order-turns)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1022" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1045">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 933 V946 C1000 978 1035.5 978 1035.5 1010 V1022"/><path d="M1035.5 1060 V1072 C1035.5 1104 973.333 1104 973.333 1136 V1148" marker-end="url(#arrow-strings-order-turns)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1022" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1045">わからない</text></g></g><g class="flow-edge yes" data-edge="concatenate-check:yes:concatenate-result"><title>はい</title><path d="M420 569 V581 C420 613 192 613 192 645 V657"/><path d="M192 695 V707 C192 739 192 739 192 771 V783" marker-end="url(#arrow-strings-order-turns)"/><g class="flow-edge-label" data-edge-label="concatenate-check:yes:concatenate-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="680">はい</text></g></g><g class="flow-edge no" data-edge="concatenate-check:no:fallback"><title>いいえ</title><path d="M500 569 V581 C500 613 556 613 556 645 V657"/><path d="M556 695 V707 C556 739 556 739 556 771 V783" marker-end="url(#arrow-strings-order-turns)"/><g class="flow-edge-label" data-edge-label="concatenate-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="657" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="680">いいえ</text></g></g><g class="flow-edge unknown" data-edge="concatenate-check:unknown:check"><title>わからない</title><path d="M580 569 V581 C580 613 920 613 920 645 V657"/><path d="M920 695 V707 C920 739 866.667 739 866.667 771 V783" marker-end="url(#arrow-strings-order-turns)"/><g class="flow-edge-label" data-edge-label="concatenate-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="657" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="680">わからない</text></g></g><g class="flow-node question" data-node="text-task"><rect x="626.6666666666666" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="642.6666666666666" y="52">質問</text><text class="node-title" x="642.6666666666666" y="80">並べる順序と、単語を使う手番のどち</text><text class="node-title" x="642.6666666666666" y="103">らを扱いますか？</text><text class="node-explanation" x="642.6666666666666" y="130">文字列を並べる最適化と、交互に単語を使う勝敗を区</text><text class="node-explanation" x="642.6666666666666" y="148">別します。</text></g><g class="flow-node question" data-node="check"><rect x="760" y="783" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="803">質問</text><text class="node-title" x="776" y="831">求めているのは、連続した部分文字列</text><text class="node-title" x="776" y="854">ですか？</text><text class="node-explanation" x="776" y="881">連続しない部分列なら、添字や最後の文字などを状態</text><text class="node-explanation" x="776" y="899">にする DP を検討します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="760" y="1148" width="320" height="139" rx="7"/><text class="node-kind" x="776" y="1168">分野</text><text class="node-title" x="776" y="1196">条件を確かめる</text><text class="node-explanation" x="776" y="1223">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="776" y="1251">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="substring-route"><rect x="396" y="1148" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1168">分野</text><text class="node-title" x="412" y="1196">部分文字列</text><a href="/flowchartcp/flowcharts/#diagram-string-substring" data-route="string-substring"><text x="412" y="1233">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="783" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="803">候補</text><text class="node-title" x="412" y="831">必要な文字列情報を定義する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="870">状態の設計</text></a><a href="/flowchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="412" y="894">対称性</text></a></g><g class="flow-node question" data-node="concatenate-check"><rect x="340" y="414" width="320" height="155" rx="7"/><text class="node-kind" x="356" y="434">質問</text><text class="node-title" x="356" y="462">隣り合う二つの文字列を交換した差</text><text class="node-title" x="356" y="485">が、個数と和の交差積で決まります</text><text class="node-title" x="356" y="508">か？</text><text class="node-explanation" x="356" y="535">各文字列内の寄与と、文字列間の寄与を分けます。</text></g><g class="flow-node result" data-node="concatenate-result"><rect x="32" y="783" width="320" height="151" rx="7"/><text class="node-kind" x="48" y="803">候補</text><text class="node-title" x="48" y="831">連結順の差を交差積で比較する</text><a href="/flowchartcp/techniques/exchange-crossproduct/"><title>連結順の優劣を隣接交換の交差積で決めるの記事へ</title><text x="48" y="870">連結順の優劣を隣接交換の交差積で決める</text></a><a href="/flowchartcp/techniques/exchange-argument/"><title>交換法の記事へ</title><text x="48" y="894">交換法</text></a></g><g class="flow-node route" data-node="word-cycle-route"><rect x="704" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="720" y="434">分野</text><text class="node-title" x="720" y="462">再使用できる単語の循環と引分</text><a href="/flowchartcp/flowcharts/#diagram-cyclic-games" data-route="cyclic-games"><text x="720" y="499">詳細の質問・図へ →</text></a></g></svg>