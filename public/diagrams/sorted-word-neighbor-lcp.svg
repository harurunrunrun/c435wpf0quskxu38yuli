755.5 1075 840 1075 840 1107 V1119" marker-end="url(#arrow-sorted-word-neighbor-lcp)"/><g class="flow-edge-label" data-edge-label="guard:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="711" y="993" width="89" height="38" rx="5"/><text text-anchor="middle" x="755.5" y="1016">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:uncertain"><title>はい</title><path d="M840 1269 V1299 C840 1331 783 1331 783 1363 V1375"/><path d="M783 1413 V1425 C783 1457 828.5 1457 828.5 1489 V1501" marker-end="url(#arrow-sorted-word-neighbor-lcp)"/><g class="flow-edge-label" data-edge-label="check:yes:uncertain" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="743" y="1375" width="80" height="38" rx="5"/><text text-anchor="middle" x="783" y="1398">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1269 V1299 C920 1331 907 1331 907 1363 V1375"/><path d="M907 1413 V1425 C907 1457 908.5 1457 908.5 1489 V1501" marker-end="url(#arrow-sorted-word-neighbor-lcp)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="867" y="1375" width="80" height="38" rx="5"/><text text-anchor="middle" x="907" y="1398">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1269 V1299 C1000 1331 1035.5 1331 1035.5 1363 V1375"/><path d="M1035.5 1413 V1425 C1035.5 1457 988.5 1457 988.5 1489 V1501" marker-end="url(#arrow-sorted-word-neighbor-lcp)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="1375" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="1398">わからない</text></g></g><g class="flow-node question" data-node="model"><rect x="513.5" y="32" width="320" height="127" rx="7"/><text class="node-kind" x="529.5" y="52">質問</text><text class="node-title" x="529.5" y="80">語ごとに、どの一致を求めますか？</text><text class="node-explanation" x="529.5" y="107">固定された語の一覧から、自分以外との接頭辞一致の</text><text class="node-explanation" x="529.5" y="125">最大を求めます。</text></g><g class="flow-node question" data-node="goal"><rect x="542.5555555555557" y="391" width="320" height="150" rx="7"/><text class="node-kind" x="558.5555555555557" y="411">質問</text><text class="node-title" x="558.5555555555557" y="439">語の一覧は固定され、同じ内容の語も</text><text class="node-title" x="558.5555555555557" y="462">別の添字として扱いますか？</text><text class="node-explanation" x="558.5555555555557" y="489">重複した語も隣り合うように並び、元の添字へ答えを</text><text class="node-explanation" x="558.5555555555557" y="507">戻します。自分との比較だけを除きます。</text></g><g class="flow-node question" data-node="guard"><rect x="341.1666666666667" y="755" width="320" height="150" rx="7"/><text class="node-kind" x="357.1666666666667" y="775">質問</text><text class="node-title" x="357.1666666666667" y="803">求めるのは接頭辞の一致で、途中の部</text><text class="node-title" x="357.1666666666667" y="826">分文字列の一致ではありませんか？</text><text class="node-explanation" x="357.1666666666667" y="853">辞書順で間にある語も同じ接頭辞を持つため、直前・</text><text class="node-explanation" x="357.1666666666667" y="871">直後のいずれかが最大値を達成します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1119" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1139">候補</text><text class="node-title" x="48" y="1167">辞書順で隣り合う語だけから、各語の</text><text class="node-title" x="48" y="1190">最長一致を求める</text><a href="/flowchartcp/techniques/sorted-adjacent-max-lcp/"><title>各文字列が他と共有する最長接頭辞は、辞書順で隣の二つだけ調べるの記事へ</title><text x="48" y="1229">各文字列が他と共有する最長接頭辞は、辞書順で隣</text><text x="48" y="1247">の二つだけ調べる</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1119" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1139">候補</text><text class="node-title" x="412" y="1167">別の条件に合う方法を探す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1206">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="412" y="1230">反例探し</text></a></g><g class="flow-node question" data-node="check"><rect x="760" y="1119" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1139">質問</text><text class="node-title" x="776" y="1167">対象・操作・求める量を、問題文から</text><text class="node-title" x="776" y="1190">書き出せますか？</text><text class="node-explanation" x="776" y="1217">固定された語の一覧から、自分以外との接頭辞一致の</text><text class="node-explanation" x="776" y="1235">最大を求めます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="748.5" y="1501" width="320" height="121" rx="7"/><text class="node-kind" x="764.5" y="1521">分野</text><text class="node-title" x="764.5" y="1549">未確認の条件を整理する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="764.5" y="1586">詳細の質問・図へ →</text></a></g></svg>