<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strings-subsequence-count-construction flow-desc-strings-subsequence-count-construction" width="1168" height="1731" viewBox="0 0 1168 1731" data-flow-svg="strings-subsequence-count-construction"><title id="flow-title-strings-subsequence-count-construction">部分列の種類数と構築の解法フローチャート</title><desc id="flow-desc-strings-subsequence-count-construction">異なる部分列の個数、指定長で辞書順最小の列、部分列として取り出せない最短の列を求めます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strings-subsequence-count-construction" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="subsequence-check:yes:subsequence-selection"><title>同じ文字列を一種類と数え、部分列の種類数を求める</title><path d="M584 182 V194 C584 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="subsequence-check:yes:subsequence-selection" tabindex="0" role="group" aria-label="選択肢：同じ文字列を一種類と数え、部分列の種類数を求める"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">同じ文字列を一種類と数え、部分列の</text><text text-anchor="middle" x="192" y="311">種類数を求める</text></g></g><g class="flow-edge fixed-lex-length" data-edge="subsequence-check:fixed-lex-length:fixed-lex-route"><title>ちょうど K 文字を残し、辞書順で最小にする</title><path d="M648 182 V194 C648 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="subsequence-check:fixed-lex-length:fixed-lex-route" tabindex="0" role="group" aria-label="選択肢：ちょうど K 文字を残し、辞書順で最小にする"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">ちょうど K 文字を残し、辞書順で</text><text text-anchor="middle" x="556" y="311">最小にする</text></g></g><g class="flow-edge absent" data-edge="subsequence-check:absent:absent-route"><title>部分列として取り出せない、最短で辞書順最小の列</title><path d="M712 182 V194 C712 226 880.5 226 880.5 258 V270"/><path d="M880.5 326 V338 C880.5 370 920 370 920 402 V414" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="subsequence-check:absent:absent-route" tabindex="0" role="group" aria-label="選択肢：部分列として取り出せない、最短で辞書順最小の列"><rect x="758" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="880.5" y="293">部分列として取り出せない、最短で辞</text><text text-anchor="middle" x="880.5" y="311">書順最小の列</text></g></g><g class="flow-edge unknown" data-edge="subsequence-check:unknown:check"><title>わからない</title><path d="M776 182 V194 C776 226 1091.5 226 1091.5 258 V270"/><path d="M1091.5 308 V338 C1091.5 370 1130 370 1130 402 V414 V594 C1130 626 1130 626 1130 658 V670 V720 C1130 752 1130 752 1130 784 V796 V976 C1130 1008 1126.5 1008 1126.5 1040 V1052 V1102 C1126.5 1134 1000 1134 1000 1166 V1178" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="subsequence-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:substring-route"><title>はい</title><path d="M840 1328 V1358 C840 1390 612 1390 612 1422 V1434"/><path d="M612 1472 V1484 C612 1516 612 1516 612 1548 V1560" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="check:yes:substring-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="572" y="1434" width="80" height="38" rx="5"/><text text-anchor="middle" x="612" y="1457">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M920 1328 V1358 C920 1390 963 1390 963 1422 V1434"/><path d="M963 1472 V1484 C963 1516 922.667 1516 922.667 1548 V1560" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="923" y="1434" width="80" height="38" rx="5"/><text text-anchor="middle" x="963" y="1457">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1000 1328 V1358 C1000 1390 1091.5 1390 1091.5 1422 V1434"/><path d="M1091.5 1472 V1484 C1091.5 1516 1029.333 1516 1029.333 1548 V1560" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1047" y="1434" width="89" height="38" rx="5"/><text text-anchor="middle" x="1091.5" y="1457">わからない</text></g></g><g class="flow-edge free" data-edge="subsequence-selection:free:free-subsequence-count"><title>元の順序以外に制約はない</title><path d="M96 582 V594 C96 626 357 626 357 658 V670"/><path d="M357 708 V720 C357 752 444 752 444 784 V796" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="subsequence-selection:free:free-subsequence-count" tabindex="0" role="group" aria-label="選択肢：元の順序以外に制約はない"><rect x="267" y="670" width="180" height="38" rx="5"/><text text-anchor="middle" x="357" y="693">元の順序以外に制約はない</text></g></g><g class="flow-edge nonadjacent" data-edge="subsequence-selection:nonadjacent:subsequence-result"><title>隣り合う元の位置を同時に残せない</title><path d="M160 582 V594 C160 626 607 626 607 658 V670"/><path d="M607 708 V720 C607 752 808 752 808 784 V796" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="subsequence-selection:nonadjacent:subsequence-result" tabindex="0" role="group" aria-label="選択肢：隣り合う元の位置を同時に残せない"><rect x="491" y="670" width="232" height="38" rx="5"/><text text-anchor="middle" x="607" y="693">隣り合う元の位置を同時に残せない</text></g></g><g class="flow-edge other" data-edge="subsequence-selection:other:fallback"><title>残す位置に別の制約がある</title><path d="M224 582 V594 C224 626 857 626 857 658 V670"/><path d="M857 708 V720 C857 752 1018 752 1018 784 V796 V976 C1018 1008 1014.5 1008 1014.5 1040 V1052 V1102 C1014.5 1134 609.333 1134 609.333 1166 V1178" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="subsequence-selection:other:fallback" tabindex="0" role="group" aria-label="選択肢：残す位置に別の制約がある"><rect x="767" y="670" width="180" height="38" rx="5"/><text text-anchor="middle" x="857" y="693">残す位置に別の制約がある</text></g></g><g class="flow-edge unknown" data-edge="subsequence-selection:unknown:check"><title>わからない</title><path d="M288 582 V594 C288 626 1035.5 626 1035.5 658 V670"/><path d="M1035.5 708 V720 C1035.5 752 1074 752 1074 784 V796 V976 C1074 1008 1070.5 1008 1070.5 1040 V1052 V1102 C1070.5 1134 920 1134 920 1166 V1178" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="subsequence-selection:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="991" y="670" width="89" height="38" rx="5"/><text text-anchor="middle" x="1035.5" y="693">わからない</text></g></g><g class="flow-edge yes" data-edge="free-subsequence-count:yes:free-count-result"><title>はい</title><path d="M364 964 V976 C364 1008 192 1008 192 1040 V1052"/><path d="M192 1090 V1102 C192 1134 192 1134 192 1166 V1178" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="free-subsequence-count:yes:free-count-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1075">はい</text></g></g><g class="flow-edge no" data-edge="free-subsequence-count:no:fallback"><title>いいえ</title><path d="M444 964 V976 C444 1008 556 1008 556 1040 V1052"/><path d="M556 1090 V1102 C556 1134 502.667 1134 502.667 1166 V1178" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="free-subsequence-count:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="516" y="1052" width="80" height="38" rx="5"/><text text-anchor="middle" x="556" y="1075">いいえ</text></g></g><g class="flow-edge unknown" data-edge="free-subsequence-count:unknown:check"><title>わからない</title><path d="M524 964 V976 C524 1008 920 1008 920 1040 V1052"/><path d="M920 1090 V1102 C920 1134 840 1134 840 1166 V1178" marker-end="url(#arrow-strings-subsequence-count-construction)"/><g class="flow-edge-label" data-edge-label="free-subsequence-count:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="875.5" y="1052" width="89" height="38" rx="5"/><text text-anchor="middle" x="920" y="1075">わからない</text></g></g><g class="flow-node question" data-node="subsequence-check"><rect x="520" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="536" y="52">質問</text><text class="node-title" x="536" y="80">種類数と、条件を満たす列の構築のど</text><text class="node-title" x="536" y="103">ちらですか？</text><text class="node-explanation" x="536" y="130">同じ出力列の重複、残す文字数、取り出せない列の長</text><text class="node-explanation" x="536" y="148">さと辞書順を区別します。</text></g><g class="flow-node question" data-node="check"><rect x="760" y="1178" width="320" height="150" rx="7"/><text class="node-kind" x="776" y="1198">質問</text><text class="node-title" x="776" y="1226">求めているのは、連続した部分文字列</text><text class="node-title" x="776" y="1249">ですか？</text><text class="node-explanation" x="776" y="1276">連続しない部分列なら、添字や最後の文字などを状態</text><text class="node-explanation" x="776" y="1294">にする DP を検討します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="816" y="1560" width="320" height="139" rx="7"/><text class="node-kind" x="832" y="1580">分野</text><text class="node-title" x="832" y="1608">条件を確かめる</text><text class="node-explanation" x="832" y="1635">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="832" y="1663">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="substring-route"><rect x="452" y="1560" width="320" height="121" rx="7"/><text class="node-kind" x="468" y="1580">分野</text><text class="node-title" x="468" y="1608">部分文字列</text><a href="/flowchartcp/flowcharts/#diagram-string-substring" data-route="string-substring"><text x="468" y="1645">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="396" y="1178" width="320" height="151" rx="7"/><text class="node-kind" x="412" y="1198">候補</text><text class="node-title" x="412" y="1226">必要な文字列情報を定義する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="412" y="1265">状態の設計</text></a><a href="/flowchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="412" y="1289">対称性</text></a></g><g class="flow-node result" data-node="subsequence-result"><rect x="648" y="796" width="320" height="168" rx="7"/><text class="node-kind" x="664" y="816">候補</text><text class="node-title" x="664" y="844">同じ末尾文字が作れた、非隣接の列の</text><text class="node-title" x="664" y="867">範囲を差し引く</text><a href="/flowchartcp/techniques/subsequence-nonadjacent-last-range/"><title>隣り合う位置を選べない部分列の重複を、二つ前までの総数で除くの記事へ</title><text x="664" y="906">隣り合う位置を選べない部分列の重複を、二つ前ま</text><text x="664" y="924">での総数で除く</text></a></g><g class="flow-node question" data-node="subsequence-selection"><rect x="32" y="414" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="434">質問</text><text class="node-title" x="48" y="462">元の位置から文字を残すとき、どの制</text><text class="node-title" x="48" y="485">約がありますか？</text><text class="node-explanation" x="48" y="512">普通の部分列では残す位置を自由に選べます。隣接し</text><text class="node-explanation" x="48" y="530">た位置を同時に選べない場合は、別の遷移が必要で</text><text class="node-explanation" x="48" y="548">す。</text></g><g class="flow-node question" data-node="free-subsequence-count"><rect x="284" y="796" width="320" height="168" rx="7"/><text class="node-kind" x="300" y="816">質問</text><text class="node-title" x="300" y="844">空文字の扱いを決め、同じ文字列を一</text><text class="node-title" x="300" y="867">回だけ数えますか？</text><text class="node-explanation" x="300" y="894">新しい文字を末尾に付けた列のうち、以前の同じ文字</text><text class="node-explanation" x="300" y="912">の追加で作れた列を差し引きます。位置の選び方の個</text><text class="node-explanation" x="300" y="930">数とは異なります。</text></g><g class="flow-node result" data-node="free-count-result"><rect x="32" y="1178" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1198">候補</text><text class="node-title" x="48" y="1226">同じ末尾文字が前に作った寄与だけを</text><text class="node-title" x="48" y="1249">差し引く</text><a href="/flowchartcp/techniques/dp-last-occurrence/"><title>同じ部分列を重複して数えるときは直前の出現を使うの記事へ</title><text x="48" y="1288">同じ部分列を重複して数えるときは直前の出現を使</text><text x="48" y="1306">う</text></a></g><g class="flow-node route" data-node="absent-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">取り出せない最短の列</text><a href="/flowchartcp/flowcharts/#diagram-subsequence-absent" data-route="subsequence-absent"><text x="776" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="fixed-lex-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">残せる文字数を保つ辞書順の選択</text><a href="/flowchartcp/flowcharts/#diagram-fixed-length-lex-subsequence" data-route="fixed-length-lex-subsequence"><text x="412" y="499">詳細の質問・図へ →</text></a></g></svg>