710 636 710 668 V680 V730 C710 762 652 762 652 794 V806" marker-end="url(#arrow-integer-representable-residues)"/><g class="flow-edge-label" data-edge-label="nonnegative:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="modulus:yes:answer"><title>はい</title><path d="M314.167 592 V604 C314.167 636 192 636 192 668 V680"/><path d="M192 718 V730 C192 762 192 762 192 794 V806" marker-end="url(#arrow-integer-representable-residues)"/><g class="flow-edge-label" data-edge-label="modulus:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="703">はい</text></g></g><g class="flow-edge no" data-edge="modulus:no:check"><title>いいえ</title><path d="M394.167 592 V604 C394.167 636 431 636 431 668 V680"/><path d="M431 718 V730 C431 762 460 762 460 794 V806" marker-end="url(#arrow-integer-representable-residues)"/><g class="flow-edge-label" data-edge-label="modulus:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="703">いいえ</text></g></g><g class="flow-edge unknown" data-edge="modulus:unknown:check"><title>わからない</title><path d="M474.167 592 V604 C474.167 636 559.5 636 559.5 668 V680"/><path d="M559.5 718 V730 C559.5 762 524 762 524 794 V806" marker-end="url(#arrow-integer-representable-residues)"/><g class="flow-edge-label" data-edge-label="modulus:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="680" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-node question" data-node="nonnegative"><rect x="376.2222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="392.2222222222223" y="52">質問</text><text class="node-title" x="392.2222222222223" y="80">非負の数を何回でも足せ、足し方では</text><text class="node-title" x="392.2222222222223" y="103">なく作れる合計額の種類数を数えます</text><text class="node-title" x="392.2222222222223" y="126">か？</text><text class="node-explanation" x="392.2222222222223" y="153">負数がある場合や使用回数の制限がある場合には、同</text><text class="node-explanation" x="392.2222222222223" y="171">じ到達額の構造を使えません。</text></g><g class="flow-node question" data-node="modulus"><rect x="234.16666666666669" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="250.16666666666669" y="439">質問</text><text class="node-title" x="250.16666666666669" y="467">全て0の場合を分け、それ以外では最</text><text class="node-title" x="250.16666666666669" y="490">小の正数を法とする状態数が制約に収</text><text class="node-title" x="250.16666666666669" y="513">まりますか？</text><text class="node-explanation" x="250.16666666666669" y="540">全て0なら作れる額は0だけ。正数があれば、各余り</text><text class="node-explanation" x="250.16666666666669" y="558">での最小到達額から最小の正数を何度でも足せます。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="806" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="826">候補</text><text class="node-title" x="48" y="854">余りごとの最小到達額から等差数列を</text><text class="node-title" x="48" y="877">数える</text><a href="/flowchartcp/techniques/residue-shortest-representable-count/"><title>繰り返し足して作れる合計額を、剰余ごとの最小値から数えるの記事へ</title><text x="48" y="916">繰り返し足して作れる合計額を、剰余ごとの最小値</text><text x="48" y="934">から数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="806" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="826">分野</text><text class="node-title" x="412" y="854">前提と、求める対象を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="891">詳細の質問・図へ →</text></a></g></svg>