624.5 223 V235 C624.5 267 671.5 267 671.5 299 V311"/><path d="M671.5 349 V361 C671.5 393 710 393 710 425 V437 V622 C710 654 710 654 710 686 V698 V748 C710 780 710 780 710 812 V824 V1027 C710 1059 710 1059 710 1091 V1103 V1153 C710 1185 670.286 1185 670.286 1217 V1229" marker-end="url(#arrow-two-mark-manhattan-circuit-conditions)"/><g class="flow-edge-label" data-edge-label="two-unknown-marks:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="311" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="334">わからない</text></g></g><g class="flow-edge yes" data-edge="sequential-gates:yes:size"><title>はい</title><path d="M352.5 610 V622 C352.5 654 307 654 307 686 V698"/><path d="M307 736 V748 C307 780 319.5 780 319.5 812 V824" marker-end="url(#arrow-two-mark-manhattan-circuit-conditions)"/><g class="flow-edge-label" data-edge-label="sequential-gates:yes:size" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="698" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="721">はい</text></g></g><g class="flow-edge no" data-edge="sequential-gates:no:check"><title>いいえ</title><path d="M432.5 610 V622 C432.5 654 431 654 431 686 V698"/><path d="M431 736 V748 C431 780 542 780 542 812 V824 V1027 C542 1059 542 1059 542 1091 V1103 V1153 C542 1185 533.143 1185 533.143 1217 V1229" marker-end="url(#arrow-two-mark-manhattan-circuit-conditions)"/><g class="flow-edge-label" data-edge-label="sequential-gates:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="698" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="721">いいえ</text></g></g><g class="flow-edge unknown" data-edge="sequential-gates:unknown:check"><title>わからない</title><path d="M512.5 610 V622 C512.5 654 559.5 654 559.5 686 V698"/><path d="M559.5 736 V748 C559.5 780 598 780 598 812 V824 V1027 C598 1059 598 1059 598 1091 V1103 V1153 C598 1185 578.857 1185 578.857 1217 V1229" marker-end="url(#arrow-two-mark-manhattan-circuit-conditions)"/><g class="flow-edge-label" data-edge-label="sequential-gates:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="698" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="721">わからない</text></g></g><g class="flow-edge yes" data-edge="size:yes:result"><title>はい</title><path d="M239.5 1015 V1027 C239.5 1059 192 1059 192 1091 V1103"/><path d="M192 1141 V1153 C192 1185 192 1185 192 1217 V1229" marker-end="url(#arrow-two-mark-manhattan-circuit-conditions)"/><g class="flow-edge-label" data-edge-label="size:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1126">はい</text></g></g><g class="flow-edge no" data-edge="size:no:check"><title>いいえ</title><path d="M319.5 1015 V1027 C319.5 1059 319 1059 319 1091 V1103"/><path d="M319 1141 V1153 C319 1185 441.714 1185 441.714 1217 V1229" marker-end="url(#arrow-two-mark-manhattan-circuit-conditions)"/><g class="flow-edge-label" data-edge-label="size:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1103" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1126">いいえ</text></g></g><g class="flow-edge unknown" data-edge="size:unknown:check"><title>わからない</title><path d="M399.5 1015 V1027 C399.5 1059 447.5 1059 447.5 1091 V1103"/><path d="M447.5 1141 V1153 C447.5 1185 487.429 1185 487.429 1217 V1229" marker-end="url(#arrow-two-mark-manhattan-circuit-conditions)"/><g class="flow-edge-label" data-edge-label="size:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1103" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1126">わからない</text></g></g><g class="flow-node question" data-node="two-unknown-marks"><rect x="384.5" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">黒画素がちょうど二つの長方形画像</text><text class="node-title" x="400.5" y="103">で、位置を見ずに距離の判定回路を作</text><text class="node-title" x="400.5" y="126">りますか？</text><text class="node-explanation" x="400.5" y="153">分かるのは画像の縦横と距離Kだけです。後から与え</text><text class="node-explanation" x="400.5" y="171">る全ての二画素配置で、マンハッタン距離がKかを判</text><text class="node-explanation" x="400.5" y="189">定します。</text></g><g class="flow-node question" data-node="sequential-gates"><rect x="272.5" y="437" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="457">質問</text><text class="node-title" x="288.5" y="485">多入力のAND・ORと一入力の</text><text class="node-title" x="288.5" y="508">NOTを使い、前の出力を共有できま</text><text class="node-title" x="288.5" y="531">すか？</text><text class="node-explanation" x="288.5" y="558">画像入力または既に作ったゲートの出力を参照しま</text><text class="node-explanation" x="288.5" y="576">す。空入力は禁止し、最後のゲートを答えにします。</text></g><g class="flow-node question" data-node="size"><rect x="159.5" y="824" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="844">質問</text><text class="node-title" x="175.5" y="872">縦横はそれぞれ200以下で、ゲート</text><text class="node-title" x="175.5" y="895">3190個・入力端子86368個を</text><text class="node-title" x="175.5" y="918">使えますか？</text><text class="node-explanation" x="175.5" y="945">縦横は正で、画素は二つ以上です。Kは非負整数。原</text><text class="node-explanation" x="175.5" y="963">典の予算である10000ゲート・1000000端</text><text class="node-explanation" x="175.5" y="981">子に収まります。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1229" width="320" height="150" rx="7"/><text class="node-kind" x="48" y="1249">候補</text><text class="node-title" x="48" y="1277">対角線の占有と接頭ORを共有し、距</text><text class="node-title" x="48" y="1300">離の上限二つを判定する</text><a href="/flowchartcp/techniques/rotated-manhattan-two-mark-boolean-circuit/"><title>二つの黒画素の距離を判定する論理回路を作るの記事へ</title><text x="48" y="1339">二つの黒画素の距離を判定する論理回路を作る</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1229" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1249">分野</text><text class="node-title" x="412" y="1277">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1314">詳細の質問・図へ →</text></a></g></svg>