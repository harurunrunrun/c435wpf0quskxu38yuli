<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-digit-sum-divisor-conditions flow-desc-digit-sum-divisor-conditions" width="748" height="1006" viewBox="0 0 748 1006" data-flow-svg="digit-sum-divisor-conditions"><title id="flow-title-digit-sum-divisor-conditions">整数が自分の桁和で割り切れる個数の解法フローチャート</title><desc id="flow-desc-digit-sum-divisor-conditions">割る数が桁和であることと、桁数に応じた計算量を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-digit-sum-divisor-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="own-sum:yes:small-range"><title>はい</title><path d="M456.222 205 V217 C456.222 249 394.167 249 394.167 281 V293"/><path d="M394.167 331 V343 C394.167 375 394.167 375 394.167 407 V419" marker-end="url(#arrow-digit-sum-divisor-conditions)"/><g class="flow-edge-label" data-edge-label="own-sum:yes:small-range" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="354.1666666666667" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="394.1666666666667" y="316">はい</text></g></g><g class="flow-edge no" data-edge="own-sum:no:check"><title>いいえ</title><path d="M536.222 205 V217 C536.222 249 543 249 543 281 V293"/><path d="M543 331 V343 C543 375 654 375 654 407 V419 V604 C654 636 654 636 654 668 V680 V730 C654 762 588 762 588 794 V806" marker-end="url(#arrow-digit-sum-divisor-conditions)"/><g class="flow-edge-label" data-edge-label="own-sum:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="293" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="316">いいえ</text></g></g><g class="flow-edge unknown" data-edge="own-sum:unknown:check"><title>わからない</title><path d="M616.222 205 V217 C616.222 249 671.5 249 671.5 281 V293"/><path d="M671.5 331 V343 C671.5 375 710 375 710 407 V419 V604 C710 636 710 636 710 668 V680 V730 C710 762 652 762 652 794 V806" marker-end="url(#arrow-digit-sum-divisor-conditions)"/><g class="flow-edge-label" data-edge-label="own-sum:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="293" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="316">わからない</text></g></g><g class="flow-edge yes" data-edge="small-range:yes:answer"><title>はい</title><path d="M314.167 592 V604 C314.167 636 192 636 192 668 V680"/><path d="M192 718 V730 C192 762 192 762 192 794 V806" marker-end="url(#arrow-digit-sum-divisor-conditions)"/><g class="flow-edge-label" data-edge-label="small-range:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="703">はい</text></g></g><g class="flow-edge no" data-edge="small-range:no:check"><title>いいえ</title><path d="M394.167 592 V604 C394.167 636 431 636 431 668 V680"/><path d="M431 718 V730 C431 762 460 762 460 794 V806" marker-end="url(#arrow-digit-sum-divisor-conditions)"/><g class="flow-edge-label" data-edge-label="small-range:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="680" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="703">いいえ</text></g></g><g class="flow-edge unknown" data-edge="small-range:unknown:check"><title>わからない</title><path d="M474.167 592 V604 C474.167 636 559.5 636 559.5 668 V680"/><path d="M559.5 718 V730 C559.5 762 524 762 524 794 V806" marker-end="url(#arrow-digit-sum-divisor-conditions)"/><g class="flow-edge-label" data-edge-label="small-range:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="680" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-node question" data-node="own-sum"><rect x="376.2222222222223" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="392.2222222222223" y="52">質問</text><text class="node-title" x="392.2222222222223" y="80">上限以下の正整数について、その整数</text><text class="node-title" x="392.2222222222223" y="103">自身の十進の桁和で割り切れる個数を</text><text class="node-title" x="392.2222222222223" y="126">数えますか？</text><text class="node-explanation" x="392.2222222222223" y="153">割る数は生成する整数によって変わります。固定の法</text><text class="node-explanation" x="392.2222222222223" y="171">に対する桁和の余りを指定する条件とは異なります。</text></g><g class="flow-node question" data-node="small-range"><rect x="234.16666666666669" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="250.16666666666669" y="439">質問</text><text class="node-title" x="250.16666666666669" y="467">桁数Dに対して桁和1..9Dを列挙</text><text class="node-title" x="250.16666666666669" y="490">し、Dの4乗程度の計算が制限内です</text><text class="node-title" x="250.16666666666669" y="513">か？</text><text class="node-explanation" x="250.16666666666669" y="540">掲載実装は上限10の14乗まで。各桁和を固定すれ</text><text class="node-explanation" x="250.16666666666669" y="558">ば整数の余りを更新できます。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="806" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="826">候補</text><text class="node-title" x="48" y="854">最終桁和を固定し、正確な桁和とその</text><text class="node-title" x="48" y="877">法の余りを同時に持つ</text><a href="/flowchartcp/techniques/digit-sum-divides-value/"><title>整数が自分の桁和で割り切れる条件は、桁和を固定して余りを持つの記事へ</title><text x="48" y="916">整数が自分の桁和で割り切れる条件は、桁和を固定</text><text x="48" y="934">して余りを持つ</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="806" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="826">分野</text><text class="node-title" x="412" y="854">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="891">詳細の質問・図へ →</text></a></g></svg>