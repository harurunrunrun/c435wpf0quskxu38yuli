い"><rect x="683" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="727.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="open-state:yes:open-result"><title>はい</title><path d="M323.167 951 V963 C323.167 995 192 995 192 1027 V1039"/><path d="M192 1077 V1089 C192 1121 192 1121 192 1153 V1165" marker-end="url(#arrow-group-spread)"/><g class="flow-edge-label" data-edge-label="open-state:yes:open-result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="open-state:no:fallback"><title>いいえ</title><path d="M403.167 951 V963 C403.167 995 402 995 402 1027 V1039"/><path d="M402 1077 V1089 C402 1121 402 1121 402 1153 V1165 V1345 C402 1377 360 1377 360 1409 V1421 V1471 C360 1503 264 1503 264 1535 V1547" marker-end="url(#arrow-group-spread)"/><g class="flow-edge-label" data-edge-label="open-state:no:fallback" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="362" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="402" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="open-state:unknown:check"><title>わからない</title><path d="M483.167 951 V963 C483.167 995 615.5 995 615.5 1027 V1039"/><path d="M615.5 1077 V1089 C615.5 1121 588 1121 588 1153 V1165" marker-end="url(#arrow-group-spread)"/><g class="flow-edge-label" data-edge-label="open-state:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="571" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="615.5" y="1062">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:fallback"><title>はい</title><path d="M588 1315 V1345 C588 1377 506 1377 506 1409 V1421"/><path d="M506 1459 V1471 C506 1503 392 1503 392 1535 V1547" marker-end="url(#arrow-group-spread)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="466" y="1421" width="80" height="38" rx="5"/><text text-anchor="middle" x="506" y="1444">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 1315 V1345 C668 1377 655 1377 655 1409 V1421"/><path d="M655 1459 V1471 C655 1503 670.667 1503 670.667 1535 V1547" marker-end="url(#arrow-group-spread)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1421" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1444">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 1315 V1345 C748 1377 783.5 1377 783.5 1409 V1421"/><path d="M783.5 1459 V1471 C783.5 1503 777.333 1503 777.333 1535 V1547" marker-end="url(#arrow-group-spread)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1421" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1444">わからない</text></g></g><g class="flow-node question" data-node="sort-people"><rect x="549.0185185185186" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="565.0185185185186" y="52">質問</text><text class="node-title" x="565.0185185185186" y="80">要素を値で並べても、要素どうしの区</text><text class="node-title" x="565.0185185185186" y="103">別と組分けの個数を保てますか？</text><text class="node-explanation" x="565.0185185185186" y="130">同じ値の人も別人として数えます。組の名前を付けて</text><text class="node-explanation" x="565.0185185185186" y="148">重複して数えないようにします。</text></g><g class="flow-node question" data-node="open-gap"><rect x="416.55555555555554" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="432.55555555555554" y="416">質問</text><text class="node-title" x="432.55555555555554" y="444">隣り合う値の差は、その間をまたぐ各</text><text class="node-title" x="432.55555555555554" y="467">組の広がりへ一回ずつ加わりますか？</text><text class="node-explanation" x="432.55555555555554" y="494">まだ閉じていない組が j 個なら、次の値との差 </text><text class="node-explanation" x="432.55555555555554" y="512">Δ で費用が jΔ 増えます。</text></g><g class="flow-node question" data-node="open-state"><rect x="243.16666666666669" y="760" width="320" height="191" rx="7"/><text class="node-kind" x="259.1666666666667" y="780">質問</text><text class="node-title" x="259.1666666666667" y="808">開いている組の個数と累計費用だけ</text><text class="node-title" x="259.1666666666667" y="831">で、次の組への入れ方を数えられます</text><text class="node-title" x="259.1666666666667" y="854">か？</text><text class="node-explanation" x="259.1666666666667" y="881">新しく開く、一人組で閉じる、既存の組へ入れて開い</text><text class="node-explanation" x="259.1666666666667" y="899">たままにする、既存の組を閉じるという選択を数えま</text><text class="node-explanation" x="259.1666666666667" y="917">す。</text></g><g class="flow-node result" data-node="open-result"><rect x="32" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1185">候補</text><text class="node-title" x="48" y="1213">開いた組の個数を持ち、値の隙間ごと</text><text class="node-title" x="48" y="1236">に個数×差を加える</text><a href="/flowchartcp/techniques/dp-open-groups-gap-cost/"><title>最大値と最小値の差の合計は、開いている組数で積み上げるの記事へ</title><text x="48" y="1275">最大値と最小値の差の合計は、開いている組数で積</text><text x="48" y="1293">み上げる</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="1165" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="1185">質問</text><text class="node-title" x="524" y="1213">必要な条件を、問題文と小さい例から</text><text class="node-title" x="524" y="1236">確認できますか？</text><text class="node-explanation" x="524" y="1263">どの性質が入力で保証され、どの性質を式や操作から</text><text class="node-explanation" x="524" y="1281">示す必要があるかを書き分けます。</text></g><g class="flow-node result" data-node="fallback"><rect x="200" y="1547" width="320" height="151" rx="7"/><text class="node-kind" x="216" y="1567">候補</text><text class="node-title" x="216" y="1595">条件と状態をもう一度確かめる</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="216" y="1634">状態の設計</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="216" y="1658">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="564" y="1547" width="320" height="121" rx="7"/><text class="node-kind" x="580" y="1567">分野</text><text class="node-title" x="580" y="1595">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="580" y="1632">詳細の質問・図へ →</text></a></g></svg>