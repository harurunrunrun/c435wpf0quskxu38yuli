dge="goal:increasing:increasing-route"><title>一様に選んだ番号が現在より大きい間だけ続き、訪れた報酬を足す</title><path d="M1757.273 182 V194 C1757.273 226 920 226 920 258 V270"/><path d="M920 326 V356 C920 388 920 388 920 420 V432" marker-end="url(#arrow-stateful-random-process-features)"/><g class="flow-edge-label" data-edge-label="goal:increasing:increasing-route" tabindex="0" role="group" aria-label="選択肢：一様に選んだ番号が現在より大きい間だけ続き、訪れた報酬を足す"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">一様に選んだ番号が現在より大きい間</text><text text-anchor="middle" x="920" y="311">だけ続き、訪れた報酬を足す</text></g></g><g class="flow-edge random-swap" data-edge="goal:random-swap:random-swap-route"><title>一様に二つの位置を重複を許して選び、交換を繰り返した一個の値</title><path d="M1786.364 182 V194 C1786.364 226 1284 226 1284 258 V270"/><path d="M1284 326 V356 C1284 388 1284 388 1284 420 V432" marker-end="url(#arrow-stateful-random-process-features)"/><g class="flow-edge-label" data-edge-label="goal:random-swap:random-swap-route" tabindex="0" role="group" aria-label="選択肢：一様に二つの位置を重複を許して選び、交換を繰り返した一個の値"><rect x="1168" y="270" width="232" height="56" rx="5"/><text text-anchor="middle" x="1284" y="293">一様に二つの位置を重複を許して選</text><text text-anchor="middle" x="1284" y="311">び、交換を繰り返した一個の値</text></g></g><g class="flow-edge dice-product" data-edge="goal:dice-product:dice-product-route"><title>サイコロの出目の積が、指定の整数にちょうど達する確率</title><path d="M1815.455 182 V194 C1815.455 226 1648 226 1648 258 V270"/><path d="M1648 326 V356 C1648 388 1648 388 1648 420 V432" marker-end="url(#arrow-stateful-random-process-features)"/><g class="flow-edge-label" data-edge-label="goal:dice-product:dice-product-route" tabindex="0" role="group" aria-label="選択肢：サイコロの出目の積が、指定の整数にちょうど達する確率"><rect x="1525.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="1648" y="293">サイコロの出目の積が、指定の整数に</text><text text-anchor="middle" x="1648" y="311">ちょうど達する確率</text></g></g><g class="flow-edge remove-edge" data-edge="goal:remove-edge:remove-edge-route"><