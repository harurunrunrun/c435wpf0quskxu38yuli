<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-increasing-labels-conditions flow-desc-tree-increasing-labels-conditions" width="748" height="1342" viewBox="0 0 748 1342" data-flow-svg="tree-increasing-labels-conditions"><title id="flow-title-tree-increasing-labels-conditions">親が先になる順序を全ての根で数えるの解法フローチャート</title><desc id="flow-desc-tree-increasing-labels-conditions">木の親子関係だけの制約、根の変更、逆元が使える範囲を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-increasing-labels-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="parent-only:yes:all-roots"><title>はい</title><path d="M464.5 200 V212 C464.5 244 419 244 419 276 V288"/><path d="M419 326 V338 C419 370 432.5 370 432.5 402 V414" marker-end="url(#arrow-tree-increasing-labels-conditions)"/><g class="flow-edge-label" data-edge-label="parent-only:yes:all-roots" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="311">はい</text></g></g><g class="flow-edge no" data-edge="parent-only:no:check"><title>いいえ</title><path d="M544.5 200 V212 C544.5 244 543 244 543 276 V288"/><path d="M543 326 V338 C543 370 654 370 654 402 V414 V576 C654 608 654 608 654 640 V652 V702 C654 734 654 734 654 766 V778 V940 C654 972 654 972 654 1004 V1016 V1066 C654 1098 624.571 1098 624.571 1130 V1142" marker-end="url(#arrow-tree-increasing-labels-conditions)"/><g class="flow-edge-label" data-edge-label="parent-only:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="288" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="311">いいえ</text></g></g><g class="flow-edge unknown" data-edge="parent-only:unknown:check"><title>わからない</title><path d="M624.5 200 V212 C624.5 244 671.5 244 671.5 276 V288"/><path d="M671.5 326 V338 C671.5 370 710 370 710 402 V414 V576 C710 608 710 608 710 640 V652 V702 C710 734 710 734 710 766 V778 V940 C710 972 710 972 710 1004 V1016 V1066 C710 1098 670.286 1098 670.286 1130 V1142" marker-end="url(#arrow-tree-increasing-labels-conditions)"/><g class="flow-edge-label" data-edge-label="parent-only:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="288" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="311">わからない</text></g></g><g class="flow-edge yes" data-edge="all-roots:yes:prime-range"><title>はい</title><path d="M352.5 564 V576 C352.5 608 307 608 307 640 V652"/><path d="M307 690 V702 C307 734 319.5 734 319.5 766 V778" marker-end="url(#arrow-tree-increasing-labels-conditions)"/><g class="flow-edge-label" data-edge-label="all-roots:yes:prime-range" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="675">はい</text></g></g><g class="flow-edge no" data-edge="all-roots:no:check"><title>いいえ</title><path d="M432.5 564 V576 C432.5 608 431 608 431 640 V652"/><path d="M431 690 V702 C431 734 542 734 542 766 V778 V940 C542 972 542 972 542 1004 V1016 V1066 C542 1098 533.143 1098 533.143 1130 V1142" marker-end="url(#arrow-tree-increasing-labels-conditions)"/><g class="flow-edge-label" data-edge-label="all-roots:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="all-roots:unknown:check"><title>わからない</title><path d="M512.5 564 V576 C512.5 608 559.5 608 559.5 640 V652"/><path d="M559.5 690 V702 C559.5 734 598 734 598 766 V778 V940 C598 972 598 972 598 1004 V1016 V1066 C598 1098 578.857 1098 578.857 1130 V1142" marker-end="url(#arrow-tree-increasing-labels-conditions)"/><g class="flow-edge-label" data-edge-label="all-roots:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="675">わからない</text></g></g><g class="flow-edge yes" data-edge="prime-range:yes:answer"><title>はい</title><path d="M239.5 928 V940 C239.5 972 192 972 192 1004 V1016"/><path d="M192 1054 V1066 C192 1098 192 1098 192 1130 V1142" marker-end="url(#arrow-tree-increasing-labels-conditions)"/><g class="flow-edge-label" data-edge-label="prime-range:yes:answer" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1039">はい</text></g></g><g class="flow-edge no" data-edge="prime-range:no:check"><title>いいえ</title><path d="M319.5 928 V940 C319.5 972 319 972 319 1004 V1016"/><path d="M319 1054 V1066 C319 1098 441.714 1098 441.714 1130 V1142" marker-end="url(#arrow-tree-increasing-labels-conditions)"/><g class="flow-edge-label" data-edge-label="prime-range:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1016" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1039">いいえ</text></g></g><g class="flow-edge unknown" data-edge="prime-range:unknown:check"><title>わからない</title><path d="M399.5 928 V940 C399.5 972 447.5 972 447.5 1004 V1016"/><path d="M447.5 1054 V1066 C447.5 1098 487.429 1098 487.429 1130 V1142" marker-end="url(#arrow-tree-increasing-labels-conditions)"/><g class="flow-edge-label" data-edge-label="prime-range:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1016" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1039">わからない</text></g></g><g class="flow-node question" data-node="parent-only"><rect x="384.5" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">固定した木で、親を子より先に選ぶこ</text><text class="node-title" x="400.5" y="103">とだけが順序の制約ですか？</text><text class="node-explanation" x="400.5" y="130">頂点を区別し、選んだ順に1からNまでの異なる番号</text><text class="node-explanation" x="400.5" y="148">を付けます。木の接続済み集合へ隣接頂点を足す順序</text><text class="node-explanation" x="400.5" y="166">とも同じです。</text></g><g class="flow-node question" data-node="all-roots"><rect x="272.5" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="434">質問</text><text class="node-title" x="288.5" y="462">全ての頂点をそれぞれ根とした順序の</text><text class="node-title" x="288.5" y="485">個数が必要ですか？</text><text class="node-explanation" x="288.5" y="512">一つの根で部分木サイズの積を求め、隣へ根を移した</text><text class="node-explanation" x="288.5" y="530">ときに変わる二つのサイズだけで答えを更新します。</text></g><g class="flow-node question" data-node="prime-range"><rect x="159.5" y="778" width="320" height="150" rx="7"/><text class="node-kind" x="175.5" y="798">質問</text><text class="node-title" x="175.5" y="826">答えの法は素数で、その法より頂点数</text><text class="node-title" x="175.5" y="849">Nが小さいですか？</text><text class="node-explanation" x="175.5" y="876">1からNの逆元を使います。法が合成数の場合やNが</text><text class="node-explanation" x="175.5" y="894">法以上の場合、同じ割り算はできません。</text></g><g class="flow-node result" data-node="answer"><rect x="32" y="1142" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1162">候補</text><text class="node-title" x="48" y="1190">部分木サイズの積で一根の答えを求</text><text class="node-title" x="48" y="1213">め、隣接する根の比で移す</text><a href="/flowchartcp/techniques/tree-increasing-label-reroot-ratio/"><title>木で親の番号を子より小さくする割り当ては、部分木サイズの積で数えるの記事へ</title><text x="48" y="1252">木で親の番号を子より小さくする割り当ては、部分</text><text x="48" y="1270">木サイズの積で数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1142" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1162">分野</text><text class="node-title" x="412" y="1190">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1227">詳細の質問・図へ →</text></a></g></svg>