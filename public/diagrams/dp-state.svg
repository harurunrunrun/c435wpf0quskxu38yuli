<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-dp-state flow-desc-dp-state" width="1476" height="961" viewBox="0 0 1476 961" data-flow-svg="dp-state"><title id="flow-title-dp-state">選ぶ数・重さ・残す履歴の解法フローチャート</title><desc id="flow-desc-dp-state">制約に応じた状態の持ち方を選びます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-dp-state" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="check:yes:state"><title>はい</title><path d="M1204 564 V576 C1204 608 920 608 920 640 V652"/><path d="M920 690 V702 C920 734 920 734 920 766 V778" marker-end="url(#arrow-dp-state)"/><g class="flow-edge-label" data-edge-label="check:yes:state" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="675">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 564 V576 C1284 608 1271 608 1271 640 V652"/><path d="M1271 690 V702 C1271 734 1230.667 734 1230.667 766 V778" marker-end="url(#arrow-dp-state)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="652" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="675">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 564 V576 C1364 608 1399.5 608 1399.5 640 V652"/><path d="M1399.5 690 V702 C1399.5 734 1337.333 734 1337.333 766 V778" marker-end="url(#arrow-dp-state)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="652" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="675">わからない</text></g></g><g class="flow-edge item-selections" data-edge="constraint:item-selections:item-selections-route"><title>少数の要素を選ぶ・組や箱に分ける</title><path d="M642 182 V194 C642 226 192 226 192 258 V270"/><path d="M192 308 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-dp-state)"/><g class="flow-edge-label" data-edge-label="constraint:item-selections:item-selections-route" tabindex="0" role="group" aria-label="選択肢：少数の要素を選ぶ・組や箱に分ける"><rect x="76" y="270" width="232" height="38" rx="5"/><text text-anchor="middle" x="192" y="293">少数の要素を選ぶ・組や箱に分ける</text></g></g><g class="flow-edge limited-totals" data-edge="constraint:limited-totals:limited-totals-route"><title>重さ・価値の合計や、品物の使用回数に制限がある</title><path d="M706 182 V194 C706 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-dp-state)"/><g class="flow-edge-label" data-edge-label="constraint:limited-totals:limited-totals-route" tabindex="0" role="group" aria-label="選択肢：重さ・価値の合計や、品物の使用回数に制限がある"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">重さ・価値の合計や、品物の使用回数</text><text text-anchor="middle" x="556" y="311">に制限がある</text></g></g><g class="flow-edge sequential-conditions" data-edge="constraint:sequential-conditions:sequential-conditions-route"><title>整数の桁・連続区間・直前までの履歴が条件にある</title><path d="M770 182 V194 C770 226 920 226 920 258 V270"/><path d="M920 326 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-dp-state)"/><g class="flow-edge-label" data-edge-label="constraint:sequential-conditions:sequential-conditions-route" tabindex="0" role="group" aria-label="選択肢：整数の桁・連続区間・直前までの履歴が条件にある"><rect x="797.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="293">整数の桁・連続区間・直前までの履歴</text><text text-anchor="middle" x="920" y="311">が条件にある</text></g></g><g class="flow-edge unknown" data-edge="constraint:unknown:check"><title>わからない</title><path d="M834 182 V194 C834 226 1284 226 1284 258 V270"/><path d="M1284 308 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-dp-state)"/><g class="flow-edge-label" data-edge-label="constraint:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="293">わからない</text></g></g><g class="flow-node question" data-node="check"><rect x="1124" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="434">質問</text><text class="node-title" x="1140" y="462">二つの履歴について、以後の合法な操</text><text class="node-title" x="1140" y="485">作と追加コストを比較できますか？</text><text class="node-explanation" x="1140" y="512">同じ状態にまとめた履歴が、すべての未来で同じ振る</text><text class="node-explanation" x="1140" y="530">舞いをするかを確かめます。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="778" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="798">分野</text><text class="node-title" x="1140" y="826">条件を確かめる</text><text class="node-explanation" x="1140" y="853">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="881">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="state"><rect x="760" y="778" width="320" height="151" rx="7"/><text class="node-kind" x="776" y="798">候補</text><text class="node-title" x="776" y="826">必要な履歴だけを残す</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="776" y="865">状態の設計</text></a><a href="/flowchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="776" y="889">対称性</text></a></g><g class="flow-node question" data-node="constraint"><rect x="578" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="594" y="52">質問</text><text class="node-title" x="594" y="80">列挙を減らす手掛かりになる制約はど</text><text class="node-title" x="594" y="103">れですか？</text><text class="node-explanation" x="594" y="130">小さい量を添字にするか、必要な履歴へ絞るかを選び</text><text class="node-explanation" x="594" y="148">ます。</text></g><g class="flow-node route" data-node="item-selections-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">少数の要素の選び方・分け方</text><a href="/flowchartcp/flowcharts/#diagram-dp-item-selections" data-route="dp-item-selections"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="limited-totals-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">重さ・価値の合計と使用回数</text><a href="/flowchartcp/flowcharts/#diagram-dp-limited-totals" data-route="dp-limited-totals"><text x="412" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="sequential-conditions-route"><rect x="760" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="434">分野</text><text class="node-title" x="776" y="462">整数・連続区間と、残す履歴</text><a href="/flowchartcp/flowcharts/#diagram-dp-sequential-conditions" data-route="dp-sequential-conditions"><text x="776" y="499">詳細の質問・図へ →</text></a></g></svg>