edge-label" data-edge-label="independent-arrivals:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="698" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="721">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 997 V1009 C239.5 1041 192 1041 192 1073 V1085"/><path d="M192 1123 V1135 C192 1167 192 1167 192 1199 V1211" marker-end="url(#arrow-circle-timed-arrivals-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1085" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1108">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 997 V1009 C319.5 1041 319 1041 319 1073 V1085"/><path d="M319 1123 V1135 C319 1167 441.714 1167 441.714 1199 V1211" marker-end="url(#arrow-circle-timed-arrivals-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1085" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1108">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 997 V1009 C399.5 1041 447.5 1041 447.5 1073 V1085"/><path d="M447.5 1123 V1135 C447.5 1167 487.429 1167 487.429 1199 V1211" marker-end="url(#arrow-circle-timed-arrivals-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1085" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1108">わからない</text></g></g><g class="flow-node question" data-node="same-speed-circle"><rect x="384.5" y="32" width="320" height="191" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">全員が同じ向きへ秒速1で歩き、対象</text><text class="node-title" x="400.5" y="103">は最初に一つあり、取得からC秒後に</text><text class="node-title" x="400.5" y="126">再生しますか？</text><text class="node-explanation" x="400.5" y="153">位置と時刻は整数です。再生ちょうどの到着も取得で</text><text class="node-explanation" x="400.5" y="171">き、位置にC%Lを使っても経過時間のCは残しま</text><text class="node-explanation" x="400.5" y="189">す。</text></g><g class="flow-node question" data-node="independent-arrivals"><rect x="272.5" y="437" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="457">質問</text><text class="node-title" x="288.5" y="485">取得しても歩行は変わらず、対象どう</text><text class="node-title" x="288.5" y="508">しは独立で、指定した人の時刻Tまで</text><text class="node-title" x="288.5" y="531">の取得数を求めますか？</text><text class="node-explanation" x="288.5" y="558">Tちょうどの取得も含めます。別々の対象の収穫は、</text><text class="node-explanation" x="288.5" y="576">ほかの対象の再生や動きを変えません。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="824" width="320" height="173" rx="7"/><text class="node-kind" x="175.5" y="844">質問</text><text class="node-title" x="175.5" y="872">人・対象・質問は各20万以下、円周</text><text class="node-title" x="175.5" y="895">長とCは1..10^9、Tは0..</text><text class="node-title" x="175.5" y="918">10^18ですか？</text><text class="node-explanation" x="175.5" y="945">人と対象は各1個以上で、初期位置は全て相異なる昇</text><text class="node-explanation" x="175.5" y="963">順の整数です。質問0件・時刻0も扱います。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1211" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1231">候補</text><text class="node-title" x="48" y="1259">人を止める座標へ移し、次の取得者と</text><text class="node-title" x="48" y="1282">正の経過時間で閉路の到着を数える</text><a href="/flowchartcp/techniques/functional-graph-timed-arrivals-offline/"><title>行き先が一つの移動で、複数の始点からの累積到着を数えるの記事へ</title><text x="48" y="1321">行き先が一つの移動で、複数の始点からの累積到着</text><text x="48" y="1339">を数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1211" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1231">分野</text><text class="node-title" x="412" y="1259">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1296">詳細の質問・図へ →</text></a></g></svg>