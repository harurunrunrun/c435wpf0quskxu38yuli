<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-tree-marked-vertex-goals flow-desc-tree-marked-vertex-goals" width="1476" height="585" viewBox="0 0 1476 585" data-flow-svg="tree-marked-vertex-goals"><title id="flow-title-tree-marked-vertex-goals">指定頂点と印のある頂点の解法フローチャート</title><desc id="flow-desc-tree-marked-vertex-goals">少数の頂点だけを指定する場合、印を追加する場合、印同士を分離する場合を分けます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-tree-marked-vertex-goals" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge marked" data-edge="target:marked:marked"><title>少数の指定頂点だけが重要</title><path d="M642 141 V153 C642 185 192 185 192 217 V229"/><path d="M192 267 V297 C192 329 192 329 192 361 V373" marker-end="url(#arrow-tree-marked-vertex-goals)"/><g class="flow-edge-label" data-edge-label="target:marked:marked" tabindex="0" role="group" aria-label="選択肢：少数の指定頂点だけが重要"><rect x="102" y="229" width="180" height="38" rx="5"/><text text-anchor="middle" x="192" y="252">少数の指定頂点だけが重要</text></g></g><g class="flow-edge nearest-marked" data-edge="target:nearest-marked:nearest-mark-route"><title>印を追加しながら、指定頂点から最寄りの印までの距離</title><path d="M706 141 V153 C706 185 556 185 556 217 V229"/><path d="M556 285 V297 C556 329 556 329 556 361 V373" marker-end="url(#arrow-tree-marked-vertex-goals)"/><g class="flow-edge-label" data-edge-label="target:nearest-marked:nearest-mark-route" tabindex="0" role="group" aria-label="選択肢：印を追加しながら、指定頂点から最寄りの印までの距離"><rect x="433.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="252">印を追加しながら、指定頂点から最寄</text><text text-anchor="middle" x="556" y="270">りの印までの距離</text></g></g><g class="flow-edge marked-separation" data-edge="target:marked-separation:marked-separation-route"><title>指定された印頂点を、未印頂点の最少削除で互いに分離する</title><path d="M770 141 V153 C770 185 920 185 920 217 V229"/><path d="M920 285 V297 C920 329 920 329 920 361 V373" marker-end="url(#arrow-tree-marked-vertex-goals)"/><g class="flow-edge-label" data-edge-label="target:marked-separation:marked-separation-route" tabindex="0" role="group" aria-label="選択肢：指定された印頂点を、未印頂点の最少削除で互いに分離する"><rect x="797.5" y="229" width="245" height="56" rx="5"/><text text-anchor="middle" x="920" y="252">指定された印頂点を、未印頂点の最少</text><text text-anchor="middle" x="920" y="270">削除で互いに分離する</text></g></g><g class="flow-edge unknown" data-edge="target:unknown:check"><title>わからない</title><path d="M834 141 V153 C834 185 1284 185 1284 217 V229"/><path d="M1284 267 V297 C1284 329 1284 329 1284 361 V373" marker-end="url(#arrow-tree-marked-vertex-goals)"/><g class="flow-edge-label" data-edge-label="target:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="229" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="252">わからない</text></g></g><g class="flow-node question" data-node="target"><rect x="578" y="32" width="320" height="109" rx="7"/><text class="node-kind" x="594" y="52">質問</text><text class="node-title" x="594" y="80">木のどの部分について答えますか？</text><text class="node-explanation" x="594" y="107">根、値が付く場所、対象の頂点の範囲を選びます。</text></g><g class="flow-node route" data-node="marked"><rect x="32" y="373" width="320" height="157" rx="7"/><text class="node-kind" x="48" y="393">分野</text><text class="node-title" x="48" y="421">少数の指定頂点と距離の集計</text><text class="node-explanation" x="48" y="448">一度に指定する頂点数と、距離や部分木について求め</text><text class="node-explanation" x="48" y="466">る情報を確認します。</text><a href="/flowchartcp/flowcharts/#diagram-tree-specified-vertices" data-route="tree-specified-vertices"><text x="48" y="494">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="nearest-mark-route"><rect x="396" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="393">分野</text><text class="node-title" x="412" y="421">印が増える木の最寄り距離</text><a href="/flowchartcp/flowcharts/#diagram-tree-nearest-marked" data-route="tree-nearest-marked"><text x="412" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="marked-separation-route"><rect x="760" y="373" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="393">分野</text><text class="node-title" x="776" y="421">印頂点同士を、頂点削除で分離する</text><a href="/flowchartcp/flowcharts/#diagram-marked-vertex-separation" data-route="marked-vertex-separation"><text x="776" y="458">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="check"><rect x="1124" y="373" width="320" height="180" rx="7"/><text class="node-kind" x="1140" y="393">分野</text><text class="node-title" x="1140" y="421">問い合わせで対象となる頂点を確かめ</text><text class="node-title" x="1140" y="444">る</text><text class="node-explanation" x="1140" y="471">根を決めて対象を図に描き、祖先・部分木・経路のど</text><text class="node-explanation" x="1140" y="489">れを扱うかを確かめます。</text><a href="/flowchartcp/flowcharts/#diagram-tree-query-target-check" data-route="tree-query-target-check"><text x="1140" y="517">詳細の質問・図へ →</text></a></g></svg>