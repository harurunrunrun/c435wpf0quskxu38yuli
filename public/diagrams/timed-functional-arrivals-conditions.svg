"/><g class="flow-edge-label" data-edge-label="independent-sources:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="680" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="703">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds:yes:result"><title>はい</title><path d="M239.5 997 V1009 C239.5 1041 192 1041 192 1073 V1085"/><path d="M192 1123 V1135 C192 1167 192 1167 192 1199 V1211" marker-end="url(#arrow-timed-functional-arrivals-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1085" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1108">はい</text></g></g><g class="flow-edge no" data-edge="bounds:no:check"><title>いいえ</title><path d="M319.5 997 V1009 C319.5 1041 319 1041 319 1073 V1085"/><path d="M319 1123 V1135 C319 1167 441.714 1167 441.714 1199 V1211" marker-end="url(#arrow-timed-functional-arrivals-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1085" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1108">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds:unknown:check"><title>わからない</title><path d="M399.5 997 V1009 C399.5 1041 447.5 1041 447.5 1073 V1085"/><path d="M447.5 1123 V1135 C447.5 1167 487.429 1167 487.429 1199 V1211" marker-end="url(#arrow-timed-functional-arrivals-conditions)"/><g class="flow-edge-label" data-edge-label="bounds:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1085" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1108">わからない</text></g></g><g class="flow-node question" data-node="one-successor"><rect x="384.5" y="32" width="320" height="173" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">各頂点の次の行き先は一つで、辺を通</text><text class="node-title" x="400.5" y="103">る時間は正の整数として固定されてい</text><text class="node-title" x="400.5" y="126">ますか？</text><text class="node-explanation" x="400.5" y="153">0や負の時間を許すと、有限時刻までの到着が無限に</text><text class="node-explanation" x="400.5" y="171">なる場合があります。</text></g><g class="flow-node question" data-node="independent-sources"><rect x="272.5" y="419" width="320" height="173" rx="7"/><text class="node-kind" x="288.5" y="439">質問</text><text class="node-title" x="288.5" y="467">各個体は指定頂点・開始時刻から独立</text><text class="node-title" x="288.5" y="490">に動き、始点の出現も一回として、指</text><text class="node-title" x="288.5" y="513">定時刻までの到着を数えますか？</text><text class="node-explanation" x="288.5" y="540">同じ始点と時刻の個体も別々に数えます。質問時刻</text><text class="node-explanation" x="288.5" y="558">ちょうどの到着を含みます。</text></g><g class="flow-node question" data-node="bounds"><rect x="159.5" y="806" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="826">質問</text><text class="node-title" x="175.5" y="854">頂点は1〜20万、個体と質問は各</text><text class="node-title" x="175.5" y="877">20万以下、辺時間は1..20億、</text><text class="node-title" x="175.5" y="900">時刻は0..10^18ですか？</text><text class="node-explanation" x="175.5" y="927">答えは64ビットを超えることがあるため128ビッ</text><text class="node-explanation" x="175.5" y="945">トで返します。空の個体列や質問列でも、ほかの入力</text><text class="node-explanation" x="175.5" y="963">条件は検査します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1211" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1231">候補</text><text class="node-title" x="48" y="1259">初回の到着を木の部分木で数え、閉路</text><text class="node-title" x="48" y="1282">の反復を周期の商と余りで足す</text><a href="/flowchartcp/techniques/functional-graph-timed-arrivals-offline/"><title>行き先が一つの移動で、複数の始点からの累積到着を数えるの記事へ</title><text x="48" y="1321">行き先が一つの移動で、複数の始点からの累積到着</text><text x="48" y="1339">を数える</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1211" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1231">分野</text><text class="node-title" x="412" y="1259">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1296">詳細の質問・図へ →</text></a></g></svg>