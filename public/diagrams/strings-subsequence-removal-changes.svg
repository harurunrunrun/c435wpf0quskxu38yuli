<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-strings-subsequence-removal-changes flow-desc-strings-subsequence-removal-changes" width="1476" height="950" viewBox="0 0 1476 950" data-flow-svg="strings-subsequence-removal-changes"><title id="flow-title-strings-subsequence-removal-changes">部分列を残す削除と、部分列を避ける変更の解法フローチャート</title><desc id="flow-desc-strings-subsequence-removal-changes">指定列を残したまま一か所を削除する長さと、指定の部分列を避ける文字変更の最少回数を調べます。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-strings-subsequence-removal-changes" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge delete-gap" data-edge="subsequence-check:delete-gap:gap-route"><title>指定列を部分列として残し、連続する一か所を最長で削除する</title><path d="M642 182 V194 C642 226 192 226 192 258 V270"/><path d="M192 326 V338 C192 370 192 370 192 402 V414" marker-end="url(#arrow-strings-subsequence-removal-changes)"/><g class="flow-edge-label" data-edge-label="subsequence-check:delete-gap:gap-route" tabindex="0" role="group" aria-label="選択肢：指定列を部分列として残し、連続する一か所を最長で削除する"><rect x="69.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="192" y="293">指定列を部分列として残し、連続する</text><text text-anchor="middle" x="192" y="311">一か所を最長で削除する</text></g></g><g class="flow-edge avoid-updates" data-edge="subsequence-check:avoid-updates:avoid-update-route"><title>文字を変更し、指定の部分列が現れないようにする最少置換数</title><path d="M706 182 V194 C706 226 556 226 556 258 V270"/><path d="M556 326 V338 C556 370 556 370 556 402 V414" marker-end="url(#arrow-strings-subsequence-removal-changes)"/><g class="flow-edge-label" data-edge-label="subsequence-check:avoid-updates:avoid-update-route" tabindex="0" role="group" aria-label="選択肢：文字を変更し、指定の部分列が現れないようにする最少置換数"><rect x="433.5" y="270" width="245" height="56" rx="5"/><text text-anchor="middle" x="556" y="293">文字を変更し、指定の部分列が現れな</text><text text-anchor="middle" x="556" y="311">いようにする最少置換数</text></g></g><g class="flow-edge no" data-edge="subsequence-check:no:fallback"><title>その他の部分列の条件</title><path d="M770 182 V194 C770 226 920 226 920 258 V270"/><path d="M920 308 V338 C920 370 920 370 920 402 V414" marker-end="url(#arrow-strings-subsequence-removal-changes)"/><g class="flow-edge-label" data-edge-label="subsequence-check:no:fallback" tabindex="0" role="group" aria-label="選択肢：その他の部分列の条件"><rect x="843" y="270" width="154" height="38" rx="5"/><text text-anchor="middle" x="920" y="293">その他の部分列の条件</text></g></g><g class="flow-edge unknown" data-edge="subsequence-check:unknown:check"><title>わからない</title><path d="M834 182 V194 C834 226 1284 226 1284 258 V270"/><path d="M1284 308 V338 C1284 370 1284 370 1284 402 V414" marker-end="url(#arrow-strings-subsequence-removal-changes)"/><g class="flow-edge-label" data-edge-label="subsequence-check:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1239.5" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="1284" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="check:yes:substring-route"><title>はい</title><path d="M1204 564 V577 C1204 609 920 609 920 641 V653"/><path d="M920 691 V703 C920 735 920 735 920 767 V779" marker-end="url(#arrow-strings-subsequence-removal-changes)"/><g class="flow-edge-label" data-edge-label="check:yes:substring-route" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="880" y="653" width="80" height="38" rx="5"/><text text-anchor="middle" x="920" y="676">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M1284 564 V577 C1284 609 1271 609 1271 641 V653"/><path d="M1271 691 V703 C1271 735 1230.667 735 1230.667 767 V779" marker-end="url(#arrow-strings-subsequence-removal-changes)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="1231" y="653" width="80" height="38" rx="5"/><text text-anchor="middle" x="1271" y="676">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M1364 564 V577 C1364 609 1399.5 609 1399.5 641 V653"/><path d="M1399.5 691 V703 C1399.5 735 1337.333 735 1337.333 767 V779" marker-end="url(#arrow-strings-subsequence-removal-changes)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="1355" y="653" width="89" height="38" rx="5"/><text text-anchor="middle" x="1399.5" y="676">わからない</text></g></g><g class="flow-node question" data-node="subsequence-check"><rect x="578" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="594" y="52">質問</text><text class="node-title" x="594" y="80">削除・文字変更・その他の制約のどれ</text><text class="node-title" x="594" y="103">ですか？</text><text class="node-explanation" x="594" y="130">指定列を残す削除と、指定列が現れないようにする文</text><text class="node-explanation" x="594" y="148">字変更を区別します。</text></g><g class="flow-node question" data-node="check"><rect x="1124" y="414" width="320" height="150" rx="7"/><text class="node-kind" x="1140" y="434">質問</text><text class="node-title" x="1140" y="462">求めているのは、連続した部分文字列</text><text class="node-title" x="1140" y="485">ですか？</text><text class="node-explanation" x="1140" y="512">連続しない部分列なら、添字や最後の文字などを状態</text><text class="node-explanation" x="1140" y="530">にする DP を検討します。</text></g><g class="flow-node route" data-node="uncertain"><rect x="1124" y="779" width="320" height="139" rx="7"/><text class="node-kind" x="1140" y="799">分野</text><text class="node-title" x="1140" y="827">条件を確かめる</text><text class="node-explanation" x="1140" y="854">まだ確認できていない性質を整理します。</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="1140" y="882">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="substring-route"><rect x="760" y="779" width="320" height="121" rx="7"/><text class="node-kind" x="776" y="799">分野</text><text class="node-title" x="776" y="827">部分文字列</text><a href="/flowchartcp/flowcharts/#diagram-string-substring" data-route="string-substring"><text x="776" y="864">詳細の質問・図へ →</text></a></g><g class="flow-node result" data-node="fallback"><rect x="760" y="414" width="320" height="151" rx="7"/><text class="node-kind" x="776" y="434">候補</text><text class="node-title" x="776" y="462">必要な文字列情報を定義する</text><a href="/flowchartcp/techniques/state-design/"><title>状態の設計の記事へ</title><text x="776" y="501">状態の設計</text></a><a href="/flowchartcp/techniques/symmetry/"><title>対称性の記事へ</title><text x="776" y="525">対称性</text></a></g><g class="flow-node route" data-node="gap-route"><rect x="32" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="48" y="434">分野</text><text class="node-title" x="48" y="462">残す部分列と一か所の削除</text><a href="/flowchartcp/flowcharts/#diagram-subsequence-delete-gap" data-route="subsequence-delete-gap"><text x="48" y="499">詳細の質問・図へ →</text></a></g><g class="flow-node route" data-node="avoid-update-route"><rect x="396" y="414" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="434">分野</text><text class="node-title" x="412" y="462">文字変更後の部分列の回避</text><a href="/flowchartcp/flowcharts/#diagram-subsequence-avoid-updates" data-route="subsequence-avoid-updates"><text x="412" y="499">詳細の質問・図へ →</text></a></g></svg>