055 450 1087 V1099"/><path d="M450 1137 V1149 C450 1181 384 1181 384 1213 V1225" marker-end="url(#arrow-vertex-disjoint-pivot)"/><g class="flow-edge-label" data-edge-label="check:yes:fallback" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="410" y="1099" width="80" height="38" rx="5"/><text text-anchor="middle" x="450" y="1122">はい</text></g></g><g class="flow-edge no" data-edge="check:no:uncertain"><title>いいえ</title><path d="M668 969 V1023 C668 1055 655 1055 655 1087 V1099"/><path d="M655 1137 V1149 C655 1181 614.667 1181 614.667 1213 V1225" marker-end="url(#arrow-vertex-disjoint-pivot)"/><g class="flow-edge-label" data-edge-label="check:no:uncertain" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="615" y="1099" width="80" height="38" rx="5"/><text text-anchor="middle" x="655" y="1122">いいえ</text></g></g><g class="flow-edge unknown" data-edge="check:unknown:uncertain"><title>わからない</title><path d="M748 969 V1023 C748 1055 783.5 1055 783.5 1087 V1099"/><path d="M783.5 1137 V1149 C783.5 1181 721.333 1181 721.333 1213 V1225" marker-end="url(#arrow-vertex-disjoint-pivot)"/><g class="flow-edge-label" data-edge-label="check:unknown:uncertain" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="739" y="1099" width="89" height="38" rx="5"/><text text-anchor="middle" x="783.5" y="1122">わからない</text></g></g><g class="flow-node question" data-node="undirected"><rect x="459.7222222222223" y="32" width="320" height="168" rx="7"/><text class="node-kind" x="475.7222222222223" y="52">質問</text><text class="node-title" x="475.7222222222223" y="80">辺は無向で、始点 A・経由点 B・</text><text class="node-title" x="475.7222222222223" y="103">終点 C は相異なりますか？</text><text class="node-explanation" x="475.7222222222223" y="130">B から A と C への二経路へ分けます。無向</text><text class="node-explanation" x="475.7222222222223" y="148">なら、一方を逆順にしてつなげられます。有向では、</text><text class="node-explanation" x="475.7222222222223" y="166">向きの対応を同じようには使えません。</text></g><g class="flow-node question" data-node="sharing"><rect x="260.6666666666667" y="414" width="320" height="191" rx="7"/><text class="node-kind" x="276.6666666666667" y="434">質問</text><text class="node-title" x="276.6666666666667" y="462">求めるのは頂点を繰り返さない経路</text><text class="node-title" x="276.6666666666667" y="485">で、二経路は B 以外の頂点を共有</text><text class="node-title" x="276.6666666666667" y="508">できませんか？</text><text class="node-explanation" x="276.6666666666667" y="535">各頂点の入口と出口を分けて容量一でつなぎます。B</text><text class="node-explanation" x="276.6666666666667" y="553"> のみ容量二にし、A と C へ一本ずつ届けま</text><text class="node-explanation" x="276.6666666666667" y="571">す。</text></g><g class="flow-node result" data-node="pivot-result"><rect x="32" y="819" width="320" height="192" rx="7"/><text class="node-kind" x="48" y="839">候補</text><text class="node-title" x="48" y="867">頂点を入口・出口へ分け、経由点から</text><text class="node-title" x="48" y="890">両端へ二単位届ける</text><a href="/flowchartcp/techniques/vertex-disjoint-through-pivot/"><title>指定頂点を通る単純パスを、頂点を共有しない二本の経路に分けるの記事へ</title><text x="48" y="929">指定頂点を通る単純パスを、頂点を共有しない二本</text><text x="48" y="947">の経路に分ける</text></a><a href="/flowchartcp/techniques/max-flow/"><title>最大流・最小カットの記事へ</title><text x="48" y="971">最大流・最小カット</text></a></g><g class="flow-node question" data-node="check"><rect x="508" y="819" width="320" height="150" rx="7"/><text class="node-kind" x="524" y="839">質問</text><text class="node-title" x="524" y="867">合法な選択と、選ぶ回数・費用の条件</text><text class="node-title" x="524" y="890">を一つずつ確かめられますか？</text><text class="node-explanation" x="524" y="917">一対象を何回使えるか、必ず選ぶ対象があるか、経路</text><text class="node-explanation" x="524" y="935">はどこまで共用できるかを確認します。</text></g><g class="flow-node result" data-node="fallback"><rect x="144" y="1225" width="320" height="151" rx="7"/><text class="node-kind" x="160" y="1245">候補</text><text class="node-title" x="160" y="1273">選択の条件と目的値を整理する</text><a href="/flowchartcp/techniques/graph-reduction/"><title>グラフへの帰着の記事へ</title><text x="160" y="1312">グラフへの帰着</text></a><a href="/flowchartcp/techniques/counterexample/"><title>反例探しの記事へ</title><text x="160" y="1336">反例探し</text></a></g><g class="flow-node route" data-node="uncertain"><rect x="508" y="1225" width="320" height="121" rx="7"/><text class="node-kind" x="524" y="1245">分野</text><text class="node-title" x="524" y="1273">条件を確かめる</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="524" y="1310">詳細の質問・図へ →</text></a></g></svg>