<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flow-title-hidden-spanning-tree-overlap-conditions flow-desc-hidden-spanning-tree-overlap-conditions" width="748" height="1365" viewBox="0 0 748 1365" data-flow-svg="hidden-spanning-tree-overlap-conditions"><title id="flow-title-hidden-spanning-tree-overlap-conditions">全域木との共通辺数から秘密の木を復元の解法フローチャート</title><desc id="flow-desc-hidden-spanning-tree-overlap-conditions">既知グラフの形、質問の合法性と固定された秘密木、質問回数を確認します。 矢印には選択肢を表示しています。候補の適用条件は図の後の一覧でも読めます。</desc><defs><marker id="arrow-hidden-spanning-tree-overlap-conditions" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="context-stroke"/></marker></defs><style>.flow-edge{stroke:#64748b;fill:#475569}.flow-edge>path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.flow-edge.yes{stroke:#148575;fill:#148575}.flow-edge.no{stroke:#8d59b6;fill:#8d59b6}.flow-edge.unknown{stroke:#a5681d;fill:#a5681d}.flow-edge-label rect{fill:var(--flow-node-bg,#fff);stroke:currentColor;stroke-width:1;stroke-opacity:.3}.flow-edge-label text{stroke:none;font-size:13px;font-family:system-ui,sans-serif;font-weight:500}.flow-edge.is-path>path{stroke-width:4}.flow-edge.is-path .flow-edge-label rect{stroke:#148575;stroke-width:2;stroke-opacity:1}.flow-edge.is-path .flow-edge-label text{font-weight:700}svg[data-flow-svg]:has(.flow-edge.is-path) .flow-edge:where(:not(.is-path)){opacity:.38}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge{opacity:.16}svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:hover,svg[data-flow-svg]:has(.flow-edge:hover,.flow-edge:focus-within) .flow-edge:focus-within{opacity:1}.flow-edge:hover>path,.flow-edge:focus-within>path{stroke-width:4}.flow-edge:focus-within .flow-edge-label rect{stroke:#1754a4;stroke-width:2;stroke-opacity:1}.flow-edge-label:focus{outline:none}.flow-node rect{fill:var(--flow-node-bg,#fff);stroke:var(--flow-node-border,#94a3b8);stroke-width:1.5}.flow-node.result rect{fill:var(--flow-result-bg,#f0f8f5);stroke:#148575}.flow-node.route rect{fill:var(--flow-route-bg,#f3f5fc);stroke:#707dba}.flow-node.is-path rect{stroke:#148575;stroke-width:3}.flow-node.is-current rect{stroke:#e19a35;stroke-width:5}.flow-node text{font-family:system-ui,sans-serif;fill:var(--flow-text,#20324c);stroke:none}.flow-node .node-title{font-size:16px;font-weight:600}.flow-node .node-explanation{font-size:12px;fill:var(--flow-muted,#52637a)}.flow-node a text{font-size:12px;fill:var(--flow-link,#086c65);text-decoration:underline}.flow-node a:focus text{outline:2px solid #e19a35}.flow-node .node-kind{font-size:10px;fill:var(--flow-muted,#52637a);letter-spacing:.06em}</style><g class="flow-edge yes" data-edge="known-simple-connected:yes:fixed-tree-overlap"><title>はい</title><path d="M464.5 182 V194 C464.5 226 419 226 419 258 V270"/><path d="M419 308 V320 C419 352 432.5 352 432.5 384 V396" marker-end="url(#arrow-hidden-spanning-tree-overlap-conditions)"/><g class="flow-edge-label" data-edge-label="known-simple-connected:yes:fixed-tree-overlap" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="379" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="419" y="293">はい</text></g></g><g class="flow-edge no" data-edge="known-simple-connected:no:check"><title>いいえ</title><path d="M544.5 182 V194 C544.5 226 543 226 543 258 V270"/><path d="M543 308 V320 C543 352 654 352 654 384 V396 V558 C654 590 654 590 654 622 V634 V684 C654 716 654 716 654 748 V760 V963 C654 995 654 995 654 1027 V1039 V1089 C654 1121 624.571 1121 624.571 1153 V1165" marker-end="url(#arrow-hidden-spanning-tree-overlap-conditions)"/><g class="flow-edge-label" data-edge-label="known-simple-connected:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="503" y="270" width="80" height="38" rx="5"/><text text-anchor="middle" x="543" y="293">いいえ</text></g></g><g class="flow-edge unknown" data-edge="known-simple-connected:unknown:check"><title>わからない</title><path d="M624.5 182 V194 C624.5 226 671.5 226 671.5 258 V270"/><path d="M671.5 308 V320 C671.5 352 710 352 710 384 V396 V558 C710 590 710 590 710 622 V634 V684 C710 716 710 716 710 748 V760 V963 C710 995 710 995 710 1027 V1039 V1089 C710 1121 670.286 1121 670.286 1153 V1165" marker-end="url(#arrow-hidden-spanning-tree-overlap-conditions)"/><g class="flow-edge-label" data-edge-label="known-simple-connected:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="627" y="270" width="89" height="38" rx="5"/><text text-anchor="middle" x="671.5" y="293">わからない</text></g></g><g class="flow-edge yes" data-edge="fixed-tree-overlap:yes:bounds-budget"><title>はい</title><path d="M352.5 546 V558 C352.5 590 307 590 307 622 V634"/><path d="M307 672 V684 C307 716 319.5 716 319.5 748 V760" marker-end="url(#arrow-hidden-spanning-tree-overlap-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-tree-overlap:yes:bounds-budget" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="267" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="307" y="657">はい</text></g></g><g class="flow-edge no" data-edge="fixed-tree-overlap:no:check"><title>いいえ</title><path d="M432.5 546 V558 C432.5 590 431 590 431 622 V634"/><path d="M431 672 V684 C431 716 542 716 542 748 V760 V963 C542 995 542 995 542 1027 V1039 V1089 C542 1121 533.143 1121 533.143 1153 V1165" marker-end="url(#arrow-hidden-spanning-tree-overlap-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-tree-overlap:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="391" y="634" width="80" height="38" rx="5"/><text text-anchor="middle" x="431" y="657">いいえ</text></g></g><g class="flow-edge unknown" data-edge="fixed-tree-overlap:unknown:check"><title>わからない</title><path d="M512.5 546 V558 C512.5 590 559.5 590 559.5 622 V634"/><path d="M559.5 672 V684 C559.5 716 598 716 598 748 V760 V963 C598 995 598 995 598 1027 V1039 V1089 C598 1121 578.857 1121 578.857 1153 V1165" marker-end="url(#arrow-hidden-spanning-tree-overlap-conditions)"/><g class="flow-edge-label" data-edge-label="fixed-tree-overlap:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="515" y="634" width="89" height="38" rx="5"/><text text-anchor="middle" x="559.5" y="657">わからない</text></g></g><g class="flow-edge yes" data-edge="bounds-budget:yes:result"><title>はい</title><path d="M239.5 951 V963 C239.5 995 192 995 192 1027 V1039"/><path d="M192 1077 V1089 C192 1121 192 1121 192 1153 V1165" marker-end="url(#arrow-hidden-spanning-tree-overlap-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-budget:yes:result" tabindex="0" role="group" aria-label="選択肢：はい"><rect x="152" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="192" y="1062">はい</text></g></g><g class="flow-edge no" data-edge="bounds-budget:no:check"><title>いいえ</title><path d="M319.5 951 V963 C319.5 995 319 995 319 1027 V1039"/><path d="M319 1077 V1089 C319 1121 441.714 1121 441.714 1153 V1165" marker-end="url(#arrow-hidden-spanning-tree-overlap-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-budget:no:check" tabindex="0" role="group" aria-label="選択肢：いいえ"><rect x="279" y="1039" width="80" height="38" rx="5"/><text text-anchor="middle" x="319" y="1062">いいえ</text></g></g><g class="flow-edge unknown" data-edge="bounds-budget:unknown:check"><title>わからない</title><path d="M399.5 951 V963 C399.5 995 447.5 995 447.5 1027 V1039"/><path d="M447.5 1077 V1089 C447.5 1121 487.429 1121 487.429 1153 V1165" marker-end="url(#arrow-hidden-spanning-tree-overlap-conditions)"/><g class="flow-edge-label" data-edge-label="bounds-budget:unknown:check" tabindex="0" role="group" aria-label="選択肢：わからない"><rect x="403" y="1039" width="89" height="38" rx="5"/><text text-anchor="middle" x="447.5" y="1062">わからない</text></g></g><g class="flow-node question" data-node="known-simple-connected"><rect x="384.5" y="32" width="320" height="150" rx="7"/><text class="node-kind" x="400.5" y="52">質問</text><text class="node-title" x="400.5" y="80">全ての辺が分かる単純連結な無向グラ</text><text class="node-title" x="400.5" y="103">フで、秘密もその全域木ですか？</text><text class="node-explanation" x="400.5" y="130">自己ループも平行辺もなく、全ての辺の端点が分かっ</text><text class="node-explanation" x="400.5" y="148">ています。秘密の辺は全頂点を結ぶ一本の木です。</text></g><g class="flow-node question" data-node="fixed-tree-overlap"><rect x="272.5" y="396" width="320" height="150" rx="7"/><text class="node-kind" x="288.5" y="416">質問</text><text class="node-title" x="288.5" y="444">毎回全域木を質問し、一つの固定され</text><text class="node-title" x="288.5" y="467">た秘密木との共通辺数が返りますか？</text><text class="node-explanation" x="288.5" y="494">質問も必ず全域木です。任意の辺集合は直接聞けない</text><text class="node-explanation" x="288.5" y="512">ため、既知の辺で補って合法な質問を作ります。</text></g><g class="flow-node question" data-node="bounds-budget"><rect x="159.5" y="760" width="320" height="191" rx="7"/><text class="node-kind" x="175.5" y="780">質問</text><text class="node-title" x="175.5" y="808">頂点2〜500・辺N−1〜N(N−</text><text class="node-title" x="175.5" y="831">1)/2で、8000回以内に秘密木</text><text class="node-title" x="175.5" y="854">を特定しますか？</text><text class="node-explanation" x="175.5" y="881">一回に渡すのは頂点数より一本少ない辺です。掲載手</text><text class="node-explanation" x="175.5" y="899">順は最悪でも5990回、総辺番号数2989010</text><text class="node-explanation" x="175.5" y="917">以下で復元します。</text></g><g class="flow-node result" data-node="result"><rect x="32" y="1165" width="320" height="168" rx="7"/><text class="node-kind" x="48" y="1185">候補</text><text class="node-title" x="48" y="1213">基準木の辺を分類して森の本数を聞</text><text class="node-title" x="48" y="1236">き、葉から秘密の木を復元する</text><a href="/flowchartcp/techniques/spanning-tree-overlap-oracle-reference-labeling-leaf-peeling/"><title>全域木との共通辺数への質問から、隠れた木を葉から復元するの記事へ</title><text x="48" y="1275">全域木との共通辺数への質問から、隠れた木を葉か</text><text x="48" y="1293">ら復元する</text></a></g><g class="flow-node route" data-node="check"><rect x="396" y="1165" width="320" height="121" rx="7"/><text class="node-kind" x="412" y="1185">分野</text><text class="node-title" x="412" y="1213">足りない条件を確認する</text><a href="/flowchartcp/flowcharts/#diagram-condition-check" data-route="condition-check"><text x="412" y="1250">詳細の質問・図へ →</text></a></g></svg>